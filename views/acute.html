(haematological emergencies).", "_hay": "hyperviscosity syndrome / leukostasis haematological two emergencies of impaired blood flow: paraprotein hyperviscosity (waldenström macroglobulinaemia or myeloma) and leukostasis (acute leukaemia with a very high blast count). both cause visual, neurological and mucosal or respiratory symptoms; both need urgent reduction of the paraprotein or the blast count. paraprotein hyperviscosity: urgent plasma exchange and treatment of the underlying clone. if symptomatic, do not wait for a viscosity result. leukostasis: urgent cytoreduction with hydroxyurea or leukapheresis, or both, then induction chemotherapy; start tls prophylaxis (hydration plus rasburicase or allopurinol). avoid red cell transfusion until cytoreduced; added red cells raise viscosity and can worsen occlusion. correct thrombocytopenia and coagulopathy. fundoscopy, neurological and respiratory assessment; senior haematology review now."}, {"id": "major-haemorrhage", "name": "Major haemorrhage (incl. massive haemoptysis)", "category": "Haematological", "urgency": "Peri-arrest", "grade": "", "post2016": false, "oneliner": "Uncontrolled or life-threatening bleeding: resuscitate, activate the major-haemorrhage protocol, reverse anticoagulation and achieve definitive source control. In massive haemoptysis, asphyxiation causes death before blood loss does.", "act_now": ["ABC: protect the airway, high-flow oxygen, two large-bore cannulae, crossmatch; activate the major-haemorrhage protocol.", "Transfuse in a fixed ratio (about 1:1:1 red cells, FFP, platelets) until laboratory results guide replacement; give calcium; keep the patient warm; limit crystalloid.", "Reverse anticoagulation by agent (see Manage); tranexamic acid 1 g IV over 10 min, then 1 g over 8 h, in trauma, surgical or obstetric bleeding.", "Definitive source control (surgery, interventional radiology or endoscopy) without delay."], "sections": [{"h": "Recognise", "body": "<p>Haemorrhage that threatens life by volume or by site: haemodynamic instability, continuing visible loss, or bleeding into a critical space (airway, cranium, pericardium). In patients with cancer, suspect tumour erosion of a vessel, thrombocytopenia, DIC or anticoagulant effect. Massive haemoptysis (large volume, or any volume that impairs gas exchange) is first an airway emergency; a small amount of blood can fill the airways and cause asphyxiation.</p>"}, {"h": "Confirm", "body": "<p>FBC, coagulation screen with fibrinogen, group and save or crossmatch, U&amp;E, calcium, lactate and a blood gas; drug history for anticoagulants and antiplatelets, with time of last dose. Find the source by imaging or endoscopy as the patient's condition allows; for haemoptysis, CT angiography and bronchoscopy identify the bleeding side. Resuscitation and investigation run at the same time.</p>"}, {"h": "Manage", "body": "<ul><li>Resuscitation: major-haemorrhage protocol with fixed-ratio products (about 1:1:1), then laboratory-guided replacement (fibrinogen, platelets, coagulation) as results return; ionised calcium replacement; active warming; permissive hypotension until source control where appropriate.</li><li>Reversal of anticoagulation by agent. Warfarin: IV vitamin K and four-factor prothrombin complex concentrate. Dabigatran: idarucizumab. Factor Xa inhibitors (apixaban, rivaroxaban, edoxaban): andexanet alfa, or 4-factor PCC where it is not available. Heparin: protamine. Platelets for a bleeding patient with thrombocytopenia or on antiplatelet treatment.</li><li>Tranexamic acid: 1 g IV over 10 min, then 1 g over 8 h. Benefit is established in trauma (give within 3 h) and in surgical and obstetric haemorrhage. Not for GI bleeding (no mortality benefit, more VTE).</li><li>Massive haemoptysis: protect the airway (early intubation if blood is filling the airway); position bleeding side down to protect the other lung; consider selective intubation of the non-bleeding lung; urgent bronchoscopy to localise and tamponade. Bronchial artery embolisation is first line for control; surgery if refractory.</li><li>Source control is the priority throughout: surgery, IR embolisation or endoscopic therapy. Blood products support the patient until the source is controlled; they do not treat it.</li></ul>"}, {"h": "Disposition & escalation", "body": "<p>Call the resuscitation or major-haemorrhage team, the transfusion laboratory, and the relevant proceduralist (surgery, IR, endoscopy, thoracic surgery) at the same time. ICU or theatre for continuing instability. Monitor coagulation and calcium throughout resuscitation; correct hypothermia and acidosis, which sustain bleeding.</p>"}, {"h": "Pitfalls", "body": "<ul><li>Resuscitating with crystalloid instead of blood products; this dilutes clotting factors and worsens coagulopathy.</li><li>Routine tranexamic acid in GI bleeding (HALT-IT: no benefit, more thrombosis).</li><li>Missing the anticoagulant; always take the drug and last-dose history and give specific reversal.</li><li>Treating massive haemoptysis as a lung problem before it is treated as an airway problem; secure the airway and position the patient first.</li><li>Allowing hypothermia, acidosis and hypocalcaemia to develop during large-volume transfusion.</li></ul>"}], "related": "", "sources": "Transfusion ratio: Holcomb JB et al, PROPPR, <em>JAMA</em> 2015;313:471–482 (PMID 25647203). Tranexamic acid in trauma: CRASH-2, <em>Lancet</em> 2010;376:23–32 (PMID 20554319); GI-bleed caveat: HALT-IT, <em>Lancet</em> 2020;395:1927–1936 (PMID 32563378). Anticoagulant reversal: ISTH SSC guidance, <em>J Thromb Haemost</em> 2024 (PMID 39029742) — idarucizumab (RE-VERSE AD, PMID 28693366) and andexanet alfa (ANNEXA-4, PMID 30730782). Massive haemoptysis: Davidson K &amp; Shojaee S, 'Managing Massive Hemoptysis,' <em>Chest</em> 2020 (PMID 31374211). ESMO Handbook ch. 23 (bleeding) &amp; ch. 15 (haemoptysis).", "_hay": "major haemorrhage (incl. massive haemoptysis) haematological uncontrolled or life-threatening bleeding: resuscitate, activate the major-haemorrhage protocol, reverse anticoagulation and achieve definitive source control. in massive haemoptysis, asphyxiation causes death before blood loss does. abc: protect the airway, high-flow oxygen, two large-bore cannulae, crossmatch; activate the major-haemorrhage protocol. transfuse in a fixed ratio (about 1:1:1 red cells, ffp, platelets) until laboratory results guide replacement; give calcium; keep the patient warm; limit crystalloid. reverse anticoagulation by agent (see manage); tranexamic acid 1 g iv over 10 min, then 1 g over 8 h, in trauma, surgical or obstetric bleeding. definitive source control (surgery, interventional radiology or endoscopy) without delay."}, {"id": "cancer-vte", "name": "Acute cancer-associated VTE / pulmonary embolism", "category": "Vascular", "urgency": "High", "grade": "", "post2016": false, "oneliner": "Cancer-associated DVT or PE. Risk of recurrence and risk of bleeding are both high; choice of agent depends on tumour site and bleeding risk.", "act_now": ["Anticoagulate: weight-based LMWH, or a DOAC (apixaban, rivaroxaban, or edoxaban; edoxaban only after ≥5 days of LMWH).", "Haemodynamically unstable (high-risk) PE: systemic thrombolysis unless contraindicated; bleeding risk is higher in cancer.", "Before choosing an agent, consider a GI or GU primary and the bleeding risk; check platelets and renal function.", "For thrombocytopenia, dose-reduce or hold rather than stop."], "sections": [{"h": "Recognise", "body": "<p>New dyspnoea, pleuritic pain, unilateral leg swelling, unexplained tachycardia, hypoxia or syncope in a patient with cancer. Incidental PE on staging CT is treated. High-risk (massive) PE = obstructive shock or hypotension.</p>"}, {"h": "Confirm", "body": "<p>CTPA for PE, compression ultrasound for DVT. ECG, troponin and echo (RV strain) identify high-risk PE. FBC, renal function and baseline coagulation guide agent and dose.</p>"}, {"h": "Manage", "body": "<p>Anticoagulate for at least 6 months while the cancer is active. Options:</p><ul><li>LMWH (for example dalteparin 200 IU/kg once daily for 1 month, then 150 IU/kg once daily): the long-standing standard, and preferred in luminal GI or GU cancer or high bleeding risk.</li><li>Apixaban 10 mg twice daily for 7 days, then 5 mg twice daily. CARAVAGGIO: recurrent VTE 5.6% vs 7.9% with dalteparin (HR 0.63; 95% CI 0.37–1.07); major bleeding 3.8% vs 4.0% (HR 0.82; 0.40–1.69).</li><li>Edoxaban 60 mg once daily after ≥5 days of LMWH. Hokusai-VTE Cancer: recurrent VTE or major bleeding 12.8% vs 13.5% (HR 0.97; 0.70–1.36); less recurrent VTE (7.9% vs 11.3%) but more major bleeding (6.9% vs 4.0%; risk difference 2.9 percentage points, 0.1–5.6), mostly upper GI bleeding in patients with GI cancer.</li><li>Rivaroxaban 15 mg twice daily for 3 weeks, then 20 mg once daily. SELECT-D: VTE recurrence at 6 months 4% vs 11% (HR 0.43; 0.19–0.99), but more clinically relevant non-major bleeding (13% vs 4%; HR 3.76; 1.63–8.69).</li></ul><p>High-risk (massive) PE: systemic thrombolysis for haemodynamic instability; catheter-directed therapy or embolectomy where thrombolysis is contraindicated. Cancer increases bleeding risk with any of these options.</p><p>Thrombocytopenia: reduce or hold the dose rather than stop; guideline platelet thresholds are about 25–50 ×10⁹/L. Follow local protocol.</p>"}, {"h": "Disposition & escalation", "body": "<p>High-risk PE: HDU or ICU on a thrombolysis pathway. Recurrent VTE on anticoagulation: increase the LMWH dose. Use an IVC filter only for a true, continuing contraindication to anticoagulation, and retrieve it when possible.</p>"}, {"h": "Pitfalls", "body": "<ul><li>DOACs in luminal GI or GU cancer: more GI and GU bleeding (Hokusai, SELECT-D); prefer apixaban or LMWH.</li><li>Treating incidental PE as benign; recurrence risk is similar, so it is anticoagulated.</li><li>Using an IVC filter instead of anticoagulation.</li><li>Stopping anticoagulation for mild thrombocytopenia instead of adjusting the dose.</li></ul>"}], "related": "Related: DIC and major haemorrhage (this module) for the bleeding patient who also needs anticoagulation.", "sources": "Agnelli et al, <em>CARAVAGGIO</em>, <em>NEJM</em> 2020;382:1599 · Raskob et al, <em>Hokusai-VTE Cancer</em>, <em>NEJM</em> 2018;378:615 · Young et al, <em>SELECT-D</em>, <em>JCO</em> 2018;36:2017 · Farge et al, ITAC 2022, <em>Lancet Oncol</em> 2022;23:e334 · Key et al, ASCO VTE guideline update, <em>JCO</em> 2020. ESMO Handbook ch. 2 (Venous Thromboembolism in Cancer Patients).", "_hay": "acute cancer-associated vte / pulmonary embolism vascular cancer-associated dvt or pe. risk of recurrence and risk of bleeding are both high; choice of agent depends on tumour site and bleeding risk. anticoagulate: weight-based lmwh, or a doac (apixaban, rivaroxaban, or edoxaban; edoxaban only after ≥5 days of lmwh). haemodynamically unstable (high-risk) pe: systemic thrombolysis unless contraindicated; bleeding risk is higher in cancer. before choosing an agent, consider a gi or gu primary and the bleeding risk; check platelets and renal function. for thrombocytopenia, dose-reduce or hold rather than stop."}, {"id": "crs", "name": "Cytokine release syndrome", "category": "Treatment-related", "urgency": "High", "grade": "ASTCT 1–4", "post2016": true, "oneliner": "Excessive cytokine release after CAR-T or T-cell-engaging bispecific antibodies; fever with or without hypotension or hypoxia, usually within days of infusion.", "act_now": ["Recognise: fever ≥38 °C after immune-effector-cell therapy. Exclude and treat neutropenic sepsis at the same time.", "Grade by ASTCT (see below).", "Tocilizumab 8 mg/kg IV (max 800 mg) for grade ≥2 (and persistent grade 1).", "Supportive care: fluids for hypotension, O₂; add dexamethasone for tocilizumab-refractory or grade ≥3 CRS; ICU for grade 3–4."], "sections": [{"h": "Recognise", "body": "<p>Onset typically 1–14 days after CAR-T (often day 2–3); can be within hours with bispecifics. Fever is the defining feature, followed by hypotension or hypoxia, or both. Infection can mimic CRS or occur with it; screen and give cover. May occur with ICANS.</p>"}, {"h": "Confirm", "body": "<p>Observations (temperature, BP, SpO₂), sepsis screen (cultures, lactate), FBC, renal and liver tests, CRP and ferritin (for the trend; not specific), coagulation (CRS can cause coagulopathy or HLH). Continuous monitoring.</p>"}, {"h": "Grade: ASTCT 2019", "body": "<ul class='grade'><li><span class='g'>G1</span> fever ≥38 °C (no hypotension, no hypoxia).</li><li><span class='g'>G2</span> fever with hypotension not needing vasopressors, or hypoxia needing low-flow O₂ (≤6 L/min), or both.</li><li><span class='g'>G3</span> fever with hypotension needing one vasopressor (with or without vasopressin), or hypoxia needing high-flow O₂ (&gt;6 L/min), or both.</li><li><span class='g'>G4</span> fever with hypotension needing more than one vasopressor (excluding vasopressin), or hypoxia needing positive-pressure ventilation, or both.</li></ul><p>Fever may settle after antipyretics or tocilizumab; grade on hypotension and hypoxia from then on.</p>"}, {"h": "Manage by grade", "body": "<ul><li>G1: supportive care, antipyretics, fluids; empirical antibiotics if neutropenic; tocilizumab if fever persists.</li><li>G2: tocilizumab 8 mg/kg IV (max 800 mg), repeated every 8 h if needed (≤3 doses in 24 h, ≤4 in total); fluid boluses; O₂; add dexamethasone 10 mg IV if the response is inadequate.</li><li>G3: tocilizumab and dexamethasone 10 mg IV every 6 h; vasopressor; ICU.</li><li>G4: tocilizumab and high-dose methylprednisolone (1 g/day); ICU, more than one vasopressor or ventilation; anakinra or another anti-cytokine agent for refractory CRS.</li></ul>"}, {"h": "Disposition & escalation", "body": "<p>G1–2: monitored ward or HDU according to protocol; G3–4: ICU. Notify the cellular-therapy team and follow the product and institutional protocol. Watch for ICANS and for HLH or MAS.</p>"}, {"h": "Pitfalls", "body": "<ul><li>Missing neutropenic sepsis as a cause of the fever (treat both).</li><li>Withholding tocilizumab in CRS with hypotension.</li><li>Withholding steroids when indicated; at recommended doses they do not appear to reduce CAR-T efficacy.</li><li>Using tocilizumab for ICANS; it penetrates the CNS poorly. Use steroids for ICANS.</li></ul>"}], "related": "Related: ICANS (this module); steroid doses by grade overlap the immunotherapy toxicity guidance in Tox.", "sources": "Lee DW et al, ASTCT (ASBMT) consensus, <em>Biol Blood Marrow Transplant</em> 2019;25:625–638 · Santomasso et al, ASCO guideline, <em>JCO</em> 2021 · NCCN Management of Immunotherapy-Related Toxicities. Post-2016 — not in the ESMO Handbook.", "_hay": "cytokine release syndrome treatment-related excessive cytokine release after car-t or t-cell-engaging bispecific antibodies; fever with or without hypotension or hypoxia, usually within days of infusion. recognise: fever ≥38 °c after immune-effector-cell therapy. exclude and treat neutropenic sepsis at the same time. grade by astct (see below). tocilizumab 8 mg/kg iv (max 800 mg) for grade ≥2 (and persistent grade 1). supportive care: fluids for hypotension, o₂; add dexamethasone for tocilizumab-refractory or grade ≥3 crs; icu for grade 3–4."}, {"id": "hypersensitivity", "name": "Anaphylaxis, hypersensitivity & infusion reactions", "category": "Treatment-related", "urgency": "Peri-arrest", "grade": "", "post2016": false, "oneliner": "Acute reaction during or shortly after a systemic anticancer drug, from a mild infusion reaction to airway or circulatory collapse. Treat as anaphylaxis as soon as airway, breathing or circulation is threatened.", "act_now": ["Stop the infusion; keep IV access; call for help.", "Anaphylaxis: adrenaline 500 µg IM (0.5 mL of 1:1000) into the anterolateral thigh; repeat every 5 min if no improvement.", "Airway and high-flow O₂; lie flat with legs raised (sit up if breathing is the main problem); IV crystalloid bolus for hypotension.", "Antihistamine and corticosteroid are adjuncts, given after adrenaline and never instead of it."], "sections": [{"h": "Recognise", "body": "<p>Anaphylaxis = acute onset of a life-threatening airway problem (swelling, stridor, hoarseness), breathing problem (wheeze, hypoxia) or circulation problem (hypotension, collapse), usually with skin changes (urticaria, angio-oedema). Skin signs are absent in up to a fifth of cases, so their absence does not exclude it.</p><p>The mechanism determines management of later cycles:</p><ul><li>Standard infusion-related reaction (monoclonal antibodies such as rituximab and cetuximab; often the first infusion): fever, chills, flushing, rigors, back pain, mild dyspnoea from cytokine release. Usually settles with stopping or slowing the infusion and premedication.</li><li>Hypersensitivity: taxanes (often at the first exposure, a reaction to the Cremophor or polysorbate vehicle) and platinums. Platinum hypersensitivity is IgE-mediated and typically appears after several cycles (usually the 6th or later carboplatin exposure), once the patient is sensitised.</li></ul><p>Cetuximab reactions at first exposure can be IgE-mediated (anti-α-gal antibodies) and severe.</p>"}, {"h": "Confirm", "body": "<p>The diagnosis is clinical; do not delay adrenaline for tests. Continuous monitoring (BP, SpO₂, ECG). Serial mast-cell tryptase (as soon as safe, at about 1–2 h, and a baseline at ≥24 h) supports a later diagnosis of anaphylaxis but does not guide acute treatment. Record the drug, cycle number and timing for the allergy and immunology referral.</p>"}, {"h": "Manage", "body": "<ul><li>Adrenaline is the only first-line drug: 500 µg IM (0.5 mL of 1:1000) into the anterolateral thigh, repeated every 5 min until response. IV adrenaline (titrated, for example 50 µg boluses) is for refractory shock in a monitored setting, given by staff trained to use it; give IM first.</li><li>Airway and breathing: high-flow O₂, nebulised salbutamol for bronchospasm, nebulised adrenaline for upper-airway oedema; call anaesthetics early for a threatened airway.</li><li>Circulation: lie flat with legs raised; rapid IV crystalloid bolus (500–1000 mL, repeat as needed); for refractory hypotension, critical care for an adrenaline infusion with or without other vasopressors.</li><li>Adjuncts (second line, after adrenaline): a non-sedating antihistamine and a corticosteroid. They treat the skin features and may reduce a biphasic reaction, but neither is life-saving and neither replaces adrenaline.</li><li>Standard infusion reaction (not anaphylaxis): stop and treat symptoms; once settled, restart at a slower rate with premedication.</li></ul>"}, {"h": "Grade", "body": "<p>No single oncology scale guides acute treatment; any threat to airway, breathing or circulation starts the anaphylaxis pathway. Afterwards, infusion reactions are graded by CTCAE and hypersensitivity severity by the Ring and Messmer or Brown grades; these inform rechallenge planning, not resuscitation.</p>"}, {"h": "Disposition & escalation", "body": "<p>After anaphylaxis, observe for a biphasic reaction: 6–12 h after a severe or refractory reaction, ≥2 h after one that resolved quickly. Monitored bed or HDU if adrenaline was repeated or shock occurred. Refer to allergy and immunology before the next cycle.</p><p>Later cycles depend on the mechanism. Mild infusion reaction: premedicate and slow the rate. Confirmed IgE hypersensitivity to a drug that remains the best treatment (platinum, taxane): formal graded desensitisation in a monitored setting, not simple rechallenge. Desensitisation gives temporary tolerance only and must be repeated at each cycle.</p>"}, {"h": "Pitfalls", "body": "<ul><li>Giving antihistamine or steroid first and delaying adrenaline; the most common fatal error in anaphylaxis.</li><li>Giving adrenaline IV or subcutaneously by default; IM into the thigh is the standard route.</li><li>Sitting or standing a hypotensive patient; this can cause fatal circulatory collapse. Keep the patient flat.</li><li>Managing true platinum hypersensitivity by slowing the rate; the reaction worsens on rechallenge and needs desensitisation.</li></ul>"}], "related": "", "sources": "Resuscitation Council UK Guidelines for the emergency treatment of anaphylaxis (Whitaker et al, <em>Resuscitation</em> 2021) · WAO anaphylaxis guidance · oncology hypersensitivity / desensitisation literature (Castells). ESMO Handbook ch. on hypersensitivity / infusion reactions.", "_hay": "anaphylaxis, hypersensitivity & infusion reactions treatment-related acute reaction during or shortly after a systemic anticancer drug, from a mild infusion reaction to airway or circulatory collapse. treat as anaphylaxis as soon as airway, breathing or circulation is threatened. stop the infusion; keep iv access; call for help. anaphylaxis: adrenaline 500 µg im (0.5 ml of 1:1000) into the anterolateral thigh; repeat every 5 min if no improvement. airway and high-flow o₂; lie flat with legs raised (sit up if breathing is the main problem); iv crystalloid bolus for hypotension. antihistamine and corticosteroid are adjuncts, given after adrenaline and never instead of it."}, {"id": "extravasation", "name": "Vesicant chemotherapy extravasation", "category": "Treatment-related", "urgency": "Urgent", "grade": "Grade by vesicant", "post2016": false, "oneliner": "Leak of a vesicant from the vein into surrounding tissue: pain, swelling, burning or loss of blood return at the cannula. Anthracyclines and vinca alkaloids can cause progressive necrosis if managed wrongly.", "act_now": ["Stop the infusion immediately; leave the cannula in place for now.", "Disconnect and aspirate residual drug through the cannula, then remove it.", "Elevate the limb; mark and photograph the area; do not flush or apply pressure.", "Identify the drug. Anthracycline: cold pack and dexrazoxane. Vinca alkaloid: warm pack and hyaluronidase."], "sections": [{"h": "Recognise", "body": "<p>Suspect extravasation with any burning or stinging pain, swelling, erythema, induration or loss of blood return during a vesicant infusion; symptoms may be subtle and can be hidden with a central line. Vesicants (tissue necrosis): anthracyclines (doxorubicin, epirubicin, daunorubicin), vinca alkaloids (vincristine, vinblastine, vinorelbine), and others (mitomycin C, dactinomycin, trabectedin). Irritants (inflammation without necrosis): platinums, taxanes, etoposide; lower risk, but still stop and assess.</p>"}, {"h": "Confirm", "body": "<p>The diagnosis is clinical. Record the drug, estimated volume, cannula site and time; outline the affected area and photograph it for comparison over time. Early plastic or surgical review for a large-volume anthracycline extravasation or any blistering or necrosis.</p>"}, {"h": "Manage", "body": "<p>All vesicants: stop, disconnect, aspirate residual drug through the cannula while it is still in place, then remove it; elevate; do not flush the line or apply direct pressure.</p><ul><li>Anthracyclines: cold and dexrazoxane. Intermittent cold packs (about 20 min, several times daily) cause vasoconstriction and keep the drug localised; do not use warmth. Dexrazoxane IV for significant extravasation: 1000 mg/m² on day 1, 1000 mg/m² on day 2, 500 mg/m² on day 3 (cap at BSA 2 m²; reduce by 50% if CrCl &lt;40 mL/min). First dose within 6 h, then at the same time each day, into a different limb. Remove the cold pack 15 min before and during the dexrazoxane infusion (vasoconstriction reduces delivery). Topical DMSO is an alternative where dexrazoxane is not available; do not combine it with dexrazoxane.</li><li>Vinca alkaloids: warmth and hyaluronidase. Intermittent warm compresses disperse and dilute the drug (the opposite of anthracyclines), plus hyaluronidase 150–1500 U SC around the site to aid dispersion. Cold is contraindicated.</li><li>Mitomycin C and mitoxantrone: topical DMSO to the area, left to air-dry, repeated over several days.</li></ul>"}, {"h": "Grade", "body": "<p>There is no single severity scale. Management depends on the drug class (vesicant or irritant, and which vesicant), which decides compress temperature and antidote. Severity is then judged clinically from tissue changes over the following days: erythema, then blistering, then ulceration or necrosis.</p>"}, {"h": "Disposition & escalation", "body": "<p>Surgical or plastic surgery referral for blistering, increasing pain, ulceration, or any large anthracycline extravasation despite dexrazoxane; debridement or reconstruction may be needed. Document fully, inform the treating team and complete an incident report; review with pharmacy before the next cycle (line choice, route of administration).</p>"}, {"h": "Pitfalls", "body": "<ul><li>Using the wrong temperature; cold for vinca alkaloids or warmth for anthracyclines worsens the injury. Anthracycline: cold. Vinca alkaloid: warm.</li><li>Missing the 6-hour dexrazoxane window, or leaving the cold pack on during the infusion.</li><li>Flushing the line or applying pressure; both spread the vesicant.</li><li>Under-treating a central-line extravasation because the early signs are hidden.</li></ul>"}], "related": "", "sources": "Pérez Fidalgo et al, ESMO-EONS Clinical Practice Guidelines, <em>Ann Oncol</em> 2012;23(Suppl 7):vii167 · Mouridsen et al (Savene TT01/TT02), <em>Ann Oncol</em> 2007;18:546 · Savene (dexrazoxane) EMA SmPC · ONS/ASCO extravasation guideline 2025. ESMO Handbook ch. on extravasation.", "_hay": "vesicant chemotherapy extravasation treatment-related leak of a vesicant from the vein into surrounding tissue: pain, swelling, burning or loss of blood return at the cannula. anthracyclines and vinca alkaloids can cause progressive necrosis if managed wrongly. stop the infusion immediately; leave the cannula in place for now. disconnect and aspirate residual drug through the cannula, then remove it. elevate the limb; mark and photograph the area; do not flush or apply pressure. identify the drug. anthracycline: cold pack and dexrazoxane. vinca alkaloid: warm pack and hyaluronidase."}, {"id": "icans", "name": "ICANS (immune effector cell-associated neurotoxicity)", "category": "Treatment-related", "urgency": "High", "grade": "ASTCT 1–4", "post2016": true, "oneliner": "Neurotoxicity after CAR-T or T-cell-engaging therapy: tremor, dysgraphia, expressive aphasia, reduced consciousness, seizures. Usually follows or overlaps CRS, days after infusion.", "act_now": ["Recognise: new tremor, word-finding difficulty or drowsiness after immune-effector-cell therapy. Expressive aphasia is the most specific early sign.", "Calculate the ICE score (0–10) and assign the ASTCT grade (see below).", "Corticosteroids are first line: dexamethasone, dose by grade; levetiracetam for seizure prophylaxis and treatment.", "Tocilizumab does not treat ICANS (poor CNS penetration); use it only for concurrent CRS."], "sections": [{"h": "Recognise", "body": "<p>Onset usually after or during CRS (rarely before), and can recur days later after CRS has settled. Typical sequence: tremor, dysgraphia, impaired attention and mild lethargy; then expressive aphasia (impaired naming, paraphasic errors, verbal perseveration); then depressed consciousness, and in severe cases seizures and cerebral oedema. Headache alone is not specific and is not ICANS. Exclude other causes of encephalopathy (sedatives, infection, metabolic causes, intracranial haemorrhage).</p>"}, {"h": "Confirm", "body": "<p>ICE (Immune effector Cell-associated Encephalopathy) score, out of 10:</p><ul><li>Orientation (4): year, month, city, hospital (1 each).</li><li>Naming (3): name 3 objects (for example point to clock, pen, button).</li><li>Following commands (1): for example “show me 2 fingers”, “close your eyes and stick out your tongue”.</li><li>Writing (1): write a standard sentence.</li><li>Attention (1): count backwards from 100 by 10.</li></ul><p>Also assess level of consciousness, seizure activity, motor findings and signs of raised ICP regularly. Neurological observations, fundoscopy for papilloedema; low threshold for MRI brain and EEG (non-convulsive status), and LP when cerebral oedema or raised ICP is not suspected.</p>"}, {"h": "Grade: ASTCT 2019", "body": "<ul class='grade'><li><span class='g'>G1</span> ICE 7–9; wakes spontaneously.</li><li><span class='g'>G2</span> ICE 3–6, or depressed consciousness, rousable to voice.</li><li><span class='g'>G3</span> ICE 0–2, or rousable only to touch; any clinical or electrographic seizure that resolves; or focal or local cerebral oedema on imaging.</li><li><span class='g'>G4</span> ICE 0 and unrousable (stupor or coma); prolonged (&gt;5 min) or repeated seizures without return to baseline; deep focal motor weakness (hemiparesis or paraparesis); or signs of raised ICP or diffuse cerebral oedema (Cushing’s triad, papilloedema, CN VI palsy, decerebrate or decorticate posturing).</li></ul><p>The overall grade is set by the most severe domain; a normal ICE does not exclude high-grade ICANS if there is a seizure, raised ICP or deep motor weakness. In children &lt;12, the CAPD replaces the ICE (score ≥9 = G3).</p>"}, {"h": "Manage by grade", "body": "<p>Corticosteroids are the main treatment; start early rather than waiting for symptoms to peak. Doses follow the ASCO and NCCN algorithms:</p><ul><li>G1: supportive care and close monitoring; consider dexamethasone if not improving, especially with concurrent CRS.</li><li>G2–3: dexamethasone 10 mg IV every 6 h (or methylprednisolone equivalent), tapered once improving.</li><li>G4: high-dose methylprednisolone 1 g/day IV; ICU, airway protection, treatment of cerebral oedema and status epilepticus.</li><li>Seizures: levetiracetam for prophylaxis and treatment; benzodiazepine, then further treatment for status; EEG for non-convulsive seizures.</li><li>Concurrent CRS: tocilizumab with or without steroids for the CRS. Tocilizumab does not treat ICANS; it does not reach therapeutic CNS levels. Some protocols use anakinra for steroid-refractory ICANS.</li></ul>"}, {"h": "Disposition & escalation", "body": "<p>G1–2: monitored ward or HDU with frequent neurological observations according to the cellular-therapy protocol; G3–4: ICU. Notify the cellular-therapy team and follow the product and institutional pathway. Watch for concurrent CRS and for HLH or MAS. Neurology input for seizures, status or raised ICP.</p>"}, {"h": "Pitfalls", "body": "<ul><li>Giving tocilizumab for ICANS; it does not penetrate the CNS. Steroids are first line.</li><li>Grading on the ICE alone and missing high-grade features (seizure, raised ICP, deep motor weakness).</li><li>Attributing new drowsiness to sedatives and delaying steroids.</li><li>Missing non-convulsive status; request an EEG for unexplained depressed consciousness.</li></ul>"}], "related": "Related: CRS (this module); ICANS often follows or overlaps CRS, and tocilizumab given for CRS does not treat ICANS. Steroid doses by grade overlap the immunotherapy toxicity guidance in Tox.", "sources": "Lee DW et al, ASTCT (ASBMT) consensus, <em>Biol Blood Marrow Transplant</em> 2019;25:625–638 (grading + ICE) · Santomasso et al, ASCO CAR-T guideline, <em>JCO</em> 2021 · NCCN Management of Immunotherapy-Related Toxicities (grade-directed dosing). Post-2016 — not in the ESMO Handbook.", "_hay": "icans (immune effector cell-associated neurotoxicity) treatment-related neurotoxicity after car-t or t-cell-engaging therapy: tremor, dysgraphia, expressive aphasia, reduced consciousness, seizures. usually follows or overlaps crs, days after infusion. recognise: new tremor, word-finding difficulty or drowsiness after immune-effector-cell therapy. expressive aphasia is the most specific early sign. calculate the ice score (0–10) and assign the astct grade (see below). corticosteroids are first line: dexamethasone, dose by grade; levetiracetam for seizure prophylaxis and treatment. tocilizumab does not treat icans (poor cns penetration); use it only for concurrent crs."}, {"id": "irae-emergencies", "name": "Severe immune-related adverse event crises", "category": "Treatment-related", "urgency": "High", "grade": "", "post2016": true, "oneliner": "Grade 3–4 checkpoint-inhibitor toxicities that are immediately life-threatening: myocarditis, colitis with risk of perforation, adrenal crisis, pneumonitis, encephalitis, myasthenia and myositis. Can present weeks to months after starting, and after stopping.", "act_now": ["Hold the checkpoint inhibitor and consider an irAE for any new organ dysfunction during or after ICI treatment; the diagnosis is easily missed.", "High-dose corticosteroids for grade 3–4 (typically methylprednisolone 1–2 mg/kg/day; 1 g/day IV for myocarditis).", "Early organ-specialist input (cardiology, gastroenterology, endocrinology, neurology, ICU).", "Not responding to steroids at 48–72 h: second-line immunosuppression (agent depends on the organ)."], "sections": [{"h": "Recognise", "body": "<p>Checkpoint-inhibitor toxicity can affect any organ, weeks to months after starting, and sometimes after the drug has stopped. The life-threatening presentations:</p><ul><li>Myocarditis: rare, but the irAE with the highest case fatality. New dyspnoea, chest pain, arrhythmia, heart failure; troponin rise, ECG changes. High mortality in early series.</li><li>Colitis: high-volume or bloody diarrhoea; risk of toxic megacolon and perforation.</li><li>Hypophysitis and adrenal crisis: fatigue, headache, hypotension, hyponatraemia, hypoglycaemia; can present as circulatory collapse.</li><li>Pneumonitis: dyspnoea, cough, hypoxia; can progress to respiratory failure.</li><li>Neurological and neuromuscular: encephalitis; and a myasthenia, myositis and myocarditis overlap that can cause respiratory failure (monitor FVC and bulbar function).</li></ul>"}, {"h": "Confirm", "body": "<p>Urgent tests by organ. Myocarditis: troponin, ECG, echo, cardiac MRI, with or without biopsy. Colitis: stool infection screen, CT or flexible sigmoidoscopy. Endocrine: cortisol, ACTH, glucose, sodium, thyroid function, other pituitary axes. Pneumonitis: CT chest, exclude infection. Neurological: MRI, LP, EEG, and CK, repetitive nerve stimulation and anti-AChR antibodies for the myasthenia and myositis overlap. Always exclude infection and progression before attributing the picture to an irAE.</p>"}, {"h": "Manage", "body": "<p>For all organs: hold the ICI, start high-dose corticosteroids, involve the organ specialist early, and move to second-line immunosuppression if there is no response to steroids at 48–72 h. By organ:</p><ul><li>Myocarditis: methylprednisolone 1 g IV daily (pulse), urgent cardiology, telemetry or ICU; if steroid-refractory, second-line treatment (for example MMF, ATG, abatacept, or tofacitinib on emerging data). Stop the ICI permanently.</li><li>Colitis: methylprednisolone 1–2 mg/kg/day; if refractory or severe, infliximab 5 mg/kg, or vedolizumab 300 mg where infliximab is contraindicated (perforation, sepsis, untreated TB). Surgical review for perforation or megacolon.</li><li>Hypophysitis and adrenal crisis: stress-dose hydrocortisone first (for example 100 mg IV, then 50 mg every 6 h, about 200 mg in 24 h) and fluids, before any thyroxine; giving thyroid hormone before cortisol can cause adrenal crisis. High-dose steroids do not reverse the endocrine deficiency; hormone replacement is usually lifelong.</li><li>Pneumonitis: methylprednisolone 1–2 mg/kg/day, O₂, exclude infection; if refractory, infliximab, MMF or IVIG.</li><li>Encephalitis, myasthenia and myositis: high-dose steroids plus IVIG or plasma exchange; monitor respiratory function (FVC, NIF) and intubate for neuromuscular respiratory failure. Avoid drugs that worsen myasthenia.</li></ul>"}, {"h": "Disposition & escalation", "body": "<p>Grade 3–4 irAEs need admission; myocarditis, neuromuscular respiratory compromise and adrenal crisis need ICU-level care. Involve the relevant specialist within hours. The decision on permanent discontinuation or later rechallenge is multidisciplinary; myocarditis and most grade 4 events mean permanent discontinuation. Once controlled, taper steroids slowly (≥4–6 weeks).</p>"}, {"h": "Pitfalls", "body": "<ul><li>Giving thyroxine before hydrocortisone in suspected hypopituitarism; this can cause adrenal crisis. Give cortisol first.</li><li>Infliximab in ICI hepatitis; it is hepatotoxic and contraindicated. Use MMF.</li><li>Under-dosing myocarditis; it needs pulse methylprednisolone (1 g), not 1 mg/kg.</li><li>Attributing the picture to infection or progression and missing a treatable irAE, or the reverse; exclude infection before high-dose immunosuppression.</li><li>Missing the myasthenia and myositis overlap until respiratory failure; monitor FVC early.</li></ul>"}], "related": "Related: Tox has the full organ-by-organ irAE grading and management (CTCAE grades, prophylaxis, rechallenge); this card covers only acute grade 3–4 emergencies. CRS and ICANS (this module) for cellular-therapy toxicities.", "sources": "Brahmer &amp; Schneider et al, ASCO irAE guideline update, <em>JCO</em> 2021 (DOI 10.1200/JCO.21.01440) · NCCN Management of Immunotherapy-Related Toxicities · ESMO CPG (Haanen et al) · ESC Cardio-Oncology guideline 2022 (myocarditis). Post-2016 — not in the ESMO Handbook.", "_hay": "severe immune-related adverse event crises treatment-related grade 3–4 checkpoint-inhibitor toxicities that are immediately life-threatening: myocarditis, colitis with risk of perforation, adrenal crisis, pneumonitis, encephalitis, myasthenia and myositis. can present weeks to months after starting, and after stopping. hold the checkpoint inhibitor and consider an irae for any new organ dysfunction during or after ici treatment; the diagnosis is easily missed. high-dose corticosteroids for grade 3–4 (typically methylprednisolone 1–2 mg/kg/day; 1 g/day iv for myocarditis). early organ-specialist input (cardiology, gastroenterology, endocrinology, neurology, icu). not responding to steroids at 48–72 h: second-line immunosuppression (agent depends on the organ)."}];
const SECTIONS = {"Structural": ["tamponade", "bowel-obstruction", "airway-obstruction", "mscc", "obstructive-uropathy", "raised-icp", "svco"], "Metabolic": ["hypercalcaemia", "hyponatraemia-siadh", "tls"], "Infective": ["febrile-neutropaenia", "typhlitis"], "Haematological": ["transfusion-reactions", "dic", "hyperviscosity-leukostasis", "major-haemorrhage"], "Vascular": ["cancer-vte"], "Treatment-related": ["hypersensitivity", "crs", "icans", "irae-emergencies", "extravasation"]};
const BYID = Object.fromEntries(EMERGENCIES.map(e => [e.id, e]));

let state = { view:'index', id:null, q:'' };

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

for (const [sec, ids] of Object.entries(SECTIONS)) {

document.getElementById('showall').onclick = () => { state.view='index'; state.id=null; state.q=''; document.getElementById('q').value=''; closeNav(); render(true); window.scrollTo(0,0); };

function filtered(){ return EMERGENCIES.filter(e => !state.q || e._hay.includes(state.q)); }

// Emergency page: one ruled form (site review 2026-11-10). Title | category,
// 【ACT NOW】 as ① rows, then label | value rows. Section text is unchanged:
// lists become ① rows under Manage and ・ rows elsewhere, and a later paragraph
// that opens with a short label ("Severity (corrected Ca): ...") splits at its
// colon into label | text.
const CIRCLED = '①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳';
function rfRows(items, numbered){
  return `<div class="rf-rows${numbered?' rf-num':''}">` + items.map((h,i) => numbered
    ? `<div class="rf-r"><div>${CIRCLED[i]||String(i+1)}</div><div>${h}</div></div>`
    : `<div class="rf-line">・${h}</div>`).join('') + '</div>';
}
function rfSection(sec){
  const t = document.createElement('template'); t.innerHTML = sec.body;
  const numbered = /^Manage/.test(sec.h), parts = [];
  let first = true, labelled = null;
  t.content.childNodes.forEach(n => {
    if (n.nodeType === 3) { if (n.textContent.trim()) { parts.push(`<div class="rf-line">${esc(n.textContent)}</div>`); labelled = null; } return; }
    if (n.nodeType !== 1) return;
    if (n.tagName === 'UL' && n.classList.contains('grade')) {
      parts.push('<div class="rf-rows rf-by">' + [...n.children].map(li => {
        const g = li.querySelector(':scope > .g'); const label = g ? g.innerHTML : ''; if (g) g.remove();
        return `<div class="rf-r"><div>${label}</div><div>${li.innerHTML.trim()}</div></div>`;
      }).join('') + '</div>');
      labelled = null; first = false; return;
    }
    if (n.tagName === 'UL' || n.tagName === 'OL') { parts.push(rfRows([...n.children].map(li => li.innerHTML), numbered)); labelled = null; first = false; return; }
    const m = n.tagName === 'P' && !first && /^([^<:]{1,40}): ([\s\S]+)$/.exec(n.innerHTML);
    first = false;
    if (m) {
      const row = `<div class="rf-r"><div>${m[1]}</div><div>${m[2]}</div></div>`;
      if (labelled !== null) parts[labelled] = parts[labelled].replace(/<\/div>$/, row + '</div>');
      else { labelled = parts.length; parts.push(`<div class="rf-rows rf-by">${row}</div>`); }
      return;
    }
    labelled = null;
    parts.push(`<div class="rf-line">${n.tagName === 'P' ? n.innerHTML : n.outerHTML}</div>`);
  });
  return `<div class="rf-kv"><div class="rf-k">${esc(sec.h)}</div><div class="rf-v rf-flush">${parts.join('')}</div></div>`;
}

function renderDetail(e){
  document.getElementById('crumbs').innerHTML = `${esc(e.category)} &rsaquo; <b>${esc(e.name)}</b>`;
  const kv = (k, cls, v) => `<div class="rf-kv"><div class="rf-k">${k}</div><div class="rf-v ${cls}">${v}</div></div>`;
  const related = e.related ? kv('Related', 'related', e.related.replace(/^Related:\s*/, '')) : '';
  const sources = e.sources ? kv('Sources', 'rf-note sources', '※ ' + e.sources.replace(/<\/?(em|i)>/g, '')) : '';
  const meta = [e.category, e.grade, e.post2016 ? 'post-2016' : ''].filter(Boolean).map(x => `<span class="rf-sub">${esc(x)}</span>`).join('');
  document.getElementById('results').innerHTML = `<article class="rf">
    <div class="rf-h"><h2>${esc(e.name)}</h2>${meta}</div>
    <h3 class="rf-b">ACT NOW</h3>${rfRows(e.act_now, true)}
    ${e.sections.map(rfSection).join('')}${related}${sources}</article>`;
}

function render(fade){
  // fade only on real view changes (list <-> detail), never on search keystrokes;
  // and never under reduced motion — swap instantly instead.
  if (fade && !(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches)) {
    const res = document.getElementById('results');
    res.classList.add('vfade');
    setTimeout(() => { if(!res.isConnected) return; renderNow(); res.classList.remove('vfade'); }, 150);  // bail if the view was torn down mid-fade
    return;
  }
  renderNow();
}

function renderNow(){
  syncNav();
  const res = document.getElementById('results');

  if (state.view==='detail' && BYID[state.id]) { renderDetail(BYID[state.id]); return; }

  // ---- Index (list) view ----
  document.getElementById('crumbs').innerHTML = state.q
    ? `<b>Search</b> &mdash; matching emergencies`
    : `<b>All emergencies</b> &mdash; by category`;

  let rows = filtered();
  const secIdx = {}; Object.keys(SECTIONS).forEach((s,i)=>secIdx[s]=i);
  rows.sort((a,b) => {
    const so = (secIdx[a.category]??99) - (secIdx[b.category]??99);
    if (so!==0) return so;
    const x=a.name.toLowerCase(), y=b.name.toLowerCase();
    return x<y?-1 : x>y?1 : 0;
  });
  if (!rows.length) { res.innerHTML = `<div class="empty">No emergency matches that search.</div>`; return; }

  let h = `<table class="list"><caption class="sr-only">Oncological emergencies</caption><thead><tr>
    <th scope="col">Emergency</th>
  </tr></thead><tbody>`;

  let lastSec = null;
  rows.forEach(e => {
    if (e.category!==lastSec) {
      h += `<tr class="secrow"><td>${esc(e.category)}</td></tr>`;
      lastSec = e.category;
    }
    h += `<tr class="row" data-id="${esc(e.id)}">
      <td class="name"><button class="rowtoggle" type="button">${esc(e.name)}</button><div class="rowsub">${esc(e.oneliner)}</div></td></tr>`;
  });
  h += `</tbody></table>`;
  res.innerHTML = h;

  res.querySelectorAll('.rowtoggle').forEach(btn => btn.onclick = ev => { ev.stopPropagation(); selectEmerg(btn.closest('tr').dataset.id); });
  res.querySelectorAll('tr.row').forEach(tr => tr.onclick = ev => { if (ev.target.closest('button,a,input,select')) return; selectEmerg(tr.dataset.id); });
}
render();

// Decorate existing text only. Never replace clinical wording or nest links.
function oncosLinkExistingText(root, entries) {
  if (!root || !entries.length) return;
  const choices = entries.filter(([label, href]) => label && /^(https:\/\/|\/)/.test(href))
    .sort((a,b) => b[0].length-a[0].length);
  const escape = value => value.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const lookup = new Map(choices.map(([label,href]) => [label.toLowerCase(),href]));
  const pattern = new RegExp(choices.map(([label]) => escape(label)).join('|'),'gi');
  const walker = document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
  const nodes=[]; while(walker.nextNode())nodes.push(walker.currentNode);
  for(const node of nodes){
    if(node.parentElement.closest('a,script,style'))continue;
    const text=node.nodeValue; let last=0, changed=false;
    const fragment=document.createDocumentFragment();
    pattern.lastIndex=0;
    for(const match of text.matchAll(pattern)){
      const at=match.index,end=at+match[0].length;
      if((at&&/[\p{L}\p{N}]/u.test(text[at-1])) || (end<text.length&&/[\p{L}\p{N}]/u.test(text[end])))continue;
      fragment.append(document.createTextNode(text.slice(last,at)));
      const link=document.createElement('a');link.href=lookup.get(match[0].toLowerCase());link.textContent=match[0];
      if(link.getAttribute('href').startsWith('https://')){link.target='_blank';link.rel='noopener noreferrer';}
      fragment.append(link);last=end;changed=true;
    }
    if(changed){fragment.append(document.createTextNode(text.slice(last)));node.replaceWith(fragment);}
  }
}

// Existing emergency selections gain locations and current-tab reading state.
(() => {
  if (!ctx.root || !ctx.search) return;
  const valid = id => Object.prototype.hasOwnProperty.call(BYID,id);
  window.oncosView.captureState = () => ({version:1,module:'acute',value:{...state}});
  window.oncosView.restoreState = snapshot => {
    const value = snapshot && snapshot.value;
    if (!snapshot || snapshot.version!==1 || snapshot.module!=='acute' || !value ||
        !['index','detail'].includes(value.view) || typeof value.q!=='string' ||
        (value.id!==null && !valid(value.id)) || (value.view==='detail' && !value.id)) return false;
    state = {view:value.view,id:value.id,q:value.q};
    ctx.search.value = state.q; renderNow(); return true;
  };
  window.oncosView.navigation = {
    read:() => state.view==='detail' ? {record:state.id} : {},
    open:target => {
      if (target.record && !valid(target.record)) return false;
      state = {view:target.record?'detail':'index',id:target.record||null,q:''};
      ctx.search.value=''; closeNav(); renderNow(); window.scrollTo(0,0);
      if (target.anchor) {
        const node=document.getElementById(target.anchor);
        if (!node || !ctx.root.contains(node)) return false;
        node.scrollIntoView({block:'start'});
      }
      return true;
    },
  };
  if (ctx.transition) {
    const select=selectEmerg, draw=renderNow;
    selectEmerg = id => ctx.transition(() => select(id));
    renderNow = () => {
      draw(); const button=ctx.root.querySelector('#backbtn');
      if (button) {const action=button.onclick;button.onclick=event=>ctx.transition(()=>action(event));}
    };
    render=()=>renderNow();
    const all=document.getElementById('showall'), action=all.onclick;
    all.onclick=event=>ctx.transition(()=>action(event));
  }
})();


// Only explicit identifiers and existing, unambiguous related-topic names.
(() => {
  if(!ctx.root)return;
  const aliases={
    'raised ICP & brain-met crises':'raised-icp','raised-ICP crises':'raised-icp',
    'MSCC':'mscc','DIC':'dic','febrile neutropenia / septic shock':'febrile-neutropaenia',
    'febrile neutropenia':'febrile-neutropaenia','acute haemolytic transfusion reactions':'transfusion-reactions',
    'major-haemorrhage':'major-haemorrhage','TLS':'tls','CRS':'crs','ICANS':'icans'
  };
  const draw=renderDetail;
  renderDetail=e=>{
    draw(e);
    const sources=ctx.root.querySelector('.sources'), text=sources?.textContent||'';
    const links=[];
    for(const m of text.matchAll(/PMID\s+(\d+)/g))links.push([m[0],'https://pubmed.ncbi.nlm.nih.gov/'+m[1]+'/']);
    for(const m of text.matchAll(/PMC\d+/g))links.push([m[0],'https://pmc.ncbi.nlm.nih.gov/articles/'+m[0]+'/']);
    for(const m of text.matchAll(/DOI\s+(10\.\d{4,9}\/[^\s;]+)/g)){
      let doi=m[1];while(doi.endsWith(')')&&doi.split(')').length>doi.split('(').length)doi=doi.slice(0,-1);
      doi=doi.replace(/[.,]+$/,'');links.push(['DOI '+doi,'https://doi.org/'+doi]);
    }
    links.push(['NICE NG234','https://www.nice.org.uk/guidance/ng234']);
    oncosLinkExistingText(sources,links);
    const related=Object.entries(aliases).filter(([,id])=>id!==e.id&&BYID[id]).map(([label,id])=>[label,'/acute/?record='+encodeURIComponent(id)]);
    related.push(['Tox','/tox/']);
    oncosLinkExistingText(ctx.root.querySelector('.related'),related);
  };
})();

  },
  destroy: function() {

  }
};
</script>
