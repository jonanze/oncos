<style data-view-css>
html[data-view="acute"]{--red:#e00020; --orange:#f05010}
[data-view="acute"] a{color:var(--teal);}
[data-view="acute"] .allbtn{margin:4px 20px 10px;}
[data-view="acute"] .allbtn button{display:block;width:100%;text-align:center;padding:8px;border:1px solid var(--hair);border-radius:999px;
    background:transparent;color:var(--ink);text-decoration:none;font-family:inherit;font-weight:var(--w-label);font-size:var(--t-base);cursor:pointer;}
@media (hover:hover){[data-view="acute"] .allbtn button:hover{background:var(--hover);}}
[data-view="acute"] .navsec{margin-top:6px;}
[data-view="acute"] .navsec > .secname{display:flex;justify-content:space-between;align-items:center;
    width:100%;border:0;background:transparent;text-align:left;font-family:inherit;
    padding:9px 20px;font-size:var(--t-xs);font-weight:var(--w-strong);letter-spacing:.06em;
    text-transform:uppercase;color:var(--muted);cursor:pointer;user-select:none;}
@media (hover:hover){[data-view="acute"] .navsec > .secname:hover{color:var(--ink);}}
[data-view="acute"] .navsec .caret{transition:transform .15s;font-size:var(--t-2xs);opacity:.6;}
[data-view="acute"] .navsec.collapsed .caret{transform:rotate(-90deg);}
[data-view="acute"] .navsec.collapsed .items{display:none;}
[data-view="acute"] .items button{display:flex;justify-content:space-between;gap:8px;align-items:center;
    width:100%;background:transparent;font-family:inherit;text-align:left;
    padding:6px 20px 6px 28px;color:var(--ink);text-decoration:none;cursor:pointer;
    border:0;border-left:2px solid transparent;font-size:var(--t-base);}
@media (hover: hover){[data-view="acute"] .items button:hover{background:var(--accent-soft);}}
[data-view="acute"] .items button.active{background:var(--press);border-left-color:transparent;font-weight:var(--w-name);color:var(--ink);}
[data-view="acute"] .items button > span:first-child{min-width:0;}
[data-view="acute"] main{max-width:1000px;margin:0 auto;padding:18px clamp(16px,4vw,26px) 60px;}
[data-view="acute"] #results{transition:opacity .15s var(--mo-ease,cubic-bezier(.3,0,.1,1)),
           transform .15s var(--mo-ease,cubic-bezier(.3,0,.1,1));}
[data-view="acute"] #results.vfade{opacity:0;transform:translateY(5px);}
[data-view="acute"] .topbar{margin-bottom:12px;}
[data-view="acute"] .crumbs{display:none;}
[data-view="acute"] .crumbs b{color:var(--ink);}
[data-view="acute"] table.list{width:100%;border-collapse:collapse;background:var(--panel,var(--paper));}
[data-view="acute"] table.list > thead th{text-align:left;font-size:var(--t-xs);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);
    padding:11px 12px;border-bottom:1.2px solid var(--rule);background:var(--ground,transparent);white-space:nowrap;font-weight:var(--w-name);}
[data-view="acute"] table.list > tbody tr.row{border-bottom:1px solid var(--grid);cursor:pointer;}
@media (hover: hover){[data-view="acute"] table.list > tbody tr.row:hover{background:var(--accent-soft);}}
[data-view="acute"] table.list > tbody td{padding:11px 12px;vertical-align:top;}
[data-view="acute"] td.name{font-family:var(--font-serif);font-weight:var(--w-label);font-size:var(--t-md);}
[data-view="acute"] .rowtoggle{display:block;width:100%;padding:0;border:0;background:transparent;
    color:inherit;font:inherit;font-weight:inherit;text-align:left;cursor:pointer;}
[data-view="acute"] .rowsub{margin-top:3px;font-family:var(--font-sans);font-size:var(--t-sm);font-weight:var(--w-body);
    line-height:1.4;color:var(--muted);}
[data-view="acute"] .secrow td{background:var(--ground,var(--accent-soft));font-weight:var(--w-strong);font-size:var(--t-xs);letter-spacing:.05em;
    text-transform:uppercase;color:var(--slate);padding:7px 12px;}
[data-view="acute"] .secrow td::after{content:"";display:inline-block;width:100%;height:1px;background:var(--rule);vertical-align:middle;margin-left:12px;margin-right:-100%;}
[data-view="acute"] .empty{text-align:center;color:var(--muted);padding:50px;}
[data-view="acute"] footer.disc{margin-top:36px;text-align:center;color:var(--muted);font-size:var(--t-sm);line-height:1.6;
    border-top:1px solid var(--grid);padding-top:18px;}
[data-view="acute"] #results:has(> table.list){background:var(--panel,var(--paper));border:1px solid var(--grid);
    border-radius:14px;overflow:clip;box-shadow:var(--shadow);}
@media (max-width:820px){[data-view="acute"] main{padding:14px 14px 54px;}
[data-view="acute"] table.list, [data-view="acute"] table.list tbody, [data-view="acute"] table.list tr, [data-view="acute"] table.list td{display:block;width:100%;}
[data-view="acute"] table.list > thead{display:none;}
[data-view="acute"] tr.secrow td{background:transparent;color:var(--slate);padding:14px 2px 6px;border:none;}
[data-view="acute"] table.list tr.row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
      background:var(--panel,var(--paper));border:1px solid var(--hair);border-radius:12px;box-shadow:var(--shadow);
      margin-bottom:7px;padding:12px 14px;}
[data-view="acute"] table.list tr.row td{border:none;padding:0;}
[data-view="acute"] table.list tr.row td.name{flex:1 1 0;min-width:0;}
[data-view="acute"] #results:has(> table.list){background:transparent;border:none;border-radius:0;overflow:visible;box-shadow:none;}}
@media (max-width:520px){[data-view="acute"] .dvhead h2{font-size:var(--t-2xl);}}
@media print{[data-view="acute"] main{padding:0;}}
[data-view="acute"] .dvbody .sec>p, [data-view="acute"] .dvbody .sec>ul, [data-view="acute"] .dvbody .sec>ol{max-width:85ch;}
[data-view="acute"] .dvbody .sources, [data-view="acute"] .dvbody .related{max-width:100ch;}
@container oncos (min-width:1000px){[data-view="acute"] .dvbody{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px 40px;align-items:start;}
[data-view="acute"] .dvbody .sec{margin:0;min-width:0;}
[data-view="acute"] .dvbody .related, [data-view="acute"] .dvbody .sources{grid-column:1 / -1;margin:0;}
[data-view="acute"] .actnow ol{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px 40px;}
[data-view="acute"] .actnow li{margin:0;max-width:80ch;}}

<script>
window.oncosView = {
  name: 'acute',
  init: function(ctx) {

if (false) {
    window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
  }
const EMERGENCIES = [{"id": "mscc", "name": "Malignant spinal cord compression", "category": "Structural", "urgency": "High", "grade": "", "post2016": false, "oneliner": "Epidural tumour compressing the spinal cord or cauda equina. Presents with new or worsening back pain, leg weakness, a sensory level, or bladder or bowel change in a patient with cancer. Treat before the patient loses the ability to walk.", "act_now": ["Dexamethasone 16 mg (oral or equivalent IV) as soon as MSCC is suspected, with PPI cover; do not wait for imaging.", "Whole-spine MRI within 24 h (CT with contrast if MRI is contraindicated). Image the whole spine; lesions are often at more than one level.", "Flat bed rest and spinal precautions until spinal stability is assessed.", "Refer the same day to oncology and to spinal surgery or radiation oncology. Assess and record whether the patient can walk; this predicts outcome."], "sections": [{"h": "Recognise", "body": "<p>Back pain is often the first symptom and may precede neurological signs by weeks; it is worse lying down, on straining or at night. It progresses to limb weakness, a sensory level and gait disturbance, and later to urinary retention or incontinence and reduced anal tone. The thoracic spine is the most common site.</p><p>A motor deficit that develops over less than 24–48 h has a worse prognosis and needs faster diagnosis than one that develops over more than 7 days. Bladder and bowel signs are late; do not wait for them.</p><p>Most common primaries: breast, prostate, lung, myeloma, renal.</p>"}, {"h": "Confirm", "body": "<p>Whole-spine MRI within 24 h of suspected MSCC is the investigation of choice; whole-spine CT with contrast if MRI is contraindicated or unavailable. Image the entire spine: compression is at more than one level in about a third of cases, and a second site changes the plan.</p><p>Obtain a tissue diagnosis if the primary is unknown, but do not delay steroids or definitive treatment for the biopsy when the cord is threatened.</p>"}, {"h": "Manage", "body": "<ul><li>Corticosteroid: dexamethasone 16 mg (oral or equivalent parenteral) as soon as MSCC is suspected, then 16 mg daily while awaiting surgery or radiotherapy, with gastric protection and glucose monitoring; taper once definitive treatment has started. Stop it if imaging excludes MSCC. A 10 mg IV loading dose is common practice but is not part of the NICE regimen.</li><li>Surgery or radiotherapy: in the Patchell RCT, decompressive surgery followed by radiotherapy preserved and restored walking better than radiotherapy alone (walking after treatment 84% vs 57%; among patients unable to walk at entry, walking regained 62% vs 19%). Prefer surgery for a single area of compression, spinal instability, an unknown primary needing tissue, radioresistant histology, or a deficit despite or after prior radiotherapy, in patients fit for surgery with a reasonable prognosis.</li><li>Radiotherapy for patients who are not surgical candidates, radiosensitive tumours, disease at several levels, or poor performance status.</li><li>Systemic therapy can be first-line, alongside the above, for highly chemosensitive or hormone-sensitive disease (for example lymphoma, germ cell tumours, some prostate cancer).</li><li>Catheterise urinary retention; VTE prophylaxis; pressure-area and bowel care; analgesia.</li></ul>"}, {"h": "Disposition & escalation", "body": "<p>Admit and discuss the same day with spinal surgery and radiation oncology (many centres have an MSCC coordinator or pathway). Ability to walk before treatment is the strongest predictor of walking afterwards: most patients treated while still walking remain able to walk, and few recover once paraplegic. Aim for definitive treatment within 24 h of diagnosis when the cord is threatened.</p>"}, {"h": "Pitfalls", "body": "<ul><li>Waiting for bladder or bowel signs; by then cord function is often lost.</li><li>Imaging only the symptomatic level and missing compression higher up.</li><li>Withholding steroids until the MRI, or omitting gastric protection and glucose monitoring.</li><li>Referring the next day instead of at the time of suspicion.</li></ul>"}], "related": "Related: raised ICP and brain metastasis emergencies (this module) for steroids in oedema.", "sources": "NICE NG234 <em>Spinal metastases and metastatic spinal cord compression</em> (2023) · Patchell RA et al, <em>Lancet</em> 2005;366:643–648 (DOI 10.1016/S0140-6736(05)66954-1; PMID 16112300). ESMO Handbook ch. 7.", "_hay": "malignant spinal cord compression structural epidural tumour compressing the spinal cord or cauda equina. presents with new or worsening back pain, leg weakness, a sensory level, or bladder or bowel change in a patient with cancer. treat before the patient loses the ability to walk. dexamethasone 16 mg (oral or equivalent iv) as soon as mscc is suspected, with ppi cover; do not wait for imaging. whole-spine mri within 24 h (ct with contrast if mri is contraindicated). image the whole spine; lesions are often at more than one level. flat bed rest and spinal precautions until spinal stability is assessed. refer the same day to oncology and to spinal surgery or radiation oncology. assess and record whether the patient can walk; this predicts outcome."}, {"id": "svco", "name": "Superior vena cava obstruction", "category": "Structural", "urgency": "High", "grade": "Yale 0–4", "post2016": false, "oneliner": "Obstruction of flow in the superior vena cava. Presents with swelling of the face, neck or arms, distended neck and chest-wall veins, dyspnoea and plethora; usually from lung cancer or lymphoma. Airway and cerebral signs, not the facial swelling, decide how urgent it is.", "act_now": ["Look for stridor or airway compromise and for cerebral signs (confusion, reduced consciousness, visual change from laryngeal or cerebral oedema). Either makes it an emergency.", "Sit the patient up; give oxygen.", "Obtain tissue first unless airway or cerebral compromise needs immediate treatment; treatment depends on the histology.", "Endovascular stenting for severe or life-threatening obstruction (Yale grade 3–4). It gives the fastest relief and does not need a diagnosis."], "sections": [{"h": "Recognise", "body": "<p>Facial and neck swelling, dyspnoea and a feeling of fullness, distended neck and chest-wall collateral veins, facial plethora, cough; worse on bending forward or lying flat. Onset is usually gradual as collaterals develop, so most presentations are urgent but not immediately life-threatening.</p><p>A minority are dangerous: stridor or airway oedema, and cerebral oedema (headache, confusion, obtundation), from an SVC that occludes faster than collaterals can form. These take precedence over the usual rule of biopsy first.</p><p>Most causes are malignant: non-small-cell and small-cell lung cancer, non-Hodgkin lymphoma. Also consider thrombosis related to a catheter or device.</p>"}, {"h": "Confirm", "body": "<p>Contrast CT of the thorax shows the level, extent and cause of the obstruction and guides both biopsy and stenting. Obtain a histological diagnosis (sputum or pleural cytology, nodal or bronchoscopic biopsy, image-guided core biopsy) before treatment. Management depends on the disease, and treatment without a diagnosis can prevent the diagnosis of a curable cancer (for example lymphoma, small-cell lung cancer, germ cell tumour).</p>"}, {"h": "Manage", "body": "<ul><li>Endovascular stenting gives the fastest symptom relief and is the treatment of choice for severe or life-threatening SVCO. It does not depend on histology, so it can come before the diagnosis when symptoms are urgent.</li><li>Treatment of the tumour by histology: chemotherapy (with or without a stent) for chemosensitive disease (small-cell lung cancer, lymphoma, germ cell tumour); radiotherapy for non-small-cell lung cancer and other less chemosensitive tumours.</li><li>Anticoagulation if the obstruction is thrombotic or a stent is placed (local protocol).</li><li>Corticosteroids are often given, but evidence is weak and benefit is uncertain except in steroid-responsive tumours (lymphoma) or to limit oedema during radiotherapy. They do not replace definitive treatment.</li><li>Head elevation and oxygen are supportive only.</li></ul>"}, {"h": "Grade: Yale (Yu) system", "body": "<ul class='grade'><li><span class='g'>G0</span> radiographic obstruction, asymptomatic.</li><li><span class='g'>G1</span> mild: head and neck oedema, plethora, cyanosis.</li><li><span class='g'>G2</span> moderate: oedema with functional impairment (mild dysphagia, cough, mild visual disturbance).</li><li><span class='g'>G3</span> severe: cerebral oedema (mild headache, dizziness) or laryngeal oedema, or reduced cardiac reserve (syncope on bending).</li><li><span class='g'>G4</span> life-threatening: significant cerebral oedema (confusion, obtundation) or laryngeal oedema (stridor), or significant haemodynamic compromise. <span class='g'>G5</span> fatal.</li></ul><p>At grade 3–4, urgent stenting comes before the biopsy.</p>"}, {"h": "Disposition & escalation", "body": "<p>Grade 3–4 (airway or cerebral signs, haemodynamic compromise): monitored bed, urgent interventional radiology for stenting, anaesthetic or ITU input for a threatened airway. Grade 1–2: rapid work-up to a tissue diagnosis, then treatment for the specific disease. True emergencies are a minority.</p>"}, {"h": "Pitfalls", "body": "<ul><li>Radiotherapy before biopsy: it can make a lymphoma or small-cell lung cancer impossible to classify and lose the chance of curative treatment.</li><li>Treating every SVCO as life-threatening. Most cases are urgent, not peri-arrest; airway and cerebral signs, not facial swelling, set the urgency.</li><li>Missing a catheter-associated thrombus as the cause.</li></ul>"}], "related": "", "sources": "Yu JB, Wilson LD, Detterbeck FC, <em>J Thorac Oncol</em> 2008;3:811–814 (Yale/Yu classification &amp; management algorithm; PMID 18670297). ESMO Handbook ch. 3.", "_hay": "superior vena cava obstruction structural obstruction of flow in the superior vena cava. presents with swelling of the face, neck or arms, distended neck and chest-wall veins, dyspnoea and plethora; usually from lung cancer or lymphoma. airway and cerebral signs, not the facial swelling, decide how urgent it is. look for stridor or airway compromise and for cerebral signs (confusion, reduced consciousness, visual change from laryngeal or cerebral oedema). either makes it an emergency. sit the patient up; give oxygen. obtain tissue first unless airway or cerebral compromise needs immediate treatment; treatment depends on the histology. endovascular stenting for severe or life-threatening obstruction (yale grade 3–4). it gives the fastest relief and does not need a diagnosis."}, {"id": "tamponade", "name": "Cardiac tamponade / malignant pericardial effusion", "category": "Structural", "urgency": "Peri-arrest", "grade": "", "post2016": false, "oneliner": "Pericardial fluid raises intrapericardial pressure and restricts cardiac filling, causing obstructive shock. Dyspnoea, tachycardia, hypotension and raised JVP in a patient with cancer; it can progress to PEA arrest.", "act_now": ["Echocardiography now. It makes the diagnosis (effusion with diastolic collapse of the right atrium or ventricle, a plethoric IVC) and guides drainage.", "Look for decompensation: hypotension, tachycardia, raised JVP (Beck's triad), pulsus paradoxus (inspiratory fall in systolic pressure &gt;10 mmHg).", "Urgent echo-guided pericardiocentesis for haemodynamic compromise; this is the definitive treatment. Do not delay it for a full oncological work-up.", "Give IV fluids while preparing to drain. Avoid intubation and positive-pressure ventilation if possible; they can precipitate arrest in tamponade."], "sections": [{"h": "Recognise", "body": "<p>Progressive dyspnoea, orthopnoea, fatigue, chest discomfort; on examination tachycardia, hypotension, raised JVP, quiet heart sounds and pulsus paradoxus. Beck's triad (hypotension, muffled heart sounds, distended neck veins) is specific but insensitive: the full triad is uncommon, and its absence does not exclude tamponade. Tamponade is defined by its haemodynamic effect, not by the size of the effusion. A small effusion that accumulates quickly can cause tamponade when a large chronic one does not.</p><p>Common in advanced lung and breast cancer, lymphoma and melanoma; also after radiation pericarditis and, rarely, with immunotherapy.</p>"}, {"h": "Confirm", "body": "<p>Echocardiography is the most useful test. It confirms and sizes the effusion and shows tamponade physiology: diastolic collapse of the right atrium and then the right ventricle, a plethoric IVC that does not collapse, and respiratory variation in transvalvular flow. Effusion size on echo in diastole: mild &lt;10 mm, moderate 10–20 mm, large &gt;20 mm. ECG may show low voltages and electrical alternans; chest X-ray a globular heart. Send drained fluid for cytology.</p>"}, {"h": "Manage", "body": "<ul><li>Pericardiocentesis (echo-guided or fluoroscopic) is indicated for tamponade, for symptomatic large effusions, and when a neoplastic cause is suspected; it is diagnostic and therapeutic. Leave a catheter for extended drainage; this greatly reduces reaccumulation compared with a single aspiration.</li><li>While preparing: IV fluid to support preload; a vasopressor if needed. Avoid positive-pressure ventilation where possible; it reduces venous return and can cause arrest in compensated tamponade.</li><li>Preventing recurrence: extended catheter drainage, or a surgical pericardial window (subxiphoid or thoracoscopic) for recurrent or loculated effusions. Intrapericardial sclerosing or cytotoxic agents are an option but cause chest pain and constriction, and are used selectively.</li><li>Systemic treatment of the underlying cancer gives lasting control.</li></ul>"}, {"h": "Disposition & escalation", "body": "<p>Monitored bed, HDU or ICU; involve cardiology and cardiothoracic surgery. Recurrence rates guide escalation: reaccumulation after a single pericardiocentesis is common (about 38% in pooled series), against about 10–12% with extended catheter drainage, sclerosis or balloon pericardiotomy, and under about 7% after a surgical window. A recurrent malignant effusion therefore needs a window or extended drainage, not repeat aspiration.</p>"}, {"h": "Pitfalls", "body": "<ul><li>Judging by effusion size: a small, fast effusion can cause tamponade; a large, slow one may not.</li><li>Intubating a hypotensive patient with tamponade before drainage: risk of peri-arrest.</li><li>Aggressive diuresis or vasodilators: they reduce preload and worsen the obstruction.</li><li>Single aspiration and discharge in malignant disease: plan for reaccumulation.</li></ul>"}], "related": "", "sources": "2015 ESC Guidelines for the diagnosis and management of pericardial diseases, <em>Eur Heart J</em> 2015;36:2921–2964 (PMID 26320112) · malignant pericardial effusion recurrence rates from pooled observational data (systematic review, PMC11357784). ESMO Handbook ch. 1.", "_hay": "cardiac tamponade / malignant pericardial effusion structural pericardial fluid raises intrapericardial pressure and restricts cardiac filling, causing obstructive shock. dyspnoea, tachycardia, hypotension and raised jvp in a patient with cancer; it can progress to pea arrest. echocardiography now. it makes the diagnosis (effusion with diastolic collapse of the right atrium or ventricle, a plethoric ivc) and guides drainage. look for decompensation: hypotension, tachycardia, raised jvp (beck's triad), pulsus paradoxus (inspiratory fall in systolic pressure >10 mmhg). urgent echo-guided pericardiocentesis for haemodynamic compromise; this is the definitive treatment. do not delay it for a full oncological work-up. give iv fluids while preparing to drain. avoid intubation and positive-pressure ventilation if possible; they can precipitate arrest in tamponade."}, {"id": "raised-icp", "name": "Raised intracranial pressure & brain-metastasis crises", "category": "Structural", "urgency": "Peri-arrest", "grade": "", "post2016": false, "oneliner": "Mass effect, vasogenic oedema or haemorrhage from brain metastases raises ICP. Headache, vomiting, drowsiness, focal deficit, seizure; herniation leads to arrest.", "act_now": ["Recognise herniation: falling GCS, new pupillary asymmetry or a fixed dilated pupil, Cushing response (hypertension and bradycardia), abnormal posturing. This is a neurosurgical emergency.", "Airway and breathing first; nurse head-up at about 30° with the head midline; treat hypoxia and hypercapnia.", "Dexamethasone for vasogenic oedema: up to 16 mg/day for severe raised-ICP symptoms (4–8 mg/day for milder mass-effect symptoms), with PPI cover.", "For impending herniation: hyperosmolar therapy (mannitol 0.25–1 g/kg IV over 15–30 min, or 3% hypertonic saline) and call neurosurgery immediately."], "sections": [{"h": "Recognise", "body": "<p>Raised ICP: headache (worse on waking, coughing or lying flat), nausea and vomiting, increasing drowsiness, papilloedema and developing focal deficits. A seizure may be the first sign. Signs of herniation (falling consciousness, a new dilated or unreactive pupil, the Cushing response of hypertension with bradycardia, extensor posturing) mean decompensation and need immediate action.</p><p>Sudden deterioration suggests haemorrhage into a tumour (melanoma, renal, choriocarcinoma, thyroid) or obstructive hydrocephalus.</p>"}, {"h": "Confirm", "body": "<p>Urgent CT head (with contrast, or MRI where possible) for the number, size and site of metastases, midline shift, hydrocephalus and haemorrhage. In a patient who is herniating, do not delay hyperosmolar therapy or the neurosurgical call for imaging; treat and scan at the same time.</p>"}, {"h": "Manage", "body": "<ul><li>Corticosteroid for vasogenic oedema: dexamethasone 4–8 mg/day for mild to moderate mass-effect symptoms, up to 16 mg/day for severe or raised-ICP symptoms. Higher doses add toxicity without extra benefit in less severe disease, so reserve them. Steroids are not indicated for asymptomatic metastases. Give gastric protection and monitor glucose; taper to the lowest effective dose. A 10 mg IV loading dose is common practice but is not a fixed guideline figure.</li><li>Hyperosmolar therapy for herniation or critical ICP: mannitol 0.25–1 g/kg IV over 15–30 min, or 3% hypertonic saline as an alternative. It buys time until decompression and is not a treatment on its own.</li><li>Seizures: treat active seizures (a benzodiazepine, then a loading dose of an antiepileptic). Do not give prophylactic antiepileptics to patients with brain metastases who have not had a seizure; routine prophylaxis is not recommended.</li><li>Definitive control: urgent neurosurgery (resection of a dominant or haemorrhagic lesion; CSF diversion for hydrocephalus) and/or radiotherapy (SRS for limited disease, whole-brain radiotherapy in selected cases); systemic therapy where the disease is highly responsive.</li><li>Airway protection, head-up positioning, normocapnia; brief controlled hyperventilation only while awaiting theatre.</li></ul>"}, {"h": "Disposition & escalation", "body": "<p>Herniation or critically raised ICP: immediate neurosurgical referral, ICU or HDU, airway management. Control oedema with steroids and decide definitive local treatment (surgery or radiotherapy) with neuro-oncology and radiation oncology, taking into account performance status, extent of systemic disease and prognosis.</p>"}, {"h": "Pitfalls", "body": "<ul><li>Prophylactic antiepileptics in a patient who has not had a seizure: no benefit, with interactions and toxicity.</li><li>Dexamethasone 16 mg for every patient: match the dose to symptom severity; excess steroid causes myopathy, hyperglycaemia and infection.</li><li>Using mannitol or hyperventilation as more than a temporary measure before surgical decompression.</li><li>Missing haemorrhage into a tumour or hydrocephalus as the cause of sudden deterioration.</li></ul>"}], "related": "Related: MSCC (this module) for steroids in oedema; immunotherapy-related neurotoxicity and its steroid doses are in Tox.", "sources": "Chang SM et al (Congress of Neurological Surgeons; ASCO/SNO endorsement), <em>J Clin Oncol</em> 2019;37:1130–1135 — anticonvulsant prophylaxis &amp; steroid use in metastatic brain tumours (DOI 10.1200/JCO.18.02085) · hyperosmolar dosing per Neurocritical Care Society Emergency Neurological Life Support (ICP/herniation). ESMO Handbook ch. 8.", "_hay": "raised intracranial pressure & brain-metastasis crises structural mass effect, vasogenic oedema or haemorrhage from brain metastases raises icp. headache, vomiting, drowsiness, focal deficit, seizure; herniation leads to arrest. recognise herniation: falling gcs, new pupillary asymmetry or a fixed dilated pupil, cushing response (hypertension and bradycardia), abnormal posturing. this is a neurosurgical emergency. airway and breathing first; nurse head-up at about 30° with the head midline; treat hypoxia and hypercapnia. dexamethasone for vasogenic oedema: up to 16 mg/day for severe raised-icp symptoms (4–8 mg/day for milder mass-effect symptoms), with ppi cover. for impending herniation: hyperosmolar therapy (mannitol 0.25–1 g/kg iv over 15–30 min, or 3% hypertonic saline) and call neurosurgery immediately."}, {"id": "airway-obstruction", "name": "Malignant central airway obstruction / stridor", "category": "Structural", "urgency": "Peri-arrest", "grade": "", "post2016": false, "oneliner": "Tumour narrowing the trachea or main bronchi, from within the lumen or by external compression. Causes positional dyspnoea, stridor and monophonic wheeze; a compensated airway can close suddenly.", "act_now": ["Sit the patient up; high-flow humidified O₂; heliox (helium–oxygen) to improve flow through the narrowing while definitive treatment is arranged.", "High-dose corticosteroid for oedema around the tumour; nebulised adrenaline as a temporary measure.", "Call interventional pulmonology or ENT, and anaesthesia, immediately. Definitive relief is urgent rigid bronchoscopy with debulking, with or without a stent.", "Do not sedate, paralyse, or lie the patient flat before the airway is controlled."], "sections": [{"h": "Recognise", "body": "<p>Stridor (fixed obstruction within the chest may give expiratory stridor or monophonic wheeze), dyspnoea on exertion and then with position, cough, haemoptysis. Usually from central lung, thyroid, oesophageal or mediastinal nodal disease: tumour within the lumen, external compression, or both. Signs of imminent arrest: exhaustion, use of accessory muscles, a quiet chest, falling SpO₂ with rising CO₂.</p>"}, {"h": "Confirm", "body": "<p>If the patient is deteriorating, call the interventional team before imaging. When stable: flexible nasendoscopy or bronchoscopy shows the level and whether the obstruction is within the airway or external; CT neck and thorax maps the lesion and the patency of the distal airway; a flow–volume loop shows the pattern of obstruction.</p>"}, {"h": "Manage", "body": "<ul><li>Temporary measures: sit up; heliox (its lower gas density improves flow past a fixed narrowing); high-flow humidified O₂; high-dose corticosteroid for oedema; nebulised adrenaline.</li><li>Definitive treatment is usually by rigid bronchoscopy: mechanical debulking, laser or cryotherapy for tumour within the lumen; a self-expanding or silicone stent for external compression. Flexible bronchoscopy is for adjunctive procedures only.</li><li>Afterwards: external-beam radiotherapy (or endobronchial brachytherapy) for radiosensitive tumour once the airway is secure; systemic therapy for chemosensitive disease.</li><li>Securing the airway: inhalational or awake technique with the interventionalist and rigid bronchoscope in the room. Avoid routine paralysis or lying the patient flat, which can cause complete obstruction.</li></ul>"}, {"h": "Disposition & escalation", "body": "<p>Imminent arrest: theatre or bronchoscopy suite with thoracic surgery or ENT and anaesthesia; HDU or ICU afterwards. Central airway obstruction usually means advanced disease; agree a ceiling of care early, before deterioration.</p>"}, {"h": "Pitfalls", "body": "<ul><li>Sedation, muscle relaxant, or lying the patient flat before the airway is controlled.</li><li>Calling the stridor asthma or COPD and giving bronchodilators alone.</li><li>Waiting for imaging in a deteriorating patient instead of calling the interventional team.</li></ul>"}], "related": "", "sources": "CHEST expert panel, <em>Management of Central Airway Obstruction</em>, <em>Chest</em> 2024 · Mudambi et al, <em>J Thorac Dis</em> 2017 (overview of malignant CAO). ESMO Handbook ch. 13 (Dyspnoea and Respiratory Failure).", "_hay": "malignant central airway obstruction / stridor structural tumour narrowing the trachea or main bronchi, from within the lumen or by external compression. causes positional dyspnoea, stridor and monophonic wheeze; a compensated airway can close suddenly. sit the patient up; high-flow humidified o₂; heliox (helium–oxygen) to improve flow through the narrowing while definitive treatment is arranged. high-dose corticosteroid for oedema around the tumour; nebulised adrenaline as a temporary measure. call interventional pulmonology or ent, and anaesthesia, immediately. definitive relief is urgent rigid bronchoscopy with debulking, with or without a stent. do not sedate, paralyse, or lie the patient flat before the airway is controlled."}, {"id": "bowel-obstruction", "name": "Malignant bowel obstruction", "category": "Structural", "urgency": "High", "grade": "", "post2016": false, "oneliner": "Mechanical or functional obstruction from intra-abdominal or peritoneal malignancy (commonly ovarian or colorectal). Colicky pain, vomiting, distension, absolute constipation.", "act_now": ["Nil by mouth, wide-bore NG tube on free drainage, IV crystalloid; correct hypokalaemia and hyponatraemia.", "Analgesia (opioid) and an antiemetic (haloperidol). Stop prokinetics if there is colic or complete obstruction.", "Antisecretory: hyoscine butylbromide 60–120 mg/24 h CSCI, or octreotide 300–600 µg/24 h SC or CSCI.", "Dexamethasone 6–16 mg/day IV (may speed resolution); early joint review by surgery and oncology."], "sections": [{"h": "Recognise", "body": "<p>Colicky or constant abdominal pain, vomiting (faeculent when the obstruction is distal), distension, absolute constipation. Distinguish mechanical obstruction from functional causes (opioids, hypokalaemia), and obstruction at one level from obstruction at several; this decides whether surgery or a stent can help.</p>"}, {"h": "Confirm", "body": "<p>Examine for localised tenderness or peritonism (strangulation or perforation). FBC, U&amp;E; correct potassium and sodium. Erect chest and abdominal films, then CT abdomen and pelvis to show the level and cause, whether there is one level or several, and whether surgery, a stent or medical treatment is appropriate.</p>"}, {"h": "Manage", "body": "<ul><li>Decompression and resuscitation: nil by mouth, NG tube on free drainage, IV crystalloid, correct electrolytes.</li><li>Symptom control by CSCI: analgesia (morphine or diamorphine); antiemetic (haloperidol first-line, or cyclizine or levomepromazine); antisecretory (hyoscine butylbromide 60–120 mg/24 h or octreotide 300–600 µg/24 h, up to about 800 µg); corticosteroid (dexamethasone 6–16 mg/day IV, which may lead to resolution).</li><li>Metoclopramide only in incomplete obstruction without colic. Prokinetics worsen colic and are contraindicated in complete obstruction.</li><li>Definitive treatment: surgery (bypass, resection or stoma) for fit patients with a single correctable mechanical level; a self-expanding metal stent for obstructing left-colon or gastroduodenal lesions; medical treatment alone where surgery is not appropriate (diffuse peritoneal disease, poor performance status).</li></ul>"}, {"h": "Disposition & escalation", "body": "<p>Joint decision by surgery, oncology and palliative care; prognosis matters as much as technique. Venting gastrostomy for refractory vomiting when a long-term NG tube is unacceptable.</p>"}, {"h": "Pitfalls", "body": "<ul><li>Missing strangulation or perforation (fever, peritonism, rising lactate) in a patient labelled as inoperable obstruction.</li><li>Prokinetics in complete obstruction or colic.</li><li>Deciding on medical treatment alone without a CT; a single reversible level may be treatable by surgery or a stent.</li></ul>"}], "related": "", "sources": "MASCC evidence-based recommendations, medical management of MBO (2021 update), <em>Support Care Cancer</em> · Feuer &amp; Broadley, Cochrane 2000 (corticosteroids, CD001219) · Ripamonti et al, <em>Support Care Cancer</em> 2000 (hyoscine butylbromide) · Mercadante octreotide RCTs. ESMO Handbook ch. 16 (Obstructive Bowel Disease).", "_hay": "malignant bowel obstruction structural mechanical or functional obstruction from intra-abdominal or peritoneal malignancy (commonly ovarian or colorectal). colicky pain, vomiting, distension, absolute constipation. nil by mouth, wide-bore ng tube on free drainage, iv crystalloid; correct hypokalaemia and hyponatraemia. analgesia (opioid) and an antiemetic (haloperidol). stop prokinetics if there is colic or complete obstruction. antisecretory: hyoscine butylbromide 60–120 mg/24 h csci, or octreotide 300–600 µg/24 h sc or csci. dexamethasone 6–16 mg/day iv (may speed resolution); early joint review by surgery and oncology."}, {"id": "obstructive-uropathy", "name": "Obstructive uropathy & urological emergencies", "category": "Structural", "urgency": "High", "grade": "", "post2016": false, "oneliner": "Malignant ureteric obstruction from pelvic or retroperitoneal tumour or nodes, causing AKI, anuria and hyperkalaemia; or haemorrhagic cystitis with clot retention.", "act_now": ["Bilateral obstruction with AKI, anuria or urosepsis: urgent decompression by percutaneous nephrostomy or retrograde ureteric stent. Do not wait.", "Check U&amp;E and potassium; treat hyperkalaemia immediately.", "Haemorrhagic cystitis: 3-way catheter with continuous bladder irrigation; evacuate clots. Mesna is prophylaxis, not treatment.", "Renal-tract ultrasound (hydronephrosis), with or without CT; involve urology now; expect post-obstructive diuresis after relief."], "sections": [{"h": "Recognise", "body": "<ul><li>Obstructive uropathy: bilateral ureteric obstruction, or obstruction of a single functioning kidney, from pelvic or retroperitoneal tumour or nodal disease. Causes AKI and anuria; hyperkalaemia and uraemia are the causes of death.</li><li>Haemorrhagic cystitis: visible haematuria or clot retention after cyclophosphamide or ifosfamide (acrolein toxicity), pelvic radiotherapy, or BK virus or adenovirus in immunosuppressed patients.</li></ul>"}, {"h": "Confirm", "body": "<p>U&amp;E, potassium, venous gas. Renal-tract ultrasound for hydronephrosis, with or without non-contrast CT for level and cause. Catheterise for retention or clot. If bleeding: FBC, coagulation, group and save.</p>"}, {"h": "Manage", "body": "<ul><li>Decompression: percutaneous nephrostomy or retrograde ureteric stent. Nephrostomy is often preferred in malignant obstruction because technical success is higher; a stent where feasible. Treat hyperkalaemia and uraemic complications at the same time; dialysis if refractory.</li><li>Haemorrhagic cystitis: 3-way catheter with continuous bladder irrigation, manual or cystoscopic clot evacuation. Prophylaxis for ifosfamide (and high-dose cyclophosphamide) is hyperhydration plus mesna, in total 60–100% of the oxazaphosphorine dose, for example 20% IV at 0, 4 and 8 h. For refractory bleeding: intravesical agents, cystoscopic diathermy, or arterial embolisation.</li><li>Post-obstructive diuresis: after relief of bilateral obstruction, monitor urine output and replace fluid and electrolytes; losses can be very large.</li></ul>"}, {"h": "Disposition & escalation", "body": "<p>Urology and nephrology. In advanced disease, consider whether decompression fits the goals of care; before a nephrostomy in end-stage malignant obstruction, discuss frankly with the patient what it can achieve.</p>"}, {"h": "Pitfalls", "body": "<ul><li>Discharging an anuric patient with bilateral obstruction; hyperkalaemia can be rapidly fatal.</li><li>Giving mesna as treatment for established cystitis; it is prophylaxis only.</li><li>Replacing too little fluid during post-obstructive diuresis.</li></ul>"}], "related": "", "sources": "ESMO Handbook ch. 9 (Renal Failure and Urological Emergencies) · ASCO chemotherapy uroprotectant guideline (Hensley et al, <em>JCO</em> 2009) for mesna dosing · urological-emergency reviews.", "_hay": "obstructive uropathy & urological emergencies structural malignant ureteric obstruction from pelvic or retroperitoneal tumour or nodes, causing aki, anuria and hyperkalaemia; or haemorrhagic cystitis with clot retention. bilateral obstruction with aki, anuria or urosepsis: urgent decompression by percutaneous nephrostomy or retrograde ureteric stent. do not wait. check u&e and potassium; treat hyperkalaemia immediately. haemorrhagic cystitis: 3-way catheter with continuous bladder irrigation; evacuate clots. mesna is prophylaxis, not treatment. renal-tract ultrasound (hydronephrosis), with or without ct; involve urology now; expect post-obstructive diuresis after relief."}, {"id": "tls", "name": "Tumour lysis syndrome", "category": "Metabolic", "urgency": "High", "grade": "", "post2016": false, "oneliner": "Rapid breakdown of a large number of tumour cells causing hyperkalaemia, hyperphosphataemia, hyperuricaemia and hypocalcaemia, with or without AKI; occurs around treatment of bulky or rapidly proliferating disease.", "act_now": ["Isotonic IV fluids at a high rate (about 2500–3000 mL/m²/day; target urine output ≥2 mL/kg/h).", "Rasburicase 0.2 mg/kg IV for high-risk or established TLS. Do not give if G6PD-deficient.", "Continuous cardiac monitoring; treat hyperkalaemia immediately.", "Bloods every 4–6 h (urate, K, PO₄, Ca, creatinine, LDH); involve nephrology early."], "sections": [{"h": "Recognise", "body": "<p>Cairo–Bishop criteria. Laboratory TLS: 2 or more of the following, from 3 days before to 7 days after treatment: uric acid ≥476 µmol/L (8 mg/dL); K⁺ ≥6.0 mmol/L; phosphate ≥1.45 mmol/L (adults); corrected Ca²⁺ ≤1.75 mmol/L. Clinical TLS: laboratory TLS plus one of AKI (creatinine ≥1.5×ULN), cardiac arrhythmia or sudden death, or seizure.</p><p>Howard (2011) changes: the two abnormalities must be present at the same time; the original criterion of a 25% change from baseline is dropped (rarely meaningful unless the value is already out of range); any symptomatic hypocalcaemia counts as clinical TLS.</p><p>Highest risk: Burkitt or lymphoblastic lymphoma, ALL and AML with a high WBC, bulky chemosensitive tumours; higher still with existing renal impairment, volume depletion, or high LDH or urate.</p>"}, {"h": "Confirm", "body": "<p>Urate, K, phosphate, corrected calcium, creatinine, LDH; ECG or telemetry; urine output.</p><p>How often to check: high risk every 4–6 h; intermediate every 8–12 h; low risk daily, through the period of risk (depends on the regimen).</p>"}, {"h": "Manage", "body": "<ul><li>Prophylaxis by risk: low, allopurinol 300 mg/day and hydration; intermediate, allopurinol and hydration (rasburicase if urate rises); high or established, rasburicase 0.2 mg/kg IV daily and high-rate hydration. Do not combine allopurinol with rasburicase; allopurinol removes the substrate rasburicase acts on.</li><li>Fluids: isotonic hyperhydration about 2500–3000 mL/m²/day (highest risk), target urine output ≥2 mL/kg/h. Avoid routine urinary alkalinisation; it increases calcium phosphate precipitation, especially when rasburicase is available. Loop diuretic if urine output stays low despite adequate hydration.</li><li>Hyperkalaemia: calcium gluconate to protect the heart, insulin–dextrose, salbutamol, binders; dialysis if refractory.</li><li>Hyperphosphataemia: phosphate binders.</li><li>Hypocalcaemia: treat only if symptomatic; calcium given when phosphate is high risks calcium phosphate deposition in tissues.</li></ul>"}, {"h": "Grade", "body": "<p>There is no graded severity scale. Cairo–Bishop separates laboratory from clinical TLS (clinical means organ involvement); Howard 2011 gives a clinical grade from 0 to IV.</p>"}, {"h": "Disposition & escalation", "body": "<p>High-risk patients: monitored bed or HDU. Renal replacement therapy for refractory hyperkalaemia, severe hyperphosphataemia or symptomatic hypocalcaemia, fluid overload, or oliguric AKI; involve nephrology or ICU, with lower thresholds than for other AKI. Where possible, control urate before cytoreduction in very-high-risk disease.</p>"}, {"h": "Pitfalls", "body": "<ul><li>Rasburicase in G6PD deficiency (haemolysis, methaemoglobinaemia); screen patients of high-risk ancestry first.</li><li>After rasburicase, send uric acid samples on ice; otherwise urate breaks down in the tube and the result is falsely low.</li><li>Excess alkalinisation. Treating asymptomatic hypocalcaemia.</li></ul>"}], "related": "", "sources": "Cairo &amp; Bishop, <em>Br J Haematol</em> 2004 · Coiffier et al, <em>JCO</em> 2008 (TLS expert panel) · Howard et al, <em>NEJM</em> 2011 · British Society for Haematology (Jones et al) 2015 · NCCN. ESMO Handbook ch. 11.", "_hay": "tumour lysis syndrome metabolic rapid breakdown of a large number of tumour cells causing hyperkalaemia, hyperphosphataemia, hyperuricaemia and hypocalcaemia, with or without aki; occurs around treatment of bulky or rapidly proliferating disease. isotonic iv fluids at a high rate (about 2500–3000 ml/m²/day; target urine output ≥2 ml/kg/h). rasburicase 0.2 mg/kg iv for high-risk or established tls. do not give if g6pd-deficient. continuous cardiac monitoring; treat hyperkalaemia immediately. bloods every 4–6 h (urate, k, po₄, ca, creatinine, ldh); involve nephrology early."}, {"id": "hypercalcaemia", "name": "Hypercalcaemia of malignancy", "category": "Metabolic", "urgency": "High", "grade": "", "post2016": false, "oneliner": "The most common life-threatening metabolic emergency in cancer, usually from PTHrP (humoral) or osteolysis. Dehydration, confusion, constipation, polyuria, AKI. Judge severity by the corrected calcium and the symptoms together.", "act_now": ["Confirm on corrected calcium (or ionised Ca); ECG (short QT, bradyarrhythmia).", "Rehydrate first: 0.9% saline IV ~200–500 mL/h, adjusted to volume status.", "Zoledronic acid 4 mg IV over ≥15 min once rehydrated (reduce/withhold in renal impairment; denosumab if bisphosphonate-refractory or CrCl &lt;30).", "Calcitonin 4 units/kg SC/IM q12h for rapid short-term lowering while the bisphosphonate takes effect."], "sections": [{"h": "Recognise", "body": "<p>Suspect in any patient with cancer and new confusion, dehydration, constipation, polyuria or polydipsia, or AKI. Symptoms depend on how fast the calcium rises as well as on the level.</p><p>Severity (corrected Ca): mild &lt;3.0 mmol/L; moderate 3.0–3.4; severe &gt;3.4 mmol/L (or symptomatic at any level). Severe or symptomatic hypercalcaemia is the emergency.</p><p>Mechanism determines treatment: humoral (PTHrP, most solid tumours); osteolytic (myeloma, breast); 1,25-dihydroxy-vitamin-D-mediated (lymphoma, granulomatous disease), which responds to steroids.</p>"}, {"h": "Confirm", "body": "<p>Corrected calcium = measured total Ca + 0.02 × (40 − albumin g/L); use ionised calcium when albumin or acid–base status is abnormal. PTH (suppressed in malignancy, which distinguishes it from primary hyperparathyroidism), PTHrP, phosphate, magnesium, renal function, ECG. Add 25-OH and 1,25-OH vitamin D if the cause is unclear (lymphoma or granuloma).</p>"}, {"h": "Manage", "body": "<ul><li>Rehydrate first: 0.9% saline ~200–500 mL/h adjusted to volume status (commonly 3–4 L over 24 h); this restores GFR and increases calcium excretion. Watch for fluid overload in cardiac or renal disease.</li><li>Zoledronic acid 4 mg IV over ≥15 min once volume-replete; nadir at day 4–7, effect lasts weeks. CrCl 30–60 mL/min: reduce to 3 mg; avoid if CrCl &lt;30. Keep the patient hydrated to limit nephrotoxicity.</li><li>Denosumab 120 mg SC (repeat on day 8 and day 15, then monthly) for hypercalcaemia refractory to bisphosphonate, or when renal impairment contraindicates a bisphosphonate. No renal dose adjustment, but watch for delayed and sometimes severe hypocalcaemia.</li><li>Calcitonin 4–8 units/kg SC/IM every 6–12 h for the first 24–48 h. It acts within hours and gives a modest fall (~0.3–0.5 mmol/L) until the antiresorptive takes effect; tachyphylaxis by 48–72 h.</li><li>Loop diuretics only for fluid overload after rehydration. They do not lower calcium and are harmful in a volume-depleted patient.</li><li>Glucocorticoids (for example prednisolone 40–60 mg/day) for calcitriol-mediated hypercalcaemia of lymphoma or granulomatous disease.</li><li>Dialysis for severe hypercalcaemia with renal failure or refractory to the above.</li><li>Treat the cancer; lasting control needs effective anticancer treatment.</li></ul>"}, {"h": "Disposition & escalation", "body": "<p>Severe (&gt;3.4 mmol/L) or symptomatic: monitored bed with telemetry and serial calcium and renal function. Nephrology for renal replacement in refractory disease or established renal failure. Recurrent hypercalcaemia means uncontrolled disease; involve the treating oncology team again.</p>"}, {"h": "Pitfalls", "body": "<ul><li>Giving a bisphosphonate before rehydrating; this adds to nephrotoxicity.</li><li>Giving a loop diuretic first-line; it worsens the dehydration that raises the calcium.</li><li>Reading an uncorrected calcium in a patient with low albumin (falsely reassuring).</li><li>Missing delayed hypocalcaemia after denosumab; check calcium and correct vitamin D and magnesium.</li></ul>"}], "related": "", "sources": "Asonitis et al / current UK practice review, <em>Clin Med</em> 2023 (PMID 37775175) · zoledronic acid prescribing information (renal thresholds) · ESMO Handbook ch. 10.", "_hay": "hypercalcaemia of malignancy metabolic the most common life-threatening metabolic emergency in cancer, usually from pthrp (humoral) or osteolysis. dehydration, confusion, constipation, polyuria, aki. judge severity by the corrected calcium and the symptoms together. confirm on corrected calcium (or ionised ca); ecg (short qt, bradyarrhythmia). rehydrate first: 0.9% saline iv ~200–500 ml/h, adjusted to volume status. zoledronic acid 4 mg iv over ≥15 min once rehydrated (reduce/withhold in renal impairment; denosumab if bisphosphonate-refractory or crcl <30). calcitonin 4 units/kg sc/im q12h for rapid short-term lowering while the bisphosphonate takes effect."}, {"id": "hyponatraemia-siadh", "name": "Hyponatraemia / SIADH", "category": "Metabolic", "urgency": "High", "grade": "", "post2016": false, "oneliner": "The most common electrolyte disturbance in cancer; SIADH (SCLC, CNS disease, chemotherapy) is the usual euvolaemic cause. Risk depends on the rate of fall and the symptoms; correcting too fast causes the main harm.", "act_now": ["Grade the symptoms (seizures, obtundation or vomiting = severe) and assess volume status.", "Severe symptoms: 150 mL 3% hypertonic saline IV over 20 min, recheck Na, repeat 1–2 times until symptoms settle or Na has risen 5 mmol/L.", "Limit the rise to ≤10 mmol/L in 24 h and ≤18 mmol/L in 48 h (≤8 mmol/L in 24 h if demyelination risk is high). Over-correction causes osmotic demyelination.", "SIADH: fluid restriction and treatment of the cause. Send paired serum and urine osmolality and urine sodium before any treatment."], "sections": [{"h": "Recognise", "body": "<p>Symptom severity sets the urgency. Severe: seizures, coma or fall in GCS, vomiting, cardiorespiratory distress. Moderate: nausea, confusion, headache. Mild: subtle or none. Symptoms depend on how fast the sodium fell as well as how low it is.</p><p>SIADH, Bartter–Schwartz criteria: clinical euvolaemia, serum osmolality &lt;275 mOsm/kg, urine osmolality &gt;100 mOsm/kg, urine sodium &gt;30 mmol/L (on normal salt and water intake), no diuretic, and normal thyroid and adrenal function. Causes in cancer: ectopic ADH (SCLC and others), CNS metastases, drugs (cyclophosphamide, vincristine, platinum), nausea, pain, opioids.</p>"}, {"h": "Confirm", "body": "<p>Paired serum and urine osmolality and urine sodium; glucose (to exclude translocational hyponatraemia and pseudohyponatraemia); TFTs and 9 am cortisol (hypothyroidism and adrenal insufficiency mimic SIADH); careful volume assessment to separate hypovolaemic, euvolaemic and hypervolaemic causes.</p>"}, {"h": "Manage", "body": "<ul><li>Severe or symptomatic (any sodium level): 150 mL 3% saline over 20 min (about 2 mL/kg), recheck sodium, repeat until symptoms improve or sodium has risen 5 mmol/L. Target a rise of 5 mmol/L in the first hour to relieve cerebral oedema, then stop the hypertonic saline and stay within the daily limit.</li><li>Correction limits: ≤10 mmol/L in the first 24 h and ≤18 mmol/L in the first 48 h. Aim for ≤8 mmol/L in 24 h where demyelination risk is high (sodium &lt;105 mmol/L, hypokalaemia, alcohol-use disorder, malnutrition, advanced liver disease). If the limit is exceeded, lower the sodium again with 5% dextrose, with or without desmopressin.</li><li>Chronic SIADH: fluid restriction to &lt;800–1000 mL/day first line; if not enough, add oral urea, or tolvaptan (a vasopressin-receptor antagonist) with caution. Vaptans can correct too fast and are hepatotoxic; avoid in liver disease and do not use beyond 30 days.</li><li>Treat the cause: systemic therapy for SCLC; stop the causative drug.</li></ul>"}, {"h": "Disposition & escalation", "body": "<p>Severe symptomatic hyponatraemia: HDU or monitored bed, with sodium checked every 2–4 h during active correction. Involve endocrinology or nephrology for refractory SIADH, diagnostic uncertainty, or over-correction that needs active lowering.</p>"}, {"h": "Pitfalls", "body": "<ul><li>Correcting chronic hyponatraemia too quickly; osmotic demyelination does more harm than the low sodium.</li><li>Starting a vaptan during fluid restriction, or in liver disease.</li><li>Diagnosing SIADH without excluding hypothyroidism and adrenal insufficiency.</li><li>Treating the number rather than the patient; asymptomatic chronic hyponatraemia at 125 mmol/L does not need hypertonic saline.</li></ul>"}], "related": "Related: brain or leptomeningeal disease may contribute; see raised ICP (this module).", "sources": "Spasovski et al, European clinical practice guideline on diagnosis and treatment of hyponatraemia, <em>Eur J Endocrinol</em> 2014;170:G1–G47 (PMID 24569125) · Verbalis et al, US expert-panel recommendations, <em>Am J Med</em> 2013 (PMID 24074529; high-risk ≤8 mmol/L target) · ESMO Handbook ch. 12.", "_hay": "hyponatraemia / siadh metabolic the most common electrolyte disturbance in cancer; siadh (sclc, cns disease, chemotherapy) is the usual euvolaemic cause. risk depends on the rate of fall and the symptoms; correcting too fast causes the main harm. grade the symptoms (seizures, obtundation or vomiting = severe) and assess volume status. severe symptoms: 150 ml 3% hypertonic saline iv over 20 min, recheck na, repeat 1–2 times until symptoms settle or na has risen 5 mmol/l. limit the rise to ≤10 mmol/l in 24 h and ≤18 mmol/l in 48 h (≤8 mmol/l in 24 h if demyelination risk is high). over-correction causes osmotic demyelination. siadh: fluid restriction and treatment of the cause. send paired serum and urine osmolality and urine sodium before any treatment."}, {"id": "febrile-neutropaenia", "name": "Febrile neutropaenia & septic shock", "category": "Infective", "urgency": "High", "grade": "", "post2016": false, "oneliner": "Fever in a neutropenic patient is a medical emergency. Treat as sepsis until proven otherwise; manage as septic shock as soon as hypotension or hypoperfusion appears.", "act_now": ["Empirical antipseudomonal β-lactam within 1 hour: piperacillin-tazobactam 4.5 g IV, cefepime 2 g IV, or meropenem 1–2 g IV. Do not wait for the count or cultures.", "Take blood cultures (peripheral and every central lumen), lactate, FBC and renal and liver tests first if this causes no delay; the antibiotic is not held for them.", "If hypotensive or lactate ≥2 mmol/L: Surviving Sepsis bundle; ≥30 mL/kg crystalloid over 3 h, norepinephrine to MAP ≥65 mmHg, source control.", "Add vancomycin only for a specific indication (see Manage); not routinely."], "sections": [{"h": "Recognise", "body": "<p>Neutropenia: ANC &lt;0.5 ×10⁹/L, or &lt;1.0 ×10⁹/L and expected to fall below 0.5 within 48 h.</p><p>Fever: a single oral temperature ≥38.3 °C, or ≥38.0 °C sustained over 1 h.</p><p>A single fever is enough to start treatment; often there is no localising sign and no source. Highest risk: ANC &lt;0.1 ×10⁹/L, expected neutropenia &gt;7 days, haematological malignancy or HSCT. Signs of progression to septic shock: hypotension, lactate ≥2 mmol/L, mottling, new confusion.</p>"}, {"h": "Confirm", "body": "<p>Blood cultures from a peripheral vein and from each central lumen; FBC, renal and liver tests, lactate; urinalysis, CXR and swabs from sites suggested by symptoms. Do not delay the antibiotic for these tests.</p><p>Risk stratification (MASCC index). Score ≥21: low risk of complications, suitable for the oral or outpatient pathway. Score &lt;21: high risk; admit for IV therapy. The index scores burden of illness, no hypotension, no COPD, solid tumour or no previous fungal infection, no dehydration, onset as an outpatient, and age &lt;60.</p>"}, {"h": "Manage", "body": "<ul><li>First dose within 1 h. Antipseudomonal β-lactam alone: piperacillin-tazobactam 4.5 g IV every 6–8 h, cefepime 2 g IV every 8 h, or meropenem 1–2 g IV every 8 h, adjusted to renal function. Carbapenem first line if a resistant organism is likely.</li><li>Vancomycin only for a specific indication: haemodynamic instability or severe sepsis, suspected catheter-related infection, skin or soft-tissue infection, pneumonia, known MRSA colonisation, or Gram-positive cocci in blood before identification. Stop at 48–72 h if not confirmed.</li><li>Low risk (MASCC ≥21), stable and taking oral medicines: oral ciprofloxacin and amoxicillin-clavulanate, with a set pathway for review and readmission. Not if the patient was taking fluoroquinolone prophylaxis.</li><li>Septic shock: Surviving Sepsis bundle; ≥30 mL/kg balanced crystalloid over 3 h, norepinephrine first line to MAP ≥65 mmHg, repeat lactate, remove an infected line. Widen cover for resistant organisms and add antifungal cover if not improving.</li><li>G-CSF is not routine treatment for established FN; its use by risk is as prophylaxis (see Tox).</li></ul>"}, {"h": "Disposition & escalation", "body": "<p>High risk (MASCC &lt;21): admit for IV antibiotics; profound or prolonged neutropenia: monitored bed. Shock, rising lactate or organ dysfunction: ICU. Reassess at 48–72 h: narrow treatment on culture results; continue until afebrile with a recovering ANC. Involve infectious diseases and haematology early.</p>"}, {"h": "Pitfalls", "body": "<ul><li>Delaying the first dose for cultures, imaging or line access; start within the hour.</li><li>Giving vancomycin to every patient; keep it for a specific indication and stop if not confirmed.</li><li>Missing developing shock in a febrile patient who looks stable; recheck lactate and perfusion.</li><li>Applying MASCC to a patient who is already unstable; the index assumes an uncomplicated presentation.</li></ul>"}], "related": "Related: G-CSF prophylaxis (primary and secondary) and FN risk by chemotherapy regimen are in Tox; this card covers the acute episode.", "sources": "Definition, empiric therapy and vancomycin indications: Freifeld AG et al, IDSA clinical practice guideline, <em>Clin Infect Dis</em> 2011;52:e56–e93 (PMID 21205990). Low-risk / outpatient oral pathway: Taplitz RA et al, ASCO–IDSA guideline, <em>J Clin Oncol</em> 2018;36:1443–1453 (PMID 29461916). MASCC index: Klastersky J et al, <em>J Clin Oncol</em> 2000;18:3038–3051 (PMID 10944139). Septic shock: Evans L et al, Surviving Sepsis Campaign 2021, <em>Intensive Care Med</em> 2021;47:1181–1247 (PMID 34599691). ESMO Handbook ch. 21.", "_hay": "febrile neutropaenia & septic shock infective fever in a neutropenic patient is a medical emergency. treat as sepsis until proven otherwise; manage as septic shock as soon as hypotension or hypoperfusion appears. empirical antipseudomonal β-lactam within 1 hour: piperacillin-tazobactam 4.5 g iv, cefepime 2 g iv, or meropenem 1–2 g iv. do not wait for the count or cultures. take blood cultures (peripheral and every central lumen), lactate, fbc and renal and liver tests first if this causes no delay; the antibiotic is not held for them. if hypotensive or lactate ≥2 mmol/l: surviving sepsis bundle; ≥30 ml/kg crystalloid over 3 h, norepinephrine to map ≥65 mmhg, source control. add vancomycin only for a specific indication (see manage); not routinely."}, {"id": "typhlitis", "name": "Neutropenic enterocolitis (typhlitis)", "category": "Infective", "urgency": "High", "grade": "", "post2016": false, "oneliner": "Fever, abdominal pain (often right lower quadrant) and diarrhoea in a neutropenic patient; inflammation and necrosis of the caecum and bowel wall. High mortality if missed.", "act_now": ["Broad-spectrum antibiotics with anaerobic and antipseudomonal Gram-negative cover: piperacillin-tazobactam or a carbapenem (or cefepime plus metronidazole).", "Bowel rest, nasogastric decompression, IV fluids and electrolyte correction.", "Urgent CT abdomen and pelvis; repeated abdominal examination; early surgical review.", "No antimotility or antidiarrhoeal drugs."], "sections": [{"h": "Recognise", "body": "<p>Fever, abdominal pain (classically right lower quadrant, over the caecum) and diarrhoea during neutropenia, typically 1–2 weeks after cytotoxic chemotherapy (high-dose cytarabine, taxanes, intensive induction). Distension, rebound, peritonism or GI bleeding suggest transmural necrosis and impending perforation.</p>"}, {"h": "Confirm", "body": "<p>CT abdomen and pelvis is the test of choice: circumferential bowel-wall thickening (caecum, with or without ascending colon), mural oedema, pericolic fat stranding, with or without pneumatosis. FBC, lactate, coagulation and blood cultures; stool for Clostridioides difficile, the main differential. Avoid colonoscopy; risk of perforation in inflamed neutropenic bowel.</p>"}, {"h": "Manage", "body": "<ul><li>Antibiotics with anaerobic cover: piperacillin-tazobactam 4.5 g IV every 6–8 h or meropenem 1 g IV every 8 h; with cefepime, add metronidazole. Add antifungal cover if not improving or neutropenia persists.</li><li>Supportive care: bowel rest, nasogastric tube for ileus or obstruction, IV fluids, correction of electrolytes and coagulopathy, transfusion to target.</li><li>Neutrophil recovery determines outcome; G-CSF is often used to shorten neutropenia.</li><li>Avoid antimotility drugs (loperamide, opioids); they cause stasis and toxin retention and increase the risk of perforation.</li></ul>"}, {"h": "Disposition & escalation", "body": "<p>Admit to a monitored bed with repeated examination and imaging. Involve surgeons early but operate selectively: surgery is for perforation, uncontrolled GI bleeding, or deterioration or suspected necrosis despite full medical treatment. Most cases resolve with neutrophil recovery and conservative care; ICU for haemodynamic instability.</p>"}, {"h": "Pitfalls", "body": "<ul><li>Missing the diagnosis; neutropenia reduces abdominal signs, so keep a low threshold for CT.</li><li>Leaving out anaerobic cover.</li><li>Antimotility drugs, or early colonoscopy.</li><li>Not excluding C. difficile.</li></ul>"}], "related": "", "sources": "Gorschlüter M et al, systematic analysis of neutropenic enterocolitis in adults, <em>Eur J Haematol</em> 2005 (PMID 16504141); Nesher L &amp; Rolston KV, <em>Clin Infect Dis</em> 2013;56:711 (review); current practice syntheses (StatPearls, Medscape). Antibiotic backbone aligns with the IDSA febrile-neutropenia guideline (Freifeld 2011, PMID 21205990). ESMO Handbook ch. 19.", "_hay": "neutropenic enterocolitis (typhlitis) infective fever, abdominal pain (often right lower quadrant) and diarrhoea in a neutropenic patient; inflammation and necrosis of the caecum and bowel wall. high mortality if missed. broad-spectrum antibiotics with anaerobic and antipseudomonal gram-negative cover: piperacillin-tazobactam or a carbapenem (or cefepime plus metronidazole). bowel rest, nasogastric decompression, iv fluids and electrolyte correction. urgent ct abdomen and pelvis; repeated abdominal examination; early surgical review. no antimotility or antidiarrhoeal drugs."}, {"id": "transfusion-reactions", "name": "Acute transfusion reactions", "category": "Haematological", "urgency": "High", "grade": "", "post2016": false, "oneliner": "Any new fever, hypotension, dyspnoea, rash or pain during or shortly after a transfusion. The dangerous reactions (ABO haemolysis, bacterial sepsis, anaphylaxis, TRALI) start early and at onset can look the same as a benign febrile reaction.", "act_now": ["Stop the transfusion; keep the line open with 0.9% saline.", "Recheck patient identity against the unit and the compatibility label; ABO incompatibility is a bedside identification error.", "ABC and observations; treat by presentation: IM adrenaline 0.5 mg for anaphylaxis, fluids with or without vasopressors for hypotension, O₂ for hypoxia.", "Return the unit and giving set to the laboratory; send FBC, repeat group and crossmatch, DAT, LDH, haptoglobin, bilirubin, coagulation, and blood cultures (patient and unit)."], "sections": [{"h": "Recognise: acute reactions", "body": "<ul><li>Acute haemolytic (ABO incompatibility): fever, loin or infusion-site pain, hypotension, dark urine, DIC, oliguria, within minutes of starting. A medical emergency.</li><li>Febrile non-haemolytic (FNHTR): fever alone, with or without rigors, haemodynamically stable. A diagnosis of exclusion.</li><li>Allergic and anaphylactic: urticaria or pruritus (mild), progressing to bronchospasm, angio-oedema and hypotension (severe; consider IgA deficiency).</li><li>TACO and TRALI (both cause dyspnoea and hypoxia within about 6 h). TACO is circulatory overload: hypertension, raised JVP, positive fluid balance, responds to diuretics; risk in elderly patients and in cardiac or renal disease. TRALI is non-cardiogenic: hypotension, fever, normal JVP, bilateral infiltrates, no response to diuretics; respiratory support and notify the blood service.</li><li>Bacterial contamination (septic reaction): rapid high fever, rigors, hypotension, collapse; most often with platelets (stored at room temperature).</li></ul>"}, {"h": "Confirm", "body": "<p>Bedside identity check first. Haemolysis: DAT, repeat crossmatch, LDH, haptoglobin, bilirubin, free haemoglobin, urinalysis. Sepsis: paired blood cultures (patient and unit) and Gram stain of the unit. Respiratory: CXR to separate TACO from TRALI; raised BNP and positive fluid balance favour TACO.</p>"}, {"h": "Manage by type", "body": "<ul><li>Mild febrile: paracetamol; slow the transfusion and observe closely, or restart with caution if the fever settles and there are no other features.</li><li>Mild allergic (urticaria only): antihistamine; may restart slowly under observation.</li><li>Anaphylaxis: stop permanently; IM adrenaline 0.5 mg (500 µg), repeated every 5 min as needed; O₂, IV fluids, antihistamine or steroid as adjuncts. Use washed or IgA-deficient components in future.</li><li>Acute haemolytic: stop; IV fluids at a high rate to maintain urine output; support for DIC and AKI. Treat as an ABO error until proven otherwise and inform the laboratory and haematology.</li><li>TACO: stop or slow; sit the patient up, O₂, IV furosemide. If transfusion is still needed, restart at a lower rate with diuretic cover.</li><li>TRALI: stop; respiratory support (may need ventilation) and supportive care. Do not give diuretics. Notify the blood service (implicated donor).</li><li>Septic: stop; cultures (patient and unit), broad-spectrum IV antibiotics, resuscitation; return the unit for Gram stain and culture.</li></ul>"}, {"h": "Disposition & escalation", "body": "<p>Haemodynamic or respiratory compromise: ICU. Notify the hospital transfusion laboratory and team early, and report serious reactions to the national haemovigilance scheme (for example SHOT and SABRE in the UK). Do not issue further components for that patient until the cause is known.</p>"}, {"h": "Pitfalls", "body": "<ul><li>Not stopping for a fever alone; early ABO haemolysis and bacterial sepsis cannot be told apart from a benign febrile reaction at onset.</li><li>Giving diuretics in TRALI (it is not volume overload).</li><li>Skipping the bedside identity check, the cause of most fatal ABO errors.</li><li>Discarding the unit before it can be cultured and Gram-stained.</li></ul>"}], "related": "Related: DIC (this module) may complicate acute haemolytic reactions; febrile neutropenia (this module) overlaps the septic differential.", "sources": "Tinegate et al, BCSH/BSH guideline on the investigation and management of acute transfusion reactions, <em>Br J Haematol</em> 2013;159:143–153 (PMID 22928769) · ESMO Handbook ch. 22.", "_hay": "acute transfusion reactions haematological any new fever, hypotension, dyspnoea, rash or pain during or shortly after a transfusion. the dangerous reactions (abo haemolysis, bacterial sepsis, anaphylaxis, trali) start early and at onset can look the same as a benign febrile reaction. stop the transfusion; keep the line open with 0.9% saline. recheck patient identity against the unit and the compatibility label; abo incompatibility is a bedside identification error. abc and observations; treat by presentation: im adrenaline 0.5 mg for anaphylaxis, fluids with or without vasopressors for hypotension, o₂ for hypoxia. return the unit and giving set to the laboratory; send fbc, repeat group and crossmatch, dat, ldh, haptoglobin, bilirubin, coagulation, and blood cultures (patient and unit)."}, {"id": "dic", "name": "Disseminated intravascular coagulation", "category": "Haematological", "urgency": "High", "grade": "", "post2016": false, "oneliner": "Consumptive coagulopathy caused by an underlying trigger (sepsis, APL or other malignancy, obstetric emergency, trauma), with microvascular thrombosis and bleeding at the same time. Treatment of DIC is treatment of the trigger.", "act_now": ["Identify and treat the trigger now: sepsis (source control and antibiotics), APL, solid tumour. This is the only definitive treatment.", "Send a DIC screen: platelets, PT and APTT, fibrinogen, D-dimer or FDP. Repeat it regularly; DIC changes over hours.", "Score with the ISTH overt-DIC criteria (≥5 = overt DIC).", "Give blood products according to bleeding and the trend, not laboratory values alone."], "sections": [{"h": "Recognise", "body": "<p>Bleeding (oozing from cannula sites or wounds, mucosal bleeding, ecchymoses) or thrombosis, or both, with organ dysfunction. Suspect in septic shock, acute promyelocytic leukaemia and other acute leukaemias, and metastatic mucin-secreting adenocarcinoma. Chronic compensated DIC (solid tumours) often presents with thrombosis (Trousseau syndrome) rather than bleeding.</p>"}, {"h": "Confirm: ISTH overt-DIC score", "body": "<p>Use only when there is an underlying disorder known to cause DIC.</p><ul class='grade'><li><span class='g'>Platelets</span> &gt;100 = 0 · 50–100 = 1 · &lt;50 = 2</li><li><span class='g'>Fibrin marker</span> (D-dimer or FDP): no rise = 0 · moderate = 2 · strong = 3</li><li><span class='g'>PT prolongation</span> &lt;3 s = 0 · 3–6 s = 1 · &gt;6 s = 2</li><li><span class='g'>Fibrinogen</span> &gt;1 g/L = 0 · &lt;1 g/L = 1</li></ul><p>≥5 = overt DIC (repeat the score daily); &lt;5 suggests non-overt DIC; repeat in 1–2 days. The score supports the diagnosis; it does not replace the clinical picture or the serial trend.</p>"}, {"h": "Manage", "body": "<ul><li>Treat the trigger: antibiotics and source control for sepsis; start ATRA immediately for suspected APL. Nothing else reverses DIC.</li><li>Blood products only for bleeding, high bleeding risk, or before a procedure:<ul><li>Platelets if bleeding and &lt;50 × 10⁹/L, or not bleeding and &lt;20 × 10⁹/L.</li><li>FFP if bleeding with PT or APTT &gt;1.5 × normal.</li><li>Fibrinogen concentrate or cryoprecipitate if fibrinogen stays &lt;1.5 g/L despite FFP.</li></ul></li><li>Heparin: prophylactic-dose LMWH for VTE prophylaxis in DIC without bleeding; therapeutic anticoagulation only where thrombosis predominates (Trousseau syndrome, purpura fulminans). Not routine, and not during bleeding.</li><li>Do not correct laboratory values in a stable patient who is not bleeding.</li></ul>"}, {"h": "Disposition & escalation", "body": "<p>Haemodynamic instability or major bleeding: ICU. Involve haematology urgently; suspected APL needs immediate haematology referral the same day.</p>"}, {"h": "Pitfalls", "body": "<ul><li>APL with DIC: start ATRA on clinical suspicion, before genetic confirmation, and give full coagulation support (platelets &gt;30–50 × 10⁹/L, fibrinogen &gt;1.5 g/L). Early death in APL is mainly from the coagulopathy, not leukostasis; avoid invasive procedures that are not needed.</li><li>Transfusing to a laboratory target in a patient who is not bleeding.</li><li>Missing APL as the cause of coagulopathy in a new acute leukaemia.</li><li>Withholding VTE prophylaxis in DIC without bleeding.</li><li>Expecting the values to correct before the trigger is controlled; they do not.</li></ul>"}], "related": "Related: febrile neutropenia and septic shock (this module), the most common trigger of DIC; acute haemolytic transfusion reactions (this module) can also cause DIC.", "sources": "Levi et al, BCSH guideline on the diagnosis and management of disseminated intravascular coagulation, <em>Br J Haematol</em> 2009;145:24–33 (PMID 19222477) · Taylor et al, ISTH/SSC overt-DIC scoring system, <em>Thromb Haemost</em> 2001;86:1327–1330 (PMID 11816725) · ESMO Handbook ch. 22.", "_hay": "disseminated intravascular coagulation haematological consumptive coagulopathy caused by an underlying trigger (sepsis, apl or other malignancy, obstetric emergency, trauma), with microvascular thrombosis and bleeding at the same time. treatment of dic is treatment of the trigger. identify and treat the trigger now: sepsis (source control and antibiotics), apl, solid tumour. this is the only definitive treatment. send a dic screen: platelets, pt and aptt, fibrinogen, d-dimer or fdp. repeat it regularly; dic changes over hours. score with the isth overt-dic criteria (≥5 = overt dic). give blood products according to bleeding and the trend, not laboratory values alone."}, {"id": "hyperviscosity-leukostasis", "name": "Hyperviscosity syndrome / leukostasis", "category": "Haematological", "urgency": "High", "grade": "", "post2016": false, "oneliner": "Two emergencies of impaired blood flow: paraprotein hyperviscosity (Waldenström macroglobulinaemia or myeloma) and leukostasis (acute leukaemia with a very high blast count). Both cause visual, neurological and mucosal or respiratory symptoms; both need urgent reduction of the paraprotein or the blast count.", "act_now": ["Paraprotein hyperviscosity: urgent plasma exchange and treatment of the underlying clone. If symptomatic, do not wait for a viscosity result.", "Leukostasis: urgent cytoreduction with hydroxyurea or leukapheresis, or both, then induction chemotherapy; start TLS prophylaxis (hydration plus rasburicase or allopurinol).", "Avoid red cell transfusion until cytoreduced; added red cells raise viscosity and can worsen occlusion. Correct thrombocytopenia and coagulopathy.", "Fundoscopy, neurological and respiratory assessment; senior haematology review now."], "sections": [{"h": "Recognise", "body": "<p>Paraprotein hyperviscosity: high circulating monoclonal protein, usually IgM in Waldenström macroglobulinaemia (also IgA or IgG myeloma). Classic triad: mucosal bleeding (epistaxis, gum bleeding), visual disturbance (retinopathy with dilated, segmented retinal veins and haemorrhages), and neurological signs (headache, vertigo, confusion, coma). Symptoms are usual once serum viscosity exceeds about 4 cP, although the threshold varies between patients.</p><p>Leukostasis: symptomatic occlusion of small vessels by leukaemic blasts, typically AML with WBC &gt;100 ×10⁹/L (some series report risk from about 50–75; ALL and chronic leukaemias tolerate much higher counts). Presents with hypoxia or dyspnoea and pulmonary infiltrates, and neurological signs (confusion, visual change, headache); fever is common. Hyperleukocytosis is the laboratory finding; leukostasis is the clinical syndrome.</p>"}, {"h": "Confirm", "body": "<p>Hyperviscosity: serum viscosity, immunoglobulins and paraprotein quantification, serum protein electrophoresis; fundoscopy; FBC, renal function, calcium. Treat on clinical grounds; do not wait for viscosity if the patient is symptomatic.</p><p>Leukostasis: FBC and blast count, film, coagulation and fibrinogen (to exclude DIC, especially in APL), LDH, urate, potassium, phosphate, calcium and creatinine (TLS), ABG and CXR. The diagnosis is clinical; normal imaging does not exclude it.</p>"}, {"h": "Manage", "body": "<ul><li>Paraprotein hyperviscosity: urgent therapeutic plasma exchange removes the paraprotein and relieves symptoms while definitive treatment starts. IgM is mostly intravascular, so a modest fall in concentration lowers viscosity substantially. Follow at once with treatment of the clone; repeat exchange according to symptoms.</li><li>Leukostasis: urgent cytoreduction. Hydroxyurea can start before the leukaemia subtype is confirmed. Leukapheresis lowers the count rapidly in symptomatic hyperleukocytosis (an adjunct, with no proven survival benefit) and is avoided in acute promyelocytic leukaemia (it worsens the coagulopathy). Definitive control is prompt induction chemotherapy.</li><li>TLS prophylaxis for leukostasis: IV hydration plus rasburicase (high risk) or allopurinol, with close electrolyte monitoring.</li><li>Transfusion: withhold red cells until the count or paraprotein is reduced, unless anaemia is critical; platelets and FFP as needed for bleeding or coagulopathy.</li></ul>"}, {"h": "Disposition & escalation", "body": "<p>Both are haematological emergencies needing a monitored bed and immediate haematology involvement; arrange apheresis (plasma exchange or leukapheresis) urgently. ICU for respiratory failure or reduced consciousness. Early mortality in leukostasis is high; cytoreduction and induction must not be delayed.</p>"}, {"h": "Pitfalls", "body": "<ul><li>Transfusing red cells before the paraprotein or white count is reduced.</li><li>Waiting for a viscosity result before plasma exchange in a symptomatic patient.</li><li>Forgetting TLS prophylaxis when reducing a high blast count.</li><li>Leukapheresis in APL; it worsens the coagulopathy. Give ATRA and coagulation support first.</li></ul>"}], "related": "Related: TLS (this module, Metabolic). Leukostasis and its treatment can cause tumour lysis; give TLS prophylaxis at the same time.", "sources": "Leukostasis / hyperleukocytosis: Röllig C &amp; Ehninger G, 'How I treat hyperleukocytosis in acute myeloid leukemia,' <em>Blood</em> 2015;125:3246–3252 (PMID 25778528). Paraprotein hyperviscosity: Gertz MA et al, hyperviscosity in paraprotein-secreting conditions, <em>Front Oncol</em> 2020;10:815 (PMC7248405). ESMO Handbook ch. 22–23
