p>The N2 subdivision redistributes several groupings.</p>\n<div class=\"tblwrap\"><table><thead><tr><th scope=\"col\">Category</th><th scope=\"col\">AJCC 8</th><th scope=\"col\">AJCC 9</th></tr></thead><tbody><tr><td>T1N1</td><td>IIB</td><td>IIA</td></tr><tr><td>T1N2</td><td>IIIA</td><td>IIB if N2a; IIIA if N2b</td></tr><tr><td>T2N2</td><td>IIIA</td><td>IIIA if N2a; IIIB if N2b</td></tr><tr><td>T3N2</td><td>IIIB</td><td>IIIA if N2a; IIIB if N2b</td></tr><tr><td>T4N2</td><td>IIIB</td><td>IIIB</td></tr></tbody></table></div>\n<p>Single-station N2 disease is therefore now staged one grouping lower than multi-station N2 disease at every T category from T1 to T3, which formalises a distinction that surgical selection has long made informally.</p>\n<h3>Radiographic staging</h3>\n<p>Baseline imaging is contrast-enhanced CT of the thorax and abdomen including the adrenals, together with MRI of the brain. PET-CT should be used selectively rather than universally, its main purpose being to exclude occult regional or distant metastasis in patients otherwise considered operable. The clearest indication is upfront resectable stage I–II disease at intermediate risk of N2 or N3 involvement, meaning a centrally located tumour or T1-3 N1 M0 disease, where a positive scan upstages the patient to stage III and changes the treatment intent. The evidence for PET is in operable candidates, with a surgical rather than radiological endpoint. In <a class=\"trial-link\" href=\"/evidence/#t-plus-trial-van-tinteren-et-al\">PLUS trial (van Tinteren et al.)</a>, 188 patients with suspected operable NSCLC were randomised to conventional preoperative work-up with or without whole-body FDG-PET, and the addition of PET reduced futile thoracotomy from 41% to 21% by detecting unsuspected advanced or metastatic disease (Lancet 2002;359:1388-1393). One futile thoracotomy is avoided for roughly every five patients scanned. <a class=\"trial-link\" href=\"/evidence/#t-fischer-et-al-pet-ct-staging\">Fischer et al. (PET-CT staging)</a> reproduced the finding with integrated PET-CT in 189 patients with operable stage I–IIIA disease, reducing both total and futile thoracotomies against conventional staging without increasing the number of curable cancers missed (N Engl J Med 2009;361:32-39). <a class=\"trial-link\" href=\"/evidence/#t-maziak-et-al-pet-ct-staging\">Maziak et al. (PET-CT staging)</a> made the same point from the staging side in 337 patients with clinically resectable stage I–IIIA disease, where PET-CT more often correctly upstaged disease and identified patients who would not benefit from surgery (Ann Intern Med 2009;151:221-228). CT is not an adequate substitute for brain MRI. <a class=\"trial-link\" href=\"/evidence/#t-schoenmaekers-et-al-brain-mri-vs-ce-ct\">Schoenmaekers et al. (brain MRI vs CE-CT)</a> studied neurologically asymptomatic patients with stage III NSCLC already staged by FDG-PET and contrast-enhanced CT, and brain MRI detected occult brain metastases missed by dedicated contrast-enhanced brain CT in a meaningful proportion (Eur J Cancer 2019;115:88-96). The finding supports MRI rather than CT for brain staging of locally advanced disease. Whole-body MRI is an alternative staging pathway where it is available. <a class=\"trial-link\" href=\"/evidence/#t-streamline-l-trial-taylor-et-al\">Streamline L trial (Taylor et al.)</a> compared a whole-body MRI staging pathway, including the brain, with standard staging in 187 patients with newly diagnosed NSCLC judged potentially radically treatable, and found similar per-patient accuracy for metastatic disease with shorter staging time, fewer tests and lower cost (Lancet Respir Med 2019;7:523-532).</p>\n<h3>Mediastinal staging</h3>\n<p>Imaging of the mediastinum is a triage step, not a diagnosis. Two situations require tissue:</p>\n<ul><li>a PET-negative node in the presence of a centrally located tumour;</li><li>a PET-positive node even where EBUS or EUS has already returned a negative result, which still warrants mediastinoscopy.</li></ul>\n<p>Central tumours carry a rate of occult N2 disease that a negative scan does not exclude, and a negative needle result in a PET-avid node is more likely to represent a sampling failure than a true negative.</p>\n<h2 id=\"s-screening\">Screening</h2>\n<p>The randomised evidence that low-dose CT screening reduces lung-cancer mortality sits in the early and locally advanced disease chapter. Who the guidelines send for a scan determines which patients arrive for the classification and staging work above. Guideline eligibility has drifted wider than either founding trial&#x27;s entry criteria. NCCN&#x27;s 2022 guidance recommends annual low-dose CT for high-risk patients from age 50 with at least 20 pack-years. On age and smoking intensity that is looser than <a class=\"trial-link\" href=\"/evidence/#t-nlst-national-lung-screening-trial\">NLST (National Lung Screening Trial)</a>, which required age 55–74 and at least 30 pack-years, but it is not looser than <a class=\"trial-link\" href=\"/evidence/#t-nelson-dutch-belgian-lung-cancer-screening\">NELSON (Dutch-Belgian Lung Cancer Screening)</a>, which screened from age 50 at a smoking floor below 20 pack-years. Where the guidance goes beyond both trials is at the other end: it sets no upper age limit, against a cap of 74 in each, and imposes no quit-window, against a requirement to have stopped within 15 years in NLST and within 10 in NELSON. An older patient, or one who stopped smoking two decades ago, is therefore being screened on extrapolation; a 52-year-old with 22 pack-years is not, and sits inside the population NELSON enrolled. Whether widening eligibility improves or worsens the harm-benefit balance is not answered by either trial, and neither tests a risk-prediction model against its own criterion.</p>\n<p>Screening never-smokers remains unsettled. The TALENT trial has not demonstrated a survival benefit for low-dose CT screening in non-smokers.</p>\n<h2 id=\"s-references\">References</h2>\n<ol class=\"refs\">\n<li><a class=\"trial-link\" href=\"/evidence/#t-robichaux-et-al-structure-based-egfr-classification\">Robichaux et al. (structure-based EGFR classification)</a>. <a href=\"https://drive.google.com/file/d/1Dd5z6PtW299ZzhpvfaeT1K2VEuzptEtV/preview\">Nature 2021;597:732-737</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-lux-lung-2-3-6-pooled-yang\">LUX-Lung 2/3/6 pooled (Yang)</a>. <a href=\"https://drive.google.com/file/d/1b8pM0ObTDVuYZpErcjwNbcyqguZAbQfk/preview\">Lancet Oncol 2015;16:830-838</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-plus-trial-van-tinteren-et-al\">PLUS trial (van Tinteren et al.)</a>. <a href=\"https://pubmed.ncbi.nlm.nih.gov/11978336/\">Lancet 2002;359:1388-1393</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-fischer-et-al-pet-ct-staging\">Fischer et al. (PET-CT staging)</a>. <a href=\"https://drive.google.com/file/d/11KTL5Dq2_tSdjS4n6nCOa6Iizl0uhSy9/preview\">N Engl J Med 2009;361:32-39</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-maziak-et-al-pet-ct-staging\">Maziak et al. (PET-CT staging)</a>. <a href=\"https://pubmed.ncbi.nlm.nih.gov/19581636/\">Ann Intern Med 2009;151:221-228</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-schoenmaekers-et-al-brain-mri-vs-ce-ct\">Schoenmaekers et al. (brain MRI vs CE-CT)</a>. <a href=\"https://www.sciencedirect.com/science/article/abs/pii/S0959804919302710\">Eur J Cancer 2019;115:88-96</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-streamline-l-trial-taylor-et-al\">Streamline L trial (Taylor et al.)</a>. <a href=\"https://drive.google.com/file/d/11HgI4QuZS9zna7ZzRfeBdZtsjdaG2zSm/preview\">Lancet Respir Med 2019;7:523-532</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-nlst-national-lung-screening-trial\">NLST (National Lung Screening Trial)</a>. <a href=\"https://drive.google.com/file/d/1x7mTwYG0HcjeNpgVzTAxcnzh89hmXSIX/preview\">N Engl J Med 2011;365:395-409</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-nelson-dutch-belgian-lung-cancer-screening\">NELSON (Dutch-Belgian Lung Cancer Screening)</a>. <a href=\"https://drive.google.com/file/d/1_FzXzWjbm8izCHEDV2mXjTaL141Uvj0h/preview\">N Engl J Med 2020;382:503-513</a></li>\n</ol>", "_hay": "nsclc: classification, staging and molecular profile nsclc-classification-staging-and-molecular-profile lung histological classification histopathology and immunohistochemistry molecular profile of adenocarcinoma molecular testing: what each assay detects tissue acquisition staging screening references classifying egfr mutations nodal stations changes between staging editions radiographic staging mediastinal staging"}, {"id": "lung-nsclc-early-and-locally-advanced-disease", "slug": "nsclc-early-and-locally-advanced-disease", "group": "Lung", "title": "NSCLC: early and locally advanced disease", "updated": "", "sections": [{"id": "s-screening", "h": "Screening"}, {"id": "s-staging-for-curative-intent", "h": "Staging for curative intent"}, {"id": "s-fitness-for-surgery-and-the-operation", "h": "Fitness for surgery, and the operation"}, {"id": "s-stage-i-where-the-evidence-says-do-less", "h": "Stage I: where the evidence says do less"}, {"id": "s-adjuvant-chemotherapy", "h": "Adjuvant chemotherapy"}, {"id": "s-adjuvant-targeted-therapy", "h": "Adjuvant targeted therapy"}, {"id": "s-adjuvant-immunotherapy", "h": "Adjuvant immunotherapy"}, {"id": "s-neoadjuvant-and-perioperative-chemo-immunotherapy", "h": "Neoadjuvant and perioperative chemo-immunotherapy"}, {"id": "s-neoadjuvant-targeted-therapy", "h": "Neoadjuvant targeted therapy"}, {"id": "s-post-operative-radiotherapy", "h": "Post-operative radiotherapy"}, {"id": "s-stage-iii-the-resectability-decision", "h": "Stage III: the resectability decision"}, {"id": "s-unresectable-stage-iii-definitive-chemoradiation", "h": "Unresectable stage III: definitive chemoradiation"}, {"id": "s-consolidation-after-chemoradiation", "h": "Consolidation after chemoradiation"}, {"id": "s-surveillance", "h": "Surveillance"}, {"id": "s-references", "h": "References"}], "html": "<h2 id=\"s-screening\">Screening</h2>\n<p>Screening is given to people who have no diagnosis, and its endpoint is mortality in an unselected population rather than survival in a treated one. <a class=\"trial-link\" href=\"/evidence/#t-nlst-national-lung-screening-trial\">NLST (National Lung Screening Trial)</a> randomised 53,454 people at 33 US centres, aged 55 to 74 with at least 30 pack-years, either current smokers or former smokers who had quit within 15 years, to three annual rounds of low-dose CT or single-view chest radiography. Over a median 6.5 years, low-dose CT reduced lung-cancer mortality by 20.0% (247 vs 309 deaths per 100,000 person-years; 95% CI 6.8 to 26.7; P=0.004) and all-cause mortality by 6.7% (95% CI 1.2 to 13.6; P=0.02), with a number needed to screen of 320 (N Engl J Med 2011;365:395-409). The cost is a large work-up burden: 24.2% of low-dose CT screens were positive against 6.9% of radiographs, and 96.4% of the CT positives were false positives. <a class=\"trial-link\" href=\"/evidence/#t-nelson-dutch-belgian-lung-cancer-screening\">NELSON (Dutch-Belgian Lung Cancer Screening)</a> confirmed the result against a stronger comparator and with a different nodule rule. It randomised 13,195 high-risk men aged 50 to 74, with the primary analysis prespecified in them, and 2594 women analysed as a subgroup, to four rounds of volume-based low-dose CT at baseline, year 1, year 3 and year 5.5, or to no screening at all. At 10 years, lung-cancer mortality among the men was 2.50 versus 3.30 deaths per 1000 person-years, a cumulative rate ratio of 0.76 (95% CI 0.61 to 0.94; P=0.01), and screen-detected cancers were stage IA or IB in 58.6% of cases (N Engl J Med 2020;382:503-513). The operating characteristics were very different from NLST&#x27;s, with 1.2% of screens false-positive and 2.1% of participants referred, under a protocol that called a scan positive on nodule volume and volume-doubling time rather than a single-round diameter threshold. The women&#x27;s rate ratio was 0.67 (95% CI 0.38 to 1.14), directionally consistent but underpowered. The two trials are not a head-to-head, and their effect sizes and false-positive rates should not be compared directly: comparator, population, interval and follow-up all differ. What they jointly establish is that two materially different CT protocols each reduced lung-cancer mortality against their own control, and what NELSON adds is that a much lower work-up burden can coexist with that benefit, plausibly but not demonstrably because of the volumetric rule. Who to screen remains open, since neither tested a broader population or a risk-model-based selection rule against its own criterion.</p>\n<h2 id=\"s-staging-for-curative-intent\">Staging for curative intent</h2>\n<p>Staging here answers one question: can this patient be cured by local treatment, and if so which one. The T, N and M category definitions, the AJCC 9th-edition N2 subdivision, the nodal-station map, and the randomised trials behind the staging investigations themselves all sit in the classification chapter.</p>\n<p>Two consequences carry into the decisions below.</p>\n<ul><li>Whole-body PET-CT before an operation exists to prevent a thoracotomy that cannot cure, and it substantially reduces the rate of futile thoracotomy by finding nodal and distant disease that conventional work-up misses; that is why a patient who looks resectable on CT alone is not yet a surgical candidate.</li><li>Brain MRI rather than contrast-enhanced CT is the right test before radical treatment of locally advanced disease, because MRI finds occult metastases in neurologically asymptomatic patients that dedicated brain CT does not show.</li></ul>\n<h3>Mediastinal nodal staging</h3>\n<p>Imaging alone is not sufficient to commit a patient to or exclude a patient from surgery. Invasive mediastinal staging is required where a PET-negative node accompanies a centrally located tumour, and where a node is PET-positive; in the second case a negative EBUS or EUS should still be followed by mediastinoscopy, because the pre-test probability is high enough that a negative needle does not settle the question.</p>\n<h2 id=\"s-fitness-for-surgery-and-the-operation\">Fitness for surgery, and the operation</h2>\n<p>Cardiopulmonary reserve is assessed before the resection is planned. As minimum thresholds, pneumonectomy requires an FEV1 above 2 litres and lobectomy an FEV1 above 1.5 litres, with a predicted post-pneumonectomy volume of 0.8 litres as the floor; radiotherapy requires an FEV1 above 1 litre. The ACCP algorithm formalises this on FEV1 and DLCO: both at or above 80% predicted needs no further testing, and where either falls below 80% the predicted post-operative values decide, with 60% or above low risk, 30 to 60% prompting an incremental shuttle walk or stair-climbing test, and below 30% prompting cardiopulmonary exercise testing. The ERS approach goes to exercise testing directly.</p>\n<ul><li>Anatomical resection is preferred and lobectomy is the default, since pneumonectomy carries more morbidity for equivalent oncological control and wedge resection carries more recurrence.</li><li>Segmentectomy or wedge resection is appropriate where poor reserve or comorbidity contraindicates lobectomy, or for a peripheral nodule of 2 cm or less that is pure adenocarcinoma in situ, has 50% or more ground-glass appearance on CT, or has a doubling time of 400 days or longer.</li><li>Margins should be 2 cm or greater, or at least the size of the nodule, and T3 or T4 tumours with local extension require en-bloc resection with negative margins.</li></ul>\n<p>Nodal dissection is part of the operation, but its extent is negotiable. ACOSOG Z0030 sampled defined stations in 1111 patients with T1 or T2, N0 or non-hilar N1 disease, and randomised those with negative stations to complete mediastinal lymphadenectomy or no further resection. Occult N2 disease was found in 4%, median survival was 8.5 years, and there was no significant difference in time to local or regional recurrence. Systematic sampling is therefore adequate when the sampled stations are clear. A minimum of three N2 stations should be sampled or a complete dissection performed, and formal ipsilateral mediastinal dissection is indicated for stage IIIA(N2) disease.</p>\n<h2 id=\"s-stage-i-where-the-evidence-says-do-less\">Stage I: where the evidence says do less</h2>\n<p>Adjuvant chemotherapy has no role in stage IA disease, and there is a signal it does harm. The <a class=\"trial-link\" href=\"/evidence/#t-lace-lung-adjuvant-cisplatin-evaluation-meta-analysis\">LACE (Lung Adjuvant Cisplatin Evaluation) meta-analysis</a> pooled individual data from 4584 patients in five cisplatin-based adjuvant trials and found a 5-year absolute overall survival benefit of 5.4% (HR 0.89), concentrated in stage II and III and possibly harmful in stage IA (J Clin Oncol 2008;26:3552-3559). In the stage-stratified analysis the hazard ratio was 1.4 (95% CI 0.95 to 2.06) for stage IA and 0.93 (0.78 to 1.10) for stage IB. Stage IB is less clear-cut. <a class=\"trial-link\" href=\"/evidence/#t-calgb-9633\">CALGB 9633</a> randomised 344 patients with completely resected T2N0 disease to four cycles of paclitaxel 200 mg/m² with carboplatin AUC 6 or to observation, and found no significant overall survival benefit; an exploratory subgroup analysis showed benefit confined to tumours of 4 cm or larger (J Clin Oncol 2008;26:5043-5051). That subgroup is the origin of the 4 cm threshold used to define eligibility in many of the modern neoadjuvant, adjuvant and perioperative trials, and the threshold therefore rests on an exploratory analysis of a negative trial. The one positive stage I result, Kato&#x27;s trial of two years of oral uracil-tegafur in resected stage I adenocarcinoma, favoured tumours larger than 3 cm and has not been reproduced outside Japan. A driver mutation changes this. Patients with resected stage IB EGFR-mutant disease were eligible for <a class=\"trial-link\" href=\"/evidence/#t-adaura\">ADAURA</a> and are treated accordingly, and ADAURA2 is testing three years of adjuvant osimertinib against placebo in stage IA2 to IA3 disease, which is where the current evidence stops.</p>\n<h2 id=\"s-adjuvant-chemotherapy\">Adjuvant chemotherapy</h2>\n<p>Four cycles of a cisplatin doublet after complete resection is the pre-targeted, pre-immunotherapy standard. <a class=\"trial-link\" href=\"/evidence/#t-ialt-international-adjuvant-lung-cancer-trial\">IALT (International Adjuvant Lung Cancer Trial)</a> randomised 1867 patients with completely resected stage I to III disease to cisplatin-based chemotherapy or observation, and the 2004 primary analysis reported 5-year overall survival of 44.5% versus 40.4% (N Engl J Med 2004;350:351-360). The long-term follow-up complicates that reading. At 7.5 years the whole-period overall survival hazard ratio was 0.91 (95% CI 0.81 to 1.02, nominal P=0.10), and the treatment effect differed by follow-up period (nominal interaction P=0.006): 0.86 (0.76 to 0.97) during the first 5 years and 1.45 (1.02 to 2.07) beyond 5 years, with non-lung-cancer mortality at 1.34 (0.99 to 1.81) over the whole period and 2.46 (1.15 to 5.28) beyond 5 years (J Clin Oncol 2010;28:35-42). Disease-free survival held up over the whole period at 0.88 (0.78 to 0.98). The benefit of adjuvant cisplatin is therefore real but front-loaded, and it is partly given back later in deaths that are not from lung cancer. <a class=\"trial-link\" href=\"/evidence/#t-jbr-10-ncic-ctg\">JBR.10 (NCIC CTG)</a> gave cisplatin 50 mg/m² on days 1 and 8 every 4 weeks for four cycles with weekly vinorelbine 25 mg/m² for 16 weeks in 482 patients with resected stage IB to II disease, improving 5-year overall survival from 54% to 69% (HR 0.69), with the benefit confined to stage II and absent in stage IB (N Engl J Med 2005;352:2589-2597). <a class=\"trial-link\" href=\"/evidence/#t-anita\">ANITA</a> extended the same doublet to 840 patients with stage IB to IIIA disease, improving median overall survival from 43.7 to 65.7 months (HR 0.80), again with the benefit greatest in stage II to IIIA (Lancet Oncol 2006;7:719-727). Post-operative radiotherapy in ANITA was not randomised, so its apparent nodal-subgroup effect cannot be read as a PORT result. Cycle number is four in every one of these trials. The partner drug is chosen on histology and toxicity rather than efficacy: pemetrexed in non-squamous disease, gemcitabine or docetaxel in squamous, vinorelbine or etoposide in either, with a carboplatin doublet where cisplatin is not tolerable. JIPANG found cisplatin-pemetrexed was not superior to cisplatin-vinorelbine on recurrence-free survival while causing less febrile neutropenia, neutropenia and anaemia.</p>\n<ul><li>Pemetrexed has the lowest incidence of febrile neutropenia and causes neither alopecia nor neuropathy.</li><li>Vinorelbine has the highest, causes neuropathy, and needs central venous access because it is a vesicant.</li><li>Docetaxel causes alopecia, pneumonitis and hypersensitivity.</li><li>Gemcitabine causes thrombocytopenia.</li></ul>\n<h2 id=\"s-adjuvant-targeted-therapy\">Adjuvant targeted therapy</h2>\n<p>Three oncogenic drivers now have a positive phase 3 adjuvant trial, and the pattern is the same each time: the CNS-active, first-line targeted agent that already works in metastatic disease is given on a fixed schedule after curative-intent local treatment, with recurrence as the endpoint. Of the four driver-matched adjuvant trials, ADAURA is the only one whose survival endpoint has matured. It randomised 682 patients with resected stage IB to IIIA EGFR-mutant disease, exon 19 deletion or L858R, to three years of osimertinib 80 mg daily or placebo, on a background of physician&#x27;s-choice adjuvant chemotherapy. Disease-free survival improved with a hazard ratio of 0.17 (99.06% CI 0.11 to 0.26, P&lt;0.001) in stage II to IIIA and 0.20 (0.14 to 0.30) overall, with fewer CNS recurrences (CNS disease-free survival HR 0.18), and at final analysis 5-year overall survival was 88% versus 78% (HR 0.49, 0.34 to 0.70, P&lt;0.001) (N Engl J Med 2020;383:1711-1723; N Engl J Med 2023;389:137-147). In the updated analysis, median disease-free survival was 65.8 versus 21.9 months in stage II to IIIA and 65.8 versus 28.1 months overall. Most stage II and III patients and about a quarter of stage IB patients had received chemotherapy, so osimertinib is added to that standard rather than substituted for it. Toxicity is the familiar EGFR-TKI set of diarrhoea, paronychia and dry skin, with rare interstitial lung disease and QTc prolongation. The TARGET trial is testing whether five years is better than three. <a class=\"trial-link\" href=\"/evidence/#t-alina\">ALINA</a> asked the same question in ALK-positive disease, with one design difference. It randomised 257 patients with resected stage IB of 4 cm or more to IIIA ALK-positive disease to two years of alectinib 600 mg twice daily or to four cycles of platinum-based chemotherapy, and alectinib improved disease-free survival with a hazard ratio of 0.24 in stage II to IIIA, with fewer CNS recurrences (N Engl J Med 2024;390:1265-1276). Two-year disease-free survival was 93.8% versus 63% in stage II to IIIA and 93.6% versus 63.7% in the intention-to-treat population, the CNS disease-free survival hazard ratio was 0.22, and grade 3 or 4 adverse events occurred in 30% versus 31%. Alectinib&#x27;s toxicity is raised creatine kinase with myalgia, transaminitis and raised bilirubin, weight gain with oedema, and rash. The design difference is that ALINA randomised the TKI against chemotherapy rather than adding it to chemotherapy, so it establishes that a chemotherapy-free targeted course beats the cytotoxic adjuvant it replaces, not that adding a TKI to chemotherapy helps. <a class=\"trial-link\" href=\"/evidence/#t-elevate\">ELEVATE</a> answers the addition question and makes the finding a class result rather than an alectinib property. It randomised 274 patients in China with completely resected stage IB to IIIB ALK-positive disease, after adjuvant chemotherapy, to two years of ensartinib 225 mg daily or placebo. Disease-free survival at 24 months was 86.4% versus 53.5% (HR 0.20) in the stage II to IIIB primary population, with the same hazard ratio overall and immature overall survival (N Engl J Med 2026;395:151-161). Both adjuvant strategies now have a positive trial, chemotherapy-free TKI and chemotherapy-then-TKI, and no trial compares them. <a class=\"trial-link\" href=\"/evidence/#t-libretto-432\">LIBRETTO-432</a> extends the paradigm to a third driver. In 151 patients with stage IB to IIIA RET fusion-positive disease treated with surgery or definitive radiotherapy, up to three years of adjuvant selpercatinib cut recurrence, progression or death by 83% in the stage II to IIIA primary population of 109 patients (2-year event-free survival 92% vs 61%; HR 0.17, 95% CI 0.06 to 0.51, P&lt;0.001) (N Engl J Med 2026, online 31 May). The endpoint is event-free rather than disease-free survival because the trial admitted irradiated as well as resected patients, for whom &quot;disease-free&quot; does not describe the starting state; in practice the population was overwhelmingly surgical. The open question is shared by all four trials. A large recurrence benefit may represent cure, or it may represent recurrences deferred while the drug is given and surfacing once it stops. ADAURA has answered it for EGFR by converting disease-free survival into overall survival at five years. The ALK and RET trials sit one readout behind on a handful of deaths, follow-up in LIBRETTO-432 is shorter than its own three-year course, and crossover to an oncogene-matched TKI at recurrence will dilute any eventual survival difference. The two-year and three-year durations balance benefit against treatment burden; no optimal length has been established.</p>\n<h2 id=\"s-adjuvant-immunotherapy\">Adjuvant immunotherapy</h2>\n<p>Checkpoint blockade started after resection has produced one positive trial with a PD-L1-driven effect, one positive trial without one, and one clear negative. The three differ in how much adjuvant chemotherapy preceded it, which is part of why they disagree. <a class=\"trial-link\" href=\"/evidence/#t-impower010\">IMpower010</a> randomised 1005 patients with resected stage II to IIIA disease who had completed adjuvant platinum chemotherapy to a year of atezolizumab 1200 mg every 3 weeks or best supportive care. Disease-free survival improved in the PD-L1 1% or greater stage II to IIIA population (HR 0.66), with the effect concentrated in the PD-L1-high group, where a second interim overall survival analysis in that subgroup gave a hazard ratio of 0.47 (Lancet 2021;398:1344-1357; J Clin Oncol 2025;43:2343-2349). In PD-L1 all-comers the effect thins out, on a separate analysis cut from the hazard ratios above: disease-free survival 0.83 and overall survival 0.94 in stage II to IIIA, and 0.85 (P=0.07) and 0.97 across stage IB to IIIA. <a class=\"trial-link\" href=\"/evidence/#t-keynote-091-pearls\">KEYNOTE-091 (PEARLS)</a> took the opposite shape. It randomised 1177 patients with resected stage IB to IIIA disease, with adjuvant chemotherapy optional rather than mandatory, to up to a year of pembrolizumab or placebo, and improved disease-free survival in the overall population (HR 0.76) while the PD-L1 50% or greater subgroup was not statistically significant (Lancet Oncol 2022;23:1274-1286). On a separate analysis cut from that hazard ratio, median disease-free survival was 53.8 versus 43.0 months overall, and 67 versus 47.6 months in the PD-L1 50% or greater subgroup with a hazard ratio of 0.83 (95% CI 0.59 to 1.16, P=0.13). Two adjuvant trials of the same class thus disagree about the direction of the PD-L1 gradient, which is why PD-L1 is a weaker predictive marker here than in metastatic monotherapy. <a class=\"trial-link\" href=\"/evidence/#t-anvil-alchemist\">ANVIL (ALCHEMIST)</a> is the most recent of the three and is clearly negative. This open-label phase 3 randomised 935 patients with completely resected disease of 4 cm or more or with N1 to N2 involvement, without sensitising EGFR or ALK alterations, to a year of nivolumab or observation after completed adjuvant chemotherapy with or without radiotherapy. Both co-primary disease-free survival endpoints were missed and the trial stopped for futility: median disease-free survival was 71.3 versus 68.8 months in the intention-to-treat population (HR 0.97, 97% CI 0.79 to 1.20, one-sided p=0.39) and 89.8 versus 78.5 months in the PD-L1 50% or greater population (HR 0.86, 98% CI 0.55 to 1.34, one-sided p=0.22). The hierarchical overall survival gate never opened, disease-free survival was null across every PD-L1 tier, and the squamous subgroup (HR 0.70, 0.49 to 1.00) was the single borderline exploratory signal. Grade 3 to 5 treatment-related events occurred in 25%, with two respiratory treatment-related deaths (JAMA 2026, online 1 Jun). Two features limit how far this generalises. Accrual ran from 2016 to 2019 and predates the perioperative era, and a design that starts immunotherapy only after chemotherapy has finished selects out the patients who relapse early. It is a clean negative for the adjuvant-only sequential design rather than evidence that nivolumab is inactive in resected disease, and the same drug is survival-positive when given before surgery in <a class=\"trial-link\" href=\"/evidence/#t-checkmate-816\">CheckMate 816</a>. BR.31 was similarly negative for its primary disease-free survival endpoint with two years of adjuvant durvalumab against placebo in 1415 patients with resected stage IB of 4 cm or more to IIIA disease, with that primary endpoint tested in the PD-L1 25% or greater population.</p>\n<h2 id=\"s-neoadjuvant-and-perioperative-chemo-immunotherapy\">Neoadjuvant and perioperative chemo-immunotherapy</h2>\n<h3>The strategy question before the trials</h3>\n<p>Curative-intent checkpoint therapy around an operation takes three shapes: neoadjuvant only, a perioperative sandwich given before and after, and adjuvant only. All three have positive trials, and no completed trial isolates whether the post-operative phase adds anything once effective neoadjuvant therapy has been given, because every patient in the perioperative trials receives both halves. <a class=\"trial-link\" href=\"/evidence/#t-checkmate-77t\">CheckMate 77T</a> is the closest cross-trial partner to CheckMate 816, sharing a similar neoadjuvant backbone with post-operative nivolumab added, but that remains an indirect comparison. Giving chemotherapy before surgery was already valid before immunotherapy. The <a class=\"trial-link\" href=\"/evidence/#t-nsclc-meta-analysis-collaborative-group-preoperative-chemo\">NSCLC Meta-analysis Collaborative Group (preoperative chemo)</a> pooled 2385 patients across 15 randomised trials and found preoperative chemotherapy improved overall survival (HR 0.87), an absolute 5-year gain of about 5 percentage points from 40% to 45%, the same magnitude as adjuvant chemotherapy (Lancet 2014;383:1561-1571). Immunotherapy changed the size of the effect, not the principle.</p>\n<h3>Neoadjuvant only</h3>\n<p>CheckMate 816 randomised 358 patients with resectable stage IB of 4 cm or more to IIIA disease and no EGFR or ALK alteration to three cycles of nivolumab 360 mg with a platinum doublet, or chemotherapy alone, followed by surgery with no planned adjuvant immunotherapy. Adding nivolumab raised pathological complete response from 2.2% to 24.0% and improved event-free survival (HR 0.63) without compromising the operation (N Engl J Med 2022;386:1973-1985), and with mature follow-up it improved overall survival (HR 0.72, p=0.048; N Engl J Med 2025;393:741-752). Median event-free survival was 43.8 versus 18.4 months and 5-year overall survival 65.4% versus 55%, rising to 95.3% among those achieving a pathological complete response, a post-randomisation on-treatment subgroup rather than an extension of the randomised comparison; grade 3 or higher events occurred in 33.5% versus 36.9%. Neoadjuvant therapy alone can therefore suffice. <a class=\"trial-link\" href=\"/evidence/#t-lcmc3\">LCMC3</a> tested a less intensive version of the same idea, two doses of single-agent atezolizumab before surgery in 181 patients with untreated resectable stage IB to IIIB disease. Major pathological response was 20% (29 of 143; 95% CI 14 to 28) among tumours of EGFR/ALK-negative or unknown status, pathological complete response was 6% (8 of 143), and 3-year overall survival was 80% (95% CI 71 to 87) in the 137 patients resected with clear margins (Nat Med 2022;28:2155-2161). Checkpoint blockade alone before surgery is feasible and active, but a 6% pathological complete response sits well below the 17 to 41% reported by the randomised phase 3 chemo-immunotherapy trials in this section. NEOSTAR, a randomised phase 2, tested the same question across four neoadjuvant arms: nivolumab, ipilimumab with nivolumab, nivolumab with chemotherapy, and ipilimumab with nivolumab and chemotherapy. Major pathological response was 22% and 38% in the two chemotherapy-free arms, and 32.1% and 50% in the two chemotherapy-containing arms. The ordering points the same way as LCMC3, though the arms are small and the trial has no adjuvant phase.</p>\n<h3>The perioperative sandwich</h3>\n<p>Two small studies preceded the phase 3 trials. NADIM gave neoadjuvant nivolumab with carboplatin and paclitaxel followed by a year of adjuvant nivolumab to 46 patients with stage IIIA disease in a single arm, reporting a pathological complete response rate of 63% and 24-month progression-free survival of 77.1%; NADIM II then randomised 86 patients with stage IIIA to IIIB disease and improved both pathological complete response (37% vs 7%, P=0.02) and the proportion reaching surgery (93% vs 69%). <a class=\"trial-link\" href=\"/evidence/#t-keynote-671\">KEYNOTE-671</a> randomised 797 patients with resectable stage II to IIIB disease to four cycles of neoadjuvant pembrolizumab with a platinum doublet, surgery, then up to 13 cycles of adjuvant pembrolizumab, or to placebo with the same chemotherapy. Event-free survival improved at the first interim analysis (HR 0.58), which is the trial&#x27;s alpha-protected primary result (N Engl J Med 2023;389:491-503). The figures below all come from the second interim analysis reported in 2024, at a median 36.6 months of follow-up: overall survival improved (HR 0.72, one-sided p=0.0052), median event-free survival was 47.2 versus 18.3 months, 36-month event-free survival was 54% versus 35%, and median overall survival was not reached versus 52.4 months (Lancet 2024;404:1240-1252). The authors state that the overall survival data remain immature at that analysis. Event-free survival was not formally tested again at that cut, having already met its boundary. <a class=\"trial-link\" href=\"/evidence/#t-aegean\">AEGEAN</a> randomised 802 patients with resectable stage II to IIIB disease to neoadjuvant durvalumab with platinum chemotherapy then adjuvant durvalumab, or placebo with chemotherapy, and improved event-free survival (HR 0.68, 95% CI 0.53 to 0.88, P=0.004) and pathological complete response (17.2% vs 4.3%) (N Engl J Med 2023;389:1672-1684). The EGFR/ALK exclusion was added by mid-trial amendment, so 62 of the 802 randomised patients carried such an alteration and were excluded from the efficacy analysis, leaving a modified intention-to-treat population of 740. The point estimate favoured durvalumab in each PD-L1 tumour-cell subgroup, but all three intervals cross one (less than 1%, HR 0.76, 95% CI 0.49 to 1.17; 1 to 49%, HR 0.70, 0.46 to 1.05; 50% or greater, HR 0.60, 0.35 to 1.01), and no interaction test is reported, so consistency across PD-L1 tiers is a direction rather than a demonstrated effect in any one tier. CheckMate 77T randomised 461 patients with resectable stage IIA of more than 4 cm to IIIB(N2) disease to four cycles of neoadjuvant nivolumab with chemotherapy then a year of adjuvant nivolumab, or placebo with chemotherapy, improving 18-month event-free survival from 50.0% to 70.2% (HR 0.58, 97.36% CI 0.42 to 0.81, P&lt;0.001) with a higher pathological complete response rate (N Engl J Med 2024;390:1756-1769). Two trials extend the finding to Chinese populations. <a class=\"trial-link\" href=\"/evidence/#t-neotorch\">Neotorch</a> gave perioperative toripalimab with platinum chemotherapy and improved event-free survival in the 404-patient stage III cohort it reports (HR 0.40), with a higher major pathological response rate (JAMA 2024;331:201-211); median event-free survival was not reached versus 15.1 months, pathological complete response 24.8% versus 1%, major pathological response 48.5% versus 8.4%, and median overall survival not reached versus 30.4 months (HR 0.62). <a class=\"trial-link\" href=\"/evidence/#t-rationale-315\">RATIONALE-315</a> randomised 453 patients with resectable stage II to IIIA disease to perioperative tislelizumab with neoadjuvant chemotherapy or placebo with chemotherapy, and is the second perioperative regimen with a demonstrated survival benefit. Overall survival improved (HR 0.65, 95% CI 0.45 to 0.93, p=0.009), with 36-month overall survival of 79.3% versus 69.3% and medians not reached at 38.5 months of follow-up; the same comparison had not reached significance at the earlier interim (HR 0.62, 0.39 to 0.98). Centrally assessed event-free survival was not reached versus 30.6 months (HR 0.58, 0.43 to 0.79), major pathological response 56% versus 15% and pathological complete response 41% versus 6%, at the cost of grade 3 or higher treatment-related events in 73.0% versus 67.3%, grade 3 or higher immune-mediated events in 9.3% versus 3.1%, and four treatment-related deaths (1.8%) versus two (0.9%) (Lancet Respir Med 2025;13:119-129; Ann Oncol 2026;37:544-554).</p>\n<h3>Pathological response, PD-L1, and getting to the operation</h3>\n<p>Pathological complete response and major pathological response give an early readout of activity and stratify individual prognosis strongly. They do not establish that the regimen with the largest pathological gain will produce the largest survival gain, and no perioperative trial randomises the adjuvant phase by pathological response, which is the design that would settle whether a complete responder can stop. PD-L1 behaves differently before surgery than after it. Benefit appears across tiers in several of the neoadjuvant and perioperative trials, whereas the adjuvant-only trials disagree among themselves, and assay, timing, whether the tumour has been removed, and concurrent chemotherapy all change what the marker is measuring. Operability was not reduced. In CheckMate 816 the proportion reaching surgery was 83.2% versus 75.4%, and in RATIONALE-315 it was 84% versus 76% with R0 resection in 95% versus 93% of those operated, so in both the immunotherapy arm did better than the control on a surgical outcome. Surgical feasibility is therefore an efficacy outcome rather than only a safety measure. A proportion of patients never reach theatre, from progression or from toxicity, and that is the risk accepted in exchange for the pathological and event-free survival gain.</p>\n<h2 id=\"s-neoadjuvant-targeted-therapy\">Neoadjuvant targeted therapy</h2>\n<p><a class=\"trial-link\" href=\"/evidence/#t-neoadaura\">NeoADAURA</a> moved osimertinib in front of surgery in 358 patients with resectable, EGFR-mutant, stage II to IIIB disease, randomised to neoadjuvant osimertinib with platinum chemotherapy, osimertinib alone, or placebo with chemotherapy. Major pathological response was 26% with osimertinib plus chemotherapy and 25% with osimertinib alone, against 2% with chemotherapy alone (both p&lt;0.0001 versus control). At 15% data maturity, 12-month event-free survival was 93%, 95% and 83%, and grade 3 or higher adverse events in the neoadjuvant period occurred in 36%, 13% and 33% (J Clin Oncol 2025;43:2875-2887). Pathological complete response was 4%, 9% and 0%. Two things follow.</p>\n<ul><li>Adding chemotherapy to neoadjuvant osimertinib added toxicity without adding pathological benefit, a de-intensification signal specific to the pre-surgical window.</li><li>The trial does not change practice: the patients were resectable at the outset yet 1% of those on osimertinib-containing arms did not reach surgery because of progression, event-free survival is immature, and the adjuvant approach already has mature overall survival evidence from ADAURA.</li></ul>\n<p>The default in a resectable EGFR-mutant patient remains resection, then adjuvant chemotherapy, then adjuvant osimertinib. Whether neoadjuvant osimertinib adds to or substitutes for that adjuvant course has never been tested. The ALK equivalent has opened at a much earlier evidence tier. <a class=\"trial-link\" href=\"/evidence/#t-lorin\">LORIN</a> gave three cycles of neoadjuvant lorlatinib to 43 patients with stage III ALK-fusion disease, 19 potentially resectable and 24 unresectable, followed by optional surgery or local therapy and up to two years of consolidation lorlatinib. Pathological complete response was 46.9% (15 of 32) and major pathological response 81.3% (26 of 32), meeting the primary endpoint, with confirmed objective response in 83.7% and no progressive disease, and 75% (18 of 24) of initially unresectable patients converted to surgery (J Clin Oncol 2026;44(suppl):8002). The pathological response is far deeper than NeoADAURA&#x27;s, but this is a small single-arm phase 2 reported as a congress abstract, so it is hypothesis-generating rather than practice-establishing.</p>\n<h2 id=\"s-post-operative-radiotherapy\">Post-operative radiotherapy</h2>\n<p>Post-operative radiotherapy reduces mediastinal relapse without improving disease-free survival, and the two modern randomised trials agree. <a class=\"trial-link\" href=\"/evidence/#t-lung-art\">Lung ART</a> randomised 501 patients with completely resected stage IIIA-N2 disease to mediastinal radiotherapy or none, and disease-free survival did not improve (HR 0.86, 95% CI 0.68 to 1.08, p=0.18) despite fewer mediastinal relapses, with the gain offset by cardiopulmonary toxicity (Lancet Oncol 2022;23:104-114). PORT-C, the Chinese phase 3 in the same population, was also negative for disease-free and overall survival. The older evidence pointed the same way. The 1998 PORT meta-analysis found a 7% absolute detriment in 2-year overall survival, most pronounced in stage I and II and N0 to N1 disease, and a SEER analysis in stage II and III disease found no overall effect, with subset signals of benefit in N2 and harm in N0 and N1. Radiotherapy after complete resection is therefore indicated for positive margins. Its use for N2 disease with high-risk features, meaning multi-station or subcarinal involvement, extracapsular nodal disease, inadequate nodal resection, or involvement of the highest node resected, is not supported by the randomised evidence, and ASCO recommends against radiotherapy for N2 disease unless margins are involved.</p>\n<h2 id=\"s-stage-iii-the-resectability-decision\">Stage III: the resectability decision</h2>\n<ul><li>For stage III disease without mediastinal involvement, meaning T3N1 or T4N0-1, a completely resectable tumour in a fit patient goes to surgery followed by adjuvant therapy and everything else goes to definitive chemoradiation.</li><li>Where the mediastinum is involved, N2 disease goes to concurrent chemoradiation, with selected patients taken instead through neoadjuvant or perioperative chemo-immunotherapy to surgery, and N3 disease goes to chemoradiation with consolidation durvalumab.</li><li>Clinical stage I or II disease that turns out to be pathological stage III gets adjuvant systemic therapy with or without radiotherapy.</li><li>Occult mediastinal involvement is found in the resection specimen in up to 20% of patients with larger central lesions staged N0 pre-operatively.</li></ul>\n<p>Induction therapy followed by surgery in N2 disease is a strategy without a defining randomised trial. No trial has shown an overall survival benefit for it, including Intergroup 0139, EORTC 08941 and ESPATUE, and Intergroup 0139, which enrolled more than 400 patients with stage IIIA N2 disease, improved progression-free survival only. The features favouring this route are single-station N2 disease under 3 cm before induction, disease resectable by lobectomy rather than pneumonectomy, and clearance of the N2 nodes on induction; poor performance status, poor lung function, progression on induction, T4 disease and multi-station N2 disease argue against it.</p>\n<h2 id=\"s-unresectable-stage-iii-definitive-chemoradiation\">Unresectable stage III: definitive chemoradiation</h2>\n<p>Concurrent chemoradiation is the curative backbone where surgery is not possible. <a class=\"trial-link\" href=\"/evidence/#t-rtog-9410\">RTOG 9410</a> randomised 610 patients with unresectable stage II to III disease to concurrent or sequential chemoradiation with cisplatin and vinblastine, and concurrent treatment improved median overall survival from 14.6 to 17.0 months at the cost of more acute oesophagitis (J Natl Cancer Inst 2011;103:1452-1460). The 2010 individual-patient meta-analysis of six trials quantified the same result across 1205 patients: overall survival hazard ratio 0.84 with an absolute benefit of 5.7% at 3 years, progression-free survival hazard ratio 0.90 with an absolute benefit of 2.9% at 3 years, locoregional control hazard ratio 0.77, and no difference in distant progression. The survival gain comes primarily from better locoregional control. Radiation dose is 60 Gy in 30 fractions and higher is worse. <a class=\"trial-link\" href=\"/evidence/#t-rtog-0617\">RTOG 0617</a> tested 60 Gy against 74 Gy with or without cetuximab in a 2×2 factorial design in 544 patients with unresectable stage IIIA to IIIB disease, and the high-dose arm had shorter median overall survival (20.3 vs 28.7 months); cetuximab added nothing (Lancet Oncol 2015;16:187-199). The concurrent regimen is chosen on tolerability. Cisplatin 50 mg/m² on days 1, 8, 29 and 36 with etoposide 50 mg/m² on days 1 to 5 and 29 to 33 is the classical schedule from SWOG 9019, and weekly carboplatin AUC 2 with paclitaxel 45 to 50 mg/m² is the alternative. Liang&#x27;s phase 3 comparison found a trend to longer median overall survival with cisplatin-etoposide (23.3 vs 20.7 months, HR 0.76, 95% CI 0.55 to 1.05) and a higher 3-year overall survival on the primary endpoint (41% vs 26%), at the cost of more grade 3 or higher oesophagitis. Either is acceptable, with cisplatin-etoposide preferred in younger, fitter patients. <a class=\"trial-link\" href=\"/evidence/#t-proclaim\">PROCLAIM</a> tested whether pemetrexed could improve on that in non-squamous disease and it could not. It randomised 598 patients with unresectable stage IIIA to IIIB non-squamous disease to pemetrexed-cisplatin with concurrent thoracic radiotherapy of 60 to 66 Gy then consolidation pemetrexed, or to etoposide-cisplatin with the same radiotherapy then a consolidation platinum doublet. Median overall survival was 26.8 versus 25.0 months (HR 0.98, 95% CI 0.79 to 1.20, P=0.831) and enrolment stopped early for futility; progression-free survival was 11.4 versus 9.8 months (HR 0.86, 0.71 to 1.04, nominal P=0.130) (J Clin Oncol 2016;34:953-962). The tolerability trade runs in both directions. During the concurrent phase, grade 3 to 4 neutropenia was 18.4% versus 28.7% and febrile neutropenia 3.2% versus 7.4% in favour of pemetrexed, while over the whole study any-grade pneumonitis was 17.0% versus 10.7%, driven by grade 2 events, with grade 3 to 4 pneumonitis under 3% in both arms. Etoposide-cisplatin remains a standard doublet, and pemetrexed-cisplatin is a tolerability alternative in non-squamous disease rather than a survival advance.</p>\n<h2 id=\"s-consolidation-after-chemoradiation\">Consolidation after chemoradiation</h2>\n<p>Chemoradiation alone usually fails, both locally and at a distance, which is the rationale for systemic consolidation aimed at the micrometastatic disease local treatment leaves behind. <a class=\"trial-link\" href=\"/evidence/#t-pacific\">PACIFIC</a> randomised 713 patients with unresectable stage III disease who had not progressed after platinum-based concurrent chemoradiation, unselected for driver and PD-L1, to durvalumab 10 mg/kg every 2 weeks for up to 12 months or placebo. Progression-free survival improved from 5.6 to 16.8 months (stratified HR 0.52, 95% CI 0.42 to 0.65, P&lt;0.001) at the planned interim analysis (N Engl J Med 2017;377:1919-1929). Overall survival, the co-primary endpoint, then crossed its interim efficacy boundary with a stratified hazard ratio of 0.68 (99.73% CI 0.47 to 0.997, P=0.0025), with the median not reached versus 28.7 months (N Engl J Med 2018;379:2342-2350). At five years, overall survival was 42.9% versus 33.4% and progression-free survival 33.1% versus 19.0% (J Clin Oncol 2022;40:1301-1311), so about a third of durvalumab-treated patients were alive and progression-free at five years. This is the first durable survival plateau produced by immunotherapy in a curative-intent lung setting. Whether the lowest PD-L1 expressers benefit is contested. A post-hoc subgroup analysis of patients with PD-L1 below 1% showed no survival benefit, which led the EMA but not the FDA to restrict consolidation to PD-L1 1% or greater; the subgroup was small, post-hoc, unpowered and confounded by an over-performing placebo arm, and its progression-free survival still favoured durvalumab, so the restriction rests on an exploratory analysis rather than settled biology. Two trials have tried to improve on that regimen by moving immunotherapy earlier, and neither has. <a class=\"trial-link\" href=\"/evidence/#t-pacific-2\">PACIFIC-2</a> moved durvalumab forward to run concurrently with chemoradiation in 328 treatment-naive patients and did not improve progression-free survival (HR 0.85, non-significant) or overall survival (HR 1.03), with more treatment discontinuations (J Clin Oncol 2025;43:3610-3621). <a class=\"trial-link\" href=\"/evidence/#t-checkmate-73l\">CheckMate 73L</a> tested nivolumab during chemoradiation followed by nivolumab with ipilimumab, or nivolumab alone, against the chemoradiation-then-durvalumab standard in 925 patients, and neither experimental arm improved progression-free survival (HR 0.95 and 0.84, non-significant; descriptive overall survival HR 1.12 for the doublet arm), with more pneumonitis (Nat Cancer 2026, online 13 May). The evidence supports consolidation after chemoradiation rather than concurrent immunotherapy. <a class=\"trial-link\" href=\"/evidence/#t-pacific-5\">PACIFIC-5</a> widened the population rather than changing the timing. It randomised 407 patients 2:1 to consolidation durvalumab or placebo after concurrent or sequential chemoradiation, and progression-free survival improved in the modified intention-to-treat population (14.0 vs 6.5 months; stratified HR 0.75, 95% CI 0.58 to 0.99, p=0.038). Overall survival at the first interim was not significant (38.3 vs 32.5 months; HR 0.87, 0.66 to 1.17, p=0.346), which stopped the hierarchical testing chain, so no intention-to-treat result in the paper is formally significant (J Hematol Oncol 2025;18:111). A third of patients had received sequential chemoradiation, a group PACIFIC never enrolled, but both subgroup estimates have intervals crossing one and no interaction test is reported, so benefit specifically after sequential treatment is not demonstrated. The population was 71 to 73% Asian, and the modified intention-to-treat population contains no EGFR- or ALK-positive patients, because a mid-trial amendment excluded them from the efficacy analysis rather than from enrolment.</p>\n<h3>EGFR-mutant unresectable stage III</h3>\n<p>Driver status splits the consolidation question, because checkpoint blockade underperforms in oncogene-driven disease and a biomarker-matched option was needed. <a class=\"trial-link\" href=\"/evidence/#t-laura\">LAURA</a> randomised 216 patients with unresectable stage III EGFR-mutant disease who had not progressed after chemoradiation to osimertinib 80 mg daily until progression or placebo. Progression-free survival was 39.1 versus 5.6 months (HR 0.16, 95% CI 0.10 to 0.24, P&lt;0.001), the largest effect size anywhere in this chapter, with protection against CNS progression; interim overall survival is immature at 20% maturity and confounded by crossover (HR 0.81, 0.42 to 1.56) (N Engl J Med 2024;391:585-597). New lesions appeared in 22% of the osimertinib group versus 68% of the placebo group, including new brain lesions in 8% versus 29%. LAURA and PACIFIC are the same paradigm, consolidation after chemoradiation, with the agent chosen by driver status. No ALK counterpart to LAURA has been run and filed, and no dedicated RET consolidation-after-chemoradiation trial is filed.</p>\n<h2 id=\"s-surveillance\">Surveillance</h2>\n<p>After curative-intent treatment, NCCN recommends history, examination and contrast-enhanced CT of the thorax every 3 to 6 months for 3 years, then 6-monthly for 2 years, then annually, with more frequent imaging where residual or new radiographic abnormalities are present. Suspected recurrence is worked up with PET-CT and contrast-enhanced MRI brain before treatment is decided.</p>\n<h2 id=\"s-references\">References</h2>\n<ol class=\"refs\">\n<li><a class=\"trial-link\" href=\"/evidence/#t-nlst-national-lung-screening-trial\">NLST (National Lung Screening Trial)</a>. <a href=\"https://drive.google.com/file/d/1x7mTwYG0HcjeNpgVzTAxcnzh89hmXSIX/preview\">N Engl J Med 2011;365:395-409</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-nelson-dutch-belgian-lung-cancer-screening\">NELSON (Dutch-Belgian Lung Cancer Screening)</a>. <a href=\"https://drive.google.com/file/d/1_FzXzWjbm8izCHEDV2mXjTaL141Uvj0h/preview\">N Engl J Med 2020;382:503-513</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-lace-lung-adjuvant-cisplatin-evaluation-meta-analysis\">LACE (Lung Adjuvant Cisplatin Evaluation) meta-analysis</a>. <a href=\"https://drive.google.com/file/d/1_u6092XQmwM67TKUFIb65YrE9qY8j-hs/preview\">J Clin Oncol 2008;26:3552-3559</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-calgb-9633\">CALGB 9633</a>. <a href=\"https://drive.google.com/file/d/1hMGbNkOBtfmEMzFLgywJIow0OuJEG3t-/preview\">J Clin Oncol 2008;26:5043-5051</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-adaura\">ADAURA</a>. <a href=\"https://drive.google.com/file/d/1H61mzFuP0UaVkU6qkMNjPWF2LKv8Gk_X/preview\">N Engl J Med 2020;383:1711-1723</a>; <a href=\"https://drive.google.com/file/d/1u46C7o24AZYLjNYa5pURL3M6bLk8APhP/preview\">N Engl J Med 2023;389:137-147</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-ialt-international-adjuvant-lung-cancer-trial\">IALT (International Adjuvant Lung Cancer Trial)</a>. <a href=\"https://drive.google.com/file/d/14V4mDJHCM5rbBJUmpEKVzWa1lzLASVtT/preview\">N Engl J Med 2004;350:351-360</a>; <a href=\"https://drive.google.com/file/d/1GW01ku2opDV5ikBr0PkDbPXx_ITq0v-T/preview\">J Clin Oncol 2010;28:35-42</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-jbr-10-ncic-ctg\">JBR.10 (NCIC CTG)</a>. <a href=\"https://drive.google.com/file/d/15Fabjtn1JCuo1LGHyTWn7XGVbW1Sifzo/preview\">N Engl J Med 2005;352:2589-2597</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-anita\">ANITA</a>. <a href=\"https://drive.google.com/file/d/1JYcoidFdpJYTNRNEiislmNx6NaxogtBA/preview\">Lancet Oncol 2006;7:719-727</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-alina\">ALINA</a>. <a href=\"https://drive.google.com/file/d/1d1jb6J3WeHePViZPGpmpFkmRMES9aW01/preview\">N Engl J Med 2024;390:1265-1276</a>; <a href=\"https://drive.google.com/file/d/1MSfs7_JmFZRAIH1QvI8xpo7vp3ZcH_m_/preview\">Lung Cancer 2026;216:109385</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-elevate\">ELEVATE</a>. <a href=\"https://drive.google.com/file/d/1tRgNY5XASkBfG_PqiYIxay4UMhoZU617/preview\">N Engl J Med 2026;395:151-161</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-libretto-432\">LIBRETTO-432</a>. <a href=\"https://drive.google.com/file/d/1R5MbcmU2mYEu6lydzmD2eQtBYCJiElXa/preview\">N Engl J Med 2026 (online 31 May); J Clin Oncol 2026;44(suppl):LBA3</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-impower010\">IMpower010</a>. <a href=\"https://drive.google.com/file/d/1yD8PxMfjCgPGpPORhOTVnthxMZSJbFCK/preview\">Lancet 2021;398:1344-1357</a>; <a href=\"https://drive.google.com/file/d/1apf1dcbwdbINl5X9Ar_ThbXixFBfgQCS/preview\">J Clin Oncol 2025;43:2343-2349</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-keynote-091-pearls\">KEYNOTE-091 (PEARLS)</a>. <a href=\"https://drive.google.com/file/d/1hF-SHvp0yK7qdDajOH7W-6KGXp75Tl09/preview\">Lancet Oncol 2022;23:1274-1286</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-anvil-alchemist\">ANVIL (ALCHEMIST)</a>. <a href=\"https://drive.google.com/file/d/1JuRehiHCvE8KFcOG0r162kq_aRBZmNaX/preview\">JAMA 2026 (online 1 Jun)</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-checkmate-816\">CheckMate 816</a>. <a href=\"https://drive.google.com/file/d/1bQWBzQZAIorT3dTdGyidpE7XmPOL8xEl/preview\">N Engl J Med 2022;386:1973-1985</a>; <a href=\"https://drive.google.com/file/d/1eWXxP1uNmCq7fDqqdXbVzDs1Qx5-LBIn/preview\">N Engl J Med 2025;393:741-752</a>; <a href=\"https://drive.google.com/file/d/1vTFgb6DRDopBVvspTGGga2isoWbsxeav/preview\">J Clin Oncol 2025;43:1453-1462</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-checkmate-77t\">CheckMate 77T</a>. <a href=\"https://drive.google.com/file/d/19smT9-S0bkSe2G-JV8
