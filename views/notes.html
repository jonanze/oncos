<script>
window.oncosView = {
  name: 'notes',
  init: function(ctx) {

if (false) {
    window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
  }
const NOTES = [{"id": "melanoma-melanoma", "slug": "melanoma", "group": "Melanoma", "title": "Melanoma", "updated": "", "sections": [{"id": "s-epidemiology", "h": "Epidemiology"}, {"id": "s-risk-factors", "h": "Risk factors"}, {"id": "s-pathology-and-molecular-classification", "h": "Pathology and molecular classification"}, {"id": "s-clinical-presentation-and-diagnosis", "h": "Clinical presentation and diagnosis"}, {"id": "s-staging-and-work-up", "h": "Staging and work-up"}, {"id": "s-management-of-resectable-disease", "h": "Management of resectable disease"}, {"id": "s-management-of-advanced-disease", "h": "Management of advanced disease"}, {"id": "s-therapy-after-anti-pd-1-failure", "h": "Therapy after anti–PD-1 failure"}, {"id": "s-uveal-and-mucosal-melanoma", "h": "Uveal and mucosal melanoma"}, {"id": "s-references", "h": "References"}], "html": "<h2 id=\"s-epidemiology\">Epidemiology</h2>\n<p>Cutaneous melanoma accounts for 1.7% of new cancer diagnoses worldwide (232,100 cases) but only 0.7% of cancer deaths, a gap attributable to screening, early detection and adequate surgery for early-stage disease. It is the fifth commonest cancer in the United States in both sexes, and most patients present with localised disease: 84% stage I–II, 8% regional stage III and 4% metastatic stage IV at diagnosis. The disease Asian oncologists see is not the disease the Western trials enrolled. Incidence in Singapore is low, at 0.5 cases per 100,000 persons. Because sun-driven cutaneous melanoma is uncommon in Asian populations, the clinicopathological spectrum shifts towards subtypes that are marginal in Caucasian series: acral melanoma (nail beds, palms, soles and hairless skin) accounts for approximately 35–40% and mucosal melanoma for approximately 15–20% of Asian melanomas. Both subtypes were sparsely represented in the registration trials that follow, which is the single most important caveat when applying those data to a local practice.</p>\n<h2 id=\"s-risk-factors\">Risk factors</h2>\n<p>Phenotypic predisposition dominates.</p>\n<ul><li>Atypical naevi carry the strongest single association (OR 17.4), defined clinically by asymmetry, irregular borders, multiple colours or diameter greater than 5 mm.</li><li>Increased total mole count, a tendency to sunburn, and red hair with blue eyes or Fitzpatrick skin type I complete the phenotype.</li></ul>\n<p>A personal history of melanoma raises risk substantially (OR 12.78), and a history of non-melanoma skin cancer raises it moderately (relative risk 4.28). Immunosuppression from solid organ transplantation, haematopoietic cell transplantation, or HIV infection is an independent risk factor. The environmental driver is ultraviolet exposure, and the pattern of exposure predicts the site. Intermittent intense exposure produces truncal and extremity melanomas, whereas chronic cumulative exposure produces head, neck and arm melanomas. Tanning bed use and residence at latitudes nearer the equator both increase risk. Familial melanoma has been linked to germline variants in <em>CDKN2A</em>, <em>MC1R</em> and <em>BAP1</em>; <em>BAP1</em> in particular should prompt consideration of the uveal melanoma and mesothelioma spectrum.</p>\n<h2 id=\"s-pathology-and-molecular-classification\">Pathology and molecular classification</h2>\n<p>Most melanomas begin with a radial growth phase, in which the tumour remains confined to the epidermis, sometimes for years, and is almost always cured by excision alone. Progression to a vertical growth phase, driven by stepwise accumulation of genetic abnormalities, converts the lesion into an expansile nodule that breaches the basement membrane and invades the dermis. That transition is the biological event that creates metastatic risk, and it is what Breslow thickness measures.</p>\n<p>Superficial spreading melanoma is the commonest subtype, at approximately 75% of all melanomas. It shows lateral growth before invasion, presents as a variably pigmented macule or plaque with an irregular border, and displays multiple shades of red, blue, black, grey and white. More than 60% are diagnosed as thin, highly curable tumours of 1 mm or less. Roughly 30% arise in association with a pre-existing naevus and the remaining 70% arise de novo.</p>\n<p>Nodular melanoma is the second commonest type, at 15–30%. It presents as a darkly pigmented, pedunculated or polypoid papule or nodule, and it defeats the ABCDE rule more often than any other subtype: colour is frequently uniform or amelanotic and pink, borders are symmetric, and the diameter is small. Most are thicker than 2 mm at diagnosis, because the lesion enters vertical growth early. Lentigo maligna melanoma arises in chronically sun-damaged skin in older patients, beginning as a tan or brown macule that enlarges over years. Darker asymmetric foci, colour variegation and raised areas within the precursor in situ lesion signify vertical growth.</p>\n<p>Acral lentiginous melanoma accounts for less than 5% of melanomas in Western series but, as noted above, a far larger share in Asian practice. It occurs on palmar, plantar and subungual surfaces, first appearing as dark brown to black irregularly pigmented macules or patches; raised areas, ulceration, bleeding or larger diameter signify deeper dermal invasion. Subungual melanoma may present as a mass beneath the nail plate with ulceration and nail plate destruction. Amelanotic, spitzoid and desmoplastic melanomas are uncommon subtypes, each with its own diagnostic pitfall. Histopathological diagnosis rests on cytological atypia (melanocytes larger than normal, with large hyperchromatic nuclei, irregular nuclear shape, polymorphism and prominent nucleoli) together with architectural disorder (asymmetry, poor circumscription, and melanocytic nests of varying size and shape). Immunohistochemistry supports lineage but not malignancy.</p>\n<ul><li>S-100 is highly sensitive and poorly specific.</li><li>MART-1/Melan-A is sensitive and specific for melanocytes but does not mark malignant transformation.</li><li>HMB-45 and tyrosinase are the other standard markers.</li></ul>\n<p>Molecular testing at the point of advanced disease should cover <em>BRAF</em> V600, PD-L1, <em>RAS</em>, <em>KIT</em> and <em>NTRK</em>. <em>BRAF</em> V600 status is the only one that changes first-line drug selection; <em>KIT</em> is worth pursuing specifically in acral and mucosal disease.</p>\n<h2 id=\"s-clinical-presentation-and-diagnosis\">Clinical presentation and diagnosis</h2>\n<p>The ABCDE rule remains the practical screen:</p>\n<ul><li>Asymmetry, such that one half of a bisected lesion is not identical to the other.</li><li>Border irregularity.</li><li>Colour variegation across red, blue, black, grey or white.</li><li>Diameter of 6 mm or more.</li><li>Evolution in size, shape or colour, or the appearance of a new lesion.</li></ul>\n<p>Evolution is the criterion that catches the nodular and amelanotic lesions the other four miss. Diagnosis requires excisional or complete biopsy, by saucerisation or deep shave, punch biopsy for small-diameter lesions, or elliptical excision, taking a 1–3 mm margin of normal skin and extending deep enough to encompass the thickest portion of the lesion. A partial or superficial shave that transects the base forfeits accurate Breslow thickness and therefore forfeits accurate staging.</p>\n<h2 id=\"s-staging-and-work-up\">Staging and work-up</h2>\n<p>The T category is built on tumour thickness and ulceration, the latter defined as absence of an intact epithelium over the melanoma. Mitotic rate per mm² remains an important prognostic factor at a threshold of 1/mm², but it was a T-category criterion in AJCC 7 and was removed in AJCC 8. The N category distinguishes three forms of intralymphatic spread that are easily conflated.</p>\n<ul><li>In-transit metastases lie more than 2 cm from the primary but not beyond the nearest regional nodal basin.</li><li>Satellites lie within 2 cm of the primary.</li><li>Microsatellites are visible only microscopically, defined as tumour nests greater than 0.05 mm in diameter in the reticular dermis, panniculus or vessels beneath the principal invasive tumour, separated from it by at least 0.3 mm of normal tissue on the section in which the Breslow measurement was taken.</li></ul>\n<p>For M disease, serum LDH is an independent prognostic factor and a surrogate for overall tumour burden, annotated as (0) for non-elevated and (1) for elevated. Every stage grouping in the table below is carried from the source notes and is unverified against AJCC.</p>\n<div class=\"tblwrap\"><table><thead><tr><th scope=\"col\">Stage</th><th scope=\"col\">Definition</th><th scope=\"col\">Groupings</th></tr></thead><tbody><tr><td>I</td><td>Low-risk tumours, no regional or distant metastases</td><td>IA T1N0M0; IB T2aN0M0</td></tr><tr><td>II</td><td>Higher recurrence risk, no regional or distant metastases</td><td>IIA T2b/T3aN0M0; IIB T3b/T4aN0M0; IIC T4bN0M0</td></tr><tr><td>III</td><td>Any T, node-positive, M0</td><td></td></tr><tr><td>IV</td><td>Any T, any N, M1</td><td></td></tr></tbody></table></div>\n<p>Older age and male sex carry additional adverse prognostic weight independent of stage.</p>\n<h3>Sentinel lymph node biopsy</h3>\n<p>Sentinel lymph node biopsy stages and prognosticates; it is not a therapeutic procedure. Its rationale is:</p>\n<ul><li>accurate staging;</li><li>prognostication;</li><li>regional disease control;</li><li>lower morbidity than completion dissection;</li><li>selection for adjuvant therapy.</li></ul>\n<p>Completion lymph node dissection after a positive sentinel node has no established survival role, and ultrasound surveillance is sufficient. The two MSLT trials define both halves of that position. Every figure in the table below is carried from the source notes and is unverified against the publications it cites.</p>\n<div class=\"tblwrap\"><table><thead><tr><th scope=\"col\"></th><th scope=\"col\">MSLT-I (NEJM 2006, NEJM 2014)</th><th scope=\"col\">MSLT-II (NEJM 2017, JAMA Surg 2022)</th></tr></thead><tbody><tr><td>Question</td><td>Does sentinel lymph node biopsy improve outcomes versus nodal observation?</td><td>In sentinel-node-positive patients, does completion lymph node dissection improve outcomes versus ultrasound surveillance?</td></tr><tr><td>Design</td><td>Phase 3: sentinel node biopsy with immediate completion dissection if positive, versus observation with delayed lymphadenectomy at nodal relapse</td><td>Phase 3 in sentinel-node-positive patients: completion dissection versus nodal observation (clinical review and nodal ultrasound 4-monthly for 2 years, 6-monthly for 3 years, then annually)</td></tr><tr><td>Population</td><td>N = 2001; intermediate thickness 1.2–3.5 mm (1347), thin &lt;1.2 mm (340), thick &gt;3.5 mm (314)</td><td>N = 1939</td></tr><tr><td>Primary endpoint</td><td>Melanoma-specific survival; similar at 10 years between observation and biopsy (too few events in thin melanomas for conclusions)</td><td>Melanoma-specific survival; no difference between dissection and observation</td></tr><tr><td>Other findings</td><td>Biopsy improved 10-year disease-free survival. Node-positive patients treated early did better than those treated at palpable relapse. Sentinel node status was the strongest predictor of recurrence or melanoma death on multivariable analysis.</td><td>Dissection reduced regional nodal recurrence but not distant metastasis or overall survival. In the observation arm at 10 years (JAMA Surg 2022), 80% remained free of nodal recurrence; risk factors were age over 50, ulceration, thickness above 3.5 mm, non-axillary basin, and sentinel node tumour burden above 1 mm or area above 5%.</td></tr><tr><td>Morbidity</td><td>Minimal additional morbidity over observation</td><td>Dissection caused more complications, particularly lymphoedema (24% vs 6%, P&lt;0.001)</td></tr><tr><td>Practice impact</td><td>Established sentinel node biopsy as the standard staging and prognostic tool</td><td>Routine completion dissection after a positive sentinel node is unnecessary; ultrasound surveillance is safe and avoids morbidity</td></tr></tbody></table></div>\n<p>DeCOG-SLT reached the same conclusion in a German phase 3 trial of 483 patients with sentinel-node-positive extremity melanoma randomised to completion dissection or observation, with no difference in 5-year distant metastasis-free survival, recurrence-free survival or overall survival. Patient selection follows the probability of a positive sentinel node.</p>\n<ul><li>Biopsy is recommended from T2a upwards, where that probability exceeds 10%, and for T1b disease (thickness 0.8–1 mm, or under 0.8 mm with ulceration), where it is 5–10%.</li><li>For T1a disease, NCCN allows discussion where adverse features are present (age 42 years or younger, head and neck location, lymphovascular invasion, or mitotic index of 2/mm² or more), which again predicts a 5–10% probability; ESMO frames the same discussion around 3 or more mitoses/mm², a positive deep margin, or a Breslow thickness that cannot be reliably determined (pTx).</li></ul>\n<p>The MSKCC and Melanoma Institute Australia nomograms formalise the estimate. For T3b, T4a and T4b primaries where the patient already qualifies for adjuvant therapy on stage II criteria, omitting sentinel node biopsy can be discussed, but the staging and locoregional-control value should be weighed, particularly for a <em>BRAF</em>-mutant thick stage IIB or IIC primary that could be upstaged to stage III (ESMO). The biopsy should ideally be done in the same setting as wide local excision, since prior wide excision disrupts lymphatic drainage.</p>\n<h3>Imaging for distant metastases</h3>\n<p>Imaging directed at specific signs or symptoms is appropriate at any stage. For asymptomatic patients, NCCN graduates baseline imaging by stage.</p>\n<div class=\"tblwrap\"><table><thead><tr><th scope=\"col\">Stage</th><th scope=\"col\">Baseline imaging</th></tr></thead><tbody><tr><td>0, I, II</td><td>Not recommended unless needed for surgical planning, or before adjuvant therapy in stage IIB/IIC</td></tr><tr><td>IIIA (sentinel node positive)</td><td>Consider CT thorax/abdomen/pelvis for baseline staging or before adjuvant therapy; add CT neck for head and neck primaries</td></tr><tr><td>IIIB/C/D</td><td>CT thorax/abdomen/pelvis, plus neck for head and neck primaries; MRI brain for IIIC/D, which carry higher CNS risk</td></tr><tr><td>IV</td><td>CT thorax/abdomen/pelvis and MRI brain</td></tr></tbody></table></div>\n<p>Whole-body PET-CT is useful to exclude distant metastases in patients being considered for potentially curative resection. Its sensitivity is higher in stage IIIC or IV disease than in less advanced disease (100% versus 84%; Cochrane Database Syst Rev 2019;7:CD012806).</p>\n<h2 id=\"s-management-of-resectable-disease\">Management of resectable disease</h2>\n<h3>Surgery and radiotherapy</h3>\n<p>Definitive treatment is full-depth wide local excision with margins scaled to thickness:</p>\n<ul><li>0.5 cm for in situ melanoma;</li><li>1 cm for tumours of 2 mm or less;</li><li>2 cm for tumours thicker than 2 mm.</li></ul>\n<p>Adjuvant radiotherapy has a very limited role. In TROG 02.01, patients with node-positive melanoma after lymphadenectomy were randomised to adjuvant radiotherapy or observation; radiotherapy roughly halved the risk of in-field relapse but did not improve recurrence-free or overall survival. Definitive radiotherapy to the primary is reserved for patients in whom excision is not possible because of comorbidity, unacceptable surgical morbidity, or refusal of surgery. Palliative radiotherapy and palliative surgery remain appropriate for local control of symptomatic lesions.</p>\n<h3>Adjuvant systemic therapy by stage</h3>\n<p>Stage I to IIA disease, up to T3a (4 mm without ulceration), is managed by surgery and surveillance alone. Recurrence risk is low enough that surgery alone is curative in the great majority, and adjuvant therapy has no role in this group. Stage IIB and IIC disease is where adjuvant anti–PD-1 has most recently extended.</p>\n<ul><li>In <a class=\"trial-link\" href=\"/evidence/#t-keynote-716\">KEYNOTE-716</a>, adjuvant pembrolizumab for approximately 1 year improved recurrence-free survival versus placebo (HR 0.65) and distant metastasis-free survival (HR 0.64) in resected sentinel-node-negative stage IIB/IIC melanoma (Lancet 2022;399:1718-1729).</li><li><a class=\"trial-link\" href=\"/evidence/#t-checkmate-76k\">CheckMate 76K</a> reproduced the result with nivolumab 480 mg 4-weekly (12-month recurrence-free survival 89.0% vs 79.4%, HR 0.42; distant metastasis-free survival HR 0.47; Nat Med 2023;29:2835-2843).</li></ul>\n<p>With longer follow-up the separation persists, at 4 years in the pembrolizumab trial (recurrence-free survival 71% vs 58%; distant metastasis-free survival 81% vs 70%) and at 3 years in the nivolumab trial (71% vs 61% and 79% vs 74% respectively). Overall survival is immature in both, so the conversation with a node-negative patient is about a year of immune toxicity bought against an absolute recurrence-free survival difference of roughly 10 percentage points, with no survival evidence yet. Stage IIIA disease requires an explicit distinction between staging editions before adjuvant therapy is offered. Entry to the pivotal adjuvant trials was based on AJCC 7, and AJCC 7 stage IIIA identifies a higher-risk group than AJCC 8 stage IIIA, which incorporates Breslow thickness (5-year melanoma-specific survival 78% versus 93% respectively). AJCC 7 stage IIIA patients were either excluded outright or required more than 1 mm of sentinel node tumour burden to enter. For a patient with AJCC 8 stage IIIA disease and less than 1 mm of sentinel node burden, adjuvant therapy is therefore not supported by prospective evidence and surveillance is the standard. Above 1 mm of sentinel node burden, a year of adjuvant anti–PD-1 is appropriate. For resected stage IIIB to IV disease the choice is between a year of anti–PD-1 and, for <em>BRAF</em> V600-mutant tumours, a year of BRAF/MEK inhibition. <a class=\"trial-link\" href=\"/evidence/#t-keynote-054-eortc-1325\">KEYNOTE-054 (EORTC 1325)</a> established pembrolizumab 200 mg 3-weekly for approximately 1 year against placebo in completely resected high-risk stage III disease (1-year recurrence-free survival 75.4% vs 61.0%, HR 0.57; N Engl J Med 2018;378:1789-1801), with consistent benefit across subgroups including <em>BRAF</em> wild-type. The separation is maintained on long follow-up, with 7-year recurrence-free survival of 50% versus 36% and distant metastasis-free survival of 54% versus 42%. <a class=\"trial-link\" href=\"/evidence/#t-checkmate-238\">CheckMate 238</a> answered the drug question rather than the placebo question, randomising resected stage IIIB/C or IV disease to nivolumab or high-dose ipilimumab: nivolumab improved recurrence-free survival (12-month recurrence-free survival 70.5% vs 60.8%, HR 0.65) with far less grade 3–4 toxicity (14% vs 46%; N Engl J Med 2017;377:1824-1835). At 5 years distant metastasis-free survival was 58% versus 51% and overall survival 76% versus 72%, so the case for nivolumab over ipilimumab rests on recurrence and toxicity rather than on a demonstrated survival advantage. <a class=\"trial-link\" href=\"/evidence/#t-eortc-18071\">EORTC 18071</a> is the historical anchor and no longer a practical option. Adjuvant ipilimumab 10 mg/kg improved both recurrence-free and overall survival against placebo (5-year overall survival 65.4% vs 54.4%, HR 0.72) but caused grade 3–4 immune toxicity in approximately 54% of patients and five treatment-related deaths (Lancet Oncol 2015;16:522-530). Recurrence-free survival medians were 26.1 versus 17.1 months (HR 0.75) and 7-year distant metastasis-free survival 44.5% versus 37% (HR 0.76). It proved the principle of adjuvant checkpoint blockade and was then displaced by anti–PD-1 on toxicity grounds alone. Escalating adjuvant immunotherapy to a doublet has not paid off in the standard resected population. CheckMate 915 randomised resected stage IIIB/C/D or IV disease to nivolumab plus low-dose ipilimumab versus nivolumab alone and found no recurrence-free survival difference (2-year recurrence-free survival 65% vs 63%). The exception is stage IV rendered disease-free surgically, where IMMUNED randomised patients with no evidence of disease to nivolumab plus ipilimumab, nivolumab alone, or placebo: both active arms improved recurrence-free survival over placebo (HR 0.25 for the doublet and 0.60 for nivolumab). Four-year overall survival was 83.8% with the doublet and 72.6% with nivolumab, against 63.1% with placebo (hazard ratios versus placebo 0.41 and 0.74 respectively). Note that the doublet dose in IMMUNED was ipilimumab 3 mg/kg with nivolumab 1 mg/kg, not the low-dose adjuvant schedule of CheckMate 915, which is the practical reason CheckMate 915 cannot be read as refuting IMMUNED. For <em>BRAF</em> V600E/K-mutant resected stage III disease, <a class=\"trial-link\" href=\"/evidence/#t-combi-ad\">COMBI-AD</a> established 12 months of dabrafenib plus trametinib against placebo (3-year relapse-free survival 58% vs 39%, HR 0.47; N Engl J Med 2017;377:1813-1823), with 5-year distant metastasis-free survival of 65% versus 54% (HR 0.55) and an overall survival hazard ratio of 0.80 with both medians not reached. In a <em>BRAF</em>-mutant patient both are options, and the decision turns on toxicity profile and on what is being held in reserve: the BRAF/MEK doublet gives predictable, reversible, high-frequency toxicity over 12 months, whereas anti–PD-1 gives lower-frequency but potentially permanent endocrine and organ-specific toxicity. The two drugs in the doublet fail in different directions.</p>\n<ul><li>Dabrafenib produces common and irritating problems, chiefly pyrexia, rash and arthralgia.</li><li>Trametinib produces rare but serious ones, chiefly ocular toxicity, venous thromboembolism, haemorrhage, cardiomyopathy and pneumonitis.</li></ul>\n<p>Monitoring covers liver function, glucose, febrile reactions, skin toxicity and left ventricular ejection fraction. Adding an individualised neoantigen vaccine to adjuvant pembrolizumab is the most advanced of the escalation strategies. In <a class=\"trial-link\" href=\"/evidence/#t-keynote-942-mrna-4157-v940\">KEYNOTE-942 (mRNA-4157/V940)</a>, a randomised phase IIb trial of 157 patients with resected high-risk stage IIIB–IV melanoma, intismeran autogene plus pembrolizumab prolonged recurrence-free survival over pembrolizumab alone (18-month recurrence-free survival 79% vs 62%, HR 0.56), with benefit sustained at 3 and 5 years and an approximately 49% reduction in recurrence or death (Lancet 2024;403:632-644). This is the first randomised signal for an individualised cancer vaccine, and it remains phase II; the confirmatory phase 3 trial (V940-001) is ongoing.</p>\n<h3>Neoadjuvant therapy</h3>\n<p>Neoadjuvant immunotherapy is now the preferred approach for macroscopic, resectable stage III melanoma in centres able to deliver it, though it was not FDA-approved as of August 2025. Candidates are:</p>\n<ul><li>patients with resectable stage III disease confined to lymph nodes clinically or radiologically;</li><li>selected patients with resectable in-transit metastases or oligometastatic stage IV disease.</li></ul>\n<p><a class=\"trial-link\" href=\"/evidence/#t-nadina\">NADINA</a> is the definitive trial. It randomised 423 patients with resectable macroscopic stage III melanoma, 97% of whom had at least one PET-positive node, to two cycles of neoadjuvant ipilimumab 80 mg plus nivolumab 240 mg 3-weekly followed by therapeutic lymph node dissection and response-driven adjuvant therapy, versus upfront dissection followed by 12 cycles of adjuvant nivolumab. The neoadjuvant strategy improved event-free survival (12-month event-free survival 83.7% vs 57.2%, HR 0.32; N Engl J Med 2024;391:1696-1708), and the benefit held regardless of <em>BRAF</em> mutation status. Approximately 59% of patients achieved a major pathological response and received no adjuvant therapy at all, and pathological response predicted recurrence-free survival. The pathological complete response rate was 47.2%. Two cycles of a doublet given before surgery therefore spares the majority of responders a further year of treatment, which is the practical argument for the approach as much as the event-free survival difference.</p>\n<p><a class=\"trial-link\" href=\"/evidence/#t-swog-s1801\">SWOG S1801</a> made the same point with a single agent and a cleaner design, holding the drug constant and varying only its timing. It randomised 313 patients with resectable stage IIIB to oligometastatic stage IV melanoma to three cycles of neoadjuvant pembrolizumab followed by surgery and 15 adjuvant cycles, versus surgery followed by 1 year of adjuvant pembrolizumab. The perioperative arm improved event-free survival (2-year event-free survival 72% vs 49%, HR 0.58; N Engl J Med 2023;388:813-823). The pathological complete response rate was 21%. Since the total drug exposure was identical, the result is attributable to sequencing: priming the immune response while the bulk of antigen is still in situ.</p>\n<h2 id=\"s-management-of-advanced-disease\">Management of advanced disease</h2>\n<h3>First-line therapy in <em>BRAF</em> wild-type disease</h3>\n<p>The first-line choice is between dual and single-agent checkpoint blockade. <a class=\"trial-link\" href=\"/evidence/#t-checkmate-067\">CheckMate 067</a> randomised untreated advanced melanoma to nivolumab plus ipilimumab, nivolumab alone, or ipilimumab alone, and both nivolumab-containing arms improved progression-free survival (11.5 and 6.9 versus 2.9 months) and objective response (58% and 44% versus 19%) over ipilimumab, with durable long-term survival on extended follow-up (N Engl J Med 2015;373:23-34). Median overall survival was 72.1 months for the doublet and 37.6 months for nivolumab, against 19.9 months for ipilimumab. The two nivolumab-containing arms were not designed for head-to-head comparison, and in the overall population the doublet improved progression-free survival but not overall survival relative to nivolumab alone. That is the essential caveat: the apparent superiority of the doublet in CheckMate 067 is a cross-arm comparison the trial does not license. The cost of the doublet is substantial. Grade 3 or higher treatment-related adverse events occurred in 63% of patients on nivolumab plus ipilimumab, 25% on nivolumab and 30% on ipilimumab. <a class=\"trial-link\" href=\"/evidence/#t-relativity-047\">RELATIVITY-047</a> offers the middle option. Fixed-dose nivolumab plus relatlimab, an anti–LAG-3 antibody, improved progression-free survival over nivolumab alone (median 10.1 vs 4.6 months, HR 0.75; N Engl J Med 2022;386:24-34), with median overall survival of 51.0 versus 34.1 months (HR 0.80) and objective response in 43% versus 33%. Grade 3 or higher treatment-related adverse events occurred in 22% versus 12%, roughly a third of the doublet&#x27;s rate in CheckMate 067. LAG-3 plus PD-1 blockade is therefore a reasonable first-line option where the toxicity of nivolumab plus ipilimumab is unacceptable, and it is a direct randomised test of an intensified checkpoint regimen against anti–PD-1 monotherapy, which CheckMate 067 does not provide. Two earlier trials define the floor.</p>\n<ul><li><a class=\"trial-link\" href=\"/evidence/#t-mdx010-20-ipilimumab\">MDX010-20 (ipilimumab)</a> was the first trial of any kind to improve survival in advanced melanoma, comparing ipilimumab with or without gp100 vaccine against vaccine alone in previously treated HLA-A*0201-positive disease (median overall survival 10.0 vs 6.4 months, HR approximately 0.66; N Engl J Med 2010;363:711-723).</li><li><a class=\"trial-link\" href=\"/evidence/#t-keynote-006\">KEYNOTE-006</a> then displaced ipilimumab as first-line therapy, showing that pembrolizumab improved overall survival (1-year overall survival approximately 74% vs 58%; HR 0.63–0.69) and progression-free survival with less high-grade toxicity (N Engl J Med 2015;372:2521-2532); on long follow-up median overall survival was 32.7 versus 15.9 months, progression-free survival 8.4 versus 3.4 months and objective response 42% versus 17%.</li></ul>\n<p>Anti–PD-1, alone or in combination, is the backbone of first-line therapy on the strength of those two results. The chemotherapy comparisons that preceded them are of historical interest only: ipilimumab plus dacarbazine improved overall survival over dacarbazine in CA184-024 (11.2 vs 9.1 months, HR 0.72) and nivolumab improved it in CheckMate 066 (37.3 vs 11.2 months, HR 0.50).</p>\n<h3>First-line therapy in <em>BRAF</em> V600-mutant disease</h3>\n<p>Immunotherapy works in <em>BRAF</em>-mutant melanoma, and the sequencing question is which modality to use first, not whether to use both. ESMO recommends first-line nivolumab plus ipilimumab where it can be safely delivered over the first few months, that is where the disease is not so aggressive or symptomatic that a rapid response is required, with targeted therapy reserved for later lines. <a class=\"trial-link\" href=\"/evidence/#t-dreamseq-ea6134\">DREAMseq (EA6134)</a> is the trial that settled the default. It randomised 265 patients with untreated <em>BRAF</em> V600-mutant metastatic melanoma to nivolumab plus ipilimumab followed by dabrafenib plus trametinib at progression, or the reverse sequence. Starting with immunotherapy gave a higher 2-year overall survival than starting with targeted therapy (71.8%, 95% CI 62.5 to 79.1, versus 51.5%, 95% CI 41.7 to 60.4; log-rank P=.010 on Kaplan-Meier estimates; J Clin Oncol 2023;41:186-197). The protocol-specified primary comparison, a Mantel-Haenszel test of 2-year landmark rates among the 176 patients followed for at least 2 years, did not cross its efficacy boundary (P=.163). The trial was stopped early on the recommendation of the data safety monitoring committee after the Kaplan-Meier analysis crossed the O&#x27;Brien-Fleming boundary at 59% information time, with a 95% repeated confidence interval for the difference of 2.6% to 37.9%. The direction and magnitude of the effect are convincing enough to have changed practice, but the formal primary test was not met, and the estimate carries the imprecision of early stopping. Supporting figures point the same way. Two-year progression-free survival was 42% versus 19% with medians of 12 versus 9 months, response rates across the two sequenced steps were 46% then 48% for the immunotherapy-first sequence and 43% then 30% for the targeted-first sequence, and median duration of response was not reached with immunotherapy first versus 13 months with targeted therapy first (P&lt;0.001). The duration-of-response difference is the mechanistically informative one and explains the shape of the curves.</p>\n<p>As in other immunotherapy-sensitive diseases, a proportion of patients progress early on immunotherapy while responders go on to sustained benefit, so the Kaplan-Meier curves cross before separating in favour of the immunotherapy-first sequence. That crossing is the clinical risk of the strategy, and it is the reason a rapidly symptomatic patient with high tumour burden may still be started on targeted therapy. <a class=\"trial-link\" href=\"/evidence/#t-secombit-ascierto\">SECOMBIT (Ascierto)</a> tested the same question in a non-comparative randomised phase II design with three arms:</p>\n<ul><li>encorafenib plus binimetinib until progression then ipilimumab plus nivolumab;</li><li>ipilimumab plus nivolumab then encorafenib plus binimetinib;</li><li>an 8-week induction of encorafenib plus binimetinib followed by ipilimumab plus nivolumab and then re-treatment with encorafenib plus binimetinib at progression.</li></ul>\n<p>All three arms exceeded the prespecified overall survival threshold, with 2-year and 3-year overall survival of 65% and 54% for the targeted-first arm, 73% and 62% for the immunotherapy-first arm, and 69% and 60% for the sandwich arm (J Clin Oncol 2023;41:212-221). The trial was not designed for between-arm comparison, so the ordering is a trend rather than a result, but it is concordant with DREAMseq. <a class=\"trial-link\" href=\"/evidence/#t-ebin-robert\">EBIN (Robert)</a> then tested the sandwich strategy properly and found against it. In 271 patients with untreated unresectable stage III/IV <em>BRAF</em> V600E/K-mutant melanoma, 12 weeks of encorafenib plus binimetinib before nivolumab plus ipilimumab gave no progression-free survival benefit over going straight to the checkpoint doublet (median 9 versus 9 months, HR 0.87), at the cost of more grade 3–5 treatment-related adverse events (42% versus 32%; Lancet Oncol 2025;26:781-794). Short targeted induction to debulk before immunotherapy is therefore not supported.</p>\n<h3>BRAF and MEK inhibition</h3>\n<p>Three BRAF inhibitors (vemurafenib, dabrafenib, encorafenib) and three MEK inhibitors (trametinib, cobimetinib, binimetinib) are in use, and they are given as fixed pairings. <a class=\"trial-link\" href=\"/evidence/#t-brim-3\">BRIM-3</a> first proved the target, with vemurafenib reducing the risk of death by 63% versus dacarbazine in the primary analysis (HR 0.37) and prolonging progression-free survival (5.3 vs 1.6 months; N Engl J Med 2011;364:2507-2516). Single-agent trametinib and dabrafenib showed the same pattern against chemotherapy in METRIC (progression-free survival 4.8 vs 1.5 months, HR 0.45; objective response 40% vs 14%) and BREAK-3 (5.1 vs 2.7 months, HR 0.30; objective response 50% vs 6%), with overall survival estimates confounded by crossover. Adding a MEK inhibitor to a BRAF inhibitor improved response, progression-free survival and overall survival in each of the randomised comparisons below, and it reduces the cutaneous toxicity of BRAF inhibition by suppressing paradoxical MAPK activation in BRAF wild-type keratinocytes.</p>\n<ul><li><a class=\"trial-link\" href=\"/evidence/#t-cobrim\">coBRIM</a> showed that adding cobimetinib to vemurafenib improved progression-free survival (9.9 vs 6.2 months, HR 0.51) and response rate (N Engl J Med 2014;371:1867-1876), with median overall survival of 22.5 versus 17.4 months (HR 0.70) and objective response in 68% versus 45%.</li><li><a class=\"trial-link\" href=\"/evidence/#t-combi-v\">COMBI-v</a> showed dabrafenib plus trametinib to be superior to vemurafenib on overall survival (12-month overall survival 72% vs 65%, HR 0.69) and progression-free survival (11.4 vs 7.3 months; N Engl J Med 2015;372:30-39), with median overall survival of 25.6 versus 18 months and objective response in 64% versus 51%.</li><li>The dabrafenib/trametinib doublet was also superior to dabrafenib alone in COMBI-d (overall survival 25.1 vs 18.7 months, HR 0.71; progression-free survival 11 vs 8.8 months, HR 0.67; objective response 67% vs 51%).</li><li><a class=\"trial-link\" href=\"/evidence/#t-columbus\">COLUMBUS</a> completed the set, with encorafenib plus binimetinib improving progression-free survival over vemurafenib (14.9 vs 7.3 months, HR 0.54) and a favourable tolerability profile (Lancet Oncol 2018;19:603-615); median overall survival was 33.6 versus 16.9 months against vemurafenib and 33.6 versus 23.4 months against encorafenib alone, with objective response of 64%, 41% and 52% respectively.</li></ul>\n<p>The choice between the three doublets is made on toxicity and schedule rather than on efficacy.</p>\n<h2 id=\"s-therapy-after-anti-pd-1-failure\">Therapy after anti–PD-1 failure</h2>\n<p>Progression on anti–PD-1 is now the commonest advanced-melanoma problem in clinic. The choice of salvage turns on <em>BRAF</em> status, on whether the disease is injectable, and on access to cell therapy. For <em>BRAF</em>-mutant disease the answer is straightforward: switch modality.</p>\n<ul><li>Patients who received checkpoint blockade first move to a BRAF/MEK doublet.</li><li>Patients who received targeted therapy first move to checkpoint blockade.</li></ul>\n<p>For <em>BRAF</em> wild-type disease the options are re-challenge with CTLA-4 blockade, cellular therapy, or an oncolytic approach for injectable disease. SWOG S1616, a randomised phase II trial of 92 patients progressing on anti–PD-1, tested whether CTLA-4 blockade could reverse resistance: nivolumab plus ipilimumab improved progression-free survival over ipilimumab alone (6-month progression-free survival 34% vs 13%, HR 0.63) and objective response (28% vs 9%, P=0.05, with 12% complete and 16% partial responses and a median duration of response of 40.9 months), at the cost of more grade 3 or higher treatment-related events (57% vs 35%, P=0.09); it was not powered for overall survival. Adding an anti–LAG-3 antibody in this setting is far less productive: in RELATIVITY-020 Part D, a phase I/IIa study of 518 patients who had progressed on one or more anti–PD-1 regimens, nivolumab plus relatlimab produced objective response in 12% with median progression-free survival of 2.1 months after one prior anti–PD-1 regimen, and 9.2% with 3.1 months after more than one. Adoptive cell therapy has produced the highest response rates reported in this setting. <a class=\"trial-link\" href=\"/evidence/#t-rohaan-til-vs-ipilimumab\">Rohaan (TIL vs ipilimumab)</a> randomised 168 patients with unresectable stage IIIC/IV melanoma, 86% refractory to anti–PD-1, to tumour-infiltrating lymphocyte therapy after non-myeloablative lymphodepletion followed by high-dose interleukin-2, or to ipilimumab. TIL therapy improved progression-free survival (median 7.2 vs 3.1 months, HR 0.50), with objective response in 49% versus 21% and median overall survival of 25.8 versus 18.9 months (N Engl J Med 2022;387:2113-2125). <a class=\"trial-link\" href=\"/evidence/#t-c-144-01-lifileucel\">C-144-01 (lifileucel)</a> then supported registration on a single-arm basis in melanoma refractory to anti–PD-1 and, where indicated, to BRAF/MEK inhibition, with an objective response rate of 31.4% and a median duration of response of 36.5 months (J Clin Oncol 2025;43:3565-3572); lifileucel is the first FDA-approved cellular therapy for a solid tumour. The price is the regimen rather than the cells: cyclophosphamide and fludarabine lymphodepletion followed by high-dose interleukin-2 confines the approach to fit patients at centres with the infrastructure to deliver it. For patients with injectable locoregional disease, intralesional oncolytic therapy is an option. <a class=\"trial-link\" href=\"/evidence/#t-optim-t-vec\">OPTiM (T-VEC)</a> randomised unresectable stage IIIB–IV melanoma to intralesional talimogene laherparepvec or subcutaneous GM-CSF, improving durable response rate (16% vs 2%) and objective response (26% vs 6%; J Clin Oncol 2015;33:2780-2788). It was the first oncolytic immunotherapy approved for melanoma and remains useful where disease is accessible and the priority is local control. <a class=\"trial-link\" href=\"/evidence/#t-ignyte-rp1\">IGNYTE (RP1)</a> extends the oncolytic principle into the anti–PD-1-failed setting by combining a modified herpes simplex virus with nivolumab. In the registration-intended cohort of 140 patients with confirmed progression while on at least 8 weeks of anti–PD-1 as the last prior therapy, including progression on adjuvant anti–PD-1 (36 of 140 patients), intratumoural RP1 plus nivolumab produced an objective response in 33.6% by modified RECIST, the primary endpoint (95% CI 25.8 to 42.0), and 32.9% by conventional RECIST with a complete response rate of 15.0% (J Clin Oncol 2025;43:3589-3599). Responses were deep and durable, with a median duration of 33.7 months (95% CI 14.1 to not reached) and 69.5% of responses ongoing at 1 year. Uninjected lesions regressed nearly as often as injected ones, with a 30% or greater reduction in 79.0% of 119 uninjected lesions versus 93.6% of 78 injected lesions among responders, which is the systemic-immunity claim of the trial. The counterweight is the whole-cohort progression-free survival of 3.6 months (95% CI 2.0 to 5.0), against overall survival of 75.3% at 1 year and 63.3% at 2 years with the median not reached. Treatment-related adverse events were near-universal but mostly mild (any grade 90.0%; grade 3 or 4 12.9%), with five grade 4 events including myocarditis and splenic rupture and no treatment-related deaths. The trial is single-arm, so none of these figures is a comparison with anything. Ablative therapy directed at oligometastatic sites remains appropriate alongside any of these systemic options, and a clinical trial is the right answer for most patients whose disease has escaped anti–PD-1.</p>\n<h2 id=\"s-uveal-and-mucosal-melanoma\">Uveal and mucosal melanoma</h2>\n<p>Uveal melanoma has a different driver set from cutaneous melanoma and responds poorly to checkpoint blockade, and until recently nothing improved survival in the metastatic setting. <a class=\"trial-link\" href=\"/evidence/#t-imcgp100-202-tebentafusp\">IMCgp100-202 (tebentafusp)</a> changed that for HLA-A*02:01-positive patients. Tebentafusp, a bispecific gp100×CD3 ImmTAC, improved overall survival over investigator&#x27;s choice of pembrolizumab, ipilimumab or dacarbazine in untreated metastatic uveal melanoma (median 21.7 vs 16.0 months, HR 0.51; N Engl J Med 2021;385:1196-1206), and it did so despite low response rates. That dissociation between response and survival is characteristic of the agent and means radiological response should not be used to decide whether to continue it. Because the drug presents a gp100 peptide in the context of HLA-A*02:01, HLA typing is a prerequisite and patients without the allele cannot receive it. <a class=\"trial-link\" href=\"/evidence/#t-optimum-02\">OptimUM-02</a> addresses exactly that gap. In first-line HLA-A*02:01-negative metastatic uveal melanoma, darovasertib, a protein kinase C inhibitor, plus crizotinib improved progression-free survival over investigator&#x27;s choice of pembrolizumab, ipilimumab plus nivolumab, or dacarbazine (median 6.9 versus 3.1 months; HR 0.42; P&lt;0.0001), with objective response in 37.1% versus 5.8% (J Clin Oncol 2026;44(suppl 17):LBA9503). This is the first randomised win in the population tebentafusp cannot treat. Three qualifications matter.</p>\n<ul><li>These are the phase 2 efficacy primary results of a nested phase 2/3 trial.</li><li>Overall survival is the phase 3 primary endpoint and has not been reported.</li><li>The source is an ASCO 2026 abstract rather than a full publication.</li></ul>\n<p>Mucosal melanoma responds poorly to single-agent checkpoint blockade, and the most useful early evidence combines anti–PD-1 with VEGF-directed therapy. <a class=\"trial-link\" href=\"/evidence/#t-sheng-et-al-toripalimab-axitinib\">Sheng et al (toripalimab + axitinib)</a> enrolled 33 treatment-naive patients with metastatic mucosal melanoma in a phase Ib study. Toripalimab plus axitinib achieved an objective response rate of 48.3% among response-evaluable patients, with median progression-free survival of 7.5 months (J Clin Oncol 2019;37:2987-2999). The sample is small and uncontrolled, but the response rate is high for a subtype largely resistant to single-agent checkpoint blockade, and the combination is a reasonable option where a trial is not available. <em>KIT</em> testing is worthwhile in mucosal and acral disease, since a minority carry activating mutations amenable to KIT inhibition.</p>\n<h2 id=\"s-references\">References</h2>\n<ol class=\"refs\">\n<li><a class=\"trial-link\" href=\"/evidence/#t-keynote-716\">KEYNOTE-716</a>. <a href=\"https://drive.google.com/file/d/1Jj6zHgtYS8SVG83UPhoWiz8kQR69L_LM/preview\">Lancet 2022;399:1718-1729</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-checkmate-76k\">CheckMate 76K</a>. <a href=\"https://drive.google.com/file/d/1Y6h4i3jjUqvzFiKJf5md3sriQG2TtHfI/preview\">Nat Med 2023;29:2835-2843</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-keynote-054-eortc-1325\">KEYNOTE-054 (EORTC 1325)</a>. <a href=\"https://drive.google.com/file/d/18uYdsifEAOl1P4L6lT3frr53ZALDkccZ/preview\">N Engl J Med 2018;378:1789-1801</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-checkmate-238\">CheckMate 238</a>. <a href=\"https://drive.google.com/file/d/1Q4gmQzXiRqI-xjZFXnfGCf0LjnQhPxfu/preview\">N Engl J Med 2017;377:1824-1835</a>; <a href=\"https://drive.google.com/file/d/1jSB0Ql5PRCGjzwemtZTmgAM99GHlnocD/preview\">N Engl J Med 2026;394:333-342</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-eortc-18071\">EORTC 18071</a>. <a href=\"https://doi.org/10.1016/S1470-2045(15)70122-1\">Lancet Oncol 2015;16:522-530</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-combi-ad\">COMBI-AD</a>. <a href=\"https://doi.org/10.1056/NEJMoa1708539\">N Engl J Med 2017;377:1813-1823</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-keynote-942-mrna-4157-v940\">KEYNOTE-942 (mRNA-4157/V940)</a>. <a href=\"https://doi.org/10.1016/S0140-6736(23)02268-7\">Lancet 2024;403:632-644</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-nadina\">NADINA</a>. <a href=\"https://drive.google.com/file/d/17guefDSLq9BwPGNny_9k4DLp-In5Q1ku/preview\">N Engl J Med 2024;391:1696-1708</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-swog-s1801\">SWOG S1801</a>. <a href=\"https://doi.org/10.1056/NEJMoa2211437\">N Engl J Med 2023;388:813-823</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-checkmate-067\">CheckMate 067</a>. <a href=\"https://drive.google.com/file/d/1nBOvPUqYlAiwwqvsJUM1cL5uCZxeJOmA/preview\">N Engl J Med 2015;373:23-34</a>; <a href=\"https://drive.google.com/file/d/1p716vQ1p7Lbwwf8g7Y0YhJNPAhAqeHEu/preview\">N Engl J Med 2017;377:1345-1356</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-relativity-047\">RELATIVITY-047</a>. <a href=\"https://doi.org/10.1056/NEJMoa2109970\">N Engl J Med 2022;386:24-34</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-mdx010-20-ipilimumab\">MDX010-20 (ipilimumab)</a>. <a href=\"https://doi.org/10.1056/NEJMoa1003466\">N Engl J Med 2010;363:711-723</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-keynote-006\">KEYNOTE-006</a>. <a href=\"https://doi.org/10.1056/NEJMoa1503093\">N Engl J Med 2015;372:2521-2532</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-dreamseq-ea6134\">DREAMseq (EA6134)</a>. <a href=\"https://drive.google.com/file/d/12z2LJCe7SJgBYOlXWyml5fjYSOsLlhXR/preview\">J Clin Oncol 2023;41:186-197</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-secombit-ascierto\">SECOMBIT (Ascierto)</a>. <a href=\"https://drive.google.com/file/d/1mVe-RpBIlotvRE3PruFhaf8nL8DQNO8y/preview\">J Clin Oncol 2023;41:212-221</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-ebin-robert\">EBIN (Robert)</a>. <a href=\"https://drive.google.com/file/d/184vlWEGsg4xKNXX4Vbr34WkcesdPLkBU/preview\">Lancet Oncol 2025;26:781-794</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-brim-3\">BRIM-3</a>. <a href=\"https://doi.org/10.1056/NEJMoa1103782\">N Engl J Med 2011;364:2507-2516</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-cobrim\">coBRIM</a>. <a href=\"https://doi.org/10.1056/NEJMoa1408868\">N Engl J Med 2014;371:1867-1876</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-combi-v\">COMBI-v</a>. <a href=\"https://doi.org/10.1056/NEJMoa1412690\">N Engl J Med 2015;372:30-39</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-columbus\">COLUMBUS</a>. <a href=\"https://doi.org/10.1016/S1470-2045(18)30142-6\">Lancet Oncol 2018;19:603-615</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-rohaan-til-vs-ipilimumab\">Rohaan (TIL vs ipilimumab)</a>. <a href=\"https://drive.google.com/file/d/1iP-xVQzJrrKVotmv3OqNYzBrZ0a_4MTU/preview\">N Engl J Med 2022;387:2113-2125</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-c-144-01-lifileucel\">C-144-01 (lifileucel)</a>. <a href=\"https://drive.google.com/file/d/1A0kV__JlmaAEJ9nBXs676o3xDrhcv5aF/preview\">J Clin Oncol 2025;43:3565-3572</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-optim-t-vec\">OPTiM (T-VEC)</a>. <a href=\"https://doi.org/10.1200/JCO.2014.58.3377\">J Clin Oncol 2015;33:2780-2788</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-ignyte-rp1\">IGNYTE (RP1)</a>. <a href=\"https://drive.google.com/file/d/1HfzfgHkq0NP_Fnzftg29g5Rs6r1Ncav2/preview\">J Clin Oncol 2025;43:3589-3599</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-imcgp100-202-tebentafusp\">IMCgp100-202 (tebentafusp)</a>. <a href=\"https://doi.org/10.1056/NEJMoa2103485\">N Engl J Med 2021;385:1196-1206</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-optimum-02\">OptimUM-02</a>. <a href=\"https://doi.org/10.1200/JCO.2026.44.17_suppl.LBA9503\">J Clin Oncol 2026;44(suppl 17):LBA9503</a>; <a href=\"https://drive.google.com/file/d/1E5UDfQD85uSxpDPTlXYKLVBOXZtUg6W3/preview\">Orloff et al. - 2026 - Darovasertib plus crizotinib vs investigator&#x27;s choice as first-line treatment for HLA-A2 negative [1126b8da]</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-sheng-et-al-toripalimab-axitinib\">Sheng et al (toripalimab + axitinib)</a>. <a href=\"https://doi.org/10.1200/JCO.19.00210\">J Clin Oncol 2019;37:2987-2999</a></li>\n</ol>", "_hay": "melanoma melanoma melanoma epidemiology risk factors pathology and molecular classification clinical presentation and diagnosis staging and work-up management of resectable disease management of advanced disease therapy after anti–pd-1 failure uveal and mucosal melanoma references sentinel lymph node biopsy imaging for distant metastases surgery and radiotherapy adjuvant systemic therapy by stage neoadjuvant therapy first-line therapy in *braf* wild-type disease first-line therapy in *braf* v600-mutant disease braf and mek inhibition"}];
const GROUPS = ["Melanoma"];
const BYID = Object.fromEntries(NOTES.map(n => [n.id, n]));

let state = { view:'index', group:null, id:null, q:'' };

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function inGroup(g){ return NOTES.filter(n => n.group === g); }

// ---- Sidebar: "All notes" + a collapsible section per tumour group ----
const nav = document.getElementById('nav');
GROUPS.forEach(g => {
  const block = document.createElement('div'); block.className = 'navsec';
  const head = document.createElement('button'); head.type = 'button'; head.className = 'secname';
  head.setAttribute('aria-expanded','true');
  head.innerHTML = `<span>${esc(g)}</span><span class="caret" aria-hidden="true">&#9660;</span>`;
  head.onclick = () => { const collapsed = block.classList.toggle('collapsed'); head.setAttribute('aria-expanded', collapsed ? 'false' : 'true'); };
  block.appendChild(head);
  const box = document.createElement('div'); box.className = 'items';
  inGroup(g).forEach(n => {
    const a = document.createElement('button'); a.type = 'button'; a.dataset.id = n.id;
    a.innerHTML = `<span>${esc(n.title)}</span>`;
    a.onclick = () => selectNote(n.id);
    box.appendChild(a);
  });
  block.appendChild(box); nav.appendChild(block);
});
function syncNav(){ document.querySelectorAll('.items button').forEach(a => a.classList.toggle('active', state.view==='note' && a.dataset.id===state.id)); }
document.getElementById('showall').onclick = () => { state.view='index'; state.group=null; state.id=null; state.q=''; document.getElementById('q').value=''; closeNav(); render(true); window.scrollTo(0,0); };

// ---- Drawer (burger at every width) ----
const backdrop = document.getElementById('backdrop');
const burger = document.getElementById('burger');
function closeNav(){ document.body.classList.remove('nav-open'); }
burger.onclick = () => document.body.classList.toggle('nav-open');
backdrop.onclick = closeNav;

// ---- Search: title + section headings, across every note ----
document.getElementById('q').oninput = e => {
  state.q = e.target.value.toLowerCase().trim();
  state.view = state.q ? 'search' : 'index';
  state.id = null;
  render();
};

function selectNote(id){
  state.view='note'; state.id=id; state.q='';
  const q = document.getElementById('q'); if (q) q.value='';
  closeNav(); render(true); window.scrollTo(0,0);
}
function selectGroup(g){
  state.view='group'; state.group=g; state.id=null; state.q='';
  const q = document.getElementById('q'); if (q) q.value='';
  closeNav(); render(true); window.scrollTo(0,0);
}

function noteItem(n, meta){
  return `<button class="nitem" type="button" data-id="${esc(n.id)}">
    <span class="ntitle">${esc(n.title)}</span>
    <span class="nmeta">${esc(meta || n.updated || '')}</span></button>`;
}

function renderIndex(res){
  res.innerHTML = `<div class="ngrid">` + GROUPS.map(g => {
    const c = inGroup(g).length;
    return `<button class="gcard" type="button" data-group="${esc(g)}">
      <span class="gbody"><span class="gname">${esc(g)}</span>
      <span class="gcount">${c} note${c===1?'':'s'}</span></span>
      <span class="go" aria-hidden="true">&rarr;</span></button>`;
  }).join('') + `</div>`;
  res.querySelectorAll('.gcard').forEach(b => b.onclick = () => selectGroup(b.dataset.group));
}

function renderGroup(res){
  const notes = inGroup(state.group);
  res.innerHTML = `<button class="backpill" type="button" data-back="index">&#8592; All groups</button>
    <div class="seclabel">${esc(state.group)}</div>
    <div class="nlist">${notes.map(n => noteItem(n)).join('')}</div>`;
  wireList(res);
}

function renderSearch(res){
  const hits = NOTES.filter(n => n._hay.includes(state.q));
  if (!hits.length) { res.innerHTML = `<div class="empty">No note matches that search.</div>`; return; }
  res.innerHTML = `<div class="seclabel">${hits.length} note${hits.length===1?'':'s'} matching &ldquo;${esc(state.q)}&rdquo;</div>
    <div class="nlist">${hits.map(n => noteItem(n, n.group)).join('')}</div>`;
  wireList(res);
}

function renderNote(res, n){
  const toc = n.sections.length
    ? `<nav class="toc" aria-label="Sections">` +
      n.sections.map(s => `<a href="#${esc(s.id)}" data-sec="${esc(s.id)}">${esc(s.h)}</a>`).join('') +
      `</nav>` : '';
  res.innerHTML = `<button class="backpill" type="button" data-back="group">&#8592; ${esc(n.group)}</button>
    <div class="notehead"><h2>${esc(n.title)}</h2>
      <div class="notemeta"><span>${esc(n.group)}</span>${n.updated ? `<span>Updated ${esc(n.updated)}</span>` : ''}</div>
    </div>${toc}<div class="nbody">${n.html}</div>`;
  res.querySelectorAll('.toc a').forEach(a => a.onclick = ev => {
    ev.preventDefault();
    const t = document.getElementById(a.dataset.sec);
    if (t) t.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block:'start' });
  });
  wireBack(res);
  spy();
}

function wireList(res){
  res.querySelectorAll('.nitem').forEach(b => b.onclick = () => selectNote(b.dataset.id));
  wireBack(res);
}
function wireBack(res){
  const b = res.querySelector('.backpill');
  if (!b) return;
  b.onclick = () => {
    if (b.dataset.back === 'group' && state.id && BYID[state.id]) selectGroup(BYID[state.id].group);
    else { state.view='index'; state.group=null; state.id=null; render(true); window.scrollTo(0,0); }
  };
}

// ---- TOC scroll-spy. Registered through window.addEventListener so the oncOS
// One shell captures and removes it when the view is torn down. ----
let spyTick = false;
function spy(){
  const links = document.querySelectorAll('.toc a');
  if (!links.length) return;
  let active = null;
  links.forEach(a => {
    const el = document.getElementById(a.dataset.sec);
    if (el && el.getBoundingClientRect().top <= 130) active = a;
  });
  if (!active) active = links[0];
  links.forEach(a => a.classList.toggle('active', a === active));
}
window.addEventListener('scroll', () => {
  if (spyTick) return;
  spyTick = true;
  requestAnimationFrame(() => { spyTick = false; if (state.view === 'note') spy(); });
}, { passive: true });

function render(fade){
  if (fade && !(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches)) {
    const res = document.getElementById('results');
    res.classList.add('vfade');
    setTimeout(() => { if(!res.isConnected) return; renderNow(); res.classList.remove('vfade'); }, 150);
    return;
  }
  renderNow();
}

function renderNow(){
  syncNav();
  const res = document.getElementById('results');
  if (!NOTES.length) { res.innerHTML = `<div class="empty">No notes have been published yet.</div>`; return; }
  if (state.view==='note' && BYID[state.id]) { renderNote(res, BYID[state.id]); return; }
  if (state.view==='search') { renderSearch(res); return; }
  if (state.view==='group' && state.group) { renderGroup(res); return; }
  renderIndex(res);
}
render();
  },
  destroy: function() {

  }
};
</script>
