epth": 3}, {"id": "s-lurbinectedin-topotecan-and-other-chemotherapy", "h": "Lurbinectedin, topotecan, and other chemotherapy", "depth": 3}, {"id": "s-investigational-antibody-drug-conjugates", "h": "Investigational antibody–drug conjugates", "depth": 3}, {"id": "s-follow-up-and-survivorship", "h": "Follow-up and survivorship", "depth": 2}, {"id": "s-references", "h": "References", "depth": 2}], "html": "<h2 id=\"s-at-a-glance\">At a glance</h2>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\">Small cell lung cancer (SCLC) is managed as limited-stage or extensive-stage disease because the first treatment decision is whether definitive thoracic radiotherapy can be delivered safely within one tolerable field.</span><span class=\"evidence-detail\">Obtain contrast-enhanced chest and upper-abdominal imaging, brain MRI, and usually FDG-PET/CT before assigning stage; confirm any solitary finding that would change curative intent when feasible<sup class=\"trial-ref\"><a href=\"#ref-lung-small-cell-lung-cancer-ext-2cbbafe249fd\" aria-label=\"Reference 1: NCI PDQ small cell lung cancer treatment\">1</a></sup>.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">For fit limited-stage disease beyond a small node-negative tumour, use early concurrent platinum–etoposide and thoracic radiotherapy, then offer durvalumab when there has been no progression after concurrent chemoradiotherapy.</span><span class=\"evidence-detail\">For extensive-stage disease, use platinum–etoposide with atezolizumab or durvalumab when immunotherapy is suitable, followed by the corresponding maintenance strategy; reassess thoracic and intracranial disease before choosing consolidation.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">At relapse, treatment depends on the treatment-free interval, performance status, organ function, previous toxicity, and access.</span><span class=\"evidence-detail\">Tarlatamab improves survival over standard chemotherapy after platinum and now requires a step-up and monitored-start pathway; lurbinectedin, topotecan, platinum rechallenge, and selected single agents remain useful alternatives. Early palliative care and symptom-directed radiotherapy should accompany, not await failure of, systemic therapy.</span></li></ul>\n<h2 id=\"s-diagnosis-biology-and-staging\">Diagnosis, biology, and staging</h2>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\">SCLC accounts for roughly 15% of lung cancers and is strongly associated with tobacco exposure.</span><span class=\"evidence-detail\">It is a high-grade neuroendocrine carcinoma with rapid proliferation, early dissemination, and frequent initial chemosensitivity followed by resistance. Central bulky disease, mediastinal adenopathy, cough, dyspnoea, weight loss, superior vena cava obstruction, and brain metastases are common clinical patterns.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">Paraneoplastic presentations include syndrome of inappropriate antidiuresis, ectopic-ACTH Cushing syndrome, and Lambert–Eaton myasthenic syndrome; hypercalcaemia is less characteristic than in non-small cell lung cancer.</span><span class=\"evidence-detail\">Common genomic abnormalities include <em>TP53</em> mutation, <em>RB1</em> loss, and <em>MYC</em> amplification, but none currently selects standard first-line treatment in de novo SCLC.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">Obtain adequate tissue for morphology and neuroendocrine immunophenotyping, while avoiding a nonessential invasive procedure that delays treatment in a clinically unstable patient.</span><span class=\"evidence-detail\">Routine broad molecular profiling does not select standard first-line therapy in de novo SCLC. Preserve tissue or plasma for a targeted question when mixed histology, an atypical clinical course, or transformation from a molecularly defined non-small cell cancer is suspected.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">Record both TNM stage and the practical two-stage category.</span><span class=\"evidence-detail\">Limited-stage disease is confined to one hemithorax with regional nodes that can be encompassed safely in a definitive radiation plan; extensive-stage disease exceeds that field or includes distant metastasis. Contralateral mediastinal or ipsilateral supraclavicular nodes may remain limited-stage, whereas malignant pleural or pericardial effusion generally defines extensive-stage disease<sup class=\"trial-ref\"><a href=\"#ref-lung-small-cell-lung-cancer-ext-2e136280f06e\" aria-label=\"Reference 2: ESMO SCLC clinical practice guideline\">2</a></sup>.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">Baseline assessment should include performance status, weight, full blood count, renal and hepatic function, electrolytes, and smoking status.</span><span class=\"evidence-detail\">Use brain MRI rather than CT when available. Consider pulmonary function testing before definitive thoracic radiotherapy, and assess hearing, neuropathy, and kidney function before cisplatin; carboplatin is reasonable when cisplatin toxicity would compromise treatment delivery.</span></li></ul>\n<h2 id=\"s-limited-stage-disease\">Limited-stage disease</h2>\n<h3 id=\"s-small-node-negative-tumours\">Small node-negative tumours</h3>\n<p>For clinical T1–2N0 disease, confirm mediastinal node negativity invasively when surgery is contemplated. In a fit patient with a resectable peripheral tumour, lobectomy with systematic nodal dissection followed by platinum–etoposide is an option; sublobar resection is generally inadequate. Unexpected nodal disease or a positive margin usually shifts postoperative management toward multidisciplinary chemoradiotherapy rather than surgery alone.</p>\n<h4>Evidence supporting the surgical pathway</h4>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\">Surgery is supported by retrospective selection rather than a modern randomized comparison.</span><span class=\"evidence-detail\">In 349 resected cases from the IASLC staging project, five-year survival was 48%, 39%, and 15% for pathological stages I, II, and III, respectively; these stage-conditioned outcomes cannot be compared directly with chemoradiotherapy series<sup class=\"trial-ref\"><a href=\"#ref-lung-small-cell-lung-cancer-ext-5e03eb2dd338\" aria-label=\"Reference 3: IASLC pathologic staging project for SCLC\">3</a></sup>.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">In a National Cancer Database analysis, surgery was associated with median survival of 38.6 versus 22.9 months for stage I disease, but residual confounding remains despite propensity matching.</span><span class=\"evidence-detail\">Among completely resected pT1–2N0 tumours, adjuvant therapy improved five-year survival from 40.4% to 52.7% in a separate observational cohort; these estimates support the pathway, not an individualized causal effect<sup class=\"trial-ref\"><a href=\"#ref-lung-small-cell-lung-cancer-ext-071321debe9b\" aria-label=\"Reference 4: Propensity-matched surgery analysis in SCLC\">4</a></sup> <sup class=\"trial-ref\"><a href=\"#ref-lung-small-cell-lung-cancer-ext-69cd8e60a861\" aria-label=\"Reference 5: Adjuvant therapy after resected early SCLC\">5</a></sup>.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">Stereotactic ablative radiotherapy followed by systemic therapy is a reasonable curative-intent alternative when a small node-negative tumour is medically inoperable, although randomized SCLC-specific evidence is limited.</span><span class=\"evidence-detail\">Do not extrapolate a surgery pathway to bulky or node-positive disease: most stage II–III limited-stage cancers are treated with definitive chemoradiotherapy because occult systemic disease is common even when imaging is apparently confined to the thorax.</span></li></ul>\n<h3 id=\"s-stage-ii-iii-chemoradiotherapy\">Stage II–III chemoradiotherapy</h3>\n<p>Use four cycles of cisplatin–etoposide with thoracic radiotherapy starting during cycle 1 or 2 when tumour volume and organ-at-risk constraints permit. Carboplatin–etoposide is acceptable when cisplatin is unsuitable. Early multidisciplinary planning matters because postponing radiotherapy to complete chemotherapy can forfeit local control, while excessively large fields may require an individualized sequential approach to preserve safety.</p>\n<p>A common cisplatin–etoposide schedule is cisplatin 60–80 mg/m² on day 1 with etoposide 100–120 mg/m² on days 1–3 every three weeks; split cisplatin 25 mg/m² on days 1–3 can reduce hydration burden. Avoid unplanned early dose erosion where possible, but prioritize safe delivery and use current institutional protocols for renal, hepatic, marrow, and radiation-related adjustments.</p>\n<h4>Choose the thoracic radiotherapy schedule</h4>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\">Thoracic radiotherapy adds a modest but clinically meaningful survival benefit to chemotherapy.</span><span class=\"evidence-detail\">In an individual-patient meta-analysis of 2,103 analysable participants from 13 randomized trials, thoracic radiotherapy reduced the relative risk of death to 0.86 (95% CI 0.78–0.94; p=0.001) and increased three-year survival from 8.9% to 14.3%, an absolute gain of 5.4 percentage points<sup class=\"trial-ref\"><a href=\"#ref-lung-small-cell-lung-cancer-t-pignon-meta-analysis\" aria-label=\"Reference 6: Pignon Meta-Analysis\">6</a></sup>.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">Twice-daily radiotherapy remains the reference schedule for fit patients.</span><span class=\"evidence-detail\">In INT-0096, 45 Gy in 30 twice-daily fractions improved median overall survival from 19 to 23 months and five-year survival from 16% to 26% compared with 45 Gy once daily, at the cost of more grade 3 oesophagitis (27% versus 11%)<sup class=\"trial-ref\"><a href=\"#ref-lung-small-cell-lung-cancer-t-int-0096-turrisi\" aria-label=\"Reference 7: INT-0096 (Turrisi)\">7</a></sup>.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">CONVERT tested dose-escalated once-daily radiotherapy as a superiority strategy.</span><span class=\"evidence-detail\">Once-daily 66 Gy did not improve median overall survival over 45 Gy twice daily (25 versus 30 months; HR 1.18, 95% CI 0.95–1.45; p=0.14). This negative superiority result did not establish equivalence, but supports 66 Gy once daily as an alternative when twice-daily treatment is impractical<sup class=\"trial-ref\"><a href=\"#ref-lung-small-cell-lung-cancer-t-convert\" aria-label=\"Reference 8: CONVERT\">8</a></sup>.</span></li><li class=\"evidence-prose\">Both twice-daily and once-daily guideline-concordant definitive schedules are used; select the schedule according to patient fitness, logistics, field size, organ-at-risk constraints and departmental expertise rather than treating one schedule as universally feasible<sup class=\"trial-ref\"><a href=\"#ref-lung-small-cell-lung-cancer-ext-2e136280f06e\" aria-label=\"Reference 2: ESMO SCLC clinical practice guideline\">2</a></sup>.</li></ul>\n<h3 id=\"s-consolidation-durvalumab\">Consolidation durvalumab</h3>\n<p>Offer durvalumab to patients with stage I–III limited-stage SCLC, good performance status, and no progression after definitive concurrent platinum-based chemoradiotherapy, once acute toxicity has recovered. The current US regimen is 1,500 mg every four weeks until progression, unacceptable toxicity, or a maximum of 24 months; check the local label and contraindications before treatment<sup class=\"trial-ref\"><a href=\"#ref-lung-small-cell-lung-cancer-ext-c84f304b49f3\" aria-label=\"Reference 9: US durvalumab prescribing information\">9</a></sup>.</p>\n<h4>Evidence for durvalumab</h4>\n<ul><li class=\"evidence-prose\">In ADRIATIC, durvalumab improved median overall survival to 55.9 months versus 33.4 months with placebo (HR 0.73; 98.321% CI 0.54–0.98; p=0.01) and blinded independent-review progression-free survival to 16.6 versus 9.2 months (HR 0.76; 97.195% CI 0.59–0.98; p=0.02), crossing the prespecified interim boundaries<sup class=\"trial-ref\"><a href=\"#ref-lung-small-cell-lung-cancer-t-adriatic\" aria-label=\"Reference 10: ADRIATIC\">10</a></sup>.</li><li class=\"evidence-prose\"><span class=\"evidence-lead\">Pneumonitis or radiation pneumonitis occurred in 38.2% with durvalumab and 30.2% with placebo; grade 3–4 events occurred in 3.1% and 2.6%, respectively, with one grade 5 event.</span><span class=\"evidence-detail\">Before starting treatment, distinguish resolving radiation injury from infection or immune pneumonitis. The tremelimumab comparison had not crossed its overall-survival boundary and does not establish a consolidation doublet.</span></li></ul>\n<h4>Atezolizumab does not establish a consolidation class effect</h4>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\">Conference-abstract evidence does not establish a consolidation class effect.</span><span class=\"evidence-detail\">In ACHILES, one year of atezolizumab after concurrent chemoradiotherapy did not improve overall survival over observation (43.3 versus 38.8 months; HR 1.14, 95% CI 0.76–1.72; p=0.5) or secondary progression-free survival (21.1 versus 15.9 months; HR 0.88; nominal p=0.5).</span></li><li class=\"evidence-prose\">Grade 3–4 toxicity was 34% versus 20% and treatment-related deaths three versus none, but the one-page abstract did not report denominators, formal analysis-set definitions or complete safety detail<sup class=\"trial-ref\"><a href=\"#ref-lung-small-cell-lung-cancer-t-achiles\" aria-label=\"Reference 11: ACHILES\">11</a></sup>.</li></ul>\n<h3 id=\"s-prophylactic-cranial-irradiation\">Prophylactic cranial irradiation</h3>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\">Discuss prophylactic cranial irradiation (PCI) after a good response to definitive treatment, especially in fit patients with stage II–III disease.</span><span class=\"evidence-detail\">In the individual-patient meta-analysis of 987 complete responders, PCI reduced mortality (RR 0.84; 95% CI 0.73–0.97; p=0.01), raised three-year survival from 15.3% to 20.7%, and reduced three-year brain-metastasis incidence from 58.6% to 33.3%<sup class=\"trial-ref\"><a href=\"#ref-lung-small-cell-lung-cancer-t-pci-overview-collaborative-group-aup-rin\" aria-label=\"Reference 12: PCI Overview Collaborative Group (Aupérin)\">12</a></sup>.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">The meta-analysis included only 140 patients with extensive-stage disease, and the stage interaction was not significant.</span><span class=\"evidence-detail\">Extensive-stage disease was imbalanced at baseline, 12% with PCI versus 17% without, driven by one component trial and no longer significant after trial adjustment. Neuropsychological testing was sparse, so the pooled evidence neither quantifies long-term cognitive harm nor excludes it.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">For an older, frail, or cognitively vulnerable patient, brain MRI surveillance is a reasonable alternative after shared decision-making.</span><span class=\"evidence-detail\">Explain fatigue, alopecia, memory effects, and the uncertainty around individual neurocognitive risk. The survival evidence arose from complete responders, whereas current recommendations often extend to broader responders; name that extrapolation during counselling rather than presenting the populations as identical.</span></li></ul>\n<h2 id=\"s-extensive-stage-disease\">Extensive-stage disease</h2>\n<h3 id=\"s-first-line-systemic-therapy\">First-line systemic therapy</h3>\n<p>For most fit patients, use carboplatin or cisplatin plus etoposide for four cycles with atezolizumab or durvalumab, followed by maintenance with the same checkpoint inhibitor. Do not delay urgent therapy for routine biomarker testing. Select the platinum according to renal function, hearing, neuropathy, emesis risk, marrow reserve, and the practical likelihood of completing treatment.</p>\n<h4>Select the platinum</h4>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\">Carboplatin and cisplatin have similar efficacy at a population level.</span><span class=\"evidence-detail\">In the COCIS individual-patient meta-analysis of 663 participants, median overall survival was 9.6 versus 9.4 months (HR 1.08; 95% CI 0.92–1.27; p=0.37), progression-free survival was 5.5 versus 5.3 months (HR 1.10; p=0.25), and response rates were 67.1% versus 66.0%<sup class=\"trial-ref\"><a href=\"#ref-lung-small-cell-lung-cancer-ext-7899d1e2bbb6\" aria-label=\"Reference 13: COCIS carboplatin versus cisplatin meta-analysis\">13</a></sup>.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">Carboplatin caused more haematological toxicity and cisplatin more non-haematological toxicity in COCIS; 32% of participants had limited-stage disease.</span><span class=\"evidence-detail\">This supports toxicity-based platinum selection, not a claim that either drug is globally better tolerated. Etoposide is highly protein-bound and requires regimen-specific hepatic and renal review; avoid an automatic dose rule based on albumin alone.</span></li></ul>\n<h4>Place the cytotoxic backbone in context</h4>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\">Historical randomized comparisons established platinum–etoposide as the cytotoxic backbone.</span><span class=\"evidence-detail\">In 437 eligible patients, etoposide–cisplatin, CAV and alternating CAV/EP produced similar median overall survival (8.6, 8.3 and 8.1 months; p=0.425); the trial was not designed to establish equivalence<sup class=\"trial-ref\"><a href=\"#ref-lung-small-cell-lung-cancer-t-secsg-cav-ep-roth\" aria-label=\"Reference 14: SECSG CAV/EP (Roth)\">14</a></sup>.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">A Japanese mixed-stage trial likewise found no robust survival advantage for alternating CAV/PE over either regimen alone.</span><span class=\"evidence-detail\">The nominal alternating-versus-CAV comparison lost significance after prognostic adjustment, and stage-specific analyses were unpowered without an interaction test<sup class=\"trial-ref\"><a href=\"#ref-lung-small-cell-lung-cancer-t-japanese-cav-pe-trial-fukuoka\" aria-label=\"Reference 15: Japanese CAV/PE trial (Fukuoka)\">15</a></sup>.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">In the Norwegian trial, etoposide–cisplatin improved overall survival over CEV in 436 eligible patients (10.2 versus 7.8 months; one-sided p=0.0004).</span><span class=\"evidence-detail\">Limited- and extensive-stage results were descriptive because no treatment-by-stage interaction was reported<sup class=\"trial-ref\"><a href=\"#ref-lung-small-cell-lung-cancer-t-norwegian-ep-vs-cev-sundstr-m\" aria-label=\"Reference 16: Norwegian EP vs CEV (Sundstrøm)\">16</a></sup>.</span></li></ul>\n<h4>Add a survival-positive checkpoint inhibitor</h4>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\">In IMpower133, atezolizumab plus carboplatin–etoposide improved median overall survival from 10.3 to 12.3 months (HR 0.70; 95% CI 0.54–0.91; p=0.007) and progression-free survival from 4.3 to 5.2 months (HR 0.77; p=0.02).</span><span class=\"evidence-detail\">Confirmed response rates were similar in a post-hoc analysis (60.2% versus 64.4%); this analysis does not identify the mechanism of the survival benefit<sup class=\"trial-ref\"><a href=\"#ref-lung-small-cell-lung-cancer-t-impower133\" aria-label=\"Reference 17: IMpower133\">17</a></sup>.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">In CASPIAN, durvalumab plus platinum–etoposide improved median overall survival from 10.3 to 13.0 months at the primary interim analysis (HR 0.73; 95% CI 0.59–0.91; p=0.0047); the updated comparison was 12.9 versus 10.5 months (HR 0.75; 95% CI 0.62–0.91; nominal p=0.0032).</span><span class=\"evidence-detail\">The trial permitted cisplatin and did not use maintenance etoposide<sup class=\"trial-ref\"><a href=\"#ref-lung-small-cell-lung-cancer-t-caspian\" aria-label=\"Reference 18: CASPIAN\">18</a></sup>.</span></li><li class=\"evidence-prose\">At the primary interim analysis, CASPIAN progression-free survival was 5.1 versus 5.4 months (HR 0.78), and confirmed response was 68% versus 58%; these were not alpha-protected efficacy claims in the reported hierarchy and should remain secondary context.</li><li class=\"evidence-prose\">In IMpower133, treatment-related grade 3–4 events occurred in 56.6% versus 56.1%, and immune-mediated adverse events in 39.9% versus 24.5%.</li><li class=\"evidence-prose\"><span class=\"evidence-lead\">Do not add tremelimumab routinely: the CASPIAN durvalumab–tremelimumab arm did not cross its prespecified overall-survival boundary.</span><span class=\"evidence-detail\">Pembrolizumab improved progression-free survival in KEYNOTE-604 (4.5 versus 4.3 months; HR 0.75; p=0.0023) but its overall-survival result (10.8 versus 9.7 months; HR 0.80; p=0.0164) missed the multiplicity-adjusted boundary of p=0.0128<sup class=\"trial-ref\"><a href=\"#ref-lung-small-cell-lung-cancer-t-keynote-604\" aria-label=\"Reference 19: KEYNOTE-604\">19</a></sup>.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">At 12 months, progression-free survival in KEYNOTE-604 was 13.6% versus 3.1%; response was 70.6% versus 61.8%, an exploratory comparison.</span><span class=\"evidence-detail\">Grade 3–4 adverse events occurred in 76.7% and 74.9%. These secondary signals do not reverse the failed overall-survival hypothesis and should not be used to promote pembrolizumab over an approved survival-positive first-line regimen.</span></li></ul>\n<h4>Consider regional and selected alternatives</h4>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\">Serplulimab plus chemotherapy improved median overall survival to 15.4 months versus 10.9 months in ASTRUM-005 (HR 0.63; 95% CI 0.49–0.82; p&lt;0.001).</span><span class=\"evidence-detail\">The enrolled population was predominantly Asian, 68.4% were Chinese, there were no US sites, and non-Asian follow-up was short; use must follow local approval and access rather than cross-trial efficacy ranking<sup class=\"trial-ref\"><a href=\"#ref-lung-small-cell-lung-cancer-t-astrum-005\" aria-label=\"Reference 20: ASTRUM-005\">20</a></sup>.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">Blinded-review progression-free survival was 5.7 versus 4.3 months (HR 0.48), and response was 80.2% versus 70.4%, but these were exploratory and no formal PFS p-value was reported.</span><span class=\"evidence-detail\">Treatment-related grade 3 or higher adverse events occurred in 33.2% versus 27.6%; immune-related events occurred in 37.0% versus 18.4%, with study-drug deaths in 0.8% versus 0.5%.</span></li></ul>\n<p>Other chemo-immunotherapy regimens may be approved regionally.</p>\n<ul><li class=\"evidence-prose\">In EXTENTORCH, toripalimab improved median overall survival to 14.6 versus 13.3 months (HR 0.80; p=0.03) and progression-free survival (HR 0.67; p&lt;0.001)<sup class=\"trial-ref\"><a href=\"#ref-lung-small-cell-lung-cancer-ext-70244b12d72c\" aria-label=\"Reference 21: EXTENTORCH randomized phase III trial\">21</a></sup>.</li><li class=\"evidence-prose\">CAPSTONE-1 reported 15.3 versus 12.8 months with adebrelimab (HR 0.72; p=0.0017); neither comparison establishes superiority over atezolizumab or durvalumab<sup class=\"trial-ref\"><a href=\"#ref-lung-small-cell-lung-cancer-ext-3e93f4555e1c\" aria-label=\"Reference 22: CAPSTONE-1 randomized phase III trial\">22</a></sup>.</li><li class=\"evidence-prose\"><span class=\"evidence-lead\">Irinotecan–cisplatin produced longer survival than etoposide–cisplatin in the Japanese JCOG9511 trial: 12.8 versus 9.4 months (relative risk of death 0.60; 95% CI 0.43–0.83; p=0.002).</span><span class=\"evidence-detail\">Progression-free survival was 6.9 versus 4.8 months, and response was 84.4% versus 67.5%; these secondary comparisons were nominal<sup class=\"trial-ref\"><a href=\"#ref-lung-small-cell-lung-cancer-t-jcog9511-noda\" aria-label=\"Reference 23: JCOG9511 (Noda)\">23</a></sup>.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">The JCOG9511 result was not consistently reproduced outside Japan.</span><span class=\"evidence-detail\">Severe diarrhoea occurred in 16% versus 0%, while neutropenia was less frequent; three versus one treatment-related deaths occurred. These efficacy and toxicity patterns make irinotecan–cisplatin an alternative in selected settings rather than a universal first-line standard.</span></li></ul>\n<h3 id=\"s-immediate-complications-and-supportive-care\">Immediate complications and supportive care</h3>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\">Treat symptomatic brain metastases according to neurological urgency, number and volume of lesions, extracranial control, and performance status; do not reflexively substitute PCI for therapeutic brain radiotherapy.</span><span class=\"evidence-detail\">Give corticosteroids for clinically significant oedema and involve radiation oncology early. Seizure prophylaxis is not routine without a seizure, while anticonvulsant treatment is indicated after one occurs.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">Bulky, highly chemosensitive SCLC can cause tumour lysis syndrome, particularly with renal impairment, elevated urate, high lactate dehydrogenase, or extensive liver involvement.</span><span class=\"evidence-detail\">Correct electrolytes and dehydration, stratify risk before chemotherapy, use urate-lowering prophylaxis when appropriate, and monitor closely during the first treatment cycle rather than assuming solid tumours carry no lysis risk<sup class=\"trial-ref\"><a href=\"#ref-lung-small-cell-lung-cancer-ext-73893515b845\" aria-label=\"Reference 24: Tumour lysis syndrome consensus conference\">24</a></sup>.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">Superior vena cava obstruction requires rapid assessment of airway, cerebral, and haemodynamic compromise.</span><span class=\"evidence-detail\">Obtain tissue first when safely possible, but do not delay stenting or other urgent stabilization in life-threatening obstruction. Systemic therapy often relieves SCLC-related obstruction promptly; radiotherapy and endovascular stenting are complementary options selected by severity, prior treatment, and expected speed of response<sup class=\"trial-ref\"><a href=\"#ref-lung-small-cell-lung-cancer-ext-71e1b711cb65\" aria-label=\"Reference 25: NCI cardiopulmonary syndromes PDQ\">25</a></sup>.</span></li></ul>\n<h3 id=\"s-maintenance-after-induction\">Maintenance after induction</h3>\n<p>Continue atezolizumab or durvalumab after first-line chemo-immunotherapy when disease is controlled and toxicity is acceptable. For patients treated with atezolizumab plus carboplatin–etoposide, maintenance lurbinectedin plus atezolizumab is an additional option after four induction cycles, provided there is no progression and the patient can tolerate increased marrow toxicity.</p>\n<h4>Evidence for lurbinectedin plus atezolizumab</h4>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\">In IMforte, 483 induction responders were rerandomized at maintenance.</span><span class=\"evidence-detail\">Lurbinectedin plus atezolizumab improved median progression-free survival from maintenance randomization from 2.1 to 5.4 months (HR 0.54; 95% CI 0.43–0.67; p&lt;0.0001) and interim overall survival from 10.6 to 13.2 months (HR 0.73; 95% CI 0.57–0.95; p=0.017), crossing both prespecified boundaries<sup class=\"trial-ref\"><a href=\"#ref-lung-small-cell-lung-cancer-t-imforte\" aria-label=\"Reference 26: IMforte\">26</a></sup>.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">Grade 3–4 all-cause adverse events occurred in 38% with the combination and 22% with atezolizumab alone; treatment-related grade 3–4 events occurred in 26% and 6%.</span><span class=\"evidence-detail\">Response from maintenance randomization was 19% versus 10%, and patients with brain metastases were excluded. The regimen received US approval in 2025<sup class=\"trial-ref\"><a href=\"#ref-lung-small-cell-lung-cancer-ext-2552276b0d3a\" aria-label=\"Reference 27: FDA lurbinectedin plus atezolizumab maintenance approval\">27</a></sup>.</span></li></ul>\n<h4>Do not extrapolate across maintenance strategies</h4>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\">Verify the current label, blood-count thresholds, dose modifications, and local access before prescribing rather than carrying induction lurbinectedin dosing into maintenance by assumption.</span><span class=\"evidence-detail\">Choosing durvalumab for first-line treatment also precludes direct extrapolation of IMforte, because the trial required atezolizumab-based induction and randomized only patients without progression after induction.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">Do not substitute nivolumab-based maintenance.</span><span class=\"evidence-detail\">CheckMate 451 did not improve its primary overall-survival endpoint with nivolumab plus ipilimumab versus placebo (9.2 versus 9.6 months; HR 0.92; p=0.37). The fixed hierarchy then stopped, so nivolumab overall survival and both progression-free-survival comparisons were not formally tested. Grade 3–4 treatment-related adverse events occurred in 52.2%, 11.5% and 8.4% with the combination, nivolumab and placebo<sup class=\"trial-ref\"><a href=\"#ref-lung-small-cell-lung-cancer-t-checkmate-451\" aria-label=\"Reference 28: CheckMate 451\">28</a></sup>.</span></li></ul>\n<h3 id=\"s-thoracic-radiotherapy-after-systemic-therapy\">Thoracic radiotherapy after systemic therapy</h3>\n<h4>Evidence before checkpoint inhibition</h4>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\">Post-chemotherapy thoracic radiotherapy is not routine for every patient.</span><span class=\"evidence-detail\">In 498 CREST participants, 30 Gy in 10 fractions after chemotherapy and PCI did not significantly improve the primary one-year overall-survival endpoint: 33% versus 28% (HR 0.84; 95% CI 0.69–1.01; p=0.066). The nominal secondary two-year survival rates were 13% versus 3%<sup class=\"trial-ref\"><a href=\"#ref-lung-small-cell-lung-cancer-t-crest\" aria-label=\"Reference 29: CREST\">29</a></sup>.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">CREST progression-free survival was 4 versus 3 months (HR 0.73; 95% CI 0.61–0.87; nominal p=0.001), with six-month rates of 24% versus 20%.</span><span class=\"evidence-detail\">These secondary results support a local-control discussion in selected responders but cannot repair the missed primary one-year overall-survival endpoint.</span></li></ul>\n<h4>Evidence with atezolizumab maintenance</h4>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\">The randomized evidence predates first-line checkpoint inhibition.</span><span class=\"evidence-detail\">In the phase II TREASURE trial during atezolizumab maintenance, thoracic radiotherapy did not improve progression-free or overall survival and increased serious adverse events (61.3% versus 18.2%) and fatal events (19.4% versus 3.0%); early closure made efficacy estimates imprecise but argues against routine unselected use with atezolizumab maintenance<sup class=\"trial-ref\"><a href=\"#ref-lung-small-cell-lung-cancer-ext-572b03e2c58f\" aria-label=\"Reference 30: TREASURE randomized phase II trial\">30</a></sup>.</span></li></ul>\n<h4>Select patients narrowly</h4>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\">Consider consolidative thoracic radiotherapy only after multidisciplinary review for a fit responder with limited residual thoracic burden, controlled extracranial disease, and acceptable lung and oesophageal constraints.</span><span class=\"evidence-detail\">The historical Jeremic trial enrolled 206 highly selected patients with an extrathoracic complete response and at least an intrathoracic partial response after three platinum–etoposide cycles; do not generalize its intensive regimen broadly<sup class=\"trial-ref\"><a href=\"#ref-lung-small-cell-lung-cancer-ext-d37000ca41f0\" aria-label=\"Reference 31: Jeremic randomized thoracic radiotherapy trial\">31</a></sup>.</span></li></ul>\n<h3 id=\"s-pci-or-mri-surveillance\">PCI or MRI surveillance</h3>\n<h4>Evidence without mandated baseline MRI</h4>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\">For extensive-stage responders, choose between PCI and scheduled brain MRI surveillance through shared decision-making.</span><span class=\"evidence-detail\">In 286 EORTC 08993-22993 participants, baseline brain imaging was not mandatory; PCI reduced symptomatic brain metastases (16.8% versus 41.3%; HR 0.27; 95% CI 0.16–0.44; p&lt;0.001) and one-year incidence from 40.4% to 14.6%<sup class=\"trial-ref\"><a href=\"#ref-lung-small-cell-lung-cancer-t-eortc-08993-22993-slotman\" aria-label=\"Reference 32: EORTC 08993-22993 (Slotman)\">32</a></sup>.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">EORTC median overall survival was 6.7 versus 5.4 months (HR 0.68; 95% CI 0.52–0.88; nominal p=0.003), with one-year survival of 27.1% versus 13.3%.</span><span class=\"evidence-detail\">Because overall survival was secondary and occult baseline brain metastases could have been treated by PCI, the result does not directly answer the modern MRI-negative surveillance question.</span></li></ul>\n<h4>Evidence with MRI surveillance</h4>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\">In the Japanese MRI-surveillance trial, 224 participants had no brain metastases on mandated baseline MRI and underwent MRI every three months in year 1 and at months 18 and 24.</span><span class=\"evidence-detail\">PCI did not improve median overall survival (11.6 versus 13.7 months; HR 1.27; 95% CI 0.96–1.68; p=0.094)<sup class=\"trial-ref\"><a href=\"#ref-lung-small-cell-lung-cancer-t-takahashi-es-sclc-pci\" aria-label=\"Reference 33: Takahashi (ES-SCLC PCI)\">33</a></sup>.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">The 12-month cumulative incidence of brain metastases was 32.9% with PCI versus 59.0% with observation, while progression-free survival was 2.3 versus 2.4 months (HR 0.98; p=0.75).</span><span class=\"evidence-detail\">Salvage brain radiotherapy was used in 46% versus 83%. Attrition in cognitive testing prevents a claim of neurocognitive equivalence.</span></li></ul>\n<p>These trials answer different questions: PCI remains reasonable when reliable MRI surveillance or prompt salvage treatment is unavailable, or when a patient prioritizes reducing intracranial relapse. MRI surveillance is reasonable when high-quality follow-up is dependable or cognitive risk is a major concern. The MAVERICK trial is closed to accrual, and no practice-changing primary result has been reported<sup class=\"trial-ref\"><a href=\"#ref-lung-small-cell-lung-cancer-ext-e0539b0c3c74\" aria-label=\"Reference 34: SWOG S1827 MAVERICK trial status\">34</a></sup>.</p>\n<h2 id=\"s-relapsed-or-refractory-disease\">Relapsed or refractory disease</h2>\n<h3 id=\"s-reassess-before-choosing-treatment\">Reassess before choosing treatment</h3>\n<p>Confirm progression and distinguish it from infection, radiation change, immune toxicity, or a second primary cancer. Refractory disease never responded to first-line therapy; resistant relapse occurs within three months, sensitive relapse after three months, and late relapse after six months. Use the exact interval from the last platinum dose rather than the label alone when selecting treatment.</p>\n<p>Prioritize a clinical trial whenever available. For rapidly symptomatic disease, choose a regimen that can start promptly and is deliverable with existing marrow, renal, hepatic, and neurological reserve. Re-biopsy is not routine for typical recurrent de novo SCLC, but it is important when pathology was uncertain, behaviour is atypical, or transformed disease would change a molecularly guided non-small cell pathway.</p>\n<h3 id=\"s-tarlatamab\">Tarlatamab</h3>\n<h4>Randomized evidence</h4>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\">Tarlatamab is a DLL3-directed bispecific T-cell engager for extensive-stage SCLC progressing on or after platinum.</span><span class=\"evidence-detail\">In DeLLphi-304, it improved median overall survival to 13.6 months versus 8.3 months with physician-selected chemotherapy (HR 0.60; 95% CI 0.47–0.77; p&lt;0.001). Twelve-month restricted mean progression-free survival was 5.3 versus 4.3 months; proportional-hazards assumptions were not satisfied<sup class=\"trial-ref\"><a href=\"#ref-lung-small-cell-lung-cancer-t-dellphi-304\" aria-label=\"Reference 35: DeLLphi-304\">35</a></sup>.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">DeLLphi-304 response was 35% versus 20% (relative risk 1.73), median response duration 6.9 versus 5.5 months, and 12-month response durability 41% versus 13%.</span><span class=\"evidence-detail\">Grade 3 or higher treatment-related events occurred in 27% versus 62%. Cytokine-release syndrome occurred in 56% with tarlatamab, including 1% grade 3, and ICANS in 6%, with one grade 5 event.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">Patient-reported chest-pain improvement did not meet the prespecified hierarchy, so physical functioning and global health were not formally tested.</span><span class=\"evidence-detail\">That failed hierarchy should temper symptom-benefit claims even though survival and comparative toxicity favoured tarlatamab in this otherwise survival-positive randomized comparison.</span></li></ul>\n<h4>Earlier single-arm evidence</h4>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\">The earlier DeLLphi-301 selected-dose cohort showed a blinded independent-review response rate of 40% among 100 patients (97.5% CI 29%–52%) after platinum and at least one additional line.</span><span class=\"evidence-detail\">Median progression-free survival was 4.9 months and overall survival was immature at 14.3 months. Cytokine-release syndrome occurred in 51% at 10 mg, mostly low grade<sup class=\"trial-ref\"><a href=\"#ref-lung-small-cell-lung-cancer-t-dellphi-301\" aria-label=\"Reference 36: DeLLphi-301\">36</a></sup>.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">At 10 mg, grade 3 cytokine-release syndrome occurred in 1% and ICANS in 8%, without a grade 3 or higher ICANS event.</span><span class=\"evidence-detail\">Overall grade 3 or higher adverse events occurred in 59% of the 133-patient safety population, and one treatment-related respiratory-failure death occurred. These uncontrolled dose-expansion results establish activity and safety context, not comparative efficacy.</span></li></ul>\n<h4>Deliver tarlatamab safely</h4>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\">Use the current label rather than the trial-era monitoring schedule: 1 mg on cycle 1 day 1, then 10 mg on days 8 and 15 and every two weeks thereafter.</span><span class=\"evidence-detail\">After cycle 1 days 1 and 8, monitor in an appropriate healthcare setting for 22–24 hours and require the patient to remain within one hour of care for 48 hours with a caregiver<sup class=\"trial-ref\"><a href=\"#ref-lung-small-cell-lung-cancer-ext-678c2f88309f\" aria-label=\"Reference 37: US tarlatamab prescribing information\">37</a></sup>.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">Cytokine-release syndrome and neurological toxicity, including ICANS, can be severe or fatal.</span><span class=\"evidence-detail\">Give label-specified premedication and hydration, ensure tocilizumab and emergency support are available, and establish a caregiver and proximity plan before the first dose. Later monitoring can be reduced only according to the current label and prior reaction history, not by assuming cycle 1 tolerance.</span></li></ul>\n<h3 id=\"s-lurbinectedin-topotecan-and-other-chemotherapy\">Lurbinectedin, topotecan, and other chemotherapy</h3>\n<h4>Lurbinectedin</h4>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\">Lurbinectedin is an option after platinum, especially when an outpatient every-three-week regimen is desirable.</span><span class=\"evidence-detail\">In the phase II PM1183-B-005 basket cohort, investigator-assessed response was 35.2% (37/105; 95% CI 26.2%–45.2%), median progression-free survival was 3.5 months, and median overall survival was 9.3 months. Grade 3–4 neutropenia occurred in 46% and febrile neutropenia in 5%<sup class=\"trial-ref\"><a href=\"#ref-lung-small-cell-lung-cancer-t-pm1183-b-005-lurbinectedin\" aria-label=\"Reference 38: PM1183-B-005 (Lurbinectedin)\">38</a></sup>.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">Median response duration was 6.2 months when the chemotherapy-free interval was at least 90 days and 4.7 months when shorter; response rates were 45.0% and 22.2%.</span><span class=\"evidence-detail\">These were nonrandomized subgroup descriptions without a reported interaction, so the interval informs selection but does not prove differential treatment effect.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">Dose according to the current product information and adjust for hepatic function, cytopenias, and interacting medicines.</span><span class=\"evidence-detail\">Maintain vigilance for myelosuppression, hepatotoxicity, extravasation injury, and rhabdomyolysis<sup class=\"trial-ref\"><a href=\"#ref-lung-small-cell-lung-cancer-ext-a81f5ec33c82\" aria-label=\"Reference 39: US lurbinectedin prescribing information\">39</a></sup>.</span></li></ul>\n<h4>Topotecan and selected single agents</h4>\n<ul><li class=\"evidence-prose\">Intravenous topotecan and cyclophosphamide–doxorubicin–vincristine had comparable activity in a randomized trial: response rates were 24.3% and 18.3% (p=0.285), time to progression 13.3 and 12.3 weeks (p=0.552), response duration 14.4 and 15.3 weeks (p=0.300), and survival 25.0 and 24.7 weeks (p=0.795)<sup class=\"trial-ref\"><a href=\"#ref-lung-small-cell-lung-cancer-t-von-pawel\" aria-label=\"Reference 40: von Pawel\">40</a></sup>.</li><li class=\"evidence-prose\"><span class=\"evidence-lead\">Both regimens require careful marrow monitoring.</span><span class=\"evidence-detail\">Seven treatment-related deaths from sepsis or myelosuppression occurred in the trial, and the reported symptom improvements were nominal analyses using nonvalidated measures. Topotecan commonly causes severe neutropenia, thrombocytopenia, and anaemia; do not interpret similar median survival as equivalent tolerability.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">Oral topotecan prolonged median survival to 26 versus 14 weeks compared with best supportive care in patients unsuitable for intravenous treatment (p=0.0104), with a 7% response rate and 44% stable disease.</span><span class=\"evidence-detail\">In sensitive relapse, oral and intravenous topotecan produced median survival of 33 and 35 weeks and response rates of 18% and 22%<sup class=\"trial-ref\"><a href=\"#ref-lung-small-cell-lung-cancer-ext-914887c47323\" aria-label=\"Reference 41: Oral topotecan versus supportive care trial\">41</a></sup> <sup class=\"trial-ref\"><a href=\"#ref-lung-small-cell-lung-cancer-ext-11dff893caa1\" aria-label=\"Reference 42: Oral versus intravenous topotecan trial\">42</a></sup>.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">Use the locally licensed formulation and renal dose adjustments.</span><span class=\"evidence-detail\">Other selected options include irinotecan, paclitaxel, temozolomide, gemcitabine, or vinorelbine, but evidence is generally noncomparative and choice should be individualized. The small irinotecan studies span heterogeneous populations and do not support a single pooled response estimate; vinorelbine access requirements depend on the formulation and local infusion practice.</span></li></ul>\n<h4>Platinum rechallenge</h4>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\">For platinum-sensitive relapse, platinum–etoposide rechallenge is reasonable.</span><span class=\"evidence-detail\">In JCOG0605, 180 highly selected participants relapsing at least 90 days after platinum were randomized to cisplatin–etoposide–irinotecan or topotecan; median overall survival was 18.2 versus 12.5 months (HR 0.67; 90% CI 0.51–0.88; p=0.0079)<sup class=\"trial-ref\"><a href=\"#ref-lung-small-cell-lung-cancer-ext-a1604a0b10de\" aria-label=\"Reference 43: JCOG0605 randomized phase III trial\">43</a></sup>.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">The JCOG0605 experimental regimen used cisplatin on days 1 and 8, etoposide on days 1–3, irinotecan on day 8, and prophylactic G-CSF in a two-week schedule for five cycles.</span><span class=\"evidence-detail\">Its intensity and substantial toxicity limit generalizability; do not substitute this triplet automatically for a conventional platinum–etoposide rechallenge in a frail patient.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">GFPC 01-13 directly supports a simpler rechallenge strategy after a response and relapse at least 90 days from first-line platinum–etoposide.</span><span class=\"evidence-detail\">Carboplatin–etoposide improved centrally reviewed progression-free survival over oral topotecan (4.7 versus 2.7 months; HR 0.57, 90% CI 0.41–0.73; one-sided p=0.0041), but exploratory overall survival was unchanged (7.5 versus 7.4 months; HR 1.03; nominal p=0.94)<sup class=\"trial-ref\"><a href=\"#ref-lung-small-cell-lung-cancer-t-gfpc-01-13\" aria-label=\"Reference 44: GFPC 01-13\">44</a></sup>.</span></li></ul>\n<h3 id=\"s-investigational-antibody-drug-conjugates\">Investigational antibody–drug conjugates</h3>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\">Izalontamab brengitecan is an EGFR–HER3 bispecific antibody–drug conjugate with exploratory activity in relapsed extensive-stage disease.</span><span class=\"evidence-detail\">In a 52-patient single-arm phase Ib cohort, response was 48.1%, median response duration 4.9 months and median overall survival 12.2 months. The unplanned second-line subgroup response was 72.7%, but no comparator or formal hypothesis test supports a comparative claim<sup class=\"trial-ref\"><a href=\"#ref-lung-small-cell-lung-cancer-t-bl-b01d1-101-iza-bren-es-sclc\" aria-label=\"Reference 45: BL-B01D1-101 (iza-bren ES-SCLC)\">45</a></sup>.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">Toxicity and uncertainty currently preclude routine use.</span><span class=\"evidence-detail\">Grade 3 or higher treatment-related adverse events occurred in 75%, serious treatment-related events in 50%, dose reduction in 46.2%, treatment delay in 63.5%, and treatment-related death in two of 52 patients. Use should remain within a clinical trial or another governed investigational pathway.</span></li></ul>\n<h2 id=\"s-follow-up-and-survivorship\">Follow-up and survivorship</h2>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\">After curative-intent treatment, use clinical review and contrast-enhanced chest imaging about every three months in year 1, every six months in years 2–3, and then less frequently according to risk and fitness for salvage.</span><span class=\"evidence-detail\">After extensive-stage treatment, tailor imaging to active therapy and symptoms. Investigate new focal or neurological symptoms immediately rather than waiting for the next surveillance scan<sup class=\"trial-ref\"><a href=\"#ref-lung-small-cell-lung-cancer-ext-9fc6eceed364\" aria-label=\"Reference 46: SEOM-GECP SCLC guideline\">46</a></sup>.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">For patients who do not receive PCI, obtain brain MRI every three months in the first year and every six months in the second year, with further imaging individualized.</span><span class=\"evidence-detail\">Surveillance imaging should be offered only when detection could lead to meaningful treatment. Continue smoking-cessation support, vaccination, pulmonary rehabilitation when appropriate, nutritional care, and assessment for hearing, neuropathy, cognition, mood, and treatment-related cardiopulmonary effects<sup class=\"trial-ref\"><a href=\"#ref-lung-small-cell-lung-cancer-ext-42c8d1d7e6dc\" aria-label=\"Reference 47: ASCO lung cancer surveillance guideline\">47</a></sup>.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">At every transition, document goals of care and the threshold for stopping disease-directed treatment.</span><span class=\"evidence-detail\">SCLC can change quickly, so provide clear contact instructions for new dyspnoea, haemoptysis, confusion, weakness, severe headache, fever, or uncontrolled pain. Integrate palliative care early, and revisit resuscitation preferences before an acute crisis rather than equating symptom care with treatment withdrawal.</span></li></ul>\n<h2 id=\"s-references\">References</h2>\n<ol class=\"refs\">\n<li id=\"ref-lung-small-cell-lung-cancer-ext-2cbbafe249fd\"><a href=\"https://www.cancer.gov/types/lung/hp/small-cell-lung-treatment-pdq\" rel=\"noopener\" target=\"_blank\">NCI PDQ small cell lung cancer treatment</a></li>\n<li id=\"ref-lung-small-cell-lung-cancer-ext-2e136280f06e\"><a href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC9464246/\" rel=\"noopener\" target=\"_blank\">ESMO SCLC clinical practice guideline</a></li>\n<li id=\"ref-lung-small-cell-lung-cancer-ext-5e03eb2dd338\"><a href=\"https://doi.org/10.1097/JTO.0b013e3181b27799\" rel=\"noopener\" target=\"_blank\">IASLC pathologic staging project for SCLC</a></li>\n<li id=\"ref-lung-small-cell-lung-cancer-ext-071321debe9b\"><a href=\"https://doi.org/10.1016/j.lungcan.2017.04.021\" rel=\"noopener\" target=\"_blank\">Propensity-matched surgery analysis in SCLC</a></li>\n<li id=\"ref-lung-small-cell-lung-cancer-ext-69cd8e60a861\"><a href=\"https://doi.org/10.1200/JCO.2015.63.8171\" rel=\"noopener\" target=\"_blank\">Adjuvant therapy after resected early SCLC</a></li>\n<li id=\"ref-lung-small-cell-lung-cancer-t-pignon-meta-analysis\"><a class=\"trial-link\" href=\"/evidence/#t-pignon-meta-analysis\">Pignon Meta-Analysis</a>. <a href=\"https://drive.google.com/file/d/1zS6eqe3yG4Bo4TnXYZm47ROwFvaNnMDH/preview\">N Engl J Med 1992;327:1618-1624</a></li>\n<li id=\"ref-lung-small-cell-lung-cancer-t-int-0096-turrisi\"><a class=\"trial-link\" href=\"/evidence/#t-int-0096-turrisi\">INT-0096 (Turrisi)</a>. <a href=\"https://drive.google.com/file/d/1-K1nV_2ANtl6axWC3JQ7z-iSuJaJyB9a/preview\">N Engl J Med 1999;340:265-271</a></li>\n<li id=\"ref-lung-small-cell-lung-cancer-t-convert\"><a class=\"trial-link\" href=\"/evidence/#t-convert\">CONVERT</a>. <a href=\"https://drive.google.com/file/d/1k1x74Awv_10T5mszDJHYD-57A8U5Nv32/preview\">Lancet Oncol 2017;18:1116-1125</a></li>\n<li id=\"ref-lung-small-cell-lung-cancer-ext-c84f304b49f3\"><a href=\"https://www.accessdata.fda.gov/drugsatfda_docs/label/2025/761069s052lbl.pdf\" rel=\"noopener\" target=\"_blank\">US durvalumab prescribing information</a></li>\n<li id=\"ref-lung-small-cell-lung-cancer-t-adriatic\"><a class=\"trial-link\" href=\"/evidence/#t-adriatic\">ADRIATIC</a>. <a href=\"https://drive.google.com/file/d/1Oj6AP0zwzfOiNVZGjavo-CaXCUf_zbC4/preview\">N Engl J Med 2024;391:1313-1327</a></li>\n<li id=\"ref-lung-small-cell-lung-cancer-t-achiles\"><a class=\"trial-link\" href=\"/evidence/#t-achiles\">ACHILES</a>. <a href=\"https://drive.google.com/file/d/1G9zYDqjw5wd4DvJlrHp08lNgv6QcT1Xl/preview\">J Clin Oncol 2025;43(17_suppl):LBA8005 (conference abstract)</a></li>\n<li id=\"ref-lung-small-cell-lung-cancer-t-pci-overview-collaborative-group-aup-rin\"><a class=\"trial-link\" href=\"/evidence/#t-pci-overview-collaborative-group-aup-rin\">PCI Overview Collaborative Group (Aupérin)</a>. <a href=\"https://drive.google.com/file/d/1GvYIGQKl3PG_iGA3k-HuO7mWFVXWPD8k/preview\">N Engl J Med 1999;341:476-484</a></li>\n<li id=\"ref-lung-small-cell-lung-cancer-ext-7899d1e2bbb6\"><a href=\"https://ascopubs.org/doi/abs/10.1200/jco.2011.40.4905\" rel=\"noopener\" target=\"_blank\">COCIS carboplatin versus cisplatin meta-analysis</a></li>\n<li id=\"ref-lung-small-cell-lung-cancer-t-secsg-cav-ep-roth\"><a class=\"trial-link\" href=\"/evidence/#t-secsg-cav-ep-roth\">SECSG CAV/EP (Roth)</a>. <a href=\"https://drive.google.com/file/d/1aiTfPCd5AhgzoR_mmN4y0jXl0FRLIjE7/preview\">J Clin Oncol 1992;10:282-291</a></li>\n<li id=\"ref-lung-small-cell-lung-cancer-t-japanese-cav-pe-trial-fukuoka\"><a class=\"trial-link\" href=\"/evidence/#t-japanese-cav-pe-trial-fukuoka\">Japanese CAV/PE trial (Fukuoka)</a>. <a href=\"https://drive.google.com/file/d/1DLPccaKsiC3AG7e_M7MPKNj_I_4yBpgR/preview\">J Natl Cancer Inst 1991;83:855-861</a></li>\n<li id=\"ref-lung-small-cell-lung-cancer-t-norwegian-ep-vs-cev-sundstr-m\"><a class=\"trial-link\" href=\"/evidence/#t-norwegian-ep-vs-cev-sundstr-m\">Norwegian EP vs CEV (Sundstrøm)</a>. <a href=\"https://drive.google.com/file/d/1WXyUwzlcRKlmzWDt2u9owcf7rKf1aYJ5/preview\">J Clin Oncol 2002;20:4665-4672</a></li>\n<li id=\"ref-lung-small-cell-lung-cancer-t-impower133\"><a class=\"trial-link\" href=\"/evidence/#t-impower133\">IMpower133</a>. <a href=\"https://drive.google.com/file/d/1kzACp_xaQEHG3HOqeLFKxG8NHPR3gu4v/preview\">N Engl J Med 2018;379:2220-2229</a></li>\n<li id=\"r
