6/NEJMoa1412690\">N Engl J Med 2015;372:30-39</a></li>\n<li id=\"ref-melanoma-melanoma-t-columbus\"><a class=\"trial-link\" href=\"/evidence/#t-columbus\">COLUMBUS</a>. <a href=\"https://doi.org/10.1016/S1470-2045(18)30142-6\">Lancet Oncol 2018;19:603-615</a></li>\n<li id=\"ref-melanoma-melanoma-t-rohaan-til-vs-ipilimumab\"><a class=\"trial-link\" href=\"/evidence/#t-rohaan-til-vs-ipilimumab\">Rohaan (TIL vs ipilimumab)</a>. <a href=\"https://drive.google.com/file/d/1iP-xVQzJrrKVotmv3OqNYzBrZ0a_4MTU/preview\">N Engl J Med 2022;387:2113-2125</a></li>\n<li id=\"ref-melanoma-melanoma-t-c-144-01-lifileucel\"><a class=\"trial-link\" href=\"/evidence/#t-c-144-01-lifileucel\">C-144-01 (lifileucel)</a>. <a href=\"https://drive.google.com/file/d/1A0kV__JlmaAEJ9nBXs676o3xDrhcv5aF/preview\">J Clin Oncol 2025;43:3565-3572</a></li>\n<li id=\"ref-melanoma-melanoma-t-optim-t-vec\"><a class=\"trial-link\" href=\"/evidence/#t-optim-t-vec\">OPTiM (T-VEC)</a>. <a href=\"https://doi.org/10.1200/JCO.2014.58.3377\">J Clin Oncol 2015;33:2780-2788</a></li>\n<li id=\"ref-melanoma-melanoma-t-ignyte-rp1\"><a class=\"trial-link\" href=\"/evidence/#t-ignyte-rp1\">IGNYTE (RP1)</a>. <a href=\"https://drive.google.com/file/d/1HfzfgHkq0NP_Fnzftg29g5Rs6r1Ncav2/preview\">J Clin Oncol 2025;43:3589-3599</a></li>\n<li id=\"ref-melanoma-melanoma-t-imcgp100-202-tebentafusp\"><a class=\"trial-link\" href=\"/evidence/#t-imcgp100-202-tebentafusp\">IMCgp100-202 (tebentafusp)</a>. <a href=\"https://doi.org/10.1056/NEJMoa2103485\">N Engl J Med 2021;385:1196-1206</a></li>\n<li id=\"ref-melanoma-melanoma-t-optimum-02\"><a class=\"trial-link\" href=\"/evidence/#t-optimum-02\">OptimUM-02</a>. <a href=\"https://doi.org/10.1200/JCO.2026.44.17_suppl.LBA9503\">J Clin Oncol 2026;44(suppl 17):LBA9503</a>; <a href=\"https://drive.google.com/file/d/1E5UDfQD85uSxpDPTlXYKLVBOXZtUg6W3/preview\">Orloff et al. - 2026 - Darovasertib plus crizotinib vs investigator&#x27;s choice as first-line treatment for HLA-A2 negative [1126b8da]</a></li>\n<li id=\"ref-melanoma-melanoma-t-sheng-et-al-toripalimab-axitinib\"><a class=\"trial-link\" href=\"/evidence/#t-sheng-et-al-toripalimab-axitinib\">Sheng et al (toripalimab + axitinib)</a>. <a href=\"https://doi.org/10.1200/JCO.19.00210\">J Clin Oncol 2019;37:2987-2999</a></li>\n</ol>", "_hay": "melanoma melanoma melanoma epidemiology risk factors pathology and molecular classification clinical presentation and diagnosis staging and work-up sentinel lymph node biopsy imaging for distant metastases management of resectable disease surgery and radiotherapy adjuvant systemic therapy by stage neoadjuvant therapy management of advanced disease first-line therapy in *braf* wild-type disease first-line therapy in *braf* v600-mutant disease braf and mek inhibition therapy after anti–pd-1 failure uveal and mucosal melanoma references"}];
const GROUPS = ["Breast", "Colorectal", "Lung", "Lymphoma", "Melanoma"];
const LANDING_GROUP_LABELS = {"Colorectal": "Gastrointestinal", "Lung": "Thoracic", "Melanoma": "Skin"};
const BYID = Object.fromEntries(NOTES.map(n => [n.id, n]));

let state = { view:'index', group:null, id:null, q:'' };

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function inGroup(g){ return NOTES.filter(n => n.group === g); }
function landingGroupLabel(g){ return LANDING_GROUP_LABELS[g] || g; }

// ---- Sidebar: "All notes" + a collapsible section per tumour group ----
const nav = document.getElementById('nav');
GROUPS.forEach(g => {
  const block = document.createElement('div'); block.className = 'navsec';
  const head = document.createElement('button'); head.type = 'button'; head.className = 'secname';
  head.setAttribute('aria-expanded','true');
  head.innerHTML = `<span>${esc(g)}</span><span class="caret" aria-hidden="true">&#9660;</span>`;
  head.onclick = () => { const collapsed = block.classList.toggle('collapsed'); head.setAttribute('aria-expanded', collapsed ? 'false' : 'true'); };
  block.appendChild(head);
  const box = document.createElement('div'); box.className = 'items';
  inGroup(g).forEach(n => {
    const a = document.createElement('button'); a.type = 'button'; a.dataset.id = n.id;
    a.innerHTML = `<span>${esc(n.title)}</span>`;
    a.onclick = () => selectNote(n.id);
    box.appendChild(a);
  });
  block.appendChild(box); nav.appendChild(block);
});
function syncNav(){ document.querySelectorAll('.items button').forEach(a => a.classList.toggle('active', state.view==='note' && a.dataset.id===state.id)); }
document.getElementById('showall').onclick = () => { state.view='index'; state.group=null; state.id=null; state.q=''; document.getElementById('q').value=''; closeNav(); render(true); window.scrollTo(0,0); };

// ---- Drawer (burger at every width) ----
const backdrop = document.getElementById('backdrop');
const burger = document.getElementById('burger');
function closeNav(){ document.body.classList.remove('nav-open'); }
burger.onclick = () => document.body.classList.toggle('nav-open');
backdrop.onclick = closeNav;

// ---- Search: title + section headings, across every note ----
document.getElementById('q').oninput = e => {
  state.q = e.target.value.toLowerCase().trim();
  state.view = state.q ? 'search' : 'index';
  state.id = null;
  render();
};

function selectNote(id){
  state.view='note'; state.id=id; state.q='';
  const q = document.getElementById('q'); if (q) q.value='';
  closeNav(); render(true); window.scrollTo(0,0);
}
function selectGroup(g){
  state.view='group'; state.group=g; state.id=null; state.q='';
  const q = document.getElementById('q'); if (q) q.value='';
  closeNav(); render(true); window.scrollTo(0,0);
}

function noteItem(n, meta){
  return `<button class="nitem" type="button" data-id="${esc(n.id)}">
    <span class="ntitle">${esc(n.title)}</span>
    <span class="nmeta">${esc(meta || n.updated || '')}</span></button>`;
}

function renderIndex(res){
  res.innerHTML = `<div class="ngrid">` + GROUPS.map(g => {
    return `<button class="gcard" type="button" data-group="${esc(g)}">
      <span class="gbody"><span class="gname">${esc(landingGroupLabel(g))}</span></span>
      <span class="go" aria-hidden="true">&rarr;</span></button>`;
  }).join('') + `</div>`;
  res.querySelectorAll('.gcard').forEach(b => b.onclick = () => selectGroup(b.dataset.group));
}

function renderGroup(res){
  const notes = inGroup(state.group);
  res.innerHTML = `<button class="backpill" type="button" data-back="index">&#8592; All groups</button>
    <div class="seclabel">${esc(state.group)}</div>
    <div class="nlist">${notes.map(n => noteItem(n)).join('')}</div>`;
  wireList(res);
}

function renderSearch(res){
  const hits = NOTES.filter(n => n._hay.includes(state.q));
  if (!hits.length) { res.innerHTML = `<div class="empty">No note matches that search.</div>`; return; }
  res.innerHTML = `<div class="seclabel">${hits.length} note${hits.length===1?'':'s'} matching &ldquo;${esc(state.q)}&rdquo;</div>
    <div class="nlist">${hits.map(n => noteItem(n, n.group)).join('')}</div>`;
  wireList(res);
}

function renderNote(res, n){
  const toc = n.sections.length
    ? `<details class="tocpanel"><summary>Outline</summary><nav class="toc" aria-label="Sections"><ol>` +
      n.sections.map(s => `<li><a class="depth-${s.depth || 2}" href="#${esc(s.id)}" data-sec="${esc(s.id)}">${esc(s.h)}</a></li>`).join('') +
      `</ol></nav></details>` : '';
  res.innerHTML = `<button class="backpill" type="button" data-back="group">&#8592; ${esc(n.group)}</button>
    <div class="notehead"><h2>${esc(n.title)}</h2>
      <div class="notemeta"><span>${esc(n.group)}</span>${n.updated ? `<span>Updated ${esc(n.updated)}</span>` : ''}</div>
    </div><div class="notegrid">${toc}<div class="nbody">${n.html}</div></div>`;
  const panel = res.querySelector('.tocpanel');
  if (panel) panel.open = matchMedia('(min-width: 821px)').matches;
  res.querySelectorAll('.toc a').forEach(a => a.onclick = ev => {
    ev.preventDefault();
    const t = document.getElementById(a.dataset.sec);
    if (t) t.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block:'start' });
    if (panel && matchMedia('(max-width: 820px)').matches) panel.open = false;
  });
  wireBack(res);
  spy();
}

function wireList(res){
  res.querySelectorAll('.nitem').forEach(b => b.onclick = () => selectNote(b.dataset.id));
  wireBack(res);
}
function wireBack(res){
  const b = res.querySelector('.backpill');
  if (!b) return;
  b.onclick = () => {
    if (b.dataset.back === 'group' && state.id && BYID[state.id]) selectGroup(BYID[state.id].group);
    else { state.view='index'; state.group=null; state.id=null; render(true); window.scrollTo(0,0); }
  };
}

// ---- TOC scroll-spy. Registered through window.addEventListener so the oncOS
// One shell captures and removes it when the view is torn down. ----
let spyTick = false;
function spy(){
  const links = document.querySelectorAll('.toc a');
  if (!links.length) return;
  let active = null;
  links.forEach(a => {
    const el = document.getElementById(a.dataset.sec);
    if (el && el.getBoundingClientRect().top <= 130) active = a;
  });
  if (!active) active = links[0];
  const atBottom = window.scrollY + window.innerHeight >= document.documentElement.scrollHeight - 2;
  if (atBottom) active = links[links.length - 1];
  links.forEach(a => {
    const selected = a === active;
    a.classList.toggle('active', selected);
    if (selected) a.setAttribute('aria-current', 'location');
    else a.removeAttribute('aria-current');
  });
  const panel = active.closest('.tocpanel');
  if (panel && panel.open && panel.scrollHeight > panel.clientHeight + 1) {
    const pr = panel.getBoundingClientRect();
    const ar = active.getBoundingClientRect();
    if (ar.top < pr.top) panel.scrollTop -= (pr.top - ar.top) + 8;
    else if (ar.bottom > pr.bottom) panel.scrollTop += (ar.bottom - pr.bottom) + 8;
  }
}
window.addEventListener('scroll', () => {
  if (spyTick) return;
  spyTick = true;
  requestAnimationFrame(() => { spyTick = false; if (state.view === 'note') spy(); });
}, { passive: true });

function render(fade){
  if (fade && !(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches)) {
    const res = document.getElementById('results');
    res.classList.add('vfade');
    setTimeout(() => { if(!res.isConnected) return; renderNow(); res.classList.remove('vfade'); }, 150);
    return;
  }
  renderNow();
}

function renderNow(){
  syncNav();
  const res = document.getElementById('results');
  if (!NOTES.length) { res.innerHTML = `<div class="empty">No notes have been published yet.</div>`; return; }
  if (state.view==='note' && BYID[state.id]) { renderNote(res, BYID[state.id]); return; }
  if (state.view==='search') { renderSearch(res); return; }
  if (state.view==='group' && state.group) { renderGroup(res); return; }
  renderIndex(res);
}
render();

    window.oncosView.openRecord = function(record) {
      if (!record || !BYID[record.id]) return false;
      selectNote(record.id);
      if (record.section) setTimeout(function(){
        var section = document.getElementById(record.section);
        if (section) section.scrollIntoView({block:'start'});
      }, 0);
      return true;
    };
  },
  destroy: function() {

  }
};
</script>
