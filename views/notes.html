" href=\"/evidence/#t-keynote-204\">KEYNOTE-204</a>. <a href=\"https://drive.google.com/file/d/1llpjtNTnDBWLgNRi5PvQSYwO1yT81R52/preview\">Lancet Oncol 2021;22:512-524</a></li>\n</ol>", "_hay": "hodgkin lymphoma hodgkin-lymphoma lymphoma confirm the diagnosis and define the clinical group stage with pet-ct and retain the trial-specific response threshold early favourable disease: reduce treatment only within tested boundaries early unfavourable disease: choose between combined modality and intensified pet adaptation advanced disease: match efficacy gains to toxicity and maturity historical escalated-beacopp programme brentuximab, nivolumab and brecadd abvd with pet-guided bleomycin omission relapsed or refractory disease: separate transplant intent from later-line control references"}, {"id": "lymphoma-indolent-non-hodgkin-lymphomas", "slug": "indolent-non-hodgkin-lymphomas", "group": "Lymphoma", "title": "Indolent non-Hodgkin lymphomas", "updated": "", "sections": [{"id": "s-follicular-lymphoma-define-the-evidence-boundary", "h": "Follicular lymphoma: define the evidence boundary", "depth": 2}, {"id": "s-stage-i-ii-disease-radiotherapy-controls-local-disease", "h": "Stage I–II disease: radiotherapy controls local disease", "depth": 2}, {"id": "s-advanced-low-burden-disease-observation-remains-valid", "h": "Advanced low-burden disease: observation remains valid", "depth": 2}, {"id": "s-advanced-disease-requiring-treatment-choose-the-backbone-and-antibody", "h": "Advanced disease requiring treatment: choose the backbone and antibody", "depth": 2}, {"id": "s-establishing-rituximab-based-immunochemotherapy", "h": "Establishing rituximab-based immunochemotherapy", "depth": 3}, {"id": "s-bendamustine-rituximab-and-r-chop-are-not-interchangeable-in-every-histology", "h": "Bendamustine-rituximab and R-CHOP are not interchangeable in every histology", "depth": 3}, {"id": "s-rituximab-lenalidomide-is-an-alternative-not-proven-superior", "h": "Rituximab-lenalidomide is an alternative, not proven superior", "depth": 3}, {"id": "s-obinutuzumab-improves-progression-free-survival-at-a-toxicity-cost", "h": "Obinutuzumab improves progression-free survival at a toxicity cost", "depth": 3}, {"id": "s-maintenance-benefits-responders-but-has-no-demonstrated-survival-gain-upfront", "h": "Maintenance benefits responders but has no demonstrated survival gain upfront", "depth": 3}, {"id": "s-relapsed-disease-match-treatment-to-prior-exposure-and-biology", "h": "Relapsed disease: match treatment to prior exposure and biology", "depth": 2}, {"id": "s-immunochemotherapy-and-maintenance", "h": "Immunochemotherapy and maintenance", "depth": 3}, {"id": "s-lenalidomide-based-combinations", "h": "Lenalidomide-based combinations", "depth": 3}, {"id": "s-oral-targeted-therapy-after-multiple-prior-lines", "h": "Oral targeted therapy after multiple prior lines", "depth": 3}, {"id": "s-car-t-cell-therapy", "h": "CAR T-cell therapy", "depth": 3}, {"id": "s-bispecific-antibodies", "h": "Bispecific antibodies", "depth": 3}, {"id": "s-marginal-zone-lymphoma-do-not-import-follicular-estimates-automatically", "h": "Marginal zone lymphoma: do not import follicular estimates automatically", "depth": 2}, {"id": "s-non-gastric-extranodal-disease", "h": "Non-gastric extranodal disease", "depth": 3}, {"id": "s-references", "h": "References", "depth": 2}], "html": "<h2 id=\"s-follicular-lymphoma-define-the-evidence-boundary\">Follicular lymphoma: define the evidence boundary</h2>\n<p>The treatment evidence in this chapter applies principally to classic follicular lymphoma grades 1–3A. Most pivotal trials excluded grade 3B or transformed disease, and several also excluded central nervous system involvement. A result should therefore be carried only to patients who match the trial&#x27;s histology, treatment indication, prior therapy and fitness.</p>\n<p>Trial populations repeatedly distinguish patients who can be observed from those who require therapy because of symptoms, bulk, cytopenias, organ compromise or rapid progression. Prognostic scores may describe risk, but the treatment trials were generally entered on stage, tumour burden, symptoms, prior exposure and response to prior treatment.</p>\n<h2 id=\"s-stage-i-ii-disease-radiotherapy-controls-local-disease\">Stage I–II disease: radiotherapy controls local disease</h2>\n<p><a class=\"trial-link\" href=\"/evidence/#t-trog-99-03\">TROG 99.03</a> enrolled 150 treatment-naive patients with stage I–II grade 1–3A follicular lymphoma. Involved-field radiotherapy at 30–36 Gy was given alone or followed by six cycles of CVP; rituximab was added to the systemic arm after a 2006 amendment, so the systemic group spans CVP and R-CVP eras.</p>\n<p>Systemic therapy improved 10-year progression-free survival (59% vs 41%; HR 0.57, 95% CI 0.33 to 0.95) without a demonstrated overall-survival difference (95% vs 86%; HR 0.62) or reduction in transformation (4 vs 10 of 75 per arm). Only 2 of 148 irradiated patients had isolated in-field progression. The larger rituximab-era estimate was post hoc and based on few events.</p>\n<h2 id=\"s-advanced-low-burden-disease-observation-remains-valid\">Advanced low-burden disease: observation remains valid</h2>\n<p><a class=\"trial-link\" href=\"/evidence/#t-ardeshna-ncri\">Ardeshna (NCRI)</a> randomised 463 patients across two protocol eras. The original three-arm cohort contained 252 patients; after the induction-only arm closed, the maintenance-versus-observation analysis contained 379 patients. At 3 years, 88% with rituximab maintenance and 46% with observation had not started new treatment (HR 0.21, 95% CI 0.14 to 0.31).</p>\n<p>Early rituximab did not meet the quality-of-life co-primary endpoint, and overall survival did not differ at 28 deaths. In the underpowered original cohort, time to new treatment did not differ statistically between maintenance and induction alone (HR 0.75, 95% CI 0.41 to 1.34). A post-hoc analysis favoured maintenance for progression-free survival (HR 0.53, 95% CI 0.32 to 0.87).</p>\n<p>These results support observation for asymptomatic low-burden disease. Rituximab can defer subsequent treatment, but the available analysis does not show a survival gain or establish maintenance as superior to induction alone for time to new treatment.</p>\n<h2 id=\"s-advanced-disease-requiring-treatment-choose-the-backbone-and-antibody\">Advanced disease requiring treatment: choose the backbone and antibody</h2>\n<h3 id=\"s-establishing-rituximab-based-immunochemotherapy\">Establishing rituximab-based immunochemotherapy</h3>\n<p><a class=\"trial-link\" href=\"/evidence/#t-glsg-hiddemann\">GLSG (Hiddemann)</a> randomised 630 patients with previously untreated stage III–IV grade 1–2 follicular lymphoma requiring treatment. The early report analysed 428 patients with completed initial-treatment documentation. R-CHOP reduced the alpha-protected primary treatment-failure endpoint (28 of 223 vs 61 of 205; p&lt;0.001). In exploratory analyses, response was 96% (214/222) versus 90% (185/205), and 6 of 223 versus 17 of 205 patients had died within 3 years (nominal p=0.016), at 18 months&#x27; median follow-up.</p>\n<p><a class=\"trial-link\" href=\"/evidence/#t-foll05-fil\">FOLL05 (FIL)</a> compared R-CVP, R-CHOP and R-FM in 534 patients with stage II–IV grade 1–3A disease requiring treatment. Three-year time to treatment failure was 46%, 62% and 59%; R-CHOP and R-FM each improved this endpoint over R-CVP (HR 0.62 and 0.63), while their direct comparison showed no evidence of a difference.</p>\n<p>R-FM had the least favourable safety profile: grade 3–4 neutropenia occurred in 64%, compared with 50% for R-CHOP and 28% for R-CVP, and 14 of 23 second malignancies occurred with R-FM. Overall response was similar across groups, and overall survival was reported only for the pooled cohort.</p>\n<h3 id=\"s-bendamustine-rituximab-and-r-chop-are-not-interchangeable-in-every-histology\">Bendamustine-rituximab and R-CHOP are not interchangeable in every histology</h3>\n<p><a class=\"trial-link\" href=\"/evidence/#t-stil-nhl1-rummel\">StiL NHL1 (Rummel)</a> randomised 549 patients with treatment-naive indolent lymphoma or mantle-cell lymphoma; the primary analysis included 514 per-protocol patients. Bendamustine-rituximab prolonged median progression-free survival over R-CHOP (69.5 vs 31.2 months; HR 0.58, 95% CI 0.44 to 0.74) without a demonstrated overall-survival difference.</p>\n<p>Bendamustine-rituximab caused less grade 3–4 neutropenia (29% vs 69%), alopecia, infection and paraesthesia, but more grade 3–4 lymphocytopenia (74% vs 43%) and more skin reactions. The marginal-zone estimate was post hoc and imprecise (HR 0.70, 95% CI 0.34 to 1.43); no significant treatment-by-histology interaction was reported.</p>\n<p><a class=\"trial-link\" href=\"/evidence/#t-bright\">BRIGHT</a> tested bendamustine-rituximab against investigator-selected R-CHOP or R-CVP. In the efficacy-evaluable population, blinded-review complete response was 31% (67/213) versus 25% (52/206), meeting the prespecified non-inferiority test for the combined indolent-lymphoma and mantle-cell population. In a post-hoc ITT histology subgroup, non-inferiority was not established in indolent NHL (rate ratio 1.16, 95% CI 0.81 to 1.65). Progression-free and overall survival were immature at this analysis.</p>\n<p>Toxicity differed by comparator. Against R-CHOP, bendamustine-rituximab caused less grade 3–4 neutropenia but more grade 3–4 lymphopenia. Against R-CVP, nausea, vomiting and hypersensitivity were more frequent. The trial does not support a claim that bendamustine-rituximab was uniformly less toxic or superior across indolent histologies.</p>\n<h3 id=\"s-rituximab-lenalidomide-is-an-alternative-not-proven-superior\">Rituximab-lenalidomide is an alternative, not proven superior</h3>\n<p><a class=\"trial-link\" href=\"/evidence/#t-relevance\">RELEVANCE</a> compared rituximab-lenalidomide with rituximab-chemotherapy in 1,030 untreated patients. Neither co-primary endpoint was met: confirmed or unconfirmed complete response at 120 weeks was 48% versus 53% (p=0.13), and progression-free survival gave HR 1.10 (95% CI 0.85 to 1.43; p=0.48). Three-year progression-free survival was 77% versus 78%, and overall survival was immature.</p>\n<p>The toxicity profiles differed. Rituximab-lenalidomide caused more grade 3–4 skin reactions, tumour flare and dose modification; chemotherapy caused more grade 3–4 neutropenia and febrile neutropenia. Among 70 patients with stage I–II disease, the confirmed or unconfirmed complete-response interaction favoured chemotherapy, but this was a prespecified exploratory subgroup result.</p>\n<h3 id=\"s-obinutuzumab-improves-progression-free-survival-at-a-toxicity-cost\">Obinutuzumab improves progression-free survival at a toxicity cost</h3>\n<p><a class=\"trial-link\" href=\"/evidence/#t-gallium\">GALLIUM</a> randomised 1,202 patients with untreated follicular lymphoma requiring therapy to obinutuzumab- or rituximab-based chemotherapy, followed by maintenance with the assigned antibody in responders. At the interim analysis, investigator-assessed 3-year progression-free survival was 80.0% versus 73.3% (HR 0.66, 95% CI 0.51 to 0.85); independent review was concordant.</p>\n<p>Overall survival and end-of-induction response did not differ. Obinutuzumab caused more grade 3–5 adverse events (74.6% vs 67.8%), serious adverse events (46.1% vs 39.9%), and grade 3–5 infusion reactions (12.4% vs 6.7%), infections (20.0% vs 15.6%) and neutropenia (45.9% vs 39.5%). The progression-free-survival gain must be weighed against this additional toxicity.</p>\n<h3 id=\"s-maintenance-benefits-responders-but-has-no-demonstrated-survival-gain-upfront\">Maintenance benefits responders but has no demonstrated survival gain upfront</h3>\n<p><a class=\"trial-link\" href=\"/evidence/#t-prima\">PRIMA</a> randomised 1,019 patients with high-tumour-burden grade 1–3A disease who had responded to and tolerated frontline rituximab-chemotherapy; efficacy analysis included 1,018. Rituximab every 8 weeks for 2 years improved the alpha-protected primary 3-year progression-free-survival endpoint (74.9% vs 57.6%; HR 0.55, 95% CI 0.44 to 0.68).</p>\n<p>In a non-alpha-protected secondary analysis, complete or unconfirmed complete response at the end of maintenance was 71.5% (361/505) versus 52.2% (268/513; nominal p=0.0001).</p>\n<p>Overall survival and quality of life did not differ. Maintenance increased grade 3–4 adverse events (24% vs 17%) and grade 2–4 infections (39% vs 24%); one patient without antiviral prophylaxis died from fulminant hepatitis B. The result applies to patients who responded to and tolerated induction, not to an unselected frontline population.</p>\n<h2 id=\"s-relapsed-disease-match-treatment-to-prior-exposure-and-biology\">Relapsed disease: match treatment to prior exposure and biology</h2>\n<h3 id=\"s-immunochemotherapy-and-maintenance\">Immunochemotherapy and maintenance</h3>\n<p><a class=\"trial-link\" href=\"/evidence/#t-eortc-20981-van-oers\">EORTC 20981 (van Oers)</a> studied relapsed or resistant follicular lymphoma after no more than two prior non-anthracycline regimens and excluded prior rituximab. Responders to CHOP or R-CHOP underwent a second randomisation. Rituximab maintenance improved the primary progression-free-survival endpoint (median 51.5 vs 14.9 months; HR 0.40). The prespecified secondary overall-survival analysis nominally favoured maintenance at 3 years (85.1% vs 77.1%; HR 0.52; p=0.011).</p>\n<p>The maintenance result came at more grade 3–4 infection (9% vs 2.4%). Its direct applicability is limited in contemporary relapse because the trial excluded prior rituximab, anthracycline and stem-cell transplantation.</p>\n<p><a class=\"trial-link\" href=\"/evidence/#t-gadolin\">GADOLIN</a> enrolled rituximab-refractory indolent lymphoma. Obinutuzumab-bendamustine followed by obinutuzumab maintenance improved the alpha-protected, independently reviewed primary progression-free-survival endpoint at the earlier cut (HR 0.55, 95% CI 0.40 to 0.74). At 31.8 months, non-alpha-protected secondary analyses showed investigator-assessed median progression-free survival of 25.8 versus 14.1 months and a nominal overall-survival result favouring the combination (HR 0.67, 95% CI 0.47 to 0.96; p=0.0269).</p>\n<p>The earlier and updated analyses should not be fused: assessor, maturity and survival findings changed between publications. No progression-free-survival benefit was shown in the 75 patients with non-follicular histology (HR 0.94, 95% CI 0.46 to 1.90), an underpowered subgroup. Grade 3–5 adverse events occurred in 72.5% versus 65.5%.</p>\n<h3 id=\"s-lenalidomide-based-combinations\">Lenalidomide-based combinations</h3>\n<p><a class=\"trial-link\" href=\"/evidence/#t-augment\">AUGMENT</a> excluded rituximab-refractory disease and compared lenalidomide-rituximab with rituximab alone. Median progression-free survival was 39.4 versus 14.1 months by independent review (HR 0.46, 95% CI 0.34 to 0.62), with higher response and complete-response rates. Overall survival was immature.</p>\n<p>Grade 3–4 adverse events occurred in 69% versus 32%, driven by neutropenia (50% vs 13%). The prespecified exploratory marginal-zone estimate was null and imprecise (HR 1.00, 95% CI 0.47 to 2.13); no treatment-by-histology interaction was reported, and the authors did not exclude absence of effect in that subgroup.</p>\n<p><a class=\"trial-link\" href=\"/evidence/#t-inmind\">inMIND</a> added tafasitamab to lenalidomide-rituximab in 548 patients with relapsed or refractory grade 1–3A follicular lymphoma. Investigator-assessed progression-free survival, the primary endpoint, was 22.4 versus 13.9 months (HR 0.43, 95% CI 0.32 to 0.58).</p>\n<p>The alpha-protected key secondary PET-complete-response endpoint in FDG-avid patients was 49% (124/251) versus 40% (101/254; p=0.029). A later non-binding interim futility look at overall survival remained immature (HR 0.59, 95% CI 0.31 to 1.13; median follow-up 15.3 months), with no formal p-value reported.</p>\n<p>Point estimates favoured tafasitamab in both POD24 strata and both anti-CD20-refractoriness strata, but no formal interaction was reported. Grade 3–4 events were similar (71% vs 69%), including neutropenia (40% vs 38%).</p>\n<p><a class=\"trial-link\" href=\"/evidence/#t-epcore-fl-1\">EPCORE FL-1</a> randomised 488 patients with relapsed or refractory CD20-positive classic grade 1–3A follicular lymphoma requiring treatment after at least one anti-CD20-containing chemotherapy regimen. It added epcoritamab to fixed-duration lenalidomide-rituximab.</p>\n<p>Both primary endpoints were met: response was 95% versus 79%, and progression-free survival gave HR 0.21 (95% CI 0.14 to 0.31; median not reached vs 11.7 months). Complete response was 83% versus 50% at 14.8 months&#x27; median follow-up.</p>\n<p>Overall survival did not cross its prespecified boundary (HR 0.38, 95% CI 0.18 to 0.80; nominal p=0.0039), so formal testing stopped. Grade 3 or higher adverse events occurred in 90% versus 68%, serious events in 56% versus 29%, and cytokine release syndrome in 35% versus under 1%, with no event above grade 2.</p>\n<h3 id=\"s-oral-targeted-therapy-after-multiple-prior-lines\">Oral targeted therapy after multiple prior lines</h3>\n<p><a class=\"trial-link\" href=\"/evidence/#t-idelalisib-study-101-09\">Idelalisib (Study 101-09)</a> enrolled 125 patients with indolent lymphoma refractory to rituximab and an alkylating agent. Independent-review response was 57% (95% CI 48 to 66), complete response 6%, median response duration 12.5 months and median progression-free survival 11.0 months. This was a single-arm study.</p>\n<p>Toxicity may be delayed. Grade 3 or higher diarrhoea or colitis occurred in 16% at a median of 6 months. Grade 3 or higher transaminitis occurred in 13% at a median of 6.3 weeks, pneumonia in 7% and laboratory neutropenia in 27%; 20% stopped treatment for toxicity.</p>\n<p><a class=\"trial-link\" href=\"/evidence/#t-tazemetostat-e7438-g000-101\">Tazemetostat (E7438-G000-101)</a> enrolled separate EZH2-mutant and wild-type cohorts and was not designed to compare them. Response was 69% (95% CI 53 to 82) in 45 patients with mutant disease and 35% (95% CI 23 to 49) in 54 with wild-type disease; median progression-free survival was 13.8 and 11.1 months.</p>\n<p>Grade 3 or higher treatment-related thrombocytopenia and neutropenia each occurred in 3%, and 8% stopped treatment for toxicity. One patient developed myelodysplastic syndrome and one developed acute myeloid leukaemia on treatment.</p>\n<h3 id=\"s-car-t-cell-therapy\">CAR T-cell therapy</h3>\n<p><a class=\"trial-link\" href=\"/evidence/#t-zuma-5-axi-cel\">ZUMA-5 (axi-cel)</a> leukapheresed 153 patients and treated 148. In the primary per-protocol efficacy set (n=104; 84 FL and 20 MZL), independent-review response was 92% with complete response in 74%; in FL it was 94% with complete response in 79%. In the updated per-protocol set (n=109; median follow-up 23.3 months), 18-month progression-free survival was 64.8% and overall survival 87.4%.</p>\n<p>Cytokine release syndrome occurred in 82% (7% grade 3 or higher) and neurologic events in 59% (19% grade 3–4). Four patients died of adverse events; one CRS-associated multisystem-organ-failure death was considered treatment related. Marginal-zone outcomes were descriptive and should not be compared formally with the follicular cohort.</p>\n<p><a class=\"trial-link\" href=\"/evidence/#t-elara-tisa-cel\">ELARA (tisa-cel)</a> enrolled 98 patients and infused 97; the efficacy analysis included 94 with measurable disease before infusion. In that set, independent-review complete response was 69.1% (65/94; 95% CI 58.8 to 78.3) and overall response 86.2% (81/94). At the prespecified interim analysis, median response duration, progression-free survival and overall survival were not reached; 12-month progression-free survival was 67%.</p>\n<p>Cytokine release syndrome occurred in 48.5%, with no grade 3 or higher event; neurologic events occurred in 37.1%, including 3.1% grade 3 or higher. Grade 3 or higher cytopenia occurred in 69.1% within 8 weeks. Seven patients died, including one death attributed to CRS; none was assessed as treatment related.</p>\n<p><a class=\"trial-link\" href=\"/evidence/#t-transcend-fl-liso-cel\">TRANSCEND FL (liso-cel)</a> reported separately on later-line and high-risk second-line cohorts. Independent-review response was 97% with complete response in 94% among 101 evaluable later-line patients, and 96% with every responder in complete response among 23 second-line patients. The trial was not designed to compare cohorts.</p>\n<p>Results were early: median response duration, progression-free survival and overall survival were unreached, and 90% were censored from the overall-survival analysis. In the pooled treated safety set (n=130), cytokine release syndrome occurred in 58%, with one grade 3 event, and neurologic events in 15%. Thirteen deaths occurred on study, including one before infusion; investigators attributed two post-infusion deaths to liso-cel.</p>\n<h3 id=\"s-bispecific-antibodies\">Bispecific antibodies</h3>\n<p><a class=\"trial-link\" href=\"/evidence/#t-mosunetuzumab-go29781\">Mosunetuzumab (GO29781)</a> gave fixed-duration intravenous mosunetuzumab with step-up dosing after at least two prior lines. In 90 treated patients, the alpha-protected primary independent-review complete-response rate was 60.0% (54/90; 95% CI 49.1 to 70.2) against a 14% historical benchmark. Secondary results included overall response of 80.0% (72/90) and median progression-free survival of 17.9 months.</p>\n<p>Cytokine release syndrome occurred in 44%, almost entirely grade 1–2 and mainly during cycle 1. One patient each had grade 3 and grade 4 events. These rates used the ASTCT grading scale and are not directly comparable with CAR T-cell studies using Lee 2014 criteria.</p>\n<p><a class=\"trial-link\" href=\"/evidence/#t-epcore-nhl-1-epcoritamab\">EPCORE NHL-1 (epcoritamab)</a> enrolled a pivotal cohort of 128 patients after at least two prior lines. Independent-review response was 82.0% and complete response 62.5%; at 18 months, 49.4% were progression-free and 70.2% alive. Response was 89% after exactly two prior lines and 68% after four or more in prespecified exploratory subgroups.</p>\n<p>Cytokine release syndrome occurred in 66% of the pivotal cohort, almost entirely grade 1–2. A separate optimisation cohort (n=86) used an intermediate step-up dose, dexamethasone and hydration; cytokine release syndrome was 49%, with no event above grade 2. Among 82 patients reaching the first full dose, 44 (54%) were not admitted for monitoring.</p>\n<h2 id=\"s-marginal-zone-lymphoma-do-not-import-follicular-estimates-automatically\">Marginal zone lymphoma: do not import follicular estimates automatically</h2>\n<p>Mixed-histology indolent-lymphoma trials provide only limited marginal-zone evidence. In StiL NHL1, the post-hoc marginal-zone progression-free-survival estimate was HR 0.70 (95% CI 0.34 to 1.43), without a significant treatment-by-histology interaction. <sup class=\"trial-ref\"><a href=\"#ref-lymphoma-indolent-non-hodgkin-lymphomas-t-stil-nhl1-rummel\" aria-label=\"Reference 5: StiL NHL1 (Rummel)\">5</a></sup></p>\n<p>In AUGMENT, the prespecified exploratory marginal-zone estimate was HR 1.00 (95% CI 0.47 to 2.13), and no treatment-by-histology interaction was reported. The authors considered the result difficult to interpret because of the small sample and baseline imbalance, without excluding absence of effect. <sup class=\"trial-ref\"><a href=\"#ref-lymphoma-indolent-non-hodgkin-lymphomas-t-augment\" aria-label=\"Reference 12: AUGMENT\">12</a></sup></p>\n<p>ZUMA-5 included 23 evaluable marginal-zone patients, with response in 83% and median progression-free survival of 12.0 months. Among 24 treated patients, cytokine release syndrome occurred in 100% and grade 3–4 neurologic events in 38%; these descriptive rates were not formally compared with follicular lymphoma. <sup class=\"trial-ref\"><a href=\"#ref-lymphoma-indolent-non-hodgkin-lymphomas-t-zuma-5-axi-cel\" aria-label=\"Reference 17: ZUMA-5 (axi-cel)\">17</a></sup></p>\n<h3 id=\"s-non-gastric-extranodal-disease\">Non-gastric extranodal disease</h3>\n<p>Non-gastric extranodal marginal-zone lymphoma is heterogeneous across sites and stages. The mixed-histology results above do not establish that follicular-lymphoma effect estimates apply to extranodal marginal-zone lymphoma, and they do not support one regimen across all extranodal presentations.</p>\n<h2 id=\"s-references\">References</h2>\n<ol class=\"refs\">\n<li id=\"ref-lymphoma-indolent-non-hodgkin-lymphomas-t-trog-99-03\"><a class=\"trial-link\" href=\"/evidence/#t-trog-99-03\">TROG 99.03</a>. <a href=\"https://drive.google.com/file/d/1IcAvnT4IPSSt0wnRXR4h-KOli90sMRno/preview\">J Clin Oncol 2018;36:2918-2925</a></li>\n<li id=\"ref-lymphoma-indolent-non-hodgkin-lymphomas-t-ardeshna-ncri\"><a class=\"trial-link\" href=\"/evidence/#t-ardeshna-ncri\">Ardeshna (NCRI)</a>. <a href=\"https://drive.google.com/file/d/1xl5nxYpYlPoGFC7WKlhq8nEax1tjcy-O/preview\">Lancet Oncol 2014;15:424-435</a></li>\n<li id=\"ref-lymphoma-indolent-non-hodgkin-lymphomas-t-glsg-hiddemann\"><a class=\"trial-link\" href=\"/evidence/#t-glsg-hiddemann\">GLSG (Hiddemann)</a>. <a href=\"https://drive.google.com/file/d/1ezKD2P8ZlVoswA0W0BBuuCHYVgFITjDl/preview\">Blood 2005;106:3725-3732</a></li>\n<li id=\"ref-lymphoma-indolent-non-hodgkin-lymphomas-t-foll05-fil\"><a class=\"trial-link\" href=\"/evidence/#t-foll05-fil\">FOLL05 (FIL)</a>. <a href=\"https://drive.google.com/file/d/1ERQ8V0yL6jx_Q_xQUpvqByPKlDVyxYpM/preview\">J Clin Oncol 2013;31:1506-1513</a></li>\n<li id=\"ref-lymphoma-indolent-non-hodgkin-lymphomas-t-stil-nhl1-rummel\"><a class=\"trial-link\" href=\"/evidence/#t-stil-nhl1-rummel\">StiL NHL1 (Rummel)</a>. <a href=\"https://drive.google.com/file/d/1EbEi_11PEVw_uMb7GNI6qmRSpVA72hSu/preview\">Lancet 2013;381:1203-1210</a></li>\n<li id=\"ref-lymphoma-indolent-non-hodgkin-lymphomas-t-bright\"><a class=\"trial-link\" href=\"/evidence/#t-bright\">BRIGHT</a>. <a href=\"https://drive.google.com/file/d/1y7b12fTdM1z0KcIQno0TPWJi2DBnrpKC/preview\">Blood 2014;123:2944-2952</a></li>\n<li id=\"ref-lymphoma-indolent-non-hodgkin-lymphomas-t-relevance\"><a class=\"trial-link\" href=\"/evidence/#t-relevance\">RELEVANCE</a>. <a href=\"https://drive.google.com/file/d/12VDMtJlg4gddRyHU_QHQfmP3NI2e1IkO/preview\">N Engl J Med 2018;379:934-947</a></li>\n<li id=\"ref-lymphoma-indolent-non-hodgkin-lymphomas-t-gallium\"><a class=\"trial-link\" href=\"/evidence/#t-gallium\">GALLIUM</a>. <a href=\"https://drive.google.com/file/d/1kxy4NGtUEvxD3p-m68YzaSeg7l9HgOYw/preview\">N Engl J Med 2017;377:1331-1344</a></li>\n<li id=\"ref-lymphoma-indolent-non-hodgkin-lymphomas-t-prima\"><a class=\"trial-link\" href=\"/evidence/#t-prima\">PRIMA</a>. <a href=\"https://doi.org/10.1056/NEJMoa1910962\">N Engl J Med 2019;381:2391-2402</a></li>\n<li id=\"ref-lymphoma-indolent-non-hodgkin-lymphomas-t-eortc-20981-van-oers\"><a class=\"trial-link\" href=\"/evidence/#t-eortc-20981-van-oers\">EORTC 20981 (van Oers)</a>. <a href=\"https://drive.google.com/file/d/1tb1oNVP_ZIe-aqy38ZbzKvMLc1Y2aMXy/preview\">Blood 2006;108:3295-3301</a></li>\n<li id=\"ref-lymphoma-indolent-non-hodgkin-lymphomas-t-gadolin\"><a class=\"trial-link\" href=\"/evidence/#t-gadolin\">GADOLIN</a>. <a href=\"https://drive.google.com/file/d/1_JLsTjHEYMZq-jKMN9-0HfnK352StG7o/preview\">Lancet Oncol 2016;17:1081-1093</a>; <a href=\"https://drive.google.com/file/d/1OWv8AeDPvSu5TctIdU9_ILiqGadsAHdB/preview\">J Clin Oncol 2018;36:2259-2266</a></li>\n<li id=\"ref-lymphoma-indolent-non-hodgkin-lymphomas-t-augment\"><a class=\"trial-link\" href=\"/evidence/#t-augment\">AUGMENT</a>. <a href=\"https://drive.google.com/file/d/1HrdByfbDSWb_Z7eyc1Sbcl9hzs--1naf/preview\">J Clin Oncol 2019;37:1188-1199</a></li>\n<li id=\"ref-lymphoma-indolent-non-hodgkin-lymphomas-t-inmind\"><a class=\"trial-link\" href=\"/evidence/#t-inmind\">inMIND</a>. <a href=\"https://drive.google.com/file/d/1Fjfrg6BSyi9_o9zc1346HZb-x0AEGrSA/preview\">Lancet 2026;407:133-146</a></li>\n<li id=\"ref-lymphoma-indolent-non-hodgkin-lymphomas-t-epcore-fl-1\"><a class=\"trial-link\" href=\"/evidence/#t-epcore-fl-1\">EPCORE FL-1</a>. <a href=\"https://drive.google.com/file/d/1wJnANCCxsebF0t6q-Ut4xDyCMLj-lJZr/preview\">Lancet 2026;407:161-173</a></li>\n<li id=\"ref-lymphoma-indolent-non-hodgkin-lymphomas-t-idelalisib-study-101-09\"><a class=\"trial-link\" href=\"/evidence/#t-idelalisib-study-101-09\">Idelalisib (Study 101-09)</a>. <a href=\"https://drive.google.com/file/d/1KK0OYasIxjYHg7Rcz9ocTZjSroEKYrOb/preview\">N Engl J Med 2014;370:1008-1018</a></li>\n<li id=\"ref-lymphoma-indolent-non-hodgkin-lymphomas-t-tazemetostat-e7438-g000-101\"><a class=\"trial-link\" href=\"/evidence/#t-tazemetostat-e7438-g000-101\">Tazemetostat (E7438-G000-101)</a>. <a href=\"https://drive.google.com/file/d/1Za9VY4eID5ZfIlQRJ1Ob1TFjLAtfoIkR/preview\">Lancet Oncol 2020;21:1433-1442</a></li>\n<li id=\"ref-lymphoma-indolent-non-hodgkin-lymphomas-t-zuma-5-axi-cel\"><a class=\"trial-link\" href=\"/evidence/#t-zuma-5-axi-cel\">ZUMA-5 (axi-cel)</a>. <a href=\"https://drive.google.com/file/d/1MOo6Sg7C9ijngY7ktOKMIZWtqG67Xxxf/preview\">Lancet Oncol 2022;23:91-103</a></li>\n<li id=\"ref-lymphoma-indolent-non-hodgkin-lymphomas-t-elara-tisa-cel\"><a class=\"trial-link\" href=\"/evidence/#t-elara-tisa-cel\">ELARA (tisa-cel)</a>. <a href=\"https://drive.google.com/file/d/1X2BnNfrluImrtQ5GO2HOPKAXPGJnWekq/preview\">Nat Med 2022;28:325-332</a></li>\n<li id=\"ref-lymphoma-indolent-non-hodgkin-lymphomas-t-transcend-fl-liso-cel\"><a class=\"trial-link\" href=\"/evidence/#t-transcend-fl-liso-cel\">TRANSCEND FL (liso-cel)</a>. <a href=\"https://drive.google.com/file/d/15Jb_JS9-_ekQ9tHCHWZv4Ix_hY8aYR-r/preview\">Nat Med 2024;30:2199-2207</a></li>\n<li id=\"ref-lymphoma-indolent-non-hodgkin-lymphomas-t-mosunetuzumab-go29781\"><a class=\"trial-link\" href=\"/evidence/#t-mosunetuzumab-go29781\">Mosunetuzumab (GO29781)</a>. <a href=\"https://drive.google.com/file/d/1VVLtVvRWASCXcRUpFu7z2INMk7kpOrvT/preview\">Lancet Oncol 2022;23:1055-1065</a></li>\n<li id=\"ref-lymphoma-indolent-non-hodgkin-lymphomas-t-epcore-nhl-1-epcoritamab\"><a class=\"trial-link\" href=\"/evidence/#t-epcore-nhl-1-epcoritamab\">EPCORE NHL-1 (epcoritamab)</a>. <a href=\"https://drive.google.com/file/d/1fdM0sVXpgacxP6LYbkU4MHsjqyTeKXvp/preview\">Lancet Haematol 2024;11:e593-e605</a></li>\n</ol>", "_hay": "indolent non-hodgkin lymphomas indolent-non-hodgkin-lymphomas lymphoma follicular lymphoma: define the evidence boundary stage i–ii disease: radiotherapy controls local disease advanced low-burden disease: observation remains valid advanced disease requiring treatment: choose the backbone and antibody establishing rituximab-based immunochemotherapy bendamustine-rituximab and r-chop are not interchangeable in every histology rituximab-lenalidomide is an alternative, not proven superior obinutuzumab improves progression-free survival at a toxicity cost maintenance benefits responders but has no demonstrated survival gain upfront relapsed disease: match treatment to prior exposure and biology immunochemotherapy and maintenance lenalidomide-based combinations oral targeted therapy after multiple prior lines car t-cell therapy bispecific antibodies marginal zone lymphoma: do not import follicular estimates automatically non-gastric extranodal disease references"}, {"id": "melanoma-melanoma", "slug": "melanoma", "group": "Melanoma", "title": "Melanoma", "updated": "", "sections": [{"id": "s-epidemiology", "h": "Epidemiology", "depth": 2}, {"id": "s-risk-factors", "h": "Risk factors", "depth": 2}, {"id": "s-pathology-and-molecular-classification", "h": "Pathology and molecular classification", "depth": 2}, {"id": "s-clinical-presentation-and-diagnosis", "h": "Clinical presentation and diagnosis", "depth": 2}, {"id": "s-staging-and-work-up", "h": "Staging and work-up", "depth": 2}, {"id": "s-sentinel-lymph-node-biopsy", "h": "Sentinel lymph node biopsy", "depth": 3}, {"id": "s-imaging-for-distant-metastases", "h": "Imaging for distant metastases", "depth": 3}, {"id": "s-management-of-resectable-disease", "h": "Management of resectable disease", "depth": 2}, {"id": "s-surgery-and-radiotherapy", "h": "Surgery and radiotherapy", "depth": 3}, {"id": "s-adjuvant-systemic-therapy-by-stage", "h": "Adjuvant systemic therapy by stage", "depth": 3}, {"id": "s-neoadjuvant-therapy", "h": "Neoadjuvant therapy", "depth": 3}, {"id": "s-management-of-advanced-disease", "h": "Management of advanced disease", "depth": 2}, {"id": "s-first-line-therapy-in-braf-wild-type-disease", "h": "First-line therapy in *BRAF* wild-type disease", "depth": 3}, {"id": "s-first-line-therapy-in-braf-v600-mutant-disease", "h": "First-line therapy in *BRAF* V600-mutant disease", "depth": 3}, {"id": "s-braf-and-mek-inhibition", "h": "BRAF and MEK inhibition", "depth": 3}, {"id": "s-therapy-after-anti-pd-1-failure", "h": "Therapy after anti–PD-1 failure", "depth": 2}, {"id": "s-uveal-and-mucosal-melanoma", "h": "Uveal and mucosal melanoma", "depth": 2}, {"id": "s-references", "h": "References", "depth": 2}], "html": "<h2 id=\"s-epidemiology\">Epidemiology</h2>\n<p>Cutaneous melanoma accounts for 1.7% of new cancer diagnoses worldwide (232,100 cases) but only 0.7% of cancer deaths, a gap attributable to screening, early detection and adequate surgery for early-stage disease. It is the fifth commonest cancer in the United States in both sexes, and most patients present with localised disease: 84% stage I–II, 8% regional stage III and 4% metastatic stage IV. Incidence in Singapore is low, at 0.5 cases per 100,000 persons. Because sun-driven cutaneous melanoma is uncommon in Asian populations, the clinicopathological spectrum shifts towards subtypes that are marginal in Caucasian series: acral melanoma (nail beds, palms, soles and hairless skin) accounts for approximately 35–40% and mucosal melanoma for approximately 15–20% of Asian melanomas. Both subtypes were sparsely represented in the registration trials, which limits how directly those data apply to a local practice.</p>\n<h2 id=\"s-risk-factors\">Risk factors</h2>\n<p>Phenotypic factors carry the strongest risk associations.</p>\n<ul><li>Atypical naevi carry the strongest single association (OR 17.4), defined clinically by asymmetry, irregular borders, multiple colours or diameter greater than 5 mm.</li><li>Increased total mole count, a tendency to sunburn, and red hair with blue eyes or Fitzpatrick skin type I complete the phenotype.</li></ul>\n<p>A personal history of melanoma raises risk substantially (OR 12.78), and a history of non-melanoma skin cancer raises it moderately (relative risk 4.28). Immunosuppression from solid organ transplantation, haematopoietic cell transplantation, or HIV infection is an independent risk factor. The environmental driver is ultraviolet exposure. Intermittent intense exposure produces truncal and extremity melanomas, whereas chronic cumulative exposure produces head, neck and arm melanomas. Tanning bed use and residence at latitudes nearer the equator increase risk. Familial melanoma has been linked to germline variants in <em>CDKN2A</em>, <em>MC1R</em> and <em>BAP1</em>; <em>BAP1</em> in particular should prompt consideration of the uveal melanoma and mesothelioma spectrum.</p>\n<h2 id=\"s-pathology-and-molecular-classification\">Pathology and molecular classification</h2>\n<p>Most melanomas begin with a radial growth phase, in which the tumour remains confined to the epidermis, sometimes for years, and is almost always cured by excision alone. Progression to a vertical growth phase, driven by stepwise accumulation of genetic abnormalities, converts the lesion into an expansile nodule that breaches the basement membrane and invades the dermis. That transition creates metastatic risk, and Breslow thickness measures it.</p>\n<p>Superficial spreading melanoma is the commonest subtype, at approximately 75% of all melanomas. It shows lateral growth before invasion, presents as a variably pigmented macule or plaque with an irregular border, and displays multiple shades of red, blue, black, grey and white. More than 60% are diagnosed as thin, highly curable tumours of 1 mm or less. Roughly 30% arise in association with a pre-existing naevus and the remaining 70% arise de novo.</p>\n<p>Nodular melanoma is the second commonest type, at 15–30%. It presents as a darkly pigmented, pedunculated or polypoid papule or nodule, and it defeats the ABCDE rule more often than any other subtype: colour is frequently uniform or amelanotic and pink, borders are symmetric, and the diameter is small. Most are thicker than 2 mm at diagnosis, because the lesion enters vertical growth early. Lentigo maligna melanoma arises in chronically sun-damaged skin in older patients, beginning as a tan or brown macule that enlarges over years. Darker asymmetric foci, colour variegation and raised areas within the precursor in situ lesion signify vertical growth.</p>\n<p>Acral lentiginous melanoma accounts for less than 5% of melanomas in Western series but a far larger share in Asian practice. It occurs on palmar, plantar and subungual surfaces, first appearing as dark brown to black irregularly pigmented macules or patches; raised areas, ulceration, bleeding or larger diameter signify deeper dermal invasion. Subungual melanoma may present as a mass beneath the nail plate with ulceration and nail plate destruction. Amelanotic, spitzoid and desmoplastic melanomas are uncommon subtypes, each with its own diagnostic pitfall. Histopathological diagnosis rests on cytological atypia (melanocytes larger than normal, with large hyperchromatic nuclei, irregular nuclear shape, polymorphism and prominent nucleoli) together with architectural disorder (asymmetry, poor circumscription, and melanocytic nests of varying size and shape). Immunohistochemistry supports lineage but not malignancy.</p>\n<ul><li>S-100 is highly sensitive and poorly specific.</li><li>MART-1/Melan-A is sensitive and specific for melanocytes but does not mark malignant transformation.</li><li>HMB-45 and tyrosinase are the other standard markers.</li></ul>\n<p>Molecular testing in advanced disease should cover <em>BRAF</em> V600, PD-L1, <em>RAS</em>, <em>KIT</em> and <em>NTRK</em>. <em>BRAF</em> V600 status is the only one that changes first-line drug selection; <em>KIT</em> is worth pursuing in acral and mucosal disease.</p>\n<h2 id=\"s-clinical-presentation-and-diagnosis\">Clinical presentation and diagnosis</h2>\n<p>Screen pigmented lesions using the ABCDE criteria:</p>\n<ul><li>Asymmetry, such that one half of a bisected lesion is not identical to the other.</li><li>Border irregularity.</li><li>Colour variegation across red, blue, black, grey or white.</li><li>Diameter of 6 mm or more.</li><li>Evolution in size, shape or colour, or the appearance of a new lesion.</li></ul>\n<p>Evolution detects the nodular and amelanotic lesions that the other four criteria miss. Diagnosis requires excisional or complete biopsy, by saucerisation or deep shave, punch biopsy for small-diameter lesions, or elliptical excision, taking a 1–3 mm margin of normal skin and extending deep enough to encompass the thickest portion of the lesion. A partial or superficial shave that transects the base forfeits accurate Breslow thickness and therefore accurate staging.</p>\n<h2 id=\"s-staging-and-work-up\">Staging and work-up</h2>\n<p>The T category is built on tumour thickness and ulceration, the latter defined as absence of an intact epithelium over the melanoma. Mitotic rate per mm² remains an important prognostic factor at a threshold of 1/mm², but it was a T-category criterion in AJCC 7 and was removed in AJCC 8. The N category distinguishes three forms of intralymphatic spread.</p>\n<ul><li class=\"evidence-prose\">In-transit metastases lie more than 2 cm from the primary but not beyond the nearest regional nodal basin.</li><li class=\"evidence-prose\">Satellites lie within 2 cm of the primary.</li><li class=\"evidence-prose\">Microsatellites are visible only microscopically, defined as tumour nests greater than 0.05 mm in diameter in the reticular dermis, panniculus or vessels beneath the principal invasive tumour, separated from it by at least 0.3 mm of normal tissue on the section in which the Breslow measurement was taken.</li></ul>\n<p>For M disease, serum LDH is an independent prognostic factor and a surrogate for overall tumour burden, annotated as (0) for non-elevated and (1) for elevated.</p>\n<div class=\"tblwrap\" role=\"region\" aria-label=\"Scrollable table\" tabindex=\"0\"><table><thead><tr><th scope=\"col\">Stage</th><th scope=\"col\">Definition</th><th scope=\"col\">Groupings</th></tr></thead><tbody><tr><td>I</td><td>Low-risk tumours, no regional or distant metastases</td><td>IA T1N0M0; IB T2aN0M0</td></tr><tr><td>II</td><td>Higher recurrence risk, no regional or distant metastases</td><td>IIA T2b/T3aN0M0; IIB T3b/T4aN0M0; IIC T4bN0M0</td></tr><tr><td>III</td><td>Any T, node-positive, M0</td><td></td></tr><tr><td>IV</td><td>Any T, any N, M1</td><td></td></tr></tbody></table></div>\n<p>Older age and male sex carry adverse prognostic weight independent of stage.</p>\n<h3 id=\"s-sentinel-lymph-node-biopsy\">Sentinel lymph node biopsy</h3>\n<p>Sentinel lymph node biopsy stages and prognosticates; it is not a therapeutic procedure. Its rationale is:</p>\n<ul><li>accurate staging;</li><li>prognostication;</li><li>regional disease control;</li><li>lower morbidity than completion dissection;</li><li>selection for adjuvant therapy.</li></ul>\n<p>Completion lymph node dissection after a positive sentinel node has no established survival role, and ultrasound surveillance is sufficient.</p>\n<div class=\"tblwrap\" role=\"region\" aria-label=\"Scrollable table\" tabindex=\"0\"><table><thead><tr><th scope=\"col\"></th><th scope=\"col\">MSLT-I (NEJM 2006, NEJM 2014)</th><th scope=\"col\">MSLT-II (NEJM 2017, JAMA Surg 2022)</th></tr></thead><tbody><tr><td>Question</td><td>Does sentinel lymph node biopsy improve outcomes versus nodal observation?</td><td>In sentinel-node-positive patients, does completion lymph node dissection improve outcomes versus ultrasound surveillance?</td></tr><tr><td>Design</td><td>Phase 3: sentinel node biopsy with immediate completion dissection if positive, versus observation with delayed lymphadenectomy at nodal relapse</td><td>Phase 3 in sentinel-node-positive patients: completion dissection versus nodal observation (clinical review and nodal ultrasound 4-monthly for 2 years, 6-monthly for 3 years, then annually)</td></tr><tr><td>Population</td><td>N = 2001; intermediate thickness 1.2–3.5 mm (1347), thin &lt;1.2 mm (340), thick &gt;3.5 mm (314)</td><td>N = 1939</td></tr><tr><td>Primary endpoint</td><td>Melanoma-specific survival; similar at 10 years between observation and biopsy (too few events in thin melanomas for conclusions)</td><td>Melanoma-specific survival; no difference between dissection and observation</td></tr><tr><td>Other findings</td><td>Biopsy improved 10-year disease-free survival. Node-positive patients treated early did better than those treated at palpable relapse. Sentinel node status was the strongest predictor of recurrence or melanoma death on multivariable analysis.</td><td>Dissection reduced regional nodal recurrence but not distant metastasis or overall survival. In the observation arm at 10 years (JAMA Surg 2022), 80% remained free of nodal recurrence; risk factors were age over 50, ulceration, thickness above 3.5 mm, non-axillary basin, and sentinel node tumour burden above 1 mm or area above 5%.</td></tr><tr><td>Morbidity</td><td>Minimal additional morbidity over observation</td><td>Dissection caused more complications, particularly lymphoedema (24% vs 6%, P&lt;0.001)</td></tr><tr><td>Practice impact</td><td>Established sentinel node biopsy as the standard staging and prognostic tool</td><td>Routine completion dissection after a positive sentinel node is unnecessary; ultrasound surveillance is safe and avoids morbidity</td></tr></tbody></table></div>\n<p>DeCOG-SLT reached the same conclusion in a German phase 3 trial of 483 patients with sentinel-node-positive extremity melanoma randomised to completion dissection or observation, with no difference in 5-year distant metastasis-free survival, recurrence-free survival or overall survival. Offer sentinel node biopsy according to the predicted probability of a positive node.</p>\n<ul><li class=\"evidence-prose\">Biopsy is recommended from T2a upwards, where that probability exceeds 10%, and for T1b disease (thickness 0.8–1 mm, or under 0.8 mm with ulceration), where it is 5–10%.</li><li class=\"evidence-prose\">For T1a disease, NCCN allows discussion where adverse features are present (age 42 years or younger, head and neck location, lymphovascular invasion, or mitotic index of 2/mm² or more), which predicts a 5–10% probability; ESMO frames the same discussion around 3 or more mitoses/mm², a positive deep margin, or a Breslow thickness that cannot be reliably determined (pTx).</li></ul>\n<p>The MSKCC and Melanoma Institute Australia nomograms calculate that probability. For T3b, T4a and T4b primaries where the patient already qualifies for adjuvant therapy on stage II criteria, omitting sentinel node biopsy can be discussed, but the staging and locoregional-control value should be weighed, particularly for a <em>BRAF</em>-mutant thick stage IIB or IIC primary that could be upstaged to stage III (ESMO). The biopsy should ideally be done in the same setting as wide local excision, since prior wide excision disrupts lymphatic drainage.</p>\n<h3 id=\"s-imaging-for-distant-metastases\">Imaging for distant metastases</h3>\n<p>Imaging directed at specific signs or symptoms is appropriate at any stage. For asymptomatic patients, NCCN recommends baseline imaging by stage.</p>\n<div class=\"tblwrap\" role=\"region\" aria-label=\"Scrollable table\" tabindex=\"0\"><table><thead><tr><th scope=\"col\">Stage</th><th scope=\"col\">Baseline imaging</th></tr></thead><tbody><tr><td>0, I, II</td><td>Not recommended unless needed for surgical planning, or before adjuvant therapy in stage IIB/IIC</td></tr><tr><td>IIIA (sentinel node positive)</td><td>Consider CT thorax/abdomen/pelvis for baseline staging or before adjuvant therapy; add CT neck for head and neck primaries</td></tr><tr><td>IIIB/C/D</td><td>CT thorax/abdomen/pelvis, plus neck for head and neck primaries; MRI brain for IIIC/D, which carry higher CNS risk</td></tr><tr><td>IV</td><td>CT thorax/abdomen/pelvis and MRI brain</td></tr></tbody></table></div>\n<p>Whole-body PET-CT is useful to exclude distant metastases in patients being considered for potentially curative resection. Its sensitivity is higher in stage IIIC or IV disease than in less advanced disease (100% versus 84%; Cochrane Database Syst Rev 2019;7:CD012806).</p>\n<h2 id=\"s-management-of-resectable-disease\">Management of resectable disease</h2>\n<h3 id=\"s-surgery-and-radiotherapy\">Surgery and radiotherapy</h3>\n<p>Definitive treatment is full-depth wide local excision with margins scaled to thickness:</p>\n<ul><li>0.5 cm for in situ melanoma;</li><li>1 cm for tumours of 2 mm or less;</li><li>2 cm for tumours thicker than 2 mm.</li></ul>\n<p>Adjuvant radiotherapy has a very limited role. In TROG 02.01, patients with node-positive melanoma after lymphadenectomy were randomised to adjuvant radiotherapy or observation; radiotherapy roughly halved the risk of in-field relapse but did not improve recurrence-free or overall survival. Definitive radiotherapy to the primary is reserved for patients in whom excision is not possible because of comorbidity, unacceptable surgical morbidity, or refusal of surgery. Palliative radiotherapy and palliative surgery remain appropriate for local control of symptomatic lesions.</p>\n<h3 id=\"s-adjuvant-systemic-therapy-by-stage\">Adjuvant systemic therapy by stage</h3>\n<p>Stage I to IIA disease, up to T3a (4 mm without ulceration), is managed by surgery and surveillance alone. Recurrence risk is low enough that surgery alone is curative in the great majority, and adjuvant therapy has no role in this group. Two trials have tested adjuvant anti–PD-1 in resected stage IIB and IIC disease.</p>\n<ul><li class=\"evidence-prose\">In <a class=\"trial-link\" href=\"/evidence/#t-keynote-716\">KEYNOTE-716</a>, adjuvant pembrolizumab for approximately 1 year improved recurrence-free survival versus placebo (HR 0.65) and distant metastasis-free survival (HR 0.64) in resected sentinel-node-negative stage IIB/IIC melanoma (Lancet 2022;399:1718-1729).</li><li class=\"evidence-prose\"><a class=\"trial-link\" href=\"/evidence/#t-checkmate-76k\">CheckMate 76K</a> reproduced the result with nivolumab 480 mg 4-weekly (12-month recurrence-free survival 89.0% vs 79.4%, HR 0.42; distant metastasis-free survival HR 0.47; Nat Med 2023;29:2835-2843).</li></ul>\n<p>With longer follow-up the separation persists, at 4 years in the pembrolizumab trial (recurrence-free survival 71% vs 58%; distant metastasis-free survival 81% vs 70%) and at 3 years in the nivolumab trial (71% vs 61% and 79% vs 74% respectively). Overall survival is immature in both, so a node-negative patient is weighing a year of immune toxicity against an absolute recurrence-free survival difference of roughly 10 percentage points. Adjuvant therapy in stage IIIA disease depends on which AJCC edition defines the stage. Entry to the pivotal adjuvant trials was based on AJCC 7, and AJCC 7 stage IIIA identifies a higher-risk group than AJCC 8 stage IIIA, which incorporates Breslow thickness (5-year melanoma-specific survival 78% versus 93% respectively). AJCC 7 stage IIIA patients were either excluded outright or required more than 1 mm of sentinel node tumour burden to enter. For a patient with AJCC 8 stage IIIA disease and less than 1 mm of sentinel node burden, adjuvant therapy is therefore not supported by prospective evidence and surveillance is the standard. Above 1 mm of sentinel node burden, a year of adjuvant anti–PD-1 is appropriate. For resected stage IIIB to IV disease the choice is between a year of anti–PD-1 and, for <em>BRAF</em> V600-mutant tumours, a year of BRAF/MEK inhibition. <a class=\"trial-link\" href=\"/evidence/#t-keynote-054-eortc-1325\">KEYNOTE-054 (EORTC 1325)</a> established pembrolizumab 200 mg 3-weekly for approximately 1 year against placebo in completely resected high-risk stage III disease (1-year recurrence-free survival 75.4% vs 61.0%, HR 0.57; N Engl J Med 2018;378:1789-1801), with consistent benefit across subgroups including <em>BRAF</em> wild-type. The separation is maintained on long follow-up, with 7-year recurrence-free survival of 50% versus 36% and distant metastasis-free survival of 54% versus 42%. <a class=\"trial-link\" href=\"/evidence/#t-checkmate-238\">CheckMate 238</a> randomised resected stage IIIB/C or IV disease to nivolumab or high-dose ipilimumab: nivolumab improved recurrence-free survival (12-month recurrence-free survival 70.5% vs 60.8%, HR 0.65) with far less grade 3–4 toxicity (14% vs 46%; N Engl J Med 2017;377:1824-1835). At 5 years distant metastasis-free survival was 58% versus 51% and overall survival 76% versus 72%, so the case for nivolumab over ipilimumab rests on recurrence and toxicity rather than on a demonstrated survival advantage. <a class=\"trial-link\" href=\"/evidence/#t-eortc-18071\">EORTC 18071</a> is no longer used in practice. Adjuvant ipilimumab 10 mg/kg improved both recurrence-free and overall survival against placebo (5-year overall survival 65.4% vs 54.4%, HR 0.72) but caused grade 3–4 immune toxicity in approximately 54% of patients and five treatment-related deaths (Lancet Oncol 2015;16:522-530). Recurrence-free survival medians were 26.1 versus 17.1 months (HR 0.75) and 7-year distant metastasis-free survival 44.5% versus 37% (HR 0.76). It proved the principle of adjuvant checkpoint blockade and was then displaced by anti–PD-1 on toxicity grounds alone. Escalating adjuvant immunotherapy to a doublet has not improved outcomes in the standard resected population. CheckMate 915 randomised resected stage IIIB/C/D or IV disease to nivolumab plus low-dose ipilimumab versus nivolumab alone and found no recurrence-free survival difference (2-year recurrence-free survival 65% vs 63%). The exception is stage IV rendered disease-free surgically, where IMMUNED randomised patients with no evidence of disease to nivolumab plus ipilimumab, nivolumab alone, or placebo: both active arms improved recurrence-free survival over placebo (HR 0.25 for the doublet and 0.60 for nivolumab). Four-year overall survival was 83.8% with the doublet and 72.6% with nivolumab, against 63.1% with placebo (hazard ratios versus placebo 0.41 and 0.74 respectively). The doublet dose in IMMUNED was ipilimumab 3 mg/kg with nivolumab 1 mg/kg, not the low-dose adjuvant schedule of CheckMate 915, which is why CheckMate 915 cannot be read as refuting IMMUNED. For <em>BRAF</em> V600E/K-mutant resected stage III disease, <a class=\"trial-link\" href=\"/evidence/#t-combi-ad\">COMBI-AD</a> established 12 months of dabrafenib plus trametinib against placebo (3-year relapse-free survival 58% vs 39%, HR 0.47; N Engl J Med 2017;377:1813-1823), with 5-year distant metastasis-free survival of 65% versus 54% (HR 0.55) and an overall survival hazard ratio of 0.80 with both medians not reached. In a <em>BRAF</em>-mutant patient both are options, and the decision turns on toxicity profile and what is held in reserve: the BRAF/MEK doublet gives predictable, reversible, high-frequency toxicity over 12 months, whereas anti–PD-1 gives lower-frequency but potentially permanent endocrine and organ-specific toxicity. The two drugs have different toxicity profiles.</p>\n<ul><li>Dabrafenib produces common and irritating problems, chiefly pyrexia, rash and arthralgia.</li><li>Trametinib produces rare but serious ones, chiefly ocular toxicity, venous thromboembolism, haemorrhage, cardiomyopathy and pneumonitis.</li></ul>\n<p>Monitoring covers liver function, glucose, febrile reactions, skin toxicity and left ventricular ejection fraction. In <a class=\"trial-link\" href=\"/evidence/#t-keynote-942-mrna-4157-v940\">KEYNOTE-942 (mRNA-4157/V940)</a>, a randomised phase IIb trial of 157 patients with resected high-risk stage IIIB–IV melanoma, intismeran autogene plus pembrolizumab prolonged recurrence-free survival over pembrolizumab alone (18-month recurrence-free survival 79% vs 62%, HR 0.56), with benefit sustained at 3 and 5 years and an approximately 49% reduction in recurrence or death (Lancet 2024;403:632-644). This is the first randomised signal for an individualised cancer vaccine, and it remains phase II; the confirmatory phase 3 trial (V940-001) is ongoing.</p>\n<h3 id=\"s-neoadjuvant-therapy\">Neoadjuvant therapy</h3>\n<p>Neoadjuvant immunotherapy is now the preferred approach for macroscopic, resectable stage III melanoma in centres able to deliver it, though it was not FDA-approved as of August 2025. Candidates are:</p>\n<ul><li>patients with resectable stage III disease confined to lymph nodes clinically or radiologically;</li><li>selected patients with resectable in-transit metastases or oligometastatic stage IV disease.</li></ul>\n<p><a class=\"trial-link\" href=\"/evidence/#t-nadina\">NADINA</a> randomised 423 patients with resectable macroscopic stage III melanoma, 97% of whom had at least one PET-positive node, to two cycles of neoadjuvant ipilimumab 80 mg plus nivolumab 240 mg 3-weekly followed by therapeutic lymph node dissection and response-driven adjuvant therapy, versus upfront dissection followed by 12 cycles of adjuvant nivolumab. The neoadjuvant strategy improved event-free survival (12-month event-free survival 83.7% vs 57.2%, HR 0.32; N Engl J Med 2024;391:1696-1708), and the benefit held regardless of <em>BRAF</em> mutation status. Approximately 59% of patients achieved a major pathological response and received no adjuvant therapy, and pathological response predicted recurrence-free survival. The pathological complete response rate was 47.2%.</p>\n<p><a class=\"trial-link\" href=\"/evidence/#t-swog-s1801\">SWOG S1801</a> tested the same sequencing question holding the drug constant and varying only its timing. It randomised 313 patients with resectable stage IIIB to oligometastatic stage IV melanoma to three cycles of neoadjuvant pembrolizumab followed by surgery and 15 adjuvant cycles, versus surgery followed by 1 year of adjuvant pembrolizumab. The perioperative arm improved event-free survival (2-year event-free survival 72% vs 49%, HR 0.58; N Engl J Med 2023;388:813-823). The pathological complete response rate was 21%. Since the total drug exposure was identical, the result is attributable to sequencing: priming the immune response while the bulk of antigen is still in situ.</p>\n<h2 id=\"s-management-of-advanced-disease\">Management of advanced disease</h2>\n<h3 id=\"s-first-line-therapy-in-braf-wild-type-disease\">First-line therapy in <em>BRAF</em> wild-type disease</h3>\n<p>The first-line choice is between dual and single-agent checkpoint blockade. <a class=\"trial-link\" href=\"/evidence/#t-checkmate-067\">CheckMate 067</a> randomised untreated advanced melanoma to nivolumab plus ipilimumab, nivolumab alone, or ipilimumab alone, and both nivolumab-containing arms improved progression-free survival (11.5 and 6.9 versus 2.9 months) and objective response (58% and 44% versus 19%) over ipilimumab, with durable long-term survival on extended follow-up (N Engl J Med 2015;373:23-34). Median overall survival was 72.1 months for the doublet and 37.6 months for nivolumab, against 19.9 months for ipilimumab. The two nivolumab-containing arms were not designed for head-to-head comparison, and in the overall population the doublet improved progression-free survival but not overall survival relative to nivolumab alone. The apparent superiority of the doublet in CheckMate 067 is a cross-arm comparison the trial does not license. Toxicity is higher with the doublet. Grade 3 or higher treatment-related adverse events occurred in 63% of patients on nivolumab plus ipilimumab, 25% on nivolumab and 30% on ipilimumab. In <a class=\"trial-link\" href=\"/evidence/#t-relativity-047\">RELATIVITY-047</a>, fixed-dose nivolumab plus relatlimab, an anti–LAG-3 antibody, improved progression-free survival over nivolumab alone (median 10.1 vs 4.6 months, HR 0.75; N Engl J Med 2022;386:24-34), with median overall survival of 51.0 versus 34.1 months (HR 0.80) and objective response in 43% versus 33%. Grade 3 or higher treatment-related adverse events occurred in 22% versus 12%, roughly a third of the doublet&#x27;s rate in CheckMate 067. LAG-3 plus PD-1 blockade is therefore a reasonable first-line option where the toxicity of nivolumab plus ipilimumab is unacceptable, and it is a direct randomised test of an intensified checkpoint regimen against anti–PD-1 monotherapy, which CheckMate 067 does not provide. Two earlier trials tested ipilimumab and pembrolizumab in advanced melanoma.</p>\n<ul><li class=\"evidence-prose\"><a class=\"trial-link\" href=\"/evidence/#t-mdx010-20-ipilimumab\">MDX010-20 (ipilimumab)</a> was the first trial to improve survival in advanced melanoma, comparing ipilimumab with or without gp100 vaccine against vaccine alone in previously treated HLA-A*0201-positive disease (median overall survival 10.0 vs 6.4 months, HR approximately 0.66; N Engl J Med 2010;363:711-723).</li><li class=\"evidence-prose\"><a class=\"trial-link\" href=\"/evidence/#t-keynote-006\">KEYNOTE-006</a> then displaced ipilimumab as first-line therapy, showing that pembrolizumab improved overall survival (1-year overall survival approximately 74% vs 58%; HR 0.63–0.69) and progression-free survival with less high-grade toxicity (N Engl J Med 2015;372:2521-2532); on long follow-up median overall survival was 32.7 versus 15.9 months, progression-free survival 8.4 versus 3.4 months and objective response 42% versus 17%.</li></ul>\n<p>Anti–PD-1, alone or in combination, is the backbone of first-line therapy on the strength of those two results. The chemotherapy comparisons that preceded them are of historical interest only: ipilimumab plus dacarbazine improved overall survival over dacarbazine in CA184-024 (11.2 vs 9.1 months, HR 0.72) and nivolumab improved it in CheckMate 066 (37.3 vs 11.2 months, HR 0.50).</p>\n<h3 id=\"s-first-line-therapy-in-braf-v600-mutant-disease\">First-line therapy in <em>BRAF</em> V600-mutant disease</h3>\n<p>Immunotherapy works in <em>BRAF</em>-mutant melanoma, and the sequencing question is which modality to use first, not whether to use both. ESMO recommends first-line nivolumab plus ipilimumab where it can be safely delivered over the first few months, that is where the disease is not so aggressive or symptomatic that a rapid response is required, with targeted therapy reserved for later lines. <a class=\"trial-link\" href=\"/evidence/#t-dreamseq-ea6134\">DREAMseq (EA6134)</a> randomised 265 patients with untreated <em>BRAF</em> V600-mutant metastatic melanoma to nivolumab plus ipilimumab followed by dabrafenib plus trametinib at progression, or the reverse sequence. Starting with immunotherapy gave a higher 2-year overall survival than starting with targeted therapy (71.8%, 95% CI 62.5 to 79.1, versus 51.5%, 95% CI 41.7 to 60.4; log-rank P=.010 on Kaplan-Meier estimates; J Clin Oncol 2023;41:186-197). The protocol-specified primary comparison, a Mantel-Haenszel test of 2-year landmark rates among the 176 patients followed for at least 2 years, did not cross its efficacy boundary (P=.163). The trial was stopped early on the recommendation of the data safety monitoring committee after the Kaplan-Meier analysis crossed the O&#x27;Brien-Fleming boundary at 59% information time, with a 95% repeated confidence interval for the difference of 2.6% to 37.9%. The direction and magnitude of the effect are convincing enough to have changed practice, but the formal primary test was not met, and the estimate carries the imprecision of early stopping. The remaining efficacy figures were concordant. Two-year progression-free survival was 42% versus 19% with medians of 12 versus 9 months, response rates across the two sequenced steps were 46% then 48% for the immunotherapy-first sequence and 43% then 30% for the targeted-first sequence, and median duration of response was not reached with immunotherapy first versus 13 months with targeted therapy first (P&lt;0.001). The duration-of-response difference explains the shape of the curves.</p>\n<p>A proportion of patients progress early on immunotherapy while responders go on to sustained benefit, so the Kaplan-Meier curves cross before separating in favour of the immunotherapy-first sequence. A rapidly symptomatic patient with high tumour burden may therefore still be started on targeted therapy. <a class=\"trial-link\" href=\"/evidence/#t-secombit-ascierto\">SECOMBIT (Ascierto)</a> tested the same question in a non-comparative randomised phase II design with three arms:</p>\n<ul><li>encorafenib plus binimetinib until progression then ipilimumab plus nivolumab;</li><li>ipilimumab plus nivolumab then encorafenib plus binimetinib;</li><li>an 8-week induction of encorafenib plus binimetinib followed by ipilimumab plus nivolumab and then re-treatment with encorafenib plus binimetinib at progression.</li></ul>\n<p>All three arms exceeded the prespecified overall survival threshold, with 2-year and 3-year overall survival of 65% and 54% for the targeted-first arm, 73% and 62% for the immunotherapy-first arm, and 69% and 60% for the sandwich arm (J Clin Oncol 2023;41:212-221). The trial was not designed for between-arm comparison, so the ordering is a trend rather than a result, but it is concordant with DREAMseq. <a class=\"trial-link\" href=\"/evidence/#t-ebin-robert\">EBIN (Robert)</a> tested the sandwich strategy. In 271 patients with untreated unresectable stage III/IV <em>BRAF</em> V600E/K-mutant melanoma, 12 weeks of encorafenib plus binimetinib before nivolumab plus ipilimumab gave no progression-free survival benefit over going straight to the checkpoint doublet (median 9 versus 9 months, HR 0.87), at the cost of more grade 3–5 treatment-related adverse events (42% versus 32%; Lancet Oncol 2025;26:781-794). Short targeted induction to debulk before immunotherapy is therefore not supported.</p>\n<h3 id=\"s-braf-and-mek-inhibition\">BRAF and MEK inhibition</h3>\n<p>Three BRAF inhibitors (vemurafenib, dabrafenib, encorafenib) and three MEK inhibitors (trametinib, cobimetinib, binimetinib) are in use, and they are given as fixed pairings. <a class=\"trial-link\" href=\"/evidence/#t-brim-3\">BRIM-3</a> first proved the target, with vemurafenib reducing the risk of death by 63% versus dacarbazine in the primary analysis (HR 0.37) and prolonging progression-free survival (5.3 vs 1.6 months; N Engl J Med 2011;364:2507-2516). Single-agent trametinib and dabrafenib showed the same pattern against chemotherapy in METRIC (progression-free survival 4.8 vs 1.5 months, HR 0.45; objective response 40% vs 14%) and BREAK-3 (5.1 vs 2.7 months, HR 0.30; objective response 50% vs 6%), with overall survival estimates confounded by crossover. Adding a MEK inhibitor to a BRAF inhibitor improved response, progression-free survival and overall survival in each of the randomised comparisons, and it reduces the cutaneous toxicity of BRAF inhibition by suppressing paradoxical MAPK activation in BRAF wild-type keratinocytes.</p>\n<ul><li class=\"evidence-prose\"><a class=\"trial-link\" href=\"/evidence/#t-cobrim\">coBRIM</a> showed that adding cobimetinib to vemurafenib improved progression-free survival (9.9 vs 6.2 months, HR 0.51) and response rate (N Engl J Med 2014;371:1867-1876), with median overall survival of 22.5 versus 17.4 months (HR 0.70) and objective response in 68% versus 45%.</li><li class=\"evidence-prose\"><a class=\"trial-link\" href=\"/evidence/#t-combi-v\">COMBI-v</a> showed dabrafenib plus trametinib to be superior to vemurafenib on overall survival (12-month overall survival 72% vs 65%, HR 0.69) and progression-free survival (11.4 vs 7.3 months; N Engl J Med 2015;372:30-39), with median overall survival of 25.6 versus 18 months and objective response in 64% versus 51%.</li><li class=\"evidence-prose\">The dabrafenib/trametinib doublet was also superior to dabrafenib alone in COMBI-d (overall survival 25.1 vs 18.7 months, HR 0.71; progression-free survival 11 vs 8.8 months, HR 0.67; objective response 67% vs 51%).</li><li class=\"evidence-prose\"><a class=\"trial-link\" href=\"/evidence/#t-columbus\">COLUMBUS</a> completed the set, with encorafenib plus binimetinib improving progression-free survival over vemurafenib (14.9 vs 7.3 months, HR 0.54) and a favourable tolerability profile (Lancet Oncol 2018;19:603-615); median overall survival was 33.6 versus 16.9 months against vemurafenib and 33.6 versus 23.4 months against encorafenib alone, with objective response of 64%, 41% and 52% respectively.</li></ul>\n<p>The choice between the three doublets is made on toxicity and schedule rather than on efficacy.</p>\n<h2 id=\"s-therapy-after-anti-pd-1-failure\">Therapy after anti–PD-1 failure</h2>\n<p>Progression on anti–PD-1 is now the commonest advanced-melanoma problem in clinic. The choice of salvage turns on <em>BRAF</em> status, on whether the disease is injectable, and on access to cell therapy. For <em>BRAF</em>-mutant disease, switch modality.</p>\n<ul><li>Patients who received checkpoint blockade first move to a BRAF/MEK doublet.</li><li>Patients who received targeted therapy first move to checkpoint blockade.</li></ul>\n<p>For <em>BRAF</em> wild-type disease the options are re-challenge with CTLA-4 blockade, cellular therapy, or an oncolytic approach for injectable disease. SWOG S1616, a randomised phase II trial of 92 patients progressing on anti–PD-1, tested whether CTLA-4 blockade could reverse resistance: nivolumab plus ipilimumab improved progression-free survival over ipilimumab alone (6-month progression-free survival 34% vs 13%, HR 0.63) and objective response (28% vs 9%, P=0.05, with 12% complete and 16% partial responses and a median duration of response of 40.9 months), at the cost of more grade 3 or higher treatment-related events (57% vs 35%, P=0.09); it was not powered for overall survival. Adding an anti–LAG-3 antibody in this setting is far less productive: in RELATIVITY-020 Part D, a phase I/IIa study of 518 patients who had progressed on one or more anti–PD-1 regimens, nivolumab plus relatlimab produced objective response in 12% with median progression-free survival of 2.1 months after one prior anti–PD-1 regimen, and 9.2% with 3.1 months after more than one. Adoptive cell therapy has produced the highest response rates reported in this setting. <a class=\"trial-link\" href=\"/evidence/#t-rohaan-til-vs-ipilimumab\">Rohaan (TIL vs ipilimumab)</a> randomised 168 patients with unresectable stage IIIC/IV melanoma, 86% refractory to anti–PD-1, to tumour-infiltrating lymphocyte therapy after non-myeloablative lymphodepletion followed by high-dose interleukin-2, or to ipilimumab. TIL therapy improved progression-free survival (median 7.2 vs 3.1 months, HR 0.50), with objective response in 49% versus 21% and median overall survival of 25.8 versus 18.9 months (N Engl J Med 2022;387:2113-2125). <a class=\"trial-link\" href=\"/evidence/#t-c-144-01-lifileucel\">C-144-01 (lifileucel)</a> then supported registration on a single-arm basis in melanoma refractory to anti–PD-1 and, where indicated, to BRAF/MEK inhibition, with an objective response rate of 31.4% and a median duration of response of 36.5 months (J Clin Oncol 2025;43:3565-3572); lifileucel is the first FDA-approved cellular therapy for a solid tumour. The limiting factor is the regimen: cyclophosphamide and fludarabine lymphodepletion followed by high-dose interleukin-2 confines the approach to fit patients at centres with the infrastructure to deliver it. <a class=\"trial-link\" href=\"/evidence/#t-optim-t-vec\">OPTiM (T-VEC)</a> randomised unresectable stage IIIB–IV melanoma to intralesional talimogene laherparepvec or subcutaneous GM-CSF, improving durable response rate (16% vs 2%) and objective response (26% vs 6%; J Clin Oncol 2015;33:2780-2788). It was the first oncolytic immunotherapy approved for melanoma and remains useful where disease is accessible and the priority is local control. <a class=\"trial-link\" href=\"/evidence/#t-ignyte-rp1\">IGNYTE (RP1)</a> extends the oncolytic principle into the anti–PD-1-failed setting by combining a modified herpes simplex virus with nivolumab. In the registration-intended cohort of 140 patients with confirmed progression while on at least 8 weeks of anti–PD-1 as the last prior therapy, including progression on adjuvant anti–PD-1 (36 of 140 patients), intratumoural RP1 plus nivolumab produced an objective response in 33.6% by modified RECIST, the primary endpoint (95% CI 25.8 to 42.0), and 32.9% by conventional RECIST with a complete response rate of 15.0% (J Clin Oncol 2025;43:3589-3599). Responses were durable, with a median duration of 33.7 months (95% CI 14.1 to not reached) and 69.5% of responses ongoing at 1 year. Uninjected lesions regressed nearly as often as injected ones, with a 30% or greater reduction in 79.0% of 119 uninjected lesions versus 93.6% of 78 injected lesions among responders. Whole-cohort progression-free survival was 3.6 months (95% CI 2.0 to 5.0), against overall survival of 75.3% at 1 year and 63.3% at 2 years with the median not reached. Treatment-related adverse events were near-universal but mostly mild (any grade 90.0%; grade 3 or 4 12.9%), with five grade 4 events including myocarditis and splenic rupture and no treatment-related deaths. The trial is single-arm, so none of these figures is a comparison. Ablative therapy directed at oligometastatic sites remains appropriate alongside any of these systemic options, and a clinical trial is appropriate for most patients whose disease has progressed on anti–PD-1.</p>\n<h2 id=\"s-uveal-and-mucosal-melanoma\">Uveal and mucosal melanoma</h2>\n<p>Uveal melanoma has a different driver set from cutaneous melanoma and responds poorly to checkpoint blockade, and until recently nothing improved survival in the metastatic setting. <a class=\"trial-link\" href=\"/evidence/#t-imcgp100-202-tebentafusp\">IMCgp100-202 (tebentafusp)</a> tested tebentafusp, a bispecific gp100×CD3 ImmTAC, in untreated HLA-A*02:01-positive metastatic uveal melanoma. It improved overall survival over investigator&#x27;s choice of pembrolizumab, ipilimumab or dacarbazine (median 21.7 vs 16.0 months, HR 0.51; N Engl J Med 2021;385:1196-1206), despite low response rates. That dissociation between response and survival is characteristic of the agent and means radiological response should not be used to decide whether to continue it. Because the drug presents a gp100 peptide in the context of HLA-A*02:01, patients without the allele cannot receive it. In first-line HLA-A*02:01-negative metastatic uveal melanoma, <a class=\"trial-link\" href=\"/evidence/#t-optimum-02\">OptimUM-02</a> showed that darovasertib, a protein kinase C inhibitor, plus crizotinib improved progression-free survival over investigator&#x27;s choice of pembrolizumab, ipilimumab plus nivolumab, or dacarbazine (median 6.9 versus 3.1 months; HR 0.42; P&lt;0.0001), with objective response in 37.1% versus 5.8% (J Clin Oncol 2026;44(suppl 17):LBA9503). This is the first randomised trial to show benefit in the population tebentafusp cannot treat. Three qualifications apply.</p>\n<ul><li>These are the phase 2 efficacy primary results of a nested phase 2/3 trial.</li><li>Overall survival is the phase 3 primary endpoint and has not been reported.</li><li>The source is an ASCO 2026 abstract rather than a full publication.</li></ul>\n<p>Mucosal melanoma responds poorly to single-agent checkpoint blockade, and early evidence combines anti–PD-1 with VEGF-directed therapy. <a class=\"trial-link\" href=\"/evidence/#t-sheng-et-al-toripalimab-axitinib\">Sheng et al (toripalimab + axitinib)</a> enrolled 33 treatment-naive patients with metastatic mucosal melanoma in a phase Ib study. Toripalimab plus axitinib achieved an objective response rate of 48.3% among response-evaluable patients, with median progression-free survival of 7.5 months (J Clin Oncol 2019;37:2987-2999). The sample is small and uncontrolled, but the response rate is high for a subtype largely resistant to single-agent checkpoint blockade, and the combination is a reasonable option where a trial is not available. <em>KIT</em> testing is worthwhile in mucosal and acral disease, since a minority carry activating mutations amenable to KIT inhibition.</p>\n<h2 id=\"s-references\">References</h2>\n<ol class=\"refs\">\n<li id=\"ref-melanoma-melanoma-t-keynote-716\"><a class=\"trial-link\" href=\"/evidence/#t-keynote-716\">KEYNOTE-716</a>. <a href=\"https://drive.google.com/file/d/1Jj6zHgtYS8SVG83UPhoWiz8kQR69L_LM/preview\">Lancet 2022;399:1718-1729</a></li>\n<li id=\"ref-melanoma-melanoma-t-checkmate-76k\"><a class=\"trial-link\" href=\"/evidence/#t-checkmate-76k\">CheckMate 76K</a>. <a href=\"https://drive.google.com/file/d/1Y6h4i3jjUqvzFiKJf5md3sriQG2TtHfI/preview\">Nat Med 2023;29:2835-2843</a></li>\n<li id=\"ref-melanoma-melanoma-t-keynote-054-eortc-1325\"><a class=\"trial-link\" href=\"/evidence/#t-keynote-054-eortc-1325\">KEYNOTE-054 (EORTC 1325)</a>. <a href=\"https://drive.google.com/file/d/18uYdsifEAOl1P4L6lT3frr53ZALDkccZ/preview\">N Engl J Med 2018;378:1789-1801</a></li>\n<li id=\"ref-melanoma-melanoma-t-checkmate-238\"><a class=\"trial-link\" href=\"/evidence/#t-checkmate-238\">CheckMate 238</a>. <a href=\"https://drive.google.com/file/d/1Q4gmQzXiRqI-xjZFXnfGCf0LjnQhPxfu/preview\">N Engl J Med 2017;377:1824-1835</a>; <a href=\"https://drive.google.com/file/d/1jSB0Ql5PRCGjzwemtZTmgAM99GHlnocD/preview\">N Engl J Med 2026;394:333-342</a></li>\n<li id=\"ref-melanoma-melanoma-t-eortc-18071\"><a class=\"trial-link\" href=\"/evidence/#t-eortc-18071\">EORTC 18071</a>. <a href=\"https://doi.org/10.1016/S1470-2045(15)70122-1\">Lancet Oncol 2015;16:522-530</a></li>\n<li id=\"ref-melanoma-melanoma-t-combi-ad\"><a class=\"trial-link\" href=\"/evidence/#t-combi-ad\">COMBI-AD</a>. <a href=\"https://doi.org/10.1056/NEJMoa1708539\">N Engl J Med 2017;377:1813-1823</a></li>\n<li id=\"ref-melanoma-melanoma-t-keynote-942-mrna-4157-v940\"><a class=\"trial-link\" href=\"/evidence/#t-keynote-942-mrna-4157-v940\">KEYNOTE-942 (mRNA-4157/V940)</a>. <a href=\"https://doi.org/10.1016/S0140-6736(23)02268-7\">Lancet 2024;403:632-644</a></li>\n<li id=\"ref-melanoma-melanoma-t-nadina\"><a class=\"trial-link\" href=\"/evidence/#t-nadina\">NADINA</a>. <a href=\"https://drive.google.com/file/d/17guefDSLq9BwPGNny_9k4DLp-In5Q1ku/preview\">N Engl J Med 2024;391:1696-1708</a></li>\n<li id=\"ref-melanoma-melanoma-t-swog-s1801\"><a class=\"trial-link\" href=\"/evidence/#t-swog-s1801\">SWOG S1801</a>. <a href=\"https://doi.org/10.1056/NEJMoa2211437\">N Engl J Med 2023;388:813-823</a></li>\n<li id=\"ref-melanoma-melanoma-t-checkmate-067\"><a class=\"trial-link\" href=\"/evidence/#t-checkmate-067\">CheckMate 067</a>. <a href=\"https://drive.google.com/file/d/1nBOvPUqYlAiwwqvsJUM1cL5uCZxeJOmA/preview\">N Engl J Med 2015;373:23-34</a>; <a href=\"https://drive.google.com/file/d/1p716vQ1p7Lbwwf8g7Y0YhJNPAhAqeHEu/preview\">N Engl J Med 2017;377:1345-1356</a></li>\n<li id=\"ref-melanoma-melanoma-t-relativity-047\"><a class=\"trial-link\" href=\"/evidence/#t-relativity-047\">RELATIVITY-047</a>. <a href=\"https://doi.org/10.1056/NEJMoa2109970\">N Engl J Med 2022;386:24-34</a></li>\n<li id=\"ref-melanoma-melanoma-t-mdx010-20-ipilimumab\"><a class=\"trial-link\" href=\"/evidence/#t-mdx010-20-ipilimumab\">MDX010-20 (ipilimumab)</a>. <a href=\"https://doi.org/10.1056/NEJMoa1003466\">N Engl J Med 2010;363:711-723</a></li>\n<li id=\"ref-melanoma-melanoma-t-keynote-006\"><a class=\"trial-link\" href=\"/evidence/#t-keynote-006\">KEYNOTE-006</a>. <a href=\"https://doi.org/10.1056/NEJMoa1503093\">N Engl J Med 2015;372:2521-2532</a></li>\n<li id=\"ref-melanoma-melanoma-t-dreamseq-ea6134\"><a class=\"trial-link\" href=\"/evidence/#t-dreamseq-ea6134\">DREAMseq (EA6134)</a>. <a href=\"https://drive.google.com/file/d/12z2LJCe7SJgBYOlXWyml5fjYSOsLlhXR/preview\">J Clin Oncol 2023;41:186-197</a></li>\n<li id=\"ref-melanoma-melanoma-t-secombit-ascierto\"><a class=\"trial-link\" href=\"/evidence/#t-secombit-ascierto\">SECOMBIT (Ascierto)</a>. <a href=\"https://drive.google.com/file/d/1mVe-RpBIlotvRE3PruFhaf8nL8DQNO8y/preview\">J Clin Oncol 2023;41:212-221</a></li>\n<li id=\"ref-melanoma-melanoma-t-ebin-robert\"><a class=\"trial-link\" href=\"/evidence/#t-ebin-robert\">EBIN (Robert)</a>. <a href=\"https://drive.google.com/file/d/184vlWEGsg4xKNXX4Vbr34WkcesdPLkBU/preview\">Lancet Oncol 2025;26:781-794</a></li>\n<li id=\"ref-melanoma-melanoma-t-brim-3\"><a class=\"trial-link\" href=\"/evidence/#t-brim-3\">BRIM-3</a>. <a href=\"https://doi.org/10.1056/NEJMoa1103782\">N Engl J Med 2011;364:2507-2516</a></li>\n<li id=\"ref-melanoma-melanoma-t-cobrim\"><a class=\"trial-link\" href=\"/evidence/#t-cobrim\">coBRIM</a>. <a href=\"https://doi.org/10.1056/NEJMoa1408868\">N Engl J Med 2014;371:1867-1876</a></li>\n<li id=\"ref-melanoma-melanoma-t-combi-v\"><a class=\"trial-link\" href=\"/evidence/#t-combi-v\">COMBI-v</a>. <a href=\"https://doi.org/10.105
