follows TME principles for a resectable mid or low rectal cancer. Tumour height, sphincter or levator involvement, expected circumferential margin and baseline function determine whether a low anterior/coloanal resection is oncologically and functionally appropriate or an abdominoperineal resection is required<sup class=\"trial-ref\"><a href=\"#ref-colorectal-early-rectal-cancer-ext-a6fa17232fb4\" aria-label=\"Reference 8: ASCRS rectal guideline\">8</a></sup>.</p>\n<p>Modern TME and multimodality treatment reduced pelvic recurrence into the 5–10% range in many series, but TME&#x27;s independent survival contribution cannot be isolated from staging and perioperative treatment. Neoadjuvant therapy may facilitate sphincter preservation in selected low tumours; it does not guarantee a functional sphincter-saving operation.</p>\n<h3 id=\"s-use-current-practice-anchors\">Use current practice anchors</h3>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\">cT1–2 N0: after shared decision-making, options include transanal excision such as TAMIS/TEMS, endoscopic submucosal dissection or radical TME.</span><span class=\"evidence-detail\">Do not add preoperative radiotherapy outside a trial.</span></li><li class=\"evidence-prose\">cT1–2 node-positive or cT3–4: offer preoperative radiotherapy or chemoradiotherapy, then definitive surgery when the disease is resectable.</li><li class=\"evidence-prose\"><span class=\"evidence-lead\">Low rectal or MRI high-risk disease: favour TNT.</span><span class=\"evidence-detail\">Long-course chemoradiation with chemotherapy before or after is the stronger high-risk recommendation; short-course radiotherapy followed by chemotherapy is conditional.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">TNT systemic component: use 3–4 months of FOLFOX or CAPOX before or after chemoradiation, or after short-course radiotherapy.</span><span class=\"evidence-detail\">Three months of induction mFOLFIRINOX is an option for carefully selected fit patients.</span></li><li class=\"evidence-prose\">Selected middle/upper cT3 N0–N1 disease with clear radial margins and a planned sphincter-saving resection may use response-directed chemotherapy with selective chemoradiation, as tested in PROSPECT.</li><li class=\"evidence-prose\">When nonoperative management is a priority, favour chemoradiation followed by consolidation chemotherapy and require a concordant clinical complete response plus intensive salvage-capable surveillance.</li></ul>\n<p>A current clinical complete response requires no palpable or visible residual tumour on digital examination and rectoscopy, and no observable residual tumour on MRI apart from fibrosis or treatment-related wall thickening, with no suspicious nodes. Discuss uncertainty, regrowth, salvage surgery and the surveillance burden before choosing nonoperative management.</p>\n<p>The current general radiotherapy schedules are long-course 50–50.4 Gy in 25–28 fractions with concurrent capecitabine or infusional 5-FU, or short-course 25 Gy in five fractions without concurrent chemotherapy. Selection is risk- and objective-dependent<sup class=\"trial-ref\"><a href=\"#ref-colorectal-early-rectal-cancer-ext-1c726977e900\" aria-label=\"Reference 9: ASTRO focused update 2025\">9</a></sup>.</p>\n<p>If long-course chemoradiation is followed directly by resection, a 6–11-week interval remains reasonable. The optimal interval after TNT with consolidation chemotherapy is not established; follow the selected regimen and restaging pathway rather than importing a single clock from older chemoradiation trials.</p>\n<p>These anchors reflect current NICE NG151 recommendations<sup class=\"trial-ref\"><a href=\"#ref-colorectal-early-rectal-cancer-ext-98b59a94e1d7\" aria-label=\"Reference 10: NICE NG151 recommendations\">10</a></sup>, including no preoperative radiotherapy for cT1–2 N0 disease outside a trial and surgery after the selected neoadjuvant pathway for resectable cT1–2 N-positive or cT3–4 disease.</p>\n<p>After adequate R0 radical resection of pT1–2 N0 disease, routine adjuvant chemotherapy or pelvic radiotherapy is not indicated. Adequate local excision is definitive without routine adjuvant therapy only for carefully selected low-risk cT1 N0 disease; reported local recurrence is 7–21%, and adverse pathology or an involved/uncertain margin generally prompts radical resection.</p>\n<p>Pelvic recurrence is highly morbid and may require multivisceral salvage or pelvic exenteration. Refer potentially curable recurrence early to a specialist pelvic multidisciplinary team; historical local-failure percentages are not current counselling estimates.</p>\n<h2 id=\"s-use-postoperative-chemotherapy-selectively\">Use postoperative chemotherapy selectively</h2>\n<h3 id=\"s-understand-the-historical-postoperative-evidence\">Understand the historical postoperative evidence</h3>\n<p>Older trials predated modern MRI, TME and TNT. They explain why postoperative pelvic treatment became standard but should not displace the current preoperative pathway.</p>\n<ul><li class=\"evidence-prose\">A 2001 individual-patient meta-analysis of 22 radiotherapy trials found the yearly local-recurrence risk 37% lower with postoperative radiotherapy than surgery alone; overall survival was only marginally different<sup class=\"trial-ref\"><a href=\"#ref-colorectal-early-rectal-cancer-ext-19ad41c7be48\" aria-label=\"Reference 11: Colorectal Cancer Collaborative Group\">11</a></sup>.</li><li class=\"evidence-prose\">The 1985 GITSG four-arm trial found the lowest recurrence and longer DFS with postoperative chemoradiation versus observation, at the cost of greater toxicity; it did not establish an OS difference<sup class=\"trial-ref\"><a href=\"#ref-colorectal-early-rectal-cancer-ext-0be97d66b7ec\" aria-label=\"Reference 12: GITSG\">12</a></sup>.</li><li class=\"evidence-prose\"><span class=\"evidence-lead\">NSABP R-01 randomised 555 Dukes B/C cancers.</span><span class=\"evidence-detail\">MOF chemotherapy improved DFS and survival versus surgery, mainly in men; postoperative radiotherapy reduced locoregional recurrence from 25% to 16% but not DFS or OS<sup class=\"trial-ref\"><a href=\"#ref-colorectal-early-rectal-cancer-ext-727499cd160d\" aria-label=\"Reference 13: Fisher et al.\">13</a></sup>.</span></li><li class=\"evidence-prose\">A 2012 Cochrane review of older fluoropyrimidine trials estimated lower relapse (HR 0.75, 95% CI 0.68–0.83) and death (HR 0.83, 0.76–0.91) with postoperative chemotherapy, but could not resolve modern stage-specific use after neoadjuvant treatment<sup class=\"trial-ref\"><a href=\"#ref-colorectal-early-rectal-cancer-ext-1873c357b111\" aria-label=\"Reference 14: Petersen et al.\">14</a></sup>.</li></ul>\n<p>Historical pooled analyses placed local failure below 10% for T1–2 N0, around 15–35% for T3 N0, and 45–65% for T3–4 node-positive disease. These are pre-modern risk estimates, not counselling figures for a patient treated with MRI selection, TME and contemporary neoadjuvant therapy<sup class=\"trial-ref\"><a href=\"#ref-colorectal-early-rectal-cancer-ext-1f05f49f175f\" aria-label=\"Reference 15: Gunderson et al.\">15</a></sup>.</p>\n<h3 id=\"s-use-a-fluoropyrimidine-if-postoperative-chemoradiation-is-required\">Use a fluoropyrimidine if postoperative chemoradiation is required</h3>\n<p>The 401-patient REKTUM-III phase 3 trial included postoperative and preoperative cohorts. Capecitabine-based chemoradiation met 5-year OS non-inferiority to fluorouracil (76% vs 67%; non-inferiority P=0.0004); 3-year DFS was 75% versus 67% (P=0.07). Hand-foot syndrome was more frequent with capecitabine and leucopenia with fluorouracil<sup class=\"trial-ref\"><a href=\"#ref-colorectal-early-rectal-cancer-ext-87ec4652bfa0\" aria-label=\"Reference 16: Hofheinz et al.\">16</a></sup>.</p>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\">Historical postoperative sequence: two capecitabine cycles at 2,500 mg/m²/day on days 1–14 every 3 weeks, then 50.4 Gy with capecitabine 1,650 mg/m²/day on days 1–38, then three capecitabine cycles.</span><span class=\"evidence-detail\">The fluorouracil arm used two 5-day bolus cycles, then 50.4 Gy with continuous infusion at 225 mg/m²/day, then two further bolus cycles.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">Amended preoperative sequence: 50.4 Gy with capecitabine 1,650 mg/m²/day, surgery, then five 14-day cycles at 2,500 mg/m²/day.</span><span class=\"evidence-detail\">The fluorouracil arm used 1,000 mg/m²/day on days 1–5 and 29–33 with radiotherapy, surgery, then four 5-day bolus cycles at 500 mg/m²/day. These are the regimens tested, not the current preferred sequence.</span></li></ul>\n<p>Do not routinely add oxaliplatin concurrently to postoperative capecitabine-radiotherapy. In a 589-patient Chinese phase 3 trial, 5-year DFS was 72.0% versus 71.1% (HR 1.07, 95% CI 0.79–1.44), with more grade 3/4 acute toxicity (38.6% vs 28.6%)<sup class=\"trial-ref\"><a href=\"#ref-colorectal-early-rectal-cancer-ext-d87d1b2603c6\" aria-label=\"Reference 17: Li et al.\">17</a></sup>.</p>\n<h3 id=\"s-select-folfox-after-preoperative-chemoradiation\">Select FOLFOX after preoperative chemoradiation</h3>\n<p>ADORE reported its long-term analysis in 2019 and tested postoperative oxaliplatin after fluoropyrimidine chemoradiation and total mesorectal excision (TME):<sup class=\"trial-ref\"><a href=\"#ref-colorectal-early-rectal-cancer-t-adore-hong\" aria-label=\"Reference 18: ADORE (Hong)\">18</a></sup></p>\n<ul><li class=\"evidence-prose\">Population: 321 patients with ypStage II–III disease after fluoropyrimidine-only preoperative chemoradiation, R0 TME and performance status 0–1.</li><li class=\"evidence-prose\">Control: fluorouracil 380 mg/m² plus leucovorin 20 mg/m² on days 1–5 every 4 weeks for four cycles.</li><li class=\"evidence-prose\">Experimental regimen: FOLFOX every 2 weeks for eight cycles.</li><li class=\"evidence-prose\">Protected result: 3-year disease-free survival was 71.6% with FOLFOX and 62.9% with fluorouracil/leucovorin.</li><li class=\"evidence-prose\">Long-term result: in the post-hoc analysis, 6-year disease-free survival was 68.2% versus 56.8% (stratified HR 0.63, 95% CI 0.43–0.93; nominal P=0.018).</li><li class=\"evidence-prose\">Overall survival: 6-year overall survival was 78.1% versus 76.4% (HR 0.73, 95% CI 0.45–1.19; nominal P=0.21), without a confirmed benefit.</li><li class=\"evidence-prose\">Limit: signals in node-positive, stage III and pN2 disease were post-hoc subgroup findings and do not replace the primary analysis.</li><li class=\"evidence-prose\"><span class=\"evidence-lead\">Older subgroup: in 55 patients aged 65 years or older, the post-hoc disease-free-survival estimate was HR 0.60 (95% CI 0.21–1.67), with age-interaction P=0.90.</span><span class=\"evidence-detail\">The wide interval does not establish absence of benefit; the overall-survival subgroup was likewise inconclusive.</span></li></ul>\n<h2 id=\"s-prefer-preoperative-when-pelvic-chemoradiation-is-required\">Prefer preoperative when pelvic chemoradiation is required</h2>\n<h3 id=\"s-establish-the-preoperative-approach\">Establish the preoperative approach</h3>\n<p>The German Rectal trial reported in 2004 and randomised preoperative against postoperative fluorouracil chemoradiation:<sup class=\"trial-ref\"><a href=\"#ref-colorectal-early-rectal-cancer-t-german-rectal-cao-aro-aio-94\" aria-label=\"Reference 19: German Rectal (CAO/ARO/AIO-94)\">19</a></sup></p>\n<ul><li class=\"evidence-prose\">Population: 823 patients with ultrasound- and CT-staged, resectable cT3/cT4 or node-positive rectal cancer.</li><li class=\"evidence-prose\">Regimen: fluorouracil chemoradiation before or after TME; both groups received four postoperative cycles of single-agent fluorouracil.</li><li class=\"evidence-prose\"><span class=\"evidence-lead\">Local control: 5-year local recurrence was 6% after preoperative treatment and 13% after postoperative treatment.</span><span class=\"evidence-detail\">Pelvic relapse at 10 years was 7% versus 10% (P=0.048).</span></li><li class=\"evidence-prose\">Survival: 5-year disease-free survival was 68% versus 65% (nominal P=0.32), and 5-year overall survival was 76% versus 74% (primary-endpoint P=0.80).</li><li class=\"evidence-prose\">Protocol-radiotherapy toxicity: grade 3–4 acute toxicity was 27% versus 40%, and long-term toxicity 14% versus 24%.</li><li class=\"evidence-prose\">All-patient sensitivity analysis: acute toxicity was 25% versus 24%, and long-term toxicity 14% versus 15%.</li><li class=\"evidence-prose\">Late effect: anastomotic stricture was 4% versus 12% (P=0.003).</li><li class=\"evidence-prose\">Sphincter preservation: among 194 patients judged before randomisation to require abdominoperineal resection, 45/116 (39%) after preoperative treatment and 15/78 (19%) after postoperative treatment received sphincter-preserving surgery.</li><li class=\"evidence-prose\"><span class=\"evidence-lead\">Limit: the sphincter result was an actual-treatment-given subgroup without an interaction test.</span><span class=\"evidence-detail\">Local recurrence and sphincter preservation were secondary comparisons without multiplicity adjustment; the overall-survival primary endpoint was not met.</span></li><li class=\"evidence-prose\">Staging limit: clinical staging reflected the methods of its time, and 18% of the postoperative group had pathological stage I disease after resection.</li></ul>\n<p>A smaller single-institution Korean phase 3 trial used capecitabine chemoradiation in 240 cT3, potentially resectable cT4 or node-positive cancers. Preoperative treatment did not improve local control or survival, but increased sphincter preservation among low tumours to 68% from 42% (P=.008); the low-tumour distribution was imbalanced<sup class=\"trial-ref\"><a href=\"#ref-colorectal-early-rectal-cancer-ext-ace697f4bf8f\" aria-label=\"Reference 20: Park et al.\">20</a></sup>.</p>\n<h3 id=\"s-match-short-or-long-course-treatment-to-the-objective\">Match short- or long-course treatment to the objective</h3>\n<p>The historical Swedish and Dutch programmes established that preoperative short-course radiotherapy can reduce local recurrence versus surgery alone. The 2001 individual-patient overview estimated a 46% proportional reduction in yearly local recurrence with preoperative radiotherapy, while also showing increased early non-cancer mortality in older-era delivery; contemporary selection and technique matter.</p>\n<p>The Polish trial reported its long-term comparison in 2006:<sup class=\"trial-ref\"><a href=\"#ref-colorectal-early-rectal-cancer-t-polish-colorectal-bujko\" aria-label=\"Reference 21: Polish Colorectal (Bujko)\">21</a></sup></p>\n<ul><li>Population: 316 patients with resectable cT3/cT4 rectal cancer, no sphincter involvement and a lower tumour margin accessible on digital examination.</li><li>Regimen: 25 Gy in five fractions followed by TME within 7 days, or fluorouracil chemoradiation to 50.4 Gy followed by TME after 4–6 weeks.</li><li>Response: complete response was 0.7% versus 16.1%, and involved circumferential margins 12.9% versus 4.4%, favouring long-course chemoradiation.</li><li>Primary result: sphincter preservation was 61.2% versus 58.0%; the trial did not show an advantage for long-course treatment.</li><li>Other outcomes: permanent stoma, local recurrence, disease-free survival and overall survival did not significantly differ.</li><li>Toxicity: severe acute toxicity was 3.2% versus 18.2%.</li><li>Limit: pathological response did not translate into better sphincter preservation or disease control.</li></ul>\n<p>The Australasian comparison reported in 2012:<sup class=\"trial-ref\"><a href=\"#ref-colorectal-early-rectal-cancer-t-trog-01-04-ngan\" aria-label=\"Reference 22: TROG 01.04 (Ngan)\">22</a></sup></p>\n<ul><li>Population: 326 ultrasound/MRI-staged cT3 rectal cancers.</li><li>Regimen: short-course radiotherapy, surgery and adjuvant chemotherapy, or long-course fluorouracil chemoradiation, surgery and adjuvant chemotherapy.</li><li>Primary result: 3-year local recurrence was 7.5% versus 4.4% (P=0.24).</li><li>Other outcomes: distant recurrence, 5-year overall survival (74% versus 70%) and late toxicity did not significantly differ.</li><li>Response: pathological complete response was 1% versus 15%, favouring long-course treatment.</li><li>Limit: this was a null superiority trial, not evidence of equivalence.</li></ul>\n<h3 id=\"s-report-treatment-response-with-the-current-pathology-scale\">Report treatment response with the current pathology scale</h3>\n<p>The current CAP Modified Ryan tumour-regression score is:</p>\n<ul><li>0: complete response, with no viable cancer cells.</li><li>1: near-complete response, with single cells or rare small groups.</li><li>2: partial response, with residual cancer and evident regression.</li><li>3: poor or no response, with extensive residual cancer and no evident regression.</li></ul>\n<p>The inherited 0–4 scale, in which 0 meant no regression and 4 meant complete response, is obsolete and directionally incompatible with the current protocol<sup class=\"trial-ref\"><a href=\"#ref-colorectal-early-rectal-cancer-ext-d6e54f6cd4ee\" aria-label=\"Reference 23: CAP Colon and Rectum Resection protocol\">23</a></sup>.</p>\n<h3 id=\"s-do-not-routinely-add-concurrent-oxaliplatin\">Do not routinely add concurrent oxaliplatin</h3>\n<ul><li class=\"evidence-prose\">In one trial, pathological complete response was 16% in both groups; grade 3–4 toxicity rose from 8% to 24% with oxaliplatin.<sup class=\"trial-ref\"><a href=\"#ref-colorectal-early-rectal-cancer-t-star-01-aschele\" aria-label=\"Reference 24: STAR-01 (Aschele)\">24</a></sup></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">In a second comparison, the intensified Capox50 regimen did not significantly increase pathological complete response (19.2% versus 13.9%; P=0.09) and added toxicity.</span><span class=\"evidence-detail\">Follow-up was short, and local-control and survival outcomes were not reported.<sup class=\"trial-ref\"><a href=\"#ref-colorectal-early-rectal-cancer-t-accord-12-0405-g-rard\" aria-label=\"Reference 25: ACCORD 12/0405 (Gérard)\">25</a></sup></span></li><li class=\"evidence-prose\">In the fluoropyrimidine comparison, capecitabine met the trial&#x27;s equivalence rule against continuous-infusion fluorouracil as radiosensitiser; 3-year locoregional failure was 11.8% versus 11.2%.<sup class=\"trial-ref\"><a href=\"#ref-colorectal-early-rectal-cancer-t-nsabp-r-04-allegra\" aria-label=\"Reference 26: NSABP R-04 (Allegra)\">26</a></sup></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">NSABP R-04 oxaliplatin analysis: among 1,315 patients randomised after the amendment, oxaliplatin did not improve locoregional control, disease-free survival or overall survival.</span><span class=\"evidence-detail\">Worst grade 3–5 toxicity rose from about 27% to 41%, grade 3–5 diarrhoea from 6.9% to 16.5%, and fewer than 70% completed planned oxaliplatin.<sup class=\"trial-ref\"><a href=\"#ref-colorectal-early-rectal-cancer-t-nsabp-r-04-allegra\" aria-label=\"Reference 26: NSABP R-04 (Allegra)\">26</a></sup></span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">NSABP R-04 safety signal: on-treatment or within-45-day deaths numbered 10 with capecitabine and 3 with fluorouracil across both protocol periods (nominal P=0.091), despite identical overall survival.</span><span class=\"evidence-detail\">This does not establish a fluoropyrimidine survival difference.<sup class=\"trial-ref\"><a href=\"#ref-colorectal-early-rectal-cancer-t-nsabp-r-04-allegra\" aria-label=\"Reference 26: NSABP R-04 (Allegra)\">26</a></sup></span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">In the German oxaliplatin trial, 3-year disease-free survival was 75.9% versus 71.2% (HR 0.79; P=0.03) when oxaliplatin was incorporated into both chemoradiation and postoperative chemotherapy.</span><span class=\"evidence-detail\">The design cannot isolate a benefit from concurrent oxaliplatin alone.<sup class=\"trial-ref\"><a href=\"#ref-colorectal-early-rectal-cancer-t-cao-aro-aio-04-r-del\" aria-label=\"Reference 27: CAO/ARO/AIO-04 (Rödel)\">27</a></sup></span></li></ul>\n<h2 id=\"s-use-total-neoadjuvant-therapy-for-selected-disease\">Use total neoadjuvant therapy for selected disease</h2>\n<h3 id=\"s-use-induction-mfolfirinox-for-a-fit-locally-advanced-population\">Use induction mFOLFIRINOX for a fit, locally advanced population</h3>\n<p>The mFOLFIRINOX trial tested induction treatment:<sup class=\"trial-ref\"><a href=\"#ref-colorectal-early-rectal-cancer-t-prodige-23-conroy\" aria-label=\"Reference 2: PRODIGE 23 (Conroy)\">2</a></sup></p>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\">Population: 461 patients with cT3 disease judged by a multidisciplinary team to warrant preoperative chemoradiation or cT4 M0 disease; performance status 0–1 and age under 76 years.</span><span class=\"evidence-detail\">Baseline stage was 81% cT3 and 18% cT4; nodal categories were N0 10%, N1 64% and N2 26%.</span></li><li class=\"evidence-prose\">Experimental regimen: mFOLFIRINOX every 2 weeks for six cycles, long-course chemoradiation with capecitabine 800 mg/m², TME, then 3 months of FOLFOX6 or capecitabine.</li><li class=\"evidence-prose\">Control: long-course chemoradiation, TME and 6 months of adjuvant chemotherapy.</li><li class=\"evidence-prose\">Protected result: 3-year disease-free survival was 75.7% versus 68.5%.</li><li class=\"evidence-prose\">Response: pathological complete response was 59/212 (27.8%) versus 26/215 (12.1%) among operated patients with evaluable pathology (reported as 28% versus 12%; P&lt;0.0001).</li><li class=\"evidence-prose\">Long-term result: 7-year disease-free survival was 67.6% versus 62.5%, and 7-year overall survival 81.9% versus 76.1%.</li><li class=\"evidence-prose\"><span class=\"evidence-lead\">Limit: the long-term comparisons were nominal.</span><span class=\"evidence-detail\">Their P values, P=0.048 for disease-free survival and P=0.033 for overall survival, tested restricted-mean-survival-time differences rather than the displayed landmark rates.</span></li><li class=\"evidence-prose\">Distant control: 7-year metastasis-free survival was 79.2% versus 72.3%.</li></ul>\n<h3 id=\"s-use-short-course-tnt-with-attention-to-local-control\">Use short-course TNT with attention to local control</h3>\n<p>RAPIDO tested short-course radiotherapy followed by chemotherapy:<sup class=\"trial-ref\"><a href=\"#ref-colorectal-early-rectal-cancer-t-rapido-bahadoer\" aria-label=\"Reference 1: RAPIDO (Bahadoer)\">1</a></sup></p>\n<ul><li class=\"evidence-prose\">Population: 920 patients with at least one MRI high-risk feature, including cT4 disease, cN2 disease, extramural vascular invasion, enlarged lateral nodes or mesorectal-fascia involvement.</li><li class=\"evidence-prose\">Experimental regimen: 5 × 5 Gy, then six 3-weekly CAPOX or nine 2-weekly FOLFOX cycles, approximately 4.5 months of neoadjuvant chemotherapy before TME, with no planned adjuvant chemotherapy.</li><li class=\"evidence-prose\">Control: long-course chemoradiation, TME and discretionary adjuvant chemotherapy, received by about half.</li><li class=\"evidence-prose\">Primary endpoint: disease-related treatment failure, defined as the first locoregional failure, distant metastasis, new colorectal primary or treatment-related death.</li><li class=\"evidence-prose\">Protected result: 3-year disease-related treatment failure was 23.7% versus 30.4% (HR 0.75; P=0.019); at 5 years it was 27.8% versus 34.0%.</li><li class=\"evidence-prose\">Response: pathological complete response was 120/423 (28%) versus 57/398 (14%) among resected patients (P&lt;0.001).</li><li class=\"evidence-prose\">Distant control: distant metastasis at 5 years was 23.0% versus 30.4%.</li><li class=\"evidence-prose\">Randomised local-failure analysis: 5-year locoregional failure was 11.7% versus 8.1% (nominal P=0.07) in the eligible randomised population.</li><li class=\"evidence-prose\"><span class=\"evidence-lead\">Conditioned analysis: locoregional recurrence was 10.2% versus 6.1% (nominal P=0.027) among patients conditioned on R0/R1 resection, with two nonoperated standard-care progressors included.</span><span class=\"evidence-detail\">This is not a clean randomised comparison.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">Survival and limit: 5-year overall survival was 81.7% versus 80.2% at 5.6 years&#x27; median follow-up against a 10-year protocol.</span><span class=\"evidence-detail\">The schedule requires refinement for local control.</span></li></ul>\n<h3 id=\"s-use-the-three-year-stellar-non-inferiority-result-at-its-tested-scope\">Use the three-year STELLAR non-inferiority result at its tested scope</h3>\n<p>STELLAR compared short-course TNT with long-course chemoradiation:<sup class=\"trial-ref\"><a href=\"#ref-colorectal-early-rectal-cancer-t-stellar-jin\" aria-label=\"Reference 3: STELLAR (Jin)\">3</a></sup></p>\n<ul><li class=\"evidence-prose\">Population: 599 patients with distal or middle cT3–cT4 or node-positive rectal cancer.</li><li class=\"evidence-prose\">Experimental regimen: short-course radiotherapy, four 3-weekly CAPOX cycles, TME, then two CAPOX cycles.</li><li class=\"evidence-prose\">Control: long-course capecitabine chemoradiation, TME, then six 3-weekly CAPOX cycles.</li><li class=\"evidence-prose\">Three-year result: disease-free survival met the prespecified non-inferiority criterion (64.5% versus 62.3%; HR 0.883; one-sided 95% CI upper bound 1.11, below the 1.43 margin; P&lt;0.001 for non-inferiority).</li><li class=\"evidence-prose\"><span class=\"evidence-lead\">Secondary outcomes: metastasis-free survival was 77.1% versus 75.3% (HR 0.88, 95% CI 0.63–1.24; nominal P=0.475).</span><span class=\"evidence-detail\">Locoregional recurrence was 8.4% versus 11.0% (HR 0.80, 95% CI 0.45–1.44; nominal P=0.461).</span></li><li class=\"evidence-prose\">Five-year result: disease-free survival was 62.0% versus 58.7%, and overall survival 78.1% versus 69.7%.</li><li class=\"evidence-prose\"><span class=\"evidence-lead\">Limit: the 5-year overall-survival comparison was nominal and unadjusted.</span><span class=\"evidence-detail\">The update did not restate or retest the non-inferiority margin, so the 3-year conclusion cannot be carried forward to 5 years. Post-hoc subgroup interactions do not establish risk-specific effects.</span></li></ul>\n<h3 id=\"s-prefer-consolidation-sequencing-when-organ-preservation-is-the-objective\">Prefer consolidation sequencing when organ preservation is the objective</h3>\n<p>The sequence trial compared TNT strategies:<sup class=\"trial-ref\"><a href=\"#ref-colorectal-early-rectal-cancer-t-cao-aro-aio-12-fokas\" aria-label=\"Reference 28: CAO/ARO/AIO-12 (Fokas)\">28</a></sup></p>\n<ul><li class=\"evidence-prose\">Population: 311 patients with cT3/cT4 or node-positive rectal cancer.</li><li class=\"evidence-prose\">Regimen: induction FOLFOX followed by chemoradiation, or chemoradiation followed by consolidation FOLFOX.</li><li class=\"evidence-prose\">Design: a pick-the-winner phase II design against a 15% historical pathological-complete-response rate.</li><li class=\"evidence-prose\">Result: only the consolidation sequence met its prespecified hypothesis; pathological complete response was 25% versus 17%.</li><li class=\"evidence-prose\"><span class=\"evidence-lead\">Limit: the exploratory direct comparison was not conclusive (OR 1.69, 95% CI 0.96–2.99; P=0.071).</span><span class=\"evidence-detail\">Chemoradiation completion was better with consolidation sequencing, whereas systemic-chemotherapy completion was better with induction sequencing.</span></li></ul>\n<h3 id=\"s-keep-polish-ii-as-historical-high-risk-tnt-evidence\">Keep Polish II as historical high-risk TNT evidence</h3>\n<p>Polish II<sup class=\"trial-ref\"><a href=\"#ref-colorectal-early-rectal-cancer-ext-49092cd807ba\" aria-label=\"Reference 29: Polish II\">29</a></sup> randomised 515 eligible patients with cT4 or fixed cT3 disease to 25 Gy in five fractions plus three FOLFOX4 cycles or 50.4 Gy chemoradiation containing bolus fluorouracil, leucovorin and oxaliplatin.</p>\n<ul><li>At 8 years, OS was 49% in both groups; DFS was 43% versus 41% (HR 0.95, 95% CI 0.75–1.19).</li><li>Local failure, distant metastasis and grade 3 or worse late complications did not significantly differ.</li><li>The early OS difference disappeared, and superiority was not demonstrated. The oxaliplatin-containing control chemoradiation limits generalisability.</li></ul>\n<h2 id=\"s-omit-pelvic-radiation-only-in-a-selected-population\">Omit pelvic radiation only in a selected population</h2>\n<h3 id=\"s-use-response-directed-mfolfox-within-prospect-eligibility\">Use response-directed mFOLFOX within PROSPECT eligibility</h3>\n<p>PROSPECT was a 2023 randomised phase II/III non-inferiority trial:<sup class=\"trial-ref\"><a href=\"#ref-colorectal-early-rectal-cancer-t-prospect-alliance-n1048\" aria-label=\"Reference 4: PROSPECT (Alliance N1048)\">4</a></sup></p>\n<ul><li class=\"evidence-prose\">Population: previously untreated cT2 node-positive or cT3 rectal adenocarcinoma judged by the patient&#x27;s surgeon suitable for sphincter-sparing surgery.</li><li class=\"evidence-prose\">Exclusions: T4 disease, four or more pelvic nodes with short axis above 10 mm, and tumour within 3 mm of the radial margin.</li><li class=\"evidence-prose\"><span class=\"evidence-lead\">Low tumours: there was no numeric tumour-height exclusion.</span><span class=\"evidence-detail\">The surgeon-intent criterion filtered out low-lying tumours considered at high risk for incomplete resection, but 173/1,128 treated patients had tumours within 5 cm of the anal verge.</span></li><li class=\"evidence-prose\">Experimental regimen: six preoperative mFOLFOX6 cycles every 2 weeks, then TME after at least 20% tumour shrinkage.</li><li class=\"evidence-prose\">Chemoradiation triggers: less than 20% shrinkage (38/585), fewer than six FOLFOX cycles (8/585), or clinician/patient choice after randomisation (7/585).</li><li class=\"evidence-prose\">Radiation omission: 53/585 (9.1%) received preoperative chemoradiation; 90.9% avoided it before surgery.</li><li class=\"evidence-prose\">Control: chemoradiation to 50.4 Gy with a concurrent fluoropyrimidine, then TME.</li><li class=\"evidence-prose\">Postoperative treatment: six FOLFOX cycles after the experimental strategy and eight after control chemoradiation were recommended but not mandatory.</li><li class=\"evidence-prose\"><span class=\"evidence-lead\">Primary result: in the 1,128-patient per-protocol population, 5-year disease-free survival was 80.8% versus 78.6% (HR 0.92; two-sided 90.2% CI 0.74–1.14), meeting non-inferiority against the 1.29 margin.</span><span class=\"evidence-detail\">The all-1,194-randomised supplemental analysis was concordant.</span></li><li class=\"evidence-prose\">R0 resection: 90.4% versus 91.2% on the 585/543 per-protocol denominators; among 535/510 operated patients, R0 resection was 98.9% versus 97.1%.</li><li class=\"evidence-prose\">Pathological response: among operated patients, pathological complete response was 21.9% versus 24.3%.</li><li class=\"evidence-prose\">Local control: 5-year local recurrence was 1.8% versus 1.6% in the per-protocol population, an unadjusted secondary comparison.</li><li class=\"evidence-prose\">Overall survival: 5-year overall survival was 89.5% versus 90.2%; the trial was not designed for a definitive survival effect.</li><li class=\"evidence-prose\">Toxicity: chemotherapy caused more neuropathy and chemoradiation more diarrhoea.</li><li class=\"evidence-prose\">Limit: do not extrapolate to low tumours unsuitable for sphincter-sparing surgery or to the excluded high-risk groups.</li></ul>\n<h3 id=\"s-do-not-generalise-chemotherapy-only-evidence\">Do not generalise chemotherapy-only evidence</h3>\n<p>CONVERT<sup class=\"trial-ref\"><a href=\"#ref-colorectal-early-rectal-cancer-ext-e55fc9061ee3\" aria-label=\"Reference 30: CONVERT\">30</a></sup> randomised 663 patients with locally advanced tumours within 12 cm of the anal verge and uninvolved mesorectal fascia; 589 received four CAPOX cycles or capecitabine chemoradiation.</p>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\">Design and rescue: 300 received at least one CAPOX dose and 289 received chemoradiation.</span><span class=\"evidence-detail\">Local progression during CAPOX triggered chemoradiation before surgery; four patients used this rescue pathway. Two and five patients achieved a clinical complete response and used watch-and-wait.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">Operated population: 272 and 261 patients underwent TME.</span><span class=\"evidence-detail\">Pathological complete response was 30/272 (11.0%) versus 36/261 (13.8%), ypStage 0–1 downstaging 40.8% versus 45.6%, and R0 resection 99.6% in each group. These response/resection cells do not establish non-inferiority.</span></li><li class=\"evidence-prose\">Three-year locoregional-recurrence-free survival was 96.3% with CAPOX and 97.4% with chemoradiation (HR 1.40, 95% CI 0.53–3.68).</li><li class=\"evidence-prose\">Three-year DFS was 89.2% versus 87.9%, and OS 95.0% versus 94.1%.</li><li class=\"evidence-prose\"><span class=\"evidence-lead\">Non-inferiority was not confirmed.</span><span class=\"evidence-detail\">Acute haematological toxicity and lower grade 2–4 long-term adverse events are different endpoints; the latter favoured CAPOX. Chemotherapy alone remains a selected-patient option, not a universal substitute.</span></li></ul>\n<p>FOWARC<sup class=\"trial-ref\"><a href=\"#ref-colorectal-early-rectal-cancer-ext-ece1fc868b75\" aria-label=\"Reference 31: FOWARC\">31</a></sup> randomised 495 stage II–III patients to fluorouracil-radiotherapy, mFOLFOX6-radiotherapy or mFOLFOX6 alone, followed by surgery and adjuvant chemotherapy.</p>\n<ul><li class=\"evidence-prose\">Original primary analysis: among 475 evaluable patients (155, 157 and 163 by arm), pathological complete response was 14.0%, 27.5% and 6.6%; R0 resection was 90.7%, 89.9% and 89.4%, respectively<sup class=\"trial-ref\"><a href=\"#ref-colorectal-early-rectal-cancer-ext-49b6f71e86b2\" aria-label=\"Reference 32: initial report\">32</a></sup>.</li><li class=\"evidence-prose\">Ten-year DFS was 52.5%, 62.6% and 60.5% (P=.56).</li><li class=\"evidence-prose\">Ten-year local recurrence was 10.8%, 8.0% and 9.6% (P=.57); OS was 65.9%, 72.3% and 73.4% (P=.90).</li><li class=\"evidence-prose\"><span class=\"evidence-lead\">No arm significantly improved long-term disease control or survival.</span><span class=\"evidence-detail\">Do not extrapolate chemotherapy alone beyond carefully selected clear-margin disease.</span></li></ul>\n<h2 id=\"s-use-watch-and-wait-only-with-structured-salvage-capacity\">Use watch-and-wait only with structured salvage capacity</h2>\n<h3 id=\"s-recognise-the-observational-foundation\">Recognise the observational foundation</h3>\n<p>The Habr-Gama cohort provided the initial observational evidence:<sup class=\"trial-ref\"><a href=\"#ref-colorectal-early-rectal-cancer-t-habr-gama\" aria-label=\"Reference 33: Habr-Gama\">33</a></sup></p>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\">Population: 265 patients with distal rectal adenocarcinoma treated with fluorouracil/leucovorin chemoradiation to 5,040 cGy.</span><span class=\"evidence-detail\">The analysis compared 71 patients with a sustained clinical complete response against 22 patients found to have pT0N0M0 only after resection.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">Response gate: assessment at 8 weeks used clinical examination and endoscopy without MRI.</span><span class=\"evidence-detail\">The 71 observed patients had maintained complete regression for at least 12 months before inclusion in the observation group.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">Survival: 5-year overall survival was 100% observed versus 88% resected, with no cancer-related deaths among observed patients.</span><span class=\"evidence-detail\">Disease-free survival was 92% versus 83% and did not significantly differ.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">Recurrence: five of 71 observed patients recurred.</span><span class=\"evidence-detail\">Two bowel-wall recurrences at 56 and 64 months were salvaged and disease-free at last report; three patients developed systemic recurrence and none developed pelvic recurrence.</span></li><li class=\"evidence-prose\">Surgical cost: 16/22 resected patients received a stoma, including nine permanent colostomies.</li><li class=\"evidence-prose\">Limit: this was a single-institution observational comparison between outcome-defined groups, not a comparative efficacy trial.</li></ul>\n<p>The IWWD registry provides multicentre estimates:<sup class=\"trial-ref\"><a href=\"#ref-colorectal-early-rectal-cancer-t-iwwd-van-der-valk\" aria-label=\"Reference 34: IWWD (van der Valk)\">34</a></sup></p>\n<ul><li class=\"evidence-prose\">Population: 880 clinical complete responders from 47 centres.</li><li class=\"evidence-prose\">Regrowth: 2-year local regrowth was 25.2%; 97% arose in the bowel wall and 88% occurred within 2 years.</li><li class=\"evidence-prose\">Salvage: 101/115 documented salvage resections were R0; the authors estimated unsalvageable local disease at no more than 1% of the cohort.</li><li class=\"evidence-prose\">Distant disease: distant metastasis occurred in 8%.</li><li class=\"evidence-prose\">Survival: 5-year overall survival was 84.7% and disease-specific survival 93.8%.</li><li class=\"evidence-prose\"><span class=\"evidence-lead\">Outcome-defined comparison: overall survival was 87.9% with sustained response and 75.4% after regrowth; disease-specific survival after regrowth was 84.0%.</span><span class=\"evidence-detail\">No test between these groups was reported.</span></li><li class=\"evidence-prose\">Limit: there was no central response definition, and only 45% underwent the combined examination, endoscopy and MRI assessment recommended by the authors.</li></ul>\n<h3 id=\"s-use-consolidation-sequencing-to-increase-organ-preservation\">Use consolidation sequencing to increase organ preservation</h3>\n<p>OPRA tested the sequence of TNT, not watch-and-wait against a randomised surgery control:<sup class=\"trial-ref\"><a href=\"#ref-colorectal-early-rectal-cancer-t-opra-garcia-aguilar\" aria-label=\"Reference 5: OPRA (Garcia-Aguilar)\">5</a></sup></p>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\">Population: 324 patients with stage II disease (cT3–4N0) or stage III disease (any cT, N1–2).</span><span class=\"evidence-detail\">Baseline stage was 78% cT3, 15% cT4 and 7% cT1–2; 70% were node-positive and 30% node-negative.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">Sequences: induction chemotherapy followed by chemoradiation, or chemoradiation followed by consolidation chemotherapy.</span><span class=\"evidence-detail\">Chemotherapy was eight FOLFOX cycles or five CAPOX cycles.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">Restaging: within 8 weeks of TNT, use digital examination, endoscopy, pelvic MRI and CT of the chest, abdomen and pelvis.</span><span class=\"evidence-detail\">Incomplete responders were directed to TME; complete and near-complete responders were offered watch-and-wait.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">Comparator: the primary disease-free-survival benchmark came from historical chemoradiation, TME and adjuvant chemotherapy.</span><span class=\"evidence-detail\">There was no concurrent randomised surgery-control arm.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">2022 primary result: both sequences achieved 3-year disease-free survival of 76%, matching rather than exceeding the historical 75% benchmark.</span><span class=\"evidence-detail\">The primary endpoint was not met.</span></li><li class=\"evidence-prose\">2022 organ preservation: 3-year organ preservation was 53% after chemoradiation-consolidation and 41% after induction-chemoradiation.</li><li class=\"evidence-prose\"><span class=\"evidence-lead\">2022 regrowth: 75/225 watch-and-wait patients developed regrowth, 33% computed from the reported counts.</span><span class=\"evidence-detail\">Rates were 40% after induction-first and 27% after consolidation-first treatment.</span></li><li class=\"evidence-prose\">Later update: regrowth was 36%; 94% occurred within 2 years and 99% within 3 years.</li><li class=\"evidence-prose\"><span class=\"evidence-lead\">Later disease control: 5-year disease-free survival was 71% versus 69%.</span><span class=\"evidence-detail\">R0 resection after regrowth was 91% versus 90% after immediate TME for incomplete response, and 5-year disease-free survival was 64% in both groups.</span></li><li class=\"evidence-prose\">Later organ preservation: 5-year TME-free survival was 54% versus 39% (nominal P=0.012).</li><li class=\"evidence-prose\">Other secondary outcomes: 5-year overall survival was 88% versus 85%, locoregional-recurrence-free survival 94% versus 90%, and distant-metastasis-free survival 80% versus 78%.</li><li class=\"evidence-prose\">Treatment cost: grade 3 or higher toxicity was 41% versus 34%, with five treatment-related deaths.</li><li class=\"evidence-prose\"><span class=\"evidence-lead\">Limit: salvage and survival comparisons after regrowth are response-selected and based on few events.</span><span class=\"evidence-detail\">Consolidation sequencing increases the probability of organ preservation but does not establish survival superiority.</span></li></ul>\n<h3 id=\"s-follow-the-opra-protocol-when-applying-its-evidence\">Follow the OPRA protocol when applying its evidence</h3>\n<p>The OPRA watch-and-wait protocol used:</p>\n<ul><li>Digital rectal examination and flexible sigmoidoscopy every 4 months for the first 2 years, then every 6 months for the next 3 years.</li><li>Rectal MRI every 6 months for 2 years, then annually for 3 years.</li><li>CT of the chest, abdomen and pelvis at least annually.</li><li>Biopsy of the primary site was not required by protocol.</li><li>TME was recommended for feasible regrowth.<sup class=\"trial-ref\"><a href=\"#ref-colorectal-early-rectal-cancer-t-opra-garcia-aguilar\" aria-label=\"Reference 5: OPRA (Garcia-Aguilar)\">5</a></sup></li></ul>\n<h2 id=\"s-discuss-pd-1-blockade-for-dmmr-rectal-cancer\">Discuss PD-1 blockade for dMMR rectal cancer</h2>\n<h3 id=\"s-define-response-with-concordant-examination-endoscopy-and-mri\">Define response with concordant examination, endoscopy and MRI</h3>\n<p>In the dostarlimab programme, clinical complete response required no residual disease on digital examination, endoscopy and pelvic MRI.<sup class=\"trial-ref\"><a href=\"#ref-colorectal-early-rectal-cancer-t-dostarlimab-cercek\" aria-label=\"Reference 6: Dostarlimab (Cercek)\">6</a></sup></p>\n<h3 id=\"s-keep-the-single-arm-evidence-limit-explicit\">Keep the single-arm evidence limit explicit</h3>\n<p>The initial dostarlimab report described a single-arm phase 2 cohort of 16 previously untreated stage II–III dMMR rectal adenocarcinomas without distant metastases; 15 had stage III disease and one had stage II disease:<sup class=\"trial-ref\"><a href=\"#ref-colorectal-early-rectal-cancer-t-dostarlimab-cercek\" aria-label=\"Reference 6: Dostarlimab (Cercek)\">6</a></sup></p>\n<ul><li class=\"evidence-prose\">Lynch status: germline testing identified Lynch-associated pathogenic variants in 8/14 tested patients (57%).</li><li class=\"evidence-prose\">Regimen: dostarlimab 500 mg intravenously every 3 weeks for nine cycles over 6 months.</li><li class=\"evidence-prose\"><span class=\"evidence-lead\">Planned pathway: patients without a clinical complete response after dostarlimab were to receive chemoradiation to 50.4 Gy with capecitabine.</span><span class=\"evidence-detail\">Complete responders entered nonoperative follow-up; the remainder proceeded to TME.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">Interim result: all 12 patients who completed 6 months achieved a clinical complete response, and no enrolled patient received chemoradiation or surgery.</span><span class=\"evidence-detail\">Four patients remained on treatment.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">Maturity: median follow-up was 12 months from enrolment.</span><span class=\"evidence-detail\">Only four patients had maintained response for more than 1 year, and the sustained 12-month co-primary endpoint was not yet reported in finality.</span></li><li class=\"evidence-prose\">Safety: adverse events occurred in 12/16 patients (75%), with no grade 3 or higher event.</li></ul>\n<p>The 2025 report expanded the programme:</p>\n<ul><li>Rectal cohort: 50 patients were analysed and 49 completed dostarlimab. All 49 achieved a clinical complete response and chose nonoperative management.</li><li>Durability: 37 had sustained response for at least 12 months, but the publication gives no denominator for that count.</li><li>Recurrence-free survival: 2-year recurrence-free survival was 96% (95% CI 90–100) at median recurrence follow-up of 30.2 months.</li><li>Pooled germline result: across rectal and nonrectal cohorts, 51/117 analysed patients (44%) had pathogenic germline mismatch-repair variants. This is not a rectal-only estimate.</li><li>Limit: the evidence remains single-arm and does not establish replacement of standard local treatment for every patient with dMMR rectal cancer.<sup class=\"trial-ref\"><a href=\"#ref-colorectal-early-rectal-cancer-t-dostarlimab-cercek\" aria-label=\"Reference 6: Dostarlimab (Cercek)\">6</a></sup></li></ul>\n<h2 id=\"s-adapt-treatment-to-frailty-not-age-alone\">Adapt treatment to frailty, not age alone</h2>\n<p>Screen for frailty, functional reserve, comorbidity, cognition, nutrition and baseline neuropathy. Fit older adults should not be denied curative surgery or evidence-based neoadjuvant treatment solely because of age; frail patients need a multidisciplinary plan that prioritises function and treatment completion<sup class=\"trial-ref\"><a href=\"#ref-colorectal-early-rectal-cancer-ext-6862e97a482b\" aria-label=\"Reference 35: international older-adult consensus\">35</a></sup>.</p>\n<p>PRODIGE 23 enrolled performance-status 0–1 patients younger than 76 years, so its mFOLFIRINOX result should not be extrapolated automatically to a frail patient. ADORE&#x27;s 55-patient subgroup aged 65 years or older was inconclusive, not evidence that oxaliplatin is ineffective; consider recurrence risk, neuropathy and competing mortality.</p>\n<p>When a frail patient still needs pelvic treatment, short-course radiotherapy or conventional fluoropyrimidine chemoradiation may reduce systemic intensity, but neither is intrinsically low burden. Surgery, postoperative chemotherapy and nonoperative management must remain feasible parts of the same plan.</p>\n<h2 id=\"s-surveillance-after-curative-treatment\">Surveillance after curative treatment</h2>\n<p>After curative surgery, use CEA and CT of the chest, abdomen and pelvis during the first 3 years. NICE specifies the modalities but not a universal visit-by-visit cadence; tailor frequency to stage, fitness for salvage treatment and local protocol.</p>\n<p>For pathological stage III disease after short-course or no preoperative radiotherapy, NICE lists CAPOX for 3 months, FOLFOX for 3–6 months or single-agent fluoropyrimidine for 6 months. Choose by histopathology, performance status, preferences, comorbidity and age; this is a postoperative pathway, not a substitute for appropriate TNT.</p>\n<p>Colonoscopy remains necessary after curative treatment, but NICE NG151 does not define its interval. Use the colorectal surveillance programme and shorten intervals for hereditary risk or polyp findings; do not invent a generic colonoscopy schedule from the rectal TNT trials.</p>\n<p>For watch-and-wait, use the OPRA schedule above when applying OPRA evidence. A clinical or radiological regrowth signal requires prompt multidisciplinary reassessment for salvage TME; the protocol does not support relaxed follow-up after an early complete response.</p>\n<h2 id=\"s-references\">References</h2>\n<ol class=\"refs\">\n<li id=\"ref-colorectal-early-rectal-cancer-t-rapido-bahadoer\"><a class=\"trial-link\" href=\"/evidence/#t-rapido-bahadoer\">RAPIDO (Bahadoer)</a>. <a href=\"https://drive.google.com/file/d/1o71xCImaQ_rUnM5IF4kHjfM81lRJLj_W/preview\">Lancet Oncol 2021;22:29-42</a>; <a href=\"https://drive.google.com/file/d/1VYwwUKvoQ4O0hJ549AeEOGCG6292Mzpv/preview\">Ann Surg 2023;278:e766-e772</a></li>\n<li id=\"ref-colorectal-early-rectal-cancer-t-prodige-23-conroy\"><a class=\"trial-link\" href=\"/evidence/#t-prodige-23-conroy\">PRODIGE 23 (Conroy)</a>. <a href=\"https://drive.google.com/file/d/1JNM2TVk7Q8iA2r-8l3ia4olKn_PJTNYq/preview\">Lancet Oncol 2021;22:702-715</a>; <a href=\"https://drive.google.com/file/d/1cv5Z8BXkVcZJZZSh53q7lWeqP6cHO3mW/preview\">Ann Oncol 2024;35:873-881</a></li>\n<li id=\"ref-colorectal-early-rectal-cancer-t-stellar-jin\"><a class=\"trial-link\" href=\"/evidence/#t-stellar-jin\">STELLAR (Jin)</a>. <a href=\"https://drive.google.com/file/d/1e801bLnGyxL6d1N7_aL346wagB30YNaC/preview\">J Clin Oncol 2022;40:1681-1692</a>; <a href=\"https://drive.google.com/file/d/1Lg6Git0uIyhgjWYBPT1BGHtipixyCsui/preview\">J Clin Oncol 2026</a></li>\n<li id=\"ref-colorectal-early-rectal-cancer-t-prospect-alliance-n1048\"><a class=\"trial-link\" href=\"/evidence/#t-prospect-alliance-n1048\">PROSPECT (Alliance N1048)</a>. <a href=\"https://drive.google.com/file/d/1M82TXPeRP3blqFiOYRidO4j0CvHDp2mo/preview\">N Engl J Med 2023;389:322-334</a></li>\n<li id=\"ref-colorectal-early-rectal-cancer-t-opra-garcia-aguilar\"><a class=\"trial-link\" href=\"/evidence/#t-opra-garcia-aguilar\">OPRA (Garcia-Aguilar)</a>. <a href=\"https://drive.google.com/file/d/1pBoHfhCVGFe1MiPaHbpMZJ0Ob49rIouZ/preview\">J Clin Oncol 2022;40:2546-2556</a></li>\n<li id=\"ref-colorectal-early-rectal-cancer-t-dostarlimab-cercek\"><a class=\"trial-link\" href=\"/evidence/#t-dostarlimab-cercek\">Dostarlimab (Cercek)</a>. <a href=\"https://drive.google.com/file/d/1lG4Km-TNal09ShmPyUZ5KwB4Q7XymUE_/preview\">N Engl J Med 2022;386:2363-2376</a></li>\n<li id=\"ref-colorectal-early-rectal-cancer-ext-f8264fededf1\"><a href=\"https://doi.org/10.1200/JCO.24.01160\" rel=\"noopener\" target=\"_blank\">ASCO locally advanced rectal guideline</a></li>\n<li id=\"ref-colorectal-early-rectal-cancer-ext-a6fa17232fb4\"><a href=\"https://www.ascrsu.com/ascrs/view/ASCRS-Toolkit/2851064/0/Management_of_Rectal_Cancer__2020_\" rel=\"noopener\" target=\"_blank\">ASCRS rectal guideline</a></li>\n<li id=\"ref-colorectal-early-rectal-cancer-ext-1c726977e900\"><a href=\"https://doi.org/10.1016/j.prro.2024.11.003\" rel=\"noopener\" target=\"_blank\">ASTRO focused update 2025</a></li>\n<li id=\"ref-colorectal-early-rectal-cancer-ext-98b59a94e1d7\"><a href=\"https://www.nice.org.uk/guidance/ng151/chapter/Recommendations\" rel=\"noopener\" target=\"_blank\">NICE NG151 recommendations</a></li>\n<li id=\"ref-colorectal-early-rectal-cancer-ext-19ad41c7be48\"><a href=\"https://doi.org/10.1016/S0140-6736%2801%2906409-1\" rel=\"noopener\" target=\"_blank\">Colorectal Cancer Collaborative Group</a></li>\n<li id=\"ref-colorectal-early-rectal-cancer-ext-0be97d66b7ec\"><a href=\"https://pubmed.ncbi.nlm.nih.gov/3943037/\" rel=\"noopener\" target=\"_blank\">GITSG</a></li>\n<li id=\"ref-colorectal-early-rectal-cancer-ext-727499cd160d\"><a href=\"https://doi.org/10.1093/jnci/80.1.21\" rel=\"noopener\" target=\"_blank\">Fisher et al.</a></li>\n<li id=\"ref-colorectal-early-rectal-cancer-ext-1873c357b111\"><a href=\"https://doi.org/10.1002/14651858.CD004078.pub2\" rel=\"noopener\" target=\"_blank\">Petersen et al.</a></li>\n<li id=\"ref-colorectal-early-rectal-cancer-ext-1f05f49f175f\"><a href=\"https://doi.org/10.1200/JCO.2002.08.001\" rel=\"noopener\" target=\"_blank\">Gunderson et al.</a></li>\n<li id=\"ref-colorectal-early-rectal-cancer-ext-87ec4652bfa0\"><a href=\"https://doi.org/10.1016/S1470-2045%2812%2970116-X\" rel=\"noopener\" target=\"_blank\">Hofheinz et al.</a></li>\n<li id=\"ref-colorectal-early-rectal-cancer-ext-d87d1b2603c6\"><a href=\"https://doi.org/10.1001/jamanetworkopen.2021.36116\" rel=\"noopener\" target=\"_blank\">Li et al.</a></li>\n<li id=\"ref-colorectal-early-rectal-cancer-t-adore-hong\"><a class=\"trial-link\" href=\"/evidence/#t-adore-hong\">ADORE (Hong)</a>. <a href=\"https://drive.google.com/file/d/1Bg3gJv565myDFVSgSo3CFf81yffEaZXc/preview\">Lancet Oncol 2014;15:1245-1253</a>; <a href=\"https://drive.google.com/file/d/1IJvp13QG1U6ddvVS6zsnxVkNQQUaK1im/preview\">J Clin Oncol 2019;37:3111-3123</a></li>\n<li id=\"ref-colorectal-early-rectal-cancer-t-german-rectal-cao-aro-aio-94\"><a class=\"trial-link\" href=\"/evidence/#t-german-rectal-cao-aro-aio-94\">German Rectal (CAO/ARO/AIO-94)</a>. <a href=\"https://drive.google.com/file/d/1T4gjue5-uAgOmv1g7NzX2hOI00RfmEhd/preview\">N Engl J Med 2004;351:1731-1740</a></li>\n<li id=\"ref-colorectal-early-rectal-cancer-ext-ace697f4bf8f\"><a href=\"https://doi.org/10.1002/cncr.25943\" rel=\"noopener\" target=\"_blank\">Park et al.</a></li>\n<li id=\"ref-colorectal-early-rectal-cancer-t-polish-colorectal-bujko\"><a class=\"trial-link\" href=\"/evidence/#t-polish-colorectal-bujko\">Polish Colorectal (Bujko)</a>. <a href=\"https://drive.google.com/file/d/1pfFQs1tcs7HwXdAs2BEkrAaODU0WSgWd/preview\">Br J Surg 2006;93:1215-1223</a>; <a href=\"https://drive.google.com/file/d/1Oia-0zuQxeM3mE7OfqBOVt-umFUMBh-c/preview\">Radiother Oncol 2004;72:15-24</a></li>\n<li id=\"ref-colorectal-early-rectal-cancer-t-trog-01-04-ngan\"><a class=\"trial-link\" href=\"/evidence/#t-trog-01-04-ngan\">TROG 01.04 (Ngan)</a>. <a href=\"https://drive.google.com/file/d/13GFghiPb-xjVyVmcgd3RS0Q4Hw-0HYvR/preview\">J Clin Oncol 2012;30:3827-3833</a></li>\n<li id=\"ref-colorectal-early-rectal-cancer-ext-d6e54f6cd4ee\"><a href=\"https://documents.cap.org/documents/New-Cancer-Protocols-June-2025/ColoRectal_4.4.0.0.REL_CAPCP.pdf\" rel=\"noopener\" target=\"_blank\">CAP Colon and Rectum Resection protocol</a></li>\n<li id=\"ref-colorectal-early-rectal-cancer-t-star-01-aschele\"><a class=\"trial-link\" href=\"/evidence/#t-star-01-aschele\">STAR-01 (Aschele)</a>. <a href=\"https://drive.google.com/file/d/1FtOI3Oyz_hYv4dXN2GhSuzDeD8bInXxd/preview\">J Clin Oncol 2011;29:2773-2780</a></li>\n<li id=\"ref-colorectal-early-rectal-cancer-t-accord-12-0405-g-rard\"><a class=\"trial-link\" href=\"/evidence/#t-accord-12-0405-g-rard\">ACCORD 12/0405 (Gérard)</a>. <a href=\"https://drive.google.com/file/d/1v5wJoOPMnBAL-sG8dZeIyc5-UeTd2lPy/preview\">J Clin Oncol 2010;28:1638-1644</a></li>\n<li id=\"ref-colorectal-early-rectal-cancer-t-nsabp-r-04-allegra\"><a class=\"trial-link\" href=\"/evidence/#t-nsabp-r-04-allegra\">NSABP R-04 (Allegra)</a>. <a href=\"https://drive.google.com/file/d/1vs0Br78cbKvSRChtgdmEzQm40ZwEjgJQ/preview\">J Natl Cancer Inst 2015;107:djv248</a></li>\n<li id=\"ref-colorectal-early-rectal-cancer-t-cao-aro-aio-04-r-del\"><a class=\"trial-link\" href=\"/evidence/#t-cao-aro-aio-04-r-del\">CAO/ARO/AIO-04 (Rödel)</a>. <a href=\"https://drive.google.com/file/d/1E-m8tNHOouB6j00u-hZvGX6KcOPbT0yV/preview\">Lancet Oncol 2015;16:979-989</a></li>\n<li id=\"ref-colorectal-early-rectal-cancer-t-cao-aro-aio-12-fokas\"><a class=\"trial-link\" href=\"/evidence/#t-cao-aro-aio-12-fokas\">CAO/ARO/AIO-12 (Fokas)</a>. <a href=\"https://drive.google.com/file/d/1Vbv06U6T_uJg6gdsklEY_AWax-t-2f_z/preview\">J Clin Oncol 2019;37:3212-3222</a></li>\n<li id=\"ref-colorectal-early-rectal-cancer-ext-49092cd807ba\"><a href=\"https://doi.org/10.1093/annonc/mdz186\" rel=\"noopener\" target=\"_blank\">Polish II</a></li>\n<li id=\"ref-colorectal-early-rectal-cancer-ext-e55fc9061ee3\"><a href=\"https://doi.org/10.1200/JCO-25-00731\" rel=\"noopener\" target=\"_blank\">CONVERT</a></li>\n<li id=\"ref-colorectal-early-rectal-cancer-ext-ece1fc868b75\"><a href=\"https://doi.org/10.1200/JCO-24-01676\" rel=\"noopener\" target=\"_blank\">FOWARC</a></li>\n<li id=\"ref-colorectal-early-rectal-cancer-ext-49b6f71e86b2\"><a href=\"https://doi.org/10.1200/JCO.2016.66.6198\" rel=\"noopener\" target=\"_blank\">initial report</a></li>\n<li id=\"ref-colorectal-early-rectal-cancer-t-habr-gama\"><a class=\"trial-link\" href=\"/evidence/#t-habr-gama\">Habr-Gama</a>. <a href=\"https://drive.google.com/file/d/11F8g1wLmZHN29NDdC1k2f7NLkwTSuBaH/preview\">Ann Surg 2004;240:711-718</a></li>\n<li id=\"ref-colorectal-early-rectal-cancer-t-iwwd-van-der-valk\"><a class=\"trial-link\" href=\"/evidence/#t-iwwd-van-der-valk\">IWWD (van der Valk)</a>. <a href=\"https://drive.google.com/file/d/1iC5_fQiiQhA8HYAJop2F0hpzHMGaCx6m/preview\">Lancet 2018;391:2537-2545</a></li>\n<li id=\"ref-colorectal-early-rectal-cancer-ext-6862e97a482b\"><a href=\"https://doi.org/10.1016/j.ejso.2018.08.003\" rel=\"noopener\" target=\"_blank\">international older-adult consensus</a></li>\n</ol>", "_hay": "early rectal cancer early-rectal-cancer colorectal define anatomy, risk and treatment intent complete staging before treatment preserve function without compromising the resection plane use current practice anchors use postoperative chemotherapy selectively understand the historical postoperative evidence use a fluoropyrimidine if postoperative chemoradiation is required select folfox after preoperative chemoradiation prefer preoperative when pelvic chemoradiation is required establish the preoperative approach match short- or long-course treatment to the objective report treatment response with the current pathology scale do not routinely add concurrent oxaliplatin use total neoadjuvant therapy for selected disease use induction mfolfirinox for a fit, locally advanced population use short-course tnt with attention to local control use the three-year stellar non-inferiority result at its tested scope prefer consolidation sequencing when organ preservation is the objective keep polish ii as historical high-risk tnt evidence omit pelvic radiation only in a selected population use response-directed mfolfox within prospect eligibility do not generalise chemotherapy-only evidence use watch-and-wait only with structured salvage capacity recognise the observational foundation use consolidation sequencing to increase organ preservation follow the opra protocol when applying its evidence discuss pd-1 blockade for dmmr rectal cancer define response with concordant examination, endoscopy and mri keep the single-arm evidence limit explicit adapt treatment to frailty, not age alone surveillance after curative treatment references"}, {"id": "lung-nsclc-classification-staging-and-molecular-profile", "slug": "nsclc-classification-staging-and-molecular-profile", "group": "Lung", "title": "NSCLC: classification, staging and molecular profile", "updated": "", "sections": [{"id": "s-make-four-decisions-before-treatment", "h": "Make four decisions before treatment", "depth": 2}, {"id": "s-classify-by-morphology-first", "h": "Classify by morphology first", "depth": 2}, {"id": "s-use-a-minimal-question-led-immunohistochemistry-panel", "h": "Use a minimal, question-led immunohistochemistry panel", "depth": 2}, {"id": "s-choose-a-specimen-that-establishes-the-highest-stage", "h": "Choose a specimen that establishes the highest stage", "depth": 2}, {"id": "s-stage-with-tnm-9", "h": "Stage with TNM-9", "depth": 2}, {"id": "s-t-category", "h": "T category", "depth": 3}, {"id": "s-n-and-m-categories", "h": "N and M categories", "depth": 3}, {"id": "s-stage-groups", "h": "Stage groups", "depth": 3}, {"id": "s-complete-imaging-before-fixing-treatment-intent", "h": "Complete imaging before fixing treatment intent", "depth": 2}, {"id": "s-confirm-mediastinal-disease-when-it-can-change-intent", "h": "Confirm mediastinal disease when it can change intent", "depth": 2}, {"id": "s-build-the-molecular-profile-before-systemic-treatment", "h": "Build the molecular profile before systemic treatment", "depth": 2}, {"id": "s-match-the-assay-to-the-alteration", "h": "Match the assay to the alteration", "depth": 3}, {"id": "s-use-plasma-as-a-complement-not-a-negative-biopsy", "h": "Use plasma as a complement, not a negative biopsy", "depth": 3}, {"id": "s-interpret-the-alteration-class-not-merely-the-gene", "h": "Interpret the alteration class, not merely the gene", "depth": 3}, {"id": "s-use-epidemiology-to-anticipate-never-to-exclude", "h": "Use epidemiology to anticipate, never to exclude", "depth": 2}, {"id": "s-references", "h": "References", "depth": 2}], "html": "<h2 id=\"s-make-four-decisions-before-treatment\">Make four decisions before treatment</h2>\n<p>For every new lung carcinoma, establish the histological family, the anatomical stage, the molecular profile and whether one specimen can answer more than one question. Obtain enough viable tumour for morphology, focused immunohistochemistry and biomarker testing; a technically successful biopsy that exhausts the block before genotyping is not an adequate diagnostic episode.</p>\n<p>The practical sequence is:</p>\n<ol><li>Confirm carcinoma and assign the most specific lineage that the specimen supports.</li><li>Complete TNM staging before declaring treatment intent.</li><li>Sample the site that gives the highest stage safely, while preserving tissue for molecular testing.</li><li>Match each biomarker to an assay that can detect its alteration class.</li></ol>\n<p>Screening eligibility and low-dose CT evidence are addressed in <strong>NSCLC: early and locally advanced disease</strong>; this chapter begins once a lesion requires pathological and anatomical classification.</p>\n<h2 id=\"s-classify-by-morphology-first\">Classify by morphology first</h2>\n<p>Use the current WHO thoracic classification rather than the historical small-cell-versus-NSCLC binary alone. Within NSCLC, the major families are adenocarcinoma, squamous cell carcinoma, adenosquamous carcinoma, sarcomatoid carcinoma and other defined or undifferentiated epithelial tumours. Pulmonary carcinoids belong with lung neuroendocrine neoplasms, not under NSCLC<sup class=\"trial-ref\"><a href=\"#ref-lung-nsclc-classification-staging-and-molecular-profile-ext-73ca0ae0be18\" aria-label=\"Reference 1: WHO 2021 lung tumour classification review\">1</a></sup>.</p>\n<p>Record each pattern in a resected invasive non-mucinous adenocarcinoma in 5% increments. Grade 1 is lepidic-predominant disease with less than 20% high-grade pattern; grade 2 is acinar- or papillary-predominant disease with less than 20% high-grade pattern; grade 3 contains at least 20% solid, micropapillary or complex-glandular pattern, whatever the predominant pattern<sup class=\"trial-ref\"><a href=\"#ref-lung-nsclc-classification-staging-and-molecular-profile-ext-27235a145dc5\" aria-label=\"Reference 2: IASLC invasive adenocarcinoma grading proposal\">2</a></sup>.</p>\n<p>Do not infer a complete resection diagnosis from a small sample. Adenosquamous carcinoma requires at least 10% each of glandular and squamous components in a resection; a biopsy showing both should be reported descriptively. Large cell carcinoma is likewise a resection diagnosis of exclusion after morphology and ancillary testing fail to establish a more specific lineage<sup class=\"trial-ref\"><a href=\"#ref-lung-nsclc-classification-staging-and-molecular-profile-ext-73ca0ae0be18\" aria-label=\"Reference 1: WHO 2021 lung tumour classification review\">1</a></sup>.</p>\n<p>Pulmonary lymphoepithelial carcinoma is now classified under squamous cell carcinoma. Demonstrate tumour-cell EBV association where this morphology is suspected, correlate with imaging and clinical findings, and exclude a nasopharyngeal primary rather than assuming that a lung lesion is primary solely because it was biopsied in the chest<sup class=\"trial-ref\"><a href=\"#ref-lung-nsclc-classification-staging-and-molecular-profile-ext-73ca0ae0be18\" aria-label=\"Reference 1: WHO 2021 lung tumour classification review\">1</a></sup>.</p>\n<h2 id=\"s-use-a-minimal-question-led-immunohistochemistry-panel\">Use a minimal, question-led immunohistochemistry panel</h2>\n<p>On a poorly differentiated non-small-cell carcinoma without clear glandular, squamous or neuroendocrine morphology, TTF-1 and p40 are usually the first lineage pair. Prefer p40 to p63 for squamous differentiation and add napsin A or mucin only when the initial result and morphology remain unresolved. This conserves tissue for predictive testing<sup class=\"trial-ref\"><a href=\"#ref-lung-nsclc-classification-staging-and-molecular-profile-ext-c1d6242849dc\" aria-label=\"Reference 3: IASLC diagnostic immunohistochemistry best practices\">3</a></sup>.</p>\n<div class=\"tblwrap\" role=\"region\" aria-label=\"Scrollable table\" tabindex=\"0\"><table><thead><tr><th scope=\"col\">Diagnostic question</th><th scope=\"col\">Morphology and first-line markers</th><th scope=\"col\">Interpretation trap</th></tr></thead><tbody><tr><td>Adenocarcinoma</td><td>Glands or intracytoplasmic mucin; TTF-1 and/or napsin A support pulmonary lineage</td><td>TTF-1 is not lung-specific; thyroid and some neuroendocrine carcinomas can express it</td></tr><tr><td>Squamous carcinoma</td><td>Keratinisation or intercellular bridges; diffuse p40 supports squamous lineage</td><td>Focal p63 alone is less specific; CK7 does not exclude squamous carcinoma</td></tr><tr><td>Small-cell carcinoma</td><td>Small blue cells, nuclear moulding, scant cytoplasm, necrosis and brisk mitoses; INSM1, synaptophysin, chromogranin or CD56 support neuroendocrine differentiation</td><td>Neuroendocrine-marker expression alone does not override non-neuroendocrine morphology</td></tr><tr><td>Large-cell neuroendocrine carcinoma</td><td>Non-small-cell cytology with neuroendocrine architecture, high mitotic activity and necrosis, plus neuroendocrine differentiation</td><td>It is not synonymous with large cell carcinoma</td></tr><tr><td>Adenosquamous carcinoma</td><td>Distinct glandular and squamous areas, each at least 10% in a resection</td><td>A small biopsy cannot establish the required whole-tumour proportions</td></tr><tr><td>Large cell carcinoma</td><td>Undifferentiated non-small-cell carcinoma after exclusion of glandular, squamous and other defined lineages</td><td>Reserve the label for a thoroughly sampled resection</td></tr></tbody></table></div>\n<p>CD45 is an exclusion marker for lymphoma, not a positive marker of small-cell carcinoma. Ki-67 can support separation of a carcinoid from a high-grade neuroendocrine carcinoma in a crushed small specimen, but pulmonary carcinoid classification is not assigned from a gastrointestinal Ki-67 grading scheme<sup class=\"trial-ref\"><a href=\"#ref-lung-nsclc-classification-staging-and-molecular-profile-ext-c1d6242849dc\" aria-label=\"Reference 3: IASLC diagnostic immunohistochemistry best practices\">3</a></sup>.</p>\n<p>When the differential includes a metastasis, select markers from the clinical and morphological question rather than applying a fixed organ panel. Useful anchors include thyroglobulin or PAX8 for thyroid; SATB2 and CDX2 for colorectal; GATA3 and ER for breast; PAX8 and CAIX for renal; NKX3.1 or PSA for prostate; PAX8 and WT1 for Müllerian; and arginase-1 or HepPar-1 for hepatocellular lineage. No single result proves origin<sup class=\"trial-ref\"><a href=\"#ref-lung-nsclc-classification-staging-and-molecular-profile-ext-c1d6242849dc\" aria-label=\"Reference 3: IASLC diagnostic immunohistochemistry best practices\">3</a></sup>.</p>\n<h2 id=\"s-choose-a-specimen-that-establishes-the-highest-stage\">Choose a specimen that establishes the highest stage</h2>\n<p>If a distant lesion is safely accessible and its nature will change intent, biopsy it in preference to the lung primary: one procedure can establish diagnosis and M stage. Confirm an isolated or unexpected metastatic focus before abandoning curative treatment, because infection, inflammation and a second primary can mimic metastatic disease<sup class=\"trial-ref\"><a href=\"#ref-lung-nsclc-classification-staging-and-molecular-profile-ext-a1bc58df1286\" aria-label=\"Reference 4: NICE lung cancer diagnosis and staging guideline\">4</a></sup>.</p>\n<p>When disease appears confined to the thorax, choose between image-guided core biopsy, bronchoscopy, EBUS-TBNA, EUS-guided sampling or surgical biopsy according to lesion position and the staging question. Communicate the need for histology, PD-L1 and molecular testing before the procedure, request a cell block where appropriate, and avoid serial single-gene tests that consume the specimen<sup class=\"trial-ref\"><a href=\"#ref-lung-nsclc-classification-staging-and-molecular-profile-ext-68ed2f2027f1\" aria-label=\"Reference 5: Pan-Asian ESMO oncogene-addicted NSCLC guideline\">5</a></sup>.</p>\n<h2 id=\"s-stage-with-tnm-9\">Stage with TNM-9</h2>\n<p>This chapter uses the IASLC/UICC lung TNM ninth edition descriptors and stage groups. T descriptors are unchanged from the eighth edition; N2 is split by single versus multiple ipsilateral mediastinal stations, and M1c is split by one versus multiple extrathoracic organ systems. Confirm the version used by the local cancer registry when dates or jurisdictions differ<sup class=\"trial-ref\"><a href=\"#ref-lung-nsclc-classification-staging-and-molecular-profile-ext-2522e70340f0\" aria-label=\"Reference 6: IASLC TNM-9 staging cards\">6</a></sup>.</p>\n<h3 id=\"s-t-category\">T category</h3>\n<div class=\"tblwrap\" role=\"region\" aria-label=\"Scrollable table\" tabindex=\"0\"><table><thead><tr><th scope=\"col\">Category</th><th scope=\"col\">Definition</th></tr></thead><tbody><tr><td>Tis</td><td>Carcinoma in situ</td></tr><tr><td>T1mi</td><td>Minimally invasive adenocarcinoma no larger than 3 cm, lepidic-predominant, with invasion no greater than 5 mm</td></tr><tr><td>T1a / T1b / T1c</td><td>No greater than 1 cm / greater than 1–2 cm / greater than 2–3 cm</td></tr><tr><td>T2a</td><td>Greater than 3–4 cm, or a tumour no greater than 4 cm with visceral-pleural invasion, main-bronchus involvement without carinal invasion, atelectasis or obstructive pneumonitis extending to the hilum, or direct invasion across a fissure into an adjacent lobe</td></tr><tr><td>T2b</td><td>Greater than 4–5 cm</td></tr><tr><td>T3</td><td>Greater than 5–7 cm; separate nodule in the same lobe; or invasion of chest wall/parietal pleura, pericardium, phrenic nerve, azygos vein, T1–T2 nerve roots or stellate ganglion</td></tr><tr><td>T4</td><td>Greater than 7 cm; separate nodule in a different ipsilateral lobe; or invasion of mediastinum, thymus, trachea, carina, recurrent laryngeal or vagus nerve, oesophagus, diaphragm, heart, great vessels, vertebral body, spinal canal or brachial plexus</td></tr></tbody></table></div>\n<p>For a part-solid non-mucinous adenocarcinoma, use the invasive component, rather than the total lepidic span, for pathological T size. Record both total and invasive dimensions because radiological and pathological measurements answer different questions.</p>\n<h3 id=\"s-n-and-m-categories\">N and M categories</h3>\n<div class=\"tblwrap\" role=\"region\" aria-label=\"Scrollable table\" tabindex=\"0\"><table><thead><tr><th scope=\"col\">Category</th><th scope=\"col\">Definition</th></tr></thead><tbody><tr><td>N0</td><td>No regional nodal metastasis</td></tr><tr><td>N1</td><td>Ipsilateral intrapulmonary, peribronchial or hilar nodes, including direct extension</td></tr><tr><td>N2a</td><td>One ipsilateral mediastinal or subcarinal nodal station</td></tr><tr><td>N2b</td><td>Multiple ipsilateral mediastinal and/or subcarinal nodal stations</td></tr><tr><td>N3</td><td>Contralateral mediastinal or hilar, or any scalene or supraclavicular node</td></tr><tr><td>M0</td><td>No distant metastasis</td></tr><tr><td>M1a</td><td>Contralateral-lung nodule, pleural or pericardial nodule, or malignant pleural or pericardial effusion</td></tr><tr><td>M1b</td><td>One extrathoracic metastasis in one organ system, including one non-regional node</td></tr><tr><td>M1c1</td><td>Multiple extrathoracic metastases confined to one organ system</td></tr><tr><td>M1c2</td><td>Multiple extrathoracic metastases in more than one organ system</td></tr></tbody></table></div>\n<p>Station 1 comprises low cervical, supraclavicular and sternal-notch nodes and is N3. Stations 2–9 are mediastinal, including station 7 subcarinal; stations 10–14 are hilar, interlobar, lobar, segmental and subsegmental N1 stations. State the station and side, not merely “mediastinal node,” because single-station N2a and multi-station N2b now group differently.</p>\n<h3 id=\"s-stage-groups\">Stage groups</h3>\n<div class=\"tblwrap\" role=\"region\" aria-label=\"Scrollable table\" tabindex=\"0\"><table><thead><tr><th scope=\"col\">Stage</th><th scope=\"col\">TNM-9 grouping</th></tr></thead><tbody><tr><td>0</td><td>Tis N0 M0</td></tr><tr><td>IA1</td><td>T1mi/T1a N0 M0</td></tr><tr><td>IA2</td><td>T1b N0 M0</td></tr><tr><td>IA3</td><td>T1c N0 M0</td></tr><tr><td>IB</td><td>T2a N0 M0</td></tr><tr><td>IIA</td><td>T2b N0 M0; or T1 N1 M0</td></tr><tr><td>IIB</td><td>T1 N2a M0; T2 N1 M0; or T3 N0 M0</td></tr><tr><td>IIIA</td><td>T1 N2b M0; T2 N2a M0; T3 N1–N2a M0; or T4 N0–N1 M0</td></tr><tr><td>IIIB</td><td>T1 N3 M0; T2 N2b–N3 M0; T3 N2b M0; or T4 N2a–N2b M0</td></tr><tr><td>IIIC</td><td>T3–T4 N3 M0</td></tr><tr><td>IVA</td><td>Any T, any N, M1a or M1b</td></tr><tr><td>IVB</td><td>Any T, any N, M1c1 or M1c2</td></tr></tbody></table></div>\n<p>The changes most likely to alter a treatment pathway are T1N1 from IIB to IIA, T1N2a from IIIA to IIB, T3N2a from IIIB to IIIA, and T2N2b from IIIA to IIIB. Do not translate an old trial’s eligibility label into TNM-9 without reconstructing its T, N and M descriptors.</p>\n<h2 id=\"s-complete-imaging-before-fixing-treatment-intent\">Complete imaging before fixing treatment intent</h2>\n<p>Start with contrast-enhanced CT of the chest and upper abdomen, including adrenals. Add FDG PET-CT for a patient being considered for curative local treatment to identify occult nodal or distant disease and to choose the best biopsy target; a solitary PET-positive distant lesion needs pathological confirmation if it would change intent. Brain MRI is preferred when brain staging is indicated, particularly for stage III or neurological symptoms<sup class=\"trial-ref\"><a href=\"#ref-lung-nsclc-classification-staging-and-molecular-profile-ext-a1bc58df1286\" aria-label=\"Reference 4: NICE lung cancer diagnosis and staging guideline\">4</a></sup>.</p>\n<p>In a randomised staging trial of 189 patients referred for preoperative staging, the alpha-protected primary thoracotomy-subgroup analysis found futile thoracotomy in 38/73 (52%) with conventional staging and 21/60 (35%) with PET-CT plus conventional staging (P=.05). Mediastinoscopy was mandatory in both groups<sup class=\"trial-ref\"><a href=\"#ref-lung-nsclc-classification-staging-and-molecular-profile-t-fischer-et-al-pet-ct-staging\" aria-label=\"Reference 7: Fischer et al. (PET-CT staging)\">7</a></sup>.</p>\n<p>The prespecified exploratory all-randomised analysis found futile thoracotomy in 38/91 (42%) versus 21/98 (21%), with no inferential test reported: an absolute reduction of 21 percentage points, or about one avoided futile thoracotomy for every five patients staged. The trial stopped early and showed no survival difference<sup class=\"trial-ref\"><a href=\"#ref-lung-nsclc-classification-staging-and-molecular-profile-t-fischer-et-al-pet-ct-staging\" aria-label=\"Reference 7: Fischer et al. (PET-CT staging)\">7</a></sup>.</p>\n<p>Whole-body MRI is not a default substitute for standard staging. In the prospective paired Streamline L study, 353 participants were enrolled but only 187 entered the primary accuracy analysis; among the 52 patients with metastases, there was no evidence of a difference in sensitivity (50% versus 54%; difference -4 percentage points, 95% CI -15 to 7; P=.73). MRI shortened median staging time from 19 to 13 days and lowered mean staging cost from £620 to £317<sup class=\"trial-ref\"><a href=\"#ref-lung-nsclc-classification-staging-and-molecular-profile-t-streamline-l-trial-taylor-et-al\" aria-label=\"Reference 8: Streamline L trial (Taylor et al.)\">8</a></sup>.</p>\n<h2 id=\"s-confirm-mediastinal-disease-when-it-can-change-intent\">Confirm mediastinal disease when it can change intent</h2>\n<p>Invasive mediastinal staging can usually be omitted for a peripheral tumour no larger than 3 cm with no enlarged or FDG-avid nodes and no clinical N1 disease. Use systematic EBUS-TBNA, with EUS where it adds access, when mediastinal or hilar nodes are enlarged or avid, or when the tumour is central, larger than 3 cm, FDG-nonavid or associated with clinical N1 disease.</p>\n<p>A malignant result establishes nodal stage. After a negative endosonographic result, review whether the relevant stations were systematically examined, whether sampling was adequate and whether imaging remains discordant. Surgical staging remains appropriate when suspicion is high or endosonography was incomplete; it is not an automatic consequence of every negative EBUS or EUS<sup class=\"trial-ref\"><a href=\"#ref-lung-nsclc-classification-staging-and-molecular-profile-ext-a1bc58df1286\" aria-label=\"Reference 4: NICE lung cancer diagnosis and staging guideline\">4</a></sup>.</p>\n<p>In the randomised MEDIASTrial, immediate resection after systematic negative endosonography produced an unforeseen N2 rate of 8.8%, non-inferior to 7.7% with confirmatory mediastinoscopy; mediastinoscopy itself found N2/3 disease in 8.0%. This supports omitting routine confirmatory mediastinoscopy after a high-quality negative systematic examination in appropriately selected resectable disease, not omitting surgical confirmation when the examination was inadequate or discordant<sup class=\"trial-ref\"><a href=\"#ref-lung-nsclc-classification-staging-and-molecular-profile-ext-359dfd2a5bac\" aria-label=\"Reference 9: MEDIASTrial\">9</a></sup>.</p>\n<h2 id=\"s-build-the-molecular-profile-before-systemic-treatment\">Build the molecular profile before systemic treatment</h2>\n<p>For advanced non-squamous NSCLC, use a broad validated tumour NGS panel rather than serial single-gene testing. Test a confident pure squamous carcinoma when clinical or pathological features raise the possibility of an occult non-squamous component or actionable driver: for example young age, never/light smoking or limited tissue. Do not use ethnicity, sex or smoking history to withhold testing from an adenocarcinoma<sup class=\"trial-ref\"><a href=\"#ref-lung-nsclc-classification-staging-and-molecular-profile-ext-68ed2f2027f1\" aria-label=\"Reference 5: Pan-Asian ESMO oncogene-addicted NSCLC guideline\">5</a></sup>.</p>\n<p>At minimum, the advanced-disease profile should resolve <em>EGFR</em>, <em>ALK</em>, <em>ROS1</em>, <em>BRAF</em>, <em>KRAS</em>, <em>MET</em> exon 14 skipping, <em>RET</em>, <em>NTRK1/2/3</em> and <em>ERBB2/HER2</em>. A sufficiently broad panel should also identify relevant copy-number changes and rarer fusions such as <em>NRG1</em>. Determine PD-L1 by a validated immunohistochemistry assay; PD-L1 is not a substitute for genotyping<sup class=\"trial-ref\"><a href=\"#ref-lung-nsclc-classification-staging-and-molecular-profile-ext-5bd27c22a429
