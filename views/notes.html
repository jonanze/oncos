oncastuximab tesirine (anti-CD19 antibody-drug conjugate): <a class=\"trial-link\" href=\"/evidence/#t-lotis-2\">LOTIS-2</a>, single-arm after 2 or more lines, gave ORR 48% and CR 24% (median duration of response 10.3 months), as outpatient monotherapy (Lancet Oncol 2021;22:790-800).</li><li>Brentuximab vedotin plus lenalidomide-rituximab: <a class=\"trial-link\" href=\"/evidence/#t-echelon-3\">ECHELON-3</a> prolonged overall survival at its interim analysis in patients after 2 or more lines ineligible for or pretreated with transplant and CAR T-cell therapy (median OS 13.8 vs 8.5 months, HR 0.63) (J Clin Oncol 2025;43:1061-1072).</li></ul>\n<h2 id=\"s-references\">References</h2>\n<ol class=\"refs\">\n<li><a class=\"trial-link\" href=\"/evidence/#t-esmo-lymphomas-guideline-eyre-et-al\">ESMO Lymphomas Guideline (Eyre et al.)</a>. <a href=\"https://drive.google.com/file/d/1dhfzxmsJLmACqXSRzV2P_-01T5EDGUaS/preview\">Ann Oncol 2025 (Journal Pre-proof, ANNONC 1872)</a>; <a href=\"https://drive.google.com/file/d/1f7teQkh8ToLNcnf8f9xULbcg1V2uu7oR/preview\">Ann Oncol 2015;26(Suppl 5):v116-v125</a>; <a href=\"https://drive.google.com/file/d/1OUuKKNI5X7QFMgm1VZOVlT_rJXN7zRL4/preview\">Ann Oncol 2018;29(Suppl 4):iv19-iv29</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-alizadeh-et-al-lymphochip\">Alizadeh et al. (Lymphochip)</a>. <a href=\"https://drive.google.com/file/d/1z99qmXgtmF0ZvntJYYJhsEuqKfiyGQDw/preview\">Nature 2000;403:503-511</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-lnh03-7b-r-minichop\">LNH03-7B (R-miniCHOP)</a>. <a href=\"https://drive.google.com/file/d/1BH0ZQ3WmmEHIPGV5svQVOxQ4D72cbbEa/preview\">Lancet Oncol 2011;12:460-468</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-mint\">MInT</a>. <a href=\"https://drive.google.com/file/d/1RrPO5TnkcqWhWL1Nv8a4ZqmW22RX-vK8/preview\">Lancet Oncol 2006;7:379-391</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-flyer\">FLYER</a>. <a href=\"https://drive.google.com/file/d/1xjPKfyK #t-polarix\">POLARIX</a>. <a href=\"https://drive.google.com/file/d/1hJYxz9xwVPsYBMdINOp6B_GmiH0WJ986/preview\">N Engl J Med 2022;386:351-363</a>; <a href=\"https://drive.google.com/file/d/1uiPwmISlI1KwIrLEvwi9DCLDWUklHOxh/preview\">J Clin Oncol 2025;43:3698-3705</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-frontmind\">frontMIND</a>. <a href=\"https://drive.google.com/file/d/1E6v9b2z0SI3lPrj4jHSQqrM2evCe7bpg/preview\">Lancet 2026;407:2528-2541</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-swog-9704\">SWOG 9704</a>. <a href=\"https://drive.google.com/file/d/1iMzKhCs_jZjMyvpxHQ9SMxjwoGsexmpY/preview\">N Engl J Med 2013;369:1681-1690</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-lewis-international-cns-prophylaxis-study-group\">Lewis (International CNS Prophylaxis Study Group)</a>. <a href=\"https://drive.google.com/file/d/1W2gl-l4GDvxL4HRPRevcdGyWC1C0xvFN/preview\">J Clin Oncol 2023;41:5376-5387</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-deb\">DEB</a>. <a href=\"https://drive.google.com/file/d/1pTNKAlos8C-kHcvlaJ_Wlw_gApTxhNoe/preview\">JAMA 2026;335:1684-1693</a>; <a href=\"https://pubmed.ncbi.nlm.nih.gov/30948276/\">Lancet Oncol 2019;20:649-662</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-scholar-1\">SCHOLAR-1</a>. <a href=\"https://drive.google.com/file/d/1FW7KjeGUae_OL6fim8RB6eSlEHkxD-Dl/preview\">Blood 2017;130:1800-1808</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-zuma-7\">ZUMA-7</a>. <a href=\"https://drive.google.com/file/d/1si-BL14FPWqP4zWcMZpXDksanSTCsb-9/preview\">N Engl J Med 2022;386:640-654</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-transform\">TRANSFORM</a>. <a href=\"https://drive.google.com/file/d/1xANS9KeQmBWdAb0SzTqLrNQ0mjrdWciM/preview\">Lancet 2022;399:2294-2308</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-belinda\">BELINDA</a>. <a href=\"https://drive.google.com/file/d/1sFZixPeh_aLmS2C126e4i0PlSsIMGuaP/preview\">N Engl J Med 2022;386:629-639</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-parma\">PARMA</a>. <a href=\"https://drive.google.com/file/d/1Nu6halwJie3uPpBbqM98-n2Rx5crEiGd/preview\">N Engl J Med 1995;333:1540-1545</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-coral\">CORAL</a>. <a href=\"https://drive.google.com/file/d/1MZlEdWxV8fMAQEJejPfdj47e6orXKkdw/preview\">J Clin Oncol 2010;28:4184-4190</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-ncic-ctg-ly-12\">NCIC-CTG LY.12</a>. <a href=\"https://drive.google.com/file/d/1qhnLqdlYDf5hb_zbaFSbjSsKmBBFZbfF/preview\">J Clin Oncol 2014;32:3490-3496</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-hovon-44\">HOVON 44</a>. <a href=\"https://drive.google.com/file/d/1RpZz6SfVqFV6jobGkwoIamS5dQ2mnzwO/preview\">Blood 2008;111:537-543</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-alycante\">ALYCANTE</a>. <a href=\"https://drive.google.com/file/d/1PkXt0fjQbCROVQbgFj0IZaiuIlDrCL34/preview\">Nat Med 2023;29:2593-2601</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-pilot\">PILOT</a>. <a href=\"https://drive.google.com/file/d/15G16iUCdzzvyJWnLBUIAv4cS1ZS-5-9I/preview\">Lancet Oncol 2022;23:1066-1077</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-zuma-1\">ZUMA-1</a>. <a href=\"https://drive.google.com/file/d/14SKgXHJRX4wrC47EinLo3wLca7RdG4Rp/preview\">N Engl J Med 2017;377:2531-2544</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-juliet\">JULIET</a>. <a href=\"https://drive.google.com/file/d/1dTTWEJ3uIhiD-1iqmezKDRceSVMDbJDG/preview\">N Engl J Med 2019;380:45-56</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-transcend-nhl-001\">TRANSCEND NHL 001</a>. <a href=\"https://drive.google.com/file/d/19CFGJZCr-lPQjpKnxHWeUOSEBv453NqG/preview\">Lancet 2020;396:839-852</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-starglo\">STARGLO</a>. <a href=\"https://drive.google.com/file/d/1C8qbDsXXp22nDPW5M6HmIeMfjHDRSp2g/preview\">Lancet 2024;404:1940-1954</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-sunmo\">SUNMO</a>. <a href=\"https://drive.google.com/file/d/1UNFsEUo5IvakrlH2hbJcGnRLLkzGZqJi/preview\">J Clin Oncol 2025;43:3799-3811</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-glofitamab-pivotal-np30179\">Glofitamab pivotal (NP30179)</a>. <a href=\"https://drive.google.com/file/d/1Dnx6QSnx5T9Rr0_pZXH4g76nufA6Zwbw/preview\">N Engl J Med 2022;387:2220-2231</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-epcore-nhl-1\">EPCORE NHL-1</a>. <a href=\"https://drive.google.com/file/d/16Tvp-GdrNZyK7E1Dh2Kd97LQQu7kR77r/preview\">J Clin Oncol 2023;41:2238-2247</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-elm-2\">ELM-2</a>. <a href=\"https://drive.google.com/file/d/1odJNFbvNgd6wiZ-GTgkTxDOHGlMJHTGH/preview\">Nat Cancer 2025;6:528-539</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-l-mind\">L-MIND</a>. <a href=\"https://drive.google.com/file/d/1AK68jLxTcHRdDRdLAF_009PqjDDl7dnk/preview\">Lancet Oncol 2020;21:978-988</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-re-mind2\">RE-MIND2</a>. <a href=\"https://drive.google.com/file/d/1du7TIUTzbZob8ljSKNGeCK0HHfR_7wgV/preview\">Clin Cancer Res 2022;28:4003-4017</a>; <a href=\"https://drive.google.com/file/d/1X2E4609S9rquWFsEWBg0kZ-SaZbmpwCg/preview\">Ann Hematol 2023;102:1773-1787</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-go29365\">GO29365</a>. <a href=\"https://drive.google.com/file/d/1deNDslz-qb2Ygrp67EuziwNTpmPrKJXm/preview\">J Clin Oncol 2020;38:155-165</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-polargo\">POLARGO</a>. <a href=\"https://drive.google.com/file/d/1ct0AsuZmxgbEmymgJ_2V7VugjLFwtj0A/preview\">J Clin Oncol 2026 (online ahead of print; JCO-25-02849)</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-lotis-2\">LOTIS-2</a>. <a href=\"https://drive.google.com/file/d/1MUk0Dd8OfpBA0twL1KuOL5_SP3LZguMF/preview\">Lancet Oncol 2021;22:790-800</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-echelon-3\">ECHELON-3</a>. <a href=\"https://drive.google.com/file/d/1uXEpYyVlvP8yUi9ycBvHz-RoLDZ7TpSj/preview\">J Clin Oncol 2025;43:1061-1072</a></li>\n</ol>", "_hay": "diffuse large b-cell lymphoma diffuse-large-b-cell-lymphoma lymphoma classification and cell of origin staging response assessment prognostic indices clinical presentation work-up tumour lysis syndrome limited-stage dlbcl (stage i–ii) r-chop delivery advanced-stage dlbcl (stage ii bulky to iv) cns prophylaxis radiotherapy for bulky disease dlbcl in older patients the anthracycline-unfit patient double-hit and double-expressor disease relapsed or refractory dlbcl references attempts to improve on r-chop pola-r-chp upfront transplant consolidation refractory disease and early relapse in fit patients late relapse in fit patients transplant-ineligible patients: car t-cell therapy bispecific antibodies other antibody-based options"}, {"id": "lymphoma-hodgkin-lymphoma", "slug": "hodgkin-lymphoma", "group": "Lymphoma", "title": "Hodgkin lymphoma", "updated": "", "sections": [{"id": "s-histopathology-and-classification", "h": "Histopathology and classification"}, {"id": "s-epidemiology-and-presentation", "h": "Epidemiology and presentation"}, {"id": "s-work-up", "h": "Work-up"}, {"id": "s-staging-and-risk-stratification", "h": "Staging and risk stratification"}, {"id": "s-early-stage-favourable-disease", "h": "Early-stage favourable disease"}, {"id": "s-early-stage-unfavourable-disease", "h": "Early-stage unfavourable disease"}, {"id": "s-advanced-stage-disease", "h": "Advanced-stage disease"}, {"id": "s-relapsed-and-refractory-disease", "h": "Relapsed and refractory disease"}, {"id": "s-hodgkin-lymphoma-in-pregnancy", "h": "Hodgkin lymphoma in pregnancy"}, {"id": "s-references", "h": "References"}], "html": "<h2 id=\"s-histopathology-and-classification\">Histopathology and classification</h2>\n<p>Hodgkin lymphoma divides into classical Hodgkin lymphoma and nodular lymphocyte-predominant Hodgkin lymphoma.</p>\n<p>Classical Hodgkin lymphoma is defined immunohistochemically by CD15 and CD30 positivity with CD45 and CD3 negativity.</p>\n<p>The malignant Hodgkin and Reed-Sternberg cells are clonal B cells that have lost the normal B-cell phenotype. A mature B cell lacking a B-cell receptor would ordinarily die by apoptosis, so Hodgkin and Reed-Sternberg cells depend on acquired survival mechanisms to persist. Associated factors:</p>\n<ul><li>Familial clustering: a 3- to 5-fold increase in risk with an affected relative.</li><li>Epstein-Barr virus, found in the majority of mixed-cellularity and lymphocyte-depleted subtypes.</li><li>HIV, commonly associated with the lymphocyte-depleted subtype and found in 15% of that subtype.</li><li>Immunosuppressed states generally.</li></ul>\n<h2 id=\"s-epidemiology-and-presentation\">Epidemiology and presentation</h2>\n<p>Hodgkin lymphoma has a bimodal age distribution, peaking in late adolescence and early adulthood and again beyond age 60. Classical Hodgkin lymphoma usually presents as asymptomatic lymphadenopathy, most often cervical, supraclavicular, axillary or inguinal, and spread is contiguous rather than the discontiguous pattern seen in diffuse large B-cell lymphoma. Presentation can also be an incidental mediastinal mass on imaging. B symptoms (fever, night sweats and weight loss) occur in about 40%. Bone marrow involvement is uncommon and is associated with advanced clinical stage, reported in up to 6.5% of newly diagnosed patients. Nodular lymphocyte-predominant Hodgkin lymphoma has a male predominance and typically presents in the 30-50 age group with cervical, axillary or inguinal lymphadenopathy. It runs an indolent course with a favourable prognosis, but carries a risk of transformation to large B-cell lymphoma.</p>\n<h2 id=\"s-work-up\">Work-up</h2>\n<ul><li>History: presence and chronicity of symptoms, personal history of a prior malignancy or immunosuppressive condition, and a 3-generation family history.</li><li>Examination: all accessible lymphoid tissue, and assessment for splenomegaly or hepatomegaly.</li><li>Laboratory: full blood count and erythrocyte sedimentation rate, liver and renal function and electrolytes, and HIV testing.</li><li>Imaging: PET-CT, which detects marrow and extranodal involvement effectively; a bone marrow aspirate and trephine is not routine and is reserved for unexplained cytopenias.</li><li>Tissue biopsy to identify Hodgkin and Reed-Sternberg cells, by excisional or incisional biopsy of a peripheral node or biopsy of a mediastinal mass.</li><li>Pre-treatment evaluation: cardiac function before doxorubicin, and pulmonary function testing with DLCO of 60% or above before bleomycin, whether given as ABVD or as part of BEACOPP.</li><li>Fertility: pregnancy testing and fertility preservation counselling where appropriate.</li></ul>\n<h2 id=\"s-staging-and-risk-stratification\">Staging and risk stratification</h2>\n<p>Staging follows the Lugano criteria, using Ann Arbor lymph node regions.</p>\n<ul><li>A/B denotes the absence or presence of B symptoms: fever, drenching night sweats, or significant unintentional weight loss.</li><li>E denotes extranodal extension contiguous with a nodal site that can be encompassed within a radiotherapy field appropriate to nodal disease of the same anatomical extent; extranodal disease beyond that is staged IV.</li><li>Bulky disease is a single nodal mass above 10 cm, or exceeding one-third of the transthoracic diameter.</li></ul>\n<p>Risk stratifies into early favourable, early unfavourable and advanced disease.</p>\n<p>Three classification systems exist: EORTC, GHSG and NCCN. The source notes standardise on GHSG. The GHSG risk factors distinguishing early favourable from early unfavourable disease are summarised by the mnemonic MEE3:</p>\n<ul><li>A large mediastinal mass.</li><li>Extranodal disease.</li><li>Erythrocyte sedimentation rate above 50 without B symptoms, or above 30 with B symptoms.</li><li>3 or more involved nodal areas, using GHSG areas rather than Ann Arbor regions.</li></ul>\n<p>In advanced disease, prognostication uses the International Prognostic Score. Overall survival falls as more of the following are present: serum albumin below 4 g/dL, haemoglobin below 10.5 g/dL, male sex, age above 45, stage IV disease, white cell count of 15,000/microlitre or above, and an absolute lymphocyte count below 600/microlitre or below 8% of the total white cell count. Interim and end-of-treatment PET response in Hodgkin lymphoma is read on the Deauville 5-point scale. A score of 3 sits at the boundary: it carries a good prognosis on standard treatment, but the de-escalation trials below more often treat it as an inadequate response and count it toward the positive group <a class=\"trial-link\" href=\"/evidence/#t-lugano-classification-cheson-et-al\">Lugano Classification (Cheson et al.)</a>. The exact cut-point used to define a negative interim scan therefore differs between the trials that follow, and each is stated where it matters to the result. Treatment is organised by 3 questions at each stage: what the standard of care is, whether it can be de-escalated, and whether a PET-adapted strategy applies.</p>\n<h2 id=\"s-early-stage-favourable-disease\">Early-stage favourable disease</h2>\n<p>Standard treatment is 2 cycles of ABVD followed by 20 Gy involved-field radiotherapy.</p>\n<ul><li>ABVD is given every 28 days, on days 1 and 15: doxorubicin 25 mg/m² over 3-5 minutes, bleomycin 10 units/m² over 10 minutes, vinblastine 6 mg/m² over 1 minute, dacarbazine 375 mg/m² over 30 minutes. The regimen is highly emetogenic and primary G-CSF prophylaxis is not indicated. Full blood count, renal and liver function and electrolytes are checked before each cycle, with monitoring for respiratory symptoms such as breathlessness, cough or fever.</li><li>Involved-field radiotherapy is 20 Gy over 2 to 4 weeks, usually starting 3 to 4 weeks after chemotherapy finishes.</li></ul>\n<p>Omitting radiotherapy increases relapse without changing overall survival, so chemotherapy alone is a reasonable option chosen on individual characteristics or treatment goals; for example a woman under 30 who would otherwise receive radiotherapy to the axilla or mediastinum, given the subsequent breast cancer risk, or a patient with pre-existing cardiovascular disease. <a class=\"trial-link\" href=\"/evidence/#t-ghsg-hd10\">GHSG HD10</a> set both the chemotherapy and radiotherapy dose for this group. It randomised 1,370 patients with untreated early favourable Hodgkin lymphoma in a 2x2 factorial of 4 versus 2 cycles of ABVD and 30 versus 20 Gy involved-field radiotherapy; 1,190 were analysed after exclusions, mostly incorrect initial staging. Against a 7-percentage-point non-inferiority margin on 5-year freedom from treatment failure, 2 cycles matched 4 (91.1% vs 93.0%; difference -1.9 points, 95% CI -5.2 to 1.4) and 20 Gy matched 30 Gy (92.9% vs 93.4%; -0.5 points, -3.6 to 2.6); the least intensive combination, 2 cycles plus 20 Gy, also stayed within the margin against 4 cycles plus 30 Gy (-1.6 points, -6.3 to 3.1). 5-year overall survival was about 97% in all 4 groups, while toxicity fell sharply with less treatment: grade 3 or 4 acute events in 33.2% with 2 cycles against 51.7% with 4, and 2.9% with 20 Gy against 8.7% with 30 Gy. 6 of the 7 deaths from first-line toxicity occurred with 4 cycles, though all 5 deaths from salvage toxicity followed 2 cycles (N Engl J Med 2010;363:640-652). This established 2 cycles of ABVD plus 20 Gy as standard for favourable early-stage disease. <a class=\"trial-link\" href=\"/evidence/#t-ghsg-hd13\">GHSG HD13</a> tested whether the chemotherapy backbone itself could be reduced further, and found it could not. It randomised 1,710 patients with the same population (early favourable classical or, in stage IB/IIA/IIB only, nodular lymphocyte-predominant disease) to 2 cycles of ABVD, ABV, AVD or AV, each followed by 30 Gy involved-field radiotherapy; 1,502 qualified for analysis. Both dacarbazine-omitted arms closed early for excess events and underperformed ABVD (5-year freedom from treatment failure 77.1% with AV against 92.3%, hazard ratio 2.57, 95% CI 1.51-4.40; 81.4% with ABV against 92.9%, hazard ratio 2.06, 1.21-3.52). The bleomycin-omitted arm, AVD, ran to completion and still fell short of the non-inferiority margin (89.2% against 93.1%; hazard ratio 1.50, 95% CI 1.00-2.26, upper bound above the 1.72 limit). Overall survival did not separate across the 4 groups, at 94-98% (Lancet 2015;385:1418-1427). Neither dacarbazine nor bleomycin can be dropped from ABVD in this population, and unmodified ABVD remains standard. <a class=\"trial-link\" href=\"/evidence/#t-ghsg-hd16\">GHSG HD16</a> tested whether radiotherapy could be dropped after a negative interim PET, and it could not. It randomised 1,150 patients with untreated stage I-II classical, or limited-stage nodular lymphocyte-predominant, Hodgkin lymphoma to 2 cycles of ABVD plus 20 Gy in everyone, or the same chemotherapy with 20 Gy withheld where the PET after cycle 2 was negative (Deauville 1-2) on central review; the primary comparison rests on the 628 PET-2-negative patients analysed per protocol. Omitting radiotherapy cost tumour control: 5-year progression-free survival was 86.1% without radiotherapy against 93.4% with it (difference -7.3 points, 95% CI -13.0 to -1.6; hazard ratio 1.78, interval reaching 3.12, above the 3.01 margin), driven by in-field recurrence (9% against 2%) rather than out-field recurrence (5% against 4%). Overall survival did not differ on the 12 deaths recorded, 98.4% against 98.1% at 5 years, and more deaths occurred in the arm with better tumour control (9 of 328 against 3 of 300) (J Clin Oncol 2019;37:2835-2845). <a class=\"trial-link\" href=\"/evidence/#t-ghsg-hd7\">GHSG HD7</a> is the historical trial that established combined-modality treatment over radiotherapy alone in this group. It randomised 650 patients with untreated favourable early-stage Hodgkin lymphoma, including nodular lymphocyte-predominant histology, to 2 cycles of ABVD before extended-field radiotherapy or extended-field radiotherapy alone. Adding chemotherapy improved disease control: 7-year freedom from treatment failure was 88% against 67%, a 21-point difference driven almost entirely by relapse (3.2% against 21.9%), without separating overall survival (94% against 92%); treatment-related deaths ran lower with chemotherapy added (2 against 7, most following the salvage that relapse required) (J Clin Oncol 2007;25:3495-3502). Surveillance after treatment: most relapses occur within the first 2 to 3 years. History and examination 3- to 6-monthly in years 1 to 2, 6- to 12-monthly in year 3, then annually; full blood count at each visit to screen for marrow dysfunction; and monitoring for treatment complications: second malignancies, pulmonary complications, and metabolic complications where the thyroid was irradiated.</p>\n<h2 id=\"s-early-stage-unfavourable-disease\">Early-stage unfavourable disease</h2>\n<p><a class=\"trial-link\" href=\"/evidence/#t-ghsg-hd8\">GHSG HD8</a> established the radiotherapy field used in this group. It randomised 1,204 patients with stage I-II disease and at least one risk factor, or stage IIIA with none, to 2 cycles of COPP plus ABVD followed by 30 Gy extended-field radiotherapy or 30 Gy involved-field radiotherapy, each with a 10 Gy boost to initial bulk; 1,064 were informative for efficacy. Involved-field matched extended-field on disease control (5-year freedom from treatment failure 84.2% against 85.8%, difference 1.6 points, upper 95% bound 5.9, inside the trial&#x27;s 8-point equivalence limit; 5-year overall survival 92.4% against 90.8%) while sharply reducing acute toxicity: nausea 29.1% against 62.5%, leukopenia 33.3% against 49.1%, thrombocytopenia 5.5% against 16.7% (J Clin Oncol 2003;21:3601-3608). Involved-field radiotherapy became the standard field on this result. Standard treatment is 4 cycles of ABVD plus 30 Gy involved-field radiotherapy, established by <a class=\"trial-link\" href=\"/evidence/#t-ghsg-hd11\">GHSG HD11</a>, with 2 cycles of escalated BEACOPP followed by 2 cycles of ABVD plus radiotherapy (HD14) as an alternative. Escalated BEACOPP is given every 21 days: bleomycin 10 mg/m² on day 8, etoposide 200 mg/m² on days 1-3, doxorubicin 35 mg/m² on day 1, cyclophosphamide 1,250 mg/m² on day 1, vincristine 1.4 mg/m² on day 8, procarbazine 100 mg/m² on days 1-7, prednisolone 40 mg/m² on days 1-14, with G-CSF from day 8. <a class=\"trial-link\" href=\"/evidence/#t-ghsg-hd11\">GHSG HD11</a> tested both the chemotherapy and the radiotherapy dose in this group. It randomised 1,570 patients with stage I-II disease and at least one GHSG risk factor to a 2x2 factorial of 4 cycles of ABVD or 4 cycles of baseline BEACOPP, each followed by 30 or 20 Gy involved-field radiotherapy; 1,395 qualified for the chemotherapy analysis and 1,351 for the radiotherapy analysis. At 30 Gy, baseline BEACOPP and ABVD did not differ (1.6 points, 95% CI -3.6 to 6.9); only at 20 Gy did BEACOPP separate, by 5.7 points (0.1 to 11.3). Dropping to 20 Gy after ABVD cost 4.7 points (-10.3 to 0.8), its bound outside the 7-point non-inferiority limit, so 20 Gy was not established there; after baseline BEACOPP the loss was only 0.8 points (-5.8 to 4.2) and 20 Gy was non-inferior. The interaction between the two questions was not demonstrated (P=0.16). 5-year overall survival was 94-95% across all 4 groups, while baseline BEACOPP cost more acute toxicity than ABVD (at least one grade 3 or 4 event in 73.8% against 51.5%) and 30 Gy more than 20 Gy (12.0% against 5.7%) (J Clin Oncol 2010;28:4199-4206). 4 cycles of ABVD plus 30 Gy remained the standard from this result. <a class=\"trial-link\" href=\"/evidence/#t-ghsg-hd14\">GHSG HD14</a> tested whether intensifying the first 2 cycles improves on that standard, and it does, at a toxicity cost. It randomised 1,655 patients with the same population to 2 cycles of escalated BEACOPP then 2 cycles of ABVD, or 4 cycles of ABVD, each followed by 30 Gy involved-field radiotherapy; 1,528 qualified for the primary analysis. 5-year freedom from treatment failure was 94.8% against 87.7% (difference 7.2 points, 95% CI 3.8 to 10.5; hazard ratio 0.44, 95% CI 0.30 to 0.66), reached early enough that randomisation stopped at the third of five planned interim analyses. Overall survival did not separate, at 97.0% at 5 years. At least one grade 3 or 4 event occurred in 87.1% against 50.7%, and a grade 4 event in 56.6% against 5.9% (J Clin Oncol 2012;30:907-913). Intensification with 2 cycles of escalated BEACOPP improved tumour control at the cost of markedly more acute haematological toxicity, without a shown survival gain. PET-adapted therapy is possible only from the intensified backbone. After 2 cycles of escalated BEACOPP then 2 cycles of ABVD, radiotherapy can be dropped if the PET after cycle 4 is negative (HD17). Starting from 4 cycles of ABVD, radiotherapy cannot be dropped even where the interim PET is negative, whether tested after cycle 3 (UK RAPID) or cycle 2 (EORTC H10). <a class=\"trial-link\" href=\"/evidence/#t-ghsg-hd17\">GHSG HD17</a> confirmed that radiotherapy can be omitted after a negative PET (Deauville 1-2) once the chemotherapy has been intensified. It randomised 1,100 patients with stage I-II disease and at least one risk factor to 2 cycles of escalated BEACOPP then 2 cycles of ABVD in both arms, followed by 30 Gy involved-field radiotherapy in everyone, or 30 Gy involved-node radiotherapy only where the PET after cycle 4 was positive; 905 formed the per-protocol population the verdict rests on. 5-year progression-free survival was 95.1% with PET-guided treatment against 97.3% with radiotherapy for all, a difference of 2.2 points whose upper bound of 5.3 stayed inside the 8-point margin, so non-inferiority was met; among the PET-negative patients alone, 95.9% against 97.7%. 5-year overall survival was 98.8% (Lancet Oncol 2021;22:223-234). Late toxicity, the reason to omit radiotherapy at all, was deferred to a later analysis and is not established by this report. <a class=\"trial-link\" href=\"/evidence/#t-uk-rapid\">UK RAPID</a> tested the same omission question after 3 cycles of unmodified ABVD, and could not establish it. Of 602 patients registered and started on ABVD, 571 were scanned after 3 cycles, 426 were PET-negative (Deauville 1-2) and 420 of those were randomised to 30 Gy involved-field radiotherapy or no further treatment; the 145 who were PET-positive received a fourth ABVD cycle plus radiotherapy without randomisation. 3-year progression-free survival was 90.8% without further treatment against 94.6% with radiotherapy, a difference of -3.8 points whose 95% interval reached -8.8, outside the 7-point margin; per protocol the gap widened to 90.8% against 97.1%. Overall survival did not separate in the other direction; 99.0% without radiotherapy against 97.1% with it, and of the 8 deaths in the radiotherapy arm 5 occurred in patients who never received it (N Engl J Med 2015;372:1598-1607). The result is a small loss of tumour control set against irradiating everyone, in a population whose 3-year survival exceeds 97% either way. <a class=\"trial-link\" href=\"/evidence/#t-eortc-lysa-fil-h10\">EORTC/LYSA/FIL H10</a> tested omission after 2 cycles of ABVD, in both a favourable and an unfavourable cohort, and also could not establish it, while its escalation arm succeeded. H10 defined PET negativity as Deauville 1-2 and positivity as Deauville 3-5.</p>\n<p>All 1,950 patients were randomised before any PET existed and were then adapted by the PET after cycle 2. In the favourable cohort, 5-year progression-free survival was 87.1% with ABVD alone against 99.0% with ABVD plus involved-node radiotherapy (hazard ratio 15.8, 95% CI 3.79 to 66.07); in the unfavourable cohort, 89.6% against 92.1% (hazard ratio 1.45, 0.84 to 2.50); both upper bounds exceeded their margins, so non-inferiority failed in each cohort. Where the interim PET was positive, escalating to 2 cycles of escalated BEACOPP raised 5-year progression-free survival from 77.4% to 90.6% (hazard ratio 0.42, 0.23 to 0.74); overall survival on ABVD with radiotherapy alone in that PET-positive group was the lowest in the trial at 89.3%, against 96.0% with escalated BEACOPP (hazard ratio 0.45, 95% CI 0.19 to 1.07, which the authors describe as a trend) (J Clin Oncol 2017;35:1786-1794). With longer follow-up, both the 10-year progression-free survival and overall survival differences in the PET-positive escalation comparison became statistically non-significant. Radiotherapy therefore cannot be safely omitted from an unfavourable early-stage regimen that starts with unmodified ABVD, whatever the interim PET shows; omission is only established after the intensified 2+2 escalated-BEACOPP-then-ABVD backbone with a negative PET at cycle 4. In H10&#x27;s PET-positive comparison, the 5-year progression-free-survival advantage with escalation was no longer statistically significant at 10 years; this loss of statistical significance does not establish equivalence or absence of benefit.</p>\n<h2 id=\"s-advanced-stage-disease\">Advanced-stage disease</h2>\n<p>Phase III-supported frontline regimens studied in advanced-stage Hodgkin lymphoma:</p>\n<div class=\"tblwrap\"><table><thead><tr><th scope=\"col\"></th><th scope=\"col\">BV-AVD</th><th scope=\"col\">ABVD</th><th scope=\"col\">Nivo-AVD</th><th scope=\"col\">BrECADD</th></tr></thead><tbody><tr><td>Supporting trial</td><td>ECHELON-1</td><td>ECHELON-1, RATHL</td><td>SWOG S1826</td><td>GHSG HD21</td></tr><tr><td>Schedule</td><td>6 cycles, every 28 days</td><td>6 cycles, every 28 days</td><td>6 cycles, every 28 days</td><td>every 21 days</td></tr><tr><td>Components (day 1 and 15 unless stated)</td><td>Brentuximab vedotin 1.2 mg/kg, doxorubicin 25 mg/m², vinblastine 6 mg/m², dacarbazine 375 mg/m²; G-CSF mandatory</td><td>Doxorubicin 25 mg/m², bleomycin 10 units/m², vinblastine 6 mg/m², dacarbazine 375 mg/m²</td><td>Nivolumab 240 mg, doxorubicin 25 mg/m², vinblastine 6 mg/m², dacarbazine 375 mg/m²; G-CSF optional</td><td>Brentuximab vedotin 1.8 mg/kg day 0, etoposide 150 mg/m² days 1-3, cyclophosphamide 1,250 mg/m² day 1, doxorubicin 40 mg/m² day 1, dacarbazine 250 mg/m² days 2-3, dexamethasone 40 mg days 1-4; G-CSF mandatory</td></tr></tbody></table></div>\n<p>Radiotherapy at the end of treatment is reserved for residual metabolically active lesions. Escalated BEACOPP established disease control superior to earlier regimens across GHSG HD9, HD12 and HD15, at the cost of more toxicity, both acute and late. ABVD itself was established as a frontline regimen by Canellos and colleagues (N Engl J Med 1992).</p>\n<p>Escalated BEACOPP improved disease control over the older COPP/ABVD regimen in HD9 at the expense of increased short- and long-term toxicity <a class=\"trial-link\" href=\"/evidence/#t-ghsg-hd9\">GHSG HD9</a>. <a class=\"trial-link\" href=\"/evidence/#t-ghsg-hd9\">GHSG HD9</a> established escalated BEACOPP&#x27;s advantage over the older COPP/ABVD regimen, an advantage that held to 10 years at the cost of secondary leukaemia. It randomised 1,282 patients with advanced or unfavourable intermediate-stage disease to 8 cycles of COPP/ABVD, baseline BEACOPP or escalated BEACOPP, with radiotherapy consolidating residual or initially bulky disease; COPP/ABVD closed early at the first interim analysis, leaving 261 patients against 469 and 466. At a median 111 months, freedom from treatment failure was 82% with escalated BEACOPP, 70% with baseline BEACOPP and 64% with COPP/ABVD, and overall survival 86%, 80% and 75% in the same order (escalated beating baseline BEACOPP on both, P&lt;.0001 and P=.0053). Secondary leukaemia or myelodysplasia tracked the dose: 10-year cumulative incidence 3.2%, 2.2% and 0.4% (P=.030), while overall second-malignancy incidence did not separate (P=.82) (N Engl J Med 2003;348:2386-2395). This 10-year analysis sat outside the trial&#x27;s prespecified schedule, so none of its comparisons is a protected result. <a class=\"trial-link\" href=\"/evidence/#t-ghsg-hd15\">GHSG HD15</a> then found that 6 cycles of escalated BEACOPP match 8 and cause less toxicity, becoming the investigators&#x27; preferred regimen. It randomised 2,182 patients with advanced-stage disease to 8 cycles of escalated BEACOPP, 6 cycles of escalated BEACOPP, or 8 cycles of BEACOPP-14, with radiotherapy by protocol confined to PET-positive residual masses of 2.5 cm or more. 5-year freedom from treatment failure was 89.3% with 6 cycles, 84.4% with 8 cycles and 85.4% with BEACOPP-14; both reduced-intensity arms met non-inferiority against 8 cycles of escalated BEACOPP on a hazard-ratio margin of 1.51, though superiority for 6 cycles over 8 was only descriptive, not a protected comparison. Toxicity favoured 6 cycles: treatment-related death 0.8% against 2.1%, secondary leukaemia or myelodysplasia 0.3% against 2.7% (P=0.0001); 5-year overall survival was 95.3% against 91.9% (difference 3.3 points, 97.5% CI 0.2 to 6.5). Confining radiotherapy to PET-positive residua reduced its use to 11%, with a negative predictive value of 94.1% (Lancet 2012;379:1791-1799). <a class=\"trial-link\" href=\"/evidence/#t-ghsg-hd18\">GHSG HD18</a> tested 2 further questions from a shared 2-cycle escalated-BEACOPP start, guided by interim PET, and answered one of them. It randomised 1,964 patients with advanced-stage disease: those PET-2-positive (Deauville 3-5) to 8 cycles of escalated BEACOPP with or without rituximab, and those PET-2-negative (Deauville 1-2) to 4 cycles total or 6-8 cycles. Adding rituximab after a positive interim PET made no difference (5-year progression-free survival 88.1% against 89.7%, hazard ratio 1.25, 95% CI 0.69-2.26, far short of the 15-point gain the trial was powered to detect). After a negative interim PET, cutting to 4 cycles held tumour control against 6-8 cycles (92.2% against 90.8%, difference 1.4 points, 95% CI -2.7 to 5.4, clearing the -6-point non-inferiority margin) while reducing harm; no treatment-related death against 6 of 504, severe infection 8% against 15% (Lancet 2017;390:2790-2802). 4 cycles of escalated BEACOPP after a negative interim PET is therefore sufficient in this setting. <a class=\"trial-link\" href=\"/evidence/#t-echelon-1\">ECHELON-1</a> replaced bleomycin with brentuximab vedotin in the AVD backbone. It randomised 1,334 patients with untreated stage III-IV disease to 6 cycles of brentuximab vedotin, doxorubicin, vinblastine and dacarbazine, or standard ABVD; primary G-CSF prophylaxis was recommended by amendment partway through enrolment. The primary endpoint, modified progression-free survival, which counts an incomplete response plus subsequent therapy as an event, favoured brentuximab vedotin (2-year rate 82.1% against 77.2%, hazard ratio 0.77, 95% CI 0.60-0.98, P=0.04). Interstitial lung disease fell from 7% to 2%, while peripheral neuropathy rose from 43% to 67%, grade 3 or worse from 2% to 11%, and febrile neutropenia from 8% to 19%; 7 of the 9 on-treatment deaths were neutropenia-associated, almost all occurring before G-CSF prophylaxis became routine (N Engl J Med 2018;378:331-344). A later interim survival analysis at a median 73 months showed the benefit converting to survival: 6-year overall survival 93.9% against 89.4%, hazard ratio 0.59 (95% CI 0.40-0.88), P=0.009 (N Engl J Med 2022;387:310-320). <a class=\"trial-link\" href=\"/evidence/#t-swog-s1826\">SWOG S1826</a> tested nivolumab in the same AVD backbone against brentuximab vedotin. It randomised 994 patients aged 12 or over with advanced-stage disease, 970 forming the efficacy cohort after 24 were found ineligible, to 6 cycles of nivolumab with AVD or brentuximab vedotin with AVD. The trial was reported early at a planned interim analysis (median follow-up 12.1 months): hazard ratio for progression or death 0.48 (99% CI 0.27-0.87), P=0.001, 1-year progression-free survival 94% against 86%. A later cut at a median 2.1 years gave 2-year progression-free survival 92% against 83% (hazard ratio 0.45, 95% CI 0.30-0.65). Overall survival remains immature and unproven, hazard ratio 0.39 (95% CI 0.15-1.03), an interval that crosses 1 (N Engl J Med 2024;391:1379-1389). In a planned subset of patients aged 60 or over, 3 of 50 died on nivolumab against 10 of 49 on brentuximab, with grade 3 or worse sepsis 6.1% against 21.3% (J Clin Oncol 2025;43:2968-2973); among 236 adolescents, 3-year progression-free survival was 93% against 82% (J Clin Oncol 2026;44:449-454). <a class=\"trial-link\" href=\"/evidence/#t-ghsg-hd21\">GHSG HD21</a> tested a further-modified brentuximab-containing regimen, BrECADD, against escalated BEACOPP, with treatment length set by interim PET (4 cycles if negative, 6 if positive) in both arms. It randomised 1,500 patients aged 18-60 with advanced-stage disease, 1,482 analysed, and met both co-primary endpoints: less treatment-related morbidity (42% against 59%, relative risk 0.72, 95% CI 0.65-0.80, P&lt;0.0001) and superior progression-free survival (4-year rate 94.3% against 90.9%, hazard ratio 0.66, 95% CI 0.45-0.97, P=0.035), with 4-year overall survival 98.6% against 98.2% and no treatment-related death on BrECADD against 3 on escalated BEACOPP. The toxicity advantage is haematological: grade 3 or worse anaemia 30% against 59% and thrombocytopenia 55% against 72%, while organ toxicity did not differ. Gonadal recovery was markedly better, 95.3% against 72.5% in women and 86.0% against 39.2% in men (Lancet 2024;404:341-352).</p>\n<p><a class=\"trial-link\" href=\"/evidence/#t-rathl\">RATHL</a> tested response-adapted de-escalation and escalation together from an ABVD start. It randomised 935 of 1,214 registered patients with advanced disease who were PET-negative after 2 cycles of ABVD (Deauville 1-3) to continue ABVD for cycles 3-6 or omit bleomycin (AVD) for those cycles; of the 182 PET-positive patients, 172 escalated to BEACOPP-14 or escalated BEACOPP without randomisation. Omitting bleomycin fell just short of the prespecified non-inferiority margin: 3-year progression-free survival 85.7% continuing ABVD against 84.4% with AVD, difference 1.6 points (95% CI -3.2 to 5.3, upper bound above the 5-point margin), hazard ratio 1.13 (95% CI 0.81-1.57); 3-year overall survival was 97.2% and 97.6%. Pulmonary harm was lower with AVD: grade 3 or 4 pulmonary events 1% against 3%, and carbon monoxide diffusing capacity fell less. Escalating the interim-PET-positive patients to BEACOPP gave 3-year progression-free survival of 67.5% and overall survival of 87.8% (N Engl J Med 2016;374:2419-2429). With follow-up extended to a median 7.3 years, the non-inferiority interval for AVD narrowed to fall within the margin. Where escalation from ABVD to BEACOPP after a positive interim PET has been tested without a randomised ABVD comparator, results are numerically similar across trials:</p>\n<div class=\"tblwrap\"><table><thead><tr><th scope=\"col\">Trial</th><th scope=\"col\">Escalation regimen</th><th scope=\"col\">Consolidative RT</th><th scope=\"col\">PET-2-positive definition</th><th scope=\"col\">Overall survival</th><th scope=\"col\">Progression-free survival</th></tr></thead><tbody><tr><td>RATHL</td><td>BEACOPP-14 or escalated BEACOPP, per treating centre</td><td>Not recommended</td><td>Deauville 4-5</td><td>7-year 83.2%</td><td>7-year 65.9%</td></tr><tr><td>SWOG 0816</td><td>Escalated BEACOPP</td><td>None</td><td>Deauville 4-5</td><td>5-year 86%</td><td>5-year 66%</td></tr><tr><td>GITIL HD0607</td><td>Escalated BEACOPP, with or without rituximab (randomised)</td><td>—</td><td>Deauville 4-5</td><td>3-year 89% vs 90% (not significant)</td><td>3-year 63% vs 57% (not significant)</td></tr></tbody></table></div>\n<p>The 6-year overall survival and progression-free survival in ECHELON-1&#x27;s PET-2-positive patients, 95% and 61%, are numerically superior to the 7-year figures on RATHL&#x27;s escalation strategy above, though the comparison is across trials rather than within one. GITIL HD0607 did not show an improvement in 6-year progression-free survival with consolidative radiotherapy among patients with a complete metabolic response on both interim and end-of-treatment PET. The trial randomised 296 patients with advanced-stage disease and a large nodal mass of 5 cm or more at baseline, PET-negative after both cycle 2 and the end of ABVD, to consolidative radiotherapy or no further treatment; 6-year progression-free survival was 91% against 95% for 5-7 cm (P=0.62), 98% against 90% for 8-10 cm (P=0.24), and 89% against 86% above 10 cm (P=0.53) (J Clin Oncol 2020). Trial evidence relevant to regimen selection:</p>\n<ul><li>ECHELON-1 showed progression-free and overall-survival benefit with brentuximab vedotin plus AVD over ABVD; patients with pre-existing sensory or motor neuropathy were excluded.</li><li>S1826 showed a progression-free-survival benefit with nivolumab plus AVD over brentuximab vedotin plus AVD; overall survival remains immature and unproven. Active autoimmune disease was an exclusion criterion, not an absolute contraindication established by the trial.</li><li>RATHL studied bleomycin omission after a negative interim PET; escalation of PET-positive patients had no randomised ABVD comparator.</li><li>HD21 showed better progression-free survival and less treatment-related morbidity with PET-adapted BrECADD than with PET-adapted escalated BEACOPP.</li><li>HD0607 did not show a progression-free-survival improvement from consolidative radiotherapy after negative interim and end-of-treatment PET scans.</li></ul>\n<h2 id=\"s-relapsed-and-refractory-disease\">Relapsed and refractory disease</h2>\n<p>Relapse is recurrence after a previously achieved complete response; refractory disease is failure to achieve an initial complete or partial response. The approach is to confirm the diagnosis by biopsy, restage the disease, then give salvage chemotherapy, with or without radiotherapy, followed by autologous haematopoietic cell transplantation. Salvage chemotherapy options include ICE (ifosfamide, carboplatin, etoposide), GVD (gemcitabine, vinorelbine, liposomal doxorubicin), GDP (gemcitabine, dexamethasone, cisplatin) and DHAP (dexamethasone, cytarabine, cisplatin). <a class=\"trial-link\" href=\"/evidence/#t-ghsg-ebmt-hd-r1\">GHSG/EBMT HD-R1</a> established high-dose chemotherapy with autologous transplant as standard salvage in chemosensitive relapse. It randomised patients with Hodgkin lymphoma relapsed after chemotherapy for advanced disease, aged 16-60, to 2 further cycles of Dexa-BEAM (4 cycles total) or 2 cycles of Dexa-BEAM followed by high-dose BEAM with autologous stem-cell transplant; of 161 enrolled, results apply to the 117 who proved chemosensitive after 2 induction cycles and proceeded to the assigned arms. Transplant improved disease control without a shown survival benefit: 3-year freedom from treatment failure 55% against 34% with continued Dexa-BEAM (P=0.019), while 3-year overall survival did not differ (71% against 65%, P=0.331), in a trial stopped early for slow accrual at 117 of a planned 150 chemosensitive patients. The advantage held in early first relapse (41% against 12%) and late first relapse (75% against 44%), but not in multiple relapse (34% against 44%). Most toxic deaths fell on the shared induction: the 2 Dexa-BEAM cycles every patient received caused 8 treatment-related deaths. After that, 5 of 56 (9%) died early on further Dexa-BEAM against 1 of 61 (2%) after transplant (Lancet 2002;359:2065-2071). <a class=\"trial-link\" href=\"/evidence/#t-brentuximab-vedotin-pivotal\">Brentuximab vedotin (pivotal)</a> established the drug&#x27;s activity after transplant has failed. In a single-arm phase II study of 102 patients with CD30-positive relapsed or refractory disease after high-dose chemotherapy and autologous transplant, median 3.5 prior regimens, brentuximab vedotin 1.8 mg/kg every 3 weeks gave an objective response rate of 75% (95% CI 64.9-82.6) on independent review, with a complete response in 34%. Median progression-free survival was 5.6 months overall but 21.7 months in complete remitters, whose median response duration reached 20.5 months; median overall survival was 22.4 months. Peripheral sensory neuropathy dominated toxicity: 42% any grade, 8% grade 3, none grade 4, cumulative and dose-related; it resolved or improved in 80% (J Clin Oncol 2012;30:2183-2189). <a class=\"trial-link\" href=\"/evidence/#t-aethera\">AETHERA</a> tested brentuximab vedotin as consolidation after transplant, in patients at high risk of progression. It randomised 329 patients 30-45 days after autologous transplant for relapsed or primary refractory disease, with at least one risk factor for post-transplant progression, to 16 cycles of brentuximab vedotin or placebo. Consolidation delayed progression without a shown survival benefit: median progression-free survival 42.9 against 24.1 months on independent review (hazard ratio 0.57, 95% CI 0.40-0.81, P=0.0013), 2-year rate 63% against 51%. Overall survival did not differ at the prespecified interim analysis (hazard ratio 1.15, 95% CI 0.67-1.97, P=0.6204), confounded by crossover: 85% of the placebo group received brentuximab vedotin after progression against 18% of the treated group. Peripheral neuropathy occurred in 67% (13% grade 3, none grade 4), resolving or improving in 85% (Lancet 2015;385:1853-1862). <a class=\"trial-link\" href=\"/evidence/#t-checkmate-205\">CheckMate 205</a> established nivolumab&#x27;s activity after both transplant and brentuximab vedotin have failed. In a single-arm cohort of 80 patients progressing after autologous transplant then brentuximab vedotin given in that order, nivolumab 3 mg/kg every 2 weeks gave an objective response rate of 66.3% (95% CI 54.8-76.4) on independent review, with a complete response in 9% and partial response in 58%; investigator scoring gave a higher rate (72.5% objective response, 28% complete response), and central review downgraded 13 of 19 investigator-assessed complete responses. Median response duration was 7.8 months and median progression-free survival 10.0 months, with 6-month overall survival of 98.7% (Lancet Oncol 2016;17:1283-1294). <a class=\"trial-link\" href=\"/evidence/#t-keynote-204\">KEYNOTE-204</a> compared pembrolizumab directly with brentuximab vedotin in relapsed or refractory disease, second line or later. It randomised 304 patients (either post-autologous-transplant or judged transplant-ineligible) to pembrolizumab 200 mg every 3 weeks or brentuximab vedotin 1.8 mg/kg every 3 weeks, each for up to 35 cycles. Pembrolizumab improved progression-free survival on central review (median 13.2 against 8.3 months, hazard ratio 0.65, 95% CI 0.48-0.88, P=0.0027), with objective response 65.6% against 54.2%. Overall survival, a co-primary endpoint, was not analysed at this interim cut. Only 37% of patients had had a prior autologous transplant; the progression-free survival advantage was clearest in those never transplanted (hazard ratio 0.61, 95% CI 0.42-0.89) and did not separate in the previously transplanted (hazard ratio 0.72, 95% CI 0.42-1.23), with no interaction test reported. The toxicities differ in kind: any-grade immune-mediated events 33% against 7%, including pneumonitis 11% against 3%; brentuximab vedotin gave treatment-related peripheral neuropathy in 15% grade 1-2 and 3% grade 3 (Lancet Oncol 2021;22:512-524).</p>\n<h2 id=\"s-hodgkin-lymphoma-in-pregnancy\">Hodgkin lymphoma in pregnancy</h2>\n<p>Hodgkin lymphoma diagnosed during pregnancy is a high-risk pregnancy requiring a multidisciplinary approach involving maternal-fetal medicine, obstetrics or gynaecology, and pharmacy, to protect both maternal and fetal wellbeing. Pre-treatment imaging uses MRI of the chest, abdomen and pelvis rather than PET-CT, to avoid the teratogenic and growth-retarding effects of ionising radiation on the fetus. Treatment options depend on trimester:</p>\n<ul><li>First trimester: elective termination is an option, because embryogenesis in the first trimester is particularly vulnerable to the effects of chemotherapy and radiation.</li><li>Second trimester: ABVD may be given after the first trimester. Pregnancy experience with brentuximab vedotin and nivolumab remains limited.</li><li>Third trimester: delivery is planned as close to full term as possible, and chemotherapy is withheld within 3 weeks of delivery to avoid cytopenias complicating the delivery.</li></ul>\n<h2 id=\"s-references\">References</h2>\n<ol class=\"refs\">\n<li><a class=\"trial-link\" href=\"/evidence/#t-lugano-classification-cheson-et-al\">Lugano Classification (Cheson et al.)</a>. <a href=\"https://drive.google.com/file/d/1I3r0lIc2JGmEjbsCRgiyEAUK9YhoO8Uy/preview\">J Clin Oncol 2014;32:3059-3067</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-ghsg-hd10\">GHSG HD10</a>. <a href=\"https://drive.google.com/file/d/1TyJJpDp5otbXrt-2RZU6f77YmAhLED9I/preview\">N Engl J Med 2010;363:640-652</a>; <a href=\"https://drive.google.com/file/d/1IaW1NnRE7S7zlQVvhasMqWIWhC7WveOh/preview\">J Clin Oncol 2017;35:1999-2007</a>; <a href=\"https://drive.google.com/file/d/1reOYuWOR_Cnhvru8VZc2dopYyJ1DiMqg/preview\">J Clin Oncol 2017;35:1444-1450</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-ghsg-hd13\">GHSG HD13</a>. <a href=\"https://drive.google.com/file/d/16XtEuf4OdfDAqo4KhJF6gQyqYa4E1lSJ/preview\">Lancet 2015;385:1418-1427</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-ghsg-hd16\">GHSG HD16</a>. <a href=\"https://drive.google.com/file/d/1oO-Z_bQY7DyBG1akatjwbF4BdNWc7AsG/preview\">J Clin Oncol 2019;37:2835-2845</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-ghsg-hd7\">GHSG HD7</a>. <a href=\"https://drive.google.com/file/d/1as8B06fbc6DQry56BYJ3MTHdv7SwA70k/preview\">J Clin Oncol 2007;25:3495-3502</a>; <a href=\"https://drive.google.com/file/d/1IaW1NnRE7S7zlQVvhasMqWIWhC7WveOh/preview\">J Clin Oncol 2017;35:1999-2007</a>; <a href=\"https://drive.google.com/file/d/1reOYuWOR_Cnhvru8VZc2dopYyJ1DiMqg/preview\">J Clin Oncol 2017;35:1444-1450</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-ghsg-hd8\">GHSG HD8</a>. <a href=\"https://drive.google.com/file/d/10wyPDPGJul1NTgeT7idrXOYsA1LNrTEC/preview\">J Clin Oncol 2003;21:3601-3608</a>; <a href=\"https://drive.google.com/file/d/1IaW1NnRE7S7zlQVvhasMqWIWhC7WveOh/preview\">J Clin Oncol 2017;35:1999-2007</a>; <a href=\"https://drive.google.com/file/d/1reOYuWOR_Cnhvru8VZc2dopYyJ1DiMqg/preview\">J Clin Oncol 2017;35:1444-1450</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-ghsg-hd11\">GHSG HD11</a>. <a href=\"https://drive.google.com/file/d/1c1ns_0bUVAQIyKgvRFyAzIgBrvlegxHF/preview\">J Clin Oncol 2010;28:4199-4206</a>; <a href=\"https://drive.google.com/file/d/1IaW1NnRE7S7zlQVvhasMqWIWhC7WveOh/preview\">J Clin Oncol 2017;35:1999-2007</a>; <a href=\"https://drive.google.com/file/d/1reOYuWOR_Cnhvru8VZc2dopYyJ1DiMqg/preview\">J Clin Oncol 2017;35:1444-1450</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-ghsg-hd14\">GHSG HD14</a>. <a href=\"https://drive.google.com/file/d/1gBCq2dgmkKrwn0yWOFX8PBDU6r4oQMZo/preview\">J Clin Oncol 2012;30:907-913</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-ghsg-hd17\">GHSG HD17</a>. <a href=\"https://drive.google.com/file/d/1wrjg6i5CUY73KjagwH9SpXKragLMYepI/preview\">Lancet Oncol 2021;22:223-234</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-uk-rapid\">UK RAPID</a>. <a href=\"https://drive.google.com/file/d/1Kb9FwK2eWGhoGvx72KJrmR157nrLu2XT/preview\">N Engl J Med 2015;372:1598-1607</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-eortc-lysa-fil-h10\">EORTC/LYSA/FIL H10</a>. <a href=\"https://drive.google.com/file/d/1pb8rK01SFe0PQbpSDbA22WYrusqvajyB/preview\">J Clin Oncol 2017;35:1786-1794</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-ghsg-hd9\">GHSG HD9</a>. <a href=\"https://drive.google.com/file/d/1F2rZ5wsZmYTZtK5xWHJ1h9lWlOp8lSTx/preview\">N Engl J Med 2003;348:2386-2395</a>; <a href=\"https://drive.google.com/file/d/1_1oeAJ048icSVh9vLaMf8efhBJ04T0g5/preview\">J Clin Oncol 2009;27:4548-4554</a>; <a href=\"https://drive.google.com/file/d/1reOYuWOR_Cnhvru8VZc2dopYyJ1DiMqg/preview\">J Clin Oncol 2017;35:1444-1450</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-ghsg-hd15\">GHSG HD15</a>. <a href=\"https://drive.google.com/file/d/1sIPzbSKVcJXDu9ny-7QUynesINqwui-n/preview\">Lancet 2012;379:1791-1799</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-ghsg-hd18\">GHSG HD18</a>. <a href=\"https://drive.google.com/file/d/1LEETGaKsdH0SekHxdCxu3OpU9v-_g8h0/preview\">Lancet 2017;390:2790-2802</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-echelon-1\">ECHELON-1</a>. <a href=\"https://drive.google.com/file/d/1yLWXo_ZpdGAAf_60WNvdPICKyWoyjUnJ/preview\">N Engl J Med 2018;378:331-344</a>; <a href=\"https://drive.google.com/file/d/1XTFglOwyFzNJrjJAURGT4ehD9ZbATvrS/preview\">N Engl J Med 2022;387:310-320</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-swog-s1826\">SWOG S1826</a>. <a href=\"https://drive.google.com/file/d/1n2fPRjjIYa2KSIHmUiUSx11OSlVFhhHO/preview\">N Engl J Med 2024;391:1379-1389</a>; <a href=\"https://drive.google.com/file/d/179PXpLZHmSYG9FWtuu5NwJPljen9PYQb/preview\">J Clin Oncol 2025;43:2968-2973</a>; <a href=\"https://drive.google.com/file/d/1GgbWXlo--5KfP-czWIW4atqpxjDJTBJ2/preview\">J Clin Oncol 2026;44:449-454</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-ghsg-hd21\">GHSG HD21</a>. <a href=\"https://drive.google.com/file/d/18J8zFmcCuClm7H32GJNFyVbZBfcXiYly/preview\">Lancet 2024;404:341-352</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-rathl\">RATHL</a>. <a href=\"https://drive.google.com/file/d/15TIdpikZZIdhJiKZH_SP13seFG9qDqNz/preview\">N Engl J Med 2016;374:2419-2429</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-ghsg-ebmt-hd-r1\">GHSG/EBMT HD-R1</a>. <a href=\"https://drive.google.com/file/d/1SfKKqCsRbTWEqABjFNq_zzKw1qteEjKz/preview\">Lancet 2002;359:2065-2071</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-brentuximab-vedotin-pivotal\">Brentuximab vedotin (pivotal)</a>. <a href=\"https://drive.google.com/file/d/1MEqCetp6qmXNSk1MTX3EyK2_0yc_Rvhr/preview\">J Clin Oncol 2012;30:2183-2189</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-aethera\">AETHERA</a>. <a href=\"https://drive.google.com/file/d/1-OBMhwZZputDbCh-549GpSu5tMHxvS25/preview\">Lancet 2015;385:1853-1862</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-checkmate-205\">CheckMate 205</a>. <a href=\"https://drive.google.com/file/d/1M7j-6UJ6ZDGoN_xEncFvellmufnrwTYv/preview\">Lancet Oncol 2016;17:1283-1294</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-keynote-204\">KEYNOTE-204</a>. <a href=\"https://drive.google.com/file/d/1llpjtNTnDBWLgNRi5PvQSYwO1yT81R52/preview\">Lancet Oncol 2021;22:512-524</a></li>\n</ol>", "_hay": "hodgkin lymphoma hodgkin-lymphoma lymphoma histopathology and classification epidemiology and presentation work-up staging and risk stratification early-stage favourable disease early-stage unfavourable disease advanced-stage disease relapsed and refractory disease hodgkin lymphoma in pregnancy references"}, {"id": "lymphoma-indolent-non-hodgkin-lymphomas", "slug": "indolent-non-hodgkin-lymphomas", "group": "Lymphoma", "title": "Indolent non-Hodgkin lymphomas", "updated": "", "sections": [{"id": "s-follicular-lymphoma-biology-and-classification", "h": "Follicular lymphoma: biology and classification"}, {"id": "s-clinical-features", "h": "Clinical features"}, {"id": "s-diagnosis-and-staging", "h": "Diagnosis and staging"}, {"id": "s-prognostication", "h": "Prognostication"}, {"id": "s-stage-i-ii-disease", "h": "Stage I–II disease"}, {"id": "s-advanced-stage-disease-with-low-tumour-burden", "h": "Advanced-stage disease with low tumour burden"}, {"id": "s-advanced-stage-disease-with-high-tumour-burden", "h": "Advanced-stage disease with high tumour burden"}, {"id": "s-maintenance-after-frontline-therapy", "h": "Maintenance after frontline therapy"}, {"id": "s-relapsed-disease", "h": "Relapsed disease"}, {"id": "s-marginal-zone-lymphoma", "h": "Marginal zone lymphoma"}, {"id": "s-references", "h": "References"}], "html": "<h2 id=\"s-follicular-lymphoma-biology-and-classification\">Follicular lymphoma: biology and classification</h2>\n<p>Follicular lymphoma is the second most common non-Hodgkin lymphoma and the most common indolent subtype; median age at diagnosis is 65. It is the malignant counterpart of the germinal-centre B cell. 85% of cases carry t(14;18), which juxtaposes the <em>BCL2</em> gene with the regulatory elements of the immunoglobulin heavy-chain gene, causing overexpression of BCL2, an oncogene with anti-apoptotic function. Grading sets the treatment path:</p>\n<ul><li>Grade 1–3A is treated as indolent lymphoma.</li><li>Grade 3B is treated as high-grade lymphoma.</li></ul>\n<p>The WHO 5th edition names the same split: grade 1–3A is classic follicular lymphoma, and grade 3B is follicular large B-cell lymphoma.</p>\n<h2 id=\"s-clinical-features\">Clinical features</h2>\n<ul><li>Asymptomatic lymphadenopathy is the most common presentation.</li><li>20% present with B symptoms.</li><li>Bone marrow involvement is present in more than 70%.</li><li>Spontaneous regression of disease is seen in 20%.</li><li>The risk of histologic transformation is 2–3% a year.</li></ul>\n<h2 id=\"s-diagnosis-and-staging\">Diagnosis and staging</h2>\n<p>Diagnosis is by excisional tissue biopsy. Bone marrow aspirate and trephine biopsy are performed, because a high proportion of patients have marrow involvement. Staging follows the standard approach for non-Hodgkin lymphoma, with PET-CT recommended. Laboratory work-up includes beta-2 microglobulin, which enters the PRIMA-PI.</p>\n<h2 id=\"s-prognostication\">Prognostication</h2>\n<p>FLIPI counts five risk factors: age over 60, stage III or IV, haemoglobin below 12 g/dL, more than 4 nodal areas, and LDH above the upper limit of normal. Outcomes by risk group:</p>\n<ul><li>Low risk (0–1 factors): median PFS 84 months, 2-year OS 98%.</li><li>Intermediate risk (2 factors): median PFS 70 months, 2-year OS 94%.</li><li>High risk (3–5 factors): median PFS 42 months, 2-year OS 87%.</li></ul>\n<p>PRIMA-PI is built on beta-2 microglobulin and the presence or absence of bone marrow involvement.</p>\n<h2 id=\"s-stage-i-ii-disease\">Stage I–II disease</h2>\n<p>Involved-site radiotherapy is generally the treatment of choice: approximately half of patients with stage I disease are cured with radiotherapy alone, and 10-year overall survival is 60–80%. The dose is 24 Gy in 12 fractions. In the FoRT non-inferiority trial, the lower dose of 4 Gy in 2 fractions carried a higher local progression rate, though it was less toxic; it can still be used where side effects must be minimised, for example over the lacrimal or parotid gland. Higher doses of 40–45 Gy gave no benefit in response, progression-free or overall survival, with a trend to more toxicity (Lowry et al, phase 3). Watch-and-wait is suitable where significant morbidity is expected from radiotherapy because of tumour location, or where the patient declines it. In a retrospective series of 43 patients with stage I–II disease, 63% had not been treated at a median follow-up of 7.2 years (Advani et al, J Clin Oncol 2004). Rituximab monotherapy is an alternative. Adding systemic therapy to radiotherapy improves progression-free but not overall survival. <a class=\"trial-link\" href=\"/evidence/#t-trog-99-03\">TROG 99.03</a> randomised 150 patients with treatment-naive stage I–II grade 1–3a follicular lymphoma to involved-field radiotherapy 30–36 Gy alone or followed by six cycles of CVP, with rituximab joining the systemic arm from a 2006 amendment. Systemic therapy improved 10-year progression-free survival (59% vs 41%; HR 0.57, 95% CI 0.33 to 0.95) without an overall survival difference (10-year 95% vs 86%; HR 0.62) or a reduction in transformation (4 vs 10 per arm) (J Clin Oncol 2018;36:2918-2925). Only 2 of 148 irradiated patients had isolated in-field progression, so radiotherapy controlled local disease and the systemic gain lay in preventing distant relapse. The apparently larger effect in the rituximab era (HR 0.26, 95% CI 0.07 to 0.97) is post hoc and rests on few events.</p>\n<h2 id=\"s-advanced-stage-disease-with-low-tumour-burden\">Advanced-stage disease with low tumour burden</h2>\n<p>Tumour burden is determined by the GELF criteria.</p>\n<p>Watchful waiting remains a reasonable option for asymptomatic patients with low tumour burden: history, examination and laboratory review every 3 months for the first year, then every 3–6 months until progressive disease is noted. The alternative is single-agent rituximab, which delays progression and postpones cytotoxic chemotherapy without affecting overall survival, and imposes the risks of immunosuppression. In selected patients, induction rituximab followed by retreatment at relapse can be considered. Across its two protocol eras, <a class=\"trial-link\" href=\"/evidence/#t-ardeshna-ncri\">Ardeshna (NCRI)</a> randomised 463 patients with asymptomatic, low-tumour-burden stage II–IV grade 1–3a follicular lymphoma. The original three-arm cohort contained 252 patients; after the induction-only arm closed, the amended maintenance-versus-watch-and-wait analysis contained 379 patients (192 vs 187). Rituximab induction was 375 mg/m² weekly for 4 weeks, with maintenance every 2 months for 2 years. At 3 years, 88% on maintenance versus 46% on watch-and-wait had not started new therapy (HR 0.21, 95% CI 0.14 to 0.31). The quality-of-life co-primary endpoint was not met, though mental adjustment to cancer favoured rituximab (p=0.0004); overall survival showed no difference at 28 deaths. In the underpowered three-arm cohort, time to new treatment did not differ statistically between maintenance and induction alone (HR 0.75, 95% CI 0.41 to 1.34; p=0.33). In a post-hoc analysis, maintenance improved progression-free survival (HR 0.53, 95% CI 0.32 to 0.87; p=0.011) (Lancet Oncol 2014;15:424-435). At 15 years, median time to new treatment was not reached with maintenance versus 14.8 years with induction and 5.6 years with watch-and-wait, and 15-year overall survival was 73%, 66% and 68% (Lancet Haematol 2025). If rituximab is used, retreatment at progression matches maintenance. In RESORT, patients with low-tumour-burden stage III–IV grade 1–2 disease responding to induction rituximab (375 mg/m² weekly for 4 weeks) were randomised to retreatment at progression or maintenance every 13 weeks, each until treatment failure; median time to treatment failure (3.9 vs 4.3 years) and overall survival (5-year 94% in both arms) did not differ (J Clin Oncol 2014).</p>\n<h2 id=\"s-advanced-stage-disease-with-high-tumour-burden\">Advanced-stage disease with high tumour burden</h2>\n<p>Induction is chosen on the risk of aggressive biology:</p>\n<ul><li>Suspected histologic transformation, clinically aggressive disease, or grade 3B: R-CHOP, treating as for DLBCL.</li><li>Otherwise: rituximab with bendamustine or with lenalidomide, which preserves R-CHOP for use at histologic transformation.</li></ul>\n<p>Prophylactic antiviral medication is strongly recommended for up to 2 years beyond the last rituximab exposure.</p>\n<h3>Rituximab plus chemotherapy</h3>\n<p>Adding rituximab to chemotherapy improved response, progression-free and overall survival in the frontline trials. <a class=\"trial-link\" href=\"/evidence/#t-glsg-hiddemann\">GLSG (Hiddemann)</a> randomised 630 patients with previously untreated stage III–IV grade 1–2 follicular lymphoma requiring treatment. This early report analysed the 428 patients with completed initial-therapy documentation (223 R-CHOP, 205 CHOP). Rituximab cut treatment failure by 60% (28 of 223 vs 61 of 205 failures, p&lt;0.001), raised response (96% vs 90%), and gave fewer deaths within 3 years (6 vs 17, p=0.016), though at a median follow-up of 18 months these are early estimates (Blood 2005;106:3725-3732). R-CVP, the anthracycline-free option, is inferior to R-CHOP on progression-free survival with similar overall survival. <a class=\"trial-link\" href=\"/evidence/#t-foll05-fil\">FOLL05 (FIL)</a> compared R-CVP, R-CHOP and R-FM: 3-year time to treatment failure was 46%, 62% and 59%, R-CHOP and R-FM each superior to R-CVP (HR 0.62 and 0.63) with no difference between them, and 3-year overall survival was 95% for the whole series with no between-arm comparison made. R-FM carried the worst toxicity, including grade 3–4 neutropenia in 64% and 14 of the 23 second malignancies, so R-CHOP had the better risk-benefit balance and became the preferred chemotherapy backbone (J Clin Oncol 2013;31:1506-1513).</p>\n<h3>Bendamustine-rituximab</h3>\n<p>Bendamustine is an alkylating agent given at 90 mg/m² on days 1–2 every 28 days. It is myelosuppressive and causes prolonged lymphopenia, so extended varicella-zoster and Pneumocystis prophylaxis should be considered. <a class=\"trial-link\" href=\"/evidence/#t-stil-nhl1-rummel\">StiL NHL1 (Rummel)</a> randomised 549 patients with treatment-naive stage III–IV indolent lymphoma, including grade 1–2 follicular lymphoma, or mantle-cell lymphoma to up to six cycles of bendamustine-rituximab or R-CHOP, designed as a non-inferiority comparison. Bendamustine-rituximab more than doubled median progression-free survival (69.5 vs 31.2 months; HR 0.58, 95% CI 0.44 to 0.74, per protocol on 514 of 549) with no overall survival difference (43 vs 45 deaths), and was better tolerated: less grade 3–4 neutropenia (29% vs 69%) and, at any grade, no alopecia, fewer infectious episodes (37% vs 50%) and less paraesthesia (7% vs 29%), against more grade 3–4 lymphocytopenia (74% vs 43%) and more any-grade skin reactions (Lancet 2013;381:1203-1210). Ten-year overall survival was 70% versus 66%. <a class=\"trial-link\" href=\"/evidence/#t-bright\">BRIGHT</a> asked the same question against R-CHOP or R-CVP with complete response as the primary endpoint: bendamustine-rituximab was non-inferior for complete response by blinded independent review (31% vs 25%) with a higher overall response (97% vs 91%), but the gap did not clear the superiority test, non-inferiority was not reached within the indolent-NHL subgroup (CR-rate ratio 1.16, 95% CI 0.81 to 1.65), and progression-free and overall survival were immature at that cut (Blood 2014;123:2944-2952).</p>\n<h3>Rituximab-lenalidomide</h3>\n<p>Lenalidomide is an immunomodulatory agent with a mechanism of action complementary to rituximab, given 3 weeks on, 1 week off. Its boxed warnings are embryo-fetal toxicity, haematological toxicity and thromboembolism; aspirin prophylaxis is used. <a class=\"trial-link\" href=\"/evidence/#t-relevance\">RELEVANCE</a> tested chemotherapy-free rituximab-lenalidomide for superiority against rituximab-chemotherapy in 1,030 untreated patients and met neither co-primary endpoint: confirmed or unconfirmed complete response at 120 weeks was 48% versus 53% (p=0.13) and the progression-free survival hazard ratio 1.10 (95% CI 0.85 to 1.43, p=0.48), with 3-year progression-free survival 77% versus 78% and 3-year overall survival 94% in both arms, immature (N Engl J Med 2018;379:934-947). Efficacy looks similar, but a missed superiority test is not demonstrated equivalence. The toxicities trade rather than rank: more grade 3–4 skin reactions (7% vs 1%) and any-grade tumour flare with lenalidomide, more grade 3–4 neutropenia (50% vs 32%) and any-grade febrile neutropenia (7% vs 2%) with chemotherapy. Among the 70 patients with stage I–II disease, confirmed or unconfirmed complete response at 120 weeks was 10 of 30 versus 30 of 40 in favour of chemotherapy; this was the trial&#x27;s only significant treatment-by-subgroup interaction and was prespecified exploratory and quantitative.</p>\n<h3>Antibody choice: obinutuzumab</h3>\n<p>Obinutuzumab is a glycoengineered type II anti-CD20 monoclonal antibody with lower complement-dependent cytotoxicity than rituximab but greater antibody-dependent cellular cytotoxicity and phagocytosis and greater direct B-cell killing. It is given at 1000 mg on days 1, 8 and 15 of cycle 1, then day 1 of subsequent cycles. <a class=\"trial-link\" href=\"/evidence/#t-gallium\">GALLIUM</a> randomised 1,202 patients with untreated advanced follicular lymphoma meeting GELF criteria to obinutuzumab or rituximab, each with chemotherapy followed by the same antibody as maintenance in responders. Obinutuzumab lengthened investigator-assessed progression-free survival (3-year 80.0% vs 73.3%; HR 0.66, 95% CI 0.51 to 0.85), an interim result at 245 of the 370 planned events; overall survival did not differ (3-year 94.0% vs 92.1%), response at the end of induction did not differ, and complete response was numerically lower with obinutuzumab (19.5% vs 23.8%) (N Engl J Med 2017;377:1331-1344). The cost is toxicity: grade 3–5 events 74.6% versus 67.8%, grade 3–5 infusion reactions 12.4% versus 6.7%, grade 3–5 infection 20.0% versus 15.6% and grade 3–5 neutropenia 45.9% versus 39.5%. At 7 years progression-free survival was 63% versus 56%, with similar overall survival.</p>\n<h2 id=\"s-maintenance-after-frontline-therapy\">Maintenance after frontline therapy</h2>\n<p>Rituximab maintenance every 2 months for 2 years improves progression-free survival after various induction regimens (median PFS 10.5 vs 4.1 years, p&lt;0.0001), with no impact on overall survival. <a class=\"trial-link\" href=\"/evidence/#t-prima\">PRIMA</a> randomised 1,019 patients with high-tumour-burden grade 1–3a follicular lymphoma who had responded to and tolerated frontline rituximab-chemotherapy; efficacy analyses used 1,018 patients after one patient died during randomisation and was excluded. Maintenance improved 3-year progression-free survival (74.9% vs 57.6%; HR 0.55, 95% CI 0.44 to 0.68) and raised complete or unconfirmed complete response at the end of maintenance (71.5% vs 52.2%), while overall survival did not differ (HR 0.87) (Lancet 2011;377:42-51). At 10 years, progression-free survival was 51.1% versus 35% (HR 0.61, p&lt;0.001) and overall survival 80% in both arms. The cost is more grade 3–4 adverse events (24% vs 17%), driven by higher rates of cytopenias and infections; grade 2–4 infections ran at 39% versus 24%, and one death from fulminant hepatitis B occurred in a patient without antiviral prophylaxis. Guideline positions:</p>\n<ul><li>ESMO: rituximab maintenance every 2 months for 2 years is recommended after immunochemotherapy [I, B].</li><li>BSH: for patients responding to therapy (PR or CR), consider maintenance with rituximab or obinutuzumab, whichever antibody was used in induction, for 2 years, after discussion of risks and benefits with the patient.</li></ul>\n<h2 id=\"s-relapsed-disease\">Relapsed disease</h2>\n<p>Re-biopsy at relapse to rule out histologic transformation. The timing of relapse directs the pathway:</p>\n<ul><li>Early relapse: within 24 months of initial immunochemotherapy, or within 12 months of single-agent rituximab.</li><li>Late relapse: after those intervals.</li></ul>\n<p>Asymptomatic patients can be managed with watch-and-wait, single-agent rituximab, or radiotherapy for localised disease.</p>\n<h3>Late symptomatic relapse</h3>\n<p>The options are rituximab-lenalidomide; rituximab monotherapy, for patients unfit for combination therapy and those with low tumour burden; or immunochemotherapy with the alternative backbone, bendamustine after prior CHOP and CHOP after prior bendamustine. <a class=\"trial-link\" href=\"/evidence/#t-augment\">AUGMENT</a> randomised 358 patients with relapsed or refractory follicular or marginal-zone lymphoma, excluding rituximab-refractory disease, to lenalidomide-rituximab or placebo-rituximab. Lenalidomide nearly tripled median progression-free survival (39.4 vs 14.1 months by independent review; HR 0.46, 95% CI 0.34 to 0.62), with higher response (78% vs 53%); overall survival is immature (HR 0.61, 95% CI 0.33 to 1.13). The trade is toxicity, grade 3–4 events in 69% versus 32%, driven by neutropenia (50% vs 13%) (J Clin Oncol 2019;37:1188-1199). Maintenance also has evidence at relapse. <a class=\"trial-link\" href=\"/evidence/#t-eortc-20981-van-oers\">EORTC 20981 (van Oers)</a> randomised relapsed or resistant follicular lymphoma after up to 2 prior non-anthracycline regimens to CHOP or R-CHOP induction, then re-randomised the 334 responders to rituximab maintenance or observation. Maintenance improved median progression-free survival (51.5 vs 14.9 months; HR 0.40) and 3-year overall survival (85.1% vs 77.1%, p=0.011), at more grade 3–4 infection (9% vs 2.4%) (Blood 2006;108:3295-3301). Prior anthracycline, rituximab and transplantation were excluded, so the result does not extend directly to an anthracycline- or rituximab-exposed relapse. For rituximab-refractory disease, <a class=\"trial-link\" href=\"/evidence/#t-gadolin\">GADOLIN</a> randomised indolent NHL that had failed or progressed on or shortly after rituximab to obinutuzumab-bendamustine followed by obinutuzumab maintenance, or bendamustine alone. The primary endpoint was met at the interim analysis on independent review (median progression-free survival not reached vs 14.9 months; HR 0.55, 95% CI 0.40 to 0.74), and the updated analysis showed an overall survival benefit (HR 0.67, 95% CI 0.47 to 0.96) with median progression-free survival by investigator 25.8 versus 14.1 months. No progression-free survival benefit was shown in the 75 patients with non-follicular histology (HR 0.94, 95% CI 0.46 to 1.90), a cohort the authors call too small to establish a difference (Lancet Oncol 2016;17:1081-1093; J Clin Oncol 2018;36:2259-2266). Two newer combinations build on lenalidomide-rituximab. <a class=\"trial-link\" href=\"/evidence/#t-inmind\">inMIND</a> added the CD19 antibody tafasitamab: median progression-free survival 22.4 versus 13.9 months (HR 0.43, 95% CI 0.32 to 0.58), PET-complete response 49% versus 40% (p=0.029), and toxicity little different from lenalidomide-rituximab alone (grade 3–4 events 71% vs 69%); survival is immature (HR 0.59) (Lancet 2026;407:133-146). Point estimates favoured tafasitamab in both POD24 strata and both anti-CD20-refractoriness strata, with no formal treatment-by-subgroup interaction reported. <a class=\"trial-link\" href=\"/evidence/#t-epcore-fl-1\">EPCORE FL-1</a> added the bispecific epcoritamab and met both primary endpoints: response 95% versus 79% and progression-free survival HR 0.21 (95% CI 0.14 to 0.31; median not reached vs 11.7 months), with complete response 83% versus 50%, at interim follow-up of 14.8 months. Survival favoured the combination but did not clear its prespecified boundary (HR 0.38, nominal p=0.0039), so the testing sequence stopped there. Toxicity is substantially greater: grade 3 or higher events 90% versus 68%, grade 3–4 infection 33% versus 16%, and cytokine release syndrome in 35% versus under 1%, none above grade 2 (Lancet 2026;407:161-173).</p>\n<h3>Early relapse</h3>\n<p>The options are rituximab- or obinutuzumab-lenalidomide, autologous stem-cell transplantation, or CAR T-cell therapy.</p>\n<h3>Targeted oral agents</h3>\n<p><a class=\"trial-link\" href=\"/evidence/#t-idelalisib-study-101-09\">Idelalisib (Study 101-09)</a> is a single-arm phase 2 study of the PI3Kδ inhibitor idelalisib in 125 patients with indolent NHL refractory to both rituximab and an alkylating agent after at least 2 prior therapies. Response was 57% (95% CI 48 to 66) with complete response in 6%, median duration of response 12.5 months and median progression-free survival 11.0 months (N Engl J Med 2014;370:1008-1018). Grade 3 or higher diarrhoea or colitis occurred in 16%, beginning at a median of 6 months. Other grade 3 or higher toxicities included transaminitis in 13% (median onset 6.3 weeks, asymptomatic and reversible) and pneumonia in 7%; grade 3 or higher laboratory neutropenia occurred in 27%. Overall, 20% stopped idelalisib for toxicity. <a class=\"trial-link\" href=\"/evidence/#t-tazemetostat-e7438-g000-101\">Tazemetostat (E7438-G000-101)</a> tested the oral EZH2 inhibitor tazemetostat in relapsed or refractory follicular lymphoma after at least 2 prior therapies, in an EZH2-mutant and a wild-type cohort each measured against a fixed response benchmark rather than against each other. Response by independent review was 69% (95% CI 53 to 82) in the 45 patients with EZH2-mutant disease and 35% (95% CI 23 to 49) in the 54 with wild-type disease, with median progression-free survival 13.8 and 11.1 months. Grade 3 or higher treatment-related thrombocytopenia and neutropenia each occurred in 3%, and 8% stopped for toxicity. One patient developed myelodysplastic syndrome and one developed acute myeloid leukaemia on treatment (Lancet Oncol 2020;21:1433-1442).</p>\n<h3>CAR T-cell therapy</h3>\n<p>Three CD19-directed products carry single-arm phase 2 evidence in multiply relapsed disease. <a class=\"trial-link\" href=\"/evidence/#t-zuma-5-axi-cel\">ZUMA-5 (axi-cel)</a> treated relapsed or refractory indolent NHL after at least 2 prior lines with axicabtagene ciloleucel: response by independent review was 92% with complete response in 74%, and 94% with 79% in follicular lymphoma; 18-month progression-free survival was 64.8% and overall survival 87.4%, with median duration of response and progression-free survival not reached in follicular disease (Lancet Oncol 2022;23:91-103). Cytokine release syndrome affected 82% (7% grade 3 or higher) and neurologic events 59% (19% grade 3–4). Four patients (3%) died of adverse events; one CRS-associated multisystem-organ-failure death was judged treatment related. <a class=\"trial-link\" href=\"/evidence/#t-elara-tisa-cel\">ELARA (tisa-cel)</a> treated relapsed or refractory follicular lymphoma with tisagenlecleucel: complete response 69.1% (95% CI 58.8 to 78.3) by independent review, overall response 86.2%. At this prespecified interim analysis, median duration of response, progression-free and overall survival were all not reached and 12-month progression-free survival was 67%; complete response was 59.0% in patients who had progressed within 24 months of first-line treatment against 87.9% in those who had not. Cytokine release syndrome occurred in 48.5% with none grade 3 or worse; cytopenias dominate, grade 3 or higher in 69.1% within 8 weeks (Nat Med 2022;28:325-332). Seven patients died, including one death attributed to CRS; all occurred more than 30 days after infusion and none was assessed as treatment related. <a class=\"trial-link\" href=\"/evidence/#t-transcend-fl-liso-cel\">TRANSCEND FL (liso-cel)</a> treated relapsed or refractory follicular lymphoma with lisocabtagene maraleucel in separate cohorts: response 97% (95% CI 91.6 to 99.4) with complete response 94% in the third line or later, and 96% with every responder in complete response in the second-line high-risk cohort. Results are early: median duration of response, progression-free and overall survival were all unreached, with 90% of patients censored from the overall-survival analysis, which the authors name as their first limitation. Cytokine release syndrome occurred in 58% (1 patient grade 3, none higher) and neurological events in 15% (Nat Med 2024;30:2199-2207). Thirteen deaths occurred on study, and investigators attributed two to liso-cel: macrophage-activation syndrome/haemophagocytic lymphohistiocytosis and progressive multifocal leukoencephalopathy.</p>\n<h3>Bispecific antibodies</h3>\n<p><a class=\"trial-link\" href=\"/evidence/#t-mosunetuzumab-go29781\">Mosunetuzumab (GO29781)</a> gave the CD20×CD3 bispecific mosunetuzumab intravenously for a fixed duration with cycle-1 step-up dosing: c
