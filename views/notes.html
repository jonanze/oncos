\" aria-label=\"Reference 10: ESMO 2024 next-generation sequencing recommendations\">10</a></sup>.</p>\n<p>In potentially curable disease, order the biomarkers required by the contemplated perioperative, adjuvant or consolidation pathway early enough that results can change the plan. The early-stage and metastatic treatment chapters define regimen-specific eligibility; this chapter defines what the reported alteration means.</p>\n<h3 id=\"s-match-the-assay-to-the-alteration\">Match the assay to the alteration</h3>\n<div class=\"tblwrap\" role=\"region\" aria-label=\"Scrollable table\" tabindex=\"0\"><table><thead><tr><th scope=\"col\">Biomarker</th><th scope=\"col\">Reportable alteration</th><th scope=\"col\">Preferred approach and caveat</th></tr></thead><tbody><tr><td><em>EGFR</em></td><td>Exon 19 deletion, L858R, G719X, L861Q, S768I, exon 20 insertion and other named variants</td><td>Validated DNA NGS; a hotspot PCR assay is acceptable only if its report makes coverage and blind spots explicit</td></tr><tr><td><em>ALK</em></td><td>Fusion/rearrangement</td><td>Validated IHC can establish positivity; FISH or DNA/RNA NGS can resolve discordance, and RNA NGS can identify the expressed fusion</td></tr><tr><td><em>ROS1</em></td><td>Fusion/rearrangement</td><td>RNA NGS or FISH; if IHC is used to screen, confirm a positive result molecularly</td></tr><tr><td><em>RET</em>, <em>NTRK1/2/3</em>, <em>NRG1</em></td><td>Fusion/rearrangement</td><td>RNA-based sequencing is preferred when feasible; DNA panels may miss rearrangements because of intronic coverage</td></tr><tr><td><em>BRAF</em>, <em>KRAS</em></td><td>Named sequence variant</td><td>DNA NGS or a validated allele-specific assay; report the exact variant rather than gene-positive status</td></tr><tr><td><em>MET</em></td><td>Exon 14 skipping</td><td>DNA and/or RNA NGS with validated splice-site coverage; RNA directly demonstrates the skipped transcript</td></tr><tr><td><em>MET</em></td><td>Amplification</td><td>Copy-number-capable NGS or FISH; report method, copy number and/or <em>MET</em>/CEP7 ratio rather than “MET-positive”</td></tr><tr><td><em>ERBB2/HER2</em></td><td>Activating mutation, amplification or protein overexpression</td><td>DNA NGS for mutation, copy-number assay for amplification, IHC for protein; these are distinct biomarkers and are not interchangeable</td></tr><tr><td>PD-L1</td><td>Tumour-cell protein expression</td><td>Validated IHC; report clone/platform, tumour proportion score and adequacy</td></tr></tbody></table></div>\n<p>Multiplex NGS is preferred because it conserves tissue and detects mutually uncommon events in parallel. The CAP/IASLC/AMP guideline supports multiplex panels over serial single-gene assays and permits cell-free DNA to rule in a targetable alteration when tissue is limited; an uninformative plasma result does not rule one out<sup class=\"trial-ref\"><a href=\"#ref-lung-nsclc-classification-staging-and-molecular-profile-ext-093cc29f2f36\" aria-label=\"Reference 11: CAP-IASLC-AMP molecular testing guideline\">11</a></sup>.</p>\n<h3 id=\"s-use-plasma-as-a-complement-not-a-negative-biopsy\">Use plasma as a complement, not a negative biopsy</h3>\n<p>A clearly pathogenic, therapeutically relevant alteration detected by a validated plasma assay can establish the molecular result when the clinical context fits. A negative or low-shedding plasma result requires tissue testing if feasible. Obtain tissue when histological transformation, a second primary or a mechanism requiring morphology is suspected, even if plasma is positive<sup class=\"trial-ref\"><a href=\"#ref-lung-nsclc-classification-staging-and-molecular-profile-ext-e79bf916a5b2\" aria-label=\"Reference 12: IASLC liquid biopsy consensus update\">12</a></sup>.</p>\n<h3 id=\"s-interpret-the-alteration-class-not-merely-the-gene\">Interpret the alteration class, not merely the gene</h3>\n<p><em>EGFR</em> exon 19 deletion and L858R are common sensitising variants; G719X, L861Q and S768I are heterogeneous uncommon variants; exon 20 insertions form a distinct group; and a resistance alteration must be reported with specimen timing and treatment context. The approximately 10% figure in older summaries applies to the uncommon G719X/L861Q/S768I group collectively, not to S768I alone.</p>\n<p>Structure can be more informative than exon number for uncommon <em>EGFR</em> variants. A retrospective translational analysis of 16,715 patients proposed classical-like, T790M-like, exon-20-loop-insertion and P-loop/αC-helix-compressing classes; the framework predicted inhibitor sensitivity better than exon grouping with nominal P&lt;0.0001, but it was not a randomised treatment comparison<sup class=\"trial-ref\"><a href=\"#ref-lung-nsclc-classification-staging-and-molecular-profile-t-robichaux-et-al-structure-based-egfr-classification\" aria-label=\"Reference 13: Robichaux et al. (structure-based EGFR classification)\">13</a></sup>.</p>\n<p>Treatment outcomes for uncommon <em>EGFR</em> variants, including the pooled LUX-Lung analysis, are addressed in <strong>NSCLC: metastatic disease</strong>.</p>\n<p>Keep these distinctions explicit:</p>\n<ul><li>An <em>ALK</em>, <em>ROS1</em>, <em>RET</em>, <em>NTRK</em> or <em>NRG1</em> fusion is not equivalent to nonspecific protein expression.</li><li><em>MET</em> exon 14 skipping, focal high-level amplification and c-MET protein overexpression are separate biomarkers.</li><li><em>ERBB2/HER2</em> mutation, amplification and protein overexpression are separate biomarkers.</li><li><em>BRAF</em> V600E must be distinguished from non-V600E classes, and <em>KRAS</em> must be reported by variant.</li><li>Co-alterations, tumour content, assay limits and whether the result came from tissue or plasma belong in the report.</li></ul>\n<h2 id=\"s-use-epidemiology-to-anticipate-never-to-exclude\">Use epidemiology to anticipate, never to exclude</h2>\n<p>Driver prevalence varies by population and selection. In Asian NSCLC series, <em>EGFR</em> alterations occur in roughly 40%–60%, <em>ALK</em> in 2.3%–6.7%, <em>BRAF</em> in about 1.3%, <em>RET</em> in 1%–2%, <em>MET</em> exon 14 skipping in 2%–4%, <em>MET</em> amplification in 1%–5%, <em>ERBB2/HER2</em> mutation in 1%–4%, and <em>NTRK</em> fusion in less than 1%. These are planning estimates, not patient-selection rules<sup class=\"trial-ref\"><a href=\"#ref-lung-nsclc-classification-staging-and-molecular-profile-ext-68ed2f2027f1\" aria-label=\"Reference 5: Pan-Asian ESMO oncogene-addicted NSCLC guideline\">5</a></sup>.</p>\n<p>Alterations involving <em>EGFR</em>, <em>ALK</em>, <em>ROS1</em>, <em>RET</em>, <em>ERBB2/HER2</em> and <em>NTRK</em> are enriched in never-smokers, while <em>KRAS</em> and some other RAS–MAPK alterations are enriched with tobacco exposure; <em>BRAF</em> and <em>MET</em> occur across smoking categories. None of these associations is sufficiently deterministic to replace testing.</p>\n<h2 id=\"s-references\">References</h2>\n<ol class=\"refs\">\n<li id=\"ref-lung-nsclc-classification-staging-and-molecular-profile-ext-73ca0ae0be18\"><a href=\"https://pubmed.ncbi.nlm.nih.gov/34808341/\" rel=\"noopener\" target=\"_blank\">WHO 2021 lung tumour classification review</a></li>\n<li id=\"ref-lung-nsclc-classification-staging-and-molecular-profile-ext-27235a145dc5\"><a href=\"https://pubmed.ncbi.nlm.nih.gov/32562873/\" rel=\"noopener\" target=\"_blank\">IASLC invasive adenocarcinoma grading proposal</a></li>\n<li id=\"ref-lung-nsclc-classification-staging-and-molecular-profile-ext-c1d6242849dc\"><a href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC6422775/\" rel=\"noopener\" target=\"_blank\">IASLC diagnostic immunohistochemistry best practices</a></li>\n<li id=\"ref-lung-nsclc-classification-staging-and-molecular-profile-ext-a1bc58df1286\"><a href=\"https://www.nice.org.uk/guidance/ng122/chapter/Diagnosis-and-staging\" rel=\"noopener\" target=\"_blank\">NICE lung cancer diagnosis and staging guideline</a></li>\n<li id=\"ref-lung-nsclc-classification-staging-and-molecular-profile-ext-68ed2f2027f1\"><a href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC11648200/\" rel=\"noopener\" target=\"_blank\">Pan-Asian ESMO oncogene-addicted NSCLC guideline</a></li>\n<li id=\"ref-lung-nsclc-classification-staging-and-molecular-profile-ext-2522e70340f0\"><a href=\"https://education.iaslc.org/AssetListing/IASLC-Staging-Reference-Cards-9th-Edition-7070/IASLC-Staging-Reference-Cards-9th-Edition-36447\" rel=\"noopener\" target=\"_blank\">IASLC TNM-9 staging cards</a></li>\n<li id=\"ref-lung-nsclc-classification-staging-and-molecular-profile-t-fischer-et-al-pet-ct-staging\"><a class=\"trial-link\" href=\"/evidence/#t-fischer-et-al-pet-ct-staging\">Fischer et al. (PET-CT staging)</a>. <a href=\"https://drive.google.com/file/d/11KTL5Dq2_tSdjS4n6nCOa6Iizl0uhSy9/preview\">N Engl J Med 2009;361:32-39</a></li>\n<li id=\"ref-lung-nsclc-classification-staging-and-molecular-profile-t-streamline-l-trial-taylor-et-al\"><a class=\"trial-link\" href=\"/evidence/#t-streamline-l-trial-taylor-et-al\">Streamline L trial (Taylor et al.)</a>. <a href=\"https://drive.google.com/file/d/11HgI4QuZS9zna7ZzRfeBdZtsjdaG2zSm/preview\">Lancet Respir Med 2019;7:523-532</a></li>\n<li id=\"ref-lung-nsclc-classification-staging-and-molecular-profile-ext-359dfd2a5bac\"><a href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC10419618/\" rel=\"noopener\" target=\"_blank\">MEDIASTrial</a></li>\n<li id=\"ref-lung-nsclc-classification-staging-and-molecular-profile-ext-5bd27c22a429\"><a href=\"https://pubmed.ncbi.nlm.nih.gov/38834388/\" rel=\"noopener\" target=\"_blank\">ESMO 2024 next-generation sequencing recommendations</a></li>\n<li id=\"ref-lung-nsclc-classification-staging-and-molecular-profile-ext-093cc29f2f36\"><a href=\"https://www.iaslc.org/research-education/research-committees/pathology-committee/cap/iaslc/amp-molecular-testing\" rel=\"noopener\" target=\"_blank\">CAP-IASLC-AMP molecular testing guideline</a></li>\n<li id=\"ref-lung-nsclc-classification-staging-and-molecular-profile-ext-e79bf916a5b2\"><a href=\"https://pubmed.ncbi.nlm.nih.gov/34246791/\" rel=\"noopener\" target=\"_blank\">IASLC liquid biopsy consensus update</a></li>\n<li id=\"ref-lung-nsclc-classification-staging-and-molecular-profile-t-robichaux-et-al-structure-based-egfr-classification\"><a class=\"trial-link\" href=\"/evidence/#t-robichaux-et-al-structure-based-egfr-classification\">Robichaux et al. (structure-based EGFR classification)</a>. <a href=\"https://drive.google.com/file/d/1Dd5z6PtW299ZzhpvfaeT1K2VEuzptEtV/preview\">Nature 2021;597:732-737</a></li>\n</ol>", "_hay": "nsclc: classification, staging and molecular profile nsclc-classification-staging-and-molecular-profile lung make four decisions before treatment classify by morphology first use a minimal, question-led immunohistochemistry panel choose a specimen that establishes the highest stage stage with tnm-9 t category n and m categories stage groups complete imaging before fixing treatment intent confirm mediastinal disease when it can change intent build the molecular profile before systemic treatment match the assay to the alteration use plasma as a complement, not a negative biopsy interpret the alteration class, not merely the gene use epidemiology to anticipate, never to exclude references"}, {"id": "lung-nsclc-early-and-locally-advanced-disease", "slug": "nsclc-early-and-locally-advanced-disease", "group": "Lung", "title": "NSCLC: early and locally advanced disease", "updated": "", "sections": [{"id": "s-lung-cancer-screening", "h": "Lung-cancer screening", "depth": 2}, {"id": "s-define-stage-intent-and-resectability-before-choosing-treatment", "h": "Define stage, intent and resectability before choosing treatment", "depth": 2}, {"id": "s-confirm-curative-intent-stage-before-selecting-local-treatment", "h": "Confirm curative-intent stage before selecting local treatment", "depth": 3}, {"id": "s-establish-whether-the-proposed-operation-is-physiologically-tolerable", "h": "Establish whether the proposed operation is physiologically tolerable", "depth": 3}, {"id": "s-choose-the-least-extensive-oncologically-adequate-local-treatment", "h": "Choose the least extensive oncologically adequate local treatment", "depth": 2}, {"id": "s-stage-i-surgery-is-usually-definitive", "h": "Stage I: surgery is usually definitive", "depth": 2}, {"id": "s-resectable-stage-ii-and-selected-stage-iii-plan-the-entire-perioperative-course", "h": "Resectable stage II and selected stage III: plan the entire perioperative course", "depth": 2}, {"id": "s-neoadjuvant-and-perioperative-chemoimmunotherapy", "h": "Neoadjuvant and perioperative chemoimmunotherapy", "depth": 3}, {"id": "s-egfr-and-alk-directed-neoadjuvant-therapy-remains-selective", "h": "EGFR- and ALK-directed neoadjuvant therapy remains selective", "depth": 3}, {"id": "s-after-surgery-match-adjuvant-therapy-to-pathological-risk-and-genotype", "h": "After surgery: match adjuvant therapy to pathological risk and genotype", "depth": 2}, {"id": "s-platinum-chemotherapy-remains-the-backbone-for-stage-ii-iii-disease", "h": "Platinum chemotherapy remains the backbone for stage II-III disease", "depth": 3}, {"id": "s-genotype-directed-adjuvant-treatment", "h": "Genotype-directed adjuvant treatment", "depth": 3}, {"id": "s-adjuvant-immunotherapy-is-for-selected-oncogene-negative-disease", "h": "Adjuvant immunotherapy is for selected oncogene-negative disease", "depth": 3}, {"id": "s-postoperative-radiotherapy-is-not-routine-after-r0-resection", "h": "Postoperative radiotherapy is not routine after R0 resection", "depth": 3}, {"id": "s-stage-iii-separate-potentially-resectable-from-unresectable-disease", "h": "Stage III: separate potentially resectable from unresectable disease", "depth": 2}, {"id": "s-unresectable-stage-iii-definitive-chemoradiation-followed-by-biomarker-directed-consolidation", "h": "Unresectable stage III: definitive chemoradiation followed by biomarker-directed consolidation", "depth": 2}, {"id": "s-deliver-concurrent-chemoradiation-when-the-patient-is-fit", "h": "Deliver concurrent chemoradiation when the patient is fit", "depth": 3}, {"id": "s-consolidate-according-to-egfr-status", "h": "Consolidate according to EGFR status", "depth": 3}, {"id": "s-surveillance-after-curative-intent-treatment", "h": "Surveillance after curative-intent treatment", "depth": 2}, {"id": "s-references", "h": "References", "depth": 2}], "html": "<h2 id=\"s-lung-cancer-screening\">Lung-cancer screening</h2>\n<p>Lung-cancer screening eligibility must follow the current local programme, not an old age-and-pack-year fragment. As one reference point, the USPSTF recommends annual LDCT for adults aged 50-80 years with at least 20 pack-years who currently smoke or quit within 15 years<sup class=\"trial-ref\"><a href=\"#ref-lung-nsclc-early-and-locally-advanced-disease-ext-92f88ec6ffb1\" aria-label=\"Reference 1: USPSTF lung cancer screening recommendation\">1</a></sup>.</p>\n<p>Randomised evidence supports LDCT within the risk groups and protocols studied. NLST and NELSON were not head-to-head: eligibility, controls, screening intervals, nodule rules and follow-up differed, so their effect sizes and false-positive rates should not be compared directly.</p>\n<p><a class=\"trial-link\" href=\"/evidence/#t-nlst-national-lung-screening-trial\">NLST (National Lung Screening Trial)</a> randomised 53,454 adults aged 55-74 years with at least 30 pack-years to three annual rounds of LDCT or single-view chest radiography. In the intention-to-screen analysis over a median 78 months, LDCT reduced lung-cancer mortality by 20.0%: 247 versus 309 deaths per 100,000 person-years, with 356 versus 443 deaths (95% CI 6.8-26.7; P=.004).</p>\n<p>Across the three rounds, 24.2% of LDCT screens were positive versus 6.9% of radiographs, and 96.4% of positive LDCT results were false positive. The number needed to screen was 320 among participants undergoing at least one screen. The 6.7% reduction in all-cause mortality was a secondary, nominal result (P=.02), not the alpha-protected primary endpoint.</p>\n<p><a class=\"trial-link\" href=\"/evidence/#t-nelson-dutch-belgian-lung-cancer-screening\">NELSON (Dutch-Belgian Lung Cancer Screening)</a> randomised 15,792 high-risk current or former smokers aged 50-74 years to volume-based LDCT at baseline and years 1, 3 and 5.5, or no screening. The prespecified primary intention-to-screen analysis comprised 13,195 men; at 10 years, lung-cancer mortality was 2.50 versus 3.30 deaths per 1,000 person-years (rate ratio 0.76, 95% CI 0.61-0.94; P=.01).</p>\n<p>In the smaller prespecified exploratory subgroup of 2,594 women, the 10-year rate ratio was 0.67 (95% CI 0.38-1.14). In the male screening cohort, across 22,600 CT scans, 2.1% were positive and 1.2% were false positive; 58.6% of 203 screen-detected cancers were stage IA or IB. These are descriptive operating characteristics of the complete NELSON protocol, not proof that its volumetric rule alone caused the lower work-up burden.</p>\n<p>TALENT was a prospective single-arm cohort of 12,011 never- or very-light smokers with additional risk factors; it reported baseline detection, not a randomised mortality comparison, and explicitly raised overdiagnosis as a possibility. It therefore cannot establish a survival benefit or no benefit for screening never-smokers<sup class=\"trial-ref\"><a href=\"#ref-lung-nsclc-early-and-locally-advanced-disease-ext-53eece58bc1d\" aria-label=\"Reference 4: TALENT prospective cohort\">4</a></sup>.</p>\n<h2 id=\"s-define-stage-intent-and-resectability-before-choosing-treatment\">Define stage, intent and resectability before choosing treatment</h2>\n<p>Use the current ninth-edition TNM system and record both clinical and pathological stage when available. The classification chapter owns the T, N and M definitions, histopathology and molecular interpretation; the treatment consequence here is that N2a and N2b disease are distinct and that an apparently small primary may still require multimodality therapy<sup class=\"trial-ref\"><a href=\"#ref-lung-nsclc-early-and-locally-advanced-disease-ext-35446abae6e6\" aria-label=\"Reference 5: IASLC ninth-edition lung cancer TNM chart\">5</a></sup>.</p>\n<p>Curative-intent decisions require a thoracic multidisciplinary review that integrates technical resectability, mediastinal nodal burden, the operation required for an R0 resection, cardiopulmonary reserve and the systemic-treatment plan. Stage IIIA(N2) disease is not uniformly resectable; surgery is reasonable only when complete resection is feasible, N3 disease is excluded and expected 90-day mortality is low<sup class=\"trial-ref\"><a href=\"#ref-lung-nsclc-early-and-locally-advanced-disease-ext-cd03a60382f4\" aria-label=\"Reference 6: ASCO stage III NSCLC guideline\">6</a></sup>.</p>\n<h3 id=\"s-confirm-curative-intent-stage-before-selecting-local-treatment\">Confirm curative-intent stage before selecting local treatment</h3>\n<p>Complete the imaging and invasive nodal-staging pathway in <strong>NSCLC: classification, staging and molecular profile</strong> before choosing surgery, SABR or definitive chemoradiation. The treatment meeting needs three outputs: whether any distant lesion that would change intent has been resolved, the mediastinal nodal status when it changes resectability, and brain MRI for stage III or otherwise clinically high-risk disease.</p>\n<h3 id=\"s-establish-whether-the-proposed-operation-is-physiologically-tolerable\">Establish whether the proposed operation is physiologically tolerable</h3>\n<p>Measure FEV1 and DLCO in every surgical candidate, calculate predicted postoperative values for the planned resection, and assess cardiovascular risk. Values above 60% predicted for both measures identify low pulmonary risk; values from 30% to 60% require a low-technology exercise test, while either value below 30% or poor exercise performance should prompt cardiopulmonary exercise testing<sup class=\"trial-ref\"><a href=\"#ref-lung-nsclc-early-and-locally-advanced-disease-ext-61367f232d47\" aria-label=\"Reference 7: ACCP physiologic evaluation guideline\">7</a></sup>.</p>\n<p>A peak oxygen uptake below 10 mL/kg/min or 35% predicted indicates high risk for major anatomical resection, whereas a value above 20 mL/kg/min or 75% predicted indicates low risk. Do not substitute fixed absolute FEV1 cut-offs for this integrated assessment; the relevant question is whether the patient can tolerate the operation required for complete resection<sup class=\"trial-ref\"><a href=\"#ref-lung-nsclc-early-and-locally-advanced-disease-ext-61367f232d47\" aria-label=\"Reference 7: ACCP physiologic evaluation guideline\">7</a></sup>.</p>\n<h2 id=\"s-choose-the-least-extensive-oncologically-adequate-local-treatment\">Choose the least extensive oncologically adequate local treatment</h2>\n<p>Anatomical resection with systematic hilar and mediastinal nodal evaluation is preferred for operable disease. Lobectomy remains appropriate for most tumours, while sleeve resection can avoid pneumonectomy when it achieves an R0 result. En-bloc resection of an involved adjacent structure is justified only when complete resection is technically achievable and the patient can tolerate the procedure.</p>\n<p>For peripheral, node-negative tumours measuring no more than 2 cm, anatomical segmentectomy is an evidence-based alternative to lobectomy after rigorous intraoperative nodal confirmation. CALGB 140503 established non-inferior disease-free survival for sublobar resection, while JCOG0802 showed superior overall survival with segmentectomy but more local recurrence; wedge resection is less favoured when an anatomical segmentectomy is feasible<sup class=\"trial-ref\"><a href=\"#ref-lung-nsclc-early-and-locally-advanced-disease-ext-e135371d975e\" aria-label=\"Reference 8: CALGB 140503\">8</a></sup><sup class=\"trial-ref\"><a href=\"#ref-lung-nsclc-early-and-locally-advanced-disease-ext-3b05d615c058\" aria-label=\"Reference 9: JCOG0802 WJOG4607L\">9</a></sup>.</p>\n<p>Systematic nodal evaluation is part of curative resection. In patients with T1-2, N0 or non-hilar N1 disease whose specified hilar and mediastinal stations were negative on thorough sampling, complete mediastinal dissection did not improve survival or recurrence outcomes; that result does not apply to radiographic staging alone or to higher-stage disease<sup class=\"trial-ref\"><a href=\"#ref-lung-nsclc-early-and-locally-advanced-disease-ext-4d250426f215\" aria-label=\"Reference 10: ACOSOG Z0030\">10</a></sup>.</p>\n<p>Offer stereotactic ablative radiotherapy to medically inoperable patients with node-negative stage I disease and consider it when operative risk is prohibitive after multidisciplinary review. Surgery remains standard for patients at usual operative risk; non-operative treatment does not remove the need for adequate staging or tissue diagnosis when safely obtainable<sup class=\"trial-ref\"><a href=\"#ref-lung-nsclc-early-and-locally-advanced-disease-ext-6d8e39c1aecb\" aria-label=\"Reference 11: ASTRO SBRT guideline\">11</a></sup>.</p>\n<h2 id=\"s-stage-i-surgery-is-usually-definitive\">Stage I: surgery is usually definitive</h2>\n<p>After complete resection of stage IA disease, surveillance is standard and adjuvant cytotoxic chemotherapy is not indicated. The individual-patient-data LACE analysis suggested no benefit in stage IA and established that the survival gain from postoperative cisplatin-based chemotherapy is concentrated in higher-stage disease<sup class=\"trial-ref\"><a href=\"#ref-lung-nsclc-early-and-locally-advanced-disease-t-lace-lung-adjuvant-cisplatin-evaluation-meta-analysis\" aria-label=\"Reference 12: LACE (Lung Adjuvant Cisplatin Evaluation) meta-analysis\">12</a></sup>.</p>\n<p>Routine chemotherapy is also not supported for all stage IB tumours. CALGB 9633 did not improve overall or disease-free survival in resected T2N0 disease; its unplanned subgroup with tumours at least 4 cm suggested benefit but remains hypothesis-generating. A tumour at least 4 cm, adverse pathological features and nodal uncertainty should therefore trigger individualised discussion rather than an automatic rule<sup class=\"trial-ref\"><a href=\"#ref-lung-nsclc-early-and-locally-advanced-disease-t-calgb-9633\" aria-label=\"Reference 13: CALGB 9633\">13</a></sup>.</p>\n<p>Two years of oral uracil-tegafur improved survival after resection of pathological stage I adenocarcinoma in a Japanese phase III trial, but this regional regimen has not become a general substitute for contemporary stage- and biomarker-directed care. Its positive result should therefore be read as historical evidence of adjuvant sensitivity, not as a universal treatment recommendation<sup class=\"trial-ref\"><a href=\"#ref-lung-nsclc-early-and-locally-advanced-disease-ext-598098261a51\" aria-label=\"Reference 14: Japanese adjuvant UFT trial\">14</a></sup>.</p>\n<p>Test resected nonsquamous tumours for actionable alterations before selecting adjuvant immunotherapy. Patients with an EGFR exon 19 deletion or L858R mutation may receive three years of osimertinib after complete resection, with adjuvant platinum chemotherapy given when otherwise indicated; patients with ALK-positive tumours at least 4 cm or node-positive disease may receive two years of alectinib<sup class=\"trial-ref\"><a href=\"#ref-lung-nsclc-early-and-locally-advanced-disease-t-adaura\" aria-label=\"Reference 15: ADAURA\">15</a></sup><sup class=\"trial-ref\"><a href=\"#ref-lung-nsclc-early-and-locally-advanced-disease-t-alina\" aria-label=\"Reference 16: ALINA\">16</a></sup>.</p>\n<p>Earlier-stage and longer-duration osimertinib remain research questions rather than extensions of the ADAURA standard. ADAURA2 is testing three years after complete resection of stage IA2-IA3 EGFR-mutant disease, while the single-arm TARGET study is testing five years after resection of stage II-IIIB disease; neither currently supports treatment beyond its studied setting<sup class=\"trial-ref\"><a href=\"#ref-lung-nsclc-early-and-locally-advanced-disease-ext-8853b3bae9d0\" aria-label=\"Reference 17: ADAURA2 registry\">17</a></sup><sup class=\"trial-ref\"><a href=\"#ref-lung-nsclc-early-and-locally-advanced-disease-ext-717c3a4208e9\" aria-label=\"Reference 18: TARGET registry\">18</a></sup>.</p>\n<h2 id=\"s-resectable-stage-ii-and-selected-stage-iii-plan-the-entire-perioperative-course\">Resectable stage II and selected stage III: plan the entire perioperative course</h2>\n<p>Before starting treatment, document that an R0 resection is technically plausible and choose between surgery-first and neoadjuvant or perioperative therapy. Tumours at least 4 cm or node-positive disease without EGFR or ALK alterations generally warrant platinum-doublet chemotherapy plus an immune-checkpoint inhibitor before surgery; a surgery-first pathway remains appropriate when treatment delay, diagnostic uncertainty or anatomical urgency makes neoadjuvant therapy unsuitable.</p>\n<p>Molecular results must be available before immune-checkpoint therapy whenever feasible. EGFR- or ALK-driven tumours should usually follow a resection-first pathway with stage-appropriate chemotherapy and genotype-directed adjuvant therapy, because the pivotal perioperative immunotherapy trials excluded known EGFR and ALK alterations and because targeted perioperative evidence remains less mature.</p>\n<h3 id=\"s-neoadjuvant-and-perioperative-chemoimmunotherapy\">Neoadjuvant and perioperative chemoimmunotherapy</h3>\n<p>Earlier phase II studies established feasibility but do not supersede the randomised phase III regimens below. NADIM and NADIM II supported perioperative nivolumab-chemotherapy in selected stage III disease<sup class=\"trial-ref\"><a href=\"#ref-lung-nsclc-early-and-locally-advanced-disease-ext-f8a0a5e56b36\" aria-label=\"Reference 19: NADIM\">19</a></sup><sup class=\"trial-ref\"><a href=\"#ref-lung-nsclc-early-and-locally-advanced-disease-ext-63ceeca23baf\" aria-label=\"Reference 20: NADIM II\">20</a></sup>. NEOSTAR tested chemotherapy-free and chemotherapy-containing nivolumab-ipilimumab strategies<sup class=\"trial-ref\"><a href=\"#ref-lung-nsclc-early-and-locally-advanced-disease-ext-66c80909c14d\" aria-label=\"Reference 21: NEOSTAR chemotherapy-free arms\">21</a></sup><sup class=\"trial-ref\"><a href=\"#ref-lung-nsclc-early-and-locally-advanced-disease-ext-0efedc0cf487\" aria-label=\"Reference 22: NEOSTAR chemotherapy-containing arms\">22</a></sup>, while LCMC3 tested neoadjuvant atezolizumab alone<sup class=\"trial-ref\"><a href=\"#ref-lung-nsclc-early-and-locally-advanced-disease-ext-fcff48012ecb\" aria-label=\"Reference 23: LCMC3\">23</a></sup>; their pathological responses remain hypothesis-generating across differing populations and designs.</p>\n<p>Three cycles of neoadjuvant nivolumab plus platinum-doublet chemotherapy improved five-year overall survival, event-free survival and pathological complete response without reducing definitive surgery in CheckMate 816 (five-year overall survival 65.4% versus 55.0%; HR 0.72). Grade 3-4 treatment-related toxicity was similar to chemotherapy alone, making this a concise neoadjuvant option without mandated postoperative nivolumab<sup class=\"trial-ref\"><a href=\"#ref-lung-nsclc-early-and-locally-advanced-disease-t-checkmate-816\" aria-label=\"Reference 24: CheckMate 816\">24</a></sup>.</p>\n<p>Perioperative regimens add approximately one year of checkpoint inhibition after surgery. Their comparative efficacy and the independent contribution of the postoperative component are not established, so selection should account for trial population, regulator access, toxicity, pathological findings and the practical likelihood of completing postoperative therapy.</p>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\">Pembrolizumab plus four cycles of neoadjuvant cisplatin-based chemotherapy followed by up to 13 postoperative cycles improved both overall and event-free survival in KEYNOTE-671 (36-month overall survival 71% versus 64%; HR 0.72).</span><span class=\"evidence-detail\">Grade 3-5 treatment-related adverse events occurred in 44.9% versus 37.3%, and postoperative mortality was numerically higher<sup class=\"trial-ref\"><a href=\"#ref-lung-nsclc-early-and-locally-advanced-disease-t-keynote-671\" aria-label=\"Reference 25: KEYNOTE-671\">25</a></sup>.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">Durvalumab plus four cycles of neoadjuvant platinum chemotherapy followed by up to 12 postoperative cycles improved interim event-free survival and pathological complete response in the EGFR/ALK-negative efficacy population in AEGEAN (EFS HR 0.68; pCR 17.2% versus 4.3%).</span><span class=\"evidence-detail\">Overall survival was not mature in the accepted primary report<sup class=\"trial-ref\"><a href=\"#ref-lung-nsclc-early-and-locally-advanced-disease-t-aegean\" aria-label=\"Reference 26: AEGEAN\">26</a></sup>.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">Nivolumab plus four cycles of neoadjuvant platinum chemotherapy followed by one year of nivolumab improved interim event-free survival in CheckMate 77T (18-month 70.2% versus 50.0%; HR 0.58).</span><span class=\"evidence-detail\">Pathological response comparisons were descriptive, and two treatment-related pneumonitis deaths occurred with nivolumab<sup class=\"trial-ref\"><a href=\"#ref-lung-nsclc-early-and-locally-advanced-disease-t-checkmate-77t\" aria-label=\"Reference 27: CheckMate 77T\">27</a></sup>.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">Toripalimab improved event-free survival and major pathological response in the reported stage III cohort of Neotorch, but overall survival was still uncertain and grade 3 or worse adverse events were more frequent.</span><span class=\"evidence-detail\">The stage II cohort remained blinded at that publication, so the result should not be generalized beyond the analysed population<sup class=\"trial-ref\"><a href=\"#ref-lung-nsclc-early-and-locally-advanced-disease-t-neotorch\" aria-label=\"Reference 28: Neotorch\">28</a></sup>.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">Perioperative tislelizumab improved final overall survival and event-free survival in stage II-IIIA disease in RATIONALE-315 (36-month overall survival 79.3% versus 69.3%; HR 0.65).</span><span class=\"evidence-detail\">Grade 3 or worse treatment-related events occurred in 73.0% versus 67.3%; use the locally approved regimen-specific protocol for chemotherapy selection and dosing<sup class=\"trial-ref\"><a href=\"#ref-lung-nsclc-early-and-locally-advanced-disease-t-rationale-315\" aria-label=\"Reference 29: RATIONALE-315\">29</a></sup>.</span></li></ul>\n<h3 id=\"s-egfr-and-alk-directed-neoadjuvant-therapy-remains-selective\">EGFR- and ALK-directed neoadjuvant therapy remains selective</h3>\n<p>NeoADAURA increased major pathological response with neoadjuvant osimertinib with or without chemotherapy, but event-free survival was immature and more than 90% of operated patients in every arm received adjuvant osimertinib. The trial therefore does not establish that preoperative osimertinib should replace prompt resection followed by indicated chemotherapy and adjuvant osimertinib<sup class=\"trial-ref\"><a href=\"#ref-lung-nsclc-early-and-locally-advanced-disease-t-neoadaura\" aria-label=\"Reference 30: NeoADAURA\">30</a></sup>.</p>\n<p>Single-arm neoadjuvant targeted studies can inform trials and exceptional multidisciplinary decisions but do not define a general standard. LORIN reported high pathological response among operated patients with stage III ALK-fusion disease, including some initially considered unresectable, but survival follow-up was short and the operated analysis was post-randomisation<sup class=\"trial-ref\"><a href=\"#ref-lung-nsclc-early-and-locally-advanced-disease-t-lorin\" aria-label=\"Reference 31: LORIN\">31</a></sup>.</p>\n<h2 id=\"s-after-surgery-match-adjuvant-therapy-to-pathological-risk-and-genotype\">After surgery: match adjuvant therapy to pathological risk and genotype</h2>\n<h3 id=\"s-platinum-chemotherapy-remains-the-backbone-for-stage-ii-iii-disease\">Platinum chemotherapy remains the backbone for stage II-III disease</h3>\n<p>Offer four cycles of a cisplatin-based doublet after complete resection of stage II or III disease when chemotherapy was not given preoperatively and the patient is fit. LACE showed a 5.4-point absolute overall-survival gain at five years (HR 0.89), with a 0.9% chemotherapy-death rate and increased early non-lung-cancer mortality<sup class=\"trial-ref\"><a href=\"#ref-lung-nsclc-early-and-locally-advanced-disease-t-lace-lung-adjuvant-cisplatin-evaluation-meta-analysis\" aria-label=\"Reference 12: LACE (Lung Adjuvant Cisplatin Evaluation) meta-analysis\">12</a></sup>.</p>\n<p>Cisplatin-vinorelbine has direct survival evidence from JBR.10 and ANITA but causes substantial neutropenia and febrile neutropenia. Histology-appropriate cisplatin-pemetrexed is often better tolerated in nonsquamous disease; cisplatin-gemcitabine or cisplatin-docetaxel are alternatives for squamous disease. Carboplatin should usually be reserved for patients unable to receive cisplatin<sup class=\"trial-ref\"><a href=\"#ref-lung-nsclc-early-and-locally-advanced-disease-t-jbr-10-ncic-ctg\" aria-label=\"Reference 32: JBR.10 (NCIC CTG)\">32</a></sup><sup class=\"trial-ref\"><a href=\"#ref-lung-nsclc-early-and-locally-advanced-disease-t-anita\" aria-label=\"Reference 33: ANITA\">33</a></sup>.</p>\n<p>The IALT experience supports both the benefit and the need for long-term caution: the early overall-survival advantage attenuated with extended follow-up, while disease-free survival remained improved and late non-lung-cancer mortality was higher. This does not reverse the pooled standard for fit stage II-III patients, but it reinforces careful selection and survivorship management<sup class=\"trial-ref\"><a href=\"#ref-lung-nsclc-early-and-locally-advanced-disease-t-ialt-international-adjuvant-lung-cancer-trial\" aria-label=\"Reference 34: IALT (International Adjuvant Lung Cancer Trial)\">34</a></sup>.</p>\n<h3 id=\"s-genotype-directed-adjuvant-treatment\">Genotype-directed adjuvant treatment</h3>\n<p>For completely resected EGFR exon 19 deletion or L858R disease, osimertinib for three years improved both disease-free and overall survival (five-year overall survival 88% versus 78% in stage IB-IIIA; HR 0.49). Give platinum chemotherapy first when indicated; osimertinib is not a substitute for the established chemotherapy benefit in fit stage II-III patients<sup class=\"trial-ref\"><a href=\"#ref-lung-nsclc-early-and-locally-advanced-disease-t-adaura\" aria-label=\"Reference 15: ADAURA\">15</a></sup>.</p>\n<p>For completely resected ALK-positive disease at least 4 cm or node positive, alectinib for two years improved disease-free survival over four cycles of platinum chemotherapy (stage II-IIIA two-year DFS 93.8% versus 63.0%; HR 0.24). Overall survival was immature, and the comparator means this strategy replaces rather than follows chemotherapy in the pivotal trial<sup class=\"trial-ref\"><a href=\"#ref-lung-nsclc-early-and-locally-advanced-disease-t-alina\" aria-label=\"Reference 16: ALINA\">16</a></sup>.</p>\n<p>Adjuvant ensartinib and selpercatinib have positive 2026 disease-control results in ALK-positive and RET fusion-positive disease, respectively, but overall survival is immature and availability is jurisdiction-specific. Discuss them only within current regulatory access or a clinical trial rather than extrapolating a class effect from metastatic disease<sup class=\"trial-ref\"><a href=\"#ref-lung-nsclc-early-and-locally-advanced-disease-t-elevate\" aria-label=\"Reference 35: ELEVATE\">35</a></sup><sup class=\"trial-ref\"><a href=\"#ref-lung-nsclc-early-and-locally-advanced-disease-t-libretto-432\" aria-label=\"Reference 36: LIBRETTO-432\">36</a></sup>.</p>\n<h3 id=\"s-adjuvant-immunotherapy-is-for-selected-oncogene-negative-disease\">Adjuvant immunotherapy is for selected oncogene-negative disease</h3>\n<p>After complete resection and cisplatin-based chemotherapy, atezolizumab improved disease-free survival in the alpha-protected stage II-IIIA PD-L1 tumour-cell ≥1% population. The largest point estimates occurred in unadjusted PD-L1 tumour-cell ≥50% subgroups, but no treatment-by-PD-L1 interaction test was reported. Final ITT DFS was not significant and interim ITT overall survival was nonformal<sup class=\"trial-ref\"><a href=\"#ref-lung-nsclc-early-and-locally-advanced-disease-t-impower010\" aria-label=\"Reference 37: IMpower010\">37</a></sup>.</p>\n<p>Pembrolizumab for up to one year improved interim disease-free survival in the overall resected stage IB at least 4 cm to IIIA population, but not in the PD-L1 TPS at least 50% co-primary population; overall survival was immature. The evidence does not support using PD-L1 alone to predict benefit<sup class=\"trial-ref\"><a href=\"#ref-lung-nsclc-early-and-locally-advanced-disease-t-keynote-091-pearls\" aria-label=\"Reference 38: KEYNOTE-091 (PEARLS)\">38</a></sup>.</p>\n<p>Negative trials constrain cross-trial extrapolation. One year of adjuvant nivolumab did not improve disease-free or overall survival in ANVIL<sup class=\"trial-ref\"><a href=\"#ref-lung-nsclc-early-and-locally-advanced-disease-t-anvil-alchemist\" aria-label=\"Reference 39: ANVIL (ALCHEMIST)\">39</a></sup>, and durvalumab did not improve disease-free survival in BR.31<sup class=\"trial-ref\"><a href=\"#ref-lung-nsclc-early-and-locally-advanced-disease-ext-e2b12a253a60\" aria-label=\"Reference 40: BR.31 primary publication\">40</a></sup>. Do not assume that any checkpoint inhibitor, assay threshold or treatment duration is interchangeable with a positive regimen.</p>\n<h3 id=\"s-postoperative-radiotherapy-is-not-routine-after-r0-resection\">Postoperative radiotherapy is not routine after R0 resection</h3>\n<p>Do not give routine PORT after complete resection solely because pN2 disease is present. Lung ART did not improve disease-free or overall survival, reduced mediastinal relapse and increased grade 3 or worse toxicity; PORT-C likewise did not improve its primary disease-free-survival analysis after complete resection and chemotherapy<sup class=\"trial-ref\"><a href=\"#ref-lung-nsclc-early-and-locally-advanced-disease-t-lung-art\" aria-label=\"Reference 41: Lung ART\">41</a></sup><sup class=\"trial-ref\"><a href=\"#ref-lung-nsclc-early-and-locally-advanced-disease-ext-427186abbc95\" aria-label=\"Reference 42: PORT-C\">42</a></sup>.</p>\n<p>Use postoperative radiotherapy selectively for microscopically or macroscopically positive margins when re-resection is not feasible, after multidisciplinary review of recurrence risk, field size and cardiopulmonary toxicity. High-risk nodal features alone do not establish an overall-survival benefit from PORT in an R0-resected patient.</p>\n<h2 id=\"s-stage-iii-separate-potentially-resectable-from-unresectable-disease\">Stage III: separate potentially resectable from unresectable disease</h2>\n<p>Potentially resectable stage III disease is a multidisciplinary category, not a TNM label. Surgery after induction therapy may be considered when R0 resection of the primary and involved nodes is plausible, N3 disease is absent, perioperative mortality is expected to be no more than 5%, and lobectomy or sleeve resection is feasible; planned pneumonectomy, bulky multistation N2 or progressive disease weighs against surgery<sup class=\"trial-ref\"><a href=\"#ref-lung-nsclc-early-and-locally-advanced-disease-ext-cd03a60382f4\" aria-label=\"Reference 6: ASCO stage III NSCLC guideline\">6</a></sup>.</p>\n<p>For an incidental pathological N2 finding after upfront R0 resection, give adjuvant platinum chemotherapy if not previously delivered and select genotype-directed or immune therapy according to the postoperative algorithm. PORT is not routine for R0 disease. For known N2 disease, either a planned multimodality surgical pathway in a high-volume team or definitive chemoradiation is preferable to unplanned surgery followed by rescue therapy.</p>\n<h2 id=\"s-unresectable-stage-iii-definitive-chemoradiation-followed-by-biomarker-directed-consolidation\">Unresectable stage III: definitive chemoradiation followed by biomarker-directed consolidation</h2>\n<h3 id=\"s-deliver-concurrent-chemoradiation-when-the-patient-is-fit\">Deliver concurrent chemoradiation when the patient is fit</h3>\n<p>Concurrent platinum-based chemoradiation improves overall survival over sequential treatment, principally through better locoregional control (HR 0.84; absolute gain 4.5% at five years), but increases grade 3-4 acute oesophagitis from 4% to 18%. Use sequential chemotherapy and radiotherapy when comorbidity, frailty or treatment volume makes concurrent therapy unsafe<sup class=\"trial-ref\"><a href=\"#ref-lung-nsclc-early-and-locally-advanced-disease-ext-406605233e19\" aria-label=\"Reference 43: Individual-patient-data chemoradiation meta-analysis\">43</a></sup>.</p>\n<p>Use definitive thoracic radiotherapy to about 60 Gy with a concurrent radiosensitising platinum doublet. Do not escalate routinely to 74 Gy: the randomised RTOG 0617 comparison showed worse survival with 74 Gy, and adding cetuximab did not improve outcome<sup class=\"trial-ref\"><a href=\"#ref-lung-nsclc-early-and-locally-advanced-disease-ext-24792170f203\" aria-label=\"Reference 44: RTOG 0617\">44</a></sup>.</p>\n<p>Common concurrent regimens are cisplatin-etoposide, weekly carboplatin-paclitaxel, or cisplatin-pemetrexed for nonsquamous histology. PROCLAIM did not show superior overall or progression-free survival with cisplatin-pemetrexed over cisplatin-etoposide.</p>\n<p>Grade 3–4 toxicity was lower across the whole treatment course, which used different consolidation regimens, while any-grade pneumonitis was more frequent; the comparison does not isolate concurrent-doublet tolerability. Choose according to histology, renal function, marrow reserve and pulmonary risk<sup class=\"trial-ref\"><a href=\"#ref-lung-nsclc-early-and-locally-advanced-disease-t-proclaim\" aria-label=\"Reference 45: PROCLAIM\">45</a></sup>.</p>\n<h3 id=\"s-consolidate-according-to-egfr-status\">Consolidate according to EGFR status</h3>\n<p>For unresectable stage III disease without progression after platinum-based concurrent chemoradiation and without a sensitising EGFR alteration, offer durvalumab for up to 12 months. PACIFIC improved progression-free and overall survival, with five-year overall survival of 42.9% versus 33.4%; pneumonitis or radiation pneumonitis occurred in 33.9% versus 24.8%<sup class=\"trial-ref\"><a href=\"#ref-lung-nsclc-early-and-locally-advanced-disease-t-pacific\" aria-label=\"Reference 46: PACIFIC\">46</a></sup>.</p>\n<p>Durvalumab can be considered after sequential chemoradiation when concurrent treatment was unsuitable, but the specific evidence is less secure. PACIFIC-5 improved progression-free survival across a mixed concurrent and sequential population, while the sequential subgroup was exploratory, both confidence intervals crossed 1 and no interaction test was reported<sup class=\"trial-ref\"><a href=\"#ref-lung-nsclc-early-and-locally-advanced-disease-t-pacific-5\" aria-label=\"Reference 47: PACIFIC-5\">47</a></sup>.</p>\n<p>For unresectable stage III disease with EGFR exon 19 deletion or L858R and no progression during or after concurrent or sequential platinum chemoradiation, give osimertinib 80 mg daily until progression or unacceptable toxicity. LAURA improved median progression-free survival from 5.6 to 39.1 months (HR 0.16); overall survival was immature, and interstitial lung disease requires active monitoring<sup class=\"trial-ref\"><a href=\"#ref-lung-nsclc-early-and-locally-advanced-disease-t-laura\" aria-label=\"Reference 48: LAURA\">48</a></sup><sup class=\"trial-ref\"><a href=\"#ref-lung-nsclc-early-and-locally-advanced-disease-ext-4d5ab8b180dd\" aria-label=\"Reference 49: FDA osimertinib stage III approval\">49</a></sup>.</p>\n<p>Starting immunotherapy concurrently with chemoradiation has not improved on the consolidation strategy. PACIFIC-2 did not improve progression-free or overall survival with durvalumab from the start of chemoradiation, and CheckMate 73L did not improve progression-free survival with concurrent nivolumab followed by nivolumab-ipilimumab compared with chemoradiation followed by durvalumab<sup class=\"trial-ref\"><a href=\"#ref-lung-nsclc-early-and-locally-advanced-disease-ext-db9efec6d6ca\" aria-label=\"Reference 50: PACIFIC-2\">50</a></sup><sup class=\"trial-ref\"><a href=\"#ref-lung-nsclc-early-and-locally-advanced-disease-ext-0627a0eda1be\" aria-label=\"Reference 51: CheckMate 73L\">51</a></sup>.</p>\n<h2 id=\"s-surveillance-after-curative-intent-treatment\">Surveillance after curative-intent treatment</h2>\n<p>Use history, examination and chest CT including the adrenals every six months for two years, then annually to detect recurrence and new primary lung cancers. Contrast is preferred during the first two years when appropriate. Do not use routine PET-CT, brain MRI or circulating biomarkers for asymptomatic surveillance; investigate symptoms and indeterminate radiographic abnormalities outside this schedule<sup class=\"trial-ref\"><a href=\"#ref-lung-nsclc-early-and-locally-advanced-disease-ext-b0ae62b17079\" aria-label=\"Reference 52: ASCO lung cancer surveillance guideline\">52</a></sup>.</p>\n<p>Offer surveillance only when detection of recurrence or a new primary could lead to treatment the patient would accept. At suspected relapse, restage according to the clinical problem, obtain tissue when it can change management, and use the metastatic NSCLC chapter for systemic selection and sequencing.</p>\n<h2 id=\"s-references\">References</h2>\n<ol class=\"refs\">\n<li id=\"ref-lung-nsclc-early-and-locally-advanced-disease-ext-92f88ec6ffb1\"><a href=\"https://www.uspreventiveservicestaskforce.org/uspstf/document/RecommendationStatementFinal/lung-cancer-screening\" rel=\"noopener\" target=\"_blank\">USPSTF lung cancer screening recommendation</a></li>\n<li id=\"ref-lung-nsclc-early-and-locally-advanced-disease-t-nlst-national-lung-screening-trial\"><a class=\"trial-link\" href=\"/evidence/#t-nlst-national-lung-screening-trial\">NLST (National Lung Screening Trial)</a>. <a href=\"https://drive.google.com/file/d/1x7mTwYG0HcjeNpgVzTAxcnzh89hmXSIX/preview\">N Engl J Med 2011;365:395-409</a></li>\n<li id=\"ref-lung-nsclc-early-and-locally-advanced-disease-t-nelson-dutch-belgian-lung-cancer-screening\"><a class=\"trial-link\" href=\"/evidence/#t-nelson-dutch-belgian-lung-cancer-screening\">NELSON (Dutch-Belgian Lung Cancer Screening)</a>. <a href=\"https://drive.google.com/file/d/1_FzXzWjbm8izCHEDV2mXjTaL141Uvj0h/preview\">N Engl J Med 2020;382:503-513</a></li>\n<li id=\"ref-lung-nsclc-early-and-locally-advanced-disease-ext-53eece58bc1d\"><a href=\"https://pubmed.ncbi.nlm.nih.gov/38042167/\" rel=\"noopener\" target=\"_blank\">TALENT prospective cohort</a></li>\n<li id=\"ref-lung-nsclc-early-and-locally-advanced-disease-ext-35446abae6e6\"><a href=\"https://www.iaslc.org/file/10871/download?token=DmNIDkWP\" rel=\"noopener\" target=\"_blank\">IASLC ninth-edition lung cancer TNM chart</a></li>\n<li id=\"ref-lung-nsclc-early-and-locally-advanced-disease-ext-cd03a60382f4\"><a href=\"https://pubmed.ncbi.nlm.nih.gov/34936470/\" rel=\"noopener\" target=\"_blank\">ASCO stage III NSCLC guideline</a></li>\n<li id=\"ref-lung-nsclc-early-and-locally-advanced-disease-ext-61367f232d47\"><a href=\"https://pubmed.ncbi.nlm.nih.gov/23649437/\" rel=\"noopener\" target=\"_blank\">ACCP physiologic evaluation guideline</a></li>\n<li id=\"ref-lung-nsclc-early-and-locally-advanced-disease-ext-e135371d975e\"><a href=\"https://pubmed.ncbi.nlm.nih.gov/367806
