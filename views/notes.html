idence/#t-tropion-breast01\">TROPION-Breast01</a>. <a href=\"https://drive.google.com/file/d/11am4f_UxcZnmqF7VBmi8imy9uDSLCq8P/preview\">J Clin Oncol 2025;43:285-296</a></li>\n<li id=\"ref-breast-metastatic-breast-cancer-t-h0648g-pivotal-trastuzumab\"><a class=\"trial-link\" href=\"/evidence/#t-h0648g-pivotal-trastuzumab\">H0648g (pivotal trastuzumab)</a>. <a href=\"https://drive.google.com/file/d/1CNniNTfjj2EUilEjIzv-iQcRKSk9iQ0N/preview\">N Engl J Med 2001;344:783-792</a></li>\n<li id=\"ref-breast-metastatic-breast-cancer-t-cleopatra\"><a class=\"trial-link\" href=\"/evidence/#t-cleopatra\">CLEOPATRA</a>. <a href=\"https://drive.google.com/file/d/1AyjgRVvoS0vRHp8QwuHDHvcwV1BVNxwe/preview\">N Engl J Med 2012;366:109-119</a>; <a href=\"https://drive.google.com/file/d/1Skw0EeikrZYMUmwtT7DiFvjAR7k-8hkg/preview\">Lancet Oncol 2013;14:461-471</a>; <a href=\"https://drive.google.com/file/d/1xEPtgrhEzpy-CsqBNqXqApbASt5g3zeS/preview\">N Engl J Med 2015;372:724-734</a>; <a href=\"https://drive.google.com/file/d/1wdriWGhYnYFw0UtyrZ5iUIa2iJDSWtva/preview\">Lancet Oncol 2020;21:519-530</a></li>\n<li id=\"ref-breast-metastatic-breast-cancer-t-peruse\"><a class=\"trial-link\" href=\"/evidence/#t-peruse\">PERUSE</a>. <a href=\"https://drive.google.com/file/d/1wLZNGzNfhuy1r8jQaKMlKjVUOdqlORD8/preview\">Ann Oncol 2019;30:766-773</a>; <a href=\"https://drive.google.com/file/d/1ZFU5vT7kMXarBGD8BjNXwcSg7-5y1nVc/preview\">Ann Oncol 2021;32:1245-1255</a></li>\n<li id=\"ref-breast-metastatic-breast-cancer-t-destiny-breast09\"><a class=\"trial-link\" href=\"/evidence/#t-destiny-breast09\">DESTINY-Breast09</a>. <a href=\"https://drive.google.com/file/d/10KibuTAgKKvxYQsvI_ChtrVDt1EP1mHD/preview\">N Engl J Med 2026;394:551-562</a></li>\n<li id=\"ref-breast-metastatic-breast-cancer-t-patina\"><a class=\"trial-link\" href=\"/evidence/#t-patina\">PATINA</a>. <a href=\"https://drive.google.com/file/d/16r3NUrP-z8m_2eIPkhGUTq6stRQzvTsX/preview\">N Engl J Med 2026;394:451-462</a></li>\n<li id=\"ref-breast-metastatic-breast-cancer-t-her2climb-05\"><a class=\"trial-link\" href=\"/evidence/#t-her2climb-05\">HER2CLIMB-05</a>. <a href=\"https://drive.google.com/file/d/1bR_cACxg347IRusZALY6ru9vY9CYn_yZ/preview\">J Clin Oncol 2026;44:1597-1607</a></li>\n<li id=\"ref-breast-metastatic-breast-cancer-t-her2climb\"><a class=\"trial-link\" href=\"/evidence/#t-her2climb\">HER2CLIMB</a>. <a href=\"https://drive.google.com/file/d/1PCYUN4gZmfcf0tQDYSHO9YLnlnT8p3YR/preview\">N Engl J Med 2020;382:597-609</a></li>\n<li id=\"ref-breast-metastatic-breast-cancer-t-emilia\"><a class=\"trial-link\" href=\"/evidence/#t-emilia\">EMILIA</a>. <a href=\"https://drive.google.com/file/d/1M9t0sBjzrUmxXfZeU06ZJo7oZVTqxuyh/preview\">N Engl J Med 2012;367:1783-1791</a></li>\n<li id=\"ref-breast-metastatic-breast-cancer-t-destiny-breast03\"><a class=\"trial-link\" href=\"/evidence/#t-destiny-breast03\">DESTINY-Breast03</a>. <a href=\"https://drive.google.com/file/d/1VILwT_JfhHk85eWw9lN1nVbr6HqkkUm0/preview\">N Engl J Med 2022;386:1143-1154</a></li>\n<li id=\"ref-breast-metastatic-breast-cancer-t-nala\"><a class=\"trial-link\" href=\"/evidence/#t-nala\">NALA</a>. <a href=\"https://drive.google.com/file/d/1de5DMm66aS8II5JWM4x9dHexPrFVaqBt/preview\">J Clin Oncol 2020;38:3138-3149</a></li>\n<li id=\"ref-breast-metastatic-breast-cancer-t-egf100151-lapatinib-capecitabine\"><a class=\"trial-link\" href=\"/evidence/#t-egf100151-lapatinib-capecitabine\">EGF100151 (lapatinib + capecitabine)</a>. <a href=\"https://drive.google.com/file/d/11LZq8by21Ko7biSMCc-Q3AotFaFef6PV/preview\">N Engl J Med 2006;355:2733-2743</a></li>\n<li id=\"ref-breast-metastatic-breast-cancer-t-destiny-breast01\"><a class=\"trial-link\" href=\"/evidence/#t-destiny-breast01\">DESTINY-Breast01</a>. <a href=\"https://drive.google.com/file/d/1as5ff6e3GQBT0V14w8XFMmHJz_77TPTg/preview\">N Engl J Med 2020;382:610-621</a></li>\n<li id=\"ref-breast-metastatic-breast-cancer-t-destiny-breast02\"><a class=\"trial-link\" href=\"/evidence/#t-destiny-breast02\">DESTINY-Breast02</a>. <a href=\"https://drive.google.com/file/d/1jnOIJepghEImFX6fB-cEf7aNaPjLnQJ2/preview\">Lancet 2023;401:1773-1785</a></li>\n<li id=\"ref-breast-metastatic-breast-cancer-t-th3resa\"><a class=\"trial-link\" href=\"/evidence/#t-th3resa\">TH3RESA</a>. <a href=\"https://drive.google.com/file/d/1-Q4p-sND-AL9oAq0RMfJcGgmnhKuqB86/preview\">Lancet Oncol 2014;15:689-699; Lancet Oncol 2017;18:743-754</a>; <a href=\"https://drive.google.com/file/d/1HQEu46p-XO_Ov83F3ZYdHa14BTcat7an/preview\">Krop et al. - 2017 - Trastuzumab emtansine versus treatment of physician&#x27;s choice in patients with previously treated [664afd5c]</a></li>\n<li id=\"ref-breast-metastatic-breast-cancer-t-horizon-breast01\"><a class=\"trial-link\" href=\"/evidence/#t-horizon-breast01\">HORIZON-Breast01</a>. <a href=\"https://drive.google.com/file/d/1TxMHHMc5wlqSCrJNIM4z0useL7b6j5IJ/preview\">Lancet Oncol 2026 (online ahead of print)</a></li>\n<li id=\"ref-breast-metastatic-breast-cancer-t-sophia\"><a class=\"trial-link\" href=\"/evidence/#t-sophia\">SOPHIA</a>. <a href=\"https://drive.google.com/file/d/1wfJM1B1BJLjEDIzBKRwYhyhZVFQUaJk4/preview\">JAMA Oncol 2021;7:573-584</a></li>\n<li id=\"ref-breast-metastatic-breast-cancer-t-precious\"><a class=\"trial-link\" href=\"/evidence/#t-precious\">PRECIOUS</a>. <a href=\"https://drive.google.com/file/d/1Sdor5TLrryrhyuwR-JRNPgObmp8YiCSB/preview\">Cancer Sci 2022;113:3169-3179</a>; <a href=\"https://drive.google.com/file/d/1OxzX9s-hwC3v4Leh65K3Xk2J2YOk01Zi/preview\">J Clin Oncol 2025;43:1631-1637</a></li>\n<li id=\"ref-breast-metastatic-breast-cancer-t-destiny-breast12\"><a class=\"trial-link\" href=\"/evidence/#t-destiny-breast12\">DESTINY-Breast12</a>. <a href=\"https://drive.google.com/file/d/1UEeL_-PIxmdVOBHoeb22WtZoVtyCubsV/preview\">Nat Med 2024;30:3717-3727</a></li>\n<li id=\"ref-breast-metastatic-breast-cancer-t-keynote-355\"><a class=\"trial-link\" href=\"/evidence/#t-keynote-355\">KEYNOTE-355</a>. <a href=\"https://drive.google.com/file/d/190UZrnw9AGYVv2ZwzN2jR3u8fT0Qs5io/preview\">Lancet 2020;396:1817-1828</a>; <a href=\"https://drive.google.com/file/d/1jpV8k5dIi8kW62Y7RMNuhy8dVHJJlJ0V/preview\">N Engl J Med 2022;387:217-226</a></li>\n<li id=\"ref-breast-metastatic-breast-cancer-t-impassion130\"><a class=\"trial-link\" href=\"/evidence/#t-impassion130\">IMpassion130</a>. <a href=\"https://drive.google.com/file/d/1TzdCnQ99y_0vIbzr_c3WEI1dUfwF7K9v/preview\">N Engl J Med 2018;379:2108-2121</a>; <a href=\"https://drive.google.com/file/d/1UC9DqB9Tt_6YnJjCnpOlZj1ptyQXKCVG/preview\">Lancet Oncol 2020;21:44-59</a>; <a href=\"https://drive.google.com/file/d/1JJOb9QYp72iURXZqptK7-BykgE9bH96d/preview\">Ann Oncol 2021;32:983-993</a></li>\n<li id=\"ref-breast-metastatic-breast-cancer-t-impassion131\"><a class=\"trial-link\" href=\"/evidence/#t-impassion131\">IMpassion131</a>. <a href=\"https://drive.google.com/file/d/1OBF9G282d0mTyPedp0Q984NYlikSaqAp/preview\">Ann Oncol 2021;32:994-1004</a></li>\n<li id=\"ref-breast-metastatic-breast-cancer-t-ascent-04-keynote-d19\"><a class=\"trial-link\" href=\"/evidence/#t-ascent-04-keynote-d19\">ASCENT-04 (KEYNOTE-D19)</a>. <a href=\"https://drive.google.com/file/d/1V6W63Ek9kxRIBlcCD7RG9Ax_guAvyx8A/preview\">N Engl J Med 2026;394:354-366</a></li>\n<li id=\"ref-breast-metastatic-breast-cancer-t-ascent-03\"><a class=\"trial-link\" href=\"/evidence/#t-ascent-03\">ASCENT-03</a>. <a href=\"https://drive.google.com/file/d/1L9pV2YP_DrIy8mNcNy3TcdUaBbuZxkFw/preview\">N Engl J Med 2025;393:1912-1925</a></li>\n<li id=\"ref-breast-metastatic-breast-cancer-t-tropion-breast02\"><a class=\"trial-link\" href=\"/evidence/#t-tropion-breast02\">TROPION-Breast02</a>. <a href=\"https://drive.google.com/file/d/1Q4CjbCuP_2aMI0YD5KP6pMWPk1QpSSwI/preview\">Ann Oncol 2026 (online ahead of print)</a></li>\n<li id=\"ref-breast-metastatic-breast-cancer-t-tnt-cruk-07-012\"><a class=\"trial-link\" href=\"/evidence/#t-tnt-cruk-07-012\">TNT (CRUK/07/012)</a>. <a href=\"https://drive.google.com/file/d/1gVZ3sNC028zne5q_rAML3pSnJhSXSwLg/preview\">Nat Med 2018;24:628-637</a></li>\n<li id=\"ref-breast-metastatic-breast-cancer-t-ascent\"><a class=\"trial-link\" href=\"/evidence/#t-ascent\">ASCENT</a>. <a href=\"https://drive.google.com/file/d/1rA556DzeRe2qWPKOCYLEHwy3dMl8mOm2/preview\">N Engl J Med 2021;384:1529-1541</a>; <a href=\"https://drive.google.com/file/d/1VSLpegkTqsy60LbYCp-VQdj9aMnUyEes/preview\">J Clin Oncol 2024;42:1738-1744</a></li>\n<li id=\"ref-breast-metastatic-breast-cancer-ext-29bf1e5a1d73\"><a href=\"https://www.cancer.gov/types/breast/hp/breast-treatment-pdq\" rel=\"noopener\" target=\"_blank\">NCI Breast Cancer Treatment PDQ - metastatic disease</a></li>\n<li id=\"ref-breast-metastatic-breast-cancer-ext-21b7e528ed6f\"><a href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC8917399/\" rel=\"noopener\" target=\"_blank\">ASCO-SNO-ASTRO Treatment for Brain Metastases guideline</a></li>\n</ol>", "_hay": "metastatic breast cancer metastatic-breast-cancer breast work-up at the point of metastatic diagnosis endocrine therapy or chemotherapy first hormone receptor-positive, her2-negative disease first-line endocrine therapy with a cdk4/6 inhibitor choosing between the three inhibitors premenopausal patients aggressive disease without visceral crisis first line when the disease is already endocrine-resistant deferring the cdk4/6 inhibitor endocrine monotherapy and the first-line alternatives second line: reading the first-line regimen esr1-mutant disease and the oral serds switching on molecular progression pi3k–akt–mtor-altered disease continuing cdk4/6 inhibition beyond progression her2-low and her2-ultralow expression trop2 antibody–drug conjugates germline brca-mutated disease her2-positive disease first line maintenance intensification and hormone receptor-positive overlap second line third line and beyond brain metastases triple-negative disease first line at pd-l1 combined positive score of 10 or more first line when immunotherapy is not an option germline brca-mutated disease and platinum pretreated disease cytotoxic chemotherapy special situations references"}, {"id": "breast-neoadjuvant-therapy-for-breast-cancer", "slug": "neoadjuvant-therapy-for-breast-cancer", "group": "Breast", "title": "Neoadjuvant therapy for breast cancer", "updated": "", "sections": [{"id": "s-what-neoadjuvant-therapy-is-for", "h": "What neoadjuvant therapy is for", "depth": 2}, {"id": "s-patient-selection", "h": "Patient selection", "depth": 2}, {"id": "s-work-up-before-starting", "h": "Work-up before starting", "depth": 2}, {"id": "s-assessment-on-and-after-treatment", "h": "Assessment on and after treatment", "depth": 2}, {"id": "s-pathological-complete-response-as-an-endpoint", "h": "Pathological complete response as an endpoint", "depth": 2}, {"id": "s-triple-negative-disease", "h": "Triple-negative disease", "depth": 2}, {"id": "s-the-chemotherapy-backbone-and-the-carboplatin-question", "h": "The chemotherapy backbone and the carboplatin question", "depth": 3}, {"id": "s-chemo-immunotherapy", "h": "Chemo-immunotherapy", "depth": 3}, {"id": "s-her2-positive-disease", "h": "HER2-positive disease", "depth": 2}, {"id": "s-establishing-dual-blockade", "h": "Establishing dual blockade", "depth": 3}, {"id": "s-paring-down-the-chemotherapy-backbone", "h": "Paring down the chemotherapy backbone", "depth": 3}, {"id": "s-an-antibody-drug-conjugate-front-end", "h": "An antibody–drug conjugate front end", "depth": 3}, {"id": "s-chemotherapy-free-and-response-adapted-strategies", "h": "Chemotherapy-free and response-adapted strategies", "depth": 3}, {"id": "s-hr-positive-her2-negative-disease", "h": "HR-positive, HER2-negative disease", "depth": 2}, {"id": "s-post-neoadjuvant-therapy-for-residual-disease", "h": "Post-neoadjuvant therapy for residual disease", "depth": 2}, {"id": "s-references", "h": "References", "depth": 2}], "html": "<h2 id=\"s-what-neoadjuvant-therapy-is-for\">What neoadjuvant therapy is for</h2>\n<p>Neoadjuvant systemic therapy does three things that adjuvant therapy cannot.</p>\n<ul><li class=\"evidence-prose\">It downstages disease in the breast and the axilla, allowing less extensive surgery, better cosmesis and fewer complications such as lymphoedema, and it can render an inoperable tumour operable.</li><li class=\"evidence-prose\"><span class=\"evidence-lead\">It tests the biology of the tumour in vivo.</span><span class=\"evidence-detail\">The presence and extent of residual invasive cancer at surgery is a strong prognostic factor for recurrence, particularly in triple-negative and HER2-positive disease.</span></li><li class=\"evidence-prose\">It converts that readout into a treatment decision: residual disease triggers post-neoadjuvant escalation.</li></ul>\n<p>Moving chemotherapy before surgery has not been shown to improve survival. The <a class=\"trial-link\" href=\"/evidence/#t-ebctcg-neoadjuvant-meta-analysis\">EBCTCG neoadjuvant meta-analysis</a> pooled patient-level data from ten randomised trials (4,756 women entered 1983–2002, median follow-up 9 years) comparing neoadjuvant chemotherapy with the identical adjuvant regimen.</p>\n<p>Breast-conserving therapy rose (65% vs 49%), 15-year local recurrence rose (21.4% vs 15.9%; RR 1.37, 95% CI 1.17–1.61, p=0.0001), and there was no significant difference in distant recurrence (RR 1.02, 0.92–1.14), breast cancer mortality (RR 1.06, 0.95–1.18) or all-cause mortality (RR 1.04, 0.94–1.15) (Lancet Oncol 2018;19:27-39).</p>\n<p>The local-recurrence excess is not simply an artefact of good responders skipping surgery. It was largest in the two trials that permitted omission of surgery (10-year RR 1.62, 1.20–2.19) but persisted in the other eight, where surgery was scheduled irrespective of response (RR 1.28, 1.06–1.55), with no significant heterogeneity between the two sets (p=0.19).</p>\n<p>The evidence base is largely pre-taxane and pre-trastuzumab, which limits how far the local-control penalty carries into current practice. The original randomised comparison is <a class=\"trial-link\" href=\"/evidence/#t-nsabp-b-18-b-27\">NSABP B-18 &amp; B-27</a>.</p>\n<p>B-18 gave identical AC before or after surgery in operable disease (n=1,493 eligible): at 16 years neither overall survival (HR 0.99, 95% CI 0.85–1.16, P=.90) nor disease-free survival (HR 0.93, 0.81–1.06, P=.27) differed, while preoperative therapy raised breast-conserving surgery (68% vs 60%, P=.001) (J Clin Oncol 2008;26:778-785).</p>\n<p>A significant treatment-by-age interaction for overall survival (P=.01) favoured preoperative timing under age 50 (HR 0.81, P=.06) and postoperative timing at 50 or older (HR 1.23, P=.07). B-27 then added preoperative docetaxel to AC. Pathological complete response doubled, from 13% to 26% (P&lt;.001), with no improvement in disease-free survival (HR 0.92, 0.78–1.08, P=.29).</p>\n<p>Within both trials pCR was strongly prognostic (overall survival HR 0.32 in B-18 and 0.36 in B-27, both P&lt;.0001). Despite this prognostic association, doubling pCR in B-27 did not establish a survival advantage at the trial level.</p>\n<h2 id=\"s-patient-selection\">Patient selection</h2>\n<p>Neoadjuvant therapy is mandatory in some patients and optional in others.</p>\n<ul><li class=\"evidence-prose\">Upfront inoperable disease: inflammatory breast cancer, and locally advanced stage III disease (bulky or matted cN2, cN3, or cT4).</li><li class=\"evidence-prose\"><span class=\"evidence-lead\">Operable triple-negative disease of T1c or greater (larger than 1 cm), and operable HER2-positive disease of cT2 or greater or cN-positive.</span><span class=\"evidence-detail\">These subtypes respond often enough for the readout to be informative, they receive systemic therapy in any case, and a non-pCR identifies a patient for post-neoadjuvant escalation.</span></li><li class=\"evidence-prose\">A large primary tumour relative to breast size in a patient who wants breast conservation.</li><li class=\"evidence-prose\">cN-positive disease likely to convert to cN0, which may permit less extensive axillary surgery when the pretreatment node has been documented and marked.</li><li class=\"evidence-prose\"><span class=\"evidence-lead\">A temporary contraindication to surgery, such as an unstable thromboembolic or cardiac condition.</span><span class=\"evidence-detail\">Pregnancy itself is not a surgical contraindication: surgery is generally the primary local treatment for operable disease, while systemic therapy and radiotherapy are timed around gestation in multidisciplinary care.<sup class=\"trial-ref\"><a href=\"#ref-breast-neoadjuvant-therapy-for-breast-cancer-ext-56b2ae828237\" aria-label=\"Reference 3: NCI Breast Cancer Treatment During Pregnancy PDQ\">3</a></sup></span></li></ul>\n<p>For small, clinically node-negative HER2-positive disease, upfront surgery often provides the pathological stage needed to select adjuvant treatment without over-delivering neoadjuvant therapy. Patient selection should be aligned with current stage- and subtype-specific treatment guidance.<sup class=\"trial-ref\"><a href=\"#ref-breast-neoadjuvant-therapy-for-breast-cancer-ext-29bf1e5a1d73\" aria-label=\"Reference 4: NCI Breast Cancer Treatment PDQ - neoadjuvant therapy\">4</a></sup></p>\n<h2 id=\"s-work-up-before-starting\">Work-up before starting</h2>\n<ul><li>Core biopsy of the breast with placement of an image-detectable clip, so the tumour bed can still be identified if the tumour responds completely.</li><li>Axillary ultrasound in cN0 disease; ultrasound-guided fine-needle aspiration or core biopsy in cN-positive disease to confirm involvement.<sup class=\"trial-ref\"><a href=\"#ref-breast-neoadjuvant-therapy-for-breast-cancer-ext-29bf1e5a1d73\" aria-label=\"Reference 4: NCI Breast Cancer Treatment PDQ - neoadjuvant therapy\">4</a></sup></li><li>Clip placement in a pathologically involved node when post-treatment targeted axillary surgery is contemplated.</li><li>Breast ultrasound. Breast MRI is not routine but helps define disease extent, including multifocal and multicentric disease.</li><li>Systemic staging is selected by clinical stage, symptoms and findings rather than performed uniformly in every patient.<sup class=\"trial-ref\"><a href=\"#ref-breast-neoadjuvant-therapy-for-breast-cancer-ext-29bf1e5a1d73\" aria-label=\"Reference 4: NCI Breast Cancer Treatment PDQ - neoadjuvant therapy\">4</a></sup></li></ul>\n<h2 id=\"s-assessment-on-and-after-treatment\">Assessment on and after treatment</h2>\n<p>Clinical assessment during treatment should identify progression and preserve a feasible surgical plan; repeat imaging is used when it will change that plan or when progression is suspected. Imaging cannot establish pathological complete response, so the surgical specimen remains the definitive response assessment.<sup class=\"trial-ref\"><a href=\"#ref-breast-neoadjuvant-therapy-for-breast-cancer-ext-29bf1e5a1d73\" aria-label=\"Reference 4: NCI Breast Cancer Treatment PDQ - neoadjuvant therapy\">4</a></sup></p>\n<p>Axillary management after neoadjuvant therapy follows the pretreatment nodal status.</p>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\">cN0 before treatment: sentinel node biopsy at surgery.</span><span class=\"evidence-detail\">A negative sentinel node needs no further axillary treatment; a positive one is managed by axillary dissection. Axillary radiotherapy is not a general substitute for dissection and is used only where a population-specific guideline or trial pathway supports it.</span></li><li class=\"evidence-prose\">cN2–3 before treatment: axillary dissection.</li><li class=\"evidence-prose\">cN1 before treatment that remains ycN1: axillary dissection.</li><li class=\"evidence-prose\">cN1 before treatment that converts to ycN0: sentinel node biopsy with removal of the previously clipped node.</li></ul>\n<p>These pathways require appropriate node retrieval and multidisciplinary review; surgery, axillary staging and radiotherapy are covered in the early breast cancer chapter.<sup class=\"trial-ref\"><a href=\"#ref-breast-neoadjuvant-therapy-for-breast-cancer-ext-29bf1e5a1d73\" aria-label=\"Reference 4: NCI Breast Cancer Treatment PDQ - neoadjuvant therapy\">4</a></sup></p>\n<h2 id=\"s-pathological-complete-response-as-an-endpoint\">Pathological complete response as an endpoint</h2>\n<p>The definition used changes what pCR predicts. In the <a class=\"trial-link\" href=\"/evidence/#t-ctneobc-pooled-analysis\">CTNeoBC pooled analysis</a>, an FDA-led pooled analysis of 12 neoadjuvant trials (11,955 patients, all subtypes), clearing tumour from both breast and nodes (ypT0 ypN0 or ypT0/is ypN0) predicted overall survival better (HR 0.36 for both) than clearing the breast alone (ypT0/is, HR 0.51) (Lancet 2014;384:164-172). At patient level pCR is a powerful prognostic marker.</p>\n<p>Defined as ypT0/is ypN0 it predicted event-free survival (HR 0.48, 95% CI 0.43–0.54) and overall survival (HR 0.36, 0.31–0.42), most strongly in triple-negative disease (event-free survival HR 0.24) and in HER2-positive, hormone-receptor-negative disease treated with trastuzumab (HR 0.15). At trial level it is not a validated surrogate.</p>\n<p>Larger between-arm pCR gains did not predict event-free survival gains (R²=0.03, 95% CI 0.00–0.25) or overall survival gains (R²=0.24, 0.00–0.70), far below the R² of approximately 0.75 conventionally required.</p>\n<p>A HER2-positive re-analysis (11 trials, 3,980 patients) reproduced the same split inside a single subtype: strong patient-level association (event-free survival OR 2.64, overall survival OR 3.15, with OR above 1 favouring pCR) and weak trial-level correlation (R² 0.23 for event-free survival, 0.02 for overall survival) (J Clin Oncol 2023;41:2988-2997).</p>\n<p>A patient who achieves pCR therefore has a better prognosis than one who does not, but a regimen that produces more pCR is not thereby shown to save more lives. Response-adapted escalation is built on pCR; regimen selection is not settled by it. <a class=\"trial-link\" href=\"/evidence/#t-residual-cancer-burden-symmans\">Residual Cancer Burden (Symmans)</a> grades the non-pCR group that the pCR endpoint treats as one bin.</p>\n<p>In a pooled five-cohort single-institution validation (n=1,158, retrospective pathology review with prospective follow-up, not a randomised trial), the index was defined as continuous with predefined cut points of 1.36 and 3.28 (J Clin Oncol 2017;35:1049-1060). Ten-year relapse-free survival by class (pCR / RCB-I / II / III) was 86/81/55/23% in triple-negative disease and 95/77/47/21% in trastuzumab-treated HER2-positive disease. Two qualifications limit it.</p>\n<p>In HR-positive, HER2-negative disease the gradient was not monotonic (83/97/74/52%), with pCR itself entering the multivariable model as a paradoxical predictor (HR 5.03, 95% CI 1.60–15.78) on small numbers. In HER2-positive disease treated with chemotherapy alone it dropped out of the model, with RCB-II and RCB-III failing to separate (44% vs 47%).</p>\n<p>RCB index was independently prognostic in triple-negative (HR 1.92, 1.49–2.46) and trastuzumab-treated HER2-positive disease (HR 1.80, 1.26–2.59). It is prognostic only, and the authors call for external validation.</p>\n<h2 id=\"s-triple-negative-disease\">Triple-negative disease</h2>\n<h3 id=\"s-the-chemotherapy-backbone-and-the-carboplatin-question\">The chemotherapy backbone and the carboplatin question</h3>\n<p>Adding carboplatin to an anthracycline–taxane backbone raises pCR consistently; its survival contribution remains uncertain.</p>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-geparsixto\">GeparSixto</a> added weekly carboplatin (AUC 1.5) to paclitaxel and non-pegylated liposomal doxorubicin over 18 weeks in the 315-patient triple-negative cohort.</span><span class=\"evidence-detail\">pCR (ypT0 ypN0) rose from 36.9% to 53.2% (P=0.005), and on the 2018 survival analysis 3-year disease-free survival improved (86.1% vs 75.8%, HR 0.56, 95% CI 0.34–0.93, P=0.022), with the overall survival gain not significant (Lancet Oncol 2014;15:747-756; Ann Oncol 2018;29:2341-2347). Grade 3/4 neutropenia rose from 27% to 65%, and the homologous-recombination-deficiency score did not predict platinum benefit.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-calgb-40603-alliance\">CALGB 40603 (Alliance)</a>, a 2×2 factorial randomised phase 2 (N=443) on weekly paclitaxel then dose-dense AC, found carboplatin raised pCR in breast and axilla (54% vs 41%, OR 1.71, P=0.003) but at 7.9-year median follow-up did not significantly improve event-free survival (HR 0.94) or overall survival (HR 1.12) (J Clin Oncol 2015;33:13-21; J Clin Oncol 2022;40:1323-1334).</span><span class=\"evidence-detail\">The trial was underpowered for survival, so this is an unproven rather than a disproven benefit. Within the same dataset pCR was strongly prognostic (5-year event-free survival 85.5% vs 56.6%), and even minimal residual disease at RCB-I fared worse than pCR.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-brightness\">BrighTNess</a>, a double-blind phase 3 trial, showed that carboplatin increased pathological complete response and improved event-free survival versus paclitaxel alone, whereas veliparib added no pathological complete response benefit beyond carboplatin (Lancet Oncol 2018;19:497-509; Ann Oncol 2022;33:384-394).</span><span class=\"evidence-detail\">The event-free-survival comparison was secondary, so the data support carboplatin&#x27;s contribution without a confirmatory survival claim for veliparib.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">The <a class=\"trial-link\" href=\"/evidence/#t-tmc-tnbc-platinum-trial-gupta\">TMC TNBC Platinum Trial (Gupta)</a> is the phase 3 survival test in 717 analysed women at one centre.</span><span class=\"evidence-detail\">Carboplatin did not significantly improve the primary 5-year event-free-survival endpoint (70.7% vs 65.8%; HR 0.80, 95% CI 0.62–1.03, P=0.081). The secondary overall-survival comparison was nominal and not significant (79.2% vs 75.6%; HR 0.74, 95% CI 0.49–1.12, P=0.166) (J Clin Oncol 2026;44:9-19). The accepted evidence does not establish a pCR result or a menopause-based treatment interaction for this analysis.</span></li></ul>\n<p>Together, the trials establish a consistent pCR increase but do not prove a survival benefit or support selecting platinum by menopausal status. The question is partly absorbed into current practice, since the chemo-immunotherapy backbone already contains carboplatin and its separate contribution cannot be isolated there.</p>\n<h3 id=\"s-chemo-immunotherapy\">Chemo-immunotherapy</h3>\n<p><a class=\"trial-link\" href=\"/evidence/#t-keynote-522\">KEYNOTE-522</a> is the standard for high-risk stage II–III triple-negative disease. In 1,174 patients it gave neoadjuvant pembrolizumab 200 mg every 3 weeks with carboplatin–paclitaxel for 4 cycles, then with AC or EC for 4 cycles, then adjuvant pembrolizumab for 9 cycles, against the same chemotherapy with placebo (N Engl J Med 2020;382:810-821). Each link of the chain was formally tested against its own alpha boundary and cleared it.</p>\n<ul><li class=\"evidence-prose\">pCR 64.8% vs 51.2% in the first 602 patients randomised, a 13.6-point difference (95% CI 5.4–21.8), P&lt;0.001 against a boundary of 0.003.</li><li class=\"evidence-prose\">Event-free survival at the fourth interim analysis, HR 0.63 (95% CI 0.48–0.82), P&lt;0.001 against a boundary of 0.01034 (N Engl J Med 2022;386:556-567).</li><li class=\"evidence-prose\">Overall survival at the final analysis (median follow-up 75.1 months), whole-period stratified log-rank P=0.002 against a boundary of 0.00503, with deaths in 14.7% vs 21.8% (N Engl J Med 2024;391:1981-1991).</li></ul>\n<p>The 2020 publication states that its confidence intervals were not adjusted for multiplicity and cannot be used to infer effects. No overall survival hazard ratio is reported: the 5-year survival pair of 86.6% vs 81.7% is a descriptive landmark, and the weighted hazard ratio of 0.66 is an unstratified non-proportional-hazards sensitivity analysis carrying neither an interval nor a P-value.</p>\n<p>Benefit was consistent across all PD-L1 CPS strata on the 22C3 assay. In advanced triple-negative disease, the CPS ≥10 population is the evidence-based selection group because its prespecified overall-survival comparison crossed the alpha-protected boundary; the trial did not establish biological confinement of benefit to that stratum. PD-L1 is therefore not tested to select immunotherapy in early disease. Grade 3 or higher immune-mediated adverse events occurred in 13.0% vs 1.5%.</p>\n<p>Subgroups defined by outcome are exploratory, carry no alpha and were not tested against each other. In the no-pCR stratum event-free survival HR was 0.70 (95% CI 0.52–0.95), and by residual disease category 0.92 for RCB-1, 0.52 (0.32–0.82) for RCB-2 and 1.24 for RCB-3 (Ann Oncol 2024;35:429-436).</p>\n<p>Pembrolizumab was given before and after surgery with no arm stopping at surgery, so the neoadjuvant and adjuvant contributions cannot be separated. Two additional studies define the limits of the current regimen evidence.</p>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-geparnuevo-durvalumab\">GeparNuevo (durvalumab)</a> added neoadjuvant durvalumab to nab-paclitaxel then dose-dense EC in 174 patients, with no carboplatin and no adjuvant continuation.</span><span class=\"evidence-detail\">The primary pCR comparison was not significant (53.4% vs 44.2%, OR 1.45, P=0.287). At 86.4-month median follow-up, the prespecified secondary estimates favoured durvalumab for invasive disease-free survival (HR 0.56), distant disease-free survival (HR 0.41) and overall survival (HR 0.33) (Ann Oncol 2019;30:1279-1288; J Clin Oncol 2026;44:1580-1586). These nominal, non-multiplicity-adjusted phase 2 results are hypothesis-generating; they neither establish a checkpoint-class effect nor isolate or replace the neoadjuvant and adjuvant components of KEYNOTE-522.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-neopact\">NeoPACT</a> is a single-arm phase 2 (N=115, stage I–III) of pembrolizumab on an anthracycline-free carboplatin–docetaxel backbone for 6 cycles.</span><span class=\"evidence-detail\">pCR was 58% (95% CI 48–67) with RCB 0+1 in 69%, 3-year event-free survival 86% (98% with pCR vs 68% without), and grade 3 or higher immune-mediated events in 3.5% (JAMA Oncol 2024;10:227-235). There is no comparator, so no equivalence to the standard regimen follows from the cross-trial pCR similarity; SCARLET is the randomised test.</span></li></ul>\n<h2 id=\"s-her2-positive-disease\">HER2-positive disease</h2>\n<h3 id=\"s-establishing-dual-blockade\">Establishing dual blockade</h3>\n<p><a class=\"trial-link\" href=\"/evidence/#t-neosphere\">NeoSphere</a> established the contribution of dual HER2 blockade in the neoadjuvant setting.</p>\n<p>In 417 treatment-naive patients randomised to four cycles of one of four regimens, adding pertuzumab to trastuzumab plus docetaxel raised breast pCR from 29.0% (95% CI 20.6–38.5) to 45.8% (36.1–55.7), P=0.0141 (Lancet Oncol 2012;13:25-32). The chemotherapy-free dual-blockade arm still reached 16.8% and pertuzumab plus docetaxel 24.0%, so both drugs and the chemotherapy contribute.</p>\n<p>Grade 3 or higher events were mainly neutropenia and concentrated in the docetaxel arms. A fixed-dose subcutaneous trastuzumab–pertuzumab formulation is an administration option when otherwise appropriate.</p>\n<p>The loading dose is given over approximately 8 minutes and maintenance doses over approximately 5 minutes; repeat the loading dose after an interval of 6 weeks or longer.<sup class=\"trial-ref\"><a href=\"#ref-breast-neoadjuvant-therapy-for-breast-cancer-ext-2a309fd96b43\" aria-label=\"Reference 15: PHESGO prescribing information\">15</a></sup></p>\n<h3 id=\"s-paring-down-the-chemotherapy-backbone\">Paring down the chemotherapy backbone</h3>\n<p>The de-escalation sequence has removed the anthracycline and then the carboplatin, while leaving the taxane in place.</p>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-tryphaena\">TRYPHAENA</a> (N=225) was a three-arm cardiac safety study of dual blockade with FEC then docetaxel concurrently, sequentially, or with anthracycline-free docetaxel–carboplatin.</span><span class=\"evidence-detail\">Symptomatic left ventricular systolic dysfunction was rare (2 patients during neoadjuvant treatment) and LVEF declines of 10 points or more to below 50% occurred in 3.9–5.6% across arms (Ann Oncol 2013;24:2278-2284). Descriptive pCR (ypT0/is) was high in every arm: 61.6%, 57.3% and 66.2%.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-train-2\">TRAIN-2</a> tested the anthracycline directly in 438 patients with stage II–III disease.</span><span class=\"evidence-detail\">Adding anthracyclines to neoadjuvant paclitaxel–carboplatin plus trastuzumab–pertuzumab did not improve pathological complete response (67% vs 68%) or show an event-free or overall-survival advantage at 48.8 months; 3-year event-free survival was 92.7% versus 93.6% (HR 0.90, 95% CI 0.50 to 1.63) (Lancet Oncol 2018;19:1630-1640; JAMA Oncol 2021;7:978-984). Anthracyclines increased grade 3 or worse febrile neutropenia (10% vs 1%), severe LVEF decline (7.7% vs 3.2%), and caused two acute leukaemias.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-neocarhp\">neoCARHP</a> removed the carboplatin.</span><span class=\"evidence-detail\">In a phase 3 non-inferiority trial (N=774), six cycles of taxane plus trastuzumab and pertuzumab were non-inferior to the same regimen with carboplatin AUC 6 (pCR in breast and axilla 64.1% vs 65.9%, difference −1.8%, 95% CI −8.5 to 5.0, P for non-inferiority 0.0089), with fewer grade 3–4 adverse events (20.7% vs 34.6%) (J Clin Oncol 2026;44:1587-1596). Non-inferiority rests on pCR alone; survival is immature.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-kristine-trio-021\">KRISTINE (TRIO-021)</a> showed that replacing chemotherapy with T-DM1 plus pertuzumab reduced pCR in breast and axilla by 11 points against docetaxel–carboplatin with dual blockade (44.4% vs 55.7%, difference −11.3%, 95% CI −20.5 to −2.0, P=0.016), despite far less toxicity (grade 3–4 adverse events 13% vs 64%) (Lancet Oncol 2018;19:115-126).</span><span class=\"evidence-detail\">Event-free survival at 3 years was 94.2% with the chemotherapy regimen and 85.3% with T-DM1, driven by locoregional progression before surgery in the T-DM1 arm.</span></li></ul>\n<p>The <a class=\"trial-link\" href=\"/evidence/#t-neoadjuvant-her2-therapy-nma-villacampa\">Neoadjuvant HER2+ therapy NMA (Villacampa)</a>, a network meta-analysis of 46 randomised trials and 32 regimens (11,049 patients), supports most of that sequence and diverges on the last step: dual blockade plus chemotherapy was superior to trastuzumab plus chemotherapy for pCR, event-free survival and overall survival at the cost of more cardiotoxicity, and anthracycline-based chemotherapy was not more effective than anthracycline-free chemotherapy, but within anthracycline-free regimens carboplatin gave numerically better outcomes (Eur J Cancer 2023;190:112885).</p>\n<h3 id=\"s-an-antibody-drug-conjugate-front-end\">An antibody–drug conjugate front end</h3>\n<p><a class=\"trial-link\" href=\"/evidence/#t-destiny-breast11\">DESTINY-Breast11</a> replaced dose-dense AC with four cycles of T-DXd before four cycles of paclitaxel with dual blockade, in 927 patients with high-risk disease (at least cT3 cN0, or cT0–4 cN1–3).</p>\n<p>T-DXd then THP improved pCR over dose-dense AC then THP (67.3% vs 56.3%, difference 11.2%, 95% CI 4.0–18.3, P=0.003), in both hormone-receptor-positive (61.4% vs 52.3%) and hormone-receptor-negative disease (83.1% vs 67.1%) (Ann Oncol 2026;37:166-179). The T-DXd-alone arm was closed early for inferiority (pCR 43.0%), so the taxane plus dual-blockade consolidation is still needed.</p>\n<p>Safety favoured the ADC front end: grade 3 or higher adverse events 37.5% vs 55.8%, all-grade left ventricular dysfunction 1.3% vs 6.1%, and drug-related interstitial lung disease low and similar across arms at approximately 4–5%. Grade 3 or higher interstitial lung disease occurred in 0.6%. Event-free survival is immature at 4.5% maturity (HR 0.56).</p>\n<h3 id=\"s-chemotherapy-free-and-response-adapted-strategies\">Chemotherapy-free and response-adapted strategies</h3>\n<p>Response-guided studies have tested chemotherapy reduction in selected lower-risk patients, using pCR to determine subsequent treatment.</p>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-wsg-adapt-tp\">WSG-ADAPT-TP</a> compared short-course T-DM1-based therapy with trastuzumab plus endocrine therapy in HR-positive, HER2-positive disease.</span><span class=\"evidence-detail\">Despite higher pCR with T-DM1, survival did not differ detectably on only 46 events and 19 deaths; non-pCR patients received mandatory chemotherapy (J Clin Oncol 2023;41:3796-3804). Among patients with pCR, 5-year invasive disease-free survival was similar whether adjuvant chemotherapy was omitted or given.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-wsg-tp-ii\">WSG-TP-II</a> compared trastuzumab–pertuzumab plus endocrine therapy with the same antibodies plus weekly paclitaxel in HR-positive, HER2-positive disease.</span><span class=\"evidence-detail\">pCR was higher with paclitaxel (56.4% vs 23.7%), while later survival estimates were untested (JAMA Oncol 2023;9:946-954; J Clin Oncol 2026;44:1974-1980). Most patients in the endocrine arm later received chemotherapy, so “chemotherapy-free” describes only the neoadjuvant phase.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-phergain-2\">PHERGain-2</a> tested chemotherapy-free dual blockade in selected node-negative, centrally IHC 3+ disease.</span><span class=\"evidence-detail\">pCR occurred in 59.6%; non-pCR patients escalated to T-DM1 or chemotherapy plus T-DM1 (Ann Oncol 2026;37:837-848). Treatment-related adverse events were common, including one T-DM1-attributed pneumonitis death. The recurrence-free-interval co-primary endpoint is not yet reported, so pCR alone cannot establish preserved long-term efficacy.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-train-3\">TRAIN-3</a> sent patients to surgery after an MRI complete response.</span><span class=\"evidence-detail\">Early responders had favourable 3-year outcomes, but stopping time was selected by response and toxicity rose with cycle count (Lancet Oncol 2026;27:349-360). This single-arm design does not establish that shortening treatment preserves efficacy against a fixed course.</span></li></ul>\n<h2 id=\"s-hr-positive-her2-negative-disease\">HR-positive, HER2-negative disease</h2>\n<p>Neoadjuvant chemotherapy in HR-positive, HER2-negative disease is chosen mainly for downstaging or because systemic therapy is clearly indicated before surgery. pCR is less common and is a less useful treatment-selection readout than in triple-negative or HER2-positive disease.</p>\n<p>Regimen selection follows the same anthracycline- and taxane-based principles used after surgery, modified for cardiac risk, prior exposure and the need for downstaging. Complete germline testing when it can alter postoperative therapy. Routine neoadjuvant checkpoint inhibition is not established for this subtype.<sup class=\"trial-ref\"><a href=\"#ref-breast-neoadjuvant-therapy-for-breast-cancer-ext-29bf1e5a1d73\" aria-label=\"Reference 4: NCI Breast Cancer Treatment PDQ - neoadjuvant therapy\">4</a></sup></p>\n<h2 id=\"s-post-neoadjuvant-therapy-for-residual-disease\">Post-neoadjuvant therapy for residual disease</h2>\n<p>Residual invasive disease at surgery identifies a high-risk patient and triggers escalation rather than observation.</p>\n<p>In HER2-positive disease, <a class=\"trial-link\" href=\"/evidence/#t-katherine\">KATHERINE</a> randomised 1,486 patients with residual invasive disease after neoadjuvant taxane and trastuzumab to T-DM1 3.6 mg/kg intravenously every 3 weeks or trastuzumab for 14 cycles.</p>\n<p>In KATHERINE, protocol-directed radiotherapy could be given during study treatment.</p>\n<p>In KATHERINE, at the final invasive disease-free-survival analysis, the HR was 0.54 and 7-year invasive disease-free survival was 80.8% versus 67.1%.</p>\n<p>In KATHERINE, at the second interim overall-survival analysis, the HR was 0.66 (95% CI 0.51 to 0.87) and 7-year overall survival was 89.1% versus 84.4% (N Engl J Med 2019;380:617-628; N Engl J Med 2025;392:249-257). Grade 3 or worse adverse events were more frequent with T-DM1 (26.1% vs 15.7%); grade 3 or worse thrombocytopenia occurred in 5.7% versus 0.3%.</p>\n<p><a class=\"trial-link\" href=\"/evidence/#t-destiny-breast05\">DESTINY-Breast05</a> compared T-DXd 5.4 mg/kg with T-DM1 3.6 mg/kg intravenously every 3 weeks for 14 cycles in 1,635 patients with residual invasive disease who were node-positive at surgery or inoperable at diagnosis; radiotherapy could be concurrent or sequential.</p>\n<p>In DESTINY-Breast05, post-neoadjuvant T-DXd cut invasive recurrence or death by about half (events 6.2% vs 12.5%, HR 0.47, 0.34–0.66, P&lt;0.001; 3-year invasive disease-free survival 92.4% vs 83.7%) (N Engl J Med 2026;394:845-857).</p>\n<p>In DESTINY-Breast05, T-DXd increased pulmonary toxicity: adjudicated drug-related interstitial lung disease occurred in 9.6% vs 1.6%, with two ILD deaths. Overall survival is immature.</p>\n<p>In triple-negative disease, <a class=\"trial-link\" href=\"/evidence/#t-create-x-jbcrg-04\">CREATE-X (JBCRG-04)</a> randomised 910 patients with HER2-negative residual invasive disease after neoadjuvant anthracycline and taxane to eight cycles of capecitabine 1250 mg/m² twice daily on days 1–14 or to observation.</p>\n<p>Capecitabine improved 5-year disease-free survival (74.1% vs 67.6%, HR 0.70, P=0.01) and overall survival (89.2% vs 83.6%, HR 0.59, P=0.01) (N Engl J Med 2017;376:2147-2159). In the prespecified exploratory triple-negative subgroup, the disease-free-survival HR was 0.58 (95% CI 0.39–0.87). The treatment-by-hormone-receptor interaction was not significant (P=0.21), so the trial does not establish that relative benefit differs by hormone-receptor status.</p>\n<p>The trial ran entirely in Japan and South Korea, which qualifies the effect size rather than the strategy. For germline <em>BRCA1/2</em> carriers, <a class=\"trial-link\" href=\"/evidence/#t-olympia\">OlympiA</a> eligibility includes both residual high-risk disease after neoadjuvant chemotherapy and high-risk disease treated with upfront surgery. The early-breast-cancer chapter covers its efficacy and safety results.</p>\n<p>It enrolled both non-pCR patients and high-risk patients treated with upfront surgery, so it is response-directed-eligible rather than a residual-disease-only trial. Adjuvant pembrolizumab in KEYNOTE-522 is a different kind of post-neoadjuvant therapy: it is given regardless of pathological response, so it is response-independent continuation rather than response-directed escalation, and its separate contribution was never tested. Sequencing these escalations is unresolved.</p>\n<p>KEYNOTE-522 supports completion of its pembrolizumab course regardless of pathological response. CREATE-X supports capecitabine in residual HER2-negative disease after neoadjuvant chemotherapy in an immunotherapy-naive population, and OlympiA supports olaparib for eligible germline <em>BRCA1/2</em> carriers.</p>\n<p>No trial has established concurrent or sequential overlap among these treatments; KEYNOTE-522 excluded adjuvant capecitabine. Selection therefore requires individualized multidisciplinary assessment rather than treating parallel trial eligibility as a combined regimen. Adjuvant CDK4/6 inhibition for high-risk HR-positive residual disease is covered in the early breast cancer chapter.</p>\n<h2 id=\"s-references\">References</h2>\n<ol class=\"refs\">\n<li id=\"ref-breast-neoadjuvant-therapy-for-breast-cancer-t-ebctcg-neoadjuvant-meta-analysis\"><a class=\"trial-link\" href=\"/evidence/#t-ebctcg-neoadjuvant-meta-analysis\">EBCTCG neoadjuvant meta-analysis</a>. <a href=\"https://drive.google.com/file/d/1TXmZfWXeTgL19WiYNPXuugffiolsNv3V/preview\">Lancet Oncol 2018;19:27-39</a></li>\n<li id=\"ref-breast-neoadjuvant-therapy-for-breast-cancer-t-nsabp-b-18-b-27\"><a class=\"trial-link\" href=\"/evidence/#t-nsabp-b-18-b-27\">NSABP B-18 &amp; B-27</a>. <a href=\"https://drive.google.com/file/d/1o6B5_G-fvXaSvMZVTkSzvb2Du-sVlPbe/preview\">J Clin Oncol 2008;26:778-785</a></li>\n<li id=\"ref-breast-neoadjuvant-therapy-for-breast-cancer-ext-56b2ae828237\"><a href=\"https://www.cancer.gov/types/breast/hp/pregnancy-breast-treatment-pdq\" rel=\"noopener\" target=\"_blank\">NCI Breast Cancer Treatment During Pregnancy PDQ</a></li>\n<li id=\"ref-breast-neoadjuvant-therapy-for-breast-cancer-ext-29bf1e5a1d73\"><a href=\"https://www.cancer.gov/types/breast/hp/breast-treatment-pdq\" rel=\"noopener\" target=\"_blank\">NCI Breast Cancer Treatment PDQ - neoadjuvant therapy</a></li>\n<li id=\"ref-breast- \">N Engl J Med 2019;380:617-628</a>; <a href=\"https://drive.google.com/file/d/1g4uZUH0uR-fyE6SMtVKh8aShu7cfCDHt/preview\">Geyer CE et al. N Engl J Med 2025;392:249-257</a></li>\n<li id=\"ref-breast-neoadjuvant-therapy-for-breast-cancer-t-destiny-breast05\"><a class=\"trial-link\" href=\"/evidence/#t-destiny-breast05\">DESTINY-Breast05</a>. <a href=\"https://drive.google.com/file/d/1Rb5k37Kyd0ApGAWBnHepdL70Ilzddkif/preview\">N Engl J Med 2026;394:845-857</a></li>\n<li id=\"ref-breast-neoadjuvant-therapy-for-breast-cancer-t-create-x-jbcrg-04\"><a class=\"trial-link\" href=\"/evidence/#t-create-x-jbcrg-04\">CREATE-X (JBCRG-04)</a>. <a href=\"https://drive.google.com/file/d/1upcvkT0k8pCt0K8yO5-uMW81lIw_XwV9/preview\">N Engl J Med 2017;376:2147-2159</a></li>\n<li id=\"ref-breast-neoadjuvant-therapy-for-breast-cancer-t-olympia\"><a class=\"trial-link\" href=\"/evidence/#t-olympia\">OlympiA</a>. <a href=\"https://drive.google.com/file/d/1vchaLZDGyxUe6socMeIvd4CXtBY6nr8K/preview\">N Engl J Med 2021;384:2394-2405</a>; <a href=\"https://drive.google.com/file/d/10GahBZ3WjYp1WbnLkbHlPRaBk-tigfTF/preview\">Ann Oncol 2022;33:1250-1268</a></li>\n</ol>", "_hay": "neoadjuvant therapy for breast cancer neoadjuvant-therapy-for-breast-cancer breast what neoadjuvant therapy is for patient selection work-up before starting assessment on and after treatment pathological complete response as an endpoint triple-negative disease the chemotherapy backbone and the carboplatin question chemo-immunotherapy her2-positive disease establishing dual blockade paring down the chemotherapy backbone an antibody–drug conjugate front end chemotherapy-free and response-adapted strategies hr-positive, her2-negative disease post-neoadjuvant therapy for residual disease references"}, {"id": "colorectal-metastatic-colorectal-cancer", "slug": "metastatic-colorectal-cancer", "group": "Colorectal", "title": "Advanced and metastatic colorectal cancer", "updated": "", "sections": [{"id": "s-establish-treatment-intent-before-choosing-systemic-therapy", "h": "Establish treatment intent before choosing systemic therapy", "depth": 2}, {"id": "s-first-line-treatment", "h": "First-line treatment", "depth": 2}, {"id": "s-msi-h-or-dmmr-disease", "h": "MSI-H or dMMR disease", "depth": 3}, {"id": "s-braf-v600e-mutant-proficient-mismatch-repair-disease", "h": "BRAF V600E-mutant, proficient-mismatch-repair disease", "depth": 3}, {"id": "s-ras-and-braf-wild-type-disease-choose-by-primary-tumour-side", "h": "RAS and BRAF wild-type disease: choose by primary-tumour side", "depth": 3}, {"id": "s-ras-mutant-or-otherwise-non-actionable-proficient-mismatch-repair-disease", "h": "RAS-mutant or otherwise non-actionable proficient-mismatch-repair disease", "depth": 3}, {"id": "s-cytotoxic-backbones-and-sequencing", "h": "Cytotoxic backbones and sequencing", "depth": 3}, {"id": "s-adding-bevacizumab", "h": "Adding bevacizumab", "depth": 3}, {"id": "s-treatment-limiting-safety-checks", "h": "Treatment-limiting safety checks", "depth": 2}, {"id": "s-what-the-chemotherapy-components-do", "h": "What the chemotherapy components do", "depth": 3}, {"id": "s-fluoropyrimidines", "h": "Fluoropyrimidines", "depth": 3}, {"id": "s-oxaliplatin-and-irinotecan", "h": "Oxaliplatin and irinotecan", "depth": 3}, {"id": "s-anti-egfr-treatment", "h": "Anti-EGFR treatment", "depth": 3}, {"id": "s-bevacizumab", "h": "Bevacizumab", "depth": 3}, {"id": "s-other-vegf-pathway-agents-and-refractory-oral-drugs", "h": "Other VEGF-pathway agents and refractory oral drugs", "depth": 3}, {"id": "s-treatment-after-progression", "h": "Treatment after progression", "depth": 2}, {"id": "s-second-line-treatment", "h": "Second-line treatment", "depth": 3}, {"id": "s-anti-egfr-treatment-after-first-line", "h": "Anti-EGFR treatment after first line", "depth": 3}, {"id": "s-anti-egfr-rechallenge", "h": "Anti-EGFR rechallenge", "depth": 3}, {"id": "s-her2-positive-disease", "h": "HER2-positive disease", "depth": 3}, {"id": "s-kras-g12c-mutant-disease", "h": "KRAS G12C-mutant disease", "depth": 3}, {"id": "s-maintenance-after-induction", "h": "Maintenance after induction", "depth": 3}, {"id": "s-older-or-frail-patients", "h": "Older or frail patients", "depth": 3}, {"id": "s-refractory-disease", "h": "Refractory disease", "depth": 2}, {"id": "s-trifluridine-tipiracil-plus-bevacizumab", "h": "Trifluridine/tipiracil plus bevacizumab", "depth": 3}, {"id": "s-regorafenib", "h": "Regorafenib", "depth": 3}, {"id": "s-fruquintinib", "h": "Fruquintinib", "depth": 3}, {"id": "s-investigational-later-line-treatment", "h": "Investigational later-line treatment", "depth": 3}, {"id": "s-local-treatment-of-metastatic-disease", "h": "Local treatment of metastatic disease", "depth": 2}, {"id": "s-do-not-debulk-unresectable-multiorgan-disease-routinely", "h": "Do not debulk unresectable multiorgan disease routinely", "depth": 3}, {"id": "s-intact-asymptomatic-primary-with-unresectable-metastases", "h": "Intact asymptomatic primary with unresectable metastases", "depth": 3}, {"id": "s-liver-limited-and-oligometastatic-disease", "h": "Liver-limited and oligometastatic disease", "depth": 3}, {"id": "s-conversion-treatment-for-initially-unresectable-liver-disease", "h": "Conversion treatment for initially unresectable liver disease", "depth": 3}, {"id": "s-peritoneal-limited-disease", "h": "Peritoneal-limited disease", "depth": 3}, {"id": "s-references", "h": "References", "depth": 2}], "html": "<h2 id=\"s-establish-treatment-intent-before-choosing-systemic-therapy\">Establish treatment intent before choosing systemic therapy</h2>\n<ul><li>Confirm metastatic disease radiologically and histologically before treatment.</li><li>Initial staging usually uses contrast-enhanced CT of the thorax, abdomen and pelvis.</li><li>Use liver MRI when colorectal liver metastases appear resectable or potentially resectable. Consider FDG-PET to define disease extent when metastases may be resectable.</li><li>Discuss treatment intent and resectability in a colorectal multidisciplinary team. Initially unresectable disease can be reassessed after systemic treatment<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-ext-94e00143a678\" aria-label=\"Reference 1: ESMO mCRC Clinical Practice Guideline\">1</a></sup>.</li></ul>\n<p>At metastatic diagnosis:</p>\n<ul><li>Test mismatch-repair or microsatellite-instability status, KRAS and NRAS exons 2–4, and BRAF.</li><li>RAS testing is mandatory before anti-EGFR treatment.</li><li>In RAS wild-type disease, assess HER2 amplification by IHC or FISH when HER2 blockade may be relevant.</li><li>Preserve adequate tumour tissue for these decisions<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-ext-94e00143a678\" aria-label=\"Reference 1: ESMO mCRC Clinical Practice Guideline\">1</a></sup>.</li></ul>\n<p>The evidence-defined first-line branches depend on:</p>\n<ul><li>Mismatch-repair or microsatellite-instability status.<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-t-checkmate-8hw-first-line-vs-chemotherapy\" aria-label=\"Reference 2: CheckMate 8HW (first-line vs chemotherapy)\">2</a></sup></li><li>BRAF V600E.<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-t-breakwater\" aria-label=\"Reference 3: BREAKWATER\">3</a></sup></li><li>Extended RAS status and primary-tumour side.<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-t-paradigm\" aria-label=\"Reference 4: PARADIGM\">4</a></sup></li></ul>\n<p>Later-line options add these treatment-defining groups:</p>\n<ul><li>HER2-positive, RAS wild-type disease.<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-t-mountaineer\" aria-label=\"Reference 5: MOUNTAINEER\">5</a></sup></li><li>KRAS G12C-mutant disease.<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-t-codebreak-300\" aria-label=\"Reference 6: CodeBreaK 300\">6</a></sup></li></ul>\n<p>Cytotoxic chemotherapy is the comparator backbone for most proficient-mismatch-repair disease.</p>\n<ul><li>Dual immunotherapy outperformed chemotherapy in first-line MSI-H/dMMR disease.<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-t-checkmate-8hw-first-line-vs-chemotherapy\" aria-label=\"Reference 2: CheckMate 8HW (first-line vs chemotherapy)\">2</a></sup></li><li>BRAF-directed treatment improved outcomes when added to mFOLFOX6 in BRAF V600E-mutant disease.<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-t-breakwater\" aria-label=\"Reference 3: BREAKWATER\">3</a></sup></li></ul>\n<h2 id=\"s-first-line-treatment\">First-line treatment</h2>\n<h3 id=\"s-msi-h-or-dmmr-disease\">MSI-H or dMMR disease</h3>\n<p>Nivolumab plus ipilimumab is an evidence-supported first-line option for an immunotherapy-fit patient.</p>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\">At the prespecified interim analysis of the first of two dual primary endpoints, the first-line comparison randomised 303 patients on local MSI-H/dMMR testing.</span><span class=\"evidence-detail\">The primary efficacy analysis included 255 with central confirmation.<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-t-checkmate-8hw-first-line-vs-chemotherapy\" aria-label=\"Reference 2: CheckMate 8HW (first-line vs chemotherapy)\">2</a></sup></span></li><li class=\"evidence-prose\">Nivolumab plus ipilimumab improved centrally reviewed PFS (24-month PFS 72% vs 14%; median not reached vs 5.9 months).</li><li class=\"evidence-prose\"><span class=\"evidence-lead\">Proportional hazards were violated, so no hazard ratio was reported.</span><span class=\"evidence-detail\">Prespecified 24-month restricted-mean PFS was 19.2 versus 8.6 months, a difference of 10.6 months (95% CI 8.4–12.9) without separate alpha allocation.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">Safety was a key exploratory, untested endpoint.</span><span class=\"evidence-detail\">In the all-treated population, grade 3–4 treatment-related adverse events occurred in 23% with dual immunotherapy and 48% with chemotherapy; two treatment-related deaths occurred with dual immunotherapy.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">Overall survival was not reported at this interim analysis.</span><span class=\"evidence-detail\">The second primary endpoint and all secondary endpoints were untested.</span></li><li class=\"evidence-prose\">The CheckMate 8HW regimen was nivolumab 240 mg plus ipilimumab 1 mg/kg every 3 weeks for four doses, followed by nivolumab 480 mg every 4 weeks for up to 2 years.</li><li class=\"evidence-prose\">The chemotherapy comparator was investigator-choice mFOLFOX6 or FOLFIRI with or without bevacizumab or cetuximab.<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-t-checkmate-8hw-first-line-vs-chemotherapy\" aria-label=\"Reference 2: CheckMate 8HW (first-line vs chemotherapy)\">2</a></sup></li></ul>\n<p>Pembrolizumab monotherapy is another evidence-supported first-line option.</p>\n<ul><li class=\"evidence-prose\"><a class=\"trial-link\" href=\"/evidence/#t-keynote-177\">KEYNOTE-177</a> compared pembrolizumab for up to 35 three-weekly treatments with mFOLFOX6 or FOLFIRI, with or without bevacizumab or cetuximab, in 307 previously untreated patients.</li><li class=\"evidence-prose\"><span class=\"evidence-lead\">Pembrolizumab improved final PFS (16.5 vs 8.2 months; HR 0.60, 95% CI 0.45–0.80).</span><span class=\"evidence-detail\">The crossed curves and violation of proportional hazards reflect a clinically important early-progression group.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">Overall-survival superiority was not established amid substantial crossover (HR 0.74, 95% CI 0.53–1.03).</span><span class=\"evidence-detail\">Grade 3 or worse treatment-related events were 22% versus 66%.</span></li></ul>\n<p>Dual immunotherapy also improves disease control over PD-1 monotherapy across treatment lines.</p>\n<ul><li>The nivolumab-plus-ipilimumab comparison included 707 immunotherapy-naive patients. Its primary analysis included 582 with centrally confirmed MSI-H/dMMR disease.<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-t-checkmate-8hw-nivolumab-ipilimumab-vs-nivolumab\" aria-label=\"Reference 8: CheckMate 8HW (nivolumab + ipilimumab vs nivolumab)\">8</a></sup></li><li>Nivolumab plus ipilimumab improved PFS over nivolumab (median not reached vs 39.3 months; HR 0.62) and increased response (71% vs 58%).</li><li>In all 707 patients randomised on local testing, median PFS was 54.1 versus 18.4 months (HR 0.64).</li><li>Grade 3–4 treatment-related events occurred in 22% versus 14%. The first-line-only comparison and overall survival remained masked.</li></ul>\n<p>Before the randomised CheckMate 8HW evidence, CheckMate 142<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-ext-1ad2c2240db6\" aria-label=\"Reference 9: CheckMate 142\">9</a></sup> established later-line activity for nivolumab plus low-dose ipilimumab in previously treated MSI-H/dMMR disease. It was a nonrandomised cohort, so its durable responses supported access and development but did not quantify benefit against chemotherapy.</p>\n<p>The US FDA approved nivolumab plus ipilimumab for unresectable or metastatic MSI-H/dMMR colorectal cancer in patients aged 12 years or older in April 2025. Local reimbursement and licensing may differ<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-ext-b3dfa41ec820\" aria-label=\"Reference 10: FDA approval summary\">10</a></sup>.</p>\n<p>The small COMMIT interim conference-abstract analysis included 82 patients in a two-arm first-line comparison.<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-t-commit-nrg-gi004-swog-s1610\" aria-label=\"Reference 11: COMMIT (NRG-GI004/SWOG-S1610)\">11</a></sup></p>\n<ul><li class=\"evidence-prose\">mFOLFOX6, bevacizumab and atezolizumab prolonged PFS over atezolizumab alone (30.0 vs 4.3 months; HR 0.439, 95% CI 0.23–0.84) and increased response (80.6% vs 46%).</li><li class=\"evidence-prose\"><span class=\"evidence-lead\">This result supports the combination over single-agent PD-L1 blockade within the reported comparison.</span><span class=\"evidence-detail\">It does not replace direct phase 3 evidence for nivolumab plus ipilimumab or pembrolizumab.</span></li></ul>\n<p>For a tumour carrying both MSI-H/dMMR and BRAF V600E, the trials do not provide a direct comparison between first-line immunotherapy and BRAF-directed treatment.</p>\n<ul><li>BREAKWATER required patients with MSI-H/dMMR disease to be ineligible for checkpoint inhibition.<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-t-breakwater\" aria-label=\"Reference 3: BREAKWATER\">3</a></sup></li><li>CheckMate 8HW enrolled MSI-H/dMMR disease without selecting by BRAF status.<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-t-checkmate-8hw-first-line-vs-chemotherapy\" aria-label=\"Reference 2: CheckMate 8HW (first-line vs chemotherapy)\">2</a></sup></li></ul>\n<h3 id=\"s-braf-v600e-mutant-proficient-mismatch-repair-disease\">BRAF V600E-mutant, proficient-mismatch-repair disease</h3>\n<p>Use encorafenib, cetuximab and mFOLFOX6 in first line.</p>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-breakwater\">BREAKWATER</a> enrolled 637 previously untreated patients with BRAF V600E-mutant, RAS wild-type metastatic colorectal cancer.</span><span class=\"evidence-detail\">Patients with MSI-H/dMMR disease had to be ineligible for checkpoint inhibition.</span></li><li class=\"evidence-prose\">The triplet improved confirmed central-review response in the initial primary set (60.9% vs 40.0%), final PFS (12.8 vs 7.1 months; HR 0.53) and interim OS (30.3 vs 15.1 months; HR 0.49) over investigator-choice mFOLFOX6, FOLFOXIRI or CAPOX with or without bevacizumab.</li><li class=\"evidence-prose\">Grade 3–4 adverse events occurred in 81.5% versus 66.8%.</li></ul>\n<p>In February 2026, the US FDA converted first-line encorafenib plus cetuximab with fluorouracil-based chemotherapy to traditional approval for BRAF V600E-mutant metastatic disease<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-ext-d5666ec96b2a\" aria-label=\"Reference 12: FDA approval summary\">12</a></sup>.</p>\n<p>After one or two prior regimens, encorafenib plus cetuximab provides a chemotherapy-free option.</p>\n<ul><li><a class=\"trial-link\" href=\"/evidence/#t-beacon-crc\">BEACON CRC</a> randomised 665 patients to encorafenib, binimetinib and cetuximab; encorafenib and cetuximab; or cetuximab with irinotecan or FOLFIRI.</li><li>The protected primary OS and response comparisons tested the triplet against control. The doublet efficacy analyses were secondary.</li><li>Median OS was 9.0 months with the triplet, 8.4 months with the doublet and 5.4 months with control; response was 26%, 20% and 2%.</li><li>The respective grade 3 or worse adverse-event rates were 58%, 50% and 61%.</li></ul>\n<h3 id=\"s-ras-and-braf-wild-type-disease-choose-by-primary-tumour-side\">RAS and BRAF wild-type disease: choose by primary-tumour side</h3>\n<p>For a left-sided primary, use a fluoropyrimidine-oxaliplatin or fluoropyrimidine-irinotecan doublet with an anti-EGFR antibody when response depth and survival are the priorities.</p>\n<ul><li class=\"evidence-prose\"><a class=\"trial-link\" href=\"/evidence/#t-paradigm\">PARADIGM</a> compared panitumumab with bevacizumab, each added to mFOLFOX6, in 823 patients with RAS wild-type disease.</li><li class=\"evidence-prose\"><span class=\"evidence-lead\">In the left-sided primary population, panitumumab improved OS (37.9 vs 34.3 months; HR 0.82) and response (80.2% vs 68.6%).</span><span class=\"evidence-detail\">PFS was similar (13.1 vs 11.9 months; HR 1.00).</span></li><li class=\"evidence-prose\">Crossing survival curves at about 28 months limit the proportional-hazards summary.</li><li class=\"evidence-prose\">In the overall full-analysis population, OS was 36.2 versus 31.3 months (HR 0.84).</li><li class=\"evidence-prose\"><span class=\"evidence-lead\">In the right-sided subgroup, panitumumab did not improve OS (20.2 vs 23.2 months), PFS (7.2 vs 9.4 months) or response (55% vs 63%) over bevacizumab.</span><span class=\"evidence-detail\">These subgroup estimates do not support first-line anti-EGFR treatment for a right-sided primary.<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-t-paradigm\" aria-label=\"Reference 4: PARADIGM\">4</a></sup></span></li></ul>\n<p>PARADIGM addressed sidedness directly.<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-t-paradigm\" aria-label=\"Reference 4: PARADIGM\">4</a></sup> The earlier anti-EGFR trials established the predictive role of RAS status but did not settle that question:</p>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-crystal\">CRYSTAL</a> added cetuximab to FOLFIRI in 1,217 EGFR-expressing, biomarker-unselected patients.</span><span class=\"evidence-detail\">The enlarged KRAS-evaluable analysis was retrospective and exploratory.</span><ul><li>In KRAS wild-type disease, cetuximab plus FOLFIRI was associated with longer PFS (9.9 vs 8.4 months; HR 0.70), OS (23.5 vs 20.0 months; HR 0.80) and higher response (57.3% vs 39.7%). All subgroup and treatment-by-KRAS p values were nominal and unadjusted.</li><li>BRAF V600E was prognostic without evidence of a treatment interaction. Grade 3–4 events increased to 79.3% from 61.0%.</li></ul></li><li class=\"evidence-prose\"><a class=\"trial-link\" href=\"/evidence/#t-prime\">PRIME</a> added panitumumab to FOLFOX4.<ul><li>In wild-type KRAS disease, centrally reviewed PFS improved (9.6 vs 8.0 months; HR 0.80) and response was 55% versus 48%. The interim OS comparison of 23.9 versus 19.7 months did not reach statistical significance (HR 0.83, 95% CI 0.67–1.02).</li><li>In mutant KRAS disease, PFS was worse with panitumumab (7.3 vs 8.8 months; HR 1.29), supporting biomarker restriction.</li></ul></li><li class=\"evidence-prose\"><a class=\"trial-link\" href=\"/evidence/#t-fire-3\">FIRE-3</a> compared cetuximab with bevacizumab, each with FOLFIRI.<ul><li>The primary response comparison was negative (62.0% vs 58.0%; p=.18), and PFS was similar. Exploratory OS favoured cetuximab (28.7 vs 25.0 months; HR 0.77).</li><li>The extended-RAS analyses were retrospective and reported no interaction test.</li></ul></li><li class=\"evidence-prose\"><a class=\"trial-link\" href=\"/evidence/#t-calgb-swog-80405\">CALGB/SWOG 80405</a> found no statistically significant OS advantage for cetuximab over bevacizumab when either was added to investigator-selected mFOLFOX6 or FOLFIRI (30.0 vs 29.0 months; HR 0.88, 95% CI 0.77–1.01).<ul><li>This publication did not report a primary-tumour-sidedness analysis.</li><li>In CALGB/SWOG 80405, PFS was also similar (10.5 vs 10.6 months; HR 0.95), and response was 59.6% versus 55.2%.<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-t-calgb-swog-80405\" aria-label=\"Reference 17: CALGB/SWOG 80405\">17</a></sup></li></ul></li></ul>\n<p>Do not intensify the chemotherapy backbone to FOLFOXIRI solely because panitumumab is being used.</p>\n<ul><li><a class=\"trial-link\" href=\"/evidence/#t-triplete\">TRIPLETE</a> randomised 435 patients with RAS and BRAF V600 wild-type disease to modified FOLFOXIRI plus panitumumab or mFOLFOX plus panitumumab.</li><li>Response (73% vs 76%), PFS (12.7 vs 12.3 months; HR 0.88) and R0 resection (25% vs 29%) did not improve. Gastrointestinal toxicity increased.</li></ul>\n<h3 id=\"s-ras-mutant-or-otherwise-non-actionable-proficient-mismatch-repair-disease\">RAS-mutant or otherwise non-actionable proficient-mismatch-repair disease</h3>\n<p>For a patient eligible for intensive treatment, a fluoropyrimidine doublet plus bevacizumab is the control backbone.</p>\n<p>FOLFOXIRI plus bevacizumab increases response and disease control but also increases neutropenia, diarrhoea and neuropathy.</p>\n<p>The pre-biologic triplet trials show why patient and regimen selection matter:</p>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\">In the initial analysis of the phase 3 Italian GONO trial<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-ext-3b6e72592cae\" aria-label=\"Reference 19: Italian GONO trial\">19</a></sup>, FOLFOXIRI improved investigator-assessed response (66% vs 41%), PFS (9.8 vs 6.9 months) and OS (22.6 vs 16.7 months) over FOLFIRI in 244 patients with favourable prognostic characteristics.</span><span class=\"evidence-detail\">Grade 2–3 neuropathy and grade 3–4 neutropenia increased.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">The phase 3 HORG trial<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-ext-43ec90e7a56f\" aria-label=\"Reference 20: HORG trial\">20</a></sup> used a different FOLFOXIRI schedule in 283 patients and did not significantly improve time to progression (8.4 vs 6.9 months) or OS (21.5 vs 19.5 months).</span><span class=\"evidence-detail\">Alopecia, diarrhoea and neuropathy increased.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">These results do not justify treating every fit patient with a triplet.</span><span class=\"evidence-detail\">Use intensification selectively when a higher response probability may change symptoms or resectability, and review toxicity risk explicitly<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-ext-9f50cb16280c\" aria-label=\"Reference 21: ASCO mCRC guideline\">21</a></sup>.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-tribe\">TRIBE</a> compared FOLFOXIRI plus bevacizumab with FOLFIRI plus bevacizumab in 508 previously untreated patients aged 18–75 years.</span><span class=\"evidence-detail\">ECOG 0 was required above age 70.</span><ul><li>Triplet treatment improved the alpha-protected primary PFS endpoint (12.1 vs 9.7 months; HR 0.75).</li><li>The prespecified but unadjusted secondary response analysis also favoured triplet treatment (65% vs 53%). The mature secondary OS analysis favoured triplet treatment (29.8 vs 25.8 months; HR 0.80); both were nominal.</li><li>In unadjusted secondary safety comparisons, grade 3–4 neutropenia (50.0% vs 20.5%), diarrhoea (18.8% vs 10.6%) and neuropathy (5.2% vs 0) increased.<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-t-tribe\" aria-label=\"Reference 22: TRIBE\">22</a></sup></li></ul></li><li class=\"evidence-prose\"><a class=\"trial-link\" href=\"/evidence/#t-tribe2\">TRIBE2</a> tested FOLFOXIRI plus bevacizumab followed by reintroduction after progression against mFOLFOX6 plus bevacizumab followed by FOLFIRI plus bevacizumab.<ul><li>The alpha-protected primary PFS2 endpoint improved (19.2 vs 16.4 months; HR 0.74).</li><li>Prespecified but unadjusted secondary analyses also favoured intensification for OS (27.4 vs 22.5 months; HR 0.82), response (62% vs 50%) and R0 resection (17% vs 12%); their p values were nominal.</li><li>Grade 3–4 adverse events were 68% versus 46%. Deaths within 6 months were numerically higher with intensification (22 vs 13).<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-t-tribe2\" aria-label=\"Reference 23: TRIBE2\">23</a></sup></li></ul></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">The patient-level evidence is consistent.</span><span class=\"evidence-detail\">A meta-analysis pooled 1,697 patients from five randomised trials.<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-t-cremolini-folfoxiri-bevacizumab-ipd-meta-analysis\" aria-label=\"Reference 24: Cremolini FOLFOXIRI + bevacizumab IPD meta-analysis\">24</a></sup></span><ul><li>The pooled analysis found longer OS (28.9 vs 24.5 months; HR 0.81), PFS (12.2 vs 9.9 months; HR 0.74), higher response (65% vs 54%) and more R0 resections (16% vs 12%) with FOLFOXIRI plus bevacizumab.</li><li>Grade 3–4 neutropenia increased from 22% to 46% and diarrhoea from 8% to 18%. No treatment interaction was detected by BRAF status or prior adjuvant treatment.<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-t-cremolini-folfoxiri-bevacizumab-ipd-meta-analysis\" aria-label=\"Reference 24: Cremolini FOLFOXIRI + bevacizumab IPD meta-analysis\">24</a></sup></li></ul></li></ul>\n<h3 id=\"s-cytotoxic-backbones-and-sequencing\">Cytotoxic backbones and sequencing</h3>\n<p>FOLFOX and FOLFIRI can be sequenced in either order without a demonstrated overall-survival difference in the direct GERCOR comparison.<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-t-gercor-tournigand\" aria-label=\"Reference 25: GERCOR (Tournigand)\">25</a></sup></p>\n<p>The components were established in a series of first-line trials:</p>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\">The de Gramont trial added oxaliplatin to LV5FU2 in 420 patients.</span><span class=\"evidence-detail\">FOLFOX4 improved investigator-assessed PFS (9.0 vs 6.2 months), blinded-review PFS (8.2 vs 6.0 months) and blinded-review ITT response (50.0% vs 21.9%). OS was 16.2 versus 14.7 months and did not reach statistical significance; neutropenia, diarrhoea and neurologic toxicity increased.<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-t-de-gramont-folfox\" aria-label=\"Reference 26: de Gramont (FOLFOX)\">26</a></sup></span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">The Saltz trial established irinotecan activity when added to bolus fluorouracil and leucovorin.</span><span class=\"evidence-detail\">IFL improved PFS (7.0 vs 4.3 months), OS (14.8 vs 12.6 months) and confirmed response (39% vs 21%) over fluorouracil/leucovorin; grade 3–4 diarrhoea occurred in 22.7% and severe neutropenia in 53.8%.<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-t-saltz-ifl\" aria-label=\"Reference 27: Saltz (IFL)\">27</a></sup></span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-douillard\">Douillard</a> added irinotecan to infusional fluorouracil/leucovorin and improved the primary response endpoint (34.8% vs 21.9%), time to progression (6.7 vs 4.4 months) and OS (17.4 vs 14.1 months).</span><span class=\"evidence-detail\">Diarrhoea and neutropenia increased and were schedule-dependent.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-n9741\">N9741</a> compared FOLFOX, IFL and IROX in 795 untreated patients.</span><span class=\"evidence-detail\">FOLFOX improved time to progression (8.7 vs 6.9 months; HR 0.74), OS (19.5 vs 15.0 months; HR 0.66) and response (45% vs 31%) over IFL, with less gastrointestinal toxicity and febrile neutropenia but more paraesthesia. IROX did not improve the primary endpoint over IFL.</span></li><li class=\"evidence-prose\">The GERCOR trial directly compared FOLFIRI followed by FOLFOX6 with the reverse sequence in 226 patients.<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-t-gercor-tournigand\" aria-label=\"Reference 25: GERCOR (Tournigand)\">25</a></sup><ul><li>The sole primary endpoint, second PFS from randomisation through progression after second-line therapy, did not differ (14.2 vs 10.9 months).</li><li>Secondary OS also did not differ (21.5 vs 20.6 months); no multiplicity adjustment or secondary alpha allocation was reported. First-line response and PFS were similar.</li><li>In a prespecified but unadjusted secondary analysis, externally reviewed PFS during second-line therapy was longer with FOLFOX6 after FOLFIRI than with FOLFIRI after FOLFOX6 (4.2 vs 2.5 months).</li><li>The p value was nominal. The publication did not state the denominator or precise time origin for this comparison. Toxicity differed by the first-line backbone.</li></ul></li></ul>\n<p>CAPOX is an evidence-supported oral-fluoropyrimidine alternative to FOLFOX.</p>\n<ul><li>NO16966 randomised 2,034 patients and met PFS non-inferiority in the regulator-requested eligible population (7.9 vs 8.5 months; HR 1.05, 97.5% CI 0.94–1.18; upper margin 1.23).<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-t-no16966-xelox-vs-folfox-4\" aria-label=\"Reference 30: NO16966 (XELOX vs FOLFOX-4)\">30</a></sup></li><li>ITT results were concordant, and OS was similar (19.8 vs 19.6 months).</li><li>The trial regimen used oxaliplatin 130 mg/m² on day 1 and capecitabine 1,000 mg/m² twice daily on days 1–14 every 3 weeks.</li></ul>\n<p>The earlier randomised phase 2 TREE programme<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-ext-465abec25566\" aria-label=\"Reference 31: TREE programme\">31</a></sup> compared modified FOLFOX, bolus FOL and CAPOX schedules, first without and then with bevacizumab. It helped establish feasible oxaliplatin backbones but was not a phase 3 equivalence test. For a present-day CAPOX-versus-FOLFOX conclusion, use NO16966 rather than TREE.</p>\n<p>Modified capecitabine-irinotecan has narrower evidence than CAPOX:</p>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\">AXEPT<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-ext-b8c46ac3ad1a\" aria-label=\"Reference 32: AXEPT\">32</a></sup> randomised 650 patients in Japan, China and South Korea after first-line treatment.</span><span class=\"evidence-detail\">Modified XELIRI, with or without bevacizumab, was non-inferior to FOLFIRI with or without bevacizumab for OS (16.8 vs 15.4 months; HR 0.85, upper 95% CI 1.02; margin 1.30).</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">Grade 3–4 neutropenia was lower with modified XELIRI (17% vs 43%), while grade 3–4 diarrhoea was higher (7% vs 3%).</span><span class=\"evidence-detail\">Serious adverse events occurred in 15% versus 20%.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">This supports modified XELIRI as a second-line alternative in the studied Asian population.</span><span class=\"evidence-detail\">It does not establish that all capecitabine-irinotecan schedules are interchangeable with FOLFIRI.</span></li></ul>\n<h3 id=\"s-adding-bevacizumab\">Adding bevacizumab</h3>\n<p>Bevacizumab gives a modest average benefit when added to first-line chemotherapy.</p>\n<ul><li>AVF2107g added bevacizumab to IFL in 813 previously untreated patients.<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-t-avf2107g-hurwitz\" aria-label=\"Reference 33: AVF2107g (Hurwitz)\">33</a></sup><ul><li>Bevacizumab improved OS (20.3 vs 15.6 months; HR 0.66), PFS (10.6 vs 6.2 months; HR 0.54), response (44.8% vs 34.8%) and response duration.</li><li>Grade 3–4 adverse events increased to 84.9% from 74.0%.</li></ul></li><li>The NO16966 factorial comparison pooled XELOX and FOLFOX4.<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-t-no16966-bevacizumab\" aria-label=\"Reference 34: NO16966 (bevacizumab)\">34</a></sup><ul><li>Bevacizumab improved the coprimary PFS endpoint (9.4 vs 8.0 months; HR 0.83, 97.5% CI 0.72–0.95).</li><li>OS did not reach statistical significance (21.3 vs 19.9 months; HR 0.89, 97.5% CI 0.76–1.03), and response was similar.</li><li>Treatment discontinuation before progression was common, particularly in the bevacizumab ar
