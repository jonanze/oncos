vival benefit at the 5.6-year primary analysis (86.6% vs 84.7%; HR 0.83, 95% CI 0.66 to 1.04, p=0.10), a significant disease-free and overall survival benefit at 8 years (83.2% vs 78.9%, p=0.009; overall survival 93.3% vs 91.5%), and a persisting but attenuated benefit at 12 years (disease-free survival HR 0.82, 95% CI 0.69 to 0.98; overall survival HR 0.78, 0.60 to 1.01) (N Engl J Med 2015;372:436-46; N Engl J Med 2018;379:122-137; J Clin Oncol 2023;41:1370-1375). Exemestane with ovarian suppression did better still against tamoxifen alone (HR 0.65, 0.49 to 0.87). Where the benefit sits is the useful part. It concentrated in women who remained premenopausal after chemotherapy; in the lower-risk chemotherapy-naive cohort more than 95% of every arm remained free from breast cancer at 5 years, and tamoxifen alone stayed appropriate. <a class=\"trial-link\" href=\"/evidence/#t-text-soft-exemestane\">TEXT &amp; SOFT (exemestane)</a> is the combined analysis of the shared question, exemestane versus tamoxifen on a background of ovarian suppression in 4,690 women. At 68 months exemestane improved disease-free survival (HR 0.72, 95% CI 0.60 to 0.85, P&lt;0.001) and freedom from breast cancer (HR 0.66, P&lt;0.001) with no overall survival difference; at 13 years the recurrence advantage held (12-year disease-free survival HR 0.79, 0.70 to 0.90) while overall survival still did not differ (HR 0.93, 0.78 to 1.11), the survival hazard time-varying with early harm reversing to later benefit (N Engl J Med 2014;371:107-118; J Clin Oncol 2023;41:1376-1382). The <a class=\"trial-link\" href=\"/evidence/#t-ebctcg-premenopausal-ai-vs-tamoxifen-ovarian-suppression-meta-analysis\">EBCTCG premenopausal AI vs tamoxifen (ovarian suppression) meta-analysis</a> of 7,030 women across four trials fixes the magnitude and the limits. An aromatase inhibitor reduced any breast cancer recurrence versus tamoxifen (RR 0.79, 95% CI 0.69 to 0.90; p=0.0005), concentrated in years 0 to 4 when treatments differed (RR 0.68) with no further gain in years 5 to 9, an absolute 5-year reduction of 3.2% (6.9% vs 10.1%). There was no difference in breast cancer mortality (RR 1.01, 0.82 to 1.24) or all-cause mortality (RR 1.04, 0.86 to 1.27) at 8 years, and more fractures with the aromatase inhibitor (6.4% vs 5.1%, RR 1.27) (Lancet Oncol 2022;23:382-392). Practical selection:</p>\n<ul><li class=\"evidence-prose\">Higher-risk premenopausal disease (age under 35, tumour above 2 cm, grade 3): ovarian suppression with an aromatase inhibitor or tamoxifen, the aromatase inhibitor preferred; alternatives are 10 years of tamoxifen, or a sequential tamoxifen-then-aromatase-inhibitor schedule with extension.</li><li class=\"evidence-prose\">Lower-risk disease: tamoxifen alone for 5 to 10 years, or a sequential schedule.</li></ul>\n<p>The observation behind the branch is that in NSABP B-30, premenopausal patients who developed chemotherapy-induced amenorrhoea had better disease-free and overall survival than those who did not.</p>\n<h3 id=\"s-duration-and-extended-therapy\">Duration and extended therapy</h3>\n<p>Recurrence risk in ER-positive disease continues well past five years: the EBCTCG 2024 analysis put late recurrence in pN2 disease at about 2.7% per year, roughly 13% over years 5 to 10. That is the rationale for extending. <a class=\"trial-link\" href=\"/evidence/#t-ma-17-ncic-ctg\">MA.17 (NCIC CTG)</a> randomised 5,187 postmenopausal women disease-free after about five years of tamoxifen to five further years of letrozole or placebo. It stopped at the first interim analysis (median follow-up 2.4 years) with 4-year disease-free survival of 93% versus 87% (HR 0.57, 95% CI 0.43 to 0.75, P=0.00008), a benefit at least as large in node-negative (HR 0.47) as node-positive disease (HR 0.60), and a non-significant overall survival trend (HR 0.76, P=0.25) (N Engl J Med 2003;349:1793-1802). <a class=\"trial-link\" href=\"/evidence/#t-nsabp-b-33\">NSABP B-33</a> tested exemestane in the same position and, read through 44% placebo-to-exemestane crossover after MA.17 reported, gave a borderline 4-year disease-free survival gain (91% vs 89%; HR 0.68, P=.07) and a significant relapse-free survival gain (HR 0.44, P=.004), the disease-free survival benefit confined to node-positive disease (HR 0.50) and absent node-negative (HR 1.13) (J Clin Oncol 2008;26:1965-1971). <a class=\"trial-link\" href=\"/evidence/#t-atlas\">ATLAS</a> answered the same question for tamoxifen. Continuing to 10 years reduced recurrence in years 5 to 14 (21.4% vs 25.1%) and breast cancer mortality (12.2% vs 15.0%, absolute reduction 2.8%), the benefit emerging mainly after year 10, at the cost of more endometrial cancer and pulmonary embolism (Lancet 2013;381:805-816). The <a class=\"trial-link\" href=\"/evidence/#t-ebctcg-extended-ai-meta-analysis\">EBCTCG extended AI meta-analysis</a> of 22,031 women summarises extending an aromatase inhibitor beyond five years. Any further aromatase-inhibitor therapy reduced recurrence by 27% (RR 0.73, 95% CI 0.67 to 0.80, p&lt;0.0001). In the narrower subgroup who had already had some aromatase inhibitor (7,511 women), five further years cut recurrence (RR 0.71; years 5–15 risk 11.6% vs 15.2%) and distant recurrence (RR 0.73), but breast cancer mortality fell only non-significantly (RR 0.90, 95% CI 0.70 to 1.15, p=0.40; 4.4% vs 5.0%). Five-year fracture risk rose (RR 1.35, 1.13 to 1.61), and non-adherence was widespread and similar in both arms (39.0% vs 37.6%) (Lancet 2025;406:603-614). The underlying rates are 3.4% rising to 4.6% (p=0.0009).</p>\n<p>Extending an aromatase inhibitor therefore buys recurrence reduction, not demonstrated survival, at a measurable skeletal cost. The absolute gain was larger in node-positive disease, reflecting higher baseline risk rather than a different proportional effect. Options among the extended-therapy trials:</p>\n<ul><li>Two to five years of tamoxifen followed by five years of an aromatase inhibitor: a disease-free survival benefit, with a survival benefit in node-positive disease (MA.17, GIM4).</li><li>Aromatase inhibition to a total of 10 years: a disease-free survival benefit without a survival benefit and with more bone toxicity (MA.17R, NSABP B-42, AERAS).</li><li>Seven to eight years: a reasonable compromise where tolerance is the problem, with no apparent loss of survival (IDEAL, ABCSG-16/SALSA).</li><li>Tamoxifen to 10 years: superior to five years, with the effect appearing only in the second decade after diagnosis (ATLAS).</li></ul>\n<h3 id=\"s-oral-serds\">Oral SERDs</h3>\n<p><a class=\"trial-link\" href=\"/evidence/#t-lidera-bc\">lidERA (BC)</a> is the first adjuvant trial of a next-generation oral selective oestrogen receptor degrader to report. It randomised 4,170 patients with ER-positive, HER2-negative stage I–III disease to giredestrant 30 mg daily or standard-of-care endocrine therapy for five years, with an LHRH agonist for premenopausal patients on giredestrant or an aromatase inhibitor. Giredestrant improved invasive disease-free survival (3-year 92.4% vs 89.6%; HR 0.70, p=0.0014), with greater benefit in stage II–III disease, a stage I hazard ratio crossing 1.00, and immature overall survival. Discontinuation for adverse events was lower than with an aromatase inhibitor (J Clin Oncol 2026;44(suppl):502). The primary readout was presented at SABCS 2025 and is not yet a full publication, so this is a signal to watch rather than a standard.</p>\n<h3 id=\"s-pregnancy-after-diagnosis\">Pregnancy after diagnosis</h3>\n<p><a class=\"trial-link\" href=\"/evidence/#t-positive\">POSITIVE</a> followed 516 women aged 42 or under with prior stage I–III HR-positive disease who interrupted adjuvant endocrine therapy for up to two years to attempt pregnancy, after 18 to 30 months of treatment. The design was a fixed-threshold safety trial rather than a hazard-ratio comparison: 44 breast cancer events occurred against a prespecified boundary of 46 over 1,638 patient-years, and an external-control comparison against the SOFT/TEXT cohort found no excess 3-year event incidence (8.9% vs 9.2%; adjusted HR 0.81, 95% CI 0.57 to 1.15). Of the cohort, 74.0% achieved at least one pregnancy and 63.8% at least one live birth (N Engl J Med 2023;388:1645-1656). Median follow-up was 3.4 years against a protocol-specified 10-year endpoint, so interruption is supported on short-term safety and the long-term question is open.</p>\n<h3 id=\"s-deciding-on-chemotherapy-genomic-assays\">Deciding on chemotherapy: genomic assays</h3>\n<p>Not every ER-positive tumour needs chemotherapy, and the assays exist to identify the ones that do not. The old St Gallen rule gave chemotherapy to everyone except node-negative invasive ductal carcinoma that was strongly ER-positive, T1, grade 1, lymphovascular-invasion-negative, HER2-negative and in a patient over 35. The 2021 St Gallen consensus omits chemotherapy in stage I disease under 1 cm and allows omission in postmenopausal patients with favourable biology: strong ER expression, low to intermediate grade, low Ki67 and a low-risk genomic signature (Burstein, Ann Oncol 2021).</p>\n<p>Risk calculators such as PREDICT estimate recurrence, mortality and expected chemotherapy benefit, but do not substitute for a molecular assay because they capture neither all biomarkers nor the interaction between biology and treatment effect. Oncotype DX, MammaPrint and PAM50 are all prognostic; only Oncotype DX is validated as predictive of chemotherapy benefit. <strong>Oncotype DX</strong> is an RT-PCR assay of 16 cancer-related and 5 reference genes returning a recurrence score of 0 to 100. <a class=\"trial-link\" href=\"/evidence/#t-paik-et-al-nsabp-b-20-validation\">Paik et al. (NSABP B-20 validation)</a> established the predictive claim retrospectively on 651 node-negative, ER-positive patients randomised to tamoxifen with or without chemotherapy: high-score tumours (≥31) derived large chemotherapy benefit (relative risk 0.26, 95% CI 0.13 to 0.53; absolute 10-year distant-recurrence reduction 27.6%), low-score tumours (&lt;18) derived minimal benefit (relative risk 1.31), and the interaction was significant (p=0.038) (J Clin Oncol 2006;24:3726-3734). The cut points were validated prognostically in NSABP B-14, where 10-year distant recurrence-free survival was 93%, 86% and 70% across the low, intermediate and high-risk groups. <a class=\"trial-link\" href=\"/evidence/#t-tailorx\">TAILORx</a> tested the midrange prospectively in 10,273 patients with HR-positive, HER2-negative, node-negative disease, randomising the 6,711 (69%) with a score of 11 to 25 to endocrine therapy alone or chemoendocrine therapy. Endocrine therapy alone was non-inferior for invasive disease-free survival (HR 1.08, 95% CI 0.94 to 1.24, P=0.26; 9-year 83.3% vs 84.3%). A prespecified age interaction (P=0.004) showed residual chemotherapy benefit in women aged 50 or under with a score of 16 to 25, freedom from distant recurrence higher by up to 6.5 percentage points at 9 years in the 21–25 band, without a demonstrated survival difference (N Engl J Med 2018;379:111-121). <a class=\"trial-link\" href=\"/evidence/#t-rxponder-swog-s1007\">RxPONDER (SWOG S1007)</a> extended the assay to 5,018 patients with one to three positive nodes and a score of 25 or below. The score-by-treatment interaction was not significant (P=0.35), so the score stayed prognostic but stopped predicting relative chemotherapy benefit, while a prespecified menopausal-status interaction was significant (P=0.008) and became the governing variable. Postmenopausal women (66.8%) derived no chemotherapy benefit (HR 1.02, 95% CI 0.82 to 1.26, P=0.89); premenopausal women derived a clear one (invasive disease-free survival HR 0.60, 0.43 to 0.83, P=0.002; distant relapse-free HR 0.58, P=0.009), even at low scores (N Engl J Med 2021;385:2336-2347). Whether that premenopausal signal is direct cytotoxic benefit or indirect ovarian suppression is unresolved, and it matters because the alternative to chemotherapy in a young woman is ovarian suppression, not nothing. The resulting decision rules:</p>\n<div class=\"tblwrap\" role=\"region\" aria-label=\"Scrollable table\" tabindex=\"0\"><table><thead><tr><th scope=\"col\"></th><th scope=\"col\">Node-negative</th><th scope=\"col\">One to three positive nodes</th></tr></thead><tbody><tr><td>Score ≥26</td><td>Chemotherapy</td><td>Chemotherapy</td></tr><tr><td>Score 16–25</td><td>Integrate clinicopathological risk; chemotherapy if aged 50 or under with a score of 21–25, or 16–20 with high clinical risk</td><td>Postmenopausal: no chemotherapy benefit. Premenopausal: benefit on invasive disease-free and distant relapse-free survival</td></tr><tr><td>Score ≤15</td><td>Chemotherapy unlikely to help</td><td>As above</td></tr></tbody></table></div>\n<p><strong>MammaPrint</strong> is a 70-gene signature validated for FFPE tissue in tumours of 5 cm or less with 0 to 3 positive nodes, irrespective of receptor status or menopausal state, returning a binary low-or-high genomic risk. <a class=\"trial-link\" href=\"/evidence/#t-mindact\">MINDACT</a> randomised 6,693 patients on the discordance between clinical and genomic risk. Its primary analysis was a single-arm rate against a fixed threshold, not a between-arm comparison: among the 1,550 women (23.2%) at high clinical but low genomic risk who forwent chemotherapy, 5-year survival without distant metastasis was 94.7% (95% CI 92.5 to 96.2), clearing the prespecified 92% boundary. The secondary randomised comparison in that group was underpowered (adjusted HR 0.78, 95% CI 0.50 to 1.21, P=0.27) (N Engl J Med 2016;375:717-729). About 46% of clinically high-risk women could avoid chemotherapy, and in the reverse discordant group chemotherapy conferred no benefit. <strong>PAM50</strong> identifies intrinsic subtype: luminal A tumours have a very good prognosis without chemotherapy, while luminal B tumours are more likely to recur on endocrine therapy alone and may warrant it. <a class=\"trial-link\" href=\"/evidence/#t-optima\">OPTIMA</a> tested the Prosigna PAM50 risk-of-recurrence score as a chemotherapy-direction tool in 4,429 patients with high-clinical-risk ER-positive, HER2-negative disease, 73% node-positive. Test-directed management was non-inferior on 5-year invasive breast-cancer-free survival (90.4% vs 91.5%; HR 0.99, 90% CI 0.81 to 1.20; non-inferiority p=0.013), and the 68% with a low score could safely avoid chemotherapy, with no heterogeneity by menopausal or nodal status (J Clin Oncol 2026;44(suppl):500). This is an ASCO 2026 abstract rather than a full publication, and what it validates is a test-directed management strategy rather than a treatment-by-assay interaction, so it does not make PAM50 predictive in the sense Oncotype DX is. The assays are not interchangeable: platforms, risk definitions, nodal populations and primary estimands all differ, so a threshold from one does not transfer to another. <a class=\"trial-link\" href=\"/evidence/#t-aster-70s\">ASTER 70s</a> randomised 1,089 women aged 70 or over with ER-positive, HER2-negative disease and a high-risk genomic grade index to chemotherapy then endocrine therapy or endocrine therapy alone, and found no significant survival benefit (8-year overall survival 72.7% vs 68.3%; HR 0.83, 95% CI 0.63 to 1.11, p=0.21) at grade 3 or higher toxicity of 34% versus 9% (Lancet 2025;406:489-500). Genomic high risk in an older patient is not by itself an indication for chemotherapy.</p>\n<h3 id=\"s-cdk4-6-inhibitors\">CDK4/6 inhibitors</h3>\n<p><a class=\"trial-link\" href=\"/evidence/#t-monarche\">monarchE</a> randomised 5,637 patients with node-positive, high-risk HR-positive, HER2-negative disease to two years of abemaciclib 150 mg twice daily added to standard endocrine therapy, or endocrine therapy alone. High risk meant four or more positive nodes, or one to three with a tumour above 5 cm, grade 3 disease, or Ki67 of 20% or above. Invasive disease-free survival improved at the primary analysis (2-year 92.2% vs 88.7%; HR 0.75, 95% CI 0.60 to 0.93, P=.01) and deepened with maturity (7-year HR 0.734). At the 2026 primary overall survival analysis, with 661 deaths at a median 6.3 years, abemaciclib met its prespecified boundary (HR 0.842, 95% CI 0.722 to 0.981, P=0.027; 7-year overall survival 86.8% vs 85.0%) (J Clin Oncol 2020;38:3987-3998; Ann Oncol 2026;37:155-165). That makes monarchE the first adjuvant CDK4/6 trial to convert a recurrence benefit into a demonstrated survival benefit. Ki67 was prognostic but not predictive, so a high Ki67 identifies risk but is not itself the reason to give abemaciclib. Toxicity is diarrhoea, neutropenia and fatigue. <a class=\"trial-link\" href=\"/evidence/#t-natalee\">NATALEE</a> extended the class to a broader population: 5,101 patients with stage II–III disease including selected node-negative tumours, given ribociclib 400 mg daily three weeks on and one week off for three years with a non-steroidal aromatase inhibitor. Three-year invasive disease-free survival was 90.4% versus 87.1% (HR 0.75, 95% CI 0.62 to 0.91, P=0.003), and at the prespecified 5-year follow-up the benefit deepened rather than faded (HR 0.716, 95% CI 0.618 to 0.829, the gap widening from 2.7 to 4.5 percentage points between years 3 and 5) and held in node-negative disease (HR 0.606, 0.372 to 0.986), while overall survival remained a non-significant trend (HR 0.800, 95% CI 0.637 to 1.003) (N Engl J Med 2024;390:1080-1091; ESMO Open 2025;10:105858). Toxicity is neutropenia, transaminitis and QTc prolongation. Eligibility is wider than monarchE: node-positive disease of any burden, or node-negative disease with a T3 tumour, grade 3 histology, or grade 2 histology plus high genomic risk (Ki67 ≥20%, recurrence score ≥26, or high-risk MammaPrint, PAM50 or EndoPredict). The class does not generalise. <a class=\"trial-link\" href=\"/evidence/#t-pallas\">PALLAS</a> gave two years of palbociclib to 5,760 patients with stage II–III disease and was negative, crossing its futility boundary (3-year invasive disease-free survival 88.2% vs 88.5%, HR 0.93), with 45% not completing treatment (Lancet Oncol 2021;22:212-222). <a class=\"trial-link\" href=\"/evidence/#t-penelope-b\">PENELOPE-B</a> gave one year of palbociclib to 1,250 patients with high-CPS-EG residual disease after neoadjuvant chemotherapy and was equally negative (HR 0.93, p=.53), with no benefit in any subgroup (J Clin Oncol 2021;39:1518-1530). Duration, continuity, adherence, eligibility and timing relative to chemotherapy all differ between the positive and negative trials, so what exists is a set of evidence-backed regimens rather than a class rule. Adjuvant palbociclib cannot be recommended; abemaciclib and ribociclib are given in the risk envelopes their own trials defined.</p>\n<h3 id=\"s-olaparib-for-germline-brca-mutated-disease\">Olaparib for germline BRCA-mutated disease</h3>\n<p><a class=\"trial-link\" href=\"/evidence/#t-olympia\">OlympiA</a> randomised 1,836 patients with a germline <em>BRCA1/2</em> pathogenic variant and HER2-negative high-risk early breast cancer, 82.2% of them triple-negative and the remainder HR-positive, to one year of olaparib 300 mg twice daily or placebo after (neo)adjuvant chemotherapy. Invasive disease-free survival improved (3-year 85.9% vs 77.1%; HR 0.58, 99.5% CI 0.41 to 0.82, P&lt;0.001), as did distant disease-free survival (HR 0.57), and the overall survival benefit reached significance at the second interim analysis (4-year 89.8% vs 86.4%; HR 0.68, 98.5% CI 0.47 to 0.97, P=0.009) (N Engl J Med 2021;384:2394-2405; Ann Oncol 2022;33:1250-1268). At the 2021 interim the overall survival hazard ratio was also 0.68 but did not cross its boundary (P=0.02 against P&lt;0.01), so the survival claim belongs to the 2022 analysis and not to the primary publication. Eligibility is defined by prior treatment and residual risk rather than by phenotype:</p>\n<ul><li class=\"evidence-prose\">Triple-negative disease: residual disease after neoadjuvant chemotherapy; or, without neoadjuvant chemotherapy, node-negative disease with a primary tumour of 2 cm or more, or node-positive disease, after adjuvant chemotherapy.</li><li class=\"evidence-prose\">HR-positive disease: a CPS-EG score of 3 or above after neoadjuvant chemotherapy; or, without neoadjuvant chemotherapy, pN2 or above.</li></ul>\n<p>Anaemia is the signature toxicity, at 23.5% any grade and 8.7% grade 3 or higher against 3.9% and 0.3% with placebo, and grade 3 or higher adverse events were roughly twice as frequent overall (24.3% vs 11.3%). Myelodysplastic syndrome and acute myeloid leukaemia were not increased at this cut (0.2% vs 0.3%), but at a median 2.5 years the investigators state longer follow-up is needed before that is settled.</p>\n<h2 id=\"s-her2-positive-disease\">HER2-positive disease</h2>\n<h3 id=\"s-the-trastuzumab-backbone\">The trastuzumab backbone</h3>\n<p>The <a class=\"trial-link\" href=\"/evidence/#t-ebctcg-trastuzumab-meta-analysis\">EBCTCG trastuzumab meta-analysis</a> pooled 13,864 women across seven randomised trials at a median 10.7 years and found reductions of about one-third in recurrence (RR 0.66, 95% CI 0.62 to 0.71) and breast cancer mortality (RR 0.67, 0.61 to 0.73), with absolute 10-year reductions of 9.0% in recurrence, 6.4% in breast cancer mortality and 6.5% in all-cause mortality, and no increase in death without recurrence (Lancet Oncol 2021;22:1139-1150). The proportional reduction was similar irrespective of ER and nodal status while the absolute benefit scaled with baseline risk (5-year recurrence reduction 10.7% with four or more positive nodes versus 5.7% node-negative). Uniform relative benefit with risk-proportional absolute benefit is the arithmetic that licenses both escalating high-risk and de-escalating low-risk disease. <a class=\"trial-link\" href=\"/evidence/#t-nsabp-b-31-ncctg-n9831-joint-analysis\">NSABP B-31 / NCCTG N9831 (joint analysis)</a> tested AC followed by paclitaxel with or without concurrent trastuzumab in about 4,046 patients with node-positive or high-risk node-negative disease. Adding trastuzumab roughly halved recurrence at the interim analysis (disease-free survival HR 0.48, P&lt;0.0001), and the mature joint analysis at 8.4 years gave disease-free survival HR 0.60 (0.53 to 0.68) and overall survival HR 0.63 (0.54 to 0.73), with 10-year overall survival of 84% versus 75.2%, consistent across subgroups (N Engl J Med 2005;353:1673-1684; J Clin Oncol 2014;32:3744-3752). Three-year class III/IV heart failure or cardiac death was 4.1% in B-31 and 2.9% in N9831, concentrated in the anthracycline arms. Because trastuzumab was given concurrently with the taxane, concurrent administration became standard. <a class=\"trial-link\" href=\"/evidence/#t-hera-big-1-01\">HERA (BIG 1-01)</a> confirmed the backbone with a sequential design and fixed the duration, randomising 5,102 patients after completion of chemotherapy to observation, one year of trastuzumab, or two years. One year against observation gave an initial disease-free survival HR of 0.54 settling to 0.76 (0.68 to 0.86) at the 11-year final analysis, with overall survival HR 0.74 (0.64 to 0.86) and 10-year disease-free survival 69% versus 63%, diluted by 52% crossover from the observation arm. Two years added nothing over one (HR 1.02, 0.89 to 1.17) and caused more mild cardiac events; severe cardiotoxicity was low at 0.5% with sequential post-chemotherapy dosing (N Engl J Med 2005;353:1659-1672; Lancet 2017;389:1195-1205). <a class=\"trial-link\" href=\"/evidence/#t-finher\">FinHer</a> gave only nine weeks of trastuzumab alongside docetaxel or vinorelbine before FEC, and improved 3-year recurrence-free survival (89% vs 78%, HR 0.42) in the 232-patient HER2-positive subgroup, with docetaxel also outperforming vinorelbine on distant disease-free survival (HR 0.66, P=0.01) (N Engl J Med 2006;354:809-820). It raised the short-duration question the trials below answered, without an associated LVEF decline.</p>\n<h3 id=\"s-duration\">Duration</h3>\n<p>One year is the standard. Six months is a defensible option in a patient who cannot complete a year, and the two trials that tested it returned near-identical hazard ratios and opposite verdicts.</p>\n<ul><li class=\"evidence-prose\"><a class=\"trial-link\" href=\"/evidence/#t-persephone\">PERSEPHONE</a> randomised 4,089 UK patients pragmatically across all chemotherapy regimens and schedules, and demonstrated non-inferiority of six months (4-year disease-free survival 89.4% vs 89.8%; HR 1.07, 90% CI 0.93 to 1.24, non-inferiority P=0.011 against a 3% margin), with fewer severe adverse events (19% vs 24%, P=0.0002) and less early stopping for cardiotoxicity (3% vs 8%, P&lt;0.0001) (Lancet 2019;393:2599-2612).</li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-phare\">PHARE</a> asked the same question in 3,384 French patients against a stricter margin of 1.15 and failed: the final 7.5-year analysis gave HR 1.08 (95% CI 0.93 to 1.25, P=0.39), the interval still crossing the margin, and concluded 12 months should remain standard (Lancet Oncol 2013;14:741-748; Lancet 2019;393:2591-2598).</span><span class=\"evidence-detail\">Seven-year overall survival was 80.6% versus 82.3% (HR 1.13, p=0.26).</span></li></ul>\n<p>The verdict turns on the prespecified margin rather than on the biology: shortening carries a small, real excess hazard. PHARE&#x27;s subgroup analyses favoured 12 months in patients given taxane-based chemotherapy and concurrent rather than sequential trastuzumab, which is contemporary practice. <a class=\"trial-link\" href=\"/evidence/#t-shorther\">ShortHER</a> tested nine weeks against one year in 1,253 Italian patients and did not meet non-inferiority (disease-free survival HR 1.13, 90% CI 0.89 to 1.42, against a margin of 1.29), on an accrual cut from 2,332 to 1,252 for funding reasons. Ten-year outcomes were close overall (disease-free survival 77% with one year versus 78% with nine weeks; overall survival 89% vs 88%), but nodal status was a stratification factor and the protocol-defined subgroups separate sharply: node-negative and one-to-three-node disease showed negligible differences numerically favouring the short course, whereas four or more positive nodes clearly favoured a year (10-year overall survival 84% vs 64%, HR 1.87) (Ann Oncol 2018;29:2328-2333; J Clin Oncol 2023;41:4976-4981). No interaction test is reported for any subgroup.</p>\n<h3 id=\"s-chemotherapy-partner\">Chemotherapy partner</h3>\n<p><a class=\"trial-link\" href=\"/evidence/#t-bcirg-006\">BCIRG 006</a> randomised 3,222 patients with node-positive or high-risk node-negative disease to AC followed by docetaxel, the same with trastuzumab, or non-anthracycline docetaxel with carboplatin and trastuzumab. Both trastuzumab arms beat chemotherapy alone (5-year disease-free survival 84% for AC-TH and 81% for TCH versus 75%; 5-year overall survival 92% and 91% versus 87%) with no significant efficacy difference between them (N Engl J Med 2011;365:1273-1283). The reported hazard ratios against AC-T are 0.64 for AC-TH and 0.75 for TCH on disease-free survival, and 0.63 and 0.77 on overall survival. The trial was not powered to compare the two trastuzumab-containing regimens, so the absence of a difference between them is exploratory rather than demonstrated equivalence. What separates them is toxicity: congestive heart failure and cardiac dysfunction were significantly higher with AC-TH than TCH (P&lt;0.001), acute leukaemia occurred in seven anthracycline-arm patients against one on TCH, and TCH caused less arthralgia, myalgia, hand-foot syndrome, stomatitis, vomiting and neutropenia.</p>\n<h3 id=\"s-dual-blockade\">Dual blockade</h3>\n<p><a class=\"trial-link\" href=\"/evidence/#t-aphinity\">APHINITY</a> added a year of adjuvant pertuzumab to chemotherapy and trastuzumab in 4,805 patients with node-positive or high-risk node-negative disease, excluding those treated neoadjuvantly. Invasive disease-free survival improved (HR 0.81, 95% CI 0.66 to 1.00, P=0.045), the benefit sitting in node-positive disease (8-year 86.1% vs 81.2%, HR 0.72) and absent node-negative (HR 1.13). Overall survival was not significant at the 8.4-year peer-reviewed analysis (HR 0.83, P=0.078) and reached significance only at the final 11.3-year analysis (HR 0.83, P=0.044; 10-year overall survival 91.6% vs 89.8%), which remains a congress report pending full publication (N Engl J Med 2017;377:122-131; J Clin Oncol 2024;42:3643-3651; ESMO Breast Cancer 2025, LBA1). There was no cardiac penalty; grade 3 or higher diarrhoea ran at about 10% versus 4%. Adjuvant dual blockade is therefore for node-positive disease. A patient treated neoadjuvantly who was clinically node-positive at diagnosis continues pertuzumab post-operatively; one node-negative at diagnosis continues trastuzumab alone.</p>\n<h3 id=\"s-extended-adjuvant-therapy\">Extended adjuvant therapy</h3>\n<p><a class=\"trial-link\" href=\"/evidence/#t-extenet\">ExteNET</a> gave a year of neratinib 240 mg daily after completed trastuzumab-based therapy in 2,840 patients with stage 1–3 disease and improved 5-year invasive disease-free survival (90.2% vs 87.7%; HR 0.73, 95% CI 0.57 to 0.92, P=0.0083), with the benefit concentrated in hormone-receptor-positive disease and in patients starting within about a year of trastuzumab (Lancet Oncol 2016;17:367-377; Lancet Oncol 2017;18:1688-1700). The corresponding rates are 91.2% versus 86.8% in hormone-receptor-positive and 88.9% versus 88.8% in hormone-receptor-negative disease, with 8-year overall survival of 90.1% versus 90.2%. Diarrhoea dominates the toxicity, grade 3 in 40% without loperamide prophylaxis and the leading cause of early discontinuation. Neratinib is used selectively for two reasons: there is no overall survival benefit, and no patient in ExteNET received (neo)adjuvant pertuzumab, so the population does not match contemporary practice. It is the only therapy shown to improve outcomes beyond a completed trastuzumab year, in contrast to HERA&#x27;s null second year: extending helps with a different drug, not more of the same.</p>\n<h3 id=\"s-small-node-negative-tumours\">Small node-negative tumours</h3>\n<p>Small node-negative HER2-positive tumours were largely excluded from the pivotal adjuvant trials, so their question is how little treatment suffices rather than how much. <a class=\"trial-link\" href=\"/evidence/#t-apt-adjuvant-paclitaxel-trastuzumab\">APT (Adjuvant Paclitaxel + Trastuzumab)</a> is a single-arm phase II study of 406 patients with tumours of 3 cm or less that were node-negative or had a single nodal micrometastasis, treated with weekly paclitaxel 80 mg/m² for 12 weeks with trastuzumab, then trastuzumab to complete a year. In practice the population was smaller than that ceiling: 91% of tumours were 2 cm or less and 98.5% were node-negative. At the final 10-year analysis, invasive disease-free survival was 91.3% (95% CI 88.3 to 94.4), overall survival 94.3% and breast-cancer-specific survival 98.8%, with grade 3 neuropathy in 3.2% and symptomatic heart failure in 0.5% (N Engl J Med 2015;372:134-141; Lancet Oncol 2023;24:273-285). <a class=\"trial-link\" href=\"/evidence/#t-atempt\">ATEMPT</a> asked whether adjuvant T-DM1 could make stage I treatment less toxic. It randomised 512 patients 3:1 to 17 cycles of T-DM1 or to paclitaxel with trastuzumab, with co-primary endpoints of toxicity and invasive disease-free survival in the T-DM1 arm. T-DM1 efficacy was excellent (5-year invasive disease-free survival 97.0%, 95% CI 95.2 to 98.7), but clinically relevant toxicity was unchanged at 46% versus 47% (P=0.83); the profile shifted rather than shrank, with less neuropathy and alopecia and more thrombocytopenia and transaminitis (J Clin Oncol 2021;39:2375-2385; J Clin Oncol 2024;42:3652-3665). Early discontinuation was higher with T-DM1, at 17% versus 6%. Paclitaxel with trastuzumab therefore remains the standard for small node-negative tumours, with T-DM1 a validated alternative chosen on which toxicities a patient most wants to avoid.</p>\n<h3 id=\"s-residual-disease-after-neoadjuvant-therapy\">Residual disease after neoadjuvant therapy</h3>\n<p>Where neoadjuvant therapy has been given, adjuvant anti-HER2 therapy is directed by pathological response: continue trastuzumab with or without pertuzumab to complete a year after a pathological complete response, and escalate to T-DM1, or to T-DXd for high-risk residual disease, when invasive disease remains (KATHERINE; DESTINY-Breast05). That pathway is developed in the neoadjuvant chapter.</p>\n<h3 id=\"s-cardiac-monitoring\">Cardiac monitoring</h3>\n<p>Risk factors for trastuzumab-related cardiotoxicity are age over 50, pre-existing cardiac dysfunction, high BMI and treatment with antihypertensives. Echocardiography is performed 3-monthly during trastuzumab. Treatment may resume if LVEF returns to normal within 4 to 8 weeks and the fall from baseline remains no greater than 15%. Discontinue permanently for an LVEF decline persisting beyond 8 weeks, or after more than three treatment interruptions for cardiomyopathy.</p>\n<h2 id=\"s-triple-negative-disease\">Triple-negative disease</h2>\n<p>Where neoadjuvant chemotherapy was not given, adjuvant treatment is chemotherapy and the threshold is low. Stage II–III disease receives a third-generation anthracycline- and taxane-containing regimen; stage I disease receives four cycles of docetaxel and cyclophosphamide; below 0.5 cm the survival advantage is minimal, and above 0.5 cm chemotherapy is offered. <a class=\"trial-link\" href=\"/evidence/#t-rjbc-1501\">RJBC-1501</a> tested adding carboplatin to adjuvant chemotherapy in 786 patients with resected early triple-negative disease, giving four cycles of epirubicin and cyclophosphamide then a taxane with or without carboplatin. Carboplatin improved disease-free survival (3-year 93.1% vs 89.8%; HR 0.66, 95% CI 0.44 to 0.97, P=0.034), distant disease-free survival (HR 0.61, P=0.040) and overall survival (HR 0.39, 95% CI 0.16 to 0.94, P=0.029) at 4.5 years, with more grade 3–4 haematological toxicity (any grade 3–4 event 49.9% vs 38.7%) (J Clin Oncol 2026;44:143-152). This is the adjuvant counterpart to the neoadjuvant platinum question, where the phase 3 test of adding carboplatin missed its primary event-free-survival endpoint and its overall survival and menopausal subgroup findings are nominal, pointing towards platinum in premenopausal disease and away from it postmenopausally. A germline <em>BRCA1/2</em> variant changes the plan: a patient who has completed adjuvant chemotherapy and meets the OlympiA criteria set out above is a candidate for a year of adjuvant olaparib. Where neoadjuvant chemotherapy was given, adjuvant therapy is directed by response: pembrolizumab continues to a year on the KEYNOTE-522 protocol regardless of response, with capecitabine added for residual disease (CREATE-X) or olaparib where a germline <em>BRCA</em> variant is present. Those decisions are developed in the neoadjuvant chapter; no trial has tested how to combine or sequence the three in a patient who qualifies for all of them.</p>\n<h2 id=\"s-bone-modifying-agents\">Bone-modifying agents</h2>\n<p>Adjuvant bisphosphonates reduce bone recurrence and breast cancer mortality in postmenopausal women. The <a class=\"trial-link\" href=\"/evidence/#t-ebctcg-adjuvant-bisphosphonate-meta-analysis\">EBCTCG adjuvant bisphosphonate meta-analysis</a> pooled 18,766 women in 26 trials. Overall reductions were only borderline (recurrence RR 0.94, 2p=0.08; distant recurrence 0.92, 2p=0.03; breast cancer mortality 0.91, 2p=0.04), while the bone-recurrence reduction was definite (RR 0.83, 95% CI 0.73 to 0.94, 2p=0.004). Among the 11,767 postmenopausal women, recurrence (RR 0.86), distant recurrence (0.82), bone recurrence (0.72; 10-year gain 2.2%) and breast cancer mortality (0.82; 10-year gain 3.3%) all fell significantly, while premenopausal women showed no apparent effect on any outcome (Lancet 2015;386:1353-1361). The postmenopausal boundary is less secure than those figures suggest: heterogeneity for bone recurrence was only borderline by menopausal status (2p=0.06 for trend) and correlated with age (2p=0.03), and no preferred agent, schedule or duration was established. Oral clodronate, oral ibandronate and intravenous zoledronate performed comparably; oral pamidronate showed no benefit. In practice, adjuvant bisphosphonates are considered for 3 to 5 years in postmenopausal women with node-positive or high-risk node-negative disease, usually as 6-monthly intravenous zoledronate. Denosumab is not used for this indication because the two trials disagree: ABCSG-18 reduced clinical fractures (HR 0.5, p&lt;0.0001) with a disease-free survival improvement on interim analysis, whereas D-CARE found no difference in disease-free survival or bone-metastasis-free survival, its primary endpoint, with osteonecrosis of the jaw in 5.4% (Lancet 2020).</p>\n<h2 id=\"s-older-and-less-fit-patients\">Older and less fit patients</h2>\n<p>Surgery followed by endocrine therapy remains preferred for older women with HR-positive disease. Primary endocrine therapy alone is an option for those unfit for surgery: a 2007 Cochrane meta-analysis found no significant overall survival difference between surgery plus endocrine therapy and endocrine therapy alone, only a trend, with progression-free survival favouring surgery plus tamoxifen. Anti-HER2 therapy should be incorporated in a fit older patient on the same basis as in a younger one. Triple-negative and HER2-positive tumours derive the greatest absolute benefit from chemotherapy, and PREDICT is a reasonable starting point for quantifying it. Regimen choice runs TC, or AC followed by a taxane in a very fit patient, with CMF where neither anthracycline nor taxane is tolerable. Where the patient is not a surgical candidate at all: ER-positive disease receives primary endocrine therapy, while HER2-positive and triple-negative disease are observed if asymptomatic, reserving HER2-directed therapy with single-agent chemotherapy, or single-agent chemotherapy such as capecitabine or weekly paclitaxel, for symptomatic or metastatic disease.</p>\n<h2 id=\"s-follow-up\">Follow-up</h2>\n<p>History and examination 3- to 6-monthly for the first three years, 6- to 12-monthly in years four and five, and annually thereafter, with annual mammography. There is no indication for laboratory tests or imaging to screen for metastases in an asymptomatic patient.</p>\n<h2 id=\"s-references\">References</h2>\n<ol class=\"refs\">\n<li id=\"ref-breast-early-breast-cancer-t-acosog-z0011-alliance\"><a class=\"trial-link\" href=\"/evidence/#t-acosog-z0011-alliance\">ACOSOG Z0011 (Alliance)</a>. <a href=\"https://drive.google.com/file/d/1dRgHgppaMgBAM9td3tIQQESx4iuag0Qb/preview\">JAMA 2011;305:569-575</a>; <a href=\"https://drive.google.com/file/d/1uRrZZYObxt8gE98wx0aM0WDsMkKZhXd8/preview\">JAMA 2017;318:918-926</a></li>\n<li id=\"ref-breast-early-breast-cancer-t-amaros\"><a class=\"trial-link\" href=\"/evidence/#t-amaros\">AMAROS</a>. <a href=\"https://drive.google.com/file/d/19SAZKMTFI4tnrwcPnDG_4DgFobgKcQhw/preview\">Lancet Oncol 2014;15:1303-1310</a></li>\n<li id=\"ref-breast-early-breast-cancer-t-senomac\"><a class=\"trial-link\" href=\"/evidence/#t-senomac\">SENOMAC</a>. <a href=\"https://drive.google.com/file/d/1zYX3erxtFBmTj8itES4jjWPH0hojjpJu/preview\">N Engl J Med 2024;390:1163-1175</a>; <a href=\"https://drive.google.com/file/d/1auJst3Sj0jCCYGkq4-MHqve1iFh987Dx/preview\">J Clin Oncol 2026;44(suppl):LBA503 (ASCO 2026 abstract)</a></li>\n<li id=\"ref-breast-early-breast-cancer-t-ebctcg-15-year-overview\"><a class=\"trial-link\" href=\"/evidence/#t-ebctcg-15-year-overview\">EBCTCG 15-year overview</a>. <a href=\"https://dr a\"><a class=\"trial-link\" href=\"/evidence/#t-optima\">OPTIMA</a>. <a href=\"https://drive.google.com/file/d/1oqpwkxi5mF3C5sFnxXOAt2CUrwReeMN_/preview\">J Clin Oncol 2026;44(suppl):500 (ASCO 2026 abstract)</a></li>\n<li id=\"ref-breast-early-breast-cancer-t-aster-70s\"><a class=\"trial-link\" href=\"/evidence/#t-aster-70s\">ASTER 70s</a>. <a href=\"https://drive.google.com/file/d/1OJfrf2DEvSJe_y-t_M-EEDfRATBLajWP/preview\">Lancet 2025;406:489-500</a></li>\n<li id=\"ref-breast-early-breast-cancer-t-monarche\"><a class=\"trial-link\" href=\"/evidence/#t-monarche\">monarchE</a>. <a href=\"https://drive.google.com/file/d/1j7woJJz2c5-cHY8SFBKS41bdgt4jwHZF/preview\">J Clin Oncol 2020;38:3987-3998</a>; <a href=\"https://drive.google.com/file/d/1sUk8AMHKqk7MniTzrFOG1WevE6ik6nFS/preview\">Lancet Oncol 2023;24:77-90</a>; <a href=\"https://drive.google.com/file/d/1APn--RWKNvjjD9DGL86kjr0lHwB7rv6O/preview\">Ann Oncol 2026;37:155-165</a></li>\n<li id=\"ref-breast-early-breast-cancer-t-natalee\"><a class=\"trial-link\" href=\"/evidence/#t-natalee\">NATALEE</a>. <a href=\"https://drive.google.com/file/d/1JZXMxpSHYgj9kj1RVuCTasYY7iC9L-Pb/preview\">N Engl J Med 2024;390:1080-1091</a>; <a href=\"https://drive.google.com/file/d/1oem4hm_gcISI2Iu3LPQ4tESY5IBiXM0S/preview\">ESMO Open 2025;10:105858</a></li>\n<li id=\"ref-breast-early-breast-cancer-t-pallas\"><a class=\"trial-link\" href=\"/evidence/#t-pallas\">PALLAS</a>. <a href=\"https://drive.google.com/file/d/1y7qIi_cLABwERoizBRNBTO8W21y9XLKT/preview\">Lancet Oncol 2021;22:212-222</a></li>\n<li id=\"ref-breast-early-breast-cancer-t-penelope-b\"><a class=\"trial-link\" href=\"/evidence/#t-penelope-b\">PENELOPE-B</a>. <a href=\"https://drive.google.com/file/d/1ARNWNJ_ST_56O7shH377KVukgn_jCl6P/preview\">J Clin Oncol 2021;39:1518-1530</a></li>\n<li id=\"ref-breast-early-breast-cancer-t-olympia\"><a class=\"trial-link\" href=\"/evidence/#t-olympia\">OlympiA</a>. <a href=\"https://drive.google.com/file/d/1vchaLZDGyxUe6socMeIvd4CXtBY6nr8K/preview\">N Engl J Med 2021;384:2394-2405</a>; <a href=\"https://drive.google.com/file/d/10GahBZ3WjYp1WbnLkbHlPRaBk-tigfTF/preview\">Ann Oncol 2022;33:1250-1268</a></li>\n<li id=\"ref-breast-early-breast-cancer-t-ebctcg-trastuzumab-meta-analysis\"><a class=\"trial-link\" href=\"/evidence/#t-ebctcg-trastuzumab-meta-analysis\">EBCTCG trastuzumab meta-analysis</a>. <a href=\"https://drive.google.com/file/d/1PwIFmvtdwHIkSP5ojSZCNKsvkuamJwer/preview\">Lancet Oncol 2021;22:1139-1150</a></li>\n<li id=\"ref-breast-early-breast-cancer-t-nsabp-b-31-ncctg-n9831-joint-analysis\"><a class=\"trial-link\" href=\"/evidence/#t-nsabp-b-31-ncctg-n9831-joint-analysis\">NSABP B-31 / NCCTG N9831 (joint analysis)</a>. <a href=\"https://drive.google.com/file/d/1wZZdo2XlPiFv2AapbLDeDPkneVRLroO4/preview\">N Engl J Med 2005;353:1673-1684</a>; <a href=\"https://drive.google.com/file/d/1GAxDqs2xYob0UogKU0V2-3wghwRtkq00/preview\">Perez EA et al. J Clin Oncol 2014;32:3744-3752</a>; <a href=\"https://drive.google.com/file/d/1mCJEWbUJk-Qt4BiPTjjjx4j0feLjOfK8/preview\">Chumsri S et al. J Clin Oncol 2019;37:3425-3435</a></li>\n<li id=\"ref-breast-early-breast-cancer-t-hera-big-1-01\"><a class=\"trial-link\" href=\"/evidence/#t-hera-big-1-01\">HERA (BIG 1-01)</a>. <a href=\"https://drive.google.com/file/d/1y-8UXApJx76p9DM2sgFlwI3hAEhzpqkP/preview\">N Engl J Med 2005;353:1659-1672</a>; <a href=\"https://drive.google.com/file/d/1bx26UX3_zE0sUGywjUPjatzXRjifSYS0/preview\">Cameron D et al. Lancet 2017;389:1195-1205</a></li>\n<li id=\"ref-breast-early-breast-cancer-t-finher\"><a class=\"trial-link\" href=\"/evidence/#t-finher\">FinHer</a>. <a href=\"https://doi.org/10.1056/NEJMoa053028\">N Engl J Med 2006;354:809-820</a>; <a href=\"https://pubmed.ncbi.nlm.nih.gov/19884557/\">Joensuu H et al. J Clin Oncol 2009;27:5685-5692</a></li>\n<li id=\"ref-breast-early-breast-cancer-t-persephone\"><a class=\"trial-link\" href=\"/evidence/#t-persephone\">PERSEPHONE</a>. <a href=\"https://drive.google.com/file/d/1j5WyN
