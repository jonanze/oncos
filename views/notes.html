<script>
window.oncosView = {
  name: 'notes',
  init: function(ctx) {

if (false) {
    window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
  }
const NOTES = [{"id": "breast-breast-cancer-histopathology-receptor-assessment-and-staging", "slug": "breast-cancer-histopathology-receptor-assessment-and-staging", "group": "Breast", "title": "Breast cancer: histopathology, receptor assessment and staging", "updated": "", "sections": [{"id": "s-epidemiology", "h": "Epidemiology", "depth": 2}, {"id": "s-risk-factors", "h": "Risk factors", "depth": 2}, {"id": "s-non-modifiable", "h": "Non-modifiable", "depth": 3}, {"id": "s-modifiable", "h": "Modifiable", "depth": 3}, {"id": "s-risk-prediction-models", "h": "Risk prediction models", "depth": 3}, {"id": "s-proliferative-and-in-situ-lesions", "h": "Proliferative and in-situ lesions", "depth": 2}, {"id": "s-invasive-carcinoma", "h": "Invasive carcinoma", "depth": 2}, {"id": "s-grading", "h": "Grading", "depth": 3}, {"id": "s-histological-subtypes", "h": "Histological subtypes", "depth": 3}, {"id": "s-molecular-subtypes", "h": "Molecular subtypes", "depth": 2}, {"id": "s-receptor-assessment", "h": "Receptor assessment", "depth": 2}, {"id": "s-hormone-receptors", "h": "Hormone receptors", "depth": 3}, {"id": "s-her2", "h": "HER2", "depth": 3}, {"id": "s-her2-low-and-her2-ultralow", "h": "HER2-low and HER2-ultralow", "depth": 3}, {"id": "s-genomic-assays", "h": "Genomic assays", "depth": 2}, {"id": "s-pathological-response-after-neoadjuvant-therapy", "h": "Pathological response after neoadjuvant therapy", "depth": 2}, {"id": "s-clinical-presentation", "h": "Clinical presentation", "depth": 2}, {"id": "s-staging", "h": "Staging", "depth": 2}, {"id": "s-work-up", "h": "Work-up", "depth": 2}, {"id": "s-references", "h": "References", "depth": 2}], "html": "<h2 id=\"s-epidemiology\">Epidemiology</h2>\n<p>Breast cancer is the most commonly diagnosed cancer in women worldwide. WHO estimated 2.3 million diagnoses and 670,000 deaths in 2022; disease also occurs in men, but far less often. Local incidence and mortality should be taken from the current national cancer registry rather than carried forward from an unbound historical estimate.<sup class=\"trial-ref\"><a href=\"#ref-breast-breast-cancer-histopathology-receptor-assessment-and-staging-ext-f49e44fa5b00\" aria-label=\"Reference 1: WHO/IARC Global Cancer Burden 2022 estimates\">1</a></sup></p>\n<h2 id=\"s-risk-factors\">Risk factors</h2>\n<h3 id=\"s-non-modifiable\">Non-modifiable</h3>\n<p>Risk rises with age. Other established non-modifiable factors include family history and inherited susceptibility, a personal history of breast cancer or selected proliferative lesions, dense breasts and prior therapeutic chest irradiation. Reproductive and hormonal exposure alter risk through lifetime oestrogen exposure. Genetic assessment is prompted by the complete personal and family history rather than by one fixed gene list in this chapter.<sup class=\"trial-ref\"><a href=\"#ref-breast-breast-cancer-histopathology-receptor-assessment-and-staging-ext-6c54a73dfbda\" aria-label=\"Reference 2: NCI Breast Cancer Prevention PDQ\">2</a></sup></p>\n<h3 id=\"s-modifiable\">Modifiable</h3>\n<p>Modifiable or exposure-related risks include alcohol, postmenopausal excess weight and selected exogenous hormone regimens. Physical activity is protective. The magnitude and direction of hormonal associations depend on menopausal status, formulation, duration and time since exposure, so counselling should use current absolute-risk tools rather than isolated historical relative risks.<sup class=\"trial-ref\"><a href=\"#ref-breast-breast-cancer-histopathology-receptor-assessment-and-staging-ext-6c54a73dfbda\" aria-label=\"Reference 2: NCI Breast Cancer Prevention PDQ\">2</a></sup></p>\n<h3 id=\"s-risk-prediction-models\">Risk prediction models</h3>\n<p>All three models in common use were created and validated in populations that do not represent every patient equally, so calibration varies by population. The Gail model (BCRAT) calculates absolute risk from current age, age at menarche, age at first live birth, number of previous breast biopsies, atypical hyperplasia, race/ethnicity and the number of first-degree female relatives—mother, sisters or daughters—with breast cancer.<sup class=\"trial-ref\"><a href=\"#ref-breast-breast-cancer-histopathology-receptor-assessment-and-staging-ext-2f0880183688\" aria-label=\"Reference 3: NCI Breast Cancer Risk Assessment Tool\">3</a></sup></p>\n<p>It returns short- and longer-term absolute risk of invasive breast cancer. Its limited family-history inputs and development population mean it should not replace hereditary-cancer assessment, and it is not intended for every prior-lesion or prior-cancer setting. Different models use different inputs and can return materially different estimates; select one validated for the clinical question and population.</p>\n<h2 id=\"s-proliferative-and-in-situ-lesions\">Proliferative and in-situ lesions</h2>\n<p>Proliferative lesions are divided by whether atypia is present. Atypical ductal or lobular hyperplasia and lobular neoplasia indicate increased future breast-cancer risk; management depends on radiological-pathological concordance, sampling and whether a higher-risk lesion could have been missed.<sup class=\"trial-ref\"><a href=\"#ref-breast-breast-cancer-histopathology-receptor-assessment-and-staging-ext-29bf1e5a1d73\" aria-label=\"Reference 4: NCI Breast Cancer Treatment PDQ - pathology and in-situ disease\">4</a></sup></p>\n<p>DCIS is a proliferation of malignant epithelial cells within the mammary ductal system with no invasion of the surrounding stroma. It differs from lobular carcinoma in radiological appearance, morphology, biological behaviour and anatomic distribution.</p>\n<p>DCIS architecture, nuclear grade and necrosis are reported with extent and margins. Classical LCIS is primarily a bilateral risk marker, whereas non-classical lobular lesions require separate multidisciplinary assessment.</p>\n<p>For a core-biopsy diagnosis, radiological-pathological discordance or non-classical LCIS generally prompts excision; incidental classical LCIS with concordant imaging can be managed through risk assessment and surveillance.<sup class=\"trial-ref\"><a href=\"#ref-breast-breast-cancer-histopathology-receptor-assessment-and-staging-ext-29bf1e5a1d73\" aria-label=\"Reference 4: NCI Breast Cancer Treatment PDQ - pathology and in-situ disease\">4</a></sup></p>\n<h2 id=\"s-invasive-carcinoma\">Invasive carcinoma</h2>\n<h3 id=\"s-grading\">Grading</h3>\n<p>Invasive carcinoma is graded by the Nottingham criteria, which score gland formation, nuclear atypia and mitotic count from 1 to 3 each. A total of 3–5 is grade 1, 6–7 grade 2 and 8–9 grade 3.<sup class=\"trial-ref\"><a href=\"#ref-breast-breast-cancer-histopathology-receptor-assessment-and-staging-ext-29bf1e5a1d73\" aria-label=\"Reference 4: NCI Breast Cancer Treatment PDQ - pathology and staging\">4</a></sup></p>\n<div class=\"tblwrap\" role=\"region\" aria-label=\"Scrollable table\" tabindex=\"0\"><table><thead><tr><th scope=\"col\">Feature</th><th scope=\"col\">1</th><th scope=\"col\">2</th><th scope=\"col\">3</th></tr></thead><tbody><tr><td>Gland (acinus) formation</td><td>&gt;75% of the carcinoma forming glandular or tubular structures</td><td>10–75% forming glandular or tubular structures</td><td>&lt;10% forming glandular or tubular structures</td></tr><tr><td>Nuclear atypia / pleomorphism</td><td>Small nuclei, little increase in size over normal breast epithelium, regular outlines, uniform chromatin, little variation in size</td><td>Cells larger than normal, open vesicular nuclei, visible nucleoli, moderate variation in size and shape</td><td>Vesicular nuclei, often prominent nucleoli, marked variation in size and shape, occasionally very large and bizarre forms</td></tr><tr><td>Mitotic count</td><td>Score 1</td><td>Score 2</td><td>Score 3</td></tr></tbody></table></div>\n<p>Count cells with definite mitoses in 10 consecutive fields and assign a score from 1 to 3; field-diameter-specific thresholds are required for exact cutoffs.</p>\n<h3 id=\"s-histological-subtypes\">Histological subtypes</h3>\n<p>Invasive carcinoma of no special type is the commonest category. Invasive lobular carcinoma is recognised by its morphology and loss of cell cohesion, often supported by E-cadherin assessment. Special histological types, including tubular, mucinous, metaplastic and other rare patterns, should be reported because morphology can alter prognosis, differential diagnosis and treatment planning. Phyllodes tumour, Paget disease and inflammatory breast cancer are distinct clinical-pathological entities and should not be folded into a generic invasive-carcinoma pathway.<sup class=\"trial-ref\"><a href=\"#ref-breast-breast-cancer-histopathology-receptor-assessment-and-staging-ext-29bf1e5a1d73\" aria-label=\"Reference 4: NCI Breast Cancer Treatment PDQ - pathology and staging\">4</a></sup></p>\n<h2 id=\"s-molecular-subtypes\">Molecular subtypes</h2>\n<p>Intrinsic molecular subtypes—luminal A, luminal B, HER2-enriched and basal-like—are gene-expression categories, not exact synonyms for routine immunohistochemical groups. Their distributions and prognoses differ, but treatment decisions in ordinary practice should follow validated receptor, genomic-assay and clinical criteria rather than an inferred intrinsic subtype.</p>\n<h2 id=\"s-receptor-assessment\">Receptor assessment</h2>\n<p>A prognostic factor gives information about outcome independent of therapy, such as nodal status, Ki-67 or triple-negative histology. A predictive factor gives information about the likelihood of response to a particular treatment: hormone receptor status predicts response to endocrine therapy, and HER2 status predicts response to HER2-directed therapy. Both hormone receptor and HER2 assessment are therefore run on every invasive cancer, and repeated on a biopsy of recurrent or metastatic disease.</p>\n<h3 id=\"s-hormone-receptors\">Hormone receptors</h3>\n<p>ER and PR are assessed by immunohistochemistry. Report the percentage and intensity of staining, including an explicit ER-low-positive category where appropriate, because a low result carries different biological and treatment uncertainty from strongly positive disease.<sup class=\"trial-ref\"><a href=\"#ref-breast-breast-cancer-histopathology-receptor-assessment-and-staging-ext-29bf1e5a1d73\" aria-label=\"Reference 4: NCI Breast Cancer Treatment PDQ - biomarkers\">4</a></sup></p>\n<h3 id=\"s-her2\">HER2</h3>\n<p>HER2 is both prognostic and predictive. A cancer is HER2-positive on immunohistochemistry of 3+, or on demonstrated gene amplification by in-situ hybridisation. Immunohistochemistry is scored on the completeness and intensity of membrane staining and the proportion of invasive tumour cells stained.</p>\n<div class=\"tblwrap\" role=\"region\" aria-label=\"Scrollable table\" tabindex=\"0\"><table><thead><tr><th scope=\"col\">Score</th><th scope=\"col\">Staining</th></tr></thead><tbody><tr><td>0</td><td>No membrane staining, or faint/barely perceptible incomplete membrane staining in ≤10% of invasive tumour cells</td></tr><tr><td>1+</td><td>Faint/barely perceptible incomplete membrane staining in &gt;10% of invasive tumour cells</td></tr><tr><td>2+ (equivocal)</td><td>Weak-to-moderate complete membrane staining in &gt;10%, or complete intense circumferential membrane staining in ≤10%, of invasive tumour cells</td></tr><tr><td>3+ (positive)</td><td>Complete intense circumferential membrane staining in &gt;10% of invasive tumour cells</td></tr></tbody></table></div>\n<p>The 3+ threshold was 30% before it was revised to 10%. Dual-probe in-situ hybridisation counts HER2 gene copies against the chromosome 17 centromeric probe, but uncommon ratio/copy-number combinations must not be classified from the counts alone.</p>\n<p>They require blinded recount and integrated adjudication with concurrent HER2 immunohistochemistry under the current ASCO/CAP group algorithm. This chapter therefore does not reproduce a count-only shortcut: use the current algorithm for Groups 2–4 and report the IHC score alongside the final interpretation.<sup class=\"trial-ref\"><a href=\"#ref-breast-breast-cancer-histopathology-receptor-assessment-and-staging-ext-27071309b1d3\" aria-label=\"Reference 5: CAP-ASCO HER2 guideline 2023\">5</a></sup></p>\n<h3 id=\"s-her2-low-and-her2-ultralow\">HER2-low and HER2-ultralow</h3>\n<p>The mandatory pathology result remains the semiquantitative HER2 immunohistochemistry score, with in-situ hybridisation where indicated, and the final ASCO/CAP interpretation. ASCO/CAP does not endorse HER2-low as a new interpretive reporting category. In treatment trials, HER2-low describes immunohistochemistry of 1+, or 2+ with negative in-situ hybridisation; HER2-ultralow describes a score of 0 with faint incomplete membrane staining in 10% or fewer cells. These are treatment-eligibility descriptors layered on the exact IHC result, not replacements for it.</p>\n<p><a class=\"trial-link\" href=\"/evidence/#t-destiny-breast04\">DESTINY-Breast04</a> established HER2-low as a targetable category in previously treated advanced disease (N Engl J Med 2022;387:9-20).</p>\n<p><a class=\"trial-link\" href=\"/evidence/#t-destiny-breast06\">DESTINY-Breast06</a> moved that category into chemotherapy-naive hormone receptor-positive disease after at least one endocrine line, with an exploratory HER2-ultralow cohort (N Engl J Med 2024;391:2110-2122). Continue to report the exact IHC score; when treatment eligibility makes the distinction relevant, record faint incomplete score-0 staining separately from complete absence of membrane staining.</p>\n<h2 id=\"s-genomic-assays\">Genomic assays</h2>\n<p>Genomic assays are used in selected hormone-receptor-positive, HER2-negative early breast cancer to estimate recurrence risk and, for some populations, the benefit expected from adding chemotherapy. Platforms, nodal populations and thresholds are not interchangeable. The early-breast-cancer chapter owns the trial-defined treatment thresholds and outcomes.</p>\n<h2 id=\"s-pathological-response-after-neoadjuvant-therapy\">Pathological response after neoadjuvant therapy</h2>\n<p>Where systemic therapy is given before surgery, the resection specimen is reported for residual disease. <a class=\"trial-link\" href=\"/evidence/#t-ctneobc-pooled-analysis\">CTNeoBC pooled analysis</a> compared pathological-complete-response definitions and supports reporting clearance from both breast and nodes: ypT0 ypN0 or ypT0/is ypN0. The neoadjuvant chapter owns the prognostic outcome estimates and their subtype interpretation.</p>\n<p><a class=\"trial-link\" href=\"/evidence/#t-residual-cancer-burden-symmans\">Residual Cancer Burden (Symmans)</a> grades what remains rather than treating all non-pCR specimens as one bin, using a continuous index with predefined cut points at 1.36 and 3.28 to give classes RCB-0 (pCR) through RCB-III (J Clin Oncol 2017;35:1049-1060). The neoadjuvant chapter owns its prognostic interpretation.</p>\n<p>Better pathological response at trial level does not guarantee better survival, and the strength of pCR as a surrogate differs by subtype.</p>\n<h2 id=\"s-clinical-presentation\">Clinical presentation</h2>\n<p>Presentation may be screen-detected or symptomatic. Diagnostic imaging defines the breast and axillary abnormality, but tissue diagnosis is required before treatment; core biopsy provides invasive status and the material needed for receptor testing. Suspicious axillary nodes can be sampled with needle biopsy.<sup class=\"trial-ref\"><a href=\"#ref-breast-breast-cancer-histopathology-receptor-assessment-and-staging-ext-29bf1e5a1d73\" aria-label=\"Reference 4: NCI Breast Cancer Treatment PDQ - diagnosis and staging\">4</a></sup></p>\n<h2 id=\"s-staging\">Staging</h2>\n<p>Staging follows the current AJCC TNM system, with separate clinical and pathological information where available.<sup class=\"trial-ref\"><a href=\"#ref-breast-breast-cancer-histopathology-receptor-assessment-and-staging-ext-29bf1e5a1d73\" aria-label=\"Reference 4: NCI Breast Cancer Treatment PDQ - diagnosis and staging\">4</a></sup></p>\n<p>Inflammatory breast cancer is a clinical T4d presentation requiring rapid-onset diffuse inflammatory breast changes with pathological confirmation of invasive carcinoma; suspected disease needs prompt multidisciplinary assessment.</p>\n<p>AJCC 8 carries two parallel stage assignments. The anatomic stage is TNM alone. The prognostic stage combines TNM with histological grade (G1–3) and ER, PR and HER2 status, so a small high-grade triple-negative tumour and a small low-grade hormone receptor-positive tumour of the same size no longer share a stage.</p>\n<p>Use the current AJCC tables for any biomarker- or genomic-assay modification of prognostic stage rather than carrying a single exception forward in prose.</p>\n<h2 id=\"s-work-up\">Work-up</h2>\n<p>Systemic staging in non-metastatic disease is directed by stage, symptoms, examination and laboratory findings rather than performed uniformly in low-risk asymptomatic disease. Locally advanced, recurrent or suspected metastatic disease requires appropriate cross-sectional and symptom-directed imaging. When feasible and clinically useful, biopsy recurrence and reassess ER, PR and HER2 because a changed result can alter treatment.<sup class=\"trial-ref\"><a href=\"#ref-breast-breast-cancer-histopathology-receptor-assessment-and-staging-ext-29bf1e5a1d73\" aria-label=\"Reference 4: NCI Breast Cancer Treatment PDQ - diagnosis and staging\">4</a></sup></p>\n<h2 id=\"s-references\">References</h2>\n<ol class=\"refs\">\n<li id=\"ref-breast-breast-cancer-histopathology-receptor-assessment-and-staging-ext-f49e44fa5b00\"><a href=\"https://www.who.int/news/item/01-02-2024-global-cancer-burden-growing--amidst-mounting-need-for-services\" rel=\"noopener\" target=\"_blank\">WHO/IARC Global Cancer Burden 2022 estimates</a></li>\n<li id=\"ref-breast-breast-cancer-histopathology-receptor-assessment-and-staging-ext-6c54a73dfbda\"><a href=\"https://www.cancer.gov/types/breast/hp/breast-prevention-pdq\" rel=\"noopener\" target=\"_blank\">NCI Breast Cancer Prevention PDQ</a></li>\n<li id=\"ref-breast-breast-cancer-histopathology-receptor-assessment-and-staging-ext-2f0880183688\"><a href=\"https://bcrisktool.cancer.gov/about.html\" rel=\"noopener\" target=\"_blank\">NCI Breast Cancer Risk Assessment Tool</a></li>\n<li id=\"ref-breast-breast-cancer-histopathology-receptor-assessment-and-staging-ext-29bf1e5a1d73\"><a href=\"https://www.cancer.gov/types/breast/hp/breast-treatment-pdq\" rel=\"noopener\" target=\"_blank\">NCI Breast Cancer Treatment PDQ - pathology and in-situ disease</a></li>\n<li id=\"ref-breast-breast-cancer-histopathology-receptor-assessment-and-staging-ext-27071309b1d3\"><a href=\"https://www.cap.org/cap-guidelines/her2-testing-in-breast-cancer-2023-guideline-update/\" rel=\"noopener\" target=\"_blank\">CAP-ASCO HER2 guideline 2023</a></li>\n<li id=\"ref-breast-breast-cancer-histopathology-receptor-assessment-and-staging-t-destiny-breast04\"><a class=\"trial-link\" href=\"/evidence/#t-destiny-breast04\">DESTINY-Breast04</a>. <a href=\"https://drive.google.com/file/d/1sz6jHZqXGadMeSpVtrwopFJlBfJC0gnj/preview\">N Engl J Med 2022;387:9-20</a></li>\n<li id=\"ref-breast-breast-cancer-histopathology-receptor-assessment-and-staging-t-destiny-breast06\"><a class=\"trial-link\" href=\"/evidence/#t-destiny-breast06\">DESTINY-Breast06</a>. <a href=\"https://drive.google.com/file/d/1iiK_y_JE-EHFESx-UeeWDBFRRamz6Ke9/preview\">N Engl J Med 2024;391:2110-2122</a></li>\n<li id=\"ref-breast-breast-cancer-histopathology-receptor-assessment-and-staging-t-ctneobc-pooled-analysis\"><a class=\"trial-link\" href=\"/evidence/#t-ctneobc-pooled-analysis\">CTNeoBC pooled analysis</a>. <a href=\"https://drive.google.com/file/d/1jvK9nfPbnTPqNWvCU2_Vm6WRJ7IYLg1d/preview\">Lancet 2014;384:164-172</a>; <a href=\"https://drive.google.com/file/d/1PsIhGkSFxN_QG7PcpxAnOEBi6XW16H6d/preview\">J Clin Oncol 2023;41:2988-2997</a></li>\n<li id=\"ref-breast-breast-cancer-histopathology-receptor-assessment-and-staging-t-residual-cancer-burden-symmans\"><a class=\"trial-link\" href=\"/evidence/#t-residual-cancer-burden-symmans\">Residual Cancer Burden (Symmans)</a>. <a href=\"https://drive.google.com/file/d/1E-JYtupEi6MpmwjGPbL216DQk832voAB/preview\">J Clin Oncol 2017;35:1049-1060</a></li>\n</ol>", "_hay": "breast cancer: histopathology, receptor assessment and staging breast-cancer-histopathology-receptor-assessment-and-staging breast epidemiology risk factors non-modifiable modifiable risk prediction models proliferative and in-situ lesions invasive carcinoma grading histological subtypes molecular subtypes receptor assessment hormone receptors her2 her2-low and her2-ultralow genomic assays pathological response after neoadjuvant therapy clinical presentation staging work-up references"}, {"id": "breast-ductal-carcinoma-in-situ", "slug": "ductal-carcinoma-in-situ", "group": "Breast", "title": "Ductal carcinoma in situ", "updated": "", "sections": [{"id": "s-biology-and-natural-history", "h": "Biology and natural history", "depth": 2}, {"id": "s-diagnosis-and-work-up", "h": "Diagnosis and work-up", "depth": 2}, {"id": "s-surgery", "h": "Surgery", "depth": 2}, {"id": "s-radiotherapy-after-breast-conservation", "h": "Radiotherapy after breast conservation", "depth": 2}, {"id": "s-omitting-radiotherapy-in-low-risk-disease", "h": "Omitting radiotherapy in low-risk disease", "depth": 3}, {"id": "s-systemic-therapy", "h": "Systemic therapy", "depth": 2}, {"id": "s-follow-up-and-prognosis", "h": "Follow-up and prognosis", "depth": 2}, {"id": "s-references", "h": "References", "depth": 2}], "html": "<h2 id=\"s-biology-and-natural-history\">Biology and natural history</h2>\n<p>Ductal carcinoma in situ is a proliferation of malignant epithelial cells confined within the mammary ductal system, with no invasion of the surrounding stroma. Untreated progression risk varies widely and should not be represented by one percentage across all DCIS.</p>\n<p>In a rare biopsy-only cohort of 28 women whose lesions were later recognised as low-grade DCIS, 11 developed invasive cancer in the same breast and quadrant over follow-up extending beyond 40 years. That result does not describe completely excised, screen-detected DCIS.<sup class=\"trial-ref\"><a href=\"#ref-breast-ductal-carcinoma-in-situ-ext-cbedfac70eb4\" aria-label=\"Reference 1: Sanders low-grade DCIS natural-history cohort\">1</a></sup> Grade is assigned from nuclear features, and recurrence risk is interpreted with lesion extent, necrosis and surgical-margin status rather than grade alone.<sup class=\"trial-ref\"><a href=\"#ref-breast-ductal-carcinoma-in-situ-ext-29bf1e5a1d73\" aria-label=\"Reference 2: NCI Breast Cancer Treatment PDQ - DCIS\">2</a></sup></p>\n<p>A core-biopsy diagnosis can be upgraded to invasive disease in the surgical specimen. That possibility matters most when the planned operation would prevent reliable later sentinel-node staging.</p>\n<h2 id=\"s-diagnosis-and-work-up\">Diagnosis and work-up</h2>\n<p>Work-up establishes nuclear grade and ER status. ER status does not alter local treatment; it determines whether endocrine therapy for risk reduction is worth offering. MRI is selective rather than routine and should not determine mastectomy by itself.<sup class=\"trial-ref\"><a href=\"#ref-breast-ductal-carcinoma-in-situ-ext-29bf1e5a1d73\" aria-label=\"Reference 2: NCI Breast Cancer Treatment PDQ - DCIS\">2</a></sup></p>\n<p>Where MRI suggests more extensive disease than mammography, such that a markedly larger resection would be needed for complete excision, confirm the extra disease histologically by MRI-guided biopsy first.</p>\n<h2 id=\"s-surgery\">Surgery</h2>\n<p>The local-treatment choice is between breast-conserving surgery followed by radiotherapy and mastectomy; neither radiotherapy nor endocrine therapy has shown a survival benefit, but both can reduce recurrence risk.<sup class=\"trial-ref\"><a href=\"#ref-breast-ductal-carcinoma-in-situ-ext-29bf1e5a1d73\" aria-label=\"Reference 2: NCI Breast Cancer Treatment PDQ - DCIS\">2</a></sup></p>\n<p>Mastectomy is unnecessary for many patients, whereas breast conservation retains a higher risk of local recurrence and generally requires a radiotherapy discussion. Criteria for breast conservation include:</p>\n<ul><li>disease that is not multicentric, multicentricity meaning two or more foci separated by significant disease, usually across more than one quadrant;</li><li>a cosmetically acceptable resection, which in practice means a low ratio of disease size to breast size;</li><li>histologically negative margins adequate for the planned breast-conserving treatment.</li></ul>\n<p>Sentinel node biopsy is not staging for the DCIS itself.<sup class=\"trial-ref\"><a href=\"#ref-breast-ductal-carcinoma-in-situ-ext-29bf1e5a1d73\" aria-label=\"Reference 2: NCI Breast Cancer Treatment PDQ - DCIS\">2</a></sup></p>\n<p>It is done when the operation would make a later sentinel node biopsy impossible, or when the likelihood of occult invasive cancer is high enough to warrant staging the axilla at the same sitting.<sup class=\"trial-ref\"><a href=\"#ref-breast-ductal-carcinoma-in-situ-ext-29bf1e5a1d73\" aria-label=\"Reference 2: NCI Breast Cancer Treatment PDQ - DCIS\">2</a></sup></p>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\">Total mastectomy permanently alters lymphatic drainage, so an accurate sentinel node biopsy cannot be performed afterwards if invasive cancer is found unexpectedly in the specimen.</span><span class=\"evidence-detail\">Patients requiring mastectomy also have a higher likelihood of harbouring invasive cancer than those with a smaller focus of disease, and should have sentinel node biopsy at the same operation.</span></li><li class=\"evidence-prose\">Patients who are candidates for conservation but opt for mastectomy should have the same discussion.</li><li class=\"evidence-prose\">After conservation, sentinel node biopsy remains possible as a second procedure if invasive cancer is found in the specimen, so it is not done up front.</li></ul>\n<h2 id=\"s-radiotherapy-after-breast-conservation\">Radiotherapy after breast conservation</h2>\n<p>Radiotherapy after conservation substantially reduces ipsilateral recurrence without a demonstrated survival benefit. Randomised trials and pooled analyses consistently show this local-control effect.<sup class=\"trial-ref\"><a href=\"#ref-breast-ductal-carcinoma-in-situ-ext-29bf1e5a1d73\" aria-label=\"Reference 2: NCI Breast Cancer Treatment PDQ - DCIS\">2</a></sup></p>\n<p>NSABP B-17 randomised DCIS after wide local excision to radiotherapy or no radiotherapy.<sup class=\"trial-ref\"><a href=\"#ref-breast-ductal-carcinoma-in-situ-ext-29bf1e5a1d73\" aria-label=\"Reference 2: NCI Breast Cancer Treatment PDQ - DCIS\">2</a></sup></p>\n<p>At 15 years the ipsilateral invasive recurrence rate was 8.9% with radiotherapy against 19.4% without, and overall survival was similar (83% vs 84%; Fisher, N Engl J Med 1999). This is a recurrence-prevention result, not evidence that radiotherapy prolongs life.</p>\n<p>Choose whole-breast or partial-breast treatment and the fractionation schedule from current radiotherapy guidance, margin status, recurrence risk, anatomy and patient preference; do not import an invasive-cancer boost estimate as if it were a DCIS-specific result.</p>\n<h3 id=\"s-omitting-radiotherapy-in-low-risk-disease\">Omitting radiotherapy in low-risk disease</h3>\n<p>For fully resected low-risk disease, and particularly for ER-positive disease that will receive endocrine therapy, the absolute reduction in in-breast recurrence may be too small to justify the risks of radiotherapy. There are no strict criteria for low risk; the working definition is low or intermediate grade, size under 2.5 cm, and widely negative margins of at least 3 mm.<sup class=\"trial-ref\"><a href=\"#ref-breast-ductal-carcinoma-in-situ-ext-29bf1e5a1d73\" aria-label=\"Reference 2: NCI Breast Cancer Treatment PDQ - DCIS\">2</a></sup></p>\n<p>RTOG 9804 tested this in 636 patients with good-risk DCIS, defined as low to intermediate grade, under 2.5 cm and margins of at least 3 mm, randomised after conservation to radiotherapy or observation. It closed early because accrual fell below projection.<sup class=\"trial-ref\"><a href=\"#ref-breast-ductal-carcinoma-in-situ-ext-29bf1e5a1d73\" aria-label=\"Reference 2: NCI Breast Cancer Treatment PDQ - DCIS\">2</a></sup></p>\n<p>At a median follow-up of 7.17 years, the primary endpoint of ipsilateral local failure was 0.9% with radiotherapy against 6.7% with observation at 7 years, with more grade 1–2 toxicity (76% vs 30%) and no difference in disease-free or overall survival (J Clin Oncol 2015). At 15 years radiotherapy had reduced local failure by 50%.</p>\n<p>Radiotherapy still improves local control in good-risk disease, so omission trades a higher local-recurrence risk against treatment burden. Partial-breast irradiation is an alternative to whole-breast irradiation for appropriately selected DCIS, not a substitution licensed by the RTOG 9804 criteria alone.</p>\n<p>Current ASTRO guidance strongly recommends it for favourable clinical and tumour features, conditionally recommends it for higher-grade or larger lesions, and does not recommend it for positive margins, germline <em>BRCA1/2</em> variants or age under 40. Daily or alternate-day schedules are preferred over twice-daily treatment.<sup class=\"trial-ref\"><a href=\"#ref-breast-ductal-carcinoma-in-situ-ext-718dfe4b0ea1\" aria-label=\"Reference 3: ASTRO partial-breast irradiation guideline for invasive cancer and DCIS\">3</a></sup></p>\n<h2 id=\"s-systemic-therapy\">Systemic therapy</h2>\n<p>Chemotherapy has no role. Endocrine therapy after surgery is risk reduction rather than treatment of residual DCIS.<sup class=\"trial-ref\"><a href=\"#ref-breast-ductal-carcinoma-in-situ-ext-29bf1e5a1d73\" aria-label=\"Reference 2: NCI Breast Cancer Treatment PDQ - DCIS\">2</a></sup></p>\n<p>Discuss tamoxifen or an aromatase inhibitor after breast-conserving surgery for ER-positive disease to reduce ipsilateral and contralateral events.<sup class=\"trial-ref\"><a href=\"#ref-breast-ductal-carcinoma-in-situ-ext-c2aa5c246c14\" aria-label=\"Reference 4: Ontario DCIS guideline\">4</a></sup></p>\n<p>Balance that benefit against toxicity and the absence of a demonstrated survival benefit. After unilateral mastectomy, the Ontario guideline says the discussion remains relevant for contralateral-risk reduction, but it found no eligible mastectomy trial, so the possible benefit is uncertain and must be individualised. After bilateral mastectomy there is no breast-event prevention rationale.</p>\n<p>The established options are tamoxifen and, after menopause, an aromatase inhibitor. Their different thromboembolic, uterine, vasomotor, bone and musculoskeletal toxicities should drive shared selection. NSABP B-24 randomised patients treated by conservation and radiotherapy to tamoxifen or placebo.</p>\n<p>Tamoxifen reduced subsequent breast events in NSABP B-24 without improving overall survival. NSABP B-35 compared 5 years of anastrozole with 5 years of tamoxifen in postmenopausal women with hormone-receptor-positive DCIS treated by conservation.<sup class=\"trial-ref\"><a href=\"#ref-breast-ductal-carcinoma-in-situ-ext-29bf1e5a1d73\" aria-label=\"Reference 2: NCI Breast Cancer Treatment PDQ - DCIS\">2</a></sup></p>\n<p>Anastrozole produced fewer breast-cancer events than tamoxifen in B-35 without a demonstrated overall-survival advantage. Endocrine therapy is selected for event reduction and tolerability; HER2-directed systemic therapy is not part of routine DCIS treatment.</p>\n<h2 id=\"s-follow-up-and-prognosis\">Follow-up and prognosis</h2>\n<p>Follow-up centres on clinical review and regular mammographic surveillance after breast conservation.<sup class=\"trial-ref\"><a href=\"#ref-breast-ductal-carcinoma-in-situ-ext-c2aa5c246c14\" aria-label=\"Reference 4: Ontario DCIS guideline\">4</a></sup></p>\n<p>The aim of treatment is to reduce the risk of a subsequent invasive breast cancer while avoiding unnecessary morbidity. No local or endocrine treatment for DCIS has demonstrated a survival benefit.</p>\n<h2 id=\"s-references\">References</h2>\n<ol class=\"refs\">\n<li id=\"ref-breast-ductal-carcinoma-in-situ-ext-cbedfac70eb4\"><a href=\"https://pubmed.ncbi.nlm.nih.gov/15884091/\" rel=\"noopener\" target=\"_blank\">Sanders low-grade DCIS natural-history cohort</a></li>\n<li id=\"ref-breast-ductal-carcinoma-in-situ-ext-29bf1e5a1d73\"><a href=\"https://www.cancer.gov/types/breast/hp/breast-treatment-pdq\" rel=\"noopener\" target=\"_blank\">NCI Breast Cancer Treatment PDQ - DCIS</a></li>\n<li id=\"ref-breast-ductal-carcinoma-in-situ-ext-718dfe4b0ea1\"><a href=\"https://www.astro.org/news-and-publications/news-and-media-center/news-releases/2023/astro-issues-patient-centered-clinical-guideline-on-partial-breast-irradiation-for-early-stage-invas\" rel=\"noopener\" target=\"_blank\">ASTRO partial-breast irradiation guideline for invasive cancer and DCIS</a></li>\n<li id=\"ref-breast-ductal-carcinoma-in-situ-ext-c2aa5c246c14\"><a href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC11675061/\" rel=\"noopener\" target=\"_blank\">Ontario DCIS guideline</a></li>\n</ol>", "_hay": "ductal carcinoma in situ ductal-carcinoma-in-situ breast biology and natural history diagnosis and work-up surgery radiotherapy after breast conservation omitting radiotherapy in low-risk disease systemic therapy follow-up and prognosis references"}, {"id": "breast-early-breast-cancer", "slug": "early-breast-cancer", "group": "Breast", "title": "Early breast cancer", "updated": "", "sections": [{"id": "s-scope-and-treatment-framework", "h": "Scope and treatment framework", "depth": 2}, {"id": "s-breast-surgery", "h": "Breast surgery", "depth": 2}, {"id": "s-breast-conservation-versus-mastectomy", "h": "Breast conservation versus mastectomy", "depth": 3}, {"id": "s-margins-and-contraindications", "h": "Margins and contraindications", "depth": 3}, {"id": "s-axillary-management", "h": "Axillary management", "depth": 2}, {"id": "s-sentinel-node-biopsy", "h": "Sentinel node biopsy", "depth": 3}, {"id": "s-a-positive-sentinel-node", "h": "A positive sentinel node", "depth": 3}, {"id": "s-radiotherapy", "h": "Radiotherapy", "depth": 2}, {"id": "s-after-breast-conserving-surgery", "h": "After breast-conserving surgery", "depth": 3}, {"id": "s-omitting-radiotherapy-in-older-low-risk-disease", "h": "Omitting radiotherapy in older, low-risk disease", "depth": 3}, {"id": "s-post-mastectomy-radiotherapy", "h": "Post-mastectomy radiotherapy", "depth": 3}, {"id": "s-fractionation-and-treatment-volume", "h": "Fractionation and treatment volume", "depth": 3}, {"id": "s-sequencing-with-systemic-therapy", "h": "Sequencing with systemic therapy", "depth": 3}, {"id": "s-her2-positive-disease", "h": "HER2-positive disease", "depth": 2}, {"id": "s-the-trastuzumab-backbone", "h": "The trastuzumab backbone", "depth": 3}, {"id": "s-duration", "h": "Duration", "depth": 3}, {"id": "s-chemotherapy-partner", "h": "Chemotherapy partner", "depth": 3}, {"id": "s-dual-blockade", "h": "Dual blockade", "depth": 3}, {"id": "s-extended-adjuvant-therapy", "h": "Extended adjuvant therapy", "depth": 3}, {"id": "s-small-node-negative-tumours", "h": "Small node-negative tumours", "depth": 3}, {"id": "s-residual-disease-after-neoadjuvant-therapy", "h": "Residual disease after neoadjuvant therapy", "depth": 3}, {"id": "s-cardiac-monitoring", "h": "Cardiac monitoring", "depth": 3}, {"id": "s-triple-negative-disease", "h": "Triple-negative disease", "depth": 2}, {"id": "s-adjuvant-chemotherapy-the-backbone", "h": "Adjuvant chemotherapy: the backbone", "depth": 2}, {"id": "s-what-chemotherapy-adds", "h": "What chemotherapy adds", "depth": 3}, {"id": "s-anthracycline-and-taxane", "h": "Anthracycline and taxane", "depth": 3}, {"id": "s-can-the-anthracycline-be-dropped", "h": "Can the anthracycline be dropped?", "depth": 3}, {"id": "s-schedule-and-taxane-choice", "h": "Schedule and taxane choice", "depth": 3}, {"id": "s-intensified-chemotherapy-with-stem-cell-rescue", "h": "Intensified chemotherapy with stem-cell rescue", "depth": 3}, {"id": "s-hr-positive-her2-negative-disease", "h": "HR-positive, HER2-negative disease", "depth": 2}, {"id": "s-deciding-on-chemotherapy-genomic-assays", "h": "Deciding on chemotherapy: genomic assays", "depth": 3}, {"id": "s-the-endocrine-foundation", "h": "The endocrine foundation", "depth": 3}, {"id": "s-premenopausal-disease-and-ovarian-suppression", "h": "Premenopausal disease and ovarian suppression", "depth": 3}, {"id": "s-duration-and-extended-therapy", "h": "Duration and extended therapy", "depth": 3}, {"id": "s-oral-serds", "h": "Oral SERDs", "depth": 3}, {"id": "s-pregnancy-after-diagnosis", "h": "Pregnancy after diagnosis", "depth": 3}, {"id": "s-cdk4-6-inhibitors", "h": "CDK4/6 inhibitors", "depth": 3}, {"id": "s-olaparib-for-germline-brca-mutated-disease", "h": "Olaparib for germline BRCA-mutated disease", "depth": 3}, {"id": "s-bone-modifying-agents", "h": "Bone-modifying agents", "depth": 2}, {"id": "s-older-and-less-fit-patients", "h": "Older and less fit patients", "depth": 2}, {"id": "s-follow-up", "h": "Follow-up", "depth": 2}, {"id": "s-references", "h": "References", "depth": 2}], "html": "<h2 id=\"s-scope-and-treatment-framework\">Scope and treatment framework</h2>\n<p>Non-metastatic breast cancer is treated with a coordinated local and systemic plan based on anatomical stage, operability, tumour biology and patient fitness. Primary surgery is usual for operable early disease; neoadjuvant treatment is used when downstaging or response-adapted postoperative treatment will change management.<sup class=\"trial-ref\"><a href=\"#ref-breast-early-breast-cancer-ext-29bf1e5a1d73\" aria-label=\"Reference 1: NCI Breast Cancer Treatment PDQ - early disease\">1</a></sup></p>\n<p>Neoadjuvant therapy is preferred where it would permit breast conservation, convert a clinically node-positive axilla to ypN0, or generate the in-vivo response readout that directs post-operative escalation; that pathway is covered in the neoadjuvant chapter. Prognostic and predictive tumour features answer different questions and are not interchangeable.</p>\n<ul><li class=\"evidence-prose\">Prognostic factors estimate recurrence risk, including nodal status, grade, tumour size and subtype.</li><li class=\"evidence-prose\">Predictive factors estimate response to a specific treatment, including hormone-receptor status for endocrine therapy, HER2 status for HER2-directed therapy and a validated genomic assay in its tested population.</li></ul>\n<p>Clinical risk estimates how much recurrence is available to prevent; a predictive marker estimates whether a given treatment is likely to prevent it.</p>\n<h2 id=\"s-breast-surgery\">Breast surgery</h2>\n<h3 id=\"s-breast-conservation-versus-mastectomy\">Breast conservation versus mastectomy</h3>\n<p>Breast-conserving surgery followed by radiotherapy and mastectomy provide comparable survival for appropriately selected operable disease. Radiotherapy is part of breast-conserving treatment because it substantially reduces ipsilateral recurrence and can reduce breast-cancer mortality.<sup class=\"trial-ref\"><a href=\"#ref-breast-early-breast-cancer-ext-29bf1e5a1d73\" aria-label=\"Reference 1: NCI Breast Cancer Treatment PDQ - early disease\">1</a></sup></p>\n<h3 id=\"s-margins-and-contraindications\">Margins and contraindications</h3>\n<p>An adequate margin after lumpectomy for invasive cancer is no tumour on ink. Breast conservation requires complete excision with acceptable cosmesis and the ability to deliver indicated radiotherapy. Multicentric or very extensive disease, persistently involved margins and a true contraindication to radiotherapy may require mastectomy; genetic predisposition and connective-tissue disease require diagnosis-specific multidisciplinary review rather than a blanket rule.<sup class=\"trial-ref\"><a href=\"#ref-breast-early-breast-cancer-ext-29bf1e5a1d73\" aria-label=\"Reference 1: NCI Breast Cancer Treatment PDQ - early disease\">1</a></sup></p>\n<h2 id=\"s-axillary-management\">Axillary management</h2>\n<h3 id=\"s-sentinel-node-biopsy\">Sentinel node biopsy</h3>\n<p>Sentinel node biopsy is the staging operation for a clinically and radiologically negative axilla. A suspicious node is assessed with imaging and needle biopsy before surgery. The result must be interpreted in the context of planned breast surgery, radiotherapy and any neoadjuvant treatment.<sup class=\"trial-ref\"><a href=\"#ref-breast-early-breast-cancer-ext-29bf1e5a1d73\" aria-label=\"Reference 1: NCI Breast Cancer Treatment PDQ - early disease\">1</a></sup></p>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\">Pregnancy: pregnancy is not a categorical reason to omit axillary staging.</span><span class=\"evidence-detail\">Evidence for sentinel node biopsy is limited; if it is considered, choose the mapping approach and timing with breast surgery, maternal–fetal medicine and nuclear medicine rather than assuming either tracer is universally available or safe.<sup class=\"trial-ref\"><a href=\"#ref-breast-early-breast-cancer-ext-56b2ae828237\" aria-label=\"Reference 2: NCI Breast Cancer Treatment During Pregnancy PDQ\">2</a></sup></span></li><li class=\"evidence-prose\">Clinically node-positive disease, treated with axillary dissection; patients receiving neoadjuvant chemotherapy are restaged before surgery to reassess suitability.</li><li class=\"evidence-prose\">Inflammatory breast cancer, treated with axillary dissection.</li><li class=\"evidence-prose\">Selected older patients with small hormone-receptor-positive tumours in whom nodal information would not change systemic or radiotherapy decisions.</li></ul>\n<h3 id=\"s-a-positive-sentinel-node\">A positive sentinel node</h3>\n<p>Completion axillary dissection is now the exception. It remains indicated for three or more positive nodes, and for one to two positive nodes in a patient who declines whole-breast radiotherapy.</p>\n<p>It is not required for isolated tumour cells, or for limited sentinel-node involvement in the trial-defined settings below. <a class=\"trial-link\" href=\"/evidence/#t-acosog-z0011-alliance\">ACOSOG Z0011 (Alliance)</a> changed practice, and its boundaries matter as much as its result.</p>\n<p>It randomised 891 women with clinical T1–T2 disease, no palpable adenopathy, and one or two sentinel nodes positive on haematoxylin and eosin, all treated with lumpectomy and tangential whole-breast irradiation with nodal fields prohibited, to sentinel node dissection alone or completion dissection.</p>\n<p>At a median 9.3 years, sentinel node dissection alone was non-inferior for 10-year overall survival (86.3% vs 83.6%; HR 0.85, one-sided 95% CI 0 to 1.16; non-inferiority P=.02 against a margin of 1.3), despite additional non-sentinel macrometastases in 27.3% of the dissection arm (JAMA 2011;305:569-575; JAMA 2017;318:918-926). Three qualifications apply.</p>\n<p>Ten-year disease-free survival (80.2% vs 78.2%; HR 0.85, 95% CI 0.62 to 1.17, P=.32) and locoregional relapse-free survival (P=.41) were tested for difference rather than non-inferiority, so they are absence of evidence of a difference rather than demonstrated equivalence. The trial closed early at 891 of 1,900 planned patients with 110 of the roughly 500 deaths needed for power, and the timing of this analysis was not prespecified.</p>\n<p>And 18.9% of patients in an independent analysis of radiation fields received protocol-prohibited nodal irradiation, though the investigators found it evenly distributed between arms and unlikely to have affected the result. The authors set out what the finding does not cover: palpable positive nodes, more than two involved sentinel nodes, omission of whole-breast irradiation, mastectomy without radiotherapy, and neoadjuvant therapy. <a class=\"trial-link\" href=\"/evidence/#t-amaros\">AMAROS</a> asked whether radiotherapy can replace surgery when the axilla still needs treatment.</p>\n<p>It randomised 4,806 patients with cN0 T1–2 disease before sentinel node biopsy, delivering the allocated treatment only to the 1,425 who proved sentinel-node-positive, to axillary dissection or axillary radiotherapy covering all three levels and the medial supraclavicular fossa.</p>\n<p>Five-year axillary recurrence was 0.43% after dissection and 1.19% after radiotherapy, with no significant difference in disease-free survival (86.9% vs 82.7%; HR 1.18, 95% CI 0.93 to 1.51; p=0.18) or overall survival (93.3% vs 92.5%; HR 1.17; p=0.34), and clinical lymphoedema at 5 years of 11% after radiotherapy versus 23% after dissection (Lancet Oncol 2014;15:1303-1310).</p>\n<p>The event rate was so low that the non-inferiority test was underpowered (one-sided 95% CI 0.00 to 5.27 against a margin of 2.0), so non-inferiority was not formally demonstrated; what the trial shows is excellent axillary control by either route at very different morbidity. <a class=\"trial-link\" href=\"/evidence/#t-senomac\">SENOMAC</a> is the only trial on this axis to reach its prespecified event target.</p>\n<p>It randomised 2,766 patients with cN0 T1–3 disease and one or two sentinel-node macrometastases to completion dissection or sentinel node biopsy alone, after mastectomy or breast conservation, with about 89% of both arms receiving nodal-target irradiation.</p>\n<p>Five-year recurrence-free survival was 89.7% with omission versus 88.7% with dissection (country-adjusted HR 0.89, 95% CI 0.66 to 1.19; P&lt;0.001 against a non-inferiority margin of 1.44) (N Engl J Med 2024;390:1163-1175).</p>\n<p>The primary overall-survival endpoint matured in 2026 at 94.4% versus 93.4% (HR 0.84, 0.64 to 1.12) with breast-cancer-specific survival of 97.8% versus 97.3% (HR 0.86, 0.55 to 1.34), both interval upper bounds below the 1.44 margin, and significantly better patient-reported arm function at 3 and 5 years (J Clin Oncol 2026;44(suppl):LBA503).</p>\n<p>That analysis was reported at ASCO 2026 and is not yet a full publication. Because nodal irradiation was given to most of both arms, SENOMAC states its results are comparable with AMAROS rather than with Z0011. A mastectomy patient with one or two positive sentinel nodes, whom Z0011 does not cover, can therefore omit dissection provided the undissected axilla is irradiated. The composite rule after a positive sentinel node:</p>\n<ul><li>Isolated tumour cells or micrometastases: no further axillary surgery.</li><li>One to two macrometastases after breast conservation with whole-breast tangential radiotherapy: no further axillary surgery (Z0011).</li><li>One to two macrometastases after mastectomy, or otherwise outside Z0011 criteria: omit dissection but include the undissected axilla in the radiotherapy field (AMAROS, SENOMAC).</li><li>Three or more positive nodes: axillary dissection.</li></ul>\n<h2 id=\"s-radiotherapy\">Radiotherapy</h2>\n<h3 id=\"s-after-breast-conserving-surgery\">After breast-conserving surgery</h3>\n<p>Whole-breast irradiation after breast-conserving surgery substantially reduces recurrence and can reduce breast-cancer mortality; treatment planning balances that benefit against cardiac, pulmonary and second-malignancy risks.<sup class=\"trial-ref\"><a href=\"#ref-breast-early-breast-cancer-ext-29bf1e5a1d73\" aria-label=\"Reference 1: NCI Breast Cancer Treatment PDQ - early disease\">1</a></sup></p>\n<h3 id=\"s-omitting-radiotherapy-in-older-low-risk-disease\">Omitting radiotherapy in older, low-risk disease</h3>\n<p>Radiotherapy omission is a selective option for older patients with small, node-negative, strongly hormone-receptor-positive tumours who will take endocrine therapy. It increases ipsilateral recurrence without a demonstrated survival penalty in the studied populations, so the decision should be framed as local-control benefit versus treatment burden rather than as equivalent treatment. Younger age, adverse pathology and uncertain endocrine adherence argue against omission.<sup class=\"trial-ref\"><a href=\"#ref-breast-early-breast-cancer-ext-29bf1e5a1d73\" aria-label=\"Reference 1: NCI Breast Cancer Treatment PDQ - early disease\">1</a></sup></p>\n<h3 id=\"s-post-mastectomy-radiotherapy\">Post-mastectomy radiotherapy</h3>\n<p>Post-mastectomy radiotherapy treats the chest wall and selected regional nodes when locoregional recurrence risk justifies it. It is standard for T4 disease and extensive nodal involvement, and is considered for one to three positive nodes or other adverse features after integrating tumour burden, margin status, biology, systemic therapy and comorbidity.<sup class=\"trial-ref\"><a href=\"#ref-breast-early-breast-cancer-ext-29bf1e5a1d73\" aria-label=\"Reference 1: NCI Breast Cancer Treatment PDQ - early disease\">1</a></sup></p>\n<h3 id=\"s-fractionation-and-treatment-volume\">Fractionation and treatment volume</h3>\n<p>Current whole-breast radiotherapy commonly uses hypofractionation. Fractionation, boost and nodal coverage are selected from anatomy, margin status, recurrence risk and current radiotherapy guidance rather than from one historical schedule.<sup class=\"trial-ref\"><a href=\"#ref-breast-early-breast-cancer-ext-29bf1e5a1d73\" aria-label=\"Reference 1: NCI Breast Cancer Treatment PDQ - early disease\">1</a></sup></p>\n<p>Partial-breast irradiation treats the lumpectomy bed with a margin. Current ASTRO guidance strongly recommends it as an alternative to whole-breast irradiation for node-negative invasive cancer with favourable features, including grade 1–2 disease, ER-positive status, age 40 or older and small tumour size. It is conditionally recommended for grade 3 disease, ER-negative histology or larger tumours.<sup class=\"trial-ref\"><a href=\"#ref-breast-early-breast-cancer-ext-718dfe4b0ea1\" aria-label=\"Reference 6: ASTRO partial-breast irradiation guideline for invasive cancer and DCIS\">6</a></sup></p>\n<p>It is not recommended for positive nodes, positive margins, germline <em>BRCA1/2</em> variants or age under 40, and is conditionally not recommended where evidence is sparse, including lymphovascular invasion or lobular histology. Daily or alternate-day schedules are preferred over twice-daily treatment. DCIS-specific selection is covered in the DCIS chapter.</p>\n<p>Regional nodal irradiation is standard for extensive nodal involvement and considered for lower nodal burden or adverse node-negative disease when the expected recurrence reduction exceeds pulmonary, cardiac and lymphoedema risk. The exact fields depend on surgery, pathological burden and whether an undissected axilla requires treatment.<sup class=\"trial-ref\"><a href=\"#ref-breast-early-breast-cancer-ext-29bf1e5a1d73\" aria-label=\"Reference 1: NCI Breast Cancer Treatment PDQ - early disease\">1</a></sup></p>\n<h3 id=\"s-sequencing-with-systemic-therapy\">Sequencing with systemic therapy</h3>\n<p>Radiotherapy is usually delivered after adjuvant cytotoxic chemotherapy. Trastuzumab or endocrine therapy may overlap when clinically appropriate, with sequencing individualised for toxicity, wound healing and treatment delay.<sup class=\"trial-ref\"><a href=\"#ref-breast-early-breast-cancer-ext-29bf1e5a1d73\" aria-label=\"Reference 1: NCI Breast Cancer Treatment PDQ - early disease\">1</a></sup></p>\n<h2 id=\"s-her2-positive-disease\">HER2-positive disease</h2>\n<h3 id=\"s-the-trastuzumab-backbone\">The trastuzumab backbone</h3>\n<p>The <a class=\"trial-link\" href=\"/evidence/#t-ebctcg-trastuzumab-meta-analysis\">EBCTCG trastuzumab meta-analysis</a> pooled 13,864 women across seven randomised trials at a median 10.7 years and found reductions of about one-third in recurrence (RR 0.66, 95% CI 0.62 to 0.71) and breast cancer mortality (RR 0.67, 0.61 to 0.73), with absolute 10-year reductions of 9.0% in recurrence and 6.4% in breast cancer mortality.</p>\n<p>All-cause mortality also fell, with no evidence of increased death without recurrence (Lancet Oncol 2021;22:1139-1150). Relative benefit was similar by ER and nodal status, while absolute benefit increased with baseline risk. <a class=\"trial-link\" href=\"/evidence/#t-nsabp-b-31-ncctg-n9831-joint-analysis\">NSABP B-31 / NCCTG N9831 (joint analysis)</a> tested AC followed by paclitaxel with or without concurrent trastuzumab in about 4,046 patients with node-positive or high-risk node-negative disease.</p>\n<p>At final follow-up, adding trastuzumab reduced recurrence and mortality: disease-free survival HR 0.60 and overall survival HR 0.63, with 10-year disease-free survival 73.7% versus 62.2% and overall survival 84.0% versus 75.2% (N Engl J Med 2005;353:1673-1684; J Clin Oncol 2014;32:3744-3752). Three-year NYHA III/IV heart failure or cardiac death occurred in 4.1% in B-31 and 2.9% in N9831.</p>\n<p><a class=\"trial-link\" href=\"/evidence/#t-hera-big-1-01\">HERA (BIG 1-01)</a> confirmed the backbone with a sequential design and fixed the duration, randomising 5,102 patients after completion of chemotherapy to observation, one year of trastuzumab, or two years.</p>\n<p>One year against observation gave an initial disease-free survival HR of 0.54 settling to 0.76 (0.68 to 0.86) at the 11-year final analysis, with overall survival HR 0.74 (0.64 to 0.86) and 10-year disease-free survival 69% versus 63%, diluted by 52% crossover from the observation arm.</p>\n<p>Two years added nothing over one (HR 1.02, 0.89 to 1.17) and caused more mild cardiac events; severe cardiotoxicity was low at 0.5% with sequential post-chemotherapy dosing (N Engl J Med 2005;353:1659-1672; Lancet 2017;389:1195-1205). <a class=\"trial-link\" href=\"/evidence/#t-finher\">FinHer</a> tested nine weeks of trastuzumab alongside docetaxel or vinorelbine before FEC in a 232-patient HER2-positive subgroup.</p>\n<p>At five years, distant disease-free survival was 83.3% versus 73.0% (HR 0.65, 95% CI 0.38 to 1.12) and overall survival was 91.3% versus 82.3% (HR 0.55, 95% CI 0.27 to 1.11); neither improvement was established statistically. Symptomatic heart failure occurred in 0.9% versus 1.7% (N Engl J Med 2006;354:809-820; J Clin Oncol 2009;27:5685-5692).</p>\n<p>The mature result supersedes the interim recurrence-free-survival signal and does not establish nine weeks as equivalent to one year.</p>\n<h3 id=\"s-duration\">Duration</h3>\n<p>One year is the standard. Six months is a defensible option in a patient who cannot complete a year, and the two trials that tested it returned near-identical hazard ratios and opposite verdicts.</p>\n<ul><li class=\"evidence-prose\"><a class=\"trial-link\" href=\"/evidence/#t-persephone\">PERSEPHONE</a> randomised 4,089 UK patients pragmatically across all chemotherapy regimens and schedules, and demonstrated non-inferiority of six months (4-year disease-free survival 89.4% vs 89.8%; HR 1.07, 90% CI 0.93 to 1.24, non-inferiority P=0.011 against a 3% margin), with fewer severe adverse events (19% vs 24%, P=0.0002) and less early stopping for cardiotoxicity (3% vs 8%, P&lt;0.0001) (Lancet 2019;393:2599-2612).</li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-phare\">PHARE</a> asked the same question in 3,384 French patients against a stricter margin of 1.15 and failed: the final 7.5-year analysis gave HR 1.08 (95% CI 0.93 to 1.25, P=0.39), the interval still crossing the margin, and concluded 12 months should remain standard (Lancet Oncol 2013;14:741-748; Lancet 2019;393:2591-2598).</span><span class=\"evidence-detail\">Seven-year overall survival was 80.6% versus 82.3% (HR 1.13, p=0.26).</span></li></ul>\n<p>The different conclusions reflect the prespecified non-inferiority margins. Shorter treatment carries a small excess hazard. PERSEPHONE&#x27;s prespecified exploratory subgroup analyses favoured 12 months after taxane-based chemotherapy (interaction P=0.011) and with concurrent rather than sequential trastuzumab (interaction P=0.001); timing was investigator-selected rather than randomised.</p>\n<p><a class=\"trial-link\" href=\"/evidence/#t-shorther\">ShortHER</a> tested nine weeks against one year in 1,253 Italian patients and did not meet non-inferiority (disease-free survival HR 1.13, 90% CI 0.89 to 1.42, against a margin of 1.29), on an accrual cut from 2,332 to 1,252 for funding reasons.</p>\n<p>Ten-year outcomes were close overall (disease-free survival 77% with one year versus 78% with nine weeks; overall survival 89% vs 88%), but nodal status was a stratification factor and the protocol-defined subgroups separate sharply: node-negative and one-to-three-node disease showed negligible differences numerically favouring the short course, whereas four or more positive nodes clearly favoured a year (10-year overall survival 84% vs 64%, HR 1.87) (Ann Oncol 2018;29:2328-2333; J Clin Oncol 2023;41:4976-4981).</p>\n<p>No interaction test is reported for any subgroup.</p>\n<h3 id=\"s-chemotherapy-partner\">Chemotherapy partner</h3>\n<p><a class=\"trial-link\" href=\"/evidence/#t-bcirg-006\">BCIRG 006</a> randomised 3,222 patients with node-positive or high-risk node-negative disease to AC followed by docetaxel, the same with trastuzumab, or non-anthracycline docetaxel with carboplatin and trastuzumab. Both trastuzumab arms beat chemotherapy alone (5-year disease-free survival 84% for AC-TH and 81% for TCH versus 75%; 5-year overall survival 92% and 91% versus 87%) with no significant efficacy difference between them (N Engl J Med 2011;365:1273-1283).</p>\n<p>The reported hazard ratios against AC-T are 0.64 for AC-TH and 0.75 for TCH on disease-free survival, and 0.63 and 0.77 on overall survival. The trial was not powered to compare the two trastuzumab-containing regimens, so the absence of a difference between them is exploratory rather than demonstrated equivalence.</p>\n<p>What separates them is toxicity: congestive heart failure and cardiac dysfunction were significantly higher with AC-TH than TCH (P&lt;0.001), acute leukaemia occurred in seven anthracycline-arm patients against one on TCH, and TCH caused less arthralgia, myalgia, hand-foot syndrome, stomatitis, vomiting and neutropenia.</p>\n<h3 id=\"s-dual-blockade\">Dual blockade</h3>\n<p><a class=\"trial-link\" href=\"/evidence/#t-aphinity\">APHINITY</a> added a year of pertuzumab or placebo to adjuvant chemotherapy and trastuzumab in 4,805 patients with node-positive or high-risk node-negative disease. Pertuzumab modestly improved invasive disease-free survival (8-year HR 0.77). Descriptive estimates favoured node-positive disease (HR 0.72) but not node-negative disease (HR 1.01), and the nodal interaction was not statistically significant. Overall survival remained immature and was not statistically significant (HR 0.83, 95% CI 0.68 to 1.02; P=.078).</p>\n<p>Grade 3 or worse diarrhoea occurred in about 10% versus 4% (N Engl J Med 2017;377:122-131; J Clin Oncol 2024;42:3643-3651). Adjuvant dual blockade is therefore for node-positive disease. A patient treated neoadjuvantly who was clinically node-positive at diagnosis continues pertuzumab post-operatively; one node-negative at diagnosis continues trastuzumab alone.</p>\n<h3 id=\"s-extended-adjuvant-therapy\">Extended adjuvant therapy</h3>\n<p><a class=\"trial-link\" href=\"/evidence/#t-extenet\">ExteNET</a> gave a year of neratinib 240 mg daily after completed trastuzumab-based therapy in 2,840 patients with stage 1–3 disease and improved 5-year invasive disease-free survival (90.2% vs 87.7%; HR 0.73, 95% CI 0.57 to 0.92) (Lancet Oncol 2016;17:367-377; Lancet Oncol 2017;18:1688-1700). Hormone-receptor-positive and within-one-year subgroup estimates were exploratory; interaction tests did not establish differential benefit (P=.063 and P=.406).</p>\n<p>Grade 3 diarrhoea occurred in 40% without mandated prophylaxis, and overall survival was not analysed at this cut.</p>\n<h3 id=\"s-small-node-negative-tumours\">Small node-negative tumours</h3>\n<p>Small node-negative HER2-positive tumours were largely excluded from the pivotal adjuvant trials, so their question is how little treatment suffices rather than how much. <a class=\"trial-link\" href=\"/evidence/#t-apt-adjuvant-paclitaxel-trastuzumab\">APT (Adjuvant Paclitaxel + Trastuzumab)</a> is a single-arm phase II study of 406 patients with tumours of 3 cm or less that were node-negative or had a single nodal micrometastasis, treated with weekly paclitaxel 80 mg/m² for 12 weeks with trastuzumab, then trastuzumab to complete a year.</p>\n<p>In practice the population was smaller than that ceiling: 91% of tumours were 2 cm or less and 98.5% were node-negative. At the final 10-year analysis, invasive disease-free survival was 91.3% (95% CI 88.3 to 94.4), overall survival 94.3% and breast-cancer-specific survival 98.8%, with grade 3 neuropathy in 3.2% and symptomatic heart failure in 0.5% (N Engl J Med 2015;372:134-141; Lancet Oncol 2023;24:273-285).</p>\n<p><a class=\"trial-link\" href=\"/evidence/#t-atempt\">ATEMPT</a> asked whether adjuvant T-DM1 could make stage I treatment less toxic. It randomised 512 patients 3:1 to 17 cycles of T-DM1 or to paclitaxel with trastuzumab, with co-primary endpoints of toxicity and invasive disease-free survival in the T-DM1 arm.</p>\n<p>The trial-specific clinically relevant toxicity composite included any grade 3 or worse nonhaematologic toxicity, grade 2 or worse neurotoxicity, grade 4 or worse haematologic toxicity, febrile neutropenia, a serious adverse event, or toxicity requiring a dose delay or discontinuation.</p>\n<p>The powered comparison found no lower composite with T-DM1 (46% vs 47%; P=0.83); dose delays and discontinuation contributed, and discontinuation was 17% versus 6%. Toxicity shifted toward less neuropathy and alopecia but more thrombocytopenia and transaminitis. Five-year invasive disease-free survival with T-DM1 was 97.0% (95% CI 95.2 to 98.7). Paclitaxel with trastuzumab remains standard, with T-DM1 an alternative selected by toxicity priorities (J Clin Oncol 2021;39:2375-2385; J Clin Oncol 2024;42:3652-3665).</p>\n<h3 id=\"s-residual-disease-after-neoadjuvant-therapy\">Residual disease after neoadjuvant therapy</h3>\n<p>Where neoadjuvant therapy has been given, adjuvant anti-HER2 therapy is directed by pathological response: continue trastuzumab with or without pertuzumab to complete a year after a pathological complete response, and escalate to T-DM1, or to T-DXd for high-risk residual disease, when invasive disease remains (KATHERINE; DESTINY-Breast05). That pathway is developed in the neoadjuvant chapter.</p>\n<h3 id=\"s-cardiac-monitoring\">Cardiac monitoring</h3>\n<p>Assess cardiac function before HER2-directed therapy and monitor it during treatment, with greater attention in patients with baseline cardiac disease or prior anthracycline exposure. Hold, resume or discontinue treatment according to the selected product&#x27;s current label, the magnitude and persistence of left-ventricular dysfunction, symptoms and cardiology assessment.<sup class=\"trial-ref\"><a href=\"#ref-breast-early-breast-cancer-ext-29bf1e5a1d73\" aria-label=\"Reference 1: NCI Breast Cancer Treatment PDQ - early disease\">1</a></sup></p>\n<h2 id=\"s-triple-negative-disease\">Triple-negative disease</h2>\n<p>Where neoadjuvant chemotherapy was not given, adjuvant chemotherapy is selected from tumour size, nodal status, grade, patient fitness and prior treatment. Anthracycline- and taxane-containing regimens are used for higher-risk disease; less intensive regimens may be appropriate for smaller node-negative tumours or where anthracycline toxicity outweighs benefit.<sup class=\"trial-ref\"><a href=\"#ref-breast-early-breast-cancer-ext-29bf1e5a1d73\" aria-label=\"Reference 1: NCI Breast Cancer Treatment PDQ - early disease\">1</a></sup></p>\n<p><a class=\"trial-link\" href=\"/evidence/#t-rjbc-1501\">RJBC-1501</a> tested adding carboplatin to adjuvant chemotherapy in 786 patients with resected early triple-negative disease, giving four cycles of epirubicin and cyclophosphamide then a taxane with or without carboplatin.</p>\n<p>Carboplatin improved disease-free survival (3-year 93.1% vs 89.8%; HR 0.66, 95% CI 0.44 to 0.97, P=0.034), distant disease-free survival (HR 0.61, P=0.040) and overall survival (HR 0.39, 95% CI 0.16 to 0.94, P=0.029) at 4.5 years, with more grade 3–4 haematological toxicity (any grade 3–4 event 49.9% vs 38.7%) (J Clin Oncol 2026;44:143-152).</p>\n<p>This is the adjuvant counterpart to the neoadjuvant platinum question, where the phase 3 test of adding carboplatin did not significantly improve its primary event-free-survival endpoint and the secondary overall-survival comparison was nominal and not significant. That trial cannot select platinum by menopausal status. A germline <em>BRCA1/2</em> variant changes the plan: a patient who has completed adjuvant chemotherapy and meets the trial-defined OlympiA criteria is a candidate for a year of adjuvant olaparib.</p>\n<p>Where neoadjuvant chemotherapy was given, pembrolizumab continues to complete the KEYNOTE-522 protocol regardless of response. CREATE-X supports capecitabine for residual HER2-negative disease in patients who had not received perioperative pembrolizumab, while OlympiA supports olaparib for eligible germline <em>BRCA1/2</em> carriers. Capecitabine after or with perioperative pembrolizumab, and overlap among pembrolizumab, capecitabine and olaparib, are not established; selection and sequencing require individual multidisciplinary assessment. These decisions are developed in the neoadjuvant chapter.</p>\n<h2 id=\"s-adjuvant-chemotherapy-the-backbone\">Adjuvant chemotherapy: the backbone</h2>\n<h3 id=\"s-what-chemotherapy-adds\">What chemotherapy adds</h3>\n<p>The <a class=\"trial-link\" href=\"/evidence/#t-ebctcg-meta-analysis\">EBCTCG meta-analysis</a> of 123 randomised trials sorted the regimens (Lancet 2012;379:432-444). Adding four cycles of a taxane to a fixed anthracycline backbone reduced breast cancer mortality (RR 0.86, 2p=0.0005), but not where the control arm received counterbalancing extra non-taxane cycles (RR 0.94, 2p=0.33).</p>\n<p>The <a class=\"trial-link\" href=\"/evidence/#t-ebctcg-15-year-overview\">EBCTCG 15-year overview</a> established that the proportional risk reductions from adjuvant systemic therapy persist to 15 years: about six months of anthracycline-based polychemotherapy reduced the annual breast cancer death rate by roughly 38% in women under 50 and 20% at ages 50 to 69, largely independent of ER and nodal status, and significantly more than CMF (Lancet 2005;365:1687-1717). Benefit was greatest in younger patients, ER-low and node-positive disease.</p>\n<p>Standard four cycles of AC did not show a breast-cancer-mortality difference from standard six cycles of CMF (RR 0.98, 95% CI 0.89 to 1.08, P=0.67); this exploratory comparison was not designed to establish equivalence or non-inferiority. Higher-cumulative-dose CAF or CEF regimens beat CMF (RR 0.78, 2p=0.0004) on a significant dose-response trend. Cardiac mortality rose with any anthracycline (RR 1.56, 2p=0.02).</p>\n<h3 id=\"s-anthracycline-and-taxane\">Anthracycline and taxane</h3>\n<p>The two taxane trials underlying the taxane conclusion above agree on recurrence and diverge on survival.</p>\n<p><a class=\"trial-link\" href=\"/evidence/#t-calgb-9344-int-0148\">CALGB 9344 (INT 0148)</a> added four cycles of paclitaxel after four cycles of AC in 3,121 node-positive patients and reduced recurrence by 17% (HR 0.83, P=.0023) and death by 18% (HR 0.82, P=.0064), with 5-year disease-free survival of 70% versus 65% and overall survival 80% versus 77%.</p>\n<p>The same factorial found no gain from escalating doxorubicin from 60 to 90 mg/m² and more long-term cardiotoxicity at the higher doses (J Clin Oncol 2003;21:976-983).</p>\n<p><a class=\"trial-link\" href=\"/evidence/#t-nsabp-b-28\">NSABP B-28</a> tested added paclitaxel in 3,060 node-positive patients with a better prognosis and improved disease-free survival (RR 0.83, P=.006; 5-year 76% vs 72%) without improving overall survival (5-year 85% in both arms) (J Clin Oncol 2005;23:3686-3696).</p>\n<p>In the prospectively selected 1,322-patient tissue cohort from CALGB 9344, HER2 status modified the recurrence effect of adding paclitaxel (interaction HR 0.59, nominal P=.01) (N Engl J Med 2007;357:1496-1506). The ER-stratified panels were exploratory, not a formal HER2-by-ER-by-treatment interaction, and do not establish that chemotherapy benefit is confined to endocrine-independent subtypes.</p>\n<h3 id=\"s-can-the-anthracycline-be-dropped\">Can the anthracycline be dropped?</h3>\n<p><a class=\"trial-link\" href=\"/evidence/#t-us-oncology-9735\">US Oncology 9735</a> compared TC×4 with AC×4 in 1,016 patients with stage I–III disease. At seven years, TC improved disease-free survival (81% vs 75%; HR 0.74, P=.033) and overall survival (87% vs 82%; HR 0.69, P=.032), without interaction by hormone-receptor or HER2 status. Febrile neutropenia was more frequent, G-CSF was not mandated, and cardiomyopathy was less frequent with TC (J Clin Oncol 2006;24:5381-5387; J Clin Oncol 2009;27:1177-1183).</p>\n<p>TC×4 is therefore reasonable for lower-risk disease or where an anthracycline is contraindicated. Six cycles of TC is a different question with a different answer. The <a class=\"trial-link\" href=\"/evidence/#t-abc-trials-usor-06-090-b-46-i-b-49\">ABC trials (USOR 06-090/B-46-I/B-49)</a> pooled three adjuvant trials (n=4,242, high-risk HER2-negative) testing TC×6 for non-inferiority against a taxane-plus-anthracycline regimen at a margin of 1.18.</p>\n<p>The futility boundary was crossed and the intention-to-treat analysis showed statistical inferiority of TC (invasive disease-free survival HR 1.23, 95% CI 1.01 to 1.50, P=.04; 4-year 88.2% vs 90.7%).</p>\n<p>At 6.9 years non-inferiority still could not be declared (HR 1.14, 95% CI 0.99 to 1.32) while overall survival did not differ (HR 1.05, P=.64), the anthracycline arm&#x27;s recurrence advantage offset by more leukaemia (7 vs 1) and non-breast-cancer deaths, and concentrated in hormone-receptor-negative disease (recurrence-free interval HR 1.90) (J Clin Oncol 2017;35:2647-2655; J Clin Oncol 2024;42:1344-1349).</p>\n<p>The 2023 EBCTCG overview of 15 trials comparing taxane plus anthracycline against TC×6 resolves the contradiction by separating the schedules.</p>\n<p>Anthracycline-containing regimens had lower recurrence overall (RR 0.86, 95% CI 0.79 to 0.93; P=0.0004), at a cost of roughly one acute myeloid leukaemia per 700 women treated.</p>\n<p>The advantage sat in concurrent schedules: concurrent TAC×6 beat TC×6 (10-year recurrence 12.3% vs 21%; breast cancer mortality 8.9% vs 13.2%, P=0.0034), whereas sequential AC then a taxane did not significantly reduce recurrence against TC×6 (10-year recurrence 14.4% vs 14.9%, RR 0.94, 95% CI 0.83 to 1.06, P=0.30). That null superiority comparison was not an equivalence or non-inferiority test.</p>\n<p>Sequential administration delivers a higher dose per cycle but a lower cumulative anthracycline and taxane dose.</p>\n<h3 id=\"s-schedule-and-taxane-choice\">Schedule and taxane choice</h3>\n<p><a class=\"trial-link\" href=\"/evidence/#t-calgb-9741\">CALGB 9741</a> tested dose density in a 2×2 factorial of 2,005 node-positive patients, varying interval (every 2 weeks with filgrastim versus every 3 weeks) and sequence (sequential doxorubicin, paclitaxel then cyclophosphamide versus concurrent AC then paclitaxel) at fixed doses.</p>\n<p>Dose-dense scheduling improved disease-free survival (RR 0.74, P=.010; 4-year 82% vs 75%) and overall survival (RR 0.69, P=.013), with no effect of sequence, and less grade 4 granulocytopenia (6% vs 33%) (J Clin Oncol 2003;21:1431-1439). That first report came at 36 months with 315 of 515 expected events, and the authors state that confidence in the survival benefit at longer follow-up remains to be firmly established.</p>\n<p>Primary G-CSF prophylaxis is mandatory on a dose-dense schedule. <a class=\"trial-link\" href=\"/evidence/#t-ecog-e1199\">ECOG E1199</a> tested taxane and schedule together in 4,950 patients after four cycles of AC.</p>\n<p>Both prespecified primary comparisons were null: taxane type HR 1.03 (P=.61) and schedule HR 1.06 (P=.33), with a significant taxane-by-schedule interaction (P=.003) that the authors say complicates interpretation. Against the shared every-3-week paclitaxel reference, weekly paclitaxel improved disease-free (HR 1.27, 98.3% CI 1.03 to 1.57, P=.006) and overall survival (1.32, P=.01), three-weekly docetaxel improved disease-free survival only (1.23, P=.02), and weekly docetaxel improved neither.</p>\n<p>Grade 2–4 neuropathy was 27% with weekly paclitaxel versus 20% (N Engl J Med 2008;358:1663-1671). No experimental arm was tested against another, so the two winners are not ranked. Both are acceptable and the choice is made on toxicity: three-weekly docetaxel causes more neutropenia, febrile neutropenia and infection, weekly paclitaxel more neuropathy, and weekly paclitaxel improved both disease-free and overall survival in the triple-negative subgroup.</p>\n<p>Adjuvant chemotherapy should begin once postoperative recovery permits; avoid avoidable delay while accounting for wound healing, infection and comorbidity.</p>\n<h3 id=\"s-intensified-chemotherapy-with-stem-cell-rescue\">Intensified chemotherapy with stem-cell rescue</h3>\n<p><a class=\"trial-link\" href=\"/evidence/#t-subito\">SUBITO</a> did not show a benefit from intensified alkylating chemotherapy with autologous stem-cell rescue in homologous-recombination-deficient, HER2-negative stage III disease.</p>\n<p>In 174 patients with stage III, HER2-negative, homologous-recombination-deficient disease, intensified alkylating chemotherapy with autologous stem-cell rescue gave the same 4-year overall survival as standard chemotherapy followed by a year of adjuvant olaparib (77.0% vs 76.4%; HR 1.11, 95% CI 0.57 to 2.17, p=0.37), with no difference in recurrence-free survival or pCR, at grade 3–4 thrombocytopenia of 99% versus 19% (Lancet Oncol 2026;27:795-807).</p>\n<p>This is a null superiority result in a trial powered for a hazard ratio of 0.353, not demonstrated equivalence, but the toxicity comparison is not close.</p>\n<h2 id=\"s-hr-positive-her2-negative-disease\">HR-positive, HER2-negative disease</h2>\n<h3 id=\"s-deciding-on-chemotherapy-genomic-assays\">Deciding on chemotherapy: genomic assays</h3>\n<p>Not every ER-positive tumour needs chemotherapy. Clinical risk and a validated genomic assay can identify patients whose expected absolute benefit is too small to justify treatment.</p>\n<p>Clinical calculators estimate prognosis and absolute treatment benefit but do not substitute for a molecular assay in a population where the assay has prospective evidence. Oncotype DX, MammaPrint and PAM50 use different platforms, populations and estimands; their thresholds are not interchangeable. <strong>Oncotype DX</strong> returns a recurrence score from 0 to 100.</p>\n<p><a class=\"trial-link\" href=\"/evidence/#t-paik-et-al-nsabp-b-20-validation\">Paik et al. (NSABP B-20 validation)</a> established the predictive claim retrospectively on 651 node-negative, ER-positive patients randomised to tamoxifen with or without chemotherapy: high-score tumours (≥31) derived large chemotherapy benefit (relative risk 0.26, 95% CI 0.13 to 0.53; absolute 10-year distant-recurrence reduction 27.6%), low-score tumours (&lt;18) derived minimal benefit (relative risk 1.31), and the interaction was significant (p=0.038) (J Clin Oncol 2006;24:3726-3734).</p>\n<p><a class=\"trial-link\" href=\"/evidence/#t-tailorx\">TAILORx</a> tested the midrange prospectively in 10,273 patients with HR-positive, HER2-negative, node-negative disease, randomising the 6,711 (69%) with a score of 11 to 25 to endocrine therapy alone or chemoendocrine therapy.</p>\n<p>Endocrine therapy alone was non-inferior for invasive disease-free survival (HR 1.08, 95% CI 0.94 to 1.24, P=0.26; 9-year 83.3% vs 84.3%).</p>\n<p>A prespecified age interaction (P=0.004) showed residual chemotherapy benefit in women aged 50 or under with a score of 16 to 25, freedom from distant recurrence higher by up to 6.5 percentage points at 9 years in the 21–25 band, without a demonstrated survival difference (N Engl J Med 2018;379:111-121).</p>\n<p><a class=\"trial-link\" href=\"/evidence/#t-rxponder-swog-s1007\">RxPONDER (SWOG S1007)</a> extended the assay to 5,018 patients with one to three positive nodes and a score of 25 or below. The score-by-treatment interaction was not significant (P=0.35), so the score stayed prognostic but stopped predicting relative chemotherapy benefit, while a prespecified menopausal-status interaction was significant (P=0.008) and became the governing variable.</p>\n<p>Postmenopausal women (66.8%) derived no chemotherapy benefit (HR 1.02, 95% CI 0.82 to 1.26, P=0.89); premenopausal women derived a clear one (invasive disease-free survival HR 0.60, 0.43 to 0.83, P=0.002; distant relapse-free HR 0.58, P=0.009), even at low scores (N Engl J Med 2021;385:2336-2347).</p>\n<p>Whether that premenopausal signal is direct cytotoxic benefit or indirect ovarian suppression is unresolved, and it matters because the alternative to chemotherapy in a young woman is ovarian suppression, not nothing. The resulting decision rules:</p>\n<div class=\"tblwrap\" role=\"region\" aria-label=\"Scrollable table\" tabindex=\"0\"><table><thead><tr><th scope=\"col\"></th><th scope=\"col\">Node-negative</th><th scope=\"col\">One to three positive nodes</th></tr></thead><tbody><tr><td>Score ≥26
