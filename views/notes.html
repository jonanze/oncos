17R</a>. <a href=\"https://drive.google.com/file/d/1dH-074WQYntIeWdI3cXwn2Eyyl4y08Mg/preview\">N Engl J Med 2016;375:209-19</a></li>\n<li id=\"ref-breast-early-breast-cancer-t-nsabp-b-42\"><a class=\"trial-link\" href=\"/evidence/#t-nsabp-b-42\">NSABP B-42</a>. <a href=\"https://drive.google.com/file/d/1IZW1Ja7EACGajT6VBuGpz-ElKnCUC-MG/preview\">Lancet Oncol 2019;20:88-99</a>; <a href=\"https://drive.google.com/file/d/1osNaWQR6mFGkQkzpaIpxsfySXBy4Cx9S/preview\">J Natl Cancer Inst 2023;115:1302-1309</a></li>\n<li id=\"ref-breast-early-breast-cancer-t-lidera-bc\"><a class=\"trial-link\" href=\"/evidence/#t-lidera-bc\">lidERA (BC)</a>. <a href=\"https://drive.google.com/file/d/1eilC1jHAb0ugnhs57xoWVoOOikR6_iYj/preview\">J Clin Oncol 2026;44(suppl):502 (ASCO 2026 abstract)</a></li>\n<li id=\"ref-breast-early-breast-cancer-t-positive\"><a class=\"trial-link\" href=\"/evidence/#t-positive\">POSITIVE</a>. <a href=\"https://drive.google.com/file/d/155tLZU1Ci5NzcLE0xER07xpUsvyDJbe5/preview\">N Engl J Med 2023;388:1645-1656</a></li>\n<li id=\"ref-breast-early-breast-cancer-t-monarche\"><a class=\"trial-link\" href=\"/evidence/#t-monarche\">monarchE</a>. <a href=\"https://drive.google.com/file/d/1j7woJJz2c5-cHY8SFBKS41bdgt4jwHZF/preview\">J Clin Oncol 2020;38:3987-3998</a>; <a href=\"https://drive.google.com/file/d/1sUk8AMHKqk7MniTzrFOG1WevE6ik6nFS/preview\">Lancet Oncol 2023;24:77-90</a>; <a href=\"https://drive.google.com/file/d/1APn--RWKNvjjD9DGL86kjr0lHwB7rv6O/preview\">Ann Oncol 2026;37:155-165</a></li>\n<li id=\"ref-breast-early-breast-cancer-t-natalee\"><a class=\"trial-link\" href=\"/evidence/#t-natalee\">NATALEE</a>. <a href=\"https://drive.google.com/file/d/1JZXMxpSHYgj9kj1RVuCTasYY7iC9L-Pb/preview\">N Engl J Med 2024;390:1080-1091</a>; <a href=\"https://drive.google.com/file/d/1oem4hm_gcISI2Iu3LPQ4tESY5IBiXM0S/preview\">ESMO Open 2025;10:105858</a></li>\n<li id=\"ref-breast-early-breast-cancer-t-pallas\"><a class=\"trial-link\" href=\"/evidence/#t-pallas\">PALLAS</a>. <a href=\"https://drive.google.com/file/d/1y7qIi_cLABwERoizBRNBTO8W21y9XLKT/preview\">Lancet Oncol 2021;22:212-222</a></li>\n<li id=\"ref-breast-early-breast-cancer-t-penelope-b\"><a class=\"trial-link\" href=\"/evidence/#t-penelope-b\">PENELOPE-B</a>. <a href=\"https://drive.google.com/file/d/1ARNWNJ_ST_56O7shH377KVukgn_jCl6P/preview\">J Clin Oncol 2021;39:1518-1530</a></li>\n<li id=\"ref-breast-early-breast-cancer-t-olympia\"><a class=\"trial-link\" href=\"/evidence/#t-olympia\">OlympiA</a>. <a href=\"https://drive.google.com/file/d/1vchaLZDGyxUe6socMeIvd4CXtBY6nr8K/preview\">N Engl J Med 2021;384:2394-2405</a>; <a href=\"https://drive.google.com/file/d/10GahBZ3WjYp1WbnLkbHlPRaBk-tigfTF/preview\">Ann Oncol 2022;33:1250-1268</a></li>\n<li id=\"ref-breast-early-breast-cancer-t-ebctcg-adjuvant-bisphosphonate-meta-analysis\"><a class=\"trial-link\" href=\"/evidence/#t-ebctcg-adjuvant-bisphosphonate-meta-analysis\">EBCTCG adjuvant bisphosphonate meta-analysis</a>. <a href=\"https://drive.google.com/file/d/1E88pHFcXhsPFIQHDwEwImoJNRg5hXFnZ/preview\">Lancet 2015;386:1353-1361</a></li>\n</ol>", "_hay": "early breast cancer early-breast-cancer breast scope and treatment framework breast surgery breast conservation versus mastectomy margins and contraindications axillary management sentinel node biopsy a positive sentinel node radiotherapy after breast-conserving surgery omitting radiotherapy in older, low-risk disease post-mastectomy radiotherapy fractionation and treatment volume sequencing with systemic therapy her2-positive disease the trastuzumab backbone duration chemotherapy partner dual blockade extended adjuvant therapy small node-negative tumours residual disease after neoadjuvant therapy cardiac monitoring triple-negative disease adjuvant chemotherapy: the backbone what chemotherapy adds anthracycline and taxane can the anthracycline be dropped? schedule and taxane choice intensified chemotherapy with stem-cell rescue hr-positive, her2-negative disease deciding on chemotherapy: genomic assays the endocrine foundation premenopausal disease and ovarian suppression duration and extended therapy oral serds pregnancy after diagnosis cdk4/6 inhibitors olaparib for germline brca-mutated disease bone-modifying agents older and less fit patients follow-up references"}, {"id": "breast-metastatic-breast-cancer", "slug": "metastatic-breast-cancer", "group": "Breast", "title": "Metastatic breast cancer", "updated": "", "sections": [{"id": "s-work-up-at-the-point-of-metastatic-diagnosis", "h": "Work-up at the point of metastatic diagnosis", "depth": 2}, {"id": "s-endocrine-therapy-or-chemotherapy-first", "h": "Endocrine therapy or chemotherapy first", "depth": 3}, {"id": "s-hormone-receptor-positive-her2-negative-disease", "h": "Hormone receptor-positive, HER2-negative disease", "depth": 2}, {"id": "s-first-line-endocrine-therapy-with-a-cdk4-6-inhibitor", "h": "First-line endocrine therapy with a CDK4/6 inhibitor", "depth": 3}, {"id": "s-choosing-between-the-three-inhibitors", "h": "Choosing between the three inhibitors", "depth": 3}, {"id": "s-premenopausal-patients", "h": "Premenopausal patients", "depth": 3}, {"id": "s-aggressive-disease-without-visceral-crisis", "h": "Aggressive disease without visceral crisis", "depth": 3}, {"id": "s-first-line-when-the-disease-is-already-endocrine-resistant", "h": "First line when the disease is already endocrine-resistant", "depth": 3}, {"id": "s-deferring-the-cdk4-6-inhibitor", "h": "Deferring the CDK4/6 inhibitor", "depth": 3}, {"id": "s-endocrine-monotherapy-and-the-first-line-alternatives", "h": "Endocrine monotherapy and the first-line alternatives", "depth": 3}, {"id": "s-second-line-reading-the-first-line-regimen", "h": "Second line: reading the first-line regimen", "depth": 3}, {"id": "s-esr1-mutant-disease-and-the-oral-serds", "h": "ESR1-mutant disease and the oral SERDs", "depth": 3}, {"id": "s-switching-on-molecular-progression", "h": "Switching on molecular progression", "depth": 3}, {"id": "s-pi3k-akt-mtor-altered-disease", "h": "PI3K–AKT–mTOR-altered disease", "depth": 3}, {"id": "s-continuing-cdk4-6-inhibition-beyond-progression", "h": "Continuing CDK4/6 inhibition beyond progression", "depth": 3}, {"id": "s-her2-low-and-her2-ultralow-expression", "h": "HER2-low and HER2-ultralow expression", "depth": 3}, {"id": "s-trop2-antibody-drug-conjugates", "h": "TROP2 antibody–drug conjugates", "depth": 3}, {"id": "s-germline-brca-mutated-disease", "h": "Germline BRCA-mutated disease", "depth": 3}, {"id": "s-her2-positive-disease", "h": "HER2-positive disease", "depth": 2}, {"id": "s-first-line", "h": "First line", "depth": 3}, {"id": "s-maintenance-intensification-and-hormone-receptor-positive-overlap", "h": "Maintenance intensification and hormone receptor-positive overlap", "depth": 3}, {"id": "s-second-line", "h": "Second line", "depth": 3}, {"id": "s-third-line-and-beyond", "h": "Third line and beyond", "depth": 3}, {"id": "s-brain-metastases", "h": "Brain metastases", "depth": 3}, {"id": "s-triple-negative-disease", "h": "Triple-negative disease", "depth": 2}, {"id": "s-first-line-at-pd-l1-combined-positive-score-of-10-or-more", "h": "First line at PD-L1 combined positive score of 10 or more", "depth": 3}, {"id": "s-first-line-when-immunotherapy-is-not-an-option", "h": "First line when immunotherapy is not an option", "depth": 3}, {"id": "s-germline-brca-mutated-disease-and-platinum", "h": "Germline BRCA-mutated disease and platinum", "depth": 3}, {"id": "s-pretreated-disease", "h": "Pretreated disease", "depth": 3}, {"id": "s-cytotoxic-chemotherapy", "h": "Cytotoxic chemotherapy", "depth": 2}, {"id": "s-special-situations", "h": "Special situations", "depth": 2}, {"id": "s-references", "h": "References", "depth": 2}], "html": "<h2 id=\"s-work-up-at-the-point-of-metastatic-diagnosis\">Work-up at the point of metastatic diagnosis</h2>\n<p>When feasible, safe and clinically useful, biopsy an accessible metastatic site to confirm the diagnosis and reassess ER, PR and HER2 rather than assuming that the primary tumour&#x27;s profile is unchanged. If biopsy is unsafe, non-diagnostic or would not alter an urgent decision, proceed from the strongest available clinical, imaging and prior-pathology evidence and revisit tissue or liquid testing when it can change management.<sup class=\"trial-ref\"><a href=\"#ref-breast-metastatic-breast-cancer-ext-6710f1ab7ffb\" aria-label=\"Reference 1: Pan-Asian adapted ESMO metastatic breast cancer guideline\">1</a></sup></p>\n<p>Discordance between the primary tumour and a metastatic site can change the treatment pathway, including reassignment of hormone-receptor or HER2 status. A single historical assay should therefore not be treated as permanently dispositive when a safe, clinically useful reassessment is possible.</p>\n<p>Molecular testing is directed by receptor subtype and treatment history. In HR-positive, HER2-negative disease, test for alterations that select an accepted endocrine or targeted option, including <em>PIK3CA</em>, <em>ESR1</em> and the wider AKT pathway when relevant. In triple-negative disease, test PD-L1 with the assay and cutoff linked to the intended checkpoint inhibitor, and establish germline <em>BRCA1/2</em> status when it can alter treatment. Tissue and circulating tumour DNA are complementary when either alone is inadequate.<sup class=\"trial-ref\"><a href=\"#ref-breast-metastatic-breast-cancer-ext-6710f1ab7ffb\" aria-label=\"Reference 1: Pan-Asian adapted ESMO metastatic breast cancer guideline\">1</a></sup></p>\n<h3 id=\"s-endocrine-therapy-or-chemotherapy-first\">Endocrine therapy or chemotherapy first</h3>\n<p>In hormone receptor-positive disease, endocrine-based therapy is preferred unless rapid tumour shrinkage is required because of immediately threatening organ dysfunction. Chemotherapy can produce a faster response but at greater toxicity and should not replace endocrine treatment merely because visceral metastases are present.</p>\n<p>Visceral crisis means severe organ dysfunction judged on signs, symptoms and laboratory studies together with rapid progression, not simply the presence of visceral metastases: the compromise must be severe enough that a slower-acting therapy would leave no opportunity for a second option at progression. Prior adjuvant endocrine therapy determines whether the disease is treated as endocrine-sensitive or endocrine-resistant.</p>\n<ul><li>Endocrine-sensitive disease includes de novo metastatic disease and relapse well after completion of adjuvant endocrine therapy.</li><li>Endocrine-resistant disease includes relapse during or soon after adjuvant endocrine therapy, or progression on endocrine treatment for metastatic disease.</li></ul>\n<p>These definitions organise trial eligibility and sequencing but do not replace clinical judgement about pace, symptoms, organ function and prior exposure.<sup class=\"trial-ref\"><a href=\"#ref-breast-metastatic-breast-cancer-ext-6710f1ab7ffb\" aria-label=\"Reference 1: Pan-Asian adapted ESMO metastatic breast cancer guideline\">1</a></sup></p>\n<h2 id=\"s-hormone-receptor-positive-her2-negative-disease\">Hormone receptor-positive, HER2-negative disease</h2>\n<p>The organising principle is endocrine dependence: suppress oestrogen-receptor signalling first, then add or substitute other mechanisms as resistance emerges. HER2-low expression overlaps this subtype rather than replacing it, and becomes an additional conjugate target later in the sequence.</p>\n<h3 id=\"s-first-line-endocrine-therapy-with-a-cdk4-6-inhibitor\">First-line endocrine therapy with a CDK4/6 inhibitor</h3>\n<p>An aromatase inhibitor with a CDK4/6 inhibitor is the first-line standard, with ovarian function suppression added for premenopausal patients. CDK4/6 phosphorylates and inactivates Rb to permit the G1-to-S transition; inhibiting it produces cell-cycle arrest. Four placebo-controlled phase 3 trials established the class in the first line, each extending median progression-free survival by between 9 and 13.5 months.</p>\n<ul><li class=\"evidence-prose\"><a class=\"trial-link\" href=\"/evidence/#t-paloma-2\">PALOMA-2</a>: palbociclib plus letrozole improved progression-free survival (24.8 vs 14.5 months, HR 0.58, 95% CI 0.46 to 0.72) but did not prolong overall survival at a mature 90-month follow-up (53.9 vs 51.2 months, HR 0.96, 95% CI 0.78 to 1.18), a result the investigators qualify for a between-arm imbalance in survival follow-up (N Engl J Med 2016;375:1925-1936; J Clin Oncol 2024;42:994-1000).</li><li class=\"evidence-prose\"><a class=\"trial-link\" href=\"/evidence/#t-monaleesa-2\">MONALEESA-2</a>: ribociclib plus letrozole improved final overall survival over placebo plus letrozole (63.9 vs 51.4 months; HR 0.76) (N Engl J Med 2016;375:1738-1748; N Engl J Med 2022;386:942-950).</li><li class=\"evidence-prose\"><a class=\"trial-link\" href=\"/evidence/#t-monaleesa-7\">MONALEESA-7</a>: in premenopausal and perimenopausal women given goserelin with tamoxifen or an aromatase inhibitor, ribociclib improved progression-free survival (23.8 vs 13.0 months, HR 0.55) and overall survival (not reached vs 40.9 months, HR 0.71) (Lancet Oncol 2018;19:904-915; N Engl J Med 2019;381:307-316).</li><li class=\"evidence-prose\"><a class=\"trial-link\" href=\"/evidence/#t-monarch-3\">MONARCH 3</a>: abemaciclib plus a non-steroidal aromatase inhibitor improved progression-free survival (28.2 vs 14.8 months, HR 0.54), with final overall survival numerically longer but not significant (66.8 vs 53.7 months, HR 0.80) (J Clin Oncol 2017;35:3638-3646; Ann Oncol 2024;35:718-727).</li></ul>\n<div class=\"tblwrap\" role=\"region\" aria-label=\"Scrollable table\" tabindex=\"0\"><table><thead><tr><th scope=\"col\"></th><th scope=\"col\">PALOMA-2</th><th scope=\"col\">MONARCH 3</th><th scope=\"col\">MONALEESA-2</th><th scope=\"col\">MONALEESA-7</th></tr></thead><tbody><tr><td>Drug</td><td>Palbociclib</td><td>Abemaciclib</td><td>Ribociclib</td><td>Ribociclib</td></tr><tr><td>N</td><td>666</td><td>493</td><td>668</td><td>672</td></tr><tr><td>Population</td><td>Postmenopausal, treatment-naive for advanced disease</td><td>Postmenopausal, treatment-naive for advanced disease</td><td>Postmenopausal, treatment-naive for advanced disease</td><td>Pre/perimenopausal, up to 1 prior chemotherapy line, no prior endocrine therapy for advanced disease</td></tr><tr><td>Partner</td><td>Letrozole</td><td>Anastrozole or letrozole</td><td>Letrozole</td><td>Tamoxifen or an aromatase inhibitor, plus goserelin</td></tr><tr><td>Early-relapsing endocrine-resistant disease allowed</td><td>No</td><td>No</td><td>No</td><td>Yes</td></tr><tr><td>Objective response</td><td>42.1% vs 34.7%</td><td>49.7% vs 37%</td><td>43% vs 29%</td><td>41% vs 30%</td></tr></tbody></table></div>\n<p>All four excluded visceral crisis, and all but PALOMA-2 excluded CNS metastases and inflammatory breast cancer.</p>\n<h3 id=\"s-choosing-between-the-three-inhibitors\">Choosing between the three inhibitors</h3>\n<p>There is no head-to-head randomised comparison, and the differing survival results are a cross-trial discordance rather than a ranking: follow-up, power, population and drug biology cannot be separated. Ribociclib carries the strongest survival evidence, positive in both MONALEESA-2 and MONALEESA-7; palbociclib has shown none, but is the least demanding to monitor, without the diarrhoea of abemaciclib or the QTc prolongation of ribociclib. The practical differences are toxicity and monitoring rather than efficacy.</p>\n<div class=\"tblwrap\" role=\"region\" aria-label=\"Scrollable table\" tabindex=\"0\"><table><thead><tr><th scope=\"col\"></th><th scope=\"col\">Palbociclib</th><th scope=\"col\">Ribociclib</th><th scope=\"col\">Abemaciclib</th></tr></thead><tbody><tr><td>Schedule</td><td>125 mg daily, 3 weeks on, 1 week off</td><td>600 mg daily, 3 weeks on, 1 week off</td><td>150 mg twice daily, continuous</td></tr><tr><td>Grade 3–4 neutropenia</td><td>66.5%</td><td>62%</td><td>23.8%</td></tr><tr><td>Diarrhoea (any grade)</td><td>26.1%</td><td>38.3%</td><td>82.3%</td></tr><tr><td>Transaminitis</td><td>Not reported</td><td>AST/ALT 20.1%</td><td>AST 16.8%, ALT 17.4%</td></tr><tr><td>QTc prolongation</td><td>Not reported</td><td>3% vs 0.3%</td><td>Not reported</td></tr></tbody></table></div>\n<h3 id=\"s-premenopausal-patients\">Premenopausal patients</h3>\n<p>Premenopausal patients receiving endocrine therapy require ovarian function suppression or ablation. The endocrine partner and any targeted agent are then selected using the same disease biology, prior treatment and resistance framework used after natural menopause.<sup class=\"trial-ref\"><a href=\"#ref-breast-metastatic-breast-cancer-ext-6710f1ab7ffb\" aria-label=\"Reference 1: Pan-Asian adapted ESMO metastatic breast cancer guideline\">1</a></sup></p>\n<p>Premenopausal patients receiving a GnRH agonist were eligible in <a class=\"trial-link\" href=\"/evidence/#t-paloma-3\">PALOMA-3</a>, supporting the fulvestrant–palbociclib combination in that population.</p>\n<p><a class=\"trial-link\" href=\"/evidence/#t-monarch-2\">MONARCH 2</a> also included premenopausal patients receiving a GnRH agonist, supporting the fulvestrant–abemaciclib combination.</p>\n<h3 id=\"s-aggressive-disease-without-visceral-crisis\">Aggressive disease without visceral crisis</h3>\n<p><a class=\"trial-link\" href=\"/evidence/#t-right-choice\">RIGHT Choice</a> is the only randomised comparison of a CDK4/6 inhibitor plus endocrine therapy against combination chemotherapy. It enrolled 222 premenopausal and perimenopausal women with clinically aggressive disease, defined by symptomatic visceral metastases or rapid progression.</p>\n<p>First-line ribociclib plus an aromatase inhibitor and goserelin improved progression-free survival over investigator&#x27;s-choice combination chemotherapy (21.8 vs 12.8 months, HR 0.61, 95% CI 0.43 to 0.87, P=.003), with far fewer treatment-related discontinuations (6.3% vs 27.0%) and immature overall survival (HR 0.92; J Clin Oncol 2024;42:2812-2821). Response rates were similar (66% vs 62%) and so was time to response (4.9 vs 3.2 months).</p>\n<p>It is phase 2, and the only randomised evidence on this choice short of visceral crisis.</p>\n<h3 id=\"s-first-line-when-the-disease-is-already-endocrine-resistant\">First line when the disease is already endocrine-resistant</h3>\n<p>For a patient progressing during or within 12 months of adjuvant endocrine therapy whose tumour carries a <em>PIK3CA</em> mutation, <a class=\"trial-link\" href=\"/evidence/#t-inavo120\">INAVO120</a> tested a first-line triplet.</p>\n<p>Inavolisib added to palbociclib and fulvestrant doubled progression-free survival (15.0 vs 7.3 months, HR 0.43) and improved overall survival (34.0 vs 27.0 months, HR 0.67), the first confirmed survival benefit for a PI3K-pathway inhibitor in this disease (N Engl J Med 2024;391:1584-1596; N Engl J Med 2025;393:151-161). Objective response was 63% versus 28%.</p>\n<p>Where the tumour is <em>PIK3CA</em> wild-type, first-line treatment for endocrine-resistant disease is fulvestrant with a CDK4/6 inhibitor, with ovarian suppression if premenopausal.</p>\n<h3 id=\"s-deferring-the-cdk4-6-inhibitor\">Deferring the CDK4/6 inhibitor</h3>\n<p><a class=\"trial-link\" href=\"/evidence/#t-sonia\">SONIA</a> randomised the timing of the class rather than the drug: both arms received the same aromatase-inhibitor-then-fulvestrant sequence, and only the position of the CDK4/6 inhibitor differed. At the primary report, first-line use did not establish superiority for second progression-free survival (31.0 vs 26.8 months; HR 0.87, 95% CI 0.74 to 1.03).</p>\n<p>Updated second progression-free survival modestly favoured first-line use (HR 0.82), but final overall survival did not (47.9 vs 48.1 months; HR 0.91), while first-line treatment caused more toxicity, exposure and cost (Nature 2024;636:474-480; JAMA Oncol 2026;12:375-383). The post hoc premenopausal overall-survival result is hypothesis-generating.</p>\n<p>SONIA weakens the assumption that every eligible patient must receive a CDK4/6 inhibitor immediately, but it does not settle sequencing for the whole class: both arms eventually expose the patient to the drug, and the design was palbociclib-dominant. Its second-line comparator was fulvestrant monotherapy, which is no longer what most patients receive at that point.</p>\n<p>Deferral is reasonable in selected patients: endocrine-sensitive disease relapsing more than 12 months after adjuvant therapy, or a patient wanting to avoid the toxicity, the cost, or the interruption radiotherapy to a symptomatic site would require.</p>\n<h3 id=\"s-endocrine-monotherapy-and-the-first-line-alternatives\">Endocrine monotherapy and the first-line alternatives</h3>\n<p>In <a class=\"trial-link\" href=\"/evidence/#t-falcon\">FALCON</a>, fulvestrant prolonged progression-free survival over anastrozole in endocrine-therapy-naive advanced disease (16.6 vs 13.8 months; HR 0.80) (Lancet 2016;388:2997-3005). The larger estimate in non-visceral disease was exploratory and no interaction test was reported. In current practice, endocrine monotherapy is mainly reserved for selected patients in whom combination therapy is unsuitable or deliberately deferred.</p>\n<h3 id=\"s-second-line-reading-the-first-line-regimen\">Second line: reading the first-line regimen</h3>\n<p>Three questions settle the second-line decision: was a CDK4/6 inhibitor given, is there an <em>ESR1</em> mutation, and is there a <em>PIK3CA</em> or wider AKT-pathway alteration.</p>\n<p>Fulvestrant is given at 500 mg intramuscularly as two 5-mL injections, one in each buttock, on days 1, 15 and 29 and then once monthly.<sup class=\"trial-ref\"><a href=\"#ref-breast-metastatic-breast-cancer-ext-b2c4bfc80920\" aria-label=\"Reference 12: DailyMed fulvestrant prescribing information\">12</a></sup></p>\n<p>In the double-blind phase III CONFIRM trial, 736 postmenopausal women with ER-positive locally advanced or metastatic disease progressing after prior endocrine therapy were randomised to this 500-mg regimen or 250 mg every 28 days. The 500-mg regimen improved progression-free survival (HR 0.80, 95% CI 0.68 to 0.94, P=.006) without increased toxicity.<sup class=\"trial-ref\"><a href=\"#ref-breast-metastatic-breast-cancer-ext-a0b32f98d5fc\" aria-label=\"Reference 13: CONFIRM primary analysis\">13</a></sup></p>\n<p>At final follow-up, median overall survival was 26.4 versus 22.3 months (HR 0.81, 95% CI 0.69 to 0.96, nominal P=.02), with no clinically important difference in serious-adverse-event profiles.<sup class=\"trial-ref\"><a href=\"#ref-breast-metastatic-breast-cancer-ext-0a4435581d33\" aria-label=\"Reference 14: CONFIRM final overall survival\">14</a></sup></p>\n<div class=\"tblwrap\" role=\"region\" aria-label=\"Scrollable table\" tabindex=\"0\"><table><thead><tr><th scope=\"col\">Finding</th><th scope=\"col\">Option</th><th scope=\"col\">Trial</th><th scope=\"col\">Evidence</th></tr></thead><tbody><tr><td>No prior CDK4/6 inhibitor</td><td>Fulvestrant plus a CDK4/6 inhibitor</td><td>PALOMA-3, MONARCH 2, <a class=\"trial-link\" href=\"/evidence/#t-monaleesa-3\">MONALEESA-3</a></td><td>Progression-free survival across the class; survival with ribociclib and abemaciclib</td></tr><tr><td><em>ESR1</em> mutation</td><td>Elacestrant, imlunestrant or vepdegestrant</td><td><a class=\"trial-link\" href=\"/evidence/#t-emerald\">EMERALD</a>, <a class=\"trial-link\" href=\"/evidence/#t-ember-3\">EMBER-3</a>, <a class=\"trial-link\" href=\"/evidence/#t-veritac-2-vepdegestrant\">VERITAC-2 (vepdegestrant)</a></td><td>Progression-free survival; survival immature</td></tr><tr><td><em>PIK3CA</em> mutation</td><td>Alpelisib plus fulvestrant</td><td><a class=\"trial-link\" href=\"/evidence/#t-solar-1\">SOLAR-1</a></td><td>Progression-free survival; no significant survival gain</td></tr><tr><td><em>PIK3CA</em>, <em>AKT1</em> or <em>PTEN</em> alteration</td><td>Capivasertib plus fulvestrant</td><td><a class=\"trial-link\" href=\"/evidence/#t-capitello-291\">CAPItello-291</a></td><td>Progression-free survival; no significant survival gain</td></tr><tr><td><em>PIK3CA</em> wild-type after CDK4/6 inhibition</td><td>Gedatolisib plus fulvestrant, with or without palbociclib</td><td><a class=\"trial-link\" href=\"/evidence/#t-viktoria-1\">VIKTORIA-1</a></td><td>Progression-free survival only</td></tr><tr><td>Prior CDK4/6 inhibitor, no actionable alteration</td><td>Switch endocrine partner and continue CDK4/6 blockade</td><td><a class=\"trial-link\" href=\"/evidence/#t-postmonarch\">postMONARCH</a>, <a class=\"trial-link\" href=\"/evidence/#t-maintain-kalinsky\">MAINTAIN (Kalinsky)</a></td><td>Progression-free survival</td></tr><tr><td>Prior CDK4/6 inhibitor, no actionable alteration</td><td>Everolimus plus exemestane</td><td><a class=\"trial-link\" href=\"/evidence/#t-bolero-2\">BOLERO-2</a></td><td>Progression-free survival, in a population that had not received a CDK4/6 inhibitor</td></tr><tr><td>HER2-low, chemotherapy-pretreated</td><td>Trastuzumab deruxtecan</td><td><a class=\"trial-link\" href=\"/evidence/#t-destiny-breast04\">DESTINY-Breast04</a></td><td>Progression-free and overall survival</td></tr><tr><td>HER2-low or ultralow, chemotherapy-naive</td><td>Trastuzumab deruxtecan</td><td><a class=\"trial-link\" href=\"/evidence/#t-destiny-breast06\">DESTINY-Breast06</a></td><td>Progression-free survival only, survival immature; the ultralow cohort exploratory</td></tr><tr><td>Germline <em>BRCA1/2</em></td><td>Olaparib or talazoparib</td><td><a class=\"trial-link\" href=\"/evidence/#t-olympiad\">OlympiAD</a>, <a class=\"trial-link\" href=\"/evidence/#t-embraca\">EMBRACA</a></td><td>Progression-free survival</td></tr></tbody></table></div>\n<p>For a patient with primary endocrine resistance who is <em>PIK3CA</em> and <em>ESR1</em> wild-type, second-line endocrine therapy may have less to offer, and chemotherapy or an antibody–drug conjugate is a reasonable alternative. VIKTORIA-1 is the qualification, having tested an endocrine-partnered regimen in prospectively <em>PIK3CA</em> wild-type disease after a CDK4/6 inhibitor. Where a CDK4/6 inhibitor was not given first line, adding one to fulvestrant improves progression-free survival across the class.</p>\n<ul><li class=\"evidence-prose\">PALOMA-3: palbociclib plus fulvestrant improved progression-free survival after progression on prior endocrine therapy (9.2 vs 3.8 months, HR 0.42, 95% CI 0.32 to 0.56, P&lt;0.001); prespecified overall survival was numerically longer but not significant (34.9 vs 28.0 months, HR 0.81, 95% CI 0.64 to 1.03, P=0.09), reaching significance in the endocrine-sensitive subgroup (HR 0.72) (N Engl J Med 2015;373:209-219; N Engl J Med 2018;379:1926-1936).</li><li class=\"evidence-prose\">MONARCH 2: abemaciclib plus fulvestrant improved progression-free survival (16.4 vs 9.3 months; HR 0.553) and final overall survival (45.8 vs 37.3 months; HR 0.784) in endocrine-resistant disease (J Clin Oncol 2017;35:2875-2884; JCO Oncol Adv 2025;2:e2500052).</li><li class=\"evidence-prose\">MONALEESA-3: ribociclib plus fulvestrant improved progression-free survival (20.5 vs 12.8 months; HR 0.59) and overall survival (median not reached vs 40.0 months; HR 0.72) (J Clin Oncol 2018;36:2465-2472; N Engl J Med 2020;382:514-524).</li></ul>\n<h3 id=\"s-esr1-mutant-disease-and-the-oral-serds\">ESR1-mutant disease and the oral SERDs</h3>\n<p><em>ESR1</em> mutations, chiefly D538G, Y537S and Y537N, develop in around 40% of patients with HR-positive metastatic disease at progression. Testing turns the mutation into a treatment variable rather than a retrospective explanation for resistance.</p>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\">EMERALD: elacestrant improved progression-free survival over standard endocrine monotherapy in <em>ESR1</em>-mutant disease (3.8 vs 1.9 months; HR 0.55).</span><span class=\"evidence-detail\">Interim overall survival in the overall population was not statistically significant (HR 0.75, 95% CI 0.54 to 1.04) (J Clin Oncol 2022;40:3246-3256).</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">EMBER-3: imlunestrant beat standard endocrine therapy in the <em>ESR1</em>-mutant subgroup (5.5 vs 3.8 months; restricted mean survival time difference 2.6 months, with no hazard ratio reported because the hazards were non-proportional) but not in the intention-to-treat population (HR 0.87, not significant).</span><span class=\"evidence-detail\">Adding abemaciclib to imlunestrant improved progression-free survival regardless of <em>ESR1</em> status (9.4 vs 5.5 months, HR 0.57) (N Engl J Med 2025;392:1189-1202).</span></li><li class=\"evidence-prose\">VERITAC-2 (vepdegestrant): vepdegestrant, an oral PROTAC oestrogen-receptor degrader, improved progression-free survival over fulvestrant in <em>ESR1</em>-mutant disease (5.0 vs 2.1 months, HR 0.58) with a higher response rate (19% vs 4%), while the intention-to-treat primary endpoint failed its prespecified boundary (3.8 vs 3.6 months, HR 0.83, P=0.07) (N Engl J Med 2025;393:556-568).</li></ul>\n<p>EMERALD met both co-primary progression-free-survival endpoints in the intention-to-treat and <em>ESR1</em>-mutant populations. EMBER-3 and VERITAC-2 met their mutation-defined endpoints but not their intention-to-treat comparisons. None reported a treatment-by-<em>ESR1</em> interaction, so these trials do not prove that benefit is biologically confined to <em>ESR1</em>-mutant disease. The medians are short, no survival benefit has been demonstrated, and the class includes both selective oestrogen-receptor degraders and a PROTAC degrader.</p>\n<h3 id=\"s-switching-on-molecular-progression\">Switching on molecular progression</h3>\n<p><em>ESR1</em> mutations become detectable in ctDNA around 6 months before radiological progression, which raises the question of whether to act on the molecular event rather than wait. <a class=\"trial-link\" href=\"/evidence/#t-serena-6\">SERENA-6</a> tested that strategy in 315 patients.</p>\n<p>Those on a first-line aromatase inhibitor plus a CDK4/6 inhibitor were monitored with ctDNA every 2 to 3 months; on detection of an emergent <em>ESR1</em> mutation without radiological progression, they were randomised to switch the endocrine partner to camizestrant while continuing the same CDK4/6 inhibitor, or to continue the aromatase inhibitor.</p>\n<p>Switching improved progression-free survival (16.0 vs 9.2 months, HR 0.44) and delayed deterioration in global quality of life (21.0 vs 6.4 months, HR 0.54), with immature overall survival (N Engl J Med 2025;393:569-580). Second progression-free survival was not significant (HR 0.52); photopsia and bradycardia were adverse events of special interest.</p>\n<p>The result establishes this monitored-switch strategy for the tested regimen and setting. Whether it improves survival or generalises to other drugs remains open.</p>\n<h3 id=\"s-pi3k-akt-mtor-altered-disease\">PI3K–AKT–mTOR-altered disease</h3>\n<p><em>PIK3CA</em> mutations occur in about 40% of HR-positive, HER2-negative metastatic disease. The four agents in this space differ in what they inhibit and in the population they were tested in.</p>\n<ul><li class=\"evidence-prose\">BOLERO-2: everolimus plus exemestane improved progression-free survival after progression on a non-steroidal aromatase inhibitor by local assessment (7.8 vs 3.2 months; HR 0.45) and central review (11.0 vs 4.1 months; HR 0.38), but did not improve overall survival (31.0 vs 26.6 months; HR 0.89) (N Engl J Med 2012;366:520-529; Ann Oncol 2014;25:2357-2362).</li><li class=\"evidence-prose\"><span class=\"evidence-lead\">SOLAR-1: alpelisib plus fulvestrant improved progression-free survival in the <em>PIK3CA</em>-mutant cohort (11.0 vs 5.7 months, HR 0.65) without a significant survival gain (39.3 vs 31.4 months, HR 0.86) (N Engl J Med 2019;380:1929-1940; Ann Oncol 2021;32:208-217).</span><span class=\"evidence-detail\">Only 6% of patients had received a prior CDK4/6 inhibitor, which limits direct application after contemporary first-line therapy.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">CAPItello-291: capivasertib plus fulvestrant improved progression-free survival overall (7.2 vs 3.6 months, HR 0.60) and in AKT-pathway-altered tumours carrying <em>PIK3CA</em>, <em>AKT1</em> or <em>PTEN</em> alterations (7.3 vs 3.1 months, HR 0.50), but final overall survival showed no significant benefit in either population (AKT-altered HR 0.83, overall HR 1.00) (N Engl J Med 2023;388:2058-2070; ESMO Open 2026;11:107440).</span><span class=\"evidence-detail\">Sixty-nine percent had received a prior CDK4/6 inhibitor.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">VIKTORIA-1: gedatolisib, a pan-PI3K/mTOR inhibitor, improved progression-free survival over fulvestrant in prospectively <em>PIK3CA</em> wild-type disease after a CDK4/6 inhibitor, as a triplet with palbociclib and fulvestrant (9.3 vs 2.0 months; HR 0.24) and as a doublet with fulvestrant (7.4 vs 2.0 months; HR 0.33) (J Clin Oncol 2026;44:1108-1119).</span><span class=\"evidence-detail\">Grade 3 neutropenia occurred in 52.3% with the triplet.</span></li></ul>\n<p>INAVO120 is the only member of this group with a confirmed survival benefit, and it differs from the others in being a first-line, mutation-selected triplet rather than a later-line doublet. The class toxicity is shared, being hyperglycaemia, rash, stomatitis, diarrhoea and nausea; relative frequency separates the agents.</p>\n<ul><li>Alpelisib: hyperglycaemia 64% any grade and 37% grade 3 or worse, the highest of the group; glucose requires active baseline and on-treatment monitoring.</li><li>Inavolisib: hyperglycaemia 59% any grade but 6% grade 3 or worse, stomatitis 51%.</li><li>Capivasertib: hyperglycaemia 16%, diarrhoea 72%, rash 38% with 12% grade 3 or worse.</li><li>Gedatolisib: stomatitis 57% with the doublet, 69% with the triplet.</li><li>Everolimus: stomatitis 56%, rash 36%, diarrhoea 30%, hyperglycaemia 13%, pneumonitis 12%.</li></ul>\n<h3 id=\"s-continuing-cdk4-6-inhibition-beyond-progression\">Continuing CDK4/6 inhibition beyond progression</h3>\n<p>Two randomised trials support maintaining pressure on the CDK4/6 pathway after progression, provided the endocrine partner is changed. They do not support continuing an identical failed regimen.</p>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\">postMONARCH: abemaciclib plus fulvestrant modestly improved progression-free survival after progression on a CDK4/6 inhibitor and endocrine therapy (6.0 vs 5.3 months, HR 0.73), the first phase 3 trial to show benefit from continuing CDK4/6 inhibition beyond progression (J Clin Oncol 2025;43:1101-1112).</span><span class=\"evidence-detail\">By blinded independent central review the medians were 12.9 versus 5.6 months (HR 0.55), and benefit was greater in patients who had received at least 12 months of the prior inhibitor.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">MAINTAIN (Kalinsky): switching to ribociclib with endocrine therapy after progression on a prior CDK4/6 inhibitor improved progression-free survival (5.29 vs 2.76 months; HR 0.57, P=.006) (J Clin Oncol 2023;41:4004-4013).</span><span class=\"evidence-detail\">This phase 2 result does not establish a class-wide sequencing strategy.</span></li></ul>\n<p>The gain is under a month by investigator assessment in postMONARCH, which is statistically significant and of questionable clinical importance. MAINTAIN is randomised phase 2. Both changed the inhibitor or the partner, and the mechanism of benefit after prior CDK4/6 inhibition varies by drug and design, so pathway persistence does not mean every continuation strategy works.</p>\n<h3 id=\"s-her2-low-and-her2-ultralow-expression\">HER2-low and HER2-ultralow expression</h3>\n<p>HER2-low means immunohistochemistry 1+, or 2+ with a negative in-situ hybridisation result. This level does not predict benefit from conventional anti-HER2 antibodies but can permit activity from bystander-capable antibody–drug conjugates. HER2-ultralow means immunohistochemistry 0 with faint, incomplete membrane staining. Most HER2-negative metastatic breast cancers fall in the HER2-low band. These categories identify treatment eligibility at low antigen expression rather than a distinct tumour biology.</p>\n<ul><li class=\"evidence-prose\">DESTINY-Breast04: in the HR-positive cohort of previously treated HER2-low disease, trastuzumab deruxtecan improved progression-free survival (10.1 vs 5.4 months; HR 0.51) and overall survival (HR 0.64) over physician&#x27;s-choice chemotherapy (N Engl J Med 2022;387:9-20).</li><li class=\"evidence-prose\">DESTINY-Breast06: in chemotherapy-naive disease after endocrine therapy, trastuzumab deruxtecan improved progression-free survival over physician&#x27;s-choice chemotherapy in HER2-low disease (13.2 vs 8.1 months; HR 0.62); the intention-to-treat cohort including exploratory HER2-ultralow disease also favoured trastuzumab deruxtecan (HR 0.64) (N Engl J Med 2024;391:2110-2122).</li></ul>\n<p>The two do not read identically on the expression gradient. DESTINY-Breast04 found benefit flat across immunohistochemistry 1+ and 2+/ISH-negative, whereas DESTINY-Breast06&#x27;s subgroup point estimates diverge by expression depth with no interaction test reported. Whether that is a real interaction, chance in an unpowered subgroup, or the difference between a post-chemotherapy and a post-endocrine population is unresolved. The assay itself is imprecise at this threshold.</p>\n<p>DESTINY-Breast06 misclassified several enrolled patients against its own central testing protocol, and its investigators call for splitting immunohistochemistry 0 into two clinical categories, against the current ASCO–CAP position that the existing categorisation suffices.</p>\n<h3 id=\"s-trop2-antibody-drug-conjugates\">TROP2 antibody–drug conjugates</h3>\n<p>Two TROP2-directed conjugates have randomised data in this subtype after endocrine therapy, separated by payload and toxicity rather than by target.</p>\n<ul><li class=\"evidence-prose\"><a class=\"trial-link\" href=\"/evidence/#t-tropics-02\">TROPiCS-02</a>: sacituzumab govitecan improved progression-free survival (5.5 vs 4.0 months; HR 0.66) and overall survival (14.4 vs 11.2 months; HR 0.79) over physician&#x27;s-choice chemotherapy after endocrine therapy and prior chemotherapy (J Clin Oncol 2022;40:3365-3376; Lancet 2023;402:1423-1433).</li><li class=\"evidence-prose\"><a class=\"trial-link\" href=\"/evidence/#t-tropion-breast01\">TROPION-Breast01</a>: datopotamab deruxtecan improved progression-free survival over investigator&#x27;s-choice chemotherapy after endocrine therapy and one to two chemotherapy lines (6.9 vs 4.9 months, HR 0.63, 95% CI 0.52 to 0.76, P&lt;.0001), with a higher confirmed response rate (36.4% vs 22.9%) and far fewer grade 3 or worse treatment-related adverse events (20.8% vs 44.7%); overall survival was immature (HR 0.84) (J Clin Oncol 2025;43:285-296).</li></ul>\n<p>Sacituzumab govitecan&#x27;s toxicity is irinotecan-class, chiefly neutropenia and diarrhoea; datopotamab deruxtecan&#x27;s is deruxtecan-class, chiefly stomatitis, ocular surface events and interstitial lung disease. Neither has been compared with the other, and neither has been compared with trastuzumab deruxtecan, so the HER2-low route and the TROP2 route increasingly treat the same later-line patient without sequencing evidence.</p>\n<h3 id=\"s-germline-brca-mutated-disease\">Germline BRCA-mutated disease</h3>\n<p>PARP inhibition selects patients by germline genotype rather than by receptor phenotype, so its trials enrolled HER2-negative disease of both hormone-receptor subtypes.</p>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\">OlympiAD: olaparib improved progression-free survival over physician&#x27;s choice of capecitabine, eribulin or vinorelbine (7.0 vs 4.2 months, HR 0.58, 95% CI 0.43 to 0.80, P&lt;0.001) and roughly doubled response (59.9% vs 28.8%).</span><span class=\"evidence-detail\">Final overall survival was not improved overall (19.3 vs 17.1 months, HR 0.90) in an analysis not powered for survival and confounded by crossover, with a non-alpha-controlled signal in patients treated in the first-line metastatic setting (HR 0.51) (N Engl J Med 2017;377:523-533; Ann Oncol 2019;30:558-566). Grade 3 or worse adverse events were less frequent than with chemotherapy (36.6% vs 50.5%).</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">EMBRACA: talazoparib improved progression-free survival (8.6 vs 5.6 months, HR 0.54, 95% CI 0.41 to 0.71, P&lt;0.001) and more than doubled response (62.6% vs 27.2%), with patient-reported outcomes favouring talazoparib.</span><span class=\"evidence-detail\">Interim overall survival was not significant (22.3 vs 19.5 months, HR 0.76, immature) (N Engl J Med 2018;379:753-763), and the final analysis was negative (19.3 vs 19.5 months, HR 0.848, P=0.17) (Ann Oncol 2020;31:1526-1535). Grade 3–4 haematologic toxicity was higher than with chemotherapy (55% vs 38%), reflecting greater PARP-trapping potency.</span></li></ul>\n<p>Both trials support PARP inhibition in germline <em>BRCA</em>-mutated, HER2-negative disease but do not rank the agents. Neither trial included platinum in the control arm, so PARP inhibitor versus platinum remains untested. The two trials disagree on which receptor subgroup benefits more. OlympiAD&#x27;s progression-free survival hazard ratio was 0.82 (95% CI 0.55 to 1.26) in hormone receptor-positive disease against 0.43 in triple-negative disease, whereas EMBRACA&#x27;s ran the other way (0.47 and 0.60 respectively).</p>\n<p>Neither trial was powered for the comparison.</p>\n<h2 id=\"s-her2-positive-disease\">HER2-positive disease</h2>\n<p>HER2-directed treatment developed from the trastuzumab-plus-chemotherapy regimen tested in <a class=\"trial-link\" href=\"/evidence/#t-h0648g-pivotal-trastuzumab\">H0648g (pivotal trastuzumab)</a>. Subsequent strategies added a second antibody, used antibody-drug conjugates to deliver a cytotoxic payload, or used tyrosine-kinase inhibitors with intracranial activity.</p>\n<p>Adding trastuzumab to first-line chemotherapy prolonged time to progression (7.4 vs 4.6 months, P&lt;0.001), raised objective response (50% vs 32%, P&lt;0.001) and improved overall survival (25.1 vs 20.3 months, P=0.046) in HER2-overexpressing metastatic disease (N Engl J Med 2001;344:783-792).</p>\n<p>Concurrent anthracycline and trastuzumab caused cardiac dysfunction in 27% against 8% with anthracycline alone, which is why the durable HER2 backbone became a taxane rather than an anthracycline.</p>\n<h3 id=\"s-first-line\">First line</h3>\n<p>Dual antibody blockade with a taxane remains the standard.</p>\n<p><a class=\"trial-link\" href=\"/evidence/#t-cleopatra\">CLEOPATRA</a> added pertuzumab to trastuzumab and docetaxel and improved independently assessed progression-free survival (18.5 vs 12.4 months; HR 0.62, 95% CI 0.51 to 0.75; P&lt;0.001).</p>\n<p>Final overall survival also improved (56.5 vs 40.8 months; HR 0.68, 95% CI 0.56 to 0.84), with an 8-year landmark survival of 37% versus 23% and no added cardiotoxicity (N Engl J Med 2012;366:109-119; N Engl J Med 2015;372:724-734; Lancet Oncol 2020;21:519-530).</p>\n<p>Adding pertuzumab increased diarrhoea (67%), rash (34%), mucositis (28%) and febrile neutropenia (14%). <a class=\"trial-link\" href=\"/evidence/#t-peruse\">PERUSE</a> reports outcomes by taxane. In 1,436 patients given investigator-selected docetaxel, paclitaxel or nab-paclitaxel with pertuzumab and trastuzumab, median progression-free survival was 20.7 months and overall survival 65.3 months at 5.7 years of follow-up, with objective response in 79% (Ann Oncol 2019;30:766-773; Ann Oncol 2021;32:1245-1255).</p>\n<p>Paclitaxel and docetaxel subgroups had descriptively similar progression-free survival (23.2 vs 19.4 months) and overall survival (64.0 vs 66.5 months), with grade 3 or worse neutropenia in 5% versus 15% and febrile neutropenia in 1% versus 11%. Grade 3 or worse diarrhoea was 9% versus 8% and fatal adverse events occurred in 2%.</p>\n<p>Taxane choice was not randomised and no formal comparison was performed, so paclitaxel is a practical alternative rather than a demonstrated equal. <a class=\"trial-link\" href=\"/evidence/#t-destiny-breast09\">DESTINY-Breast09</a> challenges the standard directly. First-line trastuzumab deruxtecan plus pertuzumab improved interim progression-free survival over a taxane with trastuzumab and pertuzumab (40.7 vs 26.9 months; HR 0.56, 95% CI 0.44 to 0.71) (N Engl J Med 2026;394:551-562).</p>\n<p>Grade 3 or worse adverse events occurred in 63.5% versus 62.3%. Overall survival is immature; CLEOPATRA therefore remains the established first-line standard while survival follow-up matures.</p>\n<h3 id=\"s-maintenance-intensification-and-hormone-receptor-positive-overlap\">Maintenance intensification and hormone receptor-positive overlap</h3>\n<p>After induction chemotherapy has controlled the disease, antibody therapy continues as maintenance, and in HR-positive disease an aromatase inhibitor is added. Two trials intensify that maintenance phase further.</p>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-patina\">PATINA</a>: adding palbociclib to maintenance anti-HER2 therapy plus endocrine therapy prolonged progression-free survival (44.3 vs 29.1 months; HR 0.75, 95% CI 0.59 to 0.96) (N Engl J Med 2026;394:451-462).</span><span class=\"evidence-detail\">Overall survival was immature (HR 0.86, 95% CI 0.61 to 1.23). Grade 3 adverse events occurred in 79.7% versus 30.6%, grade 4 events in 10.0% versus 3.6%, and grade 3 or worse neutropenia in 60.5% versus 2.0%.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-her2climb-05\">HER2CLIMB-05</a>: the trial enrolled patients with HER2-positive, HR-positive advanced breast cancer who had no progression after induction and no active brain metastases.</span><span class=\"evidence-detail\">Adding tucatinib to maintenance trastuzumab and pertuzumab prolonged progression-free survival (24.9 vs 16.3 months; HR 0.641) (J Clin Oncol 2026;44:1597-1607). Subgroup estimates were descriptive and overall survival was immature.</span></li></ul>\n<p>Both measure progression-free survival from the start of maintenance, not from randomisation to induction, and both have immature overall survival. The high absolute medians reflect a population already selected for at least stable disease on induction. <a class=\"trial-link\" href=\"/evidence/#t-her2climb\">HER2CLIMB</a>&#x27;s benefit on CNS-specific progression-free survival does not reproduce at this line; the subgroup benefit reported here is on overall progression-free survival in patients with brain metastases.</p>\n<h3 id=\"s-second-line\">Second line</h3>\n<p><a class=\"trial-link\" href=\"/evidence/#t-emilia\">EMILIA</a> established trastuzumab emtansine after trastuzumab and a taxane, improving progression-free survival (9.6 vs 6.4 months, HR 0.65, 95% CI 0.55 to 0.77) and overall survival (30.9 vs 25.1 months, HR 0.68, 95% CI 0.55 to 0.85) over lapatinib plus capecitabine, with less toxicity (N Engl J Med 2012;367:1783-1791).</p>\n<p>It was the first antibody–drug conjugate shown to extend life in breast cancer and established HER2-directed payload delivery after trastuzumab and a taxane. <a class=\"trial-link\" href=\"/evidence/#t-destiny-breast03\">DESTINY-Breast03</a> then displaced it.</p>\n<p>Trastuzumab deruxtecan against trastuzumab emtansine in the same setting produced a median progression-free survival not reached (95% CI 18.5 to not estimable) versus 6.8 months (HR 0.28, 95% CI 0.22 to 0.37, P&lt;0.001), with confirmed objective response of 79.7% versus 34.2%; overall survival was immature at the primary analysis (N Engl J Med 2022;386:1143-1154).</p>\n<p>On longer follow-up progression-free survival matured to 28.8 versus 6.8 months (HR 0.33) and overall survival to 52.6 versus 42.7 months (HR 0.73), with interstitial lung disease in 15%. Trastuzumab deruxtecan is the preferred second-line option. The first-line trials excluded patients relapsing soon after (neo)adjuvant therapy, and the window differs: 12 months for CLEOPATRA, 6 months for PERUSE and DESTINY-Breast09.</p>\n<p>A patient relapsing inside their trial&#x27;s window should be treated as second line.</p>\n<h3 id=\"s-third-line-and-beyond\">Third line and beyond</h3>\n<p>No evidence establishes the optimal regimen after second-line trastuzumab deruxtecan, and the historical third-line sequence has been overtaken by the drug&#x27;s move into second line. The options divide by mechanism. Tyrosine-kinase inhibitors:</p>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\">HER2CLIMB: tucatinib added to trastuzumab and capecitabine after trastuzumab, pertuzumab and trastuzumab emtansine improved progression-free survival (7.8 vs 5.6 months, HR 0.54, 95% CI 0.42 to 0.71, P&lt;0.001) and overall survival (21.9 vs 17.4 months, HR 0.66, 95% CI 0.50 to 0.88, P=0.005); among patients with brain metastases the risk of progression or death fell (HR 0.48, 95% CI 0.34 to 0.69) (N Engl J Med 2020;382:597-609).</span><span class=\"evidence-detail\">The trial supports tucatinib-based treatment where intracranial disease is clinically important.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-nala\">NALA</a>: neratinib plus capecitabine against lapatinib plus capecitabine improved centrally reviewed progression-free survival (HR 0.76, 95% CI 0.63 to 0.93, P=0.006; 12-month rate 29% vs 15%, medians 5.6 vs 5.5 months) and duration of response, and fewer patients required intervention for CNS disease (cumulative incidence 22.8% vs 29.2%, P=0.043).</span><span class=\"evidence-detail\">Overall survival was not significantly improved (HR 0.88, 95% CI 0.72 to 1.07; restricted mean 24.0 vs 22.2 months) (J Clin Oncol 2020;38:3138-3149).</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-egf100151-lapatinib-capecitabine\">EGF100151 (lapatinib + capecitabine)</a>: lapatinib added to capecitabine after anthracycline, taxane and trastuzumab roughly doubled independently assessed time to progression (8.4 vs 4.4 months, HR 0.49, 95% CI 0.34 to 0.71).</span><span class=\"evidence-detail\">Fewer patients had the CNS as first site of progression (4 vs 11, P=0.10), an exploratory, non-significant observation rather than evidence of established intracranial efficacy (N Engl J Med 2006;355:2733-2743).</span></li></ul>\n<p>Antibody–drug conjugates:</p>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-destiny-breast01\">DESTINY-Breast01</a>: single-arm trastuzumab deruxtecan after trastuzumab emtansine in patients with a median of six prior lines produced confirmed objective response in 60.9% (95% CI 53.4 to 68.0) with median progression-free survival of 16.4 months (N Engl J Med 2020;382:610-621).</span><span class=\"evidence-detail\">Interstitial lung disease occurred in 13.6%, including four fatal events (2.2%).</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-destiny-breast02\">DESTINY-Breast02</a>: in a post-emtansine population, trastuzumab deruxtecan improved progression-free survival (17.8 vs 6.9 months; HR 0.36, 95% CI 0.28 to 0.45) and overall survival (39.2 vs 26.5 months; HR 0.66, 95% CI 0.50 to 0.86) over physician&#x27;s-choice therapy (Lancet 2023;401:1773-1785).</span><span class=\"evidence-detail\">Drug-related interstitial lung disease occurred in 10% versus less than 1%, with two grade 5 events on trastuzumab deruxtecan.</span></li><li class=\"evidence-prose\"><a class=\"trial-link\" href=\"/evidence/#t-th3resa\">TH3RESA</a>: trastuzumab emtansine against treatment of physician&#x27;s choice after at least two HER2-directed regimens improved progression-free survival (6.2 vs 3.3 months, HR 0.53, 95% CI 0.42 to 0.66, P&lt;0.001) and overall survival (22.7 vs 15.8 months, HR 0.68, 95% CI 0.54 to 0.85, P=0.0007), with grade 3 or worse haemorrhage in 4% versus under 1% (Lancet Oncol 2014;15:689-699; Lancet Oncol 2017;18:743-754).</li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-horizon-breast01\">HORIZON-Breast01</a>: trastuzumab rezetecan improved interim progression-free survival over pyrotinib plus capecitabine (30.6 vs 8.3 months; HR 0.22, 95% CI 0.15 to 0.34; P&lt;0.0001) (Lancet Oncol 2026, online ahead of print).</span><span class=\"evidence-detail\">Grade 3 or worse treatment-related adverse events occurred in 70% versus 63%; interstitial lung disease occurred in 3%, and overall survival was immature.</span></li></ul>\n<p>Antibody re-engineering and retreatment:</p>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-sophia\">SOPHIA</a>: margetuximab, an Fc-engineered anti-HER2 antibody, modestly improved progression-free survival over trastuzumab on the same chemotherapy backbone (5.8 vs 4.9 months, HR 0.76, 95% CI 0.59 to 0.98, P=0.03), with no significant survival improvement at the second interim analysis (21.6 vs 19.8 months, HR 0.89, 95% CI 0.69 to 1.13) (JAMA Oncol 2021;7:573-584).</span><span class=\"evidence-detail\">Its prespecified but non-alpha-controlled CD16A-158F genotype signal is hypothesis-generating and under prospective test.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-precious\">PRECIOUS</a>: pertuzumab retreatment after progression on a prior pertuzumab-containing regimen improved investigator-assessed progression-free survival (5.3 vs 4.2 months, HR 0.76, one-sided 95% CI upper bound 0.97, P=0.022) but independent-review progression-free survival was flat (4.4 vs 4.4 months, HR 1.03).</span><span class=\"evidence-detail\">Final overall survival favoured retreatment (36.2 vs 26.5 months, HR 0.73, no P value since alpha was spent on progression-free survival) (Cancer Sci 2022;113:3169-3179; J Clin Oncol 2025;43:1631-1637). It is underpowered by design, single-country and open-label.</span></li></ul>\n<h3 id=\"s-brain-metastases\">Brain metastases</h3>\n<p>Local therapy remains standard for active brain metastases: surgery, stereotactic radiosurgery or gamma-knife. Two systemic options carry prospective intracranial data.</p>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-destiny-breast12\">DESTINY-Breast12</a>: a prospective single-arm cohort of 263 patients with baseline brain metastases including active lesions, tucatinib-naive by design.</span><span class=\"evidence-detail\">Median progression-free survival was 17.3 months (12-month rate 61.6%) with confirmed intracranial objective response of 71.7%, the largest prospective dataset for trastuzumab deruxtecan in stable and active brain metastases (Nat Med 2024;30:3717-3727). Investigator-reported interstitial lung disease occurred in 16% of the brain-metastasis cohort (grade 5 in 2.3%) and 13% of those without (grade 5 in 1.2%), with no central adjudication committee.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">HER2CLIMB enrolled patients with brain metastases by design, about half the trial.</span><span class=\"evidence-detail\">In patients with active brain metastases, intracranial response was 47% versus 20%, CNS progression-free survival 9.9 versus 4.2 months, and overall survival 21.6 versus 12.5 months.</span></li></ul>\n<p>Which of the two better serves brain-metastasis disease is untested, because DESTINY-Breast12 excluded prior tucatinib by protocol design.</p>\n<h2 id=\"s-triple-negative-disease\">Triple-negative disease</h2>\n<p>Triple-negative breast cancer is diagnosed by exclusion, which is why it lacks the endocrine and anti-HER2 pathways that organise the rest of breast oncology. Two biomarkers are read in parallel at diagnosis of advanced disease, and they select partly overlapping populations: PD-L1 combined positive score routes the first-line backbone, and germline <em>BRCA</em> opens a genotype-defined option that cuts across the receptor subtypes.</p>\n<h3 id=\"s-first-line-at-pd-l1-combined-positive-score-of-10-or-more\">First line at PD-L1 combined positive score of 10 or more</h3>\n<p><a class=\"trial-link\" href=\"/evidence/#t-keynote-355\">KEYNOTE-355</a> is the standard. Pembrolizumab added to investigator&#x27;s choice of nab-paclitaxel, paclitaxel or gemcitabine–carboplatin improved progression-free survival (9.7 vs 5.6 months, HR 0.65, P=0.0012) and overall survival (23.0 vs 16.1 months, HR 0.73, 95% CI 0.55 to 0.95, P=0.0185) in disease with a 22C3 combined positive score of 10 or more (Lancet 2020;396:1817-1828; N Engl J Med 2022;387:217-226).</p>\n<p>The combined-positive-score 1-or-more population did not cross its hierarchical boundary (overall survival HR 0.86), and intention-to-treat overall survival was therefore not formally tested. Without a treatment-by-score interaction or a direct alpha-controlled combined-positive-score 1–9 estimate, <sup class=\"trial-ref\"><a href=\"#ref-breast-metastatic-breast-cancer-t-keynote-355\" aria-label=\"Reference 50: KEYNOTE-355\">50</a></sup> does not prove that benefit is biologically confined to a score of 10 or more. Immune-related adverse events occurred in 26.5%, most often hypo- and hyperthyroidism.</p>\n<p><a class=\"trial-link\" href=\"/evidence/#t-impassion130\">IMpassion130</a> provided the first positive randomised progression-free-survival result for checkpoint inhibition in metastatic triple-negative disease but did not establish an overall-survival claim in its intention-to-treat population.</p>\n<p>Atezolizumab plus nab-paclitaxel improved progression-free survival in the intention-to-treat population (7.2 vs 5.5 months, HR 0.80, P=0.002) and more so in PD-L1-positive disease by SP142 immune-cell scoring at 1% or more (7.5 vs 5.0 months, HR 0.62).</p>\n<p>Because intention-to-treat overall survival was not significant (final HR 0.87, P=0.077), the PD-L1-positive survival difference (25.4 vs 17.9 months, HR 0.67) could only be reported descriptively (N Engl J Med 2018;379:2108-2121; Ann Oncol 2021;32:983-993). <a class=\"trial-link\" href=\"/evidence/#t-impassion131\">IMpassion131</a> then failed to confirm it with solvent-based paclitaxel instead of nab-paclitaxel.</p>\n<p>Progression-free survival did not improve in PD-L1-positive disease (6.0 vs 5.7 months, HR 0.82, 95% CI 0.60 to 1.12, P=0.20) and overall survival numerically favoured placebo (22.1 vs 28.3 months, HR 1.11) (Ann Oncol 2021;32:994-1004). The atezolizumab indication in metastatic disease was withdrawn.</p>\n<p>The candidate explanations were the taxane formulation and the corticosteroid premedication that solvent-based paclitaxel requires, but KEYNOTE-355 succeeded including with paclitaxel, which weakens that reading. The two assays do not interchange. IMpassion130 reads PD-L1 on immune cells by SP142 at a 1%-of-tumour-area cutoff; KEYNOTE-355 reads a combined positive score on 22C3. Within one disease, &quot;PD-L1-positive&quot; denotes different tissue depending on which drug is under consideration.</p>\n<p><a class=\"trial-link\" href=\"/evidence/#t-ascent-04-keynote-d19\">ASCENT-04 (KEYNOTE-D19)</a> compared sacituzumab govitecan plus pembrolizumab with chemotherapy plus pembrolizumab in the same combined-positive-score 10-or-more population.</p>\n<p>Progression-free survival improved (11.2 vs 7.8 months, HR 0.65, 95% CI 0.51 to 0.84, P&lt;0.001) with a longer duration of response (16.5 vs 9.2 months) and far less discontinuation for toxicity (12% vs 31%), while response rates were similar (60% vs 53%) (N Engl J Med 2026;394:354-366). Overall survival was immature, untested and crossover-confounded. Two qualifications govern how far this goes.</p>\n<p>The comparison establishes superiority over chemo-immunotherapy, not over chemotherapy alone, because the control arm was the KEYNOTE-355 regimen. The result rests on progression-free survival and response durability, with overall-survival data pending.</p>\n<h3 id=\"s-first-line-when-immunotherapy-is-not-an-option\">First line when immunotherapy is not an option</h3>\n<p>Most metastatic triple-negative disease is PD-L1-negative at a combined positive score of 10, and a smaller number of patients are ineligible for a checkpoint inhibitor through prior exposure in the curative setting or a coexisting condition. For this group first-line care was chemotherapy alone, and two conjugates have now beaten it.</p>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-ascent-03\">ASCENT-03</a>: first-line sacituzumab govitecan improved progression-free survival over single-agent chemotherapy in checkpoint-inhibitor-ineligible metastatic triple-negative disease (9.7 vs 6.9 months; HR 0.62, P&lt;.001) and prolonged response duration (N Engl J Med 2025;393:1912-1925).</span><span class=\"evidence-detail\">Overall survival was descriptive without formal testing. Grade 3 or worse neutropenia was frequent in both arms (43% vs 41%); adverse-event discontinuation was less frequent with sacituzumab govitecan (4% vs 12%).</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-tropion-breast02\">TROPION-Breast02</a>: datopotamab deruxtecan improved progression-free survival (HR 0.57) and overall survival (HR 0.79) over chemotherapy in checkpoint-inhibitor-ineligible metastatic triple-negative disease (Ann Oncol 2026, online ahead of print).</span><span class=\"evidence-detail\">Objective response was higher, and adjudicated drug-related interstitial lung disease or pneumonitis occurred in 3%, including one grade 5 event. No head-to-head comparison with another antibody–drug conjugate was performed.</span></li></ul>\n<p>Here the control arm genuinely is the standard of care, so the result can be stated plainly: both conjugates improved on chemotherapy. Datopotamab deruxtecan has proven survival where sacituzumab govitecan has not, but that difference reflects trial maturity and crossover rather than a demonstrated potency gap, and the two were never randomised against each other. Choose on toxicity signature.</p>\n<h3 id=\"s-germline-brca-mutated-disease-and-platinum\">Germline BRCA-mutated disease and platinum</h3>\n<p>OlympiAD and EMBRACA both enrolled germline <em>BRCA</em>-mutated HER2-negative disease, about half of which was triple-negative, and both are set out above. In the triple-negative subgroup OlympiAD&#x27;s progression-free survival hazard ratio was 0.43 and EMBRACA&#x27;s 0.60. The two do not agree on which subgroup benefits more, and neither was powered for that comparison.</p>\n<p>Neither trial included platinum in its control arm, and both excluded patients who had progressed on platinum or received it recently in the curative setting. <a class=\"trial-link\" href=\"/evidence/#t-tnt-cruk-07-012\">TNT (CRUK/07/012)</a> provides the direct platinum-versus-docetaxel comparison without establishing that all homologous-recombination-deficiency markers predict platinum benefit.</p>\n<p>There was no evidence of an objective-response difference between carboplatin and docetaxel in unselected triple-negative disease (31.4% vs 34.0%; absolute difference -2.6 percentage points, 95% CI -12.1 to 6.9; P=.66).</p>\n<p>In germline <em>BRCA</em> carriers carboplatin doubled response (68% vs 33%, treatment-biomarker interaction P=.01), with progression-free survival of 6.8 versus 4.4 months and no overall-survival difference in a trial where 56% crossed over (Nat Med 2018;24:628-637). <em>BRCA1</em> promoter methylation, low <em>BRCA1</em> mRNA and a Myriad homologous-recombination-deficiency score did not predict platinum benefit.</p>\n<p>Germline <em>BRCA</em> status selects patients for platinum. Broader assays of homologous-recombination deficiency do not.</p>\n<h3 id=\"s-pretreated-disease\">Pretreated disease</h3>\n<p><a class=\"trial-link\" href=\"/evidence/#t-ascent\">ASCENT</a> established sacituzumab govitecan in pretreated disease. It improved progression-free survival, overall survival and response over chemotherapy in the brain-metastasis-negative primary population; the final intention-to-treat analysis including patients with brain metastases confirmed an overall-survival benefit (11.8 vs 6.9 months; HR 0.51, 95% CI 0.42 to 0.63) (N Engl J Med 2021;384:1529-1541; J Clin Oncol 2024;42:1738-1744). Grade 3 or worse neutropenia and diarrhoea were common.</p>\n<p>This trial did not compare first-line regimens. TROP2 expression is not a selection biomarker, and TROP2 testing is not required before treatment. Benefit held across every immunohistochemistry quartile with no significant treatment-by-expression interaction, and across HER2 immunohistochemistry 0 and HER2-low tumours. The antigen directs the antibody to the tumour without selecting which patients respond. HER2-directed conjugates occupy adjacent ground.</p>\n<p>In the exploratory, unpowered hormone receptor-negative cohort of DESTINY-Breast04 (n=58), progression-free survival was 8.5 versus 2.9 months (HR 0.46) and overall survival 18.2 versus 8.3 months (HR 0.48) (N Engl J Med 2022;387:9-20). That cohort remains the only evidence for the HER2-low route in triple-negative disease, since DESTINY-Breast06 excluded hormone receptor-negative patients.</p>\n<p>Read across the disease, three randomised, alpha-controlled results carry a demonstrated overall survival benefit: pretreated sacituzumab govitecan, first-line chemo-immunotherapy at combined positive score 10 or more, and first-line datopotamab deruxtecan in immunotherapy-ineligible disease. DESTINY-Breast04&#x27;s triple-negative cohort points the same way without the power to prove it. The rest are led by progression-free survival and response with survival still open.</p>\n<h2 id=\"s-cytotoxic-chemotherapy\">Cytotoxic chemotherapy</h2>\n<p>Sequential single-agent chemotherapy is generally preferred. Choose among active agents according to prior exposure, residual toxicity, organ function, symptoms and patient preference; use combination chemotherapy selectively when a rapid response is required for immediately threatening disease. This framework is more durable than a universal drug ranking because prior regimens and toxicity constraints differ across subtypes and lines.<sup class=\"trial-ref\"><a href=\"#ref-breast-metastatic-breast-cancer-ext-29bf1e5a1d73\" aria-label=\"Reference 58: NCI Breast Cancer Treatment PDQ - metastatic disease\">58</a></sup><sup class=\"trial-ref\"><a href=\"#ref-breast-metastatic-breast-cancer-ext-6710f1ab7ffb\" aria-label=\"Reference 1: Pan-Asian adapted ESMO metastatic breast cancer guideline\">1</a></sup></p>\n<h2 id=\"s-special-situations\">Special situations</h2>\n<p><strong>Brain metastases outside HER2-positive disease.</strong> Local therapy remains the default for active brain metastases. No specific systemic regimen has sufficient prospective evidence to support a general recommendation to defer local therapy in HER2-negative breast cancer; choose systemic treatment by subtype, prior therapy, extracranial control and clinical-trial availability rather than blood–brain-barrier plausibility alone.<sup class=\"trial-ref\"><a href=\"#ref-breast-metastatic-breast-cancer-ext-21b7e528ed6f\" aria-label=\"Reference 59: ASCO-SNO-ASTRO Treatment for Brain Metastases guideline\">59</a></sup></p>\n<h2 id=\"s-references\">References</h2>\n<ol class=\"refs\">\n<li id=\"ref-breast-metastatic-breast-cancer-ext-6710f1ab7ffb\"><a href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC10186487/\" rel=\"noopener\" target=\"_blank\">Pan-Asian adapted ESMO metastatic breast cancer guideline</a></li>\n<li id=\"ref-breast-metastatic-breast-cancer-t-paloma-2\"><a class=\"trial-link\" href=\"/evidence/#t-paloma-2\">PALOMA-2</a>. <a href=\"https://drive.google.com/file/d/1EHtNfz_w7GGDxQEGPRemytxa9e8Z9wkj/preview\">N Engl J Med 2016;375:1925-1936</a>; <a href=\"https://drive.google.com/file/d/1Ygv08N-KsfKWI54ahwK7Pklnvx6B-NhU/preview\">J Clin Oncol 2024;42:994-1000</a></li>\n<li id=\"ref-breast-metastatic-breast-cancer-t-monaleesa-2\"><a class=\"trial-link\" href=\"/evidence/#t-monaleesa-2\">MONALEESA-2</a>. <a href=\"https://drive.google.com/file/d/18SXi12xGTNgDPyqvsnV33jkI57pXhhEm/preview\">N Engl J Med 2016;375:1738-1748</a>; <a href=\"https://drive.google.com/file/d/1QDi7bZRsrVzd1AP7P9a3tUacZx7Ye0aE/preview\">N Engl J Med 2022;386:942-950</a></li>\n<li id=\"ref-breast-metastatic-breast-cancer-t-monaleesa-7\"><a class=\"trial-link\" href=\"/evidence/#t-monaleesa-7\">MONALEESA-7</a>. <a href=\"https://drive.google.com/file/d/1hX2S69RKOf4F6kHkRt5ci2NnoSzy4Hom/preview\">Lancet Oncol 2018;19:904-915</a>; <a href=\"https://drive.google.com/file/d/16BwxRF7L13xe4diAnJ_hXXcLFnLjKNAr/preview\">N Engl J Med 2019;381:307-316</a></li>\n<li id=\"ref-breast-metastatic-breast-cancer-t-monarch-3\"><a class=\"trial-link\" href=\"/evidence/#t-monarch-3\">MONARCH 3</a>. <a href=\"https://drive.google.com/file/d/1FKM2OYddNGjFTVQk8RhUD0EgfQlpyXSG/preview\">J Clin Oncol 2017;35:3638-3646</a>; <a href=\"https://drive.google.com/file/d/1q54YnJRtxSY_S0piTwr2ri8pd8hTybdA/preview\">Ann Oncol 2024;35:718-727</a></li>\n<li id=\"ref-breast-metastatic-br
