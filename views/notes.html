KRAS G12C"}, {"id": "s-ntrk-and-nrg1-fusions", "h": "NTRK and NRG1 fusions"}, {"id": "s-driver-negative-disease-first-line", "h": "Driver-negative disease: first line"}, {"id": "s-second-line-and-beyond-in-driver-negative-disease", "h": "Second line and beyond in driver-negative disease"}, {"id": "s-special-situations", "h": "Special situations"}, {"id": "s-references", "h": "References"}], "html": "<h2 id=\"s-molecular-triage-comes-first\">Molecular triage comes first</h2>\n<p>Metastatic non-small-cell lung cancer is a set of molecularly defined compartments, each with its own first-line standard, and a patient is assigned to one by the molecular report rather than by clinical judgement. Four things decide initial therapy: whether an actionable driver is present, the level of PD-L1 expression, squamous versus non-squamous histology, and the extent and tempo of disease. The first of those overrides the rest. A patient with an <em>EGFR</em> mutation and a PD-L1 tumour proportion score of 90% is treated with a tyrosine-kinase inhibitor, not with pembrolizumab. Starting immunotherapy before the report returns wastes a line of treatment and commits the patient to a regimen the driver-positive compartments have repeatedly shown to underperform, and in at least one compartment the sequence itself carries a toxicity cost, since sotorasib given shortly after a checkpoint inhibitor without a washout shows excess hepatotoxicity that adagrasib does not.</p>\n<p><a class=\"trial-link\" href=\"/evidence/#t-ipass\">IPASS</a> demonstrated the point. In East Asian never- or light-smokers with adenocarcinoma, first-line gefitinib improved progression-free survival over carboplatin–paclitaxel in the intention-to-treat population (HR 0.74, 95% CI 0.65 to 0.85, P&lt;0.001), but the effect was entirely mutation-driven: in <em>EGFR</em>-mutant tumours the hazard ratio was 0.48 (0.36 to 0.64) while in wild-type tumours chemotherapy was clearly superior (HR 2.85, 2.05 to 3.98) (N Engl J Med 2009;361:947-957). Clinical phenotype selected a population enriched for benefit; it could not identify the patients who were harmed. That is the argument for testing, and it generalises to every driver below. The alterations worth finding at diagnosis are <em>EGFR</em> (classical exon 19 deletion and exon 21 L858R, uncommon sensitising mutations, and exon 20 insertions), <em>ALK</em>, <em>ROS1</em>, <em>RET</em>, <em>MET</em> exon 14 skipping, <em>BRAF</em> V600E, <em>HER2</em> (<em>ERBB2</em>) exon 20 insertion, <em>KRAS</em> G12C, <em>NTRK</em> and <em>NRG1</em> fusions. The assay matters as much as the gene, and the pairings are not interchangeable.</p>\n<div class=\"tblwrap\"><table><thead><tr><th scope=\"col\">Alteration</th><th scope=\"col\">Typical frequency</th><th scope=\"col\">Preferred detection</th><th scope=\"col\">Note</th></tr></thead><tbody><tr><td><em>EGFR</em> mutation</td><td>—</td><td>Real-time PCR or tissue NGS; ctDNA acceptable</td><td>PCR misses a substantial proportion of exon 20 insertions, so NGS is needed to exclude them </td></tr><tr><td><em>ALK</em> rearrangement</td><td>3–5%</td><td>FISH break-apart (≥15% split signals) or IHC; RNA NGS</td><td>EML4-ALK the commonest partner</td></tr><tr><td><em>ROS1</em> rearrangement</td><td>1–2%</td><td>FISH or RNA NGS</td><td>CD74, SLC34A2, CCDC6, GOPC partners</td></tr><tr><td><em>RET</em> rearrangement</td><td>1–2%</td><td>FISH or RNA NGS</td><td>KIF5B 40–50%, CCDC6 10%</td></tr><tr><td><em>MET</em> exon 14 skipping</td><td>3–4%</td><td>PCR or tissue NGS</td><td>Amplification (5%) and overexpression (25%) are separate entities with separate assays</td></tr><tr><td><em>BRAF</em> V600E</td><td>1–4%</td><td>PCR or NGS</td><td></td></tr><tr><td><em>HER2</em> exon 20 insertion</td><td>3%</td><td>PCR or NGS</td><td>Overexpression is scored by IHC and is a different target</td></tr><tr><td><em>KRAS</em> G12C</td><td>15%</td><td>PCR or NGS</td><td>Mutually exclusive with the other actionable drivers</td></tr><tr><td><em>NTRK</em> fusion</td><td>&lt;1%</td><td>RNA NGS preferred; FISH</td><td></td></tr><tr><td><em>NRG1</em> fusion</td><td>&lt;1%</td><td>RNA NGS preferred</td><td>Binds HER3, heterodimerises with HER2; FISH criteria less standardised</td></tr></tbody></table></div>\n<p>Plasma circulating-tumour-DNA NGS is a legitimate route when tissue is inadequate, and in one setting it is validated rather than merely tolerated: in <a class=\"trial-link\" href=\"/evidence/#t-vision\">VISION</a>, response to tepotinib was near-identical whether <em>MET</em> exon 14 skipping was found on plasma or on tissue. A negative plasma result, however, does not exclude a driver, and tissue remains the fallback.</p>\n<h2 id=\"s-egfr-mutant-disease\">EGFR-mutant disease</h2>\n<h3>Classical mutations: what first line now means</h3>\n<p>Three first-line strategies beat first-generation TKI monotherapy. In <a class=\"trial-link\" href=\"/evidence/#t-flaura\">FLAURA</a>, osimertinib prolonged progression-free survival over gefitinib or erlotinib (18.9 vs 10.2 months; HR 0.46, 95% CI 0.37 to 0.57; P&lt;0.001) and overall survival (38.6 vs 31.8 months; HR 0.80, 0.64 to 1.00; P=0.046), with a longer duration of response (17.2 vs 8.5 months), less CNS progression, and fewer grade 3 or higher adverse events (34% vs 45%) despite far longer exposure (N Engl J Med 2018;378:113-125; overall survival N Engl J Med 2020;382:41-50). The more effective drug was also the better tolerated. The earlier evidence ran as follows: first-generation TKIs improved progression-free survival over platinum doublets without an overall-survival gain (EURTAC, CTONG-0802, ENSURE for erlotinib; IPASS, WJTOG3405, NEJ002 for gefitinib), the second-generation agents improved progression-free survival over first-generation ones (LUX-Lung 7 for afatinib without a survival gain, ARCHER 1050 for dacomitinib with one), and adding an anti-VEGF antibody to a first-generation TKI improved progression-free survival without survival (RELAY 19 vs 12 months, NEJ026 17 vs 13 months). <a class=\"trial-link\" href=\"/evidence/#t-lux-lung-3\">LUX-Lung 3</a> remains relevant: afatinib improved progression-free survival over cisplatin–pemetrexed (11.1 vs 6.9 months; HR 0.58, 0.43 to 0.78), and the pooled LUX-Lung 3/6 survival analysis showed the benefit was exon 19 deletion-specific (31.7 vs 20.7 months; HR 0.59, 0.45 to 0.77) with none in L858R (HR 1.25, 0.92 to 1.71) (J Clin Oncol 2013;31:3327-3334; Lancet Oncol 2015;16:141-151). Exon 19 deletion and L858R are not one biomarker, and every intensification decision below is influenced by which one the patient has. <a class=\"trial-link\" href=\"/evidence/#t-flaura2\">FLAURA2</a> intensified with chemotherapy. Adding platinum–pemetrexed to osimertinib improved investigator-assessed progression-free survival (25.5 vs 16.7 months; HR 0.62, 0.49 to 0.79; P&lt;0.001) and, at the final analysis, overall survival (47.5 vs 37.6 months; HR 0.77, 0.61 to 0.96; P=0.02), with grade 3 or higher adverse events in 70% versus 34% (N Engl J Med 2023;389:1935-1948; N Engl J Med 2026;394:27-38). The excess is chemotherapy-driven cytopenia, in exchange for roughly nine months of additional disease control. <a class=\"trial-link\" href=\"/evidence/#t-aeneas2\">AENEAS2</a> reproduced the result with a different third-generation TKI, aumolertinib plus platinum–pemetrexed against aumolertinib alone in China (blinded independent central review progression-free survival 28.9 vs 18.9 months; HR 0.47, 0.37 to 0.60; P&lt;0.0001), with grade 3 or higher treatment-emergent events in 80% versus 35% and neutrophil decrease in 55% versus 1% (Lancet Oncol 2026;27:785-794). Its overall survival is immature, so what is reproduced is the progression benefit, not the survival benefit. Chemotherapy intensification is therefore a class effect rather than an osimertinib idiosyncrasy. <a class=\"trial-link\" href=\"/evidence/#t-mariposa\">MARIPOSA</a> intensified without chemotherapy. Amivantamab, an EGFR–MET bispecific antibody, plus the third-generation TKI lazertinib improved progression-free survival over osimertinib (23.7 vs 16.6 months; HR 0.70, 0.58 to 0.85; P&lt;0.001) with an 86% response rate, and on updated analysis improved overall survival (HR 0.75, 0.61 to 0.92; P=0.005; 3-year overall survival 60% vs 51%) (N Engl J Med 2024;391:1486-1498; N Engl J Med 2025;393:1681-1693). The toxicity is different in kind rather than in degree: paronychia, rash, oedema, hypoalbuminaemia and transaminitis rather than cytopenias, with grade 3 or higher events in 75% versus 43%, infusion reactions in 63% and venous thromboembolism in 37%, mostly within the first four months. Those two toxicities have specific mitigations, and they should be planned before the first dose rather than managed after it: oral dexamethasone 8 mg twice daily on the two days before and the morning of cycle 1 day 1 cut infusion reactions to 22.5% in SKIPPirr, subcutaneous amivantamab cut them to 13% versus 66% in PALOMA-3, the COCOON dermatological bundle (oral doxycycline or minocycline for 12 weeks, scalp clindamycin, chlorhexidine washes and a ceramide-based moisturiser) reduced grade 2 or higher dermatological events, and prophylactic anticoagulation is recommended for the first four months. A fourth route intensifies locally rather than systemically. <a class=\"trial-link\" href=\"/evidence/#t-sampath-osimertinib-consolidative-rt\">Sampath (osimertinib + consolidative RT)</a> gave first-line osimertinib with consolidative radiotherapy, mostly stereotactic, to residual disease at 8 to 10 weeks; 76% received it, median progression-free survival was 32.3 months (95% CI 21.9 to 51.7) and median overall survival 45 months (39.3 to 56.4), with mostly grade 1–2 toxicity and pneumonitis in 5%, one event of which was grade 4 (EClinicalMedicine 2025;87:103435). Those figures exceed the osimertinib-monotherapy benchmarks, but this is a single-arm trial of 42 patients and does not sit on the same footing as the two randomised intensifications; the randomised confirmation is pending. No head-to-head trial of the two intensification routes is filed in this evidence base, so the choice is made on toxicity profile, route and the features that predicted larger benefit within each trial. Chemotherapy intensification suits the patient who can tolerate cytopenias and wants a defined four-cycle burden; the bispecific suits the patient in whom myelosuppression is the greater threat, provided the venous thromboembolism risk is acceptable and prophylaxis can be given. The features that argue for intensifying at all are high disease burden, L858R rather than exon 19 deletion, baseline brain metastases, and <em>TP53</em> co-mutation. Roughly nine extra months of progression-free survival bought with a 36-percentage-point increase in severe toxicity is not a trade every fit patient wants, and osimertinib monotherapy remains a defensible first line.</p>\n<h3>After osimertinib</h3>\n<p>Nearly every patient progresses, and the reason the second-line setting is hard is that resistance is polyclonal with no dominant escape route. In <a class=\"trial-link\" href=\"/evidence/#t-aura3\">AURA3</a>, in patients who progressed on a first- or second-generation TKI and developed T790M, osimertinib improved progression-free survival over platinum–pemetrexed (10.1 vs 4.4 months; HR 0.30, 0.23 to 0.41; P&lt;0.001; response 71% vs 31%), including in the CNS subgroup (8.5 vs 4.2 months; HR 0.32), with fewer grade 3 or higher events (23% vs 47%) (N Engl J Med 2017;376:629-640). Moving osimertinib to first line removed the setting AURA3 addressed, and replaced one resistance mechanism with many. Five strategies now exist, and they map to different patients rather than forming a ladder. Switch the whole regimen. <a class=\"trial-link\" href=\"/evidence/#t-mariposa-2\">MARIPOSA-2</a> was the first phase 3 to improve progression-free survival after osimertinib. Amivantamab plus carboplatin–pemetrexed beat chemotherapy alone (6.3 vs 4.2 months; HR 0.48, 0.36 to 0.64; P&lt;0.001) and the amivantamab–lazertinib–chemotherapy triplet reached 8.3 versus 4.2 months (HR 0.44, 0.35 to 0.56) against the same control, the two experimental arms never having been compared with each other, with intracranial progression-free survival also improved (HR 0.55 and 0.58) (Ann Oncol 2024;35:77-90). Overall survival was immature at interim and the haematologic and EGFR/MET toxicity is heavy. The lazertinib arm buys little over the doublet for a good deal more toxicity, which is the practical reason to prefer amivantamab plus chemotherapy. Keep the backbone. <a class=\"trial-link\" href=\"/evidence/#t-compel\">COMPEL</a> is the mirror image: continue osimertinib and add platinum–pemetrexed after extracranial progression (progression-free survival 8.4 vs 4.4 months; HR 0.43, 0.27 to 0.70; overall survival 15.9 vs 9.8 months, HR 0.71, 0.42 to 1.23), with CNS protection (CNS progression-free survival HR 0.56) (ESMO Open 2025;10:105807). The rationale is that clones behind the blood–brain barrier often remain TKI-sensitive, so abandoning osimertinib forfeits control of them. The trial closed early with 98 patients and reports without formal hypothesis testing, so it is descriptive; it also enrolled a favourable, largely oligoprogressive population. Continue-versus-switch is the defining question of this setting and these two trials map to different patients rather than settling it. Match the mechanism, when there is one to match. <em>MET</em> amplification is the commonest bypass, and it can be hit directly. <a class=\"trial-link\" href=\"/evidence/#t-insight-2\">INSIGHT 2</a> added tepotinib to osimertinib in centrally FISH-confirmed <em>MET</em>-amplified disease after first-line osimertinib: confirmed response 50.0% (95% CI 39.7 to 60.3, 49 of 98), against 8.3% in the internal tepotinib-monotherapy arm, with median progression-free survival 5.6 months, intracranial response 29.2% and grade 3 or higher treatment-related events in 34% (Lancet Oncol 2024;25:989-1002). The 8.3% in the monotherapy arm shows that both drivers must be hit. <a class=\"trial-link\" href=\"/evidence/#t-sachi\">SACHI</a> then made the route randomised, with savolitinib plus osimertinib against chemotherapy in <em>EGFR</em>-mutant, <em>MET</em>-amplified disease after TKI progression (third-generation-TKI-naive population 9.8 vs 5.4 months, HR 0.34, 0.21 to 0.56, P&lt;0.0001; intention-to-treat 8.2 vs 4.5 months, HR 0.34, 0.23 to 0.49), with grade 3 or higher events in 57% of both arms and immature overall survival (Lancet 2026;407:375-387). SACHI&#x27;s primary population had mostly progressed on older TKIs, so the post-osimertinib subgroup is exploratory. Add angiogenesis blockade to immunotherapy. Plain anti-PD-1 fails in <em>EGFR</em>-mutant disease; a bispecific that also blocks VEGF is the exception. <a class=\"trial-link\" href=\"/evidence/#t-harmoni-a\">HARMONi-A</a> added ivonescimab, a PD-1×VEGF bispecific, to carboplatin–pemetrexed after TKI progression in China (progression-free survival 7.1 vs 4.8 months; HR 0.46, 0.34 to 0.62; P&lt;0.001) and, at final analysis, extended overall survival (16.8 vs 14.1 months; HR 0.74, 0.58 to 0.95; P=0.02; 30-month overall survival 29.1% vs 18.4%) (JAMA 2024;332:561-570; JAMA 2026). <a class=\"trial-link\" href=\"/evidence/#t-harmoni\">HARMONi</a> reproduced the progression-free survival effect globally (6.8 vs 4.4 months; HR 0.52) with a positive survival trend, from a WCLC 2025 presentation rather than a full publication. The separate-agent version of the same idea only ever won progression-free survival: <a class=\"trial-link\" href=\"/evidence/#t-attlas-kcsg-lu19-04\">ATTLAS (KCSG-LU19-04)</a> gave atezolizumab, bevacizumab, carboplatin and paclitaxel against pemetrexed–platinum after TKI failure (8.48 vs 5.62 months; HR 0.62, 0.45 to 0.86; P=0.004; response 69.5% vs 41.9%), with deeper benefit at higher PD-L1 (HR 0.47, 0.41 and 0.24 at ≥1%, ≥10% and ≥50%) but flat overall survival (20.6 vs 20.3 months; HR 1.01) (J Clin Oncol 2024;42:1241-1251). Its precursor was the exploratory <em>EGFR</em>-mutant subgroup of <a class=\"trial-link\" href=\"/evidence/#t-impower150\">IMpower150</a>, where atezolizumab helped only when paired with bevacizumab (progression-free survival 9.7 vs 6.1 months, HR 0.59). The single-molecule bispecific improved survival where the four-drug combination did not; HARMONi-A is China-only. Ignore the mechanism entirely and target a surface antigen. In <a class=\"trial-link\" href=\"/evidence/#t-optitrop-lung04\">OptiTROP-Lung04</a>, sacituzumab tirumotecan, a TROP2 antibody–drug conjugate with a belotecan-derived payload, was given as monotherapy against pemetrexed–platinum in <em>EGFR</em>-mutant non-squamous disease after TKI progression (progression-free survival 8.3 vs 4.3 months; HR 0.49, 0.39 to 0.62; overall survival not reached vs 17.4 months; HR 0.60, 0.44 to 0.82; P=0.001; 18-month overall survival 65.8% vs 48.0%), with grade 3 or higher treatment-related events in 58.0% versus 53.8% and no drug-related interstitial lung disease (N Engl J Med 2026;394:13-26). That survival result is an interim analysis in a predominantly Chinese population. It is the first single agent to improve survival in this setting, and the second regimen of any kind after ivonescimab plus chemotherapy. The other TROP2 conjugate gave a different result: <a class=\"trial-link\" href=\"/evidence/#t-tropion-lung01\">TROPION-Lung01</a> tested datopotamab deruxtecan against docetaxel in pretreated disease without actionable alterations, and met progression-free survival (4.4 vs 3.7 months; HR 0.75) but not overall survival (12.9 vs 11.8 months; HR 0.94), with benefit driven by non-squamous histology (J Clin Oncol 2025;43:260-272). The same antigen gave opposite results, and the population is most of the difference: one trial selected for <em>EGFR</em> mutation and the other excluded actionable drivers altogether. The <em>EGFR</em>-specific datopotamab evidence is the single-arm <a class=\"trial-link\" href=\"/evidence/#t-tropion-lung05\">TROPION-Lung05</a> (confirmed response 35.8% overall, 43.6% in <em>EGFR</em> mutations and 49.1% in osimertinib-pretreated sensitising or T790M disease, against 23.5% in <em>ALK</em>; median duration of response 7.0 months, <em>EGFR</em> progression-free survival 5.8 months; adjudicated treatment-related interstitial lung disease 3.6% with one fatal case) (J Clin Oncol 2025;43:1254-1265). A third antigen has now entered: <a class=\"trial-link\" href=\"/evidence/#t-herthena-lung02\">HERTHENA-Lung02</a> tested patritumab deruxtecan, a HER3 conjugate, against platinum chemotherapy after a third-generation TKI (progression-free survival 5.8 vs 5.4 months; HR 0.77, 0.63 to 0.94; P=0.011; response 35.2% vs 25.3%; intracranial progression-free survival 5.4 vs 4.2 months, HR 0.75), with immature overall survival and publication so far only as an ASCO 2025 abstract (J Clin Oncol 2025;43(16_suppl):8506). Sacituzumab tirumotecan is not FDA-approved, and a global confirmatory trial of the same design is running. Two smaller situations complete the picture.</p>\n<ul><li>In-<em>trans</em> C797S, meaning C797S and T790M on different alleles, retains sensitivity to a first-generation TKI, so osimertinib can be combined with gefitinib; in-<em>cis</em> C797S does not.</li><li>Leptomeningeal-only progression is treated with steroids and radiotherapy plus osimertinib escalated to 160 mg daily, on the strength of the phase 1 BLOOM study (leptomeningeal response 62%, duration of response 15 months, progression-free survival 8.6 months, overall survival 11 months).</li></ul>\n<h3>Exon 20 insertions</h3>\n<p>Here the <em>EGFR</em> alteration is one the standard inhibitors cannot reach. The insertion rigidifies the kinase-active site and shrinks the drug-binding pocket, so classical TKIs including osimertinib largely cannot bind, and the disease defaulted to chemotherapy until purpose-built agents arrived. Two first-line options now beat chemotherapy by two different mechanisms. <a class=\"trial-link\" href=\"/evidence/#t-papillon\">PAPILLON</a> added amivantamab to carboplatin–pemetrexed (progression-free survival 11.4 vs 6.7 months; HR 0.40, 0.30 to 0.53; P&lt;0.001; response 73% vs 47%), with interim overall survival favouring the combination at 33% maturity (HR 0.67, 0.42 to 1.09) (N Engl J Med 2023;389:2039-2051). Amivantamab works because it binds the receptor extracellularly, sidestepping the pocket that defeats a TKI. <a class=\"trial-link\" href=\"/evidence/#t-wu-kong28\">WU-KONG28</a> took the oral route with sunvozertinib, an exon20ins-selective TKI, against carboplatin–pemetrexed (progression-free survival 10.3 vs 7.5 months; HR 0.65, 0.50 to 0.85; P&lt;0.001; confirmed response 58.9% vs 31.1%; duration of response 11.2 vs 7.1 months), with immature and flat overall survival (HR 0.99) (N Engl J Med 2026, online ahead of print). The two are not cleanly rankable: both used carboplatin–pemetrexed as the control, but that same regimen performed differently in the two trials (6.7 vs 7.5 months), so the hazard ratios overstate the gap while the absolute medians sit close together. The real choice is amivantamab&#x27;s deeper response against its intravenous, chemotherapy-containing burden, versus sunvozertinib&#x27;s convenience. One axis remains unmeasured: WU-KONG28 does not establish CNS activity for sunvozertinib, because few patients entered with brain metastases and every brain lesion had already been irradiated.</p>\n<h3>Uncommon sensitising mutations</h3>\n<p>G719X, L861Q, S768I, compound mutations and rarer kinase-domain variants make up a substantial minority of <em>EGFR</em>-mutant disease. Unlike exon 20 insertions they are TKI-responsive, but the generational ranking inverts: the broad second-generation pan-HER inhibitor covers this heterogeneous group better than the mutant-selective third-generation drug. The structural reason is set out in <a class=\"trial-link\" href=\"/evidence/#t-robichaux-et-al-structure-based-egfr-classification\">Robichaux et al. (structure-based EGFR classification)</a>, a retrospective structure-function study across 16,715 patients that replaced exon-based grouping with four structural classes (classical-like, T790M-like, exon20ins-loop, and PACC, meaning P-loop and αC-helix-compressing). PACC mutations such as G719X and S768I reached a time-to-treatment-failure of 21.7 months on second-generation TKIs against 10.0 on first-generation and 4.1 on third-generation agents (HR 0.23 for second versus third, P&lt;0.0001) (Nature 2021;597:732-737). Breadth beats selectivity here, which is the opposite of the classical-mutation rule. <a class=\"trial-link\" href=\"/evidence/#t-achilles-torg1834\">ACHILLES/TORG1834</a> is the first randomised trial in this population. Afatinib beat platinum–pemetrexed on progression-free survival (10.6 vs 5.7 months; HR 0.421, 0.251 to 0.706; P=0.0010) and was stopped early at interim on the data monitoring committee&#x27;s recommendation; response was consistent across major uncommon (55.8%), compound (72.7%) and other (60.0%) subtypes, 61.7% overall (J Clin Oncol 2025;43:2049-2058). The osimertinib counterparts are uncontrolled. <a class=\"trial-link\" href=\"/evidence/#t-unicorn-okuma\">UNICORN (Okuma)</a> gave first-line osimertinib (response 55.0%, 90% CI 40.9 to 68.5; disease control 90.0%; progression-free survival 9.4 months; duration of response 22.7 months; compound-mutation response 66.7% against 45.5% for solitary mutations) (JAMA Oncol 2024;10:43-51), and <a class=\"trial-link\" href=\"/evidence/#t-kcsg-lu15-09-cho\">KCSG-LU15-09 (Cho)</a> did the same across mixed lines (response 50%, 18 of 36; progression-free survival 8.2 months; duration of response 11.2 months), with response tracking structural class: 78% on classical-like L861Q against 53% on G719X and 38% on S768I (J Clin Oncol 2020;38:488-495). The foundational afatinib data are the pooled <a class=\"trial-link\" href=\"/evidence/#t-lux-lung-2-3-6-pooled-yang\">LUX-Lung 2/3/6 pooled (Yang)</a> analysis, which split uncommon mutations into three groups and found the activity concentrated in the first: sensitising point mutations gave a 71.1% response with 10.7 months progression-free survival and 19.4 months overall survival, against 14.3% and 8.7% for de-novo T790M and exon 20 insertions, which were relatively afatinib-resistant rather than wholly unresponsive (Lancet Oncol 2015;16:830-838). A third, more intensive option exists. <a class=\"trial-link\" href=\"/evidence/#t-chrysalis-2-cohort-c-tomasini\">CHRYSALIS-2 Cohort C (Tomasini)</a> gave amivantamab plus lazertinib in atypical <em>EGFR</em> disease with up to two prior lines (confirmed response 52%, 95% CI 42 to 62; duration of response 14.1 months; progression-free survival 11.1 months; overall survival not estimable), with predominantly grade 1–2 toxicity (J Clin Oncol 2026;44:54-65). No head-to-head exists among any of these, and the UNICORN authors judge a randomised osimertinib-versus-afatinib study unlikely. What the mutation-level data support is a default rather than an algorithm: L861Q to osimertinib, G719X to afatinib, and compound mutations doing well on either. Solitary S768I leans to osimertinib despite sitting in the PACC class, and it is the exception that shows the structural rule cannot be run mechanically: afatinib responded in none of three solitary-S768I patients in ACHILLES, while UNICORN&#x27;s S768I response rate was 50%. Where the mutation does not decide, brain metastases and tolerability do, with osimertinib preferred for CNS penetration and gentler handling and afatinib preferred when a randomised, chemotherapy-controlled evidence base matters. Amivantamab–lazertinib is the escalation when the single-agent match is poor rather than a first reach, because its evidence tier is lowest and its toxicity heaviest.</p>\n<h2 id=\"s-alk-positive-disease\">ALK-positive disease</h2>\n<p>ALK development followed the same pattern as EGFR, one generation behind, and every first-line trial shares one comparator. In <a class=\"trial-link\" href=\"/evidence/#t-profile-1014\">PROFILE 1014</a>, crizotinib improved independent-review progression-free survival over platinum–pemetrexed (10.9 vs 7.0 months; HR 0.45, 0.35 to 0.60; P&lt;0.001) and response (74% vs 45%; P&lt;0.001), with overall survival immature and non-significant (HR 0.82; P=0.36) against 70% crossover, and grade 3–4 aminotransferase elevation in 14% versus 2% (N Engl J Med 2014;371:2167-2177). Two second-generation drugs then displaced it independently. <a class=\"trial-link\" href=\"/evidence/#t-alex\">ALEX</a> showed alectinib beat crizotinib on investigator-assessed progression-free survival (HR 0.47, 0.34 to 0.65; P&lt;0.001; independent-review median 25.7 vs 10.4 months) and on CNS control: CNS progression occurred in 12% versus 45% (cause-specific HR 0.16, 0.10 to 0.28; P&lt;0.001), and grade 3–5 adverse events were 41% versus 50% at primary analysis. Final overall survival was 81.1 versus 54.2 months (HR 0.78, 0.56 to 1.08; P=0.13), directionally strong but not significant, because the trial was never powered for survival and the crizotinib arm was rescued with the whole modern class at progression (N Engl J Med 2017;377:829-838; Ann Oncol 2026;37:92-103). <a class=\"trial-link\" href=\"/evidence/#t-alta-1l\">ALTA-1L</a> reached almost the same place with brigatinib: blinded independent central review progression-free survival at first interim (12-month 67% vs 43%; HR 0.49, 0.33 to 0.74; P&lt;0.001) and intracranial response in measurable brain metastases of 78% versus 29%, with grade 3–5 events in 61% versus 55% and early-onset interstitial lung disease or pneumonitis in 3% against 0% (N Engl J Med 2018;379:2027-2039). On longer follow-up the median progression-free survival was 24.0 versus 11.1 months (HR 0.48). Brigatinib&#x27;s distinctive handling is a seven-day 90 mg lead-in before 180 mg daily, which exists precisely because of those early pulmonary events. In <a class=\"trial-link\" href=\"/evidence/#t-crown\">CROWN</a>, lorlatinib improved blinded independent central review progression-free survival over crizotinib at primary analysis (HR 0.28, 0.19 to 0.41; P&lt;0.001), and at the post-hoc seven-year update investigator progression-free survival remained unreached against 9.1 months (HR 0.19, 0.13 to 0.26), with 55% of patients progression-free at seven years against 3% on crizotinib, and no new intracranial progression after 30 months; overall survival remained immature. Grade 3–4 adverse events were 77% versus 57%, driven largely by hyperlipidaemia and weight gain (N Engl J Med 2020;383:2018-2029; Ann Oncol 2026). Lorlatinib retains activity against G1202R and the compound mutations the second generation misses, and on first-line use no new <em>ALK</em> resistance mutations were detected. The next-generation agents cannot be ranked: alectinib, brigatinib and lorlatinib were each randomised only against crizotinib and never against each other. Lorlatinib&#x27;s figures are the highest reported, but that is not proven superiority, and its neurocognitive and metabolic toxicity is a cost the second generation does not carry. Two practical points sit alongside the efficacy.</p>\n<ul><li>Lorlatinib is a CYP3A inducer that accelerates atorvastatin metabolism, so a non-CYP3A statin such as rosuvastatin or pravastatin should be used.</li><li>Alectinib&#x27;s characteristic problems are myalgia, anaemia and transaminitis; brigatinib&#x27;s are a raised creatine kinase without myalgia and hypertension.</li></ul>\n<h2 id=\"s-ros1-positive-disease\">ROS1-positive disease</h2>\n<p><a class=\"trial-link\" href=\"/evidence/#t-profile-1001-ros1-cohort\">PROFILE 1001 (ROS1 cohort)</a> established the target, with crizotinib producing a 72% response and 19.2 months progression-free survival in ROS1-rearranged NSCLC (N Engl J Med 2014;371:1963-1971). Every trial in this compartment is single-arm, with no comparator and no hazard ratio, so the response rates that follow are read against historical expectation rather than against a control. Two later agents displaced crizotinib on CNS grounds. <a class=\"trial-link\" href=\"/evidence/#t-entrectinib-integrated-alka-startrk\">Entrectinib (integrated ALKA/STARTRK)</a> gave a response rate of roughly 77% in TKI-naive disease with strong intracranial activity and long progression-free survival (Lancet Oncol 2020;21:261-270), and <a class=\"trial-link\" href=\"/evidence/#t-trident-1\">TRIDENT-1</a> showed repotrectinib producing durable responses in the TKI-naive setting (response 79%, progression-free survival 35.7 months) with activity against the G2032R solvent-front resistance mutation and against brain metastases (N Engl J Med 2024;390:118-131). Taletrectinib is a second next-generation option on the same single-arm footing (TRUST-I and TRUST-II: first-line progression-free survival 45.6 months and response 89%; after a first-generation TKI, 9.7 months and 56%). Lorlatinib retains ROS1 activity and is an option after crizotinib (progression-free survival 8.5 months, response 35% post-crizotinib). A next-generation, CNS-penetrant, G2032R-active agent is the first choice, and crizotinib is now hard to justify first-line.</p>\n<h2 id=\"s-ret-fusion-positive-disease\">RET fusion-positive disease</h2>\n<p><a class=\"trial-link\" href=\"/evidence/#t-libretto-431\">LIBRETTO-431</a> made a RET-selective TKI first-line standard. Selpercatinib roughly doubled progression-free survival against platinum–pemetrexed with or without pembrolizumab (24.8 vs 11.2 months; HR 0.46) with an 84% response rate and superior intracranial control (N Engl J Med 2023;389:1839-1850). That is a preplanned interim analysis, made after 98 of the 140 planned events and assessed against a nominal two-sided boundary of 0.012 rather than 0.05. The primary analysis population was not everyone randomised: it was the 212 patients whose physicians had planned, before randomisation, to give pembrolizumab if the patient were assigned to the control arm, so the comparator that mattered was chemo-immunotherapy rather than chemotherapy alone. Response was 84% in that population and in the full randomised set alike. Within the prespecified CNS population of 192 patients, the cause-specific hazard ratio for time to CNS progression was 0.28 (95% CI 0.12 to 0.68), first CNS progression occurred in 8 patients (7%) versus 13 (18%), and the 12-month cumulative incidence of CNS progression with competing-risk adjustment was 6% versus 20%. Among the 29 patients with measurable brain metastases at baseline, intracranial response was 82% (95% CI 57 to 96) with selpercatinib against 58% (28 to 85) with control, on 17 and 12 patients respectively, so the intervals overlap heavily and no comparative claim is supportable from them. Overall survival is immature and confounded by crossover, so the standard rests on progression-free survival and disease control, not on a proven survival benefit. <a class=\"trial-link\" href=\"/evidence/#t-acceleret-lung\">AcceleRET Lung</a> gave pralsetinib its first randomised first-line data and sits at a materially lower evidence tier. Pralsetinib improved progression-free survival over histology-based platinum chemotherapy with or without pembrolizumab (18.7 vs 9.0 months; HR 0.59) with higher response (65.5% vs 41.6%) and longer duration of response (20.6 vs 9.7 months), at the cost of more infection (71.3% vs 51.9%; opportunistic 9.3% vs 1.0%) and eight infection-related deaths against none. Overall survival showed no significant difference (not reached vs 39.8 months; HR 1.09), with optional crossover to a RET inhibitor at progression. The trial was terminated early in January 2025 by sponsor decision for organisational and commercial reasons rather than for efficacy or safety, and it is filed only as a conference abstract (J Clin Oncol 2026;44(suppl 16):8504). The 18.7 and 24.8-month medians do not rank the two drugs: LIBRETTO-431&#x27;s progression-free survival was assessed by blinded independent central review, AcceleRET Lung&#x27;s by investigators, and investigator assessment in an open-label trial is the more permissive measurement. A lower evidence tier, early termination and an unreported control-arm pembrolizumab fraction mean the two numbers are not comparable. Selpercatinib is the standard because it has the higher-tier trial, not because its median is larger. Selpercatinib&#x27;s characteristic toxicities are transaminitis, hypertension, diarrhoea, oedema, dry mouth and QTc prolongation, with a distinctive hypersensitivity syndrome (maculopapular rash, fever, arthralgia, thrombocytopenia, raised transaminases, hypotension, tachycardia, raised creatinine) managed by holding the drug, starting steroids and rechallenging at a reduced dose. Pralsetinib adds neutropenia, lymphopenia and pneumonitis.</p>\n<h2 id=\"s-met-exon-14-skipping\">MET exon 14 skipping</h2>\n<p>This standard was established without a randomised trial. Both anchoring studies are single-arm phase 2, with no comparator and no hazard ratio. <a class=\"trial-link\" href=\"/evidence/#t-geometry-mono-1\">GEOMETRY mono-1</a> tested capmatinib by line of therapy, and the cohort split matters. In treatment-naive exon 14-skipping disease (cohort 5b, n=28) the independent-review response rate was 68% (95% CI 48 to 84) with disease control 96%, median duration of response 12.6 months and median progression-free survival 12.4 months. In previously treated disease (cohort 4, n=69) response was 41% (29 to 53), disease control 78%, duration of response 9.7 months and progression-free survival 5.4 months (N Engl J Med 2020;383:944-957). The naive-versus-treated gap is large and its cause is unexplained; the authors point to the small cohorts and the overlapping confidence intervals (48 to 84 against 29 to 53). It argues for using the drug early without being a randomised sequencing result. VISION complicates rather than confirms that reading: tepotinib produced durable responses (response roughly 46%) regardless of line (N Engl J Med 2020;383:931-943). Neither trial randomised sequencing, so the &quot;use it first-line&quot; argument rests on GEOMETRY&#x27;s within-trial contrast alone. The same trial supplies the empirical basis for treating <em>MET</em> amplification as a different disease. Response graded with gene copy number and was weaker throughout: 29% in previously treated and 40% in treatment-naive disease at copy number ≥10, and 12%, 9% and 7% in the copy-number 6–9, 4–5 and &lt;4 cohorts, the last three closed for futility. Tepotinib in de novo <em>MET</em>-amplified disease is likewise modest (VISION cohort B: median progression-free survival 4.2 months, response 71.4% first-line falling to 27.3% second-line). c-MET overexpression is a third entity again, addressed by the antibody–drug conjugate telisotuzumab vedotin (LUMINOSITY: response 34.6%, progression-free survival 5.5 months, overall survival 14.6 months), with peripheral neuropathy, oedema and pneumonitis as its signature. MET exon 14-skipping disease belongs with the immunotherapy-cold drivers and not with KRAS G12C, and PD-L1 does not predict benefit here: expression is frequently high, tumour mutational burden is low, and single-agent immunotherapy underperforms. Route these patients to the MET inhibitor rather than to chemo-immunotherapy. Both drugs share the same class toxicity, peripheral oedema dominant, with gastrointestinal effects and a transporter-mediated creatinine rise that is not renal injury.</p>\n<h2 id=\"s-braf-v600e\">BRAF V600E</h2>\n<p><a class=\"trial-link\" href=\"/evidence/#t-dabrafenib-trametinib-brf113928\">Dabrafenib + trametinib (BRF113928)</a> enrolled 36 previously untreated patients. Investigator-assessed confirmed response was 64% (95% CI 46 to 79), meeting the protocol&#x27;s 60% target, with identical response on independent review, median duration of response 10.4 months, median progression-free survival 10.9 months (14.6 months on independent review) and median overall survival 24.6 months with 47% of patients having died (Lancet Oncol 2017;18:1307-1316). Grade 3 or 4 adverse events occurred in 69%, most commonly pyrexia, alanine aminotransferase elevation and hypertension, with permanent discontinuation in 22%. The combination is used rather than a single agent for two reasons. Mechanistically, V600E activates BRAF as a monomer and the pathway reactivates downstream of a BRAF inhibitor alone, so blocking MEK at the next node suppresses that reactivation. The empirical support is an indirect comparison across this trial&#x27;s earlier cohorts, reported in prior publications rather than generated here: response was 67% with the doublet against 33% with dabrafenib monotherapy in previously treated patients, with no test and no randomisation between them. Those figures belong to the earlier cohort reports, not to the first-line cohort described here. The same 2017 paper&#x27;s Discussion puts the previously treated doublet cohort at 63% rather than 67% and does not reconcile the two, so the direction of the gap is firmer than its size. The second reason concerns toxicity: BRAF inhibitors paradoxically activate MAPK signalling in <em>BRAF</em> wild-type keratinocytes, driving cutaneous squamous-cell carcinomas, and the MEK inhibitor blocks that, so the doublet causes fewer secondary skin cancers than the single agent. The doublet causes pyrexia instead. Encorafenib plus binimetinib is a second doublet on the same single-arm footing (PHAROS: first-line response 75%, progression-free survival 30.2 months; after prior therapy 46% and 9.3 months). The immunotherapy position here is unresolved. Unlike the never-smoker-enriched drivers, <em>BRAF</em> V600E NSCLC occurs across smoking histories, so it carries neither the phenotype that predicts immunotherapy resistance nor the high mutational load that predicts response, and no trial has randomised the doublet against immunotherapy. Test for <em>BRAF</em> at diagnosis so the patient can be routed to a first-line-capable targeted option.</p>\n<h2 id=\"s-her2-erbb2-altered-disease\">HER2 (ERBB2)-altered disease</h2>\n<p>The actionable lesion here is a mutation, not overexpression or amplification, which makes lung HER2 structurally closer to the <em>EGFR</em> exon 20 branch than to the expression-driven logic of breast and gastric disease. Two modalities work, and all four anchoring trials are single-arm or dose-comparative with no comparator against standard therapy. <a class=\"trial-link\" href=\"/evidence/#t-destiny-lung01\">DESTINY-Lung01</a> established the antibody–drug conjugate, with trastuzumab deruxtecan at 6.4 mg/kg achieving a 55% response and 8.2 months progression-free survival in pretreated <em>HER2</em>-mutant disease (N Engl J Med 2022;386:241-251). <a class=\"trial-link\" href=\"/evidence/#t-destiny-lung02\">DESTINY-Lung02</a> then set the dose, with a confirmed 49.0% response at 5.4 mg/kg and a more favourable safety profile than 6.4 mg/kg (J Clin Oncol 2023;41:4852-4863). The dose was chosen on toxicity, because interstitial lung disease was markedly less frequent at the lower dose, while the efficacy point estimates numerically favoured the higher one. Two oral HER2-selective TKIs followed. <a class=\"trial-link\" href=\"/evidence/#t-beamion-lung-1-zongertinib\">Beamion LUNG-1 (zongertinib)</a> reported a confirmed 71% response (complete response 7%) with median duration of response 14.1 months and progression-free survival 12.4 months (N Engl J Med 2025;392:2321-2333), and <a class=\"trial-link\" href=\"/evidence/#t-soho-01-sevabertinib\">SOHO-01 (sevabertinib)</a> a confirmed 64% response with duration of response 9.2 months and progression-free survival 8.3 months (N Engl J Med 2025;393:1819-1832). Both hold FDA accelerated approval. Their toxicities differ in kind: zongertinib&#x27;s dose-limiting problem is hepatic, sevabertinib&#x27;s gastrointestinal, and both are notably free of the EGFR-class rash that the non-selective inhibitors cause. Both conjugate trials report adjudicated drug-related interstitial lung disease at a substantial rate with fatal cases, while both TKI trials report none. That comparison is not measured the same way, and the difference may be methodological: both DESTINY-Lung trials used a formal independent ILD adjudication committee that demonstrably changed outcomes, and neither TKI trial describes any independent pulmonary-toxicity adjudication. An unadjudicated zero and an adjudicated rate are different measurements, and this is the most consequential open question in the compartment because it is what a treatment decision would turn on. Check the ILD rates before consenting a patient. Sequence is unestablished in both directions. Both oral agents show activity after a HER2 conjugate, at a lower response rate than in conjugate-naive patients, and because neither trial has a comparator arm the supportable claim is observed activity after prior exposure rather than preserved activity. Whether a conjugate works after a TKI is untested, because DESTINY-Lung01 excluded prior HER2-directed exposure by design.</p>\n<h2 id=\"s-kras-g12c\">KRAS G12C</h2>\n<p>The oncogene-addicted pattern breaks here. <em>KRAS</em> G12C NSCLC is smoking-associated, carries a high mutational load, frequently expresses PD-L1 and responds to immunotherapy. So the first-line standard is not the targeted drug: it is the same chemo-immunotherapy backbone used for driver-negative disease, and the matched inhibitor is held for second line. Both registration trials enrolled patients already treated with platinum chemotherapy and a checkpoint inhibitor, so they test the drug at second line by construction. The adagrasib trial states that eligibility explicitly; the sotorasib trial&#x27;s population is recorded only as pretreated. <a class=\"trial-link\" href=\"/evidence/#t-codebreak-200\">CodeBreaK 200</a> showed sotorasib improving progression-free survival over docetaxel (5.6 vs 4.5 months; HR 0.66) with better tolerability and response (Lancet 2023;401:733-746). Overall survival was not improved and cannot be interpreted (HR 1.01; medians 10.6 vs 11.3 months), because the trial was underpowered for survival after a sample-size amendment, crossover was extensive, and open-label dropout loaded the docetaxel arm with poorer-prognosis patients. <a class=\"trial-link\" href=\"/evidence/#t-krystal-12-adagrasib\">KRYSTAL-12 (adagrasib)</a> reproduced the pattern (progression-free survival 5.5 vs 3.8 months; HR 0.58; response 32% vs 9%) with demonstrated CNS activity (Lancet 2025;406:615-626). Read these as a contrast, not a ranking. The two drugs were never randomised against each other, and the trials agree closely on the experimental arms while their docetaxel arms differ (3.8 vs 4.5 months), so the gap between the hazard ratios lives in the comparators as much as in the drugs. The drugs differ qualitatively. Adagrasib is brain-penetrant and measured intracranial activity prospectively (40% vs 11% in patients with measurable CNS lesions), and it is reported to be the only KRAS G12C inhibitor with activity against untreated brain metastases. Their toxicity profiles differ: adagrasib is gastrointestinal-heavy with transaminitis and QT prolongation, sotorasib&#x27;s signature is transaminitis, and sotorasib has clinically awkward interactions, in particular with proton-pump inhibitors and CYP3A4 inducers. The effect is small. Roughly one to two months of median progression-free gain over docetaxel is far less than the deep, durable responses the EGFR, ALK and RET inhibitors produce, and the reason is rapid adaptive and bypass resistance rather than the trial setting alone. That limitation is why the field moved immediately to combinations, and why KRAS G12C is the one driver that has not converted its target into a first-line standard.</p>\n<h2 id=\"s-ntrk-and-nrg1-fusions\">NTRK and NRG1 fusions</h2>\n<p>Both are under 1% of NSCLC and both are treated tumour-agnostically. Larotrectinib produced a 79% response with 28.3 months progression-free survival and 44.4 months overall survival across TRK fusion cancers, and entrectinib and repotrectinib are alternatives with the ROS1 data noted above. For <em>NRG1</em> fusions, zenocutuzumab, a HER2×HER3 bispecific, gave a 29% response with 6.8 months progression-free survival in the eNRGy study and holds accelerated approval. The practical point is not the figures but the testing: both fusions are best found by RNA-based sequencing, which a DNA-only panel will miss.</p>\n<h2 id=\"s-driver-negative-disease-first-line\">Driver-negative disease: first line</h2>\n<p>Once actionable drivers are excluded, treatment is organised by PD-L1 tier crossed with strategy, a matrix rather than a ladder. No trial randomises monotherapy against chemo-immunotherapy against dual checkpoint blockade in any tier, so every cross-strategy comparison below is indirect. Most of these trials also ran against chemotherapy alone, which is no longer the alternative a patient actually faces.</p>\n<h3>High PD-L1: the one tier where a single agent is enough</h3>\n<p><a class=\"trial-link\" href=\"/evidence/#t-keynote-024\">KEYNOTE-024</a> established pembrolizumab monotherapy at a tumour proportion score of 50% or more. It improved blinded independent central review progression-free survival over platinum doublet (10.3 vs 6.0 months; HR 0.50, 0.37 to 0.68; P&lt;0.001), and at five years overall survival was 31.9% versus 16.3% (median 26.3 vs 13.4 months; HR 0.62, 0.48 to 0.81), with grade 3–5 treatment-related adverse events in 31.2% versus 53.3% at that cut (N Engl J Med 2016;375:1823-1833; J Clin Oncol 2021;39:2339-2349). Two features of that five-year publication qualify it. No alpha was assigned to the analysis, so its figures are updated estimates of prespecified endpoints rather than freshly tested results; and blinded central review was discontinued after the second interim analysis, so its progression-free survival and response figures are investigator-assessed, which is why they differ from the primary. Sixty-six per cent of the chemotherapy arm eventually received anti-PD-(L)1 therapy, so the survival separation is a comparison of sequences rather than of drugs. Thirty-nine patients completed 35 cycles, approximately two years of pembrolizumab, and of those 81.4% (95% CI 64.7 to 90.7) were alive 36 months after completing treatment, which the paper glosses as roughly five years from randomisation (J Clin Oncol 2021;39:2339-2349). That figure is not comparable with the 31.9% five-year rate above, because the clock starts at a different point and because reaching 35 cycles requires surviving two years without progression in the first place. It describes who did well; it does not predict who will. <a class=\"trial-link\" href=\"/evidence/#t-keynote-042\">KEYNOTE-042</a> broadened the label to a score of 1% or more but showed most of the effect stays at the high tier: overall survival improved in the nested ≥1% population (16.7 vs 12.1 months; HR 0.81, 0.71 to 0.93; P=0.0018), while the prespecified exploratory 1–49% subgroup was not clearly improved (HR 0.92, 0.77 to 1.11; five-year HR 0.88, 0.75 to 1.04), with grade 3–5 treatment-related events in 18% versus 41% (Lancet 2019;393:1819-1830). <a class=\"trial-link\" href=\"/evidence/#t-impower110\">IMpower110</a> is the atezolizumab counterpart, with median overall survival 20.2 versus 13.1 months in the PD-L1-high wild-type subgroup (HR 0.59, P=0.01) and grade 3–4 events in 30.1% versus 52.5% (N Engl J Med 2020;383:1328-1339). Cemiplimab is a third single agent on the same footing (EMPOWER-Lung 1: overall survival 26.1 vs 13.3 months, HR 0.57; progression-free survival 8.1 vs 5.3 months, HR 0.51). Whether to add chemotherapy at high expression has been addressed indirectly. <a class=\"trial-link\" href=\"/evidence/#t-di-federico-high-pd-l1-meta-analysis\">Di Federico high-PD-L1 meta-analysis</a> pooled 24 phase 3 trials and 5,546 patients with high PD-L1 and compared the two strategies indirectly. The formal test for subgroup differences favoured chemo-immunotherapy for overall survival (P=.04), as did meta-regression (HR 0.85, 0.72 to 1.00) and, for progression-free survival, meta-regression (HR 0.61, 0.50 to 0.75). Reconstructed individual patient data pointed the same way: median overall survival 29.2 versus 19.8 months (HR 0.74, 0.66 to 0.82) and median progression-free survival 11.3 versus 6.8 months (HR 0.67, 0.60 to 0.75), at greater treatment-related toxicity (JAMA Oncol 2026;12:753-761). Four qualifications travel with it.</p>\n<ul><li>No included trial randomised the two strategies against each other, so this is indirect throughout.</li><li>The individual patient data were reconstructed from published curves rather than obtained.</li><li>No p-value in the analysis carries multiplicity adjustment.</li><li>The safety comparison was made in the overall trial populations rather than in the PD-L1-high subgroup, because most trials did not report safety by expression level.</li></ul>\n<p>The authors&#x27; own conclusion is that combination therapy should be considered and that prospective randomised confirmation is needed. The signal shifts the default toward adding chemotherapy for a high expresser with bulky or rapidly progressing disease, and gives no basis for withdrawing monotherapy from the patient who wants the lower-toxicity option.</p>\n<h3>Chemo-immunotherapy: the backbone below the high tier</h3>\n<p><a class=\"trial-link\" href=\"/evidence/#t-keynote-189\">KEYNOTE-189</a> established the non-squamous backbone. Pembrolizumab added to pemetrexed–platinum improved overall survival at first interim (HR 0.49, 0.38 to 0.64; P&lt;0.001) and progression-free survival (8.8 vs 4.9 months; HR 0.52, 0.43 to 0.64; P&lt;0.001), including in PD-L1-negative disease (overall survival HR 0.59, 0.38 to 0.92). Five-year overall survival was 19.4% versus 11.3% (HR 0.60, 0.50 to 0.72), with grade 3 or higher adverse events in 67.2% versus 65.8% (N Engl J Med 2018;378:2078-2092; J Clin Oncol 2023;41:1992-1998). Adding a checkpoint inhibitor to chemotherapy costs almost nothing in high-grade toxicity, unlike adding chemotherapy to a checkpoint inhibitor. <a class=\"trial-link\" href=\"/evidence/#t-keynote-407\">KEYNOTE-407</a> did the same for squamous disease (overall survival 15.9 vs 11.3 months; HR 0.64, 0.49 to 0.85; P&lt;0.001; progression-free survival 6.4 vs 4.8 months; HR 0.56, 0.45 to 0.70; five-year overall survival 18.4% vs 9.7%, HR 0.71; grade ≥3 adverse events 69.8% vs 68.2%) (N Engl J Med 2018;379:2040-2051). Its PD-L1-negative survival signal weakened with maturation, which is the one place the two histology trials diverge. The class replicates but not uniformly. <a class=\"trial-link\" href=\"/evidence/#t-pod1um-304\">POD1UM-304</a> reproduced the effect with retifanlimab across histologies (overall survival 18.1 vs 13.4 months; HR 0.75, 0.60 to 0.93; P=0.0042; progression-free survival 7.7 vs 5.5 months; HR 0.64; response 52% vs 39%), while leaving PD-L1-negative survival unproven (HR 1.02, 0.69 to 1.48) (Lancet Respir Med 2025;13:1096-1107). <a class=\"trial-link\" href=\"/evidence/#t-impower132\">IMpower132</a> is a counter-example: it met its co-primary progression-free survival endpoint (7.6 vs 5.2 months; HR 0.60, 0.49 to 0.72; P&lt;0.0001) but missed co-primary overall survival (17.5 vs 13.6 months; HR 0.86, 0.71 to 1.06; P=0.1546), plausibly because 46% of the control arm received subsequent immunotherapy against 6% in the experimental arm (J Thorac Oncol 2021;16:653-664). <a class=\"trial-link\" href=\"/evidence/#t-impower130\">IMpower130</a> was positive on both (overall survival 18.6 vs 13.9 months; HR 0.79, P=0.033; progression-free survival 7.0 vs 5.5 months; HR 0.64, P&lt;0.0001) (Lancet Oncol 2019;20:924-937). IMpower150 added bevacizumab to atezolizumab and carboplatin–paclitaxel and improved overall survival and progression-free survival, with activity in the <em>EGFR</em>/<em>ALK</em>-altered and liver-metastasis subgroups that the other regimens did not test (N Engl J Med 2018;378:2288-2301). Two Chinese trials complete the class, <a class=\"trial-link\" href=\"/evidence/#t-rationale-304\">RATIONALE-304</a> in non-squamous disease (progression-free survival 9.7 vs 7.6 months; HR 0.65; response 57% vs 37%) (J Thorac Oncol 2021;16:1512-1522) and <a class=\"trial-link\" href=\"/evidence/#t-rationale-307\">RATIONALE-307</a> in squamous disease (7.6 vs 5.5 months; HR 0.52 with paclitaxel and 0.48 with nab-paclitaxel) (JAMA Oncol 2021;7:709-717), both regardless of PD-L1.</p>\n<h3>Dual checkpoint blockade</h3>\n<p>Adding CTLA-4 blockade is the other way to reach beyond the high tier, and comes closest to bypassing PD-L1. <a class=\"trial-link\" href=\"/evidence/#t-checkmate-227\">CheckMate 227</a> gave nivolumab plus ipilimumab chemotherapy-free against a platinum doublet, improving overall survival in PD-L1 ≥1% disease (17.1 vs 14.9 months; HR 0.79, 97.72% CI 0.65 to 0.96; P=0.007) with five-year overall survival 24% versus 14%; the descriptive PD-L1 &lt;1% cohort also had durable benefit (five-year overall survival 19% vs 7%; HR 0.65, 0.52 to 0.81), and grade 3–4 treatment-related events were 32.8% versus 36.0% (N Engl J Med 2019;381:2020-2031; J Clin Oncol 2023;41:1200-1212). <a class=\"trial-link\" href=\"/evidence/#t-checkmate-9la\">CheckMate 9LA</a> added two cycles of histology-based chemotherapy to the doublet to cover the early-progression gap that chemo-free dual blockade carries, improving interim overall survival (14.1 vs 10.7 months; HR 0.69, 96.71% CI 0.55 to 0.87; P=0.00065), with four-year overall survival 21% versus 16% (HR 0.74) including in PD-L1 &lt;1% disease (HR 0.66, 0.50 to 0.86), at grade 3–4 treatment-related events of 47% versus 38% (Lancet Oncol 2021;22:198-211; four-year update J Immunother Cancer 2024;12:e008189). <a class=\"trial-link\" href=\"/evidence/#t-poseidon\">POSEIDON</a> added tremelimumab to durvalumab and four cycles of chemotherapy (progression-free survival 6.2 vs 4.8 months; HR 0.72, P=0.0003; overall survival 14.0 vs 11.7 months; HR 0.77, P=0.0030; five-year overall survival 15.7% vs 6.8%, from the 2025 long-term analysis), with grade 3–4 treatment-related events in 51.8% versus 44.4%, the highest of the three dual-blockade regimens; durvalumab–chemotherapy alone improved progression-free survival (HR 0.74; P=0.0009) without reaching significance on overall survival (HR 0.86, 0.72 to 1.02; P=0.0758) (J Clin Oncol 2023;41:1213-1227; J Thorac Oncol 2025;20:76-93). That pattern supports a tremelimumab contribution, but the experimental arms were never formally compared. Below a tumour proportion score of 1%, the strategies agree that a benefit exists and disagree on how secure it is, and the durable end of the spread is concentrated in the nivolumab–ipilimumab backbone, which holds the negative tier whether given chemo-free or with a short induction. POSEIDON&#x27;s three-arm design would supply the attribution, since only its tremelimumab-containing arm met overall survival, but its PD-L1-negative results are not available. The CTLA-4 hypothesis reappears in the immunologically cold <em>STK11</em>- and <em>KEAP1</em>-mutant subgroups, where an exploratory POSEIDON signal suggests CTLA-4 blockade recovers benefit that PD-(L)1 blockade alone does not. These patients derive less benefit from single-agent immunotherapy plus chemotherapy, and dual checkpoint blockade with a doublet is preferred. It is a hypothesis with an exploratory signal behind it, not a validated selector, and the confirmatory trial is pending.</p>\n<h3>The chemotherapy backbone, and maintenance</h3>\n<p>Carboplatin is generally preferred to cisplatin on toxicity grounds, trading cisplatin&#x27;s nephrotoxicity and emesis for more severe thrombocytopenia. Histology sets the partner drug, because pemetrexed underperforms in squamous disease: in Scagliotti&#x27;s non-inferiority trial cisplatin–pemetrexed matched cisplatin–gemcitabine overall (overall survival 10.3 vs 10.3 months, HR 0.94) but was superior in adenocarcinoma and large-cell carcinoma and inferior in squamous-cell carcinoma. <a class=\"trial-link\" href=\"/evidence/#t-paramount\">PARAMOUNT</a> then established continuation maintenance in non-squamous disease. Among patients who completed four cycles of pemetrexed–cisplatin without progression, maintenance pemetrexed improved progression-free survival (4.1 vs 2.8 months from randomisation; HR 0.62, 0.49 to 0.79; P&lt;0.0001) and overall survival (13.9 vs 11.0 months; HR 0.78, 0.64 to 0.96; P=0.0195; one-year survival 58% vs 45%, two-year 32% vs 21%), with grade 3–4 anaemia in 6.4%, neutropenia 5.8% and fatigue 4.7% (Lancet Oncol 2012;13:247-255; J Clin Oncol 2013;31:2895-2902). New objective responses during maintenance were rare, at 3% versus 0.6%: maintenance holds disease control rather than producing new responses.</p>\n<h3>The next wave</h3>\n<p>These trials test whether the pembrolizumab-era control arm can be beaten. <a class=\"trial-link\" href=\"/evidence/#t-harmoni-2\">HARMONi-2</a> showed ivonescimab improving progression-free survival over pembrolizumab in PD-L1-positive disease (11.1 vs 5.8 months; HR 0.51, 0.38 to 0.69; one-sided P&lt;0.0001), consistent at 1–49% (HR 0.54) and ≥50% (HR 0.48), with grade ≥3 treatment-related events of 29% versus 16% and overall survival not yet tested (Lancet 2025;405:839-849). <a class=\"trial-link\" href=\"/evidence/#t-harmoni-6\">HARMONi-6</a> beat an active chemo-immunotherapy control in squamous disease (11.1 vs 6.9 months; HR 0.60, 0.46 to 0.78) with a concordant interim overall survival advantage (27.9 vs 23.7 months; HR 0.66), at grade ≥3 treatment-related events of 64% versus 54% (Lancet 2025;406:2078-2088; Lancet 2026;407:2620-2629). <a class=\"trial-link\" href=\"/evidence/#t-optitrop-lung05\">OptiTROP-Lung05</a> added sacituzumab tirumotecan to pembrolizumab against pembrolizumab alone (progression-free survival not reached vs 5.7 months; HR 0.35, 0.26 to 0.47; P&lt;0.0001; 12-month progression-free survival 62% vs 29%), with grade ≥3 treatment-emergent events of 55% versus 31% and immature overall survival (Lancet 2026;407:2607-2619). <a class=\"trial-link\" href=\"/evidence/#t-campass\">CAMPASS</a> paired benmelstobart with anlotinib against pembrolizumab (11.0 vs 7.1 months; HR 0.70, 0.54 to 0.90; P=0.0057), with the benefit clear at ≥50% (HR 0.60) but not in the exploratory 1–49% subgroup (HR 0.79, 0.57 to 1.11), and grade ≥3 treatment-related events of 59% versus 29%, chiefly hypertension at 26% versus 3% (Lancet Oncol 2026;27:419-431). Read the control arm before the hazard ratio. Three of these four trials used checkpoint monotherapy as the comparator in patients whose global standard below a score of 50% would have been chemo-immunotherapy, so the effect size is measured against a weaker arm than the one a patient faces. All four were run in China, so whether any of these effects transfers unchanged is unresolved. HARMONi-6 still carries most weight, because it alone used active chemo-immunotherapy as the control.</p>\n<h2 id=\"s-second-line-and-beyond-in-driver-negative-disease\">Second line and beyond in driver-negative disease</h2>\n<p>The realistic expectations after progression on chemo-immunotherapy are an overall survival of 8 to 12 months, progression-free survival of 3 to 4 months and a response rate around 10%. Docetaxel is the reference, established against best supportive care and against vinorelbine or ifosfamide, and its 75 mg/m² dose exists because 100 mg/m² was too toxic (Shepherd, TAX320). Pemetrexed matched docetaxel with less toxicity in patients who had not already received it (Hanna, J Clin Oncol 2004). Three randomised trials improve on that floor.</p>\n<ul><li><a class=\"trial-link\" href=\"/evidence/#t-revel\">REVEL</a> added ramucirumab to docetaxel and improved overall survival across histologies (10.5 vs 9.1 months; HR 0.86) and progression-free survival (4.5 vs 3.0 months), at the cost of neutropenia, febrile neutropenia in 16%, fatigue, bleeding and hypertension (Lancet 2014;384:665-673).</li><li><a class=\"trial-link\" href=\"/evidence/#t-east-lc\">EAST-LC</a> showed oral S-1 non-inferior to docetaxel in East Asian patients (overall survival 12.8 vs 12.5 months; HR 0.95) with less haematologic toxicity and better quality of life (Ann Oncol 2017;28:2698-2706), which makes it a reasonable choice where oral therapy matters.</li><li><a class=\"trial-link\" href=\"/evidence/#t-rationale-303\">RATIONALE-303</a> showed tislelizumab beating docetaxel after platinum chemotherapy (16.9 vs 11.9 months; HR 0.66; PD-L1 ≥25%: 19.3 vs 11.5, HR 0.53) regardless of PD-L1 (J Thorac Oncol 2023;18:93-105), a result that applies to patients who did not receive a checkpoint inhibitor first line and is therefore of shrinking relevance.</li></ul>\n<p>TROPION-Lung01&#x27;s TROP2 conjugate met progression-free survival but not overall survival in this setting, with the non-squamous benefit and squamous harm noted above (in squamous disease overall survival was 7.6 versus 9.4 months, HR 1.32). <a class=\"trial-link\" href=\"/evidence/#t-br-21\">BR.21</a> is the historical anchor and should not be applied to modern practice: erlotinib improved overall survival over placebo in unselected, chemotherapy-refractory disease (6.7 vs 4.7 months; HR 0.70; P&lt;0.001) at a time when <em>EGFR</em> mutation was not being tested for (N Engl J Med 2005;353:123-132). Adding an anti-angiogenic to immunotherapy after progression has one positive randomised phase 2 trial and a run of negative phase 3 trials. Lung-MAP S1800A gave pembrolizumab plus ramucirumab against investigator&#x27;s choice after progression on chemo-immunotherapy (overall survival 14.5 vs 11.6 months; HR 0.69; P=0.05) with no progression-free survival difference, while CONTACT-01, LEAP-008 and SAPPHIRE were all negative for survival. One positive randomised phase 2 result against three negative phase 3 trials does not establish a strategy.</p>\n<h2 id=\"s-special-situations\">Special situations</h2>\n<h3>Brain metastases</h3>\n<p>Brain metastases are common enough that CNS activity is now a design axis rather than a subgroup, and in the driver-positive compartments it is often the deciding factor between two otherwise similar drugs. The evidence is strongest in <em>ALK</em>, where alectinib cut CNS progression from 45% to 12% (cause-specific HR 0.16) and lorlatinib produced no new intracranial progression after 30 months. It is nearly as strong in <em>RET</em>, where selpercatinib reduced the 12-month cumulative incidence of CNS progression from 20% to 6%. In <em>EGFR</em>-mutant disease the CNS evidence runs through osimertinib&#x27;s lower CNS progression in FLAURA, the CNS subgroup of AURA3 (8.5 vs 4.2 months, HR 0.32), the intracranial progression-free survival gains of MARIPOSA-2 (HR 0.55 and 0.58) and the CNS protection of COMPEL (HR 0.56). Among the rarer drivers, repotrectinib and entrectinib are the CNS-active ROS1 options, capmatinib produced intracranial responses, and adagrasib is the brain-penetrant KRAS G12C inhibitor. Three practical rules follow.</p>\n<ul><li>Choose the CNS-active agent when brain metastases are present, because in the compartments above where the two can be set side by side, the CNS-active drug also performs at least as well systemically.</li><li>Baseline brain metastases are one of the features that argue for intensifying first-line <em>EGFR</em> therapy rather than for adding radiotherapy first.</li><li>When progression is confined to the brain on an otherwise working TKI, treat it as oligoprogression: give local therapy and continue the systemic agent, since stopping a drug that is still controlling extracranial disease forfeits that control.</li></ul>\n<p>Leptomeningeal disease is covered above for <em>EGFR</em>-mutant disease.</p>\n<h3>Oligometastatic and oligoprogressive disease</h3>\n<p>The randomised evidence here is thin. The best trial in this space is single-arm: adding consolidative radiotherapy to residual disease on first-line osimertinib produced a median progression-free survival of 32.3 months against historical monotherapy benchmarks, with pneumonitis in 5% of 42 patients, one event grade 4. That result is uncontrolled. Local ablative therapy directed at an oligoprogressive site while continuing effective systemic therapy is standard practice and rests on the same reasoning as the brain-only rule above; the question of whether upfront local consolidation improves survival in oligometastatic disease is not answered by any trial in this evidence base.</p>\n<h3>Performance status and frailty</h3>\n<p>The registration trials above enrolled ECOG 0–1 patients almost exclusively, so the patient with a performance status of 2 or worse is being treated by extrapolation. The one trial designed for that population is IPSOS, which randomised 453 patients with stage IIIB–IV NSCLC unsuitable for a platinum doublet, defined as ECOG 2 or worse or age 70 or above with comorbidity or a contraindication, to single-agent atezolizumab or single-agent chemotherapy with gemcitabine or vinorelbine, irrespective of PD-L1. Atezolizumab improved overall survival (10.3 vs 9.2 months; HR 0.78; P=0.028) and response (17% vs 9%) with fewer grade 3–4 treatment-related events (16% vs 33%). The options in a frail patient are therefore best supportive care alone, single-agent chemotherapy, or single-agent immunotherapy, and IPSOS is the reason the third is reasonable. Two cautions belong with that. A poor performance status caused by tumour burden in a driver-positive patient is not a reason to withhold a TKI; it is often the strongest reason to give one, because the response is fast and the toxicity low. Immunotherapy is not a gentle option in every respect: the toxicities are less frequent than chemotherapy&#x27;s but can be permanent, which weighs differently in a patient with limited physiological reserve.</p>\n<h2 id=\"s-references\">References</h2>\n<ol class=\"refs\">\n<li><a class=\"trial-link\" href=\"/evidence/#t-ipass\">IPASS</a>. <a href=\"https://drive.google.com/file/d/1OVmalptGTJgJgKRKDjH_HShC_KdafO3q/preview\">N Engl J Med 2009;361:947-957</a>; <a href=\"https://pubmed.ncbi.nlm.nih.gov/21670455/\">J Clin Oncol 2011;29:2866-2874</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-vision\">VISION</a>. <a href=\"https://drive.google.com/file/d/1Gsli5G1z8hwgaH0YUhz4nL_NHQ3q10j_/preview\">N Engl J Med 2020;383:931-943</a>; <a href=\"https://pubmed.ncbi.nlm.nih.gov/38402853/\">Cancer Sci 2024;115:1296-1305</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-flaura\">FLAURA</a>. <a href=\"https://drive.google.com/file/d/1Xy14SJjoAZ9R56S-fxP4GoHlCXg7uC6S/preview\">N Engl J Med 2018;378:113-125</a>; <a href=\"https://drive.google.com/file/d/1YJYdGdZ51uGGBuffwbDuB2z5uu1McncA/preview\">N Engl J Med 2020;382:41-50</a>; <a href=\"https://drive.google.com/file/d/1ehsFSzmuEzYHzEZBNiYjBgM2UIEAKbRz/preview\">Nat Commun 2023;14:1070</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-lux-lung-3\">LUX-Lung 3</a>. <a href=\"https://drive.google.com/file/d/1BDd-0Z95sHrPQKtbBc1K8-T51ecmS_U4/preview\">J Clin Oncol 2013;31:3327-3334</a>; <a href=\"https://drive.google.com/file/d/1cqNkGgszvfrFAoDL4om-gG8z6UwMLS-k/preview\">Lancet Oncol 2015;16:141-151</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-flaura2\">FLAURA2</a>. <a href=\"https://drive.google.com/file/d/1m_fPFMQEepFcXjRijJtA_qLew10SwLSh/preview\">N Engl J Med 2023;389:1935-1948</a>; <a href=\"https://drive 5\">OptiTROP-Lung05</a>. <a href=\"https://drive.google.com/file/d/1HLCCCnVCAPYhefS0am_0XlqsPg2DOhT8/preview\">Lancet 2026;407:2607-2619</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-campass\">CAMPASS</a>. <a href=\"https://drive.google.com/file/d/1gYfUDHtwY4QdIKHBmN8pzlvOtwjVBbE9/preview\">Lancet Oncol 2026;27:419-431</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-revel\">REVEL</a>. <a href=\"https://drive.google.com/file/d/1gXOxG_oVARe8dPbs041kL3ZCmfz-wcMU/preview\">Lancet 2014;384:665-673</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-east-lc\">EAST-LC</a>. <a href=\"https://drive.google.com/file/d/1zbmvjtNVnO6P7iXF27Rxa8r0pqvfr8xB/preview\">Ann Oncol 2017;28:2698-2706</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-rationale-303\">RATIONALE-303</a>. <a href=\"https://drive.google.com/file/d/1RKMSLsLJaZgUX6A16w_fs0-b8k49dpBp/preview\">J Thorac Oncol 2023;18:93-105</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-br-21\">BR.21</a>. <a href=\"https://drive.google.com/file/d/11GpdxE95jFyPSn0WAQoJAoKHmhLk0kQx/preview\">N Engl J Med 2005;353:123-132</a></li>\n</ol>", "_hay": "nsclc: metastatic disease nsclc-metastatic-disease lung molecular triage comes first egfr-mutant disease alk-positive disease ros1-positive disease ret fusion-positive disease met exon 14 skipping braf v600e her2 (erbb2)-altered disease kras g12c ntrk and nrg1 fusions driver-negative disease: first line second line and beyond in driver-negative disease special situations references classical mutations: what first line now means after osimertinib exon 20 insertions uncommon sensitising mutations high pd-l1: the one tier where a single agent is enough chemo-immunotherapy: the backbone below the high tier dual checkpoint blockade the chemotherapy backbone, and maintenance the next wave brain metastases oligometastatic and oligoprogressive disease performance status and frailty"}, {"id": "lung-small-cell-lung-cancer", "slug": "small-cell-lung-cancer", "group": "Lung", "title": "Small cell lung cancer", "updated": "", "sections": [{"id": "s-biology-and-clinical-behaviour", "h": "Biology and clinical behaviour"}, {"id": "s-staging-and-work-up", "h": "Staging and work-up"}, {"id": "s-limited-stage-disease", "h": "Limited-stage disease"}, {"id": "s-extensive-stage-disease", "h": "Extensive-stage disease"}, {"id": "s-relapsed-disease", "h": "Relapsed disease"}, {"id": "s-small-cell-transformation-of-egfr-mutant-lung-cancer", "h": "Small cell transformation of EGFR-mutant lung cancer"}, {"id": "s-references", "h": "References"}], "html": "<h2 id=\"s-biology-and-clinical-behaviour\">Biology and clinical behaviour</h2>\n<p>Small cell lung cancer is a poorly differentiated neuroendocrine tumour and accounts for approximately 15% of lung cancers. It is almost exclusively a disease of smokers. The doubling time is short and metastases develop early, so the disease is systemic at presentation in most patients even when the imaging looks confined. The recurrent genetic abnormalities are <em>TP53</em> mutation, loss of <em>RB1</em> function and <em>MYC</em> amplification. None of them is actionable: no molecular marker is recommended for treatment selection outside a clinical trial. Genotyping a newly diagnosed small cell tumour changes nothing about first-line therapy, which is the practical difference from non-small cell disease. The typical presentation is cough, breathlessness and weight loss. Disease centres on the central airways, hilum and mediastinal nodes. Haemoptysis and post-obstructive pneumonia are less common than with squamous cell carcinoma, because small cell disease grows submucosally rather than into the lumen. Paraneoplastic syndromes are part of the presentation and occasionally precede it:</p>\n<ul><li>the syndrome of inappropriate antidiuresis;</li><li>Cushing&#x27;s syndrome from ectopic ACTH;</li><li>the Lambert-Eaton myasthenic syndrome.</li></ul>\n<p>Hypercalcaemia is less likely here and is commoner in non-small cell disease.</p>\n<h2 id=\"s-staging-and-work-up\">Staging and work-up</h2>\n<p>Baseline staging is a contrast-enhanced PET-CT and an MRI brain. For clinical stage I disease (T1-2 N0), invasive mediastinal nodal staging is required before resection is offered. Limited-stage disease is defined as disease confined to the ipsilateral hemithorax and its regional nodes that can be encompassed within a safe radiotherapy field. The definition is operational rather than anatomical: the radiotherapy plan settles it, and everything else is extensive stage.</p>\n<h2 id=\"s-limited-stage-disease\">Limited-stage disease</h2>\n<h3>Stage I and the role of surgery</h3>\n<p>For stage I disease, defined as T1-2 N0 up to 5 cm without parietal pleural involvement, ESMO recommends lobectomy followed by adjuvant chemotherapy, with concurrent chemoradiation instead where nodes are involved or resection is R1 or R2. That recommendation predates the consolidation durvalumab data below. No randomised trial has compared surgery plus chemotherapy against chemoradiation alone, and none has compared surgery alone against surgery plus adjuvant chemotherapy. The evidence is retrospective throughout. In the IASLC Lung Cancer Study Project database of more than 8,000 patients, 4% of whom underwent surgery, 5-year overall survival was 48% for stage I, 39% for stage II and 15% for stage III, against 26–34% in chemoradiation trials of predominantly stage III disease. Whether those survival rates describe the surgical subgroup or the whole database is not specified, and the comparison with the chemoradiation trials holds only on the surgical reading. A propensity- and stage-matched National Cancer Database analysis of 2,089 surgical patients found a doubling of overall survival in N0 disease (38 versus 22 months), with the benefit seen in patients who had an R0 resection, and lobectomy superior to both sublobar resection and pneumonectomy. A separate National Cancer Database analysis of more than 1,500 patients with pT1-2 N0 disease reported better 5-year overall survival with adjuvant chemotherapy than with surgery alone (53% versus 40%). These are matched observational comparisons, and selection of a small-cell patient for surgery generates residual confounding, so the size of the effect should be read as an upper bound.</p>\n<h3>Chemoradiation for stage II–III disease</h3>\n<p>Concurrent chemoradiation is the standard, and it delivers 5-year overall survival of approximately 30%. The role of radiotherapy was settled by <a class=\"trial-link\" href=\"/evidence/#t-pignon-meta-analysis\">Pignon Meta-Analysis</a>, which pooled 2,140 patients from 13 randomised trials of chemotherapy with or without thoracic radiotherapy and found that adding radiotherapy reduced the risk of death by 14% (p=0.001), improving 3-year overall survival from 8.9% to 14.3% (N Engl J Med 1992;327:1618-1624). Etoposide plus cisplatin is the preferred backbone. In the Norwegian Lung Cancer Study Group trial of 436 patients, 214 with limited-stage and 222 with extensive-stage disease, etoposide–cisplatin gave superior overall survival to cyclophosphamide–epirubicin–vincristine, while a separate statement about the same trial records no significant difference between the two regimens. The two results are consistent if read as stratum-specific, favouring etoposide–cisplatin in limited-stage disease and showing no difference in extensive-stage disease; that reading is an inference rather than a reported subgroup analysis. A three-arm randomised trial comparing etoposide–cisplatin, CAV and alternating CAV/etoposide–cisplatin found higher response rates with the etoposide-containing arms and similar overall survival (78%, 55% and 76% respectively; median overall survival 9.9, 9.9 and 11.8 months; JNCI 1991). A second three-arm trial, in 437 treatment-naive patients with extensive-stage disease, reached the same conclusion with the arms in that same order (median overall survival 8.6, 8.3 and 8.1 months; response rates 61%, 51% and 59%; JCO 1992). Etoposide–cisplatin displaced the anthracycline regimens on toxicity rather than on efficacy: it produces less myelosuppression and less pulmonary toxicity, and it is far easier to combine with thoracic radiotherapy.</p>\n<ul><li>The standard schedule is cisplatin 60–80 mg/m² on day 1 with etoposide 100–120 mg/m² on days 1–3 every three weeks, with dose reduction avoided in the first two cycles in particular.</li><li>Split-dose cisplatin at 25 mg/m² on days 1–3 is better tolerated and reduces the hydration requirement.</li><li>Carboplatin may be substituted to avoid nausea, ototoxicity, neuropathy and nephrotoxicity, at the cost of more myelosuppression.</li></ul>\n<h3>Radiotherapy dose, schedule and timing</h3>\n<p>Twice-daily radiotherapy is the reference schedule. <a class=\"trial-link\" href=\"/evidence/#t-int-0096-turrisi\">INT-0096 (Turrisi)</a> randomised 417 patients receiving concurrent cisplatin–etoposide to 45 Gy in 30 twice-daily fractions over three weeks or 45 Gy in 25 once-daily fractions over five weeks; the accelerated schedule improved median overall survival (23 versus 19 months) and 5-year overall survival (26% versus 16%; N Engl J Med 1999;340:265-271). <a class=\"trial-link\" href=\"/evidence/#t-convert\">CONVERT</a> then tested whether a higher once-daily dose could match it. In 547 patients with good performance status receiving concurrent cisplatin–etoposide, 66 Gy in 33 once-daily fractions was not superior to 45 Gy in 30 twice-daily fractions (median overall survival 25 versus 30 months; 2-year overall survival 51% versus 56%; p=0.33), with similar toxicity in both arms and lower than expected overall (Lancet Oncol 2017;18:1116-1125). The trial was designed to show superiority of the once-daily schedule and did not, so twice-daily 45 Gy remains the preferred standard and once-daily 66 Gy an acceptable alternative where twice-daily delivery is impractical. It did not esta
