ass=\"evidence-prose\"><a class=\"trial-link\" href=\"/evidence/#t-checkmate-76k\">CheckMate 76K</a> reproduced the result with nivolumab 480 mg 4-weekly (12-month recurrence-free survival 89.0% vs 79.4%, HR 0.42; distant metastasis-free survival HR 0.47; Nat Med 2023;29:2835-2843).</li></ul>\n<p>With longer follow-up the separation persists, at 4 years in the pembrolizumab trial (recurrence-free survival 71% vs 58%; distant metastasis-free survival 81% vs 70%) and at 3 years in the nivolumab trial (71% vs 61% and 79% vs 74% respectively). Overall survival is immature in both, so a node-negative patient is weighing a year of immune toxicity against an absolute recurrence-free survival difference of roughly 10 percentage points. Adjuvant therapy in stage IIIA disease depends on which AJCC edition defines the stage. Entry to the pivotal adjuvant trials was based on AJCC 7, and AJCC 7 stage IIIA identifies a higher-risk group than AJCC 8 stage IIIA, which incorporates Breslow thickness (5-year melanoma-specific survival 78% versus 93% respectively). AJCC 7 stage IIIA patients were either excluded outright or required more than 1 mm of sentinel node tumour burden to enter. For a patient with AJCC 8 stage IIIA disease and less than 1 mm of sentinel node burden, adjuvant therapy is therefore not supported by prospective evidence and surveillance is the standard. Above 1 mm of sentinel node burden, a year of adjuvant anti–PD-1 is appropriate. For resected stage IIIB to IV disease the choice is between a year of anti–PD-1 and, for <em>BRAF</em> V600-mutant tumours, a year of BRAF/MEK inhibition. <a class=\"trial-link\" href=\"/evidence/#t-keynote-054-eortc-1325\">KEYNOTE-054 (EORTC 1325)</a> established pembrolizumab 200 mg 3-weekly for approximately 1 year against placebo in completely resected high-risk stage III disease (1-year recurrence-free survival 75.4% vs 61.0%, HR 0.57; N Engl J Med 2018;378:1789-1801), with consistent benefit across subgroups including <em>BRAF</em> wild-type. The separation is maintained on long follow-up, with 7-year recurrence-free survival of 50% versus 36% and distant metastasis-free survival of 54% versus 42%. <a class=\"trial-link\" href=\"/evidence/#t-checkmate-238\">CheckMate 238</a> randomised resected stage IIIB/C or IV disease to nivolumab or high-dose ipilimumab: nivolumab improved recurrence-free survival (12-month recurrence-free survival 70.5% vs 60.8%, HR 0.65) with far less grade 3–4 toxicity (14% vs 46%; N Engl J Med 2017;377:1824-1835). At 5 years distant metastasis-free survival was 58% versus 51% and overall survival 76% versus 72%, so the case for nivolumab over ipilimumab rests on recurrence and toxicity rather than on a demonstrated survival advantage. <a class=\"trial-link\" href=\"/evidence/#t-eortc-18071\">EORTC 18071</a> is no longer used in practice. Adjuvant ipilimumab 10 mg/kg improved both recurrence-free and overall survival against placebo (5-year overall survival 65.4% vs 54.4%, HR 0.72) but caused grade 3–4 immune toxicity in approximately 54% of patients and five treatment-related deaths (Lancet Oncol 2015;16:522-530). Recurrence-free survival medians were 26.1 versus 17.1 months (HR 0.75) and 7-year distant metastasis-free survival 44.5% versus 37% (HR 0.76). It proved the principle of adjuvant checkpoint blockade and was then displaced by anti–PD-1 on toxicity grounds alone. Escalating adjuvant immunotherapy to a doublet has not improved outcomes in the standard resected population. CheckMate 915 randomised resected stage IIIB/C/D or IV disease to nivolumab plus low-dose ipilimumab versus nivolumab alone and found no recurrence-free survival difference (2-year recurrence-free survival 65% vs 63%). The exception is stage IV rendered disease-free surgically, where IMMUNED randomised patients with no evidence of disease to nivolumab plus ipilimumab, nivolumab alone, or placebo: both active arms improved recurrence-free survival over placebo (HR 0.25 for the doublet and 0.60 for nivolumab). Four-year overall survival was 83.8% with the doublet and 72.6% with nivolumab, against 63.1% with placebo (hazard ratios versus placebo 0.41 and 0.74 respectively). The doublet dose in IMMUNED was ipilimumab 3 mg/kg with nivolumab 1 mg/kg, not the low-dose adjuvant schedule of CheckMate 915, which is why CheckMate 915 cannot be read as refuting IMMUNED. For <em>BRAF</em> V600E/K-mutant resected stage III disease, <a class=\"trial-link\" href=\"/evidence/#t-combi-ad\">COMBI-AD</a> established 12 months of dabrafenib plus trametinib against placebo (3-year relapse-free survival 58% vs 39%, HR 0.47; N Engl J Med 2017;377:1813-1823), with 5-year distant metastasis-free survival of 65% versus 54% (HR 0.55) and an overall survival hazard ratio of 0.80 with both medians not reached. In a <em>BRAF</em>-mutant patient both are options, and the decision turns on toxicity profile and what is held in reserve: the BRAF/MEK doublet gives predictable, reversible, high-frequency toxicity over 12 months, whereas anti–PD-1 gives lower-frequency but potentially permanent endocrine and organ-specific toxicity. The two drugs have different toxicity profiles.</p>\n<ul><li>Dabrafenib produces common and irritating problems, chiefly pyrexia, rash and arthralgia.</li><li>Trametinib produces rare but serious ones, chiefly ocular toxicity, venous thromboembolism, haemorrhage, cardiomyopathy and pneumonitis.</li></ul>\n<p>Monitoring covers liver function, glucose, febrile reactions, skin toxicity and left ventricular ejection fraction. In <a class=\"trial-link\" href=\"/evidence/#t-keynote-942-mrna-4157-v940\">KEYNOTE-942 (mRNA-4157/V940)</a>, a randomised phase IIb trial of 157 patients with resected high-risk stage IIIB–IV melanoma, intismeran autogene plus pembrolizumab prolonged recurrence-free survival over pembrolizumab alone (18-month recurrence-free survival 79% vs 62%, HR 0.56), with benefit sustained at 3 and 5 years and an approximately 49% reduction in recurrence or death (Lancet 2024;403:632-644). This is the first randomised signal for an individualised cancer vaccine, and it remains phase II; the confirmatory phase 3 trial (V940-001) is ongoing.</p>\n<h3 id=\"s-neoadjuvant-therapy\">Neoadjuvant therapy</h3>\n<p>Neoadjuvant immunotherapy is now the preferred approach for macroscopic, resectable stage III melanoma in centres able to deliver it, though it was not FDA-approved as of August 2025. Candidates are:</p>\n<ul><li>patients with resectable stage III disease confined to lymph nodes clinically or radiologically;</li><li>selected patients with resectable in-transit metastases or oligometastatic stage IV disease.</li></ul>\n<p><a class=\"trial-link\" href=\"/evidence/#t-nadina\">NADINA</a> randomised 423 patients with resectable macroscopic stage III melanoma, 97% of whom had at least one PET-positive node, to two cycles of neoadjuvant ipilimumab 80 mg plus nivolumab 240 mg 3-weekly followed by therapeutic lymph node dissection and response-driven adjuvant therapy, versus upfront dissection followed by 12 cycles of adjuvant nivolumab. The neoadjuvant strategy improved event-free survival (12-month event-free survival 83.7% vs 57.2%, HR 0.32; N Engl J Med 2024;391:1696-1708), and the benefit held regardless of <em>BRAF</em> mutation status. Approximately 59% of patients achieved a major pathological response and received no adjuvant therapy, and pathological response predicted recurrence-free survival. The pathological complete response rate was 47.2%.</p>\n<p><a class=\"trial-link\" href=\"/evidence/#t-swog-s1801\">SWOG S1801</a> tested the same sequencing question holding the drug constant and varying only its timing. It randomised 313 patients with resectable stage IIIB to oligometastatic stage IV melanoma to three cycles of neoadjuvant pembrolizumab followed by surgery and 15 adjuvant cycles, versus surgery followed by 1 year of adjuvant pembrolizumab. The perioperative arm improved event-free survival (2-year event-free survival 72% vs 49%, HR 0.58; N Engl J Med 2023;388:813-823). The pathological complete response rate was 21%. Since the total drug exposure was identical, the result is attributable to sequencing: priming the immune response while the bulk of antigen is still in situ.</p>\n<h2 id=\"s-management-of-advanced-disease\">Management of advanced disease</h2>\n<h3 id=\"s-first-line-therapy-in-braf-wild-type-disease\">First-line therapy in <em>BRAF</em> wild-type disease</h3>\n<p>The first-line choice is between dual and single-agent checkpoint blockade. <a class=\"trial-link\" href=\"/evidence/#t-checkmate-067\">CheckMate 067</a> randomised untreated advanced melanoma to nivolumab plus ipilimumab, nivolumab alone, or ipilimumab alone, and both nivolumab-containing arms improved progression-free survival (11.5 and 6.9 versus 2.9 months) and objective response (58% and 44% versus 19%) over ipilimumab, with durable long-term survival on extended follow-up (N Engl J Med 2015;373:23-34). Median overall survival was 72.1 months for the doublet and 37.6 months for nivolumab, against 19.9 months for ipilimumab. The two nivolumab-containing arms were not designed for head-to-head comparison, and in the overall population the doublet improved progression-free survival but not overall survival relative to nivolumab alone. The apparent superiority of the doublet in CheckMate 067 is a cross-arm comparison the trial does not license. Toxicity is higher with the doublet. Grade 3 or higher treatment-related adverse events occurred in 63% of patients on nivolumab plus ipilimumab, 25% on nivolumab and 30% on ipilimumab. In <a class=\"trial-link\" href=\"/evidence/#t-relativity-047\">RELATIVITY-047</a>, fixed-dose nivolumab plus relatlimab, an anti–LAG-3 antibody, improved progression-free survival over nivolumab alone (median 10.1 vs 4.6 months, HR 0.75; N Engl J Med 2022;386:24-34), with median overall survival of 51.0 versus 34.1 months (HR 0.80) and objective response in 43% versus 33%. Grade 3 or higher treatment-related adverse events occurred in 22% versus 12%, roughly a third of the doublet&#x27;s rate in CheckMate 067. LAG-3 plus PD-1 blockade is therefore a reasonable first-line option where the toxicity of nivolumab plus ipilimumab is unacceptable, and it is a direct randomised test of an intensified checkpoint regimen against anti–PD-1 monotherapy, which CheckMate 067 does not provide. Two earlier trials tested ipilimumab and pembrolizumab in advanced melanoma.</p>\n<ul><li class=\"evidence-prose\"><a class=\"trial-link\" href=\"/evidence/#t-mdx010-20-ipilimumab\">MDX010-20 (ipilimumab)</a> was the first trial to improve survival in advanced melanoma, comparing ipilimumab with or without gp100 vaccine against vaccine alone in previously treated HLA-A*0201-positive disease (median overall survival 10.0 vs 6.4 months, HR approximately 0.66; N Engl J Med 2010;363:711-723).</li><li class=\"evidence-prose\"><a class=\"trial-link\" href=\"/evidence/#t-keynote-006\">KEYNOTE-006</a> then displaced ipilimumab as first-line therapy, showing that pembrolizumab improved overall survival (1-year overall survival approximately 74% vs 58%; HR 0.63–0.69) and progression-free survival with less high-grade toxicity (N Engl J Med 2015;372:2521-2532); on long follow-up median overall survival was 32.7 versus 15.9 months, progression-free survival 8.4 versus 3.4 months and objective response 42% versus 17%.</li></ul>\n<p>Anti–PD-1, alone or in combination, is the backbone of first-line therapy on the strength of those two results. The chemotherapy comparisons that preceded them are of historical interest only: ipilimumab plus dacarbazine improved overall survival over dacarbazine in CA184-024 (11.2 vs 9.1 months, HR 0.72) and nivolumab improved it in CheckMate 066 (37.3 vs 11.2 months, HR 0.50).</p>\n<h3 id=\"s-first-line-therapy-in-braf-v600-mutant-disease\">First-line therapy in <em>BRAF</em> V600-mutant disease</h3>\n<p>Immunotherapy works in <em>BRAF</em>-mutant melanoma, and the sequencing question is which modality to use first, not whether to use both. ESMO recommends first-line nivolumab plus ipilimumab where it can be safely delivered over the first few months, that is where the disease is not so aggressive or symptomatic that a rapid response is required, with targeted therapy reserved for later lines. <a class=\"trial-link\" href=\"/evidence/#t-dreamseq-ea6134\">DREAMseq (EA6134)</a> randomised 265 patients with untreated <em>BRAF</em> V600-mutant metastatic melanoma to nivolumab plus ipilimumab followed by dabrafenib plus trametinib at progression, or the reverse sequence. Starting with immunotherapy gave a higher 2-year overall survival than starting with targeted therapy (71.8%, 95% CI 62.5 to 79.1, versus 51.5%, 95% CI 41.7 to 60.4; log-rank P=.010 on Kaplan-Meier estimates; J Clin Oncol 2023;41:186-197). The protocol-specified primary comparison, a Mantel-Haenszel test of 2-year landmark rates among the 176 patients followed for at least 2 years, did not cross its efficacy boundary (P=.163). The trial was stopped early on the recommendation of the data safety monitoring committee after the Kaplan-Meier analysis crossed the O&#x27;Brien-Fleming boundary at 59% information time, with a 95% repeated confidence interval for the difference of 2.6% to 37.9%. The direction and magnitude of the effect are convincing enough to have changed practice, but the formal primary test was not met, and the estimate carries the imprecision of early stopping. The remaining efficacy figures were concordant. Two-year progression-free survival was 42% versus 19% with medians of 12 versus 9 months, response rates across the two sequenced steps were 46% then 48% for the immunotherapy-first sequence and 43% then 30% for the targeted-first sequence, and median duration of response was not reached with immunotherapy first versus 13 months with targeted therapy first (P&lt;0.001). The duration-of-response difference explains the shape of the curves.</p>\n<p>A proportion of patients progress early on immunotherapy while responders go on to sustained benefit, so the Kaplan-Meier curves cross before separating in favour of the immunotherapy-first sequence. A rapidly symptomatic patient with high tumour burden may therefore still be started on targeted therapy. <a class=\"trial-link\" href=\"/evidence/#t-secombit-ascierto\">SECOMBIT (Ascierto)</a> tested the same question in a non-comparative randomised phase II design with three arms:</p>\n<ul><li>encorafenib plus binimetinib until progression then ipilimumab plus nivolumab;</li><li>ipilimumab plus nivolumab then encorafenib plus binimetinib;</li><li>an 8-week induction of encorafenib plus binimetinib followed by ipilimumab plus nivolumab and then re-treatment with encorafenib plus binimetinib at progression.</li></ul>\n<p>All three arms exceeded the prespecified overall survival threshold, with 2-year and 3-year overall survival of 65% and 54% for the targeted-first arm, 73% and 62% for the immunotherapy-first arm, and 69% and 60% for the sandwich arm (J Clin Oncol 2023;41:212-221). The trial was not designed for between-arm comparison, so the ordering is a trend rather than a result, but it is concordant with DREAMseq. <a class=\"trial-link\" href=\"/evidence/#t-ebin-robert\">EBIN (Robert)</a> tested the sandwich strategy. In 271 patients with untreated unresectable stage III/IV <em>BRAF</em> V600E/K-mutant melanoma, 12 weeks of encorafenib plus binimetinib before nivolumab plus ipilimumab gave no progression-free survival benefit over going straight to the checkpoint doublet (median 9 versus 9 months, HR 0.87), at the cost of more grade 3–5 treatment-related adverse events (42% versus 32%; Lancet Oncol 2025;26:781-794). Short targeted induction to debulk before immunotherapy is therefore not supported.</p>\n<h3 id=\"s-braf-and-mek-inhibition\">BRAF and MEK inhibition</h3>\n<p>Three BRAF inhibitors (vemurafenib, dabrafenib, encorafenib) and three MEK inhibitors (trametinib, cobimetinib, binimetinib) are in use, and they are given as fixed pairings. <a class=\"trial-link\" href=\"/evidence/#t-brim-3\">BRIM-3</a> first proved the target, with vemurafenib reducing the risk of death by 63% versus dacarbazine in the primary analysis (HR 0.37) and prolonging progression-free survival (5.3 vs 1.6 months; N Engl J Med 2011;364:2507-2516). Single-agent trametinib and dabrafenib showed the same pattern against chemotherapy in METRIC (progression-free survival 4.8 vs 1.5 months, HR 0.45; objective response 40% vs 14%) and BREAK-3 (5.1 vs 2.7 months, HR 0.30; objective response 50% vs 6%), with overall survival estimates confounded by crossover. Adding a MEK inhibitor to a BRAF inhibitor improved response, progression-free survival and overall survival in each of the randomised comparisons, and it reduces the cutaneous toxicity of BRAF inhibition by suppressing paradoxical MAPK activation in BRAF wild-type keratinocytes.</p>\n<ul><li class=\"evidence-prose\"><a class=\"trial-link\" href=\"/evidence/#t-cobrim\">coBRIM</a> showed that adding cobimetinib to vemurafenib improved progression-free survival (9.9 vs 6.2 months, HR 0.51) and response rate (N Engl J Med 2014;371:1867-1876), with median overall survival of 22.5 versus 17.4 months (HR 0.70) and objective response in 68% versus 45%.</li><li class=\"evidence-prose\"><a class=\"trial-link\" href=\"/evidence/#t-combi-v\">COMBI-v</a> showed dabrafenib plus trametinib to be superior to vemurafenib on overall survival (12-month overall survival 72% vs 65%, HR 0.69) and progression-free survival (11.4 vs 7.3 months; N Engl J Med 2015;372:30-39), with median overall survival of 25.6 versus 18 months and objective response in 64% versus 51%.</li><li class=\"evidence-prose\">The dabrafenib/trametinib doublet was also superior to dabrafenib alone in COMBI-d (overall survival 25.1 vs 18.7 months, HR 0.71; progression-free survival 11 vs 8.8 months, HR 0.67; objective response 67% vs 51%).</li><li class=\"evidence-prose\"><a class=\"trial-link\" href=\"/evidence/#t-columbus\">COLUMBUS</a> completed the set, with encorafenib plus binimetinib improving progression-free survival over vemurafenib (14.9 vs 7.3 months, HR 0.54) and a favourable tolerability profile (Lancet Oncol 2018;19:603-615); median overall survival was 33.6 versus 16.9 months against vemurafenib and 33.6 versus 23.4 months against encorafenib alone, with objective response of 64%, 41% and 52% respectively.</li></ul>\n<p>The choice between the three doublets is made on toxicity and schedule rather than on efficacy.</p>\n<h2 id=\"s-therapy-after-anti-pd-1-failure\">Therapy after anti–PD-1 failure</h2>\n<p>Progression on anti–PD-1 is now the commonest advanced-melanoma problem in clinic. The choice of salvage turns on <em>BRAF</em> status, on whether the disease is injectable, and on access to cell therapy. For <em>BRAF</em>-mutant disease, switch modality.</p>\n<ul><li>Patients who received checkpoint blockade first move to a BRAF/MEK doublet.</li><li>Patients who received targeted therapy first move to checkpoint blockade.</li></ul>\n<p>For <em>BRAF</em> wild-type disease the options are re-challenge with CTLA-4 blockade, cellular therapy, or an oncolytic approach for injectable disease. SWOG S1616, a randomised phase II trial of 92 patients progressing on anti–PD-1, tested whether CTLA-4 blockade could reverse resistance: nivolumab plus ipilimumab improved progression-free survival over ipilimumab alone (6-month progression-free survival 34% vs 13%, HR 0.63) and objective response (28% vs 9%, P=0.05, with 12% complete and 16% partial responses and a median duration of response of 40.9 months), at the cost of more grade 3 or higher treatment-related events (57% vs 35%, P=0.09); it was not powered for overall survival. Adding an anti–LAG-3 antibody in this setting is far less productive: in RELATIVITY-020 Part D, a phase I/IIa study of 518 patients who had progressed on one or more anti–PD-1 regimens, nivolumab plus relatlimab produced objective response in 12% with median progression-free survival of 2.1 months after one prior anti–PD-1 regimen, and 9.2% with 3.1 months after more than one. Adoptive cell therapy has produced the highest response rates reported in this setting. <a class=\"trial-link\" href=\"/evidence/#t-rohaan-til-vs-ipilimumab\">Rohaan (TIL vs ipilimumab)</a> randomised 168 patients with unresectable stage IIIC/IV melanoma, 86% refractory to anti–PD-1, to tumour-infiltrating lymphocyte therapy after non-myeloablative lymphodepletion followed by high-dose interleukin-2, or to ipilimumab. TIL therapy improved progression-free survival (median 7.2 vs 3.1 months, HR 0.50), with objective response in 49% versus 21% and median overall survival of 25.8 versus 18.9 months (N Engl J Med 2022;387:2113-2125). <a class=\"trial-link\" href=\"/evidence/#t-c-144-01-lifileucel\">C-144-01 (lifileucel)</a> then supported registration on a single-arm basis in melanoma refractory to anti–PD-1 and, where indicated, to BRAF/MEK inhibition, with an objective response rate of 31.4% and a median duration of response of 36.5 months (J Clin Oncol 2025;43:3565-3572); lifileucel is the first FDA-approved cellular therapy for a solid tumour. The limiting factor is the regimen: cyclophosphamide and fludarabine lymphodepletion followed by high-dose interleukin-2 confines the approach to fit patients at centres with the infrastructure to deliver it. <a class=\"trial-link\" href=\"/evidence/#t-optim-t-vec\">OPTiM (T-VEC)</a> randomised unresectable stage IIIB–IV melanoma to intralesional talimogene laherparepvec or subcutaneous GM-CSF, improving durable response rate (16% vs 2%) and objective response (26% vs 6%; J Clin Oncol 2015;33:2780-2788). It was the first oncolytic immunotherapy approved for melanoma and remains useful where disease is accessible and the priority is local control. <a class=\"trial-link\" href=\"/evidence/#t-ignyte-rp1\">IGNYTE (RP1)</a> extends the oncolytic principle into the anti–PD-1-failed setting by combining a modified herpes simplex virus with nivolumab. In the registration-intended cohort of 140 patients with confirmed progression while on at least 8 weeks of anti–PD-1 as the last prior therapy, including progression on adjuvant anti–PD-1 (36 of 140 patients), intratumoural RP1 plus nivolumab produced an objective response in 33.6% by modified RECIST, the primary endpoint (95% CI 25.8 to 42.0), and 32.9% by conventional RECIST with a complete response rate of 15.0% (J Clin Oncol 2025;43:3589-3599). Responses were durable, with a median duration of 33.7 months (95% CI 14.1 to not reached) and 69.5% of responses ongoing at 1 year. Uninjected lesions regressed nearly as often as injected ones, with a 30% or greater reduction in 79.0% of 119 uninjected lesions versus 93.6% of 78 injected lesions among responders. Whole-cohort progression-free survival was 3.6 months (95% CI 2.0 to 5.0), against overall survival of 75.3% at 1 year and 63.3% at 2 years with the median not reached. Treatment-related adverse events were near-universal but mostly mild (any grade 90.0%; grade 3 or 4 12.9%), with five grade 4 events including myocarditis and splenic rupture and no treatment-related deaths. The trial is single-arm, so none of these figures is a comparison. Ablative therapy directed at oligometastatic sites remains appropriate alongside any of these systemic options, and a clinical trial is appropriate for most patients whose disease has progressed on anti–PD-1.</p>\n<h2 id=\"s-uveal-and-mucosal-melanoma\">Uveal and mucosal melanoma</h2>\n<p>Uveal melanoma has a different driver set from cutaneous melanoma and responds poorly to checkpoint blockade, and until recently nothing improved survival in the metastatic setting. <a class=\"trial-link\" href=\"/evidence/#t-imcgp100-202-tebentafusp\">IMCgp100-202 (tebentafusp)</a> tested tebentafusp, a bispecific gp100×CD3 ImmTAC, in untreated HLA-A*02:01-positive metastatic uveal melanoma. It improved overall survival over investigator&#x27;s choice of pembrolizumab, ipilimumab or dacarbazine (median 21.7 vs 16.0 months, HR 0.51; N Engl J Med 2021;385:1196-1206), despite low response rates. That dissociation between response and survival is characteristic of the agent and means radiological response should not be used to decide whether to continue it. Because the drug presents a gp100 peptide in the context of HLA-A*02:01, patients without the allele cannot receive it. In first-line HLA-A*02:01-negative metastatic uveal melanoma, <a class=\"trial-link\" href=\"/evidence/#t-optimum-02\">OptimUM-02</a> showed that darovasertib, a protein kinase C inhibitor, plus crizotinib improved progression-free survival over investigator&#x27;s choice of pembrolizumab, ipilimumab plus nivolumab, or dacarbazine (median 6.9 versus 3.1 months; HR 0.42; P&lt;0.0001), with objective response in 37.1% versus 5.8% (J Clin Oncol 2026;44(suppl 17):LBA9503). This is the first randomised trial to show benefit in the population tebentafusp cannot treat. Three qualifications apply.</p>\n<ul><li>These are the phase 2 efficacy primary results of a nested phase 2/3 trial.</li><li>Overall survival is the phase 3 primary endpoint and has not been reported.</li><li>The source is an ASCO 2026 abstract rather than a full publication.</li></ul>\n<p>Mucosal melanoma responds poorly to single-agent checkpoint blockade, and early evidence combines anti–PD-1 with VEGF-directed therapy. <a class=\"trial-link\" href=\"/evidence/#t-sheng-et-al-toripalimab-axitinib\">Sheng et al (toripalimab + axitinib)</a> enrolled 33 treatment-naive patients with metastatic mucosal melanoma in a phase Ib study. Toripalimab plus axitinib achieved an objective response rate of 48.3% among response-evaluable patients, with median progression-free survival of 7.5 months (J Clin Oncol 2019;37:2987-2999). The sample is small and uncontrolled, but the response rate is high for a subtype largely resistant to single-agent checkpoint blockade, and the combination is a reasonable option where a trial is not available. <em>KIT</em> testing is worthwhile in mucosal and acral disease, since a minority carry activating mutations amenable to KIT inhibition.</p>\n<h2 id=\"s-references\">References</h2>\n<ol class=\"refs\">\n<li id=\"ref-melanoma-melanoma-t-keynote-716\"><a class=\"trial-link\" href=\"/evidence/#t-keynote-716\">KEYNOTE-716</a>. <a href=\"https://drive.google.com/file/d/1Jj6zHgtYS8SVG83UPhoWiz8kQR69L_LM/preview\">Lancet 2022;399:1718-1729</a></li>\n<li id=\"ref-melanoma-melanoma-t-checkmate-76k\"><a class=\"trial-link\" href=\"/evidence/#t-checkmate-76k\">CheckMate 76K</a>. <a href=\"https://drive.google.com/file/d/1Y6h4i3jjUqvzFiKJf5md3sriQG2TtHfI/preview\">Nat Med 2023;29:2835-2843</a></li>\n<li id=\"ref-melanoma-melanoma-t-keynote-054-eortc-1325\"><a class=\"trial-link\" href=\"/evidence/#t-keynote-054-eortc-1325\">KEYNOTE-054 (EORTC 1325)</a>. <a href=\"https://drive.google.com/file/d/18uYdsifEAOl1P4L6lT3frr53ZALDkccZ/preview\">N Engl J Med 2018;378:1789-1801</a></li>\n<li id=\"ref-melanoma-melanoma-t-checkmate-238\"><a class=\"trial-link\" href=\"/evidence/#t-checkmate-238\">CheckMate 238</a>. <a href=\"https://drive.google.com/file/d/1Q4gmQzXiRqI-xjZFXnfGCf0LjnQhPxfu/preview\">N Engl J Med 2017;377:1824-1835</a>; <a href=\"https://drive.google.com/file/d/1jSB0Ql5PRCGjzwemtZTmgAM99GHlnocD/preview\">N Engl J Med 2026;394:333-342</a></li>\n<li id=\"ref-melanoma-melanoma-t-eortc-18071\"><a class=\"trial-link\" href=\"/evidence/#t-eortc-18071\">EORTC 18071</a>. <a href=\"https://doi.org/10.1016/S1470-2045(15)70122-1\">Lancet Oncol 2015;16:522-530</a></li>\n<li id=\"ref-melanoma-melanoma-t-combi-ad\"><a class=\"trial-link\" href=\"/evidence/#t-combi-ad\">COMBI-AD</a>. <a href=\"https://doi.org/10.1056/NEJMoa1708539\">N Engl J Med 2017;377:1813-1823</a></li>\n<li id=\"ref-melanoma-melanoma-t-keynote-942-mrna-4157-v940\"><a class=\"trial-link\" href=\"/evidence/#t-keynote-942-mrna-4157-v940\">KEYNOTE-942 (mRNA-4157/V940)</a>. <a href=\"https://doi.org/10.1016/S0140-6736(23)02268-7\">Lancet 2024;403:632-644</a></li>\n<li id=\"ref-melanoma-melanoma-t-nadina\"><a class=\"trial-link\" href=\"/evidence/#t-nadina\">NADINA</a>. <a href=\"https://drive.google.com/file/d/17guefDSLq9BwPGNny_9k4DLp-In5Q1ku/preview\">N Engl J Med 2024;391:1696-1708</a></li>\n<li id=\"ref-melanoma-melanoma-t-swog-s1801\"><a class=\"trial-link\" href=\"/evidence/#t-swog-s1801\">SWOG S1801</a>. <a href=\"https://doi.org/10.1056/NEJMoa2211437\">N Engl J Med 2023;388:813-823</a></li>\n<li id=\"ref-melanoma-melanoma-t-checkmate-067\"><a class=\"trial-link\" href=\"/evidence/#t-checkmate-067\">CheckMate 067</a>. <a href=\"https://drive.google.com/file/d/1nBOvPUqYlAiwwqvsJUM1cL5uCZxeJOmA/preview\">N Engl J Med 2015;373:23-34</a>; <a href=\"https://drive.google.com/file/d/1p716vQ1p7Lbwwf8g7Y0YhJNPAhAqeHEu/preview\">N Engl J Med 2017;377:1345-1356</a></li>\n<li id=\"ref-melanoma-melanoma-t-relativity-047\"><a class=\"trial-link\" href=\"/evidence/#t-relativity-047\">RELATIVITY-047</a>. <a href=\"https://doi.org/10.1056/NEJMoa2109970\">N Engl J Med 2022;386:24-34</a></li>\n<li id=\"ref-melanoma-melanoma-t-mdx010-20-ipilimumab\"><a class=\"trial-link\" href=\"/evidence/#t-mdx010-20-ipilimumab\">MDX010-20 (ipilimumab)</a>. <a href=\"https://doi.org/10.1056/NEJMoa1003466\">N Engl J Med 2010;363:711-723</a></li>\n<li id=\"ref-melanoma-melanoma-t-keynote-006\"><a class=\"trial-link\" href=\"/evidence/#t-keynote-006\">KEYNOTE-006</a>. <a href=\"https://doi.org/10.1056/NEJMoa1503093\">N Engl J Med 2015;372:2521-2532</a></li>\n<li id=\"ref-melanoma-melanoma-t-dreamseq-ea6134\"><a class=\"trial-link\" href=\"/evidence/#t-dreamseq-ea6134\">DREAMseq (EA6134)</a>. <a href=\"https://drive.google.com/file/d/12z2LJCe7SJgBYOlXWyml5fjYSOsLlhXR/preview\">J Clin Oncol 2023;41:186-197</a></li>\n<li id=\"ref-melanoma-melanoma-t-secombit-ascierto\"><a class=\"trial-link\" href=\"/evidence/#t-secombit-ascierto\">SECOMBIT (Ascierto)</a>. <a href=\"https://drive.google.com/file/d/1mVe-RpBIlotvRE3PruFhaf8nL8DQNO8y/preview\">J Clin Oncol 2023;41:212-221</a></li>\n<li id=\"ref-melanoma-melanoma-t-ebin-robert\"><a class=\"trial-link\" href=\"/evidence/#t-ebin-robert\">EBIN (Robert)</a>. <a href=\"https://drive.google.com/file/d/184vlWEGsg4xKNXX4Vbr34WkcesdPLkBU/preview\">Lancet Oncol 2025;26:781-794</a></li>\n<li id=\"ref-melanoma-melanoma-t-brim-3\"><a class=\"trial-link\" href=\"/evidence/#t-brim-3\">BRIM-3</a>. <a href=\"https://doi.org/10.1056/NEJMoa1103782\">N Engl J Med 2011;364:2507-2516</a></li>\n<li id=\"ref-melanoma-melanoma-t-cobrim\"><a class=\"trial-link\" href=\"/evidence/#t-cobrim\">coBRIM</a>. <a href=\"https://doi.org/10.1056/NEJMoa1408868\">N Engl J Med 2014;371:1867-1876</a></li>\n<li id=\"ref-melanoma-melanoma-t-combi-v\"><a class=\"trial-link\" href=\"/evidence/#t-combi-v\">COMBI-v</a>. <a href=\"https://doi.org/10.1056/NEJMoa1412690\">N Engl J Med 2015;372:30-39</a></li>\n<li id=\"ref-melanoma-melanoma-t-columbus\"><a class=\"trial-link\" href=\"/evidence/#t-columbus\">COLUMBUS</a>. <a href=\"https://doi.org/10.1016/S1470-2045(18)30142-6\">Lancet Oncol 2018;19:603-615</a></li>\n<li id=\"ref-melanoma-melanoma-t-rohaan-til-vs-ipilimumab\"><a class=\"trial-link\" href=\"/evidence/#t-rohaan-til-vs-ipilimumab\">Rohaan (TIL vs ipilimumab)</a>. <a href=\"https://drive.google.com/file/d/1iP-xVQzJrrKVotmv3OqNYzBrZ0a_4MTU/preview\">N Engl J Med 2022;387:2113-2125</a></li>\n<li id=\"ref-melanoma-melanoma-t-c-144-01-lifileucel\"><a class=\"trial-link\" href=\"/evidence/#t-c-144-01-lifileucel\">C-144-01 (lifileucel)</a>. <a href=\"https://drive.google.com/file/d/1A0kV__JlmaAEJ9nBXs676o3xDrhcv5aF/preview\">J Clin Oncol 2025;43:3565-3572</a></li>\n<li id=\"ref-melanoma-melanoma-t-optim-t-vec\"><a class=\"trial-link\" href=\"/evidence/#t-optim-t-vec\">OPTiM (T-VEC)</a>. <a href=\"https://doi.org/10.1200/JCO.2014.58.3377\">J Clin Oncol 2015;33:2780-2788</a></li>\n<li id=\"ref-melanoma-melanoma-t-ignyte-rp1\"><a class=\"trial-link\" href=\"/evidence/#t-ignyte-rp1\">IGNYTE (RP1)</a>. <a href=\"https://drive.google.com/file/d/1HfzfgHkq0NP_Fnzftg29g5Rs6r1Ncav2/preview\">J Clin Oncol 2025;43:3589-3599</a></li>\n<li id=\"ref-melanoma-melanoma-t-imcgp100-202-tebentafusp\"><a class=\"trial-link\" href=\"/evidence/#t-imcgp100-202-tebentafusp\">IMCgp100-202 (tebentafusp)</a>. <a href=\"https://doi.org/10.1056/NEJMoa2103485\">N Engl J Med 2021;385:1196-1206</a></li>\n<li id=\"ref-melanoma-melanoma-t-optimum-02\"><a class=\"trial-link\" href=\"/evidence/#t-optimum-02\">OptimUM-02</a>. <a href=\"https://doi.org/10.1200/JCO.2026.44.17_suppl.LBA9503\">J Clin Oncol 2026;44(suppl 17):LBA9503</a>; <a href=\"https://drive.google.com/file/d/1E5UDfQD85uSxpDPTlXYKLVBOXZtUg6W3/preview\">Orloff et al. - 2026 - Darovasertib plus crizotinib vs investigator&#x27;s choice as first-line treatment for HLA-A2 negative [1126b8da]</a></li>\n<li id=\"ref-melanoma-melanoma-t-sheng-et-al-toripalimab-axitinib\"><a class=\"trial-link\" href=\"/evidence/#t-sheng-et-al-toripalimab-axitinib\">Sheng et al (toripalimab + axitinib)</a>. <a href=\"https://doi.org/10.1200/JCO.19.00210\">J Clin Oncol 2019;37:2987-2999</a></li>\n</ol>", "_hay": "melanoma melanoma melanoma epidemiology risk factors pathology and molecular classification clinical presentation and diagnosis staging and work-up sentinel lymph node biopsy imaging for distant metastases management of resectable disease surgery and radiotherapy adjuvant systemic therapy by stage neoadjuvant therapy management of advanced disease first-line therapy in *braf* wild-type disease first-line therapy in *braf* v600-mutant disease braf and mek inhibition therapy after anti–pd-1 failure uveal and mucosal melanoma references"}];
const GROUPS = ["Breast", "Colorectal", "Lung", "Lymphoma", "Melanoma"];
const LANDING_GROUP_LABELS = {"Colorectal": "Gastrointestinal", "Lung": "Thoracic", "Melanoma": "Skin"};
const BYID = Object.fromEntries(NOTES.map(n => [n.id, n]));

let state = { view:'index', group:null, id:null, q:'' };

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function inGroup(g){ return NOTES.filter(n => n.group === g); }
function landingGroupLabel(g){ return LANDING_GROUP_LABELS[g] || g; }

// ---- Sidebar: "All notes" + a collapsible section per tumour group ----
const nav = document.getElementById('nav');
GROUPS.forEach(g => {
  const block = document.createElement('div'); block.className = 'navsec';
  const head = document.createElement('button'); head.type = 'button'; head.className = 'secname';
  head.setAttribute('aria-expanded','true');
  head.innerHTML = `<span>${esc(g)}</span><span class="caret" aria-hidden="true">&#9660;</span>`;
  head.onclick = () => { const collapsed = block.classList.toggle('collapsed'); head.setAttribute('aria-expanded', collapsed ? 'false' : 'true'); };
  block.appendChild(head);
  const box = document.createElement('div'); box.className = 'items';
  inGroup(g).forEach(n => {
    const a = document.createElement('button'); a.type = 'button'; a.dataset.id = n.id;
    a.innerHTML = `<span>${esc(n.title)}</span>`;
    a.onclick = () => selectNote(n.id);
    box.appendChild(a);
  });
  block.appendChild(box); nav.appendChild(block);
});
function syncNav(){ document.querySelectorAll('.items button').forEach(a => a.classList.toggle('active', state.view==='note' && a.dataset.id===state.id)); }
document.getElementById('showall').onclick = () => { state.view='index'; state.group=null; state.id=null; state.q=''; document.getElementById('q').value=''; closeNav(); render(true); window.scrollTo(0,0); };

// ---- Drawer (burger at every width) ----
const backdrop = document.getElementById('backdrop');
const burger = document.getElementById('burger');
function closeNav(){ document.body.classList.remove('nav-open'); }
burger.onclick = () => document.body.classList.toggle('nav-open');
backdrop.onclick = closeNav;

// ---- Search: title + section headings, across every note ----
document.getElementById('q').oninput = e => {
  state.q = e.target.value.toLowerCase().trim();
  state.view = state.q ? 'search' : 'index';
  state.id = null;
  render();
};

function selectNote(id){
  state.view='note'; state.id=id; state.q='';
  const q = document.getElementById('q'); if (q) q.value='';
  closeNav(); render(true); window.scrollTo(0,0);
}
function selectGroup(g){
  state.view='group'; state.group=g; state.id=null; state.q='';
  const q = document.getElementById('q'); if (q) q.value='';
  closeNav(); render(true); window.scrollTo(0,0);
}

function noteItem(n, meta){
  return `<button class="nitem" type="button" data-id="${esc(n.id)}">
    <span class="ntitle">${esc(n.title)}</span>
    <span class="nmeta">${esc(meta || n.updated || '')}</span></button>`;
}

function renderIndex(res){
  res.innerHTML = `<div class="ngrid">` + GROUPS.map(g => {
    return `<button class="gcard" type="button" data-group="${esc(g)}">
      <span class="gbody"><span class="gname">${esc(landingGroupLabel(g))}</span></span>
      <span class="go" aria-hidden="true">&rarr;</span></button>`;
  }).join('') + `</div>`;
  res.querySelectorAll('.gcard').forEach(b => b.onclick = () => selectGroup(b.dataset.group));
}

function renderGroup(res){
  const notes = inGroup(state.group);
  res.innerHTML = `<button class="backpill" type="button" data-back="index">&#8592; All groups</button>
    <div class="seclabel">${esc(state.group)}</div>
    <div class="nlist">${notes.map(n => noteItem(n)).join('')}</div>`;
  wireList(res);
}

function renderSearch(res){
  const hits = NOTES.filter(n => n._hay.includes(state.q));
  if (!hits.length) { res.innerHTML = `<div class="empty">No note matches that search.</div>`; return; }
  res.innerHTML = `<div class="seclabel">${hits.length} note${hits.length===1?'':'s'} matching &ldquo;${esc(state.q)}&rdquo;</div>
    <div class="nlist">${hits.map(n => noteItem(n, n.group)).join('')}</div>`;
  wireList(res);
}

function renderNote(res, n){
  const toc = n.sections.length
    ? `<details class="tocpanel"><summary>Outline</summary><nav class="toc" aria-label="Sections"><ol>` +
      n.sections.map(s => `<li><a class="depth-${s.depth || 2}" href="#${esc(s.id)}" data-sec="${esc(s.id)}">${esc(s.h)}</a></li>`).join('') +
      `</ol></nav></details>` : '';
  res.innerHTML = `<button class="backpill" type="button" data-back="group">&#8592; ${esc(n.group)}</button>
    <div class="notehead"><h2>${esc(n.title)}</h2>
      <div class="notemeta"><span>${esc(n.group)}</span>${n.updated ? `<span>Updated ${esc(n.updated)}</span>` : ''}</div>
    </div><div class="notegrid">${toc}<div class="nbody">${n.html}</div></div>`;
  const panel = res.querySelector('.tocpanel');
  if (panel) panel.open = matchMedia('(min-width: 821px)').matches;
  res.querySelectorAll('.toc a').forEach(a => a.onclick = ev => {
    ev.preventDefault();
    const t = document.getElementById(a.dataset.sec);
    if (t) t.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block:'start' });
    if (panel && matchMedia('(max-width: 820px)').matches) panel.open = false;
  });
  wireBack(res);
  spy();
}

function wireList(res){
  res.querySelectorAll('.nitem').forEach(b => b.onclick = () => selectNote(b.dataset.id));
  wireBack(res);
}
function wireBack(res){
  const b = res.querySelector('.backpill');
  if (!b) return;
  b.onclick = () => {
    if (b.dataset.back === 'group' && state.id && BYID[state.id]) selectGroup(BYID[state.id].group);
    else { state.view='index'; state.group=null; state.id=null; render(true); window.scrollTo(0,0); }
  };
}

// ---- TOC scroll-spy. Registered through window.addEventListener so the oncOS
// One shell captures and removes it when the view is torn down. ----
let spyTick = false;
function spy(){
  const links = document.querySelectorAll('.toc a');
  if (!links.length) return;
  let active = null;
  links.forEach(a => {
    const el = document.getElementById(a.dataset.sec);
    if (el && el.getBoundingClientRect().top <= 130) active = a;
  });
  if (!active) active = links[0];
  const atBottom = window.scrollY + window.innerHeight >= document.documentElement.scrollHeight - 2;
  if (atBottom) active = links[links.length - 1];
  links.forEach(a => {
    const selected = a === active;
    a.classList.toggle('active', selected);
    if (selected) a.setAttribute('aria-current', 'location');
    else a.removeAttribute('aria-current');
  });
  const panel = active.closest('.tocpanel');
  if (panel && panel.open && panel.scrollHeight > panel.clientHeight + 1) {
    const pr = panel.getBoundingClientRect();
    const ar = active.getBoundingClientRect();
    if (ar.top < pr.top) panel.scrollTop -= (pr.top - ar.top) + 8;
    else if (ar.bottom > pr.bottom) panel.scrollTop += (ar.bottom - pr.bottom) + 8;
  }
}
window.addEventListener('scroll', () => {
  if (spyTick) return;
  spyTick = true;
  requestAnimationFrame(() => { spyTick = false; if (state.view === 'note') spy(); });
}, { passive: true });

function render(fade){
  if (fade && !(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches)) {
    const res = document.getElementById('results');
    res.classList.add('vfade');
    setTimeout(() => { if(!res.isConnected) return; renderNow(); res.classList.remove('vfade'); }, 150);
    return;
  }
  renderNow();
}

function renderNow(){
  syncNav();
  const res = document.getElementById('results');
  if (!NOTES.length) { res.innerHTML = `<div class="empty">No notes have been published yet.</div>`; return; }
  if (state.view==='note' && BYID[state.id]) { renderNote(res, BYID[state.id]); return; }
  if (state.view==='search') { renderSearch(res); return; }
  if (state.view==='group' && state.group) { renderGroup(res); return; }
  renderIndex(res);
}
render();

    window.oncosView.openRecord = function(record) {
      if (!record || !BYID[record.id]) return false;
      selectNote(record.id);
      if (record.section) setTimeout(function(){
        var section = document.getElementById(record.section);
        if (section) section.scrollIntoView({block:'start'});
      }, 0);
      return true;
    };
  },
  destroy: function() {

  }
};
</script>
