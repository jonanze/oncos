<script>
window.oncosView = {
  name: 'notes',
  init: function(ctx) {

if (false) {
    window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
  }
const NOTES = [{"id": "breast-breast-cancer-histopathology-receptor-assessment-and-staging", "slug": "breast-cancer-histopathology-receptor-assessment-and-staging", "group": "Breast", "title": "Breast cancer: histopathology, receptor assessment and staging", "updated": "", "sections": [{"id": "s-epidemiology", "h": "Epidemiology"}, {"id": "s-risk-factors", "h": "Risk factors"}, {"id": "s-proliferative-and-in-situ-lesions", "h": "Proliferative and in-situ lesions"}, {"id": "s-invasive-carcinoma", "h": "Invasive carcinoma"}, {"id": "s-molecular-subtypes", "h": "Molecular subtypes"}, {"id": "s-receptor-assessment", "h": "Receptor assessment"}, {"id": "s-genomic-assays", "h": "Genomic assays"}, {"id": "s-pathological-response-after-neoadjuvant-therapy", "h": "Pathological response after neoadjuvant therapy"}, {"id": "s-clinical-presentation", "h": "Clinical presentation"}, {"id": "s-staging", "h": "Staging"}, {"id": "s-work-up", "h": "Work-up"}, {"id": "s-references", "h": "References"}], "html": "<h2 id=\"s-epidemiology\">Epidemiology</h2>\n<p>Breast cancer is the commonest cancer in women by both incidence and mortality, worldwide and in Singapore. The WHO recorded 2.3 million women diagnosed and 670,000 deaths globally in 2022. Incidence is rising while mortality has remained stable or improved. Male breast cancer accounts for approximately 1% of all breast cancers, usually presents above the age of 60, and may be associated with <em>BRCA2</em>.</p>\n<h2 id=\"s-risk-factors\">Risk factors</h2>\n<h3>Non-modifiable</h3>\n<p>Risk rises with age. US SEER estimates of the probability of developing breast cancer are 2.1% from birth to age 49 (1 in 49), 2.5% from 50 to 59 (1 in 42), 3.5% from 60 to 69 (1 in 28), 7% from 70 onwards (1 in 14), and 12.9% over a lifetime (1 in 8). Breast cancer is approximately 100 times more frequent in women than in men. Mammographic breast density reflects the proportion of glandular and connective tissue to adipose tissue. Dense tissue occupying 75% or more of the breast carries a higher cancer risk than lower densities. Density is largely an inherited trait, but is also associated with lower physical activity and a high-fat, low-carbohydrate diet. Reproductive factors that increase risk are earlier menarche, later menopause, nulliparity, increasing age at first full-term pregnancy, and absence of breastfeeding. A personal history of breast cancer raises the risk of a contralateral cancer. In SEER data, invasive contralateral breast cancer occurred in 4% of patients over an average 7.5 years of follow-up (Nichols et al, J Clin Oncol 2011). A personal history of proliferative breast lesions with atypia (atypical ductal hyperplasia, atypical lobular hyperplasia, LCIS) carries risk independently. Family history carries a graded risk (Collaborative Group on Hormonal Factors in Breast Cancer, Lancet 2001):</p>\n<ul><li>one affected first-degree relative, twofold;</li><li>that relative diagnosed before age 30, threefold;</li><li>that relative diagnosed after age 60, 1.5-fold;</li><li>two affected first-degree relatives, threefold.</li></ul>\n<p>High-penetrance germline genes are <em>BRCA1</em> and <em>BRCA2</em>, <em>TP53</em> (Li-Fraumeni), <em>STK11</em> (Peutz-Jeghers), <em>PTEN</em> (PTEN hamartoma tumour syndrome), <em>CDH1</em> (hereditary diffuse gastric and lobular breast cancer), <em>PALB2</em>, and the Lynch syndrome genes. <em>BRCA1</em> carriers are more likely to develop triple-negative disease (70%) and <em>BRCA2</em> carriers hormone receptor-positive disease (70%). Moderate-penetrance genes include <em>CHEK2</em>, <em>ATM</em>, <em>BARD1</em> and <em>RAD51</em>. A history of therapeutic ionising radiation also raises risk, typically mantle or chest radiotherapy for childhood Hodgkin lymphoma.</p>\n<h3>Modifiable</h3>\n<p>Higher body mass index and perimenopausal weight gain are consistently associated with higher risk in postmenopausal women. In a meta-analysis, each 5 kg of adult weight gain carried a relative risk of 1.11 for postmenopausal breast cancer (95% CI 1.08–1.13; JNCI 2015). The mechanism is presumed to be higher oestrogen levels from peripheral conversion of oestrogen precursors in adipose tissue. The relationship inverts before the menopause, and the explanation is unclear. In pooled individual-level data from the Premenopausal Breast Cancer Collaborative Group, the highest body mass index category at ages 18 to 24 (≥35.0) carried lower risk than the lowest (&lt;17.0), a 4.2-fold gradient (HR 0.24, 95% CI 0.14–0.40; JAMA Oncol 2018). Higher endogenous oestrogen levels raise risk, as does exogenous hormone exposure. The Women&#x27;s Health Initiative randomised 16,608 postmenopausal women to oestrogen plus progestin or placebo and was stopped after 5.2 years because of an increased risk of invasive breast cancer (HR 1.26; JAMA 2022). Current or recent oral contraceptive use raises risk, and the association disappears within 2 to 5 years of stopping. Smoking and alcohol use also raise risk.</p>\n<h3>Risk prediction models</h3>\n<p>All three models in common use were created and validated in largely White populations, which limits their calibration elsewhere. The Gail model (BCRAT) calculates absolute risk from three ages, two breast variables and one family variable: current age, age at menarche and age at first live birth; number of previous breast biopsies and whether atypical hyperplasia was found; and the number of affected maternal first-degree relatives, together with race and ethnicity. It returns 5-year and lifetime risk of invasive breast cancer, and a 5-year risk above 1.7% defines the increased-risk group. Gail is not suitable for women with a history of breast cancer, DCIS or LCIS, for women with prior chest radiation for Hodgkin lymphoma, or where the history suggests a germline mutation. Two limitations follow from its inputs: it counts only maternal first-degree relatives, so it underestimates risk in the half of families whose cancers lie in the paternal line, and it ignores the age at which the relative was diagnosed. Sensitivity is 28–44% and specificity 66–88%. The Claus model estimates familial risk only and includes no non-hereditary risk factors; concordance between Gail and Claus is low. Tyrer-Cuzick (IBIS) incorporates family history of breast and ovarian cancer beyond first-degree relatives, is intended for women with no history of breast cancer, and returns 10-year and lifetime risk together with the probability of carrying a <em>BRCA1</em> or <em>BRCA2</em> mutation. It generally predicts higher risks than the other models.</p>\n<h2 id=\"s-proliferative-and-in-situ-lesions\">Proliferative and in-situ lesions</h2>\n<p>Proliferative lesions are divided by whether atypia is present.</p>\n<ul><li>Atypical hyperplasia, ductal or lobular, is usually diagnosed incidentally on biopsy of microcalcifications and raises the risk of both ipsilateral and contralateral cancer.</li><li>Flat epithelial atypia is also usually incidental, and raises the risk of DCIS and invasive cancer.</li></ul>\n<p>DCIS and LCIS are distinguished by growth pattern and cytological features rather than by their anatomic location within the ductal-lobular system.</p>\n<p>DCIS is a proliferation of malignant epithelial cells within the mammary ductal system with no invasion of the surrounding stroma. It differs from lobular carcinoma in radiological appearance, morphology, biological behaviour and anatomic distribution.</p>\n<p>Five architectural types are described: comedo, which is the type most often associated with invasion, papillary, micropapillary, cribriform and solid. LCIS arises from the lobule at the terminal end of the duct and is distributed diffusely through the breast, so it usually presents without a palpable mass. It is indolent, has low malignant potential, and is not managed as a precursor lesion; it confers risk of subsequent invasive cancer in either breast. Two consequences follow for a core biopsy result:</p>\n<ul><li>excise any non-classical LCIS (pleomorphic LCIS, or LCIS with necrosis), and any LCIS with imaging-pathological discordance;</li><li>observe incidental classical LCIS with concordant imaging and no other high-risk lesion requiring excision, with clinical and imaging follow-up decided on risk assessment and multidisciplinary input.</li></ul>\n<h2 id=\"s-invasive-carcinoma\">Invasive carcinoma</h2>\n<h3>Grading</h3>\n<p>Invasive carcinoma is graded by the Nottingham criteria, which score gland formation, nuclear atypia and mitotic count from 1 to 3 each. A total of 3–5 is grade 1, 6–7 grade 2 and 8–9 grade 3.</p>\n<div class=\"tblwrap\"><table><thead><tr><th scope=\"col\">Score</th><th scope=\"col\">1</th><th scope=\"col\">2</th><th scope=\"col\">3</th></tr></thead><tbody><tr><td>Gland (acinus) formation</td><td>&gt;75% of the carcinoma forming glandular or tubular structures</td><td>10–75% forming glandular or tubular structures</td><td>&lt;10% forming glandular or tubular structures</td></tr><tr><td>Nuclear atypia / pleomorphism</td><td>Small nuclei, little increase in size over normal breast epithelium, regular outlines, uniform chromatin, little variation in size</td><td>Cells larger than normal, open vesicular nuclei, visible nucleoli, moderate variation in size and shape</td><td>Vesicular nuclei, often prominent nucleoli, marked variation in size and shape, occasionally very large and bizarre forms</td></tr><tr><td>Mitotic count</td><td>Cells with definite mitoses in 10 consecutive fields, scored 1 to 3</td><td></td><td></td></tr></tbody></table></div>\n<h3>Histological subtypes</h3>\n<p>Invasive carcinoma of no special type, the category formerly reported as invasive ductal carcinoma, accounts for 76% of invasive breast cancer and tends to metastasise via the lymphatics. Invasive lobular carcinoma accounts for 8%. Compared with ductal carcinoma it is more often bilateral and multicentric, arises in older women, is larger and better differentiated, and metastasises later and to unusual sites including the peritoneum, meninges and gastrointestinal tract. It is associated with <em>CDH1</em> mutation, and loss of E-cadherin staining distinguishes it from ductal carcinoma. Four special types carry a more favourable prognosis than ductal or lobular carcinoma.</p>\n<ul><li>Mucinous (colloid) carcinoma, 2.4%, presents later in life as a palpable mass or as a poorly defined mammographic tumour with rare calcifications; it tends to be well circumscribed, and mucin production is the histological hallmark.</li><li>Tubular carcinoma, 7%, shows a single layer of epithelial cells with low-grade nuclei and apical cytoplasmic snouting arranged in well-formed tubules and glands, with a low incidence of nodal involvement and high overall survival.</li><li>Cribriform carcinoma.</li><li>Adenoid cystic carcinoma is morphologically similar to salivary gland tumours, spreads to nodes in fewer than 5% of cases, and is usually triple-negative.</li></ul>\n<p>The remaining histologies are heterogeneous.</p>\n<ul><li>Tubulolobular carcinoma has hybrid features of tubular carcinoma and invasive lobular carcinoma. Immunohistochemistry implies a ductal phenotype, but it behaves like lobular carcinoma and tends to be multifocal or multicentric.</li><li>Papillary carcinoma, 1%, comes in a cystic non-invasive form and an invasive micropapillary ductal form. It is centrally located, may present with bloody nipple discharge, is strongly ER/PR-positive, and involves nodes frequently.</li><li>Metaplastic carcinoma covers a wide range of patterns including spindle-cell carcinoma, carcinosarcoma, squamous carcinoma of ductal origin, adenosquamous carcinoma, carcinoma with pseudosarcomatous metaplasia and matrix-producing carcinoma. It is larger and faster-growing, commonly node-negative, and typically triple-negative.</li><li>Phyllodes tumour, under 1%, is classified benign, borderline or malignant on stromal cellularity, infiltration at the tumour edge and mitotic activity. Malignant phyllodes behaves like a sarcoma and metastasises haematogenously, which is why wide local excision is the priority; chemotherapy and radiotherapy are not effective in recurrent or metastatic disease.</li></ul>\n<p>Mammary Paget disease is intraepithelial adenocarcinoma within the epidermis of the nipple-areola complex. It is predominantly unilateral and develops insidiously as a scaly, fissured, oozing or erythematous nipple-areola complex, often with retraction or ulceration and with itch, tingling, burning or pain. Underlying in-situ or invasive breast cancer is present in more than 85% of cases, frequently without a palpable mass or mammographic abnormality. Treatment follows the underlying breast pathology, and where none is found it follows the DCIS pathway. Inflammatory breast cancer is an aggressive locally advanced presentation, with nodal involvement and distant metastases common at diagnosis. It is defined clinically rather than histologically, and dermal lymphatic invasion by tumour cells is seen on skin punch biopsy.</p>\n<h2 id=\"s-molecular-subtypes\">Molecular subtypes</h2>\n<ul><li>Luminal A, 40%, is the commonest subtype and carries the best prognosis. It shows high expression of ER genes, low expression of HER2 genes, and low expression of proliferation-related genes and <em>TP53</em>, and typically expresses cytokeratins 8 and 18.</li><li>Luminal B, 20%, shows lower ER expression than luminal A, variable HER2 expression and high expression of proliferation genes, and also expresses cytokeratins 8 and 18. Prognosis is worse than luminal A and most have high recurrence scores.</li><li>HER2-enriched, 10–15%, shows high expression of HER2 and proliferation gene clusters with low expression of luminal and basal clusters, and is often ER/PR-negative. HER2 signalling drives proliferation, resistance to apoptosis, cell motility and neoangiogenesis.</li><li>Basal, 10–15%, is triple-negative in most cases, shows high expression of proliferation genes, and is strongly associated with <em>BRCA1</em> and with sensitivity to DNA-damaging agents such as platinums.</li></ul>\n<h2 id=\"s-receptor-assessment\">Receptor assessment</h2>\n<p>A prognostic factor gives information about outcome independent of therapy, such as nodal status, Ki-67 or triple-negative histology. A predictive factor gives information about the likelihood of response to a particular treatment: hormone receptor status predicts response to endocrine therapy, and HER2 status predicts response to HER2-directed therapy. Both hormone receptor and HER2 assessment are therefore run on every invasive cancer, and repeated on a biopsy of recurrent or metastatic disease.</p>\n<h3>Hormone receptors</h3>\n<p>ER and PR are assessed by immunohistochemistry and reported as positive when staining is present in 1% or more of tumour cells. Staining in 1 to 10% of cells is reported as ER-low positive. The Allred score, which sums a proportion score and an intensity score, is the alternative semiquantitative report.</p>\n<h3>HER2</h3>\n<p>HER2 is both prognostic and predictive. It is a member of the EGFR tyrosine kinase family of four transmembrane receptor proteins (EGFR1, HER2, HER3, HER4). Receptor activation, by ligand binding or by ligand-independent homo- or heterodimerisation, stimulates cellular growth, survival, migration and angiogenesis. A cancer is HER2-positive on immunohistochemistry of 3+, or on demonstrated gene amplification by in-situ hybridisation. Immunohistochemistry is scored on the completeness and intensity of membrane staining and the proportion of invasive tumour cells stained.</p>\n<div class=\"tblwrap\"><table><thead><tr><th scope=\"col\">Score</th><th scope=\"col\">Staining</th></tr></thead><tbody><tr><td>0</td><td>No staining, or incomplete membrane staining in ≤10% of tumour cells</td></tr><tr><td>1+</td><td>Incomplete membrane staining in &gt;10% of tumour cells</td></tr><tr><td>2+ (equivocal)</td><td>Weak or moderate complete membrane staining in &gt;10% of invasive tumour cells</td></tr><tr><td>3+ (positive)</td><td>Uniform intense membrane staining in &gt;10% of invasive tumour cells</td></tr></tbody></table></div>\n<p>The 3+ threshold was 30% before it was revised to 10%. Dual-probe in-situ hybridisation counts HER2 gene copies against the chromosome 17 centromeric probe. Amplification is present, and the cancer is HER2-positive, when the HER2:CEP17 ratio is 2.0 or above and the average HER2 copy number is 4.0 or more signals per cell; a ratio below 2 with fewer than 4 signals per nucleus is negative. The remaining three combinations are equivocal and are retested. The recount resolves them as follows:</p>\n<ul><li>Copy number below 4 with a ratio of 2 or above: HER2-negative with a comment.</li><li>Copy number 6 or above with a ratio below 2: HER2-positive.</li><li>Copy number 4 to 6 with a ratio below 2: HER2-negative with a comment.</li></ul>\n<p>The final report on an equivocal specimen follows the concurrent HER2 immunohistochemistry together with the recount, not the counts alone.</p>\n<h3>HER2-low and HER2-ultralow</h3>\n<p>A HER2 immunohistochemistry score below 3+ is no longer a single negative category. HER2-low means immunohistochemistry of 1+, or 2+ with negative in-situ hybridisation; HER2-ultralow means a score of 0 with faint incomplete membrane staining in 10% or fewer cells, which the conventional scale does not separate from a complete absence of staining. <a class=\"trial-link\" href=\"/evidence/#t-destiny-breast04\">DESTINY-Breast04</a> established HER2-low as a targetable category in previously treated advanced disease (N Engl J Med 2022;387:9-20), and <a class=\"trial-link\" href=\"/evidence/#t-destiny-breast06\">DESTINY-Breast06</a> moved it into chemotherapy-naive hormone receptor-positive disease after at least one endocrine line, with an exploratory HER2-ultralow cohort (N Engl J Med 2024;391:2110-2122). The consequence for reporting is that a score of 0 must be distinguished from 1+, and faint incomplete staining recorded rather than reported as absent.</p>\n<h2 id=\"s-genomic-assays\">Genomic assays</h2>\n<p>Genomic assays are used in hormone receptor-positive, HER2-negative early breast cancer to estimate recurrence risk and, for one assay, the benefit expected from adding chemotherapy. Oncotype DX is the only one validated as predictive of chemotherapy benefit; the others are prognostic. Oncotype DX is an RT-PCR platform reading 16 cancer-related and 5 reference genes, modelled into a recurrence score from 0 to 100. <a class=\"trial-link\" href=\"/evidence/#t-paik-et-al-nsabp-b-20-validation\">Paik et al. (NSABP B-20 validation)</a> tested archived tissue from both randomised arms of NSABP B-20, in node-negative, ER-positive disease, and showed that the score predicts the magnitude of chemotherapy benefit, not only prognosis: a high score (≥31) carried a large benefit (relative risk 0.26, 95% CI 0.13–0.53; absolute 10-year distant recurrence reduction 27.6%) and a low score (&lt;18) carried minimal benefit (relative risk 1.31, 95% CI 0.46–3.78; absolute difference −1.1%), with a significant interaction between score and chemotherapy (P=0.038; J Clin Oncol 2006;24:3726-3734). Two prospective trials define where the score can be acted on. <a class=\"trial-link\" href=\"/evidence/#t-tailorx\">TAILORx</a> randomised the 6,711 women (69%) with a midrange score of 11–25 and node-negative disease, and endocrine therapy alone was non-inferior to chemoendocrine therapy for invasive disease-free survival (HR 1.08, 95% CI 0.94–1.24, P=0.26; 9-year invasive disease-free survival 83.3% vs 84.3%; N Engl J Med 2018;379:111-121). A prespecified age interaction (P=0.004) left residual chemotherapy benefit in women aged 50 or younger with a score of 16–25. <a class=\"trial-link\" href=\"/evidence/#t-rxponder-swog-s1007\">RxPONDER (SWOG S1007)</a> extended the assay to 1–3 positive nodes with a score of 25 or below. The score-by-treatment interaction was not significant (P=0.35), so the score stayed prognostic but stopped predicting relative chemotherapy benefit, and a prespecified menopausal-status interaction became the governing variable (P=0.008): postmenopausal women derived no benefit (invasive disease-free survival HR 1.02, 95% CI 0.82–1.26, P=0.89) and premenopausal women a clear one (HR 0.60, 95% CI 0.43–0.83, P=0.002; N Engl J Med 2021;385:2336-2347). MammaPrint is a 70-gene signature returning a binary low or high genomic risk. It is prognostic only, validated on FFPE tissue for tumours of 5 cm or less with 0 to 3 involved nodes, regardless of receptor status and menopausal status. <a class=\"trial-link\" href=\"/evidence/#t-mindact\">MINDACT</a> tested it against clinicopathological risk. Among the 1,550 women (23.2%) at high clinical but low genomic risk who forwent chemotherapy, 5-year survival without distant metastasis was 94.7% (95% CI 92.5–96.2), clearing the prespecified 92% boundary; the secondary randomised comparison within that discordant group was underpowered (95.9% vs 94.4%; adjusted HR 0.78, 95% CI 0.50–1.21, P=0.27; N Engl J Med 2016;375:717-729). PAM50 assigns intrinsic subtype and generates a risk-of-recurrence score. Luminal A tumours by PAM50 have a very good prognosis without chemotherapy, whereas luminal B tumours are more likely to recur on endocrine therapy alone. <a class=\"trial-link\" href=\"/evidence/#t-optima\">OPTIMA</a> tested risk-of-recurrence-directed treatment in high clinical-risk disease, most of it node-positive, and found it non-inferior to standard chemotherapy (5-year invasive breast cancer-free survival 90.4% vs 91.5%, HR 0.99, 90% CI 0.81–1.20, non-inferiority P=0.013), with 68% of patients falling in the low-score group; this is an ASCO 2026 abstract rather than a full publication (J Clin Oncol 2026;44(suppl):500). <a class=\"trial-link\" href=\"/evidence/#t-aster-70s\">ASTER 70s</a> tested the genomic grade index in women aged 70 or older with genomically high-risk ER-positive, HER2-negative disease, and adding chemotherapy did not significantly improve 8-year overall survival (72.7% vs 68.3%, HR 0.83, 95% CI 0.63–1.11, P=0.21) while grade 3 or higher adverse events rose from 9% to 34% (Lancet 2025;406:489-500). Risk calculators such as NHS Predict estimate recurrence and mortality risk and the benefit expected from chemotherapy, but they do not account for all biomarkers or for the interaction between tumour biology and treatment effect, and they do not substitute for a molecular assay.</p>\n<h2 id=\"s-pathological-response-after-neoadjuvant-therapy\">Pathological response after neoadjuvant therapy</h2>\n<p>Where systemic therapy is given before surgery, the resection specimen is reported for residual disease. <a class=\"trial-link\" href=\"/evidence/#t-ctneobc-pooled-analysis\">CTNeoBC pooled analysis</a> settled which specimen state to report: clearing tumour from both breast and nodes (ypT0 ypN0 or ypT0/is ypN0) predicted overall survival better (HR 0.36 for both) than clearing the breast alone (ypT0/is, HR 0.51; Lancet 2014;384:164-172). At patient level, pCR defined as ypT0/is ypN0 predicted event-free survival (HR 0.48, 95% CI 0.43–0.54) and overall survival (HR 0.36, 0.31–0.42), most strongly in triple-negative disease (event-free survival HR 0.24) and in HER2-positive, hormone-receptor-negative disease treated with trastuzumab (HR 0.15). <a class=\"trial-link\" href=\"/evidence/#t-residual-cancer-burden-symmans\">Residual Cancer Burden (Symmans)</a> grades what remains rather than treating all non-pCR specimens as one bin, using a continuous index with predefined cut points at 1.36 and 3.28 to give classes RCB-0 (pCR) through RCB-III (J Clin Oncol 2017;35:1049-1060). It is a pooled five-cohort single-institution validation rather than a randomised trial, and the index is prognostic only. Better pathological response at trial level does not guarantee better survival, and the strength of pCR as a surrogate differs by subtype.</p>\n<h2 id=\"s-clinical-presentation\">Clinical presentation</h2>\n<p>Presentation is by screen-detected mammographic abnormality, a breast mass, skin changes, or symptoms of metastatic disease. The commonest metastatic sites are bone (back or leg pain), liver (abdominal pain, nausea, jaundice) and lung (breathlessness, cough). Brain metastases are more common in the HER2-enriched and basal intrinsic subtypes. Imaging features that raise suspicion differ by modality:</p>\n<ul><li>mammography: spiculated mass, high density;</li><li>ultrasound: hypoechogenicity, internal calcification, shadowing, a lesion taller than wide, and spiculated, indistinct or angular margins;</li><li>contrast-enhanced MRI: irregular or spiculated margins, heterogeneous internal enhancement, enhancing internal septa.</li></ul>\n<p>Tissue is obtained by core biopsy of the tumour; fine-needle aspiration is sufficient for axillary nodes.</p>\n<h2 id=\"s-staging\">Staging</h2>\n<p>Staging follows the AJCC 8th edition. T is defined by size, and the criteria are identical for clinical and pathological staging.</p>\n<p>Inflammatory breast cancer is staged as T4d. All four of the following are required:</p>\n<ul><li>rapid onset of breast erythema, oedema or peau d&#x27;orange, or a warm breast, with or without a palpable mass;</li><li>a history of less than 6 months;</li><li>erythema involving at least one third of the breast;</li><li>pathological confirmation of invasive carcinoma.</li></ul>\n<p>AJCC 8 carries two parallel stage assignments. The anatomic stage is TNM alone. The prognostic stage combines TNM with histological grade (G1–3) and ER, PR and HER2 status, so a small high-grade triple-negative tumour and a small low-grade hormone receptor-positive tumour of the same size no longer share a stage. The recurrence score enters the prognostic stage in one defined situation: in T1 or T2, N0, M0 disease that is HER2-negative and ER-positive, an Oncotype DX result below 11 assigns prognostic stage IA.</p>\n<h2 id=\"s-work-up\">Work-up</h2>\n<p>Staging investigations in non-metastatic disease are directed by symptoms and biochemistry:</p>\n<ul><li>bone scan for bone pain or a raised alkaline phosphatase;</li><li>CT abdomen and pelvis for abnormal liver function tests, a raised alkaline phosphatase, abdominal pain or an abnormal abdominopelvic examination;</li><li>CT thorax for pulmonary symptoms;</li><li>whole-body PET-CT, or bone scan with CT thorax/abdomen/pelvis, from stage IIIA upwards.</li></ul>\n<p>In non-metastatic disease (cT1-3, cN0 or above, M0) the work-up also determines whether the patient is a candidate for neoadjuvant systemic therapy. Where pre-operative therapy is being considered, add axillary ultrasound with fine-needle aspiration of suspicious nodes, and CT thorax/abdomen/pelvis and bone scan as clinically indicated. Stage IV or recurrent disease requires CT thorax, CT or MRI abdomen and pelvis, MRI brain if CNS symptoms are present, MRI spine for back pain or symptoms of cord compression, and bone scan with plain radiographs of symptomatic bones. Biopsy recurrent disease and re-evaluate ER, PR and HER2 status on that specimen.</p>\n<h2 id=\"s-references\">References</h2>\n<ol class=\"refs\">\n<li><a class=\"trial-link\" href=\"/evidence/#t-destiny-breast04\">DESTINY-Breast04</a>. <a href=\"https://drive.google.com/file/d/1sz6jHZqXGadMeSpVtrwopFJlBfJC0gnj/preview\">N Engl J Med 2022;387:9-20</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-destiny-breast06\">DESTINY-Breast06</a>. <a href=\"https://drive.google.com/file/d/1iiK_y_JE-EHFESx-UeeWDBFRRamz6Ke9/preview\">N Engl J Med 2024;391:2110-2122</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-paik-et-al-nsabp-b-20-validation\">Paik et al. (NSABP B-20 validation)</a>. <a href=\"https://drive.google.com/file/d/12hzUlxiaPb2mQE4_k93mouxa1X03Z-EZ/preview\">J Clin Oncol 2006;24:3726-3734</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-tailorx\">TAILORx</a>. <a href=\"https://drive.google.com/file/d/1CEl0W1GmrenmvIWTQtoIz6kBSdLqTP0g/preview\">N Engl J Med 2018;379:111-121</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-rxponder-swog-s1007\">RxPONDER (SWOG S1007)</a>. <a href=\"https://drive.google.com/file/d/1qy7DtRzL4-LYQ45M4PsJNvqH2VQetRyC/preview\">N Engl J Med 2021;385:2336-2347</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-mindact\">MINDACT</a>. <a href=\"https://drive.google.com/file/d/1zU49xAotJIjoFcys7EJg8bViaKRjqXV-/preview\">N Engl J Med 2016;375:717-729</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-optima\">OPTIMA</a>. <a href=\"https://drive.google.com/file/d/1oqpwkxi5mF3C5sFnxXOAt2CUrwReeMN_/preview\">J Clin Oncol 2026;44(suppl):500 (ASCO 2026 abstract)</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-aster-70s\">ASTER 70s</a>. <a href=\"https://drive.google.com/file/d/1OJfrf2DEvSJe_y-t_M-EEDfRATBLajWP/preview\">Lancet 2025;406:489-500</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-ctneobc-pooled-analysis\">CTNeoBC pooled analysis</a>. <a href=\"https://drive.google.com/file/d/1jvK9nfPbnTPqNWvCU2_Vm6WRJ7IYLg1d/preview\">Lancet 2014;384:164-172</a>; <a href=\"https://drive.google.com/file/d/1PsIhGkSFxN_QG7PcpxAnOEBi6XW16H6d/preview\">J Clin Oncol 2023;41:2988-2997</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-residual-cancer-burden-symmans\">Residual Cancer Burden (Symmans)</a>. <a href=\"https://drive.google.com/file/d/1E-JYtupEi6MpmwjGPbL216DQk832voAB/preview\">J Clin Oncol 2017;35:1049-1060</a></li>\n</ol>", "_hay": "breast cancer: histopathology, receptor assessment and staging breast-cancer-histopathology-receptor-assessment-and-staging breast epidemiology risk factors proliferative and in-situ lesions invasive carcinoma molecular subtypes receptor assessment genomic assays pathological response after neoadjuvant therapy clinical presentation staging work-up references non-modifiable modifiable risk prediction models grading histological subtypes hormone receptors her2 her2-low and her2-ultralow"}, {"id": "breast-ductal-carcinoma-in-situ", "slug": "ductal-carcinoma-in-situ", "group": "Breast", "title": "Ductal carcinoma in situ", "updated": "", "sections": [{"id": "s-biology-and-natural-history", "h": "Biology and natural history"}, {"id": "s-diagnosis-and-work-up", "h": "Diagnosis and work-up"}, {"id": "s-surgery", "h": "Surgery"}, {"id": "s-radiotherapy-after-breast-conservation", "h": "Radiotherapy after breast conservation"}, {"id": "s-systemic-therapy", "h": "Systemic therapy"}, {"id": "s-follow-up-and-prognosis", "h": "Follow-up and prognosis"}], "html": "<h2 id=\"s-biology-and-natural-history\">Biology and natural history</h2>\n<p>Ductal carcinoma in situ is a proliferation of presumably malignant epithelial cells confined within the mammary ductal system, with no invasion of the surrounding stroma. Treatment is directed at preventing progression to invasive carcinoma, and the risk of that progression exceeds 50%. Grade is assigned on nuclear features as low (G1), intermediate (G2) or high (G3). Low-grade and high-grade lesions differ in ploidy, receptor status, proliferation and the HER2 and p53 abnormalities they carry.</p>\n<ul><li>Low-grade lesions are diploid and ER/PR positive, have a low proliferative rate, and rarely carry HER2 or p53 abnormalities.</li><li>High-grade lesions are aneuploid and ER/PR negative, have a high proliferative rate, overexpress HER2 and carry p53 mutations.</li></ul>\n<p>The prognostic features are tumour size, necrosis, nuclear grade and the width of the surgical margin.</p>\n<p>A core biopsy diagnosis of DCIS understates the disease in a substantial minority: invasive carcinoma is found in 10–20% of excision specimens. That upstaging rate is the reason sentinel node biopsy is considered at the time of surgery.</p>\n<h2 id=\"s-diagnosis-and-work-up\">Diagnosis and work-up</h2>\n<p>Work-up establishes nuclear grade and ER status. ER status does not alter local treatment; it determines whether endocrine therapy for risk reduction is worth offering. The role of breast MRI is unclear. Prospective data give a sensitivity of up to 98% for high-grade DCIS, but MRI overestimates disease extent, and it has not been shown to increase the rate of negative margins or to reduce conversion to mastectomy. Do not decide on mastectomy from MRI findings alone. Where MRI suggests more extensive disease than mammography, such that a markedly larger resection would be needed for complete excision, confirm the extra disease histologically by MRI-guided biopsy first.</p>\n<h2 id=\"s-surgery\">Surgery</h2>\n<p>The choice is between breast-conserving surgery (lumpectomy or wide excision) with adjuvant radiotherapy, and mastectomy. In a 2015 SEER observational study of more than 100,000 patients, breast conservation with or without radiotherapy gave 10-year breast-cancer-specific mortality similar to mastectomy. Mastectomy is overly aggressive for many women and carries more frequent postoperative complications; conservation is less morbid but carries the higher risk of local recurrence. Criteria for breast conservation:</p>\n<ul><li>disease that is not multicentric, multicentricity meaning two or more foci separated by significant disease, usually across more than one quadrant;</li><li>a cosmetically acceptable resection, which in practice means a low ratio of disease size to breast size;</li><li>histologically negative margins of at least 2 mm.</li></ul>\n<p>The 2 mm threshold comes from a meta-analysis of 4,660 patients with DCIS treated by conservation and radiotherapy, in which margins under 2 mm were associated with higher rates of ipsilateral breast tumour recurrence than margins of 2 mm or more (J Clin Oncol 2009). The SSO/ASTRO/ASCO consensus guideline adopts the same threshold for conservation plus radiotherapy. Sentinel node biopsy is not staging for the DCIS itself. It is done when the operation would make a later sentinel node biopsy impossible, or when the likelihood of occult invasive cancer is high enough to warrant staging the axilla at the same sitting.</p>\n<ul><li>Total mastectomy permanently alters lymphatic drainage, so an accurate sentinel node biopsy cannot be performed afterwards if invasive cancer is found unexpectedly in the specimen. Patients requiring mastectomy also have a higher likelihood of harbouring invasive cancer than those with a smaller focus of disease, and should have sentinel node biopsy at the same operation.</li><li>Patients who are candidates for conservation but opt for mastectomy should have the same discussion.</li><li>After conservation, sentinel node biopsy remains possible as a second procedure if invasive cancer is found in the specimen, so it is not done up front.</li></ul>\n<h2 id=\"s-radiotherapy-after-breast-conservation\">Radiotherapy after breast conservation</h2>\n<p>Radiotherapy after conservation reduces the risk of in-breast tumour recurrence by 50%, with no effect on distant recurrence or mortality. A 2009 meta-analysis (Goodwin et al) pooled EORTC 10853, NSABP B-17, SweDCIS and UKCCCR, 3,925 patients in total. Radiotherapy after conservation reduced all ipsilateral breast events (HR 0.49, P&lt;0.00001), with 9 patients needing treatment to prevent one ipsilateral recurrence, and deaths from vascular disease, pulmonary toxicity and second cancers were not significantly higher in the irradiated women. NSABP B-17 randomised DCIS after wide local excision to 50 Gy or no radiotherapy. At 15 years the ipsilateral invasive recurrence rate was 8.9% with radiotherapy against 19.4% without, and overall survival was similar (83% vs 84%; Fisher, N Engl J Med 1999). UKCCCR randomised 1,701 women after conservation in a two-by-two design, to radiotherapy or none and to tamoxifen or none (Houghton, Lancet 2010). At a median follow-up of 12.7 years, radiotherapy reduced all new breast events (HR 0.41), ipsilateral invasive disease (HR 0.32) and ipsilateral DCIS (HR 0.38), but not contralateral breast cancer. Tamoxifen reduced all new breast events (HR 0.71), recurrent ipsilateral DCIS (HR 0.70) and contralateral tumours (HR 0.44), but not ipsilateral invasive disease. Delivery is whole-breast radiotherapy started within 8 weeks of surgery, 45–50 Gy in daily fractions of 1.8–2 Gy over 4.5–5 weeks, followed by a boost to the surgical bed. The boost gives a small but statistically significant reduction in ipsilateral breast tumour recurrence across all age groups (4% at 20 years), but that evidence is in invasive breast cancer rather than DCIS.</p>\n<h3>Omitting radiotherapy in low-risk disease</h3>\n<p>For fully resected low-risk disease, and particularly for ER-positive disease that will receive endocrine therapy, the absolute reduction in in-breast recurrence may be too small to justify the risks of radiotherapy. There are no strict criteria for low risk; the working definition is low or intermediate grade, size under 2.5 cm, and widely negative margins of at least 3 mm. RTOG 9804 tested this in 636 patients with good-risk DCIS, defined as low to intermediate grade, under 2.5 cm and margins of at least 3 mm, randomised after conservation to radiotherapy or observation. It closed early because accrual fell below projection. At a median follow-up of 7.17 years, the primary endpoint of ipsilateral local failure was 0.9% with radiotherapy against 6.7% with observation at 7 years, with more grade 1–2 toxicity (76% vs 30%) and no difference in disease-free or overall survival (J Clin Oncol 2015). At 15 years radiotherapy had reduced local failure by 50%. Radiotherapy still improves local control in good-risk disease, so omission trades an absolute increase in local failure of 5.8 percentage points at 7 years against the toxicity of treatment. Accelerated partial breast irradiation is the intermediate option. DCIS made up between 6% and 25% of the populations of NSABP B-39/RTOG 0413, OCOG-RAPID, the University of Florence trial and GEC-ESTRO, all of which recruited breast cancer of 3 cm or less. Partial breast irradiation was non-inferior to whole-breast radiotherapy for local control, so DCIS meeting the RTOG 9804 criteria can be treated with partial breast irradiation instead.</p>\n<h2 id=\"s-systemic-therapy\">Systemic therapy</h2>\n<p>Chemotherapy has no role, because the risk of distant metastatic disease is low and the prognosis good. Systemic therapy after surgery reduces the risk of a subsequent invasive cancer in the ipsilateral or contralateral breast; it is not treatment of the DCIS.</p>\n<ul><li>Conservation, ER or PR positive: 5 years of endocrine therapy.</li><li>Mastectomy, ER or PR positive: consider endocrine therapy to prevent contralateral breast cancer.</li><li>ER and PR negative: consider tamoxifen to prevent a subsequent ER/PR-positive ipsilateral or contralateral cancer, which is a low absolute risk.</li></ul>\n<p>The options are tamoxifen 20 mg daily and anastrozole. Anastrozole carries loss of bone density, fractures and cardiovascular risk. Tamoxifen carries endometrial cancer and cataract, and is contraindicated after deep vein thrombosis or pulmonary embolism, so an aromatase inhibitor may be preferable in that setting, and tamoxifen where osteoporosis dominates. NSABP B-24 randomised patients treated by conservation and radiotherapy to tamoxifen or placebo. At a median follow-up of 13.6 years tamoxifen gave an absolute risk reduction of 3.4% in ipsilateral breast tumour recurrence and 3.2% in contralateral breast cancer, with 10-year cumulative ipsilateral rates of 4.6% invasive and 5.6% non-invasive against 7.3% and 7.2% on placebo, and no difference in overall survival. Higher ER expression predicted benefit. NCCN accordingly suggests 5 years of tamoxifen for ER-positive DCIS treated by conservation. UKCCCR reported the tamoxifen effect separately by radiotherapy status. The reduction in ipsilateral and contralateral events was seen in the women who did not receive whole-breast radiotherapy (ipsilateral HR 0.77, 95% CI 0.59 to 0.98; contralateral HR 0.27, 95% CI 0.12 to 0.59) and not in those who did (ipsilateral HR 0.93, 95% CI 0.50 to 1.75, P=.80; contralateral HR 0.99, 95% CI 0.39 to 2.49, P=1.0). Without a test of interaction, and with the wider intervals in the irradiated subgroup, this does not establish that tamoxifen adds less after radiotherapy. NSABP B-35 compared 5 years of anastrozole with 5 years of tamoxifen in 3,100 postmenopausal women with HR-positive DCIS treated by conservation. At 9 years anastrozole gave a lower incidence of recurrent DCIS or invasive breast cancer (HR 0.73) and better estimated 10-year breast-cancer-free survival (93% vs 89%), with no significant difference in disease-free or overall survival; benefit was seen mostly in women under 60. Anastrozole is comparable to tamoxifen for postmenopausal patients with ER-positive DCIS. NSABP B-43 added trastuzumab to radiotherapy in 2,014 participants. It did not meet its objective of a 36% reduction in ipsilateral breast tumour recurrence, achieving a modest and statistically non-significant reduction of 19%. There is no role for HER2-directed therapy in DCIS.</p>\n<h2 id=\"s-follow-up-and-prognosis\">Follow-up and prognosis</h2>\n<p>History and examination every 6–12 months for 5 years and annually thereafter, with annual mammography.</p>\n<p>SEER data put 20-year breast cancer mortality after DCIS at 3.3%, the 20-year risk of ipsilateral invasive recurrence at 5.9%, and the risk of contralateral invasive recurrence at 6.2%. Age under 35, high-grade lesions and ER negativity predict death from breast cancer. The aim of treatment is to reduce the risk of a subsequent invasive breast cancer rather than to prolong life; no treatment for DCIS has shown a survival benefit.</p>", "_hay": "ductal carcinoma in situ ductal-carcinoma-in-situ breast biology and natural history diagnosis and work-up surgery radiotherapy after breast conservation systemic therapy follow-up and prognosis omitting radiotherapy in low-risk disease"}, {"id": "breast-early-breast-cancer", "slug": "early-breast-cancer", "group": "Breast", "title": "Early breast cancer", "updated": "", "sections": [{"id": "s-scope-and-the-shape-of-the-decision", "h": "Scope and the shape of the decision"}, {"id": "s-breast-surgery", "h": "Breast surgery"}, {"id": "s-axillary-management", "h": "Axillary management"}, {"id": "s-radiotherapy", "h": "Radiotherapy"}, {"id": "s-adjuvant-chemotherapy-the-backbone", "h": "Adjuvant chemotherapy: the backbone"}, {"id": "s-hr-positive-her2-negative-disease", "h": "HR-positive, HER2-negative disease"}, {"id": "s-her2-positive-disease", "h": "HER2-positive disease"}, {"id": "s-triple-negative-disease", "h": "Triple-negative disease"}, {"id": "s-bone-modifying-agents", "h": "Bone-modifying agents"}, {"id": "s-older-and-less-fit-patients", "h": "Older and less fit patients"}, {"id": "s-follow-up", "h": "Follow-up"}, {"id": "s-references", "h": "References"}], "html": "<h2 id=\"s-scope-and-the-shape-of-the-decision\">Scope and the shape of the decision</h2>\n<p>Non-metastatic breast cancer divides into early-stage disease (stage I, IIA, and the T2N1 subset of IIB) and locally advanced disease (the T3N0 subset of IIB, and stages IIIA to IIIC). Early-stage disease is normally treated by primary surgery to the breast and regional nodes, with or without radiotherapy, and adjuvant systemic therapy is then chosen on tumour size, nodal count, ER and PR expression, and HER2 status. Neoadjuvant therapy is preferred where it would permit breast conservation, convert a clinically node-positive axilla to ypN0, or generate the in-vivo response readout that directs post-operative escalation; that pathway is covered in the neoadjuvant chapter. Two categories of tumour feature drive everything below, and they are not interchangeable.</p>\n<ul><li>Prognostic factors describe outcome independent of treatment: nodal status, grade, Ki67, tumour size, triple-negative phenotype.</li><li>Predictive factors describe the likelihood of response to a specific therapy: HR status predicts response to endocrine therapy, HER2 status to anti-HER2 therapy, and the 21-gene recurrence score to chemotherapy benefit.</li></ul>\n<p>Clinical risk estimates how much recurrence is available to prevent; a predictive assay estimates whether a given treatment will prevent it. Age under 35 is associated with more aggressive biology, more advanced presentation, ER-negative disease and a higher chance of a germline <em>BRCA1/2</em> variant.</p>\n<h2 id=\"s-breast-surgery\">Breast surgery</h2>\n<h3>Breast conservation versus mastectomy</h3>\n<p>Breast-conserving surgery with radiotherapy is equivalent to mastectomy for survival. NSABP B-04 compared radical with total mastectomy, with or without radiotherapy and no adjuvant systemic therapy in any arm; disease-free, relapse-free and overall survival did not differ in either the node-negative or the node-positive stratum, so simple mastectomy is as good as radical mastectomy. NSABP B-06 compared mastectomy, lumpectomy alone, and lumpectomy with radiotherapy, and found no difference in disease-free or overall survival, but substantially higher ipsilateral breast tumour recurrence without radiotherapy (39% vs 14%, P&lt;0.001). The EBCTCG overview of breast conservation with and without radiotherapy quantified the same effect: radiotherapy reduced the 10-year risk of any first recurrence from 35% to 19.3% and the 15-year risk of breast cancer death from 25.2% to 21.4%, with a larger benefit in node-positive disease (Lancet 2011). If breast conservation is chosen, radiotherapy is part of it.</p>\n<h3>Margins and contraindications</h3>\n<p>An adequate margin after lumpectomy for invasive cancer is no tumour on ink.</p>\n<ul><li>Absolute contraindications: multicentric disease or a high risk of multicentricity such as diffuse mammographic calcification; a contraindication to radiotherapy such as prior thoracic radiotherapy or pregnancy; disease too widespread to excise with negative margins and acceptable cosmesis.</li><li>Relative contraindications: connective tissue disease such as systemic sclerosis, where healing after radiotherapy is poor; an anticipated poor cosmetic result, for instance a tumour near the nipple or a high tumour-to-breast ratio; and a known or suspected cancer predisposition syndrome, particularly Li-Fraumeni, where radiotherapy carries a second-malignancy risk.</li></ul>\n<p>Two things are commonly mistaken for contraindications. A germline <em>BRCA1/2</em> variant does not preclude breast conservation: local recurrence is higher, but most ipsilateral events are new primaries rather than true recurrences, and survival is no different from mastectomy. Extensive DCIS alongside the invasive tumour is also not a contraindication, provided margins are achieved.</p>\n<h2 id=\"s-axillary-management\">Axillary management</h2>\n<h3>Sentinel node biopsy</h3>\n<p>Sentinel node biopsy is the staging operation for a clinically and radiologically negative axilla. A suspicious node is worked up first with ultrasound and needle biopsy: a positive biopsy sends the patient to axillary dissection, a negative one to sentinel node biopsy. NSABP B-32 randomised patients to sentinel node biopsy with immediate completion dissection versus dissection only if the sentinel node was positive, and found no difference in overall survival, disease-free survival or regional recurrence; a negative sentinel node had a 95% negative predictive value for the remaining axilla, with a false-negative rate of 9.8%. Sentinel node biopsy is inappropriate or uninformative in four situations.</p>\n<ul><li>Pregnancy: isosulfan blue is teratogenic and the radioisotope option is unavailable.</li><li>Clinically node-positive disease, treated with axillary dissection; patients receiving neoadjuvant chemotherapy are restaged before surgery to reassess suitability.</li><li>Inflammatory breast cancer, treated with axillary dissection.</li><li>Patients in whom axillary status will not change adjuvant treatment, the worked example being the CALGB 9343 population (age 70 or older, ER-positive, T1N0, receiving endocrine therapy) who do not need radiotherapy and therefore do not need the nodal information that guides it.</li></ul>\n<h3>A positive sentinel node</h3>\n<p>Completion axillary dissection is now the exception. It remains indicated for three or more positive nodes, and for one to two positive nodes in a patient who declines whole-breast radiotherapy. It is not required for isolated tumour cells (staged N0), for micrometastases, or for one to two macrometastatic nodes in the trial-defined settings below: IBCSG 23-01 randomised patients with sentinel-node micrometastases to dissection or no further axillary surgery and found no difference in disease-free survival, overall survival or breast cancer events. <a class=\"trial-link\" href=\"/evidence/#t-acosog-z0011-alliance\">ACOSOG Z0011 (Alliance)</a> changed practice, and its boundaries matter as much as its result. It randomised 891 women with clinical T1–T2 disease, no palpable adenopathy, and one or two sentinel nodes positive on haematoxylin and eosin, all treated with lumpectomy and tangential whole-breast irradiation with nodal fields prohibited, to sentinel node dissection alone or completion dissection. At a median 9.3 years, sentinel node dissection alone was non-inferior for 10-year overall survival (86.3% vs 83.6%; HR 0.85, one-sided 95% CI 0 to 1.16; non-inferiority P=.02 against a margin of 1.3), despite additional non-sentinel macrometastases in 27.3% of the dissection arm (JAMA 2011;305:569-575; JAMA 2017;318:918-926). Three qualifications apply. Ten-year disease-free survival (80.2% vs 78.2%; HR 0.85, 95% CI 0.62 to 1.17, P=.32) and locoregional relapse-free survival (P=.41) were tested for difference rather than non-inferiority, so they are absence of evidence of a difference rather than demonstrated equivalence. The trial closed early at 891 of 1,900 planned patients with 110 of the roughly 500 deaths needed for power, and the timing of this analysis was not prespecified. And 18.9% of patients in an independent analysis of radiation fields received protocol-prohibited nodal irradiation, though the investigators found it evenly distributed between arms and unlikely to have affected the result. The authors set out what the finding does not cover: palpable positive nodes, more than two involved sentinel nodes, omission of whole-breast irradiation, mastectomy without radiotherapy, and neoadjuvant therapy. <a class=\"trial-link\" href=\"/evidence/#t-amaros\">AMAROS</a> asked whether radiotherapy can replace surgery when the axilla still needs treatment. It randomised 4,806 patients with cN0 T1–2 disease before sentinel node biopsy, delivering the allocated treatment only to the 1,425 who proved sentinel-node-positive, to axillary dissection or axillary radiotherapy covering all three levels and the medial supraclavicular fossa. Five-year axillary recurrence was 0.43% after dissection and 1.19% after radiotherapy, with no significant difference in disease-free survival (86.9% vs 82.7%; HR 1.18, 95% CI 0.93 to 1.51; p=0.18) or overall survival (93.3% vs 92.5%; HR 1.17; p=0.34), and clinical lymphoedema at 5 years of 11% after radiotherapy versus 23% after dissection (Lancet Oncol 2014;15:1303-1310). The event rate was so low that the non-inferiority test was underpowered (one-sided 95% CI 0.00 to 5.27 against a margin of 2.0), so non-inferiority was not formally demonstrated; what the trial shows is excellent axillary control by either route at very different morbidity. <a class=\"trial-link\" href=\"/evidence/#t-senomac\">SENOMAC</a> is the only trial on this axis to reach its prespecified event target. It randomised 2,766 patients with cN0 T1–3 disease and one or two sentinel-node macrometastases to completion dissection or sentinel node biopsy alone, after mastectomy or breast conservation, with about 89% of both arms receiving nodal-target irradiation. Five-year recurrence-free survival was 89.7% with omission versus 88.7% with dissection (country-adjusted HR 0.89, 95% CI 0.66 to 1.19; P&lt;0.001 against a non-inferiority margin of 1.44) (N Engl J Med 2024;390:1163-1175). The primary overall-survival endpoint matured in 2026 at 94.4% versus 93.4% (HR 0.84, 0.64 to 1.12) with breast-cancer-specific survival of 97.8% versus 97.3% (HR 0.86, 0.55 to 1.34), both interval upper bounds below the 1.44 margin, and significantly better patient-reported arm function at 3 and 5 years (J Clin Oncol 2026;44(suppl):LBA503). That analysis was reported at ASCO 2026 and is not yet a full publication. Because nodal irradiation was given to most of both arms, SENOMAC states its results are comparable with AMAROS rather than with Z0011. A mastectomy patient with one or two positive sentinel nodes, whom Z0011 does not cover, can therefore omit dissection provided the undissected axilla is irradiated. The composite rule after a positive sentinel node:</p>\n<ul><li>Isolated tumour cells or micrometastases: no further axillary surgery.</li><li>One to two macrometastases after breast conservation with whole-breast tangential radiotherapy: no further axillary surgery (Z0011).</li><li>One to two macrometastases after mastectomy, or otherwise outside Z0011 criteria: omit dissection but include the undissected axilla in the radiotherapy field (AMAROS, SENOMAC).</li><li>Three or more positive nodes: axillary dissection.</li></ul>\n<h2 id=\"s-radiotherapy\">Radiotherapy</h2>\n<h3>After breast-conserving surgery</h3>\n<p>Whole-breast irradiation halves the 10-year risk of a first recurrence after breast-conserving surgery (RR 0.52, 19% vs 35%), an effect concentrated in local recurrence, and reduces the 15-year risk of breast cancer death (21% vs 25%, RR 0.82), at a long-term cost of cardiotoxicity, pneumonitis and second malignancy.</p>\n<h3>Omitting radiotherapy in older, low-risk disease</h3>\n<p>CALGB 9343 randomised women aged 70 or older with stage I ER-positive disease after breast conservation to tamoxifen alone or tamoxifen with radiotherapy. At 10 years, locoregional recurrence was higher without radiotherapy (9% vs 2%), while distant disease-free survival, breast-cancer-specific survival and overall survival were comparable. PRIME II tested the same question from age 65, in ER- or PR-positive tumours of 3 cm or less, excluding grade 3 and lymphovascular invasion: ipsilateral recurrence at 10 years was 9.8% without radiotherapy versus 0.9% with it, again with no difference in distant recurrence or overall survival. Within the no-radiotherapy arm, low ER expression carried higher recurrence risk than high (10-year local recurrence 18% vs 9%), which is the argument for confining omission to strongly ER-positive disease. LUMINA asked whether the age threshold can come down when biology is favourable. It enrolled 500 women aged 55 or older with T1N0, grade 1 or 2, luminal A disease (ER/PR-positive, HER2-negative, Ki67 13.25% or below) treated with breast conservation and endocrine therapy without radiotherapy, and reported 2.3% local recurrence and 2.7% recurrence of any type at 5 years. This is a single-arm result and not standard practice.</p>\n<h3>Post-mastectomy radiotherapy</h3>\n<p>Post-mastectomy radiotherapy covers the chest wall and the regional nodes, including the supraclavicular, infraclavicular and axillary fields. Indications:</p>\n<ul><li>Four or more positive nodes. The 2005 EBCTCG overview reported reduced 15-year local recurrence (7.8% vs 29%) and improved breast-cancer-specific survival (60.1% vs 54.7%).</li><li>One to three positive nodes, which remains contested. The 2014 EBCTCG overview found reductions in locoregional and overall recurrence and in breast cancer mortality, but its constituent trials predate contemporary systemic therapy or gave none. The British Columbia trial showed a breast-cancer-free survival benefit in premenopausal node-positive women irrespective of node count.</li><li>T4 disease.</li><li>Selected T2 and T3 tumours with adverse features: age 50 or under, triple-negative phenotype, high grade, or lymphovascular invasion.</li><li>Positive margins where further resection is not possible.</li></ul>\n<h3>Fractionation and treatment volume</h3>\n<p>Conventional whole-breast irradiation delivers 45 to 50 Gy in 25 fractions with a 10 Gy boost to the tumour bed; the boost reduces local recurrence, most clearly in women under 50 and in high-grade invasive ductal carcinoma. Whelan&#x27;s hypofractionation trial gave 42.5 Gy in 16 fractions over 22 days without a boost to 1,234 node-negative women, and found no difference in 10-year local recurrence against a standard course (6.2% vs 6.7%), with inferior local control in high-grade disease (N Engl J Med 2010). Accelerated partial breast irradiation treats only the lumpectomy bed with a margin over five days, and is confined to selected low-risk patients: age 50 or older with invasive ductal carcinoma of 2 cm or less, negative margins of at least 2 mm, no lymphovascular invasion, ER-positive and <em>BRCA</em>-negative; or low-to-intermediate-grade screen-detected DCIS of 2.5 cm or less with adequate margins. Regional nodal irradiation adds the supraclavicular and infraclavicular fields, and the axilla where dissection was not performed. MA.20 randomised more than 1,800 patients after breast conservation and whole-breast irradiation, 90% node-positive and 85% with one to three positive nodes, and improved 10-year disease-free but not overall survival. The EORTC trial randomised about 4,000 patients, half node-positive and a quarter treated by mastectomy, and improved disease-free survival and breast cancer mortality with a non-significant trend in overall survival. Regional nodal irradiation is therefore standard for four or more positive nodes and a considered option for one to three, where both trials showed only non-significant trends. It is also worth considering in node-negative disease with adverse features: T3 or T4 tumours, T2 disease with fewer than 10 nodes dissected, high grade, ER-negative disease, or lymphovascular invasion. Micrometastatic nodal disease does not require it; the added toxicity is pneumonitis and lymphoedema.</p>\n<h3>Sequencing with systemic therapy</h3>\n<p>Radiotherapy follows adjuvant chemotherapy rather than running concurrently, because of radiation recall with doxorubicin and additive pneumonitis risk with taxanes. Early data suggested chemotherapy before radiotherapy reduced distant recurrence without a survival difference (Recht, NEJM 1996), but updated results showed no difference either way (Bellon, JCO 2005). Trastuzumab may be given concurrently with radiotherapy. Endocrine therapy can be too, but because it runs for years and there are theoretical concerns about oncostasis reducing radiosensitivity, it is usually started after radiotherapy finishes.</p>\n<h2 id=\"s-adjuvant-chemotherapy-the-backbone\">Adjuvant chemotherapy: the backbone</h2>\n<h3>What chemotherapy adds</h3>\n<p>The <a class=\"trial-link\" href=\"/evidence/#t-ebctcg-15-year-overview\">EBCTCG 15-year overview</a> established that the proportional risk reductions from adjuvant systemic therapy persist to 15 years: about six months of anthracycline-based polychemotherapy reduced the annual breast cancer death rate by roughly 38% in women under 50 and 20% at ages 50 to 69, largely independent of ER and nodal status, and significantly more than CMF (Lancet 2005;365:1687-1717). Benefit was greatest in younger patients, ER-low and node-positive disease.</p>\n<h3>Anthracycline and taxane</h3>\n<p>The <a class=\"trial-link\" href=\"/evidence/#t-ebctcg-meta-analysis\">EBCTCG meta-analysis</a> of 123 randomised trials sorted the regimens (Lancet 2012;379:432-444). Adding four cycles of a taxane to a fixed anthracycline backbone reduced breast cancer mortality (RR 0.86, 2p=0.0005), but not where the control arm received counterbalancing extra non-taxane cycles (RR 0.94, 2p=0.33). Standard four cycles of AC and standard six cycles of CMF were equivalent (RR 0.98), while higher-cumulative-dose CAF or CEF regimens beat CMF (RR 0.78, 2p=0.0004) on a significant dose-response trend. Cardiac mortality rose with any anthracycline (RR 1.56, 2p=0.02).</p>\n<p>The two taxane trials underneath that conclusion agree on recurrence and diverge on survival. <a class=\"trial-link\" href=\"/evidence/#t-calgb-9344-int-0148\">CALGB 9344 (INT 0148)</a> added four cycles of paclitaxel after four cycles of AC in 3,121 node-positive patients and reduced recurrence by 17% (HR 0.83, P=.0023) and death by 18% (HR 0.82, P=.0064), with 5-year disease-free survival of 70% versus 65% and overall survival 80% versus 77%; the same factorial found no gain from escalating doxorubicin from 60 to 90 mg/m² and more long-term cardiotoxicity at the higher doses (J Clin Oncol 2003;21:976-983). <a class=\"trial-link\" href=\"/evidence/#t-nsabp-b-28\">NSABP B-28</a> repeated the question in 3,060 node-positive patients with a better prognosis and found the same disease-free survival gain (RR 0.83, P=.006; 5-year 76% vs 72%) with no significant overall survival difference (5-year 85% in both arms) (J Clin Oncol 2005;23:3686-3696).</p>\n<p>A companion analysis of CALGB 9344 found the paclitaxel benefit concentrated in HER2-positive disease irrespective of ER status (interaction HR 0.59 for recurrence), with little gain in the HER2-negative, ER-positive tumours that made up more than half the trial (N Engl J Med 2007;357:1496-1506). The average benefit of chemotherapy is carried disproportionately by the subtypes least dependent on endocrine therapy.</p>\n<h3>Can the anthracycline be dropped?</h3>\n<p><a class=\"trial-link\" href=\"/evidence/#t-us-oncology-9735\">US Oncology 9735</a> compared four cycles of docetaxel and cyclophosphamide with four cycles of AC in 1,016 patients with stage I–III disease. At the 7-year update, TC improved both disease-free survival (81% vs 75%; HR 0.74, P=.033) and overall survival (87% vs 82%; HR 0.69, P=.032), with no interaction by hormone receptor or HER2 status and no cardiotoxicity signal (J Clin Oncol 2006;24:5381-5387; J Clin Oncol 2009;27:1177-1183). TC×4 is therefore reasonable for lower-risk disease or where an anthracycline is contraindicated. Six cycles of TC is a different question with a different answer. The <a class=\"trial-link\" href=\"/evidence/#t-abc-trials-usor-06-090-b-46-i-b-49\">ABC trials (USOR 06-090/B-46-I/B-49)</a> pooled three adjuvant trials (n=4,242, high-risk HER2-negative) testing TC×6 for non-inferiority against a taxane-plus-anthracycline regimen at a margin of 1.18. The futility boundary was crossed and the intention-to-treat analysis showed statistical inferiority of TC (invasive disease-free survival HR 1.23, 95% CI 1.01 to 1.50, P=.04; 4-year 88.2% vs 90.7%). At 6.9 years non-inferiority still could not be declared (HR 1.14, 95% CI 0.99 to 1.32) while overall survival did not differ (HR 1.05, P=.64), the anthracycline arm&#x27;s recurrence advantage offset by more leukaemia (7 vs 1) and non-breast-cancer deaths, and concentrated in hormone-receptor-negative disease (recurrence-free interval HR 1.90) (J Clin Oncol 2017;35:2647-2655; J Clin Oncol 2024;42:1344-1349). The 2023 EBCTCG overview of 15 trials comparing taxane plus anthracycline against TC×6 resolves the contradiction by separating the schedules. Anthracycline-containing regimens had lower recurrence overall (RR 0.86, 95% CI 0.79 to 0.93; p=0.0004), at a cost of roughly one AML per 700 women treated, but the advantage sat in concurrent schedules: concurrent TAC×6 beat TC×6 (10-year recurrence 12.3% vs 21%; breast cancer mortality 8.9% vs 13.2%, p=0.0034), whereas sequential AC then a taxane was equivalent to TC×6 (10-year recurrence 14.4% vs 14.9%, RR 0.94, p=0.30). Sequential administration delivers a higher dose per cycle but a lower cumulative anthracycline and taxane dose.</p>\n<h3>Schedule and taxane choice</h3>\n<p><a class=\"trial-link\" href=\"/evidence/#t-calgb-9741\">CALGB 9741</a> tested dose density in a 2×2 factorial of 2,005 node-positive patients, varying interval (every 2 weeks with filgrastim versus every 3 weeks) and sequence (sequential doxorubicin, paclitaxel then cyclophosphamide versus concurrent AC then paclitaxel) at fixed doses. Dose-dense scheduling improved disease-free survival (RR 0.74, P=.010; 4-year 82% vs 75%) and overall survival (RR 0.69, P=.013), with no effect of sequence, and less grade 4 granulocytopenia (6% vs 33%) (J Clin Oncol 2003;21:1431-1439). That first report came at 36 months with 315 of 515 expected events, and the authors state that confidence in the survival benefit at longer follow-up remains to be firmly established. The EBCTCG dose-density overview confirmed it at scale, with lower 10-year recurrence (24% vs 28.3%, RR 0.83, p&lt;0.0001) and breast cancer mortality (RR 0.86, p=0.005) regardless of hormone receptor or nodal status. Primary G-CSF prophylaxis is mandatory on a dose-dense schedule. <a class=\"trial-link\" href=\"/evidence/#t-ecog-e1199\">ECOG E1199</a> tested taxane and schedule together in 4,950 patients after four cycles of AC. Both prespecified primary comparisons were null: taxane type HR 1.03 (P=.61) and schedule HR 1.06 (P=.33), with a significant taxane-by-schedule interaction (P=.003) that the authors say complicates interpretation. Against the shared every-3-week paclitaxel reference, weekly paclitaxel improved disease-free (HR 1.27, 98.3% CI 1.03 to 1.57, P=.006) and overall survival (1.32, P=.01), three-weekly docetaxel improved disease-free survival only (1.23, P=.02), and weekly docetaxel improved neither. Grade 2–4 neuropathy was 27% with weekly paclitaxel versus 20% (N Engl J Med 2008;358:1663-1671). No experimental arm was tested against another, so the two winners are not ranked. Both are acceptable and the choice is made on toxicity: three-weekly docetaxel causes more neutropenia, febrile neutropenia and infection, weekly paclitaxel more neuropathy, and weekly paclitaxel improved both disease-free and overall survival in the triple-negative subgroup.</p>\n<p>Adjuvant chemotherapy should start 3 to 6 weeks after surgery; initiation beyond 90 days is associated with worse overall survival.</p>\n<h3>Intensified chemotherapy with stem-cell rescue</h3>\n<p><a class=\"trial-link\" href=\"/evidence/#t-subito\">SUBITO</a> closes the high-dose chemotherapy axis in the population where it had most rationale. In 174 patients with stage III, HER2-negative, homologous-recombination-deficient disease, intensified alkylating chemotherapy with autologous stem-cell rescue gave the same 4-year overall survival as standard chemotherapy followed by a year of adjuvant olaparib (77.0% vs 76.4%; HR 1.11, 95% CI 0.57 to 2.17, p=0.37), with no difference in recurrence-free survival or pCR, at grade 3–4 thrombocytopenia of 99% versus 19% (Lancet Oncol 2026;27:795-807). This is a null superiority result in a trial powered for a hazard ratio of 0.353, not demonstrated equivalence, but the toxicity comparison is not close.</p>\n<h2 id=\"s-hr-positive-her2-negative-disease\">HR-positive, HER2-negative disease</h2>\n<h3>The endocrine foundation</h3>\n<p>Every patient with ER-positive disease should receive at least five years of endocrine therapy. The <a class=\"trial-link\" href=\"/evidence/#t-ebctcg-tamoxifen-meta-analysis\">EBCTCG tamoxifen meta-analysis</a> of 20 trials (21,457 women) showed that five years of tamoxifen roughly halved the recurrence rate during years 0 to 4 (RR 0.53) and reduced breast cancer mortality by about a third throughout 15 years (RR 0.70), largely irrespective of age, nodal status or receipt of chemotherapy, with benefit confined to ER-positive disease (Lancet 2011;378:771-784). PR status does not significantly predict response.</p>\n<p>In postmenopausal women an aromatase inhibitor is preferred. <a class=\"trial-link\" href=\"/evidence/#t-atac\">ATAC</a> compared anastrozole with tamoxifen for five years and at 10 years reported better disease-free survival (HR 0.86) and time to recurrence (HR 0.79), the absolute recurrence difference widening from 2.7% at 5 years to 4.3% at 10 years and recurrence still lower after treatment ended (HR 0.81, 95% CI 0.67 to 0.98, p=0.03), but no overall survival difference (HR 0.95, p=0.4) (Lancet 2002;359:2131-2139; Lancet Oncol 2010;11:1135-1141). <a class=\"trial-link\" href=\"/evidence/#t-big-1-98\">BIG 1-98</a> confirmed it independently: at a median 25.8 months, upfront letrozole improved disease-free survival over tamoxifen (HR 0.81, 95% CI 0.70 to 0.93, P=0.003) and reduced distant recurrence (HR 0.73, P=0.001) (N Engl J Med 2005;353:2747-2757). The <a class=\"trial-link\" href=\"/evidence/#t-ebctcg-aromatase-inhibitor-vs-tamoxifen-meta-analysis\">EBCTCG aromatase inhibitor vs tamoxifen meta-analysis</a> of 31,920 postmenopausal women turned that into a mortality claim: five years of an aromatase inhibitor reduced recurrence by about 30% while treatments differed, and cut 10-year breast cancer mortality from 14.2% to 12.1% (RR 0.85), with fewer endometrial cancers and more fractures (Lancet 2015;386:1341-1352). Because the benefit is concentrated in the years the treatments differ, a sequential tamoxifen-then-letrozole schedule performs like letrozole alone rather than like tamoxifen alone.</p>\n<p>BIG 1-98&#x27;s sequential arms support starting a perimenopausal patient on tamoxifen and switching to letrozole once menopause is established. The steroidal and non-steroidal agents are interchangeable on efficacy: MA.27 found exemestane equivalent to anastrozole, FACE letrozole equivalent to anastrozole. Menopause is defined by prior bilateral oophorectomy, age 60 or over, or, under 60, by 12 months or more of amenorrhoea with postmenopausal FSH and oestradiol in the absence of chemotherapy, tamoxifen or ovarian suppression. Chemotherapy-induced amenorrhoea of 12 months or more, and treatment with tamoxifen, both require postmenopausal FSH and oestradiol on serial assessment.</p>\n<h3>Premenopausal disease and ovarian suppression</h3>\n<p><a class=\"trial-link\" href=\"/evidence/#t-soft\">SOFT</a> randomised 3,066 premenopausal women to tamoxifen, tamoxifen with ovarian function suppression, or exemestane with ovarian function suppression for five years. Adding ovarian suppression to tamoxifen showed a significance trajectory rather than a settled answer: no significant disease-free survival benefit at the 5.6-year primary analysis (86.6% vs 84.7%; HR 0.83, 95% CI 0.66 to 1.04, p=0.10), a significant disease-free and overall survival benefit at 8 years (83.2% vs 78.9%, p=0.009; overall survival 93.3% vs 91.5%), and a persisting but attenuated benefit at 12 years (disease-free survival HR 0.82, 95% CI 0.69 to 0.98; overall survival HR 0.78, 0.60 to 1.01) (N Engl J Med 2015;372:436-46; N Engl J Med 2018;379:122-137; J Clin Oncol 2023;41:1370-1375). Exemestane with ovarian suppression did better still against tamoxifen alone (HR 0.65, 0.49 to 0.87). Where the benefit sits is the useful part. It concentrated in women who remained premenopausal after chemotherapy; in the lower-risk chemotherapy-naive cohort more than 95% of every arm remained free from breast cancer at 5 years, and tamoxifen alone stayed appropriate. <a class=\"trial-link\" href=\"/evidence/#t-text-soft-exemestane\">TEXT &amp; SOFT (exemestane)</a> is the combined analysis of the shared question, exemestane versus tamoxifen on a background of ovarian suppression in 4,690 women. At 68 months exemestane improved disease-free survival (HR 0.72, 95% CI 0.60 to 0.85, P&lt;0.001) and freedom from breast cancer (HR 0.66, P&lt;0.001) with no overall survival difference; at 13 years the recurrence advantage held (12-year disease-free survival HR 0.79, 0.70 to 0.90) while overall survival still did not differ (HR 0.93, 0.78 to 1.11), the survival hazard time-varying with early harm reversing to later benefit (N Engl J Med 2014;371:107-118; J Clin Oncol 2023;41:1376-1382). The <a class=\"trial-link\" href=\"/evidence/#t-ebctcg-premenopausal-ai-vs-tamoxifen-ovarian-suppression-meta-analysis\">EBCTCG premenopausal AI vs tamoxifen (ovarian suppression) meta-analysis</a> of 7,030 women across four trials fixes the magnitude and the limits. An aromatase inhibitor reduced any breast cancer recurrence versus tamoxifen (RR 0.79, 95% CI 0.69 to 0.90; p=0.0005), concentrated in years 0 to 4 when treatments differed (RR 0.68) with no further gain in years 5 to 9, an absolute 5-year reduction of 3.2% (6.9% vs 10.1%). There was no difference in breast cancer mortality (RR 1.01, 0.82 to 1.24) or all-cause mortality (RR 1.04, 0.86 to 1.27) at 8 years, and more fractures with the aromatase inhibitor (6.4% vs 5.1%, RR 1.27) (Lancet Oncol 2022;23:382-392). Practical selection:</p>\n<ul><li>Higher-risk premenopausal disease (age under 35, tumour above 2 cm, grade 3): ovarian suppression with an aromatase inhibitor or tamoxifen, the aromatase inhibitor preferred; alternatives are 10 years of tamoxifen, or a sequential tamoxifen-then-aromatase-inhibitor schedule with extension.</li><li>Lower-risk disease: tamoxifen alone for 5 to 10 years, or a sequential schedule.</li></ul>\n<p>The observation behind the branch is that in NSABP B-30, premenopausal patients who developed chemotherapy-induced amenorrhoea had better disease-free and overall survival than those who did not.</p>\n<h3>Duration and extended therapy</h3>\n<p>Recurrence risk in ER-positive disease continues well past five years: the EBCTCG 2024 analysis put late recurrence in pN2 disease at about 2.7% per year, roughly 13% over years 5 to 10. That is the rationale for extending. <a class=\"trial-link\" href=\"/evidence/#t-ma-17-ncic-ctg\">MA.17 (NCIC CTG)</a> randomised 5,187 postmenopausal women disease-free after about five years of tamoxifen to five further years of letrozole or placebo. It stopped at the first interim analysis (median follow-up 2.4 years) with 4-year disease-free survival of 93% versus 87% (HR 0.57, 95% CI 0.43 to 0.75, P=0.00008), a benefit at least as large in node-negative (HR 0.47) as node-positive disease (HR 0.60), and a non-significant overall survival trend (HR 0.76, P=0.25) (N Engl J Med 2003;349:1793-1802). <a class=\"trial-link\" href=\"/evidence/#t-nsabp-b-33\">NSABP B-33</a> tested exemestane in the same position and, read through 44% placebo-to-exemestane crossover after MA.17 reported, gave a borderline 4-year disease-free survival gain (91% vs 89%; HR 0.68, P=.07) and a significant relapse-free survival gain (HR 0.44, P=.004), the disease-free survival benefit confined to node-positive disease (HR 0.50) and absent node-negative (HR 1.13) (J Clin Oncol 2008;26:1965-1971). <a class=\"trial-link\" href=\"/evidence/#t-atlas\">ATLAS</a> answered the same question for tamoxifen. Continuing to 10 years reduced recurrence in years 5 to 14 (21.4% vs 25.1%) and breast cancer mortality (12.2% vs 15.0%, absolute reduction 2.8%), the benefit emerging mainly after year 10, at the cost of more endometrial cancer and pulmonary embolism (Lancet 2013;381:805-816). The <a class=\"trial-link\" href=\"/evidence/#t-ebctcg-extended-ai-meta-analysis\">EBCTCG extended AI meta-analysis</a> of 22,031 women summarises extending an aromatase inhibitor beyond five years. Any further aromatase-inhibitor therapy reduced recurrence by 27% (RR 0.73, 95% CI 0.67 to 0.80, p&lt;0.0001). In the narrower subgroup who had already had some aromatase inhibitor (7,511 women), five further years cut recurrence (RR 0.71; years 5–15 risk 11.6% vs 15.2%) and distant recurrence (RR 0.73), but breast cancer mortality fell only non-significantly (RR 0.90, 95% CI 0.70 to 1.15, p=0.40; 4.4% vs 5.0%). Five-year fracture risk rose (RR 1.35, 1.13 to 1.61), and non-adherence was widespread and similar in both arms (39.0% vs 37.6%) (Lancet 2025;406:603-614). The underlying rates are 3.4% rising to 4.6% (p=0.0009).</p>\n<p>Extending an aromatase inhibitor therefore buys recurrence reduction, not demonstrated survival, at a measurable skeletal cost. The absolute gain was larger in node-positive disease, reflecting higher baseline risk rather than a different proportional effect. Options among the extended-therapy trials:</p>\n<ul><li>Two to five years of tamoxifen followed by five years of an aromatase inhibitor: a disease-free survival benefit, with a survival benefit in node-positive disease (MA.17, GIM4).</li><li>Aromatase inhibition to a total of 10 years: a disease-free survival benefit without a survival benefit and with more bone toxicity (MA.17R, NSABP B-42, AERAS).</li><li>Seven to eight years: a reasonable compromise where tolerance is the problem, with no apparent loss of survival (IDEAL, ABCSG-16/SALSA).</li><li>Tamoxifen to 10 years: superior to five years, with the effect appearing only in the second decade after diagnosis (ATLAS).</li></ul>\n<h3>Oral SERDs</h3>\n<p><a class=\"trial-link\" href=\"/evidence/#t-lidera-bc\">lidERA (BC)</a> is the first adjuvant trial of a next-generation oral selective oestrogen receptor degrader to report. It randomised 4,170 patients with ER-positive, HER2-negative stage I–III disease to giredestrant 30 mg daily or standard-of-care endocrine therapy for five years, with an LHRH agonist for premenopausal patients on giredestrant or an aromatase inhibitor. Giredestrant improved invasive disease-free survival (3-year 92.4% vs 89.6%; HR 0.70, p=0.0014), with greater benefit in stage II–III disease, a stage I hazard ratio crossing 1.00, and immature overall survival. Discontinuation for adverse events was lower than with an aromatase inhibitor (J Clin Oncol 2026;44(suppl):502). The primary r
