</td><td>Chemotherapy</td><td>Chemotherapy</td></tr><tr><td>Score 16–25</td><td>Integrate clinical risk; consider chemotherapy at age ≤50 for scores 21–25, or 16–20 with high clinical risk</td><td>Postmenopausal: no chemotherapy benefit. Premenopausal: invasive and distant relapse-free benefit</td></tr><tr><td>Score ≤15</td><td>Chemotherapy unlikely to help</td><td>As above</td></tr></tbody></table></div>\n<p><strong>MammaPrint</strong> is a 70-gene signature validated for FFPE tissue in tumours of 5 cm or less with 0 to 3 positive nodes, irrespective of receptor status or menopausal state, returning a binary low-or-high genomic risk. <a class=\"trial-link\" href=\"/evidence/#t-mindact\">MINDACT</a> randomised 6,693 patients on the discordance between clinical and genomic risk.</p>\n<p>Its primary analysis was a single-arm rate against a fixed threshold, not a between-arm comparison: among the 1,550 women (23.2%) at high clinical but low genomic risk who forwent chemotherapy, 5-year survival without distant metastasis was 94.7% (95% CI 92.5 to 96.2), clearing the prespecified 92% boundary.</p>\n<p>The secondary randomised comparison in that group was underpowered (adjusted HR 0.78, 95% CI 0.50 to 1.21, P=0.27) (N Engl J Med 2016;375:717-729). About 46% of clinically high-risk women could avoid chemotherapy.</p>\n<p>In the prespecified reverse-discordant group, the per-protocol 5-year distant-metastasis-free rates were 96.1% with chemotherapy and 93.9% without (HR 0.90, 95% CI 0.40–2.01, P=0.80). This exploratory, underpowered comparison showed no statistically demonstrable benefit and remained compatible with benefit or harm.</p>\n<p><strong>PAM50</strong> identifies intrinsic subtype: luminal A tumours have a very good prognosis without chemotherapy, while luminal B tumours are more likely to recur on endocrine therapy alone and may warrant it. <a class=\"trial-link\" href=\"/evidence/#t-optima\">OPTIMA</a> tested the Prosigna PAM50 risk-of-recurrence score as a chemotherapy-direction tool in 4,429 patients with high-clinical-risk ER-positive, HER2-negative disease, 73% node-positive.</p>\n<p>Test-directed management was non-inferior on 5-year invasive breast-cancer-free survival (90.4% vs 91.5%; HR 0.99, 90% CI 0.81 to 1.20; non-inferiority p=0.013), and the 68% with a low score could safely avoid chemotherapy, with no heterogeneity by menopausal or nodal status (J Clin Oncol 2026;44(suppl):500).</p>\n<p>This is an ASCO 2026 abstract rather than a full publication, and what it validates is a test-directed management strategy rather than a treatment-by-assay interaction, so it does not make PAM50 predictive in the sense Oncotype DX is. The assays are not interchangeable: platforms, risk definitions, nodal populations and primary estimands all differ, so a threshold from one does not transfer to another.</p>\n<p><a class=\"trial-link\" href=\"/evidence/#t-aster-70s\">ASTER 70s</a> randomised 1,089 women aged 70 or over with ER-positive, HER2-negative disease and a high-risk genomic grade index to chemotherapy then endocrine therapy or endocrine therapy alone, and found no significant survival benefit (8-year overall survival 72.7% vs 68.3%; HR 0.83, 95% CI 0.63 to 1.11, p=0.21) at grade 3 or higher toxicity of 34% versus 9% (Lancet 2025;406:489-500).</p>\n<p>Genomic high risk in an older patient is not by itself an indication for chemotherapy.</p>\n<h3 id=\"s-the-endocrine-foundation\">The endocrine foundation</h3>\n<p>Every patient with ER-positive disease should receive at least five years of endocrine therapy. The <a class=\"trial-link\" href=\"/evidence/#t-ebctcg-tamoxifen-meta-analysis\">EBCTCG tamoxifen meta-analysis</a> of 20 trials (21,457 women) showed that five years of tamoxifen roughly halved recurrence during years 0 to 4 (RR 0.53) and reduced breast cancer mortality by about a third throughout 15 years (RR 0.70) in ER-positive disease (Lancet 2011;378:771-784).</p>\n<p>In postmenopausal women an aromatase inhibitor is preferred.</p>\n<p><a class=\"trial-link\" href=\"/evidence/#t-atac\">ATAC</a> compared anastrozole with tamoxifen for five years. At 10 years it reported better disease-free survival (HR 0.86) and time to recurrence (HR 0.79), with the absolute recurrence difference widening from 2.7% at 5 years to 4.3% at 10 years.</p>\n<p>Recurrence remained lower after treatment ended (HR 0.81, 95% CI 0.67 to 0.98; P=0.03), but overall survival did not differ (HR 0.95; P=0.4) (Lancet 2002;359:2131-2139; Lancet Oncol 2010;11:1135-1141).</p>\n<p><a class=\"trial-link\" href=\"/evidence/#t-big-1-98\">BIG 1-98</a> confirmed it independently: at a median 25.8 months, upfront letrozole improved disease-free survival over tamoxifen (HR 0.81, 95% CI 0.70 to 0.93, P=0.003) and reduced distant recurrence (HR 0.73, P=0.001) (N Engl J Med 2005;353:2747-2757).</p>\n<p>The <a class=\"trial-link\" href=\"/evidence/#t-ebctcg-aromatase-inhibitor-vs-tamoxifen-meta-analysis\">EBCTCG aromatase inhibitor vs tamoxifen meta-analysis</a> of 31,920 postmenopausal women turned that into a mortality claim: five years of an aromatase inhibitor reduced recurrence by about 30% while treatments differed, and cut 10-year breast cancer mortality from 14.2% to 12.1% (RR 0.85), with fewer endometrial cancers and more fractures (Lancet 2015;386:1341-1352).</p>\n<p>Because the benefit is concentrated in the years the treatments differ, a sequential tamoxifen-then-letrozole schedule performs like letrozole alone rather than like tamoxifen alone.</p>\n<p>BIG 1-98&#x27;s sequential arms support starting a patient on tamoxifen and switching to an aromatase inhibitor once menopause is securely established. Amenorrhoea during chemotherapy or tamoxifen does not by itself prove permanent menopause; when treatment depends on ovarian function, confirm status clinically and biochemically and continue surveillance for ovarian recovery.</p>\n<h3 id=\"s-premenopausal-disease-and-ovarian-suppression\">Premenopausal disease and ovarian suppression</h3>\n<p><a class=\"trial-link\" href=\"/evidence/#t-soft\">SOFT</a> randomised 3,066 premenopausal women to tamoxifen, tamoxifen with ovarian function suppression, or exemestane with ovarian function suppression for five years.</p>\n<p>Adding ovarian suppression to tamoxifen showed a significance trajectory rather than a settled answer. The 5.6-year primary analysis did not show a significant disease-free-survival benefit (86.6% vs 84.7%; HR 0.83, 95% CI 0.66 to 1.04; P=0.10), while the 8-year analysis did (83.2% vs 78.9%; P=0.009), with overall survival 93.3% versus 91.5%.</p>\n<p>At 12 years the disease-free-survival benefit persisted but attenuated (HR 0.82, 95% CI 0.69 to 0.98); the overall-survival HR was 0.78 (95% CI 0.60 to 1.01) (N Engl J Med 2015;372:436-46; N Engl J Med 2018;379:122-137; J Clin Oncol 2023;41:1370-1375).</p>\n<p>Exemestane with ovarian suppression did better still against tamoxifen alone (HR 0.65, 0.49 to 0.87). The benefit was concentrated in women who remained premenopausal after chemotherapy; in the lower-risk chemotherapy-naive cohort more than 95% of every arm remained free from breast cancer at 5 years, and tamoxifen alone stayed appropriate.</p>\n<p><a class=\"trial-link\" href=\"/evidence/#t-text-soft-exemestane\">TEXT &amp; SOFT (exemestane)</a> is the combined analysis of the shared question, exemestane versus tamoxifen on a background of ovarian suppression in 4,690 women.</p>\n<p>At 68 months exemestane improved disease-free survival (HR 0.72, 95% CI 0.60 to 0.85; P&lt;0.001) and freedom from breast cancer (HR 0.66; P&lt;0.001), without an overall-survival difference.</p>\n<p>At 13 years the recurrence advantage persisted (12-year disease-free-survival HR 0.79, 95% CI 0.70 to 0.90), while overall survival still did not differ (HR 0.93, 95% CI 0.78 to 1.11); the survival hazard was time-varying, with early harm reversing to later benefit (N Engl J Med 2014;371:107-118; J Clin Oncol 2023;41:1376-1382).</p>\n<p>The <a class=\"trial-link\" href=\"/evidence/#t-ebctcg-premenopausal-ai-vs-tamoxifen-ovarian-suppression-meta-analysis\">EBCTCG premenopausal AI vs tamoxifen (ovarian suppression) meta-analysis</a> of 7,030 women across four trials quantifies the recurrence benefit and its limits. An aromatase inhibitor reduced any breast cancer recurrence versus tamoxifen (RR 0.79, 95% CI 0.69 to 0.90; p=0.0005), concentrated in years 0 to 4 when treatments differed (RR 0.68) with no further gain in years 5 to 9, an absolute 5-year reduction of 3.2% (6.9% vs 10.1%).</p>\n<p>There was no difference in breast cancer mortality (RR 1.01, 0.82 to 1.24) or all-cause mortality (RR 1.04, 0.86 to 1.27) at 8 years, and more fractures with the aromatase inhibitor (6.4% vs 5.1%, RR 1.27) (Lancet Oncol 2022;23:382-392). Practical selection:</p>\n<ul><li class=\"evidence-prose\">Higher-risk premenopausal disease (age under 35, tumour above 2 cm, grade 3): ovarian suppression with an aromatase inhibitor or tamoxifen, the aromatase inhibitor preferred; alternatives are 10 years of tamoxifen, or a sequential tamoxifen-then-aromatase-inhibitor schedule with extension.</li><li class=\"evidence-prose\">Lower-risk disease: tamoxifen alone for 5 to 10 years, or a sequential schedule.</li></ul>\n<h3 id=\"s-duration-and-extended-therapy\">Duration and extended therapy</h3>\n<p>Recurrence risk in ER-positive disease continues well past five years, particularly with higher nodal burden. That persistent risk is the rationale for discussing extended endocrine therapy. <a class=\"trial-link\" href=\"/evidence/#t-ma-17-ncic-ctg\">MA.17 (NCIC CTG)</a> randomised 5,187 postmenopausal women disease-free after about five years of tamoxifen to five further years of letrozole or placebo.</p>\n<p>It stopped at the first interim analysis (median follow-up 2.4 years) with 4-year disease-free survival of 93% versus 87% (HR 0.57, 95% CI 0.43 to 0.75, P=0.00008), a benefit at least as large in node-negative (HR 0.47) as node-positive disease (HR 0.60), and a non-significant overall survival trend (HR 0.76, P=0.25) (N Engl J Med 2003;349:1793-1802).</p>\n<p><a class=\"trial-link\" href=\"/evidence/#t-nsabp-b-33\">NSABP B-33</a> tested exemestane in the same position and, read through 44% placebo-to-exemestane crossover after MA.17 reported, gave a borderline 4-year disease-free survival gain (91% vs 89%; HR 0.68, P=.07) and a significant relapse-free-survival gain (HR 0.44, P=.004). The disease-free-survival estimate favoured node-positive disease (HR 0.50) but not node-negative disease (HR 1.13) (J Clin Oncol 2008;26:1965-1971).</p>\n<p><a class=\"trial-link\" href=\"/evidence/#t-atlas\">ATLAS</a> answered the duration question for tamoxifen.</p>\n<p>Continuing to 10 years reduced recurrence in years 5 to 14 (21.4% vs 25.1%) and breast cancer mortality (12.2% vs 15.0%, absolute reduction 2.8%), the benefit emerging mainly after year 10, at the cost of more endometrial cancer (Lancet 2013;381:805-816). The <a class=\"trial-link\" href=\"/evidence/#t-ebctcg-extended-ai-meta-analysis\">EBCTCG extended AI meta-analysis</a> of 22,031 women summarises extending an aromatase inhibitor beyond five years.</p>\n<p>Any further aromatase-inhibitor therapy reduced recurrence by 27% (RR 0.73, 95% CI 0.67 to 0.80, p&lt;0.0001).</p>\n<p>In the narrower subgroup who had already had some aromatase inhibitor (7,511 women), five further years cut recurrence (RR 0.71; years 5–15 risk 11.6% vs 15.2%) and distant recurrence (RR 0.73), but breast cancer mortality fell only non-significantly (RR 0.90, 95% CI 0.70 to 1.15, p=0.40; 4.4% vs 5.0%).</p>\n<p>Five-year fracture risk rose (RR 1.35, 1.13 to 1.61), and non-adherence was widespread and similar in both arms (39.0% vs 37.6%) (Lancet 2025;406:603-614). The underlying rates are 3.4% rising to 4.6% (p=0.0009).</p>\n<p><a class=\"trial-link\" href=\"/evidence/#t-ma-17r\">MA.17R</a> randomised 1,918 postmenopausal women who remained disease-free after 4.5–6 years of aromatase-inhibitor therapy to another five years of letrozole or placebo. Five-year disease-free survival was 95% versus 91% (HR 0.66, 95% CI 0.48–0.91, P=.01), but overall survival was 93% versus 94% (HR 0.97, 0.73–1.28). During treatment, fractures occurred in 14% versus 9% and new osteoporosis in 11% versus 6% (N Engl J Med 2016;375:209-219).</p>\n<p>The 10-year <a class=\"trial-link\" href=\"/evidence/#t-nsabp-b-42\">NSABP B-42</a> update reported disease-free survival of 75.9% versus 72.6% (HR 0.85, 95% CI 0.74–0.96, nominal P=.01) and no overall-survival difference (86.1% vs 86.2%; HR 0.97, 0.82–1.15).</p>\n<p>This update was not prespecified, and the original approximately seven-year primary analysis had not crossed its protocol boundary; it is therefore supportive rather than a second confirmatory primary analysis. At ten years, osteoporotic-fracture risk did not differ (6.6% vs 6.1%; HR 1.12, 0.86–1.45) (J Natl Cancer Inst 2023;115:1294-1305).</p>\n<p>Extending an aromatase inhibitor therefore buys recurrence reduction, not demonstrated survival, at a measurable skeletal cost. The absolute gain was larger in node-positive disease, reflecting higher baseline risk rather than a different proportional effect. Options among the extended-therapy trials:</p>\n<ul><li>Two to five years of tamoxifen followed by an aromatase inhibitor: a recurrence benefit, with absolute gain increasing as baseline risk rises.</li><li>Aromatase inhibition to a total of about 10 years: a recurrence benefit without a demonstrated overall-survival advantage and with more bone toxicity.</li><li>Seven to eight years: a reasonable compromise where tolerance is the problem, with no apparent loss of survival (IDEAL, ABCSG-16/SALSA).</li><li>Tamoxifen to 10 years: superior to five years, with the effect appearing only in the second decade after diagnosis (ATLAS).</li></ul>\n<h3 id=\"s-oral-serds\">Oral SERDs</h3>\n<p><a class=\"trial-link\" href=\"/evidence/#t-lidera-bc\">lidERA (BC)</a> is the first adjuvant trial of a next-generation oral selective oestrogen receptor degrader to report. It randomised 4,170 patients with ER-positive, HER2-negative stage I–III disease to giredestrant 30 mg daily or standard-of-care endocrine therapy for five years, with an LHRH agonist for premenopausal patients on giredestrant or an aromatase inhibitor.</p>\n<p>Giredestrant improved invasive disease-free survival (3-year 92.4% vs 89.6%; HR 0.70, p=0.0014), with greater benefit in stage II–III disease, a stage I hazard ratio crossing 1.00, and immature overall survival. Discontinuation for adverse events was lower than with an aromatase inhibitor (J Clin Oncol 2026;44(suppl):502).</p>\n<p>The primary readout was presented at SABCS 2025 and is not yet a full publication, so this is a signal to watch rather than a standard.</p>\n<h3 id=\"s-pregnancy-after-diagnosis\">Pregnancy after diagnosis</h3>\n<p><a class=\"trial-link\" href=\"/evidence/#t-positive\">POSITIVE</a> followed 516 women aged 42 or under with prior stage I–III HR-positive disease who interrupted adjuvant endocrine therapy for up to two years to attempt pregnancy, after 18 to 30 months of treatment.</p>\n<p>The design was a fixed-threshold safety trial rather than a hazard-ratio comparison: 44 breast cancer events occurred against a prespecified boundary of 46 over 1,638 patient-years, and an external-control comparison against the SOFT/TEXT cohort found no excess 3-year event incidence (8.9% vs 9.2%; adjusted HR 0.81, 95% CI 0.57 to 1.15).</p>\n<p>Of the cohort, 74.0% achieved at least one pregnancy and 63.8% at least one live birth (N Engl J Med 2023;388:1645-1656). Median follow-up was 3.4 years against a protocol-specified 10-year endpoint, so interruption is supported on short-term safety and the long-term question is open.</p>\n<h3 id=\"s-cdk4-6-inhibitors\">CDK4/6 inhibitors</h3>\n<p><a class=\"trial-link\" href=\"/evidence/#t-monarche\">monarchE</a> randomised 5,637 patients with node-positive, high-risk HR-positive, HER2-negative disease to two years of abemaciclib 150 mg twice daily added to standard endocrine therapy, or endocrine therapy alone. High risk meant four or more positive nodes, or one to three with a tumour above 5 cm, grade 3 disease, or Ki67 of 20% or above.</p>\n<p>Invasive disease-free survival improved at the primary analysis (2-year 92.2% vs 88.7%; HR 0.75, 95% CI 0.60 to 0.93, P=.01) and deepened with maturity (7-year HR 0.734).</p>\n<p>At the 2026 primary overall survival analysis, with 661 deaths at a median 6.3 years, abemaciclib met its prespecified boundary (HR 0.842, 95% CI 0.722 to 0.981, P=0.027; 7-year overall survival 86.8% vs 85.0%) (J Clin Oncol 2020;38:3987-3998; Ann Oncol 2026;37:155-165). That makes monarchE the first adjuvant CDK4/6 trial to convert a recurrence benefit into a demonstrated survival benefit.</p>\n<p>Ki67 was prognostic but not predictive, so a high Ki67 identifies risk but is not itself the reason to give abemaciclib. Toxicity is diarrhoea, neutropenia and fatigue. <a class=\"trial-link\" href=\"/evidence/#t-natalee\">NATALEE</a> extended the class to a broader population: 5,101 patients with stage II–III disease including selected node-negative tumours, given ribociclib 400 mg daily three weeks on and one week off for three years with a non-steroidal aromatase inhibitor.</p>\n<p>Three-year invasive disease-free survival was 90.4% versus 87.1% (HR 0.75, 95% CI 0.62 to 0.91; P=0.003).</p>\n<p>At the prespecified 5-year follow-up the benefit deepened (HR 0.716, 95% CI 0.618 to 0.829), with the gap widening from 2.7 to 4.5 percentage points between years 3 and 5. The node-negative estimate also favoured ribociclib (HR 0.606, 95% CI 0.372 to 0.986), while overall survival remained a non-significant trend (HR 0.800, 95% CI 0.637 to 1.003) (N Engl J Med 2024;390:1080-1091; ESMO Open 2025;10:105858).</p>\n<p>Toxicity is neutropenia, transaminitis and QTc prolongation. Eligibility was broader than monarchE: stage IIB or III disease was eligible irrespective of nodal status; stage IIA required N1 disease, or if node-negative, grade 3 histology or grade 2 histology with Ki67 ≥20% or high genomic risk (Oncotype DX recurrence score ≥26 or high-risk Prosigna PAM50, MammaPrint or EndoPredict). The class does not generalise.</p>\n<p><a class=\"trial-link\" href=\"/evidence/#t-pallas\">PALLAS</a> gave two years of palbociclib to 5,760 patients with stage II–III disease and was negative, crossing its futility boundary (3-year invasive disease-free survival 88.2% vs 88.5%, HR 0.93), with 45% not completing treatment (Lancet Oncol 2021;22:212-222).</p>\n<p><a class=\"trial-link\" href=\"/evidence/#t-penelope-b\">PENELOPE-B</a> gave one year of palbociclib to 1,250 patients with high-CPS-EG residual disease after neoadjuvant chemotherapy and was equally negative (HR 0.93, p=.53), with no benefit in any subgroup (J Clin Oncol 2021;39:1518-1530). Duration, continuity, adherence, eligibility and timing relative to chemotherapy all differ between the positive and negative trials, so what exists is a set of evidence-backed regimens rather than a class rule.</p>\n<p>Adjuvant palbociclib cannot be recommended; abemaciclib and ribociclib are given in the risk envelopes their own trials defined.</p>\n<h3 id=\"s-olaparib-for-germline-brca-mutated-disease\">Olaparib for germline BRCA-mutated disease</h3>\n<p><a class=\"trial-link\" href=\"/evidence/#t-olympia\">OlympiA</a> randomised 1,836 patients with a germline <em>BRCA1/2</em> pathogenic variant and HER2-negative high-risk early breast cancer, 82.2% of them triple-negative and the remainder HR-positive, to one year of olaparib 300 mg twice daily or placebo after (neo)adjuvant chemotherapy.</p>\n<p>Invasive disease-free survival improved (3-year 85.9% vs 77.1%; HR 0.58, 99.5% CI 0.41 to 0.82, P&lt;0.001), as did distant disease-free survival (HR 0.57), and the overall survival benefit reached significance at the second interim analysis (4-year 89.8% vs 86.4%; HR 0.68, 98.5% CI 0.47 to 0.97, P=0.009) (N Engl J Med 2021;384:2394-2405; Ann Oncol 2022;33:1250-1268).</p>\n<p>At the 2021 interim the overall survival hazard ratio was also 0.68 but did not cross its boundary (P=0.02 against P&lt;0.01), so the survival claim belongs to the 2022 analysis and not to the primary publication. Eligibility is defined by prior treatment and residual risk rather than by phenotype:</p>\n<ul><li class=\"evidence-prose\">Triple-negative disease: residual disease after neoadjuvant chemotherapy; or, without neoadjuvant chemotherapy, node-negative disease with a primary tumour of 2 cm or more, or node-positive disease, after adjuvant chemotherapy.</li><li class=\"evidence-prose\">HR-positive disease: a CPS-EG score of 3 or above after neoadjuvant chemotherapy; or, without neoadjuvant chemotherapy, pN2 or above.</li></ul>\n<p>Anaemia is the signature toxicity, at 23.5% any grade and 8.7% grade 3 or higher against 3.9% and 0.3% with placebo, and grade 3 or higher adverse events were roughly twice as frequent overall (24.3% vs 11.3%). Myelodysplastic syndrome and acute myeloid leukaemia were not increased at this cut (0.2% vs 0.3%), but at a median 2.5 years the investigators state longer follow-up is needed before that is settled.</p>\n<h2 id=\"s-bone-modifying-agents\">Bone-modifying agents</h2>\n<p>Adjuvant bisphosphonates reduce bone recurrence and breast cancer mortality in postmenopausal women. The <a class=\"trial-link\" href=\"/evidence/#t-ebctcg-adjuvant-bisphosphonate-meta-analysis\">EBCTCG adjuvant bisphosphonate meta-analysis</a> pooled 18,766 women in 26 trials. Overall reductions were only borderline (recurrence RR 0.94, 2p=0.08; distant recurrence 0.92, 2p=0.03; breast cancer mortality 0.91, 2p=0.04), while the bone-recurrence reduction was definite (RR 0.83, 95% CI 0.73 to 0.94, 2p=0.004).</p>\n<p>Among the 11,767 postmenopausal women, recurrence (RR 0.86), distant recurrence (0.82), bone recurrence (0.72; 10-year gain 2.2%) and breast cancer mortality (0.82; 10-year gain 3.3%) all fell significantly, while premenopausal women showed no apparent effect on any outcome (Lancet 2015;386:1353-1361).</p>\n<p>The postmenopausal boundary is less secure than those figures suggest: heterogeneity for bone recurrence was only borderline by menopausal status (2p=0.06 for trend) and correlated with age (2p=0.03), and no preferred agent, schedule or duration was established. Oral clodronate, oral ibandronate and intravenous zoledronate performed comparably; oral pamidronate showed no benefit.</p>\n<p>In practice, discuss an adjuvant bisphosphonate with postmenopausal patients whose recurrence risk justifies it, choosing agent and schedule around renal function, dental health, access and tolerance. Denosumab is not substituted as an anticancer strategy on the basis of fracture prevention alone.</p>\n<h2 id=\"s-older-and-less-fit-patients\">Older and less fit patients</h2>\n<p>Age alone should not determine treatment. Surgery and evidence-based subtype-directed therapy remain appropriate for a fit older patient; frailty, organ function, competing mortality, toxicity priorities and the absolute expected benefit determine de-escalation. Primary endocrine therapy is reserved for selected patients with ER-positive disease who are not surgical candidates.<sup class=\"trial-ref\"><a href=\"#ref-breast-early-breast-cancer-ext-29bf1e5a1d73\" aria-label=\"Reference 1: NCI Breast Cancer Treatment PDQ - early disease\">1</a></sup></p>\n<p>Where a patient is not a surgical candidate, management is individualized by the reason for inoperability, frailty, life expectancy, subtype, feasibility of definitive radiotherapy and tolerance of systemic therapy. Primary endocrine therapy may control ER-positive disease in a patient unfit for surgery. HER2-positive and triple-negative disease still require multidisciplinary consideration of disease-controlling local and systemic treatment; observation is reserved for goals or life expectancy that make treatment burdens outweigh benefit, not for absence of symptoms alone.</p>\n<h2 id=\"s-follow-up\">Follow-up</h2>\n<p>Follow-up uses regular clinical review and mammographic surveillance. Routine laboratory or imaging screening for distant metastases is not indicated in an asymptomatic patient; new symptoms or examination findings prompt targeted investigation.<sup class=\"trial-ref\"><a href=\"#ref-breast-early-breast-cancer-ext-29bf1e5a1d73\" aria-label=\"Reference 1: NCI Breast Cancer Treatment PDQ - early disease\">1</a></sup></p>\n<h2 id=\"s-references\">References</h2>\n<ol class=\"refs\">\n<li id=\"ref-breast-early-breast-cancer-ext-29bf1e5a1d73\"><a href=\"https://www.cancer.gov/types/breast/hp/breast-treatment-pdq\" rel=\"noopener\" target=\"_blank\">NCI Breast Cancer Treatment PDQ - early disease</a></li>\n<li id=\"ref-breast-early-breast-cancer-ext-56b2ae828237\"><a href=\"https://www.cancer.gov/types/breast/hp/pregnancy-breast-treatment-pdq\" rel=\"noopener\" target=\"_blank\">NCI Breast Cancer Treatment During Pregnancy PDQ</a></li>\n<li id=\"ref-breast-early-breast-cancer-t-acosog-z0011-alliance\"><a class=\"trial-link\" href=\"/evidence/#t-acosog-z0011-alliance\">ACOSOG Z0011 (Alliance)</a>. <a href=\"https://drive.google.com/file/d/1dRgHgppaMgBAM9td3tIQQESx4iuag0Qb/preview\">JAMA 2011;305:569-575</a>; <a href=\"https://drive.google.com/file/d/1uRrZZYObxt8gE98wx0aM0WDsMkKZhXd8/preview\">JAMA 2017;318:918-926</a></li>\n<li id=\"ref-breast-early-breast-cancer-t-amaros\"><a class=\"trial-link\" href=\"/evidence/#t-amaros\">AMAROS</a>. <a href=\"https://drive.google.com/file/d/19SAZKMTFI4tnrwcPnDG_4DgFobgKcQhw/preview\">Lancet Oncol 2014;15:1303-1310</a></li>\n<li id=\"ref-breast-early-breast-cancer-t-senomac\"><a class=\"trial-link\" href=\"/evidence/#t-senomac\">SENOMAC</a>. <a href=\"https://drive.google.com/file/d/1zYX3erxtFBmTj8itES4jjWPH0hojjpJu/preview\">N Engl J Med 2024;390:1163-1175</a>; <a hre
