cancer-molecular-pathology-and-genetics-ext-1e5ad94d750c\" aria-label=\"Reference 19: Pooled stage-III analysis\">19</a></sup>.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">dMMR/MSI-H has stage-specific treatment implications and predicts sensitivity to immune-checkpoint inhibition in advanced disease.</span><span class=\"evidence-detail\">See Early colon cancer for stage-II adjuvant decisions and Advanced and metastatic colorectal cancer for checkpoint-inhibitor selection and trial evidence.</span></li></ul>\n<h2 id=\"s-interpret-ras-braf-and-her2-separately\">Interpret RAS, BRAF and HER2 separately</h2>\n<p>Assess MMR/MSI, KRAS, NRAS and BRAF during the initial metastatic work-up, following current metastatic guidance<sup class=\"trial-ref\"><a href=\"#ref-colorectal-colorectal-cancer-molecular-pathology-and-genetics-ext-94e00143a678\" aria-label=\"Reference 20: ESMO metastatic colorectal cancer guideline\">20</a></sup>. Use validated molecular testing criteria and assess HER2 amplification in an appropriate advanced-disease context<sup class=\"trial-ref\"><a href=\"#ref-colorectal-colorectal-cancer-molecular-pathology-and-genetics-ext-c0817f76c4da\" aria-label=\"Reference 21: CAP/ASCO/AMP molecular-biomarker guideline\">21</a></sup>.</p>\n<h3 id=\"s-ras\">RAS</h3>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\">RAS proteins are GDP/GTP molecular switches downstream of EGFR.</span><span class=\"evidence-detail\">Activating mutations impair GTP hydrolysis, lock signalling through RAF–MEK–ERK and make EGFR blockade ineffective. KRAS is altered in roughly 40% of colorectal cancers; NRAS is less common, while HRAS is not part of routine extended-RAS selection in CRC.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">Extended RAS testing covers KRAS and NRAS exons 2, 3 and 4: codons 12/13, 59/61 and 117/146.</span><span class=\"evidence-detail\">This corrects the older shorthand that considered only KRAS codons 12/13 or included HRAS. RAS mutation is a negative predictive biomarker for cetuximab or panitumumab; it is not simply a universal stage-independent prognostic marker.</span></li><li class=\"evidence-prose\">See Advanced and metastatic colorectal cancer for regimen-, line- and sidedness-specific anti-EGFR evidence.</li></ul>\n<h3 id=\"s-braf\">BRAF</h3>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\">BRAF V600E accounts for most BRAF alterations and occurs in about 8%–10% of colorectal cancers.</span><span class=\"evidence-detail\">It is usually mutually exclusive with RAS mutation and enriched in right-sided, CIMP-high, sporadic MLH1-methylated disease. Cigarette smoking has been associated epidemiologically with MSI-H, CIMP-positive and BRAF-mutant CRC, but smoking is not a tumour biomarker<sup class=\"trial-ref\"><a href=\"#ref-colorectal-colorectal-cancer-molecular-pathology-and-genetics-ext-0fa25bb18dd6\" aria-label=\"Reference 22: Prospective cohort\">22</a></sup>.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">BRAF V600E is a strong adverse prognostic factor, particularly in MSS and advanced disease.</span><span class=\"evidence-detail\">It is not an anti-EGFR exclusion biomarker equivalent to RAS: prediction depends on regimen and disease setting. See Advanced and metastatic colorectal cancer for BRAF-directed treatment and outcome evidence.</span></li></ul>\n<p>In the post-hoc extended-RAS/BRAF analysis of 357 of 508 randomised patients with previously untreated unresectable metastatic colorectal cancer in <a class=\"trial-link\" href=\"/evidence/#t-tribe\">TRIBE</a>, median overall survival was 37.1 months in RAS/BRAF-wild-type disease, 25.6 months in RAS-mutant disease and 13.4 months in BRAF-mutant disease. The global likelihood-ratio p&lt;0.0001 was nominal and unadjusted for multiplicity.</p>\n<h3 id=\"s-her2\">HER2</h3>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\">ERBB2/HER2 amplification or overexpression occurs in approximately 2%–5% of colorectal cancers and is enriched in RAS/BRAF-wild-type disease.</span><span class=\"evidence-detail\">Use colorectal-specific IHC/ISH or validated NGS criteria; breast and gastric scoring should not be imported uncritically<sup class=\"trial-ref\"><a href=\"#ref-colorectal-colorectal-cancer-molecular-pathology-and-genetics-ext-8377b74fc8d0\" aria-label=\"Reference 24: HERACLES diagnostic validation\">24</a></sup>.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">HER2 amplification can bypass EGFR and contribute to primary or acquired anti-EGFR resistance.</span><span class=\"evidence-detail\">That association is not absolute and should not replace RAS/BRAF testing. HER2 is also directly actionable in selected refractory metastatic disease. See Advanced and metastatic colorectal cancer for HER2-directed regimens and outcome evidence.</span></li></ul>\n<p>c-MYC activation and VEGF-driven angiogenesis are central CRC biology, but neither is a routine standalone tumour-selection biomarker.</p>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\">Source-quality correction: legacy material lists <code>DH1</code>, but no recognised colorectal biomarker by that name was identified in current CAP/ASCO/AMP or ESMO biomarker scopes.</span><span class=\"evidence-detail\">Do not interpret it as IDH1 or use it clinically.</span></li></ul>\n<h2 id=\"s-use-consensus-molecular-subtype-as-a-biological-classification\">Use consensus molecular subtype as a biological classification</h2>\n<p>The consensus molecular subtype classifier<sup class=\"trial-ref\"><a href=\"#ref-colorectal-colorectal-cancer-molecular-pathology-and-genetics-ext-e7eea4ed3a25\" aria-label=\"Reference 25: consensus molecular subtype classifier\">25</a></sup> is transcriptomic taxonomy, not a replacement for validated clinical biomarkers. Mixed or unclassifiable samples occur, and routine treatment selection by CMS is not established.</p>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\">CMS1, MSI immune (14%): hypermutated, MSI-rich, CIMP-high, BRAF-enriched and strongly immune-activated; often right-sided and female.</span><span class=\"evidence-detail\">It can have favourable outcome before relapse but poor survival after relapse.</span></li><li class=\"evidence-prose\">CMS2, canonical (37%): epithelial, with WNT and MYC activation; more often left-sided and generally the most favourable CMS outcome.</li><li class=\"evidence-prose\">CMS3, metabolic (13%): epithelial, metabolically dysregulated and KRAS-enriched; outcome is intermediate.</li><li class=\"evidence-prose\">CMS4, mesenchymal (23%): TGF-β activation, stromal invasion and angiogenesis; more advanced presentation and the worst relapse-free and overall survival.</li><li class=\"evidence-prose\">Approximately 13% have mixed features, reflecting technical admixture, transition states or intratumour heterogeneity.</li></ul>\n<h2 id=\"s-recognise-hereditary-colorectal-cancer-syndromes\">Recognise hereditary colorectal cancer syndromes</h2>\n<p>Use phenotype, tumour testing, pedigree and germline testing together; manage each syndrome according to current hereditary gastrointestinal cancer guidance<sup class=\"trial-ref\"><a href=\"#ref-colorectal-colorectal-cancer-molecular-pathology-and-genetics-ext-53a5e465f01e\" aria-label=\"Reference 26: ESMO hereditary gastrointestinal cancers guideline\">26</a></sup>. A negative single-gene result does not turn a strongly suggestive family history into average risk.</p>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\">Lynch syndrome: autosomal-dominant pathogenic variants in MLH1, MSH2, MSH6 or PMS2, or EPCAM deletions that silence MSH2.</span><span class=\"evidence-detail\">A dMMR/MSI-H tumour is a screening signal, not a Lynch diagnosis; sporadic MLH1 methylation and double-somatic MMR alterations are common alternatives<sup class=\"trial-ref\"><a href=\"#ref-colorectal-colorectal-cancer-molecular-pathology-and-genetics-ext-913fc26495ad\" aria-label=\"Reference 27: Lynch syndrome GeneReview\">27</a></sup>.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">Adenomatous polyposis: APC-associated familial adenomatous polyposis, including attenuated FAP, and autosomal-recessive MUTYH-associated polyposis.</span><span class=\"evidence-detail\">Other multigene-panel causes include POLE/POLD1 proofreading-associated polyposis and biallelic NTHL1.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">Hamartomatous polyposis: STK11-associated Peutz–Jeghers syndrome, SMAD4/BMPR1A-associated juvenile polyposis and PTEN-hamartoma tumour syndrome.</span><span class=\"evidence-detail\">Their extracolonic cancer spectra and surveillance differ.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">Familial colorectal cancer type X is the historical designation for Amsterdam-I families whose tumours are MMR-proficient, not merely families with no germline MMR variant.</span><span class=\"evidence-detail\">It has lower CRC and extracolonic-cancer incidence than Lynch syndrome and remains genetically heterogeneous<sup class=\"trial-ref\"><a href=\"#ref-colorectal-colorectal-cancer-molecular-pathology-and-genetics-ext-aa0022a5f4a1\" aria-label=\"Reference 28: Lindor et al.\">28</a></sup>.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">“Lynch-like syndrome” is different: the tumour is dMMR/MSI-H but no germline cause or MLH1 methylation is found.</span><span class=\"evidence-detail\">Many such tumours have two somatic MMR hits; unresolved cases require genetics-led family-risk assessment.</span></li></ul>\n<h2 id=\"s-build-the-molecular-pathogenesis-model\">Build the molecular pathogenesis model</h2>\n<p>The classic adenoma–carcinoma model describes stepwise clonal selection: APC/WNT disruption is often early, KRAS activation can promote adenoma growth, and 18q/TGF-β-pathway and TP53 alterations are often later. It is a teaching framework, not an obligatory linear sequence; tumours can acquire different events in different orders<sup class=\"trial-ref\"><a href=\"#ref-colorectal-colorectal-cancer-molecular-pathology-and-genetics-ext-41ffbc1a1bfb\" aria-label=\"Reference 29: Fearon–Vogelstein model\">29</a></sup>.</p>\n<h3 id=\"s-mismatch-repair-route\">Mismatch-repair route</h3>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\">MLH1, PMS2, MSH2 and MSH6 operate as paired MMR complexes.</span><span class=\"evidence-detail\">Germline loss causes Lynch syndrome after somatic inactivation of the remaining allele; sporadic MLH1-promoter methylation is the commonest acquired route. Failure to repair replication slippage produces a hypermutated MSI-H tumour.</span></li></ul>\n<h3 id=\"s-serrated-cimp-route\">Serrated/CIMP route</h3>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\">CpG islands are CG-rich regulatory regions.</span><span class=\"evidence-detail\">CIMP describes concordant promoter hypermethylation across a defined marker panel, silencing tumour-suppressor or repair genes without changing DNA sequence. CIMP is biologically useful but assay panels and cut-offs are not fully standardised<sup class=\"trial-ref\"><a href=\"#ref-colorectal-colorectal-cancer-molecular-pathology-and-genetics-ext-676873876f6e\" aria-label=\"Reference 30: Original CIMP description\">30</a></sup>.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">In the serrated pathway, BRAF V600E is closely linked to CIMP-high.</span><span class=\"evidence-detail\">When methylation silences MLH1, the tumour becomes dMMR/MSI-H; CIMP-high tumours without MLH1 silencing remain MSS. KRAS and BRAF mutations are usually mutually exclusive, but BRAF is not confined to MSI-H disease<sup class=\"trial-ref\"><a href=\"#ref-colorectal-colorectal-cancer-molecular-pathology-and-genetics-ext-95c41f532fc0\" aria-label=\"Reference 31: Weisenberger et al.\">31</a></sup>.</span></li></ul>\n<h3 id=\"s-chromosomal-instability-and-apc-wnt-route\">Chromosomal-instability and APC/WNT route</h3>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\">Most non-hypermutated CRCs show chromosomal instability: aneuploidy, arm-level gains and losses, deletions and loss of heterozygosity.</span><span class=\"evidence-detail\">This route combines oncogene activation with loss of tumour-suppressor and apoptotic restraints; it can be sporadic or arise on a germline APC background.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">APC is the gatekeeper in the canonical adenoma route.</span><span class=\"evidence-detail\">In TCGA, APC was mutated in 81% of non-hypermutated CRCs and was commonly biallelically inactivated. One germline pathogenic variant causes APC-associated FAP, followed by somatic loss of the remaining allele.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">APC normally helps the destruction complex phosphorylate and degrade β-catenin.</span><span class=\"evidence-detail\">APC loss allows nuclear β-catenin/TCF transcription, sustaining crypt-cell proliferation, blocking normal differentiation and reducing apoptosis. WNT-pathway alterations occur in more than 90% of CRCs<sup class=\"trial-ref\"><a href=\"#ref-colorectal-colorectal-cancer-molecular-pathology-and-genetics-ext-3a513ae15c76\" aria-label=\"Reference 10: TCGA\">10</a></sup>.</span></li></ul>\n<h3 id=\"s-other-recurrent-abnormalities\">Other recurrent abnormalities</h3>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\">TP53 on 17p encodes a stress-responsive transcription factor that can induce cell-cycle arrest, DNA repair, senescence or apoptosis.</span><span class=\"evidence-detail\">TP53 loss is common in non-hypermutated CRC and often accompanies the late transition to invasive carcinoma.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">Chromosome 18q loss can encompass SMAD2, SMAD4 and DCC.</span><span class=\"evidence-detail\">SMAD2/4 transmit growth-inhibitory TGF-β signals, while advanced cancers may co-opt TGF-β for stromal invasion and immune exclusion. These alterations are biologically important but 18q loss, DCC and TGF-β are not routine standalone treatment-selection tests.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">BRCA1/2 variants and broader homologous-recombination alterations occur in a minority of CRCs, but BRCA is not a canonical CRC pathway marker and does not currently establish platinum or PARP-inhibitor benefit.</span><span class=\"evidence-detail\">A pathogenic BRCA1/2 variant found on tumour-only sequencing may warrant germline follow-up; therapeutic action should remain trial- or indication-specific<sup class=\"trial-ref\"><a href=\"#ref-colorectal-colorectal-cancer-molecular-pathology-and-genetics-ext-9ed9292280d5\" aria-label=\"Reference 32: ESMO tumour-NGS recommendations\">32</a></sup>.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">Biallelic germline MUTYH variants cause autosomal-recessive MUTYH-associated polyposis by disabling base-excision repair of oxidative DNA damage.</span><span class=\"evidence-detail\">The resulting tumours are enriched for G:C→T:A transversions and SBS18/SBS36 signatures; CRC may occur even without florid polyposis<sup class=\"trial-ref\"><a href=\"#ref-colorectal-colorectal-cancer-molecular-pathology-and-genetics-ext-618173172b7a\" aria-label=\"Reference 33: MUTYH GeneReview\">33</a></sup>.</span></li></ul>\n<h2 id=\"s-references\">References</h2>\n<ol class=\"refs\">\n<li id=\"ref-colorectal-colorectal-cancer-molecular-pathology-and-genetics-ext-1546bd9db8aa\"><a href=\"https://www.cap.org/protocols-and-guidelines/cancer-protocols/current-cancer-protocols/\" rel=\"noopener\" target=\"_blank\">CAP Colon and Rectum Resection protocol</a></li>\n<li id=\"ref-colorectal-colorectal-cancer-molecular-pathology-and-genetics-ext-cf144e01e947\"><a href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC8820778/\" rel=\"noopener\" target=\"_blank\">ICCR colorectal dataset</a></li>\n<li id=\"ref-colorectal-colorectal-cancer-molecular-pathology-and-genetics-ext-1d626e3abafd\"><a href=\"https://clsjournal.ascls.org/content/early/2024/09/18/ascls.2022003206\" rel=\"noopener\" target=\"_blank\">WHO-based histological overview</a></li>\n<li id=\"ref-colorectal-colorectal-cancer-molecular-pathology-and-genetics-ext-31bd0ccb5869\"><a href=\"https://www.iccr-cancer.org/docs/ICCR-CXC-HistoTT.pdf\" rel=\"noopener\" target=\"_blank\">ICCR tumour-type guidance</a></li>\n<li id=\"ref-colorectal-colorectal-cancer-molecular-pathology-and-genetics-ext-91600fac93ad\"><a href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC11099453/\" rel=\"noopener\" target=\"_blank\">Systematic review</a></li>\n<li id=\"ref-colorectal-colorectal-cancer-molecular-pathology-and-genetics-ext-629cfcd7b86a\"><a href=\"https://pubmed.ncbi.nlm.nih.gov/25572685/\" rel=\"noopener\" target=\"_blank\">Clinicopathological series</a></li>\n<li id=\"ref-colorectal-colorectal-cancer-molecular-pathology-and-genetics-ext-3e58ad97a778\"><a href=\"https://pubmed.ncbi.nlm.nih.gov/36819801/\" rel=\"noopener\" target=\"_blank\">Diagnostic study</a></li>\n<li id=\"ref-colorectal-colorectal-cancer-molecular-pathology-and-genetics-ext-ee128cc6976b\"><a href=\"https://pubmed.ncbi.nlm.nih.gov/24437456/\" rel=\"noopener\" target=\"_blank\">Medullary-marker study</a></li>\n<li id=\"ref-colorectal-colorectal-cancer-molecular-pathology-and-genetics-ext-0ab6737c575b\"><a href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC7271214/\" rel=\"noopener\" target=\"_blank\">Clinicopathological review</a></li>\n<li id=\"ref-colorectal-colorectal-cancer-molecular-pathology-and-genetics-ext-3a513ae15c76\"><a href=\"https://doi.org/10.1038/nature11252\" rel=\"noopener\" target=\"_blank\">TCGA</a></li>\n<li id=\"ref-colorectal-colorectal-cancer-molecular-pathology-and-genetics-ext-ef08c0f1977e\"><a href=\"https://pubmed.ncbi.nlm.nih.gov/29180604/\" rel=\"noopener\" target=\"_blank\">Colorectal-continuum analysis</a></li>\n<li id=\"ref-colorectal-colorectal-cancer-molecular-pathology-and-genetics-ext-aa3c9e3c12a5\"><a href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC10098852/\" rel=\"noopener\" target=\"_blank\">Meta-analysis</a></li>\n<li id=\"ref-colorectal-colorectal-cancer-molecular-pathology-and-genetics-ext-03f313ffee5e\"><a href=\"https://www.iccr-cancer.org/wp-content/uploads/2023/08/ICCR-Colorectal-1st-edn-v1.0-bookmark.pdf\" rel=\"noopener\" target=\"_blank\">ICCR dataset</a></li>\n<li id=\"ref-colorectal-colorectal-cancer-molecular-pathology-and-genetics-ext-f026eceaf5e8\"><a href=\"https://doi.org/10.1038/modpathol.2017.46\" rel=\"noopener\" target=\"_blank\">ITBCC consensus</a></li>\n<li id=\"ref-colorectal-colorectal-cancer-molecular-pathology-and-genetics-t-asco-guideline-baxter-et-al\"><a class=\"trial-link\" href=\"/evidence/#t-asco-guideline-baxter-et-al\">ASCO Guideline (Baxter et al.)</a>. <a href=\"https://drive.google.com/file/d/1aTcP3zGbwDJHG57m8jVe8e3ezqkMF0kZ/preview\">J Clin Oncol 2022;40:892-910</a></li>\n<li id=\"ref-colorectal-colorectal-cancer-molecular-pathology-and-genetics-ext-e0440653c428\"><a href=\"https://www.cap.org/cap-guidelines/mismatch-repair-and-microsatellite-instability-testing-for-immune-checkpoint-inhibitor-therapy/\" rel=\"noopener\" target=\"_blank\">CAP MMR/MSI guideline</a></li>\n<li id=\"ref-colorectal-colorectal-cancer-molecular-pathology-and-genetics-ext-da43200a4d63\"><a href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC2933058/\" rel=\"noopener\" target=\"_blank\">Revised Bethesda consensus</a></li>\n<li id=\"ref-colorectal-colorectal-cancer-molecular-pathology-and-genetics-ext-954fb158e823\"><a href=\"https://www.cancer.gov/types/colorectal/hp/colorectal-genetics-pdq\" rel=\"noopener\" target=\"_blank\">NCI colorectal genetics PDQ</a></li>\n<li id=\"ref-colorectal-colorectal-cancer-molecular-pathology-and-genetics-ext-1e5ad94d750c\"><a href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC6075212/\" rel=\"noopener\" target=\"_blank\">Pooled stage-III analysis</a></li>\n<li id=\"ref-colorectal-colorectal-cancer-molecular-pathology-and-genetics-ext-94e00143a678\"><a href=\"https://doi.org/10.1016/j.annonc.2022.10.003\" rel=\"noopener\" target=\"_blank\">ESMO metastatic colorectal cancer guideline</a></li>\n<li id=\"ref-colorectal-colorectal-cancer-molecular-pathology-and-genetics-ext-c0817f76c4da\"><a href=\"https://doi.org/10.1200/JCO.2016.71.9807\" rel=\"noopener\" target=\"_blank\">CAP/ASCO/AMP molecular-biomarker guideline</a></li>\n<li id=\"ref-colorectal-colorectal-cancer-molecular-pathology-and-genetics-ext-0fa25bb18dd6\"><a href=\"https://doi.org/10.1093/jnci/djq201\" rel=\"noopener\" target=\"_blank\">Prospective cohort</a></li>\n<li id=\"ref-colorectal-colorectal-cancer-molecular-pathology-and-genetics-t-tribe\"><a class=\"trial-link\" href=\"/evidence/#t-tribe\">TRIBE</a>. <a href=\"https://drive.google.com/file/d/1UKwif-OAHSN0-g2zU3mG7a3VjKhvB7yf/preview\">N Engl J Med 2014;371:1609-1618</a>; <a href=\"https://drive.google.com/file/d/1feQwqxSnPEsPD4VOgvqf-kTBAMMVfqm9/preview\">Lancet Oncol 2015;16:1306-1315</a></li>\n<li id=\"ref-colorectal-colorectal-cancer-molecular-pathology-and-genetics-ext-8377b74fc8d0\"><a href=\"https://pubmed.ncbi.nlm.nih.gov/26449765/\" rel=\"noopener\" target=\"_blank\">HERACLES diagnostic validation</a></li>\n<li id=\"ref-colorectal-colorectal-cancer-molecular-pathology-and-genetics-ext-e7eea4ed3a25\"><a href=\"https://doi.org/10.1038/nm.3967\" rel=\"noopener\" target=\"_blank\">consensus molecular subtype classifier</a></li>\n<li id=\"ref-colorectal-colorectal-cancer-molecular-pathology-and-genetics-ext-53a5e465f01e\"><a href=\"https://doi.org/10.1093/annonc/mdz233\" rel=\"noopener\" target=\"_blank\">ESMO hereditary gastrointestinal cancers guideline</a></li>\n<li id=\"ref-colorectal-colorectal-cancer-molecular-pathology-and-genetics-ext-913fc26495ad\"><a href=\"https://www.ncbi.nlm.nih.gov/books/NBK1211/\" rel=\"noopener\" target=\"_blank\">Lynch syndrome GeneReview</a></li>\n<li id=\"ref-colorectal-colorectal-cancer-molecular-pathology-and-genetics-ext-aa0022a5f4a1\"><a href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC2933042/\" rel=\"noopener\" target=\"_blank\">Lindor et al.</a></li>\n<li id=\"ref-colorectal-colorectal-cancer-molecular-pathology-and-genetics-ext-41ffbc1a1bfb\"><a href=\"https://doi.org/10.1016/0092-8674%2890%2990186-I\" rel=\"noopener\" target=\"_blank\">Fearon–Vogelstein model</a></li>\n<li id=\"ref-colorectal-colorectal-cancer-molecular-pathology-and-genetics-ext-676873876f6e\"><a href=\"https://pubmed.ncbi.nlm.nih.gov/10411935/\" rel=\"noopener\" target=\"_blank\">Original CIMP description</a></li>\n<li id=\"ref-colorectal-colorectal-cancer-molecular-pathology-and-genetics-ext-95c41f532fc0\"><a href=\"https://pubmed.ncbi.nlm.nih.gov/16804544/\" rel=\"noopener\" target=\"_blank\">Weisenberger et al.</a></li>\n<li id=\"ref-colorectal-colorectal-cancer-molecular-pathology-and-genetics-ext-9ed9292280d5\"><a href=\"https://doi.org/10.1016/j.annonc.2024.04.005\" rel=\"noopener\" target=\"_blank\">ESMO tumour-NGS recommendations</a></li>\n<li id=\"ref-colorectal-colorectal-cancer-molecular-pathology-and-genetics-ext-618173172b7a\"><a href=\"https://www.ncbi.nlm.nih.gov/books/NBK107219/\" rel=\"noopener\" target=\"_blank\">MUTYH GeneReview</a></li>\n</ol>", "_hay": "colorectal cancer: molecular pathology, genetics and prognostic determinants colorectal-cancer-molecular-pathology-and-genetics colorectal read the pathology report as a molecular map histology and grade immunohistochemistry sidedness is a gradient, not two diseases integrate pathological prognostic determinants establish mismatch-repair and microsatellite status interpret ras, braf and her2 separately ras braf her2 use consensus molecular subtype as a biological classification recognise hereditary colorectal cancer syndromes build the molecular pathogenesis model mismatch-repair route serrated/cimp route chromosomal-instability and apc/wnt route other recurrent abnormalities references"}, {"id": "colorectal-localized-colon-cancer", "slug": "localized-colon-cancer", "group": "Colorectal", "title": "Early colon cancer", "updated": "", "sections": [{"id": "s-stage-and-establish-resectability", "h": "Stage and establish resectability", "depth": 2}, {"id": "s-plan-postoperative-therapy", "h": "Plan postoperative therapy", "depth": 2}, {"id": "s-choose-a-stage-iii-regimen", "h": "Choose a stage III regimen", "depth": 3}, {"id": "s-select-3-or-6-months-for-stage-iii-disease", "h": "Select 3 or 6 months for stage III disease", "depth": 3}, {"id": "s-decide-whether-stage-ii-disease-needs-chemotherapy", "h": "Decide whether stage II disease needs chemotherapy", "depth": 3}, {"id": "s-avoid-adjuvant-targeted-therapy-outside-a-biomarker-defined-indication", "h": "Avoid adjuvant targeted therapy outside a biomarker-defined indication", "depth": 3}, {"id": "s-use-perioperative-chemotherapy-selectively", "h": "Use perioperative chemotherapy selectively", "depth": 2}, {"id": "s-use-ctdna-as-a-prognostic-marker-not-a-routine-escalation-mandate", "h": "Use ctDNA as a prognostic marker, not a routine escalation mandate", "depth": 2}, {"id": "s-treat-dmmr-msi-h-disease-differently", "h": "Treat dMMR/MSI-H disease differently", "depth": 2}, {"id": "s-adjuvant-chemotherapy", "h": "Adjuvant chemotherapy", "depth": 3}, {"id": "s-adjuvant-chemoimmunotherapy", "h": "Adjuvant chemoimmunotherapy", "depth": 3}, {"id": "s-neoadjuvant-immunotherapy", "h": "Neoadjuvant immunotherapy", "depth": 3}, {"id": "s-add-evidence-based-interventions-after-chemotherapy", "h": "Add evidence-based interventions after chemotherapy", "depth": 2}, {"id": "s-structured-exercise", "h": "Structured exercise", "depth": 3}, {"id": "s-aspirin", "h": "Aspirin", "depth": 3}, {"id": "s-surveillance-after-curative-treatment", "h": "Surveillance after curative treatment", "depth": 2}, {"id": "s-references", "h": "References", "depth": 2}], "html": "<p>This framework applies to non-metastatic colon cancer and high rectal cancers managed on a colon pathway. Rectal-specific radiotherapy, total neoadjuvant therapy and organ-preservation strategies require a rectal-cancer pathway.</p>\n<h2 id=\"s-stage-and-establish-resectability\">Stage and establish resectability</h2>\n<p>Stage I–III colon cancer is treated with complete surgical resection when feasible. An oncological colectomy follows the tumour-bearing segment and its lymphovascular drainage: aim for 5–7 cm proximal and distal bowel margins, divide the mesentery at the origin of the named feeding vessels, and examine at least 12 lymph nodes (ASCRS 2022 colon guideline).</p>\n<p>Stage I disease is usually cured by surgery alone and does not require adjuvant chemotherapy. In a contemporary single-centre cohort of 1,467 radically resected stage I colon cancers, 5-year DFS was 98.3% and recurrence occurred in 1.76%; this is prognostic context, not a universal guarantee<sup class=\"trial-ref\"><a href=\"#ref-colorectal-localized-colon-cancer-ext-551bb6034942\" aria-label=\"Reference 1: Shin et al.\">1</a></sup>.</p>\n<p>Postoperative management in stage II–III disease depends on pathological stage, recurrence risk, mismatch-repair status, fitness and the expected absolute benefit from treatment.</p>\n<h2 id=\"s-plan-postoperative-therapy\">Plan postoperative therapy</h2>\n<p>Adjuvant therapy treats occult micrometastatic disease after curative-intent surgery. A proportion of treated patients were already cured by surgery, so the expected reduction in recurrence must be balanced against short- and long-term toxicity.</p>\n<p>Recurrence may be locoregional, distant or a metachronous colorectal primary. In the historical ACCENT trial pool, 5,722/17,381 patients with stage II–III disease recurred; the risk depends strongly on stage and era, so this 32.9% pooled figure should not be applied to an individual patient<sup class=\"trial-ref\"><a href=\"#ref-colorectal-localized-colon-cancer-ext-f8d35e336854\" aria-label=\"Reference 2: O&#x27;Connell et al.\">2</a></sup>.</p>\n<p>Recurrence is concentrated early. Across 20,898 trial participants, adjuvant fluoropyrimidine chiefly reduced recurrence in the first 2 years, with some benefit through years 3–4; recurrence rates fell below 1.5% per year after year 5 and 0.5% after year 8<sup class=\"trial-ref\"><a href=\"#ref-colorectal-localized-colon-cancer-ext-9c7db32f7922\" aria-label=\"Reference 3: Sargent et al. 2009\">3</a></sup>.</p>\n<p>Across 20,898 patients in 18 randomised colon-cancer trials, 3-year DFS was validated as a surrogate for 5-year OS<sup class=\"trial-ref\"><a href=\"#ref-colorectal-localized-colon-cancer-ext-b9f708ea95f5\" aria-label=\"Reference 4: Sargent et al.\">4</a></sup>.</p>\n<p>A meta-analysis of observational cohorts associated each 4-week delay in starting adjuvant chemotherapy with worse OS and DFS (HR 1.14 for each). This association does not establish a causal 4–6-week or 8-week deadline<sup class=\"trial-ref\"><a href=\"#ref-colorectal-localized-colon-cancer-ext-0bce7f634a34\" aria-label=\"Reference 5: Biagi et al.\">5</a></sup>.</p>\n<h3 id=\"s-choose-a-stage-iii-regimen\">Choose a stage III regimen</h3>\n<p>The fluoropyrimidine options are oral capecitabine or infusional 5-FU/leucovorin.</p>\n<p><a class=\"trial-link\" href=\"/evidence/#t-x-act\">X-ACT</a> randomised 1,987 patients with resected stage III disease:</p>\n<ul><li class=\"evidence-prose\">Regimen: capecitabine for 24 weeks or bolus 5-FU/leucovorin.</li><li class=\"evidence-prose\"><span class=\"evidence-lead\">Efficacy: capecitabine met DFS non-inferiority (HR 0.88, 95% CI 0.77–1.01) and OS non-inferiority (HR 0.86, 0.74–1.01).</span><span class=\"evidence-detail\">Superiority for relapse-free survival was not reached (HR 0.89, 0.78–1.02; nominal P=.104).</span></li><li class=\"evidence-prose\">Safety: the predefined grade 3/4 fluoropyrimidine toxicities occurred later and less often with capecitabine (P&lt;.001).</li></ul>\n<p>Review proton-pump-inhibitor need when prescribing capecitabine, but do not present the interaction as established pharmacokinetics. A retrospective stage II–III cohort associated PPI exposure with worse 3-year recurrence-free survival during CAPOX (69.5% vs 82.6%; HR 2.03, 95% CI 1.06–3.88) but not FOLFOX; prospective confirmation is lacking<sup class=\"trial-ref\"><a href=\"#ref-colorectal-localized-colon-cancer-ext-04cb2d87af14\" aria-label=\"Reference 7: Wong et al.\">7</a></sup>.</p>\n<p>Oxaliplatin should be added for a fit patient with stage III disease:</p>\n<ul><li class=\"evidence-prose\"><a class=\"trial-link\" href=\"/evidence/#t-mosaic\">MOSAIC</a> randomised 2,246 patients with stage II–III colon cancer to 6 months of FOLFOX4 or LV5FU2.<ul><li>Primary result: FOLFOX4 improved 3-year DFS to 78.2% from 72.9% (HR 0.77, 95% CI 0.65–0.91; P=.002).</li><li>2009 update: 5-year DFS was 73.3% versus 67.4% (HR 0.80, 0.68–0.93; P=.003).</li><li>Stage III outcome: 6-year OS was 72.9% versus 68.7% (HR 0.80, 0.65–0.97; nominal P=.023), without a significant treatment-by-stage interaction.</li><li>Ten-year update: stage III OS was 67.1% versus 59.0% (HR 0.80, 95% CI 0.65–0.99; nominal P=.016); stage II OS was 78.4% versus 79.5% (HR 1.00, 0.70–1.41; P=.980)<sup class=\"trial-ref\"><a href=\"#ref-colorectal-localized-colon-cancer-ext-c37292de745a\" aria-label=\"Reference 9: 2015 primary update\">9</a></sup>.</li></ul></li><li class=\"evidence-prose\"><a class=\"trial-link\" href=\"/evidence/#t-nsabp-c-07\">NSABP C-07</a> randomised 2,492 patients with stage II–III disease to FLOX or bolus 5-FU/leucovorin.<ul><li>Primary result: in 2007, FLOX improved DFS (HR 0.80, 95% CI 0.69–0.93; P=.0034); 3-year DFS was 76.1% versus 71.8%.</li><li>2011 update: the DFS benefit persisted (HR 0.82, 0.72–0.93; nominal P=.002), while the prespecified secondary OS comparison did not reach nominal significance (HR 0.88, 0.75–1.02; P=.08).</li><li>Safety: grade 3/4 diarrhoea occurred in 38% versus 32%, and enteropathy-attributed deaths numbered 5 versus 1.</li></ul></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">XELOXA randomised 1,886 patients with stage III disease to 24 weeks of CAPOX or bolus 5-FU/folinic acid.</span><span class=\"evidence-detail\">CAPOX improved DFS (HR 0.80, 95% CI 0.69–0.93; P=.0045); 3-year DFS was 70.9% versus 66.5%. At the final update, 7-year OS was 73% versus 67% (HR 0.83, 0.70–0.99; nominal P=.04), although no final-analysis alpha had been prespecified.<sup class=\"trial-ref\"><a href=\"#ref-colorectal-localized-colon-cancer-t-xeloxa-no16968\" aria-label=\"Reference 11: XELOXA (NO16968)\">11</a></sup></span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-impact\">IMPACT</a> provides the earlier fluoropyrimidine-alone foundation.</span><span class=\"evidence-detail\">In a pooled analysis of 1,526 patients with resected stage II–III disease, 6 months of fluorouracil/folinic acid improved 3-year OS to 83% from 78% (HR 0.78, 95% CI 0.62–0.97; P=.029) and event-free survival to 71% from 62% (HR 0.65, 0.54–0.78; nominal P&lt;.0001).</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">The historical comparison established postoperative systemic therapy in stage III disease.</span><span class=\"evidence-detail\">1 year of levamisole plus 5-FU reduced recurrence by 41% (95% CI 23–54) and mortality by 33% (10–50) versus observation; levamisole alone had no detectable benefit.<sup class=\"trial-ref\"><a href=\"#ref-colorectal-localized-colon-cancer-t-moertel-int-0035\" aria-label=\"Reference 13: Moertel (INT-0035)\">13</a></sup></span></li></ul>\n<p>In an unplanned age analysis, the treatment-by-age interaction was significant for OS (P=.0391) but not DFS (P=.0733); among patients aged 70 years or older, neither OS (HR 1.18, 95% CI 0.86–1.62) nor DFS (HR 1.03, 0.77–1.36) improved. Treat this as hypothesis-generating and individualise oxaliplatin by fitness, competing mortality, neuropathy risk and recurrence risk.<sup class=\"trial-ref\"><a href=\"#ref-colorectal-localized-colon-cancer-t-nsabp-c-07\" aria-label=\"Reference 10: NSABP C-07\">10</a></sup></p>\n<p>A later pooled analysis of 17,909 stage III participants included 4,340 aged 70 years or older. Time to recurrence was similar by age, whereas DFS and OS were shorter in older participants, showing the effect of competing mortality rather than proving loss of cancer control from oxaliplatin<sup class=\"trial-ref\"><a href=\"#ref-colorectal-localized-colon-cancer-ext-5ecddbb647cf\" aria-label=\"Reference 14: ACCENT/IDEA pooled analysis\">14</a></sup>.</p>\n<h3 id=\"s-select-3-or-6-months-for-stage-iii-disease\">Select 3 or 6 months for stage III disease</h3>\n<p><a class=\"trial-link\" href=\"/evidence/#t-idea-collaboration\">IDEA Collaboration</a> pooled six randomised trials and 12,835 patients with stage III colon cancer.</p>\n<ul><li>Primary analysis: three months did not meet non-inferiority to 6 months for DFS (HR 1.07, 95% CI 1.00–1.15; non-inferiority margin 1.12).</li><li>Final update: non-inferiority remained unestablished for DFS (HR 1.08, 1.02–1.15) and OS (HR 1.02, 0.95–1.11).</li><li>Design limit: regimen choice was not randomised, although the adjusted duration-by-regimen interaction in the primary report was P=.02.</li></ul>\n<p>Use pathological risk and regimen together:</p>\n<ul><li>T1–3 N1 disease treated with CAPOX: 3 months is a reasonable standard, with 6 months discussed when recurrence risk or uncertainty is greater.</li><li>T4 and/or N2 disease: use 6 months of oxaliplatin-based therapy when tolerated.</li><li>FOLFOX: 6 months provides the more secure disease-control estimate; the descriptive 3-month comparison did not meet non-inferiority.</li></ul>\n<p>The regimen-specific estimates for 3 versus 6 months were:<sup class=\"trial-ref\"><a href=\"#ref-colorectal-localized-colon-cancer-t-idea-collaboration\" aria-label=\"Reference 15: IDEA Collaboration\">15</a></sup></p>\n<ul><li>FOLFOX: 3-year DFS 73.6% versus 76.0% (HR 1.16, 95% CI 1.06–1.26).</li><li>CAPOX: DFS 75.9% versus 74.8% (HR 0.95, 0.85–1.06).</li><li>Design limit: regimen was physician-selected rather than randomised, although the adjusted duration-by-regimen interaction was P=.02.</li></ul>\n<p>The pooled risk analysis was expressly exploratory and post hoc:</p>\n<ul><li>T4/N2 disease: 3-year DFS 62.7% versus 64.4% (HR 1.12, 1.03–1.23; nominal P=.01 for 6-month superiority).</li><li>T1–3/N1 disease: DFS 83.1% versus 83.3% (HR 1.01, 0.90–1.12).</li><li>Interaction: the duration-by-risk interaction was not significant (P=.11).</li></ul>\n<p>N1c means tumour deposits without positive regional nodes; it was not an IDEA duration-stratification factor and should not automatically be relabelled N2. In an IDEA-France post-hoc analysis, pN1a/b and pN1c had similar DFS, but any tumour deposit was independently adverse: 3-year DFS 65.6% versus 74.7% and adjusted HR 1.36 (P=.0201)<sup class=\"trial-ref\"><a href=\"#ref-colorectal-localized-colon-cancer-ext-3b0bd0cb7476\" aria-label=\"Reference 16: Delattre et al.\">16</a></sup>.</p>\n<p>KCSG CO09-07<sup class=\"trial-ref\"><a href=\"#ref-colorectal-localized-colon-cancer-ext-57e07c7bc308\" aria-label=\"Reference 17: KCSG CO09-07\">17</a></sup> randomised 1,788 patients with high-risk stage II or stage III colorectal cancer. Three months of oxaliplatin plus six months of fluoropyrimidine met the overall three-year DFS non-inferiority criterion versus six months of both components (84.7% vs 83.7%; HR 0.953, 95% CI 0.769–1.180; non-inferiority P=.0065), with less neuropathy (58.3% vs 69.5%).</p>\n<p>The paper narrowly supports three months of oxaliplatin plus six months of capecitabine as an alternative in stage III disease. Non-inferiority was not established in the infusional-fluorouracil subgroup.</p>\n<p>Grade 2 or worse neurotoxicity in IDEA was approximately 14–17% after 3 months and 44–45% after 6 months. This difference is central when the absolute gain from longer treatment is small.</p>\n<h3 id=\"s-decide-whether-stage-ii-disease-needs-chemotherapy\">Decide whether stage II disease needs chemotherapy</h3>\n<p>Most patients with stage II colon cancer do not routinely require adjuvant chemotherapy. T4 disease carries sufficient recurrence risk that the guideline recommends offering treatment for stage IIB/IIC disease, while other high-risk stage IIA features support individualised discussion rather than an assumed uniform benefit.<sup class=\"trial-ref\"><a href=\"#ref-colorectal-localized-colon-cancer-t-asco-guideline-baxter-et-al\" aria-label=\"Reference 18: ASCO Guideline (Baxter et al.)\">18</a></sup></p>\n<p>The ASCO guideline recommends:<sup class=\"trial-ref\"><a href=\"#ref-colorectal-localized-colon-cancer-t-asco-guideline-baxter-et-al\" aria-label=\"Reference 18: ASCO Guideline (Baxter et al.)\">18</a></sup></p>\n<ul><li>Do not routinely offer adjuvant chemotherapy for stage II disease overall.</li><li>Offer it for stage IIB/IIC (T4) tumours.</li><li>Consider it for stage IIA disease with fewer than 12 nodes examined, lymphovascular or perineural invasion, poor differentiation, obstruction, perforation or BD3 tumour budding.</li><li>Do not routinely use fluoropyrimidine-only treatment for dMMR/MSI-H tumours.</li><li>Do not routinely add oxaliplatin in stage II disease; discuss it when the recurrence risk justifies the toxicity.</li></ul>\n<p>The principal adverse features are:</p>\n<ul><li>pT4 disease.</li><li>Bowel obstruction or tumour perforation.</li><li>Fewer than 12 lymph nodes examined, with a risk of nodal understaging.</li><li>Lymphovascular or perineural invasion.</li><li>Poorly or undifferentiated histology, except where dMMR explains the morphology.</li><li>High tumour budding, BD3 with at least 10 buds.</li></ul>\n<p>In an unplanned exploratory stage II IDEA analysis, 5-year DFS was 87.3% with one risk factor and 74.8% with at least two; this is prognostic, and the duration-by-risk-factor-count interaction was not significant (P=.78).<sup class=\"trial-ref\"><a href=\"#ref-colorectal-localized-colon-cancer-t-idea-collaboration-stage-ii\" aria-label=\"Reference 19: IDEA Collaboration (Stage II)\">19</a></sup></p>\n<p>Margin status and preoperative CEA need separate interpretation. A positive or indeterminate resection margin raises concern about residual disease and requires surgical/pathology review; elevated preoperative CEA is prognostic and supplies a postoperative baseline. Neither appears in the Baxter list as a stand-alone indication for stage II chemotherapy<sup class=\"trial-ref\"><a href=\"#ref-colorectal-localized-colon-cancer-ext-ba9c2bce70e7\" aria-label=\"Reference 20: ASCRS 2022 colon guideline\">20</a></sup>.</p>\n<p>The stage II trial base is heterogeneous:</p>\n<ul><li class=\"evidence-prose\"><a class=\"trial-link\" href=\"/evidence/#t-quasar\">QUASAR</a> enrolled 3,239 patients with an uncertain indication for chemotherapy, mostly stage II.<ul><li>Fluorouracil/folinic acid reduced all-cause mortality (RR 0.82, 95% CI 0.70–0.95; P=.008) and recurrence (RR 0.78, 0.67–0.91; nominal P=.001) versus observation.</li><li>The often quoted 3.6-point 5-year survival benefit in stage II disease was modelled from an assumed 20% baseline mortality rather than observed as an arm difference.</li></ul></li><li class=\"evidence-prose\">Earlier evidence conflicted: the pooled IMPACT B2 analysis of 1,016 patients did not show significant event-free-survival or OS improvement with fluorouracil/folinic acid, whereas QUASAR later supported a small average benefit in an uncertain-indication population<sup class=\"trial-ref\"><a href=\"#ref-colorectal-localized-colon-cancer-ext-2cb1c3b2026a\" aria-label=\"Reference 22: IMPACT B2\">22</a></sup>.</li><li class=\"evidence-prose\">The exploratory stage II subgroup did not show a significant DFS or OS benefit from adding oxaliplatin; the treatment-by-stage interaction was not significant.<sup class=\"trial-ref\"><a href=\"#ref-colorectal-localized-colon-cancer-t-mosaic\" aria-label=\"Reference 8: MOSAIC\">8</a></sup></li><li class=\"evidence-prose\">In the unplanned stage II subgroup, OS (HR 1.04, 95% CI 0.72–1.50; P=.84) and DFS (HR 0.94, 0.70–1.26; P=.67) did not improve; treatment-by-stage interactions were nonsignificant for OS (P=.38) and DFS (P=.37).<sup class=\"trial-ref\"><a href=\"#ref-colorectal-localized-colon-cancer-t-nsabp-c-07\" aria-label=\"Reference 10: NSABP C-07\">10</a></sup></li></ul>\n<p>High-risk features are prognostic; they do not by themselves prove that oxaliplatin is predictive of benefit. A 2024 pooled analysis of 1,595 stage II participants from MOSAIC and C-07 found no OS benefit from adding oxaliplatin overall (HR 1.03, 95% CI 0.82–1.29) or within the current high-risk classification (HR 0.86, 0.63–1.18), and no tested factor or factor count predicted benefit<sup class=\"trial-ref\"><a href=\"#ref-colorectal-localized-colon-cancer-ext-606fa848a00b\" aria-label=\"Reference 23: ACCENT analysis\">23</a></sup>.</p>\n<p>When chemotherapy is selected:</p>\n<ul><li>Fluoropyrimidine monotherapy is given for 6 months.</li><li>If an oxaliplatin doublet is selected, either 3 or 6 months may be used after discussion of recurrence risk, expected benefit and neuropathy.<sup class=\"trial-ref\"><a href=\"#ref-colorectal-localized-colon-cancer-t-asco-guideline-baxter-et-al\" aria-label=\"Reference 18: ASCO Guideline (Baxter et al.)\">18</a></sup></li><li>Regimen-specific IDEA estimates are descriptive because regimen choice was not randomised and the adjusted interaction was not significant.</li></ul>\n<p>The stage II duration analysis pooled 3,273 patients with high-risk stage II colon or rectal cancer. Three months did not meet DFS non-inferiority to 6 months overall (5-year 80.7% vs 83.9%; HR 1.17, 80% CI 1.05–1.31; margin 1.20).</p>\n<p>Regimen was not randomised and the multiplicity-adjusted regimen interaction was not significant. Descriptive HRs were 1.02 for CAPOX and 1.41 for FOLFOX; grade 2 or worse neuropathy was 13% versus 36%.<sup class=\"trial-ref\"><a href=\"#ref-colorectal-localized-colon-cancer-t-idea-collaboration-stage-ii\" aria-label=\"Reference 19: IDEA Collaboration (Stage II)\">19</a></sup></p>\n<p><a class=\"trial-link\" href=\"/evidence/#t-achieve-2\">ACHIEVE-2</a> randomised 514 patients with high-risk stage II disease to 3 or 6 months of mFOLFOX6 or CAPOX. Three-year DFS was 88.2% versus 87.9% (adjusted HR 1.12, 95% CI 0.67–1.87). The stand-alone trial did not define a non-inferiority margin or alpha, so it does not prove non-inferiority; grade 2 or worse neuropathy was 16% versus 43%.</p>\n<h3 id=\"s-avoid-adjuvant-targeted-therapy-outside-a-biomarker-defined-indication\">Avoid adjuvant targeted therapy outside a biomarker-defined indication</h3>\n<p>VEGF and EGFR inhibition did not improve outcomes when added to standard adjuvant chemotherapy:</p>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-nsabp-c-08\">NSABP C-08</a>: adding 1 year of bevacizumab to 6 months of mFOLFOX6 did not improve DFS (3-year 77.4% vs 75.5%; HR 0.89, 95% CI 0.76–1.04; P=.15).</span><span class=\"evidence-detail\">Grade 3 or worse hypertension, wound complications, pain and proteinuria increased.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-avant\">AVANT</a>: the global DFS gate failed (P=.2024).</span><span class=\"evidence-detail\">Exploratory DFS HRs were 1.17 for bevacizumab-FOLFOX4 versus FOLFOX4 and 1.07 for bevacizumab-XELOX versus FOLFOX4. Five-year OS was 85%, 81% and 82%, respectively; grade 3–5 adverse events occurred in 73%, 76% and 65%.</span></li><li class=\"evidence-prose\">In N0147, cetuximab did not improve DFS in resected stage III KRAS wild-type disease (3-year 71.5% vs 74.6%; adjusted HR 1.21, 95% CI 0.98–1.49; nominal P=.08), and grade 3 or worse toxicity increased to 73.3% from 51.1%.<sup class=\"trial-ref\"><a href=\"#ref-colorectal-localized-colon-cancer-t-n0147-alliance\" aria-label=\"Reference 27: N0147 (Alliance)\">27</a></sup></li><li class=\"evidence-prose\"><a class=\"trial-link\" href=\"/evidence/#t-petacc-8\">PETACC-8</a>: cetuximab did not improve DFS in KRAS exon 2 wild-type disease at the planned interim analysis (3-year 75.1% vs 78.0%; HR 1.05, 95% CI 0.85–1.29; P=.66), and increased rash, diarrhoea, mucositis and infusion reactions.</li></ul>\n<h2 id=\"s-use-perioperative-chemotherapy-selectively\">Use perioperative chemotherapy selectively</h2>\n<p>Potential advantages of preoperative chemotherapy include earlier treatment of micrometastatic disease, tumour downsizing and better treatment completion. CT staging is imperfect, however, and exposes some patients with pathological T3N0 disease to chemotherapy that might have been omitted after upfront surgery.</p>\n<p>Neoadjuvant chemotherapy is not routine. When considered for radiologically high-risk, resectable M0 colon cancer, use multidisciplinary selection and explain CT overstaging and the absence of a confirmed universal DFS benefit:</p>\n<ul><li class=\"evidence-prose\"><a class=\"trial-link\" href=\"/evidence/#t-foxtrot\">FOxTROT</a> enrolled 1,053 patients with operable M0, CT-staged cT3–4 colon cancer and at least 5 mm of extramural extension, or at least 1 mm after the pilot.<ul><li>Disease control: six weeks of preoperative OxFU/OxCap reduced 2-year residual or recurrent disease to 16.9% from 21.5% (rate ratio 0.72, 95% CI 0.54–0.98; P=.037).</li><li>Surgery: R0 resection was 94% versus 89%, and T4 disease at resection was 21% versus 31%.</li><li>Staging limit: twenty-four per cent of control patients had pathological T3N0 tumours.</li></ul></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">OPTICAL<sup class=\"trial-ref\"><a href=\"#ref-colorectal-localized-colon-cancer-ext-28c68217460b\" aria-label=\"Reference 30: OPTICAL\">30</a></sup> did not significantly improve 3-year DFS with neoadjuvant mFOLFOX6/CAPOX versus upfront surgery (82.1% vs 77.5%; HR 0.74, 95% CI 0.54–1.03).</span><span class=\"evidence-detail\">Pathological downstaging and a 7% complete response rate do not establish routine universal use.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-neocol\">NeoCol</a> enrolled 248 patients with CT-defined cT3 disease with at least 5 mm extramural invasion or cT4 disease.</span><span class=\"evidence-detail\">Three preoperative CAPOX cycles did not improve 3-year DFS over upfront surgery (83% vs 87%; P=.36). Only 38 of 56 planned events had occurred, so the result is nonconfirmatory. Fewer patients met postoperative criteria for chemotherapy (59% vs 73%; nominal P=.02).</span></li></ul>\n<p>FOxTROT also contained a separate panitumumab substudy in RAS wild-type disease. It does not establish perioperative anti-EGFR therapy as standard.</p>\n<h2 id=\"s-use-ctdna-as-a-prognostic-marker-not-a-routine-escalation-mandate\">Use ctDNA as a prognostic marker, not a routine escalation mandate</h2>\n<p>Postoperative ctDNA identifies a group at high risk of recurrence, but a prognostic marker is not automatically a predictive treatment-selection test.</p>\n<p>In stage II disease, <a class=\"trial-link\" href=\"/evidence/#t-dynamic\">DYNAMIC</a> randomised 455 patients to ctDNA-guided or clinicopathological management. Chemotherapy was given for ctDNA detected at week 4 or 7.</p>\n<ul><li class=\"evidence-prose\">Treatment use: the strategy reduced chemotherapy use to 15% from 28% (nominal RR for standard vs guided management 1.82, 95% CI 1.25–2.65).</li><li class=\"evidence-prose\">Efficacy: the strategy met 2-year RFS non-inferiority (93.5% vs 92.4%; difference 1.1 points, 95% CI −4.1 to 6.2; margin −8.5).</li><li class=\"evidence-prose\">Delivery: most ctDNA-positive patients received an oxaliplatin doublet, and the median time to chemotherapy was 83 days.</li><li class=\"evidence-prose\">Mature follow-up: at 59.7 months&#x27; median follow-up, 5-year RFS was 88% with ctDNA-guided management and 87% with standard management (difference 1.1 points, 95% CI −5.8 to 8.0); 5-year OS was 93.8% versus 93.3% (HR 1.05; P=.887)<sup class=\"trial-ref\"><a href=\"#ref-colorectal-localized-colon-cancer-ext-5444edd361f5\" aria-label=\"Reference 33: five-year update\">33</a></sup>.</li></ul>\n<p>The strategy result does not erase prognosis: within the ctDNA-guided group, 3-year RFS was 86.4% for ctDNA-positive and 92.5% for ctDNA-negative disease. Clearance during treatment is also favourable, but these subgroup associations are exploratory and do not prove that changing therapy because of a ctDNA result improves survival.</p>\n<p>In stage III disease, DYNAMIC-III confirmed prognosis but did not validate treatment adaptation:<sup class=\"trial-ref\"><a href=\"#ref-colorectal-localized-colon-cancer-t-dynamic-iii-agitg-cctg\" aria-label=\"Reference 34: DYNAMIC-III (AGITG/CCTG)\">34</a></sup></p>\n<ul><li>Prognosis: postoperative ctDNA-negative and ctDNA-positive patients had 3-year RFS of 87% and 49%, respectively (nominal P&lt;.001).</li><li>De-escalation: ctDNA-negative disease did not confirm non-inferiority (85.3% vs 88.1%; difference −2.8 points, 95% CI −8.0 to 2.3; margin −7.5).</li><li>Escalation: ctDNA-positive disease did not meet the phase 2 superiority threshold (2-year RFS 51.1% vs 60.8%; HR 1.16, 0.87–1.53).</li></ul>\n<p>GALAXY is prospective observational evidence. In the enlarged cohort, MRD-positive and MRD-negative patients had 24-month DFS of 20.57% and 85.10% (HR 11.99, 95% CI 10.02–14.35); the OS HR was 9.68 (6.33–14.82). Surveillance ctDNA positivity preceded radiological recurrence by a median 5.91 months.<sup class=\"trial-ref\"><a href=\"#ref-colorectal-localized-colon-cancer-t-galaxy-circulate-japan\" aria-label=\"Reference 35: GALAXY (CIRCULATE-Japan)\">35</a></sup></p>\n<p>Molecular intervention after completion of standard therapy has not yet improved outcomes. In ALTAIR, 243 ctDNA-positive, radiologically disease-free patients were randomised to trifluridine/tipiracil or placebo. DFS did not improve (median 9.30 vs 5.55 months; HR 0.79, 95% CI 0.60–1.05; P=.107), while grade 3 or worse adverse events increased to 73.0% from 3.3%.<sup class=\"trial-ref\"><a href=\"#ref-colorectal-localized-colon-cancer-t-altair-epoc1905-circulate-japan\" aria-label=\"Reference 36: ALTAIR (EPOC1905, CIRCULATE-Japan)\">36</a></sup></p>\n<h2 id=\"s-treat-dmmr-msi-h-disease-differently\">Treat dMMR/MSI-H disease differently</h2>\n<p>Determine MMR/MSI status before making stage II adjuvant decisions and before considering the dMMR-directed approaches below.</p>\n<p>This chapter owns the localized-treatment consequences of dMMR/MSI-H. Use the molecular chapter for assay interpretation, tumour biology, germline assessment and hereditary mechanisms rather than duplicating them here.</p>\n<h3 id=\"s-adjuvant-chemotherapy\">Adjuvant chemotherapy</h3>\n<p>Routine fluoropyrimidine-only adjuvant chemotherapy is not recommended for stage II dMMR/MSI-H colon cancer.<sup class=\"trial-ref\"><a href=\"#ref-colorectal-localized-colon-cancer-t-asco-guideline-baxter-et-al\" aria-label=\"Reference 18: ASCO Guideline (Baxter et al.)\">18</a></sup></p>\n<p>If shared decision-making leads to adjuvant treatment for stage II dMMR/MSI-H disease with T4 and/or another high-risk feature, excluding poor differentiation alone, use an oxaliplatin-containing regimen rather than fluoropyrimidine monotherapy; the supporting evidence is indirect.<sup class=\"trial-ref\"><a href=\"#ref-colorectal-localized-colon-cancer-t-asco-guideline-baxter-et-al\" aria-label=\"Reference 18: ASCO Guideline (Baxter et al.)\">18</a></sup></p>\n<p>The historical evidence explains this caution. In a pooled analysis of 1,027 patients, fluorouracil did not improve DFS in dMMR disease (HR 1.10, 95% CI 0.42–2.91); the stage II dMMR subgroup had worse OS with treatment (HR 2.95, 1.02–8.54), a small retrospective subgroup that should not be overread<sup class=\"trial-ref\"><a href=\"#ref-colorectal-localized-colon-cancer-ext-255f31b1a41b\" aria-label=\"Reference 37: Sargent et al. 2010\">37</a></sup>.</p>\n<p>MMR has different prognostic and predictive questions. In the QUASAR correlative cohort, recurrence occurred in 25/218 dMMR tumours versus 438/1,695 pMMR tumours (RR 0.53, 95% CI 0.40–0.70), but fluoropyrimidine benefit in dMMR disease was imprecise (OR 0.81, 0.29–2.22)<sup class=\"trial-ref\"><a href=\"#ref-colorectal-localized-colon-cancer-ext-c189028303ea\" aria-label=\"Reference 38: Hutchins et al.\">38</a></sup>.</p>\n<p>For oxaliplatin, MOSAIC suggested favourable dMMR subgroup effects for DFS (HR 0.48, 95% CI 0.20–1.12) and OS (HR 0.41, 0.16–1.07), but neither was conclusive. The C-07 tissue analysis found dMMR prognostic for lower recurrence yet no significant MMR-by-oxaliplatin interaction. These retrospective, underpowered subgroup findings support caution, not a stage III exclusion<sup class=\"trial-ref\"><a href=\"#ref-colorectal-localized-colon-cancer-ext-39fcbd4f0269\" aria-label=\"Reference 39: C-07 biomarker analysis\">39</a></sup>.</p>\n<h3 id=\"s-adjuvant-chemoimmunotherapy\">Adjuvant chemoimmunotherapy</h3>\n<p>ATOMIC randomised 712 patients with resected stage III dMMR colon cancer:<sup class=\"trial-ref\"><a href=\"#ref-colorectal-localized-colon-cancer-t-atomic-a021502\" aria-label=\"Reference 40: ATOMIC (A021502)\">40</a></sup></p>\n<ul><li>Regimen: 6 months of mFOLFOX6 with atezolizumab followed by atezolizumab to complete 12 months, or mFOLFOX6 alone.</li><li>DFS: at the second prespecified interim analysis, 3-year DFS improved to 86.3% from 76.2% (HR 0.50, 95% CI 0.35–0.73; P&lt;.001).</li><li>OS: the first interim analysis did not reach significance (5-year 89.7% vs 87.9%; HR 0.90, 0.55–1.47; P=.68).</li><li>Safety: grade 3/4 adverse events occurred in 84.1% versus 71.9%.</li></ul>\n<h3 id=\"s-neoadjuvant-immunotherapy\">Neoadjuvant immunotherapy</h3>\n<p><a class=\"trial-link\" href=\"/evidence/#t-niche-2\">NICHE-2</a> treated previously untreated, resectable dMMR colon cancer:</p>\n<ul><li>Regimen: nivolumab 3 mg/kg on days 1 and 15 plus ipilimumab 1 mg/kg on day 1, followed by surgery within 6 weeks.</li><li>Surgery: timely surgery, a primary endpoint, occurred in 113 of 115 patients (98%; 97.5% CI 93–100); two myositis events caused delay.</li><li>Response: among 111 eligible patients, pathological response was 98%, major pathological response 95% and complete response 68%.</li><li>Maturity: no recurrence occurred at a median 26.2 months, but the 3-year DFS co-primary endpoint was immature.</li></ul>\n<p>Other phase 2 strategies remain investigational:</p>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\">NICHE-3<sup class=\"trial-ref\"><a href=\"#ref-colorectal-localized-colon-cancer-ext-bcd8c87a7ef4\" aria-label=\"Reference 42: NICHE-3\">42</a></sup> gave two cycles of nivolumab plus relatlimab to 59 patients with locally advanced dMMR colon cancer.</span><span class=\"evidence-detail\">Pathological response was 97% and pCR 68%.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">IMHOTEP<sup class=\"trial-ref\"><a href=\"#ref-colorectal-localized-colon-cancer-ext-f1dfea6d6f5a\" aria-label=\"Reference 43: IMHOTEP\">43</a></sup> evaluated perioperative pembrolizumab in localised resectable dMMR/MSI colorectal cancer.</span><span class=\"evidence-detail\">Among 72 efficacy-evaluable patients, pCR was 52.7%; grade 3 or worse immune toxicity was 15.7%, including one fatal event.</span></li><li class=\"evidence-prose\">Definition: major pathological response means 10% or less residual viable tumour.</li></ul>\n<h2 id=\"s-add-evidence-based-interventions-after-chemotherapy\">Add evidence-based interventions after chemotherapy</h2>\n<h3 id=\"s-structured-exercise\">Structured exercise</h3>\n<p><a class=\"trial-link\" href=\"/evidence/#t-challenge\">CHALLENGE</a> randomised 889 patients with resected stage III or high-risk stage II colon cancer after completion of adjuvant chemotherapy. The comparison was a 3-year structured exercise programme versus health-education materials.</p>\n<ul><li class=\"evidence-prose\">DFS: structured exercise improved 5-year DFS to 80.3% from 73.9% (HR 0.72, 95% CI 0.55–0.94; P=.02).</li><li class=\"evidence-prose\">OS: the unadjusted secondary result also favoured exercise (8-year 90.3% vs 83.2%; HR 0.63, 0.43–0.94).</li><li class=\"evidence-prose\"><span class=\"evidence-lead\">Exposure: the intervention targeted at least 10 MET-hours per week above baseline within 6 months and maintenance for 3 years.</span><span class=\"evidence-detail\">The achieved between-group difference was 5.2–7.4 MET-hours per week during the programme; this does not support the legacy conversion of one MET to an hour of sitting.</span></li><li class=\"evidence-prose\">Safety: musculoskeletal adverse events occurred in 18.5% versus 11.5%.</li></ul>\n<h3 id=\"s-aspirin\">Aspirin</h3>\n<p>Use aspirin only in an appropriate molecular context and after assessing bleeding risk.</p>\n<p><a class=\"trial-link\" href=\"/evidence/#t-alascca\">ALASCCA</a> randomised 626 patients with stage II–III colon or stage I–III rectal cancer and a PI3K-pathway alteration to aspirin 160 mg daily or placebo for 3 years:</p>\n<ul><li>Group A: in patients with PIK3CA exon 9 or 20 hotspot variants, aspirin reduced 3-year recurrence to 7.7% from 14.1% (HR 0.49, 95% CI 0.24–0.98; P=.04), the primary analysis.</li><li>Group B: in patients with other PIK3CA, PIK3R1 or PTEN variants, the descriptive secondary result was 7.7% versus 16.8% (HR 0.42, 0.21–0.83); no multiplicity adjustment was performed.</li><li>Safety: severe adverse events occurred in 16.8% versus 11.6%.</li></ul>\n<p>ASCOLT<sup class=\"trial-ref\"><a href=\"#ref-colorectal-localized-colon-cancer-ext-3ae388525862\" aria-label=\"Reference 46: ASCOLT\">46</a></sup> found no significant DFS improvement from aspirin 200 mg daily for 3 years after standard adjuvant therapy in its non-hereditary colorectal-cancer population. Do not extrapolate the PI3K-altered ALASCCA result to biomarker-unselected disease.</p>\n<p>In Lynch syndrome, CAPP2<sup class=\"trial-ref\"><a href=\"#ref-colorectal-localized-colon-cancer-ext-a118e63ced23\" aria-label=\"Reference 47: CAPP2\">47</a></sup> compared aspirin 600 mg daily with placebo. In the intention-to-treat analysis, colorectal cancer occurred in 40/427 (9%) versus 58/434 (13%; HR 0.65, 95% CI 0.43–0.97; P=.035).</p>\n<p>Among 509 participants who took treatment for at least 2 years, the prespecified per-protocol HR was 0.56 (95% CI 0.34–0.91; P=.019). The effect became apparent only after about 4–5 years. CAPP2 does not establish the optimal current dose; discuss aspirin after gastrointestinal and bleeding-risk assessment and within hereditary-cancer guidance.</p>\n<h2 id=\"s-surveillance-after-curative-treatment\">Surveillance after curative treatment</h2>\n<p>Surveillance intensity should reflect stage, fitness for salvage treatment and local guidance. The following is the historical 2013 ASCO endorsement of a Cancer Care Ontario evidence-based schedule for resected stage II–III disease:</p>\n<ul><li>History, examination and CEA every 3–6 months for 5 years.</li><li>CT chest and abdomen annually for 3 years in most patients; include the pelvis when clinically indicated or when a rectal/high-rectal pathway applies.</li><li>Clearing colonoscopy before surgery when feasible; if the colon was not completely examined, complete it after recovery.</li><li>Colonoscopy at 1 year, then at 3 years and every 5 years if findings remain low risk; shorten the interval according to polyp findings.</li></ul>\n<p>This dated schedule must be adapted if comorbidity, hereditary risk or prior endoscopic findings change the balance<sup class=\"trial-ref\"><a href=\"#ref-colorectal-localized-colon-cancer-ext-bf3f048425aa\" aria-label=\"Reference 48: Meyerhardt et al.\">48</a></sup>. Current NICE NG151 specifies CEA plus CT of the chest, abdomen and pelvis during the first 3 years but not a universal visit-by-visit cadence; follow the current local programme<sup class=\"trial-ref\"><a href=\"#ref-colorectal-localized-colon-cancer-ext-23575b5b597f\" aria-label=\"Reference 49: NICE NG151\">49</a></sup>.</p>\n<p>Recurrence risk falls substantially after 5 years, so routine cancer-directed imaging beyond that point needs a specific indication.</p>\n<h2 id=\"s-references\">References</h2>\n<ol class=\"refs\">\n<li id=\"ref-colorectal-localized-colon-cancer-ext-551bb6034942\"><a href=\"https://pubmed.ncbi.nlm.nih.gov/39363582/\" rel=\"noopener\" target=\"_blank\">Shin et al.</a></li>\n<li id=\"ref-colorectal-localized-colon-cancer-ext-f8d35e336854\"><a href=\"https://doi.org/10.1200/JCO.2007.15.8261\" rel=\"noopener\" target=\"_blank\">O&#x27;Connell et al.</a></li>\n<li id=\"ref-colorectal-localized-colon-cancer-ext-9c7db32f7922\"><a href=\"https://doi.org/10.1200/JCO.2008.19.5362\" rel=\"noopener\" target=\"_blank\">Sargent et al. 2009</a></li>\n<li id=\"ref-colorectal-localized-colon-cancer-ext-b9f708ea95f5\"><a href=\"https://doi.org/10.1200/JCO.2005.01.6071\" rel=\"noopener\" target=\"_blank\">Sargent et al.</a></li>\n<li id=\"ref-colorectal-localized-colon-cancer-ext-0bce7f634a34\"><a href=\"https://doi.org/10.1001/jama.2011.749\" rel=\"noopener\" target=\"_blank\">Biagi et al.</a></li>\n<li id=\"ref-colorectal-localized-colon-cancer-t-x-act\"><a class=\"trial-link\" href=\"/evidence/#t-x-act\">X-ACT</a>. <a href=\"https://drive.google.com/file/d/1Nfgunl6adiVY1x ertel-int-0035\"><a class=\"trial-link\" href=\"/evidence/#t-moertel-int-0035\">Moertel (INT-0035)</a>. <a href=\"https://drive.google.com/file/d/10Rb75VO57KeszN6Tjamh40v0gperXszm/preview\">N Engl J Med 1990;322:352-358</a>; <a href=\"https://pubmed.ncbi.nlm.nih.gov/7847642/\">Ann Intern Med 1995;122:321-326</a></li>\n<li id=\"ref-colorectal-localized-colon-cancer-ext-5ecddbb647cf\"><a href=\"https://doi.org/10.1200/JCO.23.01326\" rel=\"noopener\" target=\"_blank\">ACCENT/IDEA pooled analysis</a></li>\n<li id=\"ref-colorectal-localized-colon-cancer-t-idea-collaboration\"><a class=\"trial-link\" href=\"/evidence/#t-idea-collaboration\">IDEA Collaboration</a>. <a href=\"https://drive.google.com/file/d/1RPRet0zdyApXo4EBEj-31Ln9YJYlaezD/preview\">N Engl J Med 2018;378:1177-1188</a>; <a href=\"https://drive.google.com/file/d/1FLlhf1Nm7BHSLnmdFq3zp9cbjDc2-uyo/preview\">Lancet Oncol 2020;21:1620-1629</a></li>\n<li id=\"ref-colorectal-localized-colon-cancer-ext-3b0bd0cb7476\"><a href=\"https://doi.org/10.1200/JCO.19.01960\" rel=\"noopener\" target=\"_blank\">Delattre et al.</a></li>\n<li id=\"ref-colorectal-localized-colon-cancer-ext-57e07c7bc308\"><a href=\"https://doi.org/10.1200/JCO.21.02962\" rel=\"noopener\" target=\"_blank\">KCSG CO09-07</a></li>\n<li id=\"ref-colorectal-localized-colon-cancer-t-asco-guideline-baxter-et-al\"><a class=\"trial-link\" href=\"/evidence/#t-asco-guideline-baxter-et-al\">ASCO Guideline (Baxter et al.)</a>. <a href=\"https://drive.google.com/file/d/1aTcP3zGbwDJHG57m8jVe8e3ezqkMF0kZ/preview\">J Clin Oncol 2022;40:892-910</a></li>\n<li id=\"ref-colorectal-localized-colon-cancer-t-idea-collaboration-stage-ii\"><a class=\"trial-link\" href=\"/evidence/#t-idea-collaboration-stage-ii\">IDEA Collaboration (Stage II)</a>. <a href=\"https://drive.google.com/file/d/15JedInC_Ze1julN49OsWr-pAJJQwlkyu/preview\">J Clin Oncol 2021;39:631-641</a></li>\n<li id=\"ref-colorectal-localized-colon-cancer-ext-ba9c2bce70e7\"><a href=\"https://doi.org/10.1097/DCR.000 olon-cancer-t-foxtrot\"><a class=\"trial-link\" href=\"/evidence/#t-foxtrot\">FOxTROT</a>. <a href=\"https://drive.google.com/file/d/1pVlPwYiYMbsdS30fxKVO8TmuireAmvzn/preview\">J Clin Oncol 2023;41:1541-1552</a></li>\n<li id=\"ref-colorectal-localized-colon-cancer-ext-28c68217460b\"><a href=\"https://doi.org/10.1200/JCO.23.01889\" rel=\"noopener\" target=\"_blank\">OPTICAL</a></li>\n<li id=\"ref-colorectal-localized-colon-cancer-t-neocol\"><a class=\"trial-link\" href=\"/evidence/#t-neocol\">NeoCol</a>. <a href=\"https://drive.google.com/file/d/1909JNEEzzHDQbeycfZ3eS8EqwJ5KDLOs/preview\">JAMA Surg 2026;161:450-458</a></li>\n<li id=\"ref-colorectal-localized-colon-cancer-t-dynamic\"><a class=\"trial-link\" href=\"/evidence/#t-dynamic\">DYNAMIC</a>. <a href=\"https://drive.google.com/file/d/1ZCz8Z22j4MjihE86CF_wznqsSsevVE1b/preview\">N Engl J Med 2022;386:2261-2272</a>; <a href=\"https://pubmed.ncbi.nlm.nih.gov/40055522/\">Nat Med 2025;31:1509-1518</a></li>\n<li id=\"ref-colorectal-localized-colon-cancer-ext-5444edd361f5\"><a href=\"https://doi.org/10.1038/s41591-025-03579-w\" rel=\"noopener\" target=\"_blank\">five-year update</a></li>\n<li id=\"ref-colorectal-localized-colon-cancer-t-dynamic-iii-agitg-cctg\"><a class=\"trial-link\" href=\"/evidence/#t-dynamic-iii-agitg-cctg\">DYNAMIC-III (AGITG/CCTG)</a>. <a href=\"https://drive.google.com/file/d/1wecvH9Kn2lA0q-DPdvtzucX_8HUjOvLg/preview\">Nat Med 2025;31:4291-4300</a></li>\n<li id=\"ref-colorectal-localized-colon-cancer-t-galaxy-circulate-japan\"><a class=\"trial-link\" href=\"/evidence/#t-galaxy-circulate-japan\">GALAXY (CIRCULATE-Japan)</a>. <a href=\"https://drive.google.com/file/d/13SPgHrv1hqu7ApPPeMRFc5MVLZF8AznH/preview\">Nat Med 2023;29:127-134</a>; <a href=\"https://drive.google.com/file/d/1dhjK4mDjWBFjtNbEsbY2TmF7A01pnIuN/preview\">Nat Med 2024;30:3272-3283</a></li>\n<li id=\"ref-colorectal-localized-colon-cancer-t-altair-epoc1905-circulate-japan\"><a class=\"trial-link\" href=\"/evidence/#t-altair-epoc1905-circulate-japan\">ALTAIR (EPOC1905, CIRCULATE-Japan)</a>. <a href=\"https://drive.google.com/file/d/19HJJUPb81LKiIEqHOqsDaDvGtFVD0GWK/preview\">Nat Med 2026;32:2473-2480</a></li>\n<li id=\"ref-colorectal-localized-colon-cancer-ext-255f31b1a41b\"><a href=\"https://doi.org/10.1200/JCO.2010.28.9314\" rel=\"noopener\" target=\"_blank\">Sargent et al. 2010</a></li>\n<li id=\"ref-colorectal-localized-colon-cancer-ext-c189028303ea\"><a href=\"https://doi.org/10.1200/JCO.2010.30.1366\" rel=\"noopener\" target=\"_blank\">Hutchins et al.</a></li>\n<li id=\"ref-colorectal-localized-colon-cancer-ext-39fcbd4f0269\"><a href=\"https://doi.org/10.1158/1078-0432.CCR-12-0605\" rel=\"noopener\" target=\"_blank\">C-07 biomarker analysis</a></li>\n<li id=\"ref-colorectal-localized-colon-cancer-t-atomic-a021502\"><a class=\"trial-link\" href=\"/evidence/#t-atomic-a021502\">ATOMIC (A021502)</a>. <a href=\"https://drive.google.com/file/d/1xZaNpvkVc7lx91xL8rAaxnANeQkK-E01/preview\">N Engl J Med 2026;394:1155-1166</a></li>\n<li id=\"ref-colorectal-localized-colon-cancer-t-niche-2\"><a class=\"trial-link\" href=\"/evidence/#t-niche-2\">NICHE-2</a>. <a href=\"https://drive.google.com/file/d/1oVet9rorNcyWqveB7IIU_59hjs5fMzHy/preview\">N Engl J Med 2024</a></li>\n<li id=\"ref-colorectal-localized-colon-cancer-ext-bcd8c87a7ef4\"><a href=\"https://doi.org/10.1038/s41591-024-03250-w\" rel=\"noopener\" target=\"_blank\">NICHE-3</a></li>\n<li id=\"ref-colorectal-localized-colon-cancer-ext-f1dfea6d6f5a\"><a href=\"https://doi.org/10.1200/JCO-25-02169\" rel=\"noopener\" target=\"_blank\">IMHOTEP</a></li>\n<li id=\"ref-colorectal-localized-colon-cancer-t-challenge\"><a class=\"trial-link\" href=\"/evidence/#t-challenge\">CHALLENGE</a>. <a href=\"https://drive.google.com/file/d/1yj_qjmXE0CgS5uZVK_rT8HZRQLpahxQK/preview\">N Engl J Med 2025;393:13-25</a></li>\n<li id=\"ref-colorectal-localized-colon-cancer-t-alascca\"><a class=\"trial-link\" href=\"/evidence/#t-alascca\">ALASCCA</a>. <a href=\"https://drive.google.com/file/d/1DhPNHMchj4sE30OSQlwk0XSp64sEWPvd/preview\">N Engl J Med 2025;393:1051-1064</a></li>\n<li id=\"ref-colorectal-localized-colon-cancer-ext-3ae388525862\"><a href=\"https://doi.org/10.1016/S2468-1253%2824%2900387-X\" rel=\"noopener\" target=\"_blank\">ASCOLT</a></li>\n<li id=\"ref-colorectal-localized-colon-cancer-ext-a118e63ced23\"><a href=\"https://doi.org/10.1016/S0140-6736%2820%2930366-4\" rel=\"noopener\" target=\"_blank\">CAPP2</a></li>\n<li id=\"ref-colorectal-localized-colon-cancer-ext-bf3f048425aa\"><a href=\"https://doi.org/10.1200/JCO.2013.50.7442\" rel=\"noopener\" target=\"_blank\">Meyerhardt et al.</a></li>\n<li id=\"ref-colorectal-localized-colon-cancer-ext-23575b5b597f\"><a href=\"https://www.nice.org.uk/guidance/ng151/chapter/Recommendations#follow-up-after-curative-resection\" rel=\"noopener\" target=\"_blank\">NICE NG151</a></li>\n</ol>", "_hay": "early colon cancer localized-colon-cancer colorectal stage and establish resectability plan postoperative therapy choose a stage iii regimen select 3 or 6 months for stage iii disease decide whether stage ii disease needs chemotherapy avoid adjuvant targeted therapy outside a biomarker-defined indication use perioperative chemotherapy selectively use ctdna as a prognostic marker, not a routine escalation mandate treat dmmr/msi-h disease differently adjuvant chemotherapy adjuvant chemoimmunotherapy neoadjuvant immunotherapy add evidence-based interventions after chemotherapy structured exercise aspirin surveillance after curative treatment references"}, {"id": "colorectal-early-rectal-cancer", "slug": "early-rectal-cancer", "group": "Colorectal", "title": "Early rectal cancer", "updated": "", "sections": [{"id": "s-define-anatomy-risk-and-treatment-intent", "h": "Define anatomy, risk and treatment intent", "depth": 2}, {"id": "s-complete-staging-before-treatment", "h": "Complete staging before treatment", "depth": 3}, {"id": "s-preserve-function-without-compromising-the-resection-plane", "h": "Preserve function without compromising the resection plane", "depth": 3}, {"id": "s-use-current-practice-anchors", "h": "Use current practice anchors", "depth": 3}, {"id": "s-use-postoperative-chemotherapy-selectively", "h": "Use postoperative chemotherapy selectively", "depth": 2}, {"id": "s-understand-the-historical-postoperative-evidence", "h": "Understand the historical postoperative evidence", "depth": 3}, {"id": "s-use-a-fluoropyrimidine-if-postoperative-chemoradiation-is-required", "h": "Use a fluoropyrimidine if postoperative chemoradiation is required", "depth": 3}, {"id": "s-select-folfox-after-preoperative-chemoradiation", "h": "Select FOLFOX after preoperative chemoradiation", "depth": 3}, {"id": "s-prefer-preoperative-when-pelvic-chemoradiation-is-required", "h": "Prefer preoperative when pelvic chemoradiation is required", "depth": 2}, {"id": "s-establish-the-preoperative-approach", "h": "Establish the preoperative approach", "depth": 3}, {"id": "s-match-short-or-long-course-treatment-to-the-objective", "h": "Match short- or long-course treatment to the objective", "depth": 3}, {"id": "s-report-treatment-response-with-the-current-pathology-scale", "h": "Report treatment response with the current pathology scale", "depth": 3}, {"id": "s-do-not-routinely-add-concurrent-oxaliplatin", "h": "Do not routinely add concurrent oxaliplatin", "depth": 3}, {"id": "s-use-total-neoadjuvant-therapy-for-selected-disease", "h": "Use total neoadjuvant therapy for selected disease", "depth": 2}, {"id": "s-use-induction-mfolfirinox-for-a-fit-locally-advanced-population", "h": "Use induction mFOLFIRINOX for a fit, locally advanced population", "depth": 3}, {"id": "s-use-short-course-tnt-with-attention-to-local-control", "h": "Use short-course TNT with attention to local control", "depth": 3}, {"id": "s-use-the-three-year-stellar-non-inferiority-result-at-its-tested-scope", "h": "Use the three-year STELLAR non-inferiority result at its tested scope", "depth": 3}, {"id": "s-prefer-consolidation-sequencing-when-organ-preservation-is-the-objective", "h": "Prefer consolidation sequencing when organ preservation is the objective", "depth": 3}, {"id": "s-keep-polish-ii-as-historical-high-risk-tnt-evidence", "h": "Keep Polish II as historical high-risk TNT evidence", "depth": 3}, {"id": "s-omit-pelvic-radiation-only-in-a-selected-population", "h": "Omit pelvic radiation only in a selected population", "depth": 2}, {"id": "s-use-response-directed-mfolfox-within-prospect-eligibility", "h": "Use response-directed mFOLFOX within PROSPECT eligibility", "depth": 3}, {"id": "s-do-not-generalise-chemotherapy-only-evidence", "h": "Do not generalise chemotherapy-only evidence", "depth": 3}, {"id": "s-use-watch-and-wait-only-with-structured-salvage-capacity", "h": "Use watch-and-wait only with structured salvage capacity", "depth": 2}, {"id": "s-recognise-the-observational-foundation", "h": "Recognise the observational foundation", "depth": 3}, {"id": "s-use-consolidation-sequencing-to-increase-organ-preservation", "h": "Use consolidation sequencing to increase organ preservation", "depth": 3}, {"id": "s-follow-the-opra-protocol-when-applying-its-evidence", "h": "Follow the OPRA protocol when applying its evidence", "depth": 3}, {"id": "s-discuss-pd-1-blockade-for-dmmr-rectal-cancer", "h": "Discuss PD-1 blockade for dMMR rectal cancer", "depth": 2}, {"id": "s-define-response-with-concordant-examination-endoscopy-and-mri", "h": "Define response with concordant examination, endoscopy and MRI", "depth": 3}, {"id": "s-keep-the-single-arm-evidence-limit-explicit", "h": "Keep the single-arm evidence limit explicit", "depth": 3}, {"id": "s-adapt-treatment-to-frailty-not-age-alone", "h": "Adapt treatment to frailty, not age alone", "depth": 2}, {"id": "s-surveillance-after-curative-treatment", "h": "Surveillance after curative treatment", "depth": 2}, {"id": "s-references", "h": "References", "depth": 2}], "html": "<h2 id=\"s-define-anatomy-risk-and-treatment-intent\">Define anatomy, risk and treatment intent</h2>\n<p>Select the treatment sequence by pelvic risk, resectability and the objective of organ preservation or radiotherapy omission.</p>\n<ul><li class=\"evidence-prose\">RAPIDO high-risk evidence applies to disease with at least one specified MRI feature: cT4, cN2, extramural vascular invasion, enlarged lateral nodes or mesorectal-fascia involvement.<sup class=\"trial-ref\"><a href=\"#ref-colorectal-early-rectal-cancer-t-rapido-bahadoer\" aria-label=\"Reference 1: RAPIDO (Bahadoer)\">1</a></sup></li><li class=\"evidence-prose\">PRODIGE 23 evidence applies to cT3 disease judged to warrant preoperative chemoradiation or cT4 M0 disease in patients with performance status 0–1 and age under 76 years.<sup class=\"trial-ref\"><a href=\"#ref-colorectal-early-rectal-cancer-t-prodige-23-conroy\" aria-label=\"Reference 2: PRODIGE 23 (Conroy)\">2</a></sup></li><li class=\"evidence-prose\">STELLAR evidence applies to distal or middle cT3–cT4 or node-positive disease.<sup class=\"trial-ref\"><a href=\"#ref-colorectal-early-rectal-cancer-t-stellar-jin\" aria-label=\"Reference 3: STELLAR (Jin)\">3</a></sup></li><li class=\"evidence-prose\">Radiotherapy omission: restrict response-directed omission to patients who meet the PROSPECT surgical and radiological criteria.<sup class=\"trial-ref\"><a href=\"#ref-colorectal-early-rectal-cancer-t-prospect-alliance-n1048\" aria-label=\"Reference 4: PROSPECT (Alliance N1048)\">4</a></sup></li><li class=\"evidence-prose\">Organ preservation: offer watch-and-wait only after a clinical complete or near-complete response, with structured reassessment and access to prompt salvage surgery.<sup class=\"trial-ref\"><a href=\"#ref-colorectal-early-rectal-cancer-t-opra-garcia-aguilar\" aria-label=\"Reference 5: OPRA (Garcia-Aguilar)\">5</a></sup></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">dMMR disease: ASCO recommends immunotherapy for MSI-H/dMMR locally advanced rectal cancer, but rates the evidence quality as low.</span><span class=\"evidence-detail\">Preserve the single-arm maturity, response-assessment, surveillance and salvage caveats below.<sup class=\"trial-ref\"><a href=\"#ref-colorectal-early-rectal-cancer-t-dostarlimab-cercek\" aria-label=\"Reference 6: Dostarlimab (Cercek)\">6</a></sup></span></li></ul>\n<h3 id=\"s-complete-staging-before-treatment\">Complete staging before treatment</h3>\n<ul><li class=\"evidence-prose\">Confirm histology and examine the whole colon when feasible; record the baseline CEA.</li><li class=\"evidence-prose\">Use CT of the chest and abdomen for distant staging.</li><li class=\"evidence-prose\"><span class=\"evidence-lead\">Use a dedicated high-resolution pelvic MRI for local staging.</span><span class=\"evidence-detail\">Report tumour height from the anal verge, sphincter relationship, pelvic nodes, mesorectal fascia, extramural vascular invasion and tumour deposits.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">Digital rectal examination adds fixation, height and sphincter information.</span><span class=\"evidence-detail\">Endorectal ultrasound can clarify selected early T1 versus T2 lesions when MRI is equivocal; it does not replace MRI for locally advanced disease.</span></li></ul>\n<p>Test MSI/MMR before treatment. The 2024 ASCO locally advanced rectal guideline<sup class=\"trial-ref\"><a href=\"#ref-colorectal-early-rectal-cancer-ext-f8264fededf1\" aria-label=\"Reference 7: ASCO locally advanced rectal guideline\">7</a></sup> makes MSI/MMR testing, dedicated pelvic MRI and structured synoptic reporting explicit prerequisites for treatment selection.</p>\n<p>This chapter owns the rectal-treatment consequence of MSI-H/dMMR. Use the molecular chapter for assay interpretation, tumour biology and hereditary assessment.</p>\n<h3 id=\"s-preserve-function-without-compromising-the-resection-plane\">Preserve function without compromising the resection plane</h3>\n<p>Surgery
