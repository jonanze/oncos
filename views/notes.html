vanced-disease-ext-406605233e19\"><a href=\"https://pubmed.ncbi.nlm.nih.gov/20351327/\" rel=\"noopener\" target=\"_blank\">Individual-patient-data chemoradiation meta-analysis</a></li>\n<li id=\"ref-lung-nsclc-early-and-locally-advanced-disease-ext-24792170f203\"><a href=\"https://pubmed.ncbi.nlm.nih.gov/25601342/\" rel=\"noopener\" target=\"_blank\">RTOG 0617</a></li>\n<li id=\"ref-lung-nsclc-early-and-locally-advanced-disease-t-proclaim\"><a class=\"trial-link\" href=\"/evidence/#t-proclaim\">PROCLAIM</a>. <a href=\"https://drive.google.com/file/d/1hdfiG4SVx-hecTWTKS2NiuKbtUvyZt-G/preview\">J Clin Oncol 2016;34:953-962</a></li>\n<li id=\"ref-lung-nsclc-early-and-locally-advanced-disease-t-pacific\"><a class=\"trial-link\" href=\"/evidence/#t-pacific\">PACIFIC</a>. <a href=\"https://drive.google.com/file/d/1sBzGeAg39x5duUDER-zPeUVvW6dmHcjj/preview\">N Engl J Med 2017;377:1919-1929</a>; <a href=\"https://drive.google.com/file/d/1IHUKh15ZlWAb3Oxz2UR8zJ2X1LoIqSjS/preview\">J Clin Oncol 2022;40:1301-1311</a>; <a href=\"https://drive.google.com/file/d/111WVnGSBDivc0IQ2O8iexqquRI2Axam7/preview\">N Engl J Med 2018;379:2342-2350</a></li>\n<li id=\"ref-lung-nsclc-early-and-locally-advanced-disease-t-pacific-5\"><a class=\"trial-link\" href=\"/evidence/#t-pacific-5\">PACIFIC-5</a>. <a href=\"https://drive.google.com/file/d/1H1jY7FA6eAbVeuwGgK_KjX0MGvQgAxj5/preview\">J Hematol Oncol 2025;18:111</a></li>\n<li id=\"ref-lung-nsclc-early-and-locally-advanced-disease-t-laura\"><a class=\"trial-link\" href=\"/evidence/#t-laura\">LAURA</a>. <a href=\"https://drive.google.com/file/d/1cLN4lgpNbgP2k7NTVFbyy_N6p7cMMfCG/preview\">N Engl J Med 2024;391:585-597</a>; <a href=\"https://pubmed.ncbi.nlm.nih.gov/42019226/\">Eur J Cancer 2026;240:116744</a></li>\n<li id=\"ref-lung-nsclc-early-and-locally-advanced-disease-ext-4d5ab8b180dd\"><a href=\"https://www.fda.gov/drugs/resources-information-approved-drugs/fda-approves-osimertinib-locally-advanced-unresectable-stage-iii-non-small-cell-lung-cancer\" rel=\"noopener\" target=\"_blank\">FDA osimertinib stage III approval</a></li>\n<li id=\"ref-lung-nsclc-early-and-locally-advanced-disease-ext-db9efec6d6ca\"><a href=\"https://doi.org/10.1200/JCO-25-00036\" rel=\"noopener\" target=\"_blank\">PACIFIC-2</a></li>\n<li id=\"ref-lung-nsclc-early-and-locally-advanced-disease-ext-0627a0eda1be\"><a href=\"https://doi.org/10.1038/s43018-026-01161-y\" rel=\"noopener\" target=\"_blank\">CheckMate 73L</a></li>\n<li id=\"ref-lung-nsclc-early-and-locally-advanced-disease-ext-b0ae62b17079\"><a href=\"https://pubmed.ncbi.nlm.nih.gov/31829901/\" rel=\"noopener\" target=\"_blank\">ASCO lung cancer surveillance guideline</a></li>\n</ol>", "_hay": "nsclc: early and locally advanced disease nsclc-early-and-locally-advanced-disease lung lung-cancer screening define stage, intent and resectability before choosing treatment confirm curative-intent stage before selecting local treatment establish whether the proposed operation is physiologically tolerable choose the least extensive oncologically adequate local treatment stage i: surgery is usually definitive resectable stage ii and selected stage iii: plan the entire perioperative course neoadjuvant and perioperative chemoimmunotherapy egfr- and alk-directed neoadjuvant therapy remains selective after surgery: match adjuvant therapy to pathological risk and genotype platinum chemotherapy remains the backbone for stage ii-iii disease genotype-directed adjuvant treatment adjuvant immunotherapy is for selected oncogene-negative disease postoperative radiotherapy is not routine after r0 resection stage iii: separate potentially resectable from unresectable disease unresectable stage iii: definitive chemoradiation followed by biomarker-directed consolidation deliver concurrent chemoradiation when the patient is fit consolidate according to egfr status surveillance after curative-intent treatment references"}, {"id": "lung-nsclc-metastatic-disease", "slug": "nsclc-metastatic-disease", "group": "Lung", "title": "NSCLC: metastatic disease", "updated": "", "sections": [{"id": "s-choose-the-molecular-compartment-before-treatment", "h": "Choose the molecular compartment before treatment", "depth": 2}, {"id": "s-no-actionable-driver", "h": "No actionable driver", "depth": 2}, {"id": "s-select-first-line-by-fitness-histology-and-pd-l1", "h": "Select first line by fitness, histology and PD-L1", "depth": 3}, {"id": "s-choose-the-chemotherapy-backbone-deliberately", "h": "Choose the chemotherapy backbone deliberately", "depth": 3}, {"id": "s-treat-progression-according-to-prior-exposure", "h": "Treat progression according to prior exposure", "depth": 3}, {"id": "s-egfr-mutant-disease", "h": "EGFR-mutant disease", "depth": 2}, {"id": "s-classical-exon-19-deletion-or-l858r", "h": "Classical exon 19 deletion or L858R", "depth": 3}, {"id": "s-progression-on-osimertinib", "h": "Progression on osimertinib", "depth": 3}, {"id": "s-small-cell-transformation", "h": "Small-cell transformation", "depth": 3}, {"id": "s-exon-20-insertions-and-uncommon-sensitising-variants", "h": "Exon 20 insertions and uncommon sensitising variants", "depth": 3}, {"id": "s-alk-rearranged-disease", "h": "ALK-rearranged disease", "depth": 2}, {"id": "s-ros1-rearranged-disease", "h": "ROS1-rearranged disease", "depth": 2}, {"id": "s-her2-mutant-disease", "h": "HER2-mutant disease", "depth": 2}, {"id": "s-other-actionable-drivers", "h": "Other actionable drivers", "depth": 2}, {"id": "s-kras-g12c", "h": "KRAS G12C", "depth": 3}, {"id": "s-braf-v600e", "h": "BRAF V600E", "depth": 3}, {"id": "s-met-exon-14-skipping", "h": "MET exon 14 skipping", "depth": 3}, {"id": "s-ret-fusion", "h": "RET fusion", "depth": 3}, {"id": "s-ntrk-and-nrg1-fusions", "h": "NTRK and NRG1 fusions", "depth": 3}, {"id": "s-monitoring-during-metastatic-treatment", "h": "Monitoring during metastatic treatment", "depth": 2}, {"id": "s-references", "h": "References", "depth": 2}], "html": "<h2 id=\"s-choose-the-molecular-compartment-before-treatment\">Choose the molecular compartment before treatment</h2>\n<p>Do not start a checkpoint inhibitor until an actionable-driver result is available unless clinical urgency makes delay unsafe. Histopathology, staging, assay selection and biomarker interpretation belong in <strong>NSCLC: classification, staging and molecular features</strong>; this chapter starts after those results have assigned the patient to a treatment compartment.</p>\n<p>The first systemic choice depends on four questions:</p>\n<ul><li>Is there a targetable genomic alteration?</li><li>If no target is found, what is the PD-L1 tumour proportion score?</li><li>Is the tumour squamous or non-squamous?</li><li>Does disease burden, tempo, CNS involvement or performance status require the fastest attainable response?</li></ul>\n<p><a class=\"trial-link\" href=\"/evidence/#t-ipass\">IPASS</a> showed why genotype precedes phenotype. In clinically enriched East Asian never- or light-smokers, gefitinib improved progression-free survival overall, but the treatment interaction reversed by <em>EGFR</em> status: HR 0.48 in mutant tumours and 2.85 in wild-type tumours (interaction P&lt;0.001).</p>\n<h2 id=\"s-no-actionable-driver\">No actionable driver</h2>\n<h3 id=\"s-select-first-line-by-fitness-histology-and-pd-l1\">Select first line by fitness, histology and PD-L1</h3>\n<p>For a fit patient, chemo-immunotherapy is the default across PD-L1 strata when rapid cytoreduction is important. Checkpoint monotherapy is reasonable with high PD-L1 expression when lower early toxicity matters more than maximal response probability; no randomised trial directly compares those strategies, and indirect evidence favours chemo-immunotherapy for overall and progression-free survival at the cost of greater toxicity<sup class=\"trial-ref\"><a href=\"#ref-lung-nsclc-metastatic-disease-t-di-federico-high-pd-l1-meta-analysis\" aria-label=\"Reference 2: Di Federico high-PD-L1 meta-analysis\">2</a></sup>.</p>\n<p>For platinum-ineligible disease, atezolizumab monotherapy is an evidence-based alternative to single-agent gemcitabine or vinorelbine. IPSOS enrolled 453 patients unsuitable for platinum doublets and improved overall survival (10.3 vs 9.2 months; HR 0.78), with fewer grade 3–4 treatment-related events (16% vs 33%)<sup class=\"trial-ref\"><a href=\"#ref-lung-nsclc-metastatic-disease-ext-de3567fc2563\" aria-label=\"Reference 3: IPSOS\">3</a></sup>.</p>\n<h4>High PD-L1 expression</h4>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-keynote-024\">KEYNOTE-024</a> established pembrolizumab for PD-L1 TPS ≥50% disease without <em>EGFR</em> or <em>ALK</em>: five-year overall survival was 31.9% versus 16.3% with chemotherapy (HR 0.62).</span><span class=\"evidence-detail\">Treatment-related grade 3–5 events were 31.2% versus 53.3%.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-keynote-042\">KEYNOTE-042</a> extended pembrolizumab to TPS ≥1%, but the exploratory TPS 1–49% estimate was inconclusive (HR 0.88, 95% CI 0.75–1.04).</span><span class=\"evidence-detail\">Monotherapy is therefore most persuasive when PD-L1 is high, disease is not immediately threatening and chemotherapy avoidance has value.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-impower110\">IMpower110</a> supports atezolizumab monotherapy in SP142-high disease (overall survival 20.2 vs 13.1 months; HR 0.59).</span><span class=\"evidence-detail\">Assay definition matters: its TC3/IC3 population is not interchangeable with a TPS threshold.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-harmoni-2\">HARMONi-2</a> improved progression-free survival with ivonescimab over pembrolizumab in PD-L1 TPS ≥1% disease (11.1 vs 5.8 months; HR 0.51), but overall survival was immature and possible severe VEGF-related events were more frequent.</span><span class=\"evidence-detail\">The study was conducted in China.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-optitrop-lung05\">OptiTROP-Lung05</a> added sacituzumab tirumotecan to pembrolizumab and improved interim progression-free survival (HR 0.35; 12-month rate 62% vs 29%).</span><span class=\"evidence-detail\">Overall survival is immature, so this does not yet replace established first-line regimens.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-campass\">CAMPASS</a> improved blinded-review progression-free survival with benmelstobart–anlotinib over pembrolizumab (11.0 vs 7.1 months; HR 0.70), but overall survival was immature and severe hypertension was common.</span><span class=\"evidence-detail\">This is not a low-toxicity substitute for checkpoint monotherapy.</span></li></ul>\n<h4>Non-squamous disease</h4>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-keynote-189\">KEYNOTE-189</a> supports pembrolizumab with platinum–pemetrexed followed by pembrolizumab–pemetrexed maintenance.</span><span class=\"evidence-detail\">At five years, overall survival was 19.4% versus 11.3% with chemotherapy (HR 0.60); treatment-related grade 3–5 events were 52.3% versus 42.1%.</span></li><li class=\"evidence-prose\"><a class=\"trial-link\" href=\"/evidence/#t-impower130\">IMpower130</a> supports atezolizumab with carboplatin–nab-paclitaxel in <em>EGFR</em>/<em>ALK</em>-wild-type disease (overall survival 18.6 vs 13.9 months; HR 0.79; progression-free survival 7.0 vs 5.5 months; HR 0.64).</li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-impower132\">IMpower132</a> improved progression-free survival with atezolizumab–platinum–pemetrexed (7.6 vs 5.2 months; HR 0.60), but final overall survival was inconclusive (HR 0.86, 95% CI 0.71–1.06).</span><span class=\"evidence-detail\">It is supportive rather than defining evidence.</span></li><li class=\"evidence-prose\"><a class=\"trial-link\" href=\"/evidence/#t-rationale-304\">RATIONALE-304</a> improved progression-free survival with tislelizumab–platinum–pemetrexed (9.8 vs 7.6 months; HR 0.63), but the final, unprotected overall-survival estimate was inconclusive (21.4 vs 21.3 months; HR 0.90, 95% CI 0.63-1.28).</li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-impower150\">IMpower150</a> adds bevacizumab to atezolizumab–carboplatin–paclitaxel.</span><span class=\"evidence-detail\">In wild-type disease, overall survival was 19.5 versus 14.7 months (HR 0.80); bleeding risk, vascular comorbidity and the paclitaxel burden govern selection.</span></li></ul>\n<h4>Squamous disease</h4>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-keynote-407\">KEYNOTE-407</a> supports pembrolizumab with carboplatin–paclitaxel or nab-paclitaxel.</span><span class=\"evidence-detail\">Five-year overall survival was 18.4% versus 9.7% (HR 0.71); exploratory PD-L1 subgroup estimates had no reported interaction test.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-rationale-307\">RATIONALE-307</a> improved progression-free survival with tislelizumab plus carboplatin and either paclitaxel formulation, but final overall-survival estimates were inconclusive.</span><span class=\"evidence-detail\">Grade ≥3 treatment-related events exceeded 80% in all three arms.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-harmoni-6\">HARMONi-6</a> compared two active chemo-immunotherapy regimens in China.</span><span class=\"evidence-detail\">Ivonescimab–carboplatin–paclitaxel improved progression-free survival over tislelizumab–chemotherapy (11.1 vs 6.9 months; HR 0.60) and updated overall survival (27.9 vs 23.7 months; HR 0.66), with more grade ≥3 treatment-related toxicity (69% vs 59%).</span></li></ul>\n<h4>Dual-checkpoint strategies</h4>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-checkmate-227\">CheckMate 227</a> supports nivolumab–ipilimumab in PD-L1 TPS ≥1% disease (five-year overall survival 24% vs 14%; HR 0.77).</span><span class=\"evidence-detail\">In the descriptive TPS &lt;1% cohort, five-year survival was 19% versus 7%.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-checkmate-9la\">CheckMate 9LA</a> adds two cycles of chemotherapy to nivolumab–ipilimumab, giving early disease control without committing to prolonged cytotoxic therapy.</span><span class=\"evidence-detail\">Six-year overall survival was 16% versus 10% with four-cycle chemotherapy (HR 0.74); grade 3–4 treatment-related events were 48% versus 38% at three years.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-poseidon\">POSEIDON</a> adds a limited course of tremelimumab to durvalumab–chemotherapy.</span><span class=\"evidence-detail\">Five-year overall survival was 15.7% versus 6.8% with chemotherapy (HR 0.76); the durvalumab–chemotherapy arm without tremelimumab had an inconclusive survival estimate.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-pod1um-304\">POD1UM-304</a> supports retifanlimab with histology-based platinum chemotherapy (overall survival 18.1 vs 13.4 months; HR 0.75).</span><span class=\"evidence-detail\">It confirms the class effect but does not establish superiority over other chemo-immunotherapy options.</span></li></ul>\n<p>The POSEIDON translational analysis suggests that <em>STK11</em> and <em>KEAP1</em> alterations may enrich benefit from CTLA-4-containing therapy, but this is not a validated cross-regimen predictive test. Do not convert subgroup biology into a universal mandate; use it only as hypothesis-generating context when discussing a trial.</p>\n<h3 id=\"s-choose-the-chemotherapy-backbone-deliberately\">Choose the chemotherapy backbone deliberately</h3>\n<p>Use pemetrexed only for non-squamous disease. Platinum–pemetrexed and carboplatin–taxane are the common backbones; cisplatin causes more nephrotoxicity and emesis, whereas carboplatin causes more thrombocytopenia. The patient&#x27;s renal function, hearing, neuropathy, marrow reserve and treatment goal matter more than a default preference.</p>\n<p>After four induction cycles of cisplatin–pemetrexed with response or stable disease, <a class=\"trial-link\" href=\"/evidence/#t-paramount\">PARAMOUNT</a> showed that maintenance pemetrexed improved overall survival (13.9 vs 11.0 months; HR 0.78) and progression-free survival (4.1 vs 2.8 months; HR 0.62).</p>\n<h3 id=\"s-treat-progression-according-to-prior-exposure\">Treat progression according to prior exposure</h3>\n<p>Re-biopsy or broad plasma genotyping is useful when a new actionable mechanism would change treatment; tissue is required when histologic transformation is suspected. Otherwise choose by prior drugs, histology, residual performance status, toxicity and access. A negative plasma result is not equivalent to a negative tissue assay.</p>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-curb\">CURB</a> tested stereotactic body radiotherapy to every extracranial oligoprogressive site alongside physician-selected standard systemic therapy.</span><span class=\"evidence-detail\">The alpha-protected mixed NSCLC/breast-cancer primary analysis improved progression-free survival (7.2 vs 3.2 months; HR 0.53); the prespecified NSCLC subgroup was nominally positive (10.0 vs 2.2 months; HR 0.41), without a reported treatment-by-disease interaction. Pooled overall survival was inconclusive, and 16% had SBRT-attributed grade ≥2 toxicity.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-revel\">REVEL</a> supports ramucirumab 10 mg/kg with docetaxel 75 mg/m² every three weeks after platinum therapy (overall survival 10.5 vs 9.1 months; HR 0.86).</span><span class=\"evidence-detail\">Neutropenia, febrile neutropenia, hypertension and bleeding are the practical costs.</span></li><li class=\"evidence-prose\"><a class=\"trial-link\" href=\"/evidence/#t-east-lc\">EAST-LC</a> established oral S-1 as non-inferior to docetaxel for overall survival in an East Asian population (12.75 vs 12.52 months; HR 0.945, upper 95% CI below the 1.2 margin), with much less severe neutropenia and febrile neutropenia.</li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-rationale-303\">RATIONALE-303</a> improved overall survival with tislelizumab over docetaxel after platinum chemotherapy (16.9 vs 11.9 months; HR 0.66), with fewer grade ≥3 treatment-related events.</span><span class=\"evidence-detail\">This evidence predates routine first-line checkpoint exposure and should not be extrapolated to immune-refractory disease without qualification.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-tropion-lung01\">TROPION-Lung01</a> improved progression-free survival with datopotamab deruxtecan over docetaxel (4.4 vs 3.7 months; HR 0.75) but not overall survival (12.9 vs 11.8 months; HR 0.94).</span><span class=\"evidence-detail\">Drug-related interstitial lung disease included seven fatal events; the exploratory histology interaction prevents generalisation across squamous and non-squamous disease.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-br-21\">BR.21</a> is historical evidence that erlotinib can prolong survival over placebo in molecularly unselected pretreated NSCLC (6.7 vs 4.7 months; HR 0.70).</span><span class=\"evidence-detail\">Modern use of an EGFR TKI requires a susceptible molecular target; this row no longer defines routine salvage treatment.</span></li></ul>\n<h2 id=\"s-egfr-mutant-disease\">EGFR-mutant disease</h2>\n<h3 id=\"s-classical-exon-19-deletion-or-l858r\">Classical exon 19 deletion or L858R</h3>\n<p>Osimertinib monotherapy remains the lowest-burden first-line reference. Intensification with chemotherapy or amivantamab–lazertinib improves efficacy but changes toxicity substantially; the choice should be explicit rather than presented as one ranked ladder. Baseline CNS disease, tempo and patient preference should guide whether to intensify.</p>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-flaura\">FLAURA</a> improved progression-free survival (18.9 vs 10.2 months; HR 0.46) and overall survival (38.6 vs 31.8 months; HR 0.80) over gefitinib or erlotinib.</span><span class=\"evidence-detail\">Final grade ≥3 adverse events were 42% versus 47%.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-lux-lung-3\">LUX-Lung 3</a> is the earlier comparator for afatinib: progression-free survival improved to 11.1 versus 6.9 months over cisplatin–pemetrexed (HR 0.58).</span><span class=\"evidence-detail\">The pooled post-hoc survival advantage was confined to exon 19 deletion; L858R showed no benefit, so the two classical variants should not be treated as biologically identical.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-flaura2\">FLAURA2</a> added four cycles of platinum–pemetrexed and maintenance pemetrexed.</span><span class=\"evidence-detail\">Progression-free survival improved to 25.5 versus 16.7 months (HR 0.62) and final overall survival to 47.5 versus 37.6 months (HR 0.77), with grade ≥3 events in 70% versus 34%.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-aeneas2\">AENEAS2</a> reproduced the progression-free-survival effect with aumolertinib–chemotherapy (28.9 vs 18.9 months; HR 0.47).</span><span class=\"evidence-detail\">Overall survival is immature; grade ≥3 events were 80% versus 35%, driven by chemotherapy-associated myelosuppression.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-mariposa\">MARIPOSA</a> improved progression-free survival with amivantamab–lazertinib over osimertinib (23.7 vs 16.6 months; HR 0.70) and later overall survival (HR 0.75; three-year survival 60% vs 51%).</span><span class=\"evidence-detail\">Grade ≥3 events were 80% versus 52%, and venous thromboembolism occurred in 40% versus 11%.</span></li></ul>\n<p>Give prophylactic anticoagulation during the first four months of amivantamab–lazertinib unless contraindicated; vitamin K antagonists are not recommended for prophylaxis. Monitor for thrombosis, rash and interstitial lung disease, plan infusion-reaction prevention before the first dose, and reassess bleeding risk at each visit<sup class=\"trial-ref\"><a href=\"#ref-lung-nsclc-metastatic-disease-ext-d22c3398eb21\" aria-label=\"Reference 34: FDA lazertinib label\">34</a></sup>.</p>\n<p>For a fit patient with high-volume or rapidly threatening disease, chemotherapy intensification gives the clearest cytoreductive option. Amivantamab–lazertinib avoids platinum cytopenias but adds infusion burden, rash, oedema and thrombosis. Monotherapy remains reasonable when the marginal benefit does not justify either toxicity profile.</p>\n<p><a class=\"trial-link\" href=\"/evidence/#t-sampath-osimertinib-consolidative-rt\">Sampath (osimertinib + consolidative RT)</a> tested response-adapted radiotherapy to residual disease after 8–10 weeks of osimertinib. Median progression-free survival was 32.3 months in 42 patients, but the uncontrolled design precludes comparison with osimertinib alone; one of two pneumonitis events was grade 4.</p>\n<h3 id=\"s-progression-on-osimertinib\">Progression on osimertinib</h3>\n<p>Distinguish oligoprogression, isolated CNS progression and systemic progression. Local ablative therapy with continued TKI may prolong control in selected oligoprogression, but comparative evidence remains limited and clinical-trial enrolment is preferred. Multisite progression usually requires a new systemic strategy rather than indefinite TKI continuation<sup class=\"trial-ref\"><a href=\"#ref-lung-nsclc-metastatic-disease-ext-68ed2f2027f1\" aria-label=\"Reference 36: Pan-Asian ESMO oncogene-addicted NSCLC guideline\">36</a></sup>.</p>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-mariposa-2\">MARIPOSA-2</a> improved progression-free survival over platinum–pemetrexed with amivantamab–chemotherapy (6.3 vs 4.2 months; HR 0.48) and with the amivantamab–lazertinib triplet (8.3 vs 4.2 months; HR 0.44).</span><span class=\"evidence-detail\">The experimental arms were not compared with each other; grade ≥3 events were 72%, 92% and 48%.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-compel\">COMPEL</a> continued osimertinib with platinum–pemetrexed after extracranial progression (progression-free survival 8.4 vs 4.4 months; HR 0.43).</span><span class=\"evidence-detail\">Enrolment stopped at 98 patients and analyses were descriptive; overall survival was inconclusive.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-insight-2\">INSIGHT 2</a> matched <em>MET</em> amplification with tepotinib–osimertinib after first-line osimertinib.</span><span class=\"evidence-detail\">The single-arm combination produced a 50% response rate and median progression-free survival of 5.6 months; comparisons with the small tepotinib-alone cohort were descriptive.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-sachi\">SACHI</a> randomised savolitinib–osimertinib against chemotherapy in <em>EGFR</em>-mutant, <em>MET</em>-amplified disease.</span><span class=\"evidence-detail\">Progression-free survival improved in the third-generation-TKI-naive and intention-to-treat populations (HR 0.34 in each); overall survival was immature and inconclusive.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-harmoni-a\">HARMONi-A</a> added the PD-1×VEGF bispecific ivonescimab to platinum–pemetrexed after TKI progression in China.</span><span class=\"evidence-detail\">Final overall survival improved to 16.8 versus 14.1 months (HR 0.74), after progression-free survival improved to 7.1 versus 4.8 months (HR 0.46).</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-attlas-kcsg-lu19-04\">ATTLAS (KCSG-LU19-04)</a> added atezolizumab–bevacizumab–carboplatin–paclitaxel after relevant TKI progression.</span><span class=\"evidence-detail\">Progression-free survival improved to 8.48 versus 5.62 months (HR 0.62), but the unprotected overall-survival estimate was inconclusive (20.63 vs 20.27 months; HR 1.01, 95% CI 0.69-1.46).</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-optitrop-lung04\">OptiTROP-Lung04</a> compared sacituzumab tirumotecan with platinum–pemetrexed after EGFR-TKI progression.</span><span class=\"evidence-detail\">Progression-free survival improved to 8.3 versus 4.3 months (HR 0.49) and interim overall survival favoured the antibody–drug conjugate (HR 0.60); the study population was predominantly Chinese.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-herthena-lung02\">HERTHENA-Lung02</a> improved blinded-review progression-free survival with patritumab deruxtecan over platinum chemotherapy (5.8 vs 5.4 months; HR 0.77).</span><span class=\"evidence-detail\">Evidence remains conference-abstract level; overall survival was immature and adjudicated interstitial lung disease included two fatal cases.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-tropion-lung05\">TROPION-Lung05</a> provides single-arm data for datopotamab deruxtecan after targeted therapy and platinum.</span><span class=\"evidence-detail\">In the <em>EGFR</em>-mutant subgroup, response was 43.6% and median progression-free survival 5.8 months; drug-related interstitial lung disease occurred in 3.6%, including one fatal event.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">OptiTROP-Lung03 compared sacituzumab tirumotecan with docetaxel after an EGFR TKI and platinum in China.</span><span class=\"evidence-detail\">Progression-free survival improved to 6.9 versus 2.8 months (HR 0.30) and interim overall survival favoured the antibody–drug conjugate (HR 0.49); grade ≥3 treatment-related events were 56.0% versus 71.7%<sup class=\"trial-ref\"><a href=\"#ref-lung-nsclc-metastatic-disease-ext-b4ab12a9c2f9\" aria-label=\"Reference 46: OptiTROP-Lung03\">46</a></sup>.</span></li></ul>\n<p><a class=\"trial-link\" href=\"/evidence/#t-aura3\">AURA3</a> remains the historical model for mechanism-matched treatment after first- or second-generation TKI: in acquired T790M disease, osimertinib improved progression-free survival to 10.1 versus 4.4 months (HR 0.30), including CNS disease. It does not define sequencing after first-line osimertinib.</p>\n<p>For cytology-confirmed leptomeningeal progression after an EGFR TKI, BLOOM used osimertinib 160 mg daily and reported a 62% leptomeningeal response, 15.2-month response duration, 8.6-month progression-free survival and 11.0-month overall survival. This was a single-arm phase 1 study, so local therapy and dose escalation remain individualised<sup class=\"trial-ref\"><a href=\"#ref-lung-nsclc-metastatic-disease-ext-a53d05236566\" aria-label=\"Reference 48: BLOOM\">48</a></sup>.</p>\n<p>There is no established standard for acquired C797S. Allelic configuration is mechanistically relevant, but combined first- and third-generation EGFR inhibition is supported only by case-level evidence and should not be presented as a routine regimen. Prefer a clinical trial when available.</p>\n<h3 id=\"s-small-cell-transformation\">Small-cell transformation</h3>\n<p>The cohort supports repeat tissue biopsy at progression when transformation is suspected. It included 58 patients with EGFR-mutant NSCLC followed by small-cell or high-grade neuroendocrine transformation after EGFR-TKI exposure and 9 patients with de novo or mixed histology; all 59 patients genotyped at first small-cell evidence retained the founder EGFR mutation<sup class=\"trial-ref\"><a href=\"#ref-lung-nsclc-metastatic-disease-t-marcoux-et-al-egfr-mutant-sclc-transformation\" aria-label=\"Reference 49: Marcoux et al. (EGFR-mutant SCLC transformation)\">49</a></sup>.</p>\n<p>Among the 58 transformed cases, median time from advanced NSCLC diagnosis to transformation was 17.8 months (95% CI 14.3–26.2). The small, selected baseline-tissue subsets cannot estimate absolute transformation risk from TP53 or RB1 status.</p>\n<p>Platinum–etoposide produced an investigator-estimated response in 54% of 46 evaluable patients during pooled post-SCLC treatment; the transformed-only progression-free-survival curve began with 48 patients at risk and median progression-free survival was 3.4 months.</p>\n<p>Taxane-containing regimens produced an investigator-estimated response in 50% of 20 evaluable patients in a selected, heavily pretreated cohort; transformed-only median taxane progression-free survival was 2.7 months with 17 at risk. No response was seen among 17 checkpoint-inhibitor recipients. Treatment groups were uncontrolled and non-comparative, and assessment intervals were not standardized.</p>\n<p>CNS progression occurred in 38 of 59 patients with follow-up radiographic information after SCLC diagnosis. Pooled median overall survival was 31.5 months (95% CI 24.8–41.3) from initial metastatic lung-cancer diagnosis and 10.9 months (95% CI 8.0–13.7) from transformation or SCLC diagnosis.</p>\n<p>The study was retrospective, lacked central pathology and radiology review, used no formal RECIST measurement or confirmation, and reported no regimen-level safety table.</p>\n<h3 id=\"s-exon-20-insertions-and-uncommon-sensitising-variants\">Exon 20 insertions and uncommon sensitising variants</h3>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-papillon\">PAPILLON</a> established first-line amivantamab with carboplatin–pemetrexed for exon 20-insertion disease (progression-free survival 11.4 vs 6.7 months; HR 0.40; response 73% vs 47%).</span><span class=\"evidence-detail\">Overall survival was immature; grade ≥3 events were 75% versus 54%.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-wu-kong28\">WU-KONG28</a> established oral sunvozertinib as another first-line option (progression-free survival 10.3 vs 7.5 months; HR 0.65; response 58.9% vs 31.1%).</span><span class=\"evidence-detail\">Overall survival was immature and inconclusive at the 38.9%-mature interim analysis (29.8 vs 28.8 months; HR 0.99, 95% CI 0.70-1.40), and CNS efficacy was not established.</span></li></ul>\n<p>Use the exact variant and structural class defined in the classification chapter before selecting treatment; activity remains variant-specific and the available evidence is uneven.</p>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-achilles-torg1834\">ACHILLES/TORG1834</a> supports afatinib over platinum–pemetrexed for sensitising uncommon variants excluding exon 20 insertions and T790M (progression-free survival 10.6 vs 5.7 months; HR 0.421).</span><span class=\"evidence-detail\">Mutation-specific response estimates were exploratory without an interaction test.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-lux-lung-2-3-6-pooled-yang\">LUX-Lung 2/3/6 pooled (Yang)</a> showed that afatinib activity concentrated in point mutations and duplications (response 71.1%; progression-free survival 10.7 months), while de novo T790M and exon 20 insertions were relatively resistant.</span><span class=\"evidence-detail\">This was a post-hoc pooled analysis without formal between-group comparisons.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-kcsg-lu15-09-cho\">KCSG-LU15-09 (Cho)</a> produced a 50% response rate and median progression-free survival of 8.2 months with osimertinib.</span><span class=\"evidence-detail\">Variant-specific response estimates were exploratory and based on small denominators.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-unicorn-okuma\">UNICORN (Okuma)</a> produced a 55% response rate and median progression-free survival of 9.4 months with first-line osimertinib.</span><span class=\"evidence-detail\">It was single-arm, and interstitial lung disease occurred in 5 of 40 patients.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-chrysalis-2-cohort-c-tomasini\">CHRYSALIS-2 Cohort C (Tomasini)</a> produced a 52% response rate and median progression-free survival of 11.1 months with amivantamab–lazertinib in atypical variants.</span><span class=\"evidence-detail\">Grade ≥3 events occurred in 70% and venous thromboembolism in 30%; this remains single-arm evidence.</span></li></ul>\n<h2 id=\"s-alk-rearranged-disease\">ALK-rearranged disease</h2>\n<p>Choose a CNS-active ALK inhibitor first line. Crizotinib established targeted therapy but now serves mainly as the control that defines the gains from later agents. Choice among alectinib, brigatinib and lorlatinib should balance intracranial control against toxicity, comorbidity and access.</p>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-profile-1014\">PROFILE 1014</a> improved progression-free survival with crizotinib over platinum–pemetrexed (10.9 vs 7.0 months; HR 0.45).</span><span class=\"evidence-detail\">Final survival was inconclusive with 70% crossover.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-alex\">ALEX</a> improved progression-free survival and reduced CNS progression with alectinib.</span><span class=\"evidence-detail\">Final overall survival was not statistically different from crizotinib (81.1 vs 54.2 months; HR 0.78, 95% CI 0.56–1.08).</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-alta-1l\">ALTA-1L</a> improved blinded-review progression-free survival and intracranial response with brigatinib.</span><span class=\"evidence-detail\">Use the 90-mg seven-day lead-in before 180 mg daily; early-onset interstitial lung disease or pneumonitis occurred in 3%.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-crown\">CROWN</a> provides the longest randomised control: seven-year progression-free survival was 55% with lorlatinib versus 3% with crizotinib (HR 0.19).</span><span class=\"evidence-detail\">Hyperlipidaemia, weight gain, oedema, cognitive and mood effects require active monitoring; overall survival remains immature.</span></li></ul>\n<p>At progression, determine whether failure is isolated and locally treatable, CNS-predominant, or systemic. Repeat tissue or plasma genotyping can identify an ALK resistance mutation and help select the next inhibitor; suspected transformation requires tissue. Do not switch solely for an asymptomatic lesion that can be locally controlled.</p>\n<h2 id=\"s-ros1-rearranged-disease\">ROS1-rearranged disease</h2>\n<p>The comparative evidence is weaker than for ALK: the usable efficacy studies are single-arm. CNS penetration and the resistance profile therefore carry considerable weight. Use a ROS1 inhibitor rather than extrapolating an ALK sequence, and treat the available response estimates as non-comparative.</p>\n<ul><li class=\"evidence-prose\"><a class=\"trial-link\" href=\"/evidence/#t-profile-1001-ros1-cohort\">PROFILE 1001 (ROS1 cohort)</a> produced a 72% response rate and median progression-free survival of 19.2 months with crizotinib in 50 patients.</li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-entrectinib-integrated-alka-startrk\">Entrectinib (integrated ALKA/STARTRK)</a> produced a blinded-review response rate of 77% (41/53), 24.6-month response duration and 19.0-month progression-free survival in ROS1-inhibitor-naive disease.</span><span class=\"evidence-detail\">Among 20 patients with baseline CNS disease, intracranial response was 55%. The pooled analysis was single-arm; in the 134-patient safety set, grade 3–4 treatment-related events occurred in 34% and treatment-related discontinuation in 5%.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-trident-1\">TRIDENT-1</a> produced a 79% response rate, 34.1-month response duration and 35.7-month progression-free survival with repotrectinib in TKI-naive disease.</span><span class=\"evidence-detail\">After one prior ROS1 TKI, response was 38%; activity included G2032R and intracranial disease.</span></li></ul>\n<p>Taletrectinib is another approved ROS1 inhibitor. The FDA analysis pooled two single-arm studies: response was 90% and 85% in TKI-naive cohorts, and 52% and 62% after one ROS1 inhibitor; monitor liver tests, pulmonary symptoms, QTc, uric acid, myalgia and creatine kinase<sup class=\"trial-ref\"><a href=\"#ref-lung-nsclc-metastatic-disease-ext-0f7fd15d941c\" aria-label=\"Reference 64: FDA taletrectinib approval\">64</a></sup>.</p>\n<h2 id=\"s-her2-mutant-disease\">HER2-mutant disease</h2>\n<p>Keep HER2 mutation separate from HER2 overexpression. Current systemic evidence in NSCLC is strongest for activating tyrosine-kinase-domain mutations; IHC-defined overexpression is a different biomarker and does not inherit these results. Confirm which assay and alteration generated the result before choosing therapy.</p>\n<p>In previously treated HER2-overexpressing, mutation-negative non-squamous disease, the single-arm DESTINY-Lung01 cohorts produced response rates of 26.5% with 6.4 mg/kg and 34.1% with 5.4 mg/kg. Fatal adjudicated interstitial lung disease occurred at both doses; this signal supports further study, not extrapolation of the HER2-mutant indication<sup class=\"trial-ref\"><a href=\"#ref-lung-nsclc-metastatic-disease-ext-3e8c25cc6637\" aria-label=\"Reference 65: DESTINY-Lung01 HER2-overexpressing cohorts\">65</a></sup>.</p>\n<ul><li class=\"evidence-prose\"><a class=\"trial-link\" href=\"/evidence/#t-destiny-lung01\">DESTINY-Lung01</a> established activity for trastuzumab deruxtecan 6.4 mg/kg after prior therapy (response 55%; progression-free survival 8.2 months), but interstitial lung disease occurred in 26%, including fatal events.</li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-destiny-lung02\">DESTINY-Lung02</a> supports the 5.4-mg/kg dose: response was 49.0% versus 56.0% with 6.4 mg/kg, while grade ≥3 drug-related events were 38.6% versus 58.0% and interstitial lung disease 12.9% versus 28.0%.</span><span class=\"evidence-detail\">The study was not powered for between-dose efficacy comparison.</span></li></ul>\n<p>Monitor new respiratory symptoms promptly during trastuzumab deruxtecan. Withhold treatment for suspected interstitial lung disease and permanently discontinue for symptomatic grade ≥2 disease; also monitor full blood count and left-ventricular function. Do not rechallenge after symptomatic disease, and involve respiratory assessment early<sup class=\"trial-ref\"><a href=\"#ref-lung-nsclc-metastatic-disease-ext-9a44d48a07a8\" aria-label=\"Reference 68: FDA trastuzumab deruxtecan label\">68</a></sup>.</p>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-beamion-lung-1-zongertinib\">Beamion LUNG-1 (zongertinib)</a> produced a 71% response rate, 14.1-month response duration and 12.4-month progression-free survival after prior therapy.</span><span class=\"evidence-detail\">Drug-related grade ≥3 events were 17%, and no interstitial lung disease was reported.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-soho-01-sevabertinib\">SOHO-01 (sevabertinib)</a> produced a 64% response rate and median progression-free survival of 8.3 months after prior therapy.</span><span class=\"evidence-detail\">Grade 3 diarrhoea occurred in 23%; no interstitial lung disease or drug-related fatal event was reported.</span></li></ul>\n<h2 id=\"s-other-actionable-drivers\">Other actionable drivers</h2>\n<h3 id=\"s-kras-g12c\">KRAS G12C</h3>\n<p>Use a KRAS G12C inhibitor after standard systemic therapy. Neither available randomised trial demonstrated a survival advantage over docetaxel; selection is therefore driven by response, progression-free survival, toxicity, interactions and access. Check concomitant medicines before prescribing because clinically important interactions differ between agents.</p>\n<ul><li class=\"evidence-prose\"><a class=\"trial-link\" href=\"/evidence/#t-codebreak-200\">CodeBreaK 200</a> improved progression-free survival with sotorasib over docetaxel (5.6 vs 4.5 months; HR 0.66) but not overall survival (10.6 vs 11.3 months; HR 1.01).</li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-krystal-12-adagrasib\">KRYSTAL-12 (adagrasib)</a> improved progression-free survival with adagrasib over docetaxel (5.5 vs 3.8 months; HR 0.58) and response (32% vs 9%).</span><span class=\"evidence-detail\">Overall-survival data were not part of the accepted row.</span></li></ul>\n<h3 id=\"s-braf-v600e\">BRAF V600E</h3>\n<p><a class=\"trial-link\" href=\"/evidence/#t-dabrafenib-trametinib-brf113928\">Dabrafenib + trametinib (BRF113928)</a> supports dabrafenib–trametinib in untreated BRAF V600E disease: response was 64%, median progression-free survival 10.9 months and overall survival 24.6 months. The evidence is single-arm; fever, gastrointestinal toxicity, oedema and transaminitis require active management. Counsel before the first dose.</p>\n<p>Encorafenib 450 mg daily with binimetinib 45 mg twice daily is an approved alternative for metastatic BRAF V600E NSCLC. Its evidence is also single-arm; monitor ventricular function, ocular toxicity, blood pressure, creatine kinase and hepatic toxicity. Review interacting medicines before treatment<sup class=\"trial-ref\"><a href=\"#ref-lung-nsclc-metastatic-disease-ext-83e8706d468a\" aria-label=\"Reference 74: FDA encorafenib label\">74</a></sup>.</p>\n<h3 id=\"s-met-exon-14-skipping\">MET exon 14 skipping</h3>\n<p>Both pivotal datasets are single-arm, so line-specific differences are descriptive rather than comparative. Choose between capmatinib and tepotinib by access, prior therapy, comorbidity and toxicity rather than cross-trial response estimates. Neither dataset provides a randomised comparison between agents in this setting.</p>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-geometry-mono-1\">GEOMETRY mono-1</a> produced a 68% response rate and 12.4-month progression-free survival with capmatinib when treatment-naive, versus 41% and 5.4 months after prior treatment.</span><span class=\"evidence-detail\">The confidence intervals overlapped; oedema is the characteristic toxicity.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-vision\">VISION</a> produced a 46% response rate and median progression-free survival of 8.5 months with tepotinib.</span><span class=\"evidence-detail\">Monitor oedema, renal function and interstitial lung disease.</span></li></ul>\n<p>High-level <em>MET</em> amplification is a different biomarker. In VISION cohort B, 24 patients selected by liquid biopsy had a 41.7% response rate and 14.3-month response duration with tepotinib; the small, prematurely closed single-arm cohort is hypothesis-generating and does not establish routine MET-inhibitor treatment for amplification<sup class=\"trial-ref\"><a href=\"#ref-lung-nsclc-metastatic-disease-ext-aa8be14b201d\" aria-label=\"Reference 77: VISION cohort B\">77</a></sup>.</p>\n<p>High c-MET protein overexpression is distinct from <em>MET</em> exon 14 skipping and genomic amplification. After prior systemic therapy, telisotuzumab vedotin has accelerated approval for non-squamous, <em>EGFR</em>-wild-type disease with strong 3+ staining in at least 50% of tumour cells; this should not be extrapolated to lower expression<sup class=\"trial-ref\"><a href=\"#ref-lung-nsclc-metastatic-disease-ext-4a52f42b7fbf\" aria-label=\"Reference 78: FDA telisotuzumab vedotin approval\">78</a></sup>.</p>\n<h3 id=\"s-ret-fusion\">RET fusion</h3>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-libretto-431\">LIBRETTO-431</a> established selpercatinib over platinum–pemetrexed–pembrolizumab in the prespecified pembrolizumab-intent population (progression-free survival 24.8 vs 11.2 months; HR 0.46).</span><span class=\"evidence-detail\">Overall survival was immature; monitor liver enzymes, blood pressure, QT interval and pulmonary symptoms.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-acceleret-lung\">AcceleRET Lung</a> was terminated early for sponsor organisational and commercial reasons.</span><span class=\"evidence-detail\">Its nominal, truncated analysis reported progression-free survival of 18.7 versus 9.0 months (HR 0.59, 95% CI 0.42-0.84); the unprotected overall-survival estimate was inconclusive (not reached vs 39.8 months; HR 1.09, 95% CI 0.65-1.85), with optional crossover to pralsetinib after progression. Infection-related deaths occurred in eight patients versus none.</span></li></ul>\n<h3 id=\"s-ntrk-and-nrg1-fusions\">NTRK and NRG1 fusions</h3>\n<p>Larotrectinib is a tissue-agnostic option for an <em>NTRK</em> fusion without a known acquired resistance mutation when disease is metastatic and no satisfactory alternative exists; the adult dose is 100 mg twice daily. Confirm that the fusion is functional and clinically relevant before treatment<sup class=\"trial-ref\"><a href=\"#ref-lung-nsclc-metastatic-disease-ext-11ec1c1f0496\" aria-label=\"Reference 81: FDA larotrectinib label\">81</a></sup>.</p>\n<p>Zenocutuzumab is an accelerated-approval option for advanced <em>NRG1</em>-fusion NSCLC after progression on prior systemic therapy. The indication rests on a multicohort, single-arm study and should not be moved into first line. Confirm the fusion with an appropriate assay and discuss uncertainty about durability<sup class=\"trial-ref\"><a href=\"#ref-lung-nsclc-metastatic-disease-ext-9c4dc729ac1d\" aria-label=\"Reference 82: FDA zenocutuzumab approval\">82</a></sup>.</p>\n<h2 id=\"s-monitoring-during-metastatic-treatment\">Monitoring during metastatic treatment</h2>\n<p>Assess symptoms, performance status, weight, organ function and regimen-specific toxicity at each cycle or dispensing visit. Repeat CT of the chest and relevant metastatic sites at intervals that can alter management; an 8–12-week schedule is a practical default when another line remains available, shortened for rapidly progressive disease or a new symptom<sup class=\"trial-ref\"><a href=\"#ref-lung-nsclc-metastatic-disease-ext-68ed2f2027f1\" aria-label=\"Reference 36: Pan-Asian ESMO oncogene-addicted NSCLC guideline\">36</a></sup>.</p>\n<p>Use the same imaging modality and response framework across serial assessments. Brain MRI follows baseline CNS disease, a CNS-active regimen or new neurological symptoms; PET is not a routine serial response tool. Do not continue a regimen through unequivocal systemic progression unless a defined mixed-response or oligoprogression strategy justifies it.</p>\n<p>Monitoring should be mechanism-specific:</p>\n<ul><li>EGFR and ALK TKIs: pulmonary symptoms, liver tests, ECG and electrolytes where QT prolongation is relevant; lipids, cognition, mood and weight with lorlatinib.</li><li>Amivantamab-containing therapy: infusion reactions, rash, paronychia, oedema, albumin, thrombosis and pulmonary symptoms.</li><li>VEGF-directed therapy: blood pressure, proteinuria, bleeding, thrombosis and wound-healing risk.</li><li>Antibody–drug conjugates: pulmonary symptoms and prompt CT evaluation for suspected interstitial lung disease; blood count, ocular or mucosal toxicity according to payload and construct.</li><li>Checkpoint inhibitors: thyroid, liver and renal tests with symptom-directed evaluation for pneumonitis, colitis, hepatitis, endocrinopathy and other immune toxicity.</li></ul>\n<p>At progression, record the pattern rather than only the date: oligoprogression, isolated CNS or leptomeningeal progression, and multisite systemic progression lead to different decisions. Reassess goals, performance status, symptom burden and clinical-trial eligibility before choosing another systemic line. Do this before issuing the next prescription.</p>\n<h2 id=\"s-references\">References</h2>\n<ol class=\"refs\">\n<li id=\"ref-lung-nsclc-metastatic-disease-t-ipass\"><a class=\"trial-link\" href=\"/evidence/#t-ipass\">IPASS</a>. <a href=\"https://drive.google.com/file/d/1OVmalptGTJgJgKRKDjH_HShC_KdafO3q/preview\">N Engl J Med 2009;361:947-957</a>; <a href=\"https://pubmed.ncbi.nlm.nih.gov/21670455/\">J Clin Oncol 2011;29:2866-2874</a></li>\n<li id=\"ref-lung-nsclc-metastatic-disease-t-di-federico-high-pd-l1-meta-analysis\"><a class=\"trial-link\" href=\"/evidence/#t-di-federico-high-pd-l1-meta-analysis\">Di Federico high-PD-L1 meta-analysis</a>. <a href=\"https://drive.google.com/file/d/1YxqoiOrTOrZyPCIVyBdqS4M-0Mjqq4mV/preview\">JAMA Oncol 2026;12:753-761</a></li>\n<li id=\"ref-lung-nsclc-metastatic-disease-ext-de3567fc2563\"><a href=\"https://pubmed.ncbi.nlm.nih.gov/37423228/\" rel=\"noopener\" target=\"_blank\">IPSOS</a></li>\n<li id=\"ref-lung-nsclc-metastatic-disease-t-keynote-024\"><a class=\"trial-link\" href=\"/evidence/#t-keynote-024\">KEYNOTE-024</a>. <a href=\"https://drive.google.com/file/d/1aHXSmPo4FP3yjAQ9aEPQE30iNSJsl1eR/preview\">N Engl J Med 2016;375:1823-1833</a>; <a href=\"https://drive.google.com/file/d/1UdmrdAaQCHkhDEhLdMQ_59odsu-7bLJz/preview\">J Clin Oncol 2021;39:2339-2349</a></li>\n<li id=\"ref-lung-nsclc-metastatic-disease-t-keynote-042\"><a class=\"trial-link\" href=\"/evidence/#t-keynote-042\">KEYNOTE-042</a>. <a href=\"https://drive.google.com/file/d/1JeeOBl4lBK36RwYxJ6WgX02exf1CjeTC/preview\">Lancet 2019;393:1819-1830</a>; <a href=\"https://drive.google.com/file/d/17Mq7AR65T4NyZ886ciwKCobCxw-9Nl6z/preview\">J Clin Oncol 2023;41:1986-1991</a></li>\n<li id=\"ref-lung-nsclc-metastatic-disease-t-impower110\"><a class=\"trial-link\" href=\"/evidence/#t-impower110\">IMpower110</a>. <a href=\"https://drive.google.com/file/d/1nm
