ms.</li></ul></li></ul>\n<p>For a bevacizumab-naive patient progressing after irinotecan and a fluoropyrimidine, E3200<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-ext-37b1b34ac67f\" aria-label=\"Reference 35: E3200\">35</a></sup> established second-line bevacizumab plus FOLFOX4:</p>\n<ul><li>The three-arm phase 3 trial randomised 829 patients to FOLFOX4 plus bevacizumab, FOLFOX4 alone or bevacizumab alone.</li><li>Adding bevacizumab improved OS (12.9 vs 10.8 months; HR 0.75), PFS (7.3 vs 4.7 months) and response (22.7% vs 8.6%) over FOLFOX4 alone.</li><li>The bevacizumab-alone arm closed early for inferior efficacy. E3200 therefore supports the combination, not bevacizumab monotherapy.</li></ul>\n<h2 id=\"s-treatment-limiting-safety-checks\">Treatment-limiting safety checks</h2>\n<h3 id=\"s-what-the-chemotherapy-components-do\">What the chemotherapy components do</h3>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\">Fluorouracil is converted to metabolites that inhibit thymidylate synthase and disrupt RNA and DNA.</span><span class=\"evidence-detail\">Leucovorin stabilises the fluorouracil metabolite–thymidylate-synthase complex; it is a biochemical modulator, not an additional cytotoxic drug<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-ext-ae52f9c06b95\" aria-label=\"Reference 36: Current fluorouracil label\">36</a></sup>.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">Capecitabine and tegafur are oral fluoropyrimidine prodrugs.</span><span class=\"evidence-detail\">S-1 combines tegafur with gimeracil, which slows fluorouracil breakdown, and oteracil, which reduces gastrointestinal activation. It is not dose-interchangeable with capecitabine<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-ext-59296f01f7f3\" aria-label=\"Reference 37: EMA Teysuno overview\">37</a></sup>.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">Oxaliplatin forms platinum-DNA crosslinks.</span><span class=\"evidence-detail\">This mechanism does not determine sequencing; efficacy, organ function and cumulative toxicity still matter<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-ext-05414d3d3e55\" aria-label=\"Reference 38: Current oxaliplatin label\">38</a></sup>.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">Irinotecan and its active metabolite SN-38 inhibit topoisomerase I.</span><span class=\"evidence-detail\">This mechanism does not substitute for regimen-specific evidence or hepatic-safety assessment<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-ext-e4d7ef650b1f\" aria-label=\"Reference 39: Current irinotecan label\">39</a></sup>.</span></li></ul>\n<h3 id=\"s-fluoropyrimidines\">Fluoropyrimidines</h3>\n<ul><li class=\"evidence-prose\">Test for DPD deficiency before intravenous fluorouracil, capecitabine or tegafur.<ul><li>Do not use these fluoropyrimidines in known complete DPD deficiency.</li><li>For partial deficiency, consider a reduced starting dose and titrate cautiously.</li><li>EMA recommends pretreatment phenotype or genotype assessment and avoidance in complete DPD deficiency<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-ext-c66d03fb747b\" aria-label=\"Reference 40: EMA DPD-testing referral\">40</a></sup>.</li><li>The current US capecitabine label advises DPYD-variant testing unless treatment cannot wait, while warning that a negative test does not eliminate risk<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-ext-3c77de18db49\" aria-label=\"Reference 41: Current capecitabine label\">41</a></sup>.</li></ul></li><li class=\"evidence-prose\">For capecitabine, reduce the dose by 25% when Cockcroft–Gault creatinine clearance is 30–50 mL/min.<ul><li>Below 30 mL/min, a dosage has not been established.</li><li>If there is no alternative, the label permits only an individualised reduced starting dose with close clinical and biochemical monitoring<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-ext-3c77de18db49\" aria-label=\"Reference 41: Current capecitabine label\">41</a></sup>.</li></ul></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">S-1 is authorised in the European Union for metastatic colorectal cancer when another fluoropyrimidine cannot be continued because of hand-foot syndrome or cardiovascular toxicity.</span><span class=\"evidence-detail\">This is a specific substitution setting, not evidence that S-1, capecitabine and UFT are generally interchangeable<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-ext-59296f01f7f3\" aria-label=\"Reference 37: EMA Teysuno overview\">37</a></sup>.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">UFT, an older oral tegafur–uracil formulation, is retained here as a historical backbone.</span><span class=\"evidence-detail\">Its availability, licensing and partner regimen vary by jurisdiction; do not infer a contemporary dose or indication from older trials<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-ext-13c13a4edcad\" aria-label=\"Reference 42: NCI Drug Dictionary\">42</a></sup>.</span></li></ul>\n<h3 id=\"s-oxaliplatin-and-irinotecan\">Oxaliplatin and irinotecan</h3>\n<ul><li>Oxaliplatin can cause acute and delayed peripheral sensory neuropathy.<ul><li>Assess symptoms before each cycle and modify or stop treatment according to severity and persistence.</li><li>Renal impairment increases unbound-platinum exposure. Follow the label&#x27;s renal-dose precautions rather than applying a regimen-independent shortcut<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-ext-05414d3d3e55\" aria-label=\"Reference 38: Current oxaliplatin label\">38</a></sup>.</li></ul></li><li>Irinotecan can cause early cholinergic diarrhoea and delayed diarrhoea that may be life-threatening, as well as severe myelosuppression.<ul><li>Consider atropine for early cholinergic symptoms unless contraindicated. Start loperamide promptly for late diarrhoea using the product-label instructions.</li><li>Treat late diarrhoea promptly and replace fluid and electrolytes.</li><li>Add antibiotics when ileus, fever or severe neutropenia occurs. Interrupt treatment and then reduce subsequent doses after severe diarrhoea.</li><li>Use caution in hepatic impairment. The label cannot recommend a dose when bilirubin exceeds 2 mg/dL because this population was not adequately studied<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-ext-e4d7ef650b1f\" aria-label=\"Reference 39: Current irinotecan label\">39</a></sup>.</li></ul></li></ul>\n<h3 id=\"s-anti-egfr-treatment\">Anti-EGFR treatment</h3>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\">Cetuximab and panitumumab bind EGFR and inhibit ligand-driven receptor signalling.</span><span class=\"evidence-detail\">Cetuximab&#x27;s IgG1 Fc can also recruit immune effector functions, but “antibody-dependent cytotoxicity” alone is an incomplete clinical mechanism and does not determine regimen choice<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-ext-c9ee206cc728\" aria-label=\"Reference 43: Current panitumumab label\">43</a></sup>.</span></li><li class=\"evidence-prose\">Panitumumab can cause severe dermatologic and soft-tissue toxicity, progressive hypomagnesaemia and infusion reactions.<ul><li>Check magnesium and calcium before treatment, periodically during treatment and for up to 8 weeks after the final dose. Replete electrolytes as needed.</li><li>Reduce the infusion rate for a mild or moderate reaction and terminate it for a severe reaction.</li><li>Withhold or discontinue for severe dermatologic toxicity according to the label<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-ext-43d8f9a34ba0\" aria-label=\"Reference 44: Current panitumumab label\">44</a></sup>.</li></ul></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">Cetuximab is a chimeric IgG1 EGFR antibody; panitumumab is a fully human IgG2 EGFR antibody.</span><span class=\"evidence-detail\">Cetuximab requires antihistamine premedication and carries a prominent infusion-reaction risk. Both require skin and electrolyte monitoring<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-ext-18404eb0e131\" aria-label=\"Reference 45: Current cetuximab label\">45</a></sup>.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">Start rash prevention with the first anti-EGFR dose rather than waiting for a severe eruption.</span><span class=\"evidence-detail\">In the phase 2 STEPP study<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-ext-95f3d3563d9e\" aria-label=\"Reference 46: STEPP study\">46</a></sup>, moisturiser, sunscreen, topical steroid and doxycycline reduced grade 2 or worse skin toxicity over 6 weeks from 62% to 29%.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">Ask about eye pain, visual change and photophobia.</span><span class=\"evidence-detail\">Withhold treatment and obtain urgent ophthalmic assessment for suspected keratitis or ulcerative keratitis; corneal perforation is a rare label-listed complication.</span></li></ul>\n<h3 id=\"s-bevacizumab\">Bevacizumab</h3>\n<ul><li>Withhold bevacizumab for at least 28 days before elective surgery and for at least 28 days after major surgery. Do not resume until adequate wound healing.</li><li>Monitor blood pressure every 2–3 weeks.<ul><li>Withhold severe hypertension that is not medically controlled.</li><li>Discontinue for hypertensive crisis or encephalopathy.</li></ul></li><li>Monitor urine protein serially.<ul><li>A dipstick result of at least 2+ requires a 24-hour collection.</li><li>Withhold at 2 g or more per 24 hours and resume below 2 g.</li><li>Nephrotic syndrome requires discontinuation<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-ext-5ee22a49d245\" aria-label=\"Reference 47: Current Avastin label\">47</a></sup>.</li></ul></li></ul>\n<h3 id=\"s-other-vegf-pathway-agents-and-refractory-oral-drugs\">Other VEGF-pathway agents and refractory oral drugs</h3>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\">Bevacizumab binds VEGF-A.</span><span class=\"evidence-detail\">Aflibercept is a soluble decoy receptor for VEGF-A, VEGF-B and placental growth factor. Ramucirumab blocks VEGFR-2. Their bleeding, hypertension, proteinuria, thrombotic, gastrointestinal-perforation and wound-healing risks overlap, but use each product&#x27;s own dose-modification rules<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-ext-831a6e131473\" aria-label=\"Reference 48: Current aflibercept label\">48</a></sup>.</span></li><li class=\"evidence-prose\">Ramucirumab also requires thyroid monitoring and its own proteinuria algorithm; do not import bevacizumab&#x27;s thresholds<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-ext-7489d0e991f2\" aria-label=\"Reference 49: Current ramucirumab label\">49</a></sup>.</li><li class=\"evidence-prose\"><span class=\"evidence-lead\">Regorafenib inhibits several kinases involved in angiogenesis, oncogenic signalling and the tumour microenvironment, including VEGFR, RAF, RET, KIT, PDGFR and FGFR.</span><span class=\"evidence-detail\">Check liver tests before and during treatment because severe and fatal hepatotoxicity can occur<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-ext-fc9c12f16e7b\" aria-label=\"Reference 50: Current regorafenib label\">50</a></sup>.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">Also anticipate hand-foot skin reaction, hypertension, diarrhoea, fatigue, mucositis and dysphonia with regorafenib.</span><span class=\"evidence-detail\">Use the ReDOS schedule below when an escalation strategy is appropriate; it does not remove the need for early review.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">Trifluridine/tipiracil combines a nucleoside metabolic inhibitor with a thymidine-phosphorylase inhibitor that increases trifluridine exposure.</span><span class=\"evidence-detail\">Check full blood counts before and during each cycle because severe myelosuppression can occur<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-ext-a68d4a27c6f3\" aria-label=\"Reference 51: Current trifluridine/tipiracil label\">51</a></sup>.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">Fruquintinib is an oral VEGFR inhibitor.</span><span class=\"evidence-detail\">Monitor for hypertension, proteinuria, hand-foot skin reaction, haemorrhage, arterial thrombosis, gastrointestinal perforation and wound-healing complications<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-ext-7135fc296a1a\" aria-label=\"Reference 52: FDA approval and prescribing summary\">52</a></sup>.</span></li></ul>\n<h2 id=\"s-treatment-after-progression\">Treatment after progression</h2>\n<h3 id=\"s-second-line-treatment\">Second-line treatment</h3>\n<p>After progression on bevacizumab-containing first-line treatment, these approaches produced modest survival gains in the corresponding trial populations:</p>\n<ul><li>Switch the cytotoxic backbone while continuing bevacizumab.<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-t-tml-ml18147\" aria-label=\"Reference 53: TML (ML18147)\">53</a></sup></li><li>Switch to FOLFIRI plus aflibercept.<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-t-velour\" aria-label=\"Reference 54: VELOUR\">54</a></sup></li><li>Switch to FOLFIRI plus ramucirumab.<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-t-raise\" aria-label=\"Reference 55: RAISE\">55</a></sup></li></ul>\n<p>Continuing VEGF-pathway inhibition after progression produces a modest survival benefit:</p>\n<ul><li>TML enrolled 820 patients whose disease progressed within 3 months after first-line bevacizumab-containing treatment.<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-t-tml-ml18147\" aria-label=\"Reference 53: TML (ML18147)\">53</a></sup><ul><li>Continuing bevacizumab with a switched chemotherapy backbone improved OS (11.2 vs 9.8 months; HR 0.81) and PFS (5.7 vs 4.1 months; HR 0.68).</li><li>Neutropenia, diarrhoea, thrombosis, bleeding and gastrointestinal perforation were numerically higher.</li></ul></li><li><a class=\"trial-link\" href=\"/evidence/#t-velour\">VELOUR</a> added aflibercept to FOLFIRI after one oxaliplatin-containing regimen.<ul><li>It improved OS (13.50 vs 12.06 months; HR 0.817), PFS (6.90 vs 4.67 months; HR 0.758) and response (19.8% vs 11.1%).</li><li>Grade 3–4 events rose to 83.5% from 62.5%.</li></ul></li><li><a class=\"trial-link\" href=\"/evidence/#t-raise\">RAISE</a> added ramucirumab to FOLFIRI after progression on bevacizumab, oxaliplatin and a fluoropyrimidine.<ul><li>OS improved to 13.3 from 11.7 months (HR 0.844) and PFS to 5.7 from 4.5 months (HR 0.793).</li><li>Grade 3 or worse events increased to 79% from 62%.</li></ul></li></ul>\n<h3 id=\"s-anti-egfr-treatment-after-first-line\">Anti-EGFR treatment after first line</h3>\n<p>For RAS wild-type disease not previously exposed to anti-EGFR treatment, cetuximab or panitumumab can be used alone or with an appropriate chemotherapy backbone. Historical trials enrolled by narrower biomarkers; apply current extended-RAS selection rather than reproducing their original eligibility rules.</p>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\">NCIC CO.17<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-ext-75ffa2a5654c\" aria-label=\"Reference 56: NCIC CO.17\">56</a></sup> randomised 572 heavily pretreated patients with EGFR-expressing tumours to cetuximab plus best supportive care or supportive care alone.</span><span class=\"evidence-detail\">Cetuximab improved OS (HR 0.77) and PFS (HR 0.68), with an 8% response rate. Subsequent analyses established that benefit was confined to KRAS wild-type disease.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">BOND<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-ext-68141e0d1575\" aria-label=\"Reference 57: BOND\">57</a></sup> randomised 329 patients with irinotecan-refractory disease to cetuximab plus irinotecan or cetuximab alone.</span><span class=\"evidence-detail\">Combination treatment increased response (23% vs 11%) and time to progression (4.1 vs 1.5 months); OS was 8.6 versus 6.9 months.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">In a later-line panitumumab trial<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-ext-a00eccccff14\" aria-label=\"Reference 58: panitumumab trial\">58</a></sup>, OS in the RAS wild-type subgroup was 10.0 versus 6.9 months with best supportive care (HR 0.70).</span><span class=\"evidence-detail\">This result does not support panitumumab for RAS-mutant disease.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">In Peeters and colleagues<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-ext-cfde93d7acc9\" aria-label=\"Reference 59: Peeters and colleagues\">59</a></sup>, second-line panitumumab plus FOLFIRI improved PFS (5.9 vs 3.9 months) and response (35% vs 10%) in wild-type KRAS disease.</span><span class=\"evidence-detail\">OS was 14.5 versus 12.5 months and did not significantly differ.</span></li></ul>\n<h3 id=\"s-anti-egfr-rechallenge\">Anti-EGFR rechallenge</h3>\n<p>Rechallenge is different from continuing anti-EGFR treatment through progression. Consider it only after prior clinical benefit, an intervening anti-EGFR-free period and plasma ctDNA that does not detect a recognised resistance alteration. A negative plasma test can be false-negative when tumour shedding is low.</p>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\">Resistant RAS and EGFR ectodomain clones decline after anti-EGFR withdrawal, with a combined estimated half-life of 4.3 months in a serial-ctDNA analysis<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-ext-219c2100cd84\" aria-label=\"Reference 60: serial-ctDNA analysis\">60</a></sup>.</span><span class=\"evidence-detail\">This provides the biological rationale; it is not, by itself, proof that rechallenge improves survival.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">CRICKET<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-ext-4a87c6b60d6e\" aria-label=\"Reference 61: CRICKET\">61</a></sup> treated 28 selected patients with cetuximab plus irinotecan.</span><span class=\"evidence-detail\">Response was 21%; median PFS was 4.0 months when baseline ctDNA was RAS wild type versus 1.9 months when a RAS mutation was detected. The analysis was small and nonrandomised.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">CHRONOS<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-ext-ae8f9a855805\" aria-label=\"Reference 62: CHRONOS\">62</a></sup> excluded 16 of 52 screened patients because ctDNA detected resistance alterations.</span><span class=\"evidence-detail\">Among 27 treated with panitumumab, response was 30% and disease control 63%. Its single-arm design supports molecular selection, not a comparative survival benefit.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">REMARRY and PURSUIT prospectively explored longitudinal ctDNA before rechallenge.</span><span class=\"evidence-detail\">Their two-timepoint patterns remain hypothesis-generating and do not validate a universal “test twice” rule<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-ext-f1808dff18a2\" aria-label=\"Reference 63: Conference report\">63</a></sup>.</span></li></ul>\n<h3 id=\"s-her2-positive-disease\">HER2-positive disease</h3>\n<ul><li>Define HER2 positivity as IHC 3+ or IHC 2+ with amplification by in-situ hybridisation.</li><li>In chemotherapy-refractory HER2-positive, RAS wild-type disease, tucatinib plus trastuzumab has documented single-arm activity.</li><li><a class=\"trial-link\" href=\"/evidence/#t-mountaineer\">MOUNTAINEER</a> treated 84 patients in its primary combination efficacy set.<ul><li>Confirmed central-review response was 38.1%, including three complete responses.</li><li>Median response duration was 12.4 months, PFS 8.2 months and OS 24.1 months.</li><li>The single-arm design does not establish a comparative effect.</li></ul></li></ul>\n<p>Other HER2-directed evidence defines important alternatives and limits:</p>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\">HERACLES<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-ext-5273214b62ac\" aria-label=\"Reference 64: HERACLES\">64</a></sup> treated 27 heavily pretreated patients with trastuzumab plus lapatinib.</span><span class=\"evidence-detail\">Response was 30% and stable disease 44%; the small single-arm study established proof of concept, not a preferred sequence.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">DESTINY-CRC01<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-ext-7199678cb104\" aria-label=\"Reference 65: DESTINY-CRC01\">65</a></sup> gave trastuzumab deruxtecan 6.4 mg/kg every 3 weeks.</span><span class=\"evidence-detail\">In 53 patients with IHC 3+ or IHC 2+/ISH-positive disease, response was 45.3%, PFS 6.9 months and OS 15.5 months. Drug-related interstitial lung disease or pneumonitis occurred in 9.3%.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">DESTINY-CRC02<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-ext-d69d4a1faa16\" aria-label=\"Reference 66: DESTINY-CRC02\">66</a></sup> supported the lower 5.4-mg/kg dose: response was 37.8% versus 27.5% with 6.4 mg/kg, and PFS was similar.</span><span class=\"evidence-detail\">Cross-dose comparisons were not powered as a superiority test.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">SWOG S1613<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-ext-3a4b824e0023\" aria-label=\"Reference 67: SWOG S1613\">67</a></sup> compared trastuzumab plus pertuzumab with cetuximab plus irinotecan in 54 patients.</span><span class=\"evidence-detail\">PFS (4.7 vs 3.7 months) and response (34.6% vs 28.0%) did not significantly differ; the study does not establish superiority.</span></li><li class=\"evidence-prose\">Tucatinib plus trastuzumab has US accelerated approval for chemotherapy-refractory RAS wild-type, HER2-positive disease<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-ext-d2b3f3b9aae8\" aria-label=\"Reference 68: FDA tucatinib approval\">68</a></sup>.</li><li class=\"evidence-prose\">Trastuzumab deruxtecan has tumour-agnostic US accelerated approval for unresectable or metastatic IHC 3+ solid tumours after prior systemic treatment when no satisfactory alternative exists<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-ext-6cbec4f1f75b\" aria-label=\"Reference 69: FDA trastuzumab-deruxtecan approval\">69</a></sup>.</li></ul>\n<p>For trastuzumab deruxtecan, investigate new cough, dyspnoea or fever promptly. Permanently discontinue for grade 2 or worse interstitial lung disease or pneumonitis<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-ext-b5aa90cbb859\" aria-label=\"Reference 70: Current Enhertu label\">70</a></sup>.</p>\n<h3 id=\"s-kras-g12c-mutant-disease\">KRAS G12C-mutant disease</h3>\n<p>For KRAS G12C-mutant disease, sotorasib 960 mg plus panitumumab is an evidence-supported option after a metastatic-disease regimen containing fluoropyrimidine, oxaliplatin and irinotecan, unless intolerance made standard refractory therapy appropriate.</p>\n<ul><li><a class=\"trial-link\" href=\"/evidence/#t-codebreak-300\">CodeBreaK 300</a> randomised 160 previously treated patients.</li><li>The three groups received sotorasib 960 mg plus panitumumab, sotorasib 240 mg plus panitumumab, or trifluridine/tipiracil or regorafenib.</li><li>The 960-mg combination improved centrally reviewed PFS over standard care (5.6 vs 2.0 months; HR 0.48).</li><li>The 240-mg comparison did not meet its prespecified criterion.</li><li>Overall survival was immature. Acneiform dermatitis and hypomagnesaemia were prominent.</li></ul>\n<p>The US FDA approved sotorasib plus panitumumab for this post-fluoropyrimidine, oxaliplatin and irinotecan setting in January 2025<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-ext-616257e683ec\" aria-label=\"Reference 71: FDA approval summary\">71</a></sup>.</p>\n<p>Adagrasib plus cetuximab is an FDA accelerated-approval alternative after fluoropyrimidine, oxaliplatin and irinotecan.</p>\n<ul><li>In the pooled KRYSTAL-1 efficacy population of 94 patients, response was 34% and median response duration 5.8 months; 31% of responses lasted at least 6 months.</li><li>The regimen is supported by nonrandomised activity, not a direct comparison with sotorasib plus panitumumab<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-ext-4b7c72508f31\" aria-label=\"Reference 72: FDA approval summary\">72</a></sup>.</li></ul>\n<h3 id=\"s-maintenance-after-induction\">Maintenance after induction</h3>\n<p>Maintenance reduces treatment burden after disease control; it is not a single universal regimen. Base the choice on the induction biologic, residual neuropathy, response, resectability, patient preference and whether a treatment-free interval is acceptable.</p>\n<p>After oxaliplatin-based induction without a biologic:</p>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\">OPTIMOX1<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-ext-ca15de05f762\" aria-label=\"Reference 73: OPTIMOX1\">73</a></sup> found similar PFS (9.0 vs 8.7 months) and OS (19.3 vs 21.2 months) for continuous FOLFOX4 versus six cycles of FOLFOX7 followed by fluorouracil/leucovorin and planned oxaliplatin reintroduction.</span><span class=\"evidence-detail\">Neuropathy was numerically lower with the stop-and-go strategy.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">OPTIMOX2<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-ext-ec7612af7999\" aria-label=\"Reference 74: OPTIMOX2\">74</a></sup> was a small, prematurely stopped comparison of fluorouracil/leucovorin maintenance with a complete chemotherapy-free interval.</span><span class=\"evidence-detail\">Maintenance prolonged disease-control duration (13.1 vs 9.2 months) and PFS (8.6 vs 6.6 months); the study was not powered to establish an OS effect.</span></li></ul>\n<p>After fluoropyrimidine, oxaliplatin and bevacizumab induction:</p>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\">CAIRO3<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-ext-3f851d7d4c88\" aria-label=\"Reference 75: CAIRO3\">75</a></sup> randomised 558 patients to capecitabine plus bevacizumab or observation.</span><span class=\"evidence-detail\">Maintenance improved PFS2 (11.7 vs 8.5 months; HR 0.67), did not worsen global quality of life and caused grade 3 hand-foot syndrome in 23%.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">AIO 0207<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-ext-740f692cef14\" aria-label=\"Reference 76: AIO 0207\">76</a></sup> compared fluoropyrimidine plus bevacizumab, bevacizumab alone and observation.</span><span class=\"evidence-detail\">Bevacizumab alone met its generous non-inferiority margin for time to strategy failure; observation did not. Rare protocol reinduction limits interpretation, and the authors preferred fluoropyrimidine plus bevacizumab.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">The randomised phase 3 Stop-and-Go study<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-ext-b28c189dcda9\" aria-label=\"Reference 77: Stop-and-Go study\">77</a></sup> supported capecitabine plus bevacizumab maintenance after six cycles of CAPOX plus bevacizumab rather than continuing oxaliplatin indefinitely.</span><span class=\"evidence-detail\">This specific schedule should not be generalised to all induction regimens.</span></li></ul>\n<p>Bevacizumab alone has inconsistent value:</p>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\">SAKK 41/06<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-ext-8988b5c841d5\" aria-label=\"Reference 78: SAKK 41/06\">78</a></sup> did not establish non-inferiority of treatment interruption to bevacizumab.</span><span class=\"evidence-detail\">Time to progression differed by 1.2 months, without a significant OS difference; the investigators judged bevacizumab-alone maintenance of little clinical value.</span></li><li class=\"evidence-prose\">PRODIGE 9<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-ext-428656acdfe9\" aria-label=\"Reference 79: PRODIGE 9\">79</a></sup> found no improvement in tumour-control duration, PFS or OS from bevacizumab during chemotherapy-free intervals after FOLFIRI plus bevacizumab.</li><li class=\"evidence-prose\"><span class=\"evidence-lead\">In MACRO<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-ext-d2b73817de15\" aria-label=\"Reference 80: MACRO\">80</a></sup>, bevacizumab alone after CAPOX plus bevacizumab did not formally establish PFS non-inferiority to continued combination treatment.</span><span class=\"evidence-detail\">Efficacy differences were not statistically significant, while cumulative capecitabine- and oxaliplatin-related toxicity fell.</span></li></ul>\n<p>After anti-EGFR-containing induction:</p>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\">VALENTINO<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-ext-2322ade26407\" aria-label=\"Reference 81: VALENTINO\">81</a></sup> found panitumumab alone inferior to fluorouracil/leucovorin plus panitumumab after FOLFOX plus panitumumab.</span><span class=\"evidence-detail\">Ten-month PFS was 49.0% versus 59.9%; grade 3 or worse toxicity was lower with panitumumab alone.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">PANAMA<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-ext-737787dd26ec\" aria-label=\"Reference 82: PANAMA\">82</a></sup> found longer PFS with fluorouracil/leucovorin plus panitumumab than with fluorouracil/leucovorin alone (8.8 vs 5.7 months; HR 0.72).</span><span class=\"evidence-detail\">OS was not significantly different.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">ERMES<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-ext-2fd14667a7d0\" aria-label=\"Reference 83: ERMES\">83</a></sup> did not establish non-inferiority of cetuximab alone after eight FOLFIRI-cetuximab cycles to continued FOLFIRI plus cetuximab.</span><span class=\"evidence-detail\">Maintenance lowered severe toxicity but shortened PFS in the modified per-protocol analysis.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">IMPROVE<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-ext-797f4270c5e6\" aria-label=\"Reference 84: IMPROVE\">84</a></sup> was a randomised, noncomparative phase 2 study of intermittent versus continuous FOLFIRI plus panitumumab.</span><span class=\"evidence-detail\">It does not prove non-inferiority.</span></li><li class=\"evidence-prose\">MACRO2<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-ext-6c6f707c1ec7\" aria-label=\"Reference 85: MACRO2\">85</a></sup> was also exploratory phase 2 evidence and cannot overturn the phase 3 ERMES result.</li></ul>\n<h3 id=\"s-older-or-frail-patients\">Older or frail patients</h3>\n<p>Do not use chronological age alone to define fitness. Use geriatric assessment to identify vulnerabilities outside routine oncology assessment and match intensity to function, organ reserve, cognition, social support, competing illness and treatment goal<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-ext-d692b369e5ed\" aria-label=\"Reference 86: ASCO geriatric-assessment guideline\">86</a></sup>.</p>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\">FOCUS2<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-ext-256361fcff38\" aria-label=\"Reference 87: FOCUS2\">87</a></sup> enrolled 459 patients considered unfit for full-dose chemotherapy and began regimens at 80% dose.</span><span class=\"evidence-detail\">Oxaliplatin did not significantly improve PFS; capecitabine did not improve quality of life and caused more grade 3 or worse toxicity than fluorouracil.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">AVEX<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-ext-243d37a017df\" aria-label=\"Reference 88: AVEX\">88</a></sup> enrolled 280 patients aged at least 70 years who were not candidates for a doublet.</span><span class=\"evidence-detail\">Capecitabine plus bevacizumab improved PFS (9.1 vs 5.1 months; HR 0.53) but increased grade 3 or worse treatment-related events (40% vs 22%).</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">PANDA<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-ext-8cd9a5df11d4\" aria-label=\"Reference 89: PANDA\">89</a></sup> was a randomised, noncomparative phase 2 trial in older patients with RAS/BRAF wild-type disease.</span><span class=\"evidence-detail\">Both FOLFOX-panitumumab and fluorouracil/leucovorin-panitumumab met their activity threshold; the less intensive regimen caused fewer grade 3 or worse chemotherapy adverse events. It was not an equivalence trial.</span></li></ul>\n<h2 id=\"s-refractory-disease\">Refractory disease</h2>\n<h3 id=\"s-trifluridine-tipiracil-plus-bevacizumab\">Trifluridine/tipiracil plus bevacizumab</h3>\n<ul><li class=\"evidence-prose\"><a class=\"trial-link\" href=\"/evidence/#t-recourse\">RECOURSE</a> established trifluridine/tipiracil over placebo after at least two standard regimens.<ul><li>Median OS improved to 7.1 from 5.3 months (HR 0.68).</li><li>PFS was 2.0 versus 1.7 months, response 1.6% versus 0.4% and disease control 44% versus 16%.</li><li>Grade 3 or worse neutropenia occurred in 38%, febrile neutropenia in 4%, and one treatment-related septic death occurred.</li></ul></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">TERRA<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-ext-b029713e82eb\" aria-label=\"Reference 91: TERRA\">91</a></sup> confirmed trifluridine/tipiracil activity in 406 Asian patients.</span><span class=\"evidence-detail\">OS was 7.8 versus 7.1 months, PFS 2.0 versus 1.8 months and disease control 44% versus 15%. The smaller absolute OS difference does not negate RECOURSE but shows population-level variation.</span></li><li class=\"evidence-prose\"><a class=\"trial-link\" href=\"/evidence/#t-sunlight\">SUNLIGHT</a> tested bevacizumab plus trifluridine/tipiracil after no more than two prior advanced-disease regimens.<ul><li>OS improved to 10.8 from 7.5 months (HR 0.61) and PFS to 5.6 from 2.4 months (HR 0.44). Response remained low at 6.1%.</li><li>Grade 3 or worse events occurred in 72.4% versus 69.5%, while serious events occurred in 24.8% versus 31.3%. No treatment-related deaths occurred.</li><li>The trial regimen used trifluridine/tipiracil 35 mg/m² twice daily on days 1–5 and 8–12, with bevacizumab 5 mg/kg on days 1 and 15 of each 28-day cycle.</li></ul></li></ul>\n<p>The BiTS study<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-ext-f4288c9c7e3d\" aria-label=\"Reference 93: BiTS study\">93</a></sup> explored a simpler biweekly trifluridine/tipiracil–bevacizumab schedule in a small, single-arm phase 1b/2 cohort. Its PFS of 4.29 months and OS of 10.86 months are hypothesis-generating; do not substitute this schedule for SUNLIGHT solely on cross-trial comparison.</p>\n<h3 id=\"s-regorafenib\">Regorafenib</h3>\n<ul><li><a class=\"trial-link\" href=\"/evidence/#t-correct\">CORRECT</a> randomised 760 heavily pretreated patients to regorafenib 160 mg daily on days 1–21 of each 28-day cycle or placebo.<ul><li>Regorafenib improved OS (6.4 vs 5.0 months; HR 0.77) and PFS (1.9 vs 1.7 months; HR 0.49).</li><li>Grade 3–4 treatment-related events occurred in 54% versus 14%.</li><li>Hand-foot skin reaction, fatigue, diarrhoea and hypertension were prominent. One fatal liver injury was compatible with treatment causation.</li></ul></li><li><a class=\"trial-link\" href=\"/evidence/#t-concur\">CONCUR</a> confirmed activity in 204 Asian patients, some of whom had not received every available biologic.<ul><li>OS improved to 8.8 from 6.3 months (HR 0.55), PFS to 3.2 from 1.7 months and disease control to 51% from 7%.</li><li>Dose interruption or reduction was required in 71%.</li></ul></li></ul>\n<p>Week-by-week regorafenib dose escalation is an alternative to starting at 160 mg daily.</p>\n<ul><li><a class=\"trial-link\" href=\"/evidence/#t-redos\">ReDOS</a> compared weekly escalation from 80 mg to 120 mg and then 160 mg with starting at 160 mg.</li><li>More evaluable patients completed two cycles and began cycle 3 with escalation (43% vs 26%).</li><li>OS (9.8 vs 6.0 months; HR 0.72, 95% CI 0.47–1.10) and PFS (2.8 vs 2.0 months; HR 0.84, 0.57–1.24) did not reach statistical significance.</li><li>Week-2 quality of life favoured escalation.</li></ul>\n<h3 id=\"s-fruquintinib\">Fruquintinib</h3>\n<p>Fruquintinib is an oral VEGF-receptor tyrosine-kinase inhibitor.</p>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\">In FRESCO<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-ext-3c6b05099237\" aria-label=\"Reference 97: FRESCO\">97</a></sup>, 416 patients in China received fruquintinib or placebo.</span><span class=\"evidence-detail\">OS was 9.3 versus 6.6 months (HR 0.65), PFS 3.71 versus 1.84 months, and response 4.7% versus 0%. Many had not received prior anti-VEGF or anti-EGFR therapy, limiting direct comparison with FRESCO-2.</span></li><li class=\"evidence-prose\"><a class=\"trial-link\" href=\"/evidence/#t-fresco-2\">FRESCO-2</a> enrolled 691 patients after fluoropyrimidine, oxaliplatin, irinotecan, anti-VEGF treatment, biomarker-appropriate anti-EGFR treatment, and prior trifluridine/tipiracil or regorafenib.</li><li class=\"evidence-prose\"><span class=\"evidence-lead\">Fruquintinib improved OS (7.4 vs 4.8 months; HR 0.66) and PFS (3.7 vs 1.8 months; HR 0.32).</span><span class=\"evidence-detail\">Response was 2%.</span></li><li class=\"evidence-prose\">Grade 3 or worse events occurred in 63% versus 50%, notably hypertension, asthenia and hand-foot syndrome.</li><li class=\"evidence-prose\">The FRESCO-2 regimen was fruquintinib 5 mg daily on days 1–21 of each 28-day cycle.<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-t-fresco-2\" aria-label=\"Reference 98: FRESCO-2\">98</a></sup></li></ul>\n<h3 id=\"s-investigational-later-line-treatment\">Investigational later-line treatment</h3>\n<p>STELLAR-303<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-ext-04a71e7aeca0\" aria-label=\"Reference 99: STELLAR-303\">99</a></sup> randomised 901 patients with non-MSI-H/dMMR disease to zanzalintinib plus atezolizumab or regorafenib.</p>\n<ul><li class=\"evidence-prose\">In the planned intention-to-treat analysis, the primary OS endpoint was 10.9 versus 9.4 months (HR 0.80).</li><li class=\"evidence-prose\">PFS was a secondary endpoint (3.7 vs 2.0 months); formal superiority cannot be claimed under the prespecified hierarchy.</li><li class=\"evidence-prose\">At the final analysis announced on 22 June 2026, the other dual primary endpoint, OS in patients without active liver metastases, was negative: 15.9 versus 12.7 months (stratified HR 0.83, 95% CI 0.66–1.05; p=0.1185)<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-ext-19e3a8219bcb\" aria-label=\"Reference 100: Official final-endpoint update\">100</a></sup>.</li><li class=\"evidence-prose\">In the all-treated safety populations, grade 3 or worse treatment-related events occurred in 268/446 (60%) versus 161/434 (37%); five versus one treatment-related deaths used the same denominators.</li><li class=\"evidence-prose\"><span class=\"evidence-lead\">The combination remains investigational.</span><span class=\"evidence-detail\">The US new-drug application is under review with a 3 December 2026 action date; regulatory review is not approval<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-ext-7de5bd4f3c42\" aria-label=\"Reference 101: Sponsor regulatory-status notice\">101</a></sup>.</span></li></ul>\n<h2 id=\"s-local-treatment-of-metastatic-disease\">Local treatment of metastatic disease</h2>\n<p>Oligometastatic disease is a distinct treatment situation in which all metastases may be eradicated.</p>\n<ul><li>The ESMO framework generally uses one to five lesions, up to two metastatic sites, a controlled primary tumour and the ability to treat every metastatic site safely.</li><li>This is a framework rather than an automatic indication.<ul><li>Disease size, number and location matter.</li><li>Technical completeness and invasiveness matter.</li><li>Performance status, frailty, comorbidity, life expectancy and patient preference matter.</li></ul></li><li>Discuss every potentially local-treatable case in a specialist multidisciplinary team and reassess during systemic treatment<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-ext-94e00143a678\" aria-label=\"Reference 1: ESMO mCRC Clinical Practice Guideline\">1</a></sup>.</li></ul>\n<h3 id=\"s-do-not-debulk-unresectable-multiorgan-disease-routinely\">Do not debulk unresectable multiorgan disease routinely</h3>\n<p>Do not add tumour debulking to chemotherapy for unresectable multiorgan disease solely to reduce macroscopic tumour burden.<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-t-orchestra\" aria-label=\"Reference 102: ORCHESTRA\">102</a></sup></p>\n<ul><li><a class=\"trial-link\" href=\"/evidence/#t-orchestra\">ORCHESTRA</a> enrolled adults with metastases in at least two organs and substantial tumour burden.</li><li>Only patients with response or stable disease after induction CAPOX or FOLFOX with or without bevacizumab were randomised.</li><li>Debulking at least 80% of metastases by surgery, radiotherapy or ablation did not improve OS (30.0 vs 27.5 months; adjusted HR 0.88) or PFS (10.5 vs 10.4 months; adjusted HR 0.83).</li><li>Serious grade 2–5 events increased to 53% from 39%, including eight grade 5 events and four deaths attributed to local treatment.</li></ul>\n<h3 id=\"s-intact-asymptomatic-primary-with-unresectable-metastases\">Intact asymptomatic primary with unresectable metastases</h3>\n<p>Do not routinely resect an asymptomatic primary tumour when metastatic disease is unresectable; randomised evidence has not established a survival advantage<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-ext-94e00143a678\" aria-label=\"Reference 1: ESMO mCRC Clinical Practice Guideline\">1</a></sup>.</p>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\">JCOG1007/iPACS<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-ext-c044d5349b3a\" aria-label=\"Reference 103: JCOG1007/iPACS\">103</a></sup> stopped early for futility after randomising patients with an asymptomatic primary and unresectable metastases.</span><span class=\"evidence-detail\">Primary resection before chemotherapy did not improve OS (25.9 vs 26.7 months; HR 1.10).</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">The pooled SYNCHRONOUS and CCRe-IV analysis<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-ext-27b410d156bd\" aria-label=\"Reference 104: SYNCHRONOUS and CCRe-IV analysis\">104</a></sup> also found no OS benefit from primary resection before systemic treatment (16.7 vs 18.6 months).</span><span class=\"evidence-detail\">These trials do not apply when bleeding, obstruction or perforation requires local control.</span></li></ul>\n<h3 id=\"s-liver-limited-and-oligometastatic-disease\">Liver-limited and oligometastatic disease</h3>\n<ul><li>For potentially curable liver metastases, offer either surgery alone or perioperative chemotherapy plus surgery.</li><li>Choose and sequence these approaches in a multidisciplinary team with medical-oncology and hepatobiliary-surgery expertise.</li><li>When perioperative chemotherapy is selected, ASCO recommends a total of 6 months across the preoperative and postoperative phases.</li><li>Larger or more numerous metastases may favour perioperative treatment, but shared decision-making must include its harms<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-ext-9f50cb16280c\" aria-label=\"Reference 21: ASCO mCRC guideline\">21</a></sup>.</li></ul>\n<p>Resectability is technical and biological, not a fixed lesion-count rule. The aim is complete removal while preserving adequate functional liver. Bilobar disease, vascular proximity, future-liver-remnant volume, extrahepatic disease, response trajectory and the feasibility of staged resection, portal-vein procedures or ablation all need specialist review<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-ext-94e00143a678\" aria-label=\"Reference 1: ESMO mCRC Clinical Practice Guideline\">1</a></sup>.</p>\n<p>The historical Fong cohort<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-ext-d788d5458eef\" aria-label=\"Reference 105: Fong cohort\">105</a></sup> reported 37% five-year and 22% ten-year survival after resection in 1,001 selected patients. Without an unresected randomised control, these outcomes show the possibility of long survival but do not measure the causal effect of surgery.</p>\n<p>Its clinical risk score used node-positive primary, disease-free interval under 12 months, more than one liver metastasis, largest metastasis over 5 cm and CEA over 200 ng/mL to estimate recurrence. It is prognostic, not an automatic rule for denying surgery.</p>\n<p>For synchronous resectable liver disease, primary-first, liver-first and simultaneous strategies are all used. Choose the sequence from primary-tumour symptoms, liver anatomy, operative risk and the need for systemic treatment; no single sequence is universally preferred<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-ext-94e00143a678\" aria-label=\"Reference 1: ESMO mCRC Clinical Practice Guideline\">1</a></sup>.</p>\n<p>Perioperative and postoperative trials do not show a consistent OS benefit:</p>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\">EORTC 40983/EPOC<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-ext-311f7bb41df2\" aria-label=\"Reference 106: EORTC 40983/EPOC\">106</a></sup> randomised 364 patients with one to four resectable liver metastases to surgery alone or six FOLFOX4 cycles before and after surgery.</span><span class=\"evidence-detail\">Perioperative treatment improved PFS in eligible and resected analyses, but long-term OS did not significantly differ.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">JCOG0603<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-ext-a523cac50717\" aria-label=\"Reference 107: JCOG0603\">107</a></sup> randomised 300 patients after liver resection to mFOLFOX6 or observation.</span><span class=\"evidence-detail\">Five-year DFS improved (49.8% vs 38.7%; HR 0.67), but five-year OS was 71.2% versus 83.1%; the trial does not establish an OS benefit.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">The phase 3 Ychou study<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-ext-ce19a606446b\" aria-label=\"Reference 108: Ychou study\">108</a></sup> after complete liver-metastasis resection found no significant DFS improvement from adding irinotecan to fluorouracil/leucovorin.</span><span class=\"evidence-detail\">This argues against routine postoperative intensification with irinotecan.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">New EPOC<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-ext-19cdb0b733db\" aria-label=\"Reference 109: New EPOC\">109</a></sup> found harm from adding cetuximab to perioperative chemotherapy for resectable KRAS wild-type liver metastases.</span><span class=\"evidence-detail\">Median OS was 55.4 versus 81.0 months (HR 1.45); do not extrapolate anti-EGFR response activity in unresectable disease into this perioperative setting.</span></li><li class=\"evidence-prose\">Thermal ablation can be considered for small unresectable colorectal liver metastases or small liver oligometastases.</li><li class=\"evidence-prose\">After systemic therapy, stereotactic body radiotherapy is a weak, low-quality-evidence option for liver oligometastases in patients who are not candidates for resection<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-ext-9f50cb16280c\" aria-label=\"Reference 21: ASCO mCRC guideline\">21</a></sup>.</li></ul>\n<p>CLOCC<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-ext-48e68ff0f2cd\" aria-label=\"Reference 110: CLOCC\">110</a></sup> was a small randomised phase 2 trial in 119 patients with fewer than ten unresectable liver metastases and no extrahepatic disease. Adding aggressive local treatment by radiofrequency ablation with or without resection to systemic treatment improved long-term OS (HR 0.58). It does not show that ablation is equivalent to resection.</p>\n<p>The older Berber series and similar nonrandomised ablation cohorts identified lesion size and number as prognostic. They are vulnerable to selection bias and should not be converted into universal cut-offs; use modern technical assessment and the randomised CLOCC boundary instead.</p>\n<p>For highly selected patients with permanently unresectable liver-only disease, transplantation is now supported by randomised evidence:</p>\n<ul><li class=\"evidence-prose\">TransMet<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-ext-16617a89dedd\" aria-label=\"Reference 111: TransMet\">111</a></sup> enrolled 94 patients aged 18–65 years with ECOG 0–1, resected BRAF-non-mutated primary disease and liver-only metastases controlled for at least 3 months after no more than three treatment lines.</li><li class=\"evidence-prose\"><span class=\"evidence-lead\">Liver transplantation plus chemotherapy improved intention-to-treat five-year OS to 56.6% from 12.6% (HR 0.37).</span><span class=\"evidence-detail\">This result depends on stringent selection, specialist transplant review and organ access; it is not a general alternative to chemotherapy.</span></li></ul>\n<h3 id=\"s-conversion-treatment-for-initially-unresectable-liver-disease\">Conversion treatment for initially unresectable liver disease</h3>\n<p>Define the technical reason for unresectability before treatment and choose a regimen whose response probability is proportionate to the chance of enabling complete local treatment. Reimage at short intervals and involve the liver team from the start; radiological disappearance does not guarantee eradication.</p>\n<ul><li class=\"evidence-prose\">For left-sided RAS/BRAF wild-type disease, an anti-EGFR doublet produces high response rates; PARADIGM, CRYSTAL and PRIME provide the disease-control evidence, while TRIPLETE shows no benefit from adding a third cytotoxic drug.</li><li class=\"evidence-prose\"><span class=\"evidence-lead\">For RAS-mutant or right-sided disease, use a bevacizumab-containing doublet or, in carefully selected fit patients, FOLFOXIRI plus bevacizumab.</span><span class=\"evidence-detail\">TRIBE, TRIBE2 and the patient-level meta-analysis quantify the benefit and toxicity.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">OLIVIA<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-ext-8a114831d626\" aria-label=\"Reference 112: OLIVIA\">112</a></sup> was a small randomised phase 2 trial confined to initially unresectable liver metastases.</span><span class=\"evidence-detail\">FOLFOXIRI plus bevacizumab produced higher response and resection rates than mFOLFOX6 plus bevacizumab, supporting specialist consideration rather than a universal triplet rule.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">VOLFI<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-ext-ee6b2ae8f216\" aria-label=\"Reference 113: VOLFI\">113</a></sup> found higher response and secondary-resection rates when panitumumab was added to FOLFOXIRI in a randomised phase 2 RAS-wild-type population.</span><span class=\"evidence-detail\">The phase 3 TRIPLETE result is the stronger guide to current backbone choice and did not support triplet over doublet chemotherapy with panitumumab.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">Stop oxaliplatin when cumulative neuropathy compromises function.</span><span class=\"evidence-detail\">Avoid unnecessarily prolonged preoperative exposure because oxaliplatin is associated with sinusoidal liver injury and irinotecan with steatohepatitis; duration must be individualised rather than inferred from a response-rate table<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-ext-532823a4f632\" aria-label=\"Reference 114: Vauthey analysis\">114</a></sup>.</span></li><li class=\"evidence-prose\">After conversion, decide between resection, ablation and combined approaches by the distribution of residual and pretreatment disease, future liver remnant and the ability to treat every original site.</li></ul>\n<h3 id=\"s-peritoneal-limited-disease\">Peritoneal-limited disease</h3>\n<ul><li class=\"evidence-prose\">Cytoreductive surgery plus systemic chemotherapy may be offered to carefully selected patients when complete macroscopic resection is feasible, there are no extraperitoneal metastases and treatment occurs in a specialised centre.</li><li class=\"evidence-prose\"><span class=\"evidence-lead\">Do not add oxaliplatin-based HIPEC routinely.</span><span class=\"evidence-detail\">ASCO concludes that harms outweigh benefits for this regimen<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-ext-9f50cb16280c\" aria-label=\"Reference 21: ASCO mCRC guideline\">21</a></sup>.</span></li></ul>\n<p>The evidence separates the value of complete cytoreduction from the value of the intraperitoneal drug:</p>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\">The historical Dutch randomised study<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-ext-9796e0b2ed16\" aria-label=\"Reference 115: Dutch randomised study\">115</a></sup> compared cytoreduction plus mitomycin-C HIPEC and systemic treatment with older fluorouracil-based systemic treatment, with or without palliative surgery.</span><span class=\"evidence-detail\">OS was 22.3 versus 12.6 months. The outdated comparator and bundled intervention prevent attribution to HIPEC alone.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">PRODIGE 7<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-ext-6b5be03f3d16\" aria-label=\"Reference 116: PRODIGE 7\">116</a></sup> randomised patients only after complete or near-complete cytoreduction.</span><span class=\"evidence-detail\">Adding short-duration high-dose oxaliplatin HIPEC did not improve OS (41.7 vs 41.2 months; HR 1.00) and increased grade 3 or worse complications 31–60 days after surgery.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">Final phase 3 CAIRO6<sup class=\"trial-ref\"><a href=\"#ref-colorectal-metastatic-colorectal-cancer-ext-57679d664c7d\" aria-label=\"Reference 117: CAIRO6\">117</a></sup> results compared perioperative systemic treatment plus CRS-HIPEC with upfront CRS-HIPEC in 351 modified-intention-to-treat patients with resectable peritoneal-only disease.</span><span class=\"evidence-detail\">OS was 44 versus 39 months (HR 0.85; p=.28).</span></li><li class=\"evidence-prose\">Among 292 patients who underwent macroscopic complete or near-complete CRS-HIPEC, major 90-day morbidity was 49/138 (36%) versus 40/154 (26%).</li></ul>\n<p>CAIRO6 does not support routine perioperative systemic treatment for every resectable peritoneal-metastasis patient. Its earlier conference subgroup suggestions are not a validated right-sided or synchronous-disease algorithm and should not override the final negative primary OS result.</p>\n<h2 id=\"s-references\">References</h2>\n<ol class=\"refs\">\n<li id=\"ref-colorectal-metastatic-colorectal-cancer-ext-94e00143a678\"><a href=\"https://doi.org/10.1016/j.annonc.2 lorectal-cancer-ext-f4288c9c7e3d\"><a href=\"https://doi.org/10.1634/theoncologist.2020-0643\" rel=\"noopener\" target=\"_blank\">BiTS study</a></li>\n<li id=\"ref-colorectal-metastatic-colorectal-cancer-t-correct\"><a class=\"trial-link\" href=\"/evidence/#t-correct\">CORRECT</a>. <a href=\"https://drive.google.com/file/d/1mvBAGrnzWmYBUKGIh4d2IaYFfrrCID4L/preview\">Lancet 2013;381:303-312</a></li>\n<li id=\"ref-colorectal-metastatic-colorectal-cancer-t-concur\"><a class=\"trial-link\" href=\"/evidence/#t-concur\">CONCUR</a>. <a href=\"https://drive.google.com/file/d/1IbNxkkE6lIJSguXzZhwNsF-ryG0f7mJH/preview\">Lancet Oncol 2015;16:619-629</a></li>\n<li id=\"ref-colorectal-metastatic-colorectal-cancer-t-redos\"><a class=\"trial-link\" href=\"/evidence/#t-redos\">ReDOS</a>. <a href=\"https://drive.google.com/file/d/1Ah1ZJbR43RTNj6vQKFqb0OqQG21d6_Tb/preview\">Lancet Oncol 2019;20:1070-1082</a></li>\n<li id=\"ref-colorectal-metastatic-colorectal-cancer-ext-3c6b05099237\"><a href=\"https://doi.org/10.1001/jama.2018.7855\" rel=\"noopener\" target=\"_blank\">FRESCO</a></li>\n<li id=\"ref-colorectal-metastatic-colorectal-cancer-t-fresco-2\"><a class=\"trial-link\" href=\"/evidence/#t-fresco-2\">FRESCO-2</a>. <a href=\"https://drive.google.com/file/d/17ysTOAkC-5DRuCrFKYsFVfP7IGGAqwFt/preview\">Lancet 2023;402:41-53</a></li>\n<li id=\"ref-colorectal-metastatic-colorectal-cancer-ext-04a71e7aeca0\"><a href=\"https://doi.org/10.1016/S0140-6736%2825%2902025-2\" rel=\"noopener\" target=\"_blank\">STELLAR-303</a></li>\n<li id=\"ref-colorectal-metastatic-colorectal-cancer-ext-19e3a8219bcb\"><a href=\"https://ir.exelixis.com/news-releases/news-release-details/exelixis-provides-update-phase-3-stellar-303-trial-evaluating\" rel=\"noopener\" target=\"_blank\">Official final-endpoint update</a></li>\n<li id=\"ref-colorectal-metastatic-colorectal-cancer-ext-7de5bd4f3c42\"><a href=\"https://exelixis.gcs-web.com/news-releases/news-release-details/exelixis-announces-us-fda-accepted-new-drug-application\" rel=\"noopener\" target=\"_blank\">Sponsor regulatory-status notice</a></li>\n<li id=\"ref-colorectal-metastatic-colorectal-cancer-t-orchestra\"><a class=\"trial-link\" href=\"/evidence/#t-orchestra\">ORCHESTRA</a>. <a href=\"https://drive.google.com/file/d/17wSCPqartD-rUY5Nw-eiMFTlZPr3HvAs/preview\">JAMA 2026;335:1311-1320</a></li>\n<li id=\"ref-colorectal-metastatic-colorectal-cancer-ext-c044d5349b3a\"><a href=\"https://doi.org/10.1200/JCO.20.02447\" rel=\"noopener\" target=\"_blank\">JCOG1007/iPACS</a></li>\n<li id=\"ref-colorectal-metastatic-colorectal-cancer-ext-27b410d156bd\"><a href=\"https://doi.org/10.1200/JCO.23.01540\" rel=\"noopener\" target=\"_blank\">SYNCHRONOUS and CCRe-IV analysis</a></li>\n<li id=\"ref-colorectal-metastatic-colorectal-cancer-ext-d788d5458eef\"><a href=\"https://doi.org/10.1097/00000658-199909000-00004\" rel=\"noopener\" target=\"_blank\">Fong cohort</a></li>\n<li id=\"ref-colorectal-metastatic-colorectal-cancer-ext-311f7bb41df2\"><a href=\"https://doi.org/10.1016/S1470-2045%2813%2970447-9\" rel=\"noopener\" target=\"_blank\">EORTC 40983/EPOC</a></li>\n<li id=\"ref-colorectal-metastatic-colorectal-cancer-ext-a523cac50717\"><a href=\"https://doi.org/10.1200/JCO.21.01032\" rel=\"noopener\" target=\"_blank\">JCOG0603</a></li>\n<li id=\"ref-colorectal-metastatic-colorectal-cancer-ext-ce19a606446b\"><a href=\"https://doi.org/10.1093/annonc/mdp236\" rel=\"noopener\" target=\"_blank\">Ychou study</a></li>\n<li id=\"ref-colorectal-metastatic-colorectal-cancer-ext-19cdb0b733db\"><a href=\"https://pubmed.ncbi.nlm.nih.gov/32014119/\" rel=\"noopener\" target=\"_blank\">New EPOC</a></li>\n<li id=\"ref-colorectal-metastatic-colorectal-cancer-ext-48e68ff0f2cd\"><a href=\"https://doi.org/10.1093/jnci/djx015\" rel=\"noopener\" target=\"_blank\">CLOCC</a></li>\n<li id=\"ref-colorectal-metastatic-colorectal-cancer-ext-16617a89dedd\"><a href=\"https://doi.org/10.1016/S0140-6736%2824%2901595-2\" rel=\"noopener\" target=\"_blank\">TransMet</a></li>\n<li id=\"ref-colorectal-metastatic-colorectal-cancer-ext-8a114831d626\"><a href=\"https://doi.org/10.1093/annonc/mdu580\" rel=\"noopener\" target=\"_blank\">OLIVIA</a></li>\n<li id=\"ref-colorectal-metastatic-colorectal-cancer-ext-ee6b2ae8f216\"><a href=\"https://doi.org/10.1200/JCO.19.01340\" rel=\"noopener\" target=\"_blank\">VOLFI</a></li>\n<li id=\"ref-colorectal-metastatic-colorectal-cancer-ext-532823a4f632\"><a href=\"https://doi.org/10.1200/JCO.2005.05.3074\" rel=\"noopener\" target=\"_blank\">Vauthey analysis</a></li>\n<li id=\"ref-colorectal-metastatic-colorectal-cancer-ext-9796e0b2ed16\"><a href=\"https://doi.org/10.1200/JCO.2003.04.187\" rel=\"noopener\" target=\"_blank\">Dutch randomised study</a></li>\n<li id=\"ref-colorectal-metastatic-colorectal-cancer-ext-6b5be03f3d16\"><a href=\"https://doi.org/10.1016/S1470-2045%2820%2930599-4\" rel=\"noopener\" target=\"_blank\">PRODIGE 7</a></li>\n<li id=\"ref-colorectal-metastatic-colorectal-cancer-ext-57679d664c7d\"><a href=\"https://doi.org/10.1016/S1470-2045%2826%2900085-9\" rel=\"noopener\" target=\"_blank\">CAIRO6</a></li>\n</ol>", "_hay": "advanced and metastatic colorectal cancer metastatic-colorectal-cancer colorectal establish treatment intent before choosing systemic therapy first-line treatment msi-h or dmmr disease braf v600e-mutant, proficient-mismatch-repair disease ras and braf wild-type disease: choose by primary-tumour side ras-mutant or otherwise non-actionable proficient-mismatch-repair disease cytotoxic backbones and sequencing adding bevacizumab treatment-limiting safety checks what the chemotherapy components do fluoropyrimidines oxaliplatin and irinotecan anti-egfr treatment bevacizumab other vegf-pathway agents and refractory oral drugs treatment after progression second-line treatment anti-egfr treatment after first line anti-egfr rechallenge her2-positive disease kras g12c-mutant disease maintenance after induction older or frail patients refractory disease trifluridine/tipiracil plus bevacizumab regorafenib fruquintinib investigational later-line treatment local treatment of metastatic disease do not debulk unresectable multiorgan disease routinely intact asymptomatic primary with unresectable metastases liver-limited and oligometastatic disease conversion treatment for initially unresectable liver disease peritoneal-limited disease references"}, {"id": "colorectal-colorectal-cancer-molecular-pathology-and-genetics", "slug": "colorectal-cancer-molecular-pathology-and-genetics", "group": "Colorectal", "title": "Colorectal cancer: molecular pathology, genetics and prognostic determinants", "updated": "", "sections": [{"id": "s-read-the-pathology-report-as-a-molecular-map", "h": "Read the pathology report as a molecular map", "depth": 2}, {"id": "s-histology-and-grade", "h": "Histology and grade", "depth": 3}, {"id": "s-immunohistochemistry", "h": "Immunohistochemistry", "depth": 3}, {"id": "s-sidedness-is-a-gradient-not-two-diseases", "h": "Sidedness is a gradient, not two diseases", "depth": 3}, {"id": "s-integrate-pathological-prognostic-determinants", "h": "Integrate pathological prognostic determinants", "depth": 2}, {"id": "s-establish-mismatch-repair-and-microsatellite-status", "h": "Establish mismatch-repair and microsatellite status", "depth": 2}, {"id": "s-interpret-ras-braf-and-her2-separately", "h": "Interpret RAS, BRAF and HER2 separately", "depth": 2}, {"id": "s-ras", "h": "RAS", "depth": 3}, {"id": "s-braf", "h": "BRAF", "depth": 3}, {"id": "s-her2", "h": "HER2", "depth": 3}, {"id": "s-use-consensus-molecular-subtype-as-a-biological-classification", "h": "Use consensus molecular subtype as a biological classification", "depth": 2}, {"id": "s-recognise-hereditary-colorectal-cancer-syndromes", "h": "Recognise hereditary colorectal cancer syndromes", "depth": 2}, {"id": "s-build-the-molecular-pathogenesis-model", "h": "Build the molecular pathogenesis model", "depth": 2}, {"id": "s-mismatch-repair-route", "h": "Mismatch-repair route", "depth": 3}, {"id": "s-serrated-cimp-route", "h": "Serrated/CIMP route", "depth": 3}, {"id": "s-chromosomal-instability-and-apc-wnt-route", "h": "Chromosomal-instability and APC/WNT route", "depth": 3}, {"id": "s-other-recurrent-abnormalities", "h": "Other recurrent abnormalities", "depth": 3}, {"id": "s-references", "h": "References", "depth": 2}], "html": "<h2 id=\"s-read-the-pathology-report-as-a-molecular-map\">Read the pathology report as a molecular map</h2>\n<p>Use the current CAP Colon and Rectum Resection protocol<sup class=\"trial-ref\"><a href=\"#ref-colorectal-colorectal-cancer-molecular-pathology-and-genetics-ext-1546bd9db8aa\" aria-label=\"Reference 1: CAP Colon and Rectum Resection protocol\">1</a></sup> and the ICCR colorectal dataset<sup class=\"trial-ref\"><a href=\"#ref-colorectal-colorectal-cancer-molecular-pathology-and-genetics-ext-cf144e01e947\" aria-label=\"Reference 2: ICCR colorectal dataset\">2</a></sup> for synoptic reporting. Record tumour site and size, perforation, histological type and grade, depth of invasion, treatment effect, lymphovascular and perineural invasion, tumour deposits, margins, lymph nodes, pTNM/ypTNM and relevant ancillary tests.</p>\n<h3 id=\"s-histology-and-grade\">Histology and grade</h3>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\">Adenocarcinoma is the dominant epithelial malignancy, accounting for about 90% of colorectal carcinomas.</span><span class=\"evidence-detail\">Neuroendocrine neoplasms, lymphomas, mesenchymal tumours and hamartomatous lesions are much less common and require their own classifications<sup class=\"trial-ref\"><a href=\"#ref-colorectal-colorectal-cancer-molecular-pathology-and-genetics-ext-1d626e3abafd\" aria-label=\"Reference 3: WHO-based histological overview\">3</a></sup>.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">Report a specific WHO type when present.</span><span class=\"evidence-detail\">Mucinous adenocarcinoma and signet-ring-cell carcinoma require more than 50% of the corresponding component; lesser components should still be described<sup class=\"trial-ref\"><a href=\"#ref-colorectal-colorectal-cancer-molecular-pathology-and-genetics-ext-31bd0ccb5869\" aria-label=\"Reference 4: ICCR tumour-type guidance\">4</a></sup>. Signet-ring carcinoma is rare, diffusely infiltrative, favours peritoneal spread and has a poor prognosis. It is enriched for MSI and can occur in Lynch syndrome, but is not specific for either<sup class=\"trial-ref\"><a href=\"#ref-colorectal-colorectal-cancer-molecular-pathology-and-genetics-ext-91600fac93ad\" aria-label=\"Reference 5: Systematic review\">5</a></sup>.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">Medullary carcinoma is a solid, lymphocyte-rich subtype strongly associated with right-sided dMMR/BRAF-mutant disease.</span><span class=\"evidence-detail\">Despite high-grade cytology, strictly defined medullary carcinoma has a relatively favourable outcome compared with conventional carcinomas of similar stage and grade<sup class=\"trial-ref\"><a href=\"#ref-colorectal-colorectal-cancer-molecular-pathology-and-genetics-ext-629cfcd7b86a\" aria-label=\"Reference 6: Clinicopathological series\">6</a></sup>.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">Use the modern two-tier grade for adenocarcinoma NOS and mucinous adenocarcinoma: low grade when gland formation is at least 50%, high grade when it is below 50%.</span><span class=\"evidence-detail\">The inherited four-tier thresholds—well differentiated above 95%, moderately differentiated 50%–95%, poorly differentiated below 50%, and undifferentiated with no glands—are descriptive history, not the preferred current WHO/ICCR reporting system.</span></li></ul>\n<h3 id=\"s-immunohistochemistry\">Immunohistochemistry</h3>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\">CK20, CDX2 and SATB2 support colorectal differentiation, but no marker is perfectly sensitive or specific.</span><span class=\"evidence-detail\">A panel and the clinical context are safer than a single stain; SATB2 plus CDX2 performs particularly well<sup class=\"trial-ref\"><a href=\"#ref-colorectal-colorectal-cancer-molecular-pathology-and-genetics-ext-3e58ad97a778\" aria-label=\"Reference 7: Diagnostic study\">7</a></sup>.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">Medullary carcinomas frequently lose CK20 and CDX2.</span><span class=\"evidence-detail\">SATB2 or CDH17 may be retained, while calretinin and occasionally CK7 can be expressed; this is a caveat against excluding colorectal origin from an unusual immunophenotype<sup class=\"trial-ref\"><a href=\"#ref-colorectal-colorectal-cancer-molecular-pathology-and-genetics-ext-ee128cc6976b\" aria-label=\"Reference 8: Medullary-marker study\">8</a></sup>.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">MMR immunohistochemistry assesses MLH1, PMS2, MSH2 and MSH6, with retained staining in non-neoplastic internal controls.</span><span class=\"evidence-detail\">Paired loss patterns localise the likely deficient complex and guide reflex testing and germline assessment; dMMR also identifies a treatment-relevant phenotype.</span></li></ul>\n<h3 id=\"s-sidedness-is-a-gradient-not-two-diseases\">Sidedness is a gradient, not two diseases</h3>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\">Right-sided cancers are classically polypoid or fungating exophytic masses; they can become bulky before obstructing and may present with occult bleeding or iron-deficiency anaemia.</span><span class=\"evidence-detail\">Left-sided cancers are more often annular or encircling “apple-core”/“napkin-ring” lesions, causing altered bowel habit or obstruction. These are tendencies, not diagnostic rules<sup class=\"trial-ref\"><a href=\"#ref-colorectal-colorectal-cancer-molecular-pathology-and-genetics-ext-0ab6737c575b\" aria-label=\"Reference 9: Clinicopathological review\">9</a></sup>.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">Right-sided tumours are enriched for MSI-H/dMMR, CIMP-high, BRAF V600E, mucinous and medullary phenotypes.</span><span class=\"evidence-detail\">Left-sided tumours are more often chromosomally unstable and TP53-altered<sup class=\"trial-ref\"><a href=\"#ref-colorectal-colorectal-cancer-molecular-pathology-and-genetics-ext-3a513ae15c76\" aria-label=\"Reference 10: TCGA\">10</a></sup>. Molecular frequencies change continuously from caecum to rectum, so a binary right/left table should not be used as a surrogate for tumour testing<sup class=\"trial-ref\"><a href=\"#ref-colorectal-colorectal-cancer-molecular-pathology-and-genetics-ext-ef08c0f1977e\" aria-label=\"Reference 11: Colorectal-continuum analysis\">11</a></sup>.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">In metastatic disease, a right-sided primary is generally associated with poorer outcome than a left-sided primary and modifies anti-EGFR treatment interpretation.</span><span class=\"evidence-detail\">The effect is treatment- and time-dependent; sidedness is prognostic context, not a molecular result<sup class=\"trial-ref\"><a href=\"#ref-colorectal-colorectal-cancer-molecular-pathology-and-genetics-ext-aa3c9e3c12a5\" aria-label=\"Reference 12: Meta-analysis\">12</a></sup>.</span></li></ul>\n<h2 id=\"s-integrate-pathological-prognostic-determinants\">Integrate pathological prognostic determinants</h2>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\">Record proximal, distal and radial/circumferential margins and, where used, residual-tumour status: R0, no residual tumour; R1, microscopic residual tumour; R2, macroscopic residual tumour.</span><span class=\"evidence-detail\">The radial margin is the surgically created non-peritonealised soft-tissue margin; in the lower rectum it surrounds the specimen. Tumour at or within 1 mm is reported as involved. In rectal cancer, involvement predicts local recurrence and poor survival; evidence in colon cancer is less extensive<sup class=\"trial-ref\"><a href=\"#ref-colorectal-colorectal-cancer-molecular-pathology-and-genetics-ext-03f313ffee5e\" aria-label=\"Reference 13: ICCR dataset\">13</a></sup>.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">Record every examined and involved regional lymph node: nodal positivity and burden are major prognostic determinants.</span><span class=\"evidence-detail\">Examine at least 12 nodes when possible; low yield weakens confidence in a node-negative stage. A tumour deposit is a discontinuous nodule in the lymph-drainage area without residual nodal, vascular or neural structure; deposits make a node-negative case pN1c, while their number is still reported when nodes are positive.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">After neoadjuvant treatment, prefix pathological stage with <code>y</code> and report tumour regression separately.</span><span class=\"evidence-detail\">Acellular mucin pools do not count as residual tumour for pT or positive-node assignment. Lymphovascular invasion, perineural invasion and an infiltrative rather than pushing border are adverse pathological features.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">Tumour budding is a single tumour cell or cluster of no more than four cells at the invasive front and is a morphological correlate of epithelial–mesenchymal transition.</span><span class=\"evidence-detail\">Count the hotspot in 0.785 mm² and report Bd1 (0–4), Bd2 (5–9) or Bd3 (at least 10)<sup class=\"trial-ref\"><a href=\"#ref-colorectal-colorectal-cancer-molecular-pathology-and-genetics-ext-f026eceaf5e8\" aria-label=\"Reference 14: ITBCC consensus\">14</a></sup>.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">Assess budding only in non-mucinous, non-signet-ring-cell adenocarcinoma areas.</span><span class=\"evidence-detail\">Do not report it in colon or rectal adenocarcinomas resected after neoadjuvant therapy. When applicable, budding is distinct from grade and predicts nodal metastasis in pT1 and recurrence in stage II disease.</span></li></ul>\n<p>For resected stage IIA (T3) colon cancer, the following pathological and presentation features contribute to recurrence-risk assessment. See Early colon cancer for adjuvant-treatment selection.<sup class=\"trial-ref\"><a href=\"#ref-colorectal-colorectal-cancer-molecular-pathology-and-genetics-t-asco-guideline-baxter-et-al\" aria-label=\"Reference 15: ASCO Guideline (Baxter et al.)\">15</a></sup></p>\n<ul><li>Fewer than 12 lymph nodes sampled.</li><li>Perineural or lymphovascular invasion.</li><li>Poorly or undifferentiated tumour grade, except that poor differentiation is not a high-risk prognostic factor in dMMR/MSI tumours.</li><li>Intestinal obstruction or tumour perforation.</li><li>Bd3 tumour budding, meaning at least 10 buds per 0.785 mm².</li></ul>\n<h2 id=\"s-establish-mismatch-repair-and-microsatellite-status\">Establish mismatch-repair and microsatellite status</h2>\n<p>MMR corrects base–base mismatches and small insertion/deletion loops. Functional loss of MLH1, PMS2, MSH2 or MSH6 produces dMMR and may create MSI-H; dMMR is a protein/function result, whereas MSI-H is a DNA phenotype. Test every colorectal cancer for MMR/MSI to screen for Lynch syndrome, inform prognosis and guide therapy<sup class=\"trial-ref\"><a href=\"#ref-colorectal-colorectal-cancer-molecular-pathology-and-genetics-ext-e0440653c428\" aria-label=\"Reference 16: CAP MMR/MSI guideline\">16</a></sup>.</p>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\">IHC and molecular testing are complementary.</span><span class=\"evidence-detail\">IHC can localise protein loss; PCR compares microsatellite lengths, and validated NGS assays infer MSI across many loci. A discordant or technically inadequate result warrants review or repeat testing rather than forced classification.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">Do not apply one universal percentage threshold.</span><span class=\"evidence-detail\">The historical Bethesda five-marker panel called MSI-H when at least two of five markers were unstable; modern mononucleotide panels and NGS assays use validated, platform-specific cut-offs. MSI-low is assay-defined and is generally managed like MSS rather than as a weak form of MSI-H<sup class=\"trial-ref\"><a href=\"#ref-colorectal-colorectal-cancer-molecular-pathology-and-genetics-ext-da43200a4d63\" aria-label=\"Reference 17: Revised Bethesda consensus\">17</a></sup>.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">Approximately 15% of colorectal cancers are dMMR/MSI-H.</span><span class=\"evidence-detail\">Most sporadic cases result from somatic MLH1-promoter methylation, often with CIMP-high/BRAF V600E biology; a minority reflect Lynch syndrome, and some unexplained cases have double-somatic MMR alterations<sup class=\"trial-ref\"><a href=\"#ref-colorectal-colorectal-cancer-molecular-pathology-and-genetics-ext-954fb158e823\" aria-label=\"Reference 18: NCI colorectal genetics PDQ\">18</a></sup>.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">Typical morphology includes proximal location, mucinous or medullary differentiation, poor gland formation, tumour-infiltrating lymphocytes and a Crohn-like peritumoural lymphoid response.</span><span class=\"evidence-detail\">These features should prompt testing but cannot replace universal MMR/MSI assessment.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">In non-metastatic disease, dMMR/MSI-H—especially stage II—is generally associated with a favourable prognosis.</span><span class=\"evidence-detail\">BRAF V600E can modify prognosis, particularly in MSS disease, so neither marker should be interpreted without stage and the other marker<sup class=\"trial-ref\"><a href=\"#ref-colorectal-colorectal-
