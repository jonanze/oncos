s-biology-and-clinical-behaviour", "h": "Biology and clinical behaviour"}, {"id": "s-staging-and-work-up", "h": "Staging and work-up"}, {"id": "s-limited-stage-disease", "h": "Limited-stage disease"}, {"id": "s-extensive-stage-disease", "h": "Extensive-stage disease"}, {"id": "s-relapsed-disease", "h": "Relapsed disease"}, {"id": "s-small-cell-transformation-of-egfr-mutant-lung-cancer", "h": "Small cell transformation of EGFR-mutant lung cancer"}, {"id": "s-references", "h": "References"}], "html": "<h2 id=\"s-biology-and-clinical-behaviour\">Biology and clinical behaviour</h2>\n<p>Small cell lung cancer is a poorly differentiated neuroendocrine tumour and accounts for approximately 15% of lung cancers. It is almost exclusively a disease of smokers. The doubling time is short and metastases develop early, so the disease is systemic at presentation in most patients even when the imaging looks confined. The recurrent genetic abnormalities are <em>TP53</em> mutation, loss of <em>RB1</em> function and <em>MYC</em> amplification. None of them is actionable: no molecular marker is recommended for treatment selection outside a clinical trial. Genotyping a newly diagnosed small cell tumour changes nothing about first-line therapy, which is the practical difference from non-small cell disease. The typical presentation is cough, breathlessness and weight loss. Disease centres on the central airways, hilum and mediastinal nodes. Haemoptysis and post-obstructive pneumonia are less common than with squamous cell carcinoma, because small cell disease grows submucosally rather than into the lumen. Paraneoplastic syndromes are part of the presentation and occasionally precede it:</p>\n<ul><li>the syndrome of inappropriate antidiuresis;</li><li>Cushing&#x27;s syndrome from ectopic ACTH;</li><li>the Lambert-Eaton myasthenic syndrome.</li></ul>\n<p>Hypercalcaemia is less likely here and is commoner in non-small cell disease.</p>\n<h2 id=\"s-staging-and-work-up\">Staging and work-up</h2>\n<p>Baseline staging is a contrast-enhanced PET-CT and an MRI brain. For clinical stage I disease (T1-2 N0), invasive mediastinal nodal staging is required before resection is offered. Limited-stage disease is defined as disease confined to the ipsilateral hemithorax and its regional nodes that can be encompassed within a safe radiotherapy field. The definition is operational rather than anatomical: the radiotherapy plan settles it, and everything else is extensive stage.</p>\n<h2 id=\"s-limited-stage-disease\">Limited-stage disease</h2>\n<h3>Stage I and the role of surgery</h3>\n<p>For stage I disease, defined as T1-2 N0 up to 5 cm without parietal pleural involvement, ESMO recommends lobectomy followed by adjuvant chemotherapy, with concurrent chemoradiation instead where nodes are involved or resection is R1 or R2. That recommendation predates the consolidation durvalumab data below. No randomised trial has compared surgery plus chemotherapy against chemoradiation alone, and none has compared surgery alone against surgery plus adjuvant chemotherapy. The evidence is retrospective throughout. In the IASLC Lung Cancer Study Project database of more than 8,000 patients, 4% of whom underwent surgery, 5-year overall survival was 48% for stage I, 39% for stage II and 15% for stage III, against 26–34% in chemoradiation trials of predominantly stage III disease. Whether those survival rates describe the surgical subgroup or the whole database is not specified, and the comparison with the chemoradiation trials holds only on the surgical reading. A propensity- and stage-matched National Cancer Database analysis of 2,089 surgical patients found a doubling of overall survival in N0 disease (38 versus 22 months), with the benefit seen in patients who had an R0 resection, and lobectomy superior to both sublobar resection and pneumonectomy. A separate National Cancer Database analysis of more than 1,500 patients with pT1-2 N0 disease reported better 5-year overall survival with adjuvant chemotherapy than with surgery alone (53% versus 40%). These are matched observational comparisons, and selection of a small-cell patient for surgery generates residual confounding, so the size of the effect should be read as an upper bound.</p>\n<h3>Chemoradiation for stage II–III disease</h3>\n<p>Concurrent chemoradiation is the standard, and it delivers 5-year overall survival of approximately 30%. The role of radiotherapy was settled by <a class=\"trial-link\" href=\"/evidence/#t-pignon-meta-analysis\">Pignon Meta-Analysis</a>, which pooled 2,140 patients from 13 randomised trials of chemotherapy with or without thoracic radiotherapy and found that adding radiotherapy reduced the risk of death by 14% (p=0.001), improving 3-year overall survival from 8.9% to 14.3% (N Engl J Med 1992;327:1618-1624). Etoposide plus cisplatin is the preferred backbone. In the Norwegian Lung Cancer Study Group trial of 436 patients, 214 with limited-stage and 222 with extensive-stage disease, etoposide–cisplatin gave superior overall survival to cyclophosphamide–epirubicin–vincristine, while a separate statement about the same trial records no significant difference between the two regimens. The two results are consistent if read as stratum-specific, favouring etoposide–cisplatin in limited-stage disease and showing no difference in extensive-stage disease; that reading is an inference rather than a reported subgroup analysis. A three-arm randomised trial comparing etoposide–cisplatin, CAV and alternating CAV/etoposide–cisplatin found higher response rates with the etoposide-containing arms and similar overall survival (78%, 55% and 76% respectively; median overall survival 9.9, 9.9 and 11.8 months; JNCI 1991). A second three-arm trial, in 437 treatment-naive patients with extensive-stage disease, reached the same conclusion with the arms in that same order (median overall survival 8.6, 8.3 and 8.1 months; response rates 61%, 51% and 59%; JCO 1992). Etoposide–cisplatin displaced the anthracycline regimens on toxicity rather than on efficacy: it produces less myelosuppression and less pulmonary toxicity, and it is far easier to combine with thoracic radiotherapy.</p>\n<ul><li>The standard schedule is cisplatin 60–80 mg/m² on day 1 with etoposide 100–120 mg/m² on days 1–3 every three weeks, with dose reduction avoided in the first two cycles in particular.</li><li>Split-dose cisplatin at 25 mg/m² on days 1–3 is better tolerated and reduces the hydration requirement.</li><li>Carboplatin may be substituted to avoid nausea, ototoxicity, neuropathy and nephrotoxicity, at the cost of more myelosuppression.</li></ul>\n<h3>Radiotherapy dose, schedule and timing</h3>\n<p>Twice-daily radiotherapy is the reference schedule. <a class=\"trial-link\" href=\"/evidence/#t-int-0096-turrisi\">INT-0096 (Turrisi)</a> randomised 417 patients receiving concurrent cisplatin–etoposide to 45 Gy in 30 twice-daily fractions over three weeks or 45 Gy in 25 once-daily fractions over five weeks; the accelerated schedule improved median overall survival (23 versus 19 months) and 5-year overall survival (26% versus 16%; N Engl J Med 1999;340:265-271). <a class=\"trial-link\" href=\"/evidence/#t-convert\">CONVERT</a> then tested whether a higher once-daily dose could match it. In 547 patients with good performance status receiving concurrent cisplatin–etoposide, 66 Gy in 33 once-daily fractions was not superior to 45 Gy in 30 twice-daily fractions (median overall survival 25 versus 30 months; 2-year overall survival 51% versus 56%; p=0.33), with similar toxicity in both arms and lower than expected overall (Lancet Oncol 2017;18:1116-1125). The trial was designed to show superiority of the once-daily schedule and did not, so twice-daily 45 Gy remains the preferred standard and once-daily 66 Gy an acceptable alternative where twice-daily delivery is impractical. It did not establish equivalence, and the point estimates run the other way. Radiotherapy should start with cycle 1 or 2 of chemotherapy. Concurrent delivery is preferred to sequential: JCOG 9104 randomised 231 patients to etoposide–cisplatin with sequential or concurrent thoracic radiotherapy and found a numerically longer median overall survival with concurrent treatment that was not statistically significant (27 versus 20 months), at the cost of more severe oesophagitis. Two meta-analyses found no overall survival difference between starting radiotherapy within 30 days of chemotherapy and starting later, with more haematological, oesophageal and cardiac toxicity in the early group. In an individual-patient-data meta-analysis, the subgroup of trials in which chemotherapy was delivered without dose reduction or delay did favour earlier, shorter radiotherapy (HR 0.79, 95% CI 0.69 to 0.91; Ann Oncol 2016). No interaction test is reported, so that is a gradient rather than a demonstrated effect modification. The benefit of early radiotherapy appears to depend on the chemotherapy being delivered on time alongside it. Where performance status or the dose to organs at risk will not permit that, radiotherapy can be postponed to the third chemotherapy cycle, and sequential chemoradiation remains an option for patients who cannot tolerate concurrent treatment because of performance status, comorbidity or disease volume.</p>\n<h3>Consolidation durvalumab</h3>\n<p><a class=\"trial-link\" href=\"/evidence/#t-adriatic\">ADRIATIC</a> changed the standard. It randomised 730 patients with limited-stage disease and no progression after concurrent platinum-based chemoradiotherapy to consolidation durvalumab 1500 mg every four weeks, durvalumab plus tremelimumab, or placebo, each continued to progression, toxicity or 24 months. Durvalumab improved overall survival (median 55.9 versus 33.4 months; HR 0.73; p=0.01) and progression-free survival (16.6 versus 9.2 months; HR 0.76; p=0.02), with no excess of grade 3 or 4 toxicity (24.4% versus 24.2%; N Engl J Med 2024;391:1313-1327). It is the first immunotherapy to change practice in limited-stage disease, and the durvalumab–tremelimumab arm remains blinded. Pneumonitis was reported in 38.2% versus 30.2%, with no grade breakdown given, against grade 3 or 4 events of any cause in 24.4% versus 24.2%. The gain is 22 months of median overall survival for up to two years of a drug most patients tolerate. ACHILES, a randomised phase 2 trial of one year of atezolizumab versus observation after chemoradiation, improved neither progression-free nor overall survival. The class effect is not established, and durvalumab is what should be prescribed.</p>\n<h3>Prophylactic cranial irradiation</h3>\n<p><a class=\"trial-link\" href=\"/evidence/#t-pci-overview-collaborative-group-aup-rin\">PCI Overview Collaborative Group (Aupérin)</a> pooled individual patient data on 987 patients from seven randomised trials of prophylactic cranial irradiation versus none, all in complete remission after induction chemotherapy with or without thoracic radiotherapy. Irradiation reduced the risk of death (pooled relative risk 0.84, 95% CI 0.73 to 0.97; p=0.01) and raised 3-year survival from 15.3% to 20.7% (N Engl J Med 1999;341:476-484). It reduced the 3-year cumulative incidence of brain metastasis from 58.6% to 33.3% (relative risk 0.46, 95% CI 0.38 to 0.57; p&lt;0.001). Four qualifications apply to those figures.</p>\n<ul><li>The 20.7% and the 33.3% are calculated from the pooled relative risk and the control-group rate assuming proportional hazards, not read off the Kaplan-Meier curves.</li><li>Overall survival was the sole alpha-protected endpoint, so the brain metastasis result and every subgroup analysis carry nominal p-values only.</li><li>The population was 86% limited-stage (847 of 987) and the two arms were imbalanced for stage, with extensive disease in 12% of the irradiated group against 17% of controls (p=0.02), an imbalance driven by one component trial and no longer significant after adjustment for trial; although the authors&#x27; conclusion is not restricted by stage and the stage interaction was not significant (p=0.62), the 140 extensive-stage patients do not by themselves establish benefit there.</li><li>The neurotoxicity question was not answered: only two of the seven trials performed neuropsychological testing, 24% to 60% of the 350 patients assessed were already abnormal before enrolment, and while repeated testing over the first years showed no difference between arms, the authors say longer follow-up is needed.</li></ul>\n<p>Dose affects the risk of brain metastasis; on the evidence it does not affect survival. The modal regimen was 24 Gy in 8 fractions, and the risk of brain metastasis fell as dose rose across the trials (p for trend 0.02), while the effect on survival did not differ by dose (interaction p=0.89). The current practice dose is 25 Gy in 10 fractions. In subgroup analysis, the benefit was seen in the 755 men (relative risk 0.77) and not in the 232 women (relative risk 1.05; p=0.07 for the comparison), which the authors themselves ask to be read with caution as a subgroup finding with between-trial heterogeneity. Patients with performance status 0–1 who have responded to chemoradiation should therefore be offered prophylactic cranial irradiation, though the pooled evidence above comes from patients in complete remission rather than from responders generally. It should not be offered where increasing age, neurocognitive comorbidity or poor performance status raise the neurotoxicity risk. Its role is less well defined in stage I–II disease, where the risk of brain metastasis is lower, and in patients over 70 or who are frail; there, shared decision-making and surveillance MRI are the alternative.</p>\n<h2 id=\"s-extensive-stage-disease\">Extensive-stage disease</h2>\n<h3>The chemotherapy backbone</h3>\n<p>First-line treatment is a platinum doublet, in practice carboplatin AUC 5 on day 1 with etoposide 100 mg/m² on days 1–3 every three weeks. Etoposide is a topoisomerase II inhibitor cleared by the liver and is 94–98% protein bound, so the dose should be reduced in hypoalbuminaemia. Cisplatin and carboplatin are interchangeable here. A meta-analysis of four randomised trials in 663 patients receiving first-line treatment, of whom 32% had limited-stage disease, found no difference between cisplatin-based and carboplatin-based therapy in overall survival (9.6 versus 9.4 months; p=0.37), progression-free survival (5.5 versus 5.3 months; p=0.25) or response rate (67.1% versus 66.0%; p=0.83), with more haematological toxicity from carboplatin and more non-haematological toxicity from cisplatin (JCO 2012). Irinotecan is active in this setting. <a class=\"trial-link\" href=\"/evidence/#t-jcog9511-noda\">JCOG9511 (Noda)</a> randomised 154 untreated patients to irinotecan–cisplatin or etoposide–cisplatin and was closed early at interim for a substantial survival difference (median overall survival 12.8 versus 9.4 months, p=0.002; 2-year overall survival 19.5% versus 5.2%; N Engl J Med 2002;346:85-91). The result was not reproduced in Western populations, notably in SWOG S0124, which limits irinotecan–cisplatin to Japanese practice. Data for carboplatin–irinotecan against carboplatin–etoposide are similarly conflicting, and in limited-stage disease JCOG0202 found no overall survival difference between the two doublets.</p>\n<h3>Adding a checkpoint inhibitor</h3>\n<p>Chemo-immunotherapy is the standard first line, established by two trials with near-identical designs. <a class=\"trial-link\" href=\"/evidence/#t-impower133\">IMpower133</a> randomised 403 untreated patients to carboplatin–etoposide with atezolizumab or placebo for four cycles followed by maintenance, and atezolizumab improved overall survival (median 12.3 versus 10.3 months; HR 0.70; p=0.007) and progression-free survival (5.2 versus 4.3 months; HR 0.77; N Engl J Med 2018;379:2220-2229). <a class=\"trial-link\" href=\"/evidence/#t-caspian\">CASPIAN</a> randomised 805 untreated patients across three arms and showed the same for durvalumab added to platinum–etoposide (median overall survival 13.0 versus 10.3 months; HR 0.73; p=0.0047), with no additional benefit from adding tremelimumab (Lancet 2019;394:1929-1939). In IMpower133 the objective response rate was 60.2% with atezolizumab against 64.4% with placebo, a survival gain without a response gain; CASPIAN&#x27;s response rates ran the other way, 68% versus 58%. The usual reading of a late curve separation is durability in a minority, though no duration-of-response figure is available here. Both trials excluded thoracic radiotherapy and left prophylactic cranial irradiation to the investigator. Both gave the antibody three-weekly during induction; durvalumab then moves to four-weekly in maintenance while atezolizumab stays three-weekly, which is a real argument for durvalumab on visit burden alone. Pembrolizumab is not an option. <a class=\"trial-link\" href=\"/evidence/#t-keynote-604\">KEYNOTE-604</a> randomised 453 untreated patients to etoposide–platinum with pembrolizumab or placebo and improved progression-free survival (median 4.5 versus 4.3 months; HR 0.75; p=0.002) while overall survival did not cross its prespecified significance threshold (median 10.8 versus 9.7 months; HR 0.80; p=0.016; J Clin Oncol 2020;38:2369-2379). The small cell indication was subsequently withdrawn. Three further trials in predominantly Chinese populations report the same direction, with higher medians in all three but hazard ratios spanning 0.63 to 0.8. <a class=\"trial-link\" href=\"/evidence/#t-astrum-005\">ASTRUM-005</a> randomised 585 untreated patients 2:1 to serplulimab or placebo with carboplatin–etoposide, and at a prespecified interim analysis after 246 of the 342 planned deaths, serplulimab improved median overall survival (15.4 versus 10.9 months; HR 0.63; p&lt;0.001 against an interim boundary of 0.012; JAMA 2022;328:1223-1232). Its progression-free survival figure (5.7 versus 4.3 months; HR 0.48, 95% CI 0.38 to 0.59) carries no p-value, and the authors direct that all secondary outcomes be read as exploratory. This was the first phase 3 to show a survival benefit for a PD-1 rather than a PD-L1 inhibitor with chemotherapy in this setting. Generalisability is the limitation the trial names itself: 68% of patients were Chinese, there were no US sites, and median follow-up in the non-Asian patients was 9.1 months. CAPSTONE-1 reported median overall survival of 15.3 versus 12.8 months with adebrelimab (HR 0.72; p=0.0017) in 462 patients, and EXTENTORCH reported 14.6 versus 13.3 months with toripalimab (HR 0.8; p=0.03) in 442 patients. The medians in these trials sit well above those in IMpower133 and CASPIAN, and cross-trial comparison of medians across populations that differ this much is not informative about which drug is better. Escalating to dual checkpoint blockade as maintenance failed. CheckMate 451 randomised 834 patients without progression after up to four cycles of first-line chemotherapy to ipilimumab plus nivolumab, nivolumab alone, or placebo, with median overall survival of 9.2, 10.4 and 9.6 months respectively.</p>\n<h3>Maintenance with lurbinectedin</h3>\n<p><a class=\"trial-link\" href=\"/evidence/#t-imforte\">IMforte</a> produced the first maintenance regimen approved in extensive-stage disease. It randomised 483 patients without progression after four cycles of atezolizumab plus carboplatin–etoposide to maintenance lurbinectedin 3.2 mg/m² three-weekly with G-CSF prophylaxis plus atezolizumab, or atezolizumab alone. Adding lurbinectedin improved progression-free survival, the primary endpoint (median 5.4 versus 2.1 months; HR 0.54; p&lt;0.0001), and overall survival (13.2 versus 10.6 months; HR 0.73; Lancet 2025;405:2129-2143). The survival figures are counted from the start of maintenance rather than from diagnosis, so they are not comparable with the first-line medians above. The cost is myelosuppression: grade 3 or higher toxicity occurred in 38% versus 22%, chiefly anaemia, neutropenia and thrombocytopenia, and the response rate was 19% versus 10%. Patients with brain metastases were excluded, and the regimen requires atezolizumab-based induction, so choosing durvalumab first line forecloses it.</p>\n<h3>Thoracic radiotherapy after first-line chemotherapy</h3>\n<p>Neither CASPIAN nor IMpower133 permitted thoracic radiotherapy, so consolidative radiotherapy in the chemo-immunotherapy era rests on trials that predate it. <a class=\"trial-link\" href=\"/evidence/#t-crest\">CREST</a> randomised 495 patients responding to first-line chemotherapy, all of whom received prophylactic cranial irradiation, to consolidative thoracic radiotherapy 30 Gy in 10 fractions or none. The primary endpoint of 1-year overall survival was not met (33% versus 28%; p=0.66), while 2-year overall survival was better with radiotherapy (13% versus 3%; p=0.004; Lancet 2015;385:36-42). Progression-free survival was also longer (4 versus 3 months; HR 0.73; p=0.001). Since the primary endpoint was missed, the 2-year comparison is descriptive, and 30 Gy in 10 fractions is best regarded as the reference regimen for a selected patient rather than as a proven survival intervention. An earlier randomised trial in 206 patients with an extrathoracic complete response and at least an intrathoracic partial response after three cycles of cisplatin–etoposide also reported improved overall survival with the addition of thoracic radiotherapy (JCO 1999). Consider it in the patient who has responded everywhere and has residual disease confined to the chest.</p>\n<h3>Prophylactic cranial irradiation in extensive-stage disease</h3>\n<p>The two randomised trials here reach opposite conclusions, and the difference between them is MRI. <a class=\"trial-link\" href=\"/evidence/#t-eortc-08993-22993-slotman\">EORTC 08993-22993 (Slotman)</a> randomised 286 patients with any response to first-line chemotherapy to prophylactic cranial irradiation or observation, without mandating a baseline brain MRI. Irradiation reduced symptomatic brain metastases at one year (14.6% versus 40.4%) and improved 1-year overall survival (27.1% versus 13.3%; HR 0.68; p=0.003; N Engl J Med 2007;357:664-672), with median overall survival of 6.7 versus 5.4 months. <a class=\"trial-link\" href=\"/evidence/#t-takahashi-es-sclc-pci\">Takahashi (ES-SCLC PCI)</a> repeated the question in the MRI era. It randomised 224 patients who had responded to chemotherapy and had no brain metastases on MRI to prophylactic cranial irradiation 25 Gy in 10 fractions or three-monthly MRI surveillance with salvage radiotherapy as needed. The trial&#x27;s stated conclusion was that surveillance was non-inferior for overall survival (median 11.6 months with irradiation versus 13.7 months with surveillance; 12-month overall survival 48.4% versus 58.4%; Lancet Oncol 2017;18:663-671), and irradiation added neurocognitive toxicity without a demonstrated survival benefit. No non-inferiority margin is recorded in the sources available here. It did reduce brain metastases (33% versus 59% at one year). NCCN and ESMO now prefer MRI surveillance to routine prophylactic cranial irradiation in extensive-stage disease, and the practical choice is between irradiation and three-monthly MRI in a patient who has responded. MAVERICK (SWOG 1827) is testing the same comparison in a non-Asian population across both stages.</p>\n<h3>Practical problems at presentation</h3>\n<ul><li>Tumour lysis syndrome is a risk in this disease because the tumour responds fast; the patients to watch are those with pre-treatment renal impairment, raised LDH, hyperuricaemia or bulky disease.</li><li>Superior vena cava obstruction is better treated with systemic therapy than with radiotherapy, since the response to chemotherapy is usually rapid.</li><li>Asymptomatic brain metastases do not require radiotherapy before systemic therapy is started; symptomatic ones warrant whole-brain radiotherapy first, and whole-brain treatment is generally preferred to stereotactic radiosurgery because of the propensity to recur intracranially.</li></ul>\n<h2 id=\"s-relapsed-disease\">Relapsed disease</h2>\n<h3>Defining the relapse</h3>\n<p>The relapse category sets the treatment.</p>\n<ul><li>Refractory disease means no response to first-line treatment.</li><li>Resistant relapse means a disease-free interval under three months.</li><li>Sensitive relapse means over three months.</li><li>Late relapse means over six months from first-line chemotherapy.</li></ul>\n<h3>Platinum rechallenge</h3>\n<p>For sensitive relapse, meaning a treatment-free interval of more than three months from first-line chemotherapy, rechallenge with a platinum doublet is the better option, and both NCCN and ESMO endorse it. Two randomised trials support it, and both enrolled at that threshold. The French Lung Cancer Group 01-13 trial randomised 162 patients progressing at least 90 days after first-line treatment to carboplatin–etoposide or topotecan and improved progression-free survival, the primary endpoint (median 4.7 versus 2.7 months; HR 0.57; p=0.0041; Lancet Oncol 2020). In subset analysis the hazard ratio was 0.23 for patients with a platinum-free interval over 180 days against 0.70 for those with an interval of 90–180 days; no interaction test is reported for that difference, so it should be read as a gradient consistent with the biology rather than as a demonstrated effect modification. JCOG0605 randomised 180 patients with the same entry criterion to cisplatin, etoposide and irinotecan or to topotecan, and improved overall survival, the primary endpoint (median 18.2 versus 12.5 months; HR 0.67; p=0.0079; Lancet Oncol 2016). The triplet is cisplatin 25 mg/m² on days 1 and 8, etoposide 60 mg/m² on days 1–3 and irinotecan 90 mg/m² on day 8 every two weeks for five cycles with G-CSF on day 9, which is a demanding regimen for a relapsed patient and needs a performance status to match.</p>\n<h3>Topotecan and lurbinectedin</h3>\n<p>Topotecan is the historical reference. <a class=\"trial-link\" href=\"/evidence/#t-von-pawel\">von Pawel</a> randomised 211 patients relapsing at least 60 days after platinum-based first-line therapy to topotecan or CAV; response rates were similar (24.3% versus 18.3%; p=0.285), as was overall survival (25.0 versus 24.7 weeks), and topotecan gave significantly better control of anorexia, fatigue and dyspnoea (J Clin Oncol 1999;17:658-667). The benefit was in symptoms rather than tumour outcomes. Oral and intravenous topotecan have similar activity, with median overall survival of 33 versus 35 weeks and response rates of 18% versus 22% in a randomised comparison of 309 patients (JCO 2007), and oral topotecan improved survival over best supportive care in 141 relapsed patients (26 versus 14 weeks; p=0.0104; JCO 2006). <a class=\"trial-link\" href=\"/evidence/#t-pm1183-b-005-lurbinectedin\">PM1183-B-005 (Lurbinectedin)</a> brought the first new agent since topotecan. In 105 patients with relapsed or refractory disease after platinum-based chemotherapy, performance status 0–2 and no brain metastases, single-agent lurbinectedin 3.2 mg/m² three-weekly produced an objective response in 35.2% (95% CI 26 to 45%) with a median duration of response of 5.3 months and responses lasting six months or longer in 43%, supporting FDA accelerated approval in June 2020 (Lancet Oncol 2020;21:645-654). Median overall survival was 9.3 months and median progression-free survival 3.5 months. The trial was single-arm, so none of these figures is a comparison.</p>\n<h3>Tarlatamab</h3>\n<p>Tarlatamab is a DLL3-directed bispecific T-cell engager and is now the second-line standard. <a class=\"trial-link\" href=\"/evidence/#t-dellphi-301\">DeLLphi-301</a> treated 220 patients who had received at least two prior lines; in the 10 mg cohort the objective response rate was 40%, median overall survival 14.3 months and median progression-free survival 4.9 months, with grade 3 or higher cytokine release syndrome in 1% (N Engl J Med 2023;389:2063-2075). Cytokine release syndrome of any grade occurred in 51% of that cohort, and ICANS in 9%. The dose-expansion cohorts were not randomised against anything, so none of these figures is a comparison. It received FDA accelerated approval in May 2024. <a class=\"trial-link\" href=\"/evidence/#t-dellphi-304\">DeLLphi-304</a> converted that into a randomised result. In 509 patients relapsing after platinum-based chemotherapy, tarlatamab improved overall survival against investigator&#x27;s choice of topotecan, lurbinectedin or amrubicin (median 13.6 versus 8.3 months; HR 0.60; p&lt;0.001; 12-month overall survival 53% versus 37%), with fewer serious treatment-related adverse events than chemotherapy (N Engl J Med 2025;393:349-361). Progression-free survival was 4.2 versus 3.2 months (HR 0.72; p&lt;0.001) and the response rate 35% versus 20%. Grade 3 or higher toxicity was less than half that of chemotherapy (27% versus 62%). FDA full approval followed in November 2025. The toxicity differs in kind rather than in amount. Cytokine release syndrome occurred in most patients but was largely low grade (42% grade 1, 13% grade 2, 1% grade 3), with a median time to onset of about 13.5 hours, presenting as fever, hypotension, fatigue, tachycardia, headache, hypoxia and vomiting. Neurological toxicity including ICANS presents as headache, peripheral neuropathy, dizziness, confusion, lethargy or disorientation. Both are concentrated in cycle 1, which is why the schedule uses step-up dosing of 1 mg on day 1, 10 mg on day 8 and 10 mg on day 15, then 10 mg two-weekly from cycle 2, with inpatient monitoring, dexamethasone 8 mg intravenously on cycle 1 days 1 and 8, intravenous fluids on cycle 1 days 1, 8 and 15, and tocilizumab on standby. A unit that cannot admit for the first cycle cannot deliver this drug. For early relapse or progression on a platinum rechallenge, the preference order is lurbinectedin, then topotecan or paclitaxel. Where none of those is available or appropriate, gemcitabine, temozolomide and vinorelbine each have reported response rates above 10%; vinorelbine requires central access.</p>\n<h2 id=\"s-small-cell-transformation-of-egfr-mutant-lung-cancer\">Small cell transformation of EGFR-mutant lung cancer</h2>\n<p>Transformation to small cell histology is a recognised resistance mechanism in <em>EGFR</em>-mutant non-small cell lung cancer treated with EGFR tyrosine kinase inhibitors, occurring in 3–5% of patients and concentrated in tumours with co-occurring <em>RB1</em> and <em>TP53</em> mutations. A retrospective series of 67 patients reported a median time to transformation of 17.8 months, median overall survival of 31.5 months from initial diagnosis and 10.9 months from transformation, with a 54% response rate to platinum–etoposide (median progression-free survival 3.4 months) and 50% to a taxane; none of the 17 patients treated with immunotherapy responded (JCO 2019). Treat it as small cell disease with platinum–etoposide, with or without immunotherapy, or with a single-agent taxane. Rebiopsy at progression on an EGFR inhibitor makes the diagnosis, and the series above predicts little benefit from a checkpoint inhibitor in this setting.</p>\n<h2 id=\"s-references\">References</h2>\n<ol class=\"refs\">\n<li><a class=\"trial-link\" href=\"/evidence/#t-pignon-meta-analysis\">Pignon Meta-Analysis</a>. <a href=\"https://drive.google.com/file/d/1zS6eqe3yG4Bo4TnXYZm47ROwFvaNnMDH/preview\">N Engl J Med 1992;327:1618-1624</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-int-0096-turrisi\">INT-0096 (Turrisi)</a>. <a href=\"https://doi.org/10.1056/NEJM199901283400403\">N Engl J Med 1999;340:265-271</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-convert\">CONVERT</a>. <a href=\"https://doi.org/10.1016/S1470-2045(17)30318-2\">Lancet Oncol 2017;18:1116-1125</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-adriatic\">ADRIATIC</a>. <a href=\"https://drive.google.com/file/d/1Oj6AP0zwzfOiNVZGjavo-CaXCUf_zbC4/preview\">N Engl J Med 2024;391:1313-1327</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-pci-overview-collaborative-group-aup-rin\">PCI Overview Collaborative Group (Aupérin)</a>. <a href=\"https://drive.google.com/file/d/1GvYIGQKl3PG_iGA3k-HuO7mWFVXWPD8k/preview\">N Engl J Med 1999;341:476-484</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-jcog9511-noda\">JCOG9511 (Noda)</a>. <a href=\"https://drive.google.com/file/d/1VwRQWvg4kmo1Ytq_kiwuXpkZQRwP0-O8/preview\">N Engl J Med 2002;346:85-91</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-impower133\">IMpower133</a>. <a href=\"https://drive.google.com/file/d/1kzACp_xaQEHG3HOqeLFKxG8NHPR3gu4v/preview\">N Engl J Med 2018;379:2220-2229</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-caspian\">CASPIAN</a>. <a href=\"https://drive.google.com/file/d/1UPPI6boesT5zdJOLVMEy2dtXd14oLKpT/preview\">Lancet 2019;394:1929-1939</a>; <a href=\"https://drive.google.com/file/d/1C1VsI6dk5-DiSB3-mnfkZMHwV-xHOfZl/preview\">Goldman et al. - 2020 - Durvalumab, with or without tremelimumab, plus platinum-etoposide versus platinum-etoposide alone [e3b0fafd]</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-keynote-604\">KEYNOTE-604</a>. <a href=\"https://drive.google.com/file/d/13_lSLm5Qz5WaimioBfkMUyOvipo4G5Nk/preview\">J Clin Oncol 2020;38:2369-2379</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-astrum-005\">ASTRUM-005</a>. <a href=\"https://drive.google.com/file/d/16L-J-FUoMk8aLl7Ovqv5eZG-2RM6xR8W/preview\">JAMA 2022;328:1223-1232</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-imforte\">IMforte</a>. <a href=\"https://drive.google.com/file/d/1GIH2dNSELLIw9umWr3JnGXltv58f3JL0/preview\">Lancet 2025;405:2129-2143</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-crest\">CREST</a>. <a href=\"https://drive.google.com/file/d/1JkttKuoqe5lgyL0EqEt7jLuWZRx38D4D/preview\">Lancet 2015;385:36-42</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-eortc-08993-22993-slotman\">EORTC 08993-22993 (Slotman)</a>. <a href=\"https://drive.google.com/file/d/15OISn-jOvsMHvuduwjQ1jAPQ3AW5rjLz/preview\">N Engl J Med 2007;357:664-672</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-takahashi-es-sclc-pci\">Takahashi (ES-SCLC PCI)</a>. <a href=\"https://drive.google.com/file/d/1LeilwhT9QxwabDLfLplphmo0UmlnsyvG/preview\">Lancet Oncol 2017;18:663-671</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-von-pawel\">von Pawel</a>. <a href=\"https://drive.google.com/file/d/12WbY4EMlY25CCE4fsx-ZaxZm8sM4EKCJ/preview\">J Clin Oncol 1999;17:658-667</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-pm1183-b-005-lurbinectedin\">PM1183-B-005 (Lurbinectedin)</a>. <a href=\"https://drive.google.com/file/d/1qwr9WbTrT1DLkMU0bFdu4N5OS9WRmzZF/preview\">Lancet Oncol 2020;21:645-654</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-dellphi-301\">DeLLphi-301</a>. <a href=\"https://drive.google.com/file/d/1Zn9tWnamkHSySlxxfyMSf6MB7LUI28cL/preview\">N Engl J Med 2023;389:2063-2075</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-dellphi-304\">DeLLphi-304</a>. <a href=\"https://drive.google.com/file/d/1slMV1XbMXQM_0GZG8Jg8oPPwgGGe4kIT/preview\">N Engl J Med 2025;393:349-361</a></li>\n</ol>", "_hay": "small cell lung cancer small-cell-lung-cancer lung biology and clinical behaviour staging and work-up limited-stage disease extensive-stage disease relapsed disease small cell transformation of egfr-mutant lung cancer references stage i and the role of surgery chemoradiation for stage ii–iii disease radiotherapy dose, schedule and timing consolidation durvalumab prophylactic cranial irradiation the chemotherapy backbone adding a checkpoint inhibitor maintenance with lurbinectedin thoracic radiotherapy after first-line chemotherapy prophylactic cranial irradiation in extensive-stage disease practical problems at presentation defining the relapse platinum rechallenge topotecan and lurbinectedin tarlatamab"}, {"id": "lymphoma-diffuse-large-b-cell-lymphoma", "slug": "diffuse-large-b-cell-lymphoma", "group": "Lymphoma", "title": "Diffuse large B-cell lymphoma", "updated": "", "sections": [{"id": "s-classification-and-cell-of-origin", "h": "Classification and cell of origin"}, {"id": "s-staging", "h": "Staging"}, {"id": "s-response-assessment", "h": "Response assessment"}, {"id": "s-prognostic-indices", "h": "Prognostic indices"}, {"id": "s-clinical-presentation", "h": "Clinical presentation"}, {"id": "s-work-up", "h": "Work-up"}, {"id": "s-tumour-lysis-syndrome", "h": "Tumour lysis syndrome"}, {"id": "s-limited-stage-dlbcl-stage-i-ii", "h": "Limited-stage DLBCL (stage I–II)"}, {"id": "s-r-chop-delivery", "h": "R-CHOP delivery"}, {"id": "s-advanced-stage-dlbcl-stage-ii-bulky-to-iv", "h": "Advanced-stage DLBCL (stage II bulky to IV)"}, {"id": "s-cns-prophylaxis", "h": "CNS prophylaxis"}, {"id": "s-radiotherapy-for-bulky-disease", "h": "Radiotherapy for bulky disease"}, {"id": "s-dlbcl-in-older-patients", "h": "DLBCL in older patients"}, {"id": "s-the-anthracycline-unfit-patient", "h": "The anthracycline-unfit patient"}, {"id": "s-double-hit-and-double-expressor-disease", "h": "Double-hit and double-expressor disease"}, {"id": "s-relapsed-or-refractory-dlbcl", "h": "Relapsed or refractory DLBCL"}, {"id": "s-references", "h": "References"}], "html": "<h2 id=\"s-classification-and-cell-of-origin\">Classification and cell of origin</h2>\n<p>B-cell non-Hodgkin lymphomas arise from a non-malignant counterpart in normal B-lymphoid development, and recapitulate the characteristic morphological, phenotypic and gene-expression features of that counterpart with some aberrancy. This cell-of-origin concept is fundamental to the classification of B-cell lymphomas. Current classification follows the International Consensus Classification (ICC) and the WHO 5th edition. The major categories:</p>\n<ul><li>Precursor lymphoid neoplasms: B- and T-cell acute lymphoblastic leukaemia / lymphoblastic lymphoma, both aggressive.</li><li>Mature B-cell neoplasms: chronic lymphocytic leukaemia / small lymphocytic lymphoma, lymphoplasmacytic lymphoma, the monoclonal gammopathies and plasma cell neoplasms (including multiple myeloma), hairy cell leukaemia, marginal zone lymphoma (CD5- and CD10-negative), follicular lymphoma, mantle cell lymphoma (usually CD10-negative), DLBCL, and the high-grade B-cell lymphomas.</li><li>Hodgkin lymphoma: classic Hodgkin lymphoma and nodular lymphocyte-predominant Hodgkin lymphoma, an uncommon, favourable-prognosis category.</li><li>Mature T/NK-cell neoplasms: peripheral T-cell lymphoma and its relatives, including primary cutaneous forms.</li></ul>\n<p>Within the mature B-cell group, classic follicular lymphoma carries the t(14;18)/IGH::BCL2 fusion, and follicular lymphoma grade 3B behaves like DLBCL. Burkitt lymphoma is highly aggressive and rapidly growing, with endemic, sporadic and immunodeficiency-associated forms.</p>\n<p>The non-Hodgkin lymphomas split by behaviour and cytology:</p>\n<ul><li>Indolent, small B-cell: follicular, mantle cell and marginal zone lymphoma.</li><li>Aggressive, large B-cell: DLBCL and Burkitt lymphoma.</li></ul>\n<p>Many B-cell lymphomas express CD19 and CD20. The characteristic genetic and immunohistochemical markers:</p>\n<ul><li>Follicular lymphoma: t(14;18); BCL2 and BCL6 positive.</li><li>Mantle cell lymphoma: t(11;14)(q13;q32); BCL2, cyclin D1 and SOX11 positive.</li><li>Marginal zone lymphoma: t(11;18) in MALT lymphoma; BCL2 positive.</li><li>Burkitt lymphoma: BCL2 negative.</li></ul>\n<p>Three further immunohistochemical markers matter in routine practice: Ki67 as the proliferative index, CD5 for its prognostic significance, and MYC with BCL2 protein expression. Assess MYC and BCL2 protein expression by immunohistochemistry, but identify double-hit disease by FISH: test for a MYC rearrangement and, if present, add BCL2 FISH (<a class=\"trial-link\" href=\"/evidence/#t-esmo-lymphomas-guideline-eyre-et-al\">ESMO Lymphomas Guideline (Eyre et al.)</a>). DLBCL divides by cell of origin into germinal-centre B-cell-like (GCB) and activated B-cell-like (ABC, non-GCB) disease, with the better prognosis in GCB. The split was established by gene-expression profiling: <a class=\"trial-link\" href=\"/evidence/#t-alizadeh-et-al-lymphochip\">Alizadeh et al. (Lymphochip)</a> separated GCB from ABC disease by unsupervised clustering and the division tracked survival after comparable anthracycline-based chemotherapy (76% vs 16% alive at 5 years across the 40 patients with survival data, nominal p=0.01), though the subgroups were derived post hoc from the expression data and no hazard ratio or multivariable model was reported (Nature 2000;403:503-511). The Hans immunohistochemical algorithm approximates the split, GCB when CD10-positive or BCL6-positive with MUM1-negative, non-GCB when CD10- and BCL6-negative or BCL6-positive with MUM1-positive, but published data on its prognostic effect are contradictory and it should not determine treatment. Cell of origin is prognostic in gene-expression studies, but cell-of-origin-directed frontline strategies have not improved outcomes.</p>\n<h2 id=\"s-staging\">Staging</h2>\n<p>Most non-Hodgkin lymphomas are staged by the Lugano classification, which takes the number and location of tumour sites from the Ann Arbor system. The operational rules:</p>\n<ul><li>Bone marrow, liver, lung or CSF involvement is generally classified as stage IV.</li><li>Constitutional symptoms are not incorporated into NHL staging, unlike classic Hodgkin lymphoma, because they are not independently prognostic; the A/B suffix is documented for Hodgkin lymphoma.</li><li>Limited extranodal extension is marked with the subscript E.</li><li>Disease involving the spleen counts as nodal rather than extranodal.</li></ul>\n<p>Bulky disease has no single definition; the cutoff varies by histology, 6 cm for follicular lymphoma and 6-10 cm for DLBCL.</p>\n<h2 id=\"s-response-assessment\">Response assessment</h2>\n<p>On CT, involvement means a nodal longest diameter above 1.5 cm or an extranodal lesion above 1 cm; on PET-CT it means increased uptake. The routinely PET-avid histologies are Hodgkin lymphoma, DLBCL, follicular lymphoma grade 3 and nodal marginal zone lymphoma; PET avidity is variable in follicular lymphoma grade 1-2, extranodal marginal zone lymphoma and CLL/SLL. Under Lugano response criteria, CT response uses the sum of the products of perpendicular diameters (SPD) of up to 6 target lesions, with measurable disease defined as a node of 1.5 cm or more in longest diameter:</p>\n<ul><li>Complete response: target nodes regress to 1.5 cm or less in longest diameter, with no extra-lymphatic disease.</li><li>Partial response: at least a 50% decrease in SPD.</li></ul>\n<ul><li>Stable disease: less than a 50% decrease in SPD.</li></ul>\n<p>PET-CT response uses the Deauville score:</p>\n<ul><li>Complete response: score 1, 2 or 3.</li><li>Partial response: score 4 or 5 with reduced uptake from baseline.</li><li>Stable disease: score 4 or 5 with unchanged uptake.</li><li>Progression: score 4 or 5 with increased uptake, or a new lesion.</li></ul>\n<p>PET takes precedence: a PET-negative scan is a complete response even when a residual mass is visible on CT.</p>\n<h2 id=\"s-prognostic-indices\">Prognostic indices</h2>\n<p>The International Prognostic Index (IPI) has value across all categories of NHL.</p>\n<ul><li>IPI (five factors, APLES): age over 60, performance status 2 or more, LDH above normal, 2 or more extranodal sites, stage III-IV.</li><li>Age-adjusted IPI (PLS): performance status 2 or more, LDH above normal, stage III-IV.</li><li>Stage-modified IPI, for stage I-II disease (ALPS): age over 60, performance status 2 or more, LDH above normal, and non-bulky stage II.</li></ul>\n<p>Disease-specific indices exist alongside it, including the Follicular Lymphoma International Prognostic Index (FLIPI) and an NK/T-cell lymphoma index, as do treatment-specific scores. The CNS-IPI estimates the risk of CNS relapse.</p>\n<h2 id=\"s-clinical-presentation\">Clinical presentation</h2>\n<p>Aggressive NHL presents with a rapidly growing mass, constitutional symptoms and tumour lysis syndrome; indolent NHL with a slowly growing nodal mass, hepatomegaly, splenomegaly or cytopenias. Site-specific presentations: GI lymphoma with early satiety, anorexia, weight loss, vomiting or a tumour complication (perforation, obstruction, bleeding); primary CNS lymphoma with headache, seizures, paralysis, cord compression or meningitis; cutaneous lymphoma with rash, plaques, tumours or ulcers. The oncological emergencies of lymphoma include cord compression, lymphomatous meningitis, airway obstruction, pericardial tamponade, superior vena cava obstruction, tumour lysis syndrome and hypercalcaemia.</p>\n<h2 id=\"s-work-up\">Work-up</h2>\n<p>History and examination cover B symptoms (unexplained fever, weight loss, night sweats), lymphadenopathy including the tonsils and testes, personal or family history of lymphoma or other haematological malignancy, prior radiotherapy or chemotherapy, immunosuppression and organ transplantation, and associated disorders such as autoimmune disease and H. pylori chronic gastritis. Diagnosis and staging:</p>\n<ul><li>Tissue diagnosis usually requires an excisional node biopsy, to provide adequate tissue for histological, immunological and molecular assessment.</li><li>Histology, flow cytometry and cytogenetics, including MYC and BCL2 FISH to look for double-hit lymphoma.</li><li>PET-CT for staging.</li><li>Lumbar puncture and contrast-enhanced MRI of the brain (and spine if clinically indicated) when the CNS-IPI is high (4-6).</li></ul>\n<p>PET-CT is more likely than bone marrow biopsy to detect marrow involvement with large B-cell lymphoma, and non-avid marrow disease does not confer a worse prognosis (BCSH 2024). A 2014 meta-analysis put PET at moderate sensitivity (88.7%) and high specificity (99.8%) for marrow involvement; about 3% of patients with involvement on biopsy had a negative PET, while 13% with involvement on PET had a negative biopsy. Bone marrow aspiration can still be considered to look for transformation from an indolent lymphoma (though this does not change management in DLBCL), where cytopenias raise concern for MDS that would affect chemotherapy dosing, or where the result would change management, for example apparently localised disease planned for abbreviated treatment in which marrow involvement would upstage and change treatment. Pre-treatment evaluation: full blood count, liver and renal function, LDH, tumour lysis labs including CMP and G6PD (which may affect management), hepatitis serologies, and cardiac assessment with echocardiography.</p>\n<h2 id=\"s-tumour-lysis-syndrome\">Tumour lysis syndrome</h2>\n<p>Laboratory tumour lysis syndrome is defined by the Cairo-Bishop criteria; severity is graded on creatinine, cardiac arrhythmias and seizures.</p>\n<p>Prophylaxis:</p>\n<ul><li>Rasburicase for high-risk cases, as a single dose of 0.2 mg/kg. Check G6PD first: rasburicase is contraindicated in deficiency, because urate degradation generates hydrogen peroxide that G6PD-deficient red cells cannot neutralise for lack of NADPH, causing oxidative stress, severe haemolytic anaemia and potentially fatal methaemoglobinaemia. Send the uric acid sample on ice, because ex vivo degradation of uric acid by rasburicase yields spuriously low serum levels and a failure to detect tumour lysis.</li><li>Allopurinol for intermediate-risk cases, 100 mg/m² per dose every 8 hours (maximum 800 mg/day), checking HLA-B*5801 first.</li><li>Give IV hydration according to renal and cardiac status and monitor urine output closely.</li></ul>\n<p>Treatment: rasburicase as a single 3-6 mg IV dose; phosphate binders for hyperphosphataemia; treat electrolyte abnormalities urgently, with IV calcium reserved for a specific clinical indication rather than an isolated low calcium result; Resonium and insulin for hyperkalaemia; haemodialysis for uraemia or severe electrolyte abnormalities.</p>\n<h2 id=\"s-limited-stage-dlbcl-stage-i-ii\">Limited-stage DLBCL (stage I–II)</h2>\n<p>Treatment is stratified by age, bulk and risk:</p>\n<ul><li>Fit patients younger than 60 with IPI 0 and non-bulky disease (&lt;7.5 cm): four cycles of R-CHOP plus two further rituximab doses; this FLYER approach can also be considered at age 60–80 without additional risk factors (<a class=\"trial-link\" href=\"/evidence/#t-esmo-lymphomas-guideline-eyre-et-al\">ESMO Lymphomas Guideline (Eyre et al.)</a>).</li><li>Fit patients younger than 80 with limited-stage bulky disease and aaIPI 0: after two cycles, give four total cycles of R-CHOP without further rituximab for CMR (Deauville 1–3), or six cycles plus ISRT for Deauville 4–5 (<a class=\"trial-link\" href=\"/evidence/#t-esmo-lymphomas-guideline-eyre-et-al\">ESMO Lymphomas Guideline (Eyre et al.)</a>).</li><li>Limited-stage aaIPI ≥1: six cycles of R-CHOP; for IPI ≥2, six cycles of pola-R-CHP is an alternative; three to four cycles of R-CHOP plus ISRT is another option (<a class=\"trial-link\" href=\"/evidence/#t-esmo-lymphomas-guideline-eyre-et-al\">ESMO Lymphomas Guideline (Eyre et al.)</a>).</li><li>Patients aged 80 or older: six cycles of R-miniCHOP (<a class=\"trial-link\" href=\"/evidence/#t-lnh03-7b-r-minichop\">LNH03-7B (R-miniCHOP)</a>).</li></ul>\n<p>Abbreviated therapy does not apply to selected high-risk extranodal involvement (kidneys or adrenals), patients who cannot receive full-dose R-CHOP, double-hit lymphoma, transformed disease, primary mediastinal B-cell lymphoma, or HIV-associated DLBCL. The trial base:</p>\n<ul><li>SWOG S8736 randomised 401 patients with localised intermediate- or high-grade NHL to 3 cycles of CHOP with involved-field radiotherapy or 8 cycles of CHOP, and long-term follow-up showed no difference (median PFS 11.1 vs 12 years; median OS 13.7 vs 13 years, both non-significant). It generated the stage-modified IPI, in which a score of 0 predicts excellent outcomes.</li><li>SWOG S0014, a single-arm phase 2 of 3 R-CHOP plus radiotherapy in 56 patients with localised disease and at least one stage-modified IPI risk factor, reported 5-year PFS of 77% falling to 58% at 10 years, so late relapses continue.</li><li><a class=\"trial-link\" href=\"/evidence/#t-mint\">MInT</a> randomised young patients (18-60, age-adjusted IPI 0-1) to 6 cycles of CHOP-like chemotherapy with or without rituximab. Adding rituximab raised 3-year EFS from 59% to 79% and 3-year OS from 84% to 93%; the trial stopped early for efficacy at its first interim analysis, so the figures likely flatter the benefit, and the widely quoted HR 0.44 (95% CI 0.34-0.59) comes from a multivariable model rather than the primary analysis (Lancet Oncol 2006;7:379-391). Its most favourable subgroup, age-adjusted IPI 0 and non-bulky, did well enough to raise the question of whether such patients could receive less chemotherapy.</li><li><a class=\"trial-link\" href=\"/evidence/#t-flyer\">FLYER</a> tested this approach in 592 patients aged 18-60 with stage I-II non-bulky disease (largest mass below 7.5 cm), normal LDH and performance status 0-1. Four cycles of R-CHOP plus 2 rituximab doses were non-inferior to 6 cycles for 3-year PFS (96% vs 94%; lower limit of the one-sided 95% CI 0%, against a -5.5% margin), with fewer non-haematological adverse events (Lancet 2019;394:2271-2281). Both arms received 6 rituximab doses. Only non-inferiority was tested, and the primary endpoint was changed from event-free to progression-free survival by protocol amendment after the first interim analysis.</li></ul>\n<p>PET-adapted strategies refine the same territory:</p>\n<ul><li>LYSA/GOELAMS 02-03 (334 patients, stage I-II non-bulky below 7 cm) randomised radiotherapy after 4 cycles of R-CHOP-14 against R-CHOP alone in interim-PET complete responders: 5-year EFS 92% vs 89% and OS 96% vs 92%, both non-significant, so radiotherapy can be omitted when the PET after cycle 4 is negative; the design does not say whether interim PET allows less chemotherapy.</li><li>LYSA LNH09-1B (650 patients, age-adjusted IPI 0, age 18-80) reduced treatment to 4 cycles of R-CHOP when the interim PET after cycle 2 was negative: 3-year PFS 92% vs 89% against 6 cycles, meeting the non-inferiority threshold, with 80% of the PET-adapted arm negative at interim PET.</li><li>SWOG S1001 (132 patients, stage I-II non-bulky below 10 cm) gave one further cycle after a negative PET following cycle 3 (89% of patients): 5-year PFS 87% and OS 89%, but stage-modified IPI still stratified outcome (5-year PFS 97% for score 0, 86% for 1-2, 30% for 3), so it is inconclusive whether chemotherapy can be reduced or radiotherapy omitted in interim-PET-negative high-risk cases.</li></ul>\n<h2 id=\"s-r-chop-delivery\">R-CHOP delivery</h2>\n<p>Standard R-CHOP dosing:</p>\n<ul><li>Rituximab 375 mg/m² IV day 1, starting at 50 mg/h and escalating in 50 mg/h increments. Adverse effects include hepatitis B and C reactivation, infections, infusion reactions and cytopenias.</li><li>Cyclophosphamide 750 mg/m² IV day 1 over 30 minutes.</li><li>Doxorubicin 50 mg/m² IV day 1 over 3-5 minutes.</li><li>Vincristine dosing must follow the active local R-CHOP protocol, including its maximum-dose rule.</li><li>Prednisolone 100 mg PO days 1-5.</li></ul>\n<p>Give co-trimoxazole (one double-strength tablet three times a week) and aciclovir (800 mg twice daily) as prophylaxis against Pneumocystis pneumonia and HSV/VZV reactivation.</p>\n<h2 id=\"s-advanced-stage-dlbcl-stage-ii-bulky-to-iv\">Advanced-stage DLBCL (stage II bulky to IV)</h2>\n<p>Six cycles of R-CHOP every 21 days is the standard of care; the current ESMO guideline keeps 6 R-CHOP as standard for IPI 0-1 and admits 6 cycles of pola-R-CHP as a first-line option for IPI 2 or more (<a class=\"trial-link\" href=\"/evidence/#t-esmo-lymphomas-guideline-eyre-et-al\">ESMO Lymphomas Guideline (Eyre et al.)</a>, Ann Oncol 2025). The backbone was settled in sequence:</p>\n<ul><li>CHOP over intensified combinations. The SWOG comparison of CHOP against three second-generation regimens (m-BACOD, ProMACE-CytaBOM, MACOP-B) found no survival difference and more grade 5 adverse events with the intensified regimens (NEJM 1993).</li><li>Rituximab over chemotherapy alone. <a class=\"trial-link\" href=\"/evidence/#t-lnh-98-5-gela\">LNH-98.5 (GELA)</a> added rituximab to 8 cycles of CHOP in patients aged 60-80 and improved 2-year EFS (57% vs 38%, p&lt;0.001) and OS (70% vs 57%, p=0.007), holding at 5 years (OS 58% vs 45%). The primary report found no clinically meaningful increase in toxicity; it was the first trial to show that adding an antibody to chemotherapy improves survival in lymphoma (N Engl J Med 2002;346:235-242). <a class=\"trial-link\" href=\"/evidence/#t-mint\">MInT</a> extended the same result to younger good-prognosis patients on 6 cycles.</li><li>Six cycles, not eight. <a class=\"trial-link\" href=\"/evidence/#t-ricover-60\">RICOVER-60</a>, a 2x2 factorial of 6 vs 8 cycles of CHOP-14 with or without rituximab in 1,222 patients aged 61-80, found rituximab drove the benefit and the extra cycles bought nothing: only 6 cycles of R-CHOP-14 improved 3-year OS against CHOP-14 (78.1% vs 67.7%, a gain of 10.4 points), while the 8-cycle rituximab arm sat 5.6 points below the 6-cycle arm, attributed to more treatment-associated deaths (Lancet Oncol 2008;9:105-116).</li><li>Every 21 days, not dose-dense. <a class=\"trial-link\" href=\"/evidence/#t-r-chop-14-v-21-ncri\">R-CHOP-14 v 21 (NCRI)</a> set out to show 6 cycles of R-CHOP-14 superior to 8 of R-CHOP-21 in 1,080 patients and did not: 2-year OS 82.7% vs 80.8% (HR 0.90, 95% CI 0.70-1.15), PFS HR 0.94, with treatment-related deaths 9 vs 3, a threefold numerical excess that did not reach significance (Lancet 2013;381:1817-1826). LNH03-6B asked the same question in patients aged 60-80 with age-adjusted IPI 1 or more (8 R-CHOP-14 vs 8 R-CHOP-21) and also found similar PFS and OS with more toxicity on the 14-day schedule. Rituximab has repeatedly erased chemotherapy advantages that existed before it, whether the variable was the schedule, an added cytotoxic or the dose intensity.</li></ul>\n<h3>Attempts to improve on R-CHOP</h3>\n<p>Five phase 3 trials failed on their primary endpoint. REMoDL-B incorporated real-time cell-of-origin profiling, PHOENIX selected non-GCB disease and ROBUST selected ABC disease; GOYA and CALGB/Alliance 50303 were not cell-of-origin-selected.</p>\n<ul><li><a class=\"trial-link\" href=\"/evidence/#t-calgb-alliance-50303\">CALGB/Alliance 50303</a>: infusional DA-EPOCH-R did not improve PFS over R-CHOP (HR 0.93, p=0.65) and was substantially more toxic (J Clin Oncol 2019;37:1790-1799).</li><li><a class=\"trial-link\" href=\"/evidence/#t-goya\">GOYA</a>: substituting obinutuzumab for rituximab missed its primary endpoint (3-year PFS 69.6% vs 66.9%; HR 0.92, p=0.39) with more toxicity; a more potent anti-CD20 does not beat rituximab in DLBCL, unlike in CLL and follicular lymphoma (J Clin Oncol 2017;35:3529-3537).</li><li><a class=\"trial-link\" href=\"/evidence/#t-remodl-b\">REMoDL-B</a>: bortezomib added to R-CHOP after real-time gene-expression profiling missed its primary endpoint (30-month PFS HR 0.86, p=0.28). A 5-year reanalysis reported a nominal treatment-by-subtype interaction favouring ABC and molecular high-grade disease; grade 3 or higher neuropathy was 3.8% versus 2.2% and serious adverse events 50.7% versus 42.5%, so the signal remains hypothesis-generating (Lancet Oncol 2019;20:649-662).</li><li><a class=\"trial-link\" href=\"/evidence/#t-phoenix\">PHOENIX</a>: ibrutinib added to R-CHOP in non-GCB disease missed both co-primary endpoints; a prespecified exploratory age interaction showed benefit under 60 and numerical harm at 60 or over, tracking how much R-CHOP each group tolerated (J Clin Oncol 2019;37:1285-1295).</li><li><a class=\"trial-link\" href=\"/evidence/#t-robust\">ROBUST</a>: lenalidomide added to R-CHOP in prospectively selected ABC-type disease missed its primary endpoint (PFS HR 0.85, p=0.29) (J Clin Oncol 2021;39:1317-1328).</li></ul>\n<h3>Pola-R-CHP</h3>\n<p>Polatuzumab vedotin is an anti-CD79b antibody-drug conjugate with an MMAE payload. <a class=\"trial-link\" href=\"/evidence/#t-polarix\">POLARIX</a> replaced vincristine with polatuzumab in 879 previously untreated patients aged 18-80 with IPI 2-5, 90% stage III-IV. Pola-R-CHP improved the primary endpoint of PFS (2-year 76.7% vs 70.2%; HR 0.73, 95% CI 0.57-0.95, p=0.02), and the advantage held at 5 years (64.9% vs 59.1%; HR 0.77, 0.62-0.97), but no statistically significant overall-survival advantage had been demonstrated at the 5-year analysis (82.3% vs 79.5%; HR 0.85, 95% CI 0.63-1.15) (N Engl J Med 2022;386:351-363; J Clin Oncol 2025;43:3698-3705). Fewer patients required a subsequent line over 5 years (25.5% vs 35.3%). Grade 3 or higher adverse events were similar (60.7% vs 59.8%), with more grade 3-4 febrile neutropenia (13.8% vs 8.0%).</p>\n<p>Subgroup analyses suggested more benefit with age over 60, IPI 3-5, ABC subtype and the absence of bulky disease; these are exploratory analyses carrying no interaction test, and the 5-year cell-of-origin split (ABC PFS HR 0.38 vs GCB 1.07) licenses no comparison between subtypes <a class=\"trial-link\" href=\"/evidence/#t-polarix\">POLARIX</a>. Two further additions have beaten R-CHOP on a surrogate endpoint without a demonstrated survival advantage to date. <a class=\"trial-link\" href=\"/evidence/#t-frontmind\">frontMIND</a> added tafasitamab and lenalidomide to R-CHOP in high-risk disease (IPI 3-5 or age-adjusted IPI 2-3) and met its primary endpoint (PFS HR 0.75, 95% CI 0.59-0.96, p=0.0194; 2-year PFS 71.1% vs 62.9%); overall survival was formally tested at the interim analysis and not met (HR 0.85, p=0.2703), with the authors calling the data immature, and grade 3 or higher events rose from 76% to 87% (Lancet 2026;407:2528-2541). It is an option in high-risk disease, not an established standard.</p>\n<h3>Upfront transplant consolidation</h3>\n<p><a class=\"trial-link\" href=\"/evidence/#t-swog-9704\">SWOG 9704</a> randomised high-intermediate and high-risk responders after 5 cycles of (R-)CHOP to upfront autologous transplant or 3 further cycles: 2-year PFS improved (69% vs 55%, p=0.005) but overall survival did not (74% vs 71%, p=0.30), and both were primary endpoints; effective salvage transplantation at relapse explains the gap, and only 150 of 225 randomised B-cell patients received rituximab (N Engl J Med 2013;369:1681-1690). Upfront transplant is therefore not standard consolidation.</p>\n<h2 id=\"s-cns-prophylaxis\">CNS prophylaxis</h2>\n<p>Consider baseline CNS screening, imaging plus CSF analysis, in high-risk patients (BCSH guidelines): CNS-IPI 4-6, three or more extranodal sites, or disease at specific sites, testicular, renal or adrenal, intravascular, breast or uterine. The CNS-IPI (Schmitz, JCO 2016) was developed in 2,164 patients treated with R-CHOP in the German High-Grade NHL Study Group and validated in 1,597 DLBCL patients from the British Columbia registry; it adds kidney and/or adrenal involvement to the five IPI factors. Two-year CNS disease rates: 0.6% for score 0-1 (low), 3.4% for 2-3 (intermediate), 10% for 4 or more (high). Whether prophylaxis works is a separate question from who is at risk:</p>\n<ul><li>Routine CNS prophylaxis is not supported. End-of-treatment high-dose methotrexate (two cycles of 3–3.5 g/m²) may be considered only for highly selected younger patients at ultra-high risk, such as CNS-IPI 5–6 or multiple/high-risk extranodal sites; this is a weak [IV,C] recommendation (<a class=\"trial-link\" href=\"/evidence/#t-esmo-lymphomas-guideline-eyre-et-al\">ESMO Lymphomas Guideline (Eyre et al.)</a>).</li><li>The largest analysis is <a class=\"trial-link\" href=\"/evidence/#t-lewis-international-cns-prophylaxis-study-group\">Lewis (International CNS Prophylaxis Study Group)</a>: 2,418 high-risk patients, 425 given high-dose methotrexate. Analysed from diagnosis it appeared to lower CNS progression (adjusted HR 0.59, p=0.014), but the estimate is inflated by immortal-time bias; confined to the 1,616 patients in complete response at the end of induction, the association no longer stands (adjusted HR 0.74, 95% CI 0.4-1.3, p=0.30; adjusted 5-year CNS progression 5.0% vs 6.5%), with neither dose nor timing separating (J Clin Oncol 2023;41:5376-5387).</li><li>IT methotrexate stays in CSF, penetrates brain tissue poorly and does not prevent parenchymal relapse; a systematic review suggested no benefit, on poor-quality evidence (Eyre et al., Haematologica 2020). It may still be considered for older patients with high-risk disease who are unfit for IV methotrexate.</li></ul>\n<h2 id=\"s-radiotherapy-for-bulky-disease\">Radiotherapy for bulky disease</h2>\n<p>RICOVER-noRTh, an amendment cohort of RICOVER-60&#x27;s 6x R-CHOP-14 arm (n=164), compared involved-field radiotherapy against no radiotherapy to sites of bulky disease (7.5 cm or more) on CT-based imaging: radiotherapy improved PFS and OS, so consolidation can be considered for bulky disease, but there is no randomised evidence that involved-field radiotherapy improves outcomes in the PET-CT era (Held et al., JCO 2014). A population-based analysis of advanced DLBCL treated with R-CHOP and assessed by PET-CT (Freeman et al., Blood 2021) found 72% achieved complete metabolic response, with 3-year time to progression of 83% and OS of 87%, and baseline bulk of 10 cm or more did not appear to affect outcome within the complete responders. Of those not in complete metabolic response, 53% received radiotherapy and their outcomes matched the PET-negative cohort (3-year time to progression 76%, OS 80%); the poorest outcomes were in non-responders who did not receive radiotherapy, yet 30% of that group never relapsed, so radiotherapy consolidation may overtreat. BCSH 2024 advises considering radiotherapy consolidation for bulky disease patient by patient: for example, radiotherapy for an older patient with bulky disease who would not tolerate relapse treatment, against omission in a young patient facing decades of late radiotherapy effects.</p>\n<h2 id=\"s-dlbcl-in-older-patients\">DLBCL in older patients</h2>\n<p>Treatment decisions rest on comprehensive geriatric assessment, covering comorbid conditions and functional status. R-miniCHOP attenuates the chemotherapy while keeping full-dose rituximab <a class=\"trial-link\" href=\"/evidence/#t-lnh03-7b-r-minichop\">LNH03-7B (R-miniCHOP)</a>:</p>\n<ul><li>Rituximab 375 mg/m² <a class=\"trial-link\" href=\"/evidence/#t-lnh03-7b-r-minichop\">LNH03-7B (R-miniCHOP)</a>.</li><li>Cyclophosphamide 400 mg/m² (instead of 750) <a class=\"trial-link\" href=\"/evidence/#t-lnh03-7b-r-minichop\">LNH03-7B (R-miniCHOP)</a>.</li><li>Doxorubicin 25 mg/m² (instead of 50) <a class=\"trial-link\" href=\"/evidence/#t-lnh03-7b-r-minichop\">LNH03-7B (R-miniCHOP)</a>.</li><li>Vincristine 1 mg flat (instead of 1.4 mg/m²) <a class=\"trial-link\" href=\"/evidence/#t-lnh03-7b-r-minichop\">LNH03-7B (R-miniCHOP)</a>.</li><li>Prednisone 40 mg/m² (instead of 100 mg flat) <a class=\"trial-link\" href=\"/evidence/#t-lnh03-7b-r-minichop\">LNH03-7B (R-miniCHOP)</a>.</li></ul>\n<p><a class=\"trial-link\" href=\"/evidence/#t-lnh03-7b-r-minichop\">LNH03-7B (R-miniCHOP)</a>, a single-arm phase 2 in 150 patients over 80 (median age 83), reported median OS 29 months, 2-year OS 59% and 2-year PFS 47%; toxicity was not trivial, with 18% dying during treatment and 12 deaths attributed to treatment, and there is no comparator establishing that attenuation preserves efficacy (Lancet Oncol 2011;12:460-468). A successor LYSA phase 2 (120 patients over 80) added a pre-phase of oral vincristine 1 mg on day -7 and prednisone 60 mg for 4 days before cycle 1, then gave ofatumumab-miniCHOP: 2-year PFS 47% and OS 65% (Peyrade et al., Lancet Haematol 2017).</p>\n<p>SENIOR, a phase 3 RCT in 249 patients over 80, added lenalidomide to R-miniCHOP and found no benefit (2-year OS 66% vs 65.7%; 2-year PFS 56.2% vs 54.8%).</p>\n<h2 id=\"s-the-anthracycline-unfit-patient\">The anthracycline-unfit patient</h2>\n<p>Refer to cardio-oncology for optimisation of cardiac function where possible. Non-anthracycline options:</p>\n<ul><li>R-GCVP, substituting gemcitabine for doxorubicin: a single-arm phase 2 in 62 anthracycline-unfit patients gave 2-year PFS 50% and OS 56% (Fields et al., JCO 2014).</li></ul>\n<ul><li>R-CEOP, substituting etoposide for doxorubicin: a retrospective case-matched analysis of 70 patients reported similar 10-year time to progression and disease-specific survival (53% vs 62%) but lower 10-year OS (30% vs 49%), reflecting the impact of the comorbidity and frailty that made these patients anthracycline-unfit (Alden et al., Blood Advances 2021).</li></ul>\n<h2 id=\"s-double-hit-and-double-expressor-disease\">Double-hit and double-expressor disease</h2>\n<p>Double-hit lymphoma is identified by FISH: test for MYC rearrangement, and if rearranged add BCL2 FISH (<a class=\"trial-link\" href=\"/evidence/#t-esmo-lymphomas-guideline-eyre-et-al\">ESMO Lymphomas Guideline (Eyre et al.)</a>). The standard options of R-CHOP and pola-R-CHP remain available. More intensive options:</p>\n<ul><li>(DA-)R-EPOCH, with etoposide, doxorubicin and vincristine infused over 96 hours. A meta-analysis found R-EPOCH improved PFS over R-CHOP (22.2 vs 12.1 months) but not OS (31 vs 21 months) (Howlett et al., Br J Haematol 2015). In unselected untreated DLBCL, <a class=\"trial-link\" href=\"/evidence/#t-calgb-alliance-50303\">CALGB/Alliance 50303</a> showed no PFS or OS difference between DA-EPOCH-R and R-CHOP, and its double-expressor subset (MYC 40% or more and BCL2 50% or more by IHC) did not benefit.</li><li>R-CODOX-M/R-IVAC.</li></ul>\n<p>Double-expressor disease, MYC and BCL2 over-expressed by immunohistochemistry without the rearrangements, is a different entity, and <a class=\"trial-link\" href=\"/evidence/#t-deb\">DEB</a> is its first dedicated phase 3: adding the HDAC inhibitor tucidinostat to R-CHOP (double-hit excluded by protocol) met its primary endpoint of event-free survival (2-year 60.3% vs 50.5%; HR 0.72, 95% CI 0.54-0.96, p=0.02) on a higher complete-response rate (73.0% vs 61.8%). The trial was not designed to test survival endpoints, each of which ran the same way on an interval crossing 1, the toxicity concentrates in the maintenance phase (grade 3 or higher 77.4% vs 39.1%), and it was conducted entirely in China (JAMA 2026;335:1684-1693).</p>\n<h2 id=\"s-relapsed-or-refractory-dlbcl\">Relapsed or refractory DLBCL</h2>\n<p>Assess transplant and CAR T-cell suitability individually using performance status, comorbidity, organ function, disease tempo and treatment goals. The benchmark for refractory disease is <a class=\"trial-link\" href=\"/evidence/#t-scholar-1\">SCHOLAR-1</a>: before CAR T-cell therapy, refractory DLBCL responded to the next line in 26% (complete response 7%) with median OS 6.3 months and 20% alive at 2 years, pooled from 2 phase 3 trials and 2 institutional cohorts (Blood 2017;130:1800-1808). This is the population in which the CAR T-cell trials changed practice.</p>\n<h3>Refractory disease and early relapse in fit patients</h3>\n<p>Anti-CD19 CAR T-cell therapy is the second-line standard for disease refractory to first-line therapy or relapsing within 12 months; the current ESMO guideline names axicabtagene ciloleucel or lisocabtagene maraleucel here (<a class=\"trial-link\" href=\"/evidence/#t-esmo-lymphomas-guideline-eyre-et-al\">ESMO Lymphomas Guideline (Eyre et al.)</a>). Lymphodepletion is product-specific: axi-cel in ZUMA-7 used cyclophosphamide 500 mg/m²/day plus fludarabine 30 mg/m²/day on days −5 to −3 (<a class=\"trial-link\" href=\"/evidence/#t-zuma-7\">ZUMA-7</a>), whereas liso-cel in TRANSFORM used cyclophosphamide 300 mg/m²/day plus fludarabine 30 mg/m²/day for three days (<a class=\"trial-link\" href=\"/evidence/#t-transform\">TRANSFORM</a>).</p>\n<ul><li><a class=\"trial-link\" href=\"/evidence/#t-zuma-7\">ZUMA-7</a> randomised 359 such patients, all intended for transplant, to axicabtagene ciloleucel or platinum-based salvage with transplant in responders. Axi-cel improved event-free survival (median 8.3 vs 2.0 months; HR 0.40; 24-month EFS 41% vs 16%) and response (ORR 83% vs 50%, CR 65% vs 32%); at the interim analysis overall survival had not reached significance (HR 0.73, 95% CI 0.53-1.01), with 56% of the standard-care arm receiving cellular immunotherapy off protocol and only 36% reaching transplant (N Engl J Med 2022;386:640-654).</li><li><a class=\"trial-link\" href=\"/evidence/#t-transform\">TRANSFORM</a> tested lisocabtagene maraleucel in the same setting (184 patients): EFS median 10.1 vs 2.3 months (HR 0.35), CR 66% vs 39%; overall survival favoured liso-cel but the data are immature (HR 0.51, 95% CI 0.26-1.00, an interval reaching 1), with heavy crossover (Lancet 2022;399:2294-2308).</li><li><a class=\"trial-link\" href=\"/evidence/#t-belinda\">BELINDA</a> is the negative member of the class: tisagenlecleucel missed its primary endpoint (EFS median 3.0 months in both arms; HR 1.07). The failure looks like delivery rather than the drug: median leukapheresis-to-infusion was 52 days, 83% needed bridging chemotherapy, and 26% had already progressed before the week-6 assessment (N Engl J Med 2022;386:629-639).</li></ul>\n<h3>Late relapse in fit patients</h3>\n<p>Chemosensitive late relapse in transplant-fit patients proceeds to salvage chemoimmunotherapy and autologous transplant after a complete metabolic response or Deauville-4 partial metabolic response (<a class=\"trial-link\" href=\"/evidence/#t-esmo-lymphomas-guideline-eyre-et-al\">ESMO Lymphomas Guideline (Eyre et al.)</a>). <a class=\"trial-link\" href=\"/evidence/#t-parma\">PARMA</a> established the strategy in the pre-rituximab era: transplantation improved 5-year EFS (46% vs 12%) and OS (53% vs 32%), and chemosensitivity is the gate the whole approach rests on, with 5-year OS 42% in randomised (DHAP-responding) patients against 11% in never-responders (N Engl J Med 1995;333:1540-1545). Salvage regimen choice depends on comorbidities, CNS involvement and setting; the options include R-ICE, R-GDP and R-DHAP.</p>\n<ul><li><a class=\"trial-link\" href=\"/evidence/#t-coral\">CORAL</a> found R-ICE and R-DHAP interchangeable before transplant (3-year EFS 26% vs 35%, no significant difference on any measure). Three-year EFS was lower after prior rituximab (21% vs 47% without) and in refractory disease or relapse within 12 months (20% vs 45%) (J Clin Oncol 2010;28:4184-4190).</li><li><a class=\"trial-link\" href=\"/evidence/#t-ncic-ctg-ly-12\">NCIC-CTG LY.12</a> found GDP delivered the same response (45% vs 44%) and transplantation rate as DHAP with lower toxicity and hospitalisation (47% vs 99%) (J Clin Oncol 2014;32:3490-3496).</li><li><a class=\"trial-link\" href=\"/evidence/#t-hovon-44\">HOVON 44</a> showed that adding rituximab to reinduction improved disease control (24-month failure-free survival 50% vs 24%) but not overall survival, in a largely rituximab-naive relapse population that no longer exists (Blood 2008;111:537-543).</li></ul>\n<p>A partial response to salvage can still go to transplant, CAR T-cell therapy (tisagenlecleucel or axicabtagene ciloleucel) or a clinical trial.</p>\n<h3>Transplant-ineligible patients: CAR T-cell therapy</h3>\n<p>For transplant-ineligible patients without prior CAR T-cell exposure:</p>\n<ul><li><a class=\"trial-link\" href=\"/evidence/#t-alycante\">ALYCANTE</a> (axicabtagene ciloleucel, second line, 69 patients, median age 70): complete metabolic response at 3 months 71% (investigator-assessed; central review 66%), median PFS 11.8 months; non-relapse mortality was 10%, every fatal event an infection beyond 2 months after infusion (Nat Med 2023;29:2593-2601).</li><li><a class=\"trial-link\" href=\"/evidence/#t-pilot\">PILOT</a> (lisocabtagene maraleucel, second line, median age 74): ORR 80% with CR 54% among those infused; severe CRS and neurological events were uncommon but grade 3 or higher cytopenias persisted at day 28 in 30% (Lancet Oncol 2022;23:1066-1077).</li></ul>\n<p>In third line and beyond, the registrational CAR T-cell studies:</p>\n<ul><li><a class=\"trial-link\" href=\"/evidence/#t-zuma-1\">ZUMA-1</a> (axicabtagene ciloleucel): investigator-assessed ORR 82% (independent review gave a lower 71%) with CR 54%, median OS not reached with 52% alive at 18 months, in a population whose historical median survival is about 6 months. CRS occurred in 93% (grade 3 or higher 13%) and neurological events in 64% (28% grade 3 or higher); an early partial response should be observed rather than consolidated, since 23 patients converted to complete response without further therapy (N Engl J Med 2017;377:2531-2544).</li><li><a class=\"trial-link\" href=\"/evidence/#t-juliet\">JULIET</a> (tisagenlecleucel): ORR 52% with CR 40% among those evaluated; 111 of 165 enrolled were infused at a median 54 days. Among responders, 65% were relapse-free at 12 months (N Engl J Med 2019;380:45-56).</li><li><a class=\"trial-link\" href=\"/evidence/#t-transcend-nhl-001\">TRANSCEND NHL 001</a> (lisocabtagene maraleucel): ORR 73% with CR 53% among those infused and evaluable, with low rates of severe CRS (grade 3 or higher 2%) and neurotoxicity (10%) (Lancet 2020;396:839-852). CRS grading scales differ across these trials, so toxicity rates are not directly comparable.</li></ul>\n<h3>Bispecific antibodies</h3>\n<p>The bispecifics in DLBCL are CD20xCD3 T-cell engagers given with step-up dosing in cycle 1 to mitigate cytokine release syndrome.</p>\n<ul><li><a class=\"trial-link\" href=\"/evidence/#t-starglo\">STARGLO</a>: glofitamab plus GemOx against R-GemOx in transplant-ineligible relapsed/refractory DLBCL (transformed disease and double/triple-hit excluded) prolonged survival, the primary endpoint (median OS 25.5 vs 12.9 months, HR 0.62; median PFS 13.8 vs 3.6 months, HR 0.40; CR 59% vs 25%). Glofitamab is fixed-duration, stopping at 12 cycles, after obinutuzumab pre-treatment and 2.5/10/30 mg step-up with dexamethasone premedication; CRS occurred in 44% (grade 3 in 2%), and grade 3 or higher adverse events in 78% vs 41% (Lancet 2024;404:1940-1954).</li><li>Epcoritamab plus GemOx (EPCORE NHL-2, phase 1b/2, single-arm) gave ORR 85%, median PFS 11.2 months and median OS 21.6 months, with transformed DLBCL (23%) and double/triple-hit disease (10%) allowed; CRS 52%.</li><li><a class=\"trial-link\" href=\"/evidence/#t-sunmo\">SUNMO</a>: subcutaneous mosunetuzumab plus polatuzumab against R-GemOx, fixed at 8 cycles without hospitalisation (prior polatuzumab allowed only for late relapse), improved both primary endpoints (ORR 70% vs 40%; median PFS 11.5 vs 3.8 months, HR 0.41); overall survival has not separated at the interim analysis (median 18.7 vs 13.6 months; HR 0.80, 95% CI 0.5-1.2), and CRS was infrequent (26%, grade 3 in 0.7%) (J Clin Oncol 2025;43:3799-3811).</li></ul>\n<p>As later-line monotherapy:</p>\n<ul><li><a class=\"trial-link\" href=\"/evidence/#t-glofitamab-pivotal-np30179\">Glofitamab pivotal (NP30179)</a>: fixed-duration glofitamab gave CR 39% and ORR 52% by independent review among all 155 enrolled; among the third with prior CAR T-cell therapy the CR rate was 35%; median duration of complete response was not reached, and CRS occurred in 63% (grade 3 or higher 4%) (N Engl J Med 2022;387:2220-2231).</li><li><a class=\"trial-link\" href=\"/evidence/#t-epcore-nhl-1\">EPCORE NHL-1</a>: subcutaneous epcoritamab, given until progression, gave ORR 63% and CR 39%, with ORR 54% after prior CAR T-cell therapy; CRS 50% (grade 3 in 2.5%), almost all after the first full dose (J Clin Oncol 2023;41:2238-2247).</li><li><a class=\"trial-link\" href=\"/evidence/#t-elm-2\">ELM-2</a>: odronextamab gave ORR 52% and CR 32% (median duration of response 17.9 months among complete responders), but prior CAR T-cell therapy was a protocol exclusion, so it says nothing about that setting. Grade 3 or higher infection occurred in 39%, with 15 deaths from infection (Nat Cancer 2025;6:528-539).</li></ul>\n<h3>Other antibody-based options</h3>\n<ul><li>Tafasitamab (anti-CD19) plus lenalidomide: <a class=\"trial-link\" href=\"/evidence/#t-l-mind\">L-MIND</a>, single-arm in transplant-ineligible patients after 1-3 prior lines with primary refractory disease excluded, gave ORR 60% and CR 43%, with median duration of response 21.7 months and median PFS 12.1 months (Lancet Oncol 2020;21:978-988). <a class=\"trial-link\" href=\"/evidence/#t-re-mind2\">RE-MIND2</a>, the sponsor&#x27;s matched real-world comparison, benchmarked conventional therapy at median OS 9.9-11.6 months in this population; its comparisons favour tafasitamab-lenalidomide but score response differently on each side and are not randomised evidence (Clin Cancer Res 2022;28:4003-4017).</li><li>Polatuzumab plus bendamustine-rituximab: <a class=\"trial-link\" href=\"/evidence/#t-go29365\">GO29365</a> roughly doubled complete response (40% vs 18%) and more than doubled survival (median OS 12.4 vs 4.7 months, HR 0.42) against bendamustine-rituximab, on 40 patients per arm in a trial never powered to prove superiority, so the effect size is an estimate (J Clin Oncol 2020;38:155-165).</li><li>Pola-R-GemOx: <a class=\"trial-link\" href=\"/evidence/#t-polargo\">POLARGO</a> improved overall survival over R-GemOx in patients ineligible for transplant and CAR T-cell therapy (median OS 19.5 vs 12.5 months, HR 0.60; median PFS 7.4 vs 2.7 months), as a bendamustine-free alternative to pola-BR that may preserve CAR T-cell eligibility (J Clin Oncol 2026, online ahead of print).</li><li>L
