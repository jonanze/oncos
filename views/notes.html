"trial-link\" href=\"/evidence/#t-von-pawel\">von Pawel</a>. <a href=\"https://drive.google.com/file/d/12WbY4EMlY25CCE4fsx-ZaxZm8sM4EKCJ/preview\">J Clin Oncol 1999;17:658-667</a></li>\n<li id=\"ref-lung-small-cell-lung-cancer-ext-914887c47323\"><a href=\"https://ascopubs.org/doi/abs/10.1200/jco.2006.06.5821\" rel=\"noopener\" target=\"_blank\">Oral topotecan versus supportive care trial</a></li>\n<li id=\"ref-lung-small-cell-lung-cancer-ext-11dff893caa1\"><a href=\"https://ascopubs.org/doi/abs/10.1200/jco.2006.08.3998\" rel=\"noopener\" target=\"_blank\">Oral versus intravenous topotecan trial</a></li>\n<li id=\"ref-lung-small-cell-lung-cancer-ext-a1604a0b10de\"><a href=\"https://pubmed.ncbi.nlm.nih.gov/27312053/\" rel=\"noopener\" target=\"_blank\">JCOG0605 randomized phase III trial</a></li>\n<li id=\"ref-lung-small-cell-lung-cancer-t-gfpc-01-13\"><a class=\"trial-link\" href=\"/evidence/#t-gfpc-01-13\">GFPC 01-13</a>. <a href=\"https://drive.google.com/file/d/12JBJRxhSRDvyIFFxxqRbLWTlRjIrgd5j/preview\">Lancet Oncol 2020;21:1224-1233</a></li>\n<li id=\"ref-lung-small-cell-lung-cancer-t-bl-b01d1-101-iza-bren-es-sclc\"><a class=\"trial-link\" href=\"/evidence/#t-bl-b01d1-101-iza-bren-es-sclc\">BL-B01D1-101 (iza-bren ES-SCLC)</a>. <a href=\"https://drive.google.com/file/d/1T5Nt0VUu_54c3p2SohyvDxMhryoJ-VQ0/preview\">J Clin Oncol 2026 (online ahead of print; JCO-26-00243)</a></li>\n<li id=\"ref-lung-small-cell-lung-cancer-ext-9fc6eceed364\"><a href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC10425483/\" rel=\"noopener\" target=\"_blank\">SEOM-GECP SCLC guideline</a></li>\n<li id=\"ref-lung-small-cell-lung-cancer-ext-42c8d1d7e6dc\"><a href=\"https://ascopubs.org/doi/10.1200/JOP.19.00722\" rel=\"noopener\" target=\"_blank\">ASCO lung cancer surveillance guideline</a></li>\n</ol>", "_hay": "small cell lung cancer small-cell-lung-cancer lung at a glance diagnosis, biology, and staging limited-stage disease small node-negative tumours stage ii–iii chemoradiotherapy consolidation durvalumab prophylactic cranial irradiation extensive-stage disease first-line systemic therapy immediate complications and supportive care maintenance after induction thoracic radiotherapy after systemic therapy pci or mri surveillance relapsed or refractory disease reassess before choosing treatment tarlatamab lurbinectedin, topotecan, and other chemotherapy investigational antibody–drug conjugates follow-up and survivorship references evidence supporting the surgical pathway choose the thoracic radiotherapy schedule evidence for durvalumab atezolizumab does not establish a consolidation class effect select the platinum place the cytotoxic backbone in context add a survival-positive checkpoint inhibitor consider regional and selected alternatives evidence for lurbinectedin plus atezolizumab do not extrapolate across maintenance strategies evidence before checkpoint inhibition evidence with atezolizumab maintenance select patients narrowly evidence without mandated baseline mri evidence with mri surveillance randomized evidence earlier single-arm evidence deliver tarlatamab safely lurbinectedin topotecan and selected single agents platinum rechallenge"}, {"id": "lymphoma-diffuse-large-b-cell-lymphoma", "slug": "diffuse-large-b-cell-lymphoma", "group": "Lymphoma", "title": "Diffuse large B-cell lymphoma", "updated": "", "sections": [{"id": "s-classification-and-cell-of-origin", "h": "Classification and cell of origin", "depth": 2}, {"id": "s-staging", "h": "Staging", "depth": 2}, {"id": "s-response-assessment", "h": "Response assessment", "depth": 2}, {"id": "s-prognostic-indices", "h": "Prognostic indices", "depth": 2}, {"id": "s-clinical-presentation", "h": "Clinical presentation", "depth": 2}, {"id": "s-work-up", "h": "Work-up", "depth": 2}, {"id": "s-tumour-lysis-syndrome", "h": "Tumour lysis syndrome", "depth": 2}, {"id": "s-limited-stage-dlbcl-stage-i-ii", "h": "Limited-stage DLBCL (stage I–II)", "depth": 2}, {"id": "s-r-chop-delivery", "h": "R-CHOP delivery", "depth": 2}, {"id": "s-advanced-stage-dlbcl-stage-ii-bulky-to-iv", "h": "Advanced-stage DLBCL (stage II bulky to IV)", "depth": 2}, {"id": "s-attempts-to-improve-on-r-chop", "h": "Attempts to improve on R-CHOP", "depth": 3}, {"id": "s-pola-r-chp", "h": "Pola-R-CHP", "depth": 3}, {"id": "s-upfront-transplant-consolidation", "h": "Upfront transplant consolidation", "depth": 3}, {"id": "s-cns-prophylaxis", "h": "CNS prophylaxis", "depth": 2}, {"id": "s-radiotherapy-for-bulky-disease", "h": "Radiotherapy for bulky disease", "depth": 2}, {"id": "s-dlbcl-in-older-patients", "h": "DLBCL in older patients", "depth": 2}, {"id": "s-the-anthracycline-unfit-patient", "h": "The anthracycline-unfit patient", "depth": 2}, {"id": "s-double-hit-and-double-expressor-disease", "h": "Double-hit and double-expressor disease", "depth": 2}, {"id": "s-relapsed-or-refractory-dlbcl", "h": "Relapsed or refractory DLBCL", "depth": 2}, {"id": "s-refractory-disease-and-early-relapse-in-fit-patients", "h": "Refractory disease and early relapse in fit patients", "depth": 3}, {"id": "s-late-relapse-in-fit-patients", "h": "Late relapse in fit patients", "depth": 3}, {"id": "s-transplant-ineligible-patients-car-t-cell-therapy", "h": "Transplant-ineligible patients: CAR T-cell therapy", "depth": 3}, {"id": "s-bispecific-antibodies", "h": "Bispecific antibodies", "depth": 3}, {"id": "s-other-antibody-based-options", "h": "Other antibody-based options", "depth": 3}, {"id": "s-references", "h": "References", "depth": 2}], "html": "<h2 id=\"s-classification-and-cell-of-origin\">Classification and cell of origin</h2>\n<p>B-cell non-Hodgkin lymphomas arise from a non-malignant counterpart in normal B-lymphoid development, and recapitulate the characteristic morphological, phenotypic and gene-expression features of that counterpart with some aberrancy. This cell-of-origin concept is fundamental to the classification of B-cell lymphomas. Current classification follows the International Consensus Classification (ICC) and the WHO 5th edition. The major categories:</p>\n<ul><li class=\"evidence-prose\">Precursor lymphoid neoplasms: B- and T-cell acute lymphoblastic leukaemia / lymphoblastic lymphoma, both aggressive.</li><li class=\"evidence-prose\">Mature B-cell neoplasms: chronic lymphocytic leukaemia / small lymphocytic lymphoma, lymphoplasmacytic lymphoma, the monoclonal gammopathies and plasma cell neoplasms (including multiple myeloma), hairy cell leukaemia, marginal zone lymphoma (CD5- and CD10-negative), follicular lymphoma, mantle cell lymphoma (usually CD10-negative), DLBCL, and the high-grade B-cell lymphomas.</li><li class=\"evidence-prose\">Hodgkin lymphoma: classic Hodgkin lymphoma and nodular lymphocyte-predominant Hodgkin lymphoma, an uncommon, favourable-prognosis category.</li><li class=\"evidence-prose\">Mature T/NK-cell neoplasms: peripheral T-cell lymphoma and its relatives, including primary cutaneous forms.</li></ul>\n<p>Within the mature B-cell group, classic follicular lymphoma carries the t(14;18)/IGH::BCL2 fusion, and follicular lymphoma grade 3B behaves like DLBCL. Burkitt lymphoma is highly aggressive and rapidly growing, with endemic, sporadic and immunodeficiency-associated forms.</p>\n<p>The non-Hodgkin lymphomas split by behaviour and cytology:</p>\n<ul><li>Indolent, small B-cell: follicular, mantle cell and marginal zone lymphoma.</li><li>Aggressive, large B-cell: DLBCL and Burkitt lymphoma.</li></ul>\n<p>Many B-cell lymphomas express CD19 and CD20. The characteristic genetic and immunohistochemical markers:</p>\n<ul><li>Follicular lymphoma: t(14;18); BCL2 and BCL6 positive.</li><li>Mantle cell lymphoma: t(11;14)(q13;q32); BCL2, cyclin D1 and SOX11 positive.</li><li>Marginal zone lymphoma: t(11;18) in MALT lymphoma; BCL2 positive.</li><li>Burkitt lymphoma: BCL2 negative.</li></ul>\n<p>Three further immunohistochemical markers matter in routine practice: Ki67 as the proliferative index, CD5 for its prognostic significance, and MYC with BCL2 protein expression. Assess MYC and BCL2 protein expression by immunohistochemistry, but identify double-hit disease by FISH: test for a MYC rearrangement and, if present, add BCL2 FISH (<a class=\"trial-link\" href=\"/evidence/#t-esmo-lymphomas-guideline-eyre-et-al\">ESMO Lymphomas Guideline (Eyre et al.)</a>). DLBCL divides by cell of origin into germinal-centre B-cell-like (GCB) and activated B-cell-like (ABC, non-GCB) disease, with the better prognosis in GCB. The split was established by gene-expression profiling: <a class=\"trial-link\" href=\"/evidence/#t-alizadeh-et-al-lymphochip\">Alizadeh et al. (Lymphochip)</a> separated GCB from ABC disease by unsupervised clustering and the division tracked survival after comparable anthracycline-based chemotherapy (76% vs 16% alive at 5 years across the 40 patients with survival data, nominal p=0.01), though the subgroups were derived post hoc from the expression data and no hazard ratio or multivariable model was reported (Nature 2000;403:503-511). The Hans immunohistochemical algorithm approximates the split, GCB when CD10-positive or BCL6-positive with MUM1-negative, non-GCB when CD10- and BCL6-negative or BCL6-positive with MUM1-positive, but published data on its prognostic effect are contradictory and it should not determine treatment. Cell of origin is prognostic in gene-expression studies, but cell-of-origin-directed frontline strategies have not improved outcomes.</p>\n<h2 id=\"s-staging\">Staging</h2>\n<p>Most non-Hodgkin lymphomas are staged by the Lugano classification, which takes the number and location of tumour sites from the Ann Arbor system. The operational rules:</p>\n<ul><li class=\"evidence-prose\">Bone marrow, liver, lung or CSF involvement is generally classified as stage IV.</li><li class=\"evidence-prose\">Constitutional symptoms are not incorporated into NHL staging, unlike classic Hodgkin lymphoma, because they are not independently prognostic; the A/B suffix is documented for Hodgkin lymphoma.</li><li class=\"evidence-prose\">Limited extranodal extension is marked with the subscript E.</li><li class=\"evidence-prose\">Disease involving the spleen counts as nodal rather than extranodal.</li></ul>\n<p>Bulky disease has no single definition; the cutoff varies by histology, 6 cm for follicular lymphoma and 6-10 cm for DLBCL.</p>\n<h2 id=\"s-response-assessment\">Response assessment</h2>\n<p>On CT, involvement means a nodal longest diameter above 1.5 cm or an extranodal lesion above 1 cm; on PET-CT it means increased uptake. The routinely PET-avid histologies are Hodgkin lymphoma, DLBCL, follicular lymphoma grade 3 and nodal marginal zone lymphoma; PET avidity is variable in follicular lymphoma grade 1-2, extranodal marginal zone lymphoma and CLL/SLL. Under Lugano response criteria, CT response uses the sum of the products of perpendicular diameters (SPD) of up to 6 target lesions, with measurable disease defined as a node of 1.5 cm or more in longest diameter:</p>\n<ul><li>Complete response: target nodes regress to 1.5 cm or less in longest diameter, with no extra-lymphatic disease.</li><li>Partial response: at least a 50% decrease in SPD.</li><li>Stable disease: less than a 50% decrease in SPD.</li></ul>\n<p>PET-CT response uses the Deauville score:</p>\n<ul><li>Complete response: score 1, 2 or 3.</li><li>Partial response: score 4 or 5 with reduced uptake from baseline.</li><li>Stable disease: score 4 or 5 with unchanged uptake.</li><li>Progression: score 4 or 5 with increased uptake, or a new lesion.</li></ul>\n<p>PET takes precedence: a PET-negative scan is a complete response even when a residual mass is visible on CT.</p>\n<h2 id=\"s-prognostic-indices\">Prognostic indices</h2>\n<p>The International Prognostic Index (IPI) has value across all categories of NHL.</p>\n<ul><li>IPI (five factors, APLES): age over 60, performance status 2 or more, LDH above normal, 2 or more extranodal sites, stage III-IV.</li><li>Age-adjusted IPI (PLS): performance status 2 or more, LDH above normal, stage III-IV.</li><li>Stage-modified IPI, for stage I-II disease (ALPS): age over 60, performance status 2 or more, LDH above normal, and non-bulky stage II.</li></ul>\n<p>Disease-specific indices exist alongside it, including the Follicular Lymphoma International Prognostic Index (FLIPI) and an NK/T-cell lymphoma index, as do treatment-specific scores. The CNS-IPI estimates the risk of CNS relapse.</p>\n<h2 id=\"s-clinical-presentation\">Clinical presentation</h2>\n<p>Aggressive NHL presents with a rapidly growing mass, constitutional symptoms and tumour lysis syndrome; indolent NHL with a slowly growing nodal mass, hepatomegaly, splenomegaly or cytopenias. Site-specific presentations: GI lymphoma with early satiety, anorexia, weight loss, vomiting or a tumour complication (perforation, obstruction, bleeding); primary CNS lymphoma with headache, seizures, paralysis, cord compression or meningitis; cutaneous lymphoma with rash, plaques, tumours or ulcers. The oncological emergencies of lymphoma include cord compression, lymphomatous meningitis, airway obstruction, pericardial tamponade, superior vena cava obstruction, tumour lysis syndrome and hypercalcaemia.</p>\n<h2 id=\"s-work-up\">Work-up</h2>\n<p>History and examination cover B symptoms (unexplained fever, weight loss, night sweats), lymphadenopathy including the tonsils and testes, personal or family history of lymphoma or other haematological malignancy, prior radiotherapy or chemotherapy, immunosuppression and organ transplantation, and associated disorders such as autoimmune disease and H. pylori chronic gastritis. Diagnosis and staging:</p>\n<ul><li>Tissue diagnosis usually requires an excisional node biopsy, to provide adequate tissue for histological, immunological and molecular assessment.</li><li>Histology, flow cytometry and cytogenetics, including MYC and BCL2 FISH to look for double-hit lymphoma.</li><li>PET-CT for staging.</li><li>Lumbar puncture and contrast-enhanced MRI of the brain (and spine if clinically indicated) when the CNS-IPI is high (4-6).</li></ul>\n<p>PET-CT is more likely than bone marrow biopsy to detect marrow involvement with large B-cell lymphoma, and non-avid marrow disease does not confer a worse prognosis (BCSH 2024). A 2014 meta-analysis put PET at moderate sensitivity (88.7%) and high specificity (99.8%) for marrow involvement; about 3% of patients with involvement on biopsy had a negative PET, while 13% with involvement on PET had a negative biopsy. Bone marrow aspiration can still be considered to look for transformation from an indolent lymphoma (though this does not change management in DLBCL), where cytopenias raise concern for MDS that would affect chemotherapy dosing, or where the result would change management, for example apparently localised disease planned for abbreviated treatment in which marrow involvement would upstage and change treatment. Pre-treatment evaluation: full blood count, liver and renal function, LDH, tumour lysis labs including CMP and G6PD (which may affect management), hepatitis serologies, and cardiac assessment with echocardiography.</p>\n<h2 id=\"s-tumour-lysis-syndrome\">Tumour lysis syndrome</h2>\n<p>Laboratory tumour lysis syndrome is defined by the Cairo-Bishop criteria; severity is graded on creatinine, cardiac arrhythmias and seizures.</p>\n<p>Prophylaxis:</p>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\">Rasburicase for high-risk cases, as a single dose of 0.2 mg/kg.</span><span class=\"evidence-detail\">Check G6PD first: rasburicase is contraindicated in deficiency, because urate degradation generates hydrogen peroxide that G6PD-deficient red cells cannot neutralise for lack of NADPH, causing oxidative stress, severe haemolytic anaemia and potentially fatal methaemoglobinaemia. Send the uric acid sample on ice, because ex vivo degradation of uric acid by rasburicase yields spuriously low serum levels and a failure to detect tumour lysis.</span></li><li class=\"evidence-prose\">Allopurinol for intermediate-risk cases, 100 mg/m² per dose every 8 hours (maximum 800 mg/day), checking HLA-B*5801 first.</li><li class=\"evidence-prose\">Give IV hydration according to renal and cardiac status and monitor urine output closely.</li></ul>\n<p>Treatment: rasburicase as a single 3-6 mg IV dose; phosphate binders for hyperphosphataemia; treat electrolyte abnormalities urgently, with IV calcium reserved for a specific clinical indication rather than an isolated low calcium result; Resonium and insulin for hyperkalaemia; haemodialysis for uraemia or severe electrolyte abnormalities.</p>\n<h2 id=\"s-limited-stage-dlbcl-stage-i-ii\">Limited-stage DLBCL (stage I–II)</h2>\n<p>Treatment is stratified by age, bulk and risk:</p>\n<ul><li class=\"evidence-prose\">Fit patients younger than 60 with IPI 0 and non-bulky disease (&lt;7.5 cm): four cycles of R-CHOP plus two further rituximab doses; this FLYER approach can also be considered at age 60–80 without additional risk factors (<a class=\"trial-link\" href=\"/evidence/#t-esmo-lymphomas-guideline-eyre-et-al\">ESMO Lymphomas Guideline (Eyre et al.)</a>).</li><li class=\"evidence-prose\">Fit patients younger than 80 with limited-stage bulky disease and aaIPI 0: after two cycles, give four total cycles of R-CHOP without further rituximab for CMR (Deauville 1–3), or six cycles plus ISRT for Deauville 4–5 (<a class=\"trial-link\" href=\"/evidence/#t-esmo-lymphomas-guideline-eyre-et-al\">ESMO Lymphomas Guideline (Eyre et al.)</a>).</li><li class=\"evidence-prose\">Limited-stage aaIPI ≥1: six cycles of R-CHOP; for IPI ≥2, six cycles of pola-R-CHP is an alternative; three to four cycles of R-CHOP plus ISRT is another option (<a class=\"trial-link\" href=\"/evidence/#t-esmo-lymphomas-guideline-eyre-et-al\">ESMO Lymphomas Guideline (Eyre et al.)</a>).</li><li class=\"evidence-prose\">Patients aged 80 or older: six cycles of R-miniCHOP (<a class=\"trial-link\" href=\"/evidence/#t-lnh03-7b-r-minichop\">LNH03-7B (R-miniCHOP)</a>).</li></ul>\n<p>Abbreviated therapy does not apply to selected high-risk extranodal involvement (kidneys or adrenals), patients who cannot receive full-dose R-CHOP, double-hit lymphoma, transformed disease, primary mediastinal B-cell lymphoma, or HIV-associated DLBCL. The trial base:</p>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\">SWOG S8736 randomised 401 patients with localised intermediate- or high-grade NHL to 3 cycles of CHOP with involved-field radiotherapy or 8 cycles of CHOP, and long-term follow-up showed no difference (median PFS 11.1 vs 12 years; median OS 13.7 vs 13 years, both non-significant).</span><span class=\"evidence-detail\">It generated the stage-modified IPI, in which a score of 0 predicts excellent outcomes.</span></li><li class=\"evidence-prose\">SWOG S0014, a single-arm phase 2 of 3 R-CHOP plus radiotherapy in 56 patients with localised disease and at least one stage-modified IPI risk factor, reported 5-year PFS of 77% falling to 58% at 10 years, so late relapses continue.</li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-mint\">MInT</a> randomised young patients (18-60, age-adjusted IPI 0-1) to 6 cycles of CHOP-like chemotherapy with or without rituximab.</span><span class=\"evidence-detail\">Adding rituximab raised 3-year EFS from 59% to 79% and 3-year OS from 84% to 93%; the trial stopped early for efficacy at its first interim analysis, so the figures likely flatter the benefit, and the widely quoted HR 0.44 (95% CI 0.34-0.59) comes from a multivariable model rather than the primary analysis (Lancet Oncol 2006;7:379-391). Its most favourable subgroup, age-adjusted IPI 0 and non-bulky, did well enough to raise the question of whether such patients could receive less chemotherapy.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-flyer\">FLYER</a> tested this approach in 592 patients aged 18-60 with stage I-II non-bulky disease (largest mass below 7.5 cm), normal LDH and performance status 0-1.</span><span class=\"evidence-detail\">Four cycles of R-CHOP plus 2 rituximab doses were non-inferior to 6 cycles for 3-year PFS (96% vs 94%; lower limit of the one-sided 95% CI 0%, against a -5.5% margin), with fewer non-haematological adverse events (Lancet 2019;394:2271-2281). Both arms received 6 rituximab doses. Only non-inferiority was tested, and the primary endpoint was changed from event-free to progression-free survival by protocol amendment after the first interim analysis.</span></li></ul>\n<p>PET-adapted strategies refine the same territory:</p>\n<ul><li class=\"evidence-prose\">LYSA/GOELAMS 02-03 (334 patients, stage I-II non-bulky below 7 cm) randomised radiotherapy after 4 cycles of R-CHOP-14 against R-CHOP alone in interim-PET complete responders: 5-year EFS 92% vs 89% and OS 96% vs 92%, both non-significant, so radiotherapy can be omitted when the PET after cycle 4 is negative; the design does not say whether interim PET allows less chemotherapy.</li><li class=\"evidence-prose\">LYSA LNH09-1B (650 patients, age-adjusted IPI 0, age 18-80) reduced treatment to 4 cycles of R-CHOP when the interim PET after cycle 2 was negative: 3-year PFS 92% vs 89% against 6 cycles, meeting the non-inferiority threshold, with 80% of the PET-adapted arm negative at interim PET.</li><li class=\"evidence-prose\">SWOG S1001 (132 patients, stage I-II non-bulky below 10 cm) gave one further cycle after a negative PET following cycle 3 (89% of patients): 5-year PFS 87% and OS 89%, but stage-modified IPI still stratified outcome (5-year PFS 97% for score 0, 86% for 1-2, 30% for 3), so it is inconclusive whether chemotherapy can be reduced or radiotherapy omitted in interim-PET-negative high-risk cases.</li></ul>\n<h2 id=\"s-r-chop-delivery\">R-CHOP delivery</h2>\n<p>Standard R-CHOP dosing:</p>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\">Rituximab 375 mg/m² IV day 1, starting at 50 mg/h and escalating in 50 mg/h increments.</span><span class=\"evidence-detail\">Adverse effects include hepatitis B and C reactivation, infections, infusion reactions and cytopenias.</span></li><li class=\"evidence-prose\">Cyclophosphamide 750 mg/m² IV day 1 over 30 minutes.</li><li class=\"evidence-prose\">Doxorubicin 50 mg/m² IV day 1 over 3-5 minutes.</li><li class=\"evidence-prose\">Vincristine dosing must follow the active local R-CHOP protocol, including its maximum-dose rule.</li><li class=\"evidence-prose\">Prednisolone 100 mg PO days 1-5.</li></ul>\n<p>Give co-trimoxazole (one double-strength tablet three times a week) and aciclovir (800 mg twice daily) as prophylaxis against Pneumocystis pneumonia and HSV/VZV reactivation.</p>\n<h2 id=\"s-advanced-stage-dlbcl-stage-ii-bulky-to-iv\">Advanced-stage DLBCL (stage II bulky to IV)</h2>\n<p>Six cycles of R-CHOP every 21 days is the standard of care; the current ESMO guideline keeps 6 R-CHOP as standard for IPI 0-1 and admits 6 cycles of pola-R-CHP as a first-line option for IPI 2 or more (<a class=\"trial-link\" href=\"/evidence/#t-esmo-lymphomas-guideline-eyre-et-al\">ESMO Lymphomas Guideline (Eyre et al.)</a>, Ann Oncol 2025). The backbone was settled in sequence:</p>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\">CHOP over intensified combinations.</span><span class=\"evidence-detail\">The SWOG comparison of CHOP against three second-generation regimens (m-BACOD, ProMACE-CytaBOM, MACOP-B) found no survival difference and more grade 5 adverse events with the intensified regimens (NEJM 1993).</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">Rituximab over chemotherapy alone.</span><span class=\"evidence-detail\"><a class=\"trial-link\" href=\"/evidence/#t-lnh-98-5-gela\">LNH-98.5 (GELA)</a> added rituximab to 8 cycles of CHOP in patients aged 60-80 and improved 2-year EFS (57% vs 38%, p&lt;0.001) and OS (70% vs 57%, p=0.007), holding at 5 years (OS 58% vs 45%). The primary report found no clinically meaningful increase in toxicity; it was the first trial to show that adding an antibody to chemotherapy improves survival in lymphoma (N Engl J Med 2002;346:235-242). <a class=\"trial-link\" href=\"/evidence/#t-mint\">MInT</a> extended the same result to younger good-prognosis patients on 6 cycles.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">Six cycles, not eight.</span><span class=\"evidence-detail\"><a class=\"trial-link\" href=\"/evidence/#t-ricover-60\">RICOVER-60</a>, a 2x2 factorial of 6 vs 8 cycles of CHOP-14 with or without rituximab in 1,222 patients aged 61-80, found rituximab drove the benefit and the extra cycles bought nothing: only 6 cycles of R-CHOP-14 improved 3-year OS against CHOP-14 (78.1% vs 67.7%, a gain of 10.4 points), while the 8-cycle rituximab arm sat 5.6 points below the 6-cycle arm, attributed to more treatment-associated deaths (Lancet Oncol 2008;9:105-116).</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">Every 21 days, not dose-dense.</span><span class=\"evidence-detail\"><a class=\"trial-link\" href=\"/evidence/#t-r-chop-14-v-21-ncri\">R-CHOP-14 v 21 (NCRI)</a> set out to show 6 cycles of R-CHOP-14 superior to 8 of R-CHOP-21 in 1,080 patients and did not: 2-year OS 82.7% vs 80.8% (HR 0.90, 95% CI 0.70-1.15), PFS HR 0.94, with treatment-related deaths 9 vs 3, a threefold numerical excess that did not reach significance (Lancet 2013;381:1817-1826). LNH03-6B asked the same question in patients aged 60-80 with age-adjusted IPI 1 or more (8 R-CHOP-14 vs 8 R-CHOP-21) and also found similar PFS and OS with more toxicity on the 14-day schedule. Rituximab has repeatedly erased chemotherapy advantages that existed before it, whether the variable was the schedule, an added cytotoxic or the dose intensity.</span></li></ul>\n<h3 id=\"s-attempts-to-improve-on-r-chop\">Attempts to improve on R-CHOP</h3>\n<p>Five phase 3 trials failed on their primary endpoint. REMoDL-B incorporated real-time cell-of-origin profiling, PHOENIX selected non-GCB disease and ROBUST selected ABC disease; GOYA and CALGB/Alliance 50303 were not cell-of-origin-selected.</p>\n<ul><li class=\"evidence-prose\"><a class=\"trial-link\" href=\"/evidence/#t-calgb-alliance-50303\">CALGB/Alliance 50303</a>: infusional DA-EPOCH-R did not improve PFS over R-CHOP (HR 0.93, p=0.65) and was substantially more toxic (J Clin Oncol 2019;37:1790-1799).</li><li class=\"evidence-prose\"><a class=\"trial-link\" href=\"/evidence/#t-goya\">GOYA</a>: substituting obinutuzumab for rituximab missed its primary endpoint (3-year PFS 69.6% vs 66.9%; HR 0.92, p=0.39) with more toxicity; a more potent anti-CD20 does not beat rituximab in DLBCL, unlike in CLL and follicular lymphoma (J Clin Oncol 2017;35:3529-3537).</li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-remodl-b\">REMoDL-B</a>: bortezomib added to R-CHOP after real-time gene-expression profiling missed its primary endpoint (30-month PFS HR 0.86, p=0.28).</span><span class=\"evidence-detail\">A 5-year reanalysis reported a nominal treatment-by-subtype interaction favouring ABC and molecular high-grade disease; grade 3 or higher neuropathy was 3.8% versus 2.2% and serious adverse events 50.7% versus 42.5%, so the signal remains hypothesis-generating (Lancet Oncol 2019;20:649-662).</span></li><li class=\"evidence-prose\"><a class=\"trial-link\" href=\"/evidence/#t-phoenix\">PHOENIX</a>: ibrutinib added to R-CHOP in non-GCB disease missed both co-primary endpoints; a prespecified exploratory age interaction showed benefit under 60 and numerical harm at 60 or over, tracking how much R-CHOP each group tolerated (J Clin Oncol 2019;37:1285-1295).</li><li class=\"evidence-prose\"><a class=\"trial-link\" href=\"/evidence/#t-robust\">ROBUST</a>: lenalidomide added to R-CHOP in prospectively selected ABC-type disease missed its primary endpoint (PFS HR 0.85, p=0.29) (J Clin Oncol 2021;39:1317-1328).</li></ul>\n<h3 id=\"s-pola-r-chp\">Pola-R-CHP</h3>\n<p>Polatuzumab vedotin is an anti-CD79b antibody-drug conjugate with an MMAE payload. <a class=\"trial-link\" href=\"/evidence/#t-polarix\">POLARIX</a> replaced vincristine with polatuzumab in 879 previously untreated patients aged 18-80 with IPI 2-5, 90% stage III-IV. Pola-R-CHP improved the primary endpoint of PFS (2-year 76.7% vs 70.2%; HR 0.73, 95% CI 0.57-0.95, p=0.02), and the advantage held at 5 years (64.9% vs 59.1%; HR 0.77, 0.62-0.97), but no statistically significant overall-survival advantage had been demonstrated at the 5-year analysis (82.3% vs 79.5%; HR 0.85, 95% CI 0.63-1.15) (N Engl J Med 2022;386:351-363; J Clin Oncol 2025;43:3698-3705). Fewer patients required a subsequent line over 5 years (25.5% vs 35.3%). Grade 3 or higher adverse events were similar (60.7% vs 59.8%), with more grade 3-4 febrile neutropenia (13.8% vs 8.0%).</p>\n<p>Subgroup analyses suggested more benefit with age over 60, IPI 3-5, ABC subtype and the absence of bulky disease; these are exploratory analyses carrying no interaction test, and the 5-year cell-of-origin split (ABC PFS HR 0.38 vs GCB 1.07) licenses no comparison between subtypes <a class=\"trial-link\" href=\"/evidence/#t-polarix\">POLARIX</a>. Two further additions have beaten R-CHOP on a surrogate endpoint without a demonstrated survival advantage to date. <a class=\"trial-link\" href=\"/evidence/#t-frontmind\">frontMIND</a> added tafasitamab and lenalidomide to R-CHOP in high-risk disease (IPI 3-5 or age-adjusted IPI 2-3) and met its primary endpoint (PFS HR 0.75, 95% CI 0.59-0.96, p=0.0194; 2-year PFS 71.1% vs 62.9%); overall survival was formally tested at the interim analysis and not met (HR 0.85, p=0.2703), with the authors calling the data immature, and grade 3 or higher events rose from 76% to 87% (Lancet 2026;407:2528-2541). It is an option in high-risk disease, not an established standard.</p>\n<h3 id=\"s-upfront-transplant-consolidation\">Upfront transplant consolidation</h3>\n<p><a class=\"trial-link\" href=\"/evidence/#t-swog-9704\">SWOG 9704</a> randomised high-intermediate and high-risk responders after 5 cycles of (R-)CHOP to upfront autologous transplant or 3 further cycles: 2-year PFS improved (69% vs 55%, p=0.005) but overall survival did not (74% vs 71%, p=0.30), and both were primary endpoints; effective salvage transplantation at relapse explains the gap, and only 150 of 225 randomised B-cell patients received rituximab (N Engl J Med 2013;369:1681-1690). Upfront transplant is therefore not standard consolidation.</p>\n<h2 id=\"s-cns-prophylaxis\">CNS prophylaxis</h2>\n<p>Consider baseline CNS screening, imaging plus CSF analysis, in high-risk patients (BCSH guidelines): CNS-IPI 4-6, three or more extranodal sites, or disease at specific sites, testicular, renal or adrenal, intravascular, breast or uterine. The CNS-IPI (Schmitz, JCO 2016) was developed in 2,164 patients treated with R-CHOP in the German High-Grade NHL Study Group and validated in 1,597 DLBCL patients from the British Columbia registry; it adds kidney and/or adrenal involvement to the five IPI factors. Two-year CNS disease rates: 0.6% for score 0-1 (low), 3.4% for 2-3 (intermediate), 10% for 4 or more (high). Whether prophylaxis works is a separate question from who is at risk:</p>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\">Routine CNS prophylaxis is not supported.</span><span class=\"evidence-detail\">End-of-treatment high-dose methotrexate (two cycles of 3–3.5 g/m²) may be considered only for highly selected younger patients at ultra-high risk, such as CNS-IPI 5–6 or multiple/high-risk extranodal sites; this is a weak [IV,C] recommendation (<a class=\"trial-link\" href=\"/evidence/#t-esmo-lymphomas-guideline-eyre-et-al\">ESMO Lymphomas Guideline (Eyre et al.)</a>).</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">The largest analysis is <a class=\"trial-link\" href=\"/evidence/#t-lewis-international-cns-prophylaxis-study-group\">Lewis (International CNS Prophylaxis Study Group)</a>: 2,418 high-risk patients, 425 given high-dose methotrexate.</span><span class=\"evidence-detail\">Analysed from diagnosis it appeared to lower CNS progression (adjusted HR 0.59, p=0.014), but the estimate is inflated by immortal-time bias; confined to the 1,616 patients in complete response at the end of induction, the association no longer stands (adjusted HR 0.74, 95% CI 0.4-1.3, p=0.30; adjusted 5-year CNS progression 5.0% vs 6.5%), with neither dose nor timing separating (J Clin Oncol 2023;41:5376-5387).</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">IT methotrexate stays in CSF, penetrates brain tissue poorly and does not prevent parenchymal relapse; a systematic review suggested no benefit, on poor-quality evidence (Eyre et al., Haematologica 2020).</span><span class=\"evidence-detail\">It may still be considered for older patients with high-risk disease who are unfit for IV methotrexate.</span></li></ul>\n<h2 id=\"s-radiotherapy-for-bulky-disease\">Radiotherapy for bulky disease</h2>\n<p>RICOVER-noRTh, an amendment cohort of RICOVER-60&#x27;s 6x R-CHOP-14 arm (n=164), compared involved-field radiotherapy against no radiotherapy to sites of bulky disease (7.5 cm or more) on CT-based imaging: radiotherapy improved PFS and OS, so consolidation can be considered for bulky disease, but there is no randomised evidence that involved-field radiotherapy improves outcomes in the PET-CT era (Held et al., JCO 2014). A population-based analysis of advanced DLBCL treated with R-CHOP and assessed by PET-CT (Freeman et al., Blood 2021) found 72% achieved complete metabolic response, with 3-year time to progression of 83% and OS of 87%, and baseline bulk of 10 cm or more did not appear to affect outcome within the complete responders. Of those not in complete metabolic response, 53% received radiotherapy and their outcomes matched the PET-negative cohort (3-year time to progression 76%, OS 80%); the poorest outcomes were in non-responders who did not receive radiotherapy, yet 30% of that group never relapsed, so radiotherapy consolidation may overtreat. BCSH 2024 advises considering radiotherapy consolidation for bulky disease patient by patient: for example, radiotherapy for an older patient with bulky disease who would not tolerate relapse treatment, against omission in a young patient facing decades of late radiotherapy effects.</p>\n<h2 id=\"s-dlbcl-in-older-patients\">DLBCL in older patients</h2>\n<p>Treatment decisions rest on comprehensive geriatric assessment, covering comorbid conditions and functional status. R-miniCHOP attenuates the chemotherapy while keeping full-dose rituximab <a class=\"trial-link\" href=\"/evidence/#t-lnh03-7b-r-minichop\">LNH03-7B (R-miniCHOP)</a>:</p>\n<ul><li>Rituximab 375 mg/m² <a class=\"trial-link\" href=\"/evidence/#t-lnh03-7b-r-minichop\">LNH03-7B (R-miniCHOP)</a>.</li><li>Cyclophosphamide 400 mg/m² (instead of 750) <a class=\"trial-link\" href=\"/evidence/#t-lnh03-7b-r-minichop\">LNH03-7B (R-miniCHOP)</a>.</li><li>Doxorubicin 25 mg/m² (instead of 50) <a class=\"trial-link\" href=\"/evidence/#t-lnh03-7b-r-minichop\">LNH03-7B (R-miniCHOP)</a>.</li><li>Vincristine 1 mg flat (instead of 1.4 mg/m²) <a class=\"trial-link\" href=\"/evidence/#t-lnh03-7b-r-minichop\">LNH03-7B (R-miniCHOP)</a>.</li><li>Prednisone 40 mg/m² (instead of 100 mg flat) <a class=\"trial-link\" href=\"/evidence/#t-lnh03-7b-r-minichop\">LNH03-7B (R-miniCHOP)</a>.</li></ul>\n<p><a class=\"trial-link\" href=\"/evidence/#t-lnh03-7b-r-minichop\">LNH03-7B (R-miniCHOP)</a>, a single-arm phase 2 in 150 patients over 80 (median age 83), reported median OS 29 months, 2-year OS 59% and 2-year PFS 47%; toxicity was not trivial, with 18% dying during treatment and 12 deaths attributed to treatment, and there is no comparator establishing that attenuation preserves efficacy (Lancet Oncol 2011;12:460-468). A successor LYSA phase 2 (120 patients over 80) added a pre-phase of oral vincristine 1 mg on day -7 and prednisone 60 mg for 4 days before cycle 1, then gave ofatumumab-miniCHOP: 2-year PFS 47% and OS 65% (Peyrade et al., Lancet Haematol 2017).</p>\n<p>SENIOR, a phase 3 RCT in 249 patients over 80, added lenalidomide to R-miniCHOP and found no benefit (2-year OS 66% vs 65.7%; 2-year PFS 56.2% vs 54.8%).</p>\n<h2 id=\"s-the-anthracycline-unfit-patient\">The anthracycline-unfit patient</h2>\n<p>Refer to cardio-oncology for optimisation of cardiac function where possible. Non-anthracycline options:</p>\n<ul><li class=\"evidence-prose\">R-GCVP, substituting gemcitabine for doxorubicin: a single-arm phase 2 in 62 anthracycline-unfit patients gave 2-year PFS 50% and OS 56% (Fields et al., JCO 2014).</li><li class=\"evidence-prose\">R-CEOP, substituting etoposide for doxorubicin: a retrospective case-matched analysis of 70 patients reported similar 10-year time to progression and disease-specific survival (53% vs 62%) but lower 10-year OS (30% vs 49%), reflecting the impact of the comorbidity and frailty that made these patients anthracycline-unfit (Alden et al., Blood Advances 2021).</li></ul>\n<h2 id=\"s-double-hit-and-double-expressor-disease\">Double-hit and double-expressor disease</h2>\n<p>Double-hit lymphoma is identified by FISH: test for MYC rearrangement, and if rearranged add BCL2 FISH (<a class=\"trial-link\" href=\"/evidence/#t-esmo-lymphomas-guideline-eyre-et-al\">ESMO Lymphomas Guideline (Eyre et al.)</a>). The standard options of R-CHOP and pola-R-CHP remain available. More intensive options:</p>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\">(DA-)R-EPOCH, with etoposide, doxorubicin and vincristine infused over 96 hours.</span><span class=\"evidence-detail\">A meta-analysis found R-EPOCH improved PFS over R-CHOP (22.2 vs 12.1 months) but not OS (31 vs 21 months) (Howlett et al., Br J Haematol 2015). In unselected untreated DLBCL, <a class=\"trial-link\" href=\"/evidence/#t-calgb-alliance-50303\">CALGB/Alliance 50303</a> showed no PFS or OS difference between DA-EPOCH-R and R-CHOP, and its double-expressor subset (MYC 40% or more and BCL2 50% or more by IHC) did not benefit.</span></li><li class=\"evidence-prose\">R-CODOX-M/R-IVAC.</li></ul>\n<p>Double-expressor disease, MYC and BCL2 over-expressed by immunohistochemistry without the rearrangements, is a different entity, and <a class=\"trial-link\" href=\"/evidence/#t-deb\">DEB</a> is its first dedicated phase 3: adding the HDAC inhibitor tucidinostat to R-CHOP (double-hit excluded by protocol) met its primary endpoint of event-free survival (2-year 60.3% vs 50.5%; HR 0.72, 95% CI 0.54-0.96, p=0.02) on a higher complete-response rate (73.0% vs 61.8%). The trial was not designed to test survival endpoints, each of which ran the same way on an interval crossing 1, the toxicity concentrates in the maintenance phase (grade 3 or higher 77.4% vs 39.1%), and it was conducted entirely in China (JAMA 2026;335:1684-1693).</p>\n<h2 id=\"s-relapsed-or-refractory-dlbcl\">Relapsed or refractory DLBCL</h2>\n<p>Assess transplant and CAR T-cell suitability individually using performance status, comorbidity, organ function, disease tempo and treatment goals. The benchmark for refractory disease is <a class=\"trial-link\" href=\"/evidence/#t-scholar-1\">SCHOLAR-1</a>: before CAR T-cell therapy, refractory DLBCL responded to the next line in 26% (complete response 7%) with median OS 6.3 months and 20% alive at 2 years, pooled from 2 phase 3 trials and 2 institutional cohorts (Blood 2017;130:1800-1808). This is the population in which the CAR T-cell trials changed practice.</p>\n<h3 id=\"s-refractory-disease-and-early-relapse-in-fit-patients\">Refractory disease and early relapse in fit patients</h3>\n<p>Anti-CD19 CAR T-cell therapy is the second-line standard for disease refractory to first-line therapy or relapsing within 12 months; the current ESMO guideline names axicabtagene ciloleucel or lisocabtagene maraleucel here (<a class=\"trial-link\" href=\"/evidence/#t-esmo-lymphomas-guideline-eyre-et-al\">ESMO Lymphomas Guideline (Eyre et al.)</a>). Lymphodepletion is product-specific: axi-cel in ZUMA-7 used cyclophosphamide 500 mg/m²/day plus fludarabine 30 mg/m²/day on days −5 to −3 (<a class=\"trial-link\" href=\"/evidence/#t-zuma-7\">ZUMA-7</a>), whereas liso-cel in TRANSFORM used cyclophosphamide 300 mg/m²/day plus fludarabine 30 mg/m²/day for three days (<a class=\"trial-link\" href=\"/evidence/#t-transform\">TRANSFORM</a>).</p>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-zuma-7\">ZUMA-7</a> randomised 359 such patients, all intended for transplant, to axicabtagene ciloleucel or platinum-based salvage with transplant in responders.</span><span class=\"evidence-detail\">Axi-cel improved event-free survival (median 8.3 vs 2.0 months; HR 0.40; 24-month EFS 41% vs 16%) and response (ORR 83% vs 50%, CR 65% vs 32%); at the interim analysis overall survival had not reached significance (HR 0.73, 95% CI 0.53-1.01), with 56% of the standard-care arm receiving cellular immunotherapy off protocol and only 36% reaching transplant (N Engl J Med 2022;386:640-654).</span></li><li class=\"evidence-prose\"><a class=\"trial-link\" href=\"/evidence/#t-transform\">TRANSFORM</a> tested lisocabtagene maraleucel in the same setting (184 patients): EFS median 10.1 vs 2.3 months (HR 0.35), CR 66% vs 39%; overall survival favoured liso-cel but the data are immature (HR 0.51, 95% CI 0.26-1.00, an interval reaching 1), with heavy crossover (Lancet 2022;399:2294-2308).</li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-belinda\">BELINDA</a> is the negative member of the class: tisagenlecleucel missed its primary endpoint (EFS median 3.0 months in both arms; HR 1.07).</span><span class=\"evidence-detail\">The failure looks like delivery rather than the drug: median leukapheresis-to-infusion was 52 days, 83% needed bridging chemotherapy, and 26% had already progressed before the week-6 assessment (N Engl J Med 2022;386:629-639).</span></li></ul>\n<h3 id=\"s-late-relapse-in-fit-patients\">Late relapse in fit patients</h3>\n<p>Chemosensitive late relapse in transplant-fit patients proceeds to salvage chemoimmunotherapy and autologous transplant after a complete metabolic response or Deauville-4 partial metabolic response (<a class=\"trial-link\" href=\"/evidence/#t-esmo-lymphomas-guideline-eyre-et-al\">ESMO Lymphomas Guideline (Eyre et al.)</a>). <a class=\"trial-link\" href=\"/evidence/#t-parma\">PARMA</a> established the strategy in the pre-rituximab era: transplantation improved 5-year EFS (46% vs 12%) and OS (53% vs 32%), and chemosensitivity is the gate the whole approach rests on, with 5-year OS 42% in randomised (DHAP-responding) patients against 11% in never-responders (N Engl J Med 1995;333:1540-1545). Salvage regimen choice depends on comorbidities, CNS involvement and setting; the options include R-ICE, R-GDP and R-DHAP.</p>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-coral\">CORAL</a> found R-ICE and R-DHAP interchangeable before transplant (3-year EFS 26% vs 35%, no significant difference on any measure).</span><span class=\"evidence-detail\">Three-year EFS was lower after prior rituximab (21% vs 47% without) and in refractory disease or relapse within 12 months (20% vs 45%) (J Clin Oncol 2010;28:4184-4190).</span></li><li class=\"evidence-prose\"><a class=\"trial-link\" href=\"/evidence/#t-ncic-ctg-ly-12\">NCIC-CTG LY.12</a> found GDP delivered the same response (45% vs 44%) and transplantation rate as DHAP with lower toxicity and hospitalisation (47% vs 99%) (J Clin Oncol 2014;32:3490-3496).</li><li class=\"evidence-prose\"><a class=\"trial-link\" href=\"/evidence/#t-hovon-44\">HOVON 44</a> showed that adding rituximab to reinduction improved disease control (24-month failure-free survival 50% vs 24%) but not overall survival, in a largely rituximab-naive relapse population that no longer exists (Blood 2008;111:537-543).</li></ul>\n<p>A partial response to salvage can still go to transplant, CAR T-cell therapy (tisagenlecleucel or axicabtagene ciloleucel) or a clinical trial.</p>\n<h3 id=\"s-transplant-ineligible-patients-car-t-cell-therapy\">Transplant-ineligible patients: CAR T-cell therapy</h3>\n<p>For transplant-ineligible patients without prior CAR T-cell exposure:</p>\n<ul><li class=\"evidence-prose\"><a class=\"trial-link\" href=\"/evidence/#t-alycante\">ALYCANTE</a> (axicabtagene ciloleucel, second line, 69 patients, median age 70): complete metabolic response at 3 months 71% (investigator-assessed; central review 66%), median PFS 11.8 months; non-relapse mortality was 10%, every fatal event an infection beyond 2 months after infusion (Nat Med 2023;29:2593-2601).</li><li class=\"evidence-prose\"><a class=\"trial-link\" href=\"/evidence/#t-pilot\">PILOT</a> (lisocabtagene maraleucel, second line, median age 74): ORR 80% with CR 54% among those infused; severe CRS and neurological events were uncommon but grade 3 or higher cytopenias persisted at day 28 in 30% (Lancet Oncol 2022;23:1066-1077).</li></ul>\n<p>In third line and beyond, the registrational CAR T-cell studies:</p>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-zuma-1\">ZUMA-1</a> (axicabtagene ciloleucel): investigator-assessed ORR 82% (independent review gave a lower 71%) with CR 54%, median OS not reached with 52% alive at 18 months, in a population whose historical median survival is about 6 months.</span><span class=\"evidence-detail\">CRS occurred in 93% (grade 3 or higher 13%) and neurological events in 64% (28% grade 3 or higher); an early partial response should be observed rather than consolidated, since 23 patients converted to complete response without further therapy (N Engl J Med 2017;377:2531-2544).</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-juliet\">JULIET</a> (tisagenlecleucel): ORR 52% with CR 40% among those evaluated; 111 of 165 enrolled were infused at a median 54 days.</span><span class=\"evidence-detail\">Among responders, 65% were relapse-free at 12 months (N Engl J Med 2019;380:45-56).</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-transcend-nhl-001\">TRANSCEND NHL 001</a> (lisocabtagene maraleucel): ORR 73% with CR 53% among those infused and evaluable, with low rates of severe CRS (grade 3 or higher 2%) and neurotoxicity (10%) (Lancet 2020;396:839-852).</span><span class=\"evidence-detail\">CRS grading scales differ across these trials, so toxicity rates are not directly comparable.</span></li></ul>\n<h3 id=\"s-bispecific-antibodies\">Bispecific antibodies</h3>\n<p>The bispecifics in DLBCL are CD20xCD3 T-cell engagers given with step-up dosing in cycle 1 to mitigate cytokine release syndrome.</p>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-starglo\">STARGLO</a>: glofitamab plus GemOx against R-GemOx in transplant-ineligible relapsed/refractory DLBCL (transformed disease and double/triple-hit excluded) prolonged survival, the primary endpoint (median OS 25.5 vs 12.9 months, HR 0.62; median PFS 13.8 vs 3.6 months, HR 0.40; CR 59% vs 25%).</span><span class=\"evidence-detail\">Glofitamab is fixed-duration, stopping at 12 cycles, after obinutuzumab pre-treatment and 2.5/10/30 mg step-up with dexamethasone premedication; CRS occurred in 44% (grade 3 in 2%), and grade 3 or higher adverse events in 78% vs 41% (Lancet 2024;404:1940-1954).</span></li><li class=\"evidence-prose\">Epcoritamab plus GemOx (EPCORE NHL-2, phase 1b/2, single-arm) gave ORR 85%, median PFS 11.2 months and median OS 21.6 months, with transformed DLBCL (23%) and double/triple-hit disease (10%) allowed; CRS 52%.</li><li class=\"evidence-prose\"><a class=\"trial-link\" href=\"/evidence/#t-sunmo\">SUNMO</a>: subcutaneous mosunetuzumab plus polatuzumab against R-GemOx, fixed at 8 cycles without hospitalisation (prior polatuzumab allowed only for late relapse), improved both primary endpoints (ORR 70% vs 40%; median PFS 11.5 vs 3.8 months, HR 0.41); overall survival has not separated at the interim analysis (median 18.7 vs 13.6 months; HR 0.80, 95% CI 0.5-1.2), and CRS was infrequent (26%, grade 3 in 0.7%) (J Clin Oncol 2025;43:3799-3811).</li></ul>\n<p>As later-line monotherapy:</p>\n<ul><li class=\"evidence-prose\"><a class=\"trial-link\" href=\"/evidence/#t-glofitamab-pivotal-np30179\">Glofitamab pivotal (NP30179)</a>: fixed-duration glofitamab gave CR 39% and ORR 52% by independent review among all 155 enrolled; among the third with prior CAR T-cell therapy the CR rate was 35%; median duration of complete response was not reached, and CRS occurred in 63% (grade 3 or higher 4%) (N Engl J Med 2022;387:2220-2231).</li><li class=\"evidence-prose\"><a class=\"trial-link\" href=\"/evidence/#t-epcore-nhl-1\">EPCORE NHL-1</a>: subcutaneous epcoritamab, given until progression, gave ORR 63% and CR 39%, with ORR 54% after prior CAR T-cell therapy; CRS 50% (grade 3 in 2.5%), almost all after the first full dose (J Clin Oncol 2023;41:2238-2247).</li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-elm-2\">ELM-2</a>: odronextamab gave ORR 52% and CR 32% (median duration of response 17.9 months among complete responders), but prior CAR T-cell therapy was a protocol exclusion, so it says nothing about that setting.</span><span class=\"evidence-detail\">Grade 3 or higher infection occurred in 39%, with 15 deaths from infection (Nat Cancer 2025;6:528-539).</span></li></ul>\n<h3 id=\"s-other-antibody-based-options\">Other antibody-based options</h3>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\">Tafasitamab (anti-CD19) plus lenalidomide: <a class=\"trial-link\" href=\"/evidence/#t-l-mind\">L-MIND</a>, single-arm in transplant-ineligible patients after 1-3 prior lines with primary refractory disease excluded, gave ORR 60% and CR 43%, with median duration of response 21.7 months and median PFS 12.1 months (Lancet Oncol 2020;21:978-988).</span><span class=\"evidence-detail\"><a class=\"trial-link\" href=\"/evidence/#t-re-mind2\">RE-MIND2</a>, the sponsor&#x27;s matched real-world comparison, benchmarked conventional therapy at median OS 9.9-11.6 months in this population; its comparisons favour tafasitamab-lenalidomide but score response differently on each side and are not randomised evidence (Clin Cancer Res 2022;28:4003-4017).</span></li><li class=\"evidence-prose\">Polatuzumab plus bendamustine-rituximab: <a class=\"trial-link\" href=\"/evidence/#t-go29365\">GO29365</a> roughly doubled complete response (40% vs 18%) and more than doubled survival (median OS 12.4 vs 4.7 months, HR 0.42) against bendamustine-rituximab, on 40 patients per arm in a trial never powered to prove superiority, so the effect size is an estimate (J Clin Oncol 2020;38:155-165).</li><li class=\"evidence-prose\">Pola-R-GemOx: <a class=\"trial-link\" href=\"/evidence/#t-polargo\">POLARGO</a> improved overall survival over R-GemOx in patients ineligible for transplant and CAR T-cell therapy (median OS 19.5 vs 12.5 months, HR 0.60; median PFS 7.4 vs 2.7 months), as a bendamustine-free alternative to pola-BR that may preserve CAR T-cell eligibility (J Clin Oncol 2026, online ahead of print).</li><li class=\"evidence-prose\">Loncastuximab tesirine (anti-CD19 antibody-drug conjugate): <a class=\"trial-link\" href=\"/evidence/#t-lotis-2\">LOTIS-2</a>, single-arm after 2 or more lines, gave ORR 48% and CR 24% (median duration of response 10.3 months), as outpatient monotherapy (Lancet Oncol 2021;22:790-800).</li><li class=\"evidence-prose\">Brentuximab vedotin plus lenalidomide-rituximab: <a class=\"trial-link\" href=\"/evidence/#t-echelon-3\">ECHELON-3</a> prolonged overall survival at its interim analysis in patients after 2 or more lines ineligible for or pretreated with transplant and CAR T-cell therapy (median OS 13.8 vs 8.5 months, HR 0.63) (J Clin Oncol 2025;43:1061-1072).</li></ul>\n<h2 id=\"s-references\">References</h2>\n<ol class=\"refs\">\n<li id=\"ref-lymphoma-diffuse-large-b-cell-lymphoma-t-esmo-lymphomas-guideline-eyre-et-al\"><a class=\"trial-link\" href=\"/evidence/#t-esmo-lymphomas-guideline-eyre-et-al\">ESMO Lymphomas Guideline (Eyre et al.)</a>. <a href=\"https://drive.google.com/file/d/1dhfzxmsJLmACqXSRzV2P_-01T5EDGUaS/preview\">Ann Oncol 2025 (Journal Pre-proof, ANNONC 1872)</a>; <a href=\"https://drive.google.com/file/d/1f7teQkh8ToLNcnf8f9xULbcg1V2uu7oR/preview\">Ann Oncol 2015;26(Suppl 5):v116-v125</a>; <a href=\"https://drive.google.com/file/d/1OUuKKNI5X7QFMgm1VZOVlT_rJXN7zRL4/preview\">Ann Oncol 2018;29(Suppl 4):iv19-iv29</a></li>\n<li id=\"ref-lymphoma-diffuse-large-b-cell-lymphoma-t-alizadeh-et-al-lymphochip\"><a class=\"trial-link\" href=\"/evidence/#t-alizadeh-et-al-lymphochip\">Alizadeh et al. (Lymphochip)</a>. <a href=\"https://drive.google.com/file/d/1z99qmXgtmF0ZvntJYYJhsEuqKfiyGQDw/preview\">Nature 2000;403:503-511</a></li>\n<li id=\"ref-lymphoma-diffuse-large-b-cell-lymphoma-t-lnh03-7b-r-minichop\"><a class=\"trial-link\" href=\"/evidence/#t-lnh03-7b-r-minichop\">LNH03-7B (R-miniCHOP)</a>. <a href=\"https://drive.google.com/file/d/1BH0ZQ3WmmEHIPGV5svQVOxQ4D72cbbEa/preview\">Lancet Oncol 2011;12:460-468</a></li>\n<li id=\"ref-lymphoma-diffuse-large-b-cell-lymphoma-t-mint\"><a class=\"trial-link\" href=\"/evidence/#t-mint\">MInT</a>. <a href=\"https://drive.google.com/file/d/1RrPO5TnkcqWhWL1Nv8a4ZqmW22RX-vK8/preview\">Lancet Oncol 2006;7:379-391</a></li>\n<li id=\"ref-lymphoma-diffuse-large-b-cell-lymphoma-t-flyer\"><a class=\"trial-link\" href=\"/evidence/#t-flyer\">FLYER</a>. <a href=\"https://drive.google.com/file/d/1xjPKfyK3GeEpGYf6_7L49ldPpK6cY0kE/preview\">Lancet 2019;394:2271-2281</a></li>\n<li id=\"ref-lymphoma-diffuse-large-b-cell-lymphoma-t-lnh-98-5-gela\"><a class=\"trial-link\" href=\"/evidence/#t-lnh-98-5-gela\">LNH-98.5 (GELA)</a>. <a href=\"https://drive.google.com/file/d/1QVokNVtK8RXrJ8GP5nuXHqLd8DI6xOhb/preview\">N Engl J Med 2002;346:235-242</a>; <a href=\"https://drive.google.com/file/d/1cOxe8aCMi3y-DYUmMoVVsK1-64fNGll1/preview\">J Clin Oncol 2005;23:4117-4126</a></li>\n<li id=\"ref-lymphoma-diffuse-large-b-cell-lymphoma-t-ricover-60\"><a class=\"trial-link\" href=\"/evidence/#t-ricover-60\">RICOVER-60</a>. <a href=\"https://drive.google.com/file/d/1x0mNEaNf8XoptQHp3ymMFxDjaPJsiE8R/preview\">Lancet Oncol 2008;9:105-116</a></li>\n<li id=\"ref-lymphoma-diffuse-large-b-cell-lymphoma-t-r-chop-14-v-21-ncri\"><a class=\"trial-link\" href=\"/evidence/#t-r-chop-14-v-21-ncri\">R-CHOP-14 v 21 (NCRI)</a>. <a href=\"https://drive.google.com/file/d/1Kt22fjr7FnrrNvaxnl9iRhZIwBWOisNL/preview\">Lancet 2013;381:1817-1826</a></li>\n<li id=\"ref-lymphoma-diffuse-large-b-cell-lymphoma-t-calgb-alliance-50303\"><a class=\"trial-link\" href=\"/evidence/#t-calgb-alliance-50303\">CALGB/Alliance 50303</a>. <a href=\"https://drive.google.com/file/d/12jeHV2xAYb8wkK_r3Zn7PakSHsFUPbQG/preview\">J Clin Oncol 2019;37:1790-1799</a></li>\n<li id=\"ref-lymphoma-diffuse-large-b-cell-lymphoma-t-goya\"><a class=\"trial-link\" href=\"/evidence/#t-goya\">GOYA</a>. <a href=\"https://drive.google.com/file/d/1QD8KCHlcj9HLMtmzTCorA7aL8c_3AGeJ/preview\">J Clin Oncol 2017;35:3529-3537</a></li>\n<li id=\"ref-lymphoma-diffuse-large-b-cell-lymphoma-t-remodl-b\"><a class=\"trial-link\" href=\"/evidence/#t-remodl-b\">REMoDL-B</a>. <a href=\"https://drive.google.com/file/d/1iVyzDB-OFvFFwzpwlkbdJXrGRuqTLmbP/preview\">Lancet Oncol 2019;20:649-662</a>; <a href=\"https://drive.google.com/file/d/1f-LpwXnaut0_kOOEBiS ew\">J Clin Oncol 2026 (online ahead of print; JCO-25-02849)</a></li>\n<li id=\"ref-lymphoma-diffuse-large-b-cell-lymphoma-t-lotis-2\"><a class=\"trial-link\" href=\"/evidence/#t-lotis-2\">LOTIS-2</a>. <a href=\"https://drive.google.com/file/d/1MUk0Dd8OfpBA0twL1KuOL5_SP3LZguMF/preview\">Lancet Oncol 2021;22:790-800</a></li>\n<li id=\"ref-lymphoma-diffuse-large-b-cell-lymphoma-t-echelon-3\"><a class=\"trial-link\" href=\"/evidence/#t-echelon-3\">ECHELON-3</a>. <a href=\"https://drive.google.com/file/d/1uXEpYyVlvP8yUi9ycBvHz-RoLDZ7TpSj/preview\">J Clin Oncol 2025;43:1061-1072</a></li>\n</ol>", "_hay": "diffuse large b-cell lymphoma diffuse-large-b-cell-lymphoma lymphoma classification and cell of origin staging response assessment prognostic indices clinical presentation work-up tumour lysis syndrome limited-stage dlbcl (stage i–ii) r-chop delivery advanced-stage dlbcl (stage ii bulky to iv) attempts to improve on r-chop pola-r-chp upfront transplant consolidation cns prophylaxis radiotherapy for bulky disease dlbcl in older patients the anthracycline-unfit patient double-hit and double-expressor disease relapsed or refractory dlbcl refractory disease and early relapse in fit patients late relapse in fit patients transplant-ineligible patients: car t-cell therapy bispecific antibodies other antibody-based options references"}, {"id": "lymphoma-hodgkin-lymphoma", "slug": "hodgkin-lymphoma", "group": "Lymphoma", "title": "Hodgkin lymphoma", "updated": "", "sections": [{"id": "s-histopathology-and-classification", "h": "Histopathology and classification", "depth": 2}, {"id": "s-epidemiology-and-presentation", "h": "Epidemiology and presentation", "depth": 2}, {"id": "s-work-up", "h": "Work-up", "depth": 2}, {"id": "s-staging-and-risk-stratification", "h": "Staging and risk stratification", "depth": 2}, {"id": "s-early-stage-favourable-disease", "h": "Early-stage favourable disease", "depth": 2}, {"id": "s-early-stage-unfavourable-disease", "h": "Early-stage unfavourable disease", "depth": 2}, {"id": "s-advanced-stage-disease", "h": "Advanced-stage disease", "depth": 2}, {"id": "s-relapsed-and-refractory-disease", "h": "Relapsed and refractory disease", "depth": 2}, {"id": "s-hodgkin-lymphoma-in-pregnancy", "h": "Hodgkin lymphoma in pregnancy", "depth": 2}, {"id": "s-references", "h": "References", "depth": 2}], "html": "<h2 id=\"s-histopathology-and-classification\">Histopathology and classification</h2>\n<p>Hodgkin lymphoma divides into classical Hodgkin lymphoma and nodular lymphocyte-predominant Hodgkin lymphoma.</p>\n<p>Classical Hodgkin lymphoma is defined immunohistochemically by CD15 and CD30 positivity with CD45 and CD3 negativity.</p>\n<p>The malignant Hodgkin and Reed-Sternberg cells are clonal B cells that have lost the normal B-cell phenotype. A mature B cell lacking a B-cell receptor would ordinarily die by apoptosis, so Hodgkin and Reed-Sternberg cells depend on acquired survival mechanisms to persist. Associated factors:</p>\n<ul><li>Familial clustering: a 3- to 5-fold increase in risk with an affected relative.</li><li>Epstein-Barr virus, found in the majority of mixed-cellularity and lymphocyte-depleted subtypes.</li><li>HIV, commonly associated with the lymphocyte-depleted subtype and found in 15% of that subtype.</li><li>Immunosuppressed states generally.</li></ul>\n<h2 id=\"s-epidemiology-and-presentation\">Epidemiology and presentation</h2>\n<p>Hodgkin lymphoma has a bimodal age distribution, peaking in late adolescence and early adulthood and again beyond age 60. Classical Hodgkin lymphoma usually presents as asymptomatic lymphadenopathy, most often cervical, supraclavicular, axillary or inguinal, and spread is contiguous rather than the discontiguous pattern seen in diffuse large B-cell lymphoma. Presentation can also be an incidental mediastinal mass on imaging. B symptoms (fever, night sweats and weight loss) occur in about 40%. Bone marrow involvement is uncommon and is associated with advanced clinical stage, reported in up to 6.5% of newly diagnosed patients. Nodular lymphocyte-predominant Hodgkin lymphoma has a male predominance and typically presents in the 30-50 age group with cervical, axillary or inguinal lymphadenopathy. It runs an indolent course with a favourable prognosis, but carries a risk of transformation to large B-cell lymphoma.</p>\n<h2 id=\"s-work-up\">Work-up</h2>\n<ul><li>History: presence and chronicity of symptoms, personal history of a prior malignancy or immunosuppressive condition, and a 3-generation family history.</li><li>Examination: all accessible lymphoid tissue, and assessment for splenomegaly or hepatomegaly.</li><li>Laboratory: full blood count and erythrocyte sedimentation rate, liver and renal function and electrolytes, and HIV testing.</li><li>Imaging: PET-CT, which detects marrow and extranodal involvement effectively; a bone marrow aspirate and trephine is not routine and is reserved for unexplained cytopenias.</li><li>Tissue biopsy to identify Hodgkin and Reed-Sternberg cells, by excisional or incisional biopsy of a peripheral node or biopsy of a mediastinal mass.</li><li>Pre-treatment evaluation: cardiac function before doxorubicin, and pulmonary function testing with DLCO of 60% or above before bleomycin, whether given as ABVD or as part of BEACOPP.</li><li>Fertility: pregnancy testing and fertility preservation counselling where appropriate.</li></ul>\n<h2 id=\"s-staging-and-risk-stratification\">Staging and risk stratification</h2>\n<p>Staging follows the Lugano criteria, using Ann Arbor lymph node regions.</p>\n<ul><li class=\"evidence-prose\">A/B denotes the absence or presence of B symptoms: fever, drenching night sweats, or significant unintentional weight loss.</li><li class=\"evidence-prose\">E denotes extranodal extension contiguous with a nodal site that can be encompassed within a radiotherapy field appropriate to nodal disease of the same anatomical extent; extranodal disease beyond that is staged IV.</li><li class=\"evidence-prose\">Bulky disease is a single nodal mass above 10 cm, or exceeding one-third of the transthoracic diameter.</li></ul>\n<p>Risk stratifies into early favourable, early unfavourable and advanced disease.</p>\n<p>Three classification systems exist: EORTC, GHSG and NCCN. The source notes standardise on GHSG. The GHSG risk factors distinguishing early favourable from early unfavourable disease are summarised by the mnemonic MEE3:</p>\n<ul><li>A large mediastinal mass.</li><li>Extranodal disease.</li><li>Erythrocyte sedimentation rate above 50 without B symptoms, or above 30 with B symptoms.</li><li>3 or more involved nodal areas, using GHSG areas rather than Ann Arbor regions.</li></ul>\n<p>In advanced disease, prognostication uses the International Prognostic Score. Overall survival falls as more of the following are present: serum albumin below 4 g/dL, haemoglobin below 10.5 g/dL, male sex, age above 45, stage IV disease, white cell count of 15,000/microlitre or above, and an absolute lymphocyte count below 600/microlitre or below 8% of the total white cell count. Interim and end-of-treatment PET response in Hodgkin lymphoma is read on the Deauville 5-point scale. A score of 3 sits at the boundary: it carries a good prognosis on standard treatment, but the de-escalation trials below more often treat it as an inadequate response and count it toward the positive group <a class=\"trial-link\" href=\"/evidence/#t-lugano-classification-cheson-et-al\">Lugano Classification (Cheson et al.)</a>. The exact cut-point used to define a negative interim scan therefore differs between the trials that follow, and each is stated where it matters to the result. Treatment is organised by 3 questions at each stage: what the standard of care is, whether it can be de-escalated, and whether a PET-adapted strategy applies.</p>\n<h2 id=\"s-early-stage-favourable-disease\">Early-stage favourable disease</h2>\n<p>Standard treatment is 2 cycles of ABVD followed by 20 Gy involved-field radiotherapy.</p>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\">ABVD is given every 28 days, on days 1 and 15: doxorubicin 25 mg/m² over 3-5 minutes, bleomycin 10 units/m² over 10 minutes, vinblastine 6 mg/m² over 1 minute, dacarbazine 375 mg/m² over 30 minutes.</span><span class=\"evidence-detail\">The regimen is highly emetogenic and primary G-CSF prophylaxis is not indicated. Full blood count, renal and liver function and electrolytes are checked before each cycle, with monitoring for respiratory symptoms such as breathlessness, cough or fever.</span></li><li class=\"evidence-prose\">Involved-field radiotherapy is 20 Gy over 2 to 4 weeks, usually starting 3 to 4 weeks after chemotherapy finishes.</li></ul>\n<p>Omitting radiotherapy increases relapse without changing overall survival, so chemotherapy alone is a reasonable option chosen on individual characteristics or treatment goals; for example a woman under 30 who would otherwise receive radiotherapy to the axilla or mediastinum, given the subsequent breast cancer risk, or a patient with pre-existing cardiovascular disease. <a class=\"trial-link\" href=\"/evidence/#t-ghsg-hd10\">GHSG HD10</a> set both the chemotherapy and radiotherapy dose for this group. It randomised 1,370 patients with untreated early favourable Hodgkin lymphoma in a 2x2 factorial of 4 versus 2 cycles of ABVD and 30 versus 20 Gy involved-field radiotherapy; 1,190 were analysed after exclusions, mostly incorrect initial staging. Against a 7-percentage-point non-inferiority margin on 5-year freedom from treatment failure, 2 cycles matched 4 (91.1% vs 93.0%; difference -1.9 points, 95% CI -5.2 to 1.4) and 20 Gy matched 30 Gy (92.9% vs 93.4%; -0.5 points, -3.6 to 2.6); the least intensive combination, 2 cycles plus 20 Gy, also stayed within the margin against 4 cycles plus 30 Gy (-1.6 points, -6.3 to 3.1). 5-year overall survival was about 97% in all 4 groups, while toxicity fell sharply with less treatment: grade 3 or 4 acute events in 33.2% with 2 cycles against 51.7% with 4, and 2.9% with 20 Gy against 8.7% with 30 Gy. 6 of the 7 deaths from first-line toxicity occurred with 4 cycles, though all 5 deaths from salvage toxicity followed 2 cycles (N Engl J Med 2010;363:640-652). This established 2 cycles of ABVD plus 20 Gy as standard for favourable early-stage disease. <a class=\"trial-link\" href=\"/evidence/#t-ghsg-hd13\">GHSG HD13</a> tested whether the chemotherapy backbone itself could be reduced further, and found it could not. It randomised 1,710 patients with the same population (early favourable classical or, in stage IB/IIA/IIB only, nodular lymphocyte-predominant disease) to 2 cycles of ABVD, ABV, AVD or AV, each followed by 30 Gy involved-field radiotherapy; 1,502 qualified for analysis. Both dacarbazine-omitted arms closed early for excess events and underperformed ABVD (5-year freedom from treatment failure 77.1% with AV against 92.3%, hazard ratio 2.57, 95% CI 1.51-4.40; 81.4% with ABV against 92.9%, hazard ratio 2.06, 1.21-3.52). The bleomycin-omitted arm, AVD, ran to completion and still fell short of the non-inferiority margin (89.2% against 93.1%; hazard ratio 1.50, 95% CI 1.00-2.26, upper bound above the 1.72 limit). Overall survival did not separate across the 4 groups, at 94-98% (Lancet 2015;385:1418-1427). Neither dacarbazine nor bleomycin can be dropped from ABVD in this population, and unmodified ABVD remains standard. <a class=\"trial-link\" href=\"/evidence/#t-ghsg-hd16\">GHSG HD16</a> tested whether radiotherapy could be dropped after a negative interim PET, and it could not. It randomised 1,150 patients with untreated stage I-II classical, or limited-stage nodular lymphocyte-predominant, Hodgkin lymphoma to 2 cycles of ABVD plus 20 Gy in everyone, or the same chemotherapy with 20 Gy withheld where the PET after cycle 2 was negative (Deauville 1-2) on central review; the primary comparison rests on the 628 PET-2-negative patients analysed per protocol. Omitting radiotherapy cost tumour control: 5-year progression-free survival was 86.1% without radiotherapy against 93.4% with it (difference -7.3 points, 95% CI -13.0 to -1.6; hazard ratio 1.78, interval reaching 3.12, above the 3.01 margin), driven by in-field recurrence (9% against 2%) rather than out-field recurrence (5% against 4%). Overall survival did not differ on the 12 deaths recorded, 98.4% against 98.1% at 5 years, and more deaths occurred in the arm with better tumour control (9 of 328 against 3 of 300) (J Clin Oncol 2019;37:2835-2845). <a class=\"trial-link\" href=\"/evidence/#t-ghsg-hd7\">GHSG HD7</a> is the historical trial that established combined-modality treatment over radiotherapy alone in this group. It randomised 650 patients with untreated favourable early-stage Hodgkin lymphoma, including nodular lymphocyte-predominant histology, to 2 cycles of ABVD before extended-field radiotherapy or extended-field radiotherapy alone. Adding chemotherapy improved disease control: 7-year freedom from treatment failure was 88% against 67%, a 21-point difference driven almost entirely by relapse (3.2% against 21.9%), without separating overall survival (94% against 92%); treatment-related deaths ran lower with chemotherapy added (2 against 7, most following the salvage that relapse required) (J Clin Oncol 2007;25:3495-3502). Surveillance after treatment: most relapses occur within the first 2 to 3 years. History and examination 3- to 6-monthly in years 1 to 2, 6- to 12-monthly in year 3, then annually; full blood count at each visit to screen for marrow dysfunction; and monitoring for treatment complications: second malignancies, pulmonary complications, and metabolic complications where the thyroid was irradiated.</p>\n<h2 id=\"s-early-stage-unfavourable-disease\">Early-stage unfavourable disease</h2>\n<p><a class=\"trial-link\" href=\"/evidence/#t-ghsg-hd8\">GHSG HD8</a> established the radiotherapy field used in this group. It randomised 1,204 patients with stage I-II disease and at least one risk factor, or stage IIIA with none, to 2 cycles of COPP plus ABVD followed by 30 Gy extended-field radiotherapy or 30 Gy involved-field radiotherapy, each with a 10 Gy boost to initial bulk; 1,064 were informative for efficacy. Involved-field matched extended-field on disease control (5-year freedom from treatment failure 84.2% against 85.8%, difference 1.6 points, upper 95% bound 5.9, inside the trial&#x27;s 8-point equivalence limit; 5-year overall survival 92.4% against 90.8%) while sharply reducing acute toxicity: nausea 29.1% against 62.5%, leukopenia 33.3% against 49.1%, thrombocytopenia 5.5% against 16.7% (J Clin Oncol 2003;21:3601-3608). Involved-field radiotherapy became the standard field on this result. Standard treatment is 4 cycles of ABVD plus 30 Gy involved-field radiotherapy, established by <a class=\"trial-link\" href=\"/evidence/#t-ghsg-hd11\">GHSG HD11</a>, with 2 cycles of escalated BEACOPP followed by 2 cycles of ABVD plus radiotherapy (HD14) as an alternative. Escalated BEACOPP is given every 21 days: bleomycin 10 mg/m² on day 8, etoposide 200 mg/m² on days 1-3, doxorubicin 35 mg/m² on day 1, cyclophosphamide 1,250 mg/m² on day 1, vincristine 1.4 mg/m² on day 8, procarbazine 100 mg/m² on days 1-7, prednisolone 40 mg/m² on days 1-14, with G-CSF from day 8. <a class=\"trial-link\" href=\"/evidence/#t-ghsg-hd11\">GHSG HD11</a> tested both the chemotherapy and the radiotherapy dose in this group. It randomised 1,570 patients with stage I-II disease and at least one GHSG risk factor to a 2x2 factorial of 4 cycles of ABVD or 4 cycles of baseline BEACOPP, each followed by 30 or 20 Gy involved-field radiotherapy; 1,395 qualified for the chemotherapy analysis and 1,351 for the radiotherapy analysis. At 30 Gy, baseline BEACOPP and ABVD did not differ (1.6 points, 95% CI -3.6 to 6.9); only at 20 Gy did BEACOPP separate, by 5.7 points (0.1 to 11.3). Dropping to 20 Gy after ABVD cost 4.7 points (-10.3 to 0.8), its bound outside the 7-point non-inferiority limit, so 20 Gy was not established there; after baseline BEACOPP the loss was only 0.8 points (-5.8 to 4.2) and 20 Gy was non-inferior. The interaction between the two questions was not demonstrated (P=0.16). 5-year overall survival was 94-95% across all 4 groups, while baseline BEACOPP cost more acute toxicity than ABVD (at least one grade 3 or 4 event in 73.8% against 51.5%) and 30 Gy more than 20 Gy (12.0% against 5.7%) (J Clin Oncol 2010;28:4199-4206). 4 cycles of ABVD plus 30 Gy remained the standard from this result. <a class=\"trial-link\" href=\"/evidence/#t-ghsg-hd14\">GHSG HD14</a> tested whether intensifying the first 2 cycles improves on that standard, and it does, at a toxicity cost. It randomised 1,655 patients with the same population to 2 cycles of escalated BEACOPP then 2 cycles of ABVD, or 4 cycles of ABVD, each followed by 30 Gy involved-field radiotherapy; 1,528 qualified for the primary analysis. 5-year freedom from treatment failure was 94.8% against 87.7% (difference 7.2 points, 95% CI 3.8 to 10.5; hazard ratio 0.44, 95% CI 0.30 to 0.66), reached early enough that randomisation stopped at the third of five planned interim analyses. Overall survival did not separate, at 97.0% at 5 years. At least one grade 3 or 4 event occurred in 87.1% against 50.7%, and a grade 4 event in 56.6% against 5.9% (J Clin Oncol 2012;30:907-913). Intensification with 2 cycles of escalated BEACOPP improved tumour control at the cost of markedly more acute haematological toxicity, without a shown survival gain. PET-adapted therapy is possible only from the intensified backbone. After 2 cycles of escalated BEACOPP then 2 cycles of ABVD, radiotherapy can be dropped if the PET after cycle 4 is negative (HD17). Starting from 4 cycles of ABVD, radiotherapy cannot be dropped even where the interim PET is negative, whether tested after cycle 3 (UK RAPID) or cycle 2 (EORTC H10). <a class=\"trial-link\" href=\"/evidence/#t-ghsg-hd17\">GHSG HD17</a> confirmed that radiotherapy can be omitted after a negative PET (Deauville 1-2) once the chemotherapy has been intensified. It randomised 1,100 patients with stage I-II disease and at least one risk factor to 2 cycles of escalated BEACOPP then 2 cycles of ABVD in both arms, followed by 30 Gy involved-field radiotherapy in everyone, or 30 Gy involved-node radiotherapy only where the PET after cycle 4 was positive; 905 formed the per-protocol population the verdict rests on. 5-year progression-free survival was 95.1% with PET-guided treatment against 97.3% with radiotherapy for all, a difference of 2.2 points whose upper bound of 5.3 stayed inside the 8-point margin, so non-inferiority was met; among the PET-negative patients alone, 95.9% against 97.7%. 5-year overall survival was 98.8% (Lancet Oncol 2021;22:223-234). Late toxicity, the reason to omit radiotherapy at all, was deferred to a later analysis and is not established by this report. <a class=\"trial-link\" href=\"/evidence/#t-uk-rapid\">UK RAPID</a> tested the same omission question after 3 cycles of unmodified ABVD, and could not establish it. Of 602 patients registered and started on ABVD, 571 were scanned after 3 cycles, 426 were PET-negative (Deauville 1-2) and 420 of those were randomised to 30 Gy involved-field radiotherapy or no further treatment; the 145 who were PET-positive received a fourth ABVD cycle plus radiotherapy without randomisation. 3-year progression-free survival was 90.8% without further treatment against 94.6% with radiotherapy, a difference of -3.8 points whose 95% interval reached -8.8, outside the 7-point margin; per protocol the gap widened to 90.8% against 97.1%. Overall survival did not separate in the other direction; 99.0% without radiotherapy against 97.1% with it, and of the 8 deaths in the radiotherapy arm 5 occurred in patients who never received it (N Engl J Med 2015;372:1598-1607). The result is a small loss of tumour control set against irradiating everyone, in a population whose 3-year survival exceeds 97% either way. <a class=\"trial-link\" href=\"/evidence/#t-eortc-lysa-fil-h10\">EORTC/LYSA/FIL H10</a> tested omission after 2 cycles of ABVD, in both a favourable and an unfavourable cohort, and also could not establish it, while its escalation arm succeeded. H10 defined PET negativity as Deauville 1-2 and positivity as Deauville 3-5.</p>\n<p>All 1,950 patients were randomised before any PET existed and were then adapted by the PET after cycle 2. In the favourable cohort, 5-year progression-free survival was 87.1% with ABVD alone against 99.0% with ABVD plus involved-node radiotherapy (hazard ratio 15.8, 95% CI 3.79 to 66.07); in the unfavourable cohort, 89.6% against 92.1% (hazard ratio 1.45, 0.84 to 2.50); both upper bounds exceeded their margins, so non-inferiority failed in each cohort. Where the interim PET was positive, escalating to 2 cycles of escalated BEACOPP raised 5-year progression-free survival from 77.4% to 90.6% (hazard ratio 0.42, 0.23 to 0.74); overall survival on ABVD with radiotherapy alone in that PET-positive group was the lowest in the trial at 89.3%, against 96.0% with escalated BEACOPP (hazard ratio 0.45, 95% CI 0.19 to 1.07, which the authors describe as a trend) (J Clin Oncol 2017;35:1786-1794). With longer follow-up, both the 10-year progression-free survival and overall survival differences in the PET-positive escalation comparison became statistically non-significant. Radiotherapy therefore cannot be safely omitted from an unfavourable early-stage regimen that starts with unmodified ABVD, whatever the interim PET shows; omission is only established after the intensified 2+2 escalated-BEACOPP-then-ABVD backbone with a negative PET at cycle 4. In H10&#x27;s PET-positive comparison, the 5-year progression-free-survival advantage with escalation was no longer statistically significant at 10 years; this loss of statistical significance does not establish equivalence or absence of benefit.</p>\n<h2 id=\"s-advanced-stage-disease\">Advanced-stage disease</h2>\n<p>Phase III-supported frontline regimens studied in advanced-stage Hodgkin lymphoma:</p>\n<div class=\"tblwrap\" role=\"region\" aria-label=\"Scrollable table\" tabindex=\"0\"><table><thead><tr><th scope=\"col\"></th><th scope=\"col\">BV-AVD</th><th scope=\"col\">ABVD</th><th scope=\"col\">Nivo-AVD</th><th scope=\"col\">BrECADD</th></tr></thead><tbody><tr><td>Supporting trial</td><td>ECHELON-1</td><td>ECHELON-1, RATHL</td><td>SWOG S1826</td><td>GHSG HD21</td></tr><tr><td>Schedule</td><td>6 cycles, every 28 days</td><td>6 cycles, every 28 days</td><td>6 cycles, every 28 days</td><td>every 21 days</td></tr><tr><td>Components (day 1 and 15 unless stated)</td><td>Brentuximab vedotin 1.2 mg/kg, doxorubicin 25 mg/m², vinblastine 6 mg/m², dacarbazine 375 mg/m²; G-CSF mandatory</td><td>Doxorubicin 25 mg/m², bleomycin 10 units/m², vinblastine 6 mg/m², dacarbazine 375 mg/m²</td><td>Nivolumab 240 mg, doxorubicin 25 mg/m², vinblastine 6 mg/m², dacarbazine 375 mg/m²; G-CSF optional</td><td>Brentuximab vedotin 1.8 mg/kg day 0, etoposide 150 mg/m² days 1-3, cyclophosphamide 1,250 mg/m² day 1, doxorubicin 40 mg/m² day 1, dacarbazine 250 mg/m² days 2-3, dexamethasone 40 mg days 1-4; G-CSF mandatory</td></tr></tbody></table></div>\n<p>Radiotherapy at the end of treatment is reserved for residual metabolically active lesions. Escalated BEACOPP established disease control superior to earlier regimens across GHSG HD9, HD12 and HD15, at the cost of more toxicity, both acute and late. ABVD itself was established as a frontline regimen by Canellos and colleagues (N Engl J Med 1992).</p>\n<p>Escalated BEACOPP improved disease control over the older COPP/ABVD regimen in HD9 at the expense of increased short- and long-term toxicity <a class=\"trial-link\" href=\"/evidence/#t-ghsg-hd9\">GHSG HD9</a>. <a class=\"trial-link\" href=\"/evidence/#t-ghsg-hd9\">GHSG HD9</a> established escalated BEACOPP&#x27;s advantage over the older
