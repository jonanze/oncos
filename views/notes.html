\"/evidence/#t-takahashi-es-sclc-pci\">Takahashi (ES-SCLC PCI)</a>. <a href=\"https://drive.google.com/file/d/1LeilwhT9QxwabDLfLplphmo0UmlnsyvG/preview\">Lancet Oncol 2017;18:663-671</a></li>\n<li id=\"ref-lung-small-cell-lung-cancer-ext-e0539b0c3c74\"><a href=\"https://www.swog.org/clinical-trials/s1827\" rel=\"noopener\" target=\"_blank\">SWOG S1827 MAVERICK trial status</a></li>\n<li id=\"ref-lung-small-cell-lung-cancer-t-dellphi-304\"><a class=\"trial-link\" href=\"/evidence/#t-dellphi-304\">DeLLphi-304</a>. <a href=\"https://drive.google.com/file/d/1slMV1XbMXQM_0GZG8Jg8oPPwgGGe4kIT/preview\">N Engl J Med 2025;393:349-361</a></li>\n<li id=\"ref-lung-small-cell-lung-cancer-t-dellphi-301\"><a class=\"trial-link\" href=\"/evidence/#t-dellphi-301\">DeLLphi-301</a>. <a href=\"https://drive.google.com/file/d/1Zn9tWnamkHSySlxxfyMSf6MB7LUI28cL/preview\">N Engl J Med 2023;389:2063-2075</a></li>\n<li id=\"ref-lung-small-cell-lung-cancer-ext-678c2f88309f\"><a href=\"https://www.accessdata.fda.gov/drugsatfda_docs/label/2025/761344s001lbl.pdf\" rel=\"noopener\" target=\"_blank\">US tarlatamab prescribing information</a></li>\n<li id=\"ref-lung-small-cell-lung-cancer-t-pm1183-b-005-lurbinectedin\"><a class=\"trial-link\" href=\"/evidence/#t-pm1183-b-005-lurbinectedin\">PM1183-B-005 (Lurbinectedin)</a>. <a href=\"https://drive.google.com/file/d/1qwr9WbTrT1DLkMU0bFdu4N5OS9WRmzZF/preview\">Lancet Oncol 2020;21:645-654</a></li>\n<li id=\"ref-lung-small-cell-lung-cancer-ext-a81f5ec33c82\"><a href=\"https://www.accessdata.fda.gov/drugsatfda_docs/label/2025/213702s011lbl.pdf\" rel=\"noopener\" target=\"_blank\">US lurbinectedin prescribing information</a></li>\n<li id=\"ref-lung-small-cell-lung-cancer-t-von-pawel\"><a class=\"trial-link\" href=\"/evidence/#t-von-pawel\">von Pawel</a>. <a href=\"https://drive.google.com/file/d/12WbY4EMlY25CCE4fsx-ZaxZm8sM4EKCJ/preview\">J Clin Oncol 1999;17:658-667</a></li>\n<li id=\"ref-lung-small-cell-lung-cancer-ext-914887c47323\"><a href=\"https://ascopubs.org/doi/abs/10.1200/jco.2006.06.5821\" rel=\"noopener\" target=\"_blank\">Oral topotecan versus supportive care trial</a></li>\n<li id=\"ref-lung-small-cell-lung-cancer-ext-11dff893caa1\"><a href=\"https://ascopubs.org/doi/abs/10.1200/jco.2006.08.3998\" rel=\"noopener\" target=\"_blank\">Oral versus intravenous topotecan trial</a></li>\n<li id=\"ref-lung-small-cell-lung-cancer-ext-a1604a0b10de\"><a href=\"https://pubmed.ncbi.nlm.nih.gov/27312053/\" rel=\"noopener\" target=\"_blank\">JCOG0605 randomized phase III trial</a></li>\n<li id=\"ref-lung-small-cell-lung-cancer-t-gfpc-01-13\"><a class=\"trial-link\" href=\"/evidence/#t-gfpc-01-13\">GFPC 01-13</a>. <a href=\"https://drive.google.com/file/d/12JBJRxhSRDvyIFFxxqRbLWTlRjIrgd5j/preview\">Lancet Oncol 2020;21:1224-1233</a></li>\n<li id=\"ref-lung-small-cell-lung-cancer-t-bl-b01d1-101-iza-bren-es-sclc\"><a class=\"trial-link\" href=\"/evidence/#t-bl-b01d1-101-iza-bren-es-sclc\">BL-B01D1-101 (iza-bren ES-SCLC)</a>. <a href=\"https://drive.google.com/file/d/1T5Nt0VUu_54c3p2SohyvDxMhryoJ-VQ0/preview\">J Clin Oncol 2026 (online ahead of print; JCO-26-00243)</a></li>\n<li id=\"ref-lung-small-cell-lung-cancer-ext-9fc6eceed364\"><a href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC10425483/\" rel=\"noopener\" target=\"_blank\">SEOM-GECP SCLC guideline</a></li>\n<li id=\"ref-lung-small-cell-lung-cancer-ext-42c8d1d7e6dc\"><a href=\"https://ascopubs.org/doi/10.1200/JOP.19.00722\" rel=\"noopener\" target=\"_blank\">ASCO lung cancer surveillance guideline</a></li>\n</ol>", "_hay": "small cell lung cancer small-cell-lung-cancer lung at a glance diagnosis, biology, and staging limited-stage disease small node-negative tumours stage ii–iii chemoradiotherapy consolidation durvalumab prophylactic cranial irradiation extensive-stage disease first-line systemic therapy immediate complications and supportive care maintenance after induction thoracic radiotherapy after systemic therapy pci or mri surveillance relapsed or refractory disease reassess before choosing treatment tarlatamab lurbinectedin, topotecan, and other chemotherapy investigational antibody–drug conjugates follow-up and survivorship references evidence supporting the surgical pathway choose the thoracic radiotherapy schedule evidence for durvalumab atezolizumab does not establish a consolidation class effect select the platinum place the cytotoxic backbone in context add a survival-positive checkpoint inhibitor consider regional and selected alternatives evidence for lurbinectedin plus atezolizumab do not extrapolate across maintenance strategies evidence before checkpoint inhibition evidence with atezolizumab maintenance select patients narrowly evidence without mandated baseline mri evidence with mri surveillance randomized evidence earlier single-arm evidence deliver tarlatamab safely lurbinectedin topotecan and selected single agents platinum rechallenge"}, {"id": "lymphoma-diffuse-large-b-cell-lymphoma", "slug": "diffuse-large-b-cell-lymphoma", "group": "Lymphoma", "title": "Diffuse large B-cell lymphoma", "updated": "", "sections": [{"id": "s-establish-the-diagnosis-and-treatment-defining-biology", "h": "Establish the diagnosis and treatment-defining biology", "depth": 2}, {"id": "s-stage-and-assess-response-with-pet-ct", "h": "Stage and assess response with PET-CT", "depth": 2}, {"id": "s-use-prognostic-scores-to-structure-risk-not-to-replace-judgement", "h": "Use prognostic scores to structure risk, not to replace judgement", "depth": 2}, {"id": "s-prevent-early-treatment-complications", "h": "Prevent early treatment complications", "depth": 2}, {"id": "s-tumour-lysis-syndrome", "h": "Tumour lysis syndrome", "depth": 3}, {"id": "s-r-chop-delivery", "h": "R-CHOP delivery", "depth": 3}, {"id": "s-choose-first-line-treatment-by-stage-ipi-age-and-fitness", "h": "Choose first-line treatment by stage, IPI, age and fitness", "depth": 2}, {"id": "s-limited-stage-disease", "h": "Limited-stage disease", "depth": 3}, {"id": "s-advanced-stage-disease", "h": "Advanced-stage disease", "depth": 3}, {"id": "s-pola-r-chp", "h": "Pola-R-CHP", "depth": 3}, {"id": "s-new-r-chop-combinations", "h": "New R-CHOP combinations", "depth": 3}, {"id": "s-recognise-the-limits-of-frontline-intensification", "h": "Recognise the limits of frontline intensification", "depth": 2}, {"id": "s-select-cns-prophylaxis-sparingly", "h": "Select CNS prophylaxis sparingly", "depth": 2}, {"id": "s-use-radiotherapy-selectively", "h": "Use radiotherapy selectively", "depth": 2}, {"id": "s-adapt-treatment-for-older-or-anthracycline-unfit-patients", "h": "Adapt treatment for older or anthracycline-unfit patients", "depth": 2}, {"id": "s-manage-double-hit-and-double-expressor-disease-separately", "h": "Manage double-hit and double-expressor disease separately", "depth": 2}, {"id": "s-reassess-disease-at-relapse", "h": "Reassess disease at relapse", "depth": 2}, {"id": "s-refractory-disease-or-relapse-within-12-months", "h": "Refractory disease or relapse within 12 months", "depth": 3}, {"id": "s-later-relapse-in-transplant-suitable-patients", "h": "Later relapse in transplant-suitable patients", "depth": 3}, {"id": "s-car-t-cell-therapy-for-patients-not-intended-for-transplant", "h": "CAR T-cell therapy for patients not intended for transplant", "depth": 3}, {"id": "s-third-line-car-t-cell-therapy", "h": "Third-line CAR T-cell therapy", "depth": 3}, {"id": "s-choose-later-line-antibody-therapy-by-prior-exposure-and-deliverability", "h": "Choose later-line antibody therapy by prior exposure and deliverability", "depth": 2}, {"id": "s-bispecific-antibodies-and-combinations", "h": "Bispecific antibodies and combinations", "depth": 3}, {"id": "s-antibody-drug-and-immunomodulatory-combinations", "h": "Antibody-drug and immunomodulatory combinations", "depth": 3}, {"id": "s-follow-up-after-complete-metabolic-response", "h": "Follow-up after complete metabolic response", "depth": 2}, {"id": "s-references", "h": "References", "depth": 2}], "html": "<h2 id=\"s-establish-the-diagnosis-and-treatment-defining-biology\">Establish the diagnosis and treatment-defining biology</h2>\n<p>DLBCL is biologically heterogeneous. Gene-expression profiling separated germinal-centre B-cell-like (GCB) from activated B-cell-like (ABC) disease, and this division tracked survival after anthracycline-based chemotherapy. The foundational analysis included 40 patients with survival data and was exploratory: 5-year survival was 76% versus 16% (nominal p=0.01), with no hazard ratio or multivariable model. <a class=\"trial-link\" href=\"/evidence/#t-alizadeh-et-al-lymphochip\">Alizadeh et al. (Lymphochip)</a></p>\n<p>Cell of origin may be reported by an immunohistochemical classifier, but it should not select frontline treatment. Trials that prospectively enriched for non-GCB or ABC disease have not established a cell-of-origin-directed standard.</p>\n<p>Before treatment:</p>\n<ul><li>Rebiopsy at each relapse, where feasible, to confirm DLBCL. <sup class=\"trial-ref\"><a href=\"#ref-lymphoma-diffuse-large-b-cell-lymphoma-t-esmo-lymphomas-guideline-eyre-et-al\" aria-label=\"Reference 2: ESMO Lymphomas Guideline (Eyre et al.)\">2</a></sup></li><li>Perform PET-CT for staging. Record the IPI or age-adjusted IPI; calculate the CNS-IPI when CNS prophylaxis is being considered. <a class=\"trial-link\" href=\"/evidence/#t-esmo-lymphomas-guideline-eyre-et-al\">ESMO Lymphomas Guideline (Eyre et al.)</a></li><li>Test for a MYC rearrangement by FISH. If MYC is rearranged, add BCL2 FISH; MYC/BCL2 protein co-expression is not the definition of double-hit lymphoma. <sup class=\"trial-ref\"><a href=\"#ref-lymphoma-diffuse-large-b-cell-lymphoma-t-esmo-lymphomas-guideline-eyre-et-al\" aria-label=\"Reference 2: ESMO Lymphomas Guideline (Eyre et al.)\">2</a></sup></li><li>Obtain a baseline ECG. Echocardiography is recommended for older patients and those with cardiovascular risk factors and may be considered for all patients. <sup class=\"trial-ref\"><a href=\"#ref-lymphoma-diffuse-large-b-cell-lymphoma-t-esmo-lymphomas-guideline-eyre-et-al\" aria-label=\"Reference 2: ESMO Lymphomas Guideline (Eyre et al.)\">2</a></sup></li></ul>\n<h2 id=\"s-stage-and-assess-response-with-pet-ct\">Stage and assess response with PET-CT</h2>\n<p>PET-CT is the standard baseline and response-assessment modality. Interim PET-CT can be considered when it will change a prespecified treatment pathway. <sup class=\"trial-ref\"><a href=\"#ref-lymphoma-diffuse-large-b-cell-lymphoma-t-esmo-lymphomas-guideline-eyre-et-al\" aria-label=\"Reference 2: ESMO Lymphomas Guideline (Eyre et al.)\">2</a></sup></p>\n<p>Use the same response framework that governs the treatment pathway. A Deauville score of 1–3 defines complete metabolic response in the current limited-stage PET-adapted algorithm; a score of 4–5 after two cycles directs the longer chemotherapy and radiotherapy branch. <sup class=\"trial-ref\"><a href=\"#ref-lymphoma-diffuse-large-b-cell-lymphoma-t-esmo-lymphomas-guideline-eyre-et-al\" aria-label=\"Reference 2: ESMO Lymphomas Guideline (Eyre et al.)\">2</a></sup></p>\n<h2 id=\"s-use-prognostic-scores-to-structure-risk-not-to-replace-judgement\">Use prognostic scores to structure risk, not to replace judgement</h2>\n<p>The IPI and age-adjusted IPI remain the principal outcome-stratification scores. They also define current first-line branches: IPI 0–1 supports R-CHOP, whereas IPI 2 or higher permits pola-R-CHP as an alternative in fit patients younger than 80. The CNS-IPI informs discussion of CNS staging and prophylaxis, but does not prove that prophylaxis is effective. <sup class=\"trial-ref\"><a href=\"#ref-lymphoma-diffuse-large-b-cell-lymphoma-t-esmo-lymphomas-guideline-eyre-et-al\" aria-label=\"Reference 2: ESMO Lymphomas Guideline (Eyre et al.)\">2</a></sup></p>\n<h2 id=\"s-prevent-early-treatment-complications\">Prevent early treatment complications</h2>\n<h3 id=\"s-tumour-lysis-syndrome\">Tumour lysis syndrome</h3>\n<p>Assess tumour lysis risk before treatment. Use the active institutional protocol for biochemical monitoring, hydration, urate-lowering therapy, G6PD testing before rasburicase, electrolyte management and dialysis escalation.</p>\n<h3 id=\"s-r-chop-delivery\">R-CHOP delivery</h3>\n<p>R-CHOP should be prescribed from the active institutional protocol, including dose caps, infusion precautions, hepatitis B management, growth-factor policy and anti-infective prophylaxis.</p>\n<h2 id=\"s-choose-first-line-treatment-by-stage-ipi-age-and-fitness\">Choose first-line treatment by stage, IPI, age and fitness</h2>\n<h3 id=\"s-limited-stage-disease\">Limited-stage disease</h3>\n<p>For fit patients younger than 60 with IPI 0 and non-bulky disease below 7.5 cm, give four cycles of R-CHOP followed by two further rituximab doses. The same approach can be considered at age 60–80 when there are no additional risk factors. <sup class=\"trial-ref\"><a href=\"#ref-lymphoma-diffuse-large-b-cell-lymphoma-t-esmo-lymphomas-guideline-eyre-et-al\" aria-label=\"Reference 2: ESMO Lymphomas Guideline (Eyre et al.)\">2</a></sup></p>\n<p><a class=\"trial-link\" href=\"/evidence/#t-flyer\">FLYER</a> directly supports chemotherapy de-escalation in this narrow population. Four cycles of R-CHOP plus two further rituximab doses were non-inferior to six R-CHOP cycles for 3-year PFS (96% vs 94%), with fewer non-haematological adverse events. Both groups received six rituximab doses. The endpoint changed from EFS to PFS after the first interim analysis, and superiority was not tested.</p>\n<p>For fit patients younger than 80 with limited-stage bulky disease and aaIPI 0, use PET after two cycles. Complete metabolic response permits four total cycles of R-CHOP without further rituximab; Deauville 4–5 directs six cycles followed by involved-site radiotherapy. <sup class=\"trial-ref\"><a href=\"#ref-lymphoma-diffuse-large-b-cell-lymphoma-t-esmo-lymphomas-guideline-eyre-et-al\" aria-label=\"Reference 2: ESMO Lymphomas Guideline (Eyre et al.)\">2</a></sup></p>\n<p>For limited-stage aaIPI 1 or higher, options are six cycles of R-CHOP, six cycles of pola-R-CHP when IPI is 2 or higher, or three to four cycles of R-CHOP followed by involved-site radiotherapy. Patients aged 80 or older should generally receive six cycles of R-miniCHOP. <sup class=\"trial-ref\"><a href=\"#ref-lymphoma-diffuse-large-b-cell-lymphoma-t-esmo-lymphomas-guideline-eyre-et-al\" aria-label=\"Reference 2: ESMO Lymphomas Guideline (Eyre et al.)\">2</a></sup></p>\n<p><a class=\"trial-link\" href=\"/evidence/#t-mint\">MInT</a> established the value of rituximab in younger good-prognosis disease rather than the abbreviated regimen itself. Adding rituximab to six cycles of CHOP-like chemotherapy improved 3-year EFS from 59% to 79% and 3-year OS from 84% to 93%. The trial stopped early at its first interim analysis, and the often-cited HR 0.44 was derived from a multivariable model.</p>\n<h3 id=\"s-advanced-stage-disease\">Advanced-stage disease</h3>\n<p>For fit patients younger than 80, use six cycles of R-CHOP for IPI 0–1. Six cycles of pola-R-CHP is a first-line option for IPI 2 or higher. <sup class=\"trial-ref\"><a href=\"#ref-lymphoma-diffuse-large-b-cell-lymphoma-t-esmo-lymphomas-guideline-eyre-et-al\" aria-label=\"Reference 2: ESMO Lymphomas Guideline (Eyre et al.)\">2</a></sup></p>\n<p><a class=\"trial-link\" href=\"/evidence/#t-lnh-98-5-gela\">LNH-98.5 (GELA)</a> established rituximab with CHOP in patients aged 60–80. The prespecified 2-year analysis showed better EFS (57% vs 38%, p&lt;0.001) and OS (70% vs 57%, p=0.007); the benefit persisted at 5 years (OS 58% vs 45%). The primary report found no clinically meaningful increase in toxicity.</p>\n<p><a class=\"trial-link\" href=\"/evidence/#t-ricover-60\">RICOVER-60</a> compared six or eight cycles of CHOP-14 with or without rituximab in patients aged 61–80. Rituximab drove the benefit. Six cycles of R-CHOP-14 improved 3-year OS over six CHOP-14 cycles (78.1% vs 67.7%), whereas adding cycles 7 and 8 did not improve outcome and increased treatment-associated deaths.</p>\n<p>Dose-dense scheduling did not improve survival. In <a class=\"trial-link\" href=\"/evidence/#t-r-chop-14-v-21-ncri\">R-CHOP-14 v 21 (NCRI)</a>, 2-year OS was 82.7% with R-CHOP-14 and 80.8% with R-CHOP-21 (HR 0.90, 95% CI 0.70–1.15); PFS also did not differ. Treatment-related deaths were numerically higher with the 14-day schedule (9 vs 3), without statistical significance.</p>\n<h3 id=\"s-pola-r-chp\">Pola-R-CHP</h3>\n<p><a class=\"trial-link\" href=\"/evidence/#t-polarix\">POLARIX</a> replaced vincristine with polatuzumab vedotin in 879 previously untreated patients aged 18–80 with IPI 2–5. The primary PFS endpoint was met at 2 years (76.7% vs 70.2%; HR 0.73, 95% CI 0.57–0.95; p=0.02), and the advantage persisted at 5 years (64.9% vs 59.1%; HR 0.77, 0.62–0.97).</p>\n<p>No statistically significant OS advantage had been demonstrated at the 5-year analysis (82.3% vs 79.5%; HR 0.85, 95% CI 0.63–1.15). Fewer patients required subsequent therapy over 5 years (25.5% vs 35.3%). Grade 3 or higher adverse events were similar overall, although grade 3–4 febrile neutropenia was more frequent with pola-R-CHP (13.8% vs 8.0%).</p>\n<p>Do not use the exploratory cell-of-origin results to select pola-R-CHP. The 5-year PFS estimates favoured treatment in ABC disease (HR 0.38) but not GCB disease (HR 1.07); no interaction test was reported.</p>\n<h3 id=\"s-new-r-chop-combinations\">New R-CHOP combinations</h3>\n<p><a class=\"trial-link\" href=\"/evidence/#t-frontmind\">frontMIND</a> added tafasitamab and lenalidomide to R-CHOP in high-risk untreated DLBCL or high-grade B-cell lymphoma. PFS improved (HR 0.75, 95% CI 0.59–0.96; 2-year 71.1% vs 62.9%), but interim OS was not significant and remained immature (HR 0.85, 0.63–1.14). Grade 3 or higher treatment-emergent events increased from 76% to 87%.</p>\n<p><a class=\"trial-link\" href=\"/evidence/#t-deb\">DEB</a> enrolled patients with MYC/BCL2 double-expressor DLBCL and excluded double-hit or triple-hit disease. Tucidinostat plus R-CHOP improved 2-year EFS (60.3% vs 50.5%; HR 0.72, 95% CI 0.54–0.96), but PFS, OS and DFS intervals crossed 1. Toxicity increased, particularly during tucidinostat maintenance, and the trial was conducted entirely in China.</p>\n<p>These regimens improve surrogate endpoints in selected populations without a demonstrated OS advantage to date. They should not be presented as interchangeable with R-CHOP or pola-R-CHP.</p>\n<h2 id=\"s-recognise-the-limits-of-frontline-intensification\">Recognise the limits of frontline intensification</h2>\n<p>Several phase 3 strategies failed on their primary endpoint:</p>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-calgb-alliance-50303\">CALGB/Alliance 50303</a> found no PFS or OS advantage for DA-EPOCH-R over R-CHOP (PFS HR 0.93, p=0.65; OS HR 1.09, p=0.64).</span><span class=\"evidence-detail\">Grade 3–5 treatment-related events occurred in 98% versus 78%, with more febrile neutropenia, neuropathy and mucositis.</span></li><li class=\"evidence-prose\"><a class=\"trial-link\" href=\"/evidence/#t-goya\">GOYA</a> found no PFS benefit from substituting obinutuzumab for rituximab (3-year 69.6% vs 66.9%; HR 0.92, p=0.39), with more grade 3–5, serious and fatal adverse events.</li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-remodl-b\">REMoDL-B</a> found no primary PFS benefit from adding bortezomib to R-CHOP (30-month HR 0.86, p=0.28).</span><span class=\"evidence-detail\">A nominal 5-year treatment-by-cell-of-origin interaction remains hypothesis-generating; grade 3 or higher neuropathy and serious adverse events were more frequent with bortezomib.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-phoenix\">PHOENIX</a> missed both co-primary EFS endpoints with ibrutinib-R-CHOP.</span><span class=\"evidence-detail\">The exploratory age interaction suggested benefit below 60 and numerical harm at 60 or older, alongside greater toxicity and reduced delivery of R-CHOP in older patients.</span></li><li class=\"evidence-prose\"><a class=\"trial-link\" href=\"/evidence/#t-robust\">ROBUST</a> found no PFS improvement from lenalidomide-R-CHOP in prospectively selected ABC disease (HR 0.85, p=0.29), with more haematological toxicity and treatment discontinuation.</li></ul>\n<p><a class=\"trial-link\" href=\"/evidence/#t-swog-9704\">SWOG 9704</a> tested upfront autologous transplant in high-intermediate- or high-risk responders after induction. Transplant improved one co-primary endpoint, 2-year PFS (69% vs 55%; p=0.005), but not OS (74% vs 71%; p=0.30). Only 150 of 225 randomised patients with B-cell lymphoma received rituximab. Upfront transplant is not routine first-remission consolidation.</p>\n<h2 id=\"s-select-cns-prophylaxis-sparingly\">Select CNS prophylaxis sparingly</h2>\n<p>High CNS relapse risk and prophylaxis efficacy are different questions. Calculate the CNS-IPI when prophylaxis is under consideration. End-of-treatment high-dose methotrexate, two cycles of 3–3.5 g/m², may be considered only for highly selected younger patients at ultra-high risk, such as CNS-IPI 5–6, multiple extranodal sites, or renal, adrenal, breast or testicular involvement. The recommendation is weak [IV,C]. <sup class=\"trial-ref\"><a href=\"#ref-lymphoma-diffuse-large-b-cell-lymphoma-t-esmo-lymphomas-guideline-eyre-et-al\" aria-label=\"Reference 2: ESMO Lymphomas Guideline (Eyre et al.)\">2</a></sup></p>\n<p><a class=\"trial-link\" href=\"/evidence/#t-lewis-international-cns-prophylaxis-study-group\">Lewis (International CNS Prophylaxis Study Group)</a> analysed 2,418 high-risk patients, 425 of whom received high-dose methotrexate. The diagnosis-time analysis favoured prophylaxis but was vulnerable to immortal-time bias. In 1,616 patients in complete response after induction, high-dose methotrexate was not associated with lower CNS progression (adjusted HR 0.74, 95% CI 0.4–1.3; p=0.30; adjusted 5-year risk 5.0% vs 6.5%).</p>\n<h2 id=\"s-use-radiotherapy-selectively\">Use radiotherapy selectively</h2>\n<p>Consider involved-site radiotherapy with a radiation oncologist for an initial isolated bulky lesion of at least 7 cm or a residual FDG-avid area suspicious for disease when biopsy is not feasible. Residual FDG-avid lesions should be biopsied wherever feasible. <sup class=\"trial-ref\"><a href=\"#ref-lymphoma-diffuse-large-b-cell-lymphoma-t-esmo-lymphomas-guideline-eyre-et-al\" aria-label=\"Reference 2: ESMO Lymphomas Guideline (Eyre et al.)\">2</a></sup></p>\n<p>This is a case-by-case decision. Routine consolidation after a complete metabolic response is not established in the PET-CT era.</p>\n<h2 id=\"s-adapt-treatment-for-older-or-anthracycline-unfit-patients\">Adapt treatment for older or anthracycline-unfit patients</h2>\n<p>Use comprehensive geriatric and organ-function assessment rather than chronological age alone. Patients aged 80 or older can receive six cycles of R-miniCHOP; full-dose R-CHOP may be considered only in exceptionally fit individuals. A corticosteroid pre-phase or first-cycle cytotoxic attenuation can be considered when disease burden causes reversible physiological impairment. <sup class=\"trial-ref\"><a href=\"#ref-lymphoma-diffuse-large-b-cell-lymphoma-t-esmo-lymphomas-guideline-eyre-et-al\" aria-label=\"Reference 2: ESMO Lymphomas Guideline (Eyre et al.)\">2</a></sup></p>\n<p><a class=\"trial-link\" href=\"/evidence/#t-lnh03-7b-r-minichop\">LNH03-7B (R-miniCHOP)</a> studied 150 patients older than 80. R-miniCHOP used full-dose rituximab with attenuated cyclophosphamide, doxorubicin and vincristine. Median OS was 29 months, 2-year OS 59% and 2-year PFS 47%. Treatment remained hazardous: 18% died during treatment and 12 deaths were attributed to treatment toxicity. The study was single-arm.</p>\n<p>When anthracycline is unsuitable, guideline-supported options include six cycles of R-CEOP, R-COMP or R-GCVP. Regimen choice should reflect cardiac function, comorbidity, disease tempo and local protocol. <sup class=\"trial-ref\"><a href=\"#ref-lymphoma-diffuse-large-b-cell-lymphoma-t-esmo-lymphomas-guideline-eyre-et-al\" aria-label=\"Reference 2: ESMO Lymphomas Guideline (Eyre et al.)\">2</a></sup></p>\n<h2 id=\"s-manage-double-hit-and-double-expressor-disease-separately\">Manage double-hit and double-expressor disease separately</h2>\n<p>MYC/BCL2 double-hit lymphoma is defined by rearrangements, whereas double-expressor DLBCL is defined by protein expression. For young, fit patients with co-existing MYC and BCL2 rearrangements, treatment intensification with DA-EPOCH-R or R-CODOX-M/R-IVAC can be considered, but the recommendation rests on low-level evidence. <sup class=\"trial-ref\"><a href=\"#ref-lymphoma-diffuse-large-b-cell-lymphoma-t-esmo-lymphomas-guideline-eyre-et-al\" aria-label=\"Reference 2: ESMO Lymphomas Guideline (Eyre et al.)\">2</a></sup></p>\n<p>The negative unselected DA-EPOCH-R comparison does not resolve the optimal regimen for double-hit lymphoma. Conversely, the DEB result applies to double-expressor disease and excluded double-hit or triple-hit disease. Do not transfer either result across these biological groups.</p>\n<h2 id=\"s-reassess-disease-at-relapse\">Reassess disease at relapse</h2>\n<p>Rebiopsy at relapse where feasible. Define treatment by time from first-line therapy, suitability for CAR T-cell therapy or transplant, prior exposures, organ function and the feasibility of delivering treatment without disease progression during manufacture. <sup class=\"trial-ref\"><a href=\"#ref-lymphoma-diffuse-large-b-cell-lymphoma-t-esmo-lymphomas-guideline-eyre-et-al\" aria-label=\"Reference 2: ESMO Lymphomas Guideline (Eyre et al.)\">2</a></sup></p>\n<p><a class=\"trial-link\" href=\"/evidence/#t-scholar-1\">SCHOLAR-1</a> provides the pre-CAR-T benchmark for refractory large B-cell lymphoma: ORR 26%, CR 7%, median OS 6.3 months and 20% alive at 2 years. It pooled two trials and two institutional cohorts without central response review, and should not be treated as a randomised comparator.</p>\n<h3 id=\"s-refractory-disease-or-relapse-within-12-months\">Refractory disease or relapse within 12 months</h3>\n<p>For suitable patients, second-line anti-CD19 CAR T-cell therapy with axicabtagene ciloleucel or lisocabtagene maraleucel is preferred. <sup class=\"trial-ref\"><a href=\"#ref-lymphoma-diffuse-large-b-cell-lymphoma-t-esmo-lymphomas-guideline-eyre-et-al\" aria-label=\"Reference 2: ESMO Lymphomas Guideline (Eyre et al.)\">2</a></sup></p>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-zuma-7\">ZUMA-7</a> improved EFS over platinum salvage followed by transplant in responders (median 8.3 vs 2.0 months; HR 0.40; 24-month 41% vs 16%).</span><span class=\"evidence-detail\">ORR was 83% versus 50% and CR 65% versus 32%. Interim OS did not reach significance (HR 0.73, 95% CI 0.53–1.01), with 56% of controls later receiving cellular therapy.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-transform\">TRANSFORM</a> improved EFS with lisocabtagene maraleucel (median 10.1 vs 2.3 months; HR 0.35), with CR 66% versus 39%.</span><span class=\"evidence-detail\">Interim OS was immature (HR 0.51, 95% CI 0.26–1.00), and 50 of 92 controls were approved to cross over.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-belinda\">BELINDA</a> found no EFS benefit with tisagenlecleucel (median 3.0 months in both groups; HR 1.07).</span><span class=\"evidence-detail\">Median time from leukapheresis to infusion was 52 days; 83% received bridging therapy and 26% had progressed by the week-6 assessment before infusion.</span></li></ul>\n<p>Product delivery matters, and lymphodepletion is regimen-specific. ZUMA-7 used cyclophosphamide 500 mg/m² plus fludarabine 30 mg/m² daily on days −5 to −3. <sup class=\"trial-ref\"><a href=\"#ref-lymphoma-diffuse-large-b-cell-lymphoma-t-zuma-7\" aria-label=\"Reference 20: ZUMA-7\">20</a></sup></p>\n<p>TRANSFORM used cyclophosphamide 300 mg/m² plus fludarabine 30 mg/m² daily for three days. <sup class=\"trial-ref\"><a href=\"#ref-lymphoma-diffuse-large-b-cell-lymphoma-t-transform\" aria-label=\"Reference 21: TRANSFORM\">21</a></sup></p>\n<h3 id=\"s-later-relapse-in-transplant-suitable-patients\">Later relapse in transplant-suitable patients</h3>\n<p>For relapse beyond 12 months, use platinum-based reinduction and proceed to autologous transplant after complete metabolic response or a Deauville-4 partial metabolic response. <sup class=\"trial-ref\"><a href=\"#ref-lymphoma-diffuse-large-b-cell-lymphoma-t-esmo-lymphomas-guideline-eyre-et-al\" aria-label=\"Reference 2: ESMO Lymphomas Guideline (Eyre et al.)\">2</a></sup></p>\n<p><a class=\"trial-link\" href=\"/evidence/#t-parma\">PARMA</a> established transplant for chemosensitive relapse in the pre-rituximab era. Transplant improved 5-year EFS (46% vs 12%) and OS (53% vs 32%). Chemosensitivity defined the eligible population: 5-year OS was 42% among randomised responders but 11% among patients who never responded to DHAP.</p>\n<p>Salvage regimen choice can prioritise setting and toxicity because no regimen has established superior survival:</p>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-coral\">CORAL</a> found similar response and survival with R-ICE and R-DHAP.</span><span class=\"evidence-detail\">Three-year EFS was poor after prior rituximab and in refractory or early-relapsing disease; R-DHAP caused more platelet transfusions and grade 4 renal toxicity.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-ncic-ctg-ly-12\">NCIC-CTG LY.12</a> established noninferiority of GDP to DHAP for response after two cycles (140/310 vs 136/309 in ITT; noninferiority p=0.005).</span><span class=\"evidence-detail\">The subsequent gated test for a superior transplantation rate was not met (52.1% vs 49.3%; p=0.44). GDP caused less grade 3–4 toxicity, febrile neutropenia, transfusion and hospitalisation.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-hovon-44\">HOVON 44</a> found better response and failure-free survival when rituximab was added to DHAP-VIM-DHAP, but no significant OS improvement.</span><span class=\"evidence-detail\">Only 4% had previously received rituximab, limiting current applicability.</span></li></ul>\n<h3 id=\"s-car-t-cell-therapy-for-patients-not-intended-for-transplant\">CAR T-cell therapy for patients not intended for transplant</h3>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-alycante\">ALYCANTE</a> enrolled and leukapheresed 69 transplant-ineligible patients after early treatment failure; 62 were infused.</span><span class=\"evidence-detail\">Among the infused patients, investigator-assessed 3-month CMR was 71% (44/62) and central-review CMR was 66% (41/62); median PFS from infusion was 11.8 months. Non-relapse mortality was 10% (6/62), entirely from infections occurring more than 2 months after infusion.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-pilot\">PILOT</a> evaluated lisocabtagene maraleucel after one prior line in patients not intended for transplant.</span><span class=\"evidence-detail\">Among 61 infused patients, ORR was 80% and CR 54%. Grade 3 or higher cytopenias persisted at day 28 in 30%; 12 of 74 leukapheresed patients were never infused.</span></li></ul>\n<h3 id=\"s-third-line-car-t-cell-therapy\">Third-line CAR T-cell therapy</h3>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-zuma-1\">ZUMA-1</a> reported investigator-assessed ORR 82% and CR 54% with axicabtagene ciloleucel; independent review gave ORR 71%.</span><span class=\"evidence-detail\">CRS occurred in 93% and neurological events in 64%, with grade 3 or higher rates of 13% and 28%. Of 111 enrolled patients, 101 were infused.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-juliet\">JULIET</a> reported ORR 52% and CR 40% with tisagenlecleucel among evaluable patients.</span><span class=\"evidence-detail\">Only 111 of 165 enrolled patients were infused, at a median 54 days; 16 died before infusion. Responses were durable among those who achieved them.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-transcend-nhl-001\">TRANSCEND NHL 001</a> reported ORR 73% and CR 53% with lisocabtagene maraleucel among infused evaluable patients.</span><span class=\"evidence-detail\">Fifteen percent of leukapheresed patients were not infused. Grade 3 or higher CRS occurred in 2% and neurological events in 10%, using a different CRS scale from JULIET.</span></li></ul>\n<h2 id=\"s-choose-later-line-antibody-therapy-by-prior-exposure-and-deliverability\">Choose later-line antibody therapy by prior exposure and deliverability</h2>\n<h3 id=\"s-bispecific-antibodies-and-combinations\">Bispecific antibodies and combinations</h3>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-starglo\">STARGLO</a> established glofitamab-GemOx over R-GemOx in transplant-ineligible relapsed/refractory DLBCL.</span><span class=\"evidence-detail\">Median OS was 25.5 versus 12.9 months (HR 0.62), median PFS 13.8 versus 3.6 months (HR 0.40), and CR 59% versus 25%. Glofitamab is fixed-duration for 12 cycles; grade 3 or higher adverse events occurred in 78% versus 41%.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-sunmo\">SUNMO</a> established fixed-duration subcutaneous mosunetuzumab-polatuzumab over R-GemOx.</span><span class=\"evidence-detail\">ORR was 70% versus 40% and median PFS 11.5 versus 3.8 months (HR 0.41). Interim OS was not significant (HR 0.80, 95% CI 0.5–1.2). CRS occurred in 26%, with grade 3 events in 0.7%.</span></li></ul>\n<p>For bispecific monotherapy after at least two prior lines:</p>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-glofitamab-pivotal-np30179\">Glofitamab pivotal (NP30179)</a> produced ORR 52% and CR 39% by independent review.</span><span class=\"evidence-detail\">Glofitamab stops after 12 cycles. CRS occurred in 63%, but grade 3 or higher events in 4%; one third had prior CAR T-cell therapy.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-epcore-nhl-1\">EPCORE NHL-1</a> produced ORR 63% and CR 39% with subcutaneous epcoritamab given until progression.</span><span class=\"evidence-detail\">After prior CAR T-cell therapy, ORR was 54% and CR 34%. CRS occurred in 50%, largely after the first full dose; grade 3 CRS occurred in 2.5%.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-elm-2\">ELM-2</a> produced ORR 52% and CR 32% with odronextamab, but excluded previous CAR T-cell therapy.</span><span class=\"evidence-detail\">Grade 3 or higher infection occurred in 39%, and 15 patients died of infection.</span></li></ul>\n<h3 id=\"s-antibody-drug-and-immunomodulatory-combinations\">Antibody-drug and immunomodulatory combinations</h3>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-polargo\">POLARGO</a> improved OS with pola-R-GemOx over R-GemOx in patients ineligible for transplant and CAR T-cell therapy (median 19.5 vs 12.5 months; HR 0.60).</span><span class=\"evidence-detail\">Median PFS was 7.4 versus 2.7 months. Peripheral neuropathy and fatal adverse events were more frequent, although investigator-attributed treatment-related fatal events were similar.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-go29365\">GO29365</a> compared pola-bendamustine-rituximab with bendamustine-rituximab in 80 patients.</span><span class=\"evidence-detail\">CR was 40% versus 18%, median PFS 9.5 versus 3.7 months and median OS 12.4 versus 4.7 months. The study was not powered to prove superiority, and haematological toxicity and neuropathy increased.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-l-mind\">L-MIND</a> reported ORR 60%, CR 43% and median PFS 12.1 months with tafasitamab-lenalidomide in a single-arm, transplant-ineligible population.</span><span class=\"evidence-detail\">Primary refractory disease, known double-hit or triple-hit disease, CNS involvement and previous anti-CD19 therapy were excluded.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-re-mind2\">RE-MIND2</a> matched the L-MIND cohort to real-world therapies.</span><span class=\"evidence-detail\">Conventional treatment produced median OS of approximately 10–12 months; comparisons favoured tafasitamab-lenalidomide but were non-randomised, used different response-assessment methods and were sponsor-conducted.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-lotis-2\">LOTIS-2</a> reported ORR 48% and CR 24% with outpatient loncastuximab tesirine after at least two prior regimens.</span><span class=\"evidence-detail\">Median duration of response was 10.3 months. Oedema or effusion, skin or nail toxicity, gamma-glutamyl transferase elevation and cytopenias require monitoring.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-echelon-3\">ECHELON-3</a> improved interim OS by adding brentuximab vedotin to lenalidomide-rituximab after at least two prior lines (median 13.8 vs 8.5 months; HR 0.63).</span><span class=\"evidence-detail\">Grade 3 or higher adverse events occurred in 88% versus 77%, including more neutropenia and thrombocytopenia.</span></li></ul>\n<h2 id=\"s-follow-up-after-complete-metabolic-response\">Follow-up after complete metabolic response</h2>\n<p>Routine surveillance PET-CT or diagnostic CT is generally not recommended after first-line treatment to complete metabolic response. Perform history and examination every 3–6 months for 2 years; follow-up may be discontinued after 2–5 years in asymptomatic patients. <sup class=\"trial-ref\"><a href=\"#ref-lymphoma-diffuse-large-b-cell-lymphoma-t-esmo-lymphomas-guideline-eyre-et-al\" aria-label=\"Reference 2: ESMO Lymphomas Guideline (Eyre et al.)\">2</a></sup></p>\n<h2 id=\"s-references\">References</h2>\n<ol class=\"refs\">\n<li id=\"ref-lymphoma-diffuse-large-b-cell-lymphoma-t-alizadeh-et-al-lymphochip\"><a class=\"trial-link\" href=\"/evidence/#t-alizadeh-et-al-lymphochip\">Alizadeh et al. (Lymphochip)</a>. <a href=\"https://drive.google.com/file/d/1z99qmXgtmF0ZvntJYYJhsEuqKfiyGQDw/preview\">Nature 2000;403:503-511</a></li>\n<li id=\"ref-lymphoma-diffuse-large-b-cell-lymphoma-t-esmo-lymphomas-guideline-eyre-et-al\"><a class=\"trial-link\" href=\"/evidence/#t-esmo-lymphomas-guideline-eyre-et-al\">ESMO Lymphomas Guideline (Eyre et al.)</a>. <a href=\"https://drive.google.com/file/d/1Q4FmVrmfO_P41UyWUm9NEqqxuQQgK01C/preview\">Ann Oncol 2025;36:1263-1284</a>; <a href=\"https://drive.google.com/file/d/1f7teQkh8ToLNcnf8f9xULbcg1V2uu7oR/preview\">Ann Oncol 2015;26(Suppl 5):v116-v125</a>; <a href=\ a-t-frontmind\"><a class=\"trial-link\" href=\"/evidence/#t-frontmind\">frontMIND</a>. <a href=\"https://drive.google.com/file/d/1E6v9b2z0SI3lPrj4jHSQqrM2evCe7bpg/preview\">Lancet 2026;407:2528-2541</a></li>\n<li id=\"ref-lymphoma-diffuse-large-b-cell-lymphoma-t-deb\"><a class=\"trial-link\" href=\"/evidence/#t-deb\">DEB</a>. <a href=\"https://drive.google.com/file/d/1pTNKAlos8C-kHcvlaJ_Wlw_gApTxhNoe/preview\">JAMA 2026;335:1684-1693</a>; <a href=\"https://pubmed.ncbi.nlm.nih.gov/30948276/\">Lancet Oncol 2019;20:649-662</a></li>\n<li id=\"ref-lymphoma-diffuse-large-b-cell-lymphoma-t-calgb-alliance-50303\"><a class=\"trial-link\" href=\"/evidence/#t-calgb-alliance-50303\">CALGB/Alliance 50303</a>. <a href=\"https://drive.google.com/file/d/12jeHV2xAYb8wkK_r3Zn7PakSHsFUPbQG/preview\">J Clin Oncol 2019;37:1790-1799</a></li>\n<li id=\"ref-lymphoma-diffuse-large-b-cell-lymphoma-t-goya\"><a class=\"trial-link\" href=\"/evidence/#t-goya\">GOYA</a>. <a href=\"https://drive.google.com/file/d/1QD8KCHlcj9HLMtmzTCorA7aL8c_3AGeJ/preview\">J Clin Oncol 2017;35:3529-3537</a></li>\n<li id=\"ref-lymphoma-diffuse-large-b-cell-lymphoma-t-remodl-b\"><a class=\"trial-link\" href=\"/evidence/#t-remodl-b\">REMoDL-B</a>. <a href=\"https://drive.google.com/file/d/1iVyzDB-OFvFFwzpwlkbdJXrGRuqTLmbP/preview\">Lancet Oncol 2019;20:649-662</a>; <a href=\"https://drive.google.com/file/d/1f-LpwXnaut0_kOOEBiSEuQgI3dc7HfFs/preview\">J Clin Oncol 2023;41:2718-2723</a></li>\n<li id=\"ref-lymphoma-diffuse-large-b-cell-lymphoma-t-phoenix\"><a class=\"trial-link\" href=\"/evidence/#t-phoenix\">PHOENIX</a>. <a href=\"https://drive.google.com/file/d/1UfzfzI9JBhcfe6lroq9xUeKOrdP-TGx9/preview\">J Clin Oncol 2019;37:1285-1295</a></li>\n<li id=\"ref-lymphoma-diffuse-large-b-cell-lymphoma-t-robust\"><a class=\"trial-link\" href=\"/evidence/#t-robust\">ROBUST</a>. <a href=\"https://drive.google.com/file/d/18beT8sm8yUDHGrKrxpnLt73NUJKChwcp/preview\">J Clin Oncol 2021;39:1317-1328</a></li>\n<li id=\"ref-lymphoma-diffuse-large-b-cell-lymphoma-t-swog-9704\"><a class=\"trial-link\" href=\"/evidence/#t-swog-9704\">SWOG 9704</a>. <a href=\"https://drive.google.com/file/d/1iMzKhCs_jZjMyvpxHQ9SMxjwoGsexmpY/preview\">N Engl J Med 2013;369:1681-1690</a></li>\n<li id=\"ref-lymphoma-diffuse-large-b-cell-lymphoma-t-lewis-international-cns-prophylaxis-study-group\"><a class=\"trial-link\" href=\"/evidence/#t-lewis-international-cns-prophylaxis-study-group\">Lewis (International CNS Prophylaxis Study Group)</a>. <a href=\"https://drive.google.com/file/d/1W2gl-l4GDvxL4HRPRevcdGyWC1C0xvFN/preview\">J Clin Oncol 2023;41:5376-5387</a></li>\n<li id=\"ref-lymphoma-diffuse-large-b-cell-lymphoma-t-lnh03-7b-r-minichop\"><a class=\"trial-link\" href=\"/evidence/#t-lnh03-7b-r-minichop\">LNH03-7B (R-miniCHOP)</a>. <a href=\"https://drive.google.com/file/d/1BH0ZQ3WmmEHIPGV5svQVOxQ4D72cbbEa/preview\">Lancet Oncol 2011;12:460-468</a></li>\n<li id=\"ref-lymphoma-diffuse-large-b-cell-lymphoma-t-scholar-1\"><a class=\"trial-link\" href=\"/evidence/#t-scholar-1\">SCHOLAR-1</a>. <a href=\"https://drive.google.com/file/d/1FW7KjeGUae_OL6fim8RB6eSlEHkxD-Dl/preview\">Blood 2017;130:1800-1808</a></li>\n<li id=\"ref-lymphoma-diffuse-large-b-cell-lymphoma-t-zuma-7\"><a class=\"trial-link\" href=\"/evidence/#t-zuma-7\">ZUMA-7</a>. <a href=\"https://drive.google.com/file/d/1si-BL14FPWqP4zWcMZpXDksanSTCsb-9/preview\">N Engl J Med 2022;386:640-654</a></li>\n<li id=\"ref-lymphoma-diffuse-large-b-cell-lymphoma-t-transform\"><a class=\"trial-link\" href=\"/evidence/#t-transform\">TRANSFORM</a>. <a href=\"https://drive.google.com/file/d/1xANS9KeQmBWdAb0SzTqLrNQ0mjrdWciM/preview\">Lancet 2022;399:2294-2308</a></li>\n<li id=\"ref-lymphoma-diffuse-large-b-cell-lymphoma-t-belinda\"><a class=\"trial-link\" href=\"/evidence/#t-belinda\">BELINDA</a>. <a href=\"https://drive.google.com/file/d/1sFZixPeh_aLmS2C126e4i0PlSsIMGuaP/preview\">N Engl J Med 2022;386:629-639</a></li>\n<li id=\"ref-lymphoma-diffuse-large-b-cell-lymphoma-t-parma\"><a class=\"trial-link\" href=\"/evidence/#t-parma\">PARMA</a>. <a href=\"https://drive.google.com/file/d/1Nu6halwJie3uPpBbqM98-n2Rx5crEiGd/preview\">N Engl J Med 1995;333:1540-1545</a></li>\n<li id=\"ref-lymphoma-diffuse-large-b-cell-lymphoma-t-coral\"><a class=\"trial-link\" href=\"/evidence/#t-coral\">CORAL</a>. <a href=\"https://drive.google.com/file/d/1MZlEdWxV8fMAQEJejPfdj47e6orXKkdw/preview\">J Clin Oncol 2010;28:4184-4190</a></li>\n<li id=\"ref-lymphoma-diffuse-large-b-cell-lymphoma-t-ncic-ctg-ly-12\"><a class=\"trial-link\" href=\"/evidence/#t-ncic-ctg-ly-12\">NCIC-CTG LY.12</a>. <a href=\"https://drive.google.com/file/d/1qhnLqdlYDf5hb_zbaFSbjSsKmBBFZbfF/preview\">J Clin Oncol 2014;32:3490-3496</a></li>\n<li id=\"ref-lymphoma-diffuse-large-b-cell-lymphoma-t-hovon-44\"><a class=\"trial-link\" href=\"/evidence/#t-hovon-44\">HOVON 44</a>. <a href=\"https://drive.google.com/file/d/1RpZz6SfVqFV6jobGkwoIamS5dQ2mnzwO/preview\">Blood 2008;111:537-543</a></li>\n<li id=\"ref-lymphoma-diffuse-large-b-cell-lymphoma-t-alycante\"><a class=\"trial-link\" href=\"/evidence/#t-alycante\">ALYCANTE</a>. <a href=\"https://drive.google.com/file/d/1PkXt0fjQbCROVQbgFj0IZaiuIlDrCL34/preview\">Nat Med 2023;29:2593-2601</a></li>\n<li id=\"ref-lymphoma-diffuse-large-b-cell-lymphoma-t-pilot\"><a class=\"trial-link\" href=\"/evidence/#t-pilot\">PILOT</a>. <a href=\"https://drive.google.com/file/d/15G16iUCdzzvyJWnLBUIAv4cS1ZS-5-9I/preview\">Lancet Oncol 2022;23:1066-1077</a></li>\n<li id=\"ref-lymphoma-diffuse-large-b-cell-lymphoma-t-zuma-1\"><a class=\"trial-link\" href=\"/evidence/#t-zuma-1\">ZUMA-1</a>. <a href=\"https://drive.google.com/file/d/14SKgXHJRX4wrC47EinLo3wLca7RdG4Rp/preview\">N Engl J Med 2017;377:2531-2544</a></li>\n<li id=\"ref-lymphoma-diffuse-large-b-cell-lymphoma-t-juliet\"><a class=\"trial-link\" href=\"/evidence/#t-juliet\">JULIET</a>. <a href=\"https://drive.google.com/file/d/1dTTWEJ3uIhiD-1iqmezKDRceSVMDbJDG/preview\">N Engl J Med 2019;380:45-56</a></li>\n<li id=\"ref-lymphoma-diffuse-large-b-cell-lymphoma-t-transcend-nhl-001\"><a class=\"trial-link\" href=\"/evidence/#t-transcend-nhl-001\">TRANSCEND NHL 001</a>. <a href=\"https://drive.google.com/file/d/19CFGJZCr-lPQjpKnxHWeUOSEBv453NqG/preview\">Lancet 2020;396:839-852</a></li>\n<li id=\"ref-lymphoma-diffuse-large-b-cell-lymphoma-t-starglo\"><a class=\"trial-link\" href=\"/evidence/#t-starglo\">STARGLO</a>. <a href=\"https://drive.google.com/file/d/1C8qbDsXXp22nDPW5M6HmIeMfjHDRSp2g/preview\">Lancet 2024;404:1940-1954</a></li>\n<li id=\"ref-lymphoma-diffuse-large-b-cell-lymphoma-t-sunmo\"><a class=\"trial-link\" href=\"/evidence/#t-sunmo\">SUNMO</a>. <a href=\"https://drive.google.com/file/d/1UNFsEUo5IvakrlH2hbJcGnRLLkzGZqJi/preview\">J Clin Oncol 2025;43:3799-3811</a></li>\n<li id=\"ref-lymphoma-diffuse-large-b-cell-lymphoma-t-glofitamab-pivotal-np30179\"><a class=\"trial-link\" href=\"/evidence/#t-glofitamab-pivotal-np30179\">Glofitamab pivotal (NP30179)</a>. <a href=\"https://drive.google.com/file/d/1Dnx6QSnx5T9Rr0_pZXH4g76nufA6Zwbw/preview\">N Engl J Med 2022;387:2220-2231</a></li>\n<li id=\"ref-lymphoma-diffuse-large-b-cell-lymphoma-t-epcore-nhl-1\"><a class=\"trial-link\" href=\"/evidence/#t-epcore-nhl-1\">EPCORE NHL-1</a>. <a href=\"https://drive.google.com/file/d/16Tvp-GdrNZyK7E1Dh2Kd97LQQu7kR77r/preview\">J Clin Oncol 2023;41:2238-2247</a></li>\n<li id=\"ref-lymphoma-diffuse-large-b-cell-lymphoma-t-elm-2\"><a class=\"trial-link\" href=\"/evidence/#t-elm-2\">ELM-2</a>. <a href=\"https://drive.google.com/file/d/1odJNFbvNgd6wiZ-GTgkTxDOHGlMJHTGH/preview\">Nat Cancer 2025;6:528-539</a></li>\n<li id=\"ref-lymphoma-diffuse-large-b-cell-lymphoma-t-polargo\"><a class=\"trial-link\" href=\"/evidence/#t-polargo\">POLARGO</a>. <a href=\"https://drive.google.com/file/d/1ct0AsuZmxgbEmymgJ_2V7VugjLFwtj0A/preview\">J Clin Oncol 2026 (online ahead of print; JCO-25-02849)</a></li>\n<li id=\"ref-lymphoma-diffuse-large-b-cell-lymphoma-t-go29365\"><a class=\"trial-link\" href=\"/evidence/#t-go29365\">GO29365</a>. <a href=\"https://drive.google.com/file/d/1deNDslz-qb2Ygrp67EuziwNTpmPrKJXm/preview\">J Clin Oncol 2020;38:155-165</a></li>\n<li id=\"ref-lymphoma-diffuse-large-b-cell-lymphoma-t-l-mind\"><a class=\"trial-link\" href=\"/evidence/#t-l-mind\">L-MIND</a>. <a href=\"https://drive.google.com/file/d/1AK68jLxTcHRdDRdLAF_009PqjDDl7dnk/preview\">Lancet Oncol 2020;21:978-988</a></li>\n<li id=\"ref-lymphoma-diffuse-large-b-cell-lymphoma-t-re-mind2\"><a class=\"trial-link\" href=\"/evidence/#t-re-mind2\">RE-MIND2</a>. <a href=\"https://drive.google.com/file/d/1du7TIUTzbZob8ljSKNGeCK0HHfR_7wgV/preview\">Clin Cancer Res 2022;28:4003-4017</a>; <a href=\"https://drive.google.com/file/d/1X2E4609S9rquWFsEWBg0kZ-SaZbmpwCg/preview\">Ann Hematol 2023;102:1773-1787</a></li>\n<li id=\"ref-lymphoma-diffuse-large-b-cell-lymphoma-t-lotis-2\"><a class=\"trial-link\" href=\"/evidence/#t-lotis-2\">LOTIS-2</a>. <a href=\"https://drive.google.com/file/d/1MUk0Dd8OfpBA0twL1KuOL5_SP3LZguMF/preview\">Lancet Oncol 2021;22:790-800</a></li>\n<li id=\"ref-lymphoma-diffuse-large-b-cell-lymphoma-t-echelon-3\"><a class=\"trial-link\" href=\"/evidence/#t-echelon-3\">ECHELON-3</a>. <a href=\"https://drive.google.com/file/d/1uXEpYyVlvP8yUi9ycBvHz-RoLDZ7TpSj/preview\">J Clin Oncol 2025;43:1061-1072</a></li>\n</ol>", "_hay": "diffuse large b-cell lymphoma diffuse-large-b-cell-lymphoma lymphoma establish the diagnosis and treatment-defining biology stage and assess response with pet-ct use prognostic scores to structure risk, not to replace judgement prevent early treatment complications tumour lysis syndrome r-chop delivery choose first-line treatment by stage, ipi, age and fitness limited-stage disease advanced-stage disease pola-r-chp new r-chop combinations recognise the limits of frontline intensification select cns prophylaxis sparingly use radiotherapy selectively adapt treatment for older or anthracycline-unfit patients manage double-hit and double-expressor disease separately reassess disease at relapse refractory disease or relapse within 12 months later relapse in transplant-suitable patients car t-cell therapy for patients not intended for transplant third-line car t-cell therapy choose later-line antibody therapy by prior exposure and deliverability bispecific antibodies and combinations antibody-drug and immunomodulatory combinations follow-up after complete metabolic response references"}, {"id": "lymphoma-hodgkin-lymphoma", "slug": "hodgkin-lymphoma", "group": "Lymphoma", "title": "Hodgkin lymphoma", "updated": "", "sections": [{"id": "s-confirm-the-diagnosis-and-define-the-clinical-group", "h": "Confirm the diagnosis and define the clinical group", "depth": 2}, {"id": "s-stage-with-pet-ct-and-retain-the-trial-specific-response-threshold", "h": "Stage with PET-CT and retain the trial-specific response threshold", "depth": 2}, {"id": "s-early-favourable-disease-reduce-treatment-only-within-tested-boundaries", "h": "Early favourable disease: reduce treatment only within tested boundaries", "depth": 2}, {"id": "s-early-unfavourable-disease-choose-between-combined-modality-and-intensified-pet-adaptation", "h": "Early unfavourable disease: choose between combined modality and intensified PET adaptation", "depth": 2}, {"id": "s-advanced-disease-match-efficacy-gains-to-toxicity-and-maturity", "h": "Advanced disease: match efficacy gains to toxicity and maturity", "depth": 2}, {"id": "s-historical-escalated-beacopp-programme", "h": "Historical escalated-BEACOPP programme", "depth": 3}, {"id": "s-brentuximab-nivolumab-and-brecadd", "h": "Brentuximab, nivolumab and BrECADD", "depth": 3}, {"id": "s-abvd-with-pet-guided-bleomycin-omission", "h": "ABVD with PET-guided bleomycin omission", "depth": 3}, {"id": "s-relapsed-or-refractory-disease-separate-transplant-intent-from-later-line-control", "h": "Relapsed or refractory disease: separate transplant intent from later-line control", "depth": 2}, {"id": "s-references", "h": "References", "depth": 2}], "html": "<h2 id=\"s-confirm-the-diagnosis-and-define-the-clinical-group\">Confirm the diagnosis and define the clinical group</h2>\n<p>Hodgkin lymphoma comprises classical Hodgkin lymphoma and nodular lymphocyte-predominant Hodgkin lymphoma. Classical disease usually expresses CD15 and CD30 on Hodgkin and Reed-Sternberg cells and lacks CD45. These malignant cells are derived from clonal B cells but have lost much of the normal B-cell phenotype.</p>\n<p>Classical Hodgkin lymphoma often presents with painless cervical, supraclavicular, axillary, inguinal or mediastinal lymphadenopathy. Spread is commonly contiguous. B symptoms are fever, drenching night sweats and significant unintentional weight loss. Nodular lymphocyte-predominant disease is usually more indolent but can transform to large B-cell lymphoma.</p>\n<p>Obtain adequate tissue, preferably by excisional or incisional lymph-node biopsy where feasible. Initial assessment includes a complete history and examination, full blood count, erythrocyte sedimentation rate, renal and liver function, electrolytes and HIV testing. Assess cardiac function before doxorubicin and pulmonary function before bleomycin-containing treatment. Address fertility preservation before therapy.</p>\n<h2 id=\"s-stage-with-pet-ct-and-retain-the-trial-specific-response-threshold\">Stage with PET-CT and retain the trial-specific response threshold</h2>\n<p>PET-CT is the principal staging and response-assessment modality in FDG-avid Hodgkin lymphoma. Routine marrow biopsy is unnecessary after adequate PET-CT staging unless unexplained cytopenias or a discordant marrow process would alter management. Surveillance imaging is discouraged after remission; clinical follow-up should also address late cardiopulmonary effects and second malignancies. <a class=\"trial-link\" href=\"/evidence/#t-lugano-classification-cheson-et-al\">Lugano Classification (Cheson et al.)</a></p>\n<p>Ann Arbor stage retains A or B symptom suffixes for Hodgkin lymphoma. Contiguous extranodal extension may be labelled E; disseminated extranodal disease is stage IV. Bulky disease includes a nodal mass greater than 10 cm or a mediastinal mass wider than one-third of the transthoracic diameter.</p>\n<p>Treatment planning separates early favourable, early unfavourable and advanced disease. The GHSG early-unfavourable factors are a large mediastinal mass, extranodal involvement, elevated erythrocyte sedimentation rate, and at least 3 involved nodal areas. Elevated ESR means at least 50 mm/hour without B symptoms or at least 30 mm/hour with them. Advanced-stage prognosis can be described with the International Prognostic Score.</p>\n<p>The stage-IIB boundary differs across the GHSG programmes. HD14 and HD17 admitted stage IIB only when raised ESR or at least 3 involved nodal areas was present and bulky mediastinal or extranodal disease was absent. HD18 and HD21 instead classified stage IIB with B symptoms plus a bulky mediastinal mass and/or extranodal disease as advanced-stage disease.</p>\n<p>Deauville score 3 is handled differently across response-adapted trials. HD16, HD17, UK RAPID, H10 and HD18 assigned score 3 to the positive group. RATHL assigned scores 1-3 to the negative group. Apply the cut-point from the regimen and trial being followed rather than a universal definition.</p>\n<h2 id=\"s-early-favourable-disease-reduce-treatment-only-within-tested-boundaries\">Early favourable disease: reduce treatment only within tested boundaries</h2>\n<p>Two cycles of ABVD followed by 20 Gy involved-field radiotherapy is the least intensive combined-modality regimen established in the GHSG favourable population. Omitting radiotherapy after a negative interim PET reduces tumour control. A chemotherapy-only choice therefore accepts more relapse to avoid radiotherapy exposure; the cited trials did not show a survival difference at their reported follow-up.</p>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-ghsg-hd7\">GHSG HD7</a> established the value of adding chemotherapy to radiotherapy.</span><span class=\"evidence-detail\">Among 650 patients with favourable early-stage disease, 7-year freedom from treatment failure was 88% with 2 cycles of ABVD before extended-field radiotherapy and 67% with radiotherapy alone. Seven-year overall survival was 94% and 92%, respectively.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-ghsg-hd10\">GHSG HD10</a> randomised 1,370 patients in a 2 by 2 factorial comparison of 4 versus 2 ABVD cycles and 30 versus 20 Gy radiotherapy.</span><span class=\"evidence-detail\">Five-year freedom from treatment failure was 91.1% versus 93.0% for 2 versus 4 cycles and 92.9% versus 93.4% for 20 versus 30 Gy. Both reductions met the 7-point non-inferiority margin and caused less acute toxicity.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-ghsg-hd13\">GHSG HD13</a> tested whether ABVD itself could be reduced; all arms received 30 Gy involved-field radiotherapy.</span><span class=\"evidence-detail\">The dacarbazine-omitted ABV and AV arms closed early for higher event rates and could be compared with concurrent ABVD only descriptively. AVD completed accrual but did not establish non-inferiority to ABVD (5-year freedom from treatment failure 89.2% versus 93.1%; hazard ratio 1.50, 95% CI 1.00-2.26). Neither dacarbazine nor bleomycin should be omitted from this 2-cycle combined-modality programme.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-ghsg-hd16\">GHSG HD16</a> randomised 1,150 patients before interim PET.</span><span class=\"evidence-detail\">Among 628 PET-2-negative patients analysed per protocol, omitting 20 Gy radiotherapy after 2 ABVD cycles reduced 5-year progression-free survival from 93.4% to 86.1% (difference -7.3 points, 95% CI -13.0 to -1.6). In-field recurrence was 9% without radiotherapy and 2% with it; 5-year overall survival was 98.4% without radiotherapy versus 98.1% with it, an underpowered secondary comparison that did not demonstrate a survival difference.</span></li></ul>\n<p>ABVD is administered on days 1 and 15 of a 28-day cycle: doxorubicin 25 mg/m², bleomycin 10 units/m², vinblastine 6 mg/m² and dacarbazine 375 mg/m². Confirm the exact product expression, administration and supportive-care protocol before prescribing.</p>\n<h2 id=\"s-early-unfavourable-disease-choose-between-combined-modality-and-intensified-pet-adaptation\">Early unfavourable disease: choose between combined modality and intensified PET adaptation</h2>\n<p>Four cycles of ABVD followed by 30 Gy involved-field radiotherapy is the comparator established in the GHSG early-unfavourable programme. The intensified 2+2 approach, 2 cycles of escalated BEACOPP followed by 2 cycles of ABVD, improves tumour control but increases acute haematological toxicity. PET-guided radiotherapy omission is established only after that intensified backbone.</p>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-ghsg-hd8\">GHSG HD8</a> reduced the radiotherapy field.</span><span class=\"evidence-detail\">In 1,204 patients with early unfavourable disease or stage IIIA without risk factors, involved-field radiotherapy preserved 5-year freedom from treatment failure compared with extended-field treatment (84.2% versus 85.8%) and reduced acute nausea, leucopenia and thrombocytopenia.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-ghsg-hd11\">GHSG HD11</a> compared ABVD with baseline BEACOPP and 30 with 20 Gy radiotherapy.</span><span class=\"evidence-detail\">After ABVD, 20 Gy did not establish non-inferiority to 30 Gy (5-year freedom-from-treatment-failure difference -4.7 points, 95% CI -10.3 to 0.8). Baseline BEACOPP was more toxic and did not improve on ABVD when both were followed by 30 Gy.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-ghsg-hd14\">GHSG HD14</a> compared 2 cycles of escalated BEACOPP plus 2 cycles of ABVD with 4 cycles of ABVD, both followed by 30 Gy.</span><span class=\"evidence-detail\">Five-year freedom from treatment failure was 94.8% versus 87.7% (hazard ratio 0.44, 95% CI 0.30-0.66), without a shown survival gain. Grade 4 toxicity occurred in 56.6% versus 5.9%.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-ghsg-hd17\">GHSG HD17</a> tested radiotherapy omission after the intensified 2+2 backbone.</span><span class=\"evidence-detail\">In the per-protocol population, 5-year progression-free survival was 95.1% with PET-guided treatment and 97.3% with radiotherapy for all. The upper confidence bound of 5.3 points remained inside the 8-point non-inferiority margin. PET negativity was Deauville 1-2.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-uk-rapid\">UK RAPID</a> enrolled 602 patients and tested omission after 3 ABVD cycles.</span><span class=\"evidence-detail\">Among 420 PET-negative patients, 3-year progression-free survival was 90.8% without radiotherapy and 94.6% with it. The confidence interval for the -3.8-point difference extended to -8.8 points, outside the 7-point margin. PET negativity was Deauville 1-2.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-eortc-lysa-fil-h10\">EORTC/LYSA/FIL H10</a> enrolled 1,950 patients and failed to establish radiotherapy omission after negative PET-2.</span><span class=\"evidence-detail\">Five-year progression-free survival was 87.1% without radiotherapy versus 99.0% with it in favourable disease and 89.6% versus 92.1% in unfavourable disease. In PET-positive patients, escalation improved 5-year progression-free survival from 77.4% to 90.6% (hazard ratio 0.42, 95% CI 0.23-0.74) but increased acute toxicity.</span></li></ul>\n<p>In the PET-positive comparison, 5-year overall survival was 89.3% with continued ABVD versus 96.0% with escalation (hazard ratio 0.45; P=0.062), a difference that was not statistically significant.</p>\n<p>H10 defined Deauville 1-2 as negative and 3-5 as positive.</p>\n<h2 id=\"s-advanced-disease-match-efficacy-gains-to-toxicity-and-maturity\">Advanced disease: match efficacy gains to toxicity and maturity</h2>\n<p>Phase III trials support several frontline approaches in advanced classical Hodgkin lymphoma. Their populations are not interchangeable: ECHELON-1 enrolled stage III-IV adults, S1826 enrolled patients aged 12 years or older with stage III-IV disease, and HD21 enrolled patients aged 18-60 years within the GHSG advanced-stage definition. In HD21, PET-2-guided treatment length was introduced by amendment and applied to 1,346 of 1,482 analysed patients (91%), not uniformly to the entire randomised comparison.</p>\n<h3 id=\"s-historical-escalated-beacopp-programme\">Historical escalated-BEACOPP programme</h3>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-ghsg-hd9\">GHSG HD9</a> compared escalated BEACOPP with baseline BEACOPP and the older COPP/ABVD regimen, not ABVD alone.</span><span class=\"evidence-detail\">At 10 years, freedom from treatment failure was 82%, 70% and 64%, and overall survival 86%, 80% and 75%. Secondary leukaemia or myelodysplasia increased with dose; the 10-year comparisons were outside the prespecified analysis schedule.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-ghsg-hd15\">GHSG HD15</a> established that 6 cycles of escalated BEACOPP were non-inferior to 8 and less toxic.</span><span class=\"evidence-detail\">Five-year freedom from treatment failure was 89.3% with 6 cycles and 84.4% with 8. Treatment-related death was 0.8% versus 2.1%, and secondary leukaemia or myelodysplasia 0.3% versus 2.7%.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-ghsg-hd18\">GHSG HD18</a> used PET after 2 escalated-BEACOPP cycles to answer 2 questions.</span><span class=\"evidence-detail\">Rituximab did not improve 5-year progression-free survival in PET-positive disease (88.1% versus 89.7%; hazard ratio 1.25, 95% CI 0.69-2.26). In PET-negative disease, 4 total cycles were non-inferior to 6-8 and caused fewer severe infections and treatment-related deaths. Deauville 3 counted as positive.</span></li></ul>\n<h3 id=\"s-brentuximab-nivolumab-and-brecadd\">Brentuximab, nivolumab and BrECADD</h3>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-echelon-1\">ECHELON-1</a> compared brentuximab vedotin plus AVD with ABVD in 1,334 patients.</span><span class=\"evidence-detail\">Modified progression-free survival at 2 years was 82.1% versus 77.2% (hazard ratio 0.77, 95% CI 0.60-0.98). Interstitial lung disease fell from 7% to 2%, while neuropathy rose from 43% to 67% and febrile neutropenia from 8% to 19%.</span></li></ul>\n<p>At median follow-up 72.6 months, investigator-assessed 6-year progression-free survival was 82.3% versus 74.5% (hazard ratio 0.68; 95% CI 0.53-0.86); this analysis was outside the testing hierarchy and descriptive. The alpha-protected second interim overall-survival analysis at median follow-up 73 months favoured brentuximab vedotin plus AVD (6-year overall survival 93.9% versus 89.4%; hazard ratio 0.59, 95% CI 0.40-0.88; P=0.009).</p>\n<p>Primary G-CSF prophylaxis was recommended after enrolment had begun; the initial efficacy result was not generated under uniform prophylaxis.</p>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-swog-s1826\">SWOG S1826</a> compared nivolumab plus AVD with brentuximab vedotin plus AVD in 994 patients.</span><span class=\"evidence-detail\">The planned interim analysis showed a progression-free-survival advantage (hazard ratio 0.48, 99% CI 0.27-0.87; 1-year rate 94% versus 86%). A later cut gave 2-year rates of 92% versus 83%. Whole-trial overall survival remains immature and unproven (hazard ratio 0.39, 95% CI 0.15-1.03).</span></li></ul>\n<p>Both age reports were planned but unprotected subset analyses and neither reported an age-by-treatment interaction test. The older analysis used age at least 60 years, which differs from the parent trial&#x27;s older-than-60 randomisation stratum. At median follow-up 25.2 months, it reported 3 deaths among 50 patients with nivolumab plus AVD and 10 among 49 with brentuximab vedotin plus AVD.</p>\n<p>At median follow-up 37.2 months, the adolescent analysis reported 3-year progression-free survival of 93% versus 82%. Grade 3 or worse neutropenia was more frequent with nivolumab, but G-CSF was mandatory only in the brentuximab arm.</p>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-ghsg-hd21\">GHSG HD21</a> randomised 1,500 patients and analysed 1,482.</span><span class=\"evidence-detail\">Treatment-related-morbidity superiority was tested first and met: 42% with BrECADD versus 59% with escalated BEACOPP (relative risk 0.72, 95% CI 0.65-0.80). Gated progression-free-survival non-inferiority then met. After the successful interim analysis, a protocol amendment added a final superiority test using the remaining two-sided alpha; 4-year progression-free survival was 94.3% versus 90.9% (hazard ratio 0.66, 95% CI 0.45-0.97), and P=0.035 crossed the prespecified 0.0392 boundary.</span></li></ul>\n<p>Consolidative radiotherapy for PET-positive residual disease in HD21 was not randomised and was received by 15% with BrECADD and 14% with escalated BEACOPP. BrECADD reduced grade 3 or worse anaemia and thrombocytopenia and improved gonadal recovery, but did not reduce every toxicity. Organ toxicity was 19% versus 17%, and neutropenic fever, cardiac and gastrointestinal events were more frequent with BrECADD. Four-year overall survival was 98.6% versus 98.2%.</p>\n<h3 id=\"s-abvd-with-pet-guided-bleomycin-omission\">ABVD with PET-guided bleomycin omission</h3>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-rathl\">RATHL</a> enrolled adults with stage IIB-IV disease or stage IIA disease with bulky disease or at least 3 involved sites.</span><span class=\"evidence-detail\">It randomised 935 patients who were PET-negative after 2 ABVD cycles, defined as Deauville 1-3, to continue ABVD or omit bleomycin for cycles 3-6. Three-year progression-free survival was 85.7% versus 84.4%. The confidence interval for the 1.6-point difference extended to 5.3 points, just beyond the 5-point non-inferiority margin, while pulmonary toxicity was lower with AVD.</span></li></ul>\n<p>The 172 PET-positive patients escalated to BEACOPP without a randomised ABVD comparator and had 3-year progression-free survival of 67.5%. This cohort supports feasibility of escalation but cannot establish its benefit over continuing ABVD.</p>\n<h2 id=\"s-relapsed-or-refractory-disease-separate-transplant-intent-from-later-line-control\">Relapsed or refractory disease: separate transplant intent from later-line control</h2>\n<p>Confirm relapse histologically where feasible and restage before treatment. Of 166 patients assessed in HD-R1, 5 were excluded before randomisation and 161 were randomised upfront before shared Dexa-BEAM induction. Among 144 assessable patients, 117 achieved complete or partial response after 2 cycles and proceeded to their assigned further Dexa-BEAM or high-dose BEAM plus autologous-transplant arm; the primary per-protocol result applies to those 117.</p>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-ghsg-ebmt-hd-r1\">GHSG/EBMT HD-R1</a> established autologous transplantation in chemosensitive relapse.</span><span class=\"evidence-detail\">In the 117-patient per-protocol set, 3-year freedom from treatment failure was 55% after high-dose BEAM and transplant versus 34% with further Dexa-BEAM (P=0.019); nominal overall survival was 71% versus 65% without a demonstrated difference.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-brentuximab-vedotin-pivotal\">Brentuximab vedotin (pivotal)</a> evaluated 102 patients after autologous transplant had failed.</span><span class=\"evidence-detail\">Independent-review objective response was 75% (95% CI 64.9-82.6), including 34% complete response. Median progression-free survival was 5.6 months overall and 21.7 months among complete responders. Peripheral sensory neuropathy occurred in 42%, including 8% grade 3.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-aethera\">AETHERA</a> randomised 329 high-risk patients after autologous transplant to brentuximab vedotin or placebo.</span><span class=\"evidence-detail\">Median independent-review progression-free survival was 42.9 versus 24.1 months (hazard ratio 0.57, 95% CI 0.40-0.81). Overall survival did not differ at the interim analysis, with substantial post-progression crossover to brentuximab in the placebo group.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-checkmate-205\">CheckMate 205</a> evaluated nivolumab in 80 patients whose disease progressed after autologous transplant and subsequent brentuximab vedotin.</span><span class=\"evidence-detail\">Independent-review objective response was 66.3% (95% CI 54.8-76.4), including 9% complete response. Median response duration was 7.8 months and median progression-free survival 10.0 months at a median follow-up of 8.9 months.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-keynote-204\">KEYNOTE-204</a> compared pembrolizumab with brentuximab vedotin in 304 patients after autologous transplant or judged transplant-ineligible.</span><span class=\"evidence-detail\">Median progression-free survival was 13.2 versus 8.3 months (hazard ratio 0.65, 95% CI 0.48-0.88). Overall survival, a co-primary endpoint, had not been analysed at the reported interim cut.</span></li></ul>\n<h2 id=\"s-references\">References</h2>\n<ol class=\"refs\">\n<li id=\"ref-lymphoma-hodgkin-lymphoma-t-lugano-classification-cheson-et-al\"><a class=\"trial-link\" href=\"/evidence/#t-lugano-classification-cheson-et-al\">Lugano Classification (Cheson et al.)</a>. <a href=\"https://drive.google.com/file/d/1I3r0lIc2JGmEjbsCRgiyEAUK9YhoO8Uy/preview\">J Clin Oncol 2014;32:3059-3067</a></li>\n<li id=\"ref-lymphoma-hodgkin-lymphoma-t-ghsg-hd7\"><a class=\"trial-link\" href=\"/evidence/#t-ghsg-hd7\">GHSG HD7</a>. <a href=\"https://drive.google.com/file/d/1as8B06fbc6DQry56BYJ3MTHdv7SwA70k/preview\">J Clin Oncol 2007;25:3495-3502</a>; <a href=\"https://drive.google.com/file/d/1IaW1NnRE7S7zlQVvhasMqWIWhC7WveOh/preview\">J Clin Oncol 2017;35:1999-2007</a>; <a href=\"https://drive.google.com/file/d/1reOYuWOR_Cnhvru8VZc2dopYyJ1DiMqg/preview\">J Clin Oncol 2017;35:1444-1450</a></li>\n<li id=\"ref-lymphoma-hodgkin-lymphoma-t-ghsg-hd10\"><a class=\"trial-link\" href=\"/evidence/#t-ghsg-hd10\">GHSG HD10</a>. <a href=\"https://drive.google.com/file/d/1TyJJpDp5otbXrt-2RZU6f77YmAhLED9I/preview\">N Engl J Med 2010;363:640-652</a>; <a href=\"https://drive.google.com/file/d/1IaW1NnRE7S7zlQVvhasMqWIWhC7WveOh/preview\">J Clin Oncol 2017;35:1999-2007</a>; <a href=\"https://drive.google.com/file/d/1reOYuWOR_Cnhvru8VZc2dopYyJ1DiMqg/preview\">J Clin Oncol 2017;35:1444-1450</a></li>\n<li id=\"ref-lymphoma-hodgkin-lymphoma-t-ghsg-hd13\"><a class=\"trial-link\" href=\"/evidence/#t-ghsg-hd13\">GHSG HD13</a>. <a href=\"https://drive.google.com/file/d/16XtEuf4OdfDAqo4KhJF6gQyqYa4E1lSJ/preview\">Lancet 2015;385:1418-1427</a></li>\n<li id=\"ref-lymphoma-hodgkin-lymphoma-t-ghsg-hd16\"><a class=\"trial-link\" href=\"/evidence/#t-ghsg-hd16\">GHSG HD16</a>. <a href=\"https://drive.google.com/file/d/1oO-Z_bQY7DyBG1akatjwbF4BdNWc7AsG/preview\">J Clin Oncol 2019;37:2835-2845</a></li>\n<li id=\"ref-lymphoma-hodgkin-lymphoma-t-ghsg-hd8\"><a class=\"trial-link\" href=\"/evidence/#t-ghsg-hd8\">GHSG HD8</a>. <a href=\"https://drive.google.com/file/d/10wyPDPGJul1NTgeT7idrXOYsA1LNrTEC/preview\">J Clin Oncol 2003;21:3601-3608</a>; <a href=\"https://drive.google.com/file/d/1IaW1NnRE7S7zlQVvhasMqWIWhC7WveOh/preview\">J Clin Oncol 2017;35:1999-2007</a>; <a href=\"https://drive.google.com/file/d/1reOYuWOR_Cnhvru8VZc2dopYyJ1DiMqg/preview\">J Clin Oncol 2017;35:1444-1450</a></li>\n<li id=\"ref-lymphoma-hodgkin-lymphoma-t-ghsg-hd11\"><a class=\"trial-link\" href=\"/evidence/#t-ghsg-hd11\">GHSG HD11</a>. <a href=\"https://drive.google.com/file/d/1c1ns_0bUVAQIyKgvRFyAzIgBrvlegxHF/preview\">J Clin Oncol 2010;28:4199-4206</a>; <a href=\"https://drive.google.com/file/d/1IaW1NnRE7S7zlQVvhasMqWIWhC7WveOh/preview\">J Clin Oncol 2017;35:1999-2007</a>; <a href=\"https://drive.google.com/file/d/1reOYuWOR_Cnhvru8VZc2dopYyJ1DiMqg/preview\">J Clin Oncol 2017;35:1444-1450</a></li>\n<li id=\"ref-lymphoma-hodgkin-lymphoma-t-ghsg-hd14\"><a class=\"trial-link\" href=\"/evidence/#t-ghsg-hd14\">GHSG HD14</a>. <a href=\"https://drive.google.com/file/d/1gBCq2dgmkKrwn0yWOFX8PBDU6r4oQMZo/preview\">J Clin Oncol 2012;30:907-913</a></li>\n<li id=\"ref-lymphoma-hodgkin-lymphoma-t-ghsg-hd17\"><a class=\"trial-link\" href=\"/evidence/#t-ghsg-hd17\">GHSG HD17</a>. <a href=\"https://drive.google.com/file/d/1wrjg6i5CUY73KjagwH9SpXKragLMYepI/preview\">Lancet Oncol 2021;22:223-234</a></li>\n<li id=\"ref-lymphoma-hodgkin-lymphoma-t-uk-rapid\"><a class=\"trial-link\" href=\"/evidence/#t-uk-rapid\">UK RAPID</a>. <a href=\"https://drive.google.com/file/d/1Kb9FwK2eWGhoGvx72KJrmR157nrLu2XT/preview\">N Engl J Med 2015;372:1598-1607</a></li>\n<li id=\"ref-lymphoma-hodgkin-lymphoma-t-eortc-lysa-fil-h10\"><a class=\"trial-link\" href=\"/evidence/#t-eortc-lysa-fil-h10\">EORTC/LYSA/FIL H10</a>. <a href=\"https://drive.google.com/file/d/1pb8rK01SFe0PQbpSDbA22WYrusqvajyB/preview\">J Clin Oncol 2017;35:1786-1794</a></li>\n<li id=\"ref-lymphoma-hodgkin-lymphoma-t-ghsg-hd9\"><a class=\"trial-link\" href=\"/evidence/#t-ghsg-hd9\">GHSG HD9</a>. <a href=\"https://drive.google.com/file/d/1F2rZ5wsZmYTZtK5xWHJ1h9lWlOp8lSTx/preview\">N Engl J Med 2003;348:2386-2395</a>; <a href=\"https://drive.google.com/file/d/1_1oeAJ048icSVh9vLaMf8efhBJ04T0g5/preview\">J Clin Oncol 2009;27:4548-4554</a>; <a href=\"https://drive.google.com/file/d/1reOYuWOR_Cnhvru8VZc2dopYyJ1DiMqg/preview\">J Clin Oncol 2017;35:1444-1450</a></li>\n<li id=\"ref-lymphoma-hodgkin-lymphoma-t-ghsg-hd15\"><a class=\"trial-link\" href=\"/evidence/#t-ghsg-hd15\">GHSG HD15</a>. <a href=\"https://drive.google.com/file/d/1sIPzbSKVcJXDu9ny-7QUynesINqwui-n/preview\">Lancet 2012;379:1791-1799</a></li>\n<li id=\"ref-lymphoma-hodgkin-lymphoma-t-ghsg-hd18\"><a class=\"trial-link\" href=\"/evidence/#t-ghsg-hd18\">GHSG HD18</a>. <a href=\"https://drive.google.com/file/d/1LEETGaKsdH0SekHxdCxu3OpU9v-_g8h0/preview\">Lancet 2017;390:2790-2802</a></li>\n<li id=\"ref-lymphoma-hodgkin-lymphoma-t-echelon-1\"><a class=\"trial-link\" href=\"/evidence/#t-echelon-1\">ECHELON-1</a>. <a href=\"https://drive.google.com/file/d/1yLWXo_ZpdGAAf_60WNvdPICKyWoyjUnJ/preview\">N Engl J Med 2018;378:331-344</a>; <a href=\"https://drive.google.com/file/d/1XTFglOwyFzNJrjJAURGT4ehD9ZbATvrS/preview\">N Engl J Med 2022;387:310-320</a></li>\n<li id=\"ref-lymphoma-hodgkin-lymphoma-t-swog-s1826\"><a class=\"trial-link\" href=\"/evidence/#t-swog-s1826\">SWOG S1826</a>. <a href=\"https://drive.google.com/file/d/1n2fPRjjIYa2KSIHmUiUSx11OSlVFhhHO/preview\">N Engl J Med 2024;391:1379-1389</a>; <a href=\"https://drive.google.com/file/d/179PXpLZHmSYG9FWtuu5NwJPljen9PYQb/preview\">J Clin Oncol 2025;43:2968-2973</a>; <a href=\"https://drive.google.com/file/d/1GgbWXlo--5KfP-czWIW4atqpxjDJTBJ2/preview\">J Clin Oncol 2026;44:449-454</a></li>\n<li id=\"ref-lymphoma-hodgkin-lymphoma-t-ghsg-hd21\"><a class=\"trial-link\" href=\"/evidence/#t-ghsg-hd21\">GHSG HD21</a>. <a href=\"https://drive.google.com/file/d/18J8zFmcCuClm7H32GJNFyVbZBfcXiYly/preview\">Lancet 2024;404:341-352</a></li>\n<li id=\"ref-lymphoma-hodgkin-lymphoma-t-rathl\"><a class=\"trial-link\" href=\"/evidence/#t-rathl\">RATHL</a>. <a href=\"https://drive.google.com/file/d/15TIdpikZZIdhJiKZH_SP13seFG9qDqNz/preview\">N Engl J Med 2016;374:2419-2429</a></li>\n<li id=\"ref-lymphoma-hodgkin-lymphoma-t-ghsg-ebmt-hd-r1\"><a class=\"trial-link\" href=\"/evidence/#t-ghsg-ebmt-hd-r1\">GHSG/EBMT HD-R1</a>. <a href=\"https://drive.google.com/file/d/1SfKKqCsRbTWEqABjFNq_zzKw1qteEjKz/preview\">Lancet 2002;359:2065-2071</a></li>\n<li id=\"ref-lymphoma-hodgkin-lymphoma-t-brentuximab-vedotin-pivotal\"><a class=\"trial-link\" href=\"/evidence/#t-brentuximab-vedotin-pivotal\">Brentuximab vedotin (pivotal)</a>. <a href=\"https://drive.google.com/file/d/1MEqCetp6qmXNSk1MTX3EyK2_0yc_Rvhr/preview\">J Clin Oncol 2012;30:2183-2189</a></li>\n<li id=\"ref-lymphoma-hodgkin-lymphoma-t-aethera\"><a class=\"trial-link\" href=\"/evidence/#t-aethera\">AETHERA</a>. <a href=\"https://drive.google.com/file/d/1-OBMhwZZputDbCh-549GpSu5tMHxvS25/preview\">Lancet 2015;385:1853-1862</a></li>\n<li id=\"ref-lymphoma-hodgkin-lymphoma-t-checkmate-205\"><a class=\"trial-link\" href=\"/evidence/#t-checkmate-205\">CheckMate 205</a>. <a href=\"https://drive.google.com/file/d/1M7j-6UJ6ZDGoN_xEncFvellmufnrwTYv/preview\">Lancet Oncol 2016;17:1283-1294</a></li>\n<li id=\"ref-lymphoma-hodgkin-lymphoma-t-keynote-204\"><a class=\"trial-link\
