drive.google.com/file/d/1ZSjQQR_jYvsHcXQcmxbw_s_b5yasHzpL/preview\">Martin M et al. Lancet Oncol 2017;18:1688-1700</a></li>\n<li id=\"ref-breast-early-breast-cancer-t-apt-adjuvant-paclitaxel-trastuzumab\"><a class=\"trial-link\" href=\"/evidence/#t-apt-adjuvant-paclitaxel-trastuzumab\">APT (Adjuvant Paclitaxel + Trastuzumab)</a>. <a href=\"https://drive.google.com/file/d/1s7cuQ6zu6bgnna914NFWBnKA7pRoP1io/preview\">N Engl J Med 2015;372:134-141</a>; <a href=\"https://drive.google.com/file/d/15mkIiC4YybBLetWiiGLyjUElwL0rJKdy/preview\">Tolaney SM et al. J Clin Oncol 2019;37:1868-1875</a>; <a href=\"https://drive.google.com/file/d/1DecsdkvpEymqN4Amkk7aEfx1ZUJWaBBn/preview\">Lancet Oncol 2023;24:273-285</a></li>\n<li id=\"ref-breast-early-breast-cancer-t-atempt\"><a class=\"trial-link\" href=\"/evidence/#t-atempt\">ATEMPT</a>. <a href=\"https://drive.google.com/file/d/1-V1jiatTWkUvJlvCTOq9cYAcFD1Pt3jt/preview\">J Clin Oncol 2021;39:2375-2385</a>; <a href=\"https://drive.google.com/file/d/1LcApGOVY4_715X4lYmqf9vsPOyF4ssW0/preview\">Tarantino P et al. J Clin Oncol 2024;42:3652-3665</a></li>\n<li id=\"ref-breast-early-breast-cancer-t-rjbc-1501\"><a class=\"trial-link\" href=\"/evidence/#t-rjbc-1501\">RJBC-1501</a>. <a href=\"https://drive.google.com/file/d/1JrYclwWLHt1MLDz3N6IER3qb8eZouAY3/preview\">J Clin Oncol 2026;44:143-152</a></li>\n<li id=\"ref-breast-early-breast-cancer-t-ebctcg-adjuvant-bisphosphonate-meta-analysis\"><a class=\"trial-link\" href=\"/evidence/#t-ebctcg-adjuvant-bisphosphonate-meta-analysis\">EBCTCG adjuvant bisphosphonate meta-analysis</a>. <a href=\"https://drive.google.com/file/d/1E88pHFcXhsPFIQHDwEwImoJNRg5hXFnZ/preview\">Lancet 2015;386:1353-1361</a></li>\n</ol>", "_hay": "early breast cancer early-breast-cancer breast scope and the shape of the decision breast surgery breast conservation versus mastectomy margins and contraindications axillary management sentinel node biopsy a positive sentinel node radiotherapy after breast-conserving surgery omitting radiotherapy in older, low-risk disease post-mastectomy radiotherapy fractionation and treatment volume sequencing with systemic therapy adjuvant chemotherapy: the backbone what chemotherapy adds anthracycline and taxane can the anthracycline be dropped? schedule and taxane choice intensified chemotherapy with stem-cell rescue hr-positive, her2-negative disease the endocrine foundation premenopausal disease and ovarian suppression duration and extended therapy oral serds pregnancy after diagnosis deciding on chemotherapy: genomic assays cdk4/6 inhibitors olaparib for germline brca-mutated disease her2-positive disease the trastuzumab backbone duration chemotherapy partner dual blockade extended adjuvant therapy small node-negative tumours residual disease after neoadjuvant therapy cardiac monitoring triple-negative disease bone-modifying agents older and less fit patients follow-up references"}, {"id": "breast-metastatic-breast-cancer", "slug": "metastatic-breast-cancer", "group": "Breast", "title": "Metastatic breast cancer", "updated": "", "sections": [{"id": "s-work-up-at-the-point-of-metastatic-diagnosis", "h": "Work-up at the point of metastatic diagnosis", "depth": 2}, {"id": "s-endocrine-therapy-or-chemotherapy-first", "h": "Endocrine therapy or chemotherapy first", "depth": 3}, {"id": "s-hormone-receptor-positive-her2-negative-disease", "h": "Hormone receptor-positive, HER2-negative disease", "depth": 2}, {"id": "s-first-line-endocrine-therapy-with-a-cdk4-6-inhibitor", "h": "First-line endocrine therapy with a CDK4/6 inhibitor", "depth": 3}, {"id": "s-choosing-between-the-three-inhibitors", "h": "Choosing between the three inhibitors", "depth": 3}, {"id": "s-premenopausal-patients", "h": "Premenopausal patients", "depth": 3}, {"id": "s-aggressive-disease-without-visceral-crisis", "h": "Aggressive disease without visceral crisis", "depth": 3}, {"id": "s-first-line-when-the-disease-is-already-endocrine-resistant", "h": "First line when the disease is already endocrine-resistant", "depth": 3}, {"id": "s-deferring-the-cdk4-6-inhibitor", "h": "Deferring the CDK4/6 inhibitor", "depth": 3}, {"id": "s-endocrine-monotherapy-and-the-first-line-alternatives", "h": "Endocrine monotherapy and the first-line alternatives", "depth": 3}, {"id": "s-second-line-reading-the-first-line-regimen", "h": "Second line: reading the first-line regimen", "depth": 3}, {"id": "s-esr1-mutant-disease-and-the-oral-serds", "h": "ESR1-mutant disease and the oral SERDs", "depth": 3}, {"id": "s-switching-on-molecular-progression", "h": "Switching on molecular progression", "depth": 3}, {"id": "s-pi3k-akt-mtor-altered-disease", "h": "PI3K–AKT–mTOR-altered disease", "depth": 3}, {"id": "s-continuing-cdk4-6-inhibition-beyond-progression", "h": "Continuing CDK4/6 inhibition beyond progression", "depth": 3}, {"id": "s-her2-low-and-her2-ultralow-expression", "h": "HER2-low and HER2-ultralow expression", "depth": 3}, {"id": "s-trop2-antibody-drug-conjugates", "h": "TROP2 antibody–drug conjugates", "depth": 3}, {"id": "s-germline-brca-mutated-disease", "h": "Germline BRCA-mutated disease", "depth": 3}, {"id": "s-her2-positive-disease", "h": "HER2-positive disease", "depth": 2}, {"id": "s-first-line", "h": "First line", "depth": 3}, {"id": "s-maintenance-intensification-and-hormone-receptor-positive-overlap", "h": "Maintenance intensification and hormone receptor-positive overlap", "depth": 3}, {"id": "s-second-line", "h": "Second line", "depth": 3}, {"id": "s-third-line-and-beyond", "h": "Third line and beyond", "depth": 3}, {"id": "s-brain-metastases", "h": "Brain metastases", "depth": 3}, {"id": "s-triple-negative-disease", "h": "Triple-negative disease", "depth": 2}, {"id": "s-first-line-at-pd-l1-combined-positive-score-of-10-or-more", "h": "First line at PD-L1 combined positive score of 10 or more", "depth": 3}, {"id": "s-first-line-when-immunotherapy-is-not-an-option", "h": "First line when immunotherapy is not an option", "depth": 3}, {"id": "s-germline-brca-mutated-disease-and-platinum", "h": "Germline BRCA-mutated disease and platinum", "depth": 3}, {"id": "s-pretreated-disease", "h": "Pretreated disease", "depth": 3}, {"id": "s-cytotoxic-chemotherapy", "h": "Cytotoxic chemotherapy", "depth": 2}, {"id": "s-special-situations", "h": "Special situations", "depth": 2}, {"id": "s-references", "h": "References", "depth": 2}], "html": "<h2 id=\"s-work-up-at-the-point-of-metastatic-diagnosis\">Work-up at the point of metastatic diagnosis</h2>\n<p>Biopsy the metastasis rather than treating on the primary&#x27;s receptor profile. Up to 15% of metastatic lesions are discordant with the primary for ER, PR or HER2, and each of the three markers routes the patient to a different treatment programme. Repeat biopsy also reclassifies disease into the HER2-low band. Across up to five successive biopsies, the proportion of patients originally diagnosed as triple-negative found to be HER2-low rose from 60% to 74%, 83%, 87% and 100% (Bar et al, ASCO 2023). A single HER2 immunohistochemistry result of 0 does not exclude the antibody–drug conjugate route. Molecular testing is directed by receptor subtype.</p>\n<ul><li>HR-positive, HER2-negative: <em>PIK3CA</em> (present in about 40%, hotspots in exons 7, 9 and 20) and <em>ESR1</em>, both relevant to the choice of second-line therapy after a CDK4/6 inhibitor.</li><li><em>PIK3CA</em> can be read on the original tumour block; <em>ESR1</em> mutations are acquired under aromatase-inhibitor pressure and are read on ctDNA. Testing tissue and blood together increases detection.</li><li>Triple-negative: PD-L1 combined positive score on the 22C3 assay, and germline <em>BRCA1/2</em>.</li><li>Germline <em>BRCA1/2</em> is worth testing in any HER2-negative metastatic patient, whatever the receptor subtype.</li></ul>\n<p><em>ESR1</em> encodes the oestrogen receptor. Aromatase inhibitors deplete oestrogen, so an activating <em>ESR1</em> mutation confers ligand-independent receptor activity and resistance to depletion while leaving the receptor targetable. The mutation therefore predicts benefit from a receptor-directed drug, not from a further aromatase inhibitor.</p>\n<h3 id=\"s-endocrine-therapy-or-chemotherapy-first\">Endocrine therapy or chemotherapy first</h3>\n<p>In hormone receptor-positive disease, endocrine therapy is preferred unless the patient is in visceral crisis. A Cochrane review found no overall survival difference between starting with chemotherapy or endocrine therapy, with higher response rates for chemotherapy. Chemotherapy buys a faster response at a higher toxicity cost. Visceral crisis means severe organ dysfunction judged on signs, symptoms and laboratory studies together with rapid progression, not simply the presence of visceral metastases: the compromise must be severe enough that a slower-acting therapy would leave no opportunity for a second option at progression. Prior adjuvant endocrine therapy determines whether the disease is treated as endocrine-sensitive or endocrine-resistant.</p>\n<ul><li class=\"evidence-prose\">Endocrine-sensitive: de novo metastatic disease, or relapse 12 months or more after completing adjuvant endocrine therapy.</li><li class=\"evidence-prose\">Primary endocrine resistance: relapse within 24 months of starting adjuvant endocrine therapy, or progression within 6 months of starting endocrine therapy for metastatic disease.</li><li class=\"evidence-prose\">Secondary endocrine resistance: relapse after 24 months of adjuvant endocrine therapy, relapse within 12 months of completing it, or progression after at least 6 months of endocrine therapy for metastatic disease.</li></ul>\n<h2 id=\"s-hormone-receptor-positive-her2-negative-disease\">Hormone receptor-positive, HER2-negative disease</h2>\n<p>The organising principle is endocrine dependence: suppress oestrogen-receptor signalling first, then add or substitute other mechanisms as resistance emerges. HER2-low expression overlaps this subtype rather than replacing it, and becomes an additional conjugate target later in the sequence.</p>\n<h3 id=\"s-first-line-endocrine-therapy-with-a-cdk4-6-inhibitor\">First-line endocrine therapy with a CDK4/6 inhibitor</h3>\n<p>An aromatase inhibitor with a CDK4/6 inhibitor is the first-line standard, with ovarian function suppression added for premenopausal patients. CDK4/6 phosphorylates and inactivates Rb to permit the G1-to-S transition; inhibiting it produces cell-cycle arrest. Four placebo-controlled phase 3 trials established the class in the first line, each extending median progression-free survival by between 9 and 13.5 months.</p>\n<ul><li class=\"evidence-prose\"><a class=\"trial-link\" href=\"/evidence/#t-paloma-2\">PALOMA-2</a>: palbociclib plus letrozole improved progression-free survival (24.8 vs 14.5 months, HR 0.58, 95% CI 0.46 to 0.72) but did not prolong overall survival at a mature 90-month follow-up (53.9 vs 51.2 months, HR 0.96, 95% CI 0.78 to 1.18), a result the investigators qualify for a between-arm imbalance in survival follow-up (N Engl J Med 2016;375:1925-1936; J Clin Oncol 2024;42:994-1000).</li><li class=\"evidence-prose\"><a class=\"trial-link\" href=\"/evidence/#t-monaleesa-2\">MONALEESA-2</a>: ribociclib plus letrozole improved progression-free survival (25.3 vs 16.0 months, HR 0.57) and overall survival (63.9 vs 51.4 months, HR 0.76), the first CDK4/6 inhibitor to show a first-line survival benefit (N Engl J Med 2016;375:1738-1748; N Engl J Med 2022;386:942-950).</li><li class=\"evidence-prose\"><a class=\"trial-link\" href=\"/evidence/#t-monaleesa-7\">MONALEESA-7</a>: in premenopausal and perimenopausal women given goserelin with tamoxifen or an aromatase inhibitor, ribociclib improved progression-free survival (23.8 vs 13.0 months, HR 0.55) and overall survival (not reached vs 40.9 months, HR 0.71) (Lancet Oncol 2018;19:904-915; N Engl J Med 2019;381:307-316).</li><li class=\"evidence-prose\"><a class=\"trial-link\" href=\"/evidence/#t-monarch-3\">MONARCH 3</a>: abemaciclib plus a non-steroidal aromatase inhibitor improved progression-free survival (28.2 vs 14.8 months, HR 0.54), with final overall survival numerically longer but not significant (66.8 vs 53.7 months, HR 0.80) (J Clin Oncol 2017;35:3638-3646; Ann Oncol 2024;35:718-727).</li></ul>\n<div class=\"tblwrap\" role=\"region\" aria-label=\"Scrollable table\" tabindex=\"0\"><table><thead><tr><th scope=\"col\"></th><th scope=\"col\">PALOMA-2</th><th scope=\"col\">MONARCH 3</th><th scope=\"col\">MONALEESA-2</th><th scope=\"col\">MONALEESA-7</th></tr></thead><tbody><tr><td>Drug</td><td>Palbociclib</td><td>Abemaciclib</td><td>Ribociclib</td><td>Ribociclib</td></tr><tr><td>N</td><td>666</td><td>493</td><td>668</td><td>672</td></tr><tr><td>Population</td><td>Postmenopausal, treatment-naive for advanced disease</td><td>Postmenopausal, treatment-naive for advanced disease</td><td>Postmenopausal, treatment-naive for advanced disease</td><td>Pre/perimenopausal, up to 1 prior chemotherapy line, no prior endocrine therapy for advanced disease</td></tr><tr><td>Partner</td><td>Letrozole</td><td>Anastrozole or letrozole</td><td>Letrozole</td><td>Tamoxifen or an aromatase inhibitor, plus goserelin</td></tr><tr><td>Early-relapsing endocrine-resistant disease allowed</td><td>No</td><td>No</td><td>No</td><td>Yes</td></tr><tr><td>Objective response</td><td>42.1% vs 34.7% </td><td>49.7% vs 37% </td><td>43% vs 29% </td><td>41% vs 30% </td></tr></tbody></table></div>\n<p>All four excluded visceral crisis, and all but PALOMA-2 excluded CNS metastases and inflammatory breast cancer.</p>\n<h3 id=\"s-choosing-between-the-three-inhibitors\">Choosing between the three inhibitors</h3>\n<p>There is no head-to-head randomised comparison, and the differing survival results are a cross-trial discordance rather than a ranking: follow-up, power, population and drug biology cannot be separated. Ribociclib carries the strongest survival evidence, positive in both MONALEESA-2 and MONALEESA-7; palbociclib has shown none, but is the least demanding to monitor, without the diarrhoea of abemaciclib or the QTc prolongation of ribociclib. The practical differences are toxicity and monitoring rather than efficacy.</p>\n<div class=\"tblwrap\" role=\"region\" aria-label=\"Scrollable table\" tabindex=\"0\"><table><thead><tr><th scope=\"col\"></th><th scope=\"col\">Palbociclib</th><th scope=\"col\">Ribociclib</th><th scope=\"col\">Abemaciclib</th></tr></thead><tbody><tr><td>Schedule</td><td>125 mg daily, 3 weeks on, 1 week off</td><td>600 mg daily, 3 weeks on, 1 week off</td><td>150 mg twice daily, continuous</td></tr><tr><td>Grade 3–4 neutropenia</td><td>66.5% </td><td>62% </td><td>23.8% </td></tr><tr><td>Diarrhoea (any grade)</td><td>26.1% </td><td>38.3% </td><td>82.3% </td></tr><tr><td>Transaminitis</td><td>Not reported</td><td>AST/ALT 20.1% </td><td>AST 16.8%, ALT 17.4% </td></tr><tr><td>QTc prolongation</td><td>Not reported</td><td>3% vs 0.3% </td><td>Not reported</td></tr></tbody></table></div>\n<h3 id=\"s-premenopausal-patients\">Premenopausal patients</h3>\n<p>Ovarian function suppression is added to endocrine therapy, by GnRH agonist or surgical oophorectomy. Goserelin and surgical oophorectomy produced similar failure-free and overall survival in a randomised intergroup comparison (Taylor et al, J Clin Oncol 1998), and ovarian suppression combined with tamoxifen improved progression-free survival, overall survival and response over either alone in a three-arm randomised trial (Klijn et al, J Natl Cancer Inst 2000). Premenopausal patients were also eligible, on a GnRH agonist, in <a class=\"trial-link\" href=\"/evidence/#t-paloma-3\">PALOMA-3</a> and <a class=\"trial-link\" href=\"/evidence/#t-monarch-2\">MONARCH 2</a>, so the fulvestrant-based combinations apply to them as well.</p>\n<h3 id=\"s-aggressive-disease-without-visceral-crisis\">Aggressive disease without visceral crisis</h3>\n<p><a class=\"trial-link\" href=\"/evidence/#t-right-choice\">RIGHT Choice</a> is the only randomised comparison of a CDK4/6 inhibitor plus endocrine therapy against combination chemotherapy. It enrolled 222 premenopausal and perimenopausal women with clinically aggressive disease, defined by symptomatic visceral metastases or rapid progression. First-line ribociclib plus an aromatase inhibitor and goserelin improved progression-free survival over investigator&#x27;s-choice combination chemotherapy (21.8 vs 12.8 months, HR 0.61, 95% CI 0.43 to 0.87, P=.003), with far fewer treatment-related discontinuations (6.3% vs 27.0%) and immature overall survival (HR 0.92; J Clin Oncol 2024;42:2812-2821). Response rates were similar (66% vs 62%) and so was time to response (4.9 vs 3.2 months). It is phase 2, and the only randomised evidence on this choice short of visceral crisis.</p>\n<h3 id=\"s-first-line-when-the-disease-is-already-endocrine-resistant\">First line when the disease is already endocrine-resistant</h3>\n<p>For a patient progressing during or within 12 months of adjuvant endocrine therapy whose tumour carries a <em>PIK3CA</em> mutation, <a class=\"trial-link\" href=\"/evidence/#t-inavo120\">INAVO120</a> tested a first-line triplet. Inavolisib added to palbociclib and fulvestrant doubled progression-free survival (15.0 vs 7.3 months, HR 0.43) and improved overall survival (34.0 vs 27.0 months, HR 0.67), the first confirmed survival benefit for a PI3K-pathway inhibitor in this disease (N Engl J Med 2024;391:1584-1596; N Engl J Med 2025;393:151-161). Objective response was 63% versus 28%. Where the tumour is <em>PIK3CA</em> wild-type, first-line treatment for endocrine-resistant disease is fulvestrant with a CDK4/6 inhibitor, with ovarian suppression if premenopausal.</p>\n<h3 id=\"s-deferring-the-cdk4-6-inhibitor\">Deferring the CDK4/6 inhibitor</h3>\n<p><a class=\"trial-link\" href=\"/evidence/#t-sonia\">SONIA</a> randomised the timing of the class rather than the drug: both arms received the same aromatase-inhibitor-then-fulvestrant sequence, and only the position of the CDK4/6 inhibitor differed. First-line use did not establish superiority for second progression-free survival at the primary analysis (31.0 vs 26.8 months, HR 0.87, 95% CI 0.74 to 1.03, P=0.10; a small edge reached significance at 58.5 months, HR 0.82, P=0.01) and gave no overall survival benefit (47.9 vs 48.1 months, HR 0.91, 95% CI 0.77 to 1.07, P=0.24), while adding substantially more toxicity, drug exposure and cost (Nature 2024;636:474-480; JAMA Oncol 2026;12:375-383). Median time on a CDK4/6 inhibitor was 25 months in the first-line arm versus 8 months in the deferred arm. A post hoc premenopausal subgroup favoured first-line use on overall survival (HR 0.53, 95% CI 0.32 to 0.87, P for interaction 0.01). SONIA weakens the assumption that every eligible patient must receive a CDK4/6 inhibitor immediately, but it does not settle sequencing for the whole class: both arms eventually expose the patient to the drug, and the design was palbociclib-dominant. Its second-line comparator was fulvestrant monotherapy, which is no longer what most patients receive at that point. Deferral is reasonable in selected patients: endocrine-sensitive disease relapsing more than 12 months after adjuvant therapy, or a patient wanting to avoid the toxicity, the cost, or the interruption radiotherapy to a symptomatic site would require.</p>\n<h3 id=\"s-endocrine-monotherapy-and-the-first-line-alternatives\">Endocrine monotherapy and the first-line alternatives</h3>\n<p>In <a class=\"trial-link\" href=\"/evidence/#t-falcon\">FALCON</a>, fulvestrant prolonged progression-free survival over anastrozole in 462 patients with endocrine-therapy-naive advanced disease (16.6 vs 13.8 months, HR 0.80), with the largest benefit in non-visceral disease (Lancet 2016;388:2997-3005). There is no head-to-head trial of fulvestrant against an aromatase inhibitor plus a CDK4/6 inhibitor. Two further first-line questions have been answered.</p>\n<ul><li class=\"evidence-prose\">Substituting fulvestrant for letrozole as the CDK4/6 partner does not help: PARSIFAL, a randomised phase 2 trial, allocated 486 treatment-naive patients to fulvestrant or letrozole with palbociclib and found no progression-free survival difference (27.9 vs 32.8 months, HR 1.13, 95% CI 0.89 to 1.45, P=0.32), with similar response and 3-year survival (JAMA Oncol 2021).</li><li class=\"evidence-prose\">Adding fulvestrant to anastrozole does help in the endocrine-naive setting: S0226 improved overall survival over anastrozole alone (49.8 vs 42.0 months, HR 0.82, 95% CI 0.69 to 0.98, P=0.03) in 707 patients (N Engl J Med 2019).</li></ul>\n<p>Aromatase inhibitors outperform tamoxifen on overall survival in a meta-analysis of 23 trials and 8,504 patients (HR 0.89, 95% CI 0.80 to 0.99), and outperform other endocrine agents (HR 0.87, 95% CI 0.82 to 0.93) (J Natl Cancer Inst 2006).</p>\n<h3 id=\"s-second-line-reading-the-first-line-regimen\">Second line: reading the first-line regimen</h3>\n<p>Three questions settle the second-line decision: was a CDK4/6 inhibitor given, is there an <em>ESR1</em> mutation, and is there a <em>PIK3CA</em> or wider AKT-pathway alteration.</p>\n<div class=\"tblwrap\" role=\"region\" aria-label=\"Scrollable table\" tabindex=\"0\"><table><thead><tr><th scope=\"col\">Finding</th><th scope=\"col\">Option</th><th scope=\"col\">Trial</th><th scope=\"col\">Evidence</th></tr></thead><tbody><tr><td>No prior CDK4/6 inhibitor</td><td>Fulvestrant plus a CDK4/6 inhibitor</td><td>PALOMA-3, MONARCH 2, <a class=\"trial-link\" href=\"/evidence/#t-monaleesa-3\">MONALEESA-3</a></td><td>Progression-free survival across the class; survival with ribociclib and abemaciclib</td></tr><tr><td><em>ESR1</em> mutation</td><td>Elacestrant, imlunestrant or vepdegestrant</td><td><a class=\"trial-link\" href=\"/evidence/#t-emerald\">EMERALD</a>, <a class=\"trial-link\" href=\"/evidence/#t-ember-3\">EMBER-3</a>, <a class=\"trial-link\" href=\"/evidence/#t-veritac-2-vepdegestrant\">VERITAC-2 (vepdegestrant)</a></td><td>Progression-free survival; survival immature</td></tr><tr><td><em>PIK3CA</em> mutation</td><td>Alpelisib plus fulvestrant</td><td><a class=\"trial-link\" href=\"/evidence/#t-solar-1\">SOLAR-1</a></td><td>Progression-free survival; no significant survival gain</td></tr><tr><td><em>PIK3CA</em>, <em>AKT1</em> or <em>PTEN</em> alteration</td><td>Capivasertib plus fulvestrant</td><td><a class=\"trial-link\" href=\"/evidence/#t-capitello-291\">CAPItello-291</a></td><td>Progression-free survival; no significant survival gain</td></tr><tr><td><em>PIK3CA</em> wild-type after CDK4/6 inhibition</td><td>Gedatolisib plus fulvestrant, with or without palbociclib</td><td><a class=\"trial-link\" href=\"/evidence/#t-viktoria-1\">VIKTORIA-1</a></td><td>Progression-free survival only</td></tr><tr><td>Prior CDK4/6 inhibitor, no actionable alteration</td><td>Switch endocrine partner and continue CDK4/6 blockade</td><td><a class=\"trial-link\" href=\"/evidence/#t-postmonarch\">postMONARCH</a>, <a class=\"trial-link\" href=\"/evidence/#t-maintain-kalinsky\">MAINTAIN (Kalinsky)</a></td><td>Progression-free survival</td></tr><tr><td>Prior CDK4/6 inhibitor, no actionable alteration</td><td>Everolimus plus exemestane</td><td><a class=\"trial-link\" href=\"/evidence/#t-bolero-2\">BOLERO-2</a></td><td>Progression-free survival, in a population that had not received a CDK4/6 inhibitor</td></tr><tr><td>HER2-low, chemotherapy-pretreated</td><td>Trastuzumab deruxtecan</td><td><a class=\"trial-link\" href=\"/evidence/#t-destiny-breast04\">DESTINY-Breast04</a></td><td>Progression-free and overall survival</td></tr><tr><td>HER2-low or ultralow, chemotherapy-naive</td><td>Trastuzumab deruxtecan</td><td><a class=\"trial-link\" href=\"/evidence/#t-destiny-breast06\">DESTINY-Breast06</a></td><td>Progression-free survival only, survival immature; the ultralow cohort exploratory</td></tr><tr><td>Germline <em>BRCA1/2</em></td><td>Olaparib or talazoparib</td><td><a class=\"trial-link\" href=\"/evidence/#t-olympiad\">OlympiAD</a>, <a class=\"trial-link\" href=\"/evidence/#t-embraca\">EMBRACA</a></td><td>Progression-free survival</td></tr></tbody></table></div>\n<p>For a patient with primary endocrine resistance who is <em>PIK3CA</em> and <em>ESR1</em> wild-type, second-line endocrine therapy may have less to offer, and chemotherapy or an antibody–drug conjugate is a reasonable alternative. VIKTORIA-1 is the qualification, having tested an endocrine-partnered regimen in prospectively <em>PIK3CA</em> wild-type disease after a CDK4/6 inhibitor. Where a CDK4/6 inhibitor was not given first line, adding one to fulvestrant improves progression-free survival across the class.</p>\n<ul><li class=\"evidence-prose\">PALOMA-3: palbociclib plus fulvestrant improved progression-free survival after progression on prior endocrine therapy (9.2 vs 3.8 months, HR 0.42, 95% CI 0.32 to 0.56, P&lt;0.001); prespecified overall survival was numerically longer but not significant (34.9 vs 28.0 months, HR 0.81, 95% CI 0.64 to 1.03, P=0.09), reaching significance in the endocrine-sensitive subgroup (HR 0.72) (N Engl J Med 2015;373:209-219; N Engl J Med 2018;379:1926-1936).</li><li class=\"evidence-prose\">MONARCH 2: abemaciclib plus fulvestrant improved progression-free survival (16.4 vs 9.3 months, HR 0.55) and final overall survival (45.8 vs 37.3 months, HR 0.78) (J Clin Oncol 2017;35:2875-2884; JCO Oncol Adv 2025;2:e2500052).</li><li class=\"evidence-prose\">MONALEESA-3: ribociclib plus fulvestrant improved progression-free survival (20.5 vs 12.8 months, HR 0.59) and overall survival (not reached vs 40.0 months, HR 0.72) in a population half of whom were treatment-naive for advanced disease, which inflates its medians relative to the other two (J Clin Oncol 2018;36:2465-2472; N Engl J Med 2020;382:514-524).</li></ul>\n<h3 id=\"s-esr1-mutant-disease-and-the-oral-serds\">ESR1-mutant disease and the oral SERDs</h3>\n<p><em>ESR1</em> mutations, chiefly D538G, Y537S and Y537N, develop in around 40% of patients with HR-positive metastatic disease at progression. Testing turns the mutation into a treatment variable rather than a retrospective explanation for resistance.</p>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\">EMERALD: elacestrant improved progression-free survival over standard endocrine monotherapy in the <em>ESR1</em>-mutant cohort (3.8 vs 1.9 months, HR 0.55; 6-month progression-free survival 41% vs 19%), the first oral SERD to beat standard endocrine therapy and the trial that defined <em>ESR1</em> testing (J Clin Oncol 2022;40:3246-3256).</span><span class=\"evidence-detail\">Benefit was greater in patients who had received a CDK4/6 inhibitor for at least 12 months, on post hoc analysis.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">EMBER-3: imlunestrant beat standard endocrine therapy in the <em>ESR1</em>-mutant subgroup (5.5 vs 3.8 months; restricted mean survival time difference 2.6 months, with no hazard ratio reported because the hazards were non-proportional) but not in the intention-to-treat population (HR 0.87, not significant).</span><span class=\"evidence-detail\">Adding abemaciclib to imlunestrant improved progression-free survival regardless of <em>ESR1</em> status (9.4 vs 5.5 months, HR 0.57) (N Engl J Med 2025;392:1189-1202).</span></li><li class=\"evidence-prose\">VERITAC-2 (vepdegestrant): vepdegestrant, an oral PROTAC oestrogen-receptor degrader, improved progression-free survival over fulvestrant in <em>ESR1</em>-mutant disease (5.0 vs 2.1 months, HR 0.58) with a higher response rate (19% vs 4%), while the intention-to-treat primary endpoint failed its prespecified boundary (3.8 vs 3.6 months, HR 0.83, P=0.07) (N Engl J Med 2025;393:556-568).</li></ul>\n<p>The pattern is consistent across all three: the effect is confined to the mutant population, the medians are short, and no survival benefit has been demonstrated. The class is mechanistically mixed rather than uniform, since a PROTAC degrader and a SERD reach the receptor by different routes. Two further agents have randomised data in this setting: camizestrant over fulvestrant in the randomised phase 2 SERENA-2 (7.2 and 7.7 months for the 75 mg and 150 mg doses versus 3.7, HR 0.59 and 0.64), and giredestrant plus everolimus over standard endocrine therapy plus everolimus in evERA-BC (<em>ESR1</em>-mutant 10 vs 5.5 months, HR 0.38; all patients 8.8 vs 5.5 months, HR 0.56).</p>\n<h3 id=\"s-switching-on-molecular-progression\">Switching on molecular progression</h3>\n<p><em>ESR1</em> mutations become detectable in ctDNA around 6 months before radiological progression, which raises the question of whether to act on the molecular event rather than wait. <a class=\"trial-link\" href=\"/evidence/#t-serena-6\">SERENA-6</a> tested that strategy in 315 patients. Those on a first-line aromatase inhibitor plus a CDK4/6 inhibitor were monitored with ctDNA every 2 to 3 months; on detection of an emergent <em>ESR1</em> mutation without radiological progression, they were randomised to switch the endocrine partner to camizestrant while continuing the same CDK4/6 inhibitor, or to continue the aromatase inhibitor. Switching improved progression-free survival (16.0 vs 9.2 months, HR 0.44) and delayed deterioration in global quality of life (21.0 vs 6.4 months, HR 0.54), with immature overall survival (N Engl J Med 2025;393:569-580). Second progression-free survival was not significant (HR 0.52) and adverse events of special interest were photopsia in 20% and bradycardia in 8%. PADA-1 tested the same principle earlier with fulvestrant, open-label. In 172 patients with an emergent ctDNA <em>ESR1</em> mutation on an aromatase inhibitor plus palbociclib, switching to fulvestrant improved progression-free survival (11.9 vs 5.7 months, HR 0.61, P=0.004), but median time to strategy failure, which counts the control arm&#x27;s own second-line progression-free survival, was similar (11.9 vs 10.6 months, HR 1.02, P=0.90) (Lancet Oncol 2022). PADA-1&#x27;s strategy endpoint suggests the switch may move the benefit forward in time rather than add to it, and neither trial has mature survival data, so the principle is proven for one drug and one setting and its generalisation is open.</p>\n<h3 id=\"s-pi3k-akt-mtor-altered-disease\">PI3K–AKT–mTOR-altered disease</h3>\n<p><em>PIK3CA</em> mutations occur in about 40% of HR-positive, HER2-negative metastatic disease. The four agents in this space differ in what they inhibit and in the population they were tested in.</p>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\">BOLERO-2: everolimus plus exemestane improved progression-free survival after progression on a non-steroidal aromatase inhibitor (7.8 vs 3.2 months by local assessment, 11.0 vs 4.1 centrally, HR 0.45) without an overall survival benefit (31.0 vs 26.6 months, HR 0.89) (N Engl J Med 2012;366:520-529; Ann Oncol 2014;25:2357-2362).</span><span class=\"evidence-detail\">It is biomarker-unselected, and it predates the CDK4/6 inhibitors, so none of its patients had received one.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">SOLAR-1: alpelisib plus fulvestrant improved progression-free survival in the <em>PIK3CA</em>-mutant cohort (11.0 vs 5.7 months, HR 0.65) without a significant survival gain (39.3 vs 31.4 months, HR 0.86) (N Engl J Med 2019;380:1929-1940; Ann Oncol 2021;32:208-217).</span><span class=\"evidence-detail\">Only 6% of patients had received a prior CDK4/6 inhibitor, which is the trial&#x27;s main limitation for current practice; BYLieve cohort A, in which all patients had, reported 6-month progression-free survival of 54% (Lancet 2024).</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">CAPItello-291: capivasertib plus fulvestrant improved progression-free survival overall (7.2 vs 3.6 months, HR 0.60) and in AKT-pathway-altered tumours carrying <em>PIK3CA</em>, <em>AKT1</em> or <em>PTEN</em> alterations (7.3 vs 3.1 months, HR 0.50), but final overall survival showed no significant benefit in either population (AKT-altered HR 0.83, overall HR 1.00) (N Engl J Med 2023;388:2058-2070; ESMO Open 2026;11:107440).</span><span class=\"evidence-detail\">Sixty-nine percent had received a prior CDK4/6 inhibitor.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">VIKTORIA-1: gedatolisib, a pan-PI3K/mTOR inhibitor, improved progression-free survival over fulvestrant in a prospectively <em>PIK3CA</em> wild-type population after a CDK4/6 inhibitor, as a triplet with palbociclib and fulvestrant (9.3 vs 2.0 months, HR 0.24) and as a doublet with fulvestrant (7.4 vs 2.0 months, HR 0.33) (J Clin Oncol 2026;44:1108-1119).</span><span class=\"evidence-detail\">The triplet costs grade 3 or worse neutropenia in 62%.</span></li></ul>\n<p>INAVO120 is the only member of this group with a confirmed survival benefit, and it differs from the others in being a first-line, mutation-selected triplet rather than a later-line doublet. The class toxicity is shared, being hyperglycaemia, rash, stomatitis, diarrhoea and nausea; relative frequency separates the agents.</p>\n<ul><li>Alpelisib: hyperglycaemia 64% any grade, 37% grade 3 or worse, the highest of the group. Monitor fasting glucose fortnightly for two months then monthly, with an added day 8 check.</li><li>Inavolisib: hyperglycaemia 59% any grade but 6% grade 3 or worse, stomatitis 51%.</li><li>Capivasertib: hyperglycaemia 16%, diarrhoea 72%, rash 38% with 12% grade 3 or worse.</li><li>Gedatolisib: stomatitis 57% with the doublet, 69% with the triplet.</li><li>Everolimus: stomatitis 56%, rash 36%, diarrhoea 30%, hyperglycaemia 13%, pneumonitis 12%.</li></ul>\n<h3 id=\"s-continuing-cdk4-6-inhibition-beyond-progression\">Continuing CDK4/6 inhibition beyond progression</h3>\n<p>Two randomised trials support maintaining pressure on the CDK4/6 pathway after progression, provided the endocrine partner is changed. They do not support continuing an identical failed regimen.</p>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\">postMONARCH: abemaciclib plus fulvestrant modestly improved progression-free survival after progression on a CDK4/6 inhibitor and endocrine therapy (6.0 vs 5.3 months, HR 0.73), the first phase 3 trial to show benefit from continuing CDK4/6 inhibition beyond progression (J Clin Oncol 2025;43:1101-1112).</span><span class=\"evidence-detail\">By blinded independent central review the medians were 12.9 versus 5.6 months (HR 0.55), and benefit was greater in patients who had received at least 12 months of the prior inhibitor.</span></li><li class=\"evidence-prose\">MAINTAIN (Kalinsky): switching the endocrine agent and adding ribociclib improved progression-free survival over switched endocrine therapy alone (5.29 vs 2.76 months, HR 0.57, P=.006) in patients 86.5% of whom had received palbociclib (J Clin Oncol 2023;41:4004-4013).</li></ul>\n<p>The gain is under a month by investigator assessment in postMONARCH, which is statistically significant and of questionable clinical importance. MAINTAIN is randomised phase 2. Both changed the inhibitor or the partner, and the mechanism of benefit after prior CDK4/6 inhibition varies by drug and design, so pathway persistence does not mean every continuation strategy works.</p>\n<h3 id=\"s-her2-low-and-her2-ultralow-expression\">HER2-low and HER2-ultralow expression</h3>\n<p>HER2-low means immunohistochemistry 1+, or 2+ with a negative in-situ hybridisation result: too little HER2 for the naked antibodies or first-generation conjugates to matter, but enough to home a bystander-capable payload. HER2-ultralow means immunohistochemistry 0 with faint, incomplete membrane staining. Most HER2-negative metastatic breast cancers fall in the HER2-low band. The category is drug-defined rather than a new biology: the threshold moved because the conjugate became potent enough to need less antigen.</p>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\">DESTINY-Breast04: in the HR-positive cohort of previously treated HER2-low disease, trastuzumab deruxtecan improved progression-free survival (10.1 vs 5.4 months, HR 0.51) and overall survival (23.9 vs 17.5 months, HR 0.64) over physician&#x27;s choice of chemotherapy (N Engl J Med 2022;387:9-20).</span><span class=\"evidence-detail\">Interstitial lung disease occurred in 12.1%, grade 3 in 1.3% and fatal in 0.8%.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">DESTINY-Breast06: moves the drug one line earlier, into chemotherapy-naive patients after two endocrine lines, or one where the disease was primarily endocrine-resistant, and one grade lower, adding an exploratory HER2-ultralow cohort.</span><span class=\"evidence-detail\">Progression-free survival improved in HER2-low disease (13.2 vs 8.1 months, HR 0.62; intention-to-treat HR 0.64) (N Engl J Med 2024;391:2110-2122). Overall survival was immature and not significant, with substantial crossover from chemotherapy to trastuzumab deruxtecan. The HER2-ultralow cohort was directionally consistent but unpowered (13.2 vs 8.3 months, HR 0.78, 95% CI 0.50 to 1.21), and interstitial lung disease occurred in 11%, fatal in 0.7%.</span></li></ul>\n<p>The two do not read identically on the expression gradient. DESTINY-Breast04 found benefit flat across immunohistochemistry 1+ and 2+/ISH-negative, whereas DESTINY-Breast06&#x27;s subgroup point estimates diverge by expression depth with no interaction test reported. Whether that is a real interaction, chance in an unpowered subgroup, or the difference between a post-chemotherapy and a post-endocrine population is unresolved. The assay itself is imprecise at this threshold. DESTINY-Breast06 misclassified several enrolled patients against its own central testing protocol, and its investigators call for splitting immunohistochemistry 0 into two clinical categories, against the current ASCO–CAP position that the existing categorisation suffices.</p>\n<h3 id=\"s-trop2-antibody-drug-conjugates\">TROP2 antibody–drug conjugates</h3>\n<p>Two TROP2-directed conjugates have randomised data in this subtype after endocrine therapy, separated by payload and toxicity rather than by target.</p>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-tropics-02\">TROPiCS-02</a>: sacituzumab govitecan improved progression-free survival (5.5 vs 4.0 months, HR 0.66) and overall survival (14.4 vs 11.2 months, HR 0.79) in endocrine-resistant, chemotherapy-pretreated disease (J Clin Oncol 2022;40:3365-3376; Lancet 2023;402:1423-1433).</span><span class=\"evidence-detail\">The median number of prior chemotherapy regimens was four.</span></li><li class=\"evidence-prose\"><a class=\"trial-link\" href=\"/evidence/#t-tropion-breast01\">TROPION-Breast01</a>: datopotamab deruxtecan improved progression-free survival over investigator&#x27;s-choice chemotherapy after endocrine therapy and one to two chemotherapy lines (6.9 vs 4.9 months, HR 0.63, 95% CI 0.52 to 0.76, P&lt;.0001), with a higher confirmed response rate (36.4% vs 22.9%) and far fewer grade 3 or worse treatment-related adverse events (20.8% vs 44.7%); overall survival was immature (HR 0.84) (J Clin Oncol 2025;43:285-296).</li></ul>\n<p>Sacituzumab govitecan&#x27;s toxicity is irinotecan-class, chiefly neutropenia and diarrhoea; datopotamab deruxtecan&#x27;s is deruxtecan-class, chiefly stomatitis, ocular surface events and interstitial lung disease. Neither has been compared with the other, and neither has been compared with trastuzumab deruxtecan, so the HER2-low route and the TROP2 route increasingly treat the same later-line patient without sequencing evidence. Two further agents are in this space without mature randomised support: ASCENT-07 tested sacituzumab govitecan in chemotherapy-naive, endocrine-resistant disease and was negative on progression-free survival (8.3 vs 8.3 months, HR 0.85), and sacituzumab tirumotecan improved progression-free survival over chemotherapy in OptiTROP-Breast02 (8.3 vs 4.1 months, HR 0.35), on an ESMO 2025 abstract.</p>\n<h3 id=\"s-germline-brca-mutated-disease\">Germline BRCA-mutated disease</h3>\n<p>PARP inhibition selects patients by germline genotype rather than by receptor phenotype, so its trials enrolled HER2-negative disease of both hormone-receptor subtypes.</p>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\">OlympiAD: olaparib improved progression-free survival over physician&#x27;s choice of capecitabine, eribulin or vinorelbine (7.0 vs 4.2 months, HR 0.58, 95% CI 0.43 to 0.80, P&lt;0.001) and roughly doubled response (59.9% vs 28.8%).</span><span class=\"evidence-detail\">Final overall survival was not improved overall (19.3 vs 17.1 months, HR 0.90) in an analysis not powered for survival and confounded by crossover, with a non-alpha-controlled signal in patients treated in the first-line metastatic setting (HR 0.51) (N Engl J Med 2017;377:523-533; Ann Oncol 2019;30:558-566). Grade 3 or worse adverse events were less frequent than with chemotherapy (36.6% vs 50.5%).</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">EMBRACA: talazoparib improved progression-free survival (8.6 vs 5.6 months, HR 0.54, 95% CI 0.41 to 0.71, P&lt;0.001) and more than doubled response (62.6% vs 27.2%), with patient-reported outcomes favouring talazoparib.</span><span class=\"evidence-detail\">Interim overall survival was not significant (22.3 vs 19.5 months, HR 0.76, immature) (N Engl J Med 2018;379:753-763), and the final analysis was negative (19.3 vs 19.5 months, HR 0.848, P=0.17) (Ann Oncol 2020;31:1526-1535). Grade 3–4 haematologic toxicity was higher than with chemotherapy (55% vs 38%), reflecting greater PARP-trapping potency.</span></li></ul>\n<p>The two reproduce each other&#x27;s shape, which makes this a class effect rather than a ranking. Neither trial included platinum in the control arm, so PARP inhibitor versus platinum remains untested. The two trials disagree on which receptor subgroup benefits more. OlympiAD&#x27;s progression-free survival hazard ratio was 0.82 (95% CI 0.55 to 1.26) in hormone receptor-positive disease against 0.43 in triple-negative disease, whereas EMBRACA&#x27;s ran the other way (0.47 and 0.60 respectively). Neither trial was powered for the comparison.</p>\n<h2 id=\"s-her2-positive-disease\">HER2-positive disease</h2>\n<p>Each advance has added to or intensified a trastuzumab-plus-chemotherapy backbone rather than discarding it: a second antibody at first line, conjugates carrying a cytotoxic payload to the HER2-bearing cell, and tyrosine-kinase inhibitors that reach disease the antibodies cannot, notably the brain. <a class=\"trial-link\" href=\"/evidence/#t-h0648g-pivotal-trastuzumab\">H0648g (pivotal trastuzumab)</a> is the origin. Adding trastuzumab to first-line chemotherapy prolonged time to progression (7.4 vs 4.6 months, P&lt;0.001), raised objective response (50% vs 32%, P&lt;0.001) and improved overall survival (25.1 vs 20.3 months, P=0.046) in HER2-overexpressing metastatic disease (N Engl J Med 2001;344:783-792). Concurrent anthracycline and trastuzumab caused cardiac dysfunction in 27% against 8% with anthracycline alone, which is why the durable HER2 backbone became a taxane rather than an anthracycline.</p>\n<h3 id=\"s-first-line\">First line</h3>\n<p>Dual antibody blockade with a taxane remains the standard. <a class=\"trial-link\" href=\"/evidence/#t-cleopatra\">CLEOPATRA</a> added pertuzumab to trastuzumab and docetaxel and improved independently assessed progression-free survival (18.5 vs 12.4 months, HR 0.62, 95% CI 0.51 to 0.75, P&lt;0.001) and final overall survival (56.5 vs 40.8 months, HR 0.68, 95% CI 0.56 to 0.84), with an 8-year landmark survival of 37% versus 23% and no added cardiotoxicity (N Engl J Med 2012;366:109-119; N Engl J Med 2015;372:724-734; Lancet Oncol 2020;21:519-530). Adding pertuzumab increased diarrhoea (67%), rash (34%), mucositis (28%) and febrile neutropenia (14%). <a class=\"trial-link\" href=\"/evidence/#t-peruse\">PERUSE</a> reports outcomes by taxane. In 1,436 patients given investigator-selected docetaxel, paclitaxel or nab-paclitaxel with pertuzumab and trastuzumab, median progression-free survival was 20.7 months and overall survival 65.3 months at 5.7 years of follow-up, with objective response in 79% (Ann Oncol 2019;30:766-773; Ann Oncol 2021;32:1245-1255). Paclitaxel and docetaxel subgroups had descriptively similar progression-free survival (23.2 vs 19.4 months) and overall survival (64.0 vs 66.5 months), with grade 3 or worse neutropenia in 5% versus 15% and febrile neutropenia in 1% versus 11%. Grade 3 or worse diarrhoea was 9% versus 8% and fatal adverse events occurred in 2%. Taxane choice was not randomised and no formal comparison was performed, so paclitaxel is a practical alternative rather than a demonstrated equal. <a class=\"trial-link\" href=\"/evidence/#t-destiny-breast09\">DESTINY-Breast09</a> challenges the standard directly. First-line trastuzumab deruxtecan plus pertuzumab improved progression-free survival over a taxane with trastuzumab and pertuzumab (40.7 vs 26.9 months, HR 0.56, 95% CI 0.44 to 0.71) (N Engl J Med 2026;394:551-562). Benefit was seen in both hormone-receptor strata (HR-positive 38.0 vs 27.7 months, HR 0.61; HR-negative 40.7 vs 22.6 months, HR 0.52), with objective response in 85.1% versus 78.6%, interstitial lung disease in 12% and left ventricular dysfunction in 11%. Overall survival is immature, so this is a live contest rather than a settled displacement. CLEOPATRA remains the anchor until survival matures.</p>\n<h3 id=\"s-maintenance-intensification-and-hormone-receptor-positive-overlap\">Maintenance intensification and hormone receptor-positive overlap</h3>\n<p>After induction chemotherapy has controlled the disease, antibody therapy continues as maintenance, and in HR-positive disease an aromatase inhibitor is added. Two trials intensify that maintenance phase further.</p>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-patina\">PATINA</a>: adding palbociclib to anti-HER2 therapy plus endocrine therapy in HR-positive, HER2-positive disease that had not progressed after induction prolonged progression-free survival (44.3 vs 29.1 months, HR 0.75), the first CDK4/6-inhibitor benefit demonstrated in HER2-positive disease (N Engl J Med 2026;394:451-462).</span><span class=\"evidence-detail\">Objective response was 29.9% versus 22.2% and 5-year overall survival 74% versus 70%, immature.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-her2climb-05\">HER2CLIMB-05</a>: adding tucatinib to maintenance trastuzumab and pertuzumab prolonged progression-free survival (24.9 vs 16.3 months, HR 0.64), with benefit across subgroups including patients with baseline brain metastases (J Clin Oncol 2026;44:1597-1607).</span><span class=\"evidence-detail\">Diarrhoea occurred in 73%, nausea 33% and transaminitis 25%.</span></li></ul>\n<p>Both measure progression-free survival from the start of maintenance, not from randomisation to induction, and both have immature overall survival. The high absolute medians reflect a population already selected for at least stable disease on induction. <a class=\"trial-link\" href=\"/evidence/#t-her2climb\">HER2CLIMB</a>&#x27;s benefit on CNS-specific progression-free survival does not reproduce at this line; the subgroup benefit reported here is on overall progression-free survival in patients with brain metastases. For the patient unfit for induction chemotherapy, PERTAIN supports a chemotherapy-free option: adding pertuzumab to trastuzumab and an aromatase inhibitor improved progression-free survival (20.6 vs 15.8 months, HR 0.67, P=0.006) without an overall survival benefit (60.2 vs 57.2 months, HR 1.05).</p>\n<h3 id=\"s-second-line\">Second line</h3>\n<p><a class=\"trial-link\" href=\"/evidence/#t-emilia\">EMILIA</a> established trastuzumab emtansine after trastuzumab and a taxane, improving progression-free survival (9.6 vs 6.4 months, HR 0.65, 95% CI 0.55 to 0.77) and overall survival (30.9 vs 25.1 months, HR 0.68, 95% CI 0.55 to 0.85) over lapatinib plus capecitabine, with less toxicity (N Engl J Med 2012;367:1783-1791). It was the first antibody–drug conjugate shown to extend life in breast cancer, and it moved the backbone from blocking the receptor to using it as a delivery address. <a class=\"trial-link\" href=\"/evidence/#t-destiny-breast03\">DESTINY-Breast03</a> then displaced it. Trastuzumab deruxtecan against trastuzumab emtansine in the same setting produced a median progression-free survival not reached (95% CI 18.5 to not estimable) versus 6.8 months (HR 0.28, 95% CI 0.22 to 0.37, P&lt;0.001), with confirmed objective response of 79.7% versus 34.2%; overall survival was immature at the primary analysis (N Engl J Med 2022;386:1143-1154). On longer follow-up progression-free survival matured to 28.8 versus 6.8 months (HR 0.33) and overall survival to 52.6 versus 42.7 months (HR 0.73), with interstitial lung disease in 15%. Trastuzumab deruxtecan is the preferred second-line option. The first-line trials excluded patients relapsing soon after (neo)adjuvant therapy, and the window differs: 12 months for CLEOPATRA, 6 months for PERUSE and DESTINY-Breast09. A patient relapsing inside their trial&#x27;s window should be treated as second line.</p>\n<h3 id=\"s-third-line-and-beyond\">Third line and beyond</h3>\n<p>No evidence establishes the optimal regimen after second-line trastuzumab deruxtecan, and the historical third-line sequence has been overtaken by the drug&#x27;s move into second line. The options divide by mechanism. Tyrosine-kinase inhibitors:</p>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\">HER2CLIMB: tucatinib added to trastuzumab and capecitabine after trastuzumab, pertuzumab and trastuzumab emtansine improved progression-free survival (7.8 vs 5.6 months, HR 0.54, 95% CI 0.42 to 0.71, P&lt;0.001) and overall survival (21.9 vs 17.4 months, HR 0.66, 95% CI 0.50 to 0.88, P=0.005); among patients with brain metastases the risk of progression or death fell (HR 0.48, 95% CI 0.34 to 0.69) (N Engl J Med 2020;382:597-609).</span><span class=\"evidence-detail\">It is the first HER2-selective inhibitor and the CNS-directed anchor of this disease.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-nala\">NALA</a>: neratinib plus capecitabine against lapatinib plus capecitabine improved centrally reviewed progression-free survival (HR 0.76, 95% CI 0.63 to 0.93, P=0.006; 12-month rate 29% vs 15%, medians 5.6 vs 5.5 months) and duration of response, and fewer patients required intervention for CNS disease (cumulative incidence 22.8% vs 29.2%, P=0.043).</span><span class=\"evidence-detail\">Overall survival was not significantly improved (HR 0.88, 95% CI 0.72 to 1.07; restricted mean 24.0 vs 22.2 months) (J Clin Oncol 2020;38:3138-3149).</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-egf100151-lapatinib-capecitabine\">EGF100151 (lapatinib + capecitabine)</a>: the origin of the modality.</span><span class=\"evidence-detail\">Lapatinib added to capecitabine after anthracycline, taxane and trastuzumab roughly doubled independently assessed time to progression (8.4 vs 4.4 months, HR 0.49, 95% CI 0.34 to 0.71), and fewer patients had the CNS as first site of progression (4 vs 11, P=0.10), the first hint that a small molecule might reach the brain (N Engl J Med 2006;355:2733-2743).</span></li></ul>\n<p>Antibody–drug conjugates:</p>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-destiny-breast01\">DESTINY-Breast01</a>: single-arm trastuzumab deruxtecan after trastuzumab emtansine in patients with a median of six prior lines produced confirmed objective response in 60.9% (95% CI 53.4 to 68.0) with median progression-free survival of 16.4 months (N Engl J Med 2020;382:610-621).</span><span class=\"evidence-detail\">It surfaced the drug&#x27;s defining risk: interstitial lung disease in 13.6%, including four fatal events (2.2%).</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-destiny-breast02\">DESTINY-Breast02</a>: the randomised successor, in a less heavily pretreated post-emtansine population, improved progression-free survival (17.8 vs 6.9 months, HR 0.36, 95% CI 0.28 to 0.45, P&lt;0.001) and overall survival (39.2 vs 26.5 months, HR 0.66, 95% CI 0.50 to 0.86) over capecitabine with trastuzumab or lapatinib (Lancet 2023;401:1773-1785).</span><span class=\"evidence-detail\">It is the first randomised proof that one conjugate can overcome acquired resistance to a prior one built on the same antibody.</span></li><li class=\"evidence-prose\"><a class=\"trial-link\" href=\"/evidence/#t-th3resa\">TH3RESA</a>: trastuzumab emtansine against treatment of physician&#x27;s choice after at least two HER2-directed regimens improved progression-free survival (6.2 vs 3.3 months, HR 0.53, 95% CI 0.42 to 0.66, P&lt;0.001) and overall survival (22.7 vs 15.8 months, HR 0.68, 95% CI 0.54 to 0.85, P=0.0007), with grade 3 or worse haemorrhage in 4% versus under 1% (Lancet Oncol 2014;15:689-699; Lancet Oncol 2017;18:743-754).</li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-horizon-breast01\">HORIZON-Breast01</a>: trastuzumab rezetecan improved progression-free survival over pyrotinib plus capecitabine at interim analysis (30.6 vs 8.3 months, HR 0.22, 95% CI 0.15 to 0.34, P&lt;0.0001; 12-month rate 84.7% vs 35.5%), with more haematologic toxicity than the oral doublet, interstitial lung disease in 3% and immature overall survival (Lancet Oncol 2026, online ahead of print).</span><span class=\"evidence-detail\">The trial was conducted entirely in China across 50 hospitals.</span></li></ul>\n<p>Antibody re-engineering and retreatment:</p>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-sophia\">SOPHIA</a>: margetuximab, an Fc-engineered anti-HER2 antibody, modestly improved progression-free survival over trastuzumab on the same chemotherapy backbone (5.8 vs 4.9 months, HR 0.76, 95% CI 0.59 to 0.98, P=0.03), with no significant survival improvement at the second interim analysis (21.6 vs 19.8 months, HR 0.89, 95% CI 0.69 to 1.13) (JAMA Oncol 2021;7:573-584).</span><span class=\"evidence-detail\">Its prespecified but non-alpha-controlled CD16A-158F genotype signal is hypothesis-generating and under prospective test.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-precious\">PRECIOUS</a>: pertuzumab retreatment after progression on a prior pertuzumab-containing regimen improved investigator-assessed progression-free survival (5.3 vs 4.2 months, HR 0.76, one-sided 95% CI upper bound 0.97, P=0.022) but independent-review progression-free survival was flat (4.4 vs 4.4 months, HR 1.03).</span><span class=\"evidence-detail\">Final overall survival favoured retreatment (36.2 vs 26.5 months, HR 0.73, no P value since alpha was spent on progression-free survival) (Cancer Sci 2022;113:3169-3179; J Clin Oncol 2025;43:1631-1637). It is underpowered by design, single-country and open-label.</span></li></ul>\n<p>Two combinations without a randomised survival case are also used. HER2CLIMB-02 added tucatinib to trastuzumab emtansine and improved progression-free survival (9.5 vs 7.4 months, HR 0.76, P=0.0163) without a survival gain (not reached vs 38 months, HR 1.23), and trastuzumab plus lapatinib improved on lapatinib alone after multiple prior lines (progression-free survival 12 vs 8 weeks, HR 0.73, P=0.008; overall survival 14 vs 9.5 months, HR 0.74, P=0.026) in EGF104900. For the patient with HR-positive, HER2-positive disease, low disease burden and unfitness for chemotherapy, monarcHER offers a chemotherapy-free option: abemaciclib with fulvestrant and trastuzumab improved progression-free survival over trastuzumab plus chemotherapy (8.3 vs 5.7 months, HR 0.67) in a randomised phase 2 trial of 237 patients (Lancet Oncol 2020).</p>\n<h3 id=\"s-brain-metastases\">Brain metastases</h3>\n<p>Local therapy remains standard for active brain metastases: surgery, stereotactic radiosurgery or gamma-knife. Two systemic options carry prospective intracranial data.</p>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-destiny-breast12\">DESTINY-Breast12</a>: a prospective single-arm cohort of 263 patients with baseline brain metastases including active lesions, tucatinib-naive by design.</span><span class=\"evidence-detail\">Median progression-free survival was 17.3 months (12-month rate 61.6%) with confirmed intracranial objective response of 71.7%, the largest prospective dataset for trastuzumab deruxtecan in stable and active brain metastases (Nat Med 2024;30:3717-3727). Investigator-reported interstitial lung disease occurred in 16% of the brain-metastasis cohort (grade 5 in 2.3%) and 13% of those without (grade 5 in 1.2%), with no central adjudication committee.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">HER2CLIMB enrolled patients with brain metastases by design, about half the trial.</span><span class=\"evidence-detail\">In patients with active brain metastases, intracranial response was 47% versus 20%, CNS progression-free survival 9.9 versus 4.2 months, and overall survival 21.6 versus 12.5 months.</span></li></ul>\n<p>Which of the two better serves brain-metastasis disease is untested, because DESTINY-Breast12 excluded prior tucatinib by protocol design.</p>\n<h2 id=\"s-triple-negative-disease\">Triple-negative disease</h2>\n<p>Triple-negative breast cancer is diagnosed by exclusion, which is why it lacks the endocrine and anti-HER2 pathways that organise the rest of breast oncology. Two biomarkers are read in parallel at diagnosis of advanced disease, and they select partly overlapping populations: PD-L1 combined positive score routes the first-line backbone, and germline <em>BRCA</em> opens a genotype-defined option that cuts across the receptor subtypes.</p>\n<h3 id=\"s-first-line-at-pd-l1-combined-positive-score-of-10-or-more\">First line at PD-L1 combined positive score of 10 or more</h3>\n<p><a class=\"trial-link\" href=\"/evidence/#t-keynote-355\">KEYNOTE-355</a> is the standard. Pembrolizumab added to investigator&#x27;s choice of nab-paclitaxel, paclitaxel or gemcitabine–carboplatin improved progression-free survival (9.7 vs 5.6 months, HR 0.65, P=0.0012) and overall survival (23.0 vs 16.1 months, HR 0.73, 95% CI 0.55 to 0.95, P=0.0185) in disease with a 22C3 combined positive score of 10 or more (Lancet 2020;396:1817-1828; N Engl J Med 2022;387:217-226). Benefit was confined to that band: it did not reach significance at combined positive score 1 or more (overall survival HR 0.86), the intention-to-treat population went untested under the hierarchy, and combined positive score 1 to 9 showed no gain. Immune-related adverse events occurred in 26.5%, most often hypo- and hyperthyroidism. <a class=\"trial-link\" href=\"/evidence/#t-impassion130\">IMpassion130</a> opened the field but could not prove what KEYNOTE-355 later did. Atezolizumab plus nab-paclitaxel improved progression-free survival in the intention-to-treat population (7.2 vs 5.5 months, HR 0.80, P=0.002) and more so in PD-L1-positive disease by SP142 immune-cell scoring at 1% or more (7.5 vs 5.0 months, HR 0.62). Because intention-to-treat overall survival was not significant (final HR 0.87, P=0.077), the PD-L1-positive survival difference (25.4 vs 17.9 months, HR 0.67) could only be reported descriptively (N Engl J Med 2018;379:2108-2121; Ann Oncol 2021;32:983-993). <a class=\"trial-link\" href=\"/evidence/#t-impassion131\">IMpassion131</a> then failed to confirm it with solvent-based paclitaxel instead of nab-paclitaxel. Progression-free survival did not improve in PD-L1-positive disease (6.0 vs 5.7 months, HR 0.82, 95% CI 0.60 to 1.12, P=0.20) and overall survival numerically favoured placebo (22.1 vs 28.3 months, HR 1.11) (Ann Oncol 2021;32:994-1004). The atezolizumab indication in metastatic disease was withdrawn. The candidate explanations were the taxane formulation and the corticosteroid premedication that solvent-based paclitaxel requires, but KEYNOTE-355 succeeded including with paclitaxel, which weakens that reading. The two assays do not interchange. IMpassion130 reads PD-L1 on immune cells by SP142 at a 1%-of-tumour-area cutoff; KEYNOTE-355 reads a combined positive score on 22C3. Within one disease, &quot;PD-L1-positive&quot; denotes different tissue depending on which drug is under consideration. <a class=\"trial-link\" href=\"/evidence/#t-ascent-04-keynote-d19\">ASCENT-04 (KEYNOTE-D19)</a> is the current challenger, and it keeps the immune half while replacing the cytotoxic half. Both arms received pembrolizumab; the experimental arm substituted sacituzumab govitecan for chemotherapy in the same combined positive score 10 or more population. Progression-free survival improved (11.2 vs 7.8 months, HR 0.65, 95% CI 0.51 to 0.84, P&lt;0.001) with a longer duration of response (16.5 vs 9.2 months) and far less discontinuation for toxicity (12% vs 31%), while response rates were similar (60% vs 53%) (N Engl J Med 2026;394:354-366). Overall survival was immature, untested and crossover-confounded. Two qualifications govern how far this goes. The win is over chemo-immunotherapy rather than over chemotherapy, since the control arm was the KEYNOTE-355 regimen performing as expected. The result also rests on progression-free survival and response durability alone, pending survival data.</p>\n<h3 id=\"s-first-line-when-immunotherapy-is-not-an-option\">First line when immunotherapy is not an option</h3>\n<p>Most metastatic triple-negative disease is PD-L1-negative at a combined positive score of 10, and a smaller number of patients are ineligible for a checkpoint inhibitor through prior exposure in the curative setting or a coexisting condition. For this group first-line care was chemotherapy alone, and two conjugates have now beaten it.</p>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-ascent-03\">ASCENT-03</a>: sacituzumab govitecan monotherapy improved progression-free survival over physician&#x27;s choice of paclitaxel, nab-paclitaxel or gemcitabine–carboplatin (9.7 vs 6.9 months, HR 0.62, 95% CI 0.50 to 0.77, P&lt;0.001) in a population 99% PD-L1-negative.</span><span class=\"evidence-detail\">Response rates were similar (48% vs 46%) but responses lasted far longer (12.2 vs 7.2 months). Overall survival was immature and untested (21.5 vs 20.2 months) with heavy crossover (N Engl J Med 2025;393:1912-1925). Grade 3 or worse neutropenia occurred in 43%, and early neutropenic-sepsis deaths prompted primary G-CSF prophylaxis; discontinuation for toxicity was 4% versus 12%.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\"><a class=\"trial-link\" href=\"/evidence/#t-tropion-breast02\">TROPION-Breast02</a>: datopotamab deruxtecan met both dual primary endpoints, improving progression-free survival (10.8 vs 5.6 months, HR 0.57, 99% CI 0.44 to 0.73, P&lt;0.0001) and overall survival (23.7 vs 18.7 months, HR 0.79, 95.01% CI 0.64 to 0.98, P=0.029), with response more than doubled (63% vs 29%).</span><span class=\"evidence-detail\">Adjudicated interstitial lung disease occurred in 3%, with no treatment-related deaths and lower discontinuation (4% vs 7%) (Ann Oncol 2026, online ahead of print).</span></li></ul>\n<p>Here the control arm genuinely is the standard of care, so the result can be stated plainly: both conjugates improved on chemotherapy. Datopotamab deruxtecan has proven survival where sacituzumab govitecan has not, but that difference reflects trial maturity and crossover rather than a demonstrated potency gap, and the two were never randomised against each other. Choose on toxicity signature.</p>\n<h3 id=\"s-germline-brca-mutated-disease-and-platinum\">Germline BRCA-mutated disease and platinum</h3>\n<p>OlympiAD and EMBRACA both enrolled germline <em>BRCA</em>-mutated HER2-negative disease, about half of which was triple-negative, and both are set out above. In the triple-negative subgroup OlympiAD&#x27;s progression-free survival hazard ratio was 0.43 and EMBRACA&#x27;s 0.60. The two do not agree on which subgroup benefits more, and neither was powered for that comparison. Neither trial included platinum in its control arm, and both excluded patients who had progressed on platinum or received it recently in the curative setting. <a class=\"trial-link\" href=\"/evidence/#t-tnt-cruk-07-012\">TNT (CRUK/07/012)</a> supplies the platinum evidence on that axis without closing it. Carboplatin and docetaxel were equivalent in unselected triple-negative disease (objective response 31.4% vs 34.0%, P=0.66), but in germline <em>BRCA</em> carriers carboplatin doubled response (68% vs 33%, treatment-biomarker interaction P=0.01), with progression-free survival of 6.8 versus 4.4 months and no overall survival difference in a trial where 56% crossed over (Nat Med 2018;24:628-637). <em>BRCA1</em> promoter methylation, low <em>BRCA1</em> mRNA and a Myriad homologous-recombination-deficiency score did not predict platinum benefit. Germline <em>BRCA</em> status selects patients for platinum. Broader assays of homologous-recombination deficiency do not.</p>\n<h3 id=\"s-pretreated-disease\">Pretreated disease</h3>\n<p><a class=\"trial-link\" href=\"/evidence/#t-ascent\">ASCENT</a> established sacituzumab govitecan in pretreated disease. In relapsed or refractory disease with a median of three prior anticancer regimens, all taxane-exposed, sacituzumab govitecan improved progression-free survival (5.6 vs 1.7 months, HR 0.41), response (35% vs 5%) and overall survival (12.1 vs 6.7 months, HR 0.48, both P&lt;0.001) over single-agent chemotherapy in the brain-metastasis-negative primary population. The final intention-to-treat analysis including brain-metastasis-positive patients confirmed it (overall survival 11.8 vs 6.9 months, HR 0.51, 95% CI 0.42 to 0.63) (N Engl J Med 2021;384:1529-1541; J Clin Oncol 2024;42:1738-1744). Grade 3 or worse neutropenia occurred in 51% and diarrhoea in 10%, with no treatment-related deaths. TROP2 expression is not a selection biomarker, and TROP2 testing is not required before treatment. Benefit held across every immunohistochemistry quartile with no significant treatment-by-expression interaction, and across HER2 immunohistochemistry 0 and HER2-low tumours. The antigen directs the antibody to the tumour without selecting which patients respond. HER2-directed conjugates occupy adjacent ground. In the exploratory, unpowered hormone receptor-negative cohort of DESTINY-Breast04 (n=58), progression-free survival was 8.5 versus 2.9 months (HR 0.46) and overall survival 18.2 versus 8.3 months (HR 0.48) (N Engl J Med 2022;387:9-20). That cohort remains the only evidence for the HER2-low route in triple-negative disease, since DESTINY-Breast06 excluded hormone receptor-negative patients. Sacituzumab tirumotecan is a third TROP2 conjugate with randomised data in this setting: in OptiTROP-Breast01 it improved progression-free survival (6.7 vs 2.1 months, HR 0.32, P&lt;0.00001) and overall survival (not reached vs 9.4 months, HR 0.53, P=0.0005) over physician&#x27;s choice chemotherapy (n=263). Read across the disease, three randomised, alpha-controlled results carry a demonstrated overall survival benefit: pretreated sacituzumab govitecan, first-line chemo-immunotherapy at combined positive score 10 or more, and first-line datopotamab deruxtecan in immunotherapy-ineligible disease. DESTINY-Breast04&#x27;s triple-negative cohort points the same way without the power to prove it. The rest are led by progression-free survival and response with survival still open.</p>\n<h2 id=\"s-cytotoxic-chemotherapy\">Cytotoxic chemotherapy</h2>\n<p>Sequential single agents are the default. Combination chemotherapy raises response and toxicity without a survival gain, so it is reserved for imminent organ failure. In E1193 (n=739, doxorubicin vs paclitaxel vs the combination, with mandated crossover for the single-agent arms) the combination raised response (47% vs 36% and 34%) and time to treatment failure (8 vs 5.8 and 6 months) with similar overall survival (22.9 vs 18.9 and 22.2 months; J Clin Oncol 2003). Taxane and anthracycline monotherapy have similar response rates of about 30% and similar survival (J Clin Oncol 2008 meta-analysis). Schedule affected outcome in several randomised comparisons.</p>\n<ul><li class=\"evidence-prose\">Weekly paclitaxel improved on 3-weekly paclitaxel in CALGB 9840 (n=735) on response (42% vs 29%), time to progression (9 vs 5 months) and overall survival (24 vs 12 months), at the cost of more grade 3 neuropathy.</li><li class=\"evidence-prose\">Three-weekly docetaxel 100 mg/m² improved on 3-weekly paclitaxel 175 mg/m² after anthracycline failure (n=449) on overall survival (15.4 vs 12.7 months), time to progression (5.7 vs 3.6 months) and response (32% vs 25%) (Jones et al, J Clin Oncol 2005).</li><li class=\"evidence-prose\">Weekly nab-paclitaxel was not superior to weekly paclitaxel in CALGB 40502, in which both arms also received bevacizumab (n=799, progression-free survival 9.3 vs 11 months).</li><li class=\"evidence-prose\">Four-weekly liposomal doxorubicin was non-inferior to 3-weekly doxorubicin (n=509; overall survival 21 vs 22 months, progression-free survival 6.9 vs 7.8 months), with less cardiotoxicity (HR 3.16 for doxorubicin), alopecia and vomiting, but more hand–foot syndrome and mucositis (O&#x27;Brien et al, Ann Oncol).</li></ul>\n<p>Later-line single agents:</p>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\">Capecitabine 1000–1250 mg/m² twice daily for 14 days every 3 weeks.</span><span class=\"evidence-detail\">It crosses the blood–brain barrier, so consider it with brain metastases; phase 2 data after anthracycline and taxane give response rates of 28–30% and time to progression of 4–5 months.</span></li><li class=\"evidence-prose\"><span class=\"evidence-lead\">Eribulin 1.4 mg/m² on days 1 and 8 every 3 weeks.</span><span class=\"evidence-detail\">In EMBRACE (n=762, median four prior chemotherapy lines) eribulin improved overall survival over treatment of physician&#x27;s choice (13.1 vs 10.6 months), with neutropenia, febrile neutropenia and peripheral neuropathy in 5%. Against capecitabine in Study 301 (n=1,102) it was equivalent on overall survival (15.9 vs 14.5 months), progression-free survival (4.1 vs 4.2 months) and response (11% vs 11.5%).</span></li><li class=\"evidence-prose\">Vinorelbine 30 mg/m² days 1 and 8 every 3 weeks, response 25–45%; also gemcitabine, ixabepilone, oral etoposide 50 mg/m² for 21 days every 4 weeks (response about 30%), and the platinums.</li></ul>\n<h2 id=\"s-special-situations\">Special situations</h2>\n<p><strong>Brain metastases outside HER2-positive disease.</strong> Local therapy is standard, and capecitabine has the best rationale on blood–brain barrier penetration. Most first-line trials in hormone receptor-positive disease excluded CNS metastases, so the systemic evidence there is thin. <strong>Duration of maintenance anti-HER2 therapy in complete response.</strong> The optimal duration is unknown, and treatment can continue for years. Balance tolerability, cardiotoxicity, patient preference and cost.</p>\n<h2 id=\"s-references\">References</h2>\n<ol class=\"refs\">\n<li id=\"ref-breast-metastatic-breast-cancer-t-paloma-2\"><a class=\"trial-link\" href=\"/evidence/#t-paloma-2\">PALOMA-2</a>. <a href=\"https://drive.google.com/file/d/1EHtNfz_w7GGDxQEGPRemytxa9e8Z9wkj/preview\">N Engl J Med 2016;375:1925-1936</a>; <a href=\"https://drive.google.com/file/d/1Ygv08N-KsfKWI54ahwK7Pklnvx6B-NhU/preview\">J Clin Oncol 2024;42:994-1000</a></li>\n<li id=\"ref-breast-metastatic-breast-cancer-t-monaleesa-2\"><a class=\"trial-link\" href=\"/evidence/#t-monaleesa-2\">MONALEESA-2</a>. <a href=\"https://drive.google.com/file/d/18SXi12xGTNgDPyqvsnV33jkI57pXhhEm/preview\">N Engl J Med 2016;375:1738-1748</a>; <a href=\"https://drive.google.com/file/d/1QDi7bZRsrVzd1AP7P9a3tUacZx7Ye0aE/preview\">N Engl J Med 2022;386:942-950</a></li>\n<li id=\"ref-breast-metastatic-breast-cancer-t-monaleesa-7\"><a class=\"trial-link\" href=\"/evidence/#t-monaleesa-7\">MONALEESA-7</a>. <a href=\"https://drive.google.com/file/d/1hX2S69RKOf4F6kHkRt5ci2NnoSzy4Hom/preview\">Lancet Oncol 2018;19:904-915</a>; <a href=\"https://drive.google.com/file/d/16BwxRF7L13xe4diAnJ_hXXcLFnLjKNAr/preview\">N Engl J Med 2019;381:307-316</a></li>\n<li id=\"ref-breast-metastatic-breast-cancer-t-monarch-3\"><a class=\"trial-link\" href=\"/evidence/#t-monarch-3\">MONARCH 3</a>. <a href=\"https://drive.google.com/file/d/1FKM2OYddNGjFTVQk8RhUD0EgfQlpyXSG/preview\">J Clin Oncol 2017;35:3638-3646</a>; <a href=\"https://drive.google.com/file/d/1q54YnJRtxSY_S0piTwr2ri8pd8hTybdA/preview\">Ann Oncol 2024;35:718-727</a></li>\n<li id=\"ref-breast-metastatic-breast-cancer-t-paloma-3\"><a class=\"trial-link\" href=\"/evidence/#t-paloma-3\">PALOMA-3</a>. <a href=\"https://drive.google.com/file/d/1xVUvnKZbn2_CWRYcLV1A9JBWCggT9hka/preview\">N Engl J Med 2015;373:209-219</a>; <a href=\"https://drive.google.com/file/d/131GtShYshEnuw6oRiYl4FFMey49gnhMD/preview\">N Engl J
