COPP/ABVD regimen, an advantage that held to 10 years at the cost of secondary leukaemia. It randomised 1,282 patients with advanced or unfavourable intermediate-stage disease to 8 cycles of COPP/ABVD, baseline BEACOPP or escalated BEACOPP, with radiotherapy consolidating residual or initially bulky disease; COPP/ABVD closed early at the first interim analysis, leaving 261 patients against 469 and 466. At a median 111 months, freedom from treatment failure was 82% with escalated BEACOPP, 70% with baseline BEACOPP and 64% with COPP/ABVD, and overall survival 86%, 80% and 75% in the same order (escalated beating baseline BEACOPP on both, P&lt;.0001 and P=.0053). Secondary leukaemia or myelodysplasia tracked the dose: 10-year cumulative incidence 3.2%, 2.2% and 0.4% (P=.030), while overall second-malignancy incidence did not separate (P=.82) (N Engl J Med 2003;348:2386-2395). This 10-year analysis sat outside the trial&#x27;s prespecified schedule, so none of its comparisons is a protected result. <a class=\"trial-link\" href=\"/evidence/#t-ghsg-hd15\">GHSG HD15</a> then found that 6 cycles of escalated BEACOPP match 8 and cause less toxicity, becoming the investigators&#x27; preferred regimen. It randomised 2,182 patients with advanced-stage disease to 8 cycles of escalated BEACOPP, 6 cycles of escalated BEACOPP, or 8 cycles of BEACOPP-14, with radiotherapy by protocol confined to PET-positive residual masses of 2.5 cm or more. 5-year freedom from treatment failure was 89.3% with 6 cycles, 84.4% with 8 cycles and 85.4% with BEACOPP-14; both reduced-intensity arms met non-inferiority against 8 cycles of escalated BEACOPP on a hazard-ratio margin of 1.51, though superiority for 6 cycles over 8 was only descriptive, not a protected comparison. Toxicity favoured 6 cycles: treatment-related death 0.8% against 2.1%, secondary leukaemia or myelodysplasia 0.3% against 2.7% (P=0.0001); 5-year overall survival was 95.3% against 91.9% (difference 3.3 points, 97.5% CI 0.2 to 6.5). Confining radiotherapy to PET-positive residua reduced its use to 11%, with a negative predictive value of 94.1% (Lancet 2012;379:1791-1799). <a class=\"trial-link\" href=\"/evidence/#t-ghsg-hd18\">GHSG HD18</a> tested 2 further questions from a shared 2-cycle escalated-BEACOPP start, guided by interim PET, and answered one of them. It randomised 1,964 patients with advanced-stage disease: those PET-2-positive (Deauville 3-5) to 8 cycles of escalated BEACOPP with or without rituximab, and those PET-2-negative (Deauville 1-2) to 4 cycles total or 6-8 cycles. Adding rituximab after a positive interim PET made no difference (5-year progression-free survival 88.1% against 89.7%, hazard ratio 1.25, 95% CI 0.69-2.26, far short of the 15-point gain the trial was powered to detect). After a negative interim PET, cutting to 4 cycles held tumour control against 6-8 cycles (92.2% against 90.8%, difference 1.4 points, 95% CI -2.7 to 5.4, clearing the -6-point non-inferiority margin) while reducing harm; no treatment-related death against 6 of 504, severe infection 8% against 15% (Lancet 2017;390:2790-2802). 4 cycles of escalated BEACOPP after a negative interim PET is therefore sufficient in this setting. <a class=\"trial-link\" href=\"/evidence/#t-echelon-1\">ECHELON-1</a> replaced bleomycin with brentuximab vedotin in the AVD backbone. It randomised 1,334 patients with untreated stage III-IV disease to 6 cycles of brentuximab vedotin, doxorubicin, vinblastine and dacarbazine, or standard ABVD; primary G-CSF prophylaxis was recommended by amendment partway through enrolment. The primary endpoint, modified progression-free survival, which counts an incomplete response plus subsequent therapy as an event, favoured brentuximab vedotin (2-year rate 82.1% against 77.2%, hazard ratio 0.77, 95% CI 0.60-0.98, P=0.04). Interstitial lung disease fell from 7% to 2%, while peripheral neuropathy rose from 43% to 67%, grade 3 or worse from 2% to 11%, and febrile neutropenia from 8% to 19%; 7 of the 9 on-treatment deaths were neutropenia-associated, almost all occurring before G-CSF prophylaxis became routine (N Engl J Med 2018;378:331-344). A later interim survival analysis at a median 73 months showed the benefit converting to survival: 6-year overall survival 93.9% against 89.4%, hazard ratio 0.59 (95% CI 0.40-0.88), P=0.009 (N Engl J Med 2022;387:310-320). <a class=\"trial-link\" href=\"/evidence/#t-swog-s1826\">SWOG S1826</a> tested nivolumab in the same AVD backbone against brentuximab vedotin. It randomised 994 patients aged 12 or over with advanced-stage disease, 970 forming the efficacy cohort after 24 were found ineligible, to 6 cycles of nivolumab with AVD or brentuximab vedotin with AVD. The trial was reported early at a planned interim analysis (median follow-up 12.1 months): hazard ratio for progression or death 0.48 (99% CI 0.27-0.87), P=0.001, 1-year progression-free survival 94% against 86%. A later cut at a median 2.1 years gave 2-year progression-free survival 92% against 83% (hazard ratio 0.45, 95% CI 0.30-0.65). Overall survival remains immature and unproven, hazard ratio 0.39 (95% CI 0.15-1.03), an interval that crosses 1 (N Engl J Med 2024;391:1379-1389). In a planned subset of patients aged 60 or over, 3 of 50 died on nivolumab against 10 of 49 on brentuximab, with grade 3 or worse sepsis 6.1% against 21.3% (J Clin Oncol 2025;43:2968-2973); among 236 adolescents, 3-year progression-free survival was 93% against 82% (J Clin Oncol 2026;44:449-454). <a class=\"trial-link\" href=\"/evidence/#t-ghsg-hd21\">GHSG HD21</a> tested a further-modified brentuximab-containing regimen, BrECADD, against escalated BEACOPP, with treatment length set by interim PET (4 cycles if negative, 6 if positive) in both arms. It randomised 1,500 patients aged 18-60 with advanced-stage disease, 1,482 analysed, and met both co-primary endpoints: less treatment-related morbidity (42% against 59%, relative risk 0.72, 95% CI 0.65-0.80, P&lt;0.0001) and superior progression-free survival (4-year rate 94.3% against 90.9%, hazard ratio 0.66, 95% CI 0.45-0.97, P=0.035), with 4-year overall survival 98.6% against 98.2% and no treatment-related death on BrECADD against 3 on escalated BEACOPP. The toxicity advantage is haematological: grade 3 or worse anaemia 30% against 59% and thrombocytopenia 55% against 72%, while organ toxicity did not differ. Gonadal recovery was markedly better, 95.3% against 72.5% in women and 86.0% against 39.2% in men (Lancet 2024;404:341-352).</p>\n<p><a class=\"trial-link\" href=\"/evidence/#t-rathl\">RATHL</a> tested response-adapted de-escalation and escalation together from an ABVD start. It randomised 935 of 1,214 registered patients with advanced disease who were PET-negative after 2 cycles of ABVD (Deauville 1-3) to continue ABVD for cycles 3-6 or omit bleomycin (AVD) for those cycles; of the 182 PET-positive patients, 172 escalated to BEACOPP-14 or escalated BEACOPP without randomisation. Omitting bleomycin fell just short of the prespecified non-inferiority margin: 3-year progression-free survival 85.7% continuing ABVD against 84.4% with AVD, difference 1.6 points (95% CI -3.2 to 5.3, upper bound above the 5-point margin), hazard ratio 1.13 (95% CI 0.81-1.57); 3-year overall survival was 97.2% and 97.6%. Pulmonary harm was lower with AVD: grade 3 or 4 pulmonary events 1% against 3%, and carbon monoxide diffusing capacity fell less. Escalating the interim-PET-positive patients to BEACOPP gave 3-year progression-free survival of 67.5% and overall survival of 87.8% (N Engl J Med 2016;374:2419-2429). With follow-up extended to a median 7.3 years, the non-inferiority interval for AVD narrowed to fall within the margin. Where escalation from ABVD to BEACOPP after a positive interim PET has been tested without a randomised ABVD comparator, results are numerically similar across trials:</p>\n<div class=\"tblwrap\" role=\"region\" aria-label=\"Scrollable table\" tabindex=\"0\"><table><thead><tr><th scope=\"col\">Trial</th><th scope=\"col\">Escalation regimen</th><th scope=\"col\">Consolidative RT</th><th scope=\"col\">PET-2-positive definition</th><th scope=\"col\">Overall survival</th><th scope=\"col\">Progression-free survival</th></tr></thead><tbody><tr><td>RATHL</td><td>BEACOPP-14 or escalated BEACOPP, per treating centre</td><td>Not recommended</td><td>Deauville 4-5</td><td>7-year 83.2%</td><td>7-year 65.9%</td></tr><tr><td>SWOG 0816</td><td>Escalated BEACOPP</td><td>None</td><td>Deauville 4-5</td><td>5-year 86%</td><td>5-year 66%</td></tr><tr><td>GITIL HD0607</td><td>Escalated BEACOPP, with or without rituximab (randomised)</td><td>—</td><td>Deauville 4-5</td><td>3-year 89% vs 90% (not significant)</td><td>3-year 63% vs 57% (not significant)</td></tr></tbody></table></div>\n<p>The 6-year overall survival and progression-free survival in ECHELON-1&#x27;s PET-2-positive patients, 95% and 61%, are numerically superior to the 7-year figures on RATHL&#x27;s escalation strategy above, though the comparison is across trials rather than within one. GITIL HD0607 did not show an improvement in 6-year progression-free survival with consolidative radiotherapy among patients with a complete metabolic response on both interim and end-of-treatment PET. The trial randomised 296 patients with advanced-stage disease and a large nodal mass of 5 cm or more at baseline, PET-negative after both cycle 2 and the end of ABVD, to consolidative radiotherapy or no further treatment; 6-year progression-free survival was 91% against 95% for 5-7 cm (P=0.62), 98% against 90% for 8-10 cm (P=0.24), and 89% against 86% above 10 cm (P=0.53) (J Clin Oncol 2020). Trial evidence relevant to regimen selection:</p>\n<ul><li class=\"evidence-prose\">ECHELON-1 showed progression-free and overall-survival benefit with brentuximab vedotin plus AVD over ABVD; patients with pre-existing sensory or motor neuropathy were excluded.</li><li class=\"evidence-prose\"><span class=\"evidence-lead\">S1826 showed a progression-free-survival benefit with nivolumab plus AVD over brentuximab vedotin plus AVD; overall survival remains immature and unproven.</span><span class=\"evidence-detail\">Active autoimmune disease was an exclusion criterion, not an absolute contraindication established by the trial.</span></li><li class=\"evidence-prose\">RATHL studied bleomycin omission after a negative interim PET; escalation of PET-positive patients had no randomised ABVD comparator.</li><li class=\"evidence-prose\">HD21 showed better progression-free survival and less treatment-related morbidity with PET-adapted BrECADD than with PET-adapted escalated BEACOPP.</li><li class=\"evidence-prose\">HD0607 did not show a progression-free-survival improvement from consolidative radiotherapy after negative interim and end-of-treatment PET scans.</li></ul>\n<h2 id=\"s-relapsed-and-refractory-disease\">Relapsed and refractory disease</h2>\n<p>Relapse is recurrence after a previously achieved complete response; refractory disease is failure to achieve an initial complete or partial response. The approach is to confirm the diagnosis by biopsy, restage the disease, then give salvage chemotherapy, with or without radiotherapy, followed by autologous haematopoietic cell transplantation. Salvage chemotherapy options include ICE (ifosfamide, carboplatin, etoposide), GVD (gemcitabine, vinorelbine, liposomal doxorubicin), GDP (gemcitabine, dexamethasone, cisplatin) and DHAP (dexamethasone, cytarabine, cisplatin). <a class=\"trial-link\" href=\"/evidence/#t-ghsg-ebmt-hd-r1\">GHSG/EBMT HD-R1</a> established high-dose chemotherapy with autologous transplant as standard salvage in chemosensitive relapse. It randomised patients with Hodgkin lymphoma relapsed after chemotherapy for advanced disease, aged 16-60, to 2 further cycles of Dexa-BEAM (4 cycles total) or 2 cycles of Dexa-BEAM followed by high-dose BEAM with autologous stem-cell transplant; of 161 enrolled, results apply to the 117 who proved chemosensitive after 2 induction cycles and proceeded to the assigned arms. Transplant improved disease control without a shown survival benefit: 3-year freedom from treatment failure 55% against 34% with continued Dexa-BEAM (P=0.019), while 3-year overall survival did not differ (71% against 65%, P=0.331), in a trial stopped early for slow accrual at 117 of a planned 150 chemosensitive patients. The advantage held in early first relapse (41% against 12%) and late first relapse (75% against 44%), but not in multiple relapse (34% against 44%). Most toxic deaths fell on the shared induction: the 2 Dexa-BEAM cycles every patient received caused 8 treatment-related deaths. After that, 5 of 56 (9%) died early on further Dexa-BEAM against 1 of 61 (2%) after transplant (Lancet 2002;359:2065-2071). <a class=\"trial-link\" href=\"/evidence/#t-brentuximab-vedotin-pivotal\">Brentuximab vedotin (pivotal)</a> established the drug&#x27;s activity after transplant has failed. In a single-arm phase II study of 102 patients with CD30-positive relapsed or refractory disease after high-dose chemotherapy and autologous transplant, median 3.5 prior regimens, brentuximab vedotin 1.8 mg/kg every 3 weeks gave an objective response rate of 75% (95% CI 64.9-82.6) on independent review, with a complete response in 34%. Median progression-free survival was 5.6 months overall but 21.7 months in complete remitters, whose median response duration reached 20.5 months; median overall survival was 22.4 months. Peripheral sensory neuropathy dominated toxicity: 42% any grade, 8% grade 3, none grade 4, cumulative and dose-related; it resolved or improved in 80% (J Clin Oncol 2012;30:2183-2189). <a class=\"trial-link\" href=\"/evidence/#t-aethera\">AETHERA</a> tested brentuximab vedotin as consolidation after transplant, in patients at high risk of progression. It randomised 329 patients 30-45 days after autologous transplant for relapsed or primary refractory disease, with at least one risk factor for post-transplant progression, to 16 cycles of brentuximab vedotin or placebo. Consolidation delayed progression without a shown survival benefit: median progression-free survival 42.9 against 24.1 months on independent review (hazard ratio 0.57, 95% CI 0.40-0.81, P=0.0013), 2-year rate 63% against 51%. Overall survival did not differ at the prespecified interim analysis (hazard ratio 1.15, 95% CI 0.67-1.97, P=0.6204), confounded by crossover: 85% of the placebo group received brentuximab vedotin after progression against 18% of the treated group. Peripheral neuropathy occurred in 67% (13% grade 3, none grade 4), resolving or improving in 85% (Lancet 2015;385:1853-1862). <a class=\"trial-link\" href=\"/evidence/#t-checkmate-205\">CheckMate 205</a> established nivolumab&#x27;s activity after both transplant and brentuximab vedotin have failed. In a single-arm cohort of 80 patients progressing after autologous transplant then brentuximab vedotin given in that order, nivolumab 3 mg/kg every 2 weeks gave an objective response rate of 66.3% (95% CI 54.8-76.4) on independent review, with a complete response in 9% and partial response in 58%; investigator scoring gave a higher rate (72.5% objective response, 28% complete response), and central review downgraded 13 of 19 investigator-assessed complete responses. Median response duration was 7.8 months and median progression-free survival 10.0 months, with 6-month overall survival of 98.7% (Lancet Oncol 2016;17:1283-1294). <a class=\"trial-link\" href=\"/evidence/#t-keynote-204\">KEYNOTE-204</a> compared pembrolizumab directly with brentuximab vedotin in relapsed or refractory disease, second line or later. It randomised 304 patients (either post-autologous-transplant or judged transplant-ineligible) to pembrolizumab 200 mg every 3 weeks or brentuximab vedotin 1.8 mg/kg every 3 weeks, each for up to 35 cycles. Pembrolizumab improved progression-free survival on central review (median 13.2 against 8.3 months, hazard ratio 0.65, 95% CI 0.48-0.88, P=0.0027), with objective response 65.6% against 54.2%. Overall survival, a co-primary endpoint, was not analysed at this interim cut. Only 37% of patients had had a prior autologous transplant; the progression-free survival advantage was clearest in those never transplanted (hazard ratio 0.61, 95% CI 0.42-0.89) and did not separate in the previously transplanted (hazard ratio 0.72, 95% CI 0.42-1.23), with no interaction test reported. The toxicities differ in kind: any-grade immune-mediated events 33% against 7%, including pneumonitis 11% against 3%; brentuximab vedotin gave treatment-related peripheral neuropathy in 15% grade 1-2 and 3% grade 3 (Lancet Oncol 2021;22:512-524).</p>\n<h2 id=\"s-hodgkin-lymphoma-in-pregnancy\">Hodgkin lymphoma in pregnancy</h2>\n<p>Hodgkin lymphoma diagnosed during pregnancy is a high-risk pregnancy requiring a multidisciplinary approach involving maternal-fetal medicine, obstetrics or gynaecology, and pharmacy, to protect both maternal and fetal wellbeing. Pre-treatment imaging uses MRI of the chest, abdomen and pelvis rather than PET-CT, to avoid the teratogenic and growth-retarding effects of ionising radiation on the fetus. Treatment options depend on trimester:</p>\n<ul><li>First trimester: elective termination is an option, because embryogenesis in the first trimester is particularly vulnerable to the effects of chemotherapy and radiation.</li><li>Second trimester: ABVD may be given after the first trimester. Pregnancy experience with brentuximab vedotin and nivolumab remains limited.</li><li>Third trimester: delivery is planned as close to full term as possible, and chemotherapy is withheld within 3 weeks of delivery to avoid cytopenias complicating the delivery.</li></ul>\n<h2 id=\"s-references\">References</h2>\n<ol class=\"refs\">\n<li id=\"ref-lymphoma-hodgkin-lymphoma-t-lugano-classification-cheson-et-al\"><a class=\"trial-link\" href=\"/evidence/#t-lugano-classification-cheson-et-al\">Lugano Classification (Cheson et al.)</a>. <a href=\"https://drive.google.com/file/d/1I3r0lIc2JGmEjbsCRgiyEAUK9YhoO8Uy/preview\">J Clin Oncol 2014;32:3059-3067</a></li>\n<li id=\"ref-lymphoma-hodgkin-lymphoma-t-ghsg-hd10\"><a class=\"trial-link\" href=\"/evidence/#t-ghsg-hd10\">GHSG HD10</a>. <a href=\"https://drive.google.com/file/d/1TyJJpDp5otbXrt-2RZU6f77YmAhLED9I/preview\">N Engl J Med 2010;363:640-652</a>; <a href=\"https://drive.google.com/file/d/1IaW1NnRE7S7zlQVvhasMqWIWhC7WveOh/preview\">J Clin Oncol 2017;35:1999-2007</a>; <a href=\"https://drive.google.com/file/d/1reOYuWOR_Cnhvru8VZc2dopYyJ1DiMqg/preview\">J Clin Oncol 2017;35:1444-1450</a></li>\n<li id=\"ref-lymphoma-hodgkin-lymphoma-t-ghsg-hd13\"><a class=\"trial-link\" href=\"/evidence/#t-ghsg-hd13\">GHSG HD13</a>. <a href=\"https://drive.google.com/file/d/16XtEuf4OdfDAqo4KhJF6gQyqYa4E1lSJ/preview\">Lancet 2015;385:1418-1427</a></li>\n<li id=\"ref-lymphoma-hodgkin-lymphoma-t-ghsg-hd16\"><a class=\"trial-link\" href=\"/evidence/#t-ghsg-hd16\">GHSG HD16</a>. <a href=\"https://drive.google.com/file/d/1oO-Z_bQY7DyBG1akatjwbF4BdNWc7AsG/preview\">J Clin Oncol 2019;37:2835-2845</a></li>\n<li id=\"ref-lymphoma-hodgkin-lymphoma-t-ghsg-hd7\"><a class=\"trial-link\" href=\"/evidence/#t-ghsg-hd7\">GHSG HD7</a>. <a href=\"https://drive.google.com/file/d/1as8B06fbc6DQry56BYJ3MTHdv7SwA70k/preview\">J Clin Oncol 2007;25:3495-3502</a>; <a href=\"https://drive.google.com/file/d/1IaW1NnRE7S7zlQVvhasMqWIWhC7WveOh/preview\">J Clin Oncol 2017;35:1999-2007</a>; <a href=\"https://drive.google.com/file/d/1reOYuWOR_Cnhvru8VZc2dopYyJ1DiMqg/preview\">J Clin Oncol 2017;35:1444-1450</a></li>\n<li id=\"ref-lymphoma-hodgkin-lymphoma-t-ghsg-hd8\"><a class=\"trial-link\" href=\"/evidence/#t-ghsg-hd8\">GHSG HD8</a>. <a href=\"https://drive.google.com/file/d/10wyPDPGJul1NTgeT7idrXOYsA1LNrTEC/preview\">J Clin Oncol 2003;21:3601-3608</a>; <a href=\"https://drive.google.com/file/d/1IaW1NnRE7S7zlQVvhasMqWIWhC7WveOh/preview\">J Clin Oncol 2017;35:1999-2007</a>; <a href=\"https://drive.google.com/file/d/1reOYuWOR_Cnhvru8VZc2dopYyJ1DiMqg/preview\">J Clin Oncol 2017;35:1444-1450</a></li>\n<li id=\"ref-lymphoma-hodgkin-lymphoma-t-ghsg-hd11\"><a class=\"trial-link\" href=\"/evidence/#t-ghsg-hd11\">GHSG HD11</a>. <a href=\"https://drive.google.com/file/d/1c1ns_0bUVAQIyKgvRFyAzIgBrvlegxHF/preview\">J Clin Oncol 2010;28:4199-4206</a>; <a href=\"https://drive.google.com/file/d/1IaW1NnRE7S7zlQVvhasMqWIWhC7WveOh/preview\">J Clin Oncol 2017;35:1999-2007</a>; <a href=\"https://drive.google.com/file/d/1reOYuWOR_Cnhvru8VZc2dopYyJ1DiMqg/preview\">J Clin Oncol 2017;35:1444-1450</a></li>\n<li id=\"ref-lymphoma-hodgkin-lymphoma-t-ghsg-hd14\"><a class=\"trial-link\" href=\"/evidence/#t-ghsg-hd14\">GHSG HD14</a>. <a href=\"https://drive.google.com/file/d/1gBCq2dgmkKrwn0yWOFX8PBDU6r4oQMZo/preview\">J Clin Oncol 2012;30:907-913</a></li>\n<li id=\"ref-lymphoma-hodgkin-lymphoma-t-ghsg-hd17\"><a class=\"trial-link\" href=\"/evidence/#t-ghsg-hd17\">GHSG HD17</a>. <a href=\"https://drive.google.com/file/d/1wrjg6i5CUY73KjagwH9SpXKragLMYepI/preview\">Lancet Oncol 2021;22:223-234</a></li>\n<li id=\"ref-lymphoma-hodgkin-lymphoma-t-uk-rapid\"><a class=\"trial-link\" href=\"/evidence/#t-uk-rapid\">UK RAPID</a>. <a href=\"https://drive.google.com/file/d/1Kb9FwK2eWGhoGvx72KJrmR157nrLu2XT/preview\">N Engl J Med 2015;372:1598-1607</a></li>\n<li id=\"ref-lymphoma-hodgkin-lymphoma-t-eortc-lysa-fil-h10\"><a class=\"trial-link\" href=\"/evidence/#t-eortc-lysa-fil-h10\">EORTC/LYSA/FIL H10</a>. <a href=\"https://drive.google.com/file/d/1pb8rK01SFe0PQbpSDbA22WYrusqvajyB/preview\">J Clin Oncol 2017;35:1786-1794</a></li>\n<li id=\"ref-lymphoma-hodgkin-lymphoma-t-ghsg-hd9\"><a class=\"trial-link\" href=\"/evidence/#t-ghsg-hd9\">GHSG HD9</a>. <a href=\"https://drive.google.com/file/d/1F2rZ5wsZmYTZtK5xWHJ1h9lWlOp8lSTx/preview\">N Engl J Med 2003;348:2386-2395</a>; <a href=\"https://drive.google.com/file/d/1_1oeAJ048icSVh9vLaMf8efhBJ04T0g5/preview\">J Clin Oncol 2009;27:4548-4554</a>; <a href=\"https://drive.google.com/file/d/1reOYuWOR_Cnhvru8VZc2dopYyJ1DiMqg/preview\">J Clin Oncol 2017;35:1444-1450</a></li>\n<li id=\"ref-lymphoma-hodgkin-lymphoma-t-ghsg-hd15\"><a class=\"trial-link\" href=\"/evidence/#t-ghsg-hd15\">GHSG HD15</a>. <a href=\"https://drive.google.com/file/d/1sIPzbSKVcJXDu9ny-7QUynesINqwui-n/preview\">Lancet 2012;379:1791-1799</a></li>\n<li id=\"ref-lymphoma-hodgkin-lymphoma-t-ghsg-hd18\"><a class=\"trial-link\" href=\"/evidence/#t-ghsg-hd18\">GHSG HD18</a>. <a href=\"https://drive.google.com/file/d/1LEETGaKsdH0SekHxdCxu3OpU9v-_g8h0/preview\">Lancet 2017;390:2790-2802</a></li>\n<li id=\"ref-lymphoma-hodgkin-lymphoma-t-echelon-1\"><a class=\"trial-link\" href=\"/evidence/#t-echelon-1\">ECHELON-1</a>. <a href=\"https://drive.google.com/file/d/1yLWXo_ZpdGAAf_60WNvdPICKyWoyjUnJ/preview\">N Engl J Med 2018;378:331-344</a>; <a href=\"https://drive.google.com/file/d/1XTFglOwyFzNJrjJAURGT4ehD9ZbATvrS/preview\">N Engl J Med 2022;387:310-320</a></li>\n<li id=\"ref-lymphoma-hodgkin-lymphoma-t-swog-s1826\"><a class=\"trial-link\" href=\"/evidence/#t-swog-s1826\">SWOG S1826</a>. <a href=\"https://drive.google.com/file/d/1n2fPRjjIYa2KSIHmUiUSx11OSlVFhhHO/preview\">N Engl J Med 2024;391:1379-1389</a>; <a href=\"https://drive.google.com/file/d/179PXpLZHmSYG9FWtuu5NwJPljen9PYQb/preview\">J Clin Oncol 2025;43:2968-2973</a>; <a href=\"https://drive.google.com/file/d/1GgbWXlo--5KfP-czWIW4atqpxjDJTBJ2/preview\">J Clin Oncol 2026;44:449-454</a></li>\n<li id=\"ref-lymphoma-hodgkin-lymphoma-t-ghsg-hd21\"><a class=\"trial-link\" href=\"/evidence/#t-ghsg-hd21\">GHSG HD21</a>. <a href=\"https://drive.google.com/file/d/18J8zFmcCuClm7H32GJNFyVbZBfcXiYly/preview\">Lancet 2024;404:341-352</a></li>\n<li id=\"ref-lymphoma-hodgkin-lymphoma-t-rathl\"><a class=\"trial-link\" href=\"/evidence/#t-rathl\">RATHL</a>. <a href=\"https://drive.google.com/file/d/15TIdpikZZIdhJiKZH_SP13seFG9qDqNz/preview\">N Engl J Med 2016;374:2419-2429</a></li>\n<li id=\"ref-lymphoma-hodgkin-lymphoma-t-ghsg-ebmt-hd-r1\"><a class=\"trial-link\" href=\"/evidence/#t-ghsg-ebmt-hd-r1\">GHSG/EBMT HD-R1</a>. <a href=\"https://drive.google.com/file/d/1SfKKqCsRbTWEqABjFNq_zzKw1qteEjKz/preview\">Lancet 2002;359:2065-2071</a></li>\n<li id=\"ref-lymphoma-hodgkin-lymphoma-t-brentuximab-vedotin-pivotal\"><a class=\"trial-link\" href=\"/evidence/#t-brentuximab-vedotin-pivotal\">Brentuximab vedotin (pivotal)</a>. <a href=\"https://drive.google.com/file/d/1MEqCetp6qmXNSk1MTX3EyK2_0yc_Rvhr/preview\">J Clin Oncol 2012;30:2183-2189</a></li>\n<li id=\"ref-lymphoma-hodgkin-lymphoma-t-aethera\"><a class=\"trial-link\" href=\"/evidence/#t-aethera\">AETHERA</a>. <a href=\"https://drive.google.com/file/d/1-OBMhwZZputDbCh-549GpSu5tMHxvS25/preview\">Lancet 2015;385:1853-1862</a></li>\n<li id=\"ref-lymphoma-hodgkin-lymphoma-t-checkmate-205\"><a class=\"trial-link\" href=\"/evidence/#t-checkmate-205\">CheckMate 205</a>. <a href=\"https://drive.google.com/file/d/1M7j-6UJ6ZDGoN_xEncFvellmufnrwTYv/preview\">Lancet Oncol 2016;17:1283-1294</a></li>\n<li id=\"ref-lymphoma-hodgkin-lymphoma-t-keynote-204\"><a class=\"trial-link\" href=\"/evidence/#t-keynote-204\">KEYNOTE-204</a>. <a href=\"https://drive.google.com/file/d/1llpjtNTnDBWLgNRi5PvQSYwO1yT81R52/preview\">Lancet Oncol 2021;22:512-524</a></li>\n</ol>", "_hay": "hodgkin lymphoma hodgkin-lymphoma lymphoma histopathology and classification epidemiology and presentation work-up staging and risk stratification early-stage favourable disease early-stage unfavourable disease advanced-stage disease relapsed and refractory disease hodgkin lymphoma in pregnancy references"}, {"id": "lymphoma-indolent-non-hodgkin-lymphomas", "slug": "indolent-non-hodgkin-lymphomas", "group": "Lymphoma", "title": "Indolent non-Hodgkin lymphomas", "updated": "", "sections": [{"id": "s-follicular-lymphoma-biology-and-classification", "h": "Follicular lymphoma: biology and classification", "depth": 2}, {"id": "s-clinical-features", "h": "Clinical features", "depth": 2}, {"id": "s-diagnosis-and-staging", "h": "Diagnosis and staging", "depth": 2}, {"id": "s-prognostication", "h": "Prognostication", "depth": 2}, {"id": "s-stage-i-ii-disease", "h": "Stage I–II disease", "depth": 2}, {"id": "s-advanced-stage-disease-with-low-tumour-burden", "h": "Advanced-stage disease with low tumour burden", "depth": 2}, {"id": "s-advanced-stage-disease-with-high-tumour-burden", "h": "Advanced-stage disease with high tumour burden", "depth": 2}, {"id": "s-rituximab-plus-chemotherapy", "h": "Rituximab plus chemotherapy", "depth": 3}, {"id": "s-bendamustine-rituximab", "h": "Bendamustine-rituximab", "depth": 3}, {"id": "s-rituximab-lenalidomide", "h": "Rituximab-lenalidomide", "depth": 3}, {"id": "s-antibody-choice-obinutuzumab", "h": "Antibody choice: obinutuzumab", "depth": 3}, {"id": "s-maintenance-after-frontline-therapy", "h": "Maintenance after frontline therapy", "depth": 2}, {"id": "s-relapsed-disease", "h": "Relapsed disease", "depth": 2}, {"id": "s-late-symptomatic-relapse", "h": "Late symptomatic relapse", "depth": 3}, {"id": "s-early-relapse", "h": "Early relapse", "depth": 3}, {"id": "s-targeted-oral-agents", "h": "Targeted oral agents", "depth": 3}, {"id": "s-car-t-cell-therapy", "h": "CAR T-cell therapy", "depth": 3}, {"id": "s-bispecific-antibodies", "h": "Bispecific antibodies", "depth": 3}, {"id": "s-marginal-zone-lymphoma", "h": "Marginal zone lymphoma", "depth": 2}, {"id": "s-gastric-malt-lymphoma", "h": "Gastric MALT lymphoma", "depth": 3}, {"id": "s-non-gastric-extranodal-disease", "h": "Non-gastric extranodal disease", "depth": 3}, {"id": "s-trial-evidence-specific-to-marginal-zone-lymphoma", "h": "Trial evidence specific to marginal zone lymphoma", "depth": 3}, {"id": "s-references", "h": "References", "depth": 2}], "html": "<h2 id=\"s-follicular-lymphoma-biology-and-classification\">Follicular lymphoma: biology and classification</h2>\n<p>Follicular lymphoma is the second most common non-Hodgkin lymphoma and the most common indolent subtype; median age at diagnosis is 65. It is the malignant counterpart of the germinal-centre B cell. 85% of cases carry t(14;18), which juxtaposes the <em>BCL2</em> gene with the regulatory elements of the immunoglobulin heavy-chain gene, causing overexpression of BCL2, an oncogene with anti-apoptotic function. Grading sets the treatment path:</p>\n<ul><li>Grade 1–3A is treated as indolent lymphoma.</li><li>Grade 3B is treated as high-grade lymphoma.</li></ul>\n<p>The WHO 5th edition names the same split: grade 1–3A is classic follicular lymphoma, and grade 3B is follicular large B-cell lymphoma.</p>\n<h2 id=\"s-clinical-features\">Clinical features</h2>\n<ul><li>Asymptomatic lymphadenopathy is the most common presentation.</li><li>20% present with B symptoms.</li><li>Bone marrow involvement is present in more than 70%.</li><li>Spontaneous regression of disease is seen in 20%.</li><li>The risk of histologic transformation is 2–3% a year.</li></ul>\n<h2 id=\"s-diagnosis-and-staging\">Diagnosis and staging</h2>\n<p>Diagnosis is by excisional tissue biopsy. Bone marrow aspirate and trephine biopsy are performed, because a high proportion of patients have marrow involvement. Staging follows the standard approach for non-Hodgkin lymphoma, with PET-CT recommended. Laboratory work-up includes beta-2 microglobulin, which enters the PRIMA-PI.</p>\n<h2 id=\"s-prognostication\">Prognostication</h2>\n<p>FLIPI counts five risk factors: age over 60, stage III or IV, haemoglobin below 12 g/dL, more than 4 nodal areas, and LDH above the upper limit of normal. Outcomes by risk group:</p>\n<ul><li>Low risk (0–1 factors): median PFS 84 months, 2-year OS 98%.</li><li>Intermediate risk (2 factors): median PFS 70 months, 2-year OS 94%.</li><li>High risk (3–5 factors): median PFS 42 months, 2-year OS 87%.</li></ul>\n<p>PRIMA-PI is built on beta-2 microglobulin and the presence or absence of bone marrow involvement.</p>\n<h2 id=\"s-stage-i-ii-disease\">Stage I–II disease</h2>\n<p>Involved-site radiotherapy is generally the treatment of choice: approximately half of patients with stage I disease are cured with radiotherapy alone, and 10-year overall survival is 60–80%. The dose is 24 Gy in 12 fractions. In the FoRT non-inferiority trial, the lower dose of 4 Gy in 2 fractions carried a higher local progression rate, though it was less toxic; it can still be used where side effects must be minimised, for example over the lacrimal or parotid gland. Higher doses of 40–45 Gy gave no benefit in response, progression-free or overall survival, with a trend to more toxicity (Lowry et al, phase 3). Watch-and-wait is suitable where significant morbidity is expected from radiotherapy because of tumour location, or where the patient declines it. In a retrospective series of 43 patients with stage I–II disease, 63% had not been treated at a median follow-up of 7.2 years (Advani et al, J Clin Oncol 2004). Rituximab monotherapy is an alternative. Adding systemic therapy to radiotherapy improves progression-free but not overall survival. <a class=\"trial-link\" href=\"/evidence/#t-trog-99-03\">TROG 99.03</a> randomised 150 patients with treatment-naive stage I–II grade 1–3a follicular lymphoma to involved-field radiotherapy 30–36 Gy alone or followed by six cycles of CVP, with rituximab joining the systemic arm from a 2006 amendment. Systemic therapy improved 10-year progression-free survival (59% vs 41%; HR 0.57, 95% CI 0.33 to 0.95) without an overall survival difference (10-year 95% vs 86%; HR 0.62) or a reduction in transformation (4 vs 10 per arm) (J Clin Oncol 2018;36:2918-2925). Only 2 of 148 irradiated patients had isolated in-field progression, so radiotherapy controlled local disease and the systemic gain lay in preventing distant relapse. The apparently larger effect in the rituximab era (HR 0.26, 95% CI 0.07 to 0.97) is post hoc and rests on few events.</p>\n<h2 id=\"s-advanced-stage-disease-with-low-tumour-burden\">Advanced-stage disease with low tumour burden</h2>\n<p>Tumour burden is determined by the GELF criteria.</p>\n<p>Watchful waiting remains a reasonable option for asymptomatic patients with low tumour burden: history, examination and laboratory review every 3 months for the first year, then every 3–6 months until progressive disease is noted. The alternative is single-agent rituximab, which delays progression and postpones cytotoxic chemotherapy without affecting overall survival, and imposes the risks of immunosuppression. In selected patients, induction rituximab followed by retreatment at relapse can be considered. Across its two protocol eras, <a class=\"trial-link\" href=\"/evidence/#t-ardeshna-ncri\">Ardeshna (NCRI)</a> randomised 463 patients with asymptomatic, low-tumour-burden stage II–IV grade 1–3a follicular lymphoma. The original three-arm cohort contained 252 patients; after the induction-only arm closed, the amended maintenance-versus-watch-and-wait analysis contained 379 patients (192 vs 187). Rituximab induction was 375 mg/m² weekly for 4 weeks, with maintenance every 2 months for 2 years. At 3 years, 88% on maintenance versus 46% on watch-and-wait had not started new therapy (HR 0.21, 95% CI 0.14 to 0.31). The quality-of-life co-primary endpoint was not met, though mental adjustment to cancer favoured rituximab (p=0.0004); overall survival showed no difference at 28 deaths. In the underpowered three-arm cohort, time to new treatment did not differ statistically between maintenance and induction alone (HR 0.75, 95% CI 0.41 to 1.34; p=0.33). In a post-hoc analysis, maintenance improved progression-free survival (HR 0.53, 95% CI 0.32 to 0.87; p=0.011) (Lancet Oncol 2014;15:424-435). At 15 years, median time to new treatment was not reached with maintenance versus 14.8 years with induction and 5.6 years with watch-and-wait, and 15-year overall survival was 73%, 66% and 68% (Lancet Haematol 2025). If rituximab is used, retreatment at progression matches maintenance. In RESORT, patients with low-tumour-burden stage III–IV grade 1–2 disease responding to induction rituximab (375 mg/m² weekly for 4 weeks) were randomised to retreatment at progression or maintenance every 13 weeks, each until treatment failure; median time to treatment failure (3.9 vs 4.3 years) and overall survival (5-year 94% in both arms) did not differ (J Clin Oncol 2014).</p>\n<h2 id=\"s-advanced-stage-disease-with-high-tumour-burden\">Advanced-stage disease with high tumour burden</h2>\n<p>Induction is chosen on the risk of aggressive biology:</p>\n<ul><li>Suspected histologic transformation, clinically aggressive disease, or grade 3B: R-CHOP, treating as for DLBCL.</li><li>Otherwise: rituximab with bendamustine or with lenalidomide, which preserves R-CHOP for use at histologic transformation.</li></ul>\n<p>Prophylactic antiviral medication is strongly recommended for up to 2 years beyond the last rituximab exposure.</p>\n<h3 id=\"s-rituximab-plus-chemotherapy\">Rituximab plus chemotherapy</h3>\n<p>Adding rituximab to chemotherapy improved response, progression-free and overall survival in the frontline trials. <a class=\"trial-link\" href=\"/evidence/#t-glsg-hiddemann\">GLSG (Hiddemann)</a> randomised 630 patients with previously untreated stage III–IV grade 1–2 follicular lymphoma requiring treatment. This early report analysed the 428 patients with completed initial-therapy documentation (223 R-CHOP, 205 CHOP). Rituximab cut treatment failure by 60% (28 of 223 vs 61 of 205 failures, p&lt;0.001), raised response (96% vs 90%), and gave fewer deaths within 3 years (6 vs 17, p=0.016), though at a median follow-up of 18 months these are early estimates (Blood 2005;106:3725-3732). R-CVP, the anthracycline-free option, is inferior to R-CHOP on progression-free survival with similar overall survival. <a class=\"trial-link\" href=\"/evidence/#t-foll05-fil\">FOLL05 (FIL)</a> compared R-CVP, R-CHOP and R-FM: 3-year time to treatment failure was 46%, 62% and 59%, R-CHOP and R-FM each superior to R-CVP (HR 0.62 and 0.63) with no difference between them, and 3-year overall survival was 95% for the whole series with no between-arm comparison made. R-FM carried the worst toxicity, including grade 3–4 neutropenia in 64% and 14 of the 23 second malignancies, so R-CHOP had the better risk-benefit balance and became the preferred chemotherapy backbone (J Clin Oncol 2013;31:1506-1513).</p>\n<h3 id=\"s-bendamustine-rituximab\">Bendamustine-rituximab</h3>\n<p>Bendamustine is an alkylating agent given at 90 mg/m² on days 1–2 every 28 days. It is myelosuppressive and causes prolonged lymphopenia, so extended varicella-zoster and Pneumocystis prophylaxis should be considered. <a class=\"trial-link\" href=\"/evidence/#t-stil-nhl1-rummel\">StiL NHL1 (Rummel)</a> randomised 549 patients with treatment-naive stage III–IV indolent lymphoma, including grade 1–2 follicular lymphoma, or mantle-cell lymphoma to up to six cycles of bendamustine-rituximab or R-CHOP, designed as a non-inferiority comparison. Bendamustine-rituximab more than doubled median progression-free survival (69.5 vs 31.2 months; HR 0.58, 95% CI 0.44 to 0.74, per protocol on 514 of 549) with no overall survival difference (43 vs 45 deaths), and was better tolerated: less grade 3–4 neutropenia (29% vs 69%) and, at any grade, no alopecia, fewer infectious episodes (37% vs 50%) and less paraesthesia (7% vs 29%), against more grade 3–4 lymphocytopenia (74% vs 43%) and more any-grade skin reactions (Lancet 2013;381:1203-1210). Ten-year overall survival was 70% versus 66%. <a class=\"trial-link\" href=\"/evidence/#t-bright\">BRIGHT</a> asked the same question against R-CHOP or R-CVP with complete response as the primary endpoint: bendamustine-rituximab was non-inferior for complete response by blinded independent review (31% vs 25%) with a higher overall response (97% vs 91%), but the gap did not clear the superiority test, non-inferiority was not reached within the indolent-NHL subgroup (CR-rate ratio 1.16, 95% CI 0.81 to 1.65), and progression-free and overall survival were immature at that cut (Blood 2014;123:2944-2952).</p>\n<h3 id=\"s-rituximab-lenalidomide\">Rituximab-lenalidomide</h3>\n<p>Lenalidomide is an immunomodulatory agent with a mechanism of action complementary to rituximab, given 3 weeks on, 1 week off. Its boxed warnings are embryo-fetal toxicity, haematological toxicity and thromboembolism; aspirin prophylaxis is used. <a class=\"trial-link\" href=\"/evidence/#t-relevance\">RELEVANCE</a> tested chemotherapy-free rituximab-lenalidomide for superiority against rituximab-chemotherapy in 1,030 untreated patients and met neither co-primary endpoint: confirmed or unconfirmed complete response at 120 weeks was 48% versus 53% (p=0.13) and the progression-free survival hazard ratio 1.10 (95% CI 0.85 to 1.43, p=0.48), with 3-year progression-free survival 77% versus 78% and 3-year overall survival 94% in both arms, immature (N Engl J Med 2018;379:934-947). Efficacy looks similar, but a missed superiority test is not demonstrated equivalence. The toxicities trade rather than rank: more grade 3–4 skin reactions (7% vs 1%) and any-grade tumour flare with lenalidomide, more grade 3–4 neutropenia (50% vs 32%) and any-grade febrile neutropenia (7% vs 2%) with chemotherapy. Among the 70 patients with stage I–II disease, confirmed or unconfirmed complete response at 120 weeks was 10 of 30 versus 30 of 40 in favour of chemotherapy; this was the trial&#x27;s only significant treatment-by-subgroup interaction and was prespecified exploratory and quantitative.</p>\n<h3 id=\"s-antibody-choice-obinutuzumab\">Antibody choice: obinutuzumab</h3>\n<p>Obinutuzumab is a glycoengineered type II anti-CD20 monoclonal antibody with lower complement-dependent cytotoxicity than rituximab but greater antibody-dependent cellular cytotoxicity and phagocytosis and greater direct B-cell killing. It is given at 1000 mg on days 1, 8 and 15 of cycle 1, then day 1 of subsequent cycles. <a class=\"trial-link\" href=\"/evidence/#t-gallium\">GALLIUM</a> randomised 1,202 patients with untreated advanced follicular lymphoma meeting GELF criteria to obinutuzumab or rituximab, each with chemotherapy followed by the same antibody as maintenance in responders. Obinutuzumab lengthened investigator-assessed progression-free survival (3-year 80.0% vs 73.3%; HR 0.66, 95% CI 0.51 to 0.85), an interim result at 245 of the 370 planned events; overall survival did not differ (3-year 94.0% vs 92.1%), response at the end of induction did not differ, and complete response was numerically lower with obinutuzumab (19.5% vs 23.8%) (N Engl J Med 2017;377:1331-1344). The cost is toxicity: grade 3–5 events 74.6% versus 67.8%, grade 3–5 infusion reactions 12.4% versus 6.7%, grade 3–5 infection 20.0% versus 15.6% and grade 3–5 neutropenia 45.9% versus 39.5%. At 7 years progression-free survival was 63% versus 56%, with similar overall survival.</p>\n<h2 id=\"s-maintenance-after-frontline-therapy\">Maintenance after frontline therapy</h2>\n<p>Rituximab maintenance every 2 months for 2 years improves progression-free survival after various induction regimens (median PFS 10.5 vs 4.1 years, p&lt;0.0001), with no impact on overall survival. <a class=\"trial-link\" href=\"/evidence/#t-prima\">PRIMA</a> randomised 1,019 patients with high-tumour-burden grade 1–3a follicular lymphoma who had responded to and tolerated frontline rituximab-chemotherapy; efficacy analyses used 1,018 patients after one patient died during randomisation and was excluded. Maintenance improved 3-year progression-free survival (74.9% vs 57.6%; HR 0.55, 95% CI 0.44 to 0.68) and raised complete or unconfirmed complete response at the end of maintenance (71.5% vs 52.2%), while overall survival did not differ (HR 0.87) (Lancet 2011;377:42-51). At 10 years, progression-free survival was 51.1% versus 35% (HR 0.61, p&lt;0.001) and overall survival 80% in both arms. The cost is more grade 3–4 adverse events (24% vs 17%), driven by higher rates of cytopenias and infections; grade 2–4 infections ran at 39% versus 24%, and one death from fulminant hepatitis B occurred in a patient without antiviral prophylaxis. Guideline positions:</p>\n<ul><li class=\"evidence-prose\">ESMO: rituximab maintenance every 2 months for 2 years is recommended after immunochemotherapy [I, B].</li><li class=\"evidence-prose\">BSH: for patients responding to therapy (PR or CR), consider maintenance with rituximab or obinutuzumab, whichever antibody was used in induction, for 2 years, after discussion of risks and benefits with the patient.</li></ul>\n<h2 id=\"s-relapsed-disease\">Relapsed disease</h2>\n<p>Re-biopsy at relapse to rule out histologic transformation. The timing of relapse directs the pathway:</p>\n<ul><li>Early relapse: within 24 months of initial immunochemotherapy, or within 12 months of single-agent rituximab.</li><li>Late relapse: after those intervals.</li></ul>\n<p>Asymptomatic patients can be managed with watch-and-wait, single-agent rituximab, or radiotherapy for localised disease.</p>\n<h3 id=\"s-late-symptomatic-relapse\">Late symptomatic relapse</h3>\n<p>The options are rituximab-lenalidomide; rituximab monotherapy, for patients unfit for combination therapy and those with low tumour burden; or immunochemotherapy with the alternative backbone, bendamustine after prior CHOP and CHOP after prior bendamustine. <a class=\"trial-link\" href=\"/evidence/#t-augment\">AUGMENT</a> randomised 358 patients with relapsed or refractory follicular or marginal-zone lymphoma, excluding rituximab-refractory disease, to lenalidomide-rituximab or placebo-rituximab. Lenalidomide nearly tripled median progression-free survival (39.4 vs 14.1 months by independent review; HR 0.46, 95% CI 0.34 to 0.62), with higher response (78% vs 53%); overall survival is immature (HR 0.61, 95% CI 0.33 to 1.13). The trade is toxicity, grade 3–4 events in 69% versus 32%, driven by neutropenia (50% vs 13%) (J Clin Oncol 2019;37:1188-1199). Maintenance also has evidence at relapse. <a class=\"trial-link\" href=\"/evidence/#t-eortc-20981-van-oers\">EORTC 20981 (van Oers)</a> randomised relapsed or resistant follicular lymphoma after up to 2 prior non-anthracycline regimens to CHOP or R-CHOP induction, then re-randomised the 334 responders to rituximab maintenance or observation. Maintenance improved median progression-free survival (51.5 vs 14.9 months; HR 0.40) and 3-year overall survival (85.1% vs 77.1%, p=0.011), at more grade 3–4 infection (9% vs 2.4%) (Blood 2006;108:3295-3301). Prior anthracycline, rituximab and transplantation were excluded, so the result does not extend directly to an anthracycline- or rituximab-exposed relapse. For rituximab-refractory disease, <a class=\"trial-link\" href=\"/evidence/#t-gadolin\">GADOLIN</a> randomised indolent NHL that had failed or progressed on or shortly after rituximab to obinutuzumab-bendamustine followed by obinutuzumab maintenance, or bendamustine alone. The primary endpoint was met at the interim analysis on independent review (median progression-free survival not reached vs 14.9 months; HR 0.55, 95% CI 0.40 to 0.74), and the updated analysis showed an overall survival benefit (HR 0.67, 95% CI 0.47 to 0.96) with median progression-free survival by investigator 25.8 versus 14.1 months. No progression-free survival benefit was shown in the 75 patients with non-follicular histology (HR 0.94, 95% CI 0.46 to 1.90), a cohort the authors call too small to establish a difference (Lancet Oncol 2016;17:1081-1093; J Clin Oncol 2018;36:2259-2266). Two newer combinations build on lenalidomide-rituximab. <a class=\"trial-link\" href=\"/evidence/#t-inmind\">inMIND</a> added the CD19 antibody tafasitamab: median progression-free survival 22.4 versus 13.9 months (HR 0.43, 95% CI 0.32 to 0.58), PET-complete response 49% versus 40% (p=0.029), and toxicity little different from lenalidomide-rituximab alone (grade 3–4 events 71% vs 69%); survival is immature (HR 0.59) (Lancet 2026;407:133-146). Point estimates favoured tafasitamab in both POD24 strata and both anti-CD20-refractoriness strata, with no formal treatment-by-subgroup interaction reported. <a class=\"trial-link\" href=\"/evidence/#t-epcore-fl-1\">EPCORE FL-1</a> added the bispecific epcoritamab and met both primary endpoints: response 95% versus 79% and progression-free survival HR 0.21 (95% CI 0.14 to 0.31; median not reached vs 11.7 months), with complete response 83% versus 50%, at interim follow-up of 14.8 months. Survival favoured the combination but did not clear its prespecified boundary (HR 0.38, nominal p=0.0039), so the testing sequence stopped there. Toxicity is substantially greater: grade 3 or higher events 90% versus 68%, grade 3–4 infection 33% versus 16%, and cytokine release syndrome in 35% versus under 1%, none above grade 2 (Lancet 2026;407:161-173).</p>\n<h3 id=\"s-early-relapse\">Early relapse</h3>\n<p>The options are rituximab- or obinutuzumab-lenalidomide, autologous stem-cell transplantation, or CAR T-cell therapy.</p>\n<h3 id=\"s-targeted-oral-agents\">Targeted oral agents</h3>\n<p><a class=\"trial-link\" href=\"/evidence/#t-idelalisib-study-101-09\">Idelalisib (Study 101-09)</a> is a single-arm phase 2 study of the PI3Kδ inhibitor idelalisib in 125 patients with indolent NHL refractory to both rituximab and an alkylating agent after at least 2 prior therapies. Response was 57% (95% CI 48 to 66) with complete response in 6%, median duration of response 12.5 months and median progression-free survival 11.0 months (N Engl J Med 2014;370:1008-1018). Grade 3 or higher diarrhoea or colitis occurred in 16%, beginning at a median of 6 months. Other grade 3 or higher toxicities included transaminitis in 13% (median onset 6.3 weeks, asymptomatic and reversible) and pneumonia in 7%; grade 3 or higher laboratory neutropenia occurred in 27%. Overall, 20% stopped idelalisib for toxicity. <a class=\"trial-link\" href=\"/evidence/#t-tazemetostat-e7438-g000-101\">Tazemetostat (E7438-G000-101)</a> tested the oral EZH2 inhibitor tazemetostat in relapsed or refractory follicular lymphoma after at least 2 prior therapies, in an EZH2-mutant and a wild-type cohort each measured against a fixed response benchmark rather than against each other. Response by independent review was 69% (95% CI 53 to 82) in the 45 patients with EZH2-mutant disease and 35% (95% CI 23 to 49) in the 54 with wild-type disease, with median progression-free survival 13.8 and 11.1 months. Grade 3 or higher treatment-related thrombocytopenia and neutropenia each occurred in 3%, and 8% stopped for toxicity. One patient developed myelodysplastic syndrome and one developed acute myeloid leukaemia on treatment (Lancet Oncol 2020;21:1433-1442).</p>\n<h3 id=\"s-car-t-cell-therapy\">CAR T-cell therapy</h3>\n<p>Three CD19-directed products carry single-arm phase 2 evidence in multiply relapsed disease. <a class=\"trial-link\" href=\"/evidence/#t-zuma-5-axi-cel\">ZUMA-5 (axi-cel)</a> treated relapsed or refractory indolent NHL after at least 2 prior lines with axicabtagene ciloleucel: response by independent review was 92% with complete response in 74%, and 94% with 79% in follicular lymphoma; 18-month progression-free survival was 64.8% and overall survival 87.4%, with median duration of response and progression-free survival not reached in follicular disease (Lancet Oncol 2022;23:91-103). Cytokine release syndrome affected 82% (7% grade 3 or higher) and neurologic events 59% (19% grade 3–4). Four patients (3%) died of adverse events; one CRS-associated multisystem-organ-failure death was judged treatment related. <a class=\"trial-link\" href=\"/evidence/#t-elara-tisa-cel\">ELARA (tisa-cel)</a> treated relapsed or refractory follicular lymphoma with tisagenlecleucel: complete response 69.1% (95% CI 58.8 to 78.3) by independent review, overall response 86.2%. At this prespecified interim analysis, median duration of response, progression-free and overall survival were all not reached and 12-month progression-free survival was 67%; complete response was 59.0% in patients who had progressed within 24 months of first-line treatment against 87.9% in those who had not. Cytokine release syndrome occurred in 48.5% with none grade 3 or worse; cytopenias dominate, grade 3 or higher in 69.1% within 8 weeks (Nat Med 2022;28:325-332). Seven patients died, including one death attributed to CRS; all occurred more than 30 days after infusion and none was assessed as treatment related. <a class=\"trial-link\" href=\"/evidence/#t-transcend-fl-liso-cel\">TRANSCEND FL (liso-cel)</a> treated relapsed or refractory follicular lymphoma with lisocabtagene maraleucel in separate cohorts: response 97% (95% CI 91.6 to 99.4) with complete response 94% in the third line or later, and 96% with every responder in complete response in the second-line high-risk cohort. Results are early: median duration of response, progression-free and overall survival were all unreached, with 90% of patients censored from the overall-survival analysis, which the authors name as their first limitation. Cytokine release syndrome occurred in 58% (1 patient grade 3, none higher) and neurological events in 15% (Nat Med 2024;30:2199-2207). Thirteen deaths occurred on study, and investigators attributed two to liso-cel: macrophage-activation syndrome/haemophagocytic lymphohistiocytosis and progressive multifocal leukoencephalopathy.</p>\n<h3 id=\"s-bispecific-antibodies\">Bispecific antibodies</h3>\n<p><a class=\"trial-link\" href=\"/evidence/#t-mosunetuzumab-go29781\">Mosunetuzumab (GO29781)</a> gave the CD20×CD3 bispecific mosunetuzumab intravenously for a fixed duration with cycle-1 step-up dosing: complete response 60.0% (95% CI 49.1 to 70.2) against a 14% historical benchmark, response 80.0%, median progression-free survival 17.9 months. Cytokine release syndrome affected 44%, nearly all grade 1–2 and mostly confined to cycle 1; it was graded on the ASTCT scale rather than the Lee 2014 criteria used in the CAR T-cell trials, so the rates are not directly comparable (Lancet Oncol 2022;23:1055-1065). <a class=\"trial-link\" href=\"/evidence/#t-epcore-nhl-1-epcoritamab\">EPCORE NHL-1 (epcoritamab)</a> gave subcutaneous epcoritamab after at least 2 prior lines: response 82.0% by independent review with complete response 62.5%. Response was 89% after two prior lines and 68% after four or more in prespecified exploratory subgroups. Cytokine release syndrome affected 66%, nearly all grade 1–2; a second cohort testing a modified priming schedule with a 3 mg intermediate dose, dexamethasone and hydration brought it to 49% with nothing above grade 2, and 54% of that cohort were not admitted for monitoring at the first full dose (Lancet Haematol 2024;11:e593-e605).</p>\n<h2 id=\"s-marginal-zone-lymphoma\">Marginal zone lymphoma</h2>\n<p>Marginal zone lymphoma is a clinically indolent B-cell non-Hodgkin lymphoma, commonly associated with certain infections and autoimmune conditions.</p>\n<h3 id=\"s-gastric-malt-lymphoma\">Gastric MALT lymphoma</h3>\n<p>In H. pylori-infected patients, eradication therapy alone may cure the lymphoma. Patients with the t(11;18) translocation have a lower chance of responding to eradication therapy. Response evaluation:</p>\n<ul><li class=\"evidence-prose\"><span class=\"evidence-lead\">Confirm eradication at least 4 weeks after completing eradication therapy.</span><span class=\"evidence-detail\">Up to 20% require a second regimen; give a maximum of 3 eradication courses before pursuing alternative treatment such as radiotherapy.</span></li><li class=\"evidence-prose\">Repeat endoscopy with biopsy every 3 months until histologic complete response, then every 6 months for 2 years.</li><li class=\"evidence-prose\">Stop endoscopic surveillance once 2 sequential endoscopies show no abnormalities.</li></ul>\n<p>In H. pylori-negative patients, a trial of eradication therapy is reasonable because testing for H. pylori is not 100% sensitive (ESMO); the alternatives are radiotherapy and rituximab.</p>\n<h3 id=\"s-non-gastric-extranodal-disease\">Non-gastric extranodal disease</h3>\n<p>Treatment principles follow those of follicular lymphoma: involved-site radiotherapy or observation for stage I–II, and rituximab with or without chemotherapy for stage III–IV.</p>\n<h3 id=\"s-trial-evidence-specific-to-marginal-zone-lymphoma\">Trial evidence specific to marginal zone lymphoma</h3>\n<p>Marginal zone lymphoma enters most indolent-lymphoma trials as a minority subgroup, and the follicular results do not carry over automatically. In <a class=\"trial-link\" href=\"/evidence/#t-stil-nhl1-rummel\">StiL NHL1 (Rummel)</a>, the post-hoc marginal-zone estimate was HR 0.70 (95% CI 0.34 to 1.43); the paper reported no significant treatment-by-histology interaction, so this does not establish a smaller effect than in follicular lymphoma. In <a class=\"trial-link\" href=\"/evidence/#t-augment\">AUGMENT</a>, the prespecified exploratory progression-free-survival estimates were HR 1.00 (95% CI 0.47 to 2.13) in 63 patients with marginal-zone lymphoma and HR 0.40 (95% CI 0.29 to 0.56) in follicular lymphoma; no treatment-by-histology interaction was reported. The authors call the marginal-zone result difficult to interpret because of small numbers and baseline imbalance, without excluding a lack of effect. In <a class=\"trial-link\" href=\"/evidence/#t-zuma-5-axi-cel\">ZUMA-5 (axi-cel)</a>, the 23 evaluable marginal-zone patients had a response rate of 83% and median progression-free survival of 12.0 months. In the 24 treated marginal-zone patients, cytokine release syndrome occurred in 100% and grade 3–4 neurologic events in 38%, numerically above 78% and 15% in the follicular cohort; these descriptive histology cohorts were not formally compared. GALLIUM and inMIND each randomised a separate marginal-zone cohort under the same protocol, not covered by the follicular analyses cited above.</p>\n<h2 id=\"s-references\">References</h2>\n<ol class=\"refs\">\n<li id=\"ref-lymphoma-indolent-non-hodgkin-lymphomas-t-trog-99-03\"><a class=\"trial-link\" href=\"/evidence/#t-trog-99-03\">TROG 99.03</a>. <a href=\"https://drive.google.com/file/d/1IcAvnT4IPSSt0wnRXR4h-KOli90sMRno/preview\">J Clin Oncol 2018;36:2918-2925</a></li>\n<li id=\"ref-lymphoma-indolent-non-hodgkin-lymphomas-t-ardeshna-ncri\"><a class=\"trial-link\" href=\"/evidence/#t-ardeshna-ncri\">Ardeshna (NCRI)</a>. <a href=\"https://drive.google.com/file/d/1xl5nxYpYlPoGFC7WKlhq8nEax1tjcy-O/preview\">Lancet Oncol 2014;15:424-435</a></li>\n<li id=\"ref-lymphoma-indolent-non-hodgkin-lymphomas-t-glsg-hiddemann\"><a class=\"trial-link\" href=\"/evidence/#t-glsg-hiddemann\">GLSG (Hiddemann)</a>. <a href=\"https://drive.google.com/file/d/1ezKD2P8ZlVoswA0W0BBuuCHYVgFITjDl/preview\">Blood 2005;106:3725-3732</a></li>\n<li id=\"ref-lymphoma-indolent-non-hodgkin-lymphomas-t-foll05-fil\"><a class=\"trial-link\" href=\"/evidence/#t-foll05-fil\">FOLL05 (FIL)</a>. <a href=\"https://drive.google.com/file/d/1ERQ8V0yL6jx_Q_xQUpvqByPKlDVyxYpM/preview\">J Clin Oncol 2013;31:1506-1513</a></li>\n<li id=\"ref-lymphoma-indolent-non-hodgkin-lymphomas-t-stil-nhl1-rummel\"><a class=\"trial-link\" href=\"/evidence/#t-stil-nhl1-rummel\">StiL NHL1 (Rummel)</a>. <a href=\"https://drive.google.com/file/d/1EbEi_11PEVw_uMb7GNI6qmRSpVA72hSu/preview\">Lancet 2013;381:1203-1210</a></li>\n<li id=\"ref-lymphoma-indolent-non-hodgkin-lymphomas-t-bright\"><a class=\"trial-link\" href=\"/evidence/#t-bright\">BRIGHT</a>. <a href=\"https://drive.google.com/file/d/1y7b12fTdM1z0KcIQno0TPWJi2DBnrpKC/preview\">Blood 2014;123:2944-2952</a></li>\n<li id=\"ref-lymphoma-indolent-non-hodgkin-lymphomas-t-relevance\"><a class=\"trial-link\" href=\"/evidence/#t-relevance\">RELEVANCE</a>. <a href=\"https://drive.google.com/file/d/12VDMtJlg4gddRyHU_QHQfmP3NI2e1IkO/preview\">N Engl J Med 2018;379:934-947</a></li>\n<li id=\"ref-lymphoma-indolent-non-hodgkin-lymphomas-t-gallium\"><a class=\"trial-link\" href=\"/evidence/#t-gallium\">GALLIUM</a>. <a href=\"https://drive.google.com/file/d/1kxy4NGtUEvxD3p-m68YzaSeg7l9HgOYw/preview\">N Engl J Med 2017;377:1331-1344</a></li>\n<li id=\"ref-lymphoma-indolent-non-hodgkin-lymphomas-t-prima\"><a class=\"trial-link\" href=\"/evidence/#t-prima\">PRIMA</a>. <a href=\"https://doi.org/10.1056/NEJMoa1910962\">N Engl J Med 2019;381:2391-2402</a></li>\n<li id=\"ref-lymphoma-indolent-non-hodgkin-lymphomas-t-augment\"><a class=\"trial-link\" href=\"/evidence/#t-augment\">AUGMENT</a>. <a href=\"https://drive.google.com/file/d/1HrdByfbDSWb_Z7eyc1Sbcl9hzs--1naf/preview\">J Clin Oncol 2019;37:1188-1199</a></li>\n<li id=\"ref-lymphoma-indolent-non-hodgkin-lymphomas-t-eortc-20981-van-oers\"><a class=\"trial-link\" href=\"/evidence/#t-eortc-20981-van-oers\">EORTC 20981 (van Oers)</a>. <a href=\"https://drive.google.com/file/d/1tb1oNVP_ZIe-aqy38ZbzKvMLc1Y2aMXy/preview\">Blood 2006;108:3295-3301</a></li>\n<li id=\"ref-lymphoma-indolent-non-hodgkin-lymphomas-t-gadolin\"><a class=\"trial-link\" href=\"/evidence/#t-gadolin\">GADOLIN</a>. <a href=\"https://drive.google.com/file/d/1_JLsTjHEYMZq-jKMN9-0HfnK352StG7o/preview\">Lancet Oncol 2016;17:1081-1093</a>; <a href=\"https://drive.google.com/file/d/1OWv8AeDPvSu5TctIdU9_ILiqGadsAHdB/preview\">J Clin Oncol 2018;36:2259-2266</a></li>\n<li id=\"ref-lymphoma-indolent-non-hodgkin-lymphomas-t-inmind\"><a class=\"trial-link\" href=\"/evidence/#t-inmind\">inMIND</a>. <a href=\"https://drive.google.com/file/d/1Fjfrg6BSyi9_o9zc1346HZb-x0AEGrSA/preview\">Lancet 2026;407:133-146</a></li>\n<li id=\"ref-lymphoma-indolent-non-hodgkin-lymphomas-t-epcore-fl-1\"><a class=\"trial-link\" href=\"/evidence/#t-epcore-fl-1\">EPCORE FL-1</a>. <a href=\"https://drive.google.com/file/d/1wJnANCCxsebF0t6q-Ut4xDyCMLj-lJZr/preview\">Lancet 2026;407:161-173</a></li>\n<li id=\"ref-lymphoma-indolent-non-hodgkin-lymphomas-t-idelalisib-study-101-09\"><a class=\"trial-link\" href=\"/evidence/#t-idelalisib-study-101-09\">Idelalisib (Study 101-09)</a>. <a href=\"https://drive.google.com/file/d/1KK0OYasIxjYHg7Rcz9ocTZjSroEKYrOb/preview\">N Engl J Med 2014;370:1008-1018</a></li>\n<li id=\"ref-lymphoma-indolent-non-hodgkin-lymphomas-t-tazemetostat-e7438-g000-101\"><a class=\"trial-link\" href=\"/evidence/#t-tazemetostat-e7438-g000-101\">Tazemetostat (E7438-G000-101)</a>. <a href=\"https://drive.google.com/file/d/1Za9VY4eID5ZfIlQRJ1Ob1TFjLAtfoIkR/preview\">Lancet Oncol 2020;21:1433-1442</a></li>\n<li id=\"ref-lymphoma-indolent-non-hodgkin-lymphomas-t-zuma-5-axi-cel\"><a class=\"trial-link\" href=\"/evidence/#t-zuma-5-axi-cel\">ZUMA-5 (axi-cel)</a>. <a href=\"https://drive.google.com/file/d/1MOo6Sg7C9ijngY7ktOKMIZWtqG67Xxxf/preview\">Lancet Oncol 2022;23:91-103</a></li>\n<li id=\"ref-lymphoma-indolent-non-hodgkin-lymphomas-t-elara-tisa-cel\"><a class=\"trial-link\" href=\"/evidence/#t-elara-tisa-cel\">ELARA (tisa-cel)</a>. <a href=\"https://drive.google.com/file/d/1X2BnNfrluImrtQ5GO2HOPKAXPGJnWekq/preview\">Nat Med 2022;28:325-332</a></li>\n<li id=\"ref-lymphoma-indolent-non-hodgkin-lymphomas-t-transcend-fl-liso-cel\"><a class=\"trial-link\" href=\"/evidence/#t-transcend-fl-liso-cel\">TRANSCEND FL (liso-cel)</a>. <a href=\"https://drive.google.com/file/d/15Jb_JS9-_ekQ9tHCHWZv4Ix_hY8aYR-r/preview\">Nat Med 2024;30:2199-2207</a></li>\n<li id=\"ref-lymphoma-indolent-non-hodgkin-lymphomas-t-mosunetuzumab-go29781\"><a class=\"trial-link\" href=\"/evidence/#t-mosunetuzumab-go29781\">Mosunetuzumab (GO29781)</a>. <a href=\"https://drive.google.com/file/d/1VVLtVvRWASCXcRUpFu7z2INMk7kpOrvT/preview\">Lancet Oncol 2022;23:1055-1065</a></li>\n<li id=\"ref-lymphoma-indolent-non-hodgkin-lymphomas-t-epcore-nhl-1-epcoritamab\"><a class=\"trial-link\" href=\"/evidence/#t-epcore-nhl-1-epcoritamab\">EPCORE NHL-1 (epcoritamab)</a>. <a href=\"https://drive.google.com/file/d/1fdM0sVXpgacxP6LYbkU4MHsjqyTeKXvp/preview\">Lancet Haematol 2024;11:e593-e605</a></li>\n</ol>", "_hay": "indolent non-hodgkin lymphomas indolent-non-hodgkin-lymphomas lymphoma follicular lymphoma: biology and classification clinical features diagnosis and staging prognostication stage i–ii disease advanced-stage disease with low tumour burden advanced-stage disease with high tumour burden rituximab plus chemotherapy bendamustine-rituximab rituximab-lenalidomide antibody choice: obinutuzumab maintenance after frontline therapy relapsed disease late symptomatic relapse early relapse targeted oral agents car t-cell therapy bispecific antibodies marginal zone lymphoma gastric malt lymphoma non-gastric extranodal disease trial evidence specific to marginal zone lymphoma references"}, {"id": "melanoma-melanoma", "slug": "melanoma", "group": "Melanoma", "title": "Melanoma", "updated": "", "sections": [{"id": "s-epidemiology", "h": "Epidemiology", "depth": 2}, {"id": "s-risk-factors", "h": "Risk factors", "depth": 2}, {"id": "s-pathology-and-molecular-classification", "h": "Pathology and molecular classification", "depth": 2}, {"id": "s-clinical-presentation-and-diagnosis", "h": "Clinical presentation and diagnosis", "depth": 2}, {"id": "s-staging-and-work-up", "h": "Staging and work-up", "depth": 2}, {"id": "s-sentinel-lymph-node-biopsy", "h": "Sentinel lymph node biopsy", "depth": 3}, {"id": "s-imaging-for-distant-metastases", "h": "Imaging for distant metastases", "depth": 3}, {"id": "s-management-of-resectable-disease", "h": "Management of resectable disease", "depth": 2}, {"id": "s-surgery-and-radiotherapy", "h": "Surgery and radiotherapy", "depth": 3}, {"id": "s-adjuvant-systemic-therapy-by-stage", "h": "Adjuvant systemic therapy by stage", "depth": 3}, {"id": "s-neoadjuvant-therapy", "h": "Neoadjuvant therapy", "depth": 3}, {"id": "s-management-of-advanced-disease", "h": "Management of advanced disease", "depth": 2}, {"id": "s-first-line-therapy-in-braf-wild-type-disease", "h": "First-line therapy in *BRAF* wild-type disease", "depth": 3}, {"id": "s-first-line-therapy-in-braf-v600-mutant-disease", "h": "First-line therapy in *BRAF* V600-mutant disease", "depth": 3}, {"id": "s-braf-and-mek-inhibition", "h": "BRAF and MEK inhibition", "depth": 3}, {"id": "s-therapy-after-anti-pd-1-failure", "h": "Therapy after anti–PD-1 failure", "depth": 2}, {"id": "s-uveal-and-mucosal-melanoma", "h": "Uveal and mucosal melanoma", "depth": 2}, {"id": "s-references", "h": "References", "depth": 2}], "html": "<h2 id=\"s-epidemiology\">Epidemiology</h2>\n<p>Cutaneous melanoma accounts for 1.7% of new cancer diagnoses worldwide (232,100 cases) but only 0.7% of cancer deaths, a gap attributable to screening, early detection and adequate surgery for early-stage disease. It is the fifth commonest cancer in the United States in both sexes, and most patients present with localised disease: 84% stage I–II, 8% regional stage III and 4% metastatic stage IV. Incidence in Singapore is low, at 0.5 cases per 100,000 persons. Because sun-driven cutaneous melanoma is uncommon in Asian populations, the clinicopathological spectrum shifts towards subtypes that are marginal in Caucasian series: acral melanoma (nail beds, palms, soles and hairless skin) accounts for approximately 35–40% and mucosal melanoma for approximately 15–20% of Asian melanomas. Both subtypes were sparsely represented in the registration trials, which limits how directly those data apply to a local practice.</p>\n<h2 id=\"s-risk-factors\">Risk factors</h2>\n<p>Phenotypic factors carry the strongest risk associations.</p>\n<ul><li>Atypical naevi carry the strongest single association (OR 17.4), defined clinically by asymmetry, irregular borders, multiple colours or diameter greater than 5 mm.</li><li>Increased total mole count, a tendency to sunburn, and red hair with blue eyes or Fitzpatrick skin type I complete the phenotype.</li></ul>\n<p>A personal history of melanoma raises risk substantially (OR 12.78), and a history of non-melanoma skin cancer raises it moderately (relative risk 4.28). Immunosuppression from solid organ transplantation, haematopoietic cell transplantation, or HIV infection is an independent risk factor. The environmental driver is ultraviolet exposure. Intermittent intense exposure produces truncal and extremity melanomas, whereas chronic cumulative exposure produces head, neck and arm melanomas. Tanning bed use and residence at latitudes nearer the equator increase risk. Familial melanoma has been linked to germline variants in <em>CDKN2A</em>, <em>MC1R</em> and <em>BAP1</em>; <em>BAP1</em> in particular should prompt consideration of the uveal melanoma and mesothelioma spectrum.</p>\n<h2 id=\"s-pathology-and-molecular-classification\">Pathology and molecular classification</h2>\n<p>Most melanomas begin with a radial growth phase, in which the tumour remains confined to the epidermis, sometimes for years, and is almost always cured by excision alone. Progression to a vertical growth phase, driven by stepwise accumulation of genetic abnormalities, converts the lesion into an expansile nodule that breaches the basement membrane and invades the dermis. That transition creates metastatic risk, and Breslow thickness measures it.</p>\n<p>Superficial spreading melanoma is the commonest subtype, at approximately 75% of all melanomas. It shows lateral growth before invasion, presents as a variably pigmented macule or plaque with an irregular border, and displays multiple shades of red, blue, black, grey and white. More than 60% are diagnosed as thin, highly curable tumours of 1 mm or less. Roughly 30% arise in association with a pre-existing naevus and the remaining 70% arise de novo.</p>\n<p>Nodular melanoma is the second commonest type, at 15–30%. It presents as a darkly pigmented, pedunculated or polypoid papule or nodule, and it defeats the ABCDE rule more often than any other subtype: colour is frequently uniform or amelanotic and pink, borders are symmetric, and the diameter is small. Most are thicker than 2 mm at diagnosis, because the lesion enters vertical growth early. Lentigo maligna melanoma arises in chronically sun-damaged skin in older patients, beginning as a tan or brown macule that enlarges over years. Darker asymmetric foci, colour variegation and raised areas within the precursor in situ lesion signify vertical growth.</p>\n<p>Acral lentiginous melanoma accounts for less than 5% of melanomas in Western series but a far larger share in Asian practice. It occurs on palmar, plantar and subungual surfaces, first appearing as dark brown to black irregularly pigmented macules or patches; raised areas, ulceration, bleeding or larger diameter signify deeper dermal invasion. Subungual melanoma may present as a mass beneath the nail plate with ulceration and nail plate destruction. Amelanotic, spitzoid and desmoplastic melanomas are uncommon subtypes, each with its own diagnostic pitfall. Histopathological diagnosis rests on cytological atypia (melanocytes larger than normal, with large hyperchromatic nuclei, irregular nuclear shape, polymorphism and prominent nucleoli) together with architectural disorder (asymmetry, poor circumscription, and melanocytic nests of varying size and shape). Immunohistochemistry supports lineage but not malignancy.</p>\n<ul><li>S-100 is highly sensitive and poorly specific.</li><li>MART-1/Melan-A is sensitive and specific for melanocytes but does not mark malignant transformation.</li><li>HMB-45 and tyrosinase are the other standard markers.</li></ul>\n<p>Molecular testing in advanced disease should cover <em>BRAF</em> V600, PD-L1, <em>RAS</em>, <em>KIT</em> and <em>NTRK</em>. <em>BRAF</em> V600 status is the only one that changes first-line drug selection; <em>KIT</em> is worth pursuing in acral and mucosal disease.</p>\n<h2 id=\"s-clinical-presentation-and-diagnosis\">Clinical presentation and diagnosis</h2>\n<p>Screen pigmented lesions using the ABCDE criteria:</p>\n<ul><li>Asymmetry, such that one half of a bisected lesion is not identical to the other.</li><li>Border irregularity.</li><li>Colour variegation across red, blue, black, grey or white.</li><li>Diameter of 6 mm or more.</li><li>Evolution in size, shape or colour, or the appearance of a new lesion.</li></ul>\n<p>Evolution detects the nodular and amelanotic lesions that the other four criteria miss. Diagnosis requires excisional or complete biopsy, by saucerisation or deep shave, punch biopsy for small-diameter lesions, or elliptical excision, taking a 1–3 mm margin of normal skin and extending deep enough to encompass the thickest portion of the lesion. A partial or superficial shave that transects the base forfeits accurate Breslow thickness and therefore accurate staging.</p>\n<h2 id=\"s-staging-and-work-up\">Staging and work-up</h2>\n<p>The T category is built on tumour thickness and ulceration, the latter defined as absence of an intact epithelium over the melanoma. Mitotic rate per mm² remains an important prognostic factor at a threshold of 1/mm², but it was a T-category criterion in AJCC 7 and was removed in AJCC 8. The N category distinguishes three forms of intralymphatic spread.</p>\n<ul><li class=\"evidence-prose\">In-transit metastases lie more than 2 cm from the primary but not beyond the nearest regional nodal basin.</li><li class=\"evidence-prose\">Satellites lie within 2 cm of the primary.</li><li class=\"evidence-prose\">Microsatellites are visible only microscopically, defined as tumour nests greater than 0.05 mm in diameter in the reticular dermis, panniculus or vessels beneath the principal invasive tumour, separated from it by at least 0.3 mm of normal tissue on the section in which the Breslow measurement was taken.</li></ul>\n<p>For M disease, serum LDH is an independent prognostic factor and a surrogate for overall tumour burden, annotated as (0) for non-elevated and (1) for elevated.</p>\n<div class=\"tblwrap\" role=\"region\" aria-label=\"Scrollable table\" tabindex=\"0\"><table><thead><tr><th scope=\"col\">Stage</th><th scope=\"col\">Definition</th><th scope=\"col\">Groupings</th></tr></thead><tbody><tr><td>I</td><td>Low-risk tumours, no regional or distant metastases</td><td>IA T1N0M0; IB T2aN0M0</td></tr><tr><td>II</td><td>Higher recurrence risk, no regional or distant metastases</td><td>IIA T2b/T3aN0M0; IIB T3b/T4aN0M0; IIC T4bN0M0</td></tr><tr><td>III</td><td>Any T, node-positive, M0</td><td></td></tr><tr><td>IV</td><td>Any T, any N, M1</td><td></td></tr></tbody></table></div>\n<p>Older age and male sex carry adverse prognostic weight independent of stage.</p>\n<h3 id=\"s-sentinel-lymph-node-biopsy\">Sentinel lymph node biopsy</h3>\n<p>Sentinel lymph node biopsy stages and prognosticates; it is not a therapeutic procedure. Its rationale is:</p>\n<ul><li>accurate staging;</li><li>prognostication;</li><li>regional disease control;</li><li>lower morbidity than completion dissection;</li><li>selection for adjuvant therapy.</li></ul>\n<p>Completion lymph node dissection after a positive sentinel node has no established survival role, and ultrasound surveillance is sufficient.</p>\n<div class=\"tblwrap\" role=\"region\" aria-label=\"Scrollable table\" tabindex=\"0\"><table><thead><tr><th scope=\"col\"></th><th scope=\"col\">MSLT-I (NEJM 2006, NEJM 2014)</th><th scope=\"col\">MSLT-II (NEJM 2017, JAMA Surg 2022)</th></tr></thead><tbody><tr><td>Question</td><td>Does sentinel lymph node biopsy improve outcomes versus nodal observation?</td><td>In sentinel-node-positive patients, does completion lymph node dissection improve outcomes versus ultrasound surveillance?</td></tr><tr><td>Design</td><td>Phase 3: sentinel node biopsy with immediate completion dissection if positive, versus observation with delayed lymphadenectomy at nodal relapse</td><td>Phase 3 in sentinel-node-positive patients: completion dissection versus nodal observation (clinical review and nodal ultrasound 4-monthly for 2 years, 6-monthly for 3 years, then annually)</td></tr><tr><td>Population</td><td>N = 2001; intermediate thickness 1.2–3.5 mm (1347), thin &lt;1.2 mm (340), thick &gt;3.5 mm (314)</td><td>N = 1939</td></tr><tr><td>Primary endpoint</td><td>Melanoma-specific survival; similar at 10 years between observation and biopsy (too few events in thin melanomas for conclusions)</td><td>Melanoma-specific survival; no difference between dissection and observation</td></tr><tr><td>Other findings</td><td>Biopsy improved 10-year disease-free survival. Node-positive patients treated early did better than those treated at palpable relapse. Sentinel node status was the strongest predictor of recurrence or melanoma death on multivariable analysis.</td><td>Dissection reduced regional nodal recurrence but not distant metastasis or overall survival. In the observation arm at 10 years (JAMA Surg 2022), 80% remained free of nodal recurrence; risk factors were age over 50, ulceration, thickness above 3.5 mm, non-axillary basin, and sentinel node tumour burden above 1 mm or area above 5%.</td></tr><tr><td>Morbidity</td><td>Minimal additional morbidity over observation</td><td>Dissection caused more complications, particularly lymphoedema (24% vs 6%, P&lt;0.001)</td></tr><tr><td>Practice impact</td><td>Established sentinel node biopsy as the standard staging and prognostic tool</td><td>Routine completion dissection after a positive sentinel node is unnecessary; ultrasound surveillance is safe and avoids morbidity</td></tr></tbody></table></div>\n<p>DeCOG-SLT reached the same conclusion in a German phase 3 trial of 483 patients with sentinel-node-positive extremity melanoma randomised to completion dissection or observation, with no difference in 5-year distant metastasis-free survival, recurrence-free survival or overall survival. Offer sentinel node biopsy according to the predicted probability of a positive node.</p>\n<ul><li class=\"evidence-prose\">Biopsy is recommended from T2a upwards, where that probability exceeds 10%, and for T1b disease (thickness 0.8–1 mm, or under 0.8 mm with ulceration), where it is 5–10%.</li><li class=\"evidence-prose\">For T1a disease, NCCN allows discussion where adverse features are present (age 42 years or younger, head and neck location, lymphovascular invasion, or mitotic index of 2/mm² or more), which predicts a 5–10% probability; ESMO frames the same discussion around 3 or more mitoses/mm², a positive deep margin, or a Breslow thickness that cannot be reliably determined (pTx).</li></ul>\n<p>The MSKCC and Melanoma Institute Australia nomograms calculate that probability. For T3b, T4a and T4b primaries where the patient already qualifies for adjuvant therapy on stage II criteria, omitting sentinel node biopsy can be discussed, but the staging and locoregional-control value should be weighed, particularly for a <em>BRAF</em>-mutant thick stage IIB or IIC primary that could be upstaged to stage III (ESMO). The biopsy should ideally be done in the same setting as wide local excision, since prior wide excision disrupts lymphatic drainage.</p>\n<h3 id=\"s-imaging-for-distant-metastases\">Imaging for distant metastases</h3>\n<p>Imaging directed at specific signs or symptoms is appropriate at any stage. For asymptomatic patients, NCCN recommends baseline imaging by stage.</p>\n<div class=\"tblwrap\" role=\"region\" aria-label=\"Scrollable table\" tabindex=\"0\"><table><thead><tr><th scope=\"col\">Stage</th><th scope=\"col\">Baseline imaging</th></tr></thead><tbody><tr><td>0, I, II</td><td>Not recommended unless needed for surgical planning, or before adjuvant therapy in stage IIB/IIC</td></tr><tr><td>IIIA (sentinel node positive)</td><td>Consider CT thorax/abdomen/pelvis for baseline staging or before adjuvant therapy; add CT neck for head and neck primaries</td></tr><tr><td>IIIB/C/D</td><td>CT thorax/abdomen/pelvis, plus neck for head and neck primaries; MRI brain for IIIC/D, which carry higher CNS risk</td></tr><tr><td>IV</td><td>CT thorax/abdomen/pelvis and MRI brain</td></tr></tbody></table></div>\n<p>Whole-body PET-CT is useful to exclude distant metastases in patients being considered for potentially curative resection. Its sensitivity is higher in stage IIIC or IV disease than in less advanced disease (100% versus 84%; Cochrane Database Syst Rev 2019;7:CD012806).</p>\n<h2 id=\"s-management-of-resectable-disease\">Management of resectable disease</h2>\n<h3 id=\"s-surgery-and-radiotherapy\">Surgery and radiotherapy</h3>\n<p>Definitive treatment is full-depth wide local excision with margins scaled to thickness:</p>\n<ul><li>0.5 cm for in situ melanoma;</li><li>1 cm for tumours of 2 mm or less;</li><li>2 cm for tumours thicker than 2 mm.</li></ul>\n<p>Adjuvant radiotherapy has a very limited role. In TROG 02.01, patients with node-positive melanoma after lymphadenectomy were randomised to adjuvant radiotherapy or observation; radiotherapy roughly halved the risk of in-field relapse but did not improve recurrence-free or overall survival. Definitive radiotherapy to the primary is reserved for patients in whom excision is not possible because of comorbidity, unacceptable surgical morbidity, or refusal of surgery. Palliative radiotherapy and palliative surgery remain appropriate for local control of symptomatic lesions.</p>\n<h3 id=\"s-adjuvant-systemic-therapy-by-stage\">Adjuvant systemic therapy by stage</h3>\n<p>Stage I to IIA disease, up to T3a (4 mm without ulceration), is managed by surgery and surveillance alone. Recurrence risk is low enough that surgery alone is curative in the great majority, and adjuvant therapy has no role in this group. Two trials have tested adjuvant anti–PD-1 in resected stage IIB and IIC disease.</p>\n<ul><li class=\"evidence-prose\">In <a class=\"trial-link\" href=\"/evidence/#t-keynote-716\">KEYNOTE-716</a>, adjuvant pembrolizumab for approximately 1 year improved recurrence-free survival versus placebo (HR 0.65) and distant metastasis-free survival (HR 0.64) in resected sentinel-node-negative stage IIB/IIC melanoma (Lancet 2022;399:1718-1729).</li><li cl
