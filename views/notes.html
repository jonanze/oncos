drive.google.com/file/d/1wdlRpILutosiQISm1qFYFl2WJnrI_YOh/preview\">N Engl J Med 2017;377:523-533</a>; <a href=\"https://drive.google.com/file/d/1XQNlLzOw2F-mRkZfl9pgPZ03YeNWQ0jN/preview\">Ann Oncol 2019;30:558-566</a>; <a href=\"https://pubmed.ncbi.nlm.nih.gov/34500047/\">Ann Oncol 2021;32:1582-1589</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-embraca\">EMBRACA</a>. <a href=\"https://drive.google.com/file/d/1OtEeEKNJqDeNrZX7wBtTWdp21qMQaRSS/preview\">N Engl J Med 2018;379:753-763</a>; <a href=\"https://drive.google.com/file/d/1PCU30caBSbtPHWT6OZhVrNXyHAHpNqcQ/preview\">Ann Oncol 2020;31:1526-1535</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-serena-6\">SERENA-6</a>. <a href=\"https://drive.google.com/file/d/11dZuHYaPKW0w4i3SodVtE5-eZsnI-j64/preview\">N Engl J Med 2025;393:569-580</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-tropics-02\">TROPiCS-02</a>. <a href=\"https://drive.google.com/file/d/1YkOZXawBOBRvKAi5kKdqgGPHPWKKh2p1/preview\">J Clin Oncol 2022;40:3365-3376</a>; <a href=\"https://drive.google.com/file/d/1xX3dNk4C9WrSxft2158p4PwjF8SRHnLc/preview\">Lancet 2023;402:1423-1433</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-tropion-breast01\">TROPION-Breast01</a>. <a href=\"https://drive.google.com/file/d/11am4f_UxcZnmqF7VBmi8imy9uDSLCq8P/preview\">J Clin Oncol 2025;43:285-296</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-h0648g-pivotal-trastuzumab\">H0648g (pivotal trastuzumab)</a>. <a href=\"https://drive.google.com/file/d/1CNniNTfjj2EUilEjIzv-iQcRKSk9iQ0N/preview\">N Engl J Med 2001;344:783-792</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-cleopatra\">CLEOPATRA</a>. <a href=\"https://drive.google.com/file/d/1AyjgRVvoS0vRHp8QwuHDHvcwV1BVNxwe/preview\">N Engl J Med 2012;366:109-119</a>; <a href=\"https://drive.google.com/file/d/1Skw0EeikrZYMUmwtT7DiFvjAR7k-8hkg/preview\">Lancet Oncol 2013;14:461-471</a>; <a href=\"https://drive.google.com/file/d/1xEPtgrhEzpy-CsqBNqXqApbASt5g3zeS/preview\">N Engl J Med 2015;372:724-734</a>; <a href=\"https://drive.google.com/file/d/1wdriWGhYnYFw0UtyrZ5iUIa2iJDSWtva/preview\">Lancet Oncol 2020;21:519-530</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-peruse\">PERUSE</a>. <a href=\"https://drive.google.com/file/d/1wLZNGzNfhuy1r8jQaKMlKjVUOdqlORD8/preview\">Ann Oncol 2019;30:766-773</a>; <a href=\"https://drive.google.com/file/d/1ZFU5vT7kMXarBGD8BjNXwcSg7-5y1nVc/preview\">Ann Oncol 2021;32:1245-1255</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-destiny-breast09\">DESTINY-Breast09</a>. <a href=\"https://drive.google.com/file/d/10KibuTAgKKvxYQsvI_ChtrVDt1EP1mHD/preview\">N Engl J Med 2026;394:551-562</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-patina\">PATINA</a>. <a href=\"https://drive.google.com/file/d/16r3NUrP-z8m_2eIPkhGUTq6stRQzvTsX/preview\">N Engl J Med 2026;394:451-462</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-her2climb-05\">HER2CLIMB-05</a>. <a href=\"https://drive.google.com/file/d/1bR_cACxg347IRusZALY6ru9vY9CYn_yZ/preview\">J Clin Oncol 2026;44:1597-1607</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-her2climb\">HER2CLIMB</a>. <a href=\"https://drive.google.com/file/d/1PCYUN4gZmfcf0tQDYSHO9YLnlnT8p3YR/preview\">N Engl J Med 2020;382:597-609</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-emilia\">EMILIA</a>. <a href=\"https://drive.google.com/file/d/1M9t0sBjzrUmxXfZeU06ZJo7oZVTqxuyh/preview\">N Engl J Med 2012;367:1783-1791</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-destiny-breast03\">DESTINY-Breast03</a>. <a href=\"https://drive.google.com/file/d/1VILwT_JfhHk85eWw9lN1nVbr6HqkkUm0/preview\">N Engl J Med 2022;386:1143-1154</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-nala\">NALA</a>. <a href=\"https://drive.google.com/file/d/1de5DMm66aS8II5JWM4x9dHexPrFVaqBt/preview\">J Clin Oncol 2020;38:3138-3149</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-egf100151-lapatinib-capecitabine\">EGF100151 (lapatinib + capecitabine)</a>. <a href=\"https://drive.google.com/file/d/11LZq8by21Ko7biSMCc-Q3AotFaFef6PV/preview\">N Engl J Med 2006;355:2733-2743</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-destiny-breast01\">DESTINY-Breast01</a>. <a href=\"https://drive.google.com/file/d/1as5ff6e3GQBT0V14w8XFMmHJz_77TPTg/preview\">N Engl J Med 2020;382:610-621</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-destiny-breast02\">DESTINY-Breast02</a>. <a href=\"https://drive.google.com/file/d/1jnOIJepghEImFX6fB-cEf7aNaPjLnQJ2/preview\">Lancet 2023;401:1773-1785</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-th3resa\">TH3RESA</a>. <a href=\"https://drive.google.com/file/d/1-Q4p-sND-AL9oAq0RMfJcGgmnhKuqB86/preview\">Lancet Oncol 2014;15:689-699; Lancet Oncol 2017;18:743-754</a>; <a href=\"https://drive.google.com/file/d/1HQEu46p-XO_Ov83F3ZYdHa14BTcat7an/preview\">Krop et al. - 2017 - Trastuzumab emtansine versus treatment of physician&#x27;s choice in patients with previously treated [664afd5c]</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-horizon-breast01\">HORIZON-Breast01</a>. <a href=\"https://drive.google.com/file/d/1TxMHHMc5wlqSCrJNIM4z0useL7b6j5IJ/preview\">Lancet Oncol 2026 (online ahead of print)</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-sophia\">SOPHIA</a>. <a href=\"https://drive.google.com/file/d/1wfJM1B1BJLjEDIzBKRwYhyhZVFQUaJk4/preview\">JAMA Oncol 2021;7:573-584</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-precious\">PRECIOUS</a>. <a href=\"https://drive.google.com/file/d/1Sdor5TLrryrhyuwR-JRNPgObmp8YiCSB/preview\">Cancer Sci 2022;113:3169-3179</a>; <a href=\"https://drive.google.com/file/d/1OxzX9s-hwC3v4Leh65K3Xk2J2YOk01Zi/preview\">J Clin Oncol 2025;43:1631-1637</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-destiny-breast12\">DESTINY-Breast12</a>. <a href=\"https://drive.google.com/file/d/1UEeL_-PIxmdVOBHoeb22WtZoVtyCubsV/preview\">Nat Med 2024;30:3717-3727</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-keynote-355\">KEYNOTE-355</a>. <a href=\"https://drive.google.com/file/d/190UZrnw9AGYVv2ZwzN2jR3u8fT0Qs5io/preview\">Lancet 2020;396:1817-1828</a>; <a href=\"https://drive.google.com/file/d/1jpV8k5dIi8kW62Y7RMNuhy8dVHJJlJ0V/preview\">N Engl J Med 2022;387:217-226</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-impassion130\">IMpassion130</a>. <a href=\"https://drive.google.com/file/d/1TzdCnQ99y_0vIbzr_c3WEI1dUfwF7K9v/preview\">N Engl J Med 2018;379:2108-2121</a>; <a href=\"https://pubmed.ncbi.nlm.nih.gov/31786121/\">Lancet Oncol 2020;21:44-59</a>; <a href=\"https://drive.google.com/file/d/1JJOb9QYp72iURXZqptK7-BykgE9bH96d/preview\">Ann Oncol 2021;32:983-993</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-impassion131\">IMpassion131</a>. <a href=\"https://drive.google.com/file/d/1OBF9G282d0mTyPedp0Q984NYlikSaqAp/preview\">Ann Oncol 2021;32:994-1004</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-ascent-04-keynote-d19\">ASCENT-04 (KEYNOTE-D19)</a>. <a href=\"https://drive.google.com/file/d/1V6W63Ek9kxRIBlcCD7RG9Ax_guAvyx8A/preview\">N Engl J Med 2026;394:354-366</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-ascent-03\">ASCENT-03</a>. <a href=\"https://drive.google.com/file/d/1L9pV2YP_DrIy8mNcNy3TcdUaBbuZxkFw/preview\">N Engl J Med 2025;393:1912-1925</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-tropion-breast02\">TROPION-Breast02</a>. <a href=\"https://drive.google.com/file/d/1Q4CjbCuP_2aMI0YD5KP6pMWPk1QpSSwI/preview\">Ann Oncol 2026 (online ahead of print)</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-tnt-cruk-07-012\">TNT (CRUK/07/012)</a>. <a href=\"https://drive.google.com/file/d/1gVZ3sNC028zne5q_rAML3pSnJhSXSwLg/preview\">Nat Med 2018;24:628-637</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-ascent\">ASCENT</a>. <a href=\"https://drive.google.com/file/d/1rA556DzeRe2qWPKOCYLEHwy3dMl8mOm2/preview\">N Engl J Med 2021;384:1529-1541</a>; <a href=\"https://drive.google.com/file/d/1VSLpegkTqsy60LbYCp-VQdj9aMnUyEes/preview\">J Clin Oncol 2024;42:1738-1744</a></li>\n</ol>", "_hay": "metastatic breast cancer metastatic-breast-cancer breast work-up at the point of metastatic diagnosis hormone receptor-positive, her2-negative disease her2-positive disease triple-negative disease cytotoxic chemotherapy special situations references endocrine therapy or chemotherapy first first-line endocrine therapy with a cdk4/6 inhibitor choosing between the three inhibitors premenopausal patients aggressive disease without visceral crisis first line when the disease is already endocrine-resistant deferring the cdk4/6 inhibitor endocrine monotherapy and the first-line alternatives second line: reading the first-line regimen esr1-mutant disease and the oral serds switching on molecular progression pi3k–akt–mtor-altered disease continuing cdk4/6 inhibition beyond progression her2-low and her2-ultralow expression trop2 antibody–drug conjugates germline brca-mutated disease first line maintenance intensification and hormone receptor-positive overlap second line third line and beyond brain metastases first line at pd-l1 combined positive score of 10 or more first line when immunotherapy is not an option germline brca-mutated disease and platinum pretreated disease"}, {"id": "breast-neoadjuvant-therapy-for-breast-cancer", "slug": "neoadjuvant-therapy-for-breast-cancer", "group": "Breast", "title": "Neoadjuvant therapy for breast cancer", "updated": "", "sections": [{"id": "s-what-neoadjuvant-therapy-is-for", "h": "What neoadjuvant therapy is for"}, {"id": "s-patient-selection", "h": "Patient selection"}, {"id": "s-work-up-before-starting", "h": "Work-up before starting"}, {"id": "s-assessment-on-and-after-treatment", "h": "Assessment on and after treatment"}, {"id": "s-pathological-complete-response-as-an-endpoint", "h": "Pathological complete response as an endpoint"}, {"id": "s-triple-negative-disease", "h": "Triple-negative disease"}, {"id": "s-her2-positive-disease", "h": "HER2-positive disease"}, {"id": "s-hr-positive-her2-negative-disease", "h": "HR-positive, HER2-negative disease"}, {"id": "s-post-neoadjuvant-therapy-for-residual-disease", "h": "Post-neoadjuvant therapy for residual disease"}, {"id": "s-references", "h": "References"}], "html": "<h2 id=\"s-what-neoadjuvant-therapy-is-for\">What neoadjuvant therapy is for</h2>\n<p>Neoadjuvant systemic therapy does three things that adjuvant therapy cannot.</p>\n<ul><li>It downstages disease in the breast and the axilla, allowing less extensive surgery, better cosmesis and fewer complications such as lymphoedema, and it can render an inoperable tumour operable.</li><li>It tests the biology of the tumour in vivo. The presence and extent of residual invasive cancer at surgery is a strong prognostic factor for recurrence, particularly in triple-negative and HER2-positive disease.</li><li>It converts that readout into a treatment decision: residual disease triggers post-neoadjuvant escalation.</li></ul>\n<p>Moving chemotherapy before surgery has not been shown to improve survival. The <a class=\"trial-link\" href=\"/evidence/#t-ebctcg-neoadjuvant-meta-analysis\">EBCTCG neoadjuvant meta-analysis</a> pooled patient-level data from ten randomised trials (4,756 women entered 1983–2002, median follow-up 9 years) comparing neoadjuvant chemotherapy with the identical adjuvant regimen. Breast-conserving therapy rose (65% vs 49%), 15-year local recurrence rose (21.4% vs 15.9%; RR 1.37, 95% CI 1.17–1.61, p=0.0001), and there was no significant difference in distant recurrence (RR 1.02, 0.92–1.14), breast cancer mortality (RR 1.06, 0.95–1.18) or all-cause mortality (RR 1.04, 0.94–1.15) (Lancet Oncol 2018;19:27-39). The local-recurrence excess is not simply an artefact of good responders skipping surgery. It was largest in the two trials that permitted omission of surgery (10-year RR 1.62, 1.20–2.19) but persisted in the other eight, where surgery was scheduled irrespective of response (RR 1.28, 1.06–1.55), with no significant heterogeneity between the two sets (p=0.19). The evidence base is largely pre-taxane and pre-trastuzumab, which limits how far the local-control penalty carries into current practice. <a class=\"trial-link\" href=\"/evidence/#t-nsabp-b-18-b-27\">NSABP B-18 &amp; B-27</a> is the founding randomisation. B-18 gave identical AC before or after surgery in operable disease (n=1,493 eligible): at 16 years neither overall survival (HR 0.99, 95% CI 0.85–1.16, P=.90) nor disease-free survival (HR 0.93, 0.81–1.06, P=.27) differed, while preoperative therapy raised breast-conserving surgery (68% vs 60%, P=.001) (J Clin Oncol 2008;26:778-785). A significant treatment-by-age interaction for overall survival (P=.01) favoured preoperative timing under age 50 (HR 0.81, P=.06) and postoperative timing at 50 or older (HR 1.23, P=.07). B-27 then added preoperative docetaxel to AC. Pathological complete response doubled, from 13% to 26% (P&lt;.001), with no improvement in disease-free survival (HR 0.92, 0.78–1.08, P=.29). Within both trials pCR was strongly prognostic (overall survival HR 0.32 in B-18 and 0.36 in B-27, both P&lt;.0001). A doubled pCR that did not move survival is the first instance of the surrogacy gap the field still manages.</p>\n<h2 id=\"s-patient-selection\">Patient selection</h2>\n<p>Neoadjuvant therapy is mandatory in some patients and optional in others.</p>\n<ul><li>Upfront inoperable disease: inflammatory breast cancer, and locally advanced stage III disease (bulky or matted cN2, cN3, or cT4).</li><li>Operable triple-negative disease of T1c or greater (larger than 1 cm), and operable HER2-positive disease of cT2 or greater or cN-positive. These subtypes respond often enough for the readout to be informative, they receive systemic therapy in any case, and a non-pCR identifies a patient for post-neoadjuvant escalation.</li><li>A large primary tumour relative to breast size in a patient who wants breast conservation.</li><li>cN-positive disease likely to convert to cN0, which permits sentinel node surgery or targeted axillary dissection instead of axillary dissection, and more limited radiotherapy fields.</li><li>A temporary contraindication to surgery, such as pregnancy, recent venous thromboembolism, or recent coronary stenting.</li></ul>\n<p>For cT1 HER2-positive disease, upfront surgery followed by adjuvant treatment is preferred, since the pathological stage then allows systemic therapy to be de-escalated rather than over-delivered.</p>\n<h2 id=\"s-work-up-before-starting\">Work-up before starting</h2>\n<ul><li>Core biopsy of the breast with placement of an image-detectable clip, so the tumour bed can still be identified if the tumour responds completely.</li><li>Axillary ultrasound in cN0 disease; ultrasound-guided fine-needle aspiration or core biopsy in cN-positive disease to confirm involvement.</li><li>Clip placement in any pathologically involved node. Removing the marked node at post-neoadjuvant sentinel node biopsy lowered the false-negative rate of the procedure from 10.1% to 1.4% in a prospective study (JCO 2016).</li><li>Breast ultrasound. Breast MRI is not routine but helps define disease extent, including multifocal and multicentric disease.</li><li>Staging CT or PET is usually omitted in stage I–II disease, where the yield in an asymptomatic patient is low, and done routinely in stage III and inflammatory disease or where symptoms, signs or laboratory abnormalities suggest metastases.</li></ul>\n<h2 id=\"s-assessment-on-and-after-treatment\">Assessment on and after treatment</h2>\n<p>Clinical examination before each cycle is the standard on-treatment assessment; imaging is repeated only if progression is suspected clinically or the surgeon needs it to plan the operation. Progression on neoadjuvant therapy is managed by proceeding to surgery if the disease remains operable, and by moving to the next line of chemotherapy if it does not. No imaging modality can exclude residual invasive disease, so the pathology of the surgical specimen is the only reliable readout. Axillary management after neoadjuvant therapy follows the pretreatment nodal status.</p>\n<ul><li>cN0 before treatment: sentinel node biopsy at surgery. A negative sentinel node needs no further axillary treatment; a positive one is managed by axillary dissection, or alternatively by postoperative axillary radiotherapy.</li><li>cN2–3 before treatment: axillary dissection.</li><li>cN1 before treatment that remains ycN1: axillary dissection.</li><li>cN1 before treatment that converts to ycN0: sentinel node biopsy with removal of the previously clipped node.</li></ul>\n<p>Surgery, axillary staging and radiotherapy are covered in the early breast cancer chapter.</p>\n<h2 id=\"s-pathological-complete-response-as-an-endpoint\">Pathological complete response as an endpoint</h2>\n<p>The definition used changes what pCR predicts. In the <a class=\"trial-link\" href=\"/evidence/#t-ctneobc-pooled-analysis\">CTNeoBC pooled analysis</a>, an FDA-led pooled analysis of 12 neoadjuvant trials (11,955 patients, all subtypes), clearing tumour from both breast and nodes (ypT0 ypN0 or ypT0/is ypN0) predicted overall survival better (HR 0.36 for both) than clearing the breast alone (ypT0/is, HR 0.51) (Lancet 2014;384:164-172). At patient level pCR is a powerful prognostic marker. Defined as ypT0/is ypN0 it predicted event-free survival (HR 0.48, 95% CI 0.43–0.54) and overall survival (HR 0.36, 0.31–0.42), most strongly in triple-negative disease (event-free survival HR 0.24) and in HER2-positive, hormone-receptor-negative disease treated with trastuzumab (HR 0.15). At trial level it is not a validated surrogate. Larger between-arm pCR gains did not predict event-free survival gains (R²=0.03, 95% CI 0.00–0.25) or overall survival gains (R²=0.24, 0.00–0.70), far below the R² of approximately 0.75 conventionally required. A HER2-positive re-analysis (11 trials, 3,980 patients) reproduced the same split inside a single subtype: strong patient-level association (event-free survival OR 2.64, overall survival OR 3.15, with OR above 1 favouring pCR) and weak trial-level correlation (R² 0.23 for event-free survival, 0.02 for overall survival) (J Clin Oncol 2023;41:2988-2997). A patient who achieves pCR therefore has a better prognosis than one who does not, but a regimen that produces more pCR is not thereby shown to save more lives. Response-adapted escalation is built on pCR; regimen selection is not settled by it. <a class=\"trial-link\" href=\"/evidence/#t-residual-cancer-burden-symmans\">Residual Cancer Burden (Symmans)</a> grades the non-pCR group that the pCR endpoint treats as one bin. In a pooled five-cohort single-institution validation (n=1,158, retrospective pathology review with prospective follow-up, not a randomised trial), the index was defined as continuous with predefined cut points of 1.36 and 3.28 (J Clin Oncol 2017;35:1049-1060). Ten-year relapse-free survival by class (pCR / RCB-I / II / III) was 86/81/55/23% in triple-negative disease and 95/77/47/21% in trastuzumab-treated HER2-positive disease. Two qualifications limit it. In HR-positive, HER2-negative disease the gradient was not monotonic (83/97/74/52%), with pCR itself entering the multivariable model as a paradoxical predictor (HR 5.03, 95% CI 1.60–15.78) on small numbers. In HER2-positive disease treated with chemotherapy alone it dropped out of the model, with RCB-II and RCB-III failing to separate (44% vs 47%). RCB index was independently prognostic in triple-negative (HR 1.92, 1.49–2.46) and trastuzumab-treated HER2-positive disease (HR 1.80, 1.26–2.59). It is prognostic only, and the authors call for external validation.</p>\n<h2 id=\"s-triple-negative-disease\">Triple-negative disease</h2>\n<h3>The chemotherapy backbone and the carboplatin question</h3>\n<p>Adding carboplatin to an anthracycline–taxane backbone raises pCR consistently; whether it improves survival depends on menopausal status.</p>\n<ul><li><a class=\"trial-link\" href=\"/evidence/#t-geparsixto\">GeparSixto</a> added weekly carboplatin (AUC 1.5) to paclitaxel and non-pegylated liposomal doxorubicin over 18 weeks in the 315-patient triple-negative cohort. pCR (ypT0 ypN0) rose from 36.9% to 53.2% (P=0.005), and on the 2018 survival analysis 3-year disease-free survival improved (86.1% vs 75.8%, HR 0.56, 95% CI 0.34–0.93, P=0.022), with the overall survival gain not significant (Lancet Oncol 2014;15:747-756; Ann Oncol 2018;29:2341-2347). Grade 3/4 neutropenia rose from 27% to 65%, and the homologous-recombination-deficiency score did not predict platinum benefit.</li><li><a class=\"trial-link\" href=\"/evidence/#t-calgb-40603-alliance\">CALGB 40603 (Alliance)</a>, a 2×2 factorial randomised phase 2 (N=443) on weekly paclitaxel then dose-dense AC, found carboplatin raised pCR in breast and axilla (54% vs 41%, OR 1.71, P=0.003) but at 7.9-year median follow-up did not significantly improve event-free survival (HR 0.94) or overall survival (HR 1.12) (J Clin Oncol 2015;33:13-21; J Clin Oncol 2022;40:1323-1334). The trial was underpowered for survival, so this is an unproven rather than a disproven benefit. Within the same dataset pCR was strongly prognostic (5-year event-free survival 85.5% vs 56.6%), and even minimal residual disease at RCB-I fared worse than pCR.</li><li><a class=\"trial-link\" href=\"/evidence/#t-brightness\">BrighTNess</a>, a double-blind phase 3 (N=634) randomising 2:1:1 to paclitaxel plus carboplatin plus veliparib, paclitaxel plus carboplatin, or paclitaxel alone, each followed by AC, confirmed carboplatin&#x27;s independent contribution (pCR 58% vs 31%) and showed veliparib added nothing (53% vs 58%, P=0.36), at grade 3/4 neutropenia of 56% and febrile neutropenia of 15% (Lancet Oncol 2018;19:497-509). At 4.5 years event-free survival favoured the carboplatin-containing arm (HR 0.63, 95% CI 0.43–0.92, P=0.02), with no overall survival difference and no excess MDS or AML (Ann Oncol 2022;33:384-394).</li><li>The <a class=\"trial-link\" href=\"/evidence/#t-tmc-tnbc-platinum-trial-gupta\">TMC TNBC Platinum Trial (Gupta)</a> is the phase 3 survival test (N=717, single centre). The primary endpoint of event-free survival was not significantly improved (HR 0.80, 95% CI 0.62–1.03, P=0.081), while overall survival was nominally better (5-year 74.4% vs 66.8%, HR 0.74, P=0.029) and pCR higher (54.5% vs 40.3%) (J Clin Oncol 2026;44:9-19). A significant menopausal-status interaction confined the entire benefit to premenopausal patients (event-free survival HR 0.61, overall survival HR 0.57, pCR 61.7% vs 40.6%). Only the primary endpoint was alpha-controlled, so the overall survival and subgroup P-values are nominal.</li></ul>\n<p>On this evidence platinum is supported in premenopausal triple-negative disease and argued against postmenopausally. The menopausal-status interaction comes from Gupta alone; the three earlier trials did not analyse it. The question is largely absorbed into current practice, since the chemo-immunotherapy backbone already contains carboplatin and its contribution cannot be isolated there.</p>\n<h3>Chemo-immunotherapy</h3>\n<p><a class=\"trial-link\" href=\"/evidence/#t-keynote-522\">KEYNOTE-522</a> is the standard for high-risk stage II–III triple-negative disease. In 1,174 patients it gave neoadjuvant pembrolizumab 200 mg every 3 weeks with carboplatin–paclitaxel for 4 cycles, then with AC or EC for 4 cycles, then adjuvant pembrolizumab for 9 cycles, against the same chemotherapy with placebo (N Engl J Med 2020;382:810-821). Each link of the chain was formally tested against its own alpha boundary and cleared it.</p>\n<ul><li>pCR 64.8% vs 51.2% in the first 602 patients randomised, a 13.6-point difference (95% CI 5.4–21.8), P&lt;0.001 against a boundary of 0.003.</li><li>Event-free survival at the fourth interim analysis, HR 0.63 (95% CI 0.48–0.82), P&lt;0.001 against a boundary of 0.01034 (N Engl J Med 2022;386:556-567).</li><li>Overall survival at the final analysis (median follow-up 75.1 months), whole-period stratified log-rank P=0.002 against a boundary of 0.00503, with deaths in 14.7% vs 21.8% (N Engl J Med 2024;391:1981-1991).</li></ul>\n<p>The 2020 publication states that its confidence intervals were not adjusted for multiplicity and cannot be used to infer effects. No overall survival hazard ratio is reported: the 5-year survival pair of 86.6% vs 81.7% is a descriptive landmark, and the weighted hazard ratio of 0.66 is an unstratified non-proportional-hazards sensitivity analysis carrying neither an interval nor a P-value. Benefit was consistent across all PD-L1 CPS strata on the 22C3 assay, which is the reverse of the same drug in advanced triple-negative disease, where the survival benefit is confined to CPS of 10 or more on the same assay. PD-L1 is therefore not tested to select immunotherapy in early disease. Grade 3 or higher immune-mediated adverse events occurred in 13.0% vs 1.5%. Subgroups defined by outcome are exploratory, carry no alpha and were not tested against each other. In the no-pCR stratum event-free survival HR was 0.70 (95% CI 0.52–0.95), and by residual disease category 0.92 for RCB-1, 0.52 (0.32–0.82) for RCB-2 and 1.24 for RCB-3 (Ann Oncol 2024;35:429-436). Pembrolizumab was given before and after surgery with no arm stopping at surgery, so the neoadjuvant and adjuvant contributions cannot be separated. Two further trials bear on the regimen&#x27;s edges.</p>\n<ul><li><a class=\"trial-link\" href=\"/evidence/#t-geparnuevo-durvalumab\">GeparNuevo (durvalumab)</a> added neoadjuvant durvalumab to nab-paclitaxel then dose-dense EC in 174 patients, with no carboplatin and no adjuvant continuation. The pCR gain was modest and not significant (53.4% vs 44.2%, OR 1.45, P=0.287), yet at 86.4-month median follow-up durvalumab improved invasive disease-free survival (HR 0.56), distant disease-free survival (HR 0.41) and overall survival (HR 0.33), irrespective of pathological response (Ann Oncol 2019;30:1279-1288; J Clin Oncol 2026;44:1580-1586). It generalises checkpoint benefit to the anti-PD-L1 class, and being neoadjuvant-only it bears on whether the adjuvant phase is needed. As a phase 2 trial on a different backbone and antibody, it reopens that question rather than answering it.</li><li><a class=\"trial-link\" href=\"/evidence/#t-neopact\">NeoPACT</a> is a single-arm phase 2 (N=115, stage I–III) of pembrolizumab on an anthracycline-free carboplatin–docetaxel backbone for 6 cycles. pCR was 58% (95% CI 48–67) with RCB 0+1 in 69%, 3-year event-free survival 86% (98% with pCR vs 68% without), and grade 3 or higher immune-mediated events in 3.5% (JAMA Oncol 2024;10:227-235). There is no comparator, so no equivalence to the standard regimen follows from the cross-trial pCR similarity; SCARLET is the randomised test.</li></ul>\n<p>Other checkpoint inhibitors have been tested on similar backbones with mixed results: Impassion031 reported pCR 58% vs 41% (a 17-point difference, p=0.0044), NeoTRIPaPDL1 67% vs 63% (p=0.48) against an event-free survival primary endpoint, GeparDouze 63% vs 57%, and CamRelief 56.8% vs 44.7% (a 12.2-point difference, p=0.004). GeparDouze (NSABP B-59), whose atezolizumab design closely modelled KEYNOTE-522, did not improve survival.</p>\n<h2 id=\"s-her2-positive-disease\">HER2-positive disease</h2>\n<h3>Establishing dual blockade</h3>\n<p>Adding trastuzumab to neoadjuvant chemotherapy improved pathological response and event-free survival in NOAH (pCR 43% vs 22%; 5-year event-free survival 58% vs 43%, HR 0.64, p=0.016), with a 5-year overall survival difference that did not reach significance (74% vs 63%, HR 0.66, p=0.055). <a class=\"trial-link\" href=\"/evidence/#t-neosphere\">NeoSphere</a> brought dual blockade into the neoadjuvant setting. In 417 treatment-naive patients randomised to four cycles of one of four regimens, adding pertuzumab to trastuzumab plus docetaxel raised breast pCR from 29.0% (95% CI 20.6–38.5) to 45.8% (36.1–55.7), P=0.0141 (Lancet Oncol 2012;13:25-32). The chemotherapy-free dual-blockade arm still reached 16.8% and pertuzumab plus docetaxel 24.0%, so both drugs and the chemotherapy contribute. Grade 3 or higher events were mainly neutropenia and concentrated in the docetaxel arms. PEONY reproduced the pertuzumab effect in an Asian phase 3 (pCR 39% vs 22%; 5-year event-free survival 85% vs 74%, HR 0.53, p=0.027). Subcutaneous fixed-dose trastuzumab–pertuzumab is an option, shown pharmacokinetically non-inferior to the intravenous formulation in FeDeriCa (500 patients, stage II–III) with pCR of 60% in both arms.</p>\n<h3>Paring down the chemotherapy backbone</h3>\n<p>The de-escalation sequence has removed the anthracycline and then the carboplatin, while leaving the taxane in place.</p>\n<ul><li><a class=\"trial-link\" href=\"/evidence/#t-tryphaena\">TRYPHAENA</a> (N=225) was a three-arm cardiac safety study of dual blockade with FEC then docetaxel concurrently, sequentially, or with anthracycline-free docetaxel–carboplatin. Symptomatic left ventricular systolic dysfunction was rare (2 patients during neoadjuvant treatment) and LVEF declines of 10 points or more to below 50% occurred in 3.9–5.6% across arms (Ann Oncol 2013;24:2278-2284). Descriptive pCR (ypT0/is) was high in every arm: 61.6%, 57.3% and 66.2%.</li><li><a class=\"trial-link\" href=\"/evidence/#t-train-2\">TRAIN-2</a> tested the anthracycline directly in 438 patients with stage II–III disease. pCR in breast and axilla was identical (67% vs 68%, P=0.95) across every subgroup, and survival confirmed it (3-year event-free survival 92.7% vs 93.6%, HR 0.90, 0.50–1.63; overall survival 97.7% vs 98.2%) (Lancet Oncol 2018;19:1630-1640; JAMA Oncol 2021;7:978-984). Toxicity favoured dropping the anthracycline: grade 3 or higher febrile neutropenia 10% vs 1% (P&lt;0.0001), severe LVEF decline 7.7% vs 3.2% (P=0.04), and two acute leukaemias in the anthracycline arm.</li><li><a class=\"trial-link\" href=\"/evidence/#t-neocarhp\">neoCARHP</a> removed the carboplatin. In a phase 3 non-inferiority trial (N=774), six cycles of taxane plus trastuzumab and pertuzumab were non-inferior to the same regimen with carboplatin AUC 6 (pCR in breast and axilla 64.1% vs 65.9%, difference −1.8%, 95% CI −8.5 to 5.0, P for non-inferiority 0.0089), with fewer grade 3–4 adverse events (20.7% vs 34.6%) (J Clin Oncol 2026;44:1587-1596). Non-inferiority rests on pCR alone; survival is immature.</li><li><a class=\"trial-link\" href=\"/evidence/#t-kristine-trio-021\">KRISTINE (TRIO-021)</a> marks the floor. Replacing chemotherapy with T-DM1 plus pertuzumab cost 11 points of pCR in breast and axilla against docetaxel–carboplatin with dual blockade (44.4% vs 55.7%, difference −11.3%, 95% CI −20.5 to −2.0, P=0.016), despite far less toxicity (grade 3–4 adverse events 13% vs 64%) (Lancet Oncol 2018;19:115-126). Event-free survival at 3 years was 94.2% with the chemotherapy regimen and 85.3% with T-DM1, driven by locoregional progression before surgery in the T-DM1 arm.</li></ul>\n<p>The <a class=\"trial-link\" href=\"/evidence/#t-neoadjuvant-her2-therapy-nma-villacampa\">Neoadjuvant HER2+ therapy NMA (Villacampa)</a>, a network meta-analysis of 46 randomised trials and 32 regimens (11,049 patients), supports most of that sequence and diverges on the last step: dual blockade plus chemotherapy was superior to trastuzumab plus chemotherapy for pCR, event-free survival and overall survival at the cost of more cardiotoxicity, and anthracycline-based chemotherapy was not more effective than anthracycline-free chemotherapy, but within anthracycline-free regimens carboplatin gave numerically better outcomes (Eur J Cancer 2023;190:112885).</p>\n<h3>An antibody–drug conjugate front end</h3>\n<p><a class=\"trial-link\" href=\"/evidence/#t-destiny-breast11\">DESTINY-Breast11</a> replaced dose-dense AC with four cycles of T-DXd before four cycles of paclitaxel with dual blockade, in 927 patients with high-risk disease (at least cT3 cN0, or cT0–4 cN1–3). T-DXd then THP improved pCR over dose-dense AC then THP (67.3% vs 56.3%, difference 11.2%, 95% CI 4.0–18.3, P=0.003), in both hormone-receptor-positive (61.4% vs 52.3%) and hormone-receptor-negative disease (83.1% vs 67.1%) (Ann Oncol 2026;37:166-179). The T-DXd-alone arm was closed early for inferiority (pCR 43.0%), so the taxane plus dual-blockade consolidation is still needed. Safety favoured the ADC front end: grade 3 or higher adverse events 37.5% vs 55.8%, all-grade left ventricular dysfunction 1.3% vs 6.1%, and drug-related interstitial lung disease low and similar across arms at approximately 4–5%. Grade 3 or higher interstitial lung disease occurred in 0.6%. Event-free survival is immature at 4.5% maturity (HR 0.56).</p>\n<h3>Chemotherapy-free and response-adapted strategies</h3>\n<p>A parallel line asks how little chemotherapy the lowest-risk patients need, using pCR to sort them.</p>\n<ul><li><a class=\"trial-link\" href=\"/evidence/#t-wsg-adapt-tp\">WSG-ADAPT-TP</a> randomised 375 patients with HR-positive, HER2-positive disease to 12 weeks of T-DM1, T-DM1 plus endocrine therapy, or trastuzumab plus endocrine therapy. Despite higher pCR with the T-DM1 arms, 5-year invasive disease-free survival (88.9% / 85.3% / 84.6%) and overall survival (97.2% / 96.4% / 96.3%) did not differ detectably, on 46 events and 19 deaths in a trial not powered for survival, because non-pCR patients received mandatory standard chemotherapy (J Clin Oncol 2023;41:3796-3804). Among the 117 patients with pCR, the 41 who omitted adjuvant chemotherapy had 5-year invasive disease-free survival of 92.1% against 93.0% in those who received it.</li><li><a class=\"trial-link\" href=\"/evidence/#t-wsg-tp-ii\">WSG-TP-II</a> compared 12 weeks of trastuzumab–pertuzumab plus endocrine therapy with trastuzumab–pertuzumab plus weekly paclitaxel in 207 patients with HR-positive, HER2-positive disease. pCR was far higher with paclitaxel (56.4% vs 23.7%; JAMA Oncol 2023;9:946-954), yet 5-year overall survival was 100% in the endocrine arm and 97.9% in the paclitaxel arm, untested, and the prespecified invasive disease-free endpoint was 92.1% vs 94.8% (J Clin Oncol 2026;44:1974-1980). About 70% of the endocrine arm went on to receive adjuvant chemotherapy, so the chemotherapy-free label applies to the neoadjuvant phase only.</li><li><a class=\"trial-link\" href=\"/evidence/#t-phergain-2\">PHERGain-2</a> took the strategy into node-negative disease. In 396 patients with centrally confirmed IHC 3+ tumours of 5–30 mm by MRI, eight cycles of trastuzumab–pertuzumab alone (with endocrine therapy if hormone-receptor-positive) produced pCR in 236 of 396 (59.6%), who then continued chemotherapy-free adjuvant dual blockade; 37.8% moved to T-DM1 and 1.8% to chemotherapy then T-DM1 (Ann Oncol 2026;37:837-848). Global quality of life declined by 10% or more at 1 year in 42.8%, and treatment-related adverse events occurred in 86.6% (5.6% grade 3 or higher), with one T-DM1-attributed death from pneumonitis. The 3-year recurrence-free interval co-primary endpoint is not yet reported.</li><li><a class=\"trial-link\" href=\"/evidence/#t-train-3\">TRAIN-3</a> personalised duration rather than intensity, sending patients to surgery once MRI showed a complete radiological response. One third of hormone-receptor-negative and one sixth of hormone-receptor-positive patients reached pCR after only 3 cycles, and 3-year event-free survival was 92.2% and 92.0% respectively (Lancet Oncol 2026;27:349-360). Patients who needed only 1–3 cycles did better still (96.1% and 98.6%), but they entered that group by responding early on MRI, so this is favourable-prognosis selection rather than an effect of shorter treatment; no comparison between cycle groups is tested. Grade 3–4 adverse events and grade 2 or worse neuropathy rose with increasing cycle number, with no treatment-related deaths.</li></ul>\n<h2 id=\"s-hr-positive-her2-negative-disease\">HR-positive, HER2-negative disease</h2>\n<p>Neoadjuvant chemotherapy here is chosen for downstaging rather than for its readout. pCR rates are low and its prognostic value is weaker: a meta-analysis (Spring et al., Clin Cancer Res 2020) found pCR associated with improved event-free survival in triple-negative and HER2-positive disease but only a trend towards significance in HR-positive disease. The neoadjuvant interval also allows time for germline BRCA testing to inform adjuvant treatment. Regimen selection follows adjuvant practice.</p>\n<ul><li>Anthracycline-containing regimens are preferred, with docetaxel–cyclophosphamide as the alternative where anthracyclines are contraindicated.</li><li>Either weekly paclitaxel or 3-weekly docetaxel, extrapolating from the adjuvant <a class=\"trial-link\" href=\"/evidence/#t-ecog-e1199\">ECOG E1199</a> comparison.</li><li>Either sequence, AC then taxane or taxane then AC, is acceptable. Neo-tAnGo, a 2×2 factorial phase 3, found a higher pCR when the taxane came first (20% vs 15%) and no role for added gemcitabine.</li></ul>\n<p>Immunotherapy is under test in this subtype and is not FDA-approved for it. KEYNOTE-756 randomised 635 treatment-naive patients with grade 3, high-risk ER-positive, HER2-negative disease to pembrolizumab or placebo added to AC then taxane for 9 cycles, improving pCR from 15.6% to 24.3%, with event-free survival immature (Nature 2025).</p>\n<h2 id=\"s-post-neoadjuvant-therapy-for-residual-disease\">Post-neoadjuvant therapy for residual disease</h2>\n<p>Residual invasive disease at surgery identifies a high-risk patient and triggers escalation rather than observation. In HER2-positive disease, <a class=\"trial-link\" href=\"/evidence/#t-katherine\">KATHERINE</a> randomised 1,486 patients with residual invasive disease after neoadjuvant taxane and trastuzumab to 14 cycles of T-DM1 or trastuzumab. T-DM1 halved recurrence (3-year invasive disease-free survival 88.3% vs 77.0%, HR 0.50, 0.39–0.64, P&lt;0.001) (N Engl J Med 2019;380:617-628). The final 8.4-year analysis sustained the gain (HR 0.54; 7-year invasive disease-free survival 80.8% vs 67.1%) and delivered a significant overall survival benefit (HR 0.66, 0.51–0.87, P=0.003; 7-year overall survival 89.1% vs 84.4%) (N Engl J Med 2025;392:249-257). Grade 3 or higher adverse events were commoner with T-DM1 (26.1% vs 15.7%: thrombocytopenia, transaminitis, neuropathy). <a class=\"trial-link\" href=\"/evidence/#t-destiny-breast05\">DESTINY-Breast05</a> raised that bar for the highest-risk residual disease. In 1,635 patients with residual invasive disease who were node-positive at surgery or inoperable at diagnosis, post-neoadjuvant T-DXd cut invasive recurrence or death by about half against T-DM1 (events 6.2% vs 12.5%, HR 0.47, 0.34–0.66, P&lt;0.001; 3-year invasive disease-free survival 92.4% vs 83.7%) (N Engl J Med 2026;394:845-857). The counterweight is pulmonary: adjudicated drug-related interstitial lung disease occurred in 9.6% vs 1.6%, with two ILD deaths. Overall survival is immature. In triple-negative disease, <a class=\"trial-link\" href=\"/evidence/#t-create-x-jbcrg-04\">CREATE-X (JBCRG-04)</a> randomised 910 patients with HER2-negative residual invasive disease after neoadjuvant anthracycline and taxane to eight cycles of capecitabine 1250 mg/m² twice daily on days 1–14 or to observation. Capecitabine improved 5-year disease-free survival (74.1% vs 67.6%, HR 0.70, P=0.01) and overall survival (89.2% vs 83.6%, HR 0.59, P=0.01) (N Engl J Med 2017;376:2147-2159). The benefit was concentrated in the triple-negative subset (disease-free survival HR 0.58, overall survival HR 0.52) and smaller and non-significant in hormone-receptor-positive disease (HR 0.81 and 0.73). The trial ran entirely in Japan and South Korea, which qualifies the effect size rather than the strategy. For germline BRCA1/2 carriers, <a class=\"trial-link\" href=\"/evidence/#t-olympia\">OlympiA</a> gave one year of adjuvant olaparib 300 mg twice daily against placebo in 1,836 patients with HER2-negative high-risk early breast cancer after neoadjuvant or adjuvant chemotherapy. Olaparib improved 3-year invasive disease-free survival (85.9% vs 77.1%, HR 0.58, P&lt;0.001) and distant disease-free survival (HR 0.57), and at the second interim analysis delivered a significant overall survival benefit (4-year 89.8% vs 86.4%, HR 0.68, 98.5% CI 0.47–0.97, P=0.009) (N Engl J Med 2021;384:2394-2405; Ann Oncol 2022;33:1250-1268). Anaemia is the signature toxicity, with no excess MDS or AML. It enrolled both non-pCR patients and high-risk patients treated with upfront surgery, so it is response-directed-eligible rather than a residual-disease-only trial. Adjuvant pembrolizumab in KEYNOTE-522 is a different kind of post-neoadjuvant therapy: it is given regardless of pathological response, so it is response-independent continuation rather than response-directed escalation, and its separate contribution was never tested. Sequencing these escalations is unresolved. A patient with triple-negative disease and residual disease after neoadjuvant chemo-immunotherapy qualifies for adjuvant pembrolizumab, for capecitabine, and if germline BRCA-mutated for olaparib, and no trial has tested how to combine or sequence them. KEYNOTE-522 deliberately excluded adjuvant capecitabine, its design predating routine uptake of CREATE-X. Adjuvant CDK4/6 inhibition for high-risk HR-positive residual disease is covered in the early breast cancer chapter.</p>\n<h2 id=\"s-references\">References</h2>\n<ol class=\"refs\">\n<li><a class=\"trial-link\" href=\"/evidence/#t-ebctcg-neoadjuvant-meta-analysis\">EBCTCG neoadjuvant meta-analysis</a>. <a href=\"https://drive.google.com/file/d/1TXmZfWXeTgL19WiYNPXuugffiolsNv3V/preview\">Lancet Oncol 2018;19:27-39</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-nsabp-b-18-b-27\">NSABP B-18 &amp; B-27</a>. <a href=\"https://drive.google.com/file/d/1o6B5_G-fvXaSvMZVTkSzvb2Du-sVlPbe/preview\">J Clin Oncol 2008;26:778-785</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-ctneobc-pooled-analysis\">CTNeoBC pooled analysis</a>. <a href=\"https://drive.google.com/file/d/1jvK9nfPbnTPqNWvCU2_Vm6WRJ7IYLg1d/preview\">Lancet 2014;384:164-172</a>; <a href=\"https://drive.google.com/file/d/1PsIhGkSFxN_QG7PcpxAnOEBi6XW16H6d/preview\">J Clin Oncol 2023;41:2988-2997</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-residual-cancer-burden-symmans\">Residual Cancer Burden (Symmans)</a>. <a href=\"https://drive.google.com/file/d/1E-JYtupEi6MpmwjGPbL216DQk832voAB/preview\">J Clin Oncol 2017;35:1049-1060</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-geparsixto\">GeparSixto</a>. <a href=\"https://drive.google.com/file/d/1E9gbRjUXeNvcp5Ayz-H-5Ac489iyb78t/preview\">Lancet Oncol 2014;15:747-756</a>; <a href=\"https://drive.google.com/file/d/1yUir2MPAFq_o78rUx_EnKJ17y2ue2mJT/preview\">Ann Oncol 2018;29:2341-2347</a>; <a href=\"https://pubmed.ncbi.nlm.nih.gov/28715532/\">JAMA Oncol 2017;3:1378-1385</a>; <a href=\"https://pubmed.ncbi.nlm.nih.gov/32841306/\">PLoS One 2020;15:e0238021</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-calgb-40603-alliance\">CALGB 40603 (Alliance)</a>. <a href=\"https://drive.google.com/file/d/1ASitLQfBdb-XE_RLtOyIA00zYZd5rtNP/preview\">J Clin Oncol 2015;33:13-21</a>; <a href=\"https://drive.google.com/file/d/1YdZZKerhO23kOdWRP4qZZ6NbUH0_7lT8/preview\">J Clin Oncol 2022;40:1323-1334</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-brightness\">BrighTNess</a>. <a href=\"https://drive.google.com/file/d/1JXTwlkbmTocD_RFEDS1K3OCo2lcggVRt/preview\">Lancet Oncol 2018;19:497-509</a>; <a href=\"https://drive.google.com/file/d/1PvNgqmXThO9n4qXVRezi5dFYzhZipwSU/preview\">Ann Oncol 2022;33:384-394</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-tmc-tnbc-platinum-trial-gupta\">TMC TNBC Platinum Trial (Gupta)</a>. <a href=\"https://drive.google.com/file/d/1T0 review\">Louis FM et al. Lancet Oncol 2026;27:349-360</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-ecog-e1199\">ECOG E1199</a>. <a href=\"https://drive.google.com/file/d/1Wp7VZCFyAGbsNzRmPXHbil96rjDweBE-/preview\">N Engl J Med 2008;358:1663-1671</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-katherine\">KATHERINE</a>. <a href=\"https://drive.google.com/file/d/1BPLe620qXGQ9Ej-8gx9PPHt13CwGkh0B/preview\">N Engl J Med 2019;380:617-628</a>; <a href=\"https://drive.google.com/file/d/1g4uZUH0uR-fyE6SMtVKh8aShu7cfCDHt/preview\">Geyer CE et al. N Engl J Med 2025;392:249-257</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-destiny-breast05\">DESTINY-Breast05</a>. <a href=\"https://drive.google.com/file/d/1Rb5k37Kyd0ApGAWBnHepdL70Ilzddkif/preview\">N Engl J Med 2026;394:845-857</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-create-x-jbcrg-04\">CREATE-X (JBCRG-04)</a>. <a href=\"https://drive.google.com/file/d/1upcvkT0k8pCt0K8yO5-uMW81lIw_XwV9/preview\">N Engl J Med 2017;376:2147-2159</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-olympia\">OlympiA</a>. <a href=\"https://drive.google.com/file/d/1vchaLZDGyxUe6socMeIvd4CXtBY6nr8K/preview\">N Engl J Med 2021;384:2394-2405</a>; <a href=\"https://drive.google.com/file/d/10GahBZ3WjYp1WbnLkbHlPRaBk-tigfTF/preview\">Ann Oncol 2022;33:1250-1268</a></li>\n</ol>", "_hay": "neoadjuvant therapy for breast cancer neoadjuvant-therapy-for-breast-cancer breast what neoadjuvant therapy is for patient selection work-up before starting assessment on and after treatment pathological complete response as an endpoint triple-negative disease her2-positive disease hr-positive, her2-negative disease post-neoadjuvant therapy for residual disease references the chemotherapy backbone and the carboplatin question chemo-immunotherapy establishing dual blockade paring down the chemotherapy backbone an antibody–drug conjugate front end chemotherapy-free and response-adapted strategies"}, {"id": "colorectal-colorectal-cancer-molecular-pathology-and-genetics", "slug": "colorectal-cancer-molecular-pathology-and-genetics", "group": "Colorectal", "title": "Colorectal cancer: molecular pathology and genetics", "updated": "", "sections": [{"id": "s-pathology-and-sidedness", "h": "Pathology and sidedness"}, {"id": "s-mismatch-repair-and-microsatellite-instability", "h": "Mismatch repair and microsatellite instability"}, {"id": "s-ras-braf-and-her2", "h": "RAS, BRAF and HER2"}, {"id": "s-consensus-molecular-subtypes", "h": "Consensus molecular subtypes"}, {"id": "s-hereditary-syndromes", "h": "Hereditary syndromes"}, {"id": "s-molecular-pathways-of-tumorigenesis", "h": "Molecular pathways of tumorigenesis"}, {"id": "s-references", "h": "References"}], "html": "<h2 id=\"s-pathology-and-sidedness\">Pathology and sidedness</h2>\n<p>Most colorectal malignancies are adenocarcinomas. Signet-ring cell carcinoma has a poor prognosis and is associated with extensive intramural spread, peritoneal carcinomatosis, MSI and Lynch syndrome, whereas medullary carcinoma is often dMMR and has a relatively favourable prognosis. Histological grade is based on gland formation: well differentiated, &gt;95%; moderately differentiated, 50–95%; poorly differentiated, &lt;50%; and undifferentiated, no gland or mucin formation. CK20 and CDX2 support intestinal differentiation, although MSI-H medullary carcinomas may lack both markers and may express calretinin, CK7, SATB2 or CDH17. Right-sided tumours are commonly polypoid or exophytic and may present with occult bleeding or iron-deficiency anaemia. Left-sided tumours are more often annular, causing luminal narrowing and altered bowel habit. Right-sided disease is enriched for MSI-H/dMMR, CIMP, mucinous, signet-ring and medullary histology, and KRAS/BRAF alterations. In metastatic colorectal cancer, right-sided primary location has been associated with poorer prognosis.</p>\n<h2 id=\"s-mismatch-repair-and-microsatellite-instability\">Mismatch repair and microsatellite instability</h2>\n<p>The mismatch-repair proteins are MLH1, MSH2, MSH6 and PMS2. Tumour-cell loss of one or more proteins by immunohistochemistry, with retained staining in adjacent normal mucosa, supports dMMR; MSI testing identifies instability at microsatellite loci. MSI-H was historically defined as instability in at least 30% of tested microsatellite loci. MSI-H/dMMR tumours occur more often in the proximal colon, tend to have a mucinous component and lymphocytic infiltration, and are often poorly differentiated. In non-metastatic disease, MSI-H/dMMR is associated with longer survival than MSI-low or microsatellite-stable disease despite adverse histological features. The favourable prognostic association may be attenuated by BRAF V600E.</p>\n<h2 id=\"s-ras-braf-and-her2\">RAS, BRAF and HER2</h2>\n<p>KRAS is the most frequently altered RAS gene in colorectal cancer; relevant alterations extend beyond KRAS exon 2 to KRAS exons 3 and 4 and NRAS exons 2, 3 and 4. RAS mutations maintain signalling through the RAS–RAF–ERK pathway and are associated with resistance to EGFR blockade. BRAF V600E is the dominant BRAF alteration in colorectal cancer and is strongly adverse prognostically in non-MSI-H disease. In an exploratory extended-RAS/BRAF subgroup of 357 patients with previously untreated unresectable metastatic colorectal cancer in TRIBE, median overall survival was 37.1 months in RAS/BRAF wild-type disease, 25.6 months in RAS-mutant disease and 13.4 months in BRAF-mutant disease (likelihood-ratio p&lt;0.0001) <a class=\"trial-link\" href=\"/evidence/#t-tribe\">TRIBE</a>. HER2 amplification occurs in a small subset of colorectal cancers and can mediate resistance to EGFR blockade. In advanced disease it is enriched in RAS-wild-type, left-sided tumours and represents a bypass mechanism alongside EGFR signalling.</p>\n<h2 id=\"s-consensus-molecular-subtypes\">Consensus molecular subtypes</h2>\n<p>Gene-expression profiling defines four consensus molecular subtypes (CMS1–4). CMS1 is associated with hypermethylation, right-sided primaries, MSI and BRAF-mutant disease; CMS2 is mainly left-sided; and CMS4 more often presents at an advanced stage and has the poorest overall survival. CMS1 has a favourable prognosis in earlier-stage disease but poorer outcomes after relapse, while CMS2 and CMS3 have intermediate prognosis. These subtypes describe biological heterogeneity but do not replace pathological staging or individual biomarker assessment.</p>\n<h2 id=\"s-hereditary-syndromes\">Hereditary syndromes</h2>\n<p>Familial colorectal cancer syndromes include familial adenomatous polyposis (FAP), MUTYH-associated polyposis, Peutz–Jeghers syndrome, juvenile polyposis and PTEN-associated Cowden syndrome. Lynch syndrome is the principal non-polyposis syndrome and arises from germline pathogenic variants in mismatch-repair genes, most commonly MLH1 or MSH2. These syndromes should be distinguished from sporadic dMMR caused by MLH1 promoter hypermethylation.</p>\n<h2 id=\"s-molecular-pathways-of-tumorigenesis\">Molecular pathways of tumorigenesis</h2>\n<p>The adenoma–carcinoma sequence reflects accumulation of genetic events over time. APC alteration is an early event and TP53 alteration generally occurs later. Chromosomal-instability tumours arise through inherited or sporadic APC pathway disruption and show gross chromosomal abnormalities, including insertions, deletions and loss of heterozygosity. Biallelic APC alteration is reported in most sporadic colorectal cancers, while a germline APC variant causes FAP. Loss of mismatch-repair function allows replication errors to accumulate, producing the MSI-H phenotype. Germline MMR defects cause Lynch syndrome.</p>\n<p>The CpG-island methylator phenotype (CIMP) involves widespread promoter methylation, including MLH1 hypermethylation in some tumours.</p>\n<p>BRAF V600E is associated with CIMP-positive colorectal cancer and is usually mutually exclusive with KRAS mutation. RAS proteins normally cycle between inactive GDP-bound and active GTP-bound states; oncogenic RAS mutations impair GTP hydrolysis and sustain proliferative signalling.</p>\n<p>APC normally promotes beta-catenin degradation, whereas its loss permits beta-catenin/T-cell factor-driven proliferation and reduced differentiation.</p>\n<h2 id=\"s-references\">References</h2>\n<ol class=\"refs\">\n<li><a class=\"trial-link\" href=\"/evidence/#t-tribe\">TRIBE</a>. <a href=\"https://drive.google.com/file/d/1UKwif-OAHSN0-g2zU3mG7a3VjKhvB7yf/preview\">N Engl J Med 2014;371:1609-1618</a>; <a href=\"https://drive.google.com/file/d/1feQwqxSnPEsPD4VOgvqf-kTBAMMVfqm9/preview\">Lancet Oncol 2015;16:1306-1315</a></li>\n</ol>", "_hay": "colorectal cancer: molecular pathology and genetics colorectal-cancer-molecular-pathology-and-genetics colorectal pathology and sidedness mismatch repair and microsatellite instability ras, braf and her2 consensus molecular subtypes hereditary syndromes molecular pathways of tumorigenesis references"}, {"id": "colorectal-early-rectal-cancer", "slug": "early-rectal-cancer", "group": "Colorectal", "title": "Early rectal cancer", "updated": "", "sections": [{"id": "s-staging-and-anatomy", "h": "Staging and anatomy"}, {"id": "s-select-the-treatment-objective-and-sequence", "h": "Select the treatment objective and sequence"}, {"id": "s-postoperative-adjuvant-treatment", "h": "Postoperative adjuvant treatment"}, {"id": "s-preoperative-radiotherapy-and-chemoradiation", "h": "Preoperative radiotherapy and chemoradiation"}, {"id": "s-total-neoadjuvant-therapy", "h": "Total neoadjuvant therapy"}, {"id": "s-selective-omission-of-pelvic-radiation", "h": "Selective omission of pelvic radiation"}, {"id": "s-organ-preservation-and-watch-and-wait", "h": "Organ preservation and watch-and-wait"}, {"id": "s-mismatch-repair-deficient-rectal-cancer", "h": "Mismatch-repair-deficient rectal cancer"}, {"id": "s-frailty-and-surveillance", "h": "Frailty and surveillance"}, {"id": "s-references", "h": "References"}], "html": "<h2 id=\"s-staging-and-anatomy\">Staging and anatomy</h2>\n<h3>Complete staging before treatment selection</h3>\n<p>Complete the local and distant staging assessment before choosing treatment:</p>\n<ul><li>Perform digital rectal examination.</li><li>Perform colonoscopy with biopsy.</li><li>Obtain CT of the chest, abdomen and pelvis to assess distant metastases.</li><li>Use pelvic MRI to define tumour depth, nodal disease, lateral pelvic nodes, extramural vascular invasion, mesorectal fascia or circumferential resection-margin risk, and invasion of adjacent structures.</li><li>Endorectal ultrasonography may supplement local assessment.</li></ul>\n<h3>Preserve sphincter function without compromising local control</h3>\n<ul><li>Sphincter preservation is an explicit quality-of-life objective.</li><li>Upper- and middle-rectal tumours can often be treated by low anterior resection and coloanal anastomosis with preservation of the anal sphincter.</li><li>Distal tumours may require abdominoperineal resection and a permanent colostomy. Preoperative treatment can produce regression that permits sphincter-sparing surgery in selected patients.</li><li>Total mesorectal excision (TME) is the operative backbone for resectable disease. Adequate TME reduces local recurrence to below 10% and improves survival.</li></ul>\n<h2 id=\"s-select-the-treatment-objective-and-sequence\">Select the treatment objective and sequence</h2>\n<h3>Use MRI risk, fitness and the organ-preservation objective</h3>\n<p>The evidence evolved from postoperative radiotherapy and chemotherapy, through preoperative long-course chemoradiation and short-course radiotherapy, to total neoadjuvant therapy (TNT), selective omission of radiotherapy and response-based organ preservation.</p>\n<ul><li>High local risk: for cT4 disease, cN2 disease or a threatened circumferential margin, favour TNT with long-course chemoradiation followed by consolidation chemotherapy. These features fall outside the PROSPECT population.</li><li>Organ preservation: after a clinical complete or near-complete response, watch-and-wait may be feasible only when the patient accepts intensive surveillance and the service can provide prompt salvage.</li><li>Lower local risk: for cT3 disease without a threatened margin and suitable for sphincter-sparing surgery, induction mFOLFOX with response-directed chemoradiation can be considered within the PROSPECT selection criteria. Chemoradiation can be omitted after at least 20% tumour shrinkage.</li><li>Upfront surgery: for cT2N0 disease, proceed to TME. The historical source-note postoperative schema is observation for pT1-2N0, observation or adjuvant chemoradiation for pT3N0, and adjuvant chemoradiation for pT4N0 or pT1-4N1-2 disease; its guideline version and currentness were not verified locally.</li><li>Treatment duration: a typical systemic chemotherapy course totals 15-16 weeks, such as five CAPOX cycles or six FOLFOX cycles. Long-course chemoradiation lasts about 5.5 weeks.</li><li>Frailty: short-course radiotherapy or long-course chemoradiation followed by surgery may be more suitable than intensive TNT. If postoperative chemotherapy is used, choose fluorouracil alone or add oxaliplatin according to the ADORE evidence, fitness, comorbidity and neuropathy risk.</li><li>Mismatch-repair-deficient disease: assess neoadjuvant immunotherapy within the evidence limits described below.</li></ul>\n<p>TNT can improve systemic-treatment delivery and pathological complete response. PRODIGE 23 improved the alpha-protected disease-free-survival endpoint; its later overall-survival comparison favoured TNT but was nominal. When organ preservation is the objective, chemoradiation followed by consolidation chemotherapy produced more TME-free survival in OPRA. When radiotherapy omission is the objective, induction chemotherapy must come first so response can determine whether chemoradiation is required.</p>\n<h3>Define a clinical complete response before watch-and-wait</h3>\n<p>A clinical complete response requires concordant assessment:</p>\n<ul><li>Digital rectal examination: a smooth, flat scar without nodularity.</li><li>Pelvic MRI: a fibrotic, linear scar without clinically suspicious nodal involvement.</li><li>High-definition flexible endoscopy: a pale, smooth scar without ulceration, nodularity or stricture.</li></ul>\n<h2 id=\"s-postoperative-adjuvant-treatment\">Postoperative adjuvant treatment</h2>\n<h3>Understand the historical rationale and its limits</h3>\n<ul><li>Stage I disease has an excellent prognosis with surgery alone; adjuvant treatment is not indicated.</li><li>Historical local-failure estimates were below 10% for T1-2N0, 15-35% for T3N0, and 45-65% for T3-4 node-positive disease.</li><li>For stage II-III disease, the historical adjuvant objective was to improve local control and delay local failure as a component of first relapse.</li><li>Pelvic recurrence is highly morbid and may require extensive salvage surgery, including pelvic exenteration.</li></ul>\n<p>The older evidence established several components of postoperative treatment:</p>\n<ul><li>Postoperative radiotherapy: the 2001 Colorectal Cancer Collaborative Group systematic review reported a 37% relative reduction in annual local-recurrence risk compared with surgery alone.</li><li>GITSG (1985): observation, radiotherapy, semustine/fluorouracil chemotherapy and combined treatment were compared. Combined treatment had the lowest recurrence rate and improved disease-free survival compared with surgery; overall survival did not differ across the four groups.</li><li>NSABP R-01 (1988): chemotherapy improved disease-free and overall survival compared with surgery, whereas radiotherapy reduced locoregional recurrence without a disease-free- or overall-survival benefit. There was no chemoradiation arm.</li><li>Cochrane 2012: across 21 randomised trials, adjuvant chemotherapy reduced relapse (HR 0.75, 95% CI 0.68-0.83) and death (HR 0.83, 95% CI 0.76-0.91) compared with no adjuvant chemotherapy. The contribution of radiotherapy was not assessed.</li><li>Oxaliplatin rationale: evidence that oxaliplatin improves fluoropyrimidine adjuvant treatment was initially extrapolated from resected-colon trials such as MOSAIC and NSABP C-07.</li></ul>\n<h3>Use fluoropyrimidine chemoradiation without routine oxaliplatin intensification</h3>\n<p>The historical postoperative sequence was concurrent chemoradiation followed by chemotherapy, for approximately 6 months of treatment overall. Capecitabine is an alternative to infusional fluorouracil during chemoradiation. REKTUM-III (2012) began as a postoperative trial and was later amended to add a preoperative cohort; 401 patients with stage II-III rectal cancer were enrolled across both cohorts.</p>\n<ul><li>Postoperative capecitabine schedule: capecitabine 1,250 mg/m² twice daily every 3 weeks for two cycles, then chemoradiation with capecitabine 1,650 mg/m² daily, then three further capecitabine cycles.</li><li>Postoperative fluorouracil schedule: bolus fluorouracil every 4 weeks for two cycles, then chemoradiation with fluorouracil 225 mg/m² daily, then two further fluorouracil cycles.</li><li>Preoperative capecitabine schedule: capecitabine chemoradiation, surgery and five 3-weekly adjuvant capecitabine cycles.</li><li>Preoperative fluorouracil schedule: fluorouracil chemoradiation, surgery and four 4-weekly adjuvant fluorouracil cycles.</li><li>Result: 5-year overall survival with capecitabine was non-inferior to fluorouracil (76% vs 67%; non-inferiority P=0.0004). The post-hoc superiority test was borderline (P=0.05), and 3-year disease-free survival was 75% vs 67% (P=0.07).</li><li>Toxicity: hand-foot syndrome was more frequent with capecitabine and leucopenia with fluorouracil.</li></ul>\n<p>A 2021 Chinese phase III trial enrolled 589 patients with resected stage II-III rectal cancer:</p>\n<ul><li>Regimen: postoperative chemoradiation with capecitabine alone or capecitabine plus oxaliplatin.</li><li>Result: oxaliplatin did not improve disease-free or overall survival and increased toxicity.</li><li>Limit: this result supports avoiding routine oxaliplatin intensification during fluoropyrimidine chemoradiation.</li></ul>\n<h3>Select adjuvant FOLFOX after preoperative chemoradiation</h3>\n<p><a class=\"trial-link\" href=\"/evidence/#t-adore-hong\">ADORE (Hong)</a> reported its long-term analysis in 2019 and tested postoperative oxaliplatin after fluoropyrimidine chemoradiation and TME:</p>\n<ul><li>Population: 321 patients with ypStage II-III disease after fluoropyrimidine-only preoperative chemoradiation, R0 TME and performance status 0-1.</li><li>Regimen: fluorouracil 380 mg/m² plus leucovorin 20 mg/m² on days 1-5 every 4 weeks for four cycles, or FOLFOX every 2 weeks for eight cycles.</li><li>Protected result: 3-year disease-free survival was 71.6% with FOLFOX and 62.9% with fluorouracil/leucovorin.</li><li>Long-term result: in the post-hoc analysis, 6-year disease-free survival was 68.2% vs 56.8% (stratified HR 0.63, 95% CI 0.43-0.93; nominal P=0.018).</li><li>Overall survival: 6-year overall survival was 78.1% vs 76.4% (HR 0.73, 95% CI 0.45-1.19; nominal P=0.21), without a confirmed benefit.</li><li>Limit: signals in node-positive, stage III and pN2 disease were post-hoc subgroup findings and do not replace the primary analysis.</li></ul>\n<h2 id=\"s-preoperative-radiotherapy-and-chemoradiation\">Preoperative radiotherapy and chemoradiation</h2>\n<h3>Prefer preoperative to postoperative chemoradiation when pelvic treatment is needed</h3>\n<p>The historical rationale for preoperative chemoradiation:</p>\n<ul><li>Improve local control.</li><li>Reduce radiotherapy toxicity by treating before surgical disruption of pelvic anatomy; late diarrhoea, incontinence and anastomotic stricture were worse with postoperative treatment.</li><li>Increase sphincter-sparing surgery in low-lying tumours.</li><li>Do not expect an overall-survival advantage over postoperative chemoradiation.</li></ul>\n<p><a class=\"trial-link\" href=\"/evidence/#t-german-rectal-cao-aro-aio-94\">German Rectal (CAO/ARO/AIO-94)</a> reported in 2004 and established the preoperative approach:</p>\n<ul><li>Population: 823 patients with ultrasound- and CT-staged, resectable cT3/cT4 or node-positive rectal cancer.</li><li>Regimen: fluorouracil chemoradiation before or after TME; both groups received four postoperative cycles of single-agent fluorouracil.</li><li>Local control: 5-year local recurrence was 6% after preoperative treatment and 13% after postoperative treatment. Pelvic relapse at 10 years was 7% vs 10% (P=0.048).</li><li>Survival: 5-year disease-free survival was 68% vs 65% (nominal P=0.32), and 5-year overall survival was 76% vs 74% (primary-endpoint P=0.80).</li><li>Protocol-radiotherapy toxicity: grade 3-4 acute toxicity was 27% vs 40%, and long-term toxicity 14% vs 24%.</li><li>All-patient sensitivity analysis: acute toxicity was 25% vs 24%, and long-term toxicity 14% vs 15%.</li><li>Late effect: anastomotic stricture was 4% vs 12% (P=0.003).</li><li>Sphincter preservation: among 194 patients judged before randomisation to require abdominoperineal resection, 45/116 (39%) after preoperative treatment and 15/78 (19%) after postoperative treatment received sphincter-preserving surgery. This was an actual-treatment-given subgroup without an interaction test.</li><li>Limits: local recurrence and sphincter preservation were secondary comparisons without multiplicity adjustment; the overall-survival primary endpoint was not met. Clinical staging reflected the methods of its time, and 18% of the postoperative group had pathological stage I disease after resection.</li></ul>\n<p>Tumour regression grade is prognostic after chemoradiation:</p>\n<ul><li>Grade 0: no regression.</li><li>Grade 1: less than 25% regression.</li><li>Grade 2: 25-50% regression.</li><li>Grade 3: more than 50% regression.</li><li>Grade 4: complete regression.</li><li>Higher regression grade was associated with better 5-year disease-free survival.</li></ul>\n<p>A 2011 Korean phase III trial enrolled 240 patients with cT3/cT4 or node-positive disease:</p>\n<ul><li>Regimen: preoperative or postoperative chemoradiation with capecitabine 825 mg/m² twice daily.</li><li>Result: preoperative treatment did not significantly improve local control or survival.</li><li>Low-tumour result: sphincter preservation was 68% vs 42% (P=0.008) with preoperative treatment.</li></ul>\n<h3>Match the radiation schedule to the clinical objective</h3>\n<ul><li>Long-course chemoradiation: 45 Gy in 25 fractions plus a 5.4-Gy boost, for 28 fractions over about 5.5 weeks.</li><li>Concurrent fluoropyrimidine: capecitabine 825 mg/m² on radiotherapy days, or fluorouracil 1,000 mg/m² on days 1-5 and 29-33.</li><li>Short-course radiotherapy: 25 Gy in five fractions.</li><li>Surgery timing: the German Rectal study used approximately 6 weeks after chemoradiation. Historical source-note intervals were 4-12 weeks for ESMO and 5-12 weeks for NCCN; the guideline versions and currentness were not verified locally.</li><li>Historical comparison with surgery alone: Swedish and Dutch trials showed better local control with preoperative short-course radiotherapy.</li></ul>\n<p><a class=\"trial-link\" href=\"/evidence/#t-polish-colorectal-bujko\">Polish Colorectal (Bujko)</a> reported its long-term comparison in 2006:</p>\n<ul><li>Population: 316 patients with resectable cT3/cT4 rectal cancer, no sphincter involvement and a lower tumour margin accessible on digital examination.</li><li>Regimen: 25 Gy in five fractions followed by TME within 7 days, or fluorouracil chemoradiation to 50.4 Gy followed by TME after 4-6 weeks.</li><li>Response: complete response was 0.7% vs 16.1%, and involved circumferential margins 12.9% vs 4.4%, favouring long-course chemoradiation.</li><li>Primary result: sphincter preservation was 61.2% vs 58.0%; the trial did not show an advantage for long-course treatment.</li><li>Other outcomes: permanent stoma, local recurrence, disease-free survival and overall survival did not significantly differ.</li><li>Toxicity: severe acute toxicity was 3.2% vs 18.2%.</li><li>Limit: pathological response did not translate into better sphincter preservation or disease control.</li></ul>\n<p><a class=\"trial-link\" href=\"/evidence/#t-trog-01-04-ngan\">TROG 01.04 (Ngan)</a> reported in 2012 and also compared the two schedules:</p>\n<ul><li>Population: 326 ultrasound/MRI-staged cT3 rectal cancers.</li><li>Regimen: short-course radiotherapy, surgery and adjuvant chemotherapy, or long-course fluorouracil chemoradiation, surgery and adjuvant chemotherapy.</li><li>Primary result: 3-year local recurrence was 7.5% vs 4.4% (P=0.24).</li><li>Other outcomes: distant recurrence, 5-year overall survival (74% vs 70%) and late toxicity did not significantly differ.</li><li>Response: pathological complete response was 1% vs 15%, favouring long-course treatment.</li><li>Limit: this was a null superiority trial, not evidence of equivalence.</li></ul>\n<h3>Do not routinely add oxaliplatin during fluoropyrimidine chemoradiation</h3>\n<ul><li><a class=\"trial-link\" href=\"/evidence/#t-star-01-aschele\">STAR-01 (Aschele)</a>: pathological complete response was 16% in both groups; grade 3-4 toxicity rose from 8% to 24% with oxaliplatin.</li><li><a class=\"trial-link\" href=\"/evidence/#t-accord-12-0405-g-rard\">ACCORD 12/0405 (Gérard)</a>: the intensified Capox50 regimen did not significantly increase pathological complete response (19.2% vs 13.9%; P=0.09) and added toxicity. Follow-up was short and local-control and survival outcomes were not reported.</li><li><a class=\"trial-link\" href=\"/evidence/#t-nsabp-r-04-allegra\">NSABP R-04 (Allegra)</a>: capecitabine met the trial&#x27;s equivalence rule against continuous-infusion fluorouracil as radiosensitiser; 3-year locoregional failure was 11.8% vs 11.2%.</li><li>NSABP R-04 oxaliplatin question: among the 1,315 patients randomised after the amendment, oxaliplatin did not improve locoregional control, disease-free survival or overall survival. Worst grade 3-5 toxicity rose from about 27% to 41%, grade 3-5 diarrhoea from 6.9% to 16.5%, and fewer than 70% completed planned oxaliplatin.</li><li>NSABP R-04 safety signal: on-treatment or within-45-day deaths numbered 10 with capecitabine and 3 with fluorouracil across both protocol periods (nominal P=0.091), despite identical overall survival. This does not establish a fluoropyrimidine survival difference.</li><li><a class=\"trial-link\" href=\"/evidence/#t-cao-aro-aio-04-r-del\">CAO/ARO/AIO-04 (Rödel)</a>: 3-year disease-free survival was 75.9% vs 71.2% (HR 0.79; P=0.03) when oxaliplatin was incorporated into both chemoradiation and postoperative chemotherapy. The design cannot isolate a benefit from concurrent oxaliplatin alone.</li></ul>\n<h2 id=\"s-total-neoadjuvant-therapy\">Total neoadjuvant therapy</h2>\n<h3>Use TNT for high-risk disease or planned organ preservation</h3>\n<p>Compared with chemoradiation followed by postoperative chemotherapy, TNT aims to:</p>\n<ul><li>Improve resectability and pathological complete response.</li><li>Deliver systemic treatment before postoperative tolerance falls and improve treatment completion.</li><li>Improve disease-control outcomes in selected populations.</li><li>Permit response-selected organ preservation in suitable patients.</li></ul>\n<p><a class=\"trial-link\" href=\"/evidence/#t-prodige-23-conroy\">PRODIGE 23 (Conroy)</a> tested induction mFOLFIRINOX:</p>\n<ul><li>Population: 461 patients with cT3 disease judged by a multidisciplinary team to warrant preoperative chemoradiation or cT4 M0 disease; performance status 0-1 and age under 76 years. The source population was 81% cT3 and 18% cT4, with nodal categories N0 10%, N1 64% and N2 26%.</li><li>Experimental regimen: mFOLFIRINOX every 2 weeks for six cycles, long-course chemoradiation with capecitabine 800 mg/m², TME, then 3 months of FOLFOX6 or capecitabine.</li><li>Control regimen: long-course chemoradiation, TME and 6 months of adjuvant chemotherapy.</li><li>Protected result: 3-year disease-free survival was 75.7% vs 68.5%.</li><li>Response: pathological complete response was 59/212 (27.8%) vs 26/215 (12.1%) among operated patients with evaluable pathology (source rounded 28% vs 12%; P&lt;0.0001).</li><li>Long-term result: 7-year disease-free survival was 67.6% vs 62.5% and 7-year overall survival 81.9% vs 76.1%.</li><li>Limit: the long-term comparisons were nominal. Their P values, P=0.048 for disease-free survival and P=0.033 for overall survival, tested restricted-mean-survival-time differences rather than the displayed landmark rates.</li><li>Distant control: 7-year metastasis-free survival was 79.2% vs 72.3%.</li></ul>\n<p><a class=\"trial-link\" href=\"/evidence/#t-rapido-bahadoer\">RAPIDO (Bahadoer)</a> tested short-course radiotherapy followed by chemotherapy:</p>\n<ul><li>Population: 920 patients with at least one MRI high-risk feature, including cT4 disease, cN2 disease, extramural vascular invasion, enlarged lateral nodes or mesorectal fascia involvement.</li><li>Experimental regimen: 5 × 5 Gy, then six 3-weekly CAPOX or 9 2-weekly FOLFOX cycles, approximately 4.5 months of neoadjuvant chemotherapy before TME, with no planned adjuvant chemotherapy.</li><li>Control regimen: long-course chemoradiation, TME and discretionary adjuvant chemotherapy, received by about half in the source account.</li><li>Primary endpoint: disease-related treatment failure, defined as the first locoregional failure, distant metastasis, new colorectal primary or treatment-related death.</li><li>Protected result: 3-year disease-related treatment failure was 23.7% vs 30.4% (HR 0.75; P=0.019); at 5 years it was 27.8% vs 34.0%.</li><li>Response: pathological complete response was 120/423 (28%) vs 57/398 (14%) among resected patients (source P&lt;0.001).</li><li>Distant control: distant metastasis at 5 years was 23.0% vs 30.4%.</li><li>Randomised local-failure analysis: 5-year locoregional failure was 11.7% vs 8.1% (nominal P=0.07) in the eligible randomised population.</li><li>Conditioned analysis: locoregional recurrence was 10.2% vs 6.1% (nominal P=0.027) among patients conditioned on R0/R1 resection, with two nonoperated standard-care progressors included. This is not a clean randomised comparison.</li><li>Survival and limit: 5-year overall survival was 81.7% vs 80.2% at 5.6 years&#x27; median follow-up against a 10-year protocol. The schedule requires refinement for local control.</li></ul>\n<p><a class=\"trial-link\" href=\"/evidence/#t-stellar-jin\">STELLAR (Jin)</a> compared short-course TNT with long-course chemoradiation:</p>\n<ul><li>Population: 599 patients with distal or middle cT3-cT4 or node-positive rectal cancer.</li><li>Experimental regimen: short-course radiotherapy, four 3-weekly CAPOX cycles, TME, then two CAPOX cycles.</li><li>Control regimen: long-course capecitabine chemoradiation, TME, then six 3-weekly CAPOX cycles.</li><li>Three-year result: disease-free survival met the prespecified non-inferiority criterion (64.5% vs 62.3%; HR 0.883; one-sided 95% CI upper bound 1.11, below the 1.43 margin; P&lt;0.001 for non-inferiority). Metastasis-free survival (77.1% vs 75.3%; HR 0.88, 95% CI 0.63-1.24; nominal P=0.475) and locoregional recurrence (8.4% vs 11.0%; HR 0.80, 95% CI 0.45-1.44; nominal P=0.461) were unadjusted secondary comparisons, not non-inferiority tests.</li><li>Five-year result: disease-free survival was 62.0% vs 58.7%, and overall survival 78.1% vs 69.7%.</li><li>Limit: the 5-year overall-survival comparison was nominal and unadjusted. The update did not restate or retest the non-inferiority margin, so the 3-year conclusion cannot be carried forward to 5 years. Post-hoc subgroup interactions do not establish risk-specific effects.</li></ul>\n<p>Polish II tested a shorter TNT programme:</p>\n<ul><li>Population: 541 patients with cT4 or fixed cT3 rectal cancer.</li><li>Regimen: short-course radiotherapy, three FOLFOX cycles and surgery, or long-course chemoradiation containing FOLFOX followed by surgery.</li><li>Result: short-course TNT was not superior for overall survival, pathological complete response, local failure or distant failure.</li><li>Limit: generalisability is restricted by oxaliplatin-containing chemoradiation in the comparator.</li></ul>\n<h3>Use consolidation chemotherapy when organ preservation is the priority</h3>\n<p><a class=\"trial-link\" href=\"/evidence/#t-cao-aro-aio-12-fokas\">CAO/ARO/AIO-12 (Fokas)</a> compared TNT sequences:</p>\n<ul><li>Population: 311 patients with cT3/cT4 or node-positive rectal cancer.</li><li>Regimen: induction FOLFOX followed by chemoradiation, or chemoradiation followed by consolidation FOLFOX.</li><li>Design: a pick-the-winner phase II design against a 15% historical pathological-complete-response rate.</li><li>Result: only the consolidation sequence met its prespecified hypothesis; pathological complete response was 25% vs 17%.</li><li>Limit: the exploratory direct comparison was not conclusive (OR 1.69, 95% CI 0.96-2.99; P=0.071). Chemoradiation completion was better with consolidation sequencing, whereas systemic-chemotherapy completion was better with induction sequencing.</li></ul>\n<h2 id=\"s-selective-omission-of-pelvic-radiation\">Selective omission of pelvic radiation</h2>\n<h3>Restrict omission to lower-risk, resectable disease</h3>\n<p>Chemotherapy before chemoradiation permits a response-directed radiotherapy-sparing strategy. It does not apply to T4 disease, extensive pelvic nodal disease, threatened radial margins or patients unsuitable for sphincter-sparing surgery. <a class=\"trial-link\" href=\"/evidence/#t-prospect-alliance-n1048\">PROSPECT (Alliance N1048)</a> was a 2023 randomised phase II/III non-inferiority trial:</p>\n<ul><li>Population: previously untreated cT2 node-positive or cT3 rectal adenocarcinoma judged by the patient&#x27;s surgeon suitable for sphincter-sparing surgery.</li><li>Exclusions: T4 disease, four or more pelvic nodes with short axis above 10 mm, and tumour within 3 mm of the radial margin.</li><li>Low tumours: there was no numeric tumour-height exclusion. The surgeon-intent criterion filtered out low-lying tumours considered at high risk for incomplete resection, but 173/1,128 treated patients had tumours within 5 cm of the anal verge. Do not extrapolate to low tumours unsuitable for sphincter-sparing surgery.</li><li>Experimental regimen: six preoperative mFOLFOX6 cycles every 2 weeks, then TME after at least 20% tumour shrinkage. Preoperative chemoradiation was used for less than 20% shrinkage (38/585), fewer than six FOLFOX cycles (8/585), or clinician/patient choice after randomisation (7/585).</li><li>Radiation omission: 53/585 (9.1%) received preoperative chemoradiation; 90.9% avoided it before surgery.</li><li>Control regimen: chemoradiation to 50.4 Gy with a concurrent fluoropyrimidine, then TME.</li><li>Postoperative treatment: six FOLFOX cycles after the experimental strategy and eight after control chemoradiation were recommended but not mandatory.</li><li>Primary result: in the 1,128-patient per-protocol population, 5-year disease-free survival was 80.8% vs 78.6% (HR 0.92; two-sided 90.2% CI 0.74-1.14), meeting non-inferiority against the 1.29 margin. The all-1,194-randomised supplemental analysis was concordant.</li><li>R0 resection: 90.4% vs 91.2% on the 585/543 per-protocol denominators; among 535/510 operated patients, R0 resection was 98.9% vs 97.1%. The denominator must accompany either estimate.</li><li>Pathological response: among operated patients, pathological complete response was 21.9% vs 24.3%.</li><li>Local control: 5-year local recurrence was 1.8% vs 1.6% in the per-protocol population, an unadjusted secondary comparison.</li><li>Overall survival: 5-year overall survival was
