blish equivalence, and the point estimates run the other way. Radiotherapy should start with cycle 1 or 2 of chemotherapy. Concurrent delivery is preferred to sequential: JCOG 9104 randomised 231 patients to etoposide–cisplatin with sequential or concurrent thoracic radiotherapy and found a numerically longer median overall survival with concurrent treatment that was not statistically significant (27 versus 20 months), at the cost of more severe oesophagitis. Two meta-analyses found no overall survival difference between starting radiotherapy within 30 days of chemotherapy and starting later, with more haematological, oesophageal and cardiac toxicity in the early group. In an individual-patient-data meta-analysis, the subgroup of trials in which chemotherapy was delivered without dose reduction or delay did favour earlier, shorter radiotherapy (HR 0.79, 95% CI 0.69 to 0.91; Ann Oncol 2016). No interaction test is reported, so that is a gradient rather than a demonstrated effect modification. The benefit of early radiotherapy appears to depend on the chemotherapy being delivered on time alongside it. Where performance status or the dose to organs at risk will not permit that, radiotherapy can be postponed to the third chemotherapy cycle, and sequential chemoradiation remains an option for patients who cannot tolerate concurrent treatment because of performance status, comorbidity or disease volume.</p>\n<h3>Consolidation durvalumab</h3>\n<p><a class=\"trial-link\" href=\"/evidence/#t-adriatic\">ADRIATIC</a> changed the standard. It randomised 730 patients with limited-stage disease and no progression after concurrent platinum-based chemoradiotherapy to consolidation durvalumab 1500 mg every four weeks, durvalumab plus tremelimumab, or placebo, each continued to progression, toxicity or 24 months. Durvalumab improved overall survival (median 55.9 versus 33.4 months; HR 0.73; p=0.01) and progression-free survival (16.6 versus 9.2 months; HR 0.76; p=0.02), with no excess of grade 3 or 4 toxicity (24.4% versus 24.2%; N Engl J Med 2024;391:1313-1327). It is the first immunotherapy to change practice in limited-stage disease, and the durvalumab–tremelimumab arm remains blinded. Pneumonitis was reported in 38.2% versus 30.2%, with no grade breakdown given, against grade 3 or 4 events of any cause in 24.4% versus 24.2%. The gain is 22 months of median overall survival for up to two years of a drug most patients tolerate. ACHILES, a randomised phase 2 trial of one year of atezolizumab versus observation after chemoradiation, improved neither progression-free nor overall survival. The class effect is not established, and durvalumab is what should be prescribed.</p>\n<h3>Prophylactic cranial irradiation</h3>\n<p><a class=\"trial-link\" href=\"/evidence/#t-pci-overview-collaborative-group-aup-rin\">PCI Overview Collaborative Group (Aupérin)</a> pooled individual patient data on 987 patients from seven randomised trials of prophylactic cranial irradiation versus none, all in complete remission after induction chemotherapy with or without thoracic radiotherapy. Irradiation reduced the risk of death (pooled relative risk 0.84, 95% CI 0.73 to 0.97; p=0.01) and raised 3-year survival from 15.3% to 20.7% (N Engl J Med 1999;341:476-484). It reduced the 3-year cumulative incidence of brain metastasis from 58.6% to 33.3% (relative risk 0.46, 95% CI 0.38 to 0.57; p&lt;0.001). Four qualifications apply to those figures.</p>\n<ul><li>The 20.7% and the 33.3% are calculated from the pooled relative risk and the control-group rate assuming proportional hazards, not read off the Kaplan-Meier curves.</li><li>Overall survival was the sole alpha-protected endpoint, so the brain metastasis result and every subgroup analysis carry nominal p-values only.</li><li>The population was 86% limited-stage (847 of 987) and the two arms were imbalanced for stage, with extensive disease in 12% of the irradiated group against 17% of controls (p=0.02), an imbalance driven by one component trial and no longer significant after adjustment for trial; although the authors&#x27; conclusion is not restricted by stage and the stage interaction was not significant (p=0.62), the 140 extensive-stage patients do not by themselves establish benefit there.</li><li>The neurotoxicity question was not answered: only two of the seven trials performed neuropsychological testing, 24% to 60% of the 350 patients assessed were already abnormal before enrolment, and while repeated testing over the first years showed no difference between arms, the authors say longer follow-up is needed.</li></ul>\n<p>Dose affects the risk of brain metastasis; on the evidence it does not affect survival. The modal regimen was 24 Gy in 8 fractions, and the risk of brain metastasis fell as dose rose across the trials (p for trend 0.02), while the effect on survival did not differ by dose (interaction p=0.89). The current practice dose is 25 Gy in 10 fractions. In subgroup analysis, the benefit was seen in the 755 men (relative risk 0.77) and not in the 232 women (relative risk 1.05; p=0.07 for the comparison), which the authors themselves ask to be read with caution as a subgroup finding with between-trial heterogeneity. Patients with performance status 0–1 who have responded to chemoradiation should therefore be offered prophylactic cranial irradiation, though the pooled evidence above comes from patients in complete remission rather than from responders generally. It should not be offered where increasing age, neurocognitive comorbidity or poor performance status raise the neurotoxicity risk. Its role is less well defined in stage I–II disease, where the risk of brain metastasis is lower, and in patients over 70 or who are frail; there, shared decision-making and surveillance MRI are the alternative.</p>\n<h2 id=\"s-extensive-stage-disease\">Extensive-stage disease</h2>\n<h3>The chemotherapy backbone</h3>\n<p>First-line treatment is a platinum doublet, in practice carboplatin AUC 5 on day 1 with etoposide 100 mg/m² on days 1–3 every three weeks. Etoposide is a topoisomerase II inhibitor cleared by the liver and is 94–98% protein bound, so the dose should be reduced in hypoalbuminaemia. Cisplatin and carboplatin are interchangeable here. A meta-analysis of four randomised trials in 663 patients receiving first-line treatment, of whom 32% had limited-stage disease, found no difference between cisplatin-based and carboplatin-based therapy in overall survival (9.6 versus 9.4 months; p=0.37), progression-free survival (5.5 versus 5.3 months; p=0.25) or response rate (67.1% versus 66.0%; p=0.83), with more haematological toxicity from carboplatin and more non-haematological toxicity from cisplatin (JCO 2012). Irinotecan is active in this setting. <a class=\"trial-link\" href=\"/evidence/#t-jcog9511-noda\">JCOG9511 (Noda)</a> randomised 154 untreated patients to irinotecan–cisplatin or etoposide–cisplatin and was closed early at interim for a substantial survival difference (median overall survival 12.8 versus 9.4 months, p=0.002; 2-year overall survival 19.5% versus 5.2%; N Engl J Med 2002;346:85-91). The result was not reproduced in Western populations, notably in SWOG S0124, which limits irinotecan–cisplatin to Japanese practice. Data for carboplatin–irinotecan against carboplatin–etoposide are similarly conflicting, and in limited-stage disease JCOG0202 found no overall survival difference between the two doublets.</p>\n<h3>Adding a checkpoint inhibitor</h3>\n<p>Chemo-immunotherapy is the standard first line, established by two trials with near-identical designs. <a class=\"trial-link\" href=\"/evidence/#t-impower133\">IMpower133</a> randomised 403 untreated patients to carboplatin–etoposide with atezolizumab or placebo for four cycles followed by maintenance, and atezolizumab improved overall survival (median 12.3 versus 10.3 months; HR 0.70; p=0.007) and progression-free survival (5.2 versus 4.3 months; HR 0.77; N Engl J Med 2018;379:2220-2229). <a class=\"trial-link\" href=\"/evidence/#t-caspian\">CASPIAN</a> randomised 805 untreated patients across three arms and showed the same for durvalumab added to platinum–etoposide (median overall survival 13.0 versus 10.3 months; HR 0.73; p=0.0047), with no additional benefit from adding tremelimumab (Lancet 2019;394:1929-1939). In IMpower133 the objective response rate was 60.2% with atezolizumab against 64.4% with placebo, a survival gain without a response gain; CASPIAN&#x27;s response rates ran the other way, 68% versus 58%. The usual reading of a late curve separation is durability in a minority, though no duration-of-response figure is available here. Both trials excluded thoracic radiotherapy and left prophylactic cranial irradiation to the investigator. Both gave the antibody three-weekly during induction; durvalumab then moves to four-weekly in maintenance while atezolizumab stays three-weekly, which is a real argument for durvalumab on visit burden alone. Pembrolizumab is not an option. <a class=\"trial-link\" href=\"/evidence/#t-keynote-604\">KEYNOTE-604</a> randomised 453 untreated patients to etoposide–platinum with pembrolizumab or placebo and improved progression-free survival (median 4.5 versus 4.3 months; HR 0.75; p=0.002) while overall survival did not cross its prespecified significance threshold (median 10.8 versus 9.7 months; HR 0.80; p=0.016; J Clin Oncol 2020;38:2369-2379). The small cell indication was subsequently withdrawn. Three further trials in predominantly Chinese populations report the same direction, with higher medians in all three but hazard ratios spanning 0.63 to 0.8. <a class=\"trial-link\" href=\"/evidence/#t-astrum-005\">ASTRUM-005</a> randomised 585 untreated patients 2:1 to serplulimab or placebo with carboplatin–etoposide, and at a prespecified interim analysis after 246 of the 342 planned deaths, serplulimab improved median overall survival (15.4 versus 10.9 months; HR 0.63; p&lt;0.001 against an interim boundary of 0.012; JAMA 2022;328:1223-1232). Its progression-free survival figure (5.7 versus 4.3 months; HR 0.48, 95% CI 0.38 to 0.59) carries no p-value, and the authors direct that all secondary outcomes be read as exploratory. This was the first phase 3 to show a survival benefit for a PD-1 rather than a PD-L1 inhibitor with chemotherapy in this setting. Generalisability is the limitation the trial names itself: 68% of patients were Chinese, there were no US sites, and median follow-up in the non-Asian patients was 9.1 months. CAPSTONE-1 reported median overall survival of 15.3 versus 12.8 months with adebrelimab (HR 0.72; p=0.0017) in 462 patients, and EXTENTORCH reported 14.6 versus 13.3 months with toripalimab (HR 0.8; p=0.03) in 442 patients. The medians in these trials sit well above those in IMpower133 and CASPIAN, and cross-trial comparison of medians across populations that differ this much is not informative about which drug is better. Escalating to dual checkpoint blockade as maintenance failed. CheckMate 451 randomised 834 patients without progression after up to four cycles of first-line chemotherapy to ipilimumab plus nivolumab, nivolumab alone, or placebo, with median overall survival of 9.2, 10.4 and 9.6 months respectively.</p>\n<h3>Maintenance with lurbinectedin</h3>\n<p><a class=\"trial-link\" href=\"/evidence/#t-imforte\">IMforte</a> produced the first maintenance regimen approved in extensive-stage disease. It randomised 483 patients without progression after four cycles of atezolizumab plus carboplatin–etoposide to maintenance lurbinectedin 3.2 mg/m² three-weekly with G-CSF prophylaxis plus atezolizumab, or atezolizumab alone. Adding lurbinectedin improved progression-free survival, the primary endpoint (median 5.4 versus 2.1 months; HR 0.54; p&lt;0.0001), and overall survival (13.2 versus 10.6 months; HR 0.73; Lancet 2025;405:2129-2143). The survival figures are counted from the start of maintenance rather than from diagnosis, so they are not comparable with the first-line medians above. The cost is myelosuppression: grade 3 or higher toxicity occurred in 38% versus 22%, chiefly anaemia, neutropenia and thrombocytopenia, and the response rate was 19% versus 10%. Patients with brain metastases were excluded, and the regimen requires atezolizumab-based induction, so choosing durvalumab first line forecloses it.</p>\n<h3>Thoracic radiotherapy after first-line chemotherapy</h3>\n<p>Neither CASPIAN nor IMpower133 permitted thoracic radiotherapy, so consolidative radiotherapy in the chemo-immunotherapy era rests on trials that predate it. <a class=\"trial-link\" href=\"/evidence/#t-crest\">CREST</a> randomised 495 patients responding to first-line chemotherapy, all of whom received prophylactic cranial irradiation, to consolidative thoracic radiotherapy 30 Gy in 10 fractions or none. The primary endpoint of 1-year overall survival was not met (33% versus 28%; p=0.66), while 2-year overall survival was better with radiotherapy (13% versus 3%; p=0.004; Lancet 2015;385:36-42). Progression-free survival was also longer (4 versus 3 months; HR 0.73; p=0.001). Since the primary endpoint was missed, the 2-year comparison is descriptive, and 30 Gy in 10 fractions is best regarded as the reference regimen for a selected patient rather than as a proven survival intervention. An earlier randomised trial in 206 patients with an extrathoracic complete response and at least an intrathoracic partial response after three cycles of cisplatin–etoposide also reported improved overall survival with the addition of thoracic radiotherapy (JCO 1999). Consider it in the patient who has responded everywhere and has residual disease confined to the chest.</p>\n<h3>Prophylactic cranial irradiation in extensive-stage disease</h3>\n<p>The two randomised trials here reach opposite conclusions, and the difference between them is MRI. <a class=\"trial-link\" href=\"/evidence/#t-eortc-08993-22993-slotman\">EORTC 08993-22993 (Slotman)</a> randomised 286 patients with any response to first-line chemotherapy to prophylactic cranial irradiation or observation, without mandating a baseline brain MRI. Irradiation reduced symptomatic brain metastases at one year (14.6% versus 40.4%) and improved 1-year overall survival (27.1% versus 13.3%; HR 0.68; p=0.003; N Engl J Med 2007;357:664-672), with median overall survival of 6.7 versus 5.4 months. <a class=\"trial-link\" href=\"/evidence/#t-takahashi-es-sclc-pci\">Takahashi (ES-SCLC PCI)</a> repeated the question in the MRI era. It randomised 224 patients who had responded to chemotherapy and had no brain metastases on MRI to prophylactic cranial irradiation 25 Gy in 10 fractions or three-monthly MRI surveillance with salvage radiotherapy as needed. The trial&#x27;s stated conclusion was that surveillance was non-inferior for overall survival (median 11.6 months with irradiation versus 13.7 months with surveillance; 12-month overall survival 48.4% versus 58.4%; Lancet Oncol 2017;18:663-671), and irradiation added neurocognitive toxicity without a demonstrated survival benefit. No non-inferiority margin is recorded in the sources available here. It did reduce brain metastases (33% versus 59% at one year). NCCN and ESMO now prefer MRI surveillance to routine prophylactic cranial irradiation in extensive-stage disease, and the practical choice is between irradiation and three-monthly MRI in a patient who has responded. MAVERICK (SWOG 1827) is testing the same comparison in a non-Asian population across both stages.</p>\n<h3>Practical problems at presentation</h3>\n<ul><li>Tumour lysis syndrome is a risk in this disease because the tumour responds fast; the patients to watch are those with pre-treatment renal impairment, raised LDH, hyperuricaemia or bulky disease.</li><li>Superior vena cava obstruction is better treated with systemic therapy than with radiotherapy, since the response to chemotherapy is usually rapid.</li><li>Asymptomatic brain metastases do not require radiotherapy before systemic therapy is started; symptomatic ones warrant whole-brain radiotherapy first, and whole-brain treatment is generally preferred to stereotactic radiosurgery because of the propensity to recur intracranially.</li></ul>\n<h2 id=\"s-relapsed-disease\">Relapsed disease</h2>\n<h3>Defining the relapse</h3>\n<p>The relapse category sets the treatment.</p>\n<ul><li>Refractory disease means no response to first-line treatment.</li><li>Resistant relapse means a disease-free interval under three months.</li><li>Sensitive relapse means over three months.</li><li>Late relapse means over six months from first-line chemotherapy.</li></ul>\n<h3>Platinum rechallenge</h3>\n<p>For sensitive relapse, meaning a treatment-free interval of more than three months from first-line chemotherapy, rechallenge with a platinum doublet is the better option, and both NCCN and ESMO endorse it. Two randomised trials support it, and both enrolled at that threshold. The French Lung Cancer Group 01-13 trial randomised 162 patients progressing at least 90 days after first-line treatment to carboplatin–etoposide or topotecan and improved progression-free survival, the primary endpoint (median 4.7 versus 2.7 months; HR 0.57; p=0.0041; Lancet Oncol 2020). In subset analysis the hazard ratio was 0.23 for patients with a platinum-free interval over 180 days against 0.70 for those with an interval of 90–180 days; no interaction test is reported for that difference, so it should be read as a gradient consistent with the biology rather than as a demonstrated effect modification. JCOG0605 randomised 180 patients with the same entry criterion to cisplatin, etoposide and irinotecan or to topotecan, and improved overall survival, the primary endpoint (median 18.2 versus 12.5 months; HR 0.67; p=0.0079; Lancet Oncol 2016). The triplet is cisplatin 25 mg/m² on days 1 and 8, etoposide 60 mg/m² on days 1–3 and irinotecan 90 mg/m² on day 8 every two weeks for five cycles with G-CSF on day 9, which is a demanding regimen for a relapsed patient and needs a performance status to match.</p>\n<h3>Topotecan and lurbinectedin</h3>\n<p>Topotecan is the historical reference. <a class=\"trial-link\" href=\"/evidence/#t-von-pawel\">von Pawel</a> randomised 211 patients relapsing at least 60 days after platinum-based first-line therapy to topotecan or CAV; response rates were similar (24.3% versus 18.3%; p=0.285), as was overall survival (25.0 versus 24.7 weeks), and topotecan gave significantly better control of anorexia, fatigue and dyspnoea (J Clin Oncol 1999;17:658-667). The benefit was in symptoms rather than tumour outcomes. Oral and intravenous topotecan have similar activity, with median overall survival of 33 versus 35 weeks and response rates of 18% versus 22% in a randomised comparison of 309 patients (JCO 2007), and oral topotecan improved survival over best supportive care in 141 relapsed patients (26 versus 14 weeks; p=0.0104; JCO 2006). <a class=\"trial-link\" href=\"/evidence/#t-pm1183-b-005-lurbinectedin\">PM1183-B-005 (Lurbinectedin)</a> brought the first new agent since topotecan. In 105 patients with relapsed or refractory disease after platinum-based chemotherapy, performance status 0–2 and no brain metastases, single-agent lurbinectedin 3.2 mg/m² three-weekly produced an objective response in 35.2% (95% CI 26 to 45%) with a median duration of response of 5.3 months and responses lasting six months or longer in 43%, supporting FDA accelerated approval in June 2020 (Lancet Oncol 2020;21:645-654). Median overall survival was 9.3 months and median progression-free survival 3.5 months. The trial was single-arm, so none of these figures is a comparison.</p>\n<h3>Tarlatamab</h3>\n<p>Tarlatamab is a DLL3-directed bispecific T-cell engager and is now the second-line standard. <a class=\"trial-link\" href=\"/evidence/#t-dellphi-301\">DeLLphi-301</a> treated 220 patients who had received at least two prior lines; in the 10 mg cohort the objective response rate was 40%, median overall survival 14.3 months and median progression-free survival 4.9 months, with grade 3 or higher cytokine release syndrome in 1% (N Engl J Med 2023;389:2063-2075). Cytokine release syndrome of any grade occurred in 51% of that cohort, and ICANS in 9%. The dose-expansion cohorts were not randomised against anything, so none of these figures is a comparison. It received FDA accelerated approval in May 2024. <a class=\"trial-link\" href=\"/evidence/#t-dellphi-304\">DeLLphi-304</a> converted that into a randomised result. In 509 patients relapsing after platinum-based chemotherapy, tarlatamab improved overall survival against investigator&#x27;s choice of topotecan, lurbinectedin or amrubicin (median 13.6 versus 8.3 months; HR 0.60; p&lt;0.001; 12-month overall survival 53% versus 37%), with fewer serious treatment-related adverse events than chemotherapy (N Engl J Med 2025;393:349-361). Progression-free survival was 4.2 versus 3.2 months (HR 0.72; p&lt;0.001) and the response rate 35% versus 20%. Grade 3 or higher toxicity was less than half that of chemotherapy (27% versus 62%). FDA full approval followed in November 2025. The toxicity differs in kind rather than in amount. Cytokine release syndrome occurred in most patients but was largely low grade (42% grade 1, 13% grade 2, 1% grade 3), with a median time to onset of about 13.5 hours, presenting as fever, hypotension, fatigue, tachycardia, headache, hypoxia and vomiting. Neurological toxicity including ICANS presents as headache, peripheral neuropathy, dizziness, confusion, lethargy or disorientation. Both are concentrated in cycle 1, which is why the schedule uses step-up dosing of 1 mg on day 1, 10 mg on day 8 and 10 mg on day 15, then 10 mg two-weekly from cycle 2, with inpatient monitoring, dexamethasone 8 mg intravenously on cycle 1 days 1 and 8, intravenous fluids on cycle 1 days 1, 8 and 15, and tocilizumab on standby. A unit that cannot admit for the first cycle cannot deliver this drug. For early relapse or progression on a platinum rechallenge, the preference order is lurbinectedin, then topotecan or paclitaxel. Where none of those is available or appropriate, gemcitabine, temozolomide and vinorelbine each have reported response rates above 10%; vinorelbine requires central access.</p>\n<h2 id=\"s-small-cell-transformation-of-egfr-mutant-lung-cancer\">Small cell transformation of EGFR-mutant lung cancer</h2>\n<p>Transformation to small cell histology is a recognised resistance mechanism in <em>EGFR</em>-mutant non-small cell lung cancer treated with EGFR tyrosine kinase inhibitors, occurring in 3–5% of patients and concentrated in tumours with co-occurring <em>RB1</em> and <em>TP53</em> mutations. A retrospective series of 67 patients reported a median time to transformation of 17.8 months, median overall survival of 31.5 months from initial diagnosis and 10.9 months from transformation, with a 54% response rate to platinum–etoposide (median progression-free survival 3.4 months) and 50% to a taxane; none of the 17 patients treated with immunotherapy responded (JCO 2019). Treat it as small cell disease with platinum–etoposide, with or without immunotherapy, or with a single-agent taxane. Rebiopsy at progression on an EGFR inhibitor makes the diagnosis, and the series above predicts little benefit from a checkpoint inhibitor in this setting.</p>\n<h2 id=\"s-references\">References</h2>\n<ol class=\"refs\">\n<li><a class=\"trial-link\" href=\"/evidence/#t-pignon-meta-analysis\">Pignon Meta-Analysis</a>. <a href=\"https://drive.google.com/file/d/1zS6eqe3yG4Bo4TnXYZm47ROwFvaNnMDH/preview\">N Engl J Med 1992;327:1618-1624</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-int-0096-turrisi\">INT-0096 (Turrisi)</a>. <a href=\"https://doi.org/10.1056/NEJM199901283400403\">N Engl J Med 1999;340:265-271</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-convert\">CONVERT</a>. <a href=\"https://doi.org/10.1016/S1470-2045(17)30318-2\">Lancet Oncol 2017;18:1116-1125</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-adriatic\">ADRIATIC</a>. <a href=\"https://drive.google.com/file/d/1Oj6AP0zwzfOiNVZGjavo-CaXCUf_zbC4/preview\">N Engl J Med 2024;391:1313-1327</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-pci-overview-collaborative-group-aup-rin\">PCI Overview Collaborative Group (Aupérin)</a>. <a href=\"https://drive.google.com/file/d/1GvYIGQKl3PG_iGA3k-HuO7mWFVXWPD8k/preview\">N Engl J Med 1999;341:476-484</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-jcog9511-noda\">JCOG9511 (Noda)</a>. <a href=\"https://drive.google.com/file/d/1VwRQWvg4kmo1Ytq_kiwuXpkZQRwP0-O8/preview\">N Engl J Med 2002;346:85-91</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-impower133\">IMpower133</a>. <a href=\"https://drive.google.com/file/d/1kzACp_xaQEHG3HOqeLFKxG8NHPR3gu4v/preview\">N Engl J Med 2018;379:2220-2229</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-caspian\">CASPIAN</a>. <a href=\"https://drive.google.com/file/d/1UPPI6boesT5zdJOLVMEy2dtXd14oLKpT/preview\">Lancet 2019;394:1929-1939</a>; <a href=\"https://drive.google.com/file/d/1C1VsI6dk5-DiSB3-mnfkZMHwV-xHOfZl/preview\">Goldman et al. - 2020 - Durvalumab, with or without tremelimumab, plus platinum-etoposide versus platinum-etoposide alone [e3b0fafd]</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-keynote-604\">KEYNOTE-604</a>. <a href=\"https://drive.google.com/file/d/13_lSLm5Qz5WaimioBfkMUyOvipo4G5Nk/preview\">J Clin Oncol 2020;38:2369-2379</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-astrum-005\">ASTRUM-005</a>. <a href=\"https://drive.google.com/file/d/16L-J-FUoMk8aLl7Ovqv5eZG-2RM6xR8W/preview\">JAMA 2022;328:1223-1232</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-imforte\">IMforte</a>. <a href=\"https://drive.google.com/file/d/1GIH2dNSELLIw9umWr3JnGXltv58f3JL0/preview\">Lancet 2025;405:2129-2143</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-crest\">CREST</a>. <a href=\"https://drive.google.com/file/d/1JkttKuoqe5lgyL0EqEt7jLuWZRx38D4D/preview\">Lancet 2015;385:36-42</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-eortc-08993-22993-slotman\">EORTC 08993-22993 (Slotman)</a>. <a href=\"https://drive.google.com/file/d/15OISn-jOvsMHvuduwjQ1jAPQ3AW5rjLz/preview\">N Engl J Med 2007;357:664-672</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-takahashi-es-sclc-pci\">Takahashi (ES-SCLC PCI)</a>. <a href=\"https://drive.google.com/file/d/1LeilwhT9QxwabDLfLplphmo0UmlnsyvG/preview\">Lancet Oncol 2017;18:663-671</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-von-pawel\">von Pawel</a>. <a href=\"https://drive.google.com/file/d/12WbY4EMlY25CCE4fsx-ZaxZm8sM4EKCJ/preview\">J Clin Oncol 1999;17:658-667</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-pm1183-b-005-lurbinectedin\">PM1183-B-005 (Lurbinectedin)</a>. <a href=\"https://drive.google.com/file/d/1qwr9WbTrT1DLkMU0bFdu4N5OS9WRmzZF/preview\">Lancet Oncol 2020;21:645-654</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-dellphi-301\">DeLLphi-301</a>. <a href=\"https://drive.google.com/file/d/1Zn9tWnamkHSySlxxfyMSf6MB7LUI28cL/preview\">N Engl J Med 2023;389:2063-2075</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-dellphi-304\">DeLLphi-304</a>. <a href=\"https://drive.google.com/file/d/1slMV1XbMXQM_0GZG8Jg8oPPwgGGe4kIT/preview\">N Engl J Med 2025;393:349-361</a></li>\n</ol>", "_hay": "small cell lung cancer small-cell-lung-cancer lung biology and clinical behaviour staging and work-up limited-stage disease extensive-stage disease relapsed disease small cell transformation of egfr-mutant lung cancer references stage i and the role of surgery chemoradiation for stage ii–iii disease radiotherapy dose, schedule and timing consolidation durvalumab prophylactic cranial irradiation the chemotherapy backbone adding a checkpoint inhibitor maintenance with lurbinectedin thoracic radiotherapy after first-line chemotherapy prophylactic cranial irradiation in extensive-stage disease practical problems at presentation defining the relapse platinum rechallenge topotecan and lurbinectedin tarlatamab"}, {"id": "melanoma-melanoma", "slug": "melanoma", "group": "Melanoma", "title": "Melanoma", "updated": "", "sections": [{"id": "s-epidemiology", "h": "Epidemiology"}, {"id": "s-risk-factors", "h": "Risk factors"}, {"id": "s-pathology-and-molecular-classification", "h": "Pathology and molecular classification"}, {"id": "s-clinical-presentation-and-diagnosis", "h": "Clinical presentation and diagnosis"}, {"id": "s-staging-and-work-up", "h": "Staging and work-up"}, {"id": "s-management-of-resectable-disease", "h": "Management of resectable disease"}, {"id": "s-management-of-advanced-disease", "h": "Management of advanced disease"}, {"id": "s-therapy-after-anti-pd-1-failure", "h": "Therapy after anti–PD-1 failure"}, {"id": "s-uveal-and-mucosal-melanoma", "h": "Uveal and mucosal melanoma"}, {"id": "s-references", "h": "References"}], "html": "<h2 id=\"s-epidemiology\">Epidemiology</h2>\n<p>Cutaneous melanoma accounts for 1.7% of new cancer diagnoses worldwide (232,100 cases) but only 0.7% of cancer deaths, a gap attributable to screening, early detection and adequate surgery for early-stage disease. It is the fifth commonest cancer in the United States in both sexes, and most patients present with localised disease: 84% stage I–II, 8% regional stage III and 4% metastatic stage IV. Incidence in Singapore is low, at 0.5 cases per 100,000 persons. Because sun-driven cutaneous melanoma is uncommon in Asian populations, the clinicopathological spectrum shifts towards subtypes that are marginal in Caucasian series: acral melanoma (nail beds, palms, soles and hairless skin) accounts for approximately 35–40% and mucosal melanoma for approximately 15–20% of Asian melanomas. Both subtypes were sparsely represented in the registration trials, which limits how directly those data apply to a local practice.</p>\n<h2 id=\"s-risk-factors\">Risk factors</h2>\n<p>Phenotypic factors carry the strongest risk associations.</p>\n<ul><li>Atypical naevi carry the strongest single association (OR 17.4), defined clinically by asymmetry, irregular borders, multiple colours or diameter greater than 5 mm.</li><li>Increased total mole count, a tendency to sunburn, and red hair with blue eyes or Fitzpatrick skin type I complete the phenotype.</li></ul>\n<p>A personal history of melanoma raises risk substantially (OR 12.78), and a history of non-melanoma skin cancer raises it moderately (relative risk 4.28). Immunosuppression from solid organ transplantation, haematopoietic cell transplantation, or HIV infection is an independent risk factor. The environmental driver is ultraviolet exposure. Intermittent intense exposure produces truncal and extremity melanomas, whereas chronic cumulative exposure produces head, neck and arm melanomas. Tanning bed use and residence at latitudes nearer the equator increase risk. Familial melanoma has been linked to germline variants in <em>CDKN2A</em>, <em>MC1R</em> and <em>BAP1</em>; <em>BAP1</em> in particular should prompt consideration of the uveal melanoma and mesothelioma spectrum.</p>\n<h2 id=\"s-pathology-and-molecular-classification\">Pathology and molecular classification</h2>\n<p>Most melanomas begin with a radial growth phase, in which the tumour remains confined to the epidermis, sometimes for years, and is almost always cured by excision alone. Progression to a vertical growth phase, driven by stepwise accumulation of genetic abnormalities, converts the lesion into an expansile nodule that breaches the basement membrane and invades the dermis. That transition creates metastatic risk, and Breslow thickness measures it.</p>\n<p>Superficial spreading melanoma is the commonest subtype, at approximately 75% of all melanomas. It shows lateral growth before invasion, presents as a variably pigmented macule or plaque with an irregular border, and displays multiple shades of red, blue, black, grey and white. More than 60% are diagnosed as thin, highly curable tumours of 1 mm or less. Roughly 30% arise in association with a pre-existing naevus and the remaining 70% arise de novo.</p>\n<p>Nodular melanoma is the second commonest type, at 15–30%. It presents as a darkly pigmented, pedunculated or polypoid papule or nodule, and it defeats the ABCDE rule more often than any other subtype: colour is frequently uniform or amelanotic and pink, borders are symmetric, and the diameter is small. Most are thicker than 2 mm at diagnosis, because the lesion enters vertical growth early. Lentigo maligna melanoma arises in chronically sun-damaged skin in older patients, beginning as a tan or brown macule that enlarges over years. Darker asymmetric foci, colour variegation and raised areas within the precursor in situ lesion signify vertical growth.</p>\n<p>Acral lentiginous melanoma accounts for less than 5% of melanomas in Western series but a far larger share in Asian practice. It occurs on palmar, plantar and subungual surfaces, first appearing as dark brown to black irregularly pigmented macules or patches; raised areas, ulceration, bleeding or larger diameter signify deeper dermal invasion. Subungual melanoma may present as a mass beneath the nail plate with ulceration and nail plate destruction. Amelanotic, spitzoid and desmoplastic melanomas are uncommon subtypes, each with its own diagnostic pitfall. Histopathological diagnosis rests on cytological atypia (melanocytes larger than normal, with large hyperchromatic nuclei, irregular nuclear shape, polymorphism and prominent nucleoli) together with architectural disorder (asymmetry, poor circumscription, and melanocytic nests of varying size and shape). Immunohistochemistry supports lineage but not malignancy.</p>\n<ul><li>S-100 is highly sensitive and poorly specific.</li><li>MART-1/Melan-A is sensitive and specific for melanocytes but does not mark malignant transformation.</li><li>HMB-45 and tyrosinase are the other standard markers.</li></ul>\n<p>Molecular testing in advanced disease should cover <em>BRAF</em> V600, PD-L1, <em>RAS</em>, <em>KIT</em> and <em>NTRK</em>. <em>BRAF</em> V600 status is the only one that changes first-line drug selection; <em>KIT</em> is worth pursuing in acral and mucosal disease.</p>\n<h2 id=\"s-clinical-presentation-and-diagnosis\">Clinical presentation and diagnosis</h2>\n<p>Screen pigmented lesions using the ABCDE criteria:</p>\n<ul><li>Asymmetry, such that one half of a bisected lesion is not identical to the other.</li><li>Border irregularity.</li><li>Colour variegation across red, blue, black, grey or white.</li><li>Diameter of 6 mm or more.</li><li>Evolution in size, shape or colour, or the appearance of a new lesion.</li></ul>\n<p>Evolution detects the nodular and amelanotic lesions that the other four criteria miss. Diagnosis requires excisional or complete biopsy, by saucerisation or deep shave, punch biopsy for small-diameter lesions, or elliptical excision, taking a 1–3 mm margin of normal skin and extending deep enough to encompass the thickest portion of the lesion. A partial or superficial shave that transects the base forfeits accurate Breslow thickness and therefore accurate staging.</p>\n<h2 id=\"s-staging-and-work-up\">Staging and work-up</h2>\n<p>The T category is built on tumour thickness and ulceration, the latter defined as absence of an intact epithelium over the melanoma. Mitotic rate per mm² remains an important prognostic factor at a threshold of 1/mm², but it was a T-category criterion in AJCC 7 and was removed in AJCC 8. The N category distinguishes three forms of intralymphatic spread.</p>\n<ul><li>In-transit metastases lie more than 2 cm from the primary but not beyond the nearest regional nodal basin.</li><li>Satellites lie within 2 cm of the primary.</li><li>Microsatellites are visible only microscopically, defined as tumour nests greater than 0.05 mm in diameter in the reticular dermis, panniculus or vessels beneath the principal invasive tumour, separated from it by at least 0.3 mm of normal tissue on the section in which the Breslow measurement was taken.</li></ul>\n<p>For M disease, serum LDH is an independent prognostic factor and a surrogate for overall tumour burden, annotated as (0) for non-elevated and (1) for elevated.</p>\n<div class=\"tblwrap\"><table><thead><tr><th scope=\"col\">Stage</th><th scope=\"col\">Definition</th><th scope=\"col\">Groupings</th></tr></thead><tbody><tr><td>I</td><td>Low-risk tumours, no regional or distant metastases</td><td>IA T1N0M0; IB T2aN0M0</td></tr><tr><td>II</td><td>Higher recurrence risk, no regional or distant metastases</td><td>IIA T2b/T3aN0M0; IIB T3b/T4aN0M0; IIC T4bN0M0</td></tr><tr><td>III</td><td>Any T, node-positive, M0</td><td></td></tr><tr><td>IV</td><td>Any T, any N, M1</td><td></td></tr></tbody></table></div>\n<p>Older age and male sex carry adverse prognostic weight independent of stage.</p>\n<h3>Sentinel lymph node biopsy</h3>\n<p>Sentinel lymph node biopsy stages and prognosticates; it is not a therapeutic procedure. Its rationale is:</p>\n<ul><li>accurate staging;</li><li>prognostication;</li><li>regional disease control;</li><li>lower morbidity than completion dissection;</li><li>selection for adjuvant therapy.</li></ul>\n<p>Completion lymph node dissection after a positive sentinel node has no established survival role, and ultrasound surveillance is sufficient.</p>\n<div class=\"tblwrap\"><table><thead><tr><th scope=\"col\"></th><th scope=\"col\">MSLT-I (NEJM 2006, NEJM 2014)</th><th scope=\"col\">MSLT-II (NEJM 2017, JAMA Surg 2022)</th></tr></thead><tbody><tr><td>Question</td><td>Does sentinel lymph node biopsy improve outcomes versus nodal observation?</td><td>In sentinel-node-positive patients, does completion lymph node dissection improve outcomes versus ultrasound surveillance?</td></tr><tr><td>Design</td><td>Phase 3: sentinel node biopsy with immediate completion dissection if positive, versus observation with delayed lymphadenectomy at nodal relapse</td><td>Phase 3 in sentinel-node-positive patients: completion dissection versus nodal observation (clinical review and nodal ultrasound 4-monthly for 2 years, 6-monthly for 3 years, then annually)</td></tr><tr><td>Population</td><td>N = 2001; intermediate thickness 1.2–3.5 mm (1347), thin &lt;1.2 mm (340), thick &gt;3.5 mm (314)</td><td>N = 1939</td></tr><tr><td>Primary endpoint</td><td>Melanoma-specific survival; similar at 10 years between observation and biopsy (too few events in thin melanomas for conclusions)</td><td>Melanoma-specific survival; no difference between dissection and observation</td></tr><tr><td>Other findings</td><td>Biopsy improved 10-year disease-free survival. Node-positive patients treated early did better than those treated at palpable relapse. Sentinel node status was the strongest predictor of recurrence or melanoma death on multivariable analysis.</td><td>Dissection reduced regional nodal recurrence but not distant metastasis or overall survival. In the observation arm at 10 years (JAMA Surg 2022), 80% remained free of nodal recurrence; risk factors were age over 50, ulceration, thickness above 3.5 mm, non-axillary basin, and sentinel node tumour burden above 1 mm or area above 5%.</td></tr><tr><td>Morbidity</td><td>Minimal additional morbidity over observation</td><td>Dissection caused more complications, particularly lymphoedema (24% vs 6%, P&lt;0.001)</td></tr><tr><td>Practice impact</td><td>Established sentinel node biopsy as the standard staging and prognostic tool</td><td>Routine completion dissection after a positive sentinel node is unnecessary; ultrasound surveillance is safe and avoids morbidity</td></tr></tbody></table></div>\n<p>DeCOG-SLT reached the same conclusion in a German phase 3 trial of 483 patients with sentinel-node-positive extremity melanoma randomised to completion dissection or observation, with no difference in 5-year distant metastasis-free survival, recurrence-free survival or overall survival. Offer sentinel node biopsy according to the predicted probability of a positive node.</p>\n<ul><li>Biopsy is recommended from T2a upwards, where that probability exceeds 10%, and for T1b disease (thickness 0.8–1 mm, or under 0.8 mm with ulceration), where it is 5–10%.</li><li>For T1a disease, NCCN allows discussion where adverse features are present (age 42 years or younger, head and neck location, lymphovascular invasion, or mitotic index of 2/mm² or more), which predicts a 5–10% probability; ESMO frames the same discussion around 3 or more mitoses/mm², a positive deep margin, or a Breslow thickness that cannot be reliably determined (pTx).</li></ul>\n<p>The MSKCC and Melanoma Institute Australia nomograms calculate that probability. For T3b, T4a and T4b primaries where the patient already qualifies for adjuvant therapy on stage II criteria, omitting sentinel node biopsy can be discussed, but the staging and locoregional-control value should be weighed, particularly for a <em>BRAF</em>-mutant thick stage IIB or IIC primary that could be upstaged to stage III (ESMO). The biopsy should ideally be done in the same setting as wide local excision, since prior wide excision disrupts lymphatic drainage.</p>\n<h3>Imaging for distant metastases</h3>\n<p>Imaging directed at specific signs or symptoms is appropriate at any stage. For asymptomatic patients, NCCN recommends baseline imaging by stage.</p>\n<div class=\"tblwrap\"><table><thead><tr><th scope=\"col\">Stage</th><th scope=\"col\">Baseline imaging</th></tr></thead><tbody><tr><td>0, I, II</td><td>Not recommended unless needed for surgical planning, or before adjuvant therapy in stage IIB/IIC</td></tr><tr><td>IIIA (sentinel node positive)</td><td>Consider CT thorax/abdomen/pelvis for baseline staging or before adjuvant therapy; add CT neck for head and neck primaries</td></tr><tr><td>IIIB/C/D</td><td>CT thorax/abdomen/pelvis, plus neck for head and neck primaries; MRI brain for IIIC/D, which carry higher CNS risk</td></tr><tr><td>IV</td><td>CT thorax/abdomen/pelvis and MRI brain</td></tr></tbody></table></div>\n<p>Whole-body PET-CT is useful to exclude distant metastases in patients being considered for potentially curative resection. Its sensitivity is higher in stage IIIC or IV disease than in less advanced disease (100% versus 84%; Cochrane Database Syst Rev 2019;7:CD012806).</p>\n<h2 id=\"s-management-of-resectable-disease\">Management of resectable disease</h2>\n<h3>Surgery and radiotherapy</h3>\n<p>Definitive treatment is full-depth wide local excision with margins scaled to thickness:</p>\n<ul><li>0.5 cm for in situ melanoma;</li><li>1 cm for tumours of 2 mm or less;</li><li>2 cm for tumours thicker than 2 mm.</li></ul>\n<p>Adjuvant radiotherapy has a very limited role. In TROG 02.01, patients with node-positive melanoma after lymphadenectomy were randomised to adjuvant radiotherapy or observation; radiotherapy roughly halved the risk of in-field relapse but did not improve recurrence-free or overall survival. Definitive radiotherapy to the primary is reserved for patients in whom excision is not possible because of comorbidity, unacceptable surgical morbidity, or refusal of surgery. Palliative radiotherapy and palliative surgery remain appropriate for local control of symptomatic lesions.</p>\n<h3>Adjuvant systemic therapy by stage</h3>\n<p>Stage I to IIA disease, up to T3a (4 mm without ulceration), is managed by surgery and surveillance alone. Recurrence risk is low enough that surgery alone is curative in the great majority, and adjuvant therapy has no role in this group. Two trials have tested adjuvant anti–PD-1 in resected stage IIB and IIC disease.</p>\n<ul><li>In <a class=\"trial-link\" href=\"/evidence/#t-keynote-716\">KEYNOTE-716</a>, adjuvant pembrolizumab for approximately 1 year improved recurrence-free survival versus placebo (HR 0.65) and distant metastasis-free survival (HR 0.64) in resected sentinel-node-negative stage IIB/IIC melanoma (Lancet 2022;399:1718-1729).</li><li><a class=\"trial-link\" href=\"/evidence/#t-checkmate-76k\">CheckMate 76K</a> reproduced the result with nivolumab 480 mg 4-weekly (12-month recurrence-free survival 89.0% vs 79.4%, HR 0.42; distant metastasis-free survival HR 0.47; Nat Med 2023;29:2835-2843).</li></ul>\n<p>With longer follow-up the separation persists, at 4 years in the pembrolizumab trial (recurrence-free survival 71% vs 58%; distant metastasis-free survival 81% vs 70%) and at 3 years in the nivolumab trial (71% vs 61% and 79% vs 74% respectively). Overall survival is immature in both, so a node-negative patient is weighing a year of immune toxicity against an absolute recurrence-free survival difference of roughly 10 percentage points. Adjuvant therapy in stage IIIA disease depends on which AJCC edition defines the stage. Entry to the pivotal adjuvant trials was based on AJCC 7, and AJCC 7 stage IIIA identifies a higher-risk group than AJCC 8 stage IIIA, which incorporates Breslow thickness (5-year melanoma-specific survival 78% versus 93% respectively). AJCC 7 stage IIIA patients were either excluded outright or required more than 1 mm of sentinel node tumour burden to enter. For a patient with AJCC 8 stage IIIA disease and less than 1 mm of sentinel node burden, adjuvant therapy is therefore not supported by prospective evidence and surveillance is the standard. Above 1 mm of sentinel node burden, a year of adjuvant anti–PD-1 is appropriate. For resected stage IIIB to IV disease the choice is between a year of anti–PD-1 and, for <em>BRAF</em> V600-mutant tumours, a year of BRAF/MEK inhibition. <a class=\"trial-link\" href=\"/evidence/#t-keynote-054-eortc-1325\">KEYNOTE-054 (EORTC 1325)</a> established pembrolizumab 200 mg 3-weekly for approximately 1 year against placebo in completely resected high-risk stage III disease (1-year recurrence-free survival 75.4% vs 61.0%, HR 0.57; N Engl J Med 2018;378:1789-1801), with consistent benefit across subgroups including <em>BRAF</em> wild-type. The separation is maintained on long follow-up, with 7-year recurrence-free survival of 50% versus 36% and distant metastasis-free survival of 54% versus 42%. <a class=\"trial-link\" href=\"/evidence/#t-checkmate-238\">CheckMate 238</a> randomised resected stage IIIB/C or IV disease to nivolumab or high-dose ipilimumab: nivolumab improved recurrence-free survival (12-month recurrence-free survival 70.5% vs 60.8%, HR 0.65) with far less grade 3–4 toxicity (14% vs 46%; N Engl J Med 2017;377:1824-1835). At 5 years distant metastasis-free survival was 58% versus 51% and overall survival 76% versus 72%, so the case for nivolumab over ipilimumab rests on recurrence and toxicity rather than on a demonstrated survival advantage. <a class=\"trial-link\" href=\"/evidence/#t-eortc-18071\">EORTC 18071</a> is no longer used in practice. Adjuvant ipilimumab 10 mg/kg improved both recurrence-free and overall survival against placebo (5-year overall survival 65.4% vs 54.4%, HR 0.72) but caused grade 3–4 immune toxicity in approximately 54% of patients and five treatment-related deaths (Lancet Oncol 2015;16:522-530). Recurrence-free survival medians were 26.1 versus 17.1 months (HR 0.75) and 7-year distant metastasis-free survival 44.5% versus 37% (HR 0.76). It proved the principle of adjuvant checkpoint blockade and was then displaced by anti–PD-1 on toxicity grounds alone. Escalating adjuvant immunotherapy to a doublet has not improved outcomes in the standard resected population. CheckMate 915 randomised resected stage IIIB/C/D or IV disease to nivolumab plus low-dose ipilimumab versus nivolumab alone and found no recurrence-free survival difference (2-year recurrence-free survival 65% vs 63%). The exception is stage IV rendered disease-free surgically, where IMMUNED randomised patients with no evidence of disease to nivolumab plus ipilimumab, nivolumab alone, or placebo: both active arms improved recurrence-free survival over placebo (HR 0.25 for the doublet and 0.60 for nivolumab). Four-year overall survival was 83.8% with the doublet and 72.6% with nivolumab, against 63.1% with placebo (hazard ratios versus placebo 0.41 and 0.74 respectively). The doublet dose in IMMUNED was ipilimumab 3 mg/kg with nivolumab 1 mg/kg, not the low-dose adjuvant schedule of CheckMate 915, which is why CheckMate 915 cannot be read as refuting IMMUNED. For <em>BRAF</em> V600E/K-mutant resected stage III disease, <a class=\"trial-link\" href=\"/evidence/#t-combi-ad\">COMBI-AD</a> established 12 months of dabrafenib plus trametinib against placebo (3-year relapse-free survival 58% vs 39%, HR 0.47; N Engl J Med 2017;377:1813-1823), with 5-year distant metastasis-free survival of 65% versus 54% (HR 0.55) and an overall survival hazard ratio of 0.80 with both medians not reached. In a <em>BRAF</em>-mutant patient both are options, and the decision turns on toxicity profile and what is held in reserve: the BRAF/MEK doublet gives predictable, reversible, high-frequency toxicity over 12 months, whereas anti–PD-1 gives lower-frequency but potentially permanent endocrine and organ-specific toxicity. The two drugs have different toxicity profiles.</p>\n<ul><li>Dabrafenib produces common and irritating problems, chiefly pyrexia, rash and arthralgia.</li><li>Trametinib produces rare but serious ones, chiefly ocular toxicity, venous thromboembolism, haemorrhage, cardiomyopathy and pneumonitis.</li></ul>\n<p>Monitoring covers liver function, glucose, febrile reactions, skin toxicity and left ventricular ejection fraction. In <a class=\"trial-link\" href=\"/evidence/#t-keynote-942-mrna-4157-v940\">KEYNOTE-942 (mRNA-4157/V940)</a>, a randomised phase IIb trial of 157 patients with resected high-risk stage IIIB–IV melanoma, intismeran autogene plus pembrolizumab prolonged recurrence-free survival over pembrolizumab alone (18-month recurrence-free survival 79% vs 62%, HR 0.56), with benefit sustained at 3 and 5 years and an approximately 49% reduction in recurrence or death (Lancet 2024;403:632-644). This is the first randomised signal for an individualised cancer vaccine, and it remains phase II; the confirmatory phase 3 trial (V940-001) is ongoing.</p>\n<h3>Neoadjuvant therapy</h3>\n<p>Neoadjuvant immunotherapy is now the preferred approach for macroscopic, resectable stage III melanoma in centres able to deliver it, though it was not FDA-approved as of August 2025. Candidates are:</p>\n<ul><li>patients with resectable stage III disease confined to lymph nodes clinically or radiologically;</li><li>selected patients with resectable in-transit metastases or oligometastatic stage IV disease.</li></ul>\n<p><a class=\"trial-link\" href=\"/evidence/#t-nadina\">NADINA</a> randomised 423 patients with resectable macroscopic stage III melanoma, 97% of whom had at least one PET-positive node, to two cycles of neoadjuvant ipilimumab 80 mg plus nivolumab 240 mg 3-weekly followed by therapeutic lymph node dissection and response-driven adjuvant therapy, versus upfront dissection followed by 12 cycles of adjuvant nivolumab. The neoadjuvant strategy improved event-free survival (12-month event-free survival 83.7% vs 57.2%, HR 0.32; N Engl J Med 2024;391:1696-1708), and the benefit held regardless of <em>BRAF</em> mutation status. Approximately 59% of patients achieved a major pathological response and received no adjuvant therapy, and pathological response predicted recurrence-free survival. The pathological complete response rate was 47.2%.</p>\n<p><a class=\"trial-link\" href=\"/evidence/#t-swog-s1801\">SWOG S1801</a> tested the same sequencing question holding the drug constant and varying only its timing. It randomised 313 patients with resectable stage IIIB to oligometastatic stage IV melanoma to three cycles of neoadjuvant pembrolizumab followed by surgery and 15 adjuvant cycles, versus surgery followed by 1 year of adjuvant pembrolizumab. The perioperative arm improved event-free survival (2-year event-free survival 72% vs 49%, HR 0.58; N Engl J Med 2023;388:813-823). The pathological complete response rate was 21%. Since the total drug exposure was identical, the result is attributable to sequencing: priming the immune response while the bulk of antigen is still in situ.</p>\n<h2 id=\"s-management-of-advanced-disease\">Management of advanced disease</h2>\n<h3>First-line therapy in <em>BRAF</em> wild-type disease</h3>\n<p>The first-line choice is between dual and single-agent checkpoint blockade. <a class=\"trial-link\" href=\"/evidence/#t-checkmate-067\">CheckMate 067</a> randomised untreated advanced melanoma to nivolumab plus ipilimumab, nivolumab alone, or ipilimumab alone, and both nivolumab-containing arms improved progression-free survival (11.5 and 6.9 versus 2.9 months) and objective response (58% and 44% versus 19%) over ipilimumab, with durable long-term survival on extended follow-up (N Engl J Med 2015;373:23-34). Median overall survival was 72.1 months for the doublet and 37.6 months for nivolumab, against 19.9 months for ipilimumab. The two nivolumab-containing arms were not designed for head-to-head comparison, and in the overall population the doublet improved progression-free survival but not overall survival relative to nivolumab alone. The apparent superiority of the doublet in CheckMate 067 is a cross-arm comparison the trial does not license. Toxicity is higher with the doublet. Grade 3 or higher treatment-related adverse events occurred in 63% of patients on nivolumab plus ipilimumab, 25% on nivolumab and 30% on ipilimumab. In <a class=\"trial-link\" href=\"/evidence/#t-relativity-047\">RELATIVITY-047</a>, fixed-dose nivolumab plus relatlimab, an anti–LAG-3 antibody, improved progression-free survival over nivolumab alone (median 10.1 vs 4.6 months, HR 0.75; N Engl J Med 2022;386:24-34), with median overall survival of 51.0 versus 34.1 months (HR 0.80) and objective response in 43% versus 33%. Grade 3 or higher treatment-related adverse events occurred in 22% versus 12%, roughly a third of the doublet&#x27;s rate in CheckMate 067. LAG-3 plus PD-1 blockade is therefore a reasonable first-line option where the toxicity of nivolumab plus ipilimumab is unacceptable, and it is a direct randomised test of an intensified checkpoint regimen against anti–PD-1 monotherapy, which CheckMate 067 does not provide. Two earlier trials tested ipilimumab and pembrolizumab in advanced melanoma.</p>\n<ul><li><a class=\"trial-link\" href=\"/evidence/#t-mdx010-20-ipilimumab\">MDX010-20 (ipilimumab)</a> was the first trial to improve survival in advanced melanoma, comparing ipilimumab with or without gp100 vaccine against vaccine alone in previously treated HLA-A*0201-positive disease (median overall survival 10.0 vs 6.4 months, HR approximately 0.66; N Engl J Med 2010;363:711-723).</li><li><a class=\"trial-link\" href=\"/evidence/#t-keynote-006\">KEYNOTE-006</a> then displaced ipilimumab as first-line therapy, showing that pembrolizumab improved overall survival (1-year overall survival approximately 74% vs 58%; HR 0.63–0.69) and progression-free survival with less high-grade toxicity (N Engl J Med 2015;372:2521-2532); on long follow-up median overall survival was 32.7 versus 15.9 months, progression-free survival 8.4 versus 3.4 months and objective response 42% versus 17%.</li></ul>\n<p>Anti–PD-1, alone or in combination, is the backbone of first-line therapy on the strength of those two results. The chemotherapy comparisons that preceded them are of historical interest only: ipilimumab plus dacarbazine improved overall survival over dacarbazine in CA184-024 (11.2 vs 9.1 months, HR 0.72) and nivolumab improved it in CheckMate 066 (37.3 vs 11.2 months, HR 0.50).</p>\n<h3>First-line therapy in <em>BRAF</em> V600-mutant disease</h3>\n<p>Immunotherapy works in <em>BRAF</em>-mutant melanoma, and the sequencing question is which modality to use first, not whether to use both. ESMO recommends first-line nivolumab plus ipilimumab where it can be safely delivered over the first few months, that is where the disease is not so aggressive or symptomatic that a rapid response is required, with targeted therapy reserved for later lines. <a class=\"trial-link\" href=\"/evidence/#t-dreamseq-ea6134\">DREAMseq (EA6134)</a> randomised 265 patients with untreated <em>BRAF</em> V600-mutant metastatic melanoma to nivolumab plus ipilimumab followed by dabrafenib plus trametinib at progression, or the reverse sequence. Starting with immunotherapy gave a higher 2-year overall survival than starting with targeted therapy (71.8%, 95% CI 62.5 to 79.1, versus 51.5%, 95% CI 41.7 to 60.4; log-rank P=.010 on Kaplan-Meier estimates; J Clin Oncol 2023;41:186-197). The protocol-specified primary comparison, a Mantel-Haenszel test of 2-year landmark rates among the 176 patients followed for at least 2 years, did not cross its efficacy boundary (P=.163). The trial was stopped early on the recommendation of the data safety monitoring committee after the Kaplan-Meier analysis crossed the O&#x27;Brien-Fleming boundary at 59% information time, with a 95% repeated confidence interval for the difference of 2.6% to 37.9%. The direction and magnitude of the effect are convincing enough to have changed practice, but the formal primary test was not met, and the estimate carries the imprecision of early stopping. The remaining efficacy figures were concordant. Two-year progression-free survival was 42% versus 19% with medians of 12 versus 9 months, response rates across the two sequenced steps were 46% then 48% for the immunotherapy-first sequence and 43% then 30% for the targeted-first sequence, and median duration of response was not reached with immunotherapy first versus 13 months with targeted therapy first (P&lt;0.001). The duration-of-response difference explains the shape of the curves.</p>\n<p>A proportion of patients progress early on immunotherapy while responders go on to sustained benefit, so the Kaplan-Meier curves cross before separating in favour of the immunotherapy-first sequence. A rapidly symptomatic patient with high tumour burden may therefore still be started on targeted therapy. <a class=\"trial-link\" href=\"/evidence/#t-secombit-ascierto\">SECOMBIT (Ascierto)</a> tested the same question in a non-comparative randomised phase II design with three arms:</p>\n<ul><li>encorafenib plus binimetinib until progression then ipilimumab plus nivolumab;</li><li>ipilimumab plus nivolumab then encorafenib plus binimetinib;</li><li>an 8-week induction of encorafenib plus binimetinib followed by ipilimumab plus nivolumab and then re-treatment with encorafenib plus binimetinib at progression.</li></ul>\n<p>All three arms exceeded the prespecified overall survival threshold, with 2-year and 3-year overall survival of 65% and 54% for the targeted-first arm, 73% and 62% for the immunotherapy-first arm, and 69% and 60% for the sandwich arm (J Clin Oncol 2023;41:212-221). The trial was not designed for between-arm comparison, so the ordering is a trend rather than a result, but it is concordant with DREAMseq. <a class=\"trial-link\" href=\"/evidence/#t-ebin-robert\">EBIN (Robert)</a> tested the sandwich strategy. In 271 patients with untreated unresectable stage III/IV <em>BRAF</em> V600E/K-mutant melanoma, 12 weeks of encorafenib plus binimetinib before nivolumab plus ipilimumab gave no progression-free survival benefit over going straight to the checkpoint doublet (median 9 versus 9 months, HR 0.87), at the cost of more grade 3–5 treatment-related adverse events (42% versus 32%; Lancet Oncol 2025;26:781-794). Short targeted induction to debulk before immunotherapy is therefore not supported.</p>\n<h3>BRAF and MEK inhibition</h3>\n<p>Three BRAF inhibitors (vemurafenib, dabrafenib, encorafenib) and three MEK inhibitors (trametinib, cobimetinib, binimetinib) are in use, and they are given as fixed pairings. <a class=\"trial-link\" href=\"/evidence/#t-brim-3\">BRIM-3</a> first proved the target, with vemurafenib reducing the risk of death by 63% versus dacarbazine in the primary analysis (HR 0.37) and prolonging progression-free survival (5.3 vs 1.6 months; N Engl J Med 2011;364:2507-2516). Single-agent trametinib and dabrafenib showed the same pattern against chemotherapy in METRIC (progression-free survival 4.8 vs 1.5 months, HR 0.45; objective response 40% vs 14%) and BREAK-3 (5.1 vs 2.7 months, HR 0.30; objective response 50% vs 6%), with overall survival estimates confounded by crossover. Adding a MEK inhibitor to a BRAF inhibitor improved response, progression-free survival and overall survival in each of the randomised comparisons, and it reduces the cutaneous toxicity of BRAF inhibition by suppressing paradoxical MAPK activation in BRAF wild-type keratinocytes.</p>\n<ul><li><a class=\"trial-link\" href=\"/evidence/#t-cobrim\">coBRIM</a> showed that adding cobimetinib to vemurafenib improved progression-free survival (9.9 vs 6.2 months, HR 0.51) and response rate (N Engl J Med 2014;371:1867-1876), with median overall survival of 22.5 versus 17.4 months (HR 0.70) and objective response in 68% versus 45%.</li><li><a class=\"trial-link\" href=\"/evidence/#t-combi-v\">COMBI-v</a> showed dabrafenib plus trametinib to be superior to vemurafenib on overall survival (12-month overall survival 72% vs 65%, HR 0.69) and progression-free survival (11.4 vs 7.3 months; N Engl J Med 2015;372:30-39), with median overall survival of 25.6 versus 18 months and objective response in 64% versus 51%.</li><li>The dabrafenib/trametinib doublet was also superior to dabrafenib alone in COMBI-d (overall survival 25.1 vs 18.7 months, HR 0.71; progression-free survival 11 vs 8.8 months, HR 0.67; objective response 67% vs 51%).</li><li><a class=\"trial-link\" href=\"/evidence/#t-columbus\">COLUMBUS</a> completed the set, with encorafenib plus binimetinib improving progression-free survival over vemurafenib (14.9 vs 7.3 months, HR 0.54) and a favourable tolerability profile (Lancet Oncol 2018;19:603-615); median overall survival was 33.6 versus 16.9 months against vemurafenib and 33.6 versus 23.4 months against encorafenib alone, with objective response of 64%, 41% and 52% respectively.</li></ul>\n<p>The choice between the three doublets is made on toxicity and schedule rather than on efficacy.</p>\n<h2 id=\"s-therapy-after-anti-pd-1-failure\">Therapy after anti–PD-1 failure</h2>\n<p>Progression on anti–PD-1 is now the commonest advanced-melanoma problem in clinic. The choice of salvage turns on <em>BRAF</em> status, on whether the disease is injectable, and on access to cell therapy. For <em>BRAF</em>-mutant disease, switch modality.</p>\n<ul><li>Patients who received checkpoint blockade first move to a BRAF/MEK doublet.</li><li>Patients who received targeted therapy first move to checkpoint blockade.</li></ul>\n<p>For <em>BRAF</em> wild-type disease the options are re-challenge with CTLA-4 blockade, cellular therapy, or an oncolytic approach for injectable disease. SWOG S1616, a randomised phase II trial of 92 patients progressing on anti–PD-1, tested whether CTLA-4 blockade could reverse resistance: nivolumab plus ipilimumab improved progression-free survival over ipilimumab alone (6-month progression-free survival 34% vs 13%, HR 0.63) and objective response (28% vs 9%, P=0.05, with 12% complete and 16% partial responses and a median duration of response of 40.9 months), at the cost of more grade 3 or higher treatment-related events (57% vs 35%, P=0.09); it was not powered for overall survival. Adding an anti–LAG-3 antibody in this setting is far less productive: in RELATIVITY-020 Part D, a phase I/IIa study of 518 patients who had progressed on one or more anti–PD-1 regimens, nivolumab plus relatlimab produced objective response in 12% with median progression-free survival of 2.1 months after one prior anti–PD-1 regimen, and 9.2% with 3.1 months after more than one. Adoptive cell therapy has produced the highest response rates reported in this setting. <a class=\"trial-link\" href=\"/evidence/#t-rohaan-til-vs-ipilimumab\">Rohaan (TIL vs ipilimumab)</a> randomised 168 patients with unresectable stage IIIC/IV melanoma, 86% refractory to anti–PD-1, to tumour-infiltrating lymphocyte therapy after non-myeloablative lymphodepletion followed by high-dose interleukin-2, or to ipilimumab. TIL therapy improved progression-free survival (median 7.2 vs 3.1 months, HR 0.50), with objective response in 49% versus 21% and median overall survival of 25.8 versus 18.9 months (N Engl J Med 2022;387:2113-2125). <a class=\"trial-link\" href=\"/evidence/#t-c-144-01-lifileucel\">C-144-01 (lifileucel)</a> then supported registration on a single-arm basis in melanoma refractory to anti–PD-1 and, where indicated, to BRAF/MEK inhibition, with an objective response rate of 31.4% and a median duration of response of 36.5 months (J Clin Oncol 2025;43:3565-3572); lifileucel is the first FDA-approved cellular therapy for a solid tumour. The limiting factor is the regimen: cyclophosphamide and fludarabine lymphodepletion followed by high-dose interleukin-2 confines the approach to fit patients at centres with the infrastructure to deliver it. <a class=\"trial-link\" href=\"/evidence/#t-optim-t-vec\">OPTiM (T-VEC)</a> randomised unresectable stage IIIB–IV melanoma to intralesional talimogene laherparepvec or subcutaneous GM-CSF, improving durable response rate (16% vs 2%) and objective response (26% vs 6%; J Clin Oncol 2015;33:2780-2788). It was the first oncolytic immunotherapy approved for melanoma and remains useful where disease is accessible and the priority is local control. <a class=\"trial-link\" href=\"/evidence/#t-ignyte-rp1\">IGNYTE (RP1)</a> extends the oncolytic principle into the anti–PD-1-failed setting by combining a modified herpes simplex virus with nivolumab. In the registration-intended cohort of 140 patients with confirmed progression while on at least 8 weeks of anti–PD-1 as the last prior therapy, including progression on adjuvant anti–PD-1 (36 of 140 patients), intratumoural RP1 plus nivolumab produced an objective response in 33.6% by modified RECIST, the primary endpoint (95% CI 25.8 to 42.0), and 32.9% by conventional RECIST with a complete response rate of 15.0% (J Clin Oncol 2025;43:3589-3599). Responses were durable, with a median duration of 33.7 months (95% CI 14.1 to not reached) and 69.5% of responses ongoing at 1 year. Uninjected lesions regressed nearly as often as injected ones, with a 30% or greater reduction in 79.0% of 119 uninjected lesions versus 93.6% of 78 injected lesions among responders. Whole-cohort progression-free survival was 3.6 months (95% CI 2.0 to 5.0), against overall survival of 75.3% at 1 year and 63.3% at 2 years with the median not reached. Treatment-related adverse events were near-universal but mostly mild (any grade 90.0%; grade 3 or 4 12.9%), with five grade 4 events including myocarditis and splenic rupture and no treatment-related deaths. The trial is single-arm, so none of these figures is a comparison. Ablative therapy directed at oligometastatic sites remains appropriate alongside any of these systemic options, and a clinical trial is appropriate for most patients whose disease has progressed on anti–PD-1.</p>\n<h2 id=\"s-uveal-and-mucosal-melanoma\">Uveal and mucosal melanoma</h2>\n<p>Uveal melanoma has a different driver set from cutaneous melanoma and responds poorly to checkpoint blockade, and until recently nothing improved survival in the metastatic setting. <a class=\"trial-link\" href=\"/evidence/#t-imcgp100-202-tebentafusp\">IMCgp100-202 (tebentafusp)</a> tested tebentafusp, a bispecific gp100×CD3 ImmTAC, in untreated HLA-A*02:01-positive metastatic uveal melanoma. It improved overall survival over investigator&#x27;s choice of pembrolizumab, ipilimumab or dacarbazine (median 21.7 vs 16.0 months, HR 0.51; N Engl J Med 2021;385:1196-1206), despite low response rates. That dissociation between response and survival is characteristic of the agent and means radiological response should not be used to decide whether to continue it. Because the drug presents a gp100 peptide in the context of HLA-A*02:01, patients without the allele cannot receive it. In first-line HLA-A*02:01-negative metastatic uveal melanoma, <a class=\"trial-link\" href=\"/evidence/#t-optimum-02\">OptimUM-02</a> showed that darovasertib, a protein kinase C inhibitor, plus crizotinib improved progression-free survival over investigator&#x27;s choice of pembrolizumab, ipilimumab plus nivolumab, or dacarbazine (median 6.9 versus 3.1 months; HR 0.42; P&lt;0.0001), with objective response in 37.1% versus 5.8% (J Clin Oncol 2026;44(suppl 17):LBA9503). This is the first randomised trial to show benefit in the population tebentafusp cannot treat. Three qualifications apply.</p>\n<ul><li>These are the phase 2 efficacy primary results of a nested phase 2/3 trial.</li><li>Overall survival is the phase 3 primary endpoint and has not been reported.</li><li>The source is an ASCO 2026 abstract rather than a full publication.</li></ul>\n<p>Mucosal melanoma responds poorly to single-agent checkpoint blockade, and early evidence combines anti–PD-1 with VEGF-directed therapy. <a class=\"trial-link\" href=\"/evidence/#t-sheng-et-al-toripalimab-axitinib\">Sheng et al (toripalimab + axitinib)</a> enrolled 33 treatment-naive patients with metastatic mucosal melanoma in a phase Ib study. Toripalimab plus axitinib achieved an objective response rate of 48.3% among response-evaluable patients, with median progression-free survival of 7.5 months (J Clin Oncol 2019;37:2987-2999). The sample is small and uncontrolled, but the response rate is high for a subtype largely resistant to single-agent checkpoint blockade, and the combination is a reasonable option where a trial is not available. <em>KIT</em> testing is worthwhile in mucosal and acral disease, since a minority carry activating mutations amenable to KIT inhibition.</p>\n<h2 id=\"s-references\">References</h2>\n<ol class=\"refs\">\n<li><a class=\"trial-link\" href=\"/evidence/#t-keynote-716\">KEYNOTE-716</a>. <a href=\"https://drive.google.com/file/d/1Jj6zHgtYS8SVG83UPhoWiz8kQR69L_LM/preview\">Lancet 2022;399:1718-1729</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-checkmate-76k\">CheckMate 76K</a>. <a href=\"https://drive.google.com/file/d/1Y6h4i3jjUqvzFiKJf5md3sriQG2TtHfI/preview\">Nat Med 2023;29:2835-2843</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-keynote-054-eortc-1325\">KEYNOTE-054 (EORTC 1325)</a>. <a href=\"https://drive.google.com/file/d/18uYdsifEAOl1P4L6lT3frr53ZALDkccZ/preview\">N Engl J Med 2018;378:1789-1801</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-checkmate-238\">CheckMate 238</a>. <a href=\"https://drive.google.com/file/d/1Q4gmQzXiRqI-xjZFXnfGCf0LjnQhPxfu/preview\">N Engl J Med 2017;377:1824-1835</a>; <a href=\"https://drive.google.com/file/d/1jSB0Ql5PRCGjzwemtZTmgAM99GHlnocD/preview\">N Engl J Med 2026;394:333-342</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-eortc-18071\">EORTC 18071</a>. <a href=\"https://doi.org/10.1016/S1470-2045(15)70122-1\">Lancet Oncol 2015;16:522-530</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-combi-ad\">COMBI-AD</a>. <a href=\"https://doi.org/10.1056/NEJMoa1708539\">N Engl J Med 2017;377:1813-1823</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-keynote-942-mrna-4157-v940\">KEYNOTE-942 (mRNA-4157/V940)</a>. <a href=\"https://doi.org/10.1016/S0140-6736(23)02268-7\">Lancet 2024;403:632-644</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-nadina\">NADINA</a>. <a href=\"https://drive.google.com/file/d/17guefDSLq9BwPGNny_9k4DLp-In5Q1ku/preview\">N Engl J Med 2024;391:1696-1708</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-swog-s1801\">SWOG S1801</a>. <a href=\"https://doi.org/10.1056/NEJMoa2211437\">N Engl J Med 2023;388:813-823</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-checkmate-067\">CheckMate 067</a>. <a href=\"https://drive.google.com/file/d/1nBOvPUqYlAiwwqvsJUM1cL5uCZxeJOmA/preview\">N Engl J Med 2015;373:23-34</a>; <a href=\"https://drive.google.com/file/d/1p716vQ1p7Lbwwf8g7Y0YhJNPAhAqeHEu/preview\">N Engl J Med 2017;377:1345-1356</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-relativity-047\">RELATIVITY-047</a>. <a href=\"https://doi.org/10.1056/NEJMoa2109970\">N Engl J Med 2022;386:24-34</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-mdx010-20-ipilimumab\">MDX010-20 (ipilimumab)</a>. <a href=\"https://doi.org/10.1056/NEJMoa1003466\">N Engl J Med 2010;363:711-723</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-keynote-006\">KEYNOTE-006</a>. <a href=\"https://doi.org/10.1056/NEJMoa1503093\">N Engl J Med 2015;372:2521-2532</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-dreamseq-ea6134\">DREAMseq (EA6134)</a>. <a href=\"https://drive.google.com/file/d/12z2LJCe7SJgBYOlXWyml5fjYSOsLlhXR/preview\">J Clin Oncol 2023;41:186-197</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-secombit-ascierto\">SECOMBIT (Ascierto)</a>. <a href=\"https://drive.google.com/file/d/1mVe-RpBIlotvRE3PruFhaf8nL8DQNO8y/preview\">J Clin Oncol 2023;41:212-221</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-ebin-robert\">EBIN (Robert)</a>. <a href=\"https://drive.google.com/file/d/184vlWEGsg4xKNXX4Vbr34WkcesdPLkBU/preview\">Lancet Oncol 2025;26:781-794</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-brim-3\">BRIM-3</a>. <a href=\"https://doi.org/10.1056/NEJMoa1103782\">N Engl J Med 2011;364:2507-2516</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-cobrim\">coBRIM</a>. <a href=\"https://doi.org/10.1056/NEJMoa1408868\">N Engl J Med 2014;371:1867-1876</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-combi-v\">COMBI-v</a>. <a href=\"https://doi.org/10.1056/NEJMoa1412690\">N Engl J Med 2015;372:30-39</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-columbus\">COLUMBUS</a>. <a href=\"https://doi.org/10.1016/S1470-2045(18)30142-6\">Lancet Oncol 2018;19:603-615</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-rohaan-til-vs-ipilimumab\">Rohaan (TIL vs ipilimumab)</a>. <a href=\"https://drive.google.com/file/d/1iP-xVQzJrrKVotmv3OqNYzBrZ0a_4MTU/preview\">N Engl J Med 2022;387:2113-2125</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-c-144-01-lifileucel\">C-144-01 (lifileucel)</a>. <a href=\"https://drive.google.com/file/d/1A0kV__JlmaAEJ9nBXs676o3xDrhcv5aF/preview\">J Clin Oncol 2025;43:3565-3572</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-optim-t-vec\">OPTiM (T-VEC)</a>. <a href=\"https://doi.org/10.1200/JCO.2014.58.3377\">J Clin Oncol 2015;33:2780-2788</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-ignyte-rp1\">IGNYTE (RP1)</a>. <a href=\"https://drive.google.com/file/d/1HfzfgHkq0NP_Fnzftg29g5Rs6r1Ncav2/preview\">J Clin Oncol 2025;43:3589-3599</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-imcgp100-202-tebentafusp\">IMCgp100-202 (tebentafusp)</a>. <a href=\"https://doi.org/10.1056/NEJMoa2103485\">N Engl J Med 2021;385:1196-1206</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-optimum-02\">OptimUM-02</a>. <a href=\"https://doi.org/10.1200/JCO.2026.44.17_suppl.LBA9503\">J Clin Oncol 2026;44(suppl 17):LBA9503</a>; <a href=\"https://drive.google.com/file/d/1E5UDfQD85uSxpDPTlXYKLVBOXZtUg6W3/preview\">Orloff et al. - 2026 - Darovasertib plus crizotinib vs investigator&#x27;s choice as first-line treatment for HLA-A2 negative [1126b8da]</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-sheng-et-al-toripalimab-axitinib\">Sheng et al (toripalimab + axitinib)</a>. <a href=\"https://doi.org/10.1200/JCO.19.00210\">J Clin Oncol 2019;37:2987-2999</a></li>\n</ol>", "_hay": "melanoma melanoma melanoma epidemiology risk factors pathology and molecular classification clinical presentation and diagnosis staging and work-up management of resectable disease management of advanced disease therapy after anti–pd-1 failure uveal and mucosal melanoma references sentinel lymph node biopsy imaging for distant metastases surgery and radiotherapy adjuvant systemic therapy by stage neoadjuvant therapy first-line therapy in *braf* wild-type disease first-line therapy in *braf* v600-mutant disease braf and mek inhibition"}];
const GROUPS = ["Lung", "Melanoma"];
const BYID = Object.fromEntries(NOTES.map(n => [n.id, n]));

let state = { view:'index', group:null, id:null, q:'' };

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function inGroup(g){ return NOTES.filter(n => n.group === g); }

// ---- Sidebar: "All notes" + a collapsible section per tumour group ----
const nav = document.getElementById('nav');
GROUPS.forEach(g => {
  const block = document.createElement('div'); block.className = 'navsec';
  const head = document.createElement('button'); head.type = 'button'; head.className = 'secname';
  head.setAttribute('aria-expanded','true');
  head.innerHTML = `<span>${esc(g)}</span><span class="caret" aria-hidden="true">&#9660;</span>`;
  head.onclick = () => { const collapsed = block.classList.toggle('collapsed'); head.setAttribute('aria-expanded', collapsed ? 'false' : 'true'); };
  block.appendChild(head);
  const box = document.createElement('div'); box.className = 'items';
  inGroup(g).forEach(n => {
    const a = document.createElement('button'); a.type = 'button'; a.dataset.id = n.id;
    a.innerHTML = `<span>${esc(n.title)}</span>`;
    a.onclick = () => selectNote(n.id);
    box.appendChild(a);
  });
  block.appendChild(box); nav.appendChild(block);
});
function syncNav(){ document.querySelectorAll('.items button').forEach(a => a.classList.toggle('active', state.view==='note' && a.dataset.id===state.id)); }
document.getElementById('showall').onclick = () => { state.view='index'; state.group=null; state.id=null; state.q=''; document.getElementById('q').value=''; closeNav(); render(true); window.scrollTo(0,0); };

// ---- Drawer (burger at every width) ----
const backdrop = document.getElementById('backdrop');
const burger = document.getElementById('burger');
function closeNav(){ document.body.classList.remove('nav-open'); }
burger.onclick = () => document.body.classList.toggle('nav-open');
backdrop.onclick = closeNav;

// ---- Search: title + section headings, across every note ----
document.getElementById('q').oninput = e => {
  state.q = e.target.value.toLowerCase().trim();
  state.view = state.q ? 'search' : 'index';
  state.id = null;
  render();
};

function selectNote(id){
  state.view='note'; state.id=id; state.q='';
  const q = document.getElementById('q'); if (q) q.value='';
  closeNav(); render(true); window.scrollTo(0,0);
}
function selectGroup(g){
  state.view='group'; state.group=g; state.id=null; state.q='';
  const q = document.getElementById('q'); if (q) q.value='';
  closeNav(); render(true); window.scrollTo(0,0);
}

function noteItem(n, meta){
  return `<button class="nitem" type="button" data-id="${esc(n.id)}">
    <span class="ntitle">${esc(n.title)}</span>
    <span class="nmeta">${esc(meta || n.updated || '')}</span></button>`;
}

function renderIndex(res){
  res.innerHTML = `<div class="ngrid">` + GROUPS.map(g => {
    const c = inGroup(g).length;
    return `<button class="gcard" type="button" data-group="${esc(g)}">
      <span class="gbody"><span class="gname">${esc(g)}</span>
      <span class="gcount">${c} note${c===1?'':'s'}</span></span>
      <span class="go" aria-hidden="true">&rarr;</span></button>`;
  }).join('') + `</div>`;
  res.querySelectorAll('.gcard').forEach(b => b.onclick = () => selectGroup(b.dataset.group));
}

function renderGroup(res){
  const notes = inGroup(state.group);
  res.innerHTML = `<button class="backpill" type="button" data-back="index">&#8592; All groups</button>
    <div class="seclabel">${esc(state.group)}</div>
    <div class="nlist">${notes.map(n => noteItem(n)).join('')}</div>`;
  wireList(res);
}

function renderSearch(res){
  const hits = NOTES.filter(n => n._hay.includes(state.q));
  if (!hits.length) { res.innerHTML = `<div class="empty">No note matches that search.</div>`; return; }
  res.innerHTML = `<div class="seclabel">${hits.length} note${hits.length===1?'':'s'} matching &ldquo;${esc(state.q)}&rdquo;</div>
    <div class="nlist">${hits.map(n => noteItem(n, n.group)).join('')}</div>`;
  wireList(res);
}

function renderNote(res, n){
  const toc = n.sections.length
    ? `<nav class="toc" aria-label="Sections">` +
      n.sections.map(s => `<a href="#${esc(s.id)}" data-sec="${esc(s.id)}">${esc(s.h)}</a>`).join('') +
      `</nav>` : '';
  res.innerHTML = `<button class="backpill" type="button" data-back="group">&#8592; ${esc(n.group)}</button>
    <div class="notehead"><h2>${esc(n.title)}</h2>
      <div class="notemeta"><span>${esc(n.group)}</span>${n.updated ? `<span>Updated ${esc(n.updated)}</span>` : ''}</div>
    </div>${toc}<div class="nbody">${n.html}</div>`;
  res.querySelectorAll('.toc a').forEach(a => a.onclick = ev => {
    ev.preventDefault();
    const t = document.getElementById(a.dataset.sec);
    if (t) t.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block:'start' });
  });
  wireBack(res);
  spy();
}

function wireList(res){
  res.querySelectorAll('.nitem').forEach(b => b.onclick = () => selectNote(b.dataset.id));
  wireBack(res);
}
function wireBack(res){
  const b = res.querySelector('.backpill');
  if (!b) return;
  b.onclick = () => {
    if (b.dataset.back === 'group' && state.id && BYID[state.id]) selectGroup(BYID[state.id].group);
    else { state.view='index'; state.group=null; state.id=null; render(true); window.scrollTo(0,0); }
  };
}

// ---- TOC scroll-spy. Registered through window.addEventListener so the oncOS
// One shell captures and removes it when the view is torn down. ----
let spyTick = false;
function spy(){
  const links = document.querySelectorAll('.toc a');
  if (!links.length) return;
  let active = null;
  links.forEach(a => {
    const el = document.getElementById(a.dataset.sec);
    if (el && el.getBoundingClientRect().top <= 130) active = a;
  });
  if (!active) active = links[0];
  links.forEach(a => a.classList.toggle('active', a === active));
}
window.addEventListener('scroll', () => {
  if (spyTick) return;
  spyTick = true;
  requestAnimationFrame(() => { spyTick = false; if (state.view === 'note') spy(); });
}, { passive: true });

function render(fade){
  if (fade && !(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches)) {
    const res = document.getElementById('results');
    res.classList.add('vfade');
    setTimeout(() => { if(!res.isConnected) return; renderNow(); res.classList.remove('vfade'); }, 150);
    return;
  }
  renderNow();
}

function renderNow(){
  syncNav();
  const res = document.getElementById('results');
  if (!NOTES.length) { res.innerHTML = `<div class="empty">No notes have been published yet.</div>`; return; }
  if (state.view==='note' && BYID[state.id]) { renderNote(res, BYID[state.id]); return; }
  if (state.view==='search') { renderSearch(res); return; }
  if (state.view==='group' && state.group) { renderGroup(res); return; }
  renderIndex(res);
}
render();
  },
  destroy: function() {

  }
};
</script>
