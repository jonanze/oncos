89.5% vs 90.2%; the trial was not designed for a definitive survival effect.</li><li>Toxicity: chemotherapy caused more neuropathy and chemoradiation more diarrhoea.</li></ul>\n<p>CONVERT, reported in 2023, did not establish non-inferior omission of radiotherapy:</p>\n<ul><li>Population: cT2 node-positive or cT3-4a disease; T4b disease, threatened circumferential margin and symptomatic obstruction were excluded.</li><li>Experimental regimen: four 3-weekly CAPOX cycles, surgery and four adjuvant CAPOX cycles. Local progression during neoadjuvant CAPOX triggered chemoradiation before surgery.</li><li>Control regimen: capecitabine chemoradiation, surgery and six adjuvant CAPOX cycles.</li><li>Primary result: 3-year locoregional-recurrence-free survival was 97.4% vs 96.3% (HR 1.08, 95% CI 0.46-2.54) and did not meet the non-inferiority margin.</li><li>Other outcomes: R0 resection was 99.6% in both groups; pathological complete response 11.0% vs 13.8%; 3-year disease-free survival 89.2% vs 87.9%; and 3-year overall survival 95.0% vs 94.1%.</li><li>Toxicity: haematologic toxicity was similar between groups.</li></ul>\n<p>FOWARC was a phase III superiority trial reported across 2016, 2019 and 2024, with disease-free survival as its primary endpoint:</p>\n<ul><li>Population: cT3-4N0 or T1-4N1-2 rectal cancer with the distal border within 12 cm of the anal verge.</li><li>Regimens: FOLFOX chemoradiation, surgery and adjuvant FOLFOX; FOLFOX alone, surgery and adjuvant FOLFOX; or fluorouracil chemoradiation, surgery and de Gramont chemotherapy.</li><li>Long-term outcomes: 10-year disease-free survival was 62.6%, 60.5% and 52.5%; overall survival was 72.3%, 73.4% and 65.9%, respectively.</li><li>Surgery: R0 resection was 89.9%, 89.4% and 90.7%.</li><li>Response: pathological complete response was 27.5%, 6.6% and 14.0%. The source reports OR 0.428 (P=0.005) for fluorouracil chemoradiation relative to FOLFOX chemoradiation, not the reverse contrast.</li></ul>\n<h2 id=\"s-organ-preservation-and-watch-and-wait\">Organ preservation and watch-and-wait</h2>\n<h3>Require structured reassessment and salvage capacity</h3>\n<p>Watch-and-wait is active surveillance after a clinical complete or near-complete response to neoadjuvant treatment. Incomplete response should proceed to TME; complete and near-complete responders can enter surveillance only after accepting the risk of regrowth and salvage surgery. <a class=\"trial-link\" href=\"/evidence/#t-habr-gama\">Habr-Gama</a> provided the initial observational evidence:</p>\n<ul><li>Population: 265 patients with distal rectal adenocarcinoma treated with fluorouracil/leucovorin chemoradiation to 5,040 cGy. Results compared 71 patients with a sustained clinical complete response against 22 patients found to have pT0N0M0 only after resection.</li><li>Response gate: assessment at 8 weeks used clinical examination and endoscopy without MRI. The 71 observed patients had maintained complete regression for at least 12 months before inclusion in the observation group.</li><li>Survival: 5-year overall survival was 100% observed vs 88% resected, with no cancer-related deaths among observed patients; disease-free survival was 92% vs 83% and did not significantly differ.</li><li>Recurrence: five of 71 observed patients recurred. Two bowel-wall recurrences at 56 and 64 months were salvaged and disease-free at last report; three patients developed systemic recurrence and none developed pelvic recurrence.</li><li>Surgical cost: 16/22 resected patients received a stoma, including nine permanent colostomies.</li><li>Limit: this was a single-institution observational comparison between outcome-defined groups, not a comparative efficacy trial.</li></ul>\n<p><a class=\"trial-link\" href=\"/evidence/#t-iwwd-van-der-valk\">IWWD (van der Valk)</a> provides multicentre registry estimates:</p>\n<ul><li>Population: 880 clinical complete responders from 47 centres.</li><li>Regrowth: 2-year local regrowth was 25.2%; 97% arose in the bowel wall and 88% occurred within 2 years.</li><li>Salvage: 101/115 documented salvage resections were R0; the authors estimated unsalvageable local disease at no more than 1% of the cohort.</li><li>Distant disease: distant metastasis occurred in 8%.</li><li>Survival: 5-year overall survival was 84.7% and disease-specific survival 93.8%.</li><li>Outcome-defined comparison: overall survival was 87.9% with sustained response and 75.4% after regrowth; disease-specific survival after regrowth was 84.0%. No test between these groups was reported.</li><li>Limit: there was no central response definition, and only 45% underwent the combined examination, endoscopy and MRI assessment recommended by the authors.</li></ul>\n<p><a class=\"trial-link\" href=\"/evidence/#t-opra-garcia-aguilar\">OPRA (Garcia-Aguilar)</a> tested the sequence of TNT, not watch-and-wait against a randomised surgery control:</p>\n<ul><li>Population: 324 patients with stage II disease (cT3-4N0) or stage III disease (any cT, N1-2). Baseline stage was 78% cT3, 15% cT4 and 7% cT1-2; 70% were node-positive and 30% node-negative.</li><li>Sequences: induction chemotherapy followed by chemoradiation, or chemoradiation followed by consolidation chemotherapy. Chemotherapy was eight FOLFOX cycles or five CAPOX cycles.</li><li>Restaging: within 8 weeks of TNT, use digital examination, endoscopy, pelvic MRI and CT of the chest, abdomen and pelvis. Incomplete responders were directed to TME; complete and near-complete responders were offered watch-and-wait.</li><li>Comparator: the primary disease-free-survival benchmark came from historical chemoradiation, TME and adjuvant chemotherapy. There was no concurrent randomised surgery-control arm.</li><li>2022 primary result: both sequences achieved 3-year disease-free survival of 76%, matching rather than exceeding the historical 75% benchmark. The primary endpoint was not met.</li><li>2022 organ preservation: 3-year organ preservation was 53% after chemoradiation-consolidation and 41% after induction-chemoradiation.</li><li>2022 regrowth: 75/225 watch-and-wait patients developed regrowth, 33% computed from the reported counts. Rates were 40% after induction-first and 27% after consolidation-first treatment.</li><li>Later source update: regrowth was 36%; 94% occurred within 2 years and 99% within 3 years.</li><li>Later disease control: 5-year disease-free survival was 71% vs 69%. R0 resection after regrowth was 91% vs 90% after immediate TME for incomplete response, and 5-year disease-free survival was 64% in both groups.</li><li>Later organ preservation and secondary outcomes: 5-year TME-free survival was 54% vs 39% (nominal P=0.012); 5-year overall survival was 88% vs 85%, locoregional-recurrence-free survival 94% vs 90%, and distant-metastasis-free survival 80% vs 78%.</li><li>Treatment cost: grade 3 or higher toxicity was 41% vs 34%, with five treatment-related deaths.</li><li>Limit: salvage and survival comparisons after regrowth are response-selected and based on few events. Consolidation sequencing increases the probability of organ preservation but does not establish survival superiority.</li></ul>\n<h3>Follow the OPRA trial surveillance protocol when applying its results</h3>\n<p>The OPRA trial protocol used the following watch-and-wait schedule:</p>\n<ul><li>Digital rectal examination and flexible sigmoidoscopy every 4 months for the first 2 years, then every 6 months for the next 3 years.</li><li>Rectal MRI every 6 months for 2 years, then annually for 3 years.</li><li>CT of the chest, abdomen and pelvis at least annually.</li><li>Biopsy of the primary site was not required by protocol.</li><li>Recommend TME for feasible regrowth.</li></ul>\n<h2 id=\"s-mismatch-repair-deficient-rectal-cancer\">Mismatch-repair-deficient rectal cancer</h2>\n<h3>Discuss PD-1 blockade within its evidence limits</h3>\n<p>The historical source notes recommend mismatch-repair testing for all rectal cancers to identify hereditary implications and the subgroup in whom PD-1 blockade may permit avoidance of chemoradiation and surgery. The guideline version and currentness of that universal-testing recommendation were not verified locally. <a class=\"trial-link\" href=\"/evidence/#t-dostarlimab-cercek\">Dostarlimab (Cercek)</a> first reported a small interim cohort in 2022:</p>\n<ul><li>Population: 16 previously untreated stage II-III dMMR rectal adenocarcinomas without distant metastases; 15 had stage III disease and one stage II disease.</li><li>Lynch status: germline testing identified Lynch-associated pathogenic variants in 8/14 tested patients (57%).</li><li>Regimen: dostarlimab 500 mg intravenously every 3 weeks for 9 cycles over 6 months. Patients without a clinical complete response after dostarlimab were to receive chemoradiation to 50.4 Gy with capecitabine; those with a clinical complete response after either dostarlimab or chemoradiation entered nonoperative follow-up, and the remainder proceeded to TME.</li><li>Response definition: absence of residual disease on digital examination, endoscopy and pelvic MRI.</li><li>Interim result: all 12 patients who completed 6 months achieved a clinical complete response and no enrolled patient received chemoradiation or surgery. Four patients remained on treatment.</li><li>Maturity: median follow-up was 12 months from enrolment, only four patients had maintained response for more than 1 year, and the sustained 12-month co-primary endpoint was not yet reported in finality.</li><li>Safety: adverse events occurred in 12/16 patients (75%), with no grade 3 or higher event.</li></ul>\n<p>The 2025 report expanded the programme:</p>\n<ul><li>Rectal cohort: 50 patients were analysed and 49 completed dostarlimab. All 49 achieved a clinical complete response and chose nonoperative management.</li><li>Durability: 37 had sustained response for at least 12 months, but the publication gives no denominator for that count.</li><li>Recurrence-free survival: 2-year recurrence-free survival was 96% (95% CI 90-100) at median recurrence follow-up of 30.2 months.</li><li>Pooled germline result: across rectal and nonrectal cohorts, 51/117 analysed patients (44%) had pathogenic germline mismatch-repair variants. This is not a rectal-only estimate.</li><li>Limit: the evidence remains single-arm and does not establish replacement of standard local treatment for every patient with dMMR rectal cancer.</li></ul>\n<h2 id=\"s-frailty-and-surveillance\">Frailty and surveillance</h2>\n<h3>Adapt intensity to fitness and residual risk</h3>\n<ul><li>Neoadjuvant treatment for a frail patient may use short-course radiotherapy or long-course chemoradiation followed by surgery, rather than intensive TNT.</li><li>If postoperative chemotherapy is used, fluorouracil alone or the addition of oxaliplatin should be selected according to ADORE, fitness, competing comorbidity, pre-existing neuropathy and treatment tolerance.</li><li>PRODIGE 23 and STELLAR enrolled patients with performance status 0-1; PRODIGE 23 excluded patients aged 76 years or older. These TNT data should not be extrapolated uncritically to frail patients.</li><li>In the 55 ADORE patients aged 65 years or older, the post-hoc disease-free-survival estimate was HR 0.60 (95% CI 0.21-1.67), with age-interaction P=0.90. The wide interval does not establish absence of benefit. The overall-survival subgroup was likewise inconclusive.</li><li>In the overall ADORE population, FOLFOX improved disease-free survival but did not establish an overall-survival benefit.</li></ul>\n<h3>Keep practical surveillance distinct from the OPRA protocol</h3>\n<p>The following is a historical source-note practical organ-preservation programme. Its NCCN edition, guideline version and currentness were not verified locally; do not combine it with the different OPRA trial protocol above.</p>\n<ul><li>History, examination and CEA every 3 months for 2 years, then every 6 months for 3 years.</li><li>Digital rectal examination and flexible sigmoidoscopy every 4 months for 2 years, then every 6 months for 3 years.</li><li>Rectal MRI every 6 months for 3 years.</li><li>CT of the thorax and abdomen every 6 months for 5 years; add pelvic CT after year 3, when MRI stops.</li><li>Colonoscopy 1 year after TNT.</li><li>Tumour regrowth at any time should prompt TME where feasible.</li></ul>\n<p>After resection, follow the postoperative colorectal surveillance programme with clinical assessment, CEA, endoscopy and imaging. Surveillance is most intensive during the first 2 years, when local regrowth after organ preservation is most likely.</p>\n<h2 id=\"s-references\">References</h2>\n<ol class=\"refs\">\n<li><a class=\"trial-link\" href=\"/evidence/#t-adore-hong\">ADORE (Hong)</a>. <a href=\"https://drive.google.com/file/d/1Bg3gJv565myDFVSgSo3CFf81yffEaZXc/preview\">Lancet Oncol 2014;15:1245-1253</a>; <a href=\"https://drive.google.com/file/d/1IJvp13QG1U6ddvVS6zsnxVkNQQUaK1im/preview\">J Clin Oncol 2019;37:3111-3123</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-german-rectal-cao-aro-aio-94\">German Rectal (CAO/ARO/AIO-94)</a>. <a href=\"https://drive.google.com/file/d/1T4gjue5-uAgOmv1g7NzX2hOI00RfmEhd/preview\">N Engl J Med 2004;351:1731-1740</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-polish-colorectal-bujko\">Polish Colorectal (Bujko)</a>. <a href=\"https://drive.google.com/file/d/1pfFQs1tcs7HwXdAs2BEkrAaODU0WSgWd/preview\">Br J Surg 2006;93:1215-1223</a>; <a href=\"https://drive.google.com/file/d/1Oia-0zuQxeM3mE7OfqBOVt-umFUMBh-c/preview\">Radiother Oncol 2004;72:15-24</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-trog-01-04-ngan\">TROG 01.04 (Ngan)</a>. <a href=\"https://drive.google.com/file/d/13GFghiPb-xjVyVmcgd3RS0Q4Hw-0HYvR/preview\">J Clin Oncol 2012;30:3827-3833</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-star-01-aschele\">STAR-01 (Aschele)</a>. <a href=\"https://drive.google.com/file/d/1FtOI3Oyz_hYv4dXN2GhSuzDeD8bInXxd/preview\">J Clin Oncol 2011;29:2773-2780</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-accord-12-0405-g-rard\">ACCORD 12/0405 (Gérard)</a>. <a href=\"https://drive.google.com/file/d/1v5wJoOPMnBAL-sG8dZeIyc5-UeTd2lPy/preview\">J Clin Oncol 2010;28:1638-1644</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-nsabp-r-04-allegra\">NSABP R-04 (Allegra)</a>. <a href=\"https://drive.google.com/file/d/1vs0Br78cbKvSRChtgdmEzQm40ZwEjgJQ/preview\">J Natl Cancer Inst 2015;107:djv248</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-cao-aro-aio-04-r-del\">CAO/ARO/AIO-04 (Rödel)</a>. <a href=\"https://drive.google.com/file/d/1E-m8tNHOouB6j00u-hZvGX6KcOPbT0yV/preview\">Lancet Oncol 2015;16:979-989</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-prodige-23-conroy\">PRODIGE 23 (Conroy)</a>. <a href=\"https://drive.google.com/file/d/1JNM2TVk7Q8iA2r-8l3ia4olKn_PJTNYq/preview\">Lancet Oncol 2021;22:702-715</a>; <a href=\"https://drive.google.com/file/d/1cv5Z8BXkVcZJZZSh53q7lWeqP6cHO3mW/preview\">Ann Oncol 2024;35:873-881</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-rapido-bahadoer\">RAPIDO (Bahadoer)</a>. <a href=\"https://drive.google.com/file/d/1o71xCImaQ_rUnM5IF4kHjfM81lRJLj_W/preview\">Lancet Oncol 2021;22:29-42</a>; <a href=\"https://drive.google.com/file/d/1VYwwUKvoQ4O0hJ549AeEOGCG6292Mzpv/preview\">Ann Surg 2023;278:e766-e772</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-stellar-jin\">STELLAR (Jin)</a>. <a href=\"https://drive.google.com/file/d/1e801bLnGyxL6d1N7_aL346wagB30YNaC/preview\">J Clin Oncol 2022;40:1681-1692</a>; <a href=\"https://drive.google.com/file/d/1Lg6Git0uIyhgjWYBPT1BGHtipixyCsui/preview\">J Clin Oncol 2026</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-cao-aro-aio-12-fokas\">CAO/ARO/AIO-12 (Fokas)</a>. <a href=\"https://drive.google.com/file/d/1Vbv06U6T_uJg6gdsklEY_AWax-t-2f_z/preview\">J Clin Oncol 2019;37:3212-3222</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-prospect-alliance-n1048\">PROSPECT (Alliance N1048)</a>. <a href=\"https://drive.google.com/file/d/1M82TXPeRP3blqFiOYRidO4j0CvHDp2mo/preview\">N Engl J Med 2023;389:322-334</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-habr-gama\">Habr-Gama</a>. <a href=\"https://drive.google.com/file/d/11F8g1wLmZHN29NDdC1k2f7NLkwTSuBaH/preview\">Ann Surg 2004;240:711-718</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-iwwd-van-der-valk\">IWWD (van der Valk)</a>. <a href=\"https://drive.google.com/file/d/1iC5_fQiiQhA8HYAJop2F0hpzHMGaCx6m/preview\">Lancet 2018;391:2537-2545</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-opra-garcia-aguilar\">OPRA (Garcia-Aguilar)</a>. <a href=\"https://drive.google.com/file/d/1pBoHfhCVGFe1MiPaHbpMZJ0Ob49rIouZ/preview\">J Clin Oncol 2022;40:2546-2556</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-dostarlimab-cercek\">Dostarlimab (Cercek)</a>. <a href=\"https://drive.google.com/file/d/1lG4Km-TNal09ShmPyUZ5KwB4Q7XymUE_/preview\">N Engl J Med 2022;386:2363-2376</a></li>\n</ol>", "_hay": "early rectal cancer early-rectal-cancer colorectal staging and anatomy select the treatment objective and sequence postoperative adjuvant treatment preoperative radiotherapy and chemoradiation total neoadjuvant therapy selective omission of pelvic radiation organ preservation and watch-and-wait mismatch-repair-deficient rectal cancer frailty and surveillance references complete staging before treatment selection preserve sphincter function without compromising local control use mri risk, fitness and the organ-preservation objective define a clinical complete response before watch-and-wait understand the historical rationale and its limits use fluoropyrimidine chemoradiation without routine oxaliplatin intensification select adjuvant folfox after preoperative chemoradiation prefer preoperative to postoperative chemoradiation when pelvic treatment is needed match the radiation schedule to the clinical objective do not routinely add oxaliplatin during fluoropyrimidine chemoradiation use tnt for high-risk disease or planned organ preservation use consolidation chemotherapy when organ preservation is the priority restrict omission to lower-risk, resectable disease require structured reassessment and salvage capacity follow the opra trial surveillance protocol when applying its results discuss pd-1 blockade within its evidence limits adapt intensity to fitness and residual risk keep practical surveillance distinct from the opra protocol"}, {"id": "colorectal-localized-colon-cancer", "slug": "localized-colon-cancer", "group": "Colorectal", "title": "Localized colon cancer", "updated": "", "sections": [{"id": "s-staging-and-surgery", "h": "Staging and surgery"}, {"id": "s-adjuvant-treatment-for-node-positive-disease", "h": "Adjuvant treatment for node-positive disease"}, {"id": "s-stage-ii-disease", "h": "Stage II disease"}, {"id": "s-mismatch-repair-deficient-disease", "h": "Mismatch-repair deficient disease"}, {"id": "s-circulating-tumour-dna", "h": "Circulating tumour DNA"}, {"id": "s-neoadjuvant-systemic-treatment", "h": "Neoadjuvant systemic treatment"}, {"id": "s-strategies-beyond-cytotoxic-chemotherapy", "h": "Strategies beyond cytotoxic chemotherapy"}, {"id": "s-surveillance", "h": "Surveillance"}, {"id": "s-references", "h": "References"}], "html": "<h2 id=\"s-staging-and-surgery\">Staging and surgery</h2>\n<p>Complete resection is the curative treatment for localized colon cancer. Plan an oncological segmental colectomy with adequate longitudinal and nodal clearance, pathological staging, and assessment of margin status and lymph-node yield. Surgery alone cures most stage I cancers, so adjuvant chemotherapy is not indicated in that setting. For stage II and III disease, the postoperative decision estimates recurrence risk, expected treatment benefit, comorbidity and the long-term cost of oxaliplatin neuropathy. Adjuvant chemotherapy is usually started once recovery permits, commonly within 4–8 weeks after surgery. Delayed initiation is associated with poorer disease-free and overall survival, but that observation does not define an individual contraindication to treatment.</p>\n<h2 id=\"s-adjuvant-treatment-for-node-positive-disease\">Adjuvant treatment for node-positive disease</h2>\n<p>Fluoropyrimidine-based adjuvant therapy established postoperative chemotherapy as standard for stage III colon cancer. <a class=\"trial-link\" href=\"/evidence/#t-moertel-int-0035\">Moertel (INT-0035)</a> enrolled 971 patients with Dukes C disease; fluorouracil plus levamisole reduced recurrence by about 41% and deaths by about 33% versus surgery alone, although the publication was an interim analysis <a class=\"trial-link\" href=\"/evidence/#t-moertel-int-0035\">Moertel (INT-0035)</a>. <a class=\"trial-link\" href=\"/evidence/#t-impact\">IMPACT</a> pooled three trials of fluorouracil plus folinic acid for 6 months versus observation in 1,526 patients with stage II–III colon cancer. Treatment increased 3-year event-free survival from 62% to 71% and overall survival from 78% to 83%; the stage-specific evidence remained insufficient to settle the stage II question <a class=\"trial-link\" href=\"/evidence/#t-impact\">IMPACT</a>. Oxaliplatin improves the fluoropyrimidine backbone in stage III disease. <a class=\"trial-link\" href=\"/evidence/#t-mosaic\">MOSAIC</a> showed a 3-year disease-free-survival benefit with 6 months of FOLFOX4 versus LV5FU2 (72.2% vs 65.3%; HR 0.76, 95% CI 0.62–0.92), with mature 6-year overall survival benefit confined to stage III disease (72.9% vs 68.7%; HR 0.80, 95% CI 0.65–0.97) <a class=\"trial-link\" href=\"/evidence/#t-mosaic\">MOSAIC</a>. <a class=\"trial-link\" href=\"/evidence/#t-nsabp-c-07\">NSABP C-07</a> confirmed improved disease-free survival with bolus FLOX versus FULV over the full follow-up (HR 0.80, 95% CI 0.69–0.93); 3-year disease-free survival was 76.1% versus 71.8%. At median follow-up of 8 years, overall survival was not significantly improved (HR 0.88, 95% CI 0.75–1.02) <a class=\"trial-link\" href=\"/evidence/#t-nsabp-c-07\">NSABP C-07</a>. <a class=\"trial-link\" href=\"/evidence/#t-xeloxa-no16968\">XELOXA (NO16968)</a> established CAPOX as an oral-fluoropyrimidine alternative: 3-year disease-free survival was 70.9% versus 66.5% with bolus fluorouracil/folinic acid (HR 0.80, 95% CI 0.69–0.93), and 7-year overall survival was 73% versus 67% (HR 0.83, 95% CI 0.70–0.99) <a class=\"trial-link\" href=\"/evidence/#t-xeloxa-no16968\">XELOXA (NO16968)</a>. <a class=\"trial-link\" href=\"/evidence/#t-x-act\">X-ACT</a> established capecitabine as an oral single-agent option, at least equivalent to bolus fluorouracil/folinic acid for disease-free survival at the primary analysis (HR 0.87, 95% CI 0.75–1.00) <a class=\"trial-link\" href=\"/evidence/#t-x-act\">X-ACT</a>.</p>\n<h3>Choosing duration</h3>\n<p>The <a class=\"trial-link\" href=\"/evidence/#t-idea-collaboration\">IDEA Collaboration</a> pooled six trials in 12,834 patients with stage III colon cancer. Three months of oxaliplatin-based therapy did not meet non-inferiority overall against 6 months (HR 1.07, 95% CI 1.00–1.15; non-inferiority boundary 1.12), but the result differed by regimen <a class=\"trial-link\" href=\"/evidence/#t-idea-collaboration\">IDEA Collaboration</a>.</p>\n<ul><li>With CAPOX, 3 months met non-inferiority (HR 0.95, 95% CI 0.85–1.06) <a class=\"trial-link\" href=\"/evidence/#t-idea-collaboration\">IDEA Collaboration</a>.</li><li>With FOLFOX, 3 months did not meet non-inferiority and 6 months was superior (HR 1.16, 95% CI 1.06–1.26; p=0.001) <a class=\"trial-link\" href=\"/evidence/#t-idea-collaboration\">IDEA Collaboration</a>.</li><li>In T1–3/N1 disease, 3 months was non-inferior (HR 1.01); in T4 or N2 disease, 3 months was inferior (HR 1.12). Grade 2 or higher sensory neuropathy was markedly less common after 3 months (FOLFOX 16.6% vs 47.7%; CAPOX 14.2% vs 44.9%) <a class=\"trial-link\" href=\"/evidence/#t-idea-collaboration\">IDEA Collaboration</a>.</li></ul>\n<p>Thus, 3 months of CAPOX is a reasonable low-risk stage III option when toxicity reduction is important. For T4 or N2 disease, and when FOLFOX is selected, 6 months remains the better-supported duration; tumour deposits and N1c disease require individualized risk assessment because they were not part of IDEA&#x27;s low-risk definition <a class=\"trial-link\" href=\"/evidence/#t-idea-collaboration\">IDEA Collaboration</a>.</p>\n<h2 id=\"s-stage-ii-disease\">Stage II disease</h2>\n<p>Stage II colon cancer has a favourable prognosis overall, and absolute benefit from adjuvant chemotherapy is small. <a class=\"trial-link\" href=\"/evidence/#t-quasar\">QUASAR</a> enrolled 3,239 patients with colorectal cancer and an uncertain indication for treatment, 91% with stage II disease; fluorouracil plus folinic acid reduced recurrence (RR 0.78, 95% CI 0.67–0.91) and mortality (RR 0.82, 95% CI 0.70–0.95), while the 3.6% absolute survival benefit was a modelled estimate rather than an observed trial result <a class=\"trial-link\" href=\"/evidence/#t-quasar\">QUASAR</a>. Offer adjuvant chemotherapy for T4 disease and consider it for other high-risk features: fewer than 12 sampled lymph nodes, lymphovascular or perineural invasion, poor differentiation except in dMMR tumours, obstruction, perforation, or high-grade tumour budding <a class=\"trial-link\" href=\"/evidence/#t-asco-guideline-baxter-et-al\">ASCO Guideline (Baxter et al.)</a>. Oxaliplatin is not routinely required in stage II disease. In <a class=\"trial-link\" href=\"/evidence/#t-mosaic\">MOSAIC</a>, no overall-survival benefit was shown in the stage II subgroup (86.9% vs 86.8%; HR 1.00, 95% CI 0.70–1.41), and the guideline supports shared decision-making if a doublet is considered <a class=\"trial-link\" href=\"/evidence/#t-mosaic\">MOSAIC</a> <a class=\"trial-link\" href=\"/evidence/#t-asco-guideline-baxter-et-al\">ASCO Guideline (Baxter et al.)</a>. If oxaliplatin-based therapy is used for high-risk stage II disease, duration remains regimen-dependent. <a class=\"trial-link\" href=\"/evidence/#t-idea-collaboration-stage-ii\">IDEA Collaboration (Stage II)</a> did not establish non-inferiority of 3 months overall (5-year DFS 80.7% vs 83.9%; HR 1.17, 80% CI 1.05–1.31), but the CAPOX result was compatible with non-inferiority (HR 1.02, 80% CI 0.88–1.17), unlike FOLFOX (HR 1.41, 80% CI 1.18–1.68) <a class=\"trial-link\" href=\"/evidence/#t-idea-collaboration-stage-ii\">IDEA Collaboration (Stage II)</a>. <a class=\"trial-link\" href=\"/evidence/#t-achieve-2\">ACHIEVE-2</a>, an Asian high-risk-stage-II study, similarly reported 3-year DFS of 88.2% versus 87.9% with 3 versus 6 months and less grade 2 or higher neuropathy (16% vs 43%) <a class=\"trial-link\" href=\"/evidence/#t-achieve-2\">ACHIEVE-2</a>.</p>\n<h2 id=\"s-mismatch-repair-deficient-disease\">Mismatch-repair deficient disease</h2>\n<p>Test mismatch-repair status in localized colon cancer, because it changes the interpretation of fluoropyrimidine-only adjuvant therapy and identifies a group responsive to checkpoint blockade. In stage II dMMR/MSI-H tumours, fluoropyrimidine-only chemotherapy should not be routinely offered <a class=\"trial-link\" href=\"/evidence/#t-asco-guideline-baxter-et-al\">ASCO Guideline (Baxter et al.)</a>. For resected stage III dMMR colon cancer, <a class=\"trial-link\" href=\"/evidence/#t-atomic-a021502\">ATOMIC (A021502)</a> tested mFOLFOX6 with atezolizumab followed by atezolizumab maintenance against mFOLFOX6 alone. At median follow-up of 40.9 months, 3-year disease-free survival was 86.3% with atezolizumab-containing therapy versus 76.2% with mFOLFOX6 alone (HR 0.50, 95% CI 0.35–0.73; p&lt;0.001). Overall survival was not significant at median follow-up of 45.8 months (stratified p=0.68) <a class=\"trial-link\" href=\"/evidence/#t-atomic-a021502\">ATOMIC (A021502)</a>.</p>\n<h2 id=\"s-circulating-tumour-dna\">Circulating tumour DNA</h2>\n<p>Postoperative ctDNA is strongly prognostic, but a prognostic assay does not by itself establish an escalation strategy. <a class=\"trial-link\" href=\"/evidence/#t-galaxy-circulate-japan\">GALAXY (CIRCULATE-Japan)</a> was a prospective observational cohort: 4-week ctDNA positivity was associated with inferior 18-month DFS (38.4% vs 90.5%; HR 10.0, 95% CI 7.7–14.0), but adjuvant treatment was selected by clinicians rather than randomized <a class=\"trial-link\" href=\"/evidence/#t-galaxy-circulate-japan\">GALAXY (CIRCULATE-Japan)</a>. <a class=\"trial-link\" href=\"/evidence/#t-dynamic\">DYNAMIC</a> provides randomized stage II evidence for de-escalation. ctDNA-guided management reduced chemotherapy use from 28% to 15% while maintaining non-inferior 2-year recurrence-free survival (92.4% standard management vs 93.5% ctDNA-guided; absolute difference 1.1 percentage points, 95% CI -4.1 to 6.2; non-inferiority margin -8.5 points) <a class=\"trial-link\" href=\"/evidence/#t-dynamic\">DYNAMIC</a>. Do not extrapolate DYNAMIC to routine stage III escalation. <a class=\"trial-link\" href=\"/evidence/#t-dynamic-iii-agitg-cctg\">DYNAMIC-III (AGITG/CCTG)</a> found 3-year RFS of 87% with ctDNA-negative and 49% with ctDNA-positive disease, but escalation in ctDNA-positive patients did not improve 2-year RFS (51% vs 61%; HR 1.16, 95% CI 0.87–1.53) <a class=\"trial-link\" href=\"/evidence/#t-dynamic-iii-agitg-cctg\">DYNAMIC-III (AGITG/CCTG)</a>. <a class=\"trial-link\" href=\"/evidence/#t-altair-epoc1905-circulate-japan\">ALTAIR (EPOC1905, CIRCULATE-Japan)</a> likewise did not improve DFS with post-adjuvant trifluridine/tipiracil in a broader ctDNA-positive CRC population (median 9.30 vs 5.55 months; HR 0.79, 95% CI 0.60–1.05; p=0.107) and caused more grade 3 or higher haematologic adverse events (73.0% vs 3.3%) <a class=\"trial-link\" href=\"/evidence/#t-altair-epoc1905-circulate-japan\">ALTAIR (EPOC1905, CIRCULATE-Japan)</a>.</p>\n<h2 id=\"s-neoadjuvant-systemic-treatment\">Neoadjuvant systemic treatment</h2>\n<p>Neoadjuvant chemotherapy can be considered where a locally advanced primary threatens a complete resection. <a class=\"trial-link\" href=\"/evidence/#t-foxtrot\">FOxTROT</a> assigned operable cT3–4, N0–2, M0 colon cancer to 6 weeks of oxaliplatin-fluoropyrimidine chemotherapy before surgery with 18 postoperative weeks, or 24 weeks postoperatively; neoadjuvant treatment reduced 2-year residual or recurrent disease (16.9% vs 21.5%; rate ratio 0.72, 95% CI 0.54–0.98; p=0.037) <a class=\"trial-link\" href=\"/evidence/#t-foxtrot\">FOxTROT</a>. Randomized efficacy results differ across radiologically locally advanced disease. <a class=\"trial-link\" href=\"/evidence/#t-neocol\">NeoCol</a> found no 3-year DFS improvement with neoadjuvant CAPOX versus upfront surgery (83% vs 87%; p=.36), although downstaging occurred and fewer patients met criteria for adjuvant chemotherapy (59% vs 73%; p=.02) <a class=\"trial-link\" href=\"/evidence/#t-neocol\">NeoCol</a>. Use neoadjuvant chemotherapy selectively for cases in which downstaging may improve resectability, rather than as routine treatment for all cT3–4 disease <a class=\"trial-link\" href=\"/evidence/#t-foxtrot\">FOxTROT</a> <a class=\"trial-link\" href=\"/evidence/#t-neocol\">NeoCol</a>. For resectable locally advanced dMMR/MSI-H colon cancer, <a class=\"trial-link\" href=\"/evidence/#t-niche-2\">NICHE-2</a> is a single-group phase II study of 4 weeks of nivolumab plus ipilimumab before surgery. Surgery was timely in 98%, major pathological response occurred in 95%, pathological complete response in 68%, and no recurrence was reported at median follow-up of 26.2 months; the 3-year disease-free-survival co-primary endpoint remained immature <a class=\"trial-link\" href=\"/evidence/#t-niche-2\">NICHE-2</a>.</p>\n<h2 id=\"s-strategies-beyond-cytotoxic-chemotherapy\">Strategies beyond cytotoxic chemotherapy</h2>\n<p>Adjuvant anti-VEGF and anti-EGFR approaches have not improved outcomes. <a class=\"trial-link\" href=\"/evidence/#t-nsabp-c-08\">NSABP C-08</a> found no disease-free-survival benefit from 1 year of bevacizumab with mFOLFOX6 (HR 0.89, 95% CI 0.76–1.04; p=0.15), and <a class=\"trial-link\" href=\"/evidence/#t-avant\">AVANT</a> found no disease-free-survival benefit with bevacizumab-containing FOLFOX4 or XELOX; overall survival was worse with bevacizumab-FOLFOX4 in an exploratory analysis (HR 1.27, 95% CI 1.03–1.57) <a class=\"trial-link\" href=\"/evidence/#t-nsabp-c-08\">NSABP C-08</a> <a class=\"trial-link\" href=\"/evidence/#t-avant\">AVANT</a>. Cetuximab has no adjuvant role. In KRAS-wild-type stage III disease, <a class=\"trial-link\" href=\"/evidence/#t-n0147-alliance\">N0147 (Alliance)</a> showed 3-year DFS of 74.6% with mFOLFOX6 alone versus 71.5% with cetuximab plus mFOLFOX6 (HR 1.21, 95% CI 0.98–1.49), and <a class=\"trial-link\" href=\"/evidence/#t-petacc-8\">PETACC-8</a> showed 75.1% with cetuximab plus FOLFOX4 versus 78.0% with FOLFOX4 alone (HR 1.05, 95% CI 0.85–1.29) <a class=\"trial-link\" href=\"/evidence/#t-n0147-alliance\">N0147 (Alliance)</a> <a class=\"trial-link\" href=\"/evidence/#t-petacc-8\">PETACC-8</a>. <a class=\"trial-link\" href=\"/evidence/#t-alascca\">ALASCCA</a> tested aspirin 160 mg daily for 3 years in stage I–III rectal or stage II–III colon cancer with a PI3K-pathway alteration. In the PIK3CA exon 9/20 group, 3-year cumulative recurrence was 7.7% with aspirin versus 14.1% with placebo (HR 0.49, 95% CI 0.24–0.98; p=0.04); severe adverse events were more frequent with aspirin (16.8% vs 11.6%) <a class=\"trial-link\" href=\"/evidence/#t-alascca\">ALASCCA</a>. After adjuvant chemotherapy for resected stage III or high-risk stage II colon cancer, <a class=\"trial-link\" href=\"/evidence/#t-challenge\">CHALLENGE</a> found that a 3-year structured exercise programme improved 5-year DFS (80.3% vs 73.9%; HR 0.72, 95% CI 0.55–0.94; p=0.02) and 8-year OS (90.3% vs 83.2%; HR 0.63, 95% CI 0.43–0.94), with more musculoskeletal adverse events (18.5% vs 11.5%) <a class=\"trial-link\" href=\"/evidence/#t-challenge\">CHALLENGE</a>.</p>\n<h2 id=\"s-surveillance\">Surveillance</h2>\n<p>Surveillance after curative resection includes interval history and examination, CEA, cross-sectional imaging and colonoscopy. Assess patients every 3–6 months in years 1–2, then every 6 months through year 5; obtain CT every 6–12 months through year 5; and perform colonoscopy at 1 year, then according to findings.</p>\n<h2 id=\"s-references\">References</h2>\n<ol class=\"refs\">\n<li><a class=\"trial-link\" href=\"/evidence/#t-moertel-int-0035\">Moertel (INT-0035)</a>. <a href=\"https://drive.google.com/file/d/10Rb75VO57KeszN6Tjamh40v0gperXszm/preview\">N Engl J Med 1990;322:352-358</a>; <a href=\"https://pubmed.ncbi.nlm.nih.gov/7847642/\">Ann Intern Med 1995;122:321-326</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-impact\">IMPACT</a>. <a href=\"https://drive.google.com/file/d/1dc-BafoE-qg5N7ccORH7IsUlG2i7Am0u/preview\">Lancet 1995;345:939-944</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-mosaic\">MOSAIC</a>. <a href=\"https://drive.google.com/file/d/1Gf_tBXOAVuZMy70B5e8pglmPPZIb5yBX/preview\">N Engl J Med 2004;350:2343-2351</a>; <a href=\"https://drive.google.com/file/d/1CIaHBVMwBMNzewcqDRqN1TuVYMpDV_GU/preview\">J Clin Oncol 2009;27:3109-3116</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-nsabp-c-07\">NSABP C-07</a>. <a href=\"https://drive.google.com/file/d/1wQKH0jsolJBrrWR013HAr6wzQXjgJ4jg/preview\">J Clin Oncol 2007;25:2198-2204</a>; <a href=\"https://drive.google.com/file/d/1zF87t29u_wGRROP7eb4JzqHVGyRUOiby/preview\">J Clin Oncol 2011;29:3768-3774</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-xeloxa-no16968\">XELOXA (NO16968)</a>. <a href=\"https://drive.google.com/file/d/15hAt56N3V1qyWdoUtty15ONKhaBa_kof/preview\">J Clin Oncol 2011;29:1465-1471</a>; <a href=\"https://drive.google.com/file/d/1zJmNLgq5251A3RrbXvW9xCNuHXETKN8m/preview\">J Clin Oncol 2015;33:3733-3740</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-x-act\">X-ACT</a>. <a href=\"https://drive.google.com/file/d/1Nfgunl6adiVY1xRcSz2SPDg4JNzlhrJE/preview\">N Engl J Med 2005;352:2696-2704</a>; <a href=\"https://drive.google.com/file/d/1zBRwUm9Brd6ZoozRixq8fD00lDBPtg4Y/preview\">Ann Oncol 2012;23:1190-1197</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-idea-collaboration\">IDEA Collaboration</a>. <a href=\"https://drive.google.com/file/d/1RPRet0zdyApXo4EBEj-31Ln9YJYlaezD/preview\">N Engl J Med 2018;378:1177-1188</a>; <a href=\"https://drive.google.com/file/d/1FLlhf1Nm7BHSLnmdFq3zp9cbjDc2-uyo/preview\">Lancet Oncol 2020;21:1620-1629</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-quasar\">QUASAR</a>. <a href=\"https://drive.google.com/file/d/1H2tyv3rjVRGc0ZsP8tEjv4YBJhO2Uf3K/preview\">Lancet 2007;370:2020-2029</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-asco-guideline-baxter-et-al\">ASCO Guideline (Baxter et al.)</a>. <a href=\"https://drive.google.com/file/d/1aTcP3zGbwDJHG57m8jVe8e3ezqkMF0kZ/preview\">J Clin Oncol 2022;40:892-910</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-idea-collaboration-stage-ii\">IDEA Collaboration (Stage II)</a>. <a href=\"https://drive.google.com/file/d/15JedInC_Ze1julN49OsWr-pAJJQwlkyu/preview\">J Clin Oncol 2021;39:631-641</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-achieve-2\">ACHIEVE-2</a>. <a href=\"https://drive.google.com/file/d/174hrj4LhAMkmhWa1kBvHSLYKTd_rLI6P/preview\">Ann Oncol 2021;32:77-84</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-atomic-a021502\">ATOMIC (A021502)</a>. <a href=\"https://drive.google.com/file/d/1xZaNpvkVc7lx91xL8rAaxnANeQkK-E01/preview\">N Engl J Med 2026;394:1155-1166</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-galaxy-circulate-japan\">GALAXY (CIRCULATE-Japan)</a>. <a href=\"https://drive.google.com/file/d/13SPgHrv1hqu7ApPPeMRFc5MVLZF8AznH/preview\">Nat Med 2023;29:127-134</a>; <a href=\"https://drive.google.com/file/d/1dhjK4mDjWBFjtNbEsbY2TmF7A01pnIuN/preview\">Nat Med 2024;30:3272-3283</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-dynamic\">DYNAMIC</a>. <a href=\"https://drive.google.com/file/d/1ZCz8Z22j4MjihE86CF_wznqsSsevVE1b/preview\">N Engl J Med 2022;386:2261-2272</a>; <a href=\"https://pubmed.ncbi.nlm.nih.gov/40055522/\">Nat Med 2025;31:1509-1518</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-dynamic-iii-agitg-cctg\">DYNAMIC-III (AGITG/CCTG)</a>. <a href=\"https://drive.google.com/file/d/1wecvH9Kn2lA0q-DPdvtzucX_8HUjOvLg/preview\">Nat Med 2025;31:4291-4300</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-altair-epoc1905-circulate-japan\">ALTAIR (EPOC1905, CIRCULATE-Japan)</a>. <a href=\"https://drive.google.com/file/d/19HJJUPb81LKiIEqHOqsDaDvGtFVD0GWK/preview\">Nat Med 2026;32:2473-2480</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-foxtrot\">FOxTROT</a>. <a href=\"https://drive.google.com/file/d/1pVlPwYiYMbsdS30fxKVO8TmuireAmvzn/preview\">J Clin Oncol 2023;41:1541-1552</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-neocol\">NeoCol</a>. <a href=\"https://drive.google.com/file/d/1909JNEEzzHDQbeycfZ3eS8EqwJ5KDLOs/preview\">JAMA Surg 2026;161:450-458</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-niche-2\">NICHE-2</a>. <a href=\"https://drive.google.com/file/d/1oVet9rorNcyWqveB7IIU_59hjs5fMzHy/preview\">N Engl J Med 2024</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-nsabp-c-08\">NSABP C-08</a>. <a href=\"https://drive.google.com/file/d/1e8xs8BVMkL1NR9o4UZmZRZss4sk3r4B_/preview\">J Clin Oncol 2011;29:11-16</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-avant\">AVANT</a>. <a href=\"https://drive.google.com/file/d/1Am9NE08raCprQ0t_qBw82dLddT-V8zFj/preview\">Lancet Oncol 2012;13:1225-1233</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-n0147-alliance\">N0147 (Alliance)</a>. <a href=\"https://drive.google.com/file/d/1rjUWbBDOA4QSCiW0kGtBSoDcokdRmx-3/preview\">JAMA 2012;307:1383-1393</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-petacc-8\">PETACC-8</a>. <a href=\"https://drive.google.com/file/d/1ZBr-zxPc9ca-1I4BkYmP1DBtCFG20mxw/preview\">Lancet Oncol 2014;15:862-873</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-alascca\">ALASCCA</a>. <a href=\"https://drive.google.com/file/d/1DhPNHMchj4sE30OSQlwk0XSp64sEWPvd/preview\">N Engl J Med 2025;393:1051-1064</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-challenge\">CHALLENGE</a>. <a href=\"https://drive.google.com/file/d/1yj_qjmXE0CgS5uZVK_rT8HZRQLpahxQK/preview\">N Engl J Med 2025;393:13-25</a></li>\n</ol>", "_hay": "localized colon cancer localized-colon-cancer colorectal staging and surgery adjuvant treatment for node-positive disease stage ii disease mismatch-repair deficient disease circulating tumour dna neoadjuvant systemic treatment strategies beyond cytotoxic chemotherapy surveillance references choosing duration"}, {"id": "colorectal-metastatic-colorectal-cancer", "slug": "metastatic-colorectal-cancer", "group": "Colorectal", "title": "Metastatic colorectal cancer", "updated": "", "sections": [{"id": "s-treatment-framework", "h": "Treatment framework"}, {"id": "s-first-line-cytotoxic-platform", "h": "First-line cytotoxic platform"}, {"id": "s-first-line-biologic-selection", "h": "First-line biologic selection"}, {"id": "s-maintenance-and-treatment-at-progression", "h": "Maintenance and treatment at progression"}, {"id": "s-older-or-frail-patients", "h": "Older or frail patients"}, {"id": "s-msi-h-dmmr-disease", "h": "MSI-H/dMMR disease"}, {"id": "s-braf-v600e-mutant-disease", "h": "BRAF V600E-mutant disease"}, {"id": "s-her2-positive-and-kras-g12c-disease", "h": "HER2-positive and KRAS G12C disease"}, {"id": "s-refractory-disease", "h": "Refractory disease"}, {"id": "s-oligometastatic-and-liver-limited-disease", "h": "Oligometastatic and liver-limited disease"}, {"id": "s-peritoneal-limited-disease", "h": "Peritoneal-limited disease"}, {"id": "s-references", "h": "References"}], "html": "<h2 id=\"s-treatment-framework\">Treatment framework</h2>\n<p>Metastatic colorectal cancer requires a treatment plan that separates potentially curable oligometastatic disease from disease managed with systemic therapy. Fitness, disease tempo, resectability, primary-tumour symptoms, prior exposure and molecular results should be assessed before fixing the first-line regimen. For most patients, a fluoropyrimidine plus oxaliplatin or irinotecan is the cytotoxic platform; biologic selection then depends on MSI/MMR, extended RAS, BRAF V600E, HER2 and tumour sidedness. The aim is to expose a suitable patient to active cytotoxic classes and to reserve molecularly selected treatment for the relevant branch. </p>\n<h2 id=\"s-first-line-cytotoxic-platform\">First-line cytotoxic platform</h2>\n<p>FOLFOX and FOLFIRI are the usual doublets. Oxaliplatin added to infusional fluorouracil/leucovorin improved progression-free survival and response in de Gramont, without a statistically significant overall-survival gain in the intention-to-treat analysis; crossover was common. <a class=\"trial-link\" href=\"/evidence/#t-de-gramont-folfox\">de Gramont (FOLFOX)</a> FOLFOX was superior to bolus IFL in N9741, but that comparison does not establish superiority over infusional FOLFIRI. <a class=\"trial-link\" href=\"/evidence/#t-n9741\">N9741</a> Irinotecan plus infusional fluorouracil/leucovorin improved response, time to progression and overall survival in Douillard. <a class=\"trial-link\" href=\"/evidence/#t-douillard\">Douillard</a> The older bolus IFL regimen also improved progression-free and overall survival over fluorouracil/leucovorin, but is no longer the preferred platform. <a class=\"trial-link\" href=\"/evidence/#t-saltz-ifl\">Saltz (IFL)</a> FOLFOX and FOLFIRI can be used in either sequence. GERCOR found no significant difference in second progression-free survival or overall survival between planned FOLFIRI→FOLFOX6 and FOLFOX6→FOLFIRI strategies; the result supports sequential use, rather than formal equivalence. <a class=\"trial-link\" href=\"/evidence/#t-gercor-tournigand\">GERCOR (Tournigand)</a> CAPOX/XELOX is an oral fluoropyrimidine alternative to FOLFOX4: the noninferiority boundary for progression-free survival was met in both eligible and intention-to-treat populations. <a class=\"trial-link\" href=\"/evidence/#t-no16966-xelox-vs-folfox-4\">NO16966 (XELOX vs FOLFOX-4)</a> Triplet FOLFOXIRI plus bevacizumab is an intensive option for a very fit patient when a rapid response or conversion objective is clinically important. In TRIBE, it improved progression-free survival and response over FOLFIRI plus bevacizumab; the mature overall-survival result was a secondary, nominal analysis. <a class=\"trial-link\" href=\"/evidence/#t-tribe\">TRIBE</a> In RAS/BRAF wild-type disease receiving panitumumab, mFOLFOXIRI did not improve response, progression-free survival or R0 resection over mFOLFOX, and added gastrointestinal toxicity. <a class=\"trial-link\" href=\"/evidence/#t-triplete\">TRIPLETE</a></p>\n<h2 id=\"s-first-line-biologic-selection\">First-line biologic selection</h2>\n<p>Bevacizumab can be combined with an oxaliplatin- or irinotecan-based doublet when an anti-EGFR strategy is not preferred. Bevacizumab improved overall survival with IFL in AVF2107g. <a class=\"trial-link\" href=\"/evidence/#t-avf2107g-hurwitz\">AVF2107g (Hurwitz)</a> With oxaliplatin-based chemotherapy in NO16966, it improved progression-free survival but not overall survival or response rate. <a class=\"trial-link\" href=\"/evidence/#t-no16966-bevacizumab\">NO16966 (bevacizumab)</a> For left-sided, extended RAS- and BRAF-wild-type, HER2-non-amplified disease, chemotherapy plus an anti-EGFR antibody is generally preferred when first-line systemic therapy is required. PARADIGM prospectively showed longer overall survival with panitumumab plus mFOLFOX6 than with bevacizumab plus mFOLFOX6 in left-sided tumours. <a class=\"trial-link\" href=\"/evidence/#t-paradigm\">PARADIGM</a> Right-sided primary tumours are generally managed first with chemotherapy plus an antiangiogenic agent. Anti-EGFR therapy may still be considered later for an extended RAS- and BRAF-wild-type, HER2-non-amplified tumour. The enlarged KRAS-evaluable analysis in CRYSTAL was retrospective and exploratory. In KRAS wild-type disease, cetuximab plus FOLFIRI was associated with better progression-free survival, overall survival and response; all subgroup and treatment-by-KRAS P values were nominal and unadjusted, although interactions were reported for all three endpoints. <a class=\"trial-link\" href=\"/evidence/#t-crystal\">CRYSTAL</a> Panitumumab plus FOLFOX improved progression-free survival in KRAS wild-type disease and was detrimental in KRAS-mutant disease. <a class=\"trial-link\" href=\"/evidence/#t-prime\">PRIME</a> FIRE-3 did not meet its primary objective-response endpoint; its secondary overall-survival analysis favoured cetuximab. CALGB/SWOG 80405 found no statistically significant difference in overall or progression-free survival and did not analyse sidedness prospectively. <a class=\"trial-link\" href=\"/evidence/#t-fire-3\">FIRE-3</a> <a class=\"trial-link\" href=\"/evidence/#t-calgb-swog-80405\">CALGB/SWOG 80405</a> Anti-EGFR therapy causes acneiform rash, hypomagnesaemia and ocular toxicity; cetuximab may cause infusion reactions. Rechallenge after prior anti-EGFR benefit may be considered only after a treatment-free interval and reassessment with circulating tumour DNA showing no acquired RAS/BRAF resistance alteration. </p>\n<h2 id=\"s-maintenance-and-treatment-at-progression\">Maintenance and treatment at progression</h2>\n<p>After induction disease control, fluoropyrimidine-based maintenance with bevacizumab may reduce cumulative toxicity while preserving disease control. Maintenance fluoropyrimidine plus bevacizumab improved progression-free endpoints over observation, without a consistent overall-survival advantage. Maintenance anti-EGFR therapy is usually paired with a fluoropyrimidine rather than given alone after an anti-EGFR-containing induction regimen. The choice between maintenance and a treatment break should reflect response depth, cumulative neuropathy, patient preference and the prospect of reintroducing the induction doublet. </p>\n<p>At first progression, switch the cytotoxic backbone if it remains tolerable and consider continued VEGF-pathway blockade. Continuing bevacizumab with second-line chemotherapy after progression on a bevacizumab-containing first line improved overall survival in TML. <a class=\"trial-link\" href=\"/evidence/#t-tml-ml18147\">TML (ML18147)</a> Aflibercept plus FOLFIRI after oxaliplatin and ramucirumab plus FOLFIRI after bevacizumab, oxaliplatin and fluoropyrimidine each improved overall survival. <a class=\"trial-link\" href=\"/evidence/#t-velour\">VELOUR</a> <a class=\"trial-link\" href=\"/evidence/#t-raise\">RAISE</a> These studies support continuing VEGF-pathway pressure after progression, not retaining an ineffective cytotoxic backbone. Their populations differ: VELOUR was defined by previous oxaliplatin exposure, whereas TML and RAISE required prior bevacizumab. </p>\n<h2 id=\"s-older-or-frail-patients\">Older or frail patients</h2>\n<p>For patients unsuitable for an oxaliplatin- or irinotecan-containing doublet, reduced-intensity treatment should be selected by molecular status and tolerance. In AVEX, capecitabine plus bevacizumab improved progression-free survival over capecitabine alone in patients aged 70 years or older, without a statistically significant overall-survival gain and with more treatment discontinuation. In PANDA, 5-fluorouracil plus panitumumab produced similar progression-free and overall survival to FOLFOX plus panitumumab in selected older patients with RAS/BRAF-wild-type disease, with fewer grade 3 or higher adverse events. </p>\n<h2 id=\"s-msi-h-dmmr-disease\">MSI-H/dMMR disease</h2>\n<p>MSI-H/dMMR metastatic colorectal cancer should receive checkpoint inhibition in the first line unless an immediate clinical circumstance requires another approach. Pembrolizumab improved progression-free survival over investigator&#x27;s-choice chemotherapy in KEYNOTE-177. <a class=\"trial-link\" href=\"/evidence/#t-keynote-177\">KEYNOTE-177</a> Nivolumab plus ipilimumab is another first-line standard. In the centrally confirmed MSI-H/dMMR primary efficacy population of CheckMate 8HW, 24-month progression-free survival was 72% with dual immunotherapy and 14% with chemotherapy; proportional hazards were violated, so the prespecified restricted-mean analysis rather than a hazard ratio quantified the benefit. <a class=\"trial-link\" href=\"/evidence/#t-checkmate-8hw-first-line-vs-chemotherapy\">CheckMate 8HW (first-line vs chemotherapy)</a> The all-lines comparison of nivolumab plus ipilimumab with nivolumab alone also improved blinded independent central-review progression-free survival in centrally confirmed MSI-H/dMMR disease. <a class=\"trial-link\" href=\"/evidence/#t-checkmate-8hw-nivolumab-ipilimumab-vs-nivolumab\">CheckMate 8HW (nivolumab + ipilimumab vs nivolumab)</a> This result should not be recast as a first-line nivolumab-versus-dual-immunotherapy comparison because that interim analysis remained masked. <a class=\"trial-link\" href=\"/evidence/#t-checkmate-8hw-nivolumab-ipilimumab-vs-nivolumab\">CheckMate 8HW (nivolumab + ipilimumab vs nivolumab)</a> COMMIT compared atezolizumab alone with atezolizumab plus mFOLFOX6 and bevacizumab in a small interim first-line dMMR/MSI-H cohort. In this conference-abstract analysis, the combination improved progression-free survival and response; the result supports chemo-immunotherapy over PD-L1 monotherapy but does not displace established PD-1-based strategies. <a class=\"trial-link\" href=\"/evidence/#t-commit-nrg-gi004-swog-s1610\">COMMIT (NRG-GI004/SWOG-S1610)</a></p>\n<h2 id=\"s-braf-v600e-mutant-disease\">BRAF V600E-mutant disease</h2>\n<p>BRAF V600E disease requires a distinct pathway-directed strategy. After one or two prior regimens, encorafenib plus cetuximab is the established chemotherapy-free option. In BEACON, the primary overall-survival and response comparisons tested encorafenib, binimetinib and cetuximab against control; encorafenib plus cetuximab also showed better overall survival and response in secondary analyses. <a class=\"trial-link\" href=\"/evidence/#t-beacon-crc\">BEACON CRC</a> In previously untreated BRAF V600E disease, encorafenib, cetuximab and mFOLFOX6 improved response and progression-free survival over standard chemotherapy with or without bevacizumab in BREAKWATER. <a class=\"trial-link\" href=\"/evidence/#t-breakwater\">BREAKWATER</a> For a tumour that is both BRAF V600E-mutant and MSI-H/dMMR, first-line immunotherapy remains a reasonable priority because the relevant chemo-targeted trial excluded dMMR disease. </p>\n<h2 id=\"s-her2-positive-and-kras-g12c-disease\">HER2-positive and KRAS G12C disease</h2>\n<p>For chemotherapy-refractory HER2-positive, RAS wild-type disease, tucatinib plus trastuzumab is a chemotherapy-free targeted option. MOUNTAINEER reported a centrally reviewed confirmed response rate of 38.1%, with a median response duration of 12.4 months. <a class=\"trial-link\" href=\"/evidence/#t-mountaineer\">MOUNTAINEER</a> KRAS G12C inhibition in colorectal cancer requires concurrent EGFR blockade because of EGFR-mediated pathway reactivation. In chemorefractory disease, sotorasib 960 mg plus panitumumab improved progression-free survival over trifluridine/tipiracil or regorafenib in CodeBreaK 300. <a class=\"trial-link\" href=\"/evidence/#t-codebreak-300\">CodeBreaK 300</a></p>\n<h2 id=\"s-refractory-disease\">Refractory disease</h2>\n<p>After active cytotoxics, biologics and any relevant molecularly selected treatment have been used, trifluridine/tipiracil plus bevacizumab is a preferred oral-based option. SUNLIGHT improved overall survival and progression-free survival over trifluridine/tipiracil alone in a population treated after up to two prior regimens. <a class=\"trial-link\" href=\"/evidence/#t-sunlight\">SUNLIGHT</a> Trifluridine/tipiracil monotherapy, regorafenib and fruquintinib are alternatives according to prior treatment, performance status and toxicity priorities. RECOURSE established trifluridine/tipiracil monotherapy, while CORRECT and its Asian confirmatory study CONCUR established regorafenib. <a class=\"trial-link\" href=\"/evidence/#t-recourse\">RECOURSE</a> <a class=\"trial-link\" href=\"/evidence/#t-correct\">CORRECT</a> <a class=\"trial-link\" href=\"/evidence/#t-concur\">CONCUR</a> FRESCO-2 established fruquintinib after prior trifluridine/tipiracil and/or regorafenib in a more heavily pretreated population. <a class=\"trial-link\" href=\"/evidence/#t-fresco-2\">FRESCO-2</a> Week-by-week regorafenib dose escalation is an alternative to starting at 160 mg daily. In ReDOS, starting at 80 mg daily and escalating weekly increased the proportion initiating cycle 3; overall and progression-free survival were secondary and not statistically significant. <a class=\"trial-link\" href=\"/evidence/#t-redos\">ReDOS</a> Regorafenib commonly causes hand-foot skin reaction, fatigue, hypertension and hepatotoxicity; trifluridine/tipiracil commonly causes myelosuppression. </p>\n<h2 id=\"s-oligometastatic-and-liver-limited-disease\">Oligometastatic and liver-limited disease</h2>\n<p>Potentially resectable liver-limited disease should be reviewed in a specialist multidisciplinary setting. The objective is complete clearance of all disease while preserving an adequate future liver remnant; systemic therapy may be used before resection for conversion or to test disease biology. In otherwise asymptomatic colorectal primary tumours with synchronous unresectable metastatic disease, routine primary-tumour resection before systemic therapy does not improve survival. In multiorgan metastatic disease responding to induction chemotherapy, planned debulking of at least 80% of metastases did not improve overall or progression-free survival and increased serious adverse events in ORCHESTRA. <a class=\"trial-link\" href=\"/evidence/#t-orchestra\">ORCHESTRA</a></p>\n<p>For resectable colorectal liver metastases, perioperative or postoperative oxaliplatin-based chemotherapy may delay recurrence but has not shown a durable overall-survival advantage. Chemotherapy duration should be minimised when surgery is planned because irinotecan-associated steatohepatitis and oxaliplatin-associated sinusoidal injury may compromise liver surgery. Anti-EGFR treatment should not be added perioperatively to chemotherapy for resectable KRAS wild-type liver metastases: cetuximab was detrimental in New EPOC. For initially unresectable liver-only disease, choose the most active tolerable regimen with a defined conversion goal and reassess resectability repeatedly. Local ablation can be considered for selected small-volume liver metastases when resection is unsuitable or as part of a combined clearance strategy. Liver transplantation may be considered only within specialised programmes for highly selected patients with unresectable, liver-only, BRAF-wild-type disease that remains responsive to systemic chemotherapy. In TransMet, patients had received at least 3 months and no more than three lines of chemotherapy. </p>\n<h2 id=\"s-peritoneal-limited-disease\">Peritoneal-limited disease</h2>\n<p>Selected patients with colorectal peritoneal metastases may be considered for cytoreductive surgery when complete macroscopic resection is feasible. Adding oxaliplatin HIPEC to complete cytoreduction did not improve overall survival in PRODIGE-7, so cytoreduction and HIPEC should not be treated as inseparable interventions. Perioperative systemic therapy and cytoreductive surgery should be individualised by peritoneal disease burden, resectability, response to systemic treatment and morbidity. Subgroup observations from perioperative studies should not determine routine selection without confirmatory evidence. </p>\n<h2 id=\"s-references\">References</h2>\n<ol class=\"refs\">\n<li><a class=\"trial-link\" href=\"/evidence/#t-de-gramont-folfox\">de Gramont (FOLFOX)</a>. <a href=\"https://drive.google.com/file/d/1DBIdsVjRFTXQOJvH8P480ikW0MHTaNmc/preview\">J Clin Oncol 2000;18:2938-2947</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-n9741\">N9741</a>. <a href=\"https://drive.google.com/file/d/1oqNTZlGvU8UcsKe9bAeI1VPIxejlp1Qz/preview\">J Clin Oncol 2004;22:23-30</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-douillard\">Douillard</a>. <a href=\"https://drive.google.com/file/d/1YTWs9dkwgkDwkxaDgEbEUeSGEOeVZTuH/preview\">Lancet 2000;355:1041-1047</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-saltz-ifl\">Saltz (IFL)</a>. <a href=\"https://drive.google.com/file/d/1d5dwbzHTEFETsAdeQjYPMGon8JmdkUcJ/preview\">N Engl J Med 2000;343:905-914</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-gercor-tournigand\">GERCOR (Tournigand)</a>. <a href=\"https://drive.google.com/file/d/1kDVUyyZFIASZ_FOR3U92YUOg3NTWUwxs/preview\">J Clin Oncol 2004;22:229-237</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-no16966-xelox-vs-folfox-4\">NO16966 (XELOX vs FOLFOX-4)</a>. <a href=\"https://drive.google.com/file/d/1eHTNX_uKUZ7y4DT_fSI-dq6Kb3MWYIvj/preview\">J Clin Oncol 2008;26:2006-2012</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-tribe\">TRIBE</a>. <a href=\"https://drive.google.com/file/d/1UKwif-OAHSN0-g2zU3mG7a3VjKhvB7yf/preview\">N Engl J Med 2014;371:1609-1618</a>; <a href=\"https://drive.google.com/file/d/1feQwqxSnPEsPD4VOgvqf-kTBAMMVfqm9/preview\">Lancet Oncol 2015;16:1306-1315</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-triplete\">TRIPLETE</a>. <a href=\"https://drive.google.com/file/d/1RGZPWYhvUPpCg7uNctH-OEdEFs5KKmY2/preview\">J Clin Oncol 2022;40:2878-2888</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-avf2107g-hurwitz\">AVF2107g (Hurwitz)</a>. <a href=\"https://drive.google.com/file/d/13zqgoNpGlBCq4NT4qTM35FkYjDpxBte5/preview\">N Engl J Med 2004;350:2335-2342</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-no16966-bevacizumab\">NO16966 (bevacizumab)</a>. <a href=\"https://drive.google.com/file/d/12YROkOIw8pzAAe1NKJSViaNNWzH2TZl1/preview\">J Clin Oncol 2008;26:2013-2019</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-paradigm\">PARADIGM</a>. <a href=\"https://drive.google.com/file/d/16eEHm4PchnRfWejEV-QwC5oZIsKWtJbR/preview\">JAMA 2023;329:1271-1282</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-crystal\">CRYSTAL</a>. <a href=\"https://drive.google.com/file/d/1y88Krb5qyVl0Q9vVkOgjBKAynfUyiaCG/preview\">N Engl J Med 2009;360:1408-1417</a>; <a href=\"https://drive.google.com/file/d/1SlbcbsSKemz8m4eXuXaxBYzwGL6wXteW/preview\">J Clin Oncol 2011;29:2011-2019</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-prime\">PRIME</a>. <a href=\"https://drive.google.com/file/d/1fuRYzNw6zntebJAwESFxfTvB8cFu6RZs/preview\">J Clin Oncol 2010;28:4697-4705</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-fire-3\">FIRE-3</a>. <a href=\"https://drive.google.com/file/d/1WSr1DTD_N82bmrEVjEOkDwF0Iy1ULQKI/preview\">Lancet Oncol 2014;15:1065-1075</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-calgb-swog-80405\">CALGB/SWOG 80405</a>. <a href=\"https://drive.google.com/file/d/1EWGIiIMm6pRFZBvrVEvyAA3DA-1JN_GX/preview\">JAMA 2017;317:2392-2401</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-tml-ml18147\">TML (ML18147)</a>. <a href=\"https://drive.google.com/file/d/16JcsCnYwMEpcwfn9pMsz_f9Qq05IBbxE/preview\">Lancet Oncol 2013;14:29-37</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-velour\">VELOUR</a>. <a href=\"https://drive.google.com/file/d/1WZu-GVzj5NQ6U5Y4zl3X9JEZ_a6MpNlo/preview\">J Clin Oncol 2012;30:3499-3506</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-raise\">RAISE</a>. <a href=\"https://drive.google.com/file/d/100YvIKh06br7qWkVceKI9fzVVNleY-Xi/preview\">Lancet Oncol 2015;16:499-508</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-keynote-177\">KEYNOTE-177</a>. <a href=\"https://drive.google.com/file/d/1e01b_Js4XP2Sqps0d7U4MJB7h58EQU5A/preview\">N Engl J Med 2020;383:2207-2218</a>; <a href=\"https://drive.google.com/file/d/1wkRX-Q7qSfy6V_GCZgq5hsHV_aBLaSMn/preview\">Lancet Oncol 2022;23:659-670</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-checkmate-8hw-first-line-vs-chemotherapy\">CheckMate 8HW (first-line vs chemotherapy)</a>. <a href=\"https://drive.google.com/file/d/1pk2B3dytVmmNK12zpoSOPcXRcj1yu6IE/preview\">N Engl J Med 2024;391:2014-2026</a>; <a href=\"https://drive.google.com/file/d/1jey534CSgGRPukEDLmKHrxchGLKyAaAP/preview\">Lancet 2025;405:383-395</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-checkmate-8hw-nivolumab-ipilimumab-vs-nivolumab\">CheckMate 8HW (nivolumab + ipilimumab vs nivolumab)</a>. <a href=\"https://drive.google.com/file/d/1jey534CSgGRPukEDLmKHrxchGLKyAaAP/preview\">Lancet 2025;405:383-395</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-commit-nrg-gi004-swog-s1610\">COMMIT (NRG-GI004/SWOG-S1610)</a>. <a href=\"https://drive.google.com/file/d/1vURw5NH9NyUvfVchaT6SG0iZAcGGBHSO/preview\">J Clin Oncol 2026;44(suppl 2):14</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-beacon-crc\">BEACON CRC</a>. <a href=\"https://drive.google.com/file/d/1K5VpnqYfwhLmLOchNwXP1MNPYhs6j9zD/preview\">N Engl J Med 2019;381:1632-1643</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-breakwater\">BREAKWATER</a>. <a href=\"https://drive.google.com/file/d/1icf2E0hlBGZBcOHSoiBwzApdJNQQ6fTW/preview\">N Engl J Med 2025;392:2425-2437</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-mountaineer\">MOUNTAINEER</a>. <a href=\"https://drive.google.com/file/d/1_nPSdMMvWCuIe8bskn4kN9Y1VHcUi9ZW/preview\">Lancet Oncol 2023;24:496-508</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-codebreak-300\">CodeBreaK 300</a>. <a href=\"https://drive.google.com/file/d/1CD8d0_EHwJYqEx76tUC0alQ5JlP_FGig/preview\">N Engl J Med 2023;389:2125-2139</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-sunlight\">SUNLIGHT</a>. <a href=\"https://drive.google.com/file/d/1Z6KZ5mHlNzMuRmn7yKOSt7T6xRqRwnP4/preview\">N Engl J Med 2023;388:1657-1667</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-recourse\">RECOURSE</a>. <a href=\"https://drive.google.com/file/d/1Os_HSBOJyYVvNdlejatRDv8dILlQI5Ig/preview\">N Engl J Med 2015;372:1909-1919</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-correct\">CORRECT</a>. <a href=\"https://drive.google.com/file/d/1mvBAGrnzWmYBUKGIh4d2IaYFfrrCID4L/preview\">Lancet 2013;381:303-312</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-concur\">CONCUR</a>. <a href=\"https://drive.google.com/file/d/1IbNxkkE6lIJSguXzZhwNsF-ryG0f7mJH/preview\">Lancet Oncol 2015;16:619-629</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-fresco-2\">FRESCO-2</a>. <a href=\"https://drive.google.com/file/d/17ysTOAkC-5DRuCrFKYsFVfP7IGGAqwFt/preview\">Lancet 2023;402:41-53</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-redos\">ReDOS</a>. <a href=\"https://drive.google.com/file/d/1Ah1ZJbR43RTNj6vQKFqb0OqQG21d6_Tb/preview\">Lancet Oncol 2019;20:1070-1082</a></li>\n<li><a class=\"trial-link\" href=\"/evidence/#t-orchestra\">ORCHESTRA</a>. <a href=\"https://drive.google.com/file/d/17wSCPqartD-rUY5Nw-eiMFTlZPr3HvAs/preview\">JAMA 2026;335:1311-1320</a></li>\n</ol>", "_hay": "metastatic colorectal cancer metastatic-colorectal-cancer colorectal treatment framework first-line cytotoxic platform first-line biologic selection maintenance and treatment at progression older or frail patients msi-h/dmmr disease braf v600e-mutant disease her2-positive and kras g12c disease refractory disease oligometastatic and liver-limited disease peritoneal-limited disease references"}, {"id": "lung-nsclc-classification-staging-and-molecular-profile", "slug": "nsclc-classification-staging-and-molecular-profile", "group": "Lung", "title": "NSCLC: classification, staging and molecular profile", "updated": "", "sections": [{"id": "s-histological-classification", "h": "Histological classification"}, {"id": "s-histopathology-and-immunohistochemistry", "h": "Histopathology and immunohistochemistry"}, {"id": "s-molecular-profile-of-adenocarcinoma", "h": "Molecular profile of adenocarcinoma"}, {"id": "s-molecular-testing-what-each-assay-detects", "h": "Molecular testing: what each assay detects"}, {"id": "s-tissue-acquisition", "h": "Tissue acquisition"}, {"id": "s-staging", "h": "Staging"}, {"id": "s-screening", "h": "Screening"}, {"id": "s-references", "h": "References"}], "html": "<h2 id=\"s-histological-classification\">Histological classification</h2>\n<p>Lung cancer divides first into small cell and non-small cell carcinoma, and non-small cell carcinoma then divides by differentiation and by lineage. Adenocarcinoma is graded by its predominant growth pattern:</p>\n<ul><li>lepidic is well differentiated;</li><li>acinar and papillary are moderately differentiated;</li><li>solid and micropapillary are poorly differentiated;</li><li>mucinous and colloid patterns sit outside that gradient.</li></ul>\n<p>The other non-small-cell entities include:</p>\n<ul><li>squamous cell carcinoma;</li><li>adenosquamous carcinoma;</li><li>sarcomatoid carcinoma;</li><li>large cell carcinoma;</li><li>carcinoid tumour;</li><li>lymphoepithelial carcinoma.</li></ul>\n<p>Carcinoid is carried here under the non-small-cell branch; the WHO classification places it among the neuroendocrine neoplasms alongside small cell carcinoma. Lymphoepithelial carcinoma is associated with Epstein-Barr virus, and its appearance in a lung specimen should prompt nasoendoscopy to exclude a nasopharyngeal primary.</p>\n<h2 id=\"s-histopathology-and-immunohistochemistry\">Histopathology and immunohistochemistry</h2>\n<p>Morphology assigns lineage; immunohistochemistry confirms it when morphology is equivocal, which in practice means on small biopsies and in poorly differentiated tumours. Large cell carcinoma is a diagnosis of exclusion, made when neither glandular nor squamous differentiation can be demonstrated. CD45 is the leucocyte common antigen and is characteristically negative in small cell carcinoma.</p>\n<div class=\"tblwrap\"><table><thead><tr><th scope=\"col\"></th><th scope=\"col\">Adenocarcinoma</th><th scope=\"col\">Squamous cell carcinoma</th><th scope=\"col\">Adenosquamous carcinoma</th><th scope=\"col\">Large cell carcinoma</th><th scope=\"col\">Small cell carcinoma</th></tr></thead><tbody><tr><td>Histopathology</td><td>Neoplastic gland formation or intracytoplasmic mucin</td><td>Keratin production by tumour cells, intercellular desmosomes, or both</td><td>More than 10% each of malignant glandular and squamous components</td><td>Absence of glandular or squamous differentiation</td><td>Hyperchromatic nuclei, nuclear moulding, salt-and-pepper chromatin, high nuclear-to-cytoplasmic ratio, cohesive sheets of small blue cells with rosette formation</td></tr><tr><td>Positive</td><td>TTF-1, CK7, mucin, napsin A, surfactant proteins A and B, PAS-diastase, mucicarmine</td><td>p40, p63, CK5/6, desmoglein</td><td>Both adenocarcinoma and squamous markers</td><td></td><td>TTF-1, synaptophysin, chromogranin, neuron-specific enolase, high proliferative index (Ki-67, MIB-1)</td></tr><tr><td>Negative</td><td>CK20 (typically positive in colon), thyroglobulin</td><td>CK7 (usually), CK20</td><td></td><td></td><td></td></tr></tbody></table></div>\n<p>Where the primary site is in doubt, the differential is settled by a site-of-origin panel rather than by any single marker.</p>\n<div class=\"tblwrap\"><table><thead><tr><th scope=\"col\">Site</th><th scope=\"col\">Positive</th><th scope=\"col\">Negative</th></tr></thead><tbody><tr><td>Thyroid</td><td>TTF-1, CK7, thyroglobulin</td><td></td></tr><tr><td>Colon</td><td>CK20, CDX-2</td><td>CK7</td></tr><tr><td>Renal cell</td><td>Pan-keratin, CAM 5.2, CK7, PAX-8, CD10</td><td>CK20, CEA</td></tr><tr><td>Prostate</td><td>PSA, prostatic acid phosphatase</td><td>CK7, CK20</td></tr><tr><td>Breast</td><td>ER, PR, HER2, CK7, GATA3</td><td>CK20</td></tr><tr><td>Ovarian</td><td>CK7, WT-1, PAX-8, ER</td><td>CK20, CDX-2</td></tr><tr><td>Pancreatic or biliary</td><td>CK7, CK19, CK20 (20% of intrahepatic cholangiocarcinoma)</td><td></td></tr><tr><td>Hepatocellular</td><td></td><td>CK7, CK20</td></tr></tbody></table></div>\n<p>Thyroglobulin settles the one differential the panels above cannot, because TTF-1 and CK7 are shared by lung adenocarcinoma and thyroid carcinoma and thyroglobulin is not.</p>\n<h2 id=\"s-molecular-profile-of-adenocarcinoma\">Molecular profile of adenocarcinoma</h2>\n<p>Smoking history predicts the driver landscape well enough to be useful at the point of ordering tests. Alterations in <em>EGFR</em>, <em>ALK</em>, <em>ROS1</em>, <em>RET</em>, <em>HER2</em> and <em>NTRK</em> are enriched in never-smokers, whereas <em>KRAS</em>, <em>NRAS</em> and <em>MEK1</em> mutations are heavily enriched in smokers; <em>BRAF</em> and <em>MET</em> alterations are seen in both.</p>\n<ul><li><em>EGFR</em> mutation prevalence reaches 62% in Asian populations, the variants comprising exon 19 deletions, exon 21 L858R, exon 20 insertions and others.</li><li><em>ALK</em> rearrangement, most often an <em>EML4-ALK</em> fusion, occurs in approximately 4% of NSCLC.</li><li><em>MET</em> exon 14 skipping mutations occur in 3% of adenocarcinomas, while <em>MET</em> amplification occurs in 2–4% of unselected NSCLC and in 5–20% of <em>EGFR</em>-mutant tumours that have acquired resistance to an EGFR inhibitor.</li><li><em>RET</em> rearrangements occur in 1–2% of adenocarcinomas and cluster in younger patients and never-smokers.</li><li><em>BRAF</em> V600E occurs in 1–3% of NSCLC and is typically found in smokers.</li><li><em>RAS</em> mutations occur in 20–25% of adenocarcinomas, again typically in smokers, of which G12C is the allele reported separately.</li><li><em>HER2</em> alterations are exon 20 in-frame insertions and point mutations, and are commoner in never-smokers and in women.</li><li><em>NTRK</em> fusions are rare and tumour-agnostic in their treatment implication.</li></ul>\n<p>Which of these must be resulted before first-line treatment is decided differs from which are merely actionable at some point. <em>EGFR</em>, <em>ALK</em>, <em>ROS1</em>, <em>MET</em> exon 14, <em>RET</em> and <em>BRAF</em> V600E carry approved first-line options, whereas <em>KRAS</em> G12C, <em>NTRK</em> and <em>HER2</em> carry options only in later lines. <em>HER2</em> is not yet a first-line target: every <em>HER2</em> trial in the evidence base enrolled previously treated disease, and the first-line question is open in a phase 3 trial of zongertinib.</p>\n<h3>Classifying EGFR mutations</h3>\n<p>Grouping <em>EGFR</em> mutations by exon is convenient and biologically arbitrary. <a class=\"trial-link\" href=\"/evidence/#t-robichaux-et-al-structure-based-egfr-classification\">Robichaux et al. (structure-based EGFR classification)</a> analysed 16,715 patients with <em>EGFR</em>-mutant NSCLC alongside cell-line and patient-derived xenograft drug screens, and proposed a four-group structural classification: classical-like, T790M-like, exon 20 loop insertion, and PACC, meaning mutations that compress the P-loop and αC-helix (Nature 2021;597:732-737). The classification predicted TKI sensitivity better than exon-based grouping, and it inverted the usual generational ranking for one group: PACC mutations such as G719X and S768I reached a time to treatment failure of 21.7 months on second-generation TKIs, against 10.0 months on first-generation and 4.1 months on third-generation agents (HR 0.23 for second versus third generation, P&lt;0.0001). These variants require breadth of binding rather than selectivity. The evidence tier is retrospective and preclinical, so the framework is best read as the rationale underpinning uncommon-mutation trial design rather than as a randomised result. Uncommon mutations are a minority large enough to encounter regularly. In a pooled post-hoc analysis of the afatinib-treated patients across <a class=\"trial-link\" href=\"/evidence/#t-lux-lung-2-3-6-pooled-yang\">LUX-Lung 2/3/6 pooled (Yang)</a>, 75 of 600 patients (12%) carried an uncommon <em>EGFR</em> mutation, sorting into point mutations or duplications in exons 18–21 (n=38), de novo T790M with or without another mutation (n=14), and exon 20 insertions (n=23) (Lancet Oncol 2015;16:830-838). The three categories responded to afatinib at different rates (objective response 71.1%, 14.3% and 8.7% respectively; median progression-free survival 10.7, 2.9 and 2.7 months). An <em>EGFR</em> result must therefore name the variant.</p>\n<h2 id=\"s-molecular-testing-what-each-assay-detects\">Molecular testing: what each assay detects</h2>\n<p>The assay has to match the alteration class.</p>\n<ul><li>Real-time PCR amplifies DNA and then interrogates it allele by allele, so it detects known point mutations and indels and nothing else.</li><li>Fluorescence in situ hybridisation uses two differently coloured probes flanking a breakpoint, which lie superimposed as a fused signal in an intact gene and separate when the gene is rearranged, so it detects fusions and copy-number change without identifying the partner.</li><li>Immunohistochemistry detects protein expression, which is a surrogate for some alterations and the direct readout for others.</li><li>Next-generation sequencing on DNA covers mutations, indels and copy number broadly; RNA-based sequencing is the more reliable route to fusions, because it reads the transcribed junction rather than an intron that may be too large or too repetitive to capture.</li><li>Circulating tumour DNA carries the same chemistry with a sensitivity penalty, and a negative result on plasma never excludes an alteration.</li></ul>\n<div class=\"tblwrap\"><table><thead><tr><th scope=\"col\">Target</th><th scope=\"col\">Alteration</th><th scope=\"col\">Highest-yield assays</th><th scope=\"col\">Threshold or note</th></tr></thead><tbody><tr><td><em>EGFR</em></td><td>Exon 19 deletions and exon 21 L858R; exon 21 L861Q, exon 18 G719X and exon 20 S768I (together ~10%); T790M; exon 20 indels</td><td>Real-time PCR, tissue NGS</td><td>T790M is a resistance mechanism to first- and second-generation TKIs</td></tr><tr><td><em>ALK</em></td><td>Rearrangement, most often <em>EML4-ALK</em></td><td>FISH, IHC, RNA sequencing</td><td>Break-apart FISH positive at ≥15% of cells with split signals</td></tr><tr><td><em>ROS1</em></td><td>Rearrangement; partners include <em>CD74</em>, <em>SLC34A2</em>, <em>CCDC6</em>, <em>GOPC</em></td><td>FISH, RNA sequencing</td><td>Break-apart FISH positive at ≥15% of cells with split signals</td></tr><tr><td><em>RET</em></td><td>Rearrangement; <em>KIF5B</em> in 40–50%, <em>NCOA4</em>, <em>CCDC6</em> in 10%</td><td>FISH, RNA sequencing</td><td>Break-apart FISH positive at ≥15% of cells with split signals</td></tr><tr><td><em>NTRK</em></td><td><em>NTRK1/2/3</em> fusions</td><td>RNA sequencing (preferred), FISH</td><td>Break-apart FISH positive at ≥15% of cells with split signals</td></tr><tr><td><em>NRG1</em></td><td>Fusion; the product binds HER3 and drives heterodimerisation with HER2</td><td>RNA sequencing (preferred), FISH</td><td>FISH criteria less standardised</td></tr><tr><td><em>MET</em></td><td>Exon 14 skipping</td><td>Real-time PCR, tissue NGS, RNA sequencing</td><td></td></tr><tr><td><em>MET</em></td><td>Amplification</td><td>FISH</td><td><em>MET</em>/CEP7 ratio ≥2.0 or copy number ≥6</td></tr><tr><td><em>MET</em></td><td>Protein overexpression</td><td>IHC</td><td>≥50% of tumour cells staining 3+</td></tr><tr><td><em>HER2</em></td><td>Exon 20 insertion mutation</td><td>Real-time PCR, tissue NGS</td><td></td></tr><tr><td><em>HER2</em></td><td>Protein overexpression</td><td>IHC</td><td>Scored by gastric 3+ criteria</td></tr><tr><td><em>KRAS</em></td><td>G12C</td><td>Real-time PCR, tissue NGS</td><td></td></tr><tr><td><em>BRAF</em></td><td>V600E</td><td>Real-time PCR, tissue NGS</td><td></td></tr></tbody></table></div>\n<h2 id=\"s-tissue-acquisition\">Tissue acquisition</h2>\n<p>Where metastatic disease is suspected, biopsy the distant site, because a single procedure then delivers both the diagnosis and the stage. Where disease appears confined to the chest, the options are surgical excision of the tumour or an involved node, usually by video-assisted thoracoscopy, or endobronchial ultrasound-guided transbronchial needle aspiration and transoesophageal endoscopic ultrasound.</p>\n<h2 id=\"s-staging\">Staging</h2>\n<h3>Nodal stations</h3>\n<ul><li>Station 1 is supraclavicular and counts as N3.</li><li>Stations 2 to 9 are mediastinal, of which station 7 is subcarinal.</li><li>Stations 10 to 14 are hilar and count as N1.</li></ul>\n<h3>Changes between staging editions</h3>\n<p>The seventh-to-eighth edition revision moved several tumours upward on size and several downward on the endobronchial descriptors, and the practical consequence falls on stage III.</p>\n<ul><li>Tumours of 5–7 cm moved from T2 to T3 and tumours above 7 cm from T3 to T4.</li><li>T3 by diaphragmatic extension became T4.</li><li>Endobronchial tumour with associated atelectasis was reclassified by size, from T3 to T2a at 3–4 cm and to T2b at 4–5 cm.</li></ul>\n<p>In N2 disease each of the upward moves shifts the stage grouping from IIIA to IIIB; trial eligibility and treatment intent are written against the grouping and not against the descriptor. The eighth-to-ninth edition revision leaves T staging unchanged and subdivides N2 and M1c.</p>\n<ul><li>N2a is single-station N2 involvement and N2b is multi-station.</li><li>M1c1 is multiple extrathoracic metastases confined to one organ and M1c2 is multiple extrathoracic metastases across several organs.</li></ul>\n<
