<div class="viewfrag">
<div class="layout">
  
  
  <div class="viewmain">

  </div>

<template data-nav>
<div class="allbtn"><button id="showall" type="button">All trials</button></div>
    <nav id="nav" aria-label="Evidence sections"></nav>
</template>
<script>
window.oncosView = {
  name: 'evidence',
  init: function(ctx) {
// All trials built when asked for (site review B4, 2026-11-10). Runs first in the
// Evidence init closure, before the generator's own first render(). While the Watch
// list landing shows, render() only marks the trial table stale; evidence_watch.js
// draws it when the landing is left. The generator's render is a function
// declaration, so this binding is the one every later call reaches.
let holdTable = (() => {
  const here = window.oncosLocations && window.oncosLocations.read(location.href);
  return !!(here && here.valid && here.module === 'evidence' &&
    !Object.keys(here.target).some(key => here.target[key]) && !(location.hash || '').replace('#', ''));
})();
let tableStale = false;
const paintTable = render;
render = function () {
  if (holdTable) { tableStale = true; return; }
  tableStale = false;
  const result = paintTable.apply(this, arguments);
  document.dispatchEvent(new CustomEvent('oncos:evidence-render'));
  return result;
};
function releaseTable() { holdTable = false; if (tableStale) render(); }


const TRIALS = ctx.data.trials;
const SYSTEMS = ctx.data.systems;
const META = ctx.data.meta;
const ENDPOINT_LABELS = ctx.data.endpointLabels;
const YR_MIN = 1985, YR_MAX = 2026;

let state = { scope: 'all', sheet: null, system: null, q: '', yearBucket: '', sortKey: 'yearnum', sortDir: -1, open: new Set() };

// ---- Sidebar ----
const nav = document.getElementById('nav');
for (const [sys, sheets] of Object.entries(SYSTEMS)) {
  // Groups start collapsed (Jonan, 2026-09-23); the shell opens the group
  // holding the active sheet, so a deep-linked selection is never hidden.
  const sec = document.createElement('div'); sec.className = 'navsec collapsed';
  const head = document.createElement('button'); head.type = 'button'; head.className = 'sysname';
  head.setAttribute('aria-expanded','false');
  const tot = sheets.reduce((a,s)=>a+(META[s]||0),0);
  head.innerHTML = `<span>${sys}</span><span class="caret" aria-hidden="true">&#9660;</span>`;
  head.onclick = () => { const collapsed = sec.classList.toggle('collapsed'); head.setAttribute('aria-expanded', collapsed ? 'false' : 'true'); };
  sec.appendChild(head);
  const box = document.createElement('div'); box.className = 'sheets';
  sheets.forEach(sh => {
    const a = document.createElement('button'); a.type = 'button'; a.dataset.sheet = sh;
    a.innerHTML = `<span>${sh}</span><span class="cnt">${META[sh]||0}</span>`;
    a.onclick = () => selectSheet(sh, sys);
    box.appendChild(a);
  });
  sec.appendChild(box); nav.appendChild(sec);
}
document.getElementById('showall').onclick = () => {
  state.scope='all'; state.sheet=null; state.system=null;
  document.querySelectorAll('.sheets button').forEach(a => a.classList.remove('active'));
  closeNav(); fadeRender(); window.scrollTo(0,0);
};

// ---- Burger drawer (every width) ----
const backdrop = document.getElementById('backdrop');
const burger = document.getElementById('burger');
function openNav() { document.body.classList.add('nav-open'); }
function closeNav() { document.body.classList.remove('nav-open'); }
burger.onclick = () => document.body.classList.contains('nav-open') ? closeNav() : openNav();
backdrop.onclick = closeNav;

// ---- Year filter ----
// The drawer's filter controls were removed (Jonan, 2026-09-23: "not needed").
// The year VALUE stays: it is a field of the versioned navigation contract
// (view_ux/NAVIGATION-CONTRACT-v2.md), so a link carrying ?year= keeps opening the
// same filtered view. The phase filter went with the Phase column (2026-10-24); an
// old ?phase= link still opens, with the value ignored (view_ux/evidence.js).
const buckets = [['2020–present','2020+'],['2010–2019','2010s'],['2000–2009','2000s'],['Before 2000','pre2000']];
// Global search: typing resets any active sheet/system filter so the query spans
// the whole dataset, then re-renders.
document.getElementById('q').oninput = e => {
  state.q = e.target.value.toLowerCase().trim();
  if (state.q) {
    state.scope='all'; state.sheet=null; state.system=null;
    document.querySelectorAll('.sheets button').forEach(a => a.classList.remove('active'));
  }
  render();
};

function selectSheet(sheet, sys) {
  state.scope='sheet'; state.sheet=sheet; state.system=sys; closeNav(); fadeRender(); window.scrollTo(0,0);
  document.querySelectorAll('.sheets button').forEach(a => a.classList.toggle('active', a.dataset.sheet===sheet));
}
function inBucket(y, b) {
  if (!b) return true; if (y==null) return false;
  if (b==='2020+') return y>=2020; if (b==='2010s') return y>=2010&&y<=2019;
  if (b==='2000s') return y>=2000&&y<=2009; if (b==='pre2000') return y<2000;
  return true;
}

function filtered() {
  return TRIALS.filter(t => {
    if (state.scope==='sheet' && t.sheet!==state.sheet) return false;
    if (!inBucket(t.yearnum, state.yearBucket)) return false;
    if (state.q) {
      const reftext = (t.refs || []).map(rf => `${rf.text} ${rf.descriptor||''} ${rf.pmid||''}`).join(' ');
      const hay = `${t.study} ${t.type||''} ${t.population} ${t.arms} ${t.endpoint} ${t.findings} ${t.subcat} ${t.sheet} ${reftext}`.toLowerCase();
      if (!hay.includes(state.q)) return false;
    }
    return true;
  });
}
function esc(s) { return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
// A reference opens only an http or https address; anything else shows as plain text (site review C3).
function webUrl(u) { return /^https?:\/\//i.test(String(u==null?'':u)); }
function armsBlock(raw) {
  const txt = String(raw == null ? '' : raw);
  // Lettered lines (rules 1.17.0, Jonan 2026-10-24): each arm a row under its circled letter,
  // shared '・Label: value' lines after it, drawn as Results rows are.
  const armLines = txt.split('\n').map(s => s.trim()).filter(Boolean);
  if (armLines.filter(l => /^[Ⓐ-Ⓙⓐ-ⓙ]/.test(l)).length >= 2) {
    return '<div class="kf-list">' + armLines.map(l => {
      const arm = /^([Ⓐ-Ⓙⓐ-ⓙ])\s*(.*)$/.exec(l);
      if (arm) return `<div class="kf-row kf-arm"><span class="kf-l">${arm[1]}</span><span class="kf-v">${esc(kfValue(arm[2]))}</span></div>`;
      const t = l.replace(/^・\s*/, ''), i = t.indexOf(': ');
      return `<div class="kf-row"><span class="kf-l">${esc(i > 0 ? t.slice(0, i) : '')}</span><span class="kf-v">${esc(kfValue(i > 0 ? t.slice(i + 2) : t))}</span></div>`;
    }).join('') + '</div>';
  }
  // A meta-analysis's comparison lines (Jonan, 2026-10-25): each '・A vs B (size)' a row, the
  // comparison on the left and its size on the right; '・Regimens: ...' as a labelled row.
  const bullets = armLines.filter(l => /^・/.test(l));
  if (bullets.length >= 2 && bullets.length === armLines.length && bullets.filter(l => /\bvs\.?\b|\bversus\b/i.test(l)).length >= 2) {
    return '<div class="kf-list">' + bullets.map(l => {
      const t = l.replace(/^・\s*/, ''), i = t.indexOf(': ');
      if (i > 0 && !/\bvs\.?\b/i.test(t.slice(0, i))) return `<div class="kf-row"><span class="kf-l">${esc(t.slice(0, i))}</span><span class="kf-v">${esc(kfValue(t.slice(i + 2)))}</span></div>`;
      const size = /^(.*?)\s*\(([^()]*)\)\s*$/.exec(t);
      return `<div class="kf-row"><span class="kf-l">${esc(size ? size[1] : t)}</span><span class="kf-v">${esc(size ? kfValue(size[2]) : '')}</span></div>`;
    }).join('') + '</div>';
  }
  const sentenceArm = part => {
    const m = part.match(/^(\s*)(\S+)([\s\S]*)$/);
    if (!m) return part;
    const word = m[2];
    const firstAlpha = word.search(/[A-Za-z]/);
    if (firstAlpha === -1) return part;
    const stem = word.slice(firstAlpha);
    if (/[A-Z]/.test(stem.slice(1)) || /^[a-z]+\d/.test(stem)) return part;
    const capped = word.slice(0, firstAlpha) + word.charAt(firstAlpha).toUpperCase()
      + word.slice(firstAlpha + 1);
    return m[1] + capped + m[3];
  };
  const singleArmAtEnd = part => {
    const marker = /\bsingle(?:-| )arm\b/i;
    if (!marker.test(part)) return part;
    let cleaned = part.replace(/\(([^()]*)\)/g, (whole, inner) => {
      if (!marker.test(inner)) return whole;
      const rest = inner
        .replace(/\bsingle(?:-| )arm\b/gi, '')
        .replace(/\s*([,;])\s*([,;])\s*/g, '$1 ')
        .replace(/^\s*[,;]\s*|\s*[,;]\s*$/g, '')
        .trim();
      return rest ? `(${rest})` : '';
    });
    cleaned = cleaned
      .replace(/\bsingle(?:-| )arm\b/gi, '')
      .replace(/\s+([,;])/g, '$1')
      .replace(/([,;])\s*([,;])+/g, '$1')
      .replace(/^\s*[,;:]\s*|\s*[,;:]\s*$/g, '')
      .replace(/\s{2,}/g, ' ')
      .trim();
    return `${sentenceArm(cleaned)}${cleaned ? ' ' : ''}(single-arm)`;
  };
  // Column F's house grammar uses whitespace-delimited `vs`. Splitting that exact
  // token avoids touching words that merely contain those letters. A labelled
  // non-comparative study gets one standard suffix; contextual single-arm text in
  // an otherwise comparative study remains attached to the relevant subgroup.
  const parts = txt.split(/\s+vs\.?\s+/gi);
  if (parts.length === 1) return esc(singleArmAtEnd(txt));
  // The workbook's arm grammar is phrase-like, so comparators often begin lower-case.
  // Sentence-case each arm after the first, but preserve deliberate mixed-case and
  // lowercase-alphanumeric identifiers such as mFOLFOX6, cCRT and gp100.
  const divider = '<span class="arm-vs"><span class="sr-only"> versus </span><span aria-hidden="true">VS</span></span>';
  return parts.map((part, i) => esc(i ? sentenceArm(part) : part)).join(divider);
}
// Column count: Study + Year, plus Setting in the all-trials scope.
function span() { return state.scope==='all' ? 3 : 2; }
function reduced() { return window.matchMedia('(prefers-reduced-motion: reduce)').matches; }

// Key findings: a cell with "・" lines renders each other line as a conclusion
// (.kf-lead, each marked ★) and each run of
// "・" lines as label | value rows, split at the first ": " (no label when there is
// none). A saved "Limits" label displays as "Limitations". A Limitations/Caveat/Note
// row is set as a note (.kf-note, marked ※ in CSS).
// A cell without "・" lines keeps its prose. Display only: search and the
// changelog read the cell text itself.
const KF_NOTE = /^(limits?|limitations?|caveats?|notes?)$/i;
// A value opens with a capital, as in the Evidence editor; a first word whose case is
// deliberate (ypCR, cN0, mFOLFOX6, nal-IRI, p53) keeps it. Leading ( [ and quotes are
// passed over; a value opening with a digit or another symbol stays as written.
function kfValue(v) {
  return String(v).replace(/^(\s*[(\["'“‘]*)([a-z])(\S*)/, (whole, lead, first, rest) =>
    /[A-Z]/.test(rest) || /^[a-z]*\d/.test(rest) ? whole : lead + first.toUpperCase() + rest);
}
function kfBlock(raw) {
  const all = String(raw == null ? '' : raw).split('\n').map(s => s.trim()).filter(Boolean);
  if (!all.some(l => l.startsWith('・'))) return `<div class="findings kf-prose">${esc(raw)}</div>`;
  // Limitations come last (Jonan, 2026-10-24), also in cells saved before that rule.
  const lastLine = l => /^・\s*(?:Limitations|Limits)\b[^:]*:/.test(l);
  const lines = [...all.filter(l => !lastLine(l)), ...all.filter(lastLine)];
  let out = '', open = false;
  for (const l of lines) {
    if (!l.startsWith('・')) {
      if (open) { out += '</div>'; open = false; }
      out += `<div class="kf-lead"><span class="kf-mark" aria-hidden="true">★ </span>${esc(l)}</div>`;
      continue;
    }
    if (!open) { out += '<div class="kf-list">'; open = true; }
    const t = l.slice(1).trim(), i = t.indexOf(': ');
    const label = i > 0 ? t.slice(0, i).replace(/^Limits\b/, 'Limitations') : '';
    out += `<div class="kf-row${KF_NOTE.test(label) ? ' kf-note' : ''}"><span class="kf-l">${esc(label)}</span>`
      + `<span class="kf-v">${esc(kfValue(i > 0 ? t.slice(i + 2) : t))}</span></div>`;
  }
  if (open) out += '</div>';
  return `<div class="findings kf">${out}</div>`;
}

// A citation's "Year;Vol:Pages" tail and its link icon stay on one line (.nw), so a
// narrow screen wraps before the year, not inside the page range or before a lone
// icon. A citation without that tail keeps its last word with the icon. The icon
// (.ext, a box with an arrow) is drawn by the shell's CSS.
// The author ("X et al." or a collective "… Group.") is its own span, which a phone
// shows on a line of its own above the publication.
function refAuthor(label) {
  const m = label.match(/^(.+? et al\.|[^.;|]+?(?:Group|Collaboration|Consortium|Investigators)\.)\s+([\s\S]+)$/i);
  return m ? {au: m[1], rest: m[2]} : {au: '', rest: label};
}
function refLabel(rf) {
  return String(rf.text == null ? '' : rf.text) + (rf.descriptor ? ' — ' + rf.descriptor : '');
}
function refLink(rf) {
  const {au, rest} = refAuthor(refLabel(rf));
  const m = rest.match(/^([\s\S]*?)(\d{4};\S+|\S+)$/);
  const head = m ? m[1] : '', tail = m ? m[2] : rest;
  const author = au ? `<span class="ref-au">${esc(au)}</span> ` : '';
  return `<a class="src" href="${esc(rf.url)}" target="_blank" rel="noopener">${author}${esc(head)}<span class="nw">${esc(tail)}<span class="ext" aria-hidden="true"></span></span></a>`;
}
function refText(rf) {
  const {au, rest} = refAuthor(refLabel(rf));
  return au ? `<span class="reftext"><span class="ref-au">${esc(au)}</span> ${esc(rest)}</span>`
    : esc(rf.text) + (rf.descriptor ? ` &mdash; ${esc(rf.descriptor)}` : '');
}

function detailRow(t, collapsed) {
  const refs = (t.refs && t.refs.length) ? t.refs
    : [{text: t.ref, url: t.link, label: 'primary'}];
  const link = refs.map(rf => {
    const a = webUrl(rf.url) ? refLink(rf) : refText(rf);
    // Any label but 'primary' is rendered verbatim, so adding a label kind in
    // parse_refs does not also need a change here.
    const tag = (rf.label && rf.label !== 'primary')
      ? `<span class="reftag sc">${esc(rf.label.charAt(0).toUpperCase() + rf.label.slice(1))}</span>` : '';
    // A filed PDF takes the citation link; its PubMed record sits beneath it.
    const pm = `https://pubmed.ncbi.nlm.nih.gov/${rf.pmid}/`;
    const pmLine = (/^\d+$/.test(String(rf.pmid||'')) && webUrl(rf.url) && !/pubmed\.ncbi\.nlm\.nih\.gov\//.test(rf.url))
      ? `<div class="refpm"><a class="src" href="${esc(pm)}" target="_blank" rel="noopener">PubMed<span class="ext" aria-hidden="true"></span></a></div>` : '';
    return `<div class="refline">${a}${tag}${pmLine}</div>`;
  }).join('');
  return `<tr class="detail" data-for="${t.id}"><td colspan="${span()}">
    <div class="wrap${collapsed?' mo-collapsed':' mo-settled'}"><div class="clip"><div class="inner">
      <div class="col">
        ${t.type?`<div class="fld fld-type"><div class="k">Study type</div><div>${esc(t.type)}</div></div>`:''}
        <div class="fld"><div class="k">Population</div><div>${esc(t.population)}</div></div>
      </div>
      <div class="col">
        <div class="fld"><div class="k">Treatment arms</div><div>${armsBlock(t.arms)}</div></div>
        <div class="fld"><div class="k">${esc(ENDPOINT_LABELS[t.sheet] || 'Endpoints')}</div><div>${epBlock(t.endpoint)}</div></div>
      </div>
      <div class="full"><div class="k">Results</div>${kfBlock(t.findings)}</div>
      <div class="fld fld-ref"><div class="k">Reference</div><div>${link}</div></div>
    </div></div></div></td></tr>`;
}

// Run fn once when the wrap's transition ends, with a timeout fallback: if the
// transition never fires -- kit motion layer switched off, or a browser that
// won't interpolate the collapse -- the row must still be removed, not stranded.
// Column G carries one of three shapes. 886 of 949 cells hold a bare endpoint and
// render exactly as they always did; 62 hold the contract form `Primary: ... .
// Secondary: ...`; 1 holds a Primary segment with no Secondary. Split on the literal
// labels rather than a sentence pattern: a primary list can itself contain commas
// (9 cells carry co-primaries) and `Primary: N/A.` is a real value.
function epBlock(raw) {
  const txt = (raw == null ? '' : String(raw)).trim();
  if (!txt) return '';
  const i = txt.indexOf('Primary:');
  if (i !== 0) return esc(txt);            // bare endpoint -- unchanged
  const j = txt.indexOf('Secondary:');
  // Cells store endpoint names lower-case by the column contract (`Primary:
  // progression-free survival`), so sentence-case the display value. ONLY the first
  // character is touched: upper-casing more, or lower-casing anything, would wreck
  // PET-complete response rate, R0 resection, ypN0, FACT-Lym and N/A.
  const sentence = v => v ? v.charAt(0).toUpperCase() + v.slice(1) : v;
  const strip = v => sentence(v.trim().replace(/[.;,]+$/, '').trim());
  const prim = strip(j === -1 ? txt.slice(8) : txt.slice(8, j));
  const sec = j === -1 ? '' : strip(txt.slice(j + 10));
  if (!prim && !sec) return esc(txt);
  let out = '';
  if (prim) out += `<div class="epsub"><span aria-hidden="true">① </span>Primary</div><div class="epval">${esc(prim)}</div>`;
  if (sec) out += `<div class="epsub"><span aria-hidden="true">② </span>Secondary</div><div class="epval">${esc(sec)}</div>`;
  return out;
}

function onMotionEnd(wrap, fn) {
  let ran = false;
  const go = () => {
    if (ran) return;
    ran = true;
    wrap.removeEventListener('transitionend', onEnd);
    fn();
  };
  const onEnd = e => { if (e.target === wrap) go(); };
  wrap.addEventListener('transitionend', onEnd);
  setTimeout(go, 400);
}

// Collapses one open row, animating its drawer shut. Unlike toggleRow() this
// does NOT honour the mid-flight guard: it is also the path used to evict the
// previously-open row when another one is opened, and that eviction must happen
// even if the outgoing row is still animating.
function collapseRow(tr) {
  state.open.delete(+tr.dataset.id);
  tr.classList.remove('open');
  const toggle = tr.querySelector('.trial-toggle');
  if (toggle) toggle.setAttribute('aria-expanded', 'false');
  const row = tr.nextElementSibling;
  unpin(tr);
  if (!row || !row.classList.contains('detail')) { delete tr.dataset.animating; return; }
  const wrap = row.querySelector('.wrap');
  if (!wrap || reduced()) { row.remove(); delete tr.dataset.animating; return; }
  tr.dataset.animating = '1';
  onMotionEnd(wrap, () => { row.remove(); delete tr.dataset.animating; });
  // Back onto the grid (freshly measured at 1fr), then animate to 0fr.
  wrap.classList.remove('mo-settled'); void wrap.offsetHeight;
  requestAnimationFrame(() => wrap.classList.add('mo-collapsed'));
}

// Accordion: at most one card is open at a time, so opening one closes whatever
// else is open. state.open stays a Set because render() reads it, but it now
// never holds more than one id. Iterate a snapshot -- collapseRow() mutates it.
function closeOthers(keepId) {
  Array.from(state.open).forEach(oid => {
    if (oid === keepId) return;
    const other = document.querySelector(`tr.trial.open[data-id="${oid}"]`);
    // A row open in state but filtered out of the DOM has no drawer to animate;
    // dropping the id is the whole close.
    if (other) collapseRow(other); else state.open.delete(oid);
  });
}

// Toggling patches just this row pair. Calling render() here would rebuild the
// whole table, and a node inserted at its final state never transitions while a
// removed one vanishes before it can animate out -- so a re-render can't animate.
function toggleRow(tr) {
  const id = +tr.dataset.id;
  if (tr.dataset.animating) return;   // ignore clicks mid-flight
  if (state.open.has(id)) { collapseRow(tr); return; }

  closeOthers(id);
  state.open.add(id);
  tr.classList.add('open');
  const toggle = tr.querySelector('.trial-toggle');
  if (toggle) toggle.setAttribute('aria-expanded', 'true');
  const t = TRIALS.find(x => x.id === id);
  if (!t) return;
  const reduce = reduced();
  tr.insertAdjacentHTML('afterend', detailRow(t, !reduce));
  if (reduce) return;
  const wrap = tr.nextElementSibling.querySelector('.wrap');
  tr.dataset.animating = '1';
  onMotionEnd(wrap, () => { delete tr.dataset.animating; wrap.classList.add('mo-settled'); });
  // Two frames: the first commits the collapsed state, the second animates off it.
  requestAnimationFrame(() => requestAnimationFrame(() => wrap.classList.remove('mo-collapsed')));
}

// Quiet 150ms crossfade of the results card, for sidebar-driven view changes
// (scope/sheet/drawer filters). Fade-out -> swap -> fade-in on the stable
// #results node. Skipped under reduced motion (no transition to show, so the
// hold would be dead time). Search keystrokes call render() directly, so they
// stay instant and never flicker.
function fadeRender() {
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) { render(); return; }
  const res = document.getElementById('results');
  res.classList.add('vfade');
  setTimeout(() => { if(!res.isConnected) return; render(); res.classList.remove('vfade'); }, 150);  // bail if the view was torn down mid-fade
}

function render() {
  // crumbs
  const cr = document.getElementById('crumbs');
  if (state.scope==='sheet') cr.innerHTML = `${esc(state.system)} &rsaquo; <b>${esc(state.sheet)}</b>`;
  else cr.innerHTML = `<b>All trials</b> &mdash; every tumour system`;

  const rows = filtered();
  // sort
  const cmp = (a,b) => {
    let x=a[state.sortKey], y=b[state.sortKey];
    // Within a year, the headline paper's publication date; an undated row sorts as oldest.
    if (state.sortKey==='yearnum') { x=x==null?-1:x; y=y==null?-1:y; const d=(a.pubdate||'').localeCompare(b.pubdate||''); return (x-y||d)*state.sortDir; }
    x=String(x).toLowerCase(); y=String(y).toLowerCase();
    return x<y?-state.sortDir : x>y?state.sortDir : 0;
  };
  if (state.scope==='sheet') {
    // Mirror the workbook: keep sub-categories in their workbook order so each
    // section header appears once with its trials grouped beneath it. The column
    // sort then applies WITHIN each section rather than across the whole sheet.
    const secOrder = new Map();
    TRIALS.filter(t=>t.sheet===state.sheet).forEach(t=>{ if(!secOrder.has(t.subcat)) secOrder.set(t.subcat, secOrder.size); });
    rows.sort((a,b)=>{
      const so = (secOrder.get(a.subcat)??0) - (secOrder.get(b.subcat)??0);
      return so!==0 ? so : cmp(a,b);
    });
  } else {
    rows.sort(cmp);
  }

  const res = document.getElementById('results');
  if (!rows.length) { res.innerHTML = `<div class="empty">No trials match. Try clearing filters or the search box.</div>`; return; }

  const showSys = state.scope==='all';
  const arrow = k => state.sortKey===k ? (state.sortDir===1?' &#9650;':' &#9660;') : '';
  const sortHead = (k, label, cls='') => `<th scope="col"${cls?` class="${cls}"`:''}${state.sortKey===k?` aria-sort="${state.sortDir===1?'ascending':'descending'}"`:''}><button class="sortbtn" type="button" data-k="${k}">${label}${arrow(k)}</button></th>`;
  let h = `<table><caption class="sr-only">Clinical trial evidence</caption><thead><tr>
    ${sortHead('study','Study')}
    ${sortHead('yearnum','Year','c-year')}
    ${showSys?sortHead('sheet','Setting','c-set'):''}
  </tr></thead><tbody>`;

  let lastGroup = null;
  rows.forEach(t => {
    const groupKey = state.scope==='sheet' ? t.subcat : null;
    if (state.scope==='sheet' && groupKey && groupKey!==lastGroup) {
      h += `<tr class="secrow"><td colspan="${span()}">${esc(groupKey)}</td></tr>`;
      lastGroup = groupKey;
    }
    const isOpen = state.open.has(t.id);
    h += `<tr class="trial${isOpen?' open':''}" id="${t.anchor}" data-id="${t.id}">
      <td class="study"><button class="trial-toggle" type="button" aria-expanded="${isOpen?'true':'false'}">${esc(t.study)}${ state.scope==='all'&&t.subcat?`<span class="sub">${esc(t.subcat)}</span>`:''}</button></td>
      <td data-label="Year">${esc(t.year)}</td>
      ${showSys?`<td data-label="Setting">${esc(t.sheet)}</td>`:''}</tr>`;
    // An already-open row re-renders open and un-animated: a re-render is a
    // filter/sort/scope change, not a toggle. Only toggleRow() animates.
    if (isOpen) h += detailRow(t, false);
  });
  h += `</tbody></table>`;
  res.innerHTML = h;

  res.querySelectorAll('thead .sortbtn').forEach(btn => btn.onclick = () => {
    const k = btn.dataset.k;
    if (state.sortKey===k) state.sortDir*=-1; else { state.sortKey=k; state.sortDir = (k==='yearnum')?-1:1; }
    render();
  });
  res.querySelectorAll('.trial-toggle').forEach(btn => btn.onclick = e => { e.stopPropagation(); tapRow(btn.closest('tr')); });
  res.querySelectorAll('tr.trial').forEach(tr => tr.onclick = e => { if (e.target.closest('button,a,input,select')) return; tapRow(tr); });
  syncSticky();
}

// ---- Pinned open row (phone) ----
// An open row's title pins under the masthead while its drawer is in view and is
// pushed up with the drawer's end.
let stickyRaf = 0;
function unpin(tr) { tr.classList.remove('pin', 'stuck'); tr.style.transform = ''; }
function syncSticky() {
  stickyRaf = 0;
  const res = document.getElementById('results');
  if (!res || !res.isConnected) return;
  res.querySelectorAll('tr.trial.pin').forEach(tr => { if (!tr.classList.contains('open')) unpin(tr); });
  const tr = res.querySelector('tr.trial.open');
  if (!tr) return;
  const det = tr.nextElementSibling;
  // Pinning is for the stacked phone rows; a desktop table row stays in place.
  if (!det || !det.classList.contains('detail') || getComputedStyle(tr).display === 'table-row') { unpin(tr); return; }
  tr.classList.add('pin');
  const top = parseFloat(getComputedStyle(tr).top) || 0;
  const d = det.getBoundingClientRect(), h = tr.offsetHeight;
  if (d.bottom <= top) { unpin(tr); return; }
  const shift = Math.min(0, d.bottom - (top + h));
  tr.style.transform = shift ? `translateY(${shift}px)` : '';
  tr.classList.toggle('stuck', d.top < top + h - 1);
}
function scheduleSticky() { if (!stickyRaf) stickyRaf = requestAnimationFrame(syncSticky); }
window.addEventListener('scroll', scheduleSticky, { passive: true });
window.addEventListener('resize', scheduleSticky);

// Tapping a pinned title closes the row and brings it back to the top of the list.
function tapRow(tr) {
  const pinned = tr.classList.contains('stuck');
  toggleRow(tr);
  if (pinned && !tr.classList.contains('open')) { unpin(tr); tr.scrollIntoView({ block: 'start' }); }
  scheduleSticky();
}
render();

// ---- Deep links: /evidence/#t-<slug> ----
// Every trial row carries id="t-<slug>" (minted in the build from column A), but
// the table is rendered from the filter state, so an incoming anchor can name a
// row the current scope/search/filters exclude -- the link would land on an empty
// table. So: clear back to the all-trials scope, render, open the row, scroll it
// clear of the sticky masthead, and ring it briefly. Runs on arrival and on every
// hashchange; the shell re-fires it after swapping the view in.
let anchorTimers = [];
function focusAnchor() {
  const id = (location.hash || '').replace(/^#/, '');
  if (!/^t-/.test(id)) return;
  // Two spellings resolve: the row's own id, and the alias that keeps the study
  // name's parenthetical (t-stampede-docetaxel), which is the only way to name a
  // row whose bare slug another row already owns.
  const t = TRIALS.find(x => x.anchor === id) || TRIALS.find(x => x.anchorFull === id);
  if (!t) return;                                  // stale link -- leave the view alone
  if (state.scope!=='all' || state.q || state.yearBucket) {
    state.scope='all'; state.sheet=null; state.system=null;
    state.q=''; state.yearBucket='';
    const qbox = document.getElementById('q'); if (qbox) qbox.value='';
    document.querySelectorAll('.sheets button').forEach(a => a.classList.remove('active'));
    render();
  }
  const tr = document.getElementById(t.anchor);
  if (!tr) return;
  if (!state.open.has(t.id)) toggleRow(tr);
  // scrollIntoView, not a computed offset: it honours the row's scroll-margin-top,
  // so the masthead clearance is declared once, in the CSS the browser's own
  // fragment scroll already obeys. Instant, not smooth: an arriving deep link can
  // be 900 rows down the all-trials table, and animating 30,000px of other people's
  // trials past the reader is worse than landing -- which is what a fragment link
  // does everywhere else anyway. The ring is the orientation cue.
  tr.scrollIntoView({ block: 'start' });
  anchorTimers.forEach(clearTimeout); anchorTimers = [];
  document.querySelectorAll('tr.anchor-hit').forEach(r => r.classList.remove('anchor-hit','fading'));
  tr.classList.add('anchor-hit');
  anchorTimers.push(setTimeout(() => tr.classList.add('fading'), 1100));
  anchorTimers.push(setTimeout(() => tr.classList.remove('anchor-hit','fading'), 2000));
}
window.addEventListener('hashchange', focusAnchor);
focusAnchor();

    window.oncosView.openRecord = function(record) {
      if (!record || !record.id) return false;

// Presentation state contract v1. Runs in the Evidence init closure.
(() => {
  if (!ctx.root || !ctx.search) return;
  // No motion on the site (Jonan, 2026-10-04): a trial row opens and closes at
  // once, by the drawer's reduced-motion path, with no wait for a transition.
  reduced=()=>true;
  let routeRecord = null;
  const rowFor = anchor => TRIALS.find(row=>row.anchor===anchor||row.anchorFull===anchor);
  const sorts={study:'study',year:'yearnum',setting:'sheet'};
  // The Phase column went with Jonan's 2026-10-24 study-type change. A link or a
  // saved state from before it may still carry a phase filter or a phase sort:
  // both open, with the phase ignored and the default year sort.
  const retired=value=>value===undefined||typeof value==='string';
  window.oncosView.captureState = () => ({
    version:1, module:'evidence', value:{...state, open:[...state.open]}
  });
  window.oncosView.restoreState = snapshot => {
    if (!snapshot || snapshot.version !== 1 || snapshot.module !== 'evidence') return false;
    const value = snapshot.value;
    if (!value || !['all','sheet'].includes(value.scope) || typeof value.q !== 'string' ||
        !['study','phase','yearnum','sheet'].includes(value.sortKey) || ![1,-1].includes(value.sortDir) ||
        !retired(value.phase) || !['', ...buckets.map(b => b[1])].includes(value.yearBucket) ||
        !Array.isArray(value.open) || value.open.some(id => !TRIALS.some(t => t.id === id)) ||
        (value.scope === 'sheet' && !Object.prototype.hasOwnProperty.call(META, value.sheet))) return false;
    const sheet = value.scope === 'sheet' ? value.sheet : null;
    state = {scope:value.scope, sheet,
      system:sheet ? Object.keys(SYSTEMS).find(key => SYSTEMS[key].includes(sheet)) : null,
      q:value.q, yearBucket:value.yearBucket,
      sortKey:value.sortKey==='phase'?'yearnum':value.sortKey, sortDir:value.sortKey==='phase'?-1:value.sortDir,
      open:new Set(value.open)};
    routeRecord = null;
    ctx.search.value = value.q;
    document.querySelectorAll('.sheets button').forEach(button => {
      button.classList.toggle('active', state.scope === 'sheet' && button.dataset.sheet === state.sheet);
    });
    render(); return true;
  };
  function describe(){
    const target={};
    if(state.scope==='sheet')target.group=state.sheet;
    if(state.yearBucket)target.year=state.yearBucket;
    if(state.sortKey!=='yearnum'||state.sortDir!==-1){
      target.sort=Object.keys(sorts).find(key=>sorts[key]===state.sortKey);
      target.dir=state.sortDir===1?'asc':'desc';
    }
    let anchor=routeRecord;
    if(anchor===null){const parsed=window.oncosLocations.read(location.href);anchor=parsed.valid&&parsed.module==='evidence'?parsed.target.record:'';}
    const row=anchor&&rowFor(anchor);
    if(row&&state.open.has(row.id)&&filtered().some(item=>item.id===row.id))target.record=anchor;
    return target;
  }
  function syncFilters(){
    document.querySelectorAll('.sheets button').forEach(button=>button.classList.toggle('active',state.scope==='sheet'&&button.dataset.sheet===state.sheet));
  }
  window.oncosView.navigation={
    read:describe,
    open:target=>{
      const row=target.record&&rowFor(target.record);
      if(target.record&&!row)return false;
      if(target.group&&!Object.prototype.hasOwnProperty.call(META,target.group))return false;
      if(target.year&&!buckets.some(bucket=>bucket[1]===target.year))return false;
      if(target.sort&&target.sort!=='phase'&&!Object.prototype.hasOwnProperty.call(sorts,target.sort))return false;
      if(target.dir&&!['asc','desc'].includes(target.dir))return false;
      let group=target.group||null,year=target.year||'';
      // A record opens on its own disease sheet, not the all-sheets master list.
      if(row){if(!group||row.sheet!==group)group=Object.prototype.hasOwnProperty.call(META,row.sheet)?row.sheet:null;if(year&&!inBucket(row.yearnum,year))year='';}
      state={scope:group?'sheet':'all',sheet:group,system:group?Object.keys(SYSTEMS).find(key=>SYSTEMS[key].includes(group)):null,
        q:'',yearBucket:year,sortKey:sorts[target.sort]||'yearnum',sortDir:target.sort!=='phase'&&target.dir==='asc'?1:-1,open:new Set(row?[row.id]:[])};
      routeRecord=target.record||'';ctx.search.value='';closeNav();syncFilters();render();
      if(row){
        document.getElementById(row.anchor).scrollIntoView({block:'start'});
      }else if(target.anchor){
        const node=document.getElementById(target.anchor);if(!node||!ctx.root.contains(node))return false;node.scrollIntoView({block:'start'});
      }else window.scrollTo(0,0);
      return true;
    },
  };

    selectSheet=(sheet,system)=>ctx.transition(()=>{routeRecord='';select(sheet,system);});
    toggleRow=element=>ctx.transition(()=>{toggle(element);routeRecord=state.open.has(Number(element.dataset.id))?element.id:'';},{replace:true});
    render=()=>{
      draw();ctx.root.querySelectorAll('.sortbtn').forEach(button=>{const action=button.onclick;button.onclick=event=>ctx.transition(()=>action(event),{replace:true});});
    };
    const all=document.getElementById('showall'),action=all.onclick;
    all.onclick=event=>ctx.transition(()=>{routeRecord='';action(event);});

  }
})();

const EVIDENCE_WATCH = ctx.data.watch;
// Evidence landing: the Watch list (Jonan, 2026-09-28), replacing the changelog. Guidelines,
// PubMed and Congress, read-only, trimmed for an outside audience. Runs in the Evidence
// init closure. EVIDENCE_WATCH is the data file's watch list (fragmentize, watch_list.py), the
// editor's watch state at build time: {guidelines|literature|congress: {checked_at, items}}.
// /evidence/ with no target shows it; choosing a sheet, a trial or a search result shows
// the trial list. The navigation contract is unchanged: the landing is the empty target.
(() => {
  if (!ctx.root || typeof EVIDENCE_WATCH === 'undefined' || !EVIDENCE_WATCH || !window.oncosView.navigation) { releaseTable(); return; }
  const results = document.getElementById('results');
  if (!results) { releaseTable(); return; }
  const escHtml = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const W = EVIDENCE_WATCH;
  const CATEGORIES = ['Breast','Thoracic','Gastrointestinal','Genitourinary','Gynaecological','Head & Neck','Skin','Central Nervous System','Sarcoma','Lymphoma','General Oncology'];
  const OTHER = ':none';
  const order = c => { const i = CATEGORIES.indexOf(c); return i < 0 ? 99 : i; };
  const guidelines = W.guidelines.items, literature = W.literature.items, congress = W.congress.items;
  const sheetsOf = c => c.sheets || [];
  // One category filter on every tab: a PubMed or congress item belongs to each sidebar
  // group (SYSTEMS) holding one of its sheets; an item with none is Other. General Oncology
  // only when no tumour group holds the item, as in the editor.
  const groupOf = {};
  for (const [group, sheets] of Object.entries(SYSTEMS)) sheets.forEach(sheet => { groupOf[sheet] = group; });
  const categoriesOf = item => {
    if (item.category) return [item.category];
    const groups = [...new Set(sheetsOf(item).map(s => groupOf[s]).filter(Boolean))];
    const tumour = groups.filter(g => g !== 'General Oncology');
    return tumour.length ? tumour : groups;
  };
  const inCategory = (item, c) => !c || (c === OTHER ? !categoriesOf(item).length : categoriesOf(item).includes(c));
  let landing = false, tab = 'guidelines';
  const pick = {guidelines: '', literature: '', congress: ''};

  const box = document.createElement('div');
  box.className = 'evwatch';
  results.parentNode.insertBefore(box, results);

  const a = (href, text, cls) => `<a class="${cls}" href="${escHtml(href)}" target="_blank" rel="noopener">${escHtml(text)}</a>`;
  const row = (title, meta) => `<div class="wl-row"><div class="wl-copy">${title}`
    + (meta ? `<span class="wl-meta">${escHtml(meta)}</span>` : '')
    + '</div></div>';

  // Guidelines: by tumour category, then newest publication first, then title; the title opens the guideline.
  const category = g => g.category || 'Other';
  const topic = g => g.title || String(g.study || '').replace(/^(ASCO|ESMO) (Living|Clinical Practice) Guideline:\s*/i, '').replace(/,?\s*Version\s+[\d.]+\s*$/i, '');
  // Living guidelines carry their current version in the citation line.
  const livingVersion = g => /-living$/.test(g.track || '') ? (g.status === 'newer' ? g.latest : g.filed || g.latest) || '' : '';
  function guidelineRows() {
    const list = guidelines.filter(g => inCategory(g, pick.guidelines));
    const cats = [...new Set(list.map(category))].sort((x, y) => order(x) - order(y) || x.localeCompare(y));
    const sorted = c => list.filter(g => category(g) === c).sort((x, y) => String(y.date || '').localeCompare(String(x.date || '')) || topic(x).localeCompare(topic(y)));
    const one = g => row(g.url ? a(g.url, topic(g), 'wl-title') : `<span class="wl-title">${escHtml(topic(g))}</span>`,
      [g.society, g.reference, livingVersion(g) && 'Version ' + livingVersion(g)].filter(Boolean).join(' · '));
    return cats.length ? cats.map(c => `<div class="wl-group">${escHtml(c)}</div>${sorted(c).map(one).join('')}`).join('') : '<p class="wl-empty">No guidelines</p>';
  }
  // PubMed and Congress use the guideline layout, as in the editor: title and one citation line.
  // '2026-09-20' -> '20 Sep 2026'; '2026-09' -> 'Sep 2026'.
  const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function publishedDate(c) {
    const m = /^(\d{4})(?:-(\d{2}))?(?:-(\d{2}))?$/.exec(c.date || '');
    if (!m) return c.published || '';
    return [m[3] ? String(+m[3]) : '', m[2] ? MONTHS[+m[2] - 1] : '', m[1]].filter(Boolean).join(' ');
  }
  // The day PubMed added the paper (its entry date); publication date only for a paper without one.
  const literatureDay = c => c.added || c.date || '';
  const localDay = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  // '2026-10-02' -> 'Today', 'Yesterday' or 'Wed 30 Sep 2026'.
  function dayLabel(day, now = new Date()) {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(day || '');
    if (!m) return day ? publishedDate({date: day}) : 'Undated';
    if (day === localDay(now)) return 'Today';
    if (day === localDay(new Date(now.getFullYear(), now.getMonth(), now.getDate() - 1))) return 'Yesterday';
    const d = new Date(+m[1], +m[2] - 1, +m[3]);
    return `${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()]} ${+m[3]} ${MONTHS[+m[2] - 1]} ${m[1]}`;
  }
  // As in the editor: newest papers first under a header for each day, the rank ordering a day's
  // papers; under All categories each paper's line leads with its tumour group. A congress
  // abstract of the same trial is named at the end of the paper's line.
  function literatureRows() {
    const list = literature.filter(c => inCategory(c, pick.literature))
      .sort((x, y) => literatureDay(y).localeCompare(literatureDay(x)) || (y.score || 0) - (x.score || 0) || String(x.title).localeCompare(String(y.title)));
    if (!list.length) return '<p class="wl-empty">No publications</p>';
    const abstract = c => c.abstract ? [c.abstract.meeting, c.abstract.number].filter(Boolean).join(' ') : '';
    const meta = c => [pick.literature ? '' : categoriesOf(c).join(', '), c.journal, publishedDate(c), c.author, c.design,
      c.secondary ? 'Secondary analysis' : '', abstract(c)].filter(Boolean).join(' · ');
    let html = '', day = null;
    for (const c of list) {
      if (literatureDay(c) !== day) { day = literatureDay(c); html += `<div class="wl-group">${escHtml(dayLabel(day))}</div>`; }
      html += row(a(`https://pubmed.ncbi.nlm.nih.gov/${c.pmid}/`, c.title, 'wl-title'), meta(c));
    }
    return html;
  }
  // Grouped by meeting, newest first; the citation line carries the abstract number and journal,
  // and says LBA when the number (an ASTRO page) does not.
  function congressRows() {
    const list = congress.filter(c => inCategory(c, pick.congress));
    if (!list.length) return '<p class="wl-empty">No abstracts</p>';
    let html = '', meeting = null;
    for (const c of list) {
      if (c.meeting !== meeting) { meeting = c.meeting; html += `<div class="wl-group">${escHtml((meeting || '') + (c.dates ? ' · ' + c.dates : ''))}</div>`; }
      html += row(a(c.url || 'https://doi.org/' + c.doi, c.title, 'wl-title'),
        [c.number, c.journal, c.kind === 'LBA' && /^LBA/i.test(c.number || '') ? '' : c.kind, c.phase3 ? 'Phase 3' : ''].filter(Boolean).join(' · '));
    }
    return html;
  }
  function options() {
    const list = tab === 'guidelines' ? guidelines : tab === 'literature' ? literature : congress;
    const cats = [...new Set(list.flatMap(categoriesOf))].sort((x, y) => order(x) - order(y) || x.localeCompare(y));
    const other = list.some(item => !categoriesOf(item).length);
    return '<option value="">All categories</option>' + cats.map(c => `<option value="${escHtml(c)}">${escHtml(c)}</option>`).join('')
      + (other ? `<option value="${OTHER}">Other</option>` : '');
  }
  function draw() {
    const tabs = [['guidelines', 'Guidelines'], ['literature', 'PubMed'], ['congress', 'Congress']];
    const opts = options();
    box.innerHTML = '<div class="wl-bar"><div class="wl-tabs" role="tablist" aria-label="Watch list">'
      + tabs.map(([key, name]) => `<button type="button" role="tab" class="wl-tab" data-tab="${key}" aria-selected="${key === tab}">${name}</button>`).join('')
      + `</div><select class="wl-select" aria-label="Category">${opts}</select></div>`
      + `<div class="wl-list">${tab === 'guidelines' ? guidelineRows() : tab === 'literature' ? literatureRows() : congressRows()}</div>`;
    const menu = box.querySelector('.wl-select');
    if (![...menu.options].some(o => o.value === pick[tab])) pick[tab] = '';
    menu.value = pick[tab];
  }
  box.addEventListener('click', event => {
    const t = event.target.closest('.wl-tab');
    if (t && t.dataset.tab !== tab) { tab = t.dataset.tab; draw(); }
  });
  box.addEventListener('change', event => {
    if (event.target.classList.contains('wl-select')) { pick[tab] = event.target.value; draw(); }
  });

  function setLanding(on) {
    landing = on;
    ctx.root.classList.toggle('ev-watch', on);
    if (on) { holdTable = true; draw(); } else releaseTable();
    document.dispatchEvent(new CustomEvent('oncos:evidence-render'));
  }
  const empty = target => !target || !Object.keys(target).some(key => target[key]);

  // Everything that asks for trials leaves the landing, after the original handler has run,
  // so its transition records the landing as the page left and Back returns to it.
  const nav = window.oncosView.navigation, open = nav.open;
  // A row asked for from the landing was scrolled to while the landing still hid the
  // table, so that scroll did nothing (a search hit for a trial stayed at the top).
  // Once the table shows, scroll to the requested row again, as a hit from a sheet does.
  const reveal = target => {
    const node = target && target.anchor ? document.getElementById(target.anchor) : ctx.root.querySelector('tr.trial.open');
    if (node && ctx.root.contains(node)) node.scrollIntoView({ block: 'start' });
  };
  nav.open = target => {
    holdTable = empty(target);
    const was = landing, ok = open(target);
    if (ok) { setLanding(empty(target)); if (was && !landing && target && (target.record || target.anchor)) reveal(target); }
    return ok;
  };
  const choose = selectSheet;
  selectSheet = (...args) => { const result = choose(...args); setLanding(false); return result; };
  const all = document.getElementById('showall');
  if (all) { const act = all.onclick; all.onclick = event => { const result = act && act(event); setLanding(false); return result; }; }
  if (ctx.search) ctx.search.addEventListener('input', () => { if (ctx.search.value) setLanding(false); });
  if (typeof window.oncosView.openRecord === 'function') {
    const record = window.oncosView.openRecord;
    window.oncosView.openRecord = (...args) => {
      releaseTable();
      const was = landing, result = record(...args);
      setLanding(false);
      if (was && result) reveal(null);
      return result;
    };
  }
  if (window.oncosView.captureState && window.oncosView.restoreState) {
    const capture = window.oncosView.captureState, restore = window.oncosView.restoreState;
    window.oncosView.captureState = () => { const snap = capture(); snap.value.landing = landing ? tab : false; return snap; };
    window.oncosView.restoreState = snap => {
      holdTable = !!(snap && snap.value && snap.value.landing);
      const ok = restore(snap);
      if (ok) { const w = snap.value.landing; if (['guidelines', 'literature', 'congress'].includes(w)) tab = w; setLanding(!!w); }
      return ok;
    };
  }
  const here = window.oncosLocations && window.oncosLocations.read(location.href);
  setLanding(!!(here && here.valid && here.module === 'evidence' && empty(here.target) && !(location.hash || '').replace('#', '')));
})();

  },
  destroy: function() {

  }
};
</script>
