<style>

  /* --- oncOS Meridian webfonts (shared: _oncos-kit/oncos_fonts.py) --- */
  @font-face{font-family:'Montserrat';font-style:normal;font-weight:700;font-display:swap;src:url(/fonts/Montserrat-normal-700.woff2) format('woff2');}
  @font-face{font-family:'Inter';font-style:normal;font-weight:100 900;font-display:swap;src:url(/fonts/Inter-normal-100_900-v41.woff2) format('woff2');}
  @font-face{font-family:'Inter';font-style:italic;font-weight:100 900;font-display:swap;src:url(/fonts/Inter-italic-100_900-v41.woff2) format('woff2');}

  /* --- oncOS Meridian theme (shared: _oncos-kit/oncos_theme.py) --- */
  :root{
    --m:#0977b0; --teal:var(--m);
    --ink:#131926; --slate:#4d5a6b; --muted:#647184;
    --hair:#e3e7ee; --grid:#edf0f5;
    --accent-soft:color-mix(in oklab, var(--m) 8%, #ffffff);
    --paper:#ffffff; --ground:#f6f7f9; --raised:#ffffff;
    /* Light status text deepened one step (2026-08-08 colour QA): on their soft
       tints the previous values sat just under the 4.5:1 small-text floor
       (success 3.57:1, warning 4.28:1, danger 4.43:1). These measure 4.67 /
       5.60 / 5.39 on the same tints. Dark values already passed (6-8:1). */
    --status-success:#0a7a52; --status-success-soft:#e3f3ec;
    --status-warning:#7d5807; --status-warning-soft:#f7efdb;
    --status-danger:#b0322c; --status-danger-soft:#faeae9;
    /* Info is SLATE, not var(--m) (2026-08-08): under functional teal the
       accent means "actionable", and an informational pill must not look
       clickable. */
    --status-info:#4d5a6b; --status-info-soft:#eef1f4;
    /* --- Standard chip geometry (2026-08-08) — one spec for the suite's chip
       families: Evidence phase, Staging system, Tox grade tags + facet tags,
       Acute urgency. Two finishes only: outline (categorical) and soft fill
       (semantic). Generators consume these tokens; --chip-fs is a var
       reference on purpose so fragmentize's px-normaliser can't rewrite it. */
    --chip-h:20px; --chip-r:999px; --chip-fs:10.5px; --chip-pad:9px;
    /* One typeface, three role names. Retypeset 2026-07-26 (Jonan): Inter
       replaces Newsreader (serif/entities), Schibsted Grotesk (sans/chrome) and
       Spline Sans Mono (figures). The role tokens are KEPT — every module
       declares type through them, so the swap needs no generator edit and the
       roles stay available if a second face is ever reintroduced. Identical
       fallback stacks on purpose: if the webfont fails, the page degrades to
       one system face rather than three mismatched ones. */
    --font-serif:'Inter',-apple-system,'Helvetica Neue',system-ui,sans-serif;
    --font-sans:'Inter',-apple-system,'Helvetica Neue',system-ui,sans-serif;
    --font-mono:'Inter',-apple-system,'Helvetica Neue',system-ui,sans-serif;
    /* --- Type scale (2026-07-26) ---
       The suite carried 21 distinct pixel sizes, ten of them inside the 9-13.5px
       band across ~191 declarations. Under Meridian that was legible design:
       a 12.5px Spline Sans Mono figure and a 12.5px Schibsted label were
       different objects, so near-identical sizes still read as different roles.
       With one face they are imperceptible as meaning and still misalign when
       adjacent. These twelve steps replace them; fragmentize.py maps each view's
       literal px onto the nearest step at or below it, so the scale never
       inflates the UI. Display steps (30/36/46) are single deliberate uses and
       are kept as they were. */
    --t-3xs:9px; --t-2xs:10px; --t-xs:11px; --t-sm:12px; --t-base:13px; --t-md:14px;
    --t-lg:16px; --t-xl:18px; --t-2xl:20px; --t-3xl:22px;
    --t-display:30px; --t-display-lg:36px; --t-wordmark:46px;
    /* --- Weight scale ---
       Measured before this change: 600 used 78x, 700 51x, 500 7x, 400 7x — 129
       of 143 declarations at semibold or bolder, because weight inherited the
       hierarchy job that three typefaces used to do. When most of a page is
       heavy nothing reads as emphasised. Inter here is a continuous wght axis
       (100-900) in a single file, so the intermediate steps cost nothing: no
       extra request, no extra byte. */
    --w-body:400; --w-dense:450; --w-label:500; --w-name:550; --w-strong:600;
    --w-bold:700;
    /* Tracking. One value per role, replacing five near-identical uppercase
       values (.04/.05/.06/.08/.12em) tuned for Schibsted Grotesk's caps.
       Display sizes get NO manual negative tracking: the opsz axis bought with
       the Inter 4.1 build does that compensation inside the font, and stacking
       hand-tuned letter-spacing on top of it double-compensates. */
    --track-caps:.06em; --track-badge:.04em;
    --rule:#d7dde6; --btn-ink:#ffffff;
    --radius:12px; --radius-sm:9px;
    --shadow:0 1px 2px rgba(19,25,38,.05), 0 10px 28px -12px rgba(19,25,38,.14);
    --glass:rgba(255,255,255,.8);
    color-scheme:light;
  }
  :root[data-theme="dark"]{
    --m:#3fbbef; --teal:var(--m);
    --ink:#e8ecf3; --slate:#a3aebe; --muted:#8391a3;
    --hair:#222937; --grid:#1a2130;
    --accent-soft:color-mix(in oklab, var(--m) 13%, #10141c);
    --paper:#10141c; --ground:#0a0d13; --raised:#151b26;
    --status-success:#37c98c; --status-success-soft:#12312a;
    --status-warning:#e5a93e; --status-warning-soft:#32270f;
    --status-danger:#f0716b; --status-danger-soft:#391b19;
    --status-info:#a3aebe; --status-info-soft:#222f3c;
    --rule:#2a3242; --btn-ink:#0a0d13;
    /* Dark raised surfaces were separated from the ground only by the --grid
       border (paper vs ground 1.05:1 — near-invisible). A faint light ring +
       deep ambient shadow gives cards an edge without lightening the ink
       aesthetic (2026-08-08 colour QA; was `none`). The inset top highlight is
       the "machined edge" (beautify #8) — dark surfaces read as objects. */
    --shadow:0 0 0 1px rgba(232,236,243,.05), inset 0 1px 0 rgba(255,255,255,.05),
      0 12px 32px -16px rgba(0,0,0,.6);
    --glass:rgba(13,17,25,.75);
    color-scheme:dark;
  }
  /* --- Tabular figures, suite-wide (Inter retypeset, 2026-07-26) ---
     Spline Sans Mono used to hold every figure, dose, grade, year and stage
     code in column by being monospaced. Inter is proportional, so that job now
     falls to the OpenType `tnum` feature, switched on at the root and inherited
     by everything: Evidence trial tables, Staging stage/category tables, Tox
     grade chips + calculator readouts, Acute grade lists, the hub versionmark.
     font-variant-numeric is an inherited property, but the UA `font` shorthand
     on form controls resets it, so they opt back in explicitly (the Tox CrCl /
     BSA / unit-converter fields). Nothing in the suite sets
     font-feature-settings, so nothing can silently clobber this.
     2026-07-26 UPDATE: the suite moved to the upstream Inter 4.1 build, which
     DOES ship `zero`, so the old note here (slashed zero unavailable) no longer
     holds — see the disambiguation block below. `tnum` is now also listed
     explicitly in font-feature-settings, belt-and-braces: the interaction
     between font-variant-numeric and font-feature-settings is a precedence
     question this codebase must not depend on being remembered correctly, and
     column drift fails silently. Verified by measuring digit advance, not by
     reading the spec. */
  :root{ font-variant-numeric:tabular-nums; }
  input, select, textarea, button{ font-variant-numeric:inherit; }
  /* --- 1 / l / I / 0 disambiguation (Inter 4.1, 2026-07-26) ---
     A drug-and-dose reference must never render a confusable numeral. Inter's
     default `l` and `I` are the same bare vertical stroke and its `0` is
     unslashed, so "Il1" is unreadable at 11-13px. The upstream 4.1 build carries
     the fixes the Google subset strips:
       cv05  l -> tailed l      (GSUB: l -> l.ss02)
       cv08  I -> serifed I     (GSUB: I -> I.1)
       zero  0 -> slashed 0     (GSUB: zero -> zero.slash)
     cv05 and cv08 are unconditional. `zero` is deliberately NOT: it is on for
     figures and codes, and off in running prose, where a slashed zero in a
     sentence reads as a technical annotation rather than a number (Jonan's call,
     2026-07-26). The prose rule below is what turns it off, by re-declaring
     font-feature-settings without it — this property does not accumulate. */
  :root{ font-feature-settings:'tnum' 1,'cv05' 1,'cv08' 1,'zero' 1; }
  /* --- ONE figure treatment, suite-wide: tabular everywhere (2026-07-26) ---
     There is deliberately NO prose/name opt-out. Every digit in the suite is
     tabular and every `0` is slashed, in a table cell, a chip, a dose line, a
     sentence and a trial name alike.

     History, so this is not "fixed" back by someone reading the old rationale:
     an earlier pass the same day carved out `p, .lede, .disc, .note, .foot,
     .sub, blockquote, figcaption, .findings, .evi-block, .desc, .summary-text,
     td.study, td.name, .dname, .study` and switched them to `pnum` with `zero`
     dropped, on the reasoning that tabular padding leaves visible gaps around
     numbers mid-sentence and that a slashed zero belongs on a figure rather
     than inside a NAME. That reasoning is not wrong in isolation. What killed it
     was the composite: the carve-out put TWO digit styles on the same page —
     DESTINY-Breast05 proportional and unslashed in a name cell, the same
     numerals uniform and slashed one column over — and that inconsistency reads
     worse than either treatment applied consistently. Jonan's call on
     2026-07-26 after seeing it: tabular everywhere.

     So trial names DO render DESTINY-Breast05 / RJBC-1501 / ASCENT-04 with a
     slashed zero. That is intended, not a regression.

     The one rule that remains is the form-control opt-in above: the UA `font`
     shorthand resets font-variant-numeric, so inputs/selects/textareas/buttons
     have to inherit it explicitly (the Tox CrCl / BSA / unit-converter fields). */
  /* Reserve the scrollbar gutter suite-wide so layout never reflows when the
     viewport scrollbar appears/disappears. Fixes the masthead + centred-content
     "shake": opening the nav drawer sets body.nav-open{overflow:hidden}, which
     on a classic (space-taking) scrollbar removed 15px and shoved the sticky
     masthead sideways; expanding a <details> card past the viewport added the
     scrollbar and shoved it the other way. `stable` keeps the gutter reserved
     in both states. No-op under overlay scrollbars (trackpad Macs), where there
     is no shift to fix. Doesn't change the scroll container, so the body
     scroll-lock is untouched. One line, fully reversible. */
  /* No native grey tap-highlight overlay (2026-08-08, Jonan on-device): the
     UA painted it over tapped cards/titles regardless of our hover gating.
     Press feedback is ours — the .is-pressed mechanism below. */
  html{ transition:background .18s ease, color .18s ease; scrollbar-gutter:stable;
    -webkit-tap-highlight-color:transparent; }
  body{ background:var(--ground); }
  /* --- Clinical footer contract (2026-08-11) ---
     All live module generators use one of these three legacy hooks. Centre the
     complete footer block within the content viewport at desktop widths, then
     centre its copy. Module CSS still owns vertical spacing and the top rule. */
  footer.disclaimer, footer.disc, .foot{
    box-sizing:border-box; width:100%; max-width:900px;
    margin-inline:auto; text-align:center; text-wrap:balance;
  }
  footer.disclaimer strong, footer.disc strong, .foot strong{
    color:var(--ink); font-weight:var(--w-strong);
  }
  /* Dark depth (beautify #8): a barely-there teal glow bleeding from the top
     of the page — 4% mix, gone by mid-viewport, scrolls away with content.
     Dark only; light's shadow already carries depth. */
  :root[data-theme="dark"] body{
    background:radial-gradient(120% 60% at 50% -10%,
      color-mix(in oklab, var(--m) 4%, transparent), transparent 60%), var(--ground); }
  .sr-only{ position:absolute !important; width:1px !important; height:1px !important;
    padding:0 !important; margin:-1px !important; overflow:hidden !important;
    clip:rect(0,0,0,0) !important; white-space:nowrap !important; border:0 !important; }
  /* --- Touch press system (2026-08-08, Jonan on-device) ---
     CSS :active engages on touch-down, so it lit rows/cards while SCROLLING,
     and the UA's grey tap-highlight painted over titles. Both are replaced:
     the kit script (see toggle_script) adds `.is-pressed` to the nearest
     interactive element only after a ~100ms still press — cancelled the
     moment the finger moves — and flashes it briefly on a quick tap. Modules
     style their own `.is-pressed` surfaces (same tints their :hover uses).
     Feel: highlight lands INSTANTLY on press (transition-duration:0), and
     fades out softly on release (the transition below animates class
     removal). Card-like surfaces also compress a touch. Coarse-pointer
     only; desktop keeps :hover and its own :active. */
  @media (hover: none){
    a, button, summary, tr, .card{
      transition: background-color .22s var(--mo-ease, ease),
                  border-color .22s var(--mo-ease, ease),
                  box-shadow .22s var(--mo-ease, ease),
                  transform .22s var(--mo-ease, ease);
    }
    .is-pressed, .is-pressed > td{ transition-duration: 0s; }
    a.card.is-pressed, .tixcard.is-pressed, summary.is-pressed{
      transform: scale(.985); }
  }
  /* --- Keyboard focus: a visible ring in the module wavelength, only on
     keyboard focus (:focus-visible), suite-wide. Before this the clickable
     nav links, hub cards, drawer controls and details summaries had no visible
     focus state. Inputs keep their own border-colour focus affordance (their
     :focus{outline:none} is more specific, so this doesn't override it). --- */
  :focus-visible{ outline:2px solid var(--m, var(--teal)); outline-offset:2px; border-radius:4px; }
  /* --- Meridian shared chrome (the locked suite header pattern) --- */
  /* Wordmark is Montserrat Bold (self-hosted via oncos_fonts) — the one place
     the suite keeps its original NCIS wordmark face, and the one role the
     2026-07-26 Inter retypeset deliberately did NOT touch; everything else is
     Inter. */
  .wm{ font-family:'Montserrat',var(--font-sans); font-weight:700; letter-spacing:-.03em; }
  /* Solid teal "OS" (monochrome retheme 2026-08-08) — background-image:none
     overrides any module's leftover gradient + background-clip rules. */
  .wm .os{ background-image:none; -webkit-background-clip:initial;
    background-clip:initial; color:#0977b0; }
  :root[data-theme="dark"] .wm .os{ background-image:none; color:#3fbbef; }
  .mhead{ background:var(--glass);
    -webkit-backdrop-filter:blur(14px) saturate(1.3); backdrop-filter:blur(14px) saturate(1.3);
    border-bottom:1px solid var(--hair); }
  @supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
    .mhead{ background:var(--paper); }
  }
  .burger{ border-radius:10px; }
  .barsearch{ border-radius:999px; background:var(--ground); }
  body.nav-open .backdrop{ background:rgba(10,13,19,.35); }
  /* --- Suite switcher: module-to-module navigation, injected at the top of
     every module drawer by the kit script (see toggle_script) — before it, the
     only route between modules was back through the hub. Wavelength dots come
     from the generated .sdot-<module> rules appended below. --- */
  .suite-nav{ padding:2px 0 10px; margin-bottom:8px; border-bottom:1px solid var(--hair); }
  .suite-nav .suite-label{ font-size:var(--t-2xs); font-weight:var(--w-bold); letter-spacing:.08em;
    text-transform:uppercase; color:var(--muted); padding:8px 20px 5px; }
  .suite-link{ display:flex; align-items:center; gap:10px; padding:7px 20px;
    font-size:var(--t-base); color:var(--ink); text-decoration:none; }
  .suite-link:hover{ background:var(--accent-soft); color:var(--m); }
  .suite-link[aria-current="page"]{ color:var(--m); font-weight:600; background:var(--accent-soft); }
  .sdot{ width:8px; height:8px; border-radius:50%; flex:0 0 auto; }
  .sdot-evidence{ background:#0977b0; }
  :root[data-theme="dark"] .sdot-evidence{ background:#3fbbef; }
  .sdot-drugs{ background:#0977b0; }
  :root[data-theme="dark"] .sdot-drugs{ background:#3fbbef; }
  .sdot-staging{ background:#0977b0; }
  :root[data-theme="dark"] .sdot-staging{ background:#3fbbef; }
  .sdot-tox{ background:#0977b0; }
  :root[data-theme="dark"] .sdot-tox{ background:#3fbbef; }
  .sdot-acute{ background:#0977b0; }
  :root[data-theme="dark"] .sdot-acute{ background:#3fbbef; }
  .sdot-notes{ background:#0977b0; }
  :root[data-theme="dark"] .sdot-notes{ background:#3fbbef; }
  .sdot-hub{ background:linear-gradient(135deg,#0977b0,#0977b0,#0977b0,#0977b0,#0977b0,#0977b0); }
  :root[data-theme="dark"] .sdot-hub{ background:linear-gradient(135deg,#3fbbef,#3fbbef,#3fbbef,#3fbbef,#3fbbef,#3fbbef); }

  .theme-toggle{
    display:inline-flex; align-items:center; justify-content:center;
    width:26px; height:26px; padding:0; cursor:pointer; flex:0 0 auto;
    background:transparent; color:var(--muted);
    border:1px solid var(--hair); border-radius:999px;
    transition:color .15s, border-color .15s, background .15s;
  }
  .theme-toggle:hover{ color:var(--m); border-color:var(--m); background:var(--accent-soft); }
  .theme-toggle svg{ width:12px; height:12px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  .theme-toggle .i-sun{ display:none; }
  :root[data-theme="dark"] .theme-toggle .i-moon{ display:none; }
  :root[data-theme="dark"] .theme-toggle .i-sun{ display:block; }
  /* --- oncOS mobile QA (roadmap #4): no side-scroll + no iOS focus-zoom --- */
  /* Touch devices only: iOS Safari zooms the page when a focused control is
     under 16px, so pin form controls to 16px there (desktop sizing untouched). */
  @media (hover:none) and (pointer:coarse){
    input, select, textarea { font-size:16px !important; }
  }
  /* Belt-and-braces: disable horizontal page scroll on phones. `clip` (not
     `hidden`) doesn't create a scroll container, so position:sticky headers
     keep working. */
  @media (max-width:760px){ html, body { overflow-x:clip; } }

  /* ===== oncOS motion layer (shared: _oncos-kit/oncos_motion.py) ===== */
  :root{
    --mo-dur:150ms;
    --mo-ease:cubic-bezier(.3,0,.1,1);
    interpolate-size: allow-keywords;   /* lets block-size:auto animate */
  }

  /* --- Tier 1: native <details> cards grow + fade open --- */
  details::details-content{
    block-size:0; overflow:clip; opacity:0;
    transition:block-size var(--mo-dur) var(--mo-ease),
               opacity var(--mo-dur) var(--mo-ease),
               content-visibility var(--mo-dur) allow-discrete;
  }
  details[open]::details-content{ block-size:auto; opacity:1; }
  /* chevron rotate — harmless where a module has no .chev */
  details > summary .chev{ transition:transform var(--mo-dur) var(--mo-ease); }
  details[open] > summary .chev{ transform:rotate(90deg); }

  /* --- Tier 1: nav backdrop cross-fades with the drawer slide --- */
  /* Modules toggle .backdrop via display (not animatable); pin it displayed and
     drive opacity/visibility instead. Inert on pages with no .backdrop (Hub). */
  .backdrop{
    display:block !important; position:fixed; inset:0; z-index:45;
    background:rgba(15,42,67,.18);
    opacity:0; visibility:hidden; pointer-events:none;
    transition:opacity var(--mo-dur) var(--mo-ease),
               visibility var(--mo-dur) var(--mo-ease);
  }
  body.nav-open .backdrop{ opacity:1; visibility:visible; pointer-events:auto; }

  /* --- Tier 2: theme-toggle sun/moon cross-fade (replaces the display swap) --- */
  .theme-toggle{ position:relative; overflow:hidden; }
  .theme-toggle svg{
    position:absolute; top:50%; left:50%; margin:0;
    transition:opacity var(--mo-dur) var(--mo-ease), transform var(--mo-dur) var(--mo-ease);
  }
  .theme-toggle .i-moon{ display:block !important; opacity:1; transform:translate(-50%,-50%) rotate(0) scale(1); }
  .theme-toggle .i-sun{ display:block !important; opacity:0; transform:translate(-50%,-50%) rotate(-90deg) scale(.6); }
  :root[data-theme="dark"] .theme-toggle .i-moon{ opacity:0; transform:translate(-50%,-50%) rotate(90deg) scale(.6); }
  :root[data-theme="dark"] .theme-toggle .i-sun{ opacity:1; transform:translate(-50%,-50%) rotate(0) scale(1); }

  /* --- Tier 1: press feedback. Pointer-only (2026-08-08): on touch, :active
     engages on touch-down and fired during scroll gestures — the kit's
     .is-pressed mechanism (oncos_theme) owns touch press feedback now. --- */
  @media (prefers-reduced-motion:no-preference) and (hover:hover){
    details > summary:active{ transform:scale(.994); }
    a.card:active{ transform:scale(.99); }
  }

  /* --- Tier 2: opt-in staggered content entrance (Hub grid only) --- */
  @media (prefers-reduced-motion:no-preference){
    .mo-stagger > *{ animation:mo-fadeup var(--mo-dur) var(--mo-ease) both; }
    .mo-stagger > *:nth-child(1){ animation-delay:0ms; }
    .mo-stagger > *:nth-child(2){ animation-delay:45ms; }
    .mo-stagger > *:nth-child(3){ animation-delay:90ms; }
    .mo-stagger > *:nth-child(4){ animation-delay:135ms; }
    .mo-stagger > *:nth-child(5){ animation-delay:180ms; }
    .mo-stagger > *:nth-child(6){ animation-delay:225ms; }
    .mo-stagger > *:nth-child(7){ animation-delay:270ms; }
    .mo-stagger > *:nth-child(n+8){ animation-delay:300ms; }
    @keyframes mo-fadeup{ from{ opacity:0; transform:translateY(7px); } to{ opacity:1; transform:none; } }
  }

  /* --- accessibility: honour the OS reduced-motion setting suite-wide --- */
  @media (prefers-reduced-motion:reduce){
    :root{ --mo-dur:0.001ms; }
    *, *::before, *::after{
      animation-duration:.001ms !important; animation-iteration-count:1 !important;
      transition-duration:.001ms !important; scroll-behavior:auto !important;
    }
    details::details-content{ transition-duration:.001ms !important; }
  }

@property --m { syntax:'<color>'; inherits:true; initial-value:#0977b0; }
@media (prefers-reduced-motion: no-preference){ :root{ transition: --m .35s var(--mo-ease, cubic-bezier(.3,0,.1,1)); } }
html[data-view="evidence"]{ --m:#0977b0; --teal:var(--m); }
html[data-view="evidence"][data-theme="dark"]{ --m:#3fbbef; }
html[data-view="drugs"]{ --m:#0977b0; --teal:var(--m); }
html[data-view="drugs"][data-theme="dark"]{ --m:#3fbbef; }
html[data-view="staging"]{ --m:#0977b0; --teal:var(--m); }
html[data-view="staging"][data-theme="dark"]{ --m:#3fbbef; }
html[data-view="tox"]{ --m:#0977b0; --teal:var(--m); }
html[data-view="tox"][data-theme="dark"]{ --m:#3fbbef; }
html[data-view="acute"]{ --m:#0977b0; --teal:var(--m); }
html[data-view="acute"][data-theme="dark"]{ --m:#3fbbef; }
html[data-view="notes"]{ --m:#0977b0; --teal:var(--m); }
html[data-view="notes"][data-theme="dark"]{ --m:#3fbbef; }

*{box-sizing:border-box;}
html,body{margin:0;}
body{font-family:var(--font-sans);color:var(--ink);background:var(--ground);
  font-size:var(--t-md);line-height:1.5;-webkit-text-size-adjust:100%;}
a{color:var(--teal);}
.mhead{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:14px;
  padding:calc(11px + env(safe-area-inset-top)) calc(24px + env(safe-area-inset-right)) 11px calc(24px + env(safe-area-inset-left));}
.burger{display:flex;flex:0 0 auto;width:36px;height:36px;border:1px solid var(--hair);
  background:var(--paper);color:var(--ink);align-items:center;justify-content:center;cursor:pointer;padding:0;}
.burger svg{width:20px;height:20px;}
.wm{margin:0;font-size:var(--t-3xl);color:var(--ink);line-height:1;text-decoration:none;flex:0 0 auto;}
.hdiv{width:1px;height:22px;background:var(--hair);flex:0 0 auto;}
/* Active-module lockup (oncOS | Evidence): desktop-only — the mobile switcher
   chip already names the module below 880px, and the hub hides the whole
   masthead, so no empty state arises. */
.tag{margin:0;color:var(--muted);font-size:var(--t-xs);font-weight:var(--w-name);letter-spacing:2px;
  text-transform:uppercase;flex:0 0 auto;}
.mhead .hdiv,.mhead .tag{display:none;}
@media (min-width:880px){
  .mhead .hdiv,.mhead .tag{display:block;}
}
/* Suite tabs in the masthead (replaces the drawer suite section). Resets the
   kit's drawer .suite-nav box styling; active tab lights in the current
   wavelength (--m IS the active module's hue by definition). */
.mast-suite{display:flex;align-items:center;gap:2px;margin:0 auto;padding:0;border:0;
  min-width:0;overflow-x:auto;scrollbar-width:none;position:relative;}
/* Sliding active-module indicator (2026-08-08, beautify #2): the tinted pill
   is ONE element that glides to the active tab on module switch — possible
   because the masthead is persistent shell chrome. The router positions it in
   mount(); the aria-current link keeps only its colour. */
.mast-suite .tslider{position:absolute;top:0;left:0;width:36px;height:32px;border-radius:9px;
  background:color-mix(in oklab, var(--m) 11%, transparent);pointer-events:none;opacity:0;
  transition:transform .22s var(--mo-ease, cubic-bezier(.3,0,.1,1)), background .35s;}
.mast-suite .tslider.on{opacity:1;}
@media (prefers-reduced-motion:reduce){ .mast-suite .tslider{transition:background .35s;} }
.mast-suite::-webkit-scrollbar{display:none;}
/* Icon tabs (Jonan 2026-07-18): the masthead carries the module ICONS, no
   text — names live in title/aria-label. Active icon lights in its wavelength
   (--m is the active module's hue by definition). */
.mast-suite .suite-link{display:flex;align-items:center;justify-content:center;
  width:36px;height:32px;border-radius:9px;color:var(--muted);text-decoration:none;
  /* padding:0 is load-bearing: the kit's drawer .suite-link rule bleeds
     padding:7px 20px in here; under border-box that floors the tab at 40px
     while the slider was 36px — the asymmetry Jonan caught on hover. */
  padding:0;}
@media (hover:hover){ .mast-suite .suite-link:hover{color:var(--ink);background:var(--accent-soft);} }
.mast-suite .suite-link.is-pressed{color:var(--ink);background:var(--accent-soft);}
/* background:transparent is load-bearing: the KIT's drawer .suite-link rule
   also matches these masthead tabs and paints accent-soft on the active one —
   without this override the static tint doubles the sliding pill and reads as
   a shadow ghost (Jonan, on-device, 2026-08-08). */
.mast-suite .suite-link[aria-current="page"]{color:var(--m);background:transparent;}
.mast-suite .tico{display:flex;}
.mast-suite .tico svg{width:18px;height:18px;display:block;}
/* True geometric centring where the bar is wide enough that the tabs can
   never collide with the search field; below that they centre in the free
   span (margin:auto), and on mobile they give way to the dropdown.
   940 (was 880, 2026-08-08 adversarial QA): at 885-905px the absolutely
   centred strip overlapped the search field by a few px — measured 5px at
   890. In-flow centring covers the band collision-free. */
@media (min-width:940px){
  .mhead{position:sticky;}
  .mast-suite{position:absolute;left:50%;transform:translateX(-50%);margin:0;}
}
/* Mobile module switcher: single thin masthead row; the active module's icon
   + caret opens a dropdown sheet under the bar. */
.mob-suite{display:none;flex:0 0 auto;align-items:center;gap:3px;height:32px;padding:0 7px;
  border:1px solid var(--hair);border-radius:9px;background:transparent;color:var(--m);cursor:pointer;}
.mob-suite .tico svg{width:18px;height:18px;display:block;}
.mob-suite .caret{width:13px;height:13px;color:var(--muted);transition:transform .15s;}
.mob-suite[aria-expanded="true"] .caret{transform:rotate(180deg);}
.suite-drop{position:fixed;z-index:55;right:12px;top:calc(54px + env(safe-area-inset-top));
  min-width:200px;background:var(--paper);border:1px solid var(--hair);border-radius:12px;
  box-shadow:var(--shadow);padding:6px;display:none;}
.suite-drop .drop-link{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:8px;
  color:var(--ink);text-decoration:none;font-size:var(--t-md);}
.suite-drop .drop-link .tico svg{width:18px;height:18px;display:block;}
/* Stated explicitly, not inherited. A view fragment's CSS is live in this same
 * document while its view is active, and fragmentize scopes it by document
 * state (`[data-view=x] .foo`), not by containment — so an unqualified module
 * rule matches shell chrome too. A chrome class with no rule of its own has
 * nothing to out-specify it. Drugs styles its drug-name headings and used to
 * collide here, rendering these labels at 18px/600. */
.suite-drop .drop-link .drop-name{font-family:inherit;font-size:var(--t-md);font-weight:var(--w-body);
  line-height:1.35;margin:0;}
@media (hover:hover){ .suite-drop .drop-link:hover{background:var(--accent-soft);} }
.suite-drop .drop-link.is-pressed{background:var(--accent-soft);}
.suite-drop .drop-link[aria-current="page"]{color:var(--m);
  background:color-mix(in oklab, var(--m) 10%, transparent);}
@media (prefers-reduced-motion: no-preference){
  .suite-drop{transform-origin:top right;}
  .suite-drop.open{animation:drop-in .16s var(--mo-ease, cubic-bezier(.3,0,.1,1));}
  @keyframes drop-in{from{opacity:0;transform:scale(.96) translateY(-4px);}to{opacity:1;transform:none;}}
}
.suite-drop.open{display:block;}
/* Module scripts keep a non-interactive value holder for their legacy APIs. */
.barsearch{display:none!important;}
.barsearch:focus-visible{outline:none;}
/* Automatic study focus preserves navigation without a persistent selection rim.
   Keyboard interaction restores the kit's visible focus indicator. */
html:not([data-input-modality="keyboard"]) #viewroot .trial-toggle:focus-visible{outline:none;}
.mhead .theme-toggle{flex:0 0 auto;}
/* One suite-wide search surface. */
.global-search-dialog[hidden]{display:none!important;}
.global-search-dialog{position:fixed;inset:0;z-index:100;background:color-mix(in oklab,var(--ink) 42%,transparent);
  padding:max(18px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right))
    max(18px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));display:flex;justify-content:center;}
.global-search-panel{width:min(920px,100%);height:min(820px,100%);display:flex;flex-direction:column;
  background:var(--ground);border:1px solid var(--hair);border-radius:18px;box-shadow:0 20px 70px rgba(0,0,0,.28);overflow:hidden;}
.global-search-head{display:flex;gap:10px;align-items:center;padding:14px;border-bottom:1px solid var(--grid);background:var(--paper);}
.global-search-head input{flex:1 1 auto;min-width:0;height:42px;border:1px solid var(--hair);border-radius:10px;
  background:var(--ground);color:var(--ink);padding:0 13px;font:inherit;}
.global-search-head input:focus{outline:2px solid color-mix(in oklab,var(--m) 45%,transparent);outline-offset:1px;border-color:var(--m);}
.global-search-close{flex:0 0 auto;width:42px;height:42px;border:1px solid var(--hair);border-radius:10px;
  background:var(--paper);color:var(--ink);font:inherit;font-size:var(--t-xl);cursor:pointer;}
.global-search-results{overflow:auto;padding:18px;overscroll-behavior:contain;}
.gs-group{margin:0 0 24px;}
.gs-group h3{margin:0 0 8px;font-size:var(--t-xs);font-weight:var(--w-strong);letter-spacing:.08em;
  text-transform:uppercase;color:var(--muted);}
.gs-result{display:grid;width:100%;gap:3px;text-align:left;padding:12px 14px;border:0;border-top:1px solid var(--grid);
  background:var(--paper);color:var(--ink);font:inherit;cursor:pointer;}
.gs-result:first-of-type{border-radius:12px 12px 0 0;}
.gs-result:last-child{border-radius:0 0 12px 12px;}
@media (hover:hover){.gs-result:hover{background:color-mix(in oklab,var(--m) 6%,var(--paper));}}
.gs-result.is-pressed{background:color-mix(in oklab,var(--m) 6%,var(--paper));}
.gs-title{font-weight:var(--w-name);font-size:var(--t-lg);}
.gs-subtitle{font-size:var(--t-sm);color:var(--muted);}
.gs-preview{font-size:var(--t-base);color:var(--slate);line-height:1.45;}
.gs-empty{padding:42px 16px;text-align:center;color:var(--muted);}
body.global-search-open{overflow:hidden;}
@media (max-width:760px){
  .global-search-dialog{padding:0;}
  .global-search-panel{width:100%;height:100%;border:0;border-radius:0;}
  .global-search-head{padding-top:calc(10px + env(safe-area-inset-top));}
  .global-search-results{padding:14px;}
}
.mhead .global-search-open{margin-left:auto;display:flex;align-items:center;gap:8px;min-height:44px;padding:0 12px;
  border:1px solid var(--hair);border-radius:10px;background:var(--paper);color:var(--ink);font:inherit;cursor:pointer;flex:none;}
.global-search-open svg{width:18px;height:18px;}
.global-search-open-label{font-size:var(--t-sm);}
.global-search-filters{display:flex;gap:6px;flex-wrap:wrap;padding:12px 14px 4px;flex-shrink:0;}
.global-search-filters .gs-filter{min-height:44px;padding:7px 10px;background:var(--paper);border:1px solid var(--hair);border-radius:9px;color:var(--ink);font:inherit;font-size:var(--t-sm);cursor:pointer;}
.global-search-filters .gs-filter[aria-pressed="true"]{border-color:var(--m);color:var(--m);background:var(--accent-soft);}
.global-search-status{padding:4px 18px 0;font-size:var(--t-sm);color:var(--muted);flex-shrink:0;}
.global-search-results .gs-module{font-size:var(--t-xs);font-weight:var(--w-name);color:var(--m);}
.global-search-results .gs-retry{display:block;margin:0 auto 20px;min-height:44px;padding:8px 14px;border:1px solid var(--hair);border-radius:9px;background:var(--paper);color:var(--ink);font:inherit;cursor:pointer;}
.global-search-head input{height:44px;font-size:16px;}
.global-search-close{width:44px;height:44px;}
@media(max-width:760px){
  .mhead .global-search-open{width:44px;justify-content:center;padding:0;}
  .global-search-open-label{display:none;}
}
aside.sidebar{position:fixed;top:0;left:0;z-index:50;background:var(--paper);
  border-right:1px solid var(--hair);height:100vh;height:100dvh;overflow-y:auto;
  width:min(82vw,300px);transform:translateX(-100%);transition:transform .22s ease;
  padding:calc(16px + env(safe-area-inset-top)) 0 calc(20px + env(safe-area-inset-bottom));}
body.nav-open aside.sidebar{transform:translateX(0);}
body.nav-open{overflow:hidden;}
#viewroot{min-height:60vh;}
.view-error{max-width:560px;margin:48px auto;padding:24px;color:var(--ink);}
.view-error h1{font-size:24px;line-height:1.3;}
.view-error p{color:var(--slate);line-height:1.6;}
.view-error button{min-height:44px;padding:10px 16px;border:1px solid var(--hair);border-radius:9px;
  background:var(--paper);color:var(--ink);font:inherit;cursor:pointer;}
/* Drawer padding: evidence/staging nav items carry their own indent; drugs,
   tox and acute relied on their (stripped) module-aside padding — restore it
   at the mount point so content doesn't hug the drawer edges. */
[data-view="drugs"] #viewnav,[data-view="tox"] #viewnav,[data-view="acute"] #viewnav{
  padding:6px 18px 20px;}
/* in-view hash anchors (drugs A–Z) land below the sticky masthead */
:target{scroll-margin-top:72px;}
@media (max-width:760px){
  .mhead{padding-left:15px;padding-right:15px;gap:10px;}
  .mast-suite{display:none;}
  .mob-suite{display:flex;}
}
/* Touch ergonomics: preserve the compact visual chrome while extending its
   real hit areas, and give dense drawer/list controls a full 44px target. */
@media (hover:none) and (pointer:coarse){
  .burger,.mob-suite,.theme-toggle,.mast-suite .suite-link{position:relative;}
  .burger::before,.mob-suite::before,.mast-suite .suite-link::before{
    content:"";position:absolute;inset:-4px;}
  .theme-toggle::before{content:"";position:absolute;inset:-9px;}
  #viewnav a,#viewnav button,#viewnav [role="button"]{min-height:44px;box-sizing:border-box;}
  [data-view="drugs"] .az a,[data-view="drugs"] .az span{width:44px;height:44px;}
  [data-view="drugs"] details.evi summary{min-height:44px;padding-block:8px;box-sizing:border-box;}
}
/* view swap: quiet fade/rise, wavelength slides via the :root --m transition */
@media (prefers-reduced-motion: no-preference){
  #viewroot{transition:opacity .15s var(--mo-ease, cubic-bezier(.3,0,.1,1)),
            transform .15s var(--mo-ease, cubic-bezier(.3,0,.1,1));}
}
#viewroot.leaving{opacity:0;transform:translateY(5px);}
/* loading shimmer between fetch start and mount (usually invisible: cached) */
.viewload{padding:60px 0;text-align:center;color:var(--muted);font-size:var(--t-base);}
/* Chrome hardening: view fragments carry generic element rules
   ([data-view=x] a{color:var(--teal)} etc.) that outrank bare class selectors
   and were tinting the persistent wordmark per module (the original
   "wordmark differs across the suite" bug). Two-class selectors win back. */
.mhead a.wm{color:var(--ink);text-decoration:none;}
.mhead .mast-suite .suite-link{text-decoration:none;}
/* ---- home: the original hub structure inside the shell. The masthead stays
   hidden on this view; module labels use the hub-only Meridian Signal display
   treatment while their accessible text remains normally cased. ---- */
[data-view="hub"] .mhead{display:none;}
[data-view="hub"] .suite-drop{display:none !important;}
[data-view="hub"] .themetoggle-fixed{position:fixed;top:calc(16px + env(safe-area-inset-top));
  right:calc(16px + env(safe-area-inset-right));z-index:5;}
[data-view="hub"] .hub{margin:auto;width:100%;max-width:760px;padding:64px 40px;}
[data-view="hub"] #viewroot{min-height:100vh;min-height:100dvh;display:flex;}
[data-view="hub"] .hero{text-align:center;margin-bottom:44px;}
[data-view="hub"] .hero .wm{margin:0;font-size:var(--t-wordmark);letter-spacing:-1px;color:var(--ink);line-height:1;}
[data-view="hub"] .rule{border:none;border-top:1px solid var(--rule);margin:0 0 32px;}
[data-view="hub"] .list{display:flex;flex-direction:column;gap:12px;}
[data-view="hub"] .card{display:flex;align-items:center;gap:16px;text-decoration:none;color:inherit;
  padding:18px 20px;background:var(--paper);border:1px solid var(--grid);border-radius:14px;
  box-shadow:var(--shadow);transition:background .12s,border-color .15s,transform .15s;}
/* Hover is pointer-only (2026-08-08, Jonan): on touch the tint fired while
   scrolling; :active gives press-to-select feedback instead — browsers
   suppress it during scroll gestures. */
@media (hover:hover){
  [data-view="hub"] .card:hover{background:color-mix(in oklab, var(--cm, var(--teal)) 5%, var(--paper));
    border-color:color-mix(in oklab, var(--cm, var(--teal)) 45%, var(--grid));transform:translateY(-2px);}
  }
[data-view="hub"] .card.is-pressed{background:color-mix(in oklab, var(--cm, var(--teal)) 5%, var(--paper));
  border-color:color-mix(in oklab, var(--cm, var(--teal)) 45%, var(--grid));}
/* Icon tiles in the accent teal (Jonan 2026-08-08, reversing the slate-tile
   call from earlier the same day). */
[data-view="hub"] .ic{flex:0 0 auto;width:38px;height:38px;border-radius:10px;color:var(--cm, var(--teal));
  background:color-mix(in oklab, var(--cm, var(--teal)) 12%, transparent);
  display:flex;align-items:center;justify-content:center;}
[data-view="hub"] .ic svg{width:22px;height:22px;}
[data-view="hub"] .cbody{display:flex;flex-direction:column;gap:5px;flex:1 1 auto;min-width:0;}
[data-view="hub"] .cname{display:flex;align-items:baseline;flex:0 0 auto;min-width:0;
  font-family:var(--font-sans);line-height:1;}
[data-view="hub"] .cinitial,[data-view="hub"] .crest{color:var(--ink);font-size:12px;
  font-weight:600;line-height:1;letter-spacing:.14em;text-transform:uppercase;}
[data-view="hub"] .cinitial{flex:0 0 auto;}
[data-view="hub"] .cgo{flex:0 0 auto;color:var(--cm, var(--teal));font-size:var(--t-xl);opacity:.55;}
[data-view="hub"] .card:hover .cgo{opacity:1;}
[data-view="hub"] .disc{margin-top:40px;text-align:center;color:var(--muted);font-family:var(--font-mono);font-size:var(--t-sm);line-height:1.6;
  border-top:1px solid var(--grid);padding-top:18px;letter-spacing:.3px;}
[data-view="hub"] .versionmark{font-family:var(--font-mono);font-size:var(--t-2xs);letter-spacing:.08em;
  text-transform:uppercase;white-space:nowrap;}
@media (max-width:560px){
  [data-view="hub"] .hub{padding:40px 22px;}
  [data-view="hub"] .hero .wm{font-size:var(--t-display-lg);}
}
@media (prefers-reduced-motion: no-preference){
  [data-view="hub"] .hero .wm{animation:hub-rise .34s var(--mo-ease, cubic-bezier(.3,0,.1,1)) .06s both;}
  @keyframes hub-rise{from{opacity:0;transform:translateY(7px);}to{opacity:1;transform:none;}}
}

[data-view="hub"] .card.m-evidence{--cm:#0977b0;}
html[data-theme="dark"][data-view="hub"] .card.m-evidence{--cm:#3fbbef;}
[data-view="hub"] .card.m-drugs{--cm:#0977b0;}
html[data-theme="dark"][data-view="hub"] .card.m-drugs{--cm:#3fbbef;}
[data-view="hub"] .card.m-staging{--cm:#0977b0;}
html[data-theme="dark"][data-view="hub"] .card.m-staging{--cm:#3fbbef;}
[data-view="hub"] .card.m-tox{--cm:#0977b0;}
html[data-theme="dark"][data-view="hub"] .card.m-tox{--cm:#3fbbef;}
[data-view="hub"] .card.m-acute{--cm:#0977b0;}
html[data-theme="dark"][data-view="hub"] .card.m-acute{--cm:#3fbbef;}

<body>
<header class="mhead">
  <button class="burger" id="burger" type="button" aria-label="Open navigation" aria-expanded="false" aria-controls="sidebar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg></button>
  <a class="wm" href="/" data-nav="hub" aria-label="oncOS home">onc<span class="os">OS</span></a>
  <span class="hdiv" aria-hidden="true"></span>
  <span class="tag" id="mast-mod" aria-hidden="true"></span>

  function captureFrame(address){
    if (!current || (current!=='hub' && (!active || !active.captureState))) return null;
    var href = address || location.href;
    if (pathToView(new URL(href,location.origin).pathname)!==current) {
      href = remembered[current] && remembered[current].url || new URL('/'+current+'/',location.origin).href;
    }
    var frame = {module:current, value:current==='hub'?null:active.captureState(), query:searchEl().value,
      scroll:window.scrollY, url:href};
    var focused = document.activeElement;
    if (focused && focused.id) frame.focus = {id:focused.id};
    else if (focused && focused.matches('a[href]') && viewroot.contains(focused)) {
      var linkHref = focused.getAttribute('href');
      var links = Array.from(viewroot.querySelectorAll('a[href]')).filter(function(node){return node.getAttribute('href')===linkHref;});
      frame.focus = {link:linkHref, index:links.indexOf(focused)};
    }
    else if (focused && focused.matches('input[data-r]') && focused.closest('.calc[data-tid]')) {
      frame.focus = {calc:focused.closest('.calc').dataset.tid,role:focused.dataset.r};
    }
    else if (focused) frame.focus = {content:true};
    remembered[current] = frame;
    return frame;
  }
  function restoreFrame(frame){
    if (!frame || frame.module!==current || (current!=='hub' && (!active || !active.restoreState))) return false;
    applyingLocation++;
    var restored;
    try { restored = current==='hub' || active.restoreState(frame.value); } finally { applyingLocation--; }
    if (!restored) return false;
    searchEl().value = frame.query;
    window.scrollTo(0,frame.scroll);
    updateTitle();
    restoreFocus(frame);
    var owner=active,seq=navSeq;
    setTimeout(function(){if(active===owner&&seq===navSeq)restoreFocus(frame);},0);
    return true;
  }
  function restoreFocus(frame){
    if(!frame.focus || !document.getElementById('global-search-dialog').hidden)return;
    var target=frame.focus.id&&document.getElementById(frame.focus.id);
    if(frame.focus.content)target=entryHeading()||viewroot.querySelector('h1');
    if(!target&&frame.focus.link&&Number.isInteger(frame.focus.index)&&frame.focus.index>=0){
      target=Array.from(viewroot.querySelectorAll('a[href]')).filter(function(node){return node.getAttribute('href')===frame.focus.link;})[frame.focus.index];
    }
    if(!target&&frame.focus.calc){
      var calc=Array.from(viewroot.querySelectorAll('.calc[data-tid]')).find(function(node){return node.dataset.tid===frame.focus.calc;});
      if(calc)target=Array.from(calc.querySelectorAll('input[data-r]')).find(function(node){return node.dataset.r===frame.focus.role;});
    }
    if(target&&target.getBoundingClientRect().width&&target.focus){
      if(!target.matches('button,a,input,select,textarea,summary,[tabindex]'))target.tabIndex=-1;
      target.focus({preventScroll:true});
    }
  }

  function pathToView(p){
    var m = p.match(/^\/(evidence|staging|drugs|tox|acute|notes)(\/|$)/);
    return m ? m[1] : 'hub';
  }
  function searchEl(){ return document.querySelector('.barsearch'); }
  function drawerFocusables(){
    var sb = document.getElementById('sidebar');
    if (!sb) return [];
    return Array.prototype.slice.call(sb.querySelectorAll(
      'a[href],button,input,select,textarea,summary,[tabindex]:not([tabindex="-1"])'
    )).filter(function(el){
      var s = getComputedStyle(el), r = el.getBoundingClientRect();
      return !el.disabled && s.display!=='none' && s.visibility!=='hidden' && r.width && r.height;
    });
  }
  function syncDrawer(){
    var sb = document.getElementById('sidebar');
    var burger = document.getElementById('burger');
    var open = document.body.classList.contains('nav-open');
    if (sb) {
      sb.inert = !open;
      sb.setAttribute('aria-hidden', open ? 'false' : 'true');
    }
    if (burger) {
      burger.setAttribute('aria-expanded', open ? 'true' : 'false');
      burger.setAttribute('aria-label', open ? 'Close navigation' : 'Open navigation');
    }
    if (open && !drawerWasOpen) {
      drawerReturn = document.activeElement;
      setTimeout(function(){
        var fs = drawerFocusables();
        if (fs.length) fs[0].focus();
      }, 0);
    } else if (!open && drawerWasOpen && sb && sb.contains(document.activeElement)) {
      if (drawerReturn && drawerReturn.focus) drawerReturn.focus();
    }
    drawerWasOpen = open;
  }
  function freshChrome(){
    // drop accumulated listeners on shared chrome nodes by clone-replacing
    ['.barsearch','#burger','#backdrop'].forEach(function(sel){
      var el = document.querySelector(sel);
      if (el) el.parentNode.replaceChild(el.cloneNode(true), el);
    });
    var burger = document.getElementById('burger');
    var backdrop = document.getElementById('backdrop');
    if (burger) burger.onclick = function(){ document.body.classList.toggle('nav-open'); };
    if (backdrop) backdrop.onclick = function(){ document.body.classList.remove('nav-open'); };
    syncDrawer();
  }
  function captureOn(){
    var da = document.addEventListener.bind(document), wa = window.addEventListener.bind(window);
    document.addEventListener = function(t,f,o){ capt.push(['d',t,f,o]); da(t,f,o); };
    window.addEventListener = function(t,f,o){ capt.push(['w',t,f,o]); wa(t,f,o); };
    return function(){ document.addEventListener = da; window.addEventListener = wa; };
  }
  function releaseCaptured(){
    capt.forEach(function(c){
      (c[0]==='d'?document:window).removeEventListener(c[1],c[2],c[3]);
    });
    capt = [];
  }
  function fetchView(name){
    if (cache[name]) return Promise.resolve(cache[name]);
    return fetch('/views/'+name+'.html', {credentials:'same-origin'}).then(function(r){
      if (!r.ok) throw new Error(r.status);
      return r.text();
    }).then(function(t){
      var doc = new DOMParser().parseFromString(t, 'text/html');
      var vs = doc.querySelector('script');
      cache[name] = { doc:doc, run:vs ? new Function(vs.textContent) : null };
      return cache[name];
    });
  }
  function syncSuiteChrome(name){
    var v = VIEWS[name];
    document.title = name==='hub' ? 'oncOS' : 'oncOS — ' + (v?v.title:name);
    var mtag = document.getElementById('mast-mod');
    if (mtag) mtag.textContent = name==='hub' ? '' : (v?v.title:name);
    // suite active state — masthead tabs and the mobile dropdown alike
    document.querySelectorAll('.suite-link, .drop-link').forEach(function(a){
      var to = pathToView(new URL(a.href, location.href).pathname);
      if (to === name) a.setAttribute('aria-current','page');
      else a.removeAttribute('aria-current');
    });
    // sliding indicator: glide the tinted pill to the active tab (first
    // placement snaps without animation so boot doesn't play a phantom glide)
    var sl = document.getElementById('tabslider');
    if (sl) {
      var act = document.querySelector('.mast-suite .suite-link[aria-current="page"]');
      if (act) {
        var first = !sl.classList.contains('on');
        if (first) sl.style.transition = 'none';
        sl.style.transform = 'translateX(' + act.offsetLeft + 'px)';
        sl.style.width = act.offsetWidth + 'px';
        sl.style.height = act.offsetHeight + 'px';
        if (first) { void sl.offsetWidth; sl.style.transition = ''; }
        sl.classList.add('on');
      } else {
        sl.classList.remove('on');
      }
    }
    // mobile switcher: show the active module's icon; close the dropdown
    var mob = document.getElementById('mobsuite');
    var drop = document.getElementById('suitedrop');
    if (mob && drop){
      var mico = document.getElementById('mobsuite-ico');
      var srcIco = name!=='hub' && document.querySelector('.mast-suite .suite-link[data-nav="'+name+'"] .tico');
      if (mico) mico.innerHTML = srcIco ? srcIco.innerHTML : '';
      drop.classList.remove('open'); mob.setAttribute('aria-expanded','false');
    }
  }

  function localTransition(owner, action, options){
    if (active !== owner) return;
    if (applyingLocation || transitionDepth) return action();
    var seq = ++navSeq, focusAtStart = focusVersion;
    viewroot.classList.remove('leaving');
    var before = captureFrame(location.href);
    var result;
    transitionDepth++;
    try { result = action(); } finally { transitionDepth--; }
    Promise.resolve().then(function(){focusAtStart=focusVersion;});
    if (!owner.navigation) return result;
    var url = locations.href(current, owner.navigation.read(), location.origin);
    if (url !== location.pathname + location.search + location.hash) {
      if (options && options.replace) history.replaceState({v:current}, '', url);
      else journal.push({v:current}, '', url, before);
    }
    updateTitle();
    if (!options || options.focus !== false) {
      setTimeout(function(){if(seq===navSeq && active===owner && focusVersion===focusAtStart)focusContent();},0);
    }
    return result;
  }

  function focusContent(){
    updateTitle();
    var dialog = document.getElementById('global-search-dialog');
    if (dialog && !dialog.hidden) return;
    var parsed = locations.read(location.href);
    var anchor = parsed.valid && (parsed.target.anchor || (current==='evidence' && parsed.target.record));
    var target = anchor && document.getElementById(anchor);
    if (target && target.matches('tr')) target = target.querySelector('button');
    if (target && target.matches('article')) target = target.querySelector('h2');
    if (!target || !viewroot.contains(target)) target = entryHeading() || viewroot.querySelector('h1');
    if (target) {if(!target.matches('button,a,input,select,summary'))target.tabIndex=-1;target.focus({preventScroll:true});}
  }

  function entryHeading(){
    if(current==='evidence'){
      var evidenceLocation=locations.read(location.href);
      return evidenceLocation.valid&&evidenceLocation.target.record?viewroot.querySelector('.trial-toggle[aria-expanded="true"]'):null;
    }
    if(current==='drugs'){
      var parsed=locations.read(location.href),id=parsed.valid&&parsed.target.record;
      var card=id&&document.getElementById('d-'+id);
      return card&&viewroot.contains(card)?card.querySelector('h2'):null;
    }
    return viewroot.querySelector('.notehead h2,.dvhead h2') || viewroot.querySelector('h2');
  }
  function updateTitle(){
    if(!current || current==='hub' || failedView)return;
    var heading=entryHeading(),label=heading&&heading.textContent.trim();
    if(current==='evidence'&&heading)label=heading.firstChild.textContent.trim();
    var parsed=locations.read(location.href);
    if(!label&&parsed.valid)label=parsed.target.group;
    document.title=label&&label!==VIEWS[current].title?label+' · oncOS '+VIEWS[current].title:'oncOS — '+VIEWS[current].title;
  }

  function showViewError(name, loading){
    if (active && active.destroy) { try { active.destroy(); } catch (_) {} }
    releaseCaptured(); active = null; window.oncosView = null; failedView = true;
    current = name; root.setAttribute('data-view', name); syncSuiteChrome(name);
    viewnav.replaceChildren(); viewroot.replaceChildren(); viewroot.classList.remove('leaving');
    document.body.classList.remove('nav-open');
    var box = document.createElement('section'); box.className = 'view-error';
    var heading = document.createElement('h1'); heading.id = 'view-title';
    heading.textContent = loading ? 'Unable to load this page' : 'Entry unavailable';
    var message = document.createElement('p');
    message.textContent = loading ? 'Check your connection and try again.' : 'This link does not match an entry in the current catalogue.';
    var button = document.createElement('button'); button.type = 'button';
    button.textContent = loading ? 'Try again' : 'Browse ' + ((VIEWS[name] || {}).title || 'oncOS');
    button.onclick = function(){
      if (loading) go(name, false);
      else go(name, true, '', {});
    };
    box.append(heading,message,button); viewroot.appendChild(box);
    viewroot.setAttribute('aria-labelledby','view-title');
    window.scrollTo(0,0);
    heading.tabIndex = -1; heading.focus({preventScroll:true});
  }

  function applyLocation(name, target){
    if (!active) return name==='hub';
    applyingLocation++;
    try {
      if (active.navigation) {
        if (!active.navigation.open(target)) return false;
        var old = new URL(location.href);
        var canonical = new URL(locations.href(name,active.navigation.read(),location.origin),location.origin);
        ['search','searchModule'].forEach(function(key){if(old.searchParams.has(key))canonical.searchParams.set(key,old.searchParams.get(key));});
        history.replaceState(history.state, '', canonical.pathname+canonical.search+canonical.hash);
        focusContent();
        return true;
      }
      if (target.record && active.openRecord) return active.openRecord({module:name,id:target.record,kind:target.kind,section:target.anchor});
      return !Object.keys(target).some(function(key){return target[key];});
    } finally { applyingLocation--; }
  }

  function settleLocation(name, requested, push, sameView){
    var parsed = locations.read(location.href);
    if (!parsed.valid) { showViewError(name,false); return; }
    var historyFrame = !push ? journal.current() : null;
    if (restoreFrame(historyFrame)) return;
    var hasTarget = Object.keys(parsed.target).some(function(key){return parsed.target[key];});
    if (requested !== undefined || hasTarget) {
      if (!applyLocation(name, parsed.target)) showViewError(name,false);
      return;
    }
    var saved = remembered[name];
    if (push && requested === undefined && restoreFrame(saved)) {
      if (saved.url) {
        var url = new URL(saved.url); url.searchParams.delete('search'); url.searchParams.delete('searchModule');
        history.replaceState({v:name}, '', url.pathname+url.search+url.hash);
        updateTitle();
      }
      return;
    }
    // After a reload, older history keys have no in-memory snapshot. A bare
    // route still means the module index, not whichever record is now on screen.
    if (!push && sameView && active && active.navigation) applyLocation(name, {});
    window.scrollTo(0,0);
  }

  function mount(name, prepared){
    // teardown
    if (active && active.destroy) { try{ active.destroy(); }catch(e){} }
    releaseCaptured();
    document.body.classList.remove('nav-open');
    freshChrome();
    active = null; window.oncosView = null;

    // swap
    root.setAttribute('data-view', name);
    var v = VIEWS[name];
    var q = searchEl();
    if (q) { q.value=''; q.id = (v && v.searchId) || 'q'; }
    viewnav.innerHTML = '';
    if (name === 'hub') {
      viewroot.removeAttribute('aria-labelledby');
      viewroot.innerHTML = '';
      viewroot.appendChild(homeTpl.content.cloneNode(true));
    } else {
      var doc = prepared.doc;
      viewroot.innerHTML = '';
      var viewTitle = document.createElement('h1');
      viewTitle.className = 'sr-only'; viewTitle.id = 'view-title';
      viewTitle.textContent = v.title;
      viewroot.appendChild(viewTitle);
      viewroot.setAttribute('aria-labelledby','view-title');
      doc.querySelectorAll('style[data-view-css]').forEach(function(s){
        viewroot.appendChild(document.importNode(s, true));
      });
      var frag = doc.querySelector('.viewfrag');
      if (frag) viewroot.appendChild(document.importNode(frag, true));
      var nav = doc.querySelector('template[data-nav]');
      if (nav) viewnav.appendChild(document.importNode(nav.content, true));
      // execute the view script (compiled once per fetched view)
      if (prepared.run) {
        var restore = captureOn();
        try {
          prepared.run();
          if (window.oncosView && window.oncosView.init) {
            active = window.oncosView;
            var owner = active;
            active.init({root:viewroot, nav:viewnav, search:searchEl(),
              transition:function(action, options){return localTransition(owner,action,options);}});
          }
        } finally { restore(); }
      }
    }
    syncSuiteChrome(name);
    failedView = false;
  }
  // `hash` is carried only for a cross-view deep link (/evidence/#t-<slug>): the
  // pushed URL has to keep it, or mount() has nothing to re-apply and the anchor
  // is lost the moment the router takes over from the browser.
  function go(name, push, hash, requested){
    var seq = ++navSeq;
    var url = requested !== undefined ? locations.href(name,requested,location.origin) :
      (name==='hub' ? '/' : '/'+name+'/') + (hash || '');
    if (name === current && !failedView) {
      viewroot.classList.remove('leaving'); document.body.classList.remove('nav-open');
      var picker=document.getElementById('suitedrop'),pickerButton=document.getElementById('mobsuite');
      if(picker&&picker.classList.contains('open')){
        picker.classList.remove('open');pickerButton.setAttribute('aria-expanded','false');
        if(push&&requested===undefined&&!hash)pickerButton.focus({preventScroll:true});
      }
      // Re-selecting the current module icon leaves its reading state alone.
      if (push && requested === undefined && !hash) {
        // A different module may have pushed its URL while its fetch is pending.
        // Cancelling that request must also put the still-visible location back.
        if (pathToView(location.pathname) !== current) {
          var savedURL = new URL(remembered[current] && remembered[current].url || url,location.origin);
          // Search result activation has already closed its overlay. Returning
          // through a module icon resumes the underlying reading destination.
          savedURL.searchParams.delete('search'); savedURL.searchParams.delete('searchModule');
          history.replaceState({v:current}, '', savedURL.pathname+savedURL.search+savedURL.hash);
        }
        return;
      }
      if (push && url !== location.pathname+location.search+location.hash) history.pushState({v:name}, '', url);
      settleLocation(name,requested,push,true);
      return;
    }
    if (push) history.pushState({v:name}, '', url);
    viewroot.classList.add('leaving');
    var t0 = Date.now();
    var animate = !(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    var fetched = name==='hub' ? Promise.resolve(null) : fetchView(name);
    fetched.then(function(prepared){
      var wait = animate ? Math.max(0,150-(Date.now()-t0)) : 0;
      setTimeout(function(){
        if (seq !== navSeq) return;
        current = name;
        try {
          mount(name,prepared); viewroot.classList.remove('leaving');
          settleLocation(name,requested,push);
        } catch (error) {
          console.error('oncOS view failed:',name,error.message); showViewError(name,true);
        }
      },wait);
    }).catch(function(){ if (seq === navSeq) showViewError(name,true); });
  }

  document.addEventListener('oncos:open-search-result', function(e){
    var record = e.detail;
    var target = locations.fromRecord(record);
    if (!target) return;
    go(record.module,true,'',target);
  });

  // intercept same-origin suite navigation
  document.addEventListener('click', function(e){
    if (e.defaultPrevented || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button!==0) return;
    var a = e.target.closest ? e.target.closest('a') : null;
    if (!a || a.origin !== location.origin) return;
    var to = a.pathname;
    if (/^\/(evidence|staging|drugs|tox|acute|notes)\/?$/.test(to) || to === '/' ) {
      e.preventDefault();
      // The shell records the old reading position before scrolling. Retire
      // legacy hash handlers that scroll before history has captured it.
      if(a.hash)e.stopPropagation();
      var destination = locations.read(a.href);
      if (!destination.valid) {
        history.pushState({v:pathToView(to)}, '', a.href);
        go(pathToView(to), false);
        return;
      }
      var hasTarget = Object.keys(destination.target).some(function(key){return destination.target[key];});
      go(pathToView(to), true, a.hash, hasTarget ? destination.target : undefined);
    }
  }, true);
  window.addEventListener('popstate', function(){
    journal.pop();
    // All seven views now restore their own reading positions, including
    // section/reference and A-Z entries. Native restoration would overwrite
    // snapshots saved before a legacy action changed the rendered page.
    var parsed = locations.read(location.href);
    var evidenceHash = parsed.valid && parsed.module==='evidence' && current==='evidence';
    go(pathToView(location.pathname), false);
    if (evidenceHash) handledEvidenceHash = location.href;
  });
  window.addEventListener('hashchange', function(event){
    var parsed = locations.read(location.href);
    if(current==='drugs'&&parsed.module==='drugs'){
      var destination=parsed.valid&&parsed.target.anchor&&document.getElementById(parsed.target.anchor);
      if(!parsed.valid||(parsed.target.anchor&&(!destination||!viewroot.contains(destination))))showViewError('drugs',false);
      else focusContent();
      return;
    }
    if (current!=='evidence' || parsed.module!=='evidence' || !active || !active.navigation) return;
    event.stopImmediatePropagation();
    if (handledEvidenceHash===location.href) {handledEvidenceHash='';return;}
    if (!parsed.valid || !applyLocation('evidence',parsed.target)) showViewError('evidence',false);
  }, true);
  window.addEventListener('resize', function(){
    var sl = document.getElementById('tabslider');
    var act = document.querySelector('.mast-suite .suite-link[aria-current="page"]');
    if (sl && act) sl.style.transform = 'translateX(' + act.offsetLeft + 'px)';
  });

  // Keep the off-canvas drawer out of the tab order while closed. When open,
  // move focus into it, contain Tab navigation, and return focus on close.
  var drawerObserver = new MutationObserver(syncDrawer);
  drawerObserver.observe(document.body, {attributes:true, attributeFilter:['class']});
  document.addEventListener('keydown', function(e){
    if (!document.body.classList.contains('nav-open')) return;
    if (e.key === 'Escape') {
      e.preventDefault(); document.body.classList.remove('nav-open'); return;
    }
    if (e.key !== 'Tab') return;
    var fs = drawerFocusables();
    if (!fs.length) { e.preventDefault(); return; }
    var first = fs[0], last = fs[fs.length-1];
    if (e.shiftKey && document.activeElement === first) {
      e.preventDefault(); last.focus();
    } else if (!e.shiftKey && document.activeElement === last) {
      e.preventDefault(); first.focus();
    }
  }, true);
  syncDrawer();

  // mobile module dropdown
  (function(){
    var mob = document.getElementById('mobsuite');
    var drop = document.getElementById('suitedrop');
    if (!mob || !drop) return;
    mob.addEventListener('click', function(e){
      e.stopPropagation();
      var open = drop.classList.toggle('open');
      mob.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
    document.addEventListener('click', function(e){
      if (drop.classList.contains('open') && !drop.contains(e.target) && e.target!==mob && !mob.contains(e.target)){
        drop.classList.remove('open'); mob.setAttribute('aria-expanded','false');
      }
    });
    document.addEventListener('keydown', function(e){
      if (e.key==='Escape' && drop.classList.contains('open')){
        drop.classList.remove('open'); mob.setAttribute('aria-expanded','false');
      }
    });
  })();

  // Retire only the five module workers replaced by the root shell. Algorithms
  // remains standalone and is explicitly out of scope for oncOS One.
  if ('serviceWorker' in navigator) {
    var retiredScopes = ['/evidence/','/staging/','/drugs/','/tox/','/acute/'];
    navigator.serviceWorker.getRegistrations().then(function(rs){
      rs.forEach(function(r){
        if (retiredScopes.indexOf(new URL(r.scope).pathname) !== -1) r.unregister();
      });
    });
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('/sw.js').catch(function(){});
    });
  }

  // boot on whatever path we were served at
  go(pathToView(location.pathname), false);
})();

</script>
